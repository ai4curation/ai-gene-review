  summary: 'Create review: CD74'
  details: |
    Created the CD74 review: all 150 GOA annotations reviewed. CD74 is a type II membrane protein that is predominantly intracellular (ER, Golgi/TGN, transport and endocytic vesicles, endosomal MHC class II loading compartments, lysosomal membrane) with a functional minor plasma-membrane pool whose lumenal domain is exposed and serves as the MIF receptor. Two core functions are recorded: MHC class II chaperone/CLIP occupancy with endosomal routing, and cytokine receptor activity for MIF signalling through CD44 and CXCR2/CXCR4. Chemokine-receptor and CD44 protein-binding rows were modified to signaling receptor binding; three uninformative interaction rows were removed; the prostaglandin biosynthesis IDA was modified to the regulatory term; CD4 receptor binding and mouse-transferred NOS2 rows were marked UNDECIDED.
