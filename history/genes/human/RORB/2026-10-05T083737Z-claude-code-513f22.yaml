  details: |
    Reviewed all 50 GOA annotations for human RORB (Q92753): 41 ACCEPT, 6 KEEP_AS_NON_CORE, 3 REMOVE (melatonin receptor activity IBA with propagation_review, the GPCR signaling pathway IEA inferred from it, and generic protein binding IPI). Provider deep research failed (Falcon HTTP 402; Perplexity not configured), so a manual literature synthesis was written to RORB-notes.md from UniProt, cached publications, and PubMed searches. Ten primary papers were cached with just fetch-pmid (PMIDs 9670004, 11689423, 12958591, 16574740, 17303680, 19805139, 21799210, 22189870, 23652001, 33432193). Core functions: nuclear receptor activity with positive regulation of Pol II transcription; rod and cone photoreceptor development; amacrine cell differentiation (isoform 1). Notes record that the Alzheimer link (Leng et al. 2021) treats RORB as a marker of vulnerable entorhinal neurons, with no functional evidence connecting RORB activity to that vulnerability. Validated with just validate human RORB (no errors or warnings).
