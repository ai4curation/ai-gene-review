  summary: AI review of TBC1D24 GO annotations
  details: |
    Reviewed all 27 GOA rows for TBC1D24 (Q9ULP9). Protein binding IPI (ARF6) modified to small GTPase binding. Plasma membrane, presynapse, postsynapse and neuron projection development accepted; peripheral neuronal locations, oxidative stress response, dendrite morphogenesis and neuron migration kept as non-core. Neuromuscular junction (ISS from fly) and positive regulation of EPSP (IEA; effect attributed to synapse number) marked over-annotated. NOT regulation of cilium assembly accepted. Added NEW phosphatidylinositol-4,5-bisphosphate binding (ISS, Skywalker structure PMID:27669036) and regulation of synaptic vesicle recycling (ISS, mouse PMID:30335140 and fly PMID:21458671). No Rab GAP activity asserted: the TBC domain lacks the arginine finger and no purified-protein GAP assay exists for the human protein. V-ATPase regulation direction is contested between PMID:38593795 and PMID:39758816 and was left as a question. Fetched PMIDs 21458671, 27669036, 32004315, 32475639, 38593795, 39758816, 20797691. Validated with just validate (clean) and quote_check (54 verified).
