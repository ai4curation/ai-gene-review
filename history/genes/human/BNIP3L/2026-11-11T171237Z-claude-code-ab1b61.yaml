  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (BNIP3L-phylo.yaml, from `just phylo human BNIP3L`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0043653 (MARK_AS_OVER_ANNOTATED): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree the term sits at the family root while the single seed leaf is 16 steps below it, and that seed is a paralog of BNIP3L joined at a duplication node at 62% identity, so the term was placed far above evidence from the BNIP3 branch only.
    - GO:0005634 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree BNIP3L is itself a seed and the other seeds are 2 paralogs of BNIP3L, all under a duplication node 5 steps below the family root, as the review states. The tree cannot settle whether nuclear envelope staining amounts to activity in the nucleus.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
