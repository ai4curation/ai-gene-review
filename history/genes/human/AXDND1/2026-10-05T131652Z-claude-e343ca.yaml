  summary: 'Reviewer round 1: NEW sperm flagellum assembly; manchette localization corrected to 2-vs-1'
  details: |
    Added NEW GO:0120316 sperm flagellum assembly (IMP, PMID:40457935). The patient axonemes lack the central pair and the SPAG6 and DNALI1 signals, and AXDND1 itself localizes to the flagellum. Comparators checked in QuickGO: CFAP61 (IMP, IBA) and NSUN7 (ISS); the LRGUK review proposes it. The term was added to core function processes. Manchette-localization wording in the GO:1905198 row and the knowledge gap now reflects two positive studies (one in human testis via alpha-tubulin, not manchette-specific) and one negative. Added a reference_review for PMID:31429579.
