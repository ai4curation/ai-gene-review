  summary: PAINT/affinage review of AXDND1
  details: |
    Reviewed all 7 GOA rows. Accepted the cytoplasm rows (IBA, IEA, two IDA) and spermatogenesis (ISS). Kept manchette assembly as non-core: the manchette forms in knockouts but is abnormal, and localization data conflict. Cytosol (HPA) is also non-core. Added NEW sperm flagellum (IDA, PMID:40457935) from human control versus frameshift-patient sperm. Recorded an MF-dark knowledge gap.
