  summary: Review CLDN14 junction assembly and PDZ-binding evidence
  details: |
    Reviewed all 35 original CLDN14 assertions while preserving their evidence, qualifiers, supporting entities and original reference identities. Retained three supported human interaction-screen associations as non-core and refined 20 peptide/PDZ-fragment interactions to PDZ domain binding. Synthesized one structural tight-junction core, retained experimentally observed overexpression localization with its scope, and distinguished mouse Cldn14 from the Cldn2 family donor. Refined the assembly assertion using independent strand-formation evidence while preserving and marking its original PMID:7644498 citation as miscited after the complete original article was inspected. Kept mouse, heterologous-cell and unspecified-transgene evidence distinct from direct human assays. Added no NEW annotations or inferred protein products. Genuine provider attempts failed; manual primary research and independent consultations supplied the review. Preserved existing source-cache bytes and documented selected new caches and external access in notes and the source index.
