  summary: 'Create review: USP36'
  details: |
    De-novo full review of human USP36 (Q9P275) as the experimentally characterized reference relative (same PANTHER subfamily PTHR24006:SF653) for the donkey A0A9L0JCH5 ProtNLM2 benchmark target; independent of ProtNLM2 output. Falcon and perplexity-lite deep research failed (Edison 403), so the review was built from cached primary literature. Reviewed all 41 GOA rows. Accepted the cysteine-type deubiquitinase, histone H2B deubiquitinase, nucleolus and protein deubiquitination/stabilization rows. Modified regulation of rRNA processing and regulation of protein stability to the positive terms, chromatin organization to chromatin remodeling, IBA nucleus to nucleolus, and the FBXW7 and NEDD4L protein-binding rows to ubiquitin protein ligase binding. Removed the DHX33 generic protein-binding rows. Left the mitophagy RNAi screen rows UNDECIDED and marked the IBA apoptosis row as over-annotated. Proposed NEW SUMO ligase activity (PMID:36912080). Added refs PMID:22902402, 29273634, 36912080, 21268071. Noted that yeast Ubp10 and fly scrawny sit in PTHR24006:SF758, not SF653.
