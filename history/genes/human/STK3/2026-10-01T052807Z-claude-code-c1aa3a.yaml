  summary: 'Create review: STK3'
  details: |
    Created a DRAFT review of human STK3/MST2 (Q13188) for Track B of the Origins of Multicellularity project, reviewing all 162 GOA rows (43 ACCEPT, 16 KEEP_AS_NON_CORE, 8 MODIFY, 5 MARK_AS_OVER_ANNOTATED, 1 UNDECIDED, 89 REMOVE, almost all generic protein binding). Self-interaction and identical protein binding rows were modified to protein homodimerization activity, and focused SAV1/RASSF5 SARAH rows to protein heterodimerization activity. Positive regulation of hippo signaling was modified to hippo signaling. Kinase activator activity and transcription regulator activator activity were marked as over-annotations. The InterPro2GO protein tetramerization row (IPR036674 p53-like fold) was marked over-annotated: the SARAH domain dimerizes and the SAV1-MST2 2:2 tetramer is assembled by SAV1 WW domains. Core functions are hippo-cascade Ser/Thr kinase activity, SARAH homodimerization and centrosomal NEK2A phosphorylation. Premetazoan context comes from the Capsaspora coHpo and S. rosetta hippo reviews and PMID:38729842. No deep-research provider was available; notes were written by hand.
