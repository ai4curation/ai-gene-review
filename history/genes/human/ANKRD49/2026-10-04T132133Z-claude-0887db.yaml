  - existing_annotations
  - core_functions
  - references
  - suggested_questions
  - suggested_experiments
  summary: 'Reviewer round 2: coactivator row quotes the PKNOX1 ChIP gain and the PKNOX1-abundance confound; per-row HIF1AN provenance; softened coactivator claims'
  details: |
    The NEW GO:0003713 reason now cites the increased PKNOX1 occupancy in ANKRD49-overexpressing cells, and the confound that ANKRD49 also raises PKNOX1 levels. The limits are restated as abundance versus activity, and the description and core function no longer assert promoter-level coactivation as settled. HIF1AN rows carry per-study provenance (one FIH screen, four AP-MS). Two NSCLC signaling papers are cited, and a SMARCD1 question and a separating experiment were added.
- type: EDIT
  outcome: changed
  sections:
  - description
  - existing_annotations
  - core_functions
  - references
  - suggested_experiments
  summary: 'Reviewer round 3: cite the PKNOX1 reporter result (Fig. 7B) as support for coactivator activity; limit restated as nuclear PKNOX1 abundance'
  details: |
    The round-2 statement that the reporter assays never tested ANKRD49 was wrong; it came from incomplete Methods text. Fig. 7B shows ANKRD49 amplifying PKNOX1-driven TGF-B1 promoter activity with PKNOX1 supplied from a plasmid. That quote now supports GO:0003713. The limit is restated as nuclear PKNOX1 accumulation (Fig. 8E), and the description and core function present ANKRD49 as a PKNOX1 coactivator. PMID:30798416 is cited and the SMARCD1 reason is reworded.
