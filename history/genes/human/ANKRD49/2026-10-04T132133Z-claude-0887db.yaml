  summary: 'Initial review of human ANKRD49 (FGIF): transcription activation accepted;
    NEW coactivator activity; informative binding modifications'
  details: |
    19 GOA rows. Positive regulation of transcription (IDA x2, IBA seeded by ANKRD49 only) and nucleus rows accepted. HIF1AN binding x4 modified to enzyme binding, RAN binding to small GTPase binding (Ran GTPase binding is obsolete); FKBPL x5 and two HuRI rows removed. Added NEW GO:0003713 transcription coactivator activity from the N-terminal acidic TAD and the PKNOX1 interaction.
- type: EDIT
  outcome: changed
  sections:
