  summary: 'IBA over-annotation re-review: cytoplasm IBA changed to KEEP_AS_NON_CORE'
  details: |
    Re-judged the IBA row GO:0005737 cytoplasm against the PTHR42714 PAINT tree. The IBD sits at the family root PTN000182687 (149 leaves) with six seeds. Four are in the child clade that holds human GTPBP3 (PTN005127204): human GTPBP3 itself, yeast MSS1, zebrafish gtpbp3 and Trypanosoma brucei Tb11.03.0660. Two E. coli proteins are in the sister clade PTN001361281. The earlier reason treated the row as a transfer from the bacterial branch only. Mitochondrion is part of cytoplasm in GO, the gene is its own seed through an EXP row this review keeps, and PAINT asserts mitochondrion separately at PTN000746268, so the term is true and general. Action changed from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE, matching the EXP and IEA rows on the same term; summary, reason and propagation_review rewritten. The GO:0030488 tRNA methylation IBA row was re-judged and left as it was. Validated with just validate human GTPBP3.
