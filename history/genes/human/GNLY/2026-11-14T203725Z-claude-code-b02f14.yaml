  summary: 'Create: human GNLY (granulysin) review'
  details: |
    First review of human GNLY (UniProtKB:P22749). 17 GOA rows reviewed; 43 quotes verified verbatim. Chosen to fill the granule-killing module's antimicrobial gap and to answer the perforin-plus-granulysin question left open on the PRF1 and GZMB reviews.

    The notable finding is an absence: granulysin has no molecular function annotation at all. Its only two molecular-function rows are bare protein binding from a two-hybrid interactome map, both removed here under the protein-binding policy. The gap is real rather than an oversight, and I did not fill it by forcing an ill-fitting term. GO:0140911 pore-forming activity is the obvious candidate and is carried by the alpha-defensins, granulysin's functional class - but its definition requires forming transmembrane pores, and Reactome records granulysin's mechanism as electrostatic attraction to the anionic microbial surface followed by amphipathic refolding that disrupts the membrane and lyses by osmotic shock, explicitly not a defined pore. Searching the ontology found no membrane-disruption or antimicrobial-peptide molecular function of any kind. So the review files a proposed_new_terms entry for microbial membrane disrupting activity, parented on molecular_function where GO:0140911 itself sits, and the core function uses proposed_molecular_function with molecular_function left unset - the schema's sanctioned handling for an activity with no term.

    Accepted as core: killing of cells of another organism and defense response to bacterium, both by direct assay. The antimicrobial-humoral-peptide rows are kept as non-core, because granulysin is a 9 or 15 kDa protein rather than a peptide and its best-evidenced route is not humoral: killing intracellular M. tuberculosis requires entry into the host cell and trafficking to the phagosome.

    Two things checked rather than assumed. The phagocytic vesicle lumen location looked anomalous for a T- and NK-cell granule protein; the Reactome events behind it turn out to be granulysin-specific models of the protein reaching an infected macrophage's phagosome, so the location is informative and was accepted. And the cytolytic granule rows carry colocalizes_with rather than located_in, which is correct rather than sloppy: the 9 kDa form is in the perforin-containing granule but the 15 kDa form is secreted from distinct granules that contain neither perforin nor granzyme.

    This gene is also the counterexample that corrected an error elsewhere in this project - see the GZMB history record of the same date.
