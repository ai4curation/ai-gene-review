  summary: 'Create review: KIF2A'
  details: |
    De-novo review of KIF2A: all 72 GOA annotations reviewed, using falcon deep research (succeeded on the second 2400 s rerun) plus cached Miyamoto 2015, Ganem 2004, Watanabe 2015, Trofimova 2018, Vysloužil 2025, Homma 2003 and Noda 1995. Core activity is ATP-dependent microtubule depolymerization. No GO MF exists, so the NTR 'ATP-dependent microtubule depolymerase activity' was proposed and used via proposed_molecular_function. Core functions: depolymerase, mitotic spindle bipolarity at poles, and PLK1-activated cilium disassembly at the mother centriole. The cilium assembly IBA was MODIFIED to cilium disassembly. Motor/transport rows were kept as non-core. Generic protein binding rows were removed. Membrane HDA was marked over-annotated. The module stage-7 role is supported, but KIF2A is pleiotropic (mitosis, neurons). just validate: clean.
