  details: |
    Review all 38 normal-fetch DMRT1 annotations while preserving their source terms, evidence codes, references, qualifiers and supporting entities. Integrate human sequence recognition, full-length DNA-dependent self-association, human testis chromatin occupancy, induced human cis-regulatory reporters and mouse promoter/developmental experiments into one nuclear transcription-factor core. Distinguish activation from repression by target and cell context, developmental maintenance from a mammalian fetal initiating switch, and regulation of meiotic entry from chromosome-segregation machinery. Keep the rat-derived intracellular-signaling assertion unresolved because accessible expression-response evidence does not settle a performing signal-relay step. Verify literal ortholog sources, PAINT inheritance, ARBA conditions and InterPro mappings; preserve the three official predicted products and their unequal sequence scope. Qualify reporter host, construct, dosage and timing rather than treating induced expression as endogenous physiology. No NEW annotation, unverified motif-deletion effect or fabricated provider report is added. Preserve source caches; document incomplete cache bodies and separately recovered originals. Validate normally, check strict terms and computed status, render the gene page and validate this scaffolded history.
