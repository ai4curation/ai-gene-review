  details: |
    Full re-review independent of ProtNLM2 output. Q9P2K1 is the canonical 1620-aa product. Phylogenetic grounding: human/mouse CC2D2A in PTHR20837:SF7, invertebrate orthologs in SF0, PAINT IBD PTN000464650 at Eukaryota. Three Reactome cytosol rows changed to MARK_AS_OVER_ANNOTATED (no evidence of a soluble pool). The other 16 rows are retained (13 ACCEPT, 3 KEEP_AS_NON_CORE) with reasons rewritten. Two NEW location rows added (ciliary basal body IDA from human RPE1 data, PMID:26485645; centriolar subdistal appendage ISS from mouse/macaque immunogold, PMID:24947469). Seven primary papers cached and cited (PMID:21725307, 26485645, 18950740, 21816947, 29281629, 22983010, 21422230). Description rewritten; core functions split into the TZ/MKS module and mother-centriole ciliogenesis. No NEW process or MF terms were added.
