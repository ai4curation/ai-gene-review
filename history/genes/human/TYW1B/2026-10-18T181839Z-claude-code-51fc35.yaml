  summary: 'Create review: TYW1B'
  details: |
    First full review of human TYW1B (Q6NUM6), a TYW1 paralog (95.7% identical) with no experimental functional literature. A reproducible paralog alignment (TYW1B-bioinformatics/compare_paralogs.py, RESULTS.md) shows canonical TYW1B lacks the flavodoxin FMN phosphate-binding loop and two of the three auxiliary [4Fe-4S]-cluster cysteines (TYW1 C381/C394, aligned to the Pyrococcus abyssi ligands), while keeping the radical SAM CX3CX2C triad. Of eight GOA rows: GO:0102521, GO:0031591 (IBA, with propagation_review), GO:0010181 and GO:0008033 are UNDECIDED. GO:0003824 and GO:0051539 are KEEP_AS_NON_CORE. GO:0051536 is changed to GO:0051539. The HuRI protein binding row (TAS2R19) is removed. No core functions are asserted. One BIOLOGY knowledge gap records whether TYW1B is an active enzyme or an impaired copy.
