  summary: De-novo review of all 72 GOA annotations for SLC34A1 (NaPi-IIa), the renal
    apical type-IIa Na-phosphate cotransporter
  details: |
    Reviewed every GOA row for SLC34A1 (Q06495, NaPi-IIa). Core MF GO:0005436 sodium:phosphate symporter activity (3 Na+:1 Pi, electrogenic, KM 0.17 mM) at the apical/brush-border plasma membrane of the proximal tubule; core BP GO:0035435 + GO:0044341 (Na-dependent) + GO:0055062 phosphate ion homeostasis (IDA; NaPi-IIa sets systemic phosphate via renal reabsorption). Support from curated UniProt CC:FUNCTION/CC:SUBCELLULAR LOCATION/CC:SUBUNIT (ECO:0000269) via file: citations. Actions (72 rows, 46 terms): ACCEPT (GO:0005436, GO:0005886, GO:0016324 apical, GO:0031526/GO:0005903 brush border, GO:0035435, GO:0044341, GO:0055062, GO:0030165 PDZ-domain binding to NHERF1/PDZK1 apical scaffold); KEEP_AS_NON_CORE (GO:0006817 broad phosphate transport; GO:0030643 intracellular Pi homeostasis; GO:1901684 arsenate; GO:0098719 Na import; GO:0045838 membrane potential, electrogenic; GO:0005768 endosome + GO:0031982 vesicle + GO:0009986 cell surface trafficking; and the established regulatory responses - PTH GO:0071374/GO:0071107, dietary Pi GO:0016036/GO:0007584, estradiol/GH/thyroid/peptide-hormone, metal-ion responses incl. IDA cadmium/lead/mercury PMID:8898024); MODIFY (GO:0016020 membrane->plasma membrane); REMOVE (bare GO:0005515 protein binding IPI x2, per policy); MARK_AS_OVER_ANNOTATED (self-referential GO:2000120/GO:2000187; weak/wrong-aspect ortholog projections - staurosporine, K+, Mg2+, vitamin A, xenobiotic, dentinogenesis, kidney development, TCA metabolic process, ossification; GO:0042802 identical-protein binding, GO:0044877 complex binding, GO:0048471 perinuclear). The large IEA response cluster is all Ensembl-Compara ortholog projection (GO_REF:0000107). propagation_review on IBA rows (MF/transport node PTN000000493; location node PTN001293650). source_defects: none. Batch 27.
