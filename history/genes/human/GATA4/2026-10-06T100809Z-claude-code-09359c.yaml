  summary: 'Create review: GATA4'
  details: |
    Created full review of human GATA4 (137 GOA annotations). Core functions: Pol II DNA-binding TF activity (GO:0000981) with positive regulation of Pol II transcription, partner-TF binding (GO:0061629; NKX2-5, TBX5, SMAD4, NR5A1) in a Pol II regulator complex, heart development (endocardial cushion, RV morphogenesis, atrial septum, cardiomyocyte proliferation) and male gonad development. Generic protein binding IPIs modified to GO:0061629 or GO:0001221 (FOG2, BRD4/GLYR1/SMARCC1); response-to/tissue-repair rodent IEAs marked over-annotated; cell-cell signaling and the SNP-association-based response to xenobiotic stimulus removed. Automated deep research unavailable; notes compiled manually from cached literature.
