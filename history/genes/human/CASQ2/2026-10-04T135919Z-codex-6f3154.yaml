  summary: Review CASQ2 calcium storage and release-complex regulation
  details: Reviewed all 57 original CASQ2 annotations with exact qualifiers, donor/partner identities
    and two product records preserved. Retained 37 ACCEPT, 8 KEEP_AS_NON_CORE and 12 UNDECIDED decisions,
    one calcium-sequestering/release-regulation core and no NEW annotations. The 23 reference assessments
    distinguish primary human constructs, model systems, abstract-only access, uninspected donor-node
    evidence and variant-dependent inheritance. Three supplementary normal publications support bounded
    human CASQ2/RyR2 association and CPVT inheritance interpretation; no universal heterozygous mechanism
    is inferred. Two generic-binding advisories follow the standing project retention policy; one propagation
    advisory remains because the node was not inspected. DRAFT records unresolved biological and source
    questions. Normal validation, status, rendering and history checks are recorded separately. Immutable
    source bytes and three auxiliary caches are protected; the auxiliary caches are excluded from publication.
