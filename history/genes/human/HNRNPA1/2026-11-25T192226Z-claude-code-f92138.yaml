  summary: 'Create review: HNRNPA1'
  details: |
    Created the HNRNPA1 (P09651) gene review for the stress granule project. Adjudicated all 107 seeded GOA rows (61 ACCEPT, 30 REMOVE of bare GO:0005515 under the protein-binding policy, 7 KEEP_AS_NON_CORE, 5 MODIFY, 2 MARK_AS_OVER_ANNOTATED, 2 UNDECIDED) and proposed six annotations: GO:0010494 cytoplasmic stress granule, GO:0140693 molecular condensate scaffold activity, GO:0097157 pre-mRNA intronic binding, GO:0070878 primary miRNA binding, GO:0031053 primary miRNA processing and GO:0045947 negative regulation of translational initiation. Each proposal was preceded by a QuickGO comparator check run by term id and confirmed able to return positives; the same check argued against proposing GO:0034063 stress granule assembly, which GO gives to nucleators and to no prion-like-domain client RBP, so that is recorded as a suggested question and a knowledge gap instead. Refined the generic nuclear-export row to RNA export from nucleus while marking the import row from the same M9 paper over-annotated (hnRNP A1 is the cargo there); kept the positive and negative telomerase rows as one bidirectional in vitro mechanism; laterally modified GO:0035198 miRNA binding to the sibling GO:0070883 pre-miRNA binding. Left the two GO:0019904 rows UNDECIDED with SUSPECTED/CHECK WRONG_GENE_PRODUCT source defects naming RBMX as a candidate, because both cited papers are abstract-only and concern the hnRNP G family. No deep-research provider credentials were available, so HNRNPA1-notes.md records my own reading of the cached literature with inline provenance and states that explicitly. Validated with just validate human HNRNPA1 (valid, no warnings) and quote_check (52 quotes verified, 0 failed); ran backfill-record-sections for the UniProt quotes and reverted the incidental cache/go/terms.csv change.
