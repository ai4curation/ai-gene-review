  summary: 'Create review: MYH2'
  details: |
    De-novo review of human MYH2 (fast type IIa skeletal myosin heavy chain) from openscientist deep research and cached literature. All 27 GOA rows reviewed: ACCEPT 8, MODIFY 14, REMOVE 4, TOO_GENERAL 1, plus NEW structural constituent of muscle (GO:0008307). Choices kept consistent with the MYH7 review: general locations to striated muscle myosin thick filament (GO:0005863), myosin complex terms to muscle myosin complex (GO:0005859), muscle contraction to fast-twitch skeletal muscle fiber contraction (GO:0031443). Removed: cell-cell junction (PMID:25753039 is endothelial non-muscle myosin IIA, a MYH9 name collision), two Reactome cytosol rows (non-muscle myosin II phagocytosis events), and generic protein binding (HGAL). Disease phenotypes were not converted into developmental process terms. Validated with just validate.
