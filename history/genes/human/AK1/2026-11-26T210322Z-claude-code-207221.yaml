  summary: First review of human AK1 (P00568) with variant-on-structure analysis for
    adenylate kinase deficiency
  details: |
    Reviewed all 29 GOA rows: AMP kinase activity, ADP biosynthesis, nucleotide interconversion and cytosol accepted as core; dAMP kinase, ATP binding, sperm flagellum, outer dense fiber and exosome rows kept as non-core; nucleoside diphosphate kinase (IDA, IEA) marked over-annotated, following the CMPK1 review of the same paper; the two parent kinase terms marked too general. No NEW rows. Recorded the AK1beta isoform (Q5T9B7, NP_001305051.1) as a functional isoform with a MISSING_ISOFORM source defect for UniProt. Added AK1-bioinformatics: every reported disease allele recomputed on NM_000476.3 (numbering identical to P00568), placed on PDB 1Z83/2C95 and compared with the deposited variant structures 8X1G (R97W) and 7DE3 (R128W), with conservation, AlphaMissense and gnomAD v4 data. Conclusion: recessive loss of function in three classes (truncation, nucleotide-site substitution, buried destabilising substitution); no evidence for gain of function or dominant-negative action. Two BIOLOGY knowledge gaps: how AK1 loss causes haemolysis and whether it suffices (PMID:6308059, PMID:1646049 versus PMID:17662886), and the origin of the psychomotor impairment in some families. Deep research: falcon and perplexity are not configured here; the Asta retrieval is irrelevant and unused; an OpenScientist deep-research run hit the 2 h limit with no report; an OpenScientist hypothesis job on the sufficiency question was launched. No GO-CAM contains AK1. Most primary papers are abstract-only in the cache.
