  details: |
    Created the human UNC119 review for the PTHR12951 family pass. Reviewed 78 GOA rows, accepted the lipid-cargo carrier, Src-family kinase regulation and cytokinesis/localization rows, replaced informative Src-family and small-GTPase interaction rows for generic protein binding, removed uninformative high-throughput protein-binding rows, and kept the mouse-derived endocytosis rows as peripheral with support from the direct Unc119 dynamin/endocytosis paper. Added notes documenting the UNC119A versus UNC119B split and why the existing primary-cilium module remains UNC119B-specific. Validated with just validate human UNC119 and validate-quotes.
