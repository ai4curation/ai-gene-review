  summary: Review CLCN4 chloride-proton exchange and partner-dependent localization
  details: |
    Reviewed all 37 CLCN4 source annotations with both products and 15 original reference identities preserved. Refined historical channel and broad antiporter terms to chloride:proton antiporter activity using original voltage-clamp/proton-flux evidence, without denying earlier positive currents or treating the rough 2005 coupling estimate as a precise stoichiometry. Distinguished human ClC-4 constructs, mouse ClC-3 and TMEM9 partners, expression-dependent ER/endosomal localization, short-product assay limits and voltage/pH-dependent disease variants. Retained the positive ABHD5 interaction as non-core at assay scope. Added no new annotation or downstream trafficking process. ROOT read the complete authored draft, notes and compact evidence index, independently inspected 78 selected primary paragraphs, selected indexed 2006 Results and Methods, the full four-page 2005 article text and journal-page425 figure pixels. A whole independent peer checked source joins, propagation and reaction scope, product and reference preservation, access claims and quotation limits. The short primary quote totals six words. Normal validation, status, rendering and genuine history checks pass with one explained generic-binding advisory. Existing source caches and unrelated publisher edits are preserved; completion awaits approved merge.
