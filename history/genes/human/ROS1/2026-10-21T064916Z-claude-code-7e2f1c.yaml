  summary: 'Create review: ROS1'
  details: |
    Created the full AI gene review for human ROS1 (P08922), reviewing all 28 GOA annotations. Confirmed single-pass type I plasma membrane localization with the large fibronectin-repeat ectodomain surface-exposed, modified the generic membrane row to plasma membrane, and noted in the review that the oncogenic ROS1 fusion proteins lose this anchoring. Defined one core function: a NELL2-activated receptor tyrosine kinase that autophosphorylates and phosphorylates PTPN11 and VAV3, engaging PI3K-mTOR, ERK and STAT3 signalling and driving regionalized epididymal epithelial differentiation. Protein phosphatase binding was accepted as the informative interaction while the three generic protein binding rows were removed under the project policy; generic protein kinase activity was modified to the tyrosine-specific terms, regulation of intracellular signal transduction marked TOO_GENERAL, and spermatogenesis and epithelial development kept as non-core tissue outputs. Deep research providers were unavailable; evidence came from cached publications and UniProt and is recorded in ROS1-notes.md.
