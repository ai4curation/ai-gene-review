  summary: 'Create: MYH3 gene review'
  details: |
    New review of human MYH3 (embryonic skeletal muscle myosin heavy chain, P11055).
    Fetched gene data (34 GOA annotations), ran openscientist deep research (completed),
    cached 16 additional primary papers (recombinant human embryonic myosin kinetics and
    motility, patient muscle mechanics, mouse Myh3 knockouts, Ozz-E3 thick-filament study,
    disease genetics) and wrote MYH3-notes.md.
    All 34 GOA rows reviewed: 11 ACCEPT, 18 MODIFY, 5 MARK_AS_OVER_ANNOTATED, plus 1 NEW
    (GO:0008307 structural constituent of muscle, ISO; comparator check against MYH8, MYH11,
    unc-54 and Drosophila Mhc in QuickGO). Choices follow MYH7 where the biology is the same:
    locations refined to striated muscle myosin thick filament (GO:0005863), complexes to
    muscle myosin complex (GO:0005859), cytoskeletal motor activity to microfilament motor
    activity. Myosin phosphatase activity (Reactome) changed to ATP hydrolysis activity;
    calmodulin binding changed to myosin light chain binding; muscle organ development
    refined to skeletal muscle organ development (non-core, supported by mouse knockouts).
    Limb and face morphogenesis (IC from contracture phenotypes), sarcomere organization
    (NAS), ATP metabolic process and urinary exosome (HDA) marked over-annotated.
    Core functions: microfilament motor activity, actin filament binding, structural
    constituent of muscle. `just validate human MYH3` passes.
