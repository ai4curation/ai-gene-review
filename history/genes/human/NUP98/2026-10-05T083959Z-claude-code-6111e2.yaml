  details: |
    Created full AI review of human NUP98 (P52948). Provider deep research failed (Falcon HTTP 402 Payment Required; Perplexity not configured), so a manual literature synthesis from the UniProt record and cached publications was written to NUP98-notes.md with verbatim provenance. Reviewed all 176 GOA annotations (80 ACCEPT, 57 MARK_AS_OVER_ANNOTATED mostly Reactome cytosol TAS, 25 REMOVE mostly uninformative protein binding plus rat-derived protein carrier/peptide binding IEAs, 11 KEEP_AS_NON_CORE, 3 MODIFY: DHX9 IPI to ATPase activator activity and nuclear inclusion body to nuclear body) and added 2 NEW (mRNA export from nucleus; protein autoprocessing). Added functional_isoforms for the Nup98 (PRO_0000019929) and Nup96 (PRO_0000019930) autoproteolytic cleavage products, four core functions (FG-repeat permeability barrier/structural constituent of nuclear pore in nucleocytoplasmic transport and protein import; mRNA export; Nup96 scaffold in NPC assembly; DHX9 cofactor), suggested questions and experiments. Validated with just validate human NUP98.
