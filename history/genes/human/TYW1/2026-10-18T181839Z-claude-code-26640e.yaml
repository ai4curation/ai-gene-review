  summary: 'Create review: TYW1'
  details: 'First full review of human TYW1 (Q9NV66), the radical SAM flavoenzyme
    for the second step of wybutosine synthesis (m1G37 + pyruvate to imG-14 on tRNA-Phe),
    done with its paralog TYW1B for the RADICAL_SAM project. Seven GOA rows were reviewed.
    GO:0102521, GO:0031591 (IBA), GO:0051539 and GO:0010181 were accepted as core.
    GO:0003824 was changed to GO:0102521, GO:0051536 to GO:0051539, and GO:0008033
    to GO:0031591, following the project''s generic-row rule. GO:0005737 cytoplasm
    was added as NEW from human immunostaining (PMID:38706838). That study also shows
    TYW1-knockout hESCs lack OHyW, which grounds the orthology-based activity in human
    data. Primary enzymology papers (yeast, archaeal, Bandarian lab) were cached.
    Core functions are GO:0102521, GO:0051539, GO:1904047 and GO:0010181.

    Added a NEW GO:1904047 S-adenosyl-L-methionine binding row (ISS, PMID:36326713)
    for consistency with the other RADICAL_SAM Phase 1 reviews.

    '
