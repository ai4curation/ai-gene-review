  summary: Initial review of CAMK2D annotations
  details: |
    Reviewed all 107 GOA rows for CaMKII delta. Accepted CaM-dependent kinase activity, holoenzyme membership, cytoplasm/cytosol, SR membrane and the cardiac SR calcium release, RyR2 regulation, contraction and relaxation terms. Refined generic kinase, ER membrane, sodium channel inhibitor, contraction/relaxation/depolarization execution terms and HDAC4 localization to regulatory or specific terms; marked LTP, cell growth, electrical coupling and heart-rate-by-conduction rows as over-annotations; removed uninformative high-throughput protein-binding rows and mapped paralog-subunit binding to protein serine/threonine kinase binding. Literature search recorded in CAMK2D-notes.md.
