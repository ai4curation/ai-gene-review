  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (CXCR3-phylo.yaml, from `just phylo human CXCR3`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0016493 (REMOVE): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the term sits at a duplication node with 525 leaves and 43 subfamilies, and the other seeds are 18 paralogs of CXCR3, none sharing its own branch below the node. CXCR3 is itself a seed, so the removal depends on the review's rejection of its own annotation, which the tree cannot settle.
    - GO:0019957 (REMOVE): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree the term sits at a duplication node with 525 leaves and 43 subfamilies, and the seeds are 11 paralogs of CXCR3, none of which shares CXCR3's own branch below the node. The evidence therefore comes only from other receptor branches, as the review argues.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
