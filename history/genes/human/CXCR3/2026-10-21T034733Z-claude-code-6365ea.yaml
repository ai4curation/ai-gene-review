  summary: 'Full re-review of human CXCR3: remove inherited C-C chemokine rows, resolve
    all UNDECIDED rows'
  details: |
    Full re-review of all 53 existing annotations, independent of any prediction output, using the cached literature, the reviewed UniProt record P49682 and PANTHER/PAINT evidence.

    Main change: the inherited C-C chemokine claims do not hold for human CXCR3. The IBA rows for GO:0016493 (C-C chemokine receptor activity) and GO:0019957 (C-C chemokine binding) come from PAINT node PANTHER:PTN001628461, a deep node in PTHR10489 whose descendants include both the CCR branches and the CXCR branches. Human CXCR3 (PTHR10489:SF671) is inside that clade, so the IBA follows mechanically, but ligand class diverged within it: the original cloning paper reports no response to ten CC chemokines (PMID:9064356), the Lasagni competition panel found no CC chemokine competing for CXCL10 binding on CXCR3-B (PMID:12782716, full text read), and human CCL21, the one CC chemokine proposed as a CXCR3 agonist, is not a ligand for human CXCR3 (PMID:10201891; curated as a UniProt CAUTION). Both IBA rows are REMOVE with propagation_review root_cause PROPAGATION_BAD / FUNCTIONAL_DIVERGENCE. The IDA row for GO:0016493 citing the same Lasagni paper, recorded in GO-CAM 5fce9b7300001616, is MODIFY to GO:0016494 C-X-C chemokine receptor activity; that GO-CAM activity node should be retyped.

    Other changes: all previously UNDECIDED rows resolved; the seven bare GO:0005515 rows made policy-compliant (CXCR4 heteromer row MODIFY to GO:0001664, HuRI and GPCR-RAMP screen rows REMOVE as uninformative); GO:0005737 cytoplasm and GO:0045944 transcription marked over-annotated; GO:0007155 cell adhesion MODIFY to GO:0030155 and GO:0002685 regulation of leukocyte migration MODIFY to GO:0010818, both on participation-versus-regulation grounds; nine generic terms MODIFY to specific descendants the gene already carries; calcium rows split between ACCEPT (GO:0007204) and non-core (GO:0019722, since CXCL13 drives CXCR3-dependent chemotaxis without a calcium flux); isoform-2 angiostatic rows kept non-core. Description rewritten as a project-independent summary; one core function recorded; reference_review added to every reference; PMID:16847335, PMID:18174362, PMID:10201891 and the UniProt file added as cited sources.

    Deep research: falcon and the perplexity-lite fallback both timed out at 600 s, so no new deep-research file exists; the review rests on primary literature read directly, as recorded in the notes file.

    Follow-up: mouse Cxcr3 (UniProtKB:O88410), the 1:1 ortholog in the same PANTHER subfamily, has no review in the repo and is the natural next target.
