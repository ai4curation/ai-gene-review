  summary: 'Create review: EPHB4'
  details: |
    Reviewed all 76 seeded GOA annotations for EPHB4 (P54760); provenance notes are in EPHB4-notes.md because deep-research providers were unavailable. Localization conclusion is plasma membrane with the ligand-binding ectodomain extracellular and antibody-accessible, so all 36 plasma-membrane rows including 31 Reactome reactions were accepted and the generic membrane row refined; the Reactome extracellular-region and cytosol rows were kept as non-core since they describe the MMP-shed ectodomain and the gamma-secretase-released intracellular fragment. Of ten bare protein-binding rows, the six ephrin-B2 rows were modified to ephrin receptor activity and the EPO, RASA1 and three EphA receptor rows were removed as uninformative without disputing the interactions. Protein kinase activity and protein tyrosine kinase activity were marked TOO_GENERAL beside the accepted receptor tyrosine kinase term; angiogenesis, sprouting migration, ephrin receptor activity and signalling rows were accepted; mouse-derived heart morphogenesis rows were kept as non-core. Two core functions were recorded.
