  details: |
    Reviewed all 77 GOA annotations for NEDD9/HEF1 (17 ACCEPT, 31 KEEP_AS_NON_CORE, 22 REMOVE, 5 MODIFY, 1 UNDECIDED, 1 MARK_AS_OVER_ANNOTATED) and added one NEW MF annotation (GO:0043539 protein serine/threonine kinase activator activity, IDA PMID:16184168, in vitro activation of Aurora A by the HEF1 1-363 fragment). Core functions: Cas-family protein-macromolecule adaptor in integrin signalling and migration at focal adhesions (dominant), and Aurora A activation at the ciliary basal body driving cilium disassembly (real but non-dominant, consistent with module stage 7). Generic protein binding IPIs removed except where the paper supports a specific term (tyrosine kinase binding for FYN/ABL1, phosphatase binding for SHP-2, adaptor activity for the NEDD9-AURKA-CTTN scaffold); actin bundle assembly NAS marked over-annotated; ortholog-derived negative regulation of migration left undecided. HPA shows no basal-body call for NEDD9 (cytosol/nucleoplasm only), noted in NEDD9-notes.md. Falcon deep research succeeded on rerun. just validate human NEDD9 passes with no errors or warnings.
