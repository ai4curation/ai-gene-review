  summary: 'Create review: CYP4F3 (leukotriene B4 / PUFA omega-hydroxylase, two-isoform gene)'
  details: 'De-novo review of all 44 GOA rows. Actions: 22 ACCEPT, 12 TOO_GENERAL, 6 MODIFY, 4 KEEP_AS_NON_CORE.
    Key decisions: (1) GO:0052869 ''arachidonate omega-hydroxylase activity'' carries four EXP rows but
    is OBSOLETE, with QuickGO replaced_by GO:0102033 and the per-substrate obsoletion comment -- MODIFY
    onto GO:0102033, which the gene already carries. (2) GO:0097265 is a defective term: its definition
    formula is an O2-consuming omega-hydroxylation (xref RHEA:48656, product 5,20-dihydroxy-eicosatetraenoate)
    while its name says dehydrogenase, its definition glosses the product as 5-oxo-ETE, and its is_a path
    runs through GO:0016616 (CH-OH donors, NAD/NADP acceptor); the reaction is right for CYP4F3 (PMID:9675028
    shows 5-HETE omega-hydroxylation) so MODIFY to GO:0102033 and raise the term defect as a question.
    (3) The vitamin K IBAs (GO:0042361, GO:0042376) are KEEP_AS_NON_CORE, not REMOVE: full text of PMID:24138531
    shows it assayed CYP4F2 and CYP4F11 only and never tested CYP4F3, so the PAINT node is not contradicted,
    but there is no paralog-specific evidence. (4) No omega-1 hydroxylase annotation proposed, because
    PMID:18577768 assigns the omega-1 route to CYP1A1/CYP2C19/CYP2E1 rather than the CYP4F enzymes, despite
    UniProt''s gloss. Two proposed_new_terms for steps 2 and 3 of fatty acid omega-oxidation, matching
    SSSOM batch 8 of the RHEA project and now backed by CYP4F3-specific evidence (PMID:18182499 names
    CYP4F3A and CYP4F3B). functional_isoforms records the CYP4F3A/CYP4F3B substrate switch. Also flagged
    a UniProt mis-citation: its CYP4F3B 3-hydroxy fatty acid claim cites PMID:18065749, which reports
    CYP4F3b as having negligible activity. Validation: schema+terms valid, 89 reference snippets verbatim,
    0 issues.

    '
