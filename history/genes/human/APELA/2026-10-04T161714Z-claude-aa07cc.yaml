  summary: 'Initial review of human APELA (ELABELA): APLNR agonist hormone; ISS from
    the receptor removed, developmental ISS rows kept as non-core'
  details: |
    34 GOA rows. Hormone activity, apelin receptor binding and signaling, extracellular region and heart development accepted. GPCR signaling (cryo-EM IDA) modified to apelin receptor signaling pathway. Adult heart development (ISS) removed because its similarity source is mouse Aplnr (Q9WV08), the receptor rather than an APELA homolog. Zebrafish gastrulation/endoderm, mouse vascular and placental, rat contractility and ERK, and human angiogenesis/trophoblast/internalization rows kept as non-core.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  - core_functions
  - references
  - suggested_questions
  summary: 'Address PR #4156 review: per-row mouse ISS adjudication, propagation_review on all ISS rows, coronary paper'
  details: |
    Coronary vasculature development now cites PMID:28890073. GO:1903589 is MARK_AS_OVER_ANNOTATED because the donor paper reports a migration, not proliferation, defect. Vasculogenesis and embryonic heart tube development are adjudicated on their own evidence. All 17 ISS rows carry propagation_review, sourced from QuickGO donor annotations; the Q9WV08 (mouse Aplnr) row is PROPAGATION_BAD, and its fact is now quoted from APELA-goa.tsv. Core functions merged into one hormone-activity entry. The MODIFY row quote was strengthened. Added suggested questions on ELA processing and the reported RNA-level role.
