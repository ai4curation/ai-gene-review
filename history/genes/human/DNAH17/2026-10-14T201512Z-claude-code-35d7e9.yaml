  summary: 'Create: DNAH17 gene review'
  details: |
    Reviewed all 28 GOA annotations for DNAH17 (beta-type sperm outer dynein arm heavy chain) and added one NEW annotation (flagellated sperm motility). Falcon deep research failed with an Edison API authentication error, so literature was gathered directly from PubMed and cached with just fetch-pmid (human MMAF cohorts, Dnah17 knockout mouse and rat, pig splice model, sperm proteomics). Removed dynein light intermediate chain binding (IBA/IEA); modified generic dynein complex (IBA/IEA) to outer dynein arm and cilium-dependent cell motility to flagellated sperm motility; kept outer dynein arm assembly as non-core. Checked QuickGO: human and mouse Dnah17 have matching IBA sets. just validate human DNAH17 passes.
