  summary: 'Fix obsolete GO term on NEW row: FYB1'
  details: |
    Corrected an obsolete GO term asserted on a manually added NEW row (issue #6783).
    The row used GO:0033630 positive regulation of cell adhesion mediated by integrin, obsoleted by
    GO on 2026-11-10 because "this term classifies adhesion by the molecule that mediates it. The
    role of the adhesion molecule is captured by its molecular function (for example integrin binding
    or cadherin binding) together with the adhesion process", with replaced_by GO:0045785 positive
    regulation of cell adhesion. Verified against the QuickGO term history for GO:0033630 on
    2026-11-23 (the returned id was GO:0033630 itself, not a silently resolved merge target).
    Validation did not catch it because existing_annotations[].term.id is deliberately not
    hard-validated, and the row still carried the pre-obsoletion label.
    Decision: kept the row and swapped the term to GO:0045785 in both places the obsolete id
    appeared, the annotation row and core_functions[0].directly_involved_in. GO:0045785 is asserted
    nowhere else in this review and is absent from FYB1's GOA, so the row stays non-redundant, and
    the evidence is unchanged (PMID:16980616 Jurkat adhesion to ICAM-1 and fibronectin, abolished by
    disrupting the SKAP-binding region; corroborated by PMID:17403904).
    Integrin specificity: GO's stated route is an integrin-binding molecular function plus the
    generic adhesion process, and that route is only partly available here. No GO:0005178 integrin
    binding row was invented, because FYB1 is not shown to bind integrin: its molecular function is
    GO:0035591 signaling adaptor activity and it acts upstream through the SKAP55/RIAM/Rap1 module.
    The specificity is instead preserved by the retained GO:0007229 integrin-mediated signaling
    pathway rows, which also remain in core_functions[0].directly_involved_in, and by the row's
    reason prose, which now names the ICAM-1/fibronectin readout, states why no integrin-binding MF
    is asserted, and notes that GO:0007229 is outside-in whereas the measured adhesion is inside-out,
    so the pair is not an exact substitute for the precomposed term.
    Mechanical changes: the row's reason was converted from a plain scalar to a folded block scalar,
    because the added text contains a colon-space that plain-scalar YAML cannot carry; FYB1-source-guide.md,
    which described the assertion by its old id, was updated; a dated correction section was added to
    FYB1-notes.md. No evidence, supporting_text quote or reference was changed. just validate human
    FYB1 passes; its remaining warnings are the pre-existing retained generic protein-binding rows.
