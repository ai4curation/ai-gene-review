  summary: 'Refine NEW adhesion term to GO:0010811 after review: FYB1'
  details: |
    PR #6790 round-2 review follow-up (blocking item 1).

    Round 1 took GO:0045785 positive regulation of cell adhesion straight from GO's replaced_by
    for the obsoleted GO:0033630. CLAUDE.md treats replaced_by as an automated mapping not to be
    trusted by default, and for an author-written NEW row the standard is the most specific live
    term the evidence supports.

    Verified against QuickGO on 2026-11-23: GO:0010811, GO:0022409 and GO:1903039 are all live;
    GO:1903039 is_a (via ancestors) GO:0022409 is_a GO:0045785; GO:0010811 is_a GO:0045785 but is
    not under GO:0022409.

    Adopted GO:0010811 positive regulation of cell-substrate adhesion, in the NEW row and in
    core_functions[0].directly_involved_in. The assay in PMID:16980616 is adhesion of Jurkat T
    cells to fibronectin- or ICAM-1-coated dishes, i.e. attachment to an immobilized ligand.

    Rejected GO:0022409 and GO:1903039, with the reasons recorded in the row's reason prose and in
    FYB1-notes.md: neither cited paper measures a cell-cell adhesion endpoint for FYB1 itself.
    PMID:16980616 runs only coated-dish assays; the T-cell/APC conjugate assay in PMID:17403904
    perturbs the SKAP-55/RIAM interaction with RIAM domain fragments rather than ADAP, and that
    paper attributes the published conjugation defect to SKAP-55 knockdown. GO:1903039 would in
    any case entail GO:0022409.

    Neither the adopted nor the rejected terms reintroduce what GO obsoleted GO:0033630 for: they
    classify by adhesion type, not by the mediating molecule.

    Also added a second verbatim quote from PMID:16980616 ('overexpression of wild-type FADAP
    augmented adhesion of Jurkat T cells to ICAM-1 or fibronectin') so the row's leading support is
    the wild-type ADAP result rather than only the engineered LAT-chimera result, and updated
    FYB1-source-guide.md to the new id. This closes the gap the round-1 reason conceded: GO:0007229
    is outside-in while the assay is inside-out, and GO:0010811 now names the adhesion the
    inside-out assay measures. GO:0010811 is absent from FYB1-goa.tsv. just validate human FYB1
    passes; its 12 warnings are the pre-existing retained generic protein-binding rows.
