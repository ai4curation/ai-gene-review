  summary: 'Create review: CEACAM5'
  details: |
    Created the CEACAM5 review: all 40 GOA annotations reviewed. CEA is GPI-anchored on the outer leaflet of the plasma membrane with the whole mature protein extracellular, apical/glycocalyx in normal colonic epithelium and depolarized in carcinoma; a shed soluble form circulates. Core functions are homophilic/heterophilic CEACAM adhesion and, on overexpression, blockade of differentiation and of anoikis. The GPI anchor binding IMP was removed with a source defect because the cited paper shows CEA's own anchor carries the activity rather than a binding function; CEACAM1 and MERS-spike protein-binding rows were modified to informative terms; the basolateral row from the ARC-syndrome paper was marked UNDECIDED.
