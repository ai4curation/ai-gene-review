  summary: 'Create review: PHB2 (inner-membrane mitophagy receptor)'
  details: |
    Created genes/human/PHB2 via just fetch-gene human PHB2 and adjudicated all 97 GOA rows, closing the last unreviewed gene on issue 3956 (PINK1-Parkin mitophagy); PINK1, PRKN, BNIP3, FUNDC1 and MFN2 were already complete and modules/mitophagy.yaml already existed. No deep-research provider was available (no credentials), so the synthesis is in PHB2-notes.md rather than a -deep-research-<provider>.md file, and judgements that would need unavailable full text stop short of REMOVE. Core functions: LIR-dependent inner-membrane mitophagy receptor (GO:0140580, from PMID:28017329), prohibitin-ring scaffold (GO:0140378, used in core_functions only - the comparator check found just two human annotations of that term and none on a mitochondrial complex subunit, so it is raised as a question rather than proposed as NEW), and sphingosine-1-phosphate binding (GO:0046625). Two source defects: WRONG_GENE_PRODUCT CONFIRMED on the GO:0030449 complement row (PMID:17070910 states PHB1 and not PHB2 enhances complement activation, and PHB1 already carries the paper), and WRONG_TERM PROBABLE on the GO:1901224 non-canonical NF-kappaB rows (the mouse source assays IkappaB-alpha and p50/p65). GO:0000423 kept rather than refined to GO:0061734, since the same paper shows a Parkin-independent requirement in C. elegans. Validated with just validate human PHB2 (valid, one deliberate warning about GO:0140378), just validate-quotes (0 blocking) and just validate-references (184 snippets, 29 titles, 0 issues).
