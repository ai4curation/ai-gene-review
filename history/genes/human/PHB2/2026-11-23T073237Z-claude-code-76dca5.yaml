  summary: Fix two inverted NOT-row actions on PHB2 and drop the spurious source defect
  details: |
    Addressed the CHANGES_REQUESTED review on PR 6675. Both GO:0030449 (regulation of complement activation, PMID:17070910) and GO:0043410 (positive regulation of MAPK cascade, PMID:24003225) are NOT|involved_in rows in PHB2-goa.tsv (lines 82 and 41) and carried negated: true in the review, but the original review applied REMOVE to each while its reason argued the negative claim. Per docs/action_consistency.md, REMOVE on a NOT row doubts the negative claim rather than endorsing it, so both rows are now ACCEPT with summary and reason rewritten to state that the curator correctly encoded the paper negative result (precedent: genes/DROME/CRY). Deleted the WRONG_GENE_PRODUCT source defect on GO:0030449: it was CONFIRMED/DELETE_ROW against UNIPROT and would have exported an upstream request to delete a correct negative annotation; PMID:17070910 was curated correctly on both paralogs, with the positive half on PHB1 (P35232, GO:0001850/GO:0001851). The only surviving source defect in this review is the WRONG_TERM PROBABLE/REPOINT entry on the GO:1901224 non-canonical NF-kappaB rows. Reference reviews updated: PMID:17070910 MISCITED to VERIFIED, and the PMID:24003225 note no longer claims the paper fails to support the row it supports. Reworked the dependent prose: the GO:0070374 reason now argues from its own antibody-bead co-clustering evidence (it stays MARK_AS_OVER_ANNOTATED, which is coherent under the accepted NOT on its ancestor and is not in the warned action set), the GO:0016477 reason no longer refers to a removed row, and PHB2-notes.md gained an accepted-negatives section replacing the two wrong-gene/contradicted entries. Revalidated: just validate human PHB2 (valid, same single deliberate GO:0140378 warning), just validate-quotes (30411 verified, 0 blocking), just validate-references (184 snippets, 29 titles, 0 issues).
