  summary: Review CYP2U1 catalytic activities and contextual annotations
  details: |
    Reviewed all 34 original CYP2U1 annotations without changing their source fields. Distinguished fatty-acid terminal and penultimate hydroxylation and structurally identified N-arachidonoylserotonin oxidation, with an evidence-based proposed molecular-function term and literal RHEA mapping. Preserved 544- and 168-residue products without transferring engineered-construct activity to the short product. Examined actual ancestral nodes, donor evidence, rule conditions and Reactome catalyst paths. Retained experimentally demonstrated drug turnover as contextual, left four steroid/localization assertions uncertain, and marked the cytochrome-metabolism mapping over-annotated. Binding and disease perturbations were not converted into invented catalytic/process annotations. All 22 reference assessments and access limits are documented, with five exact quotation occurrences. Final actions: 15 ACCEPT, 7 MODIFY, 6 TOO_GENERAL, 4 UNDECIDED, 1 KEEP_AS_NON_CORE and 1 MARK_AS_OVER_ANNOTATED; no NEW. Independent chemistry consultation and whole scientific review passed. Genuine provider failures are documented. All normal validation, explicit term checks, status checking, rendering and history validation passed; one intentional source-specific monooxygenase advisory remains. Sources, runtime files and unrelated work were preserved. Publication does not imply merge or project completion credit.
