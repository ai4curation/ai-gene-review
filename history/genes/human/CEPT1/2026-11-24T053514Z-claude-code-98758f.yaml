  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch H02). GO:0005794 Golgi apparatus (IBA) changed from MARK_AS_OVER_ANNOTATED to REMOVE. The IBD at PTN000045767 is seeded by human CHPT1 and mouse Chpt1 in the CHPT1 half of PTN000045771 and by fly CG7149 in the other child clade PTN000823784; the CEPT1 clade PTN002572453 has no seed. PMID:12221122, the paper that seeds CHPT1, reports that brefeldin A relocalizes CPT1 but not CEPT1 and places CEPT1 in ER and nuclear membranes, which is direct evidence against the location on the CEPT1 branch. The earlier reason wrongly placed the fly seed in the CHPT1 lineage; that and the propagation_review comment were corrected. PAINT fix requested: loss of GO:0005794 at PTN002572453. Validated with just validate; no new error or warning.
