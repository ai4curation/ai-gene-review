  summary: First review of human AIRIM - 174 protein-binding rows over 10 distinct terms
  details: |
    188 GOA rows covering only 10 distinct GO terms, 174 of them GO:0005515 protein binding IPI with
    one row per partner. About 164 come from three systematic screens that were not studies of AIRIM:
    HuRI (121), HI-II-14 (43) and a high-throughput Y2H methods paper (3).

    Applied the project's GO:0005515 policy: not MARK_AS_OVER_ANNOTATED, since the defect is that the
    term is uninformative rather than overclaiming; MODIFY where a better evidence-backed term exists,
    otherwise REMOVE, with removal not asserting the interaction is false.

    The split falls on the PARTNER, not the assay. Eight rows whose partner is CINP, AFG2A or AFG2B -
    genuine subunits of the same complex - become GO:1904949 ATPase complex, including both BioPlex
    rows whose partner happens to be CINP. The other 166 each name their own partner, resolved via the
    UniProt API including 20 isoform accessions mapped to base entries.

    Stripping 166 protein-binding rows would leave zero molecular function annotations for a protein
    whose role is structurally resolved, so GO:0005198 structural molecule activity was added as NEW,
    with GO:0016887 in contributes_to_molecular_function per the schema's guidance for complex subunits
    that do not independently possess the complex-level activity.

    GO:0005730 nucleolus demoted to KEEP_AS_NON_CORE: a real observation, but the demonstrated step is
    late and cytoplasmic and the replisome role is nucleoplasmic.
