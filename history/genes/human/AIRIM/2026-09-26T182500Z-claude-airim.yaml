  summary: Round 2 - cite three papers already in the diff, and correct the stoichiometry
  details: |
    PMID:40268917, PMID:40760247 and PMID:32761833 were cached by this PR and cited nowhere, and the
    description asserted a neurodevelopmental disorder association with PMID:40760247 sitting in the
    same diff. All three now carry findings and reference_review.

    'Heterohexameric' describes the SPATA5-SPATA5L1 motor, not the 4:2:2:2 assembly, and was replaced
    everywhere it described the whole complex. PMID:32761833's isoform specificity (C1orf109L) is
    recorded as a flagged caveat rather than folded in, since no GO annotation covers that activity.
- type: REVIEW
  outcome: changed
  sections:
  - existing_annotations
  - references
  - core_functions
  - suggested_questions
  - notes
  summary: Round 3 and 4 - undo an over-correction and add molecular adaptor activity
  details: |
    Round 2 removed a substrate-presentation claim on a reviewer's citation that 'C1orf109 does not
    interact with the pre-60S particle directly'. That sentence is about the docking platform, not the
    AAA+ substrate. The reviewer retracted the correction and, on checking, they were right: the
    substrate is RLP24 and the same paper concludes in a section headed 'CINP and C1orf109 are adapter
    proteins for the SPATA5 complex' that C1orf109 mediates the interaction with it, backed by
    co-immunoprecipitation of an RLP24 fragment and by the structure.

    The accurate distinction is narrow: AIRIM binds the SUBSTRATE RLP24 inside the funnel but makes no
    direct contact with the PRE-60S PARTICLE it sits on, which is CINP's contribution.

    Consequence: GO:0060090 molecular adaptor activity added as a second NEW row, evidence code IPI
    since the load-bearing experiment is a physical interaction, and promoted to
    core_functions.molecular_function. GO:0005198 remains proposed alongside it, the two claims being
    separable.

    Round 4 completed the retraction, which had reached core_functions and suggested_questions but not
    the references[PMID:40268917] block, where a findings[].statement still asserted that the paper
    ruled out a substrate role - the opposite of its own section heading - and review_notes still said
    'the substrate half does not survive'. Both corrected, and the adapter/RLP24 conclusion added to
    that reference's findings. Two quotes were also switched from ASCII hyphens to the en-dashes the
    cached record actually uses.

    The lesson recorded in the gene notes: a quote handed to me in review needs the same context check
    as one I find myself, and a retraction has to be chased through every field that repeats the claim.
