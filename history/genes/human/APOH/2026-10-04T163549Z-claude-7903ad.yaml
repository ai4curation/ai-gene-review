  summary: 'Initial review of human APOH (beta2-glycoprotein I): anionic phospholipid
    binding and contact-pathway inhibition core; protein binding specialized; antibody-attributed
    procoagulant and TG transport rows over-annotated'
  details: |
    44 GOA rows. Phospholipid binding, negative regulation of coagulation, identical protein binding and extracellular region accepted. Intrinsic pathway modified to its negative regulation; lipid binding to lipoprotein particle binding. Protein binding modified: plasminogen and apo(a) to kringle domain binding, PF4 to chemokine binding, LDLR/Lrp8 to LDL particle receptor binding; MBL and Y2H hits removed. Positive regulation of coagulation (TAS, antibody effect) and triglyceride transport marked over-annotated. LPL, lipoprotein particle, fibrinolysis, angiogenesis and apoptosis rows kept as non-core.
