  summary: 'Create review: PTK2'
  details: |
    Created a DRAFT review of human PTK2 (FAK) for Track B of the Origins of Multicellularity project. Reviewed all 233 GOA rows: 95 ACCEPT, 51 KEEP_AS_NON_CORE, 11 MODIFY, 66 REMOVE (all generic protein binding), 5 MARK_AS_OVER_ANNOTATED, 5 UNDECIDED, plus 1 NEW (peptidyl-tyrosine autophosphorylation). Notable changes: protein tyrosine phosphatase activity (IMP, PMID:9360983) modified to non-membrane spanning protein tyrosine kinase activity; nine protein-binding rows with a defined binding mode replaced by SH2/SH3/PH domain, p53, integrin or talin binding; positive regulation of cell-cell adhesion mediated by integrin generalised to GO:0033630. Core functions are tyrosine kinase activity at focal adhesions in integrin signalling, pTyr397 SH2-docking scaffold, and integrin/talin/paxillin-mediated adhesion targeting. Evolutionary context is from PMID:20479219 (canonical FAK in Capsaspora, absent from choanoflagellates, which have only a FAK-related kinase domain) and PMID:32857975 (integrin adhesion in Capsaspora, FAK untested). Notes in PTK2-notes.md; automated deep research was unavailable.
