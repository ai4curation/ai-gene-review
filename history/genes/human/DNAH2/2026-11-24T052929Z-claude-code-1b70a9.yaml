  details: |
    Re-judged the GO:0051959 dynein light intermediate chain binding IBA (PTN000743491, PTHR10676) against the PAINT tree. The IBD is at the family root and its three seeds are cytoplasmic dynein 1 heavy chains in clade PTN000072732; DNAH2 is in a separate child clade, PTN002472922, with no seed. The review already cited the I1/f arm composition, which has no light intermediate chain, the same misplaced-IBD ground on which the outer arm heavy chains are REMOVE. The IBA row and the InterPro IEA row on the same term were changed from MARK_AS_OVER_ANNOTATED to REMOVE, and the IBA reason now states the tree. Suggested PAINT fix: move the IBD to PTN000072732. Validated with just validate human DNAH2.
