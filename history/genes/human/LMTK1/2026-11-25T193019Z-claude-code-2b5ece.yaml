  summary: Record OpenScientist provenance analysis of the LMTK1 kinase and PP1 constructs
  details: |
    Ran an OpenScientist deep-research job (kgap-lmtk1-construct-isoform) on two literature-provenance gaps on this gene. One is answered, the other is established as undecidable with its cause documented.

    The PMID:35902728 construct cannot be assigned, and the gap stays OPEN with the reason recorded rather than merely unresolved. The full text contains no sequence accession, no residue number, no protein size, no isoform or transcript-variant statement and no cloning or mutagenesis primers; the construct description is two sentences. Those two sentences also carry an internal citation conflict: the text credits one study by name while the cross-reference in the same sentence resolves to a different 2014 paper whose construct is a mouse clone, and the named study is a different reference number. The two readings point to different species and different proteins. The kinase-dead allele is described only as a mutation of the ATP-binding pocket, written in reverse order and with no position, so no arithmetic is available; the run notes a position would have separated the untagged RefSeq product from the UniProt isoforms but would not have separated isoform 1 from isoform 3, which share residues 1-467 verbatim.

    A third finding reframes that gap, and the local record confirms it: the candidate set of three UniProt isoforms may be unsatisfiable, because the human protein most likely to appear in a published expression construct, the product of NM_004920, is not assigned to any isoform in this entry. The RefSeq cross-references tag NP_001073864.2 as isoform 1 while NP_004911.2 carries no isoform assignment at all. The run also reports neither paper has been curated into GO, so this is a prospective decision rather than a cleanup.

    The species half of the PP1 scaffold gap is answered, moving that gap from OPEN to NARROWING. The run could not retrieve PMID:17267545's full text either, the publisher refusing access with no open copy available, but the single residue number the paper gives settles it by arithmetic: across human, mouse and rat entries the valine of the only RVxF-type PP1 docking motif, KAVSF, sits at the quoted position only in the 1317-residue mouse AATYK1A protein, and two of the three human UniProt isoforms are too short to contain the motif at all. The local record confirms the human side directly, KAVSF occurring once with its valine at 1232, which is the figure the run gives for isoform 1 and not the quoted position. So that construct was mouse, the recurrent human PPP1CA and PPP1CC screen hits remain the only human evidence, and the resolution's first step is discharged while the rest is not.

    Verified locally: the KAVSF position and the RefSeq tagging asymmetry. The full-text inspection, the citation conflict, the 22-entry motif survey and the GO curation check were not independently verified; the local record lists NM_004920.2 where the run writes NM_004920.3, a version difference that does not affect the argument. No annotation action was taken.
