  details: |
    Re-review of the IBA REMOVE on GO:0043153 entrainment of circadian clock by photoperiod (IBD at PTN002479144, PTHR11455). The three seeds are Drosophila cry and mouse Cry1 and Cry2; both mouse genes carry the term by IMP from PMID:23616524 (UniProt). The removal rested on a review statement that mammalian CRY is not required for photo-entrainment, which is a claim against the experimental annotation on the direct ortholog whose full text could not be read (the abstract concerns circadian period and does not mention entrainment). No tree ground for removal exists, so the IBA row and the IEA and ISS rows on the same term (kept consistent) were changed from REMOVE to UNDECIDED with a new summary and reason. The PMID:23133559 quote was kept verbatim.
