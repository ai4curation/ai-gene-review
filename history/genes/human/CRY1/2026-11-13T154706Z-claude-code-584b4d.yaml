  summary: 'Review of PR 6331: four rows refined to child terms (MODIFY)'
  details: |
    Changes made in answer to the review of ai4curation/ai-gene-review#6331, which follows up the rows that the REMOVE re-review of human reviews had left UNDECIDED. The review pointed out that a term kept as non-core should be refined where the evidence is more specific. The two phosphatase binding rows become MODIFY to protein phosphatase binding (GO:0019903), because the partner recorded by UniProt is protein phosphatase 5 (PMID:16790549), and the two positive regulation of protein ubiquitination rows become MODIFY to positive regulation of protein polyubiquitination (GO:1902916), because the study read in full shows poly-ubiquitination of FOXO1 (PMID:27412556). Both replacement terms are children of the terms they replace, checked in QuickGO, and all four rows stay outside the core function. Actions changed: [11] phosphatase binding (GO:0019902; IEA, GO_REF:0000117): KEEP_AS_NON_CORE -> MODIFY (replacement protein phosphatase binding, GO:0019903); [28] positive regulation of protein ubiquitination (GO:0031398; IEA, GO_REF:0000107): KEEP_AS_NON_CORE -> MODIFY (replacement positive regulation of protein polyubiquitination, GO:1902916); [54] positive regulation of protein ubiquitination (GO:0031398; ISS, GO_REF:0000024): KEEP_AS_NON_CORE -> MODIFY (replacement positive regulation of protein polyubiquitination, GO:1902916); [76] phosphatase binding (GO:0019902; IPI, PMID:9383998): KEEP_AS_NON_CORE -> MODIFY (replacement protein phosphatase binding, GO:0019903). Validated with ai-gene-review validate --terms: no error and no new warning against the state before the edit.
