  summary: Review DARS2 mitochondrial tRNA charging and source-specific evidence
  details: |
    Reassessed all 54 existing source assertions without changing their source identities: 21 ACCEPT, 16 MODIFY, eight KEEP_BUT_TOO_GENERAL, six KEEP_AS_NON_CORE, and three UNDECIDED. No NEW assertion was introduced. Synthesized one mitochondrial aspartate–tRNA ligase core function, distinguishing the 645-residue precursor, predicted processed chain, and experimental truncations. Original notes remain an exact prefix and existing source/provider caches remain unchanged.

    The review separates the 2007 heterologous tRNA charging and 2013 structural/aminoacylation evidence from unresolved 2005 substrate claims. Membrane association is qualified by the actual fractionation/extraction experiments; later confocal and lysate data do not independently resolve membrane topology or whole-cell charging. Protein interaction decisions use actual partner identities and assay limits. The 2024 delivered-protein experiments do not establish a secreted ligand function. Source reconstruction includes 844 PAINT nodes, three ancestral assertions, 37 donor records, 2,418 rule branches, 123 raw interactions, and eight Reactome objects. All 35 inherited quote occurrences are preserved; no new quotation was introduced.

    Independent substrate, interaction, annotation, and core/product consultations were read and reproduced. ROOT read every annotation decision, all core functions, the source guide, and targeted original passages. A forward addendum corrects reading attribution without claiming whole-paper reading. Four genuinely fetched missing publication caches are included, including PMID24275569 verified against both pending shared versions. Ordinary isolated validation and rendering passed; ROOT repeats required canonical checks and validates this history before publication. Completion credit remains pending exact-head approval, merge, and actual-main validation.
