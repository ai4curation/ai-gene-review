  summary: De-novo review of all 68 GOA annotations for SLC41A1, the plasma-membrane
    Na+/Mg2+ exchanger
  details: |
    Reviewed every GOA row for SLC41A1 (Q8IVJ1), the predominant plasma-membrane Na+/Mg2+ exchanger (SLC41/MgtE family, PANTHER PTHR16228 / PTN001045280). Core MF GO:0061768 magnesium:sodium antiporter activity (IMP PMID:22031603/23661805/23976986), with the genus GO:0015095 Mg2+ TM transporter activity (IDA PMID:18367447); core BP GO:0015693 / GO:1903830 Mg2+ (TM) transport and GO:0010961 intracellular Mg2+ homeostasis (IMP knockdown); core location GO:0005886 plasma membrane (IDA x3 + IBA + TAS). Support cites curated UniProt CC:FUNCTION/CC:SUBCELLULAR LOCATION (ECO:0000269) via file: references. Actions (68 rows): 31 REMOVE (bare GO:0005515 protein binding IPI, high-throughput interactome PMID:32296183, per policy); 20 ACCEPT (the Mg antiporter/transport MF+BP and PM location); 10 TOO_GENERAL (GO:0022857 transporter, GO:0008324 cation transporter, GO:0006812 cation transport, GO:0030001 metal ion transport - class terms imprecise once Mg2+ transport is asserted); 7 KEEP_AS_NON_CORE (GO:0071286 cellular response to Mg regulatory; GO:0035725 Na+ counter-ion flux of the antiport; GO:0016323 basolateral PM, polarized-cell-specific; GO:0032991 vague complex membership). propagation_review on the GO:0005886 IBA (PTN001045280, SUPPORTS_TRANSFER). source_defects: none. No deep-research provider file; notes synthesized from the curated UniProt record and GOA-cited primary literature. Batch 28.
