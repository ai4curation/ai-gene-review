  details: |
    Reviewed every GOA row for SLC16A14 (Q7RTX9, MCT14). Orphan SLC16/MCT family member; predicted proton-coupled monocarboxylate transporter with no demonstrated substrate (homology + PAINT IBA only; no primary literature). Putative core MF GO:0008028 at the plasma membrane. Actions (7): 5 ACCEPT (GO:0005886 PM IBA+IEA; GO:0008028 IBA; GO:1905039 carboxylic-acid TM transport IBA; GO:0015718 monocarboxylic acid transport IEA), 2 TOO_GENERAL (GO:0022857 anchored by GO:0008028; GO:0055085 anchored by GO:1905039). propagation_review NO_FAILURE_CORE on IBA rows. source_defects: none. Batch 25 (completes canonical SLC16).
