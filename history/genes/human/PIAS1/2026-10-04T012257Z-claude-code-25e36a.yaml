  summary: 'Complete review: PIAS1'
  details: |
    Reviewed all 165 GOA annotations for PIAS1 (SP-RING SUMO E3 ligase; STAT1/NF-kB inhibitor). Deep research: falcon (402), perplexity (unavailable) and openai (401) failed; openscientist succeeded (PIAS1-deep-research-openscientist.md), its key claims were verified against cached primary sources and it is cited as a reference. Synthesis in PIAS1-notes.md from cached papers plus 9 newly cached PMIDs (11583632, 11867732, 15311277, 15657437, 20016603, 12764129, 17540171, 27099310, 32348746). 49 REMOVE (mostly high-throughput Y2H protein-binding IPI), 13 MODIFY (protein binding to TF/coregulator/p53/SUMO binding; corepressor to transcription regulator inhibitor activity; JAK-STAT to negative regulation; positive regulation of sumoylation to protein sumoylation), 1 NEW (GO:0043124 from PMID:15657437, also PMID:17540171). The openscientist report changed no actions; it added support for the GO:0140416 MODIFY, PML body ACCEPTs, SUMO binding MODIFY, and NEW NF-kB annotation.
