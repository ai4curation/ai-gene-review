  summary: 'ORGANELLES pilot: mitochondrial matrix for MMADHC'
  details: |
    Applied the ORGANELLES policy to MMADHC's four mitochondrion (GO:0005739) rows. Four agreeing lines support the mitochondrial matrix for the mitochondrial pool: an N-terminal MTS (UniProt transit peptide 1-38, no TM segment) whose deletion (deltaN38) leaves MMADHC almost exclusively cytosolic (PMID:42709793, PMID:18385497); proton-motive-force-dependent import (PMID:42709793); turnover by the matrix protease LONP1, with accumulation in the mitochondrial fraction on LONP1 inhibition (PMID:42709793), plus Afg3l2-dependent turnover in mouse HSCs (PMID:41411131); and delivery to the AdoCbl branch whose enzymes MMAB and MMUT are matrix proteins. No sub-mitochondrial assay exists, so the new row is IC. The IBA (GO_REF:0000033; PAINT PTN008546602 seeded only by the target's root annotation) and IEA (GO_REF:0000044) rows changed from KEEP_AS_NON_CORE to MODIFY -> GO:0005759, the IBA gaining a propagation_review; the HTP (PMID:34800366) and IDA (PMID:23270877) rows stay KEEP_AS_NON_CORE with reasons extended; a NEW IC GO:0005759 row was added; core_functions locations now list cytosol and mitochondrial matrix. PMIDs 42709793, 41411131 and 18385497 were cached and added to references, with file:human/MMUT/MMUT-uniprot.txt.
