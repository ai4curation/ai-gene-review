  summary: 'Create review: RHOJ canonical product Q9H4E5'
  details: |
    De-novo review of canonical human RHOJ (Q9H4E5, PTHR24072:SF17) in genes/human/RHOJ__Q9H4E5, written as the same-gene reference for the G3V4H1 benchmark product in genes/human/RHOJ. It is independent of the ProtNLM2 predictions. Falcon deep research failed (auth), and so did the perplexity-lite fallback (quota), so five primary papers were cached and read directly. All 54 GOA rows were reviewed. GTPase, GTP binding and plasma membrane were accepted; Q9H4E5 is an IBD seed at the family root PTN000632671. Migration and sprouting regulation rows were modified to their positive children, and PAK protein-binding rows to protein kinase binding. The Cdc42-node endocytosis IBA was marked over-annotated, because RHOJ acts after internalization (PMID:12960428). The other bare protein-binding rows were removed under the GO:0005515 policy. Four NEW annotations were added: GBD domain binding, focal adhesion, positive regulation of focal adhesion disassembly, and semaphorin-plexin signaling pathway. A PEP 723 evolutionary-grounding script (PANTHER placement, G-motif scan, PAINT node seeds) was added under RHOJ__Q9H4E5-bioinformatics/.
