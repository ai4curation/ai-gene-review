  summary: 'Create review: UBR5'
  details: |
    Reviewed all 74 seeded human UBR5 GO annotations, replacing every PENDING decision with an evidence-backed action and rationale. Accepted the supported HECT ubiquitin protein ligase, ubiquitin-chain elongation, K48/K63- and K11/K48-branched-chain, Wnt signaling, cytoplasmic and nuclear protein-quality-control, nuclear/cytosolic localization, and chromatin rows. Removed the InterPro RNA-binding projection and all bare GO:0005515 protein-binding rows; refined the broad ubiquitin-protein transferase and cytoplasmic protein-quality-control rows to GO:0061630 and GO:0071629; refined heterochromatin boundary formation to DNA repair-dependent chromatin remodeling; and marked the NK membrane proteomics and beta-catenin nuclear-import rows as over-annotations. Added manual UBR5 notes for GO-CAM 6606056e00000678, PAINT loss status, the open PMID:29033132 UBR5/K11/K48 evidence absent from the abstract-only cache, and Human Protein Atlas localization support. Validated with `just validate human UBR5`.
