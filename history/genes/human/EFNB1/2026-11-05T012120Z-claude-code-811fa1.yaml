  summary: 'EFNB1: consistent ligand-activity replacements for protein-binding rows'
  details: |
    Five GO:0005515 rows recording EFNB1 binding Eph receptors (PMID:33961781 EPHB2; PMID:35922511 EPHA2, EPHB2, EPHA4; PMID:40205054 EPHB2) were MODIFY to GO:0046875 ephrin receptor binding, while the GO:0046875 rows themselves were MODIFY to GO:0048018. These five now go to GO:0048018 receptor ligand activity, with updated reasons. ERBB2 rows keep GO:0005102, and the reasons now say EFNB1 is not an ERBB2 ligand. The PICK1 row (PMID:9883737) goes from KEEP_AS_NON_CORE to MODIFY with GO:0030165 PDZ domain binding, supported by a verbatim abstract quote. The ANKRD46 yeast two-hybrid row goes from KEEP_AS_NON_CORE to REMOVE under the protein-binding policy. A suggested question wrongly said GO:0048018 has no receptor-class-specific children. It now names GO:0038177 and GO:0001515, verified via QuickGO. just validate human EFNB1 passes.
