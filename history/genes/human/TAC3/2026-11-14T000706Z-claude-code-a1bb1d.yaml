  summary: Add GO:0001659 temperature homeostasis (NEW)
  details: |
    Ligand-side half of a cross-species consistency pass on thermoregulation, made together with the human TACR3 edit and after the companion mouse Tac2 and Tacr3 reviews proposed GO:0001659 from mouse evidence. Revises this review's earlier decision not to propose a thermoregulatory term, which had checked only GO:0031653 heat dissipation and its regulation terms (no annotations in any species) and not their parent GO:0001659. Added: one NEW row, GO:0001659 temperature homeostasis (EXP, PMID:25683060), a third core_functions entry, reference entries with reference_review for the two NK3R-selective antagonist trials (PMID:28385352 MLE4901 phase 2, PMID:36924778 fezolinetant SKYLIGHT 1), a clause in the description naming the objective measures, and two limits in the existing knowledge gap's boundary. Evidence: intravenous NKB induced hot flushes in healthy premenopausal women with skin temperature rising during the episodes and concordant sternal skin-conductance rises in six of eight participants, which is administration of this gene's own product in women with intact ovarian function; the trial literature defines a flush as activation of heat-dissipation effectors rather than a sensation; the NK3R-selective antagonist trials show the pathway the peptide signals through is required, although as trials in postmenopausal women they speak to the estrogen-deprived state and are evidence about the receptor rather than the peptide; the rat KNDy-ablation result supplies the circuit. Limits recorded on the row: nothing changed across the infusion as a whole, only during flush episodes, and core temperature was not measured. Comparator check (QuickGO, 2026-11-13): 26 human GO:0001659 rows, all transfers, including the neuropeptides HCRT and NMU, against 42 mouse rows of which about twenty are IMP; neither rodent ortholog carries the term in GOA, so nothing existed to transfer. Evidence code EXP, on the ECO argument recorded in both reviews (ECO:0006053 pharmacological assay evidence is neither the IMP nor the IDA class and resolves to EXP), with the note that IDA would also be defensible here because the experiment administers the gene product itself, and that GO's own guidance pages could not be read from this environment. No existing row's action was changed.
