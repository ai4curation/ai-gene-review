  summary: 'Create review: TAC3'
  details: |
    De novo review of all 18 GOA rows for human TAC3 (Q9UHF0, preprotachykinin-3 / neurokinin B). Actions: 11 ACCEPT, 3 REMOVE (generic GO:0005515 from two Y2H interactome screens, per the protein-binding policy), 2 MARK_AS_OVER_ANNOTATED (GO:0007565 female pregnancy, which rests on placental expression plus a proposed pathological pressor role, and the GO:0045777 IBA, whose rat seed is ICV NK3 agonist pharmacology partly mediated by vasopressin), 1 MODIFY (GO:0005102 signaling receptor binding to GO:0048018 receptor ligand activity, the term both cached GO-CAMs use for TAC3), 1 KEEP_AS_NON_CORE (GO:0007189 cAMP pathway, shown only for the rodent receptor), 1 NEW (GO:0033686 positive regulation of luteinizing hormone secretion, IMP from the human TAC3 loss-of-function phenotype, after a comparator check showing KISS1, LEP, NPVF and the inhibins carry gonadotropin-secretion regulation terms on the ligand side). Two core functions, both on GO:0048018: NK3R agonist activity driving the Gq/PLC tachykinin pathway, and the KNDy-neuron role promoting LH secretion. Not added: heat-dissipation terms for the hot-flush role (GO:0031653/0031654/0031656 carry no annotations in any species, and the human circuit is undefined), recorded instead in the description and as a BIOLOGY knowledge gap, matching the companion TACR3 review; no menopause or reproductive-senescence life-stage term. Could not verify: most cited papers are abstract-only, so experimental detail beyond the abstracts was taken on the curators' reading; whether the gamma isoform, whose splice removes the NKB-coding segment, is translated is untested in the literature I read. Observed but not recorded as a source defect: rat and mouse Tac3 carry GO:0031836, GO:0031837 and GO:1902093 as ISO from human Q9UHF0 and its NKB chain, and human TAC3 no longer carries any of those terms (the same pattern holds for human TAC1 and GO:0160041/GO:0005184), so those rodent rows appear to cite a source that no longer exists; I could not establish why, so I did not reinstate the human terms and did not add GO:0160041 neuropeptide activity as NEW. All quotes verified (48 in the review, 38 in the notes); just validate and just validate-quotes clean.
