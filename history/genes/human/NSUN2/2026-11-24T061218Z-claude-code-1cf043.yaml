  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch H11). GO:0009383 rRNA (cytosine-C5-)-methyltransferase activity, GO:0006364 rRNA processing and GO:1902775 mitochondrial large ribosomal subunit assembly, all from the IBD node PTN000516076 (153 leaves). The earlier review kept them as over-annotations because the tree had not been inspected. On the tree, the mouse Nsun4 seed (MGI:1919431; experimental rows on the canonical protein Q9CZ57, PMID:24516400) is represented by the leaf C4P6S0, an 806-residue testis isoform of the same locus, which sits inside the mammalian NSUN2 clade PTN004568572, while human and rat NSUN4 are in clade PTN000516152 outside the IBD node. For GO:0006364 and GO:1902775 that is the only seed; for GO:0009383 the second seed is Arabidopsis TRM4B in the sister plant clade PTN007710015. No NSUN2 or Trm4 enzyme is a seed. All three rows changed to REMOVE on misplaced-IBD grounds, with reasons and propagation_review comments rewritten. The PMID:31276587 quote on the mitoribosome row is unchanged.
