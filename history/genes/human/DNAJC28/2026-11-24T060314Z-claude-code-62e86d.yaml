  details: |
    Re-judged the IBA row GO:0001659 temperature homeostasis against the PTHR39158 PAINT tree. The IBD sits at PTN001166000 (12 mammalian DNAJC28 leaves) on one seed, rhesus macaque DNAJC28 (UniProtKB:F7DMN9), IMP PMID:39911280, assigned by GO_Central. The full text (PMC11793050) was read: a comparative genomics and expression study of two macaque species with no mutant, no perturbation of DNAJC28 and no temperature measurement. Action changed from MARK_AS_OVER_ANNOTATED to REMOVE on bad-seed grounds. The earlier reason said the term came from distantly related family members, which misread the tree. Added two source_defects (the seed row and the PAINT IBD), a propagation_review, quotes from the paper, and the reference PMID:39911280. Validated with just validate human DNAJC28.
