  summary: Remove BBS12 generic protein-binding rows
  details: |
    Revisited the twelve GO:0005515 protein-binding annotations during PR review follow-up and changed them from KEEP_AS_NON_CORE to REMOVE. The named BBS7, BBS9, BBS10, BBS2 and MKKS/BBS6 associations remain biologically plausible in the BBSome assembly pathway, but generic protein binding is not informative enough to retain as a molecular-function assertion and no replacement MF is established for these exact IPI/AP-MS sources. The supported BBS12 assembly role remains represented by GO:0051131. Validated with just validate human BBS12 and rendered with just render human BBS12.
