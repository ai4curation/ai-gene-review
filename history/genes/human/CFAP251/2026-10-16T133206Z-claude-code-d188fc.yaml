  summary: 'Create: CFAP251 (WDR66) GO annotation review'
  details: |
    New review of all 11 GOA rows for CFAP251 (WDR66), a calmodulin- and spoke-associated complex (CSC) subunit at the base of radial spoke 3. Actions: 8 ACCEPT, 2 KEEP_AS_NON_CORE (HPA sperm midpiece and end piece), 1 MODIFY (radial spoke stalk colocalizes_with -> GO:0120342 radial spoke base 3, based on Tetrahymena FAP251 knockout and human axoneme cryo-EM), 2 NEW (GO:0062177 radial spoke assembly, comparator LRRC23; GO:0005200 structural constituent of cytoskeleton, matching the CFAP61 review). Sperm flagellum assembly was not proposed because it descends from terms the gene already carries; raised as a suggested question. Falcon deep research failed (Edison authentication error) and perplexity was unavailable, so literature research was manual and is recorded in CFAP251-notes.md. New publication caches: PMID 30122541, 30310178, 35087568, 41943837, 17967944, 40931011. Validated with just validate human CFAP251 (only UV_NATIVE_TLS warnings) and just validate-references.
