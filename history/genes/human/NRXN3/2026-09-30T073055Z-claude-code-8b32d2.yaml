  summary: 'Create review: NRXN3'
  details: |
    New review of human NRXN3 (Q9Y4C0, neurexin-3-alpha). Automated deep research failed twice, so literature was gathered manually via NCBI E-utilities, integrity-checked (no retractions among cited papers; errata noted for Dai 2019/2021/2022), and recorded in NRXN3-notes.md. All 36 GOA rows reviewed: 13 ACCEPT, 13 KEEP_AS_NON_CORE, 7 MODIFY (4 protein binding -> PDZ domain binding; neuron cell-cell adhesion -> synaptic membrane adhesion; signal transduction -> GO:0099557 trans-synaptic signaling by trans-synaptic complex, modulating synaptic transmission), 2 MARK_AS_OVER_ANNOTATED (vocalization behavior), 1 REMOVE (axon guidance TAS). Two NEW rows: GO:0098632 cell-cell adhesion mediator activity and GO:0099171 presynaptic modulation of chemical synaptic transmission. Core functions: trans-synaptic adhesion, SS4-dependent trans-synaptic control of postsynaptic AMPA receptors, and synapse-specific presynaptic modulation of GABA release. Addiction and waist-circumference associations were judged insufficient for any GO annotation.
