  summary: Create human CARS2 mitochondrial cysteinyl-tRNA synthetase review
  details: |
    Created a complete human CARS2 review for PTHR10890. Assessed all 15 GOA rows one-to-one, accepted the mitochondrial cysteine-tRNA ligase and ATP-binding annotations, modified obsolete cysteinyl-tRNA aminoacylation rows to mitochondrial tRNA aminoacylation for protein translation, treated broad cytoplasm as too general beside mitochondrion, and proposed a cysteine persulfide synthase activity term for the non-canonical PLP-dependent persulfide reaction described for mammalian CARS proteins.
