  summary: Review CLCN5 chloride-proton exchange and nucleotide binding
  details: |
    Reviewed all 33 original CLCN5 annotations while preserving the source objects, both alternative products and all 15 original reference identities. Refined historical channel and broad transporter claims to chloride:proton exchange using direct coupling evidence. Kept human expression, mouse renal knock-in, opossum-cell and native tissue evidence distinct; retained supported KIF3B association as kinesin binding and source-specific non-core localization. Added one experimentally supported adenyl ribonucleotide binding annotation from human cytoplasmic-domain assays; did not infer ATPase, established physiological nucleotide gating, a new process or exact modern isoform identity. Retained one UNDECIDED source-specific NK-cell membrane observation whose target table was inaccessible. Normal validation, status calculation and rendering pass with one explained same-term membrane advisory; independent whole review and exact source-preservation checks pass. Genuine provider failures and manual research scope are documented.
