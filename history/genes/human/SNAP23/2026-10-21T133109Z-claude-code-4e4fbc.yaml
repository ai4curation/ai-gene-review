  summary: 'Create review: SNAP23'
  details: |
    De-novo review of human SNAP23 (O00161) as the experimentally characterised reference for the HORSE40 ortholog (A0A3Q2HTF1), independent of ProtNLM2 predictions. Falcon and perplexity-lite deep research both failed (auth/quota), so the review rests on cached GOA-cited and UniProt-cited primary papers. All 73 GOA rows reviewed: SNARE fusogenic activity, syntaxin binding, SNARE complex, plasma membrane, exocytosis and vesicle fusion accepted; synaptic vesicle priming/active-zone fusion IBAs (PTN000447754, fly Snap25 donor only) and derived presynapse marked over-annotated; mitochondrion, adherens junction and focal adhesion marked over-annotated; obsolete GO:0099638 modified to endocytic recycling; fusogenic activity TOO_GENERAL; protein-binding IPIs modified to syntaxin/SNARE binding or removed. Noted that the TLR4 recycling IDA rows (PMID:30811271) rest on mouse J774 cells.
