  summary: 'Review human ALDH16A1: a catalytically dead ALDH-superfamily pseudoenzyme'
  details: |
    8 GOA rows (7 REMOVE, 1 MARK_AS_OVER_ANNOTATED); no NEW. The aldehyde dehydrogenase IBA and the oxidoreductase IEA were removed as pseudoenzyme over-propagation: the catalytic Cys and Glu are lost and the recombinant human protein is inactive (PMID:30529746, confirmed by PMID:40897711). Generic protein-binding rows were removed. Thioredoxin inhibition (a single 2025 study) is recorded as an MF_DARK knowledge gap.
