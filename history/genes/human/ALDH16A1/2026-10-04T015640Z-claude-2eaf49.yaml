    Replaced the residue waiver with two MSA residue_claims (ALDH2 Cys319 and Glu285, both LOST, site_ref PANTHER:PTHR11699#aldh_nucleophile), backed by a new MAFFT script in ALDH16A1-bioinformatics. The target position is omitted, consistent with the family review. Thioredoxin active-site occlusion is now described as an AlphaFold2 inference. PMID:40897711's inactivity test is described as a consistent whole-lysate assay. Added the esterase-negative and no-NAD(H)-binding results from PMID:30529746 and a better membrane-HDA quote.
