  summary: 'Initial review of human ANKRD36C: wholly dark; NAS ion-channel-inhibitor
    row removed, contradicted by its own source'
  details: |
    The single GOA row, GO:0008200 ion channel inhibitor activity (NAS, PMID:8608414), is removed. That paper cloned an ANKRD36C cDNA fragment as the source of PTH-immunoreactive material and reports that its product does not inhibit phosphate transport; the inhibitor was a separate secreted factor. The reference is marked MISCITED. No other functional literature exists. Recorded as a WHOLLY_DARK knowledge gap.
