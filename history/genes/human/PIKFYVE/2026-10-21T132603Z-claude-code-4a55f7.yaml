  summary: 'Create review: PIKFYVE (reference relative for HORSE/PIKFYVE)'
  details: |
    De-novo full review of human PIKFYVE (Q9Y2I7), the experimentally characterised PTHR46715:SF1 ortholog and PAINT donor (PTN002928511/PTN002928512) for HORSE/PIKFYVE. It was written independently of ProtNLM2 predictions; deep research failed (falcon 403, perplexity-lite timeout), so the review uses cached primary literature and curated UniProt. All 88 GOA rows were reviewed. Core functions: PI3P 5-kinase (PI(3,5)P2 biosynthesis, PAS complex, early/late endosome and phagosome membranes, endosome-to-TGN retrograde transport), PI 5-kinase (PI5P biosynthesis), and serine autophosphorylation. Removed: the FIG4 phosphatase activity transferred via the Reactome complex and its PI3P-biosynthesis inference; two ISS rows sourced from the non-homologous STING1 (recorded as UniProt source_defects); and PI4P 5-kinase (type I PIP5K activity, a suspected PIP5K3 legacy-alias attribution). Metabolic-process terms were refined to their biosynthetic children. Downstream cell-type processes are kept as non-core. Added a NEW PI3P binding (FYVE) annotation.
