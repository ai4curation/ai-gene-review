  summary: 'Create review: SCARB2'
  details: |
    Created the full AI gene review for human SCARB2 / LIMP-2 (Q14108), reviewing all 88 GOA annotations. Established the lysosomal and late endosomal limiting membrane as the principal location with the large glycosylated domain facing the lumen, accepted the ER membrane as the site of GBA1 cargo capture, kept the plasma-membrane rows as a non-core minor pool that serves as the enterovirus 71 entry receptor, marked lysosome TOO_GENERAL and the single focal-adhesion proteomics hit over-annotated, and modified generic membrane to the lysosomal and late endosome membrane terms. The core function is the mannose-6-phosphate-independent cargo receptor that delivers glucosylceramidase to the lysosome; scavenger receptor activity propagated from the CD36/SR-BI node and transmembrane signalling receptor activity were modified to cargo receptor activity, with a propagation review recording the functional divergence of this family member. Lipid binding and phospholipid transport were kept as non-core secondary activities and the nine generic protein binding rows were removed under the project policy. Deep research providers were unavailable; evidence came from cached publications and UniProt and is recorded in SCARB2-notes.md.
