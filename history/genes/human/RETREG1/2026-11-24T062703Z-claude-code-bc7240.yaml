  summary: 'PR review follow-up: re-anchor GO:0090158, withdraw GO:0030574 as a proposed
    term'
  details: |
    Addressed the three requested changes on PR 6703, plus the optional suggestions. Network was reachable in this session (it was not in the review job), so the GO term definition and the MGI and comparator annotation rows were queried directly from QuickGO rather than taken on trust.

    (1) Re-anchored the NEW GO:0090158 endoplasmic reticulum membrane organization row. It was IMP on PMID:34338405, whose ER-morphology experiments are electron microscopy and immunofluorescence of mouse Fam134 single-knockout MEFs and which, for Fam134b specifically, refers back to Khaminets 2015. The row is now IMP on PMID:26040720, the human knockdown/overexpression evidence; PMID:34338405 is kept as corroboration and labelled as such, and PMID:31930741 added as the receipt for the RHD membrane-fragmentation participation argument that reason makes. The reviewer's LIR-dependence objection is answered in reason, and GO:0090158 is now attached to both core functions rather than to the membrane-bending one alone, because membrane leaves the ER network by being fragmented (RHD) and then committed to degradation (LIR). Recorded the comparator receipts (74 human GO:0090158 rows; ARL6IP1 IDA PMID:24262037, ATL3 IDA PMID:37102997 and IMP PMID:27619977, ATL1/ATL2/RTN4 IMP, RTN1/2/3 IBA, REEP5 ISS) and the MGI row for the parent term (Q8VE91, GO:0007029, IMP, acts_upstream_of_or_within, PMID:34338405, 2021-12-08).

    (2) Corrected the PMID:30559329 reference_review, which said "abstract-only in the cache" when publications/PMID_30559329.md has full_text_available: true (689 lines). The full text also separates the two loss-of-function approaches, which the abstract's "siRNA interference, CRISPR-Cas9 or knockout-mediated gene deletion" does not: the FAM134B siRNA screen is human Saos2 osteoblasts, while the FAM134B CRISPR-Cas9 knockout is mouse MEFs, rescued by wild-type human FAM134B but not a LIR-deleted mutant. Added a finding recording the split and quoting the MEF rescue.

    (3) Withdrew the NEW GO:0030574 collagen catabolic process row. The receipts the reviewer asked for were retrieved and they settle the row against itself. The MGI row is real (mouse Retreg1 Q8VE91, GO:0030574, IMP, acts_upstream_of_or_within, PMID:34338405, assigned_by MGI, 2021-12-08), but GO:0030574 is defined as "The proteolytic chemical reactions and pathways resulting in the breakdown of collagen in the extracellular matrix, usually carried out by proteases secreted by nearby cells", which locates the substrate in the ECM; RETREG1's cargo is misfolded procollagen that never leaves the ER lumen, and RETREG1 performs no proteolysis. The human comparator set agrees with that scope rather than against it: of 88 human rows, all are proteases, a protease inhibitor (CST3), or endocytic receptors for extracellular collagen (ITGB1 IDA PMID:10455171, MRC2 IDA PMID:12972549), so the ITGB1 precedent the earlier draft leaned on is definition-compatible and not a precedent for an ER-luminal client. QuickGO's ontology search for "collagen catabolic" returns only GO:0030574 and its three regulation children, so there is no better existing term. The claim is now a proposed_new_terms entry ("procollagen quality control by reticulophagy", proposed parent GO:0061709), carrying the definition, the comparator counts and the MGI receipt in its justification, and GO:0030574 was dropped from core_functions[0].directly_involved_in. This goes beyond what the review asked for, so it is spelled out in the gene notes and in the PR discussion.

    Optional suggestions also applied: isoform 2 loses the first three transmembrane helices (60-80, 96-116, 119-139), not two, and VSP_025686 additionally removes Ser-149 and the CAMK2B phosphoacceptor Ser-151 while Ser-153 falls just outside the replaced 142-152 segment and is retained (the reviewer's version had all three removed); the three UniProt quotes now carry record_section CC:SUBCELLULAR LOCATION, set by hand because backfill-record-sections leaves them alone when a quote matches two separate SUBCELLULAR LOCATION blocks, and the tool reports no mismatch afterwards; the notes' IBA reading no longer claims all three IBA rows list MGI:MGI:1913520, since the GO:0005789 row's WITH/FROM is PANTHER:PTN002823632|UniProtKB:Q9H6L5 only; the description and core_functions[1] no longer say the RHD is made of all four transmembrane helices, since UniProt's RHD region 84-233 excludes TM1 (60-80); and a source_defects entry (OUTDATED_STATEMENT, UNIPROT, requested_change CHECK, confidence SUSPECTED) now routes the by-similarity "Golgi apparatus, cis-Golgi network membrane" location upstream instead of leaving the question in reason fields. PMID:19838196 was left at correctness: VERIFIED; its review_notes already reason explicitly about DISPUTED and the reviewer called it defensible either way.

    Validation: 'just validate human RETREG1' valid with the same single pre-existing warning (REMOVE on GO:0061753 alongside ACCEPT on GO:0140506, the GO-release ancestry case docs/action_consistency.md names as an accepted judgement case). 'just validate-quotes' 30501 quotes verified, 0 failures; the RETREG1 review's own 70 quotes verify, and all 34 inline quotes in the notes file were checked verbatim against their sources.
