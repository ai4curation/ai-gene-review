  summary: 'PR review follow-up: correct the Golgi source_defects cause and scope'
  details: |
    Addressed the one remaining requested change on PR 6703, which concerned the two
    machine-readable fields of the source_defects entry that routes UniProt Q9H6L5's
    by-similarity "Golgi apparatus, cis-Golgi network membrane" location upstream. The
    substance of the entry (OUTDATED_STATEMENT / UNIPROT / requested_change CHECK /
    confidence SUSPECTED) is unchanged; only the cause and the scope sentence were wrong.

    (a) cause: LEGACY_ALIAS -> cause: OTHER. SourceDefectCauseEnum defines LEGACY_ALIAS as
    "An outdated gene name in the paper was mapped to the wrong current locus"
    (gene_review.yaml:4253), and no gene-name mapping is involved here: the mechanism is a
    by-similarity (ECO:0000250) transfer of a dated mouse statement that later work has not
    revisited. No enum value names that, so the explanation now states the mechanism and
    says why no specific value fits; cause: OTHER is also the commonest value in the corpus
    (781 entries) for exactly this situation.

    (b) Narrowed the claim that mapping the CC line to GO is "the sole source of the
    GO:0005794 and GO:0005801 rows". Verified against RETREG1-goa.tsv: there are three
    Golgi rows, and only two trace to the UniProt location - GO:0005794 (IEA, GO_REF:0000044,
    UniProtKB-SubCell:SL-0132, assigned_by UniProt) and GO:0005801 (ISS, GO_REF:0000024,
    UniProtKB:Q8VE91, assigned_by UniProt). The third, GO:0005801 IEA GO_REF:0000107
    (UniProtKB:Q8VE91|ensembl:ENSMUSP00000022881, assigned_by Ensembl), is an Ensembl Compara
    projection of the mouse GO annotation, as this file's own review of that row already said,
    so a UniProt fix would not remove it; clearing it needs the mouse annotation or the
    projection to change. The explanation now says this, and the same correction is mirrored
    in RETREG1-notes.md, where the point is worth making in its own right: one upstream
    request does not retire the Golgi claim.

    Optional suggestion 10 (dropping the GO:0030574 lookup line that this branch adds to
    cache/go/terms.csv) was not applied. The entry is a real term in sorted position, the id
    still appears in the review's prose and in the proposed_new_terms justification, and
    CLAUDE.md asks content PRs not to hand-edit the single-file shared caches.

    Validation: 'just validate human RETREG1' valid with the same single pre-existing warning
    (REMOVE on GO:0061753 alongside ACCEPT on GO:0140506, the GO-release ancestry case
    docs/action_consistency.md names as an accepted judgement case). 'just validate-quotes'
    31518 quotes verified, 0 failures, 0 baselined. No quote text was changed by this edit.
