  summary: 'Create review: RETREG1 (FAM134B), the founding ER-phagy receptor'
  details: |
    Created the human RETREG1/FAM134B gene review and notes for the ER_PHAGY project (issue 3957, first of the four unreviewed seed receptors). Fetched UniProt, GOA and publications with 'just fetch-gene human RETREG1'; no deep-research provider was reachable in this environment, so the notes were assembled by hand from the cached publications and the UniProt flat file and are labelled as such rather than named -deep-research-*. Reviewed all 28 GOA rows: reticulophagy, the GO:0140506 ER-autophagosome adaptor activity, endoplasmic reticulum and ER membrane accepted as core; the six bare GO:0005515 rows MODIFYed to GO:0140506 (every partner is an ATG8-family protein); negative regulation of neuron apoptotic process kept as non-core; sensory perception of pain and the Golgi/cis-Golgi rows marked over-annotated, the latter traced to a single 2009 mouse IDA transferred by similarity; the obsolete GO:0061753 row removed. Proposed three NEW rows after comparator checks in QuickGO: GO:0180020 membrane bending activity, GO:0090158 endoplasmic reticulum membrane organization, GO:0030574 collagen catabolic process. Validated with 'just validate human RETREG1' (valid, one documented GO:0061753 ancestry warning that docs/action_consistency.md records as an accepted judgement case) and 'just validate-quotes' (63 of 63 quotes verified).
