  summary: 'Initial AI review of human FGFR3 (P22607): all 439 GOA rows reviewed,
    core functions synthesized'
  details: |
    Reviewed all 439 GOA rows. 312 generic protein-binding IPI rows (300 from the PMID:32814053 Y2H screen plus chaperone/HTP interactomes) REMOVE as uninformative; FGF1 protein binding MODIFY to fibroblast growth factor binding. MODIFY: MAPK cascade to positive regulation of MAPK cascade; JAK-STAT to receptor signaling via STAT (GO:0097696); chondrocyte proliferation to negative regulation (GO:1902731); chondrocyte differentiation to negative regulation (GO:0032331). Broad skeletal developmental terms, ER/Golgi/vesicle/secreted-isoform locations, and context-dependent positive regulation of proliferation kept as non-core. Focal adhesion (TAS from abstract-only review) UNDECIDED. NEW heparin binding (IDA, PMID:14732692). Core functions: FGF receptor activity at plasma membrane in FGFR signaling/ERK activation; FGFR3-specific growth-plate restraint (negative regulation of chondrocyte proliferation/differentiation, negative regulation of developmental growth); FGF binding.
