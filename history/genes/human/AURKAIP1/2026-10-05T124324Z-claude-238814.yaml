  summary: 'Reviewer round 1: Aurora-A evidence base, mS38 translational role, bS22m name'
  details: |
    GO:0045862 now cites the 2007 ubiquitin-independent (PMID:17125467) and antizyme1 (PMID:17452972) follow-ups and remains non-core. Added the yeast mS38/Cox24 evidence (PMID:30968120, PMID:16339141). The knowledge gap is framed against the human result in PMID:23908630, where knockdown reduced all 13 mtDNA products, so the role is general rather than COX-selective. The nuclear rows now cite UniProt's nucleus line and its PMID:23908630 basis (ectopic expression). The description uses the bS22m name and notes the bacterial homolog. The IMM reason was rephrased, and the PMID:29677171 collision recorded.
