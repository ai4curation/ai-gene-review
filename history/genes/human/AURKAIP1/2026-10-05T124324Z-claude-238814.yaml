  summary: 'PAINT review of AURKAIP1: mitoribosome small-subunit protein mS38'
  details: |
    Rebuilt from a clean stub with affinage deep research. Accepted the mitochondrial small ribosomal subunit, mitochondrial translation and mitochondrial location rows (including 11 Reactome TAS). Kept the nuclear rows and positive regulation of proteolysis (Aurora-A degradation) as non-core. Added NEW structural constituent of ribosome (IDA). Changed the AURKA IPI to protein kinase binding and removed three IPIs. Flagged an affinage AKIP1/AURKAIP1 symbol collision.
