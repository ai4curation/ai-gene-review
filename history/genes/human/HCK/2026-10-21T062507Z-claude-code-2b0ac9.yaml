  details: |
    New review of 122 GOA annotations for hematopoietic cell kinase, a non-receptor Src-family tyrosine kinase. Core MF accepted as non-membrane-spanning protein tyrosine kinase activity; generic kinase and protein-phosphorylation terms MODIFIED to tyrosine-specific; bare protein binding REMOVED under policy (informative binding kept as phosphotyrosine residue binding and signaling receptor binding); mesoderm development MARK_AS_OVER_ANNOTATED. Numerous immune/actin processes and intracellular locations kept as non-core. Localization: intracellular, lipid-anchored to the cytoplasmic (inner) face of the plasma membrane plus caveolae, lysosomes (p61 isoform), focal adhesions and cytosol; no extracellular domain.
