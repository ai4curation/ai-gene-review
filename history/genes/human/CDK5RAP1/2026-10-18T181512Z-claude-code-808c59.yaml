  summary: 'Create review: CDK5RAP1'
  details: |
    Completed the first review of human CDK5RAP1, the mitochondrial MiaB-subfamily radical SAM methylthiotransferase that converts i6A37 to ms2i6A37 in mt-tRNA Ser(UCN), Phe, Tyr and Trp. All 27 GOA rows reviewed: ms2i6A37 synthase activity (GO:0035597), tRNA methylthiolation, mitochondrial tRNA modification, 4Fe-4S binding, mitochondrion and mitochondrial matrix accepted. Generic catalytic, transferase, methylthiotransferase, iron-sulfur, tRNA and RNA modification rows modified to the specific terms. Cytosol and nucleoplasm rows marked over-annotated, because the nuclear-RNA activity of the MTS-less variant was refuted by Fakruddin 2017. The ARBA protein-metabolism row marked over-annotated. NAS brain development and neuron differentiation rows removed as unsupported extrapolations from CDK5/p35 binding. CDK5 inhibition (IDA) and kinase binding kept as non-core. The cell-cycle TAS left undecided. Added Wei 2015 and Fakruddin 2017 as references, and recorded the Reiter 2012 nuclear-RNA finding as overturned.
    Added a NEW GO:1904047 S-adenosyl-L-methionine binding row (ISS, PMID:15339930) and a matching core function, for consistency with the LIAS and ELP3 reviews.
