  summary: 'Create review: MYL2'
  details: |
    De-novo review of human MYL2 (P10916) as the experimental reference for paralog MYL10, done independently of ProtNLM2 predictions. Falcon deep research failed on authentication and the perplexity fallback had no quota, so the review uses the GOA-cited papers plus mouse Myl2 donor papers (PMID:9422794, 16908724, 10409661, 1379240). All 45 GOA rows were reviewed. Calcium binding, structural constituent of muscle, cardiac muscle contraction, cardiac myofibril assembly, positive regulation of force, A band and muscle myosin complex were accepted. General terms were refined to specific ones the gene already carries. The muscle cell fate specification IBA was removed because its only donor is a promoter-reporter study. Four generic protein-binding IPIs were removed under the policy. Actin monomer binding (essential light chain paper) and actin cytoskeleton colocalization (nonmuscle phospho-RLC antibody) were left UNDECIDED. The review records which functions are human-experimental and which are inferred from the SF9 mouse/rat orthologs.
