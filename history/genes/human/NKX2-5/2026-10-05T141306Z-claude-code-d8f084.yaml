  summary: 'Create review: NKX2-5'
  details: |
    Created the full NKX2-5 review (136 GOA annotations). Automated deep research failed (falcon 402, OpenAI 401), so notes were compiled manually from cached publications and UniProt. Core functions: RNA Pol II sequence-specific DNA-binding TF activity at NKE elements (NPPA, GATA4), DNA-binding TF binding to GATA4/TBX5, and cardiac developmental roles (heart looping, cardiomyocyte differentiation, septation, AV node/conduction system development). Generic protein binding rows were modified to DNA-binding TF binding or transcription coactivator binding where supported, otherwise removed; ion transport, contraction, hemopoiesis, vasculogenesis and ectopic-overexpression process terms were marked over-annotated; spleen, thyroid and other pleiotropic developmental terms kept as non-core.
