  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch H13). GO:0032451 demethylase activity (IBD at PANTHER:PTN001585018) changed from MARK_AS_OVER_ANNOTATED to ACCEPT on the IBA row, and on the IDA row (PMID:19801555) for the same term to keep the two consistent; proposed_replacement_terms removed from both. The single seed of the node is human MMACHC itself through that IDA row. The earlier reason said demethylase implies oxidative or hydrolytic chemistry; the GO definition (QuickGO) is removal of a methyl group from a substrate with no mechanism stated, and GO:0016765, offered as the replacement, is defined for alkyl groups other than methyl. No GO term specific to alkylcobalamin dealkylation exists (a proposed_new_terms entry already covers it). Supporting quotes unchanged.
