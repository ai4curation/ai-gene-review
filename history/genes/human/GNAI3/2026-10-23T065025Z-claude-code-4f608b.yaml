  summary: 'Initial full AI review of GNAI3 (Gi alpha-3): all 77 GOA annotations reviewed,
    core functions and notes written'
  details: |
    Full de novo review of human GNAI3 (P08754). Deep research (falcon with perplexity-lite fallback) failed on authentication / provider unavailability, so the review is based on UniProt, GOA rows and cached primary literature; this is recorded in GNAI3-notes.md. Action counts: 34 ACCEPT, 18 KEEP_AS_NON_CORE, 6 MODIFY, 1 MARK_AS_OVER_ANNOTATED, 18 REMOVE (all 18 generic protein binding IPI rows, per the protein-binding policy). Core functions: G protein activity / GTPase activity / Gbeta-gamma binding in the heterotrimeric G-protein complex at the cytoplasmic side of the plasma membrane, in the adenylate cyclase-inhibiting GPCR signaling pathway. General pathway terms (GO:0007165, GO:0007186, GO:0007188 IBA/IEA) modified to GO:0007193; membrane to plasma membrane; guanyl nucleotide binding to GTP binding. GTP metabolic process marked over-annotated. Centrosome/midbody/Golgi/ER/lysosome/exosome/cytoplasm, cell division and positive regulation of macroautophagy kept as non-core. Added references PMID:8774883, 19211784, 20462955, 37137991, 22560091, 23315542, 2535845. Background paper PMID:42870023 (Deutsch et al. 2026) was checked and used Galphai1, not Galphai3, so it is not cited in the review.
