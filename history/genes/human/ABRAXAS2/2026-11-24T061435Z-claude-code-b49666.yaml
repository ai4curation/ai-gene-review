  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch H13). GO:0031593 polyubiquitin modification-dependent protein binding (IBD at PANTHER:PTN001272081) changed from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE on the IBA row, and on the IDA row (PMID:19261749, UniProt) for the same term to keep the two consistent. The two seeds are human ABRAXAS1 and ABRAXAS2 itself, both in the animal clade PTN001272082. The earlier IDA reason set the annotation aside because the cached abstract speaks of the BRCA1-A complex; the UniProt record of ABRAXAS2 cites the paper for ubiquitin binding and states that the protein binds polyubiquitin, and QuickGO shows the same paper gives the term to ABRAXAS1, BRCC3 and BABAM2. An abstract that does not name the gene is not a reason to overrule a full-text experimental annotation. A UniProt quote (CC:SUBUNIT) was added to both rows; existing quotes unchanged.
