  summary: 'Create review: AP5M1'
  details: |
    Full review of the 20 GOA rows on human AP5M1 (Q9H0R1), the mu subunit of the AP-5 adaptor complex, plus one NEW annotation: 13 ACCEPT, 4 MODIFY, 3 KEEP_AS_NON_CORE, 1 NEW (GO:0042147 retrograde transport, endosome to Golgi, IMP). All five IBA rows and all three UniProt-SubCell IEA rows carry propagation_review with source_entities. The five IBAs trace to a single node, PTHR16082/PTN002699615 at taxon:2759, seeded by AP5M1 itself, which is the valid self-referential configuration; four are NO_FAILURE_CORE or NO_FAILURE_NON_CORE and one is TERM_SCOPING_PROBLEM with GRANULARITY_MISMATCH, where GO:0030119 should be its child GO:0044599 AP-5 adaptor complex. The clathrin-node defect found in the merged AP3M1 review does not transfer: AP5M1 sits in a family of AP-5 mu subunits only, its IBDs are self-seeded, and GO:0030119 is not a clathrin-requiring term by definition. A bioinformatics analysis under AP5M1-bioinformatics derives the mu2 YxxPhi cargo pocket from PDB 1BXX heavy-atom contacts, verifies the PDB numbering against Q96CW1, and maps the 14 contacts across the mu family: AP5M1 retains 3 of 14 against 11 of 14 for AP4M1, losing all three closest contacts to the signal tyrosine, encoded as four residue_claims. The alignment is controlled against a correspondence published independently in PMID:40081374 and cross-checked against the merged AP3M1 analysis, with which the structure-derived contact set is identical. Affinage returned only the MUDENG cell-death literature and wrongly asserted that no adaptor-complex trafficking function is characterised for this gene; it is marked LOW_QUALITY. Validated with just validate (valid, one deliberate warning), checkquotes (68 quotes, 0 failures), gene_residue_claims (12 pass, 0 fail), a scripted GOA-to-YAML reconciliation (passed) and an AP3M1 cross-check (passed).
