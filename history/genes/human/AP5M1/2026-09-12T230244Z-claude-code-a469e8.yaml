  summary: 'Create review: AP5M1'
  details: |
    Full review of the 20 GOA rows on human AP5M1 (Q9H0R1), the mu subunit of the AP-5 adaptor complex, plus one NEW annotation: 13 ACCEPT, 4 MODIFY, 3 KEEP_AS_NON_CORE, 1 NEW (GO:0042147 retrograde transport, endosome to Golgi, IMP). All five IBA rows and all three UniProt-SubCell IEA rows carry propagation_review with source_entities. The five IBAs trace to a single node, PTHR16082/PTN002699615 at taxon:2759, seeded by AP5M1 itself, which is the valid self-referential configuration; four are NO_FAILURE_CORE or NO_FAILURE_NON_CORE and one is TERM_SCOPING_PROBLEM with GRANULARITY_MISMATCH, where GO:0030119 should be its child GO:0044599 AP-5 adaptor complex. The clathrin-node defect found in the merged AP3M1 review does not transfer: AP5M1 sits in a family of AP-5 mu subunits only, its IBDs are self-seeded, and GO:0030119 is not a clathrin-requiring term by definition. A bioinformatics analysis under AP5M1-bioinformatics derives the mu2 YxxPhi cargo pocket from PDB 1BXX heavy-atom contacts, verifies the PDB numbering against Q96CW1, and maps the 14 contacts across the mu family: AP5M1 retains 3 of 14 against 11 of 14 for AP4M1, losing all three closest contacts to the signal tyrosine, encoded as four residue_claims. The alignment is controlled against a correspondence published independently in PMID:40081374 and cross-checked against the merged AP3M1 analysis, with which the structure-derived contact set is identical. Affinage returned only the MUDENG cell-death literature and wrongly asserted that no adaptor-complex trafficking function is characterised for this gene; it is marked LOW_QUALITY. Validated with just validate (valid, one deliberate warning), checkquotes (68 quotes, 0 failures), gene_residue_claims (12 pass, 0 fail), a scripted GOA-to-YAML reconciliation (passed) and an AP3M1 cross-check (passed).
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  - references
  - knowledge_gaps
  summary: 'Review-round fixes: quote targeting and term-request reconciliation'
  details: |
    Follow-up to the CREATE event above, after two rounds of ai4c-reviewer review on PR #3030. Three defects in the original deliverable were found and fixed, two by self-audit and one by the reviewer. (1) The GO:0016197 endosomal-transport IBA cited a verbatim sentence about AP-5 copy number in HeLa cells to support a reason arguing from AP-5's repeated loss across model organisms; replaced with the loss clause of PMID:29381698 and the five-supergroup sentence of PMID:22022230. (2) Three compartment rows quoted the wrong compartment: the GO:0005765 lysosomal-membrane IEA cited the UniProt cytosol line, and the GO:0005764 IDA and GO:0031902 IEA cited an RPE sentence naming no compartment; replaced with the UniProt Lysosome membrane and Late endosome membrane lines and the PMID:40081374 co-localization sentence. (3) The proposed new term 'autophagic lysosome reformation' duplicated an existing request in genes/human/ZFYVE26/ZFYVE26-ai-review.yaml; the justification now quotes ZFYVE26's definition, states which of the two to take and why, and asks that the two be merged, with PMID:25365221 added as the primary evidence that the process exists and is named. Two further reviewer suggestions were declined with reasons recorded in a PR comment and accepted by the reviewer on re-review: re-pointing the NEW GO:0042147 row at PMID:23825025 (which does not establish the endosome-to-Golgi direction either), and editing the cytosol IBA's gene-product-to-term relationship type (which CLAUDE.md and the annotation-reviewer skill treat as inert). A crosscheck_ap3m1.py script was also added, comparing this gene's mu2 cargo-pocket derivation against the independent one in the merged AP3M1 review: the structure-derived contact set is identical and the projected assignments agree 14/14 for AP1M1 and AP3M1 and 12/14 for AP4M1. Final validation on the approved head commit 8fe73575efbb7050a67c278fc45a38db54519c66: just validate valid with one deliberate warning, checkquotes 75 quotes and 0 failures (superseding the 68 recorded in the CREATE event, which was written before these commits), gene_residue_claims 12 pass and 0 fail, GOA-to-YAML reconciliation passed, AP3M1 cross-check passed.
