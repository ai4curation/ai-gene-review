  summary: 'Create review: SEZ6'
  details: |
    Created the full AI gene review for human SEZ6 (Q53EL9), reviewing all 17 GOA annotations. Confirmed single-pass type I plasma membrane localization with the CUB and sushi ectodomain exposed on neuronal dendrites, accepting dendritic spine and dendritic shaft and keeping endoplasmic reticulum, neuronal cell body, perinuclear region and apical dendrite as non-core biosynthetic or finer compartments. Accepted regulation of dendrite development and synapse maturation as the core processes, keeping locomotory behaviour and cerebellar Purkinje cell layer development as non-core organismal outputs. The single generic protein binding row was removed under the project policy, which leaves no justified molecular function term, so the core function entry records locations and processes only and a ligand-identification experiment is suggested. Deep research providers were unavailable; evidence came from UniProt and is recorded in SEZ6-notes.md.
