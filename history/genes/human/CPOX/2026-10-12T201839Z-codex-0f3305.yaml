  summary: Clarify CPOX evidence and heme pathway scope
  details: |
    Restored compact supporting excerpts for catalytic activity, mitochondrial location, dimerization and contextual response annotations. Distinguished PAINT, ARBA, InterPro, EC, RHEA and orthology evidence in their own source-specific reasons. Added portable original-table and current-annotation locators without changing publication caches.

    Changed the existing heme-A annotation from UNDECIDED to KEEP_AS_NON_CORE after a complete current human/mouse/rat comparison demonstrated that upstream catalytic enzymes carry this pathway term. Retained the unresolved lens structural activity, clarified that mouse erythrocyte ghost proteomics does not establish membrane attachment, and distinguished that assay from independent rat peripheral-membrane evidence. Preserved all 31 original annotation source objects, 22 reference identities, both alternative products and the single catalytic core. Appended notes and regenerated the HTML.

    Validation, status calculation and rendering were run with the normal repository commands. The preserved broad-versus-specific heme-source decisions generate one advisory; no validation checks were skipped.
