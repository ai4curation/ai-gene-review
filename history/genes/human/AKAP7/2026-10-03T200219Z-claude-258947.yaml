  summary: 'First review of human AKAP7 short isoforms: PKA-CaV1 adaptor, with a contested
    cardiac role'
  details: |
    15 rows plus one NEW: 5 MODIFY, 5 ACCEPT, 4 KEEP_AS_NON_CORE, 1 UNDECIDED, 1 NEW. The entry (O43687) covers only the short lipid-anchored alpha and beta isoforms; the long gamma/delta forms with the 2H phosphoesterase domain are UniProt Q9P0M2, and nothing about them is imported. GO:0051018 refined to GO:0034237 to match AKAP1, AKAP5, AKAP9 and the mouse ortholog, with structural support on the beta isoform (PMID:27102985). GO:0008104 refined to GO:0072659 and the ion-transport TAS to GO:0051924 regulation of calcium ion transport, since an AKAP regulates rather than performs transport. NEW GO:0060090 molecular adaptor activity from direct CaV1.1 and CaV1.2 leucine-zipper binding (PMID:11733497, PMID:14569017), a term AKAP5 and AKAP9 carry by IBA. Four IDAs from an IKs reconstitution in which three unrelated AKAPs were interchangeable are kept as non-core; the action-potential row is UNDECIDED because the abstract reports currents only and the full text was inaccessible. The conflict between peptide disruption of CaV1.2 anchoring and a normal all-isoform knockout is recorded as a BIOLOGY knowledge gap; the mouse-only mossy-fiber synaptic annotations as a CURATION gap.
