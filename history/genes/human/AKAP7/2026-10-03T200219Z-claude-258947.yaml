  summary: 'First review of human AKAP7 short isoforms: PKA-CaV1 adaptor, with a contested
    cardiac role'
  details: |
    15 rows plus one NEW: 5 MODIFY, 5 ACCEPT, 4 KEEP_AS_NON_CORE, 1 UNDECIDED, 1 NEW. The entry (O43687) covers only the short lipid-anchored alpha and beta isoforms; the long gamma/delta forms with the 2H phosphoesterase domain are UniProt Q9P0M2, and nothing about them is imported. GO:0051018 refined to GO:0034237 to match AKAP1, AKAP5, AKAP9 and the mouse ortholog, with structural support on the beta isoform (PMID:27102985). GO:0008104 refined to GO:0072659 and the ion-transport TAS to GO:0051924 regulation of calcium ion transport, since an AKAP regulates rather than performs transport. NEW GO:0060090 molecular adaptor activity from direct CaV1.1 and CaV1.2 leucine-zipper binding (PMID:11733497, PMID:14569017), a term AKAP5 and AKAP9 carry by IBA. Four IDAs from an IKs reconstitution in which three unrelated AKAPs were interchangeable are kept as non-core; the action-potential row is UNDECIDED because the abstract reports currents only and the full text was inaccessible. The conflict between peptide disruption of CaV1.2 anchoring and a normal all-isoform knockout is recorded as a BIOLOGY knowledge gap; the mouse-only mossy-fiber synaptic annotations as a CURATION gap.
- type: REVIEW
  outcome: changed
  sections:
  - existing_annotations
  - references
  - description
  - core_functions
  summary: Round 2 - narrow the adaptor term, keep RII binding in core functions, commit missing records
  details: |
    The NEW row moves from GO:0060090 molecular adaptor activity, the root of the adaptor branch, to
    GO:0035591 signaling adaptor activity: both clients are proteins in one cAMP-PKA pathway, the
    same narrowing the sibling AKAP12 review makes. It now carries qualifier enables and records rat
    CaV1.2 (P22002) as the IPI partner, because the binding experiments used the rat channel.

    core_functions had dropped GO:0034237 entirely once the adaptor term took the molecular_function
    slot, although three rows are refined to it on crystallographic evidence. A second core function
    now carries it.

    The ion-transport TAS row's replacement moves from GO:0051924 regulation of calcium ion
    transport to GO:1901385 regulation of voltage-gated calcium channel activity, which names the
    mechanism shown (voltage-dependent potentiation), kept direction-neutral given the knockout.

    Three cited publication records (PMID:9545239, PMID:10613906, PMID:11299204) had been read
    locally but never committed, so most of the review's evidence was unverifiable from the
    repository. They are now committed, and each record's full_text_available matches what its
    review_notes claim. The pre-commit guard that missed this checked only that staged records are
    cited; it now also checks that every cited record is present in the branch or staged.
