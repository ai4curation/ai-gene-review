  summary: 'Create review: SREBF2'
  details: |
    Created the first full review of human SREBF2 (SREBP-2). All 119 GOA rows were reviewed against cached primary papers, the Horton 2002 review and the UniProt record. Core function: nuclear SREBP-2 is an SRE-binding RNA polymerase II transcription activator that drives cholesterol biosynthesis and LDLR uptake genes (GO:0001228, GO:0045542, GO:0032933, nucleus), and its ER-membrane precursor forms the SCAP complex that moves to the Golgi for S1P/S2P cleavage. General location and DNA-binding terms were refined. Context-specific repression (ABCA1, LRP1) was kept as non-core. Screen-derived and downstream-phenotype process rows (mitophagy, amyloid-beta clearance, starvation, laminar shear) were marked as over-annotated. Generic protein binding was removed or refined to coactivator and transcription factor binding. The NOT C-8 sterol isomerase row was removed because PMID:12941800 studies a different 206-aa protein named SRBP-2. Falcon deep research failed authentication and is recorded in the notes.
