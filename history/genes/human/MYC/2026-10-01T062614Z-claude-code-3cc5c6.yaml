  summary: Add premetazoan-origin assessment
  details: |
    Additive evolutionary-origin pass for the ORIGINS_OF_MULTICELLULARITY project. Read Young et al. 2011 (PMID:21571926; Monosiga Myc-Max heterodimerize, bind E-boxes, MbMyc nuclear), Brown et al. 2008 (PMID:18816399; E-box ribosome biogenesis promoter signature in Myc-bearing holozoans), Sebe-Pedros et al. 2011 and 2016 (PMID:21087945, PMID:27114036; Capsaspora Myc/Max/Mnt and Myc-motif sites at ribosome biogenesis genes) and Hartl et al. 2010 (PMID:20142507; Hydra). Classified the MAX-heterodimer E-box transcription factor activity as ancestral, ribosome biogenesis regulation as ancestral by computational inference, and proliferation, apoptosis and oncogenic roles as documented only in animals. Appended two sentences to description, added five references with reference_review, added two suggested_questions, created MYC-notes.md. No annotation actions changed. Track C: IBA node PTN001691821 reaches M. brevicollis MbMyc (A9V5B4) only with TF and nucleus terms; the proliferation node PTN002912196 is vertebrate-only.
