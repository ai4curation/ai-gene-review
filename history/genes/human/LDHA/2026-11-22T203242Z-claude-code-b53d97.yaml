  summary: Align the three general oxidoreductase parents with the 2026-11-14 TOO_GENERAL/MODIFY
    ruling
  details: |
    Companion to the LDHB record in the same change. LDHA carried the mirror image of LDHB's problem on the same three InterPro2GO IEA rows (GO_REF:0000002): MODIFY on GO:0003824, GO:0016491 and GO:0016616, each proposing GO:0004459 L-lactate dehydrogenase (NAD+) activity as the replacement.

    The maintainer ruling of 2026-11-14 requires a MODIFY to rest on this row's own evidence reaching the deeper term. These rows are InterPro2GO mappings from generic catalytic and oxidoreductase signatures, whose evidence stops at the general term, so none of them can carry a replacement to the EC-level child. GO:0003824 and GO:0016491 are therefore TOO_GENERAL (both verified as is_a ancestors of GO:0004459 via the QuickGO ancestors endpoint; GO:0004459 is ACCEPTed here, so this is the TOO_GENERAL ANCESTOR_OF ACCEPT pattern that action_consistency.yaml marks OK).

    GO:0016616 is ACCEPTed rather than marked TOO_GENERAL: it names the donor group and the acceptor, so it is informative on its own and is precisely what an LDH-family signature supports.

    Also replaced two supported_by quotes that cited EC=1.1.1.27. Under the current UniProt-quote rules an EC number is a label restating an annotation rather than evidence (uniprot_quote_restating_field), so both now quote the curated CC:FUNCTION sentence or the CC:CATALYTIC ACTIVITY reaction line, each carrying ECO:0000269 experimental evidence. Ran backfill-record-sections rather than hand-writing record_section.

    Not addressed here: LDHA has twelve bare GO:0005515 rows actioned MARK_AS_OVER_ANNOTATED, which the protein-binding policy flags as the wrong action. That is a separate, larger question and was left alone.
