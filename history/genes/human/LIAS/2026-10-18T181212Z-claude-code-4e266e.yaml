  summary: 'Create review: LIAS'
  details: |
    Created the first full GO annotation review of human LIAS (mitochondrial lipoyl synthase, O43766) for the RADICAL_SAM project. All 20 GOA rows were reviewed, and the project's treatment rule for generic radical SAM rows was applied: catalytic activity and sulfurtransferase activity were modified to lipoate synthase activity, and iron-sulfur cluster binding to 4Fe-4S cluster binding. The obsolete lipoate biosynthetic process rows were modified to their replaced_by term, protein lipoylation. The mouse-phenotype ISS rows (inflammatory response, oxidative stress, LPS response) were marked over-annotated. One NEW row was added for S-adenosyl-L-methionine binding. Wrote the description, core functions, notes, questions and experiments. Falcon deep research failed with an authentication error, so the Asta retrieval-only deep research was used; it returned no LIAS-specific papers, and the evidence came from cached primary literature (Warui 2022, Hendricks 2021, Saudino 2022, Dreishpoon 2023, Mayr 2011, mouse Lias studies), UniProt and Reactome.
