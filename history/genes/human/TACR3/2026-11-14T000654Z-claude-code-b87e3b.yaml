  summary: Add GO:0001659 temperature homeostasis (NEW)
  details: |
    Cross-species consistency pass on thermoregulation, after the companion mouse Tacr3 and mouse Tac2 reviews proposed GO:0001659 from mouse evidence. Revises this review's earlier decision not to propose any thermoregulatory term, which had checked only the heat-dissipation subtree (GO:0031653/GO:0031654/GO:0031656, no annotations in any species) and not their parent GO:0001659, the term the corpus actually uses. Added: one NEW row, GO:0001659 temperature homeostasis (EXP, PMID:28385352), a third core_functions entry for the thermoregulatory arm, a reference entry for the elinzanetant OASIS 1/2 trials (PMID:39172446), two clauses in the description naming the two directions of human evidence, and two further limits in the existing knowledge gap's boundary and resolution. Evidence: selective NK3R blockade reduces vasomotor episode frequency in randomised trials (MLE4901 phase 2, confirmed objectively by skin conductance; fezolinetant phase 3), which is receptor-specific evidence because the drug's target is this gene product; the ligand side (NKB infusion inducing flushes in healthy premenopausal women, with measured skin-temperature and sweating rises) supplies the eugonadal arm; rat and mouse median preoptic data supply the normal-physiology arm. Caveats carried on the row rather than hidden: the antagonist trials are in postmenopausal women, so they speak to the estrogen-deprived state; elinzanetant is a dual NK1,3 antagonist and so supports the pathway rather than this receptor; and no human experiment has measured core temperature during NK3R agonism or blockade. Comparator check (QuickGO, 2026-11-13): 26 human GO:0001659 rows, every one a transfer, including six GPCRs and two neuropeptides, against 42 mouse rows of which about twenty are IMP, and neither rodent Tacr3 ortholog carries the term in GOA, so there was nothing to transfer and the human-side absence is not a curator decision against the term. Evidence code chosen as EXP on the ECO argument that an agonist/antagonist exposure experiment is pharmacological assay evidence (ECO:0006053), which is neither the IMP class (ECO:0000315, whose descendants cover mutation, RNAi, morpholino, antisense and over-expression but no drug) nor the direct-assay class, and resolves to EXP; could not verify GO's own convention, because wiki.geneontology.org returns 403 from this environment, and that uncertainty is stated in the row. No existing row's action was changed. All 130 quotes across this review and TAC3 verified; just validate and just validate-quotes clean.
