  details: |
    Re-decided the general-term rows under the maintainer rule now in CLAUDE.md: MODIFY only when a deeper term exists and the row's own evidence (cited paper, signature mapping, donor annotation or PAINT node) supports it; otherwise keep a respectably specific term (ACCEPT if core) and reserve TOO_GENERAL for imprecise terms. Rows changed: GO:0004930 G protein-coupled receptor activity (IEA, InterPro:IPR000276) MODIFY -> ACCEPT, because the generic signature maps only to GO:0004930; GO:0008528 G protein-coupled peptide receptor activity (IEA, ARBA:ARBA00028017) MODIFY -> ACCEPT, the rule identifies no ligand; GO:0004995 tachykinin receptor activity (TAS, PMID:8990205) ACCEPT -> MODIFY GO:0016498, because the paper's rank order of potency puts neurokinin B ahead of NKA and substance P; GO:0007217 tachykinin receptor signaling pathway (TAS, PMID:8990205) ACCEPT -> MODIFY GO:0007209, from the paper's inositol phospholipid hydrolysis readout; GO:0016020 membrane (IEA, GO_REF:0000002) TOO_GENERAL -> MODIFY GO:0005886, because two of the row's signatures (IPR001013, IPR001681) are mapped in InterPro2GO to plasma membrane. Left unchanged, evidence stops at the term: the IBA and IEA tachykinin receptor activity rows (node spanning NK1R-NK3R; IPR001013 maps only to GO:0004995), the GPCR signaling pathway IEA row, and the plasma membrane, dendrite membrane and neuronal cell body rows, whose assays do not resolve the neuronal sub-regions. The tachykinin receptor activity rows now carry mixed actions (ACCEPT on IBA/IEA, MODIFY on TAS), which validation reports as a consistency warning; the difference is in the evidence. InterPro2GO mappings were read from rules/arba/_interpro2go.txt; GO ids checked against the local go.db.
