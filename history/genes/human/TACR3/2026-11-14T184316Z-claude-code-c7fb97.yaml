  summary: Record the flushing-circuit gap as BP_DARK, not CC_DARK
  details: |
    Review finding on PR #6363. The BIOLOGY knowledge gap about the central site and neuronal circuit by which human NK3R signalling triggers vasomotor flushing carried dark_aspect CC_DARK. CC_DARK in the schema means "Function known, but where/when unknown", which is about the gene product's own cellular component, and that is settled for this receptor: plasma membrane as the core location, with neuronal cell body and axon terminus rows kept as non-core. What is unknown is which circuit the receptor's signalling operates in to produce the flush, and whether that is the same KNDy/median-preoptic pathway that paces GnRH. That is BP_DARK, "an activity is known but not what it is for".

    The companion human TAC3 review already records the same gap from the ligand side as BP_DARK, so the two halves of one gap were filed under different aspects. The boundary field now states that the process and not the location is dark, and names the TAC3 counterpart. The gap statement, significance, resolution and provenance are unchanged, as is the GO:0001659 row the boundary bounds.
