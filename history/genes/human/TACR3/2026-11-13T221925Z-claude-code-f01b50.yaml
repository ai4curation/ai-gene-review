  summary: 'Create review: TACR3'
  details: |
    De novo review of human TACR3 (NK3R, neuromedin-K/neurokinin-3 receptor, P29371). Reviewed all 49 GOA rows. Core MF neuromedin K receptor activity (GO:0016498, IDA PMID:37391393 cryo-EM NK3R-Gq); core pathway phospholipase C-activating tachykinin receptor signaling (GO:0007209) via Gq; plasma membrane. Core physiology positive regulation of luteinizing hormone secretion (GO:0033686) ACCEPTED on human loss-of-function (PMID:19079066/20194706) plus KNDy (PMID:19776272) and rat antagonist (PMID:24863620) evidence. MODIFY general MF rows (GPCR activity, peptide-GPCR activity) to the specific receptor activity; TOO_GENERAL on membrane; REMOVE three bare protein-binding rows (receptor-ligand interactions) per policy. MARK_AS_OVER_ANNOTATED nine Ensembl-Compara IEA rows derived from rat central agonist pharmacology (heart rate, blood pressure, dopamine metabolism, cocaine, drinking, feeding, CPP, response-to-estradiol expression regulation, vagina development as a puberty marker). KEEP_AS_NON_CORE neuronal localisation subdomains, cAMP/adenylate-cyclase coupling (secondary, rat), direct uterine contraction, and sperm localisation/motility. Added one BIOLOGY knowledge gap (CC_DARK) on the human vasomotor/flush circuit. No NEW terms proposed; menopause/reproductive-senescence phase terms not proposed per GO phase-term rule. All abstract-only experimental rows kept (not removed) per do-not-overrule-curators rule. Validation clean (term, reference, quote checks pass); 60 quotes verified.
