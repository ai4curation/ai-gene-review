  summary: 'Create: GABRB1 full AI gene review'
  details: |
    New review of human GABRB1 (P18505), all 66 seeded GOA rows reviewed. GOA fetch needed a workaround: QuickGO returned HTTP 500 for includeFields=taxonName, so the fetch was re-run without that field (recorded in GABRB1-notes.md). Deep research (falcon with perplexity-lite fallback) failed (missing template in sparse checkout; perplexity provider unavailable); literature research done by hand from cached papers and recorded in the notes. SynGO provenance: the three GO:0099507 rows from PMID:26950270 (HEK293T expression) are MODIFY to GO:0022851 with context_dropped and a CONTEXT_NOT_ASSAYED source defect, and GO:0099505 is removed. Ensembl projections of wrong-gene SynGO seeds (mouse Gabrb1 from the GABA(B1) knockout PMID:11498050; rat Gabrb1 from the GABA-B immunogold PMID:15174078) carry WRONG_GENE_PRODUCT/SYMBOL_COLLISION defects filed to SYNGO: GO:0099528, GO:0098685 and GO:0048787 removed, GO:0007186 removed as derived from GO:0099528, GO:0099634 kept as non-core on the biology, and GO:0098982 accepted because its rat source (PMID:16469775) is genuine. Validated with just validate human GABRB1 (pass) and the quote checker (114 verified).
