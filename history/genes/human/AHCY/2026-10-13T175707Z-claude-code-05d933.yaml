  summary: Resolve the AHCY extracellular-exosome row conflict between the OMICS_EVIDENCE
    audit and the one-carbon slice review
  details: |
    Conflict resolution during a merge of origin/main into the one-carbon/amino-acid slice branch for PR 4818.

    main carried PR 4564 (the OMICS_EVIDENCE audit, re-reviewed 2026-10-10) and this branch carried its own review of the same two AHCY extracellular-exosome HDA rows (GO:0070062 from PMID:23533145, the EPS-urine exosome proteome, and from PMID:20458337, the B-cell-derived exosome proteome). Both diverged from 727e2c2c3 and both independently reached action KEEP_AS_NON_CORE, so the verdicts were never in conflict; only the summary and reason prose was.

    Resolved by merging the prose rather than taking a side, on the principle this repository applies to duplicate blocks: each side is somebody curation and the two usually differ. main framing is kept as written, because it is the corpus-wide convention for this class of row and carries the MISEV2018 category-2b citation (PMID:30637094) and the audit provenance note. This branch findings are appended after it, per row: that the accessible text of the EPS-urine source does not expose the AHCY-specific identification, peptide specificity or enrichment controls; that for the B-cell row the recovered main paper describes the purification and the peptide and replicate criteria behind the 539-protein list but its AHCY-specific supplementary table was not recovered; and that in both cases the row therefore rests on curator deference rather than on an identification this review could audit. AHCY independent detection in human urinary exosome preparations (PMID:19056867) is noted so the deference is not read as doubt about EV detection as such, and the original statements that neither cytosolic abundance nor the absence of a known extracellular catalytic role refutes the curator assignment are preserved.

    Validation: AHCY-ai-review.yaml validates, as do the six other reviews the merge auto-merged (ALDH7A1, CAD, GLUL, MTHFD1, PDXK, SMS); conf/local_quote_baseline.yaml auto-merged with no duplicate keys and no AHCY entry; the branch now merges cleanly into origin/main.

    Note on cost: the push carrying this resolution drops the approval the PR held, which is the accepted cost of resolving a conflict rather than leaving the PR unmergeable.
