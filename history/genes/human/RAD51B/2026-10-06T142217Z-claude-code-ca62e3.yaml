  summary: 'Create review: RAD51B (BCDX2 RAD51 paralog)'
  details: |
    New human RAD51B review, triggered by PMID:42682019 (Dwivedi et al. 2026, RAD51 paralog
    review). All 68 GOA rows were reviewed. 17 protein-binding IPI rows were REMOVEd as
    uninformative; the paralog interactions are captured by GO:0033063. GO:0140664 (IEA) and the
    speculative TAS for reciprocal meiotic recombination were marked over-annotated.
    GO:0097435 was MODIFYed to GO:0000730 DNA recombinase assembly, consistent with the RAD51C and
    XRCC2 reviews. RAD51B ATPase rows were accepted, because RAD51B is one of the two catalytic
    ATPases of BCDX2 (PMID:37344587). NEW GO:0031297 replication fork processing was added
    (IDA, PMID:37843130). There are three core functions: BCDX2 RAD51 filament mediator (with the
    proposed MF 'DNA recombinase loader activity', reused from RAD51C), DNA-stimulated ATPase, and
    fork protection. Deep research providers failed (falcon 402, openai invalid key), so the
    research is recorded in RAD51B-notes.md. Validated with just validate human RAD51B.
