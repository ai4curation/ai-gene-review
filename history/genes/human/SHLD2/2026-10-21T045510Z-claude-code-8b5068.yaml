  summary: Full re-review of SHLD2 (ProtNLM2 benchmark Q86V20), independent of predictions
  details: |
    Full re-review independent of ProtNLM2 output. Added NEW GO:0003697 single-stranded DNA binding (IDA, PMID:30022168; SHLD2C binds ssDNA at ~10 nM) and made it the first core MF; adaptor (scaffold) activity kept as a second core function. Brought GO:0005515 rows into line with the protein-binding policy: SHLD1/SHLD3/REV7 MODIFY to GO:0030674 on the basis of N-/C-terminal mapping; TP53BP1/RIF1/ASTE1 REMOVE as uninformative. Chromosome rows MODIFY to site of double-strand break. Somatic diversification of immunoglobulins MODIFY to isotype switching. IBA regulation of HR MODIFY to negative regulation, with propagation_review added. Recorded the isoform issue: the UniProt displayed 835-aa sequence is the short splice form lacking 69 residues of OB fold B (likely SHLD2S, defective in HR suppression); the literature uses the 904-aa long form (Q86V20-2). Relative identified: mouse Shld2 Q3UEN2 (PTHR14495:SF2), not yet reviewed.
