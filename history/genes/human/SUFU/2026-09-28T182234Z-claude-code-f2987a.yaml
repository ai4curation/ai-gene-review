    Reviewed all 143 seeded GOA annotations for human SUFU (Q9UMX1), replacing every PENDING action. Distribution: 59 ACCEPT, 59 REMOVE, 20 MODIFY, 4 KEEP_AS_NON_CORE, 1 MARK_AS_OVER_ANNOTATED, 0 UNDECIDED, 0 NEW. Wrote the top-level description and two core functions (GO:0140311 protein sequestering activity; GO:0030674 protein-macromolecule adaptor activity for GLI3R production). All 74 GO:0005515 protein-binding rows were adjudicated under the repository policy: 13 GLI1/GLI2/GLI3 rows MODIFY to GO:0140297 DNA-binding transcription factor binding, 2 STK36 rows to GO:0019901 protein kinase binding, 1 FBXL17 row (PMID:27234298) to GO:0031625 ubiquitin protein ligase binding, and 58 large-scale interactome rows REMOVE as uninformative. GO:0006355 and GO:0007165 rows modified to the informative children GO:0000122 and GO:0045879. Two Ensembl Compara rows traced to rat IEP donors were downgraded: GO:0007286 spermatid development MARK_AS_OVER_ANNOTATED, GO:2001040 positive regulation of cellular response to drug REMOVE. IBA rows judged against PAINT node PTN000859153 in interpro/panther/PTHR10928/PTHR10928-paint.tsv and accepted. Added a research journal at genes/human/SUFU/SUFU-notes.md with verbatim-checked citations, reference_review entries for 15 references, suggested questions and experiments. Nothing found that contradicts modules/hedgehog_signaling.yaml or the PTHR11309/PTHR11889 family reviews.
