  summary: 'Create review: TBXT'
  details: |
    Created a DRAFT review of human TBXT (Brachyury, O15178) for Track B of ORIGINS_OF_MULTICELLULARITY. All 37 GOA rows reviewed: 21 ACCEPT, 11 KEEP_AS_NON_CORE, 4 MODIFY (generic IEA/NAS transcription terms to GO:0000981 or GO:0045944), 1 REMOVE (signal transduction NAS, unsupported); 2 NEW (GO:0001228 activator activity from MesP1 promoter data; GO:0030903 notochord development, carried by mouse T by IMP). Core functions: T-site DNA-binding Pol II activator (ancestral, motif conserved in Capsaspora Brachyury per PMID:24043797) and mesoderm/notochord developmental regulation (animal-specific target specificity; notochord chordate-specific). Notes record that deep research was unavailable and that no GO-CAM includes TBXT.
