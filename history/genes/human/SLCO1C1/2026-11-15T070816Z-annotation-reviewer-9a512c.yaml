  summary: De-novo review of all 68 GOA annotations for SLCO1C1 (OATP1C1), high-affinity
    thyroid hormone transporter at brain barriers
  details: |
    Reviewed every GOA row for SLCO1C1 (Q9NYB5, OATP1C1). High-affinity T4/rT3 (not T3) transporter; Na+-independent, pH-insensitive (lacks the conserved TM3 His) -- experimentally facilitative. Mediates thyroid hormone entry into the CNS across the blood-brain and blood-CSF barriers (with MCT8). Core MF GO:0015349 thyroid hormone transmembrane transporter activity (IDA x2 + IMP; QuickGO: is_a GO:0015291 secondary-active -> GO:0022857). GO:0015347/GO:0008514 obsolete, not used. Core processes GO:0070327 thyroid hormone transport + GO:0150104 transport across blood-brain barrier (OATP1C1 performs the transport step -> participation test passes, ACCEPT as for MCT8). Actions (68): 42 REMOVE (bare GO:0005515 PDZ-scaffold IPI rows), 15 ACCEPT (GO:0015349 x3, GO:0070327 x3, PM x4, basolateral x3, GO:0150104 x2), 7 TOO_GENERAL (GO:0015291 ancestor-of-core, GO:0022857 x2, GO:0055085 x3, GO:0016020), 3 MARK_AS_OVER_ANNOTATED (GO:0015125+GO:0015721 bile-acid IBA over-propagation onto a substrate-selective member, propagation_review PROPAGATION_BAD; GO:2000611 positive regulation of thyroid hormone generation, supplies substrate to deiodinases but does not generate hormone, participation-test fail), 1 KEEP_AS_NON_CORE (GO:0043252 Na-independent organic anion transport, broader-than-core, not an is_a ancestor of GO:0070327). Flagged the GO:0015349 facilitative-vs-secondary-active placement as a suggested_question, consistent with MCT8/MCT10 (OATP1C1 is facilitative, unlike the antiporter OATPs). source_defects: none. Batch 12.
