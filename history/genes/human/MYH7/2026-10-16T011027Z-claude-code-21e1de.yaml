  summary: 'Create review: MYH7'
  details: |
    New review of human MYH7 (P12883, slow/beta-cardiac myosin heavy chain). All 48 GOA rows reviewed: ACCEPT 14, MODIFY 22, REMOVE 7, MARK_AS_OVER_ANNOTATED 5, plus 1 NEW (GO:0008307 structural constituent of muscle, after a QuickGO comparator check against other muscle myosin heavy chains). General CC terms were refined to striated muscle myosin thick filament and muscle myosin complex; contraction terms to cardiac muscle contraction and slow-twitch skeletal muscle fiber contraction. Removed: stress fiber and Z disc (IEA projections inconsistent with sarcomere architecture), regulation of heart rate (the cited study measured rate of force redevelopment in skinned cells), and four generic protein binding rows. Developmental terms derived from cardiomyopathy phenotypes were marked over-annotated. Deep research: falcon failed authentication; openscientist succeeded. 31 publications fetched into publications/. Validated with just validate human MYH7.
