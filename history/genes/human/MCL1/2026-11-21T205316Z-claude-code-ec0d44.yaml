  summary: 'IBA REMOVE re-review: GO:0015267 changed from REMOVE to MARK_AS_OVER_ANNOTATED'
  details: |
    Re-review of the IBA row GO:0015267 (channel activity) against the PTHR11256 tree (projects/IBA_REVIEW/rereview-2026-11-21, batch 05). The IBD sits at the family root PTN000135648 with three seeds, human BCL2, BAX and BAK1, in three child clades; QuickGO confirms BCL2 IDA PMID:9219694, BAX IDA PMID:9219694 and BAK1 IDA GO:0015288 PMID:22006182, and returns only the IBA for MCL1. The earlier REMOVE rested on MCL1 not being known as a channel and on the term belonging to the pro-apoptotic side (failure mode REGULATORY_SIGN_INVERSION). The seed list contradicts the second point, since pro-survival BCL2 is a seed, and absence of data on the target is not a ground for removing an IBA. No evidence of loss in MCL1 was found. The action was changed to MARK_AS_OVER_ANNOTATED, in line with the KEEP_AS_NON_CORE given to the same PAINT row on BCL2 and Buffy, and the summary, reason and propagation_review were rewritten. No other row was touched. Validated with just validate human MCL1 (valid; warnings pre-existing).
