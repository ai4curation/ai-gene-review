  summary: 'Create review: RAD51D (BCDX2 RAD51 paralog)'
  details: |
    New human RAD51D review, triggered by PMID:42682019. All 143 GOA rows were reviewed. 87
    protein-binding IPI rows (mostly HuRI/Y2H) were REMOVEd. GO:0008094 (IDA and IBA) and
    GO:0140664 (IEA and IMP) were marked over-annotated, because cryo-EM shows RAD51D binds ATP
    but lacks the catalytic glutamate (PMID:37344587, PMID:41196948); a residue claim was added to
    the IBA propagation_review. Gamma-tubulin binding (IDA) is UNDECIDED (abstract-only source).
    Telomere, centrosome and meiotic rows were kept as non-core. GO:0097435 was MODIFYed to
    GO:0000730. NEW GO:0031297 (IMP, PMID:32669601) and GO:0036297 (IMP, PMID:16717288) were
    added. Core functions cover the BCDX2 mediator role, X3CDX2 filament capping and homologous
    pairing (PMID:41196948, PMID:42020761), and fork processing. Deep research providers failed,
    so the research is recorded in RAD51D-notes.md. Validated with just validate human RAD51D.
