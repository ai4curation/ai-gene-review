  summary: 'IBA REMOVE re-review: sulfate rows changed from REMOVE to MARK_AS_OVER_ANNOTATED'
  details: |
    Re-review of the IBA REMOVEs on GO:0015116 sulfate transmembrane transporter activity (IBD at PTN000929279) and GO:1902358 sulfate transmembrane transport (IBD at PTN000212046). The earlier reason was that SLC26A3 is not a seed at these nodes, which is not a ground for removing an IBA. Tree: the seeds include human SLC26A2, SLC26A6, SLC26A7 and SLC26A8 inside the vertebrate SLC26 radiation PTN002273826, and SLC26A8 is the sister paralog of SLC26A3 under PTN008527461, so the IBD is not misplaced. Evidence on the gene is mixed (PubMed abstracts: sulfate transport reported in PMID:7744840 and PMID:9473459, undetectable in PMID:12651923), so loss is not established. Both IBA rows changed to MARK_AS_OVER_ANNOTATED with rewritten reasons and propagation_review; for consistency the IEA row on GO:1902358 and the IEA row on the child term GO:0008271 were changed the same way. Notes file appended. The three PMIDs are not in the publications cache, so they are cited in prose only and no supporting_text was added.
