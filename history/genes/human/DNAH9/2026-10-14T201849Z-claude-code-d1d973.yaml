  details: |
    Reviewed all 35 GOA annotations for DNAH9 (20 ACCEPT, 5 KEEP_AS_NON_CORE, 5 MARK_AS_OVER_ANNOTATED, 4 MODIFY, 1 UNDECIDED). Protein binding (IPI ODAD1) modified to protein-containing complex binding; HPA centriole and sperm end piece rows marked over-annotated because PMID:31178125 shows DNAH9 absent from the sperm axoneme; sperm flagellum IDA from PMID:39503742 left UNDECIDED; dynein complex modified to outer dynein arm; light intermediate chain binding marked over-annotated. Core function: minus-end-directed microtubule motor of distal type 2 outer dynein arms. Falcon deep research failed twice with a provider authentication error, so no deep-research file was used. QuickGO IBA sets identical for human and mouse. just validate human DNAH9 passes.
