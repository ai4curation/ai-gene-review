  summary: 'Round 21: GO:1902494 and both GO:0003723 rows to TOO_GENERAL'
  details: |
    Round 21 of PR #4810. The reviewer accepted all six round-20 fixes and both of my corrections to its
    round-20 table, then found four more rows of the same class that my re-scan had reported as zero.
    Its critique of the scan is the more important half, and it is right: my pattern was derived from
    the instances already in hand (less specific, general term, more general) rather than from the
    rule's own terms, so correct but general and correct but nonspecific went past it. The rule names an
    action/reason mismatch, so the scan that settles it has to key on the action and read every reason.

    Two scans were run this round instead of a wider phrase list.

    The first was structural, and it failed usefully. For every ACCEPT or KEEP_AS_NON_CORE row, ask
    whether its term is a strict is_a/part_of ancestor of another kept term in the same file, resolved
    from the QuickGO ancestors endpoint for all 171 distinct terms in the slice. That returns 73
    candidates, about eighteen times the real set, because keeping a general term beside a specific one
    is ordinary and correct - GOA carries both rows and the review keeps both. So the structural relation
    is not the rule, and a scan built on it would have been a different kind of wrong.

    The second is what the reviewer prescribed. Key on the action, take all 250 ACCEPT and
    KEEP_AS_NON_CORE rows in the slice, filter on any mention of breadth, specificity or
    informativeness at all (general, specific, nonspecific, non-specific, uninformative, subsum, entail,
    parent of, broad, root-level, precise), and read the 28 that returns by eye rather than
    pattern-matching them. Reading is what the rule requires, because the same words carry both senses -
    a sequence-specific subunit and a context-specific role are about the gene, not about the term's
    breadth.

    That found the reviewer's four and five more it had not listed. The nine, with each ancestry relation
    confirmed against QuickGO before it was written:

    - SUCLA2 GO:1902494 catalytic complex, TOO_GENERAL. GO:0009361 is accepted on two rows and is the
      core in_complex, and GO:0042709 is accepted.
    - TRMT10C GO:1902494 catalytic complex, TOO_GENERAL. GO:0030678 and GO:0043527 are accepted and in
      core_functions, GO:1902555 is kept.
    - TRMT10C GO:0003723 RNA binding, two rows, TOO_GENERAL. GO:0000049 tRNA binding is accepted on IBA
      and IDA rows and names the functionally relevant substrate. Both rows share one argument so they
      take one action, which is the class-level discipline this gene's notes already follow.
    - FBXL4 GO:0005737 cytoplasm, MODIFY to GO:0005741. Not in the reviewer's list. The reason already
      said the informative location is the mitochondrial outer membrane, and the gene carries GO:0005741
      on two accepted rows including IDA.
    - TARS2 GO:0000166 nucleotide binding, TOO_GENERAL. Not in the reviewer's list. GO:0005524 ATP
      binding is kept and entails it; the reason's informative function, threonine-tRNA ligase activity,
      sits in a different branch and so is not a refinement target, which is why this is TOO_GENERAL
      rather than MODIFY.
    - TARS2 GO:0005737 cytoplasm, MODIFY to GO:0005759. Not in the reviewer's list. The reason already
      said TARS2 acts in the mitochondrial matrix, which is an accepted row.
    - UCP2 GO:0006839 mitochondrial transport, TOO_GENERAL. Not in the reviewer's list. GO:1990542 is
      accepted on IBA and IMP rows. This is the same shape as the GO:0055085 row converted last round.
    - UCP2 GO:0031966 mitochondrial membrane, MODIFY to GO:0005743. Not in the reviewer's list, and the
      sharpest of the five: its reason read "Correct parent of inner membrane" while the GO:0005739 rows
      in the same file had just been refined to GO:0005743, and MFF's GO:0031966 row was already MODIFY
      to GO:0005741. That is the internal inconsistency the reviewer flagged for MFF in round 20,
      surviving in a file the same push had edited.

    Three rows keep their action and have prose corrected instead, because no refinement target exists:

    - MFF GO:0032991 protein-containing complex. The reviewer's first suggestion. The action was right
      and the phrase True but uninformative, which is TOO_GENERAL's definitional wording, was what made
      it read wrong. It now leads with why no more specific complex term is establishable.
    - SUCLA2 GO:0046872 metal ion binding. The reviewer's second suggestion. Its summary said "the
      parent of the magnesium-binding row above" while its reason argued a cofactor detail, so the two
      slots pointed at different actions. The summary no longer states the ancestor relation; the reason
      never argued generality and is unchanged.
    - SUCLA2 GO:0016878 acid-thiol ligase activity. Not raised by the reviewer. Its reason said "Correct
      but general and secondary to the core activity", which is the forbidden pattern by the letter of
      the rule, but the term is deliberately broader rather than insufficiently precise - it covers the
      heterodimer's promiscuous formation of other acyl-CoAs such as malyl-CoA, which the specific
      succinate-CoA ligase terms do not. The reason now says that, so the non-core judgement rests on
      peripherality rather than on breadth.

    One error caught in the editing rather than after it, recorded because it would have been invisible
    in review. The edit for SUCLA2 GO:0046872 was keyed on the phrase "cofactor detail of the core
    activity", which appears in the reasons of both that row and the GO:0000287 magnesium row, and the
    matcher took the first. The replacement text landed on GO:0000287 and asserted, on the magnesium row
    itself, that the magnesium-specific row was non-core for the same reason - self-referential nonsense.
    It was caught by re-running the prose scan and reading the output rather than the exit status, and
    GO:0000287 was restored verbatim from the previous commit. The lesson is the round's own lesson one
    level down: a key derived from the text in hand matches more rows than the one intended.
