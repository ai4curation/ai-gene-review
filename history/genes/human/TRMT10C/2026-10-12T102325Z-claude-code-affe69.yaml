  summary: 'Round 5: correct the claim that HSD17B10''s review is a stub'
  details: |
    Round 4's reason dismissed the HSD17B10 counterexample by asserting that its review is still INITIALIZED and so its silence records that nobody has looked rather than a curator's judgment. That is wrong, and wrong in the way that does the most damage: it tells the next curator there is nothing to check. HSD17B10-ai-review.yaml carries 101 reviewed rows (49 ACCEPT, 36 KEEP_AS_NON_CORE, 16 MARK_AS_OVER_ANNOTATED, none unreviewed), three authored core functions and proposed_new_terms as an explicit empty list, and HSD17B10-notes.md has a Core functions authored section. Its status field is stale metadata rather than a signal; 536 human reviews in this repository carry INITIALIZED against 1956 COMPLETE. More to the point, its third core function does not merely omit GO:0004526, it chooses a different model for the same moonlighting subunit role: GO:0000049 tRNA binding with in_complex GO:0030678. So there is a recorded judgment to argue with, and the reason now says what is there and that the nuclear comparator warrants the same contributes_to proposal for HSD17B10, flagged rather than changed since it is outside this slice. The error was mine in the same shape I have been correcting elsewhere this session: inferring from a metadata field rather than reading the content it describes, having run grep for status and stopped. The reason also narrows round 4's framing: TRMT10C itself carries GO:0000049, so the two reviews are not modelled two ways wholesale - both carry tRNA binding and complex membership and this proposed row is the single difference. Separately, the QuickGO comparator result that is the strongest evidence for the row existed only as prose in the reason, and the nuclear subunit genes have no folders here, so a reader had no way to check it. TRMT10C-notes.md now records the exact query, the date, the 40 annotations it returns grouped by symbol and qualifier, and what HSD17B10's review actually contains - the same treatment the tRNA notes give their HGNC queries.
