  summary: 'Round 6: attribute PRORP to the mitochondrial complex'
  details: |
    The comparator argument opened on the nuclear RNase P holoenzyme and then listed PRORP as the member carrying enables, which read as placing PRORP among the nuclear subunits. PRORP is mitochondrial: QuickGO gives it part_of GO:0030678 four times, the mitochondrial ribonuclease P complex. The nuclear catalyst is the RPPH1 RNA, so no nuclear protein subunit carries enables at all. Correcting this strengthens the argument rather than weakening it, which is why it was worth a round: the comparator set is now ten protein subunits standing in exactly this row's position, all carrying this row's term with this row's qualifier, with no protein counterexample inside that complex, and PRORP named as the mitochondrial counterpart and the only protein in either complex that enables the activity, because there the catalyst is a protein. The notes table gains a complex column recording the same distinction, since its previous grouping put PRORP in a list otherwise made of nuclear subunits, and the preamble now states the convention as enables for whatever does the chemistry rather than for a named gene.
