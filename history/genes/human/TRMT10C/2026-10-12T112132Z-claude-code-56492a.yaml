  summary: 'Round 10: source the complex column from a query instead of inferring
    it'
  details: |
    The notes table's complex column read nuclear or mitochondrial, which the logged GO:0004526 query cannot establish: that query returns gene product, qualifier and evidence and says nothing about complex membership. The round-9 row recorded ten RNAcentral ids as not named as RPPH1 and then assigned them nuclear anyway, which is an attribution filled into an aggregate cell one column over from the one round 9 had just emptied. Rather than hedge the cell, the column is now sourced: queries for GO:0005655, GO:0030677 and GO:0030678 plus a per-id query for each of the fourteen ncRNA ids, all logged beside the other two. The result is more informative than either nuclear or a dash. Every one of the ten protein subunits is annotated to GO:0005655 nucleolar ribonuclease P complex, four of them also to its generic parent GO:0030677; PRORP is in GO:0030678 only; and all fourteen ncRNA ids, RPPH1's four included, are in GO:0030677 only. So no ncRNA id is recorded as a nucleolar-complex member at all, which nuclear would have hidden and which is consistent with reading those enables rows as a Rfam-style electronic propagation rather than curated subunit annotations. The column now records the term each gene product is actually annotated to rather than a reading of it. Separately the review reason said RPPH1 carries enables while the ten protein subunits carry contributes_to, omitting the ten further ncRNA enables rows the notes itemise; a clause now names them, so the reason and the notes say the same thing, which is the property rounds 6 and 7 were spent establishing. The reviewer's sharpening of the pattern is the one worth keeping: in each of these rounds there was a checkable fact one query away and a cheaper inference available from something already in hand - a status field instead of 101 rows, an earlier parse instead of the live query, a bucket label instead of fourteen ids, and here a nuclear reading instead of the complex terms. The remedy was the same substitution in reverse every time, and running the query rather than hedging the cell is that substitution applied once more.
