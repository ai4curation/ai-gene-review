  summary: 'Round 8: put the exceptions in the table, not only the prose'
  details: |
    Round 7 added the two ComplexPortal rows to the notes qualifier table on the stated ground that a reader re-running the query meets them and would otherwise read them as counterexamples. That reasoning applies with more force to the POP5, RPP30 and RPP40 enables rows, which are the counterexamples that forced the round-7 correction, and those were left in prose only while the table listed the three genes as contributes_to by IDA and nothing else. A reader who checked the table and stopped there would have come away with the round-6 absolute the round had just retracted. So the rule the round stated was applied to the new case and not to the case it came from, which is the same inconsistency in a different place. The three enables rows are now table rows, marked as the exceptions. The table also gains a per-row annotation count, so its rows sum to 40 and the hit count is reconstructible from the table rather than asserted beside it; that makes the nothing-truncated-at-limit-100 check verifiable in the branch. Counts were taken from the live query: POP1 3, five subunits 1 each, RPP38 2, POP5 1+1, RPP30 1+1, RPP40 2+1, PRORP 7, 14 ncRNA ids for the nuclear catalyst, and the two ComplexPortal rows. Separately, the review prose said 'RPPH1 carries enables, while all ten of its protein subunits', whose nearest antecedent is RPPH1, the RNA; the intended antecedent is the holoenzyme, and it now says so. That is grammar rather than fact, but all three of the preceding rounds' errors turned on a quantifier or an attribution in exactly this position, so it is worth closing rather than leaving to a careful reader. The reviewer's observation on the pattern is recorded here because it identifies the remedy: the errors were never in the term, action or qualifier, always in the sentence explaining them, which is the part of a reason that no validator checks. Putting every exception in the machine-readable table gives that prose something inside the branch to be checked against.
