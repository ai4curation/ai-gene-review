  summary: 'Round 11: scope the complex-column sourcing claim to the rows the query
    covered, and correct the complex-term ancestry from runoak'
  details: |
    Round 11 for PR 4810, on the TRMT10C GO:0004526 NEW row.

    The qualifying finding was a scope error in the round-10 fix itself. The sentence sourcing the complex column said "every other row comes from a third query", but the logged result set covers the ten nuclear subunits, PRORP and the fourteen RNAcentral ids - 25 of the table's 27 entities. The two it missed were the two ComplexPortal rows, whose complex cells still read "mitochondrial" and "nuclear", which is precisely the reading the same section says the column no longer contains. So a sentence asserted those two cells were sourced when they came from no query at all.

    Both halves fixed, and in the direction the file already pointed: a complex is not recorded in a complex, so the column does not apply to those two rows. They now read "n/a, is the complex", and the sourcing sentence is scoped to the 25 protein and ncRNA gene products rather than to "every other row". The counts reconcile: 25 queried entities plus the 2 complexes is the 27 in the table, which is 16 printed lines because POP5, RPP30 and RPP40 each carry a second bold row and three gene products share one line. The row counts still sum to 40, the hit count.

    The query count was stale for the same reason: the section said these tables were the only in-branch record of "the two queries" while three curls are logged. It now names all three (goId=GO:0004526, geneProductId=UniProtKB:O15091&goId=GO:0030678, the complex-term family) plus the per-id ncRNA queries.

    Two optional findings, both taken. The review's new clause named the ten further ncRNA ids inside a sentence about the nuclear holoenzyme's qualifier split, where they read as further RPPH1-like entries corroborating that the catalyst is an RNA - which is the opposite of what the notes found about them. The clause now carries the notes' conclusion: they are not RPPH1 entries, none is recorded as a member of the nucleolar complex, three are lnc-* entries named against CCNB1IP1 and PDGFC, so they read as electronic propagation rather than as curated subunit annotations. That matters because it travels with the annotation rather than sitting only in the notes.

    The other was the one claim in the new section not from a logged source: "GO:0030677, its generic parent". Running it rather than asserting it found the claim was wrong, not merely unsourced. runoak relationships gives GO:0005655 is_a GO:0030681 multimeric ribonuclease P complex is_a GO:0030677, and GO:0030678 is_a GO:0030677 directly - so GO:0030677 sits two levels above the nucleolar term and one above the mitochondrial one, and is not the nucleolar term's parent. The paragraph now states the ancestry with that asymmetry, says the earlier phrasing was wrong, logs the runoak command, and the downstream sentence no longer says "the generic parent" but "GO:0030677 and nothing below it". The reading the section draws is unaffected: GO:0030677 is still the term both specific complexes descend from, so the ncRNA ids carrying only it still means they are not recorded as nucleolar-complex members.

    This is the sixth round in a row where the finding was that a cheaper check was available than the claim I made. Round 10 ran the query and got the scope of its result wrong; round 11 ran the ontology and found the ancestry claim wrong as well as unsourced. The pattern's remedy, stated for the next round: a claim is sourced only for what the source actually returned, and the extent is counted from the result rather than from the intention.
