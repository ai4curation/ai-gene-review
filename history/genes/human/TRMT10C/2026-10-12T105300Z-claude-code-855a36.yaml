  summary: 'Round 7: qualify the enables claim by evidence code'
  details: |
    Round 6 corrected the PRORP attribution and in doing so hardened the comparator claim into two universals that the notes file falsifies: 'Not one nuclear protein subunit carries enables' and 'PRORP is the only protein in either complex carrying enables'. POP5, RPP30 and RPP40 each carry an enables row, POP5 by IEA and the other two by TAS, which the round-5 parenthetical had already recorded. The review contradicted the notes it pointed a reader at, and the notes prose contradicted its own parenthetical one line below. This is the third round where the term, action and qualifier were right and the sentence explaining them was wrong, and the second where the error was introduced by the fix for the previous one, so it is a pattern in how these reasons are being written rather than three separate slips: each correction reached for a cleaner general statement than the data supports. Both files now state the claim the data does support, which is the sharper one: every IDA row on a nuclear protein subunit is contributes_to, and PRORP is the only protein in either complex carrying enables by direct assay, so the experimental curation lines up behind contributes_to for the subunits and only the electronic and author-statement rows do not. Every remaining absolute was re-derived from the live QuickGO query rather than from the earlier parse: no nuclear subunit has an enables IDA row, none has any IDA row that is not contributes_to, each of the ten has a contributes_to IDA row, and the only other enables row with a direct-assay code belongs to ComplexPortal:CPX-6155, the assembled mitochondrial complex rather than a protein. That row and CPX-2877 are now in the notes table, because a reader re-running the query meets them and would otherwise read them as counterexamples. The complex assignment the round-6 correction turned on was asserted in the notes but not covered by the logged query, which queried GO:0004526 only; the geneProductId query for PRORP against GO:0030678 is now logged too, returning four part_of annotations by IBA, IDA, IPI and TAS.
