  summary: 'Round 9: state the ncRNA row''s composition instead of attributing it'
  details: |
    Round 8 replaced the round-7 bucket label 'RPPH1 and other ncRNA entries', which claimed nothing about what was in it, with 'RPPH1 under 14 ncRNA ids (the nuclear catalyst), incl. lncRNA entries', which claims all fourteen are RPPH1 under different identifiers while the trailing qualifier reads the other way. The live query settles it against the round-8 claim: only four of the fourteen are named ribonuclease P RNA component H1, at RNAcentral URS000013F331, URS000061A549, URS000071B825 and URS0002A685AF. The other ten are RNAcentral entries not named as RPPH1 - three HSALNT ids, two LHRI_LNC ids, three lnc- ids against CCNB1IP1 and PDGFC, and two unnamed as ncRNA and non-coding RNA. The single aggregate row is now two rows carrying that composition, listed the way the protein rows are, and the prose below the table no longer says the nuclear enables rows belong to RPPH1. The per-row counts still sum to 40. This is the fourth round in which an attribution hardened in the same sentence position, and the reviewer's observation about where it happened this time is the useful generalisation of the earlier diagnosis: an aggregate cell is where a quantifier hides, because a label standing for a set is read as a claim about every member of it while looking like a summary. The remedy is the same one that fixed the exception rows - put the composition in the table rather than a label over it - which is why the fix here is two rows rather than a reworded one.
