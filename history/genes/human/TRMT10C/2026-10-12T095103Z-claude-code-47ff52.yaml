  summary: 'Round 3: make the GO:0004526 contributes-to claim auditable'
  details: |
    The core function carried GO:0004526 ribonuclease P activity under contributes_to_molecular_function with no corresponding annotation row. The term is absent from TRMT10C-goa.tsv, which records the complex membership (GO:0030678, part_of) but no RNase P molecular function, and the traceability check covers only molecular_function, so the proposal was invisible in existing_annotations. An explicit action: NEW row with qualifier contributes_to now carries it, grounded on the reconstitution of activity from three recombinant proteins (PMID:18984158) and the cryo-EM complexes with pre-tRNA bound to TRMT10C/SDR5C1 (PMID:38824131). The qualifier is contributes_to rather than enables because the nuclease moiety is PRORP's, and not merely in_complex because TRMT10C binds and positions the pre-tRNA. Also split summary from reason on the six non-ACCEPT rows where the two were byte-identical.
