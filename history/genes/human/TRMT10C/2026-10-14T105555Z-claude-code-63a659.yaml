  summary: Rest the ncRNA propagation reading on its one differentiating property,
    and make the quoted runoak invocation portable
  details: |
    Round 12 of PR #4810: taking the two round-11 suggestions that this round's code push satisfies the
    condition for, per the reviewer's note that the conflict resolution against main was itself the event
    they were conditioned on.

    First, the ncRNA comparator clause offered three properties for the ten non-RPPH1 RNAcentral ids, and
    only one of them differentiates those ten from RPPH1's own four. The notes record that none of the
    fourteen ncRNA ids sits in the nucleolar complex term, RPPH1's four included (TRMT10C-notes.md:59-60),
    and that RPPH1's four enables rows are IEA (:40) -- so "not recorded as members of the nucleolar
    complex" and the electronic-evidence reading are class-level facts about all fourteen rather than
    marks against the ten. The clause now rests the propagation reading on the one property that does
    differentiate, the three lnc-* entries named against CCNB1IP1 and PDGFC, and states the other two
    explicitly as class-level facts that differentiate nothing.

    Second, TRMT10C-notes.md:123 quoted a runoak invocation with a machine-local adapter path,
    -i sqlite:/root/.data/oaklib/go.db, which no reader can run. It now reads -i sqlite:obo:go. That is
    the only occurrence in this PR's files; the repository-wide sweep remains outstanding and is not
    attempted here.

    Neither change alters any action, term or verdict in the review.
