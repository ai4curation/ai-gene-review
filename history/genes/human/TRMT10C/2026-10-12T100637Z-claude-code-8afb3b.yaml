  summary: 'Round 4: record the comparator check behind the GO:0004526 proposal'
  details: |
    Review round 3 raised the comparator check CLAUDE.md requires before a NEW, on the ground that HSD17B10 is the other non-catalytic subunit of the same complex and carries GO:0030678 four times and GO:0004526 never, so both accessory subunits are systematically absent from the MF and that absence should be read as a convention. Run against a wider comparator set the check comes out the other way. QuickGO for GO:0004526 in human splits by qualifier along catalytic lines in the nuclear RNase P holoenzyme, where the catalytic moiety is the RPPH1 RNA rather than any protein: PRORP carries enables (IBA, IDA, IEA), while POP1, POP4, POP5, POP7, RPP14, RPP21, RPP25, RPP30, RPP38 and RPP40 all carry contributes_to, every one by IDA. Ten non-catalytic subunits of an RNase P holoenzyme carry exactly the qualifier and term proposed here, so the proposal follows GO's own practice for the paralogous case and the two mitochondrial accessory subunits are the outliers. The single comparator the review used is the other gene carrying the same gap, which compares the gap against itself. The reason now records this evidence, and notes that HSD17B10 warrants the same proposal; its review is INITIALIZED, a stub, so its silence records that nobody has looked rather than a curator declining the term. HSD17B10 is outside this slice so it is flagged rather than changed. The reason also drops its procedural opening, which explained what the row was for before getting to the biology.
