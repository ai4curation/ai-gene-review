  details: |
    Round 23 of PR #4810. Both items are taken, and one of them changed how the GO:0005739 decision is
    justified rather than what it concludes - by experiment rather than by argument.

    Item 1, and it is a clean hit on my own round-22 reasoning. SUCLA2's GO:0003824 catalytic activity
    row was MARK_AS_OVER_ANNOTATED with the reason that catalytic activity is a root-level
    InterPro-derived MF and the specific activity succinate-CoA ligase (ADP-forming), GO:0004775, is
    experimentally supported. That is the same term, the same GO_REF:0000002 InterPro mapping and the
    same argument as the MTFMT GO:0003824 row that round 22 converted to TOO_GENERAL, resolved the
    opposite way, in a file the same push edited. The reasoning written for MTFMT applies unchanged -
    MARK_AS_OVER_ANNOTATED asserts an over-annotation the sentence disowns by calling the term correct,
    and a correct-but-general term parked under a third disposition is outside the rule's letter and
    inside its purpose. GO:0004775 is accepted on six rows, one of them EXP, and is the core molecular
    function; it is a confirmed descendant of GO:0003824 in the QuickGO is_a closure. The row is now
    TOO_GENERAL. The reviewer found this after stating in round 22 that MTFMT was the only such row in
    the slice, having checked UCP2's eight MARK_AS_OVER_ANNOTATED rows and TRMT10C's none but not
    SUCLA2's, and said so.

    Item 2 is the more interesting one, because the ground it attacks was mine and the attack is right.
    The round-22 MTFMT history record said MTFMT could take neither remedy, because MODIFY would propose
    a term the gene does not carry as an annotation. That is not a bar. CLAUDE.md says the replacement
    should be a descendant, preferably one the gene already carries - a preference, and necessarily so,
    since a MODIFY that could only name terms the gene already carries could never propose anything. And
    the validator line the record cited as evidence for leaving the rows is the one a MODIFY would clear:
    validator.py counts proposed_replacement_terms toward core-function location traceability, so
    refining GO:0005739 to GO:0005759 would retire the standing core_functions.locations warning. So the
    sentence inverted its own evidence, and MTFMT is the one file in the slice where a MODIFY does more
    work than elsewhere rather than the one that cannot take it.

    Rather than patch the sentence or accept the conclusion on the remaining grounds, the four rows were
    actually converted to MODIFY with GO:0005759 and the review re-validated. The warning cleared,
    exactly as predicted. A different warning appeared: one of the four rows is an IBA, and
    validator.py:544-562 warns that a MODIFY on a propagated row is missing structured
    propagation_review metadata. That is a real requirement rather than noise - CLAUDE.md's IBA section
    says challenging an IBA means arguing with the PAINT curator's node placement, and that where the
    PAINT evidence for a step is not clear one should say nothing rather than assert an inference the
    data does not support. This family's PAINT node has not been inspected, so a propagation_review
    would be exactly the kind of invented analysis that section forbids. Refining the three non-IBA rows
    and leaving the IBA would put one term under two actions in one file, which is the inconsistency
    rounds 20 through 22 were spent removing.

    So the conversion was reverted and the four rows stay ACCEPT, on a ground that is true and was
    measured: not that MODIFY is unavailable, but that the one available form of it draws a PAINT
    requirement this branch cannot honestly meet. The record's false sentence is corrected in place per
    docs/history.md's never-true rule, with the reason kept and the experiment recorded, since the false
    version is the kind of claim that gets restored. The TOO_GENERAL half of the original sentence was
    right and stands - no GO:0005759 row exists to entail the broader term.

    Both suggestions are taken, in the gene notes rather than only in a history record, which is the
    point of them.

    MTFMT-notes.md now records that the review has 12 action entries against 13 GOA data rows and why
    that is not an omission - two located_in GO:0005739 ISS rows share GO_REF:0000024, WITH/FROM
    UniProtKB:O77480 and ASSIGNED BY UniProt, and differ only in DATE, 20240916 against 20211006,
    verified field by field. It also records the organelle-level decision above, including the experiment
    and the reason for the revert, so the next reader meets it in the gene folder rather than in a PR
    thread. TRMT10C-notes.md records the same decision for its eight GO:0005739 rows, with the reason
    they are not reached by the rule: none of them says the term is less specific than the evidence
    supports, and nothing else in that file refines a mitochondrial-location ancestor, so the file does
    not treat one argument two ways.

    Verification: both closure relations confirmed against QuickGO before being written, GO:0004775 under
    GO:0003824 and GO:0005759 under GO:0005739; the MTFMT revert confirmed by re-validating and seeing
    the core_functions.locations warning return, so the before and after are both measured; the GOA
    duplicate confirmed by reading the two ISS rows field by field; ai-gene-review validate passes on
    SUCLA2 with two pre-existing warnings and on MTFMT with three, all pre-existing; SUCLA2 coverage
    unchanged at 55 rows and MTFMT untouched at 12.
