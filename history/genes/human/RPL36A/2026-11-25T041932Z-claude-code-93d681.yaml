  summary: Record OpenScientist paralog-discrimination analysis for RPL36A and RPL36AL
  details: |
    Ran an OpenScientist deep-research job (kgap-rpl36a-paralog-discrimination) on the knowledge gap covering relative incorporation of RPL36A versus RPL36AL in native ribosomes. Direct comparison of the local P83881 and Q969Q0 records confirms the run's central result: the two proteins differ at exactly one of 106 residues, Lys38 against Arg38, and the tryptic reporter pair DSLYAQGK / DSLYAQGR is exactly as described, differing by the Lys-to-Arg mass with identical flanking sequence and no missed cleavages.

    The run computes that residue 38 is partially solvent exposed, contacts no neighbouring protein in PDB 6EK0, and makes its only close contacts through main-chain atoms to the E-site tRNA, so the paralogs are predicted structurally interchangeable, with a coding dN/dS of 0.0055 indicating purifying selection has held them that way. It also points out an asymmetry the gap did not state: discrimination is hard in protein and easy in nucleic acid, with 32 diagnostic nucleotide sites separating the transcripts.

    Status moved from OPEN to NARROWING. The detection half of the gap is answerable from public data without new experiments, since both reporter peptides are reported as proteome-unique and already heavily observed, and the run names seven PRIDE datasets that could be re-searched; paralog-resolved stoichiometry in assembled 60S particles is not settled and still needs the targeted proteomics the resolution proposes.

    The run's incidental finding, that all 163 human PDB polymer entities matching either accession are annotated P83881 and none Q969Q0, is recorded in the boundary as bearing on how much paralog resolution the structure-derived evidence codes can carry. No annotation action was taken on it: the claim was not independently checked here, the terms are correct for both gene products, and second-guessing experimental evidence codes on that basis would overreach.
