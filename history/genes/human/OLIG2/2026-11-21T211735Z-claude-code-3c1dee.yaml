  summary: 'IBA REMOVE re-review: sensory organ development changed to MARK_AS_OVER_ANNOTATED'
  details: |
    Re-review of the IBA row GO:0007423 sensory organ development (projects/IBA_REVIEW/rereview-2026-11-21, batch H02). The earlier REMOVE rested on the absence of sensory organ evidence for OLIG2, which is not a ground for removing an IBA. Read against the PANTHER tree: the IBD is at the PTHR19290 root PTN000446010 (415 leaves); QuickGO (queried by GO id with descendants over all 415 leaves) returns 22 experimentally annotated leaves, 21 of them in four of the six child clades of PTN008568921 (neurogenin, BHLHE22/23, NeuroD, atonal) and none in the OLIG clade PTN008568922 (87 leaves). PAINT already records an IRD for the term at the ATOH8 clade PTN008568918. So the node placement is doubtful for the OLIG clade, but no loss, misplaced node, bad seed or lineage ground can be shown, and the row was changed from REMOVE to MARK_AS_OVER_ANNOTATED with a tree-aware reason. The supporting UniProt quote is unchanged. Validated with just validate human OLIG2.
