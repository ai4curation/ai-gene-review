  summary: Drop unsupported NEW GO:0006338 chromatin remodeling
  details: |
    The NEW GO:0006338 row (and the matching core_functions directly_involved_in entry) fails the participation test: the ATP-dependent chromatin remodeling step is performed by the SWI/SNF ATPase BRG1/SMARCA4, which OLIG2, a sequence-specific bHLH TF, recruits to oligodendrocyte enhancers; positioning a catalyst at a site is regulatory, not the remodeling step. QuickGO comparator: ASCL1 (P50553) and SOX10 (P56693, itself a documented BRG1 recruiter) carry no GO:0006338 despite analogous remodeler-recruitment roles. The row also rested only on a deep-research file (the primary Olig2-BRG1 paper is not cached). Row and core-function term removed. The now term-redundant chromatin pre-patterning core_functions entry was folded into the primary oligodendrocyte TF entry (description plus its two supported_by quotes), and a suggested_questions entry records the regulation-of-chromatin-organization question for future curators.
