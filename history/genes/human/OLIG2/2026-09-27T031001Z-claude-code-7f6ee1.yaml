  summary: Drop unsupported NEW GO:0006338 chromatin remodeling
  details: |
    The NEW GO:0006338 row (and the matching core_functions directly_involved_in entry) rested only on a deep-research file. The primary paper (Yu et al. 2013, Olig2-BRG1) is not cached, and on the NEW bar the remodeling step is performed by the SWI/SNF ATPase BRG1/SMARCA4 that OLIG2 recruits, not by OLIG2, a sequence-specific bHLH TF. QuickGO comparator: ASCL1 (P50553) and SOX10 (P56693, itself a documented BRG1 recruiter) carry no GO:0006338 despite analogous remodeler-recruitment roles. Row and core-function term removed; the recruitment narrative stays in core_functions description.
