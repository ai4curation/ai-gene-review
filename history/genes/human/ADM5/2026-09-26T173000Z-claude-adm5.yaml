  summary: First review of human ADM5, a probable non-functional adrenomedullin-5 remnant
  details: |
    All 8 annotations are electronic (7 IBA + 1 IEA) with no experimental annotation on the
    gene. 6 REMOVE, 2 KEEP_AS_NON_CORE. core_functions deliberately left empty.

    The removals rest on the target, not on any donor being wrong: the mature AM5 coding
    sequence is deleted in anthropoids (PMID:18434369), UniProt's FUNCTION line calls the
    human protein a probable non-functional remnant with ECO:0000269 pointing at that same
    study, and a sequence analysis written for this review
    (genes/human/ADM5/ADM5-bioinformatics/) finds the disulfide ring retained but no
    G[KR][KR] amidation motif anywhere in the human sequence against two in the functional
    pig orthologue. Alpha-amidation is required for receptor activation across the
    CGRP/adrenomedullin family.

    The seven IBAs are the PAN-GO reference set that UniProt advertises directly, so this is
    a disagreement between two curated resources rather than a pipeline against a curator.
    PANTHER node PTN000602075 spans ADM, ADM2 and ADM5, so most donors are paralogs and three
    rows have no ADM5 ortholog among their sources at all.

    Both GO:0005576 rows are KEEP_AS_NON_CORE: the signal peptide is intact so the location
    claim survives, but the extracellular region is where a degenerate prohormone is routed,
    not where it acts.
- type: REVIEW
  outcome: changed
  sections:
  - existing_annotations
  - references
  - notes
  summary: Round 2 and 3 corrections after PR review
  details: |
    Round 2 corrected two errors of my own. I had marked the pig donor A5LHG2 SOURCE_BAD for
    GO:0035809 on the strength of two negative abstracts; QuickGO shows it carries an
    experimental IDA for that term from PMID:18434369, which is precisely the situation
    CLAUDE.md says not to overrule. PMID:22087608 also reconciles the apparently contradictory
    renal results itself. Donor status corrected to SUPPORTS_SOURCE_BUT_NOT_TARGET.

    I had also argued that AM5 raises no cAMP. It does: plasma cAMP rose 50% in sheep
    (PMID:21436721). The negative result is specific to transfected CLR/CTR+RAMP combinations
    and bears on receptor identity, not adenylate-cyclase coupling.

    Four references were cached but uncited (PMID:16195494, PMID:33711314, PMID:19420012) or
    asserted with no citation and no cached record at all (PMID:22087608, taken from the
    affinage summary this review marks DISPUTED). All now cached and cited.

    Round 3 fixed two residual instances of the same class. The GO:0007189 summary still
    asserted the retracted no-cAMP claim that its own reason retracted thirty lines below, so
    the two fields disagreed inside one row. And PMID:22087608's Discussion contains a
    sentence arguing the contrary view on the receptor question, which had been left out while
    two other findings were taken from the same paper; it is now recorded on both the
    reference entry and the GO:1990410 reason.

    No REMOVE changed across any round. The human-deletion argument was load-bearing
    throughout and stands alone.
- type: REVIEW
  outcome: changed
  sections:
  - existing_annotations
  - references
  - description
  - suggested_questions
  - notes
  summary: Round 4 and 5 - correct self-contradicting failure_modes and commit a donor snapshot
  details: |
    The shared paralogy preamble was applied to all six REMOVE rows but is false on four of them.
    GO:0003073, GO:0007189, GO:0010460 and GO:0035809 all list UniProtKB:A5LHG2, the genuine pig
    ADM5 ortholog, among their supporting_entities and none lists Q7Z4H4, so the boilerplate
    contradicted each row's own propagation_review, which calls A5LHG2 the true ortholog.

    More consequentially WRONG_ORTHOLOG_OR_PARALOG appeared in all six failure_modes lists, and
    that field feeds the IBA audit aggregation. On those four rows the propagation fails through
    lineage-specific loss in the target, not donor misidentification. The preamble is now split
    into PARALOG and ORTHOLOG variants and WRONG_ORTHOLOG_OR_PARALOG survives only on GO:0005179
    and GO:1990410, where no ADM5 ortholog is among the donors.

    Splitting one six-row falsehood produced a smaller two-row one: the new PARALOG variant named
    pig ADM P53366 as a donor, which is true for GO:0005179 but not for GO:1990410. The preamble
    no longer enumerates accessions at all; per-row donors are in source_entities.

    The round-3 retraction of the receptor claim had also not reached description or
    suggested_questions, which still stated as settled what the GO:1990410 reason records as
    open. Both corrected. The heart-failure paper's mirror-image cAMP sentence is now recorded
    alongside the pro-receptor one, the Xenopus quote replaced with the operative clr-ramp3/am5
    result, and PR-history phrasing removed from review.reason.

    Added ADM5-donor-goa-check.json, a QuickGO snapshot of pig ADM5 (A5LHG2) with query URL,
    retrieval timestamp, response sha256 and a claims-to-checks mapping. Several rounds turned on
    which evidence codes that donor holds while those facts lived only in prose. It also settles a
    count: the donor holds experimental IDAs for four terms, not two, so the ORTHOLOG framing
    applies to all four rows that list it.

    No REMOVE changed in any of the five rounds.
