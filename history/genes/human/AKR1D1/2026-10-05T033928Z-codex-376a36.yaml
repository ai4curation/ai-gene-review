  summary: Evaluate AKR1D1 OpenScientist redox report
  details: |
    Recorded the focused OpenScientist AKR1D1 aldose, monooxygenase and alcohol-reduction report as disputed support on the accessory redox rows, added PMID:22437839 as target-specific evidence for the Glu120 specificity switch, and removed GO:0047086 as chemically incompatible with AKR1D1 hydride-transfer chemistry. The report's structural specificity and reaction-class critiques are useful, but its hard-removal leads were not adopted for rows still limited by missing PMID:11342103 full text or absence of direct negative aldose assays.
