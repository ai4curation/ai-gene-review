  details: |
    IBA REMOVE re-review of 2026-11-21 (projects/IBA_REVIEW/rereview-2026-11-21, batch 07), judged against the PANTHER tree and the pinned PAINT IBD snapshot. GO:0005737 cytoplasm. The cytoplasm IBD at the FGF family root PTN000160075 has 13 seeds. The earlier text attributed it to FGF1, FGF2 and the intracellular FGFs only; the seed list also holds located_in rows on secreted FGFs (Golgi apparatus for mouse Fgf7 and Fgf22, lysosome for zebrafish fgf8a, cytoplasm for mouse Fgf3, rat Fgf18 and worm let-756), checked in QuickGO. With those seeds there is no tree ground for REMOVE; the term is true as secretory transit and wrong as a site of activity, so the action is now MARK_AS_OVER_ANNOTATED and the summary and reason were rewritten. PAINT suggestion: place the IBD on the cytosolic clades PTN000160077 and PTN000896537. No seed sits in the 185-leaf secreted clade PTN008519134 that holds FGF23; its own Golgi lumen and ER lumen rows are kept as non-core, the same kind of transit observation. The root-node source comment was corrected. Validated with just validate.
