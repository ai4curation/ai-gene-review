  summary: Complete GO annotation review for human FGF23 (endocrine phosphaturic hormone)
  details: |
    Reviewed all 189 GOA rows plus one NEW annotation. Wrote a project-independent description covering FGF23 as a bone-derived endocrine FGF acting via alpha-Klotho/FGFR1c, its renal phosphate and vitamin D actions, parathyroid PTH suppression, and the GALNT3/FAM20C/furin processing switch. Actions: ACCEPT 160 (150 of them Reactome extracellular-region TAS rows), KEEP_AS_NON_CORE 11, MODIFY 8, MARK_AS_OVER_ANNOTATED 8, REMOVE 2, NEW 1; no UNDECIDED. Key decisions: MODIFY the vitamin D catabolic/metabolic process rows to GO:0010957 because CYP24A1/CYP27B1 perform the chemistry and FGF23 only regulates their expression; MODIFY GO:0010966 to GO:2000119; MODIFY GO:0046888 to GO:2000829; MODIFY the Klotho/FGFR1 protein-binding IPIs to GO:0005104/GO:0005105 and REMOVE the SMAD4 screen-level protein binding; REMOVE the IBA is_active_in cytoplasm (FGF23 has a signal peptide and is classically secreted); MARK_AS_OVER_ANNOTATED the paracrine-FGF IBAs (proliferation, neurogenesis, cell migration) and the rat/mouse Ensembl response-to-stimulus IEAs that describe regulation of FGF23 expression rather than FGF23 activity; propagation_review blocks added for the four rejected IBA rows tracing to PANTHER:PTN000160075. Added NEW GO:0005179 hormone activity. Core functions: GO:0005105 receptor binding with FGFR signalling/ERK, and GO:0005179 hormone activity with phosphate homeostasis, GO:2000119, GO:0010957 and GO:2000829. Cached four additional papers (PMID:16597617, 17992255, 14966565 already partly present) and added reference_review entries for twelve references.
