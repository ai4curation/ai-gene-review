  summary: 'Create review: FSHR'
  details: |
    De-novo review of all 53 GOA rows for human FSHR (P23945), the follitropin receptor.

    Actions: 28 ACCEPT, 9 TOO_GENERAL, 7 REMOVE, 5 KEEP_AS_NON_CORE, 2 MODIFY, 2 MARK_AS_OVER_ANNOTATED. No row left PENDING or UNDECIDED, and no NEW row was proposed.

    Consequential decisions. (1) The seven GO:0005515 protein binding IPI rows (YWHAQ twice, FOXO1, APPL2, RAMP1/2/3) are REMOVEd under the protein-binding policy: the interactions are recorded in IntAct and UniProt but none identifies a molecular function of the receptor, and the 14-3-3 site maps onto the receptors own G-protein-binding motif rather than a separate activity, so there was no evidence-backed informative replacement. (2) GO:0008528 G protein-coupled peptide receptor activity (IBA at PTN000689980, seeded by Drosophila rk and rat Lhcgr) is MODIFYed to GO:0004963: the node is sound for the relaxin-family members of the LGR clade, but FSH is a heterodimeric glycoprotein hormone and GO files FSH receptor activity under GO:0016500 protein-hormone receptor activity, not under the peptide branch (checked in OLS). Recorded with a propagation_review (TERM_SCOPING_PROBLEM, GRANULARITY_MISMATCH) naming the node and both IBD seeds. (3) GO:0007292 female gamete generation is MODIFYed to GO:0001541 ovarian follicle development: the receptor is on granulosa cells, not the oocyte, and the human and mouse phenotype is follicular arrest. (4) GO:0035773 insulin secretion and GO:0045056 transcytosis, both Ensembl Compara projections from rodent, are MARK_AS_OVER_ANNOTATED: the mouse islet knockout and the rat endothelial transcytosis work are real, but the human claims rest on the extragonadal expression literature that PMID:30778333 shows depends on an unavailable in-house monoclonal, poorly validated polyclonals and supraphysiological FSH doses. (5) GO:0004930 GPCR activity was ACCEPTed rather than called too general, because GO:0004963 is not a descendant of it, unlike its siblings GO:0004964 and GO:0004996; an EDGE_CREATION request is recorded in proposed_ontology_changes. A second EDGE_DELETION request asks GO to drop the part_of from GO:0042699 to GO:0001541, since FSH signalling also occurs in Sertoli cells. (6) GO:0043235 signaling receptor complex is KEEP_AS_NON_CORE with the dispute stated: its IDA rests on the ectodomain trimer, and both full-length cryo-EM structures are monomeric.

    Source defects. Two WRONG_REFERENCE defects (resource GO_CAM, confidence PROBABLE, requested_change CHECK) are recorded on the GO:0004963 TAS row against gomodel:59dc728000000351/59dc728000000356 and gomodel:69b3372b00003343/69b3372b00003349: both GO-CAM activities cite PMID:27889227 as the evidence for FSHR receptor activity, plasma membrane location and the downstream links, and the cached full text of that review (a GPCR trafficking review built around the parathyroid hormone receptor) contains no occurrence of FSH, FSHR, follitropin or follicle. The corresponding GOA TAS rows carry the same reference. The claims themselves are well supported by other rows, so the rows were kept rather than removed.

    Could not verify. Nine cited papers are abstract-only in the cache (1322283, 7553856, 9020851, 9811848, 10803590, 11847099, 12907758, 15050368, 15196694, 16630814, 16899567, 17030088, 17848411, 20801186), including PMID:11847099, whose abstract shows the sulfation experiments on TSHR and states only that mutagenesis indicates the same role in the FSH receptor; its four UniProt rows were accepted on the curators full-text reading plus the later structural confirmation in PMID:22802634 and PMID:36720854 rather than left undecided. The three RAMP interaction rows could not be checked at all: PMID:39083597 is cached in full but its per-receptor results are in supplementary tables, and the text does not mention FSHR. No bone or osteoclast term was proposed; that question is recorded as a BIOLOGY knowledge gap with a suggested experiment.

    Validation: just validate human FSHR is clean (the two remaining warnings are the uv UV_NATIVE_TLS deprecation notice emitted by the term and reference validator subprocesses, not content findings); just validate-quotes reports 95 of 95 quotes verified. just paint-losses reports no IRD or IKR on this gene lineage. One quote was initially wrong (a paraphrase of PMID:22802634 picked up from a deep-research lead) and was corrected to the papers own wording; every quote in FSHR-notes.md was also checked verbatim against its cached source.
