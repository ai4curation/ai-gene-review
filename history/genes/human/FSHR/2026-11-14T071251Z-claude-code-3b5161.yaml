  details: |
    Re-decided the general-term rows under the maintainer rule now in CLAUDE.md (MODIFY only when the row's own evidence supports a deeper term; keep a respectably specific term; TOO_GENERAL only for imprecise terms). Rows changed: GO:0007186 G protein-coupled receptor signaling pathway (IDA, PMID:24692546) TOO_GENERAL -> MODIFY GO:0042699, the paper's assays are FSH-stimulated beta-arrestin recruitment and estradiol production (no cAMP readout, so not GO:0007189); GO:0007186 (IEA, IPR000276/IPR002131/IPR002272) TOO_GENERAL -> ACCEPT, the signatures map only to GO:0007186; GO:0008406 gonad development (TAS, PMID:9020851) TOO_GENERAL -> MODIFY GO:0001541, the paper states lack of FSH function is incompatible with ovarian follicular maturation (its male finding is spermatogenesis, carried by the GO:0007283 row); GO:0008585 female gonad development (TAS, PMID:7553856) TOO_GENERAL -> ACCEPT, the ovarian dysgenesis abstract does not resolve the follicle stage; GO:0016500 protein-hormone receptor activity (IEA, IPR002131) TOO_GENERAL -> ACCEPT, the family signature cannot say which hormone. Left unchanged: ovarian follicle development NAS (ACCEPT; GO:0042699 is a component process, not a refinement), response to hormone ARBA (TOO_GENERAL, imprecise), and the three membrane rows (TOO_GENERAL: the IDA used crude CHO membrane preparations, the IEA signatures map only to membrane, the TAS paper has no localisation data).
