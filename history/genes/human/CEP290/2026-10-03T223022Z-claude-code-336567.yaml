    Reviewed all 99 GOA annotations for CEP290 (24 ACCEPT, 43 KEEP_AS_NON_CORE, 32 REMOVE). Removed the 30 protein-binding rows (policy) and the Reactome neutrophil-granule extracellular region and specific granule lumen rows. Kept as non-core: MKS complex (ISS; CEP290 is its own transition-zone module), the developmental terms, ATF4 transcription regulation and nucleus. Accepted the IBA ciliary transition zone assembly (GO:1905349, the replacement for obsoleted GO:0097711) plus centriolar satellite, transition zone and connecting cilium. Two core functions: the transition-zone Y-link scaffold (module role, stage 3) and a satellite/centriole scaffold for ciliary vesicle maturation and RAB8A recruitment. Falcon deep research succeeded. just validate: no errors or warnings.
