  summary: De-novo review of all 11 GOA annotations for SLC16A4 (MCT5), an orphan
    SLC16 monocarboxylate transporter
  details: |
    Reviewed every GOA row for SLC16A4 (O15374, MCT5/MCT4). Orphan member of the SLC16/MCT family (MFS, monocarboxylate porter TC 2.A.1.13): no demonstrated substrate; function rests on sequence homology (Price, Jackson & Halestrap 1998, PMID:9425115, which cloned it by sequence) and the PAINT IBA. Putative core MF GO:0008028 monocarboxylic acid transmembrane transporter activity at the plasma membrane. Actions (11): 7 ACCEPT (GO:0005886 PM x4 incl. IBA/IEA/ISS/TAS; GO:0008028 IBA+TAS; GO:1905039 carboxylic-acid TM transport IBA as putative BP; GO:0015718 monocarboxylic acid transport TAS), 2 TOO_GENERAL (GO:0022857 TM transporter activity anchored by GO:0008028; GO:0055085 TM transport anchored by GO:1905039), 1 MODIFY (GO:0016020 membrane -> GO:0005886). propagation_review NO_FAILURE_CORE on the IBA rows. source_defects: none. Batch 25 (completes canonical SLC16).
