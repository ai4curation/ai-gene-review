  summary: Review FBN1 microfibril functions and processed asprosin
  details: |
    Review FBN1 as a precursor of mature matrix fibrillin-1 and released asprosin. Three core functions cover extracellular structural support and growth-factor availability, integrin-mediated adhesion, and the reported hormone activity of asprosin. Distinguish human matrix and recombinant-fragment assays from rodent physiology, Tsk mutant consequences and processed-product evidence. Preserve all 154 imported source annotations and their order. Decisions are 58 ACCEPT, 41 KEEP_AS_NON_CORE, 24 UNDECIDED, 14 MARK_AS_OVER_ANNOTATED, 11 MODIFY and 6 TOO_GENERAL. All 81 references receive the integrated source-specific assessments, including the contrary asprosin replication evidence and DISPUTED status of its original glucogenic paper. Two functional cleavage products retain boundaries 45–2731 and 2732–2871; experimental constructs are not natural splice products. A public product-source join table preserves all 7 processed-asprosin source contexts plus a parent-identifier control, including the appetite ISS row whose product identifier was omitted by the seeder. No NEW annotation or publication quotation is introduced. All six canonical checks pass, including strict GOA, authored ontology terms, reference/component validation, computed status and rendering of 312 narratives. Status remains DRAFT with 37 explained advisories: 28 supported generic-binding policy exceptions and 9 source-specific action distinctions. Independent source-association, complete review integration and preservation replays pass; unresolved source evidence remains UNDECIDED. All 77 selected normal sources and 2 genuine gene caches retain exact bytes and modes; 33 sources already in main are reused and 44 genuine missing normals are added. Eleven authored files expose biological notes, source guides, full annotation/source joins, binding evidence and product mapping. Genuine provider authentication failures are documented without manufacturing a provider report. Draft-only source-association errors were excluded before accepted integration, and no upstream citation defect was inferred from that private correction.
