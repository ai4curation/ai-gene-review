  summary: First review of GRM6 for the dismech vision-disorder alignment
  details: |
    First annotation review of human GRM6 (metabotropic glutamate receptor 6), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1), together with TRPM1, NYX and GPR179 so that the ON-bipolar signalling complex uses one scheme. 39 GOA rows reviewed: 17 MODIFY, 14 ACCEPT, 5 MARK_AS_OVER_ANNOTATED, 2 KEEP_AS_NON_CORE, 1 TOO_GENERAL. Core function: GO:0098988 G protein-coupled glutamate receptor activity in GO:0007216 G protein-coupled glutamate receptor signaling pathway and glutamatergic synaptic transmission, at the dendrite terminus. Adenylate cyclase-inhibiting rows are generalised because coupling in ON-bipolar cells is through Go (mouse Galpha-o knockout). A mouse annotation that uses the fission-yeast term GO:0035841 new growing cell tip for bipolar dendritic tips is recorded as a source defect. Validated with just validate human GRM6: no errors.
