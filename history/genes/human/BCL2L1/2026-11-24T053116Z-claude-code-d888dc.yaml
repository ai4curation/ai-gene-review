  details: |
    Re-judged the IBA row for GO:0043065 positive regulation of apoptotic process against the PAINT tree (PTHR11256, IBD at root PTN000135648). Two of the 17 seeds are BCL2L1 orthologs in its own child clade PTN000883460, rat Bcl2l1 (IMP) and mouse Bcl2l1 (row keyed to the Bcl-xS isoform), and PMID:8358789 shows human Bcl-xS is pro-apoptotic. The term is true of the gene through one isoform, so the action changed from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE and the reason was rewritten. A supporting_text entry that only read 'provider: perplexity' was removed from the row. Validated with just validate.
