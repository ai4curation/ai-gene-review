  summary: Initial AI review of human SOS2 (Ras GEF, SOS1 paralog) for the FGFR signaling
    module
  details: |
    Reviewed all 30 GOA rows. Accepted GEF activity (IBA, IEA), Ras protein signal transduction, small GTPase-mediated signal transduction, plasma membrane and cytosol; SOS2-specific GEF evidence from a GEF-dead rescue (PMID:30181243) and Noonan syndrome mutants (PMID:26173643). Nine protein-binding IPI rows from domain-mapped studies modified to SH3 domain binding (GO:0017124); eleven high-throughput protein-binding rows removed. Histone-fold-derived protein heterodimerization activity removed; insulin receptor signaling kept as non-core. Added NEW EGFR signaling pathway (IMP, PMID:30181243) after participation and SOS1 comparator checks. Rac-GEF role not asserted for SOS2 (only shown for SOS1). Cached eight new SOS2 papers.
