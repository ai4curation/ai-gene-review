  summary: 'Create review: IGF1'
  details: |
    New review of 170 GOA annotations for insulin-like growth factor 1, a secreted peptide hormone/growth factor. Core: hormone activity, growth factor activity, IGF1R binding, extracellular region, IGF receptor signaling pathway, and the IGF binding-protein/ternary complexes (ACCEPT). Insulin-receptor and integrin binding and the integrin-IGF1-IGF1R complex kept as non-core. Bare protein binding REMOVED under policy; receptor ligand activity and signal transduction MODIFIED/TOO_GENERAL toward hormone activity and IGF receptor signaling. The large set of pleiotropic downstream processes (proliferation, migration, survival/anti-apoptosis, muscle/bone/cardiac growth, metabolism, transcription, neuro/immune effects) kept as KEEP_AS_NON_CORE. Glycolate metabolic process MARK_AS_OVER_ANNOTATED as inconsistent with IGF1 biology. Localization: secreted/extracellular ligand that binds cell-surface receptors; not itself a membrane protein.
