  summary: 'Address PR #4207 review: muscle finding backed by results, adaptor MF in core'
  details: |
    The PMID:38314723 findings now quote the result sentences (Arrdc2 mRNA rises within 1 day of unloading; overexpression lowers myotube diameter) instead of the purpose sentence. GO:0030674 adaptor activity is now the first core function's MF, and ligase binding is a second core function. Cytoplasm IBA is demoted to non-core and dropped from core locations, as it is an ancestor of cytoplasmic vesicle. Localization rows note the C-terminal mCherry fusion and the authors' tag-artifact control. The PY-motif conservation sentence from PMID:23236378 is cited.
