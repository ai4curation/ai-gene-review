  summary: 'Initial review of human ARRDC2: alpha-arrestin adaptor for HECT ubiquitin
    ligases'
  details: |
    7 GOA rows. Plasma membrane, cytoplasmic vesicle and cytoplasm accepted; molecular adaptor activity (IBA) modified to protein-macromolecule adaptor activity; EPN2 and ZRANB1 binding removed. NEW ubiquitin protein ligase binding (IPI, PMID:21191027). Propagation reviews on IBA rows (PTN nodes).
- type: EDIT
  outcome: changed
