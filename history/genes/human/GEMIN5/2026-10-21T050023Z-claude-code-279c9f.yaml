    Full re-review of all 71 rows independent of ProtNLM2 output. 17 bare GO:0005515 rows -> REMOVE (protein-binding policy; previous text misattributed GEMIN4/DDX20 rows to eIF4E). RNA binding -> MODIFY to snRNA binding + mRNA binding; regulation of translation -> MODIFY to positive (SMN 3'-UTR, PMID:25911097) and negative (global synthesis, PMID:27507887) regulation; mRNA splicing and protein-containing complex assembly -> MODIFY to spliceosomal snRNP assembly; cytoplasm -> cytosol; nucleus/nuclear body -> nucleoplasm/Gemini of Cajal bodies; SMN-Gemin2 complex -> KEEP_AS_NON_CORE (GEMIN5 peripheral, PMID:17178713). eIF4E reference marked DISPUTED (PMID:19750007). Description and core functions rewritten (snRNA binding, m7G cap binding, mRNA 3'-UTR binding, ribosome binding). Cached PMID:16314521 and PMID:33963192. Q8TEQ6 is the canonical product; PANTHER PTHR46362:SF1 agrees with the family review. Next relative: Drosophila rig (Q86BY9), same subfamily, unreviewed.
