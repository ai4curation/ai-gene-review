  summary: 'Create review: MAP3K1'
  details: |
    Created the MAP3K1/MEKK1 (Q13233) review from the PENDING stub. All 33 GOA annotations reviewed: kinase MFs (protein Ser/Thr kinase, MAP kinase kinase kinase), E3 ubiquitin ligase activity, MAPK cascade and cytosol accepted; seven bare protein-binding IPI rows resolved as MODIFY to MAPKK binding (MAP2K4, PMID:9808624) and protein kinase binding (MAP4K2/GCK, PMID:11784851) or REMOVE (DCAF7, FLNB, BRAF scaffolds/high-throughput); tight junction, Fc-epsilon receptor signalling, cell surface receptor signalling, zinc binding and STK38 binding kept as non-core; the IEP cellular response to mechanical stimulus (PMID:19593445, which does not mention MAP3K1) left UNDECIDED. Added NEW tubulin binding from the TOG-domain structure/ITC paper (PMID:32817551). Core functions: MAP3K activity toward MKK4/MKK7 driving the JNK/MAPK cascade, and PHD/RING E3 ligase activity toward c-Jun and ERK1/2. Fetched PMIDs 32817551, 12456688, 21129722, 17761173 into the publications cache.
