  details: |
    Ran OpenScientist (3 iterations) on whether the AP5B1 appendage keeps AP-ear ligand-binding surfaces. The fold is confirmed (TM 0.56-0.68 to AP-1/AP-2/COPI ears), but neither AP-2 ear ligand site is conserved across 112 orthologs (a validated negative), and the conserved F782-EEL-W786 motif is buried core. Noted (my inference, checked against the sequence) that founder L785P lies within this buried motif. Gap OPEN -> NARROWING.
