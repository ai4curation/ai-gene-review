  summary: 'Create review: AP5B1'
  details: |
    Full review of the 24 GOA rows for human AP5B1 (Q2VPB7), the beta-5 subunit of the AP-5 adaptor complex: 12 MODIFY, 9 ACCEPT, 3 MARK_AS_OVER_ANNOTATED and 1 NEW row (GO:0001895 retina homeostasis, IMP, from three 2025-2026 macular dystrophy cohorts absent from GOA). Nine bare GO:0005515 IPI rows whose partners are AP-5 core subunits or the SPG11/SPG15 scaffold were refined to GO:0005198 structural molecule activity on the mapped beta-mu site (residues 16-229) and the destabilisation of mu-5 when beta-5 is depleted; three CAMK2B/NIF3L1 rows from 937- and 2196-entity interactome projections were marked over-annotated; the GO:0030119 IDA was refined to GO:0044599 and the GO:0016197 IMP and GO:0016192 NAS to GO:0042147. Both IBAs and the InterPro IEA carry propagation_review blocks with root_cause NO_FAILURE_CORE: PTHR34033 has a single node PTN002145545 at taxon:2759 seeded by AP5B1's own accession, the expected self-referential IBA signature, and AP5B1 is in its own PANTHER family rather than the beta-adaptin family PTHR11134, so beta-adaptin terms cannot leak by descent. A new uv bioinformatics project re-tested the 2011 clathrin-motif claims against current sequences and Pfam boundaries, confirming three and qualifying one. Five knowledge gaps recorded, including the absence of any GO cellular component term for the AP-5/SPG11/SPG15 hexamer that ComplexPortal curates as CPX-20045, with a proposed new term. Validated with just validate (valid, 3 deliberate warnings each justified in the artifact), checkquotes.py (95 quotes, 0 failures), a scripted GOA-row to YAML-row reconciliation (24/24 PASS), a duplicate-key check and the cache/go/terms.csv deletion check.
