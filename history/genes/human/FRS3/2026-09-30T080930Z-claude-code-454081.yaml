  details: |
    Reviewed all 145 GOA annotations for FRS3 (O43559): accepted IBA/IEA/IPI/IGI RTK adaptor activity, FGFR binding and FGFR signaling pathway, and 31 Reactome plasma membrane TAS rows; modified signal transduction TAS to FGFR signaling pathway; removed 101 high-throughput protein binding IPIs as uninformative; kept identical protein binding as non-core. Added NEW MAPK binding (ERK2, PMID:20228838) and microtubule binding (PMID:19943849). Core functions GO:0005068 and GO:0005104 at plasma membrane in GO:0008543. Fetched 16 verified FRS3 PMIDs; wrote notes confirming FRS3 itself binds FGFR1 and recruits GRB2/SHP2.
