  details: |
    Follow-up commit responding to the ai4c-reviewer CHANGES_REQUESTED review on PR #3067.

    1. Migrated all eight GO:0005515 (protein binding) IPI annotations from MARK_AS_OVER_ANNOTATED to REMOVE, per .claude/skills/annotation-reviewer/SKILL.md: generic protein binding is not over-annotation, and legacy actions must be migrated when the annotation is re-reviewed (these rows were re-reviewed in the 2026-09-18 compliance pass, which added reason and supported_by to each). The existing reasons were kept; the 'per policy on experimental IPIs' / 'flagged rather than removed' clauses were dropped, since they conflated CLAUDE.md's do-not-overrule-curators rule with the protein-binding carve-out. Each reason now states explicitly that removal does not dispute the reported interaction and that the evidence licenses no more informative molecular function term. No replacement MF was invented; the NDUFAF4 / NDUFS2 / NDUFS3 interactions remain recorded in core_functions.

    2. Corrected the isoform b (Q9BU61-2) description, which claimed 'no protein-level evidence ... has been established' while NDUFAF3-uniprot.txt records four Q9BU61-2-specific IntAct interactions (NDUFAF4 at NbExp=8, plus RBCK1, REL, SNRPA). Reworded to 'no endogenous expression, localization or assembly-factor activity has been demonstrated', and noted that isoform b retains NDUFAF4 binding despite lacking residues 1-57. The corresponding suggested_question was sharpened to reflect that the 1-57 region is not required for the partner-factor interaction.

    No GO term ids, evidence codes, references or core_functions were changed. just validate human NDUFAF3 passes.
