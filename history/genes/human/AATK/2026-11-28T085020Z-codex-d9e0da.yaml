  summary: Create human AATK GO annotation review
  details: |
    Created the human AATK/LMTK1 review from freshly fetched UniProt and GOA
    records. Reviewed all 18 seeded GOA rows while preserving one
    existing_annotations entry per source GOA row, including the seven distinct
    IntAct protein-binding rows and their row-local WITH/FROM partners.

    Accepted the serine/threonine kinase, Rhea protein-serine kinase,
    LMTK1-specific brain-development IBA, and perinuclear localization rows;
    modified generic protein kinase to GO:0004674; kept ATP binding, membrane
    and neuron apoptotic process as non-core; treated cytoplasm as too general
    beside the perinuclear cytoplasm row; removed bare GO:0005515 rows under
    the protein-binding policy; and left both protein tyrosine kinase rows
    undecided because historical mouse Aatk tyrosine autophosphorylation
    conflicts with the current human Ser/Thr EC assignment without proving a
    PAINT or InterPro2GO error.

    Recorded a core serine/threonine kinase function and the neuronal
    developmental role supported by PAINT, human SH-SY5Y differentiation data,
    and mouse LMTK1 axonal-outgrowth evidence. Added row-local verbatim
    supporting_text and notes documenting why no module or production GO-CAM
    review was appropriate for this single-chain kinase family.
