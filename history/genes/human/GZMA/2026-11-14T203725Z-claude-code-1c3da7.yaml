  summary: 'Create: human GZMA (granzyme A) review'
  details: |
    First review of human GZMA (UniProtKB:P12544). 34 GOA rows reviewed plus two proposed; 70 quotes verified verbatim. Chosen as the direct comparator to GZMB and to fill the granule-killing module's part-four gap.

    Two core functions: serine-type endopeptidase activity (a tryptase, cleaving after Lys/Arg, EC 3.4.21.78 against granzyme B's Asp-ase 3.4.21.79) and protein homodimerization activity, because granzyme A is an obligate disulfide-linked homodimer where granzyme B is a monomer. Those two differences are why two granzymes delivered through the same perforin pore kill by entirely different programmes.

    Two MODIFYs, both correcting an outdated death-mode framing. GO:0006915 apoptotic process re-levelled to GO:1902483 cytotoxic T cell pyroptotic cell death, and GO:0043065 positive regulation of apoptotic process to GO:0043068 positive regulation of programmed cell death. Granzyme A kills caspase-independently - the crystal-structure paper says so - and the modern account is gasdermin B cleavage driving pyroptosis. Note that GO:0010942 positive regulation of cell death would have been the obvious target for the second and is obsolete; checked rather than assumed.

    Two NEW: GO:0042267 natural killer cell mediated cytotoxicity (the same gap filled on PRF1, with GZMB carrying it by IDA and IMP as comparator) and GO:0042742 defense response to bacterium, via GZMA-cleaved gasdermin B forming pores in bacterial-mimetic liposomes.

    One action worth noting for contrast: GO:0005737 cytoplasm is ACCEPTed here where the same term was marked TOO_GENERAL on GZMB. On GZMB, GO:0005829 cytosol was also asserted and entailed it; here no cytosol row exists, so cytoplasm is the most specific location in the record. The action follows from the rest of the record, not from the term alone.

    Resolves a loop from the GZMB review: PMID:12524539 (APEX1) and PMID:11909973 (SET complex) are cited on the GZMB record, where this project flagged them MISCITED because they are granzyme A studies. Both sit correctly on this gene, confirming those flags.
