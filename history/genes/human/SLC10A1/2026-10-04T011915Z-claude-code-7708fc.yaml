  summary: De novo GO annotation review for human SLC10A1 (NTCP)
  details: |
    De novo review of all 110 GOA annotations. Removed 88 generic GO:0005515 protein binding rows sourced from two systematic interaction surveys (PMID:32296183 HuRI, PMID:40355756 SLC interactome) as uninformative. Accepted the transport and localization set (GO:0008508, GO:0015125, GO:0015721, GO:0005886, GO:0016323, GO:0016020), including the IBA rows, whose PANTHER node placements match the experimental human and rodent evidence. Removed three GO_REF:0000107 'response to X' transfers from rat Ntcp (GO:0031667 nutrient levels, GO:0043627 estrogen, GO:0045471 ethanol) as regulation of the transporter conflated with participation in the response. Modified GO:0071466 cellular response to xenobiotic stimulus to GO:0042908 xenobiotic transport, since the real activity is uptake of the xenobiotic (PMID:9458785, PMID:34060352). Proposed two NEW annotations for the HBV/HDV entry receptor function, GO:0001618 virus receptor activity and GO:0046718 symbiont entry into host cell (PMID:23150796, PMID:35545671), after a comparator check confirming ACE2 and CD4 carry both terms by IDA for the same role. Deep research was attempted and failed for both providers (Falcon 402, OpenAI 401); the synthesis was done by hand from cached publications and is documented in SLC10A1-notes.md.
