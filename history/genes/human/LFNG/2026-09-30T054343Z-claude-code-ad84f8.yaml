  details: |
    Created a full review of human LFNG (Q8NES3): all GOA annotations reviewed. The core function is O-fucosylpeptide 3-beta-N-acetylglucosaminyltransferase activity in the Golgi membrane, regulating Notch signaling (ligand selectivity) and somitogenesis. Negative regulation of Notch signaling was kept as non-core, and extracellular region and organ morphogenesis were marked over-annotated. PMIDs 11346656 and 30531807 were added to the publication cache. Evidence came from cached publications, UniProt and Falcon deep research. just validate passes.
