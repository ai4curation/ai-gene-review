  summary: Narrow the LRP5L protein-existence knowledge gap with an OpenScientist
    run
  details: |
    Ran OpenScientist (3 iterations, local analyses withheld) on the WHOLLY_DARK gap of whether LRP5L makes a stable polypeptide. Result: unprocessed hominoid segmental duplicate of the LRP5 YWTD propeller; the A4QPB2 stop comes from a duplicate-specific 1-nt deletion. There is no purifying selection (omega ~0.43 vs 0 for LRP5), the gnomAD LoF burden is at the neutral expectation, and the locus is lost in orangutan and disrupted in gorilla. Gap OPEN -> NARROWING: strong evidence against a conserved protein, but translation is not directly excluded.
