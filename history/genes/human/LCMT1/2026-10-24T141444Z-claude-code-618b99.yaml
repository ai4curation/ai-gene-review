  summary: 'Create review: LCMT1 (go-annotation#6632)'
  details: |
    De-novo review of human LCMT1 (Q9UIC8) prompted by geneontology/go-annotation#6632, which challenges the four MGI IMP/IDA annotations from PMID:17724024 and the IBA propagating from one of them. Deep-research providers were unavailable (no API key), so notes were hand-written from cached publications; three additional papers were fetched into the cache (PMID:21292165, PMID:27507813, PMID:17803990). Outcome: GO:0018423 accepted as the core MF across all six rows; GO:0003880, GO:0008757, GO:0008168, GO:0006479 and GO:0036211 marked TOO_GENERAL as ancestors of accepted terms; GO:0006481 accepted; GO:0031333 MODIFY to GO:0031334 as a sign error, since the cited experiment shows LCMT1 promotes PP2A BalphaAC assembly; both GO:0090266 rows REMOVE, as the paper's own time-lapse shows prolonged rather than shortened mitotic arrest; GO:0042981, GO:0000086 and GO:0009966 marked over-annotated; GO:0005515 removed per protein-binding policy. Departs from the upstream request on GO:0006479/GO:0006481: neither is obsolete in the current ontology and both claims are correct, so they are not removed. Two source_defects recorded against MGI and one proposed_new_term for positive regulation of PP2A complex assembly.
