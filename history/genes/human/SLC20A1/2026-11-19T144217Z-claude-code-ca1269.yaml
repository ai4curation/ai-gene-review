  details: |
    Reviewed every GOA row for SLC20A1 (Q8WUM9, PiT1/GLVR1). Core MF GO:0005436 sodium:phosphate symporter activity (~2 Na+:Pi, monovalent) at the plasma membrane; core BP GO:0035435 phosphate ion transmembrane transport. Support from curated UniProt CC:FUNCTION (ECO:0000269) and CC:SUBCELLULAR LOCATION via file: citations. Actions (28 rows, 13 terms): ACCEPT (GO:0005436, GO:0005886, GO:0035435, GO:0005316 high-affinity sub-type), TOO_GENERAL (GO:0005315 anchor GO:0005436; GO:0006817 anchor GO:0035435), MODIFY (GO:0016020 membrane->plasma membrane; GO:0038023 signaling receptor activity->GO:0001618 virus receptor activity, lateral correction for the documented gammaretroviral receptor function), KEEP_AS_NON_CORE (GO:0008283 transport-independent proliferation role, IDA; GO:0035725/GO:0006814 sodium co-transport; GO:0043123 NF-kB HMP), MARK_AS_OVER_ANNOTATED (GO:0006796 phosphate metabolic process over-annotates a transporter). propagation_review on IBA core rows. PMID:8041748 title backfilled (fetch had hit a transient 429). source_defects: none. Batch 26.
