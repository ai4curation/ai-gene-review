  summary: 'Create review: DLL3'
  details: |
    Reviewed all 13 seeded GOA annotations for DLL3 (Q9NYJ7). Deep-research providers were unavailable, so research was done from cached publications, UniProt and PubMed and recorded in DLL3-notes.md. Key calls: plasma-membrane rows (IBA is_active_in and Ensembl-Compara IEA) modified to Golgi membrane plus late endosome on the basis of Geffers 2007 and Chapman 2011, which show endogenous DLL3 is Golgi-retained and not presented at the presomitic mesoderm cell surface; Notch signaling pathway rows modified to negative regulation of Notch signaling pathway as a sign correction, since DLL3 cis-inhibits rather than trans-activates; generic membrane rows refined to Golgi membrane; the ARBA high-level developmental term marked TOO_GENERAL; Notch binding and negative regulation of Notch signaling accepted as core. One NEW cell surface annotation was added for the tumour-specific surface pool documented by Saunders 2015. A single core function was recorded.
