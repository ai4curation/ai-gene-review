  summary: 'Create review: RPUSD2 (reference relative for fly RluA-1)'
  details: |
    De-novo review of human RPUSD2 (Q8IZ73, PANTHER PTHR21600:SF40), independent of ProtNLM2 predictions, as the experimentally characterised co-ortholog of Drosophila RluA-1/RluA-2 (shared PAINT node PTN002727951). Deep research failed (falcon auth error; perplexity-lite quota), so the review rests on cached full-text literature. All 16 GOA rows reviewed. Core: tRNA pseudouridine(31)/(32) synthase activity and tRNA (incl. mitochondrial) pseudouridine synthesis, from knockout profiling in two independent studies (PMID:41136621 HCT116; PMID:41698914 HEK293T; the latter found no confident cytosolic tRNA substrates, so cytosolic Psi31/32/34 rests on one study). mRNA pseudouridine synthesis kept as non-core (in vitro only, PMID:35051350). rRNA pseudouridine synthesis IBA marked over-annotated (no rRNA substrate in either KO; authors infer loss of the ancestral RluA rRNA activity). General IEA process terms modified to tRNA/mRNA pseudouridine synthesis. Added PMID:41698914 and notes file.
