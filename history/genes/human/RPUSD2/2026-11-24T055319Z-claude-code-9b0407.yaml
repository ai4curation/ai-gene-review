  summary: 'Re-review of over-annotated IBA rows against the PAINT tree: RPUSD2'
  details: |
    IBA over-annotation re-review (projects/IBA_REVIEW/overannotated-2026-11-24, batch H10). GO:0000455 enzyme-directed rRNA pseudouridine synthesis changed from MARK_AS_OVER_ANNOTATED to REMOVE on target-specific loss. The IBD is at the family root PTN002727951 with eight seeds (six E. coli enzymes, yeast Pus5 and Pus9), none in the animal RPUSD2 clade PTN000824389. Two knockout pseudouridine profiles of human cells (PMID:41136621, read in full and covering rRNA, and PMID:41698914) find only tRNA sites, and the authors of the first state that eukaryotic RPUSD2 has lost the rRNA activity. That is evidence of divergence on the target, which is the case for removal; the earlier version held the row at over-annotated because the evidence is an absence. Yeast RIB2 carries the same IBA as over-annotated and was not changed here. Validated with just validate human RPUSD2.
