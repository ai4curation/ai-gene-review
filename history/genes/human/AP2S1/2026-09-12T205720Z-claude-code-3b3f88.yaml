  summary: 'Create review: AP2S1'
  details: |
    Full review of all 97 GOA rows for human AP2S1 (P53680, sigma2-adaptin, PANTHER PTHR11753): 41 ACCEPT, 42 KEEP_AS_NON_CORE, 8 MARK_AS_OVER_ANNOTATED, 5 REMOVE, 1 MODIFY, plus 2 NEW rows. The single IBA (GO:0016192, node PTN000204281) was judged NO_FAILURE_CORE after resolving all eleven gene-level donors: the node's seeds span AP-1, AP-2 and AP-3 sigma subunits acting in different vesicle pathways, so the generic parent is the correct LCA rather than a granularity failure. Five GO:0036020 endolysosome membrane rows were removed as a Reactome compartment-inheritance artefact, argued from GO's own closure (GO:0036020 is not an ancestor of GO:0030122), UniProt's location lines, and the PtdIns(4,5)P2 requirement for AP-2 recruitment. GO:0030100 regulation of endocytosis was modified to GO:0072583 as a regulator/executor role conflation. NEW: GO:0005905 clathrin-coated pit and GO:0055074 calcium ion homeostasis. Key ontology finding recorded as a proposed new term and an ONTOLOGY knowledge gap: GO has no molecular function for acidic dileucine sorting-signal binding, since GO:0089710 is defined for tyrosine-containing signals, so sigma2's one subunit-level activity is inexpressible and eight bare protein-binding rows cannot be upgraded. A second ontology gap was recorded for GO:0002031, whose negative-regulation ancestry contradicts the FHH3 data. Eight RETAINED residue claims (anchor mouse P62743, target human P53680) encode the dileucine pocket and are tested by a reproducible uv project under AP2S1-bioinformatics/ that fetches all sequences live. Validated with just validate (clean), checkquotes.py (268 quotes, 0 failures), gene_residue_claims (0 fail, 0 unresolved), a GOA-to-YAML reconciliation script (97 to 97, PASS), duplicate-key and terms.csv checks.
