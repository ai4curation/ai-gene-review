  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (PDGFB-phylo.yaml, from `just phylo human PDGFB`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0051897 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree PDGFB is itself a seed of the node and the other seeds are 1 one-to-one ortholog and 1 paralog, so the transfer is phylogenetically sound and the objection rests on the fit of a downstream pathway term, not on placement.
    - GO:0070374 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree PDGFB is itself a seed of the node and the other seed is a paralog, with the seeds in 2 of the 4 branches below the node, so the transfer is sound and the objection rests on the fit of a downstream pathway term, not on placement.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
