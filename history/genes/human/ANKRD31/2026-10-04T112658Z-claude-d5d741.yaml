  summary: 'Initial review of human ANKRD31: meiotic REC114 scaffold; positive regulation
    of DSB formation made sign-neutral'
  details: |
    Reviewed 8 GOA rows, all transferred from mouse Ankrd31 (ISS or SubCell IEA). Nucleus, chromosome, chromatin and meiotic DSB formation accepted. GO:1903343 modified to GO:1903341 because the null has more DSBs genome-wide, delayed DSBs, and no PAR DSBs. Homologous pairing kept as non-core, consistent with MGI annotation of MEI4, IHO1 and SPO11.
