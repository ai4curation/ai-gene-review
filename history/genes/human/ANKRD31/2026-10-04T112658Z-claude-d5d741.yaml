  summary: 'Initial review of human ANKRD31: meiotic REC114 scaffold; positive regulation
    of DSB formation made sign-neutral'
  details: |
    Reviewed 8 GOA rows, all transferred from mouse Ankrd31 (ISS or SubCell IEA). Nucleus, chromosome, chromatin and meiotic DSB formation accepted. GO:1903343 modified to GO:1903341 because the null has more DSBs genome-wide, delayed DSBs, and no PAR DSBs. Homologous pairing kept as non-core, consistent with MGI annotation of MEI4, IHO1 and SPO11.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  - core_functions
  - references
  - suggested_questions
  - suggested_experiments
  summary: 'Reviewer round 2: NEW GO:0030674 adaptor activity as core MF; cite PMID:32461690, 37431931, 38580643; qualifier note on pairing'
  details: |
    Added NEW GO:0030674 (ISS from mouse A0A140LI88), based on direct REC114 PH binding, multiple partners, and REC114-contact separation-of-function alleles; it is now the core MF. Cited and adjudicated the PAR mechanism, shared-REC114-surface and IHO1-HORMAD1 complementarity papers, and reworded the question and experiment to build on PMID:32461690. Core locations now include chromatin. The pairing reason names acts_upstream_of_or_within, and the Affinage verification is scoped to the rows used.
