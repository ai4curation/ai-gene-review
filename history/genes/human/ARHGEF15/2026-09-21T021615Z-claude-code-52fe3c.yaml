  summary: Make six REMOVE reasons self-contained; fix a subsumed-exemption self-test
  details: |
    Recovers work stranded when #3083's merge commit was chosen before a final push landed, and the authoring agent lost its worktree immediately afterwards. The commit survived on the remote branch but never reached main. Six REMOVE rows ended 'Removed on the same branch of the same policy, with the same caveat.' The reviewer's point was checkable rather than stylistic: review.reason is rendered as a standalone column by annotation_export.py:598 and tabular.py:162, where 'the same caveat' refers to nothing. Each row now states the caveat itself. No action, term, evidence code, supporting_text or core_functions entry changed; a word-diff confirms the core_functions hunk is a pure rewrap. check_action_prose.py additionally gained an injectable exemption list: the self-test previously computed suppression using the whole RETENTION_EXEMPT list, which cannot distinguish an exemption that does work from one subsumed by a neighbour, since removing either leaves the other suppressing the probe. Withholding one entry at a time is what makes the assertion mean what its name says.
