  details: |
    Round 5 on #3100, correcting the previous record rather than editing it.

    Two claims in 2026-09-26T034038Z are wrong.

    First, "the rescan now returns zero". It returned zero because the pattern was anchored
    on "the row above" and the surviving instance reads "the **Ensembl** row above" - one
    intervening word. Round 3's lesson was that counting what you added cannot detect what
    you missed; this is one level up, and worse, because I had already been told the check
    was wrong once and answered by widening the same regex. A scan inherits its pattern's
    blind spot, so "returns zero" measures the pattern, not the file. Thirty-one rows is 62
    strings; that is a tractable read, and a regex over them is not the cheaper check, only
    the less complete one.

    Reading all 62 found four dangling pointers, not one:
      - row 30 reason, "as the Ensembl row above ... for the same reasons" - the reviewer's
        item, and the worst of them, because "for the same reasons" was the entire
        justification in the cell. Antecedent is the GO:2000297 IEA row from GO_REF:0000107.
      - row 30 summary, "the same mouse result" - same row, no antecedent either, and the
        regex was never going to see it because it has no positional word at all.
      - row 13 reason, "Third report of the same pair" - never names CEP55, while its two
        siblings now do.
      - row 27 reason, "as the postsynapse row" - names the term loosely but still points.
    All four now name the donor, the evidence and the GO term they duplicate.

    Second, "guard self-test passes 13/13". It asserts 15 things. The script now prints its
    own count ("SELF-TEST PASSED: 15/15 assertions") so the number cannot be hand-copied
    wrongly again; that is the durable fix, because a tally quoted from memory is never
    compared to the artifact.

    Also: the core_functions description was re-filled. Declining it last round on the
    grounds that it was "pre-existing and outside this PR's rows" did not hold - the diff
    rewrites those very lines - and it carried the same 57-column orphan artifact the six
    reason blocks had. Re-filled with textwrap.fill(width=95, break_on_hyphens=False); the
    #3099 checker reports zero splits.

    Verified: exactly four strings differ from the previous commit, all four the intended
    reason/summary rewrites, with every other string identical after whitespace
    normalisation, so the core_functions re-fill moved no prose. 31 annotations before and
    after, zero folded-scalar hyphen splits, zero lines over 100 columns, self-test 15/15,
    just validate human ARHGEF15 passes.
