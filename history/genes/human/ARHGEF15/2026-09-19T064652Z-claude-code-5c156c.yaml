  summary: Reviewed all 31 GOA rows for human ARHGEF15 and recovered its measured
    substrate specificity from a paywalled family-wide screen absent from GOA
  details: |
    Adjudicated all 31 GOA rows: 14 ACCEPT, 9 KEEP_AS_NON_CORE, 7 MARK_AS_OVER_ANNOTATED,
    1 MODIFY, 0 REMOVE. Added two core_functions and four knowledge gaps.

    Substrate specificity, the measurement GOA does not have. PMID:32203420 (Mueller et al.
    2020, Nat Cell Biol) screened all 145 human RhoGEFs and RhoGAPs against RhoA, Rac1 and
    Cdc42. Reactome cites it for ARHGEF15 in both R-HSA-8980691 and R-HSA-9013159, but it is
    absent from ARHGEF15's GOA, affinage did not return it, and no gene-name search reaches
    it: the title names RAC1 and the gene appears only in a supplementary spreadsheet. It was
    found by following a citation out of the cached Reactome entry behind a GOA TAS row. The
    article is paywalled with no PMC record; the supplementary tables are free.
    genes/human/ARHGEF15/ARHGEF15-bioinformatics/muller2020_specificity.py downloads the
    workbook, locates the gene by name rather than by row number, derives the column mapping
    from the header rows and reads Supplementary Table 2 row 85 as RhoA +, Rac1 -, Cdc42 +.

    The column mapping is corroborated by six read-controls of textbook specificity. Five
    recover (TIAM1 Rac1; ARHGEF1, ARHGEF11, ARHGEF12 RhoA; FGD1 Cdc42) and ITSN1 does not,
    scoring negative for all three. ITSN1 is retained in the panel deliberately: it makes the
    screen's false-negative rate visible and is why a minus in that table means not detected
    rather than does not act. The pass criterion was therefore narrowed from "every control
    recovers" to "each GTPase column is corroborated by at least one control", and the
    self-test proves the narrowed predicate still fails under a rotation of the three screen
    columns, so the narrowing opened no hole.

    Ontology limitation, cross-checked on two independent services. GO:0005089 Rho
    guanyl-nucleotide exchange factor activity no longer exists; it and GO:0005086,
    GO:0005087, GO:0005088 and GO:0008321 are all merged into GO:0005085, agreed by QuickGO
    and OLS4 with zero disagreements. GO:0005085 has zero is_a children and the substrate
    names survive only as synonyms. This mirrors the GAP side, where GO:0005097, GO:0005099,
    GO:0005100 and GO:0008060 merged into GO:0005096, verified the same way. Two services
    were used because QuickGO silently returns the successor's record for a merged id. The
    biological-process branch was not flattened but does not rescue this gene either:
    GO:0032488 is an is_a descendant of GO:0007266, so the GO:0035025 row the gene carries
    does not distinguish RhoA from CDC42; and GO:0032489 has zero children on both services,
    so no positive regulation of Cdc42 term exists. Recorded as an ONTOLOGY plus BIOLOGY
    knowledge gap, with substrate identity carried in core_functions[].substrates and in
    RO:0002233 has_input extensions on the relevant rows. All of this is reproduced by
    genes/human/ARHGEF15/ARHGEF15-bioinformatics/gef_term_availability.py.

    Catalytic machinery, reported in both directions. dh_specificity.py maps the published
    mouse Ephexin5 residues onto the human protein by alignment rather than by subtracting
    the eight-residue length difference: L562/Q566/R567 -> L554/Q558/R559 and the EphB2 site
    Y361 -> Y353, all retained. Two by-products settle apparent discrepancies: human V360 and
    the mouse V368 of the knock-in line in PMID:36929019 are the same residue, and human R604
    maps to mouse R612, which is the correspondence PMID:23647072 states independently. The
    triad nevertheless fails its own comparator test here: 0 of 3 canonical RhoA-specific
    GEFs carry it and 2 of 3 Cdc42-specific ones do, across twelve DH domains. This is not
    presented as refuting Margolis et al. 2010, whose comparison set was structure-based and
    different, but it is enough to stop the residues being used to infer human substrate
    choice, and the functional literature agrees: PMID:40138406 uses the same triple mutant as
    its GEF-dead control for CDC42. RESULTS.md names and refuses one tempting over-read, that
    the human protein shares the discriminating residue with the two Cdc42-positive
    comparators.

    Systems kept separate. Each row attributes its result to the system it was measured in.
    RhoA is unanimous across vascular, neuronal, disease and screen contexts; Rac1 is negative
    wherever tested; CDC42 splits three to two, with two of the three positives in human cells
    or on the human protein. The conflict between PMID:23029280, which finds no detectable
    Arhgef15 in mouse retinal vSMCs, and PMID:12775584's VSMC-specificity claim that UniProt
    still carries unqualified, is recorded rather than resolved.

    Action choices. The EPHA4 GO:0005515 row is MODIFY to GO:0046875 ephrin receptor binding,
    the one interaction in the record with a mechanism; the comparator check is that
    NGEF/Ephexin1 already carries the same term for the same relationship. The other six
    GO:0005515 rows are binary-interactome screen hits and are demoted rather than removed,
    because a reproducible observation with no biology attached is not a refuted finding.
    Seven neuronal and dendritic rows are kept as non-core: each projects a real mouse
    experiment (PMID:21029865, PMID:28185854) with no human measurement behind it, while the
    human expression and disease evidence is vascular and skeletal. No NEW rows were added;
    PMID:23647072 contains a direct assay on the human protein but GO:0005085 is already in
    GOA, so it is cited as support instead.

    Provider assessment. Affinage trust gates were clear, which is a precision statement only.
    The record missed four papers the review turns on: PMID:21029865, PMID:40138406,
    PMID:28185854 and PMID:32203420. The first three are reachable under the alias Ephexin5
    rather than the HGNC symbol; the fourth by no name search at all. Its mechanism_profile
    carries no molecular-activity or localization grounding, so nothing was imported from it,
    and the single affinage sentence quoted in the review is attached to a claim PMID:23029280
    independently establishes in the same supported_by block.

    Checking. check_quotes.py verifies every supporting_text including the file: ones CI never
    checks, 55 of 55 verbatim, and refuses to repair its input, so a literal backslash-n fails
    rather than being silently fixed; it also reports unattributed quotations in the notes
    rather than ignoring them. It gained a folded-scalar guard, since a '>-' block line ending
    in a hyphen publishes as "A-kinase- anchoring" while passing validation; that guard
    initially fired on nested block headers and the narrowed version is mutation-tested for
    the hole the narrowing could have opened. just validate is clean with no warnings, just
    validate-families passes, and the rendered HTML was checked for fold damage.
