  summary: 'Took the review: seven bare GO:0005515 rows moved from MARK_AS_OVER_ANNOTATED
    to REMOVE per repository policy, and made the cross-gene comparator claims machine-checkable'
  details: |
    Round 2, taking the ai4c-reviewer CHANGES_REQUESTED on PR #3083. The earlier record in
    this directory describes the initial review; this one records what that review got wrong
    and what changed, and supersedes its action tallies.

    Blocking item, taken in full. Seven bare GO:0005515 rows used MARK_AS_OVER_ANNOTATED:
    PIN1 and LASP1 and CEP55 from PMID:25416956, CEP55 again from PMID:26871637, and PRKG1,
    CEP55 and GORASP2 from PMID:32296183. That action is forbidden for this term by
    .claude/skills/annotation-reviewer/SKILL.md:187-199, which states that the problem with
    generic protein binding is lack of functional information rather than a claim exceeding
    the evidence, routes the term to MODIFY when the cited paper supports a better molecular
    function and otherwise to REMOVE, and adds that removal does not mean the reported
    interaction is false. All seven are now REMOVE.

    My defence was wrong in a specific way worth recording, because it was not a slip. I
    argued in the PR body that a reproducible screen hit is not a refuted finding and that
    removing it would discard a real observation. That is exactly the inference the policy's
    final clause pre-empts: REMOVE on a bare GO:0005515 asserts that the annotation is
    uninformative, not that the interaction is false, and the IntAct record is untouched
    either way. I had also checked repo-wide counts beforehand and found
    MARK_AS_OVER_ANNOTATED dominant for this term at 6943 rows against 2526 REMOVE, and read
    that as precedent. It is not: the same policy paragraph says older untouched reviews may
    retain legacy actions and that they should be migrated when re-reviewed. A frequency
    count over a corpus that predates a policy cannot establish the policy, and I should have
    read the skill file before treating the ARHGAP4 reviewer's phrase "repository policy" as
    that PR's local preference.

    Each reason keeps its substance and drops the retention framing, stating instead which
    branch of the policy the row falls on and that removal does not deny the interaction. The
    EPHA4 row stays MODIFY to GO:0046875, which is the other branch of the same policy.
    Because REMOVE discards the rows, the five distinct partners are now named explicitly in
    suggested_questions, and audit_review.py has a new check that each partner name appears
    at least twice in the document so a future edit cannot silently lose them.

    Tally change, caught by the harness rather than by me: 12 ACCEPT, 11 KEEP_AS_NON_CORE,
    7 REMOVE, 1 MODIFY, 0 MARK_AS_OVER_ANNOTATED. audit_review.py failed on four expectations
    the moment the actions changed, which is what it was written for. Its expectations were
    updated to encode the policy itself rather than the old counts: every REMOVE must be a
    bare GO:0005515 row, no GO:0005515 row may use MARK_AS_OVER_ANNOTATED, and the eight
    protein-binding rows must resolve as seven REMOVE plus the one MODIFY.

    Non-blocking suggestions, both taken. The PR body said EPHA4 was "the seventh" when it is
    the eighth of eight GO:0005515 rows; corrected, and the eight-row arithmetic is now an
    audit expectation. The NGEF comparator behind the GO:0046875 MODIFY was not checkable
    offline because NGEF has no GOA file in this repository, so comparator_annotations.py now
    fetches it and fourteen other cross-gene claims from QuickGO and fails if an observed
    evidence code or reference does not match what the review asserts. 15 of 15 verify. One
    result changed the review's wording: NGEF carries GO:0046875 by IEA from GO_REF:0000107,
    an Ensembl projection from mouse Ngef rather than an experimental row, and the MODIFY
    reason now says so instead of leaving the reader to assume otherwise.

    Gates: just validate clean with no warnings, check_quotes 55 of 55 verbatim,
    audit_review and comparator_annotations self-tests pass, and gene_residue_claims run
    directly since just validate does not invoke it (this review carries no residue_claims,
    so it reports zero of zero).
