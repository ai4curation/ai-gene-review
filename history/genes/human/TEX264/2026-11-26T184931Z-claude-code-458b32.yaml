  summary: 'Create review: TEX264 (ER-phagy receptor and TOP1cc repair adaptor)'
  details: |
    De-novo review of human TEX264 (Q9Y6I9) for the ER_PHAGY project. All 64 seeded GOA rows adjudicated plus one NEW row (GO:0032183 SUMO binding, IDA). Two core functions: ER-phagy cargo receptor (GO:0160247 at the ER and autophagosome membranes, driving GO:0061709) and p97/SPRTN adaptor for TOP1 cleavage complexes (GO:0030674 in the nucleus at replication forks, driving GO:0106300). Source defects filed: WRONG_TERM to MGI repointing two GO:0038023 signaling receptor activity rows to GO:0160247 (CONFIRMED); WRONG_QUALIFIER to MGI on two reticulophagy rows asking for involved_in instead of acts_upstream_of_or_within (PROBABLE); WRONG_TERM query to Reactome on the platelet alpha granule lumen row (SUSPECTED, CHECK). 29 bare GO:0005515 rows removed per the protein-binding policy, 3 repointed to the informative adaptor terms. No deep-research provider was reachable, so the synthesis is in TEX264-notes.md rather than a -deep-research file.
