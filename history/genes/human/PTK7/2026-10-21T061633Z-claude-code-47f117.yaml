  details: |
    Created the full AI gene review for human PTK7 (Q13308), reviewing all 32 GOA annotations. Removed the InterPro-derived protein kinase activity annotation because PTK7 is a pseudokinase that does not bind ATP, and accepted the corresponding NOT ATP binding row. Established single-pass type I plasma membrane plus cell-cell junction localization as the sites of action, modifying generic membrane and anchoring junction rows to those terms and keeping the focal-adhesion proteomics row as non-core. Accepted coreceptor activity and the canonical Wnt regulation terms as the core function, with MT1-MMP-dependent shedding and cell migration as a second core activity; neuronal IBA terms were kept as non-core. Generic protein binding rows were removed under the project policy. Deep research providers were unavailable; evidence came from cached publications and UniProt, recorded in PTK7-notes.md.
