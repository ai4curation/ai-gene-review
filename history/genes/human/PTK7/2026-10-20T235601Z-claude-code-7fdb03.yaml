  summary: 'Create review: PTK7'
  details: |
    De-novo review of human PTK7 (Q13308) as the characterised reference for rat Ptk7 (PTHR45080:SF21; PTK7-clade PAINT node PTN000701324 seeded by Q13308). Falcon deep research failed (Edison 403 auth) and the perplexity-lite fallback failed; review built from directly read literature (recorded in PTK7-notes.md). All 32 GOA rows reviewed: REMOVE IEA protein kinase activity (pseudokinase; human NOT ATP binding IDA accepted, ATP pocket occluded per PMID:32619402); MODIFY CTNNB1 IPI to beta-catenin binding; REMOVE five HuRI bare protein-binding rows; MARK_AS_OVER_ANNOTATED the neuronal L1CAM-seeded IBAs from PTN002895063 (axon guidance receptor activity, axon, neuronal cell body, synapse organization, derived IEA axon guidance) and homophilic adhesion from PTN002895062, with propagation_review; ACCEPT plasma membrane, cell-cell junction and the PTK7-clade IBA regulation of canonical Wnt signaling; positive regulation kept non-core because inhibition is also reported (PMID:21772251); coreceptor activity and retinoic-acid response UNDECIDED; membrane, anchoring junction and signal transduction MODIFIED to more specific terms. No NEW process terms: the PCP role rests on mouse/Xenopus phenotypes that PAINT did not propagate.
