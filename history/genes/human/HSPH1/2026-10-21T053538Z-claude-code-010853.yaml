  summary: 'Create review: HSPH1'
  details: |
    De-novo full review of HSPH1 (Q92598) as the experimentally characterised Hsp110 relative of HSPA4, independent of ProtNLM2 predictions. Deep research failed (falcon auth error, perplexity quota) so the review uses UniProt, the PTHR45639 PAINT slice and cached primary papers. All 29 GOA rows reviewed: NEF activity (IDA+IBA), cytosol, cytoplasm and protein folding accepted as core; three Hsp70 protein-binding IPI rows modified to GO:0030544; two uninformative protein-binding rows (Tdag51, METTL21A) removed; ATP hydrolysis marked over-annotated (Hsp110 clade not given it by PAINT; Hsp105 lacks detectable ATPase); speculative NK T cell activation removed; CD1d/MHC I and endocytic-vesicle-lumen marked over-annotated; nucleus, nucleoplasm, extracellular, exosome, microtubule and alpha-tubulin kept as non-core. Notes separate human-HSPH1 experimental evidence from rodent/hamster and HSPA4 (Apg-2) data.
