  summary: De-novo review of all GOA annotations for SLC52A3 (RFVT3), a plasma-membrane
    riboflavin transporter
  details: |
    Batch 29 review of all GOA annotations for SLC52A3 (Q9NQ40, RFVT3), the apical intestinal plasma-membrane riboflavin (vitamin B2) transporter of the SLC52 family; finalized from an earlier INITIALIZED pass. Core MF GO:0032217 riboflavin TM transporter activity (Na+/Cl--independent, low-micromolar KM; IDA) + BP GO:0032218 riboflavin transport at the apical plasma membrane (GO:0016324); the predominant transporter for intestinal riboflavin absorption, and loss-of-function causes riboflavin-transporter deficiency / Brown-Vialetto-Van Laere syndrome (BVVLS1 / Fazio-Londe). Actions (35 rows): 27 ACCEPT; 2 REMOVE (bare GO:0005515 protein binding IPI x2 - a Y2H neurodegeneration screen, and the functionally real but MF-uninformative TMEM237 interaction PMID:30892938; both per policy, removal not asserting the interactions are false); 5 KEEP_AS_NON_CORE (GO:0005737 cytoplasm x2; GO:0031965 nuclear membrane x2, an isoform-1/cancer-context ECO:0000269 UniProt location; GO:0006771 riboflavin metabolic process); 1 MARK_AS_OVER_ANNOTATED (GO:0007605 sensory perception of sound - a phenotype-to-process over-annotation, deafness being a downstream BVVL consequence). Also fixed three folded-scalar hyphen-splits in reason text. Support cites curated UniProt (ECO:0000269) and the primary characterization/disease papers. Validates cleanly; quotes verbatim.
