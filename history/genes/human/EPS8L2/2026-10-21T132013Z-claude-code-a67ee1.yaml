  details: |
    Created a complete review of human EPS8L2, independent of ProtNLM2 predictions. Deep research failed (falcon 403 auth; perplexity-lite 401 quota), recorded in notes; review built from cached primary literature (PMID:14565974 full text; mouse Eps8l2 KO PMID:23918390; DFNB106 PMID:26282398, PMID:28281779, PMID:41514136; others). Evolutionary grounding: human, mouse and orangutan EPS8L2 are all PANTHER PTHR12287:SF20; EPS8 (SF21), EPS8L1 (SF19), EPS8L3 (SF22) are separate subfamilies, so only SF20 data (mouse Eps8l2 stereocilia tip localisation) were transferred. All 40 GOA rows reviewed: actin binding -> MODIFY to actin filament binding; Rho signal transduction and its regulation -> lateral MODIFY to Rac protein signal transduction / positive regulation of Rac protein signal transduction (OLS-verified siblings); plasma membrane IBA -> ruffle membrane; stereocilium and stereocilium bundle -> stereocilium tip; contributes_to GEF activity, ruffle membrane, stereocilium tip and positive regulation of ruffle assembly ACCEPTed; 8 protein-binding rows REMOVEd per policy; cadherin binding (BioID proximity) marked over-annotated; exosome/vesicle/cytosol/cytoplasm/protein-containing complex and sensory perception of sound kept as non-core. No NEW terms: stereocilium maintenance was not added because MGI curators did not annotate it from the KO paper and the evidence is necessity evidence; raised as a suggested question. Core functions: contributes to SOS1 Rac-GEF activity in an ABI1 complex (human, experimental); actin filament binding targeting ruffles and stereocilium tips (tip by SF20 orthology).
