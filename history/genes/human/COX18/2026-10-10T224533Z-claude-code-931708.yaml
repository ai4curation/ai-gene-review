  summary: Complete COX18 review; protein binding to REMOVE; add MC4DN25 paper
  details: |
    Reviewed the initialized COX18 review against the dismech MC4DN25 entry. Core function kept as membrane insertase activity (GO:0032977) for MT-CO2 C-tail translocation, with complex IV assembly; COX18 is an assembly factor with no cytochrome-c oxidase activity. The GO:0005515 IPI annotation was changed from MARK_AS_OVER_ANNOTATED to REMOVE, and its with/from partners were corrected (O75880 is SCO1, Q5RI15 is COX20; the text had them swapped and named TMEM177). Added PMID:37468577 (MC4DN25 case report) and the falcon deep-research report as references and core-function support. Status set to COMPLETE; just validate human COX18 passes.
