  summary: 'Create: DNAH5 gene review'
  details: |
    Reviewed all 53 GOA annotations for DNAH5 (39 ACCEPT, 7 KEEP_AS_NON_CORE, 4 MARK_AS_OVER_ANNOTATED, 3 MODIFY). Sperm-motility IMPs marked over-annotated (DNAH5 absent from sperm axoneme per PMID:31178125; PMID:18492703 rests on heterozygous variants); cilium assembly IMP modified to outer dynein arm assembly; light intermediate chain binding (IEA/IBA, node PTN000743491) marked over-annotated as cytoplasmic-dynein-only; cilium movement involved in cell motility IBA modified to epithelial cilium movement involved in extracellular fluid movement. Wrote description, core function (minus-end-directed microtubule motor activity in the outer dynein arm), notes, questions and experiments; fetched PMID:11912187 and PMID:15269178 (mouse Dnah5). Falcon deep research failed twice with a provider authentication error, so no deep-research file was used. QuickGO IBA sets identical for human and mouse. just validate human DNAH5 passes.
