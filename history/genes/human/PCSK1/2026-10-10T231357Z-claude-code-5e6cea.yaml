  summary: 'Create: PCSK1 gene review'
  details: |
    Created the PCSK1 (P29120) review from the fetch-gene stub: all 29 GOA annotations reviewed with actions and evidence-backed reasons, standalone description, three core functions (serine-type endopeptidase activity in the secretory granule performing peptide hormone processing and hormone biosynthesis; the POMC-to-ACTH cleavage upstream of alpha-MSH; proinsulin conversion in human beta cells), questions and suggested experiments. Deep research providers were unavailable (falcon timed out, agentapi missing), so literature work was manual via PubMed and the publications cache, recorded in PCSK1-notes.md. Notable calls: GO:0043043 peptide biosynthetic process retermed to GO:0016486 because PC1/3 makes peptides by limited proteolysis rather than translation; the IBA is_active_in membrane row removed as a propagation from the membrane-anchored members of the subtilisin family; identical protein binding removed as most likely zymogen autoprocessing; cell-cell signalling removed since the enzyme acts upstream by maturing precursors. GO:0042446 hormone biosynthetic process accepted under the substrate-versus-participant rule because PC1/3 performs the cleavage that creates the mature hormone. Validated with just validate human PCSK1.
