  summary: 'Review round 1: PCSK1'
  details: |
    Review round 1 for PR 4814: the notes header said deep research providers were unavailable and no report file existed. The report exists and was checked against the review. It agrees on the core annotation and supports the granule-sorting call with the Dikeakos NMR mapping of the C-terminal amphipathic helix. It also raises a species caveat worth recording against the proinsulin rows: the PC1/3 and PC2 division of labour is largely mouse-based, and in primary human islets PC2 was essentially undetectable in beta cells while PC1/3 inhibitors did impede proinsulin processing. No annotation calls changed.
