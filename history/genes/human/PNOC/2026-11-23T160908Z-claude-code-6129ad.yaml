  summary: 'Create review: PNOC'
  details: |
    New review of human prepronociceptin (Q13519) for the LIGANDS_IN_SIGNALING campaign, from a
    manual PubMed search (no deep-research provider available). All 39 GOA rows reviewed. Core
    function: neuropeptide hormone activity (TAS row accepted) involved in G protein-coupled opioid
    receptor signaling (NOP is classed by GO as an opioid receptor) and its adenylate
    cyclase-inhibiting branch. opioid peptide activity (IBA) marked over-annotated: its definition
    requires naloxone reversibility, which nociceptin lacks (PMID:7481766). opioid receptor binding
    (IBA) MODIFIED to neuropeptide hormone activity per decision 4; signal transduction (TAS)
    MODIFIED to GO:0038003; sensory perception (TAS) MODIFIED to sensory perception of pain. NEW:
    GO:0031635 from human neutrophil data (PMID:12950177). Rat drug-response and behaviour
    projections marked over-annotated. Knowledge gap: nocistatin receptor unknown. Validated with
    ai-gene-review validate --terms (no errors; only environment warnings) and quote_check.
