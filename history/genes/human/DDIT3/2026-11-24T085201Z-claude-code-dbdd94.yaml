  summary: 'Address review follow-up on DDIT3: mouse-evidence IDA, two mismatched
    quotes, core-function reconciliation'
  details: |
    Addressed the CHANGES_REQUESTED review on PR #5855 (six edits, no annotation action changed).

    1. GO:0140467 IDA (PMID:30639358): the row is a human IDA (ECO:0000314, taxon 9606) but every CHOP perturbation in the paper is mouse siRNA in wild-type MEFs; the human lines carry only GDF15 induction. Dropped the mouse figure-legend quote from the shared supported_by anchor, rewrote the reason to state the species limitation and name the independent grounding, and added a WRONG_EVIDENCE_CODE source defect against UNIPROT (IDA -> ISO, CONFIRMED, methods cached in full). The mouse methods sentence now serves as evidence for the defect rather than as support for the annotation. ACCEPT retained: the claim is true for human CHOP.
    2. GO:0140467 NAS row shared the same reason text, which asserted the (mouse) siRNA evidence; rewritten to rest on the author statement and the two GO:0140468 HRI rows.
    3. GO:0045454 KEEP_AS_NON_CORE: replaced the unrelated By-similarity "Plays a dual role" UniProt quote with the CC:FUNCTION sentence recording CHOP-driven ERO1L induction, which is what the reason actually argues from.
    4. GO:0070585 KEEP_AS_NON_CORE: replaced the PUMA/BIM expression quote with two quotes from PMID:14752510, the Bax-translocation paper the reason cites; added PMID:14752510 to references with a reference_review noting it is cached abstract-only and mouse.
    5. Core function 2 now reconciles GO:0003714 (typed) with GO:0001227 (proposed on the GO:0000981 MODIFY): the two are not parent and child, the ASNS result satisfies both, and GO:0003714 is chosen because every characterised repression event is partner-dependent.
    6. The shared protein-binding removal reason claimed the informative replacements "are already annotated"; amended to say so of the bZIP partners and to name the two non-bZIP partners (EP300 UniProtKB:Q09472, TRIB3 UniProtKB:Q96RU7) that none of the six listed terms covers, with why no replacement MF term is proposed for them.

