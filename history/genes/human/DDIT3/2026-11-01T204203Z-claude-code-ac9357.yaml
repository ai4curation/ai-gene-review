  summary: 'Create review: DDIT3'
  details: |
    Created the human DDIT3 (CHOP/GADD153) gene review, the last ISR candidate gene from issue #3951 without an open PR. Fetched sources with just fetch-gene and reviewed all 251 GOA rows. Deep research providers were unavailable in this environment (only claude_code configured), so the literature synthesis was written to DDIT3-notes.md rather than a -deep-research-<provider>.md file. 90 bare GO:0005515 protein-binding rows removed under the protein-binding policy; 25 correct-but-general rows modified to specific descendants; GO:0043161 removed as a substrate-not-participant error with a WRONG_TERM source defect; a WRONG_QUALIFIER source defect recorded for the GO:0005737 is_active_in IBA row; five Ensembl-propagated vascular rows derived from one mouse ENPP1 study marked as over-annotated. Three core functions recorded (pol II activator, corepressor, heterodimerization) plus two knowledge gaps. just validate human DDIT3 passes.
