  summary: 'Address third review round on DDIT3: second mouse-only IDA from PMID:30639358'
  details: |
    Third review round on PR #5855, addressing the single IMPORTANT finding plus the DUPLICATE_ASSERTION suggestion. No annotation term, action, evidence_type or qualifier changed; 251 rows before and after.

    1. The review already filed a WRONG_EVIDENCE_CODE / ORTHOLOG_TRANSFER_AS_EXPERIMENTAL source defect on the GO:0140467 IDA row from PMID:30639358, but UniProt made a second human IDA out of the same paper on the same entry: GO:0003700 DNA-binding transcription factor activity (DDIT3-goa.tsv lines 152 and 155, ECO:0000314, taxon 9606, assigned_by UniProt). Re-checked the cached paper: zero occurrences of "ChIP" or "chromatin immunoprecipitation", zero occurrences of "human CHOP", and the only CHOP perturbation is siRNA against mouse CHOP in wild-type MEFs (publications/PMID_30639358.md, the "siRNA Transfection and Knockdown CHOP" methods paragraph). So that row is the same pattern. Added a sibling source defect on it: WRONG_EVIDENCE_CODE, REPOINT, IDA -> ISO, cause ORTHOLOG_TRANSFER_AS_EXPERIMENTAL, CONFIRMED, naming UniProtKB:P35639 for WITH/FROM and noting that the two rows are one convention best raised together.
    2. Replaced the clause in the GO:0140467 defect's explanation that said only this single row is reported, with the two rows named explicitly and a note that both should be re-pointed together. This is what makes the raise-it-once argument the enum value asks for concrete rather than hypothetical.
    3. Added a clause to the GO:0003700 PMID:30639358 row's reason stating that this row's own reference contributes nothing to the MODIFY refinement, so the refinement rests on PMID:22065586 and PMID:18940792. MODIFY stands: the claim is unquestionably true for human CHOP and the shared supported_by anchor carries it.
    4. Updated the PMID:30639358 reference_review notes to say there is no ChIP anywhere in the paper and that UniProt made two human IDAs from it, replacing the singular "that row". Previously the notes said the human lines carry no CHOP manipulation while the GO:0003700 row whose own reference that is stayed silent.
    5. Took the optional DUPLICATE_ASSERTION suggestion. DDIT3-goa.tsv lines 152 and 155 are byte-identical except for the date (20240404 vs 20240208), so UniProt holds the GO:0003700 IDA assertion twice. Filed as a second defect on that row with requested_change DELETE_ROW, naming the later row as the keeper, and stating that the review holds the assertion once because GOA seeding deduplicates on the (term, evidence, reference, qualifier, supporting entities, negation) tuple, so this is not a missed row. Reported separately from the evidence-code defect because the two need different fixes.

