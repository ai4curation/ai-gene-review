  summary: 'Address second review round on DDIT3: off-claim UniProt quotes, source-defect
    cause'
  details: |
    Second review round on PR #5855. No annotation term, action, evidence_type or qualifier changed; the edits are to supporting_text, reason prose, one source-defect cause, one reference_review and one core-function description.

    1. The generic By-similarity UniProt sentence "Plays a dual role both as an inhibitor of CCAAT/enhancer-binding protein (C/EBP) function and as an activator of other genes" was still the supporting_text on nine rows, three of them KEEP_AS_NON_CORE rows whose reason argues from a different CC:FUNCTION statement a few lines away in the same record. Swapped each for the on-claim sentence: GO:0001955 blood vessel maturation -> "Acts as a major regulator of postnatal neovascularization through regulation of endothelial nitric oxide synthase (NOS3)-related signaling"; GO:0045662 negative regulation of myoblast differentiation -> "Negatively regulates; expression of BCL2 and MYOD1"; GO:0051209 release of sequestered calcium ion into cytosol -> the TRIB3...ERO1L transcription sentence that row's reason names.
    2. GO:0051209 also cited PMID:19061639, which says the S1T SERCA variant amplifies ER stress through the PERK-eIF2alpha-ATF4-CHOP pathway, i.e. CHOP as downstream readout rather than as a cause of calcium release. Dropped from this row (it remains in use on the GO:0034976 rows, where it is on-claim). The mouse IMP study the reason rests on (PMID:19752026) is not cached, so the reason now says it is cited in prose only.
    3. Dropped the same generic quote from the five MARK_AS_OVER_ANNOTATED Ensembl-propagated vascular rows (GO:0009611, GO:0036119, GO:0060840, GO:1904738, GO:1990874), where it supported nothing; those judgements rest on the propagation argument in the reason. It is retained only on GO:0046982, where it is on-topic for the dominant-negative claim and sits beside two primary quotes.
    4. The WRONG_EVIDENCE_CODE source defect on the GO:0140467 IDA row was filed with cause: OTHER. Changed to ORTHOLOG_TRANSFER_AS_EXPERIMENTAL, which the enum defines for exactly this case, so just export-source-defects groups it with the same defect from other genes; the explanation now notes that per that definition the pattern is usually a resource convention worth raising once rather than row by row.
    5. The reference_review for PMID:30639358 still read "with CHOP siRNA used directly" with correctness VERIFIED and no species qualification, contradicting that source defect. Reworded to state that the only CHOP perturbation is mouse siRNA in wild-type MEFs and that the human lines show only tunicamycin induction of GDF15.
    6. Added the human HAP1 haploid-genetics quote (PMID:32132706, "a key factor in the integrated stress response") to the GO:0140467 supported_by anchor, so the human grounding the reason claims is visible in the evidence rather than only asserted in prose.
    7. GO:0070585 reason now says why the row is KEEP_AS_NON_CORE rather than MARK_AS_OVER_ANNOTATED (CHOP overexpression alone relocalises Bax, and GO routinely annotates transcription factors to processes their target genes execute), and names the directness implied by involved_in as the weaker part of the claim.
    8. Trimmed the curation bookkeeping from core function 2's description ("the review asserts both", "is the one typed here", "the term GOA already carries, by IDA and IGI") while keeping the one-sentence justification for typing GO:0003714.

    just validate human DDIT3 passes; just backfill-record-sections genes/human/DDIT3 reports no record_section changes; just validate-quotes reports 31645 quotes verified with 0 failures.
