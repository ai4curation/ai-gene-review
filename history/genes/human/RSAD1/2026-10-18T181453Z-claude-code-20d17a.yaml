  summary: 'Create review: RSAD1'
  details: |
    Created the full GO annotation review for human RSAD1 (Q9HA92) as part of the RADICAL_SAM project, writing RSAD1-notes.md and completing all 12 seeded existing_annotations rows. Literature retrieval used the asta deep-research provider because falcon failed with an authentication (403) error, and the asta output proved to be retrieval noise, so evidence was assembled from the cached HemW/RSAD1 papers plus targeted PubMed searches (PMID:22142238, PMID:41747499, PMID:37101575, PMID:34311096, PMID:27145839, PMID:42736308, PMID:31036833 newly cached). Key decisions: removed the coproporphyrinogen oxidase activity (GO:0004109) and porphyrin biosynthesis (GO:0006779, IBA and IEA) rows because the HemW subfamily was experimentally shown to lack coproporphyrinogen dehydrogenase activity and the PAINT node carrying the biosynthetic role is placed too deep; accepted heme binding (GO:0020037, IDA) and mitochondrion; refined the cytoplasm rows to mitochondrion and GO:0051536 to GO:0051539; applied the project's treatment rule for generic rows so that GO:0003824 and the two GO:0051539 rows are KEEP_AS_NON_CORE since no catalysis is established. One core function (heme binding in the mitochondrion), no NEW rows and no proposed new terms, with the unassigned radical SAM chemistry and the untested heme-insertion step recorded as biology knowledge gaps.
