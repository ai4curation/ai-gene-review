  summary: 'Create review: LCK'
  details: |
    Reviewed all 234 GOA annotations for human LCK (ADAPTIVE_IMMUNITY TCR trunk): 54 ACCEPT, 95 KEEP_AS_NON_CORE, 64 REMOVE, 9 MARK_AS_OVER_ANNOTATED, 8 MODIFY, 4 UNDECIDED. Core functions set to non-membrane spanning protein tyrosine kinase activity (GO:0004715) in TCR signaling (GO:0050852) at the plasma membrane/immunological synapse/membrane raft, CD4 and CD8 receptor binding (GO:0042609, GO:0042610) and SH2 phosphotyrosine residue binding (GO:0001784). Generic protein binding IPI rows were removed or modified to phosphotyrosine residue binding or protein phosphatase binding where the paper supports it; an IDA protein serine/threonine phosphatase activity row (PMID:8506364, which reports Ser phosphorylation of Lck) and projected protein antigen binding were removed; downstream processes were marked non-core or over-annotated. Supporting text was quoted verbatim from cached publications; falcon deep research was generated and used as a consistency check. Validated with just validate human LCK (no errors or warnings).
