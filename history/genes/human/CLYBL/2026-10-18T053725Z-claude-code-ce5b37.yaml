  details: |
    Applied the ORGANELLES policy to CLYBL's mitochondrion (GO:0005739) rows. Four agreeing lines support the mitochondrial matrix: a cleavable N-terminal transit peptide (1-22) with no TM segment (UniProt), a soluble homotrimeric mature chain (23-340) in the crystal structure, Shen et al.'s statement that CLYBL is a mitochondrial matrix soluble enzyme (PMID:29056341), and a function on matrix CoA esters (malyl-CoA, citramalyl-CoA) protecting the matrix B12 enzyme MUT (PMID:29056341, PMID:40108300). The IEA (GO_REF:0000044) mitochondrion row was changed from ACCEPT to MODIFY -> GO:0005759; the IDA and HTP rows stay ACCEPT; a NEW IC GO:0005759 row was added; core_functions locations now name mitochondrial matrix.
