  summary: Full re-review of human SIRT5 (Q9NXA8), independent of ProtNLM2 predictions
  details: |
    Replaced the uniform UniProt FUNCTION quote with per-row primary evidence (PMID:22076378, 23806337, 24703693 full text). Resolved 12 UNDECIDED rows. Refined GO:0017136 histone deacetylase IBA to acidic deacylase MFs (SIRT5 subfamily divergence: Tyr102/Arg105, ~500-fold weaker deacetylation); removed derived chromatin remodeling IEA; accepted curator NOT protein deacetylation and NOT ADP-ribosyltransferase; marked cytochrome-c-based protein deacetylation, inner membrane, mitochondrion organization and cardiomyocyte apoptosis as over-annotated; refined mitochondrion to matrix+IMS and cytoplasm to cytosol; urea cycle kept non-core (CPS1 regulator). Rewrote description and core functions (desuccinylase, demalonylase, deglutarylase; matrix and cytosol). Relative for next review: mouse Sirt5 Q8K2C6 (same PANTHER SF10, PAINT seed of PTN000119399), no review in repo.
