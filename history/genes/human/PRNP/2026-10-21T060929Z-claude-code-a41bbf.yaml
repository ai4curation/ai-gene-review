  details: |
    Created the full AI gene review for human PRNP (P04156), reviewing all 188 GOA annotations. Established GPI-anchored external plasma membrane and lipid raft localization as the site of action, with ER/Golgi retained as non-core biosynthetic transit and cytosol/cytoplasm marked over-annotated as mislocalized-PrP quality control. Accepted octarepeat copper ion binding, amyloid-beta oligomer binding, condensate scaffold activity and the cellular response to copper; kept Fyn/mGluR5/LRP1-dependent synaptic and amyloid-beta signalling roles as non-core; marked rodent-transferred cytokine, vascular, placental and organelle-organization phenotypes as over-annotated; removed generic protein binding under the project policy. Deep research providers were unavailable, so findings were assembled from cached publications, UniProt and Reactome and recorded in PRNP-notes.md.
