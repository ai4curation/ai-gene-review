  details: |
    Authored the full AI gene review for human ADAM17 (TACE, UniProt P78536). Provider deep research was unavailable: Falcon returned 402 Payment Required and perplexity is not configured, so no *-deep-research-<provider>.md file was created; instead ADAM17-notes.md carries my own literature synthesis with inline verbatim provenance, built from ADAM17-uniprot.txt, every cached publication referenced by the GOA-seeded review, and one additional paper fetched with 'just fetch-pmid' (PMID:20676056, Kuhn et al. 2010 on ADAM10 as the constitutive alpha-secretase). All 172 seeded GOA annotations were individually reviewed (no PENDING left): 79 ACCEPT, 36 MODIFY, 26 KEEP_AS_NON_CORE, 15 REMOVE, 12 MARK_AS_OVER_ANNOTATED, 4 UNDECIDED. Generic GO:0005515 protein binding rows were removed, or modified to PDZ domain binding / integrin binding where the cited work maps a specific interaction module; parent peptidase terms were modified to GO:0004222; GO:0070573 metallodipeptidase activity and a GO:0043130 ubiquitin binding row derived from ADAM17 being ubiquitinated were removed; downstream cascade terms (PI3K/AKT, G1/S, proliferation, growth, cell motility) were marked over-annotated on the participation test, while ligand-release steps (EGFR, TNF, Notch processing, vasorin/TGF-beta) were accepted. Five core functions were written around the single sheddase activity; no NEW annotations were proposed. The notes record the ADAM10-versus-ADAM17 alpha-secretase evidence explicitly: ADAM17 serves the regulated/PKC-stimulated arm, ADAM10 the constitutive neuronal activity. Validated with 'just validate human ADAM17' (valid, 3 deliberate action-consistency warnings) and all supporting_text snippets checked as verbatim substrings of the cached publications.
