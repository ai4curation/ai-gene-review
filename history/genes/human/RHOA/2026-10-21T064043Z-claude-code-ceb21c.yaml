  summary: 'Create review: RHOA'
  details: |
    Created the full AI gene review for human RHOA (P61586), reviewing all 277 GOA annotations. Localization was resolved for an intracellular prenylated GTPase: the cytoplasmic side of the plasma membrane, cytosol, cell cortex, cleavage furrow, midbody and apical junction complex were accepted, cytoplasm and cell periphery marked TOO_GENERAL, and generic cytoskeleton modified to cell cortex plus cleavage furrow. Three core functions were defined: the GTPase switch driving stress fibre and focal adhesion assembly downstream of membrane receptors, ECT2-dependent cleavage furrow specification and cytokinesis, and apical junction assembly in epithelia, with postsynaptic actin remodelling accepted from spine FRET imaging. The 54 generic protein binding rows were removed under the project policy while myosin binding and protein kinase binding were kept; electronically transferred oxidative phosphorylation and ROS biosynthesis regulation were marked over-annotated and tissue-level developmental outputs kept as non-core. Deep research providers were unavailable; evidence came from cached publications and UniProt and is recorded in RHOA-notes.md.
