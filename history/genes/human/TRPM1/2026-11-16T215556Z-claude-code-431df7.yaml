  summary: First review of TRPM1 for the dismech vision-disorder alignment
  details: |
    First annotation review of human TRPM1, written for projects/DISMECH_VISION_ALIGNMENT (tranche 1). 51 GOA rows reviewed: 20 REMOVE, 18 ACCEPT, 6 MODIFY, 5 KEEP_AS_NON_CORE, 2 TOO_GENERAL; one NEW row (dendrite terminus, ISS from mouse). Core function: GO:0005261 monoatomic cation channel activity at the ON-bipolar dendrite terminus, the channel that mGluR6 signalling keeps closed in the dark. The 20 removals are bare protein-binding rows from one PDZ-domain affinity screen. Melanocyte rows are kept as real but non-core for the retina; endoplasmic reticulum rows are kept as non-core because bipolar cells hold a large native ER pool. Validated with just validate human TRPM1: no errors.
