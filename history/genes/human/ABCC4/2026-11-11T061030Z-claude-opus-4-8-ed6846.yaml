- type: CREATE
  outcome: changed
  summary: De-novo review of ABCC4 (MRP4) canonical surfaceome annotations
  details: |
    Reviewed all 126 existing GOA annotations for human ABCC4/MRP4 (O15439), adding a review block to every row. Accepted the ATP-driven organic-anion efflux activities and their BPs (cyclic nucleotides cAMP/cGMP, prostaglandins PGE1/E2, GSH and GSH S-conjugates/leukotrienes LTB4/LTC4, bile-acid/GSH cotransport, urate, xenobiotics/drugs) plus ATP binding/hydrolysis, ABC/transporter family MF terms, and plasma-membrane/apical/basolateral locations. Marked generic GO:0016020 membrane rows TOO_GENERAL; kept platelet-degranulation, dense-granule membrane, ciliogenesis and blood-brain-barrier transport as non-core; marked the ISS external-side-of-apical-PM rows over-annotated; and REMOVEd the NAS GO:0016404 15-hydroxyprostaglandin dehydrogenase activity (PMID:7557451 is about the HPGD enzyme, a gene/term mis-attribution recorded as a source_defect). The ~37 bare protein-binding (GO:0005515) rows were MODIFYed to GO:0030165 PDZ domain binding, since all partners are PDZ-domain scaffolds engaging ABCC4's C-terminal PDZ-binding motif. Synthesized six core functions, a standalone description, and a cited ABCC4-notes.md; just validate human ABCC4 passes.
