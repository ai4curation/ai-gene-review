  details: |
    New review of all 121 GOA rows for human FLCN, done independently of ProtNLM2 output. Deep research failed (falcon auth error, perplexity quota). Evidence came from the cached GOA publications plus mouse donor papers fetched for the ISS rows. Accepted as core: RagC/D GTPase activator activity (catalytic Arg164), FNIP-folliculin RagC/D GAP complex, positive regulation of TORC1 signaling (TFEB/TFE3 branch), lysosomal membrane, cytosol and cellular response to amino acid starvation. LDHA rows were modified to GO:0160193. Rows modified to GO:1904263: regulation of Ras protein signal transduction (Rags are not Ras subfamily), plus general TOR signalling and signal-transduction terms. Mouse knockout-phenotype ISS transfers whose sources are acts_upstream_of_or_within were marked over-annotated. Negative regulation of TOR signaling was marked over-annotated (the hyperactivation is TFEB-dependent, PMID:32612235). Bare protein binding rows were removed under policy.
