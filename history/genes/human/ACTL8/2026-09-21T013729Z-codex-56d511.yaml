  summary: Re-review ACTL8 full gene evidence and disputed inherited functions
  details: |
    Withdrew unsupported phylogenetic-loss and localization exclusions, corrected the measured-ligand/abstract claim, and withdrew two phenotype-only NEW proposals pending participation evidence. Generated analyses preserved. All 18 original annotation rows were screened. The local sequence/contact analysis remains useful, but its QuickGO human-recipient lists are not a PAINT topology reconstruction. Cached PTHR11937 confirms IBDs PTN002631484, PTN002631586 and PTN007551913; it does not establish a misplaced ACTL8 leaf. Low canonical-contact conservation also cannot prove absence of all filament structure because the analysis's ACTR3 control scores lower and still occupies an Arp2/3 branch position. Neuronal, filament, membrane, kinase-binding, NuA4 and motility claims are UNDECIDED, while compatible broad cytoplasmic/cytoskeletal inferences remain non-core. Complex membership can transfer phylogenetically; donor count, lower identity and missing target assays are not proof of failure. Source comments, questions and experiments were rewritten accordingly, without editing the generated analysis.

    PMID:41621692 explicitly reports direct Momordin Ic binding by SPR/TSA and MYC rescue in its PubMed abstract. The prior statement that no ligand had been measured, and the reference's assertion that the abstract lacked these results, were incorrect. Detailed controls and the endogenous function remain unresolved. The two NEW migration/proliferation proposals were withdrawn pending mechanistic adjudication: repeated knockdown phenotypes and a cancer context are informative, but do not yet identify the work done by ACTL8 rather than viability/metabolic consequences. This does not mean disease-context functions are intrinsically ineligible. Phenotypes remain documented in the description and references (PMID:33883901,39322809,35051678,31962007,35116946,41621692). No physiological core MF is invented to silence a validation warning. The coordinating reviewer queued one neutral OpenScientist assessment of these claims; no duplicate request was launched. just validate human ACTL8 passed. Non-NEW source metadata preserved exactly. Audit: projects/IBA_REVIEW/rereview-2026-09-20/actin-and-compartments.yaml.
