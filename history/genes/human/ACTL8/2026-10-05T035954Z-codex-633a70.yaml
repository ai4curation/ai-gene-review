  summary: Evaluate ACTL8 OpenScientist report
  details: |
    Evaluated the focused OpenScientist report for inherited synapse, axon, actin-filament, membrane, protein-kinase-binding, NuA4 and cell-motility assignments. The report was useful as a stress test but did not resolve whether ACTL8/PTHR11937:SF208 descends from the relevant PAINT nodes or has target-specific loss of each assertion; the closing phylogenetic check requires a PANTHER tree or node-to-subfamily mapping that is not currently cached in the repository. Recorded its PS00432, sequence-identity, SF208 and HPA leads with per-finding caveats, documented its GOA experimental-row and GO:0048870-to-GO:0030335 scoping errors, fetched and adjudicated PMID:30535476, and kept the disputed rows UNDECIDED rather than restoring confident removals or adding indirect cancer phenotype rows.
