  summary: 'Remove duplicated reference entries (PMID:29769718, UniProt, bioinformatics, affinage each listed twice)'
  details: |
    Rerunning the builder on an already-built file duplicated every reference it adds. The same defect was caught by the reviewer on ANKRD13D (#4100). The content is unchanged; each reference is now listed once, and the pre-push check now fails on duplicate ids.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  - references
  - proposed_new_terms
  - suggested_questions
  summary: 'Reviewer round 2: proposed-term justification rules out GO:0140313 and GO:0008047; 3xArg loss-of-function and ATP-hydrolysis quotes added; upstream mouse fix raised'
  details: |
    Justification for the proposed MF now explains why molecular sequestering activity (covalent transfer, not binding) and enzyme activator activity (raises ATP use but blocks serine transfer) do not fit. Added the 3xArg result showing the lysines are required, quoted the abstract's serine-dependent ATP hydrolysis sentence as the basis for disputing UniProt, re-pointed the cytoplasm row to the 82% identity line, and added a suggested question on revising the mouse source annotation.
