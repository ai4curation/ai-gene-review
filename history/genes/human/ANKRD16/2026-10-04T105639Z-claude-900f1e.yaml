  summary: 'Remove duplicated reference entries (PMID:29769718, UniProt, bioinformatics, affinage each listed twice)'
  details: |
    Rerunning the builder on an already-built file duplicated every reference it adds. The same defect was caught by the reviewer on ANKRD13D (#4100). The content is unchanged; each reference is now listed once, and the pre-push check now fails on duplicate ids.
