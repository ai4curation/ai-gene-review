  summary: 'Initial review of human ANKRD16: AlaRS co-regulator that accepts misactivated
    serine; tRNA modification modified to translational-fidelity editing'
  details: |
    Reviewed 8 GOA rows, 6 after the seed collapsed two date-duplicate ISS rows (all mouse-derived ISS/IEA), on PMID:29769718 (mouse, full text). GO:0006400 x2 MODIFY to GO:0106074 because ANKRD16 accepts misactivated serine before tRNA charging and modifies no tRNA nucleotide. Cytoplasm accepted, nucleus non-core. Proposed MF 'misactivated amino acid acceptor activity'. Alignment script shows the three acceptor lysines are conserved in human. UniProt function text claims Ser-tRNA(Ala) hydrolysis, which the paper tested and refuted; flagged DISPUTED.
- type: EDIT
  outcome: changed
  sections:
