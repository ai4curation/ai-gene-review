- type: CREATE
  outcome: changed
  summary: 'Review human AGGF1: the G-patch is intact but its GO term is a domain-name
    mapping; the FHA is intact and never measured'
  details: |
    First full review of human AGGF1 (Q8N302). 24 GOA rows reviewed, 8 NEW rows
    proposed; reconciliation asserted programmatically on the full
    (term, evidence, reference, WITH/FROM) key by
    genes/human/AGGF1/AGGF1-bioinformatics/reconcile_goa.py.

    Actions: 10 ACCEPT, 10 KEEP_AS_NON_CORE, 3 MODIFY, 1 MARK_AS_OVER_ANNOTATED,
    8 NEW.

    The gene's name makes three claims and they were tested separately.

    1. G-patch. The domain is intact and canonical - AGGF1 matches 8/8 of the
       columns conserved at >=80% across 34 annotated G-patch domains in 33
       reviewed human proteins, and all 8 are identical to the corresponding
       residues of NKRF, whose G-patch is the one resolved bound to DHX15. But
       the derived term GO:0003676 nucleic acid binding is a domain-name mapping:
       across all 11 reviewed human G-patch proteins QuickGO returns in full, it
       is carried by IEA and by nothing else, and 0 carry it with any
       experimental code, while 6 carry GO:0003723 RNA binding experimentally.
       MODIFY to GO:0003723, which AGGF1 has in its own right by RNA-IP against
       NEAT1.

    2. FHA. Every canonical phosphothreonine-recognition residue is retained -
       G437, R438, S454, N478 - transferred from both CHEK2 and Rad53 FHA1 by
       domain-local alignment, with the two anchor sets agreeing exactly wherever
       both resolve. The tumour mutation data agree on the same surface (G437E
       impairs function; R447Q and V497I, off the surface, do not). And no
       phosphopeptide has ever been measured on this protein, so no
       phosphoprotein-binding term is proposed: untested, not refuted.

    3. Angiogenic factor. Supported, but the activity maps to residues 604-613, a
       motif in neither named domain, acting through integrin alpha5beta1.

    Other findings recorded:
    - The E133K/Klippel-Trenaunay association that named the gene has been
      refuted (PMID:16443853, PMID:17103452) and effectively withdrawn by the
      originating laboratory (PMID:18564129); ClinVar calls the variant
      Benign/Likely benign. UniProt still presents it as functional - filed as a
      correction to report.
    - Coverage, not over-annotation, is this gene's defect: of 35 relevant papers,
      22 produced no GO annotation anywhere and only 2 ever produced an AGGF1
      annotation. AGGF1 has no nucleus, paraspeckle, splicing, integrin-binding or
      receptor-ligand annotation at all.
    - GO:0042802 from PMID:39251607 marked over-annotated: IntAct gives AGGF1
      experimentalRoleA=bait in all 635 proximity records, and a BirA* bait
      biotinylates itself.
    - Proposed a new term, TNFSF12 binding, modelled on the existing
      GO:0038057 TNFSF11 binding, plus a note that GO:0043120's definition is
      narrower than its own child placement.

    Bioinformatics: 8 reproducible scripts under AGGF1-bioinformatics/, with
    audit_claims.py guarding the reported numbers against drift (11 guards, all
    exercised by --self-test).
