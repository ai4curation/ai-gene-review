- type: CREATE
  outcome: changed
  summary: 'Review human ARHGAP4 GO annotations: coverage defect, inexpressible GAP
    substrate specificity, arginine finger verified but uninformative'
  details: |
    All 23 GOA rows reviewed: 12 ACCEPT, 7 KEEP_AS_NON_CORE, 2 MARK_AS_OVER_ANNOTATED,
    1 MODIFY, 1 REMOVE. Seven rerunnable analyses committed under
    genes/human/ARHGAP4/ARHGAP4-bioinformatics/, each with a --self-test that breaks its
    input or its anchor on purpose and requires every guard to fire, with negative
    controls that must stay silent.

    Coverage, not over-annotation. QuickGO queried by reference (species-blind, because
    the mechanistic work is on rat) shows 16 of 19 primary ARHGAP4 papers produced no GO
    annotation on the gene in any species. Human P98171 has no experimental
    molecular-function or biological-process annotation at all; its only IDA rows are
    localisation. Every GO_REF:0000107 row projects a curated rat row traceable to
    PMID:12414125 or PMID:17804252, so the electronic rows are the load-bearing part of
    this entry rather than the disposable part. Nothing was removed.

    Substrate specificity is inexpressible, verified across three independent services
    (OLS4, api.geneontology.org, and this repo's cache/go/terms.csv) rather than across
    endpoints of one. GO:0005100 Rho, GO:0005099/GO:0005098 Ras, GO:0008060 ARF,
    GO:0005097 Rab and GO:0046582 Rap GAP activity are all merged into GO:0005096 and
    survive only as synonyms; GO:0017048 is merged into GO:0031267. GO:0005096 has zero
    is_a children -- it is not childless, since QuickGO reports GO:1902773 via
    capable_of, and those are different claims. QuickGO is not used as an authority
    because it silently resolves merged ids to the surviving term flagged not obsolete,
    which it did for 7 of the 9 ids queried. No term proposed; substrate recorded as
    core_functions[].substrates and an RO:0002233 has_input extension.

    Arginine finger reported honestly in both directions. The anchor is structurally
    verified, not assumed: PDB 1TX4 chain A residue 49 (SIFTS-mapped from ARHGAP1
    Arg-282) is ARG with its guanidinium 2.73 A from the AlF4- transition-state
    analogue. ARHGAP4 carries R543; the computed alignment agrees with UniProt's
    independent PROSITE-ProRule SITE in all 11 panel members. But retention settles
    nothing: ARHGAP11B retains the residue and carries two NOT|enables GO:0005096 IDA
    rows, while OCRL1 (IDA), ARHGAP36, ARAP2 and FAM13B carry GO:0005096 without the
    arginine. Recorded as a machine-checkable residue_claims entry.

    One REMOVE, added in review: GO:0005515 protein binding with NCKAP1L. Repo policy
    routes generic protein binding to MODIFY when the paper supports a more informative
    MF and otherwise to REMOVE, and the branch walk over all 106 descendants of
    GO:0044877 shows there is nothing to modify to -- no WAVE/SCAR or Hem-1 binding term
    exists, and GO:0031209 SCAR complex is a component rather than something to bind.
    Removal does not mean the interaction is false; UniProt records it as this protein's
    only SUBUNIT statement with experimental evidence, and the partner identity survives
    in the review prose and the description.

    One MODIFY: GO:0007010 cytoskeleton organization -> GO:0051497 negative regulation of
    stress fiber assembly. A comparator check over seven well-curated RhoGAPs refuted
    three of the four replacements I had drafted -- GO:0007266 and GO:0007165 are
    conventions rather than errors, and GO:0005938 cell cortex is carried by none of the
    seven, so the 1996 sub-plasma-membrane observation became a knowledge gap instead.

    Two demotions. GO:0010764 negative regulation of fibroblast migration encodes the
    NIH/3T3 reporter line rather than a biological context. GO:0051963 regulation of
    synapse assembly is the only inherited assertion whose PAINT seed set contains no
    ARHGAP4-lineage member (Srgap2, Srgap3, and the hominin-specific SRGAP2B/SRGAP2C),
    and the same curator placed the synaptic CC terms on a sibling node, PTN002680580,
    that ARHGAP4 does not inherit. Marked over-annotated, not removed. Conversely
    PTN002680572 is seeded by ARHGAP4's own accession alone and is recorded as the
    expected marker of experimental grounding on the target, never CIRCULAR_OR_REDUNDANT.

    Affinage gates were clear (P98171, no non-human token, pairwise win, faith 100) and
    its narrative is cited, but it returned 11 citations and missed every human-genetics
    paper and the family-wide RHOGAP kinetics survey (PMID:27481945). Each miss is titled
    for a disease or for the family rather than for function. Two of them, PMID:10425039
    and PMID:18489790, carry the most load-bearing evidence in the review: a 16-year
    targeted follow-up showing ARHGAP4 is dispensable in human, and the one direct test
    of the compensation hypothesis, which refutes its transcriptional version. Affinage
    also cites PMID:40817404 without noting that PMID:40553870, an earlier version of the
    same work, is withdrawn; both are now recorded with the mapping between them.

    The dispensability argument rests on an IMPC query rather than on prose. Stated as
    "zero significant phenotypes" the claim is ambiguous, because an untested gene
    returns the same zero; querying both Solr cores separates the cases. Arhgap4 is
    0 significant across 413 statistical tests -- tested and clean -- while Srgap1 and
    Srgap3 sit at 0/0, never phenotyped. Lepr, Dmd and Trp53 are positive controls and
    the run aborts if any returns nothing.

    audit_review.py checks what CI does not, including verbatimness of file: quotes and
    reference completeness. The latter caught four PMIDs cited in review_notes without
    being declared on its first run, and fixing that is what brought PMID:10425039 into
    the review. Two things also went wrong while writing it and were caught by running
    it rather than reading it: repo_root() resolved to genes/human because a stray
    genes/human/publications/ exists in this repo, and a self-test mutation anchor
    matched twice, where the exactly-once assertion fired instead of silently mutating
    the wrong row.
