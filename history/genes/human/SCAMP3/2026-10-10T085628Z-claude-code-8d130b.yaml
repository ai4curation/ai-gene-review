  summary: 'Manual review of HTP vesicle-type annotations: SCAMP3'
  details: |
    OMICS_EVIDENCE vesicle-row manual review (projects/OMICS_EVIDENCE.md; dossiers and decisions in projects/OMICS_EVIDENCE/htp/vesicle_review/). The rule-based vesicle disposition was withdrawn; each protein was judged from its dossier using the MISEV2018 protein categories (PMID:30637094) as a guide. Manual re-review of GO:0070062 extracellular exosome (PMID:20458337): ACCEPT -> KEEP_AS_NON_CORE. Basis: Endosomal/post-Golgi membrane protein. The earlier ACCEPT said SCAMP3 is required for EV biogenesis, but the cited work (PMID:19158374, PMID:23418353) shows it regulates ESCRT-dependent MVB sorting of EGFR, not EV biogenesis. Transmembrane/lipid-anchored protein of the plasma membrane or endosomal system (UniProt); such proteins are expected EV contents (MISEV2018 category 1). True, but not its core location.
