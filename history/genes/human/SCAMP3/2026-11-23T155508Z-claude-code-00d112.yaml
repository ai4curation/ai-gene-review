  summary: Replace obsolete GO:0070676 with GO:0032509 on NEW row and in core_functions
  details: |
    GO obsoleted GO:0070676 'intralumenal vesicle formation' on 2026-10-20 with
    no replaced_by, giving only two 'consider' targets (GO:0032509, GO:1990182)
    and the reason "the term is not clearly defined and usage has been
    inconsistent". The id was asserted here on an action: NEW row, which
    validation does not catch because existing_annotations term ids are
    deliberately not hard-validated, and it still carried its pre-obsoletion
    label. Found by the corpus scan in issue 6783.

    Change: the NEW row now asserts GO:0032509 'endosome transport via
    multivesicular body sorting pathway', evidence IMP (was IDA, which did not
    match the cited loss-of-function evidence), and the same swap was made in
    core_functions[0].directly_involved_in. The surrounding summary and reason
    were rewritten to argue for the transport claim and to say why GO:1990182
    exosomal secretion was not used. GO:0016197 endosomal transport was removed
    from directly_involved_in because GO:0032509 is its descendant; it remains
    as the proposed_replacement_terms entry on the GO:0006887 MODIFY row.

    Rationale against CLAUDE.md's NEW bar: SCAMP3 is not merely required for the
    process. It is a tetraspanning protein in the endosomal membrane whose PSAP
    and PY motifs dock ESCRT-I (TSG101) and NEDD4-family ligases at the site of
    sorting (PMID:19158374), and Falguieres, Castle and Gruenberg, Traffic
    2012;13:131-42 (PMID:21951651, abstract checked at PubMed; not in
    publications/ and not read in full) report a role in EGFR sorting into
    multivesicular endosomes and in lysosomal targeting. The budding itself is
    ESCRT-III/VPS4 work, so the claim that survives is about cargo transit
    through the MVB route, not the membrane-deformation event GO judged
    ill-defined. The row continues to cite the deep-research file, which
    CLAUDE.md treats as an uncited and possibly out-of-date source.

    Reported for issue 6783: core_functions ids are hard-validated, but the
    obsolete id there did not fail. Re-running the validator against the
    pre-change file produced no obsolete-term error, so the blind spot is not
    confined to NEW rows. just validate human SCAMP3 passes after the change,
    with one pre-existing propagation_review warning.

    Notes recorded in genes/human/SCAMP3/SCAMP3-notes.md.
