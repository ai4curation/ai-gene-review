  summary: 'Create review: SLC34A2'
  details: |
    Created the full AI gene review for human SLC34A2 / NaPi-IIb (O95436), reviewing all 39 GOA annotations. Sharpened the localization to the apical plasma membrane and brush border membrane of polarized epithelia, modifying the generic plasma membrane and membrane rows to the apical term, marking the antibody-imaging nucleoplasm and cytosol rows over-annotated for a polytopic membrane transporter, and keeping the vesicle rows as a non-core regulated insertion pool. Defined one core function: electrogenic type II sodium/phosphate cotransport importing phosphate with three sodium ions from the luminal space, accepting the symporter activity, sodium and phosphate binding, phosphate and sodium transmembrane transport, sodium-dependent phosphate transport and phosphate homeostasis rows; oestrogen responsiveness was kept as a non-core regulatory context. Deep research providers were unavailable; evidence came from cached publications and UniProt and is recorded in SLC34A2-notes.md.
