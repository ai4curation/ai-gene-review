  summary: 'Create review: UBE2F (Q969M7, canonical NEDD8 E2)'
  details: |
    New full review of canonical human UBE2F (Q969M7) in GENE__ACC folder; the existing genes/human/UBE2F folder covers the F8WDQ9 fragment. Independent of ProtNLM2 predictions. Falcon deep research failed (403 auth) and perplexity-lite fallback timed out, so the review uses cached primary literature (PMIDs 19250909, 23201271, 23300442, 27591266, 29932898, 33268465, 38605244, 39762645) and UniProt. Evolutionary grounding: live PANTHER places UBE2F in PTHR24068:SF129, distinct from UBE2M/UBC12 SF132; PAINT node PTN000630367 spans both, so NEDD8 E2 activity is ancestral, and the node's deliberate NOT ubiquitin-E2 assertions are respected (bioinformatics/RESULTS.md). 24 GOA rows reviewed: NEDD8 conjugating enzyme activity, protein neddylation and cytosol ACCEPT; NEDD8 transferase activity and post-translational protein modification MODIFY to their specific descendants already carried; protein binding to RBX2 and DCNL2/3 MODIFY to ubiquitin-like protein ligase binding; UBA3 and high-throughput protein binding rows REMOVE. No NEW terms; CRL5 downstream outcomes (NOXA, APOBEC3G degradation) not annotated as UBE2F processes.
