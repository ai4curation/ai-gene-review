  summary: Harmonize GO:0002357 ectopic-overexpression rows to MARK_AS_OVER_ANNOTATED
  details: |
    Harmonized human ABI3 (Q9P2A4, PTHR10460:SF7; 47 GOA annotations: 22 ACCEPT, 1 MODIFY, 13 KEEP_AS_NON_CORE, 2 MARK_AS_OVER_ANNOTATED, 8 REMOVE, 1 UNDECIDED) with mouse Abi3 and PTHR10460: marked the two GO:0002357 (defense response to tumor cell) rows (IEA GO_REF:0000120 and IMP PMID:21223585) as MARK_AS_OVER_ANNOTATED (reflecting cell-autonomous motility/senescence modulation upon ectopic ABI3 re-expression in carcinoma cell lines rather than immune defense against tumor cells), documented why sign-neutral GO:0030334 (regulation of cell migration, IBA and IDA PMID:11956071) is retained as ACCEPT rather than refined to GO:0030336 (because directional motility suppression in PMID:11956071 and PMID:26428302 rests exclusively on forced overexpression while endogenous loss-of-function migration directionality remains unestablished), resolved pre-existing protein-binding policy warnings on the nine GO:0005515 IPI rows (MODIFY -> GO:0035591 on PMID:17101133; REMOVE on the eight high-throughput binary interactome rows), harmonized the two GO:0042802 (identical protein binding) IPI rows (PMID:25416956, PMID:32296183) to KEEP_AS_NON_CORE, clarified ABI3's apparent C-terminal SH3-domain interaction with PAK ("seems to interact", PMID:11956071) vs domain-unspecified IRSp53/BAIAP2 association in the title-only Ann Oncol letter (PMID:18480067), added an UNVERIFIED reference_review on PMID:18480067, and explicitly noted curator deference on abstract-only/title-only curations (PMID:17101133 GO:0030027 IDA, PMID:11956071 GO:0030334 IDA and GO:0005737 NAS, and PMID:18480067 GO:1900028 NAS).
