  summary: De-novo review of all 59 GOA annotations for SLC22A4 (OCTN1), ergothioneine/carnitine/organic
    cation transporter (mixed mechanism)
  details: |
    Reviewed every GOA row for SLC22A4 (Q9H015, OCTN1). MIXED-mechanism SLC22 member. DEFINING function = ergothioneine transport (high-affinity, physiological antioxidant uptake). Also carnitine (Na+-dependent, low-affinity - OCTN2/SLC22A5 is the dedicated carnitine transporter), TEA (Na+-independent pH-dependent antiport), acetylcholine (bidirectional export). IBD5/RA genetic associations. Core MF (all live, QuickGO non-obsolete; GO:0015101 obsolete, avoided): GO:0170001 ergothioneine transmembrane transporter activity (real term, no prior annotations - used directly, so NO NTR needed, unlike the SLCO2B1 steroid-sulfate case) added as NEW row (IDA PMID:15795384 + knockout physiology); GO:0005277 acetylcholine transmembrane transporter activity; GO:0015651 quaternary ammonium group transmembrane transporter activity. Mechanism handled per-substrate (not blanket facilitated-cation). Actions (59+1 NEW=60): 27 ACCEPT, 19 KEEP_AS_NON_CORE (carnitine low-affinity; mitochondrion/mito-membrane IDA/HTP but partly overexpression-based/debated, PM primary; gabapentin row deferred per paralog-abstract rule), 7 MARK_AS_OVER_ANNOTATED (rat-ortholog electronic physiology transfers; Na-independent organic ANION transport conflicts with cation selectivity; choline catabolic process = transporter not enzyme), 3 REMOVE (bare GO:0005515; PDZ facet retained via GO:0030165), 3 TOO_GENERAL (roots), 1 NEW (GO:0170001). source_defects: 1 (WRONG_REFERENCE, resource REACTOME, PROBABLE - Reactome GO:0015199 EXP on OCTN1 cites PMID:10966938 which is the paralog OCTN2/SLC22A5 characterization; term correct for OCTN1, reference mis-keyed; also reference_review MISCITED). Batch 13.
