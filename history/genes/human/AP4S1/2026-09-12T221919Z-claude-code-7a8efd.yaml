  summary: 'Create review: AP4S1'
  details: |
    Full end-to-end review of human AP4S1 (Q9Y587, sigma4-adaptin, PANTHER PTHR11753). All 14 GOA rows reviewed: 12 ACCEPT, 1 MODIFY (GO:0012505 endomembrane system to GO:0032588 trans-Golgi network membrane, too general), 1 REMOVE (GO:0031904 endosome lumen, a Reactome compartment-inheritance artefact in which the reaction output complex AP4:APP is placed in that compartment and all four cytosolic AP-4 subunits inherit it; QuickGO reference projection: 11 annotations over 5 entities). Two NEW rows: GO:0005198 structural molecule activity (IDA, PMID:11409905, where epsilon and beta4 associate only in the presence of sigma4) and GO:0006892 post-Golgi vesicle-mediated transport (IMP, PMID:31915823, four AP4S1 patient fibroblast lines retaining ATG9A in the TGN). The single IBA (GO:0016192 from PTN000204281, the only annotated PAINT node in PTHR11753, no IRD or IKR in the family) is NO_FAILURE_CORE: all 11 gene donors resolved, 10 of 11 carry direct experimental evidence, and because the donors disagree on sub-process the parent term is the correct LCA rather than a granularity mismatch. Ten propagation_review blocks with scripted source_entities. Five knowledge gaps including the finding that neither ARBA row can be reproduced from its own rule's published condition sets. A new bioinformatics analysis shows the dileucine basic patch is half-complete in AP-4: sigma4 retains Arg15 while epsilon carries Thr44 where gamma1, alphaC and delta all carry the patch Arg, under a 6/6 method control. Validated with just validate (clean, one deliberate deep-research warning), checkquotes (84 quotes, 0 failures), a GOA-to-YAML reconciliation script, a duplicate-key check and the terms.csv deletion/duplicate checks.
