  details: |
    Class IIa HDACs carry His976 in place of the catalytic Tyr and are about 1000-fold less active; activity in HDAC4 immunoprecipitates comes from HDAC3 (PMID:17956988, PMID:11804585). The GO:0004407 and GO:0141221 rows (IBA, IEA, three IDA) move from ACCEPT to MARK_AS_OVER_ANNOTATED (no REMOVE; experimental rows are deferred to), with propagation_review on the IBA row; the GO:0033558 rows become KEEP_AS_NON_CORE (non-histone substrates Hsp70, RUNX3). core_functions updated. The description named H803 as the substituted residue; UniProt gives His803 as a separate active-site histidine and position 976 as the His that replaces the Tyr, so it now says His976. Matches the HDAC5 review and modules/histone_deacetylation.yaml.
