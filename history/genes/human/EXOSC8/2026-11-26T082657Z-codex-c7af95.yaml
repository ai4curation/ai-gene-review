  summary: 'Create review: EXOSC8'
  details: |
    Created a de-novo human EXOSC8/RRP43 review as the PTHR11097 seed review.
    Reviewed all 135 GOA rows one-for-one, preserving each high-throughput IPI row and its WITH/FROM partner under the one-row-per-GOA-row rule.
    Accepted the conserved RNA exosome complex, nuclear RNA-processing and direct AU-rich RNA-binding annotations.
    Accepted the NOT RNA exonuclease row and removed bare GO:0005515 protein binding rows under the project policy.
    Marked three EXOSC8 identical-protein-binding IPIs as over-annotated because UniProt places EXOSC8 in the EXOSC5-EXOSC8 heterodimer of Exo-9 rather than a homodimer.
    Marked the yeast-derived TRAMP-dependent tRNA-surveillance IBA as over-propagated to human EXOSC8.
    Checked gocams/index.tsv and did not add a GO-CAM or module review because no production GO-CAM names EXOSC8 and this family is a subset of the RNA exosome rather than a standalone module.
