- type: CREATE
  outcome: changed
  summary: 'Review human ARHGAP11B: removed a Reactome-projected GTPase activator
    activity that two curated IDA NOT rows negate'
  details: |
    Full review of all 17 GOA rows (TSV rows 17, seeded entries 17, no collapse) plus one
    NEW row: ACCEPT 11, MODIFY 2, REMOVE 4, NEW 1. 11 + 2 + 4 + 1 = 18 = 17 GOA rows + 1 NEW.

    Headline defect: GOA ships a flat contradiction inside one gene's record. Two curated
    IDA rows assert NOT|enables GO:0005096 (PMID:25721503, PMID:27957544) while a Reactome
    TAS row asserts enables GO:0005096. Querying QuickGO by reference shows the positive
    comes from a bulk projection - Reactome:R-HSA-8981637 has a single set-level catalyst,
    "GTPase activator activity of RHOA GAPs [cytosol]", and hands GO:0005096 to 21 entities
    and GO:0005829 to 21 entities, all TAS. Reactome:R-HSA-9012999 hands GO:0051056 to all
    103 of its participants.

    All four REMOVEs are non-experimental (three Reactome TAS, one InterPro IEA). No
    experimental annotation was removed, modified or demoted. The two MODIFYs replace bare
    GO:0005515 with GO:0044325 transmembrane transporter binding for the SLC25A4/ANT1 and
    SLC25A5/ANT2 partners, which are the gene's mechanism rather than screen noise.

    NEW GO:2000179 (IMP, PMID:36098218): every existing GO:0021987 row is gain-of-function,
    four of five in non-human systems. The only loss-of-function evidence for this gene,
    and the only perturbation of it in human cells, supports no GOA row at all.

    The committed analysis under ARHGAP11B-bioinformatics/ refutes the expected reason for
    the removals rather than confirming it. The catalytic arginine finger R87 is RETAINED,
    verified reciprocally against ARHGAP11A's own annotated finger and ARHGAP1's
    structurally resolved one (PDB 1TX4), so the pseudo-enzyme argument from missing
    catalytic residues does not apply here. The sharper result is that residue identity and
    curated activity are decoupled in BOTH directions within this family: ARHGAP11B keeps
    the arginine and is experimentally GAP-dead, while ARHGAP36 has a threonine at its own
    annotated arginine-finger position and UniProt still asserts GTPase activator activity
    for it by similarity (ECO:0000250). Of 6 of 66 reviewed human RhoGAP-profile proteins
    that have lost the arginine, only 1 carries an experimentally supported (ECO:0000269)
    statement of inactivity. So the catalytic-residue screen could not have predicted
    ARHGAP11B's inactivity and would not have been decisive even where it fires - a
    pipeline gating GAP-activity terms on arginine-finger presence keeps the term on this
    protein. What the truncation removes is 2 of 24 mapped
    GAP:GTPase interface positions, reported as corroboration rather than as an independent
    argument.

    Separately reportable: UniProt's Rho-GAP DOMAIN feature on ARHGAP11B (49..250) runs 30
    residues past the last residue homologous to ARHGAP11A and into the human-specific
    frameshift C-terminus, making the annotated domain on the inactive truncated paralog 11
    residues LONGER than on the catalytically active parent (49..239).

    Recorded as a positive: PAINT gave this gene nothing (no IBA row; UniProt records zero
    PAN-GO annotations) despite PANTHER placing it in PTHR15670:SF4, a subfamily named for
    its paralog. The predicted IBA paralog-sweep did not occur; the leak came via Reactome.

    Neocortex-expansion results are attributed in each row to the system they were measured
    in - mouse in utero electroporation, transgenic mouse, ferret, marmoset - rather than
    asserted of the human protein in human tissue.
