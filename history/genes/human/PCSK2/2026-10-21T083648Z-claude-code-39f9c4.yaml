    New full review of human PCSK2 (P16519), the PC2-subfamily (PTHR42884:SF13) relative of DROME/amon at PAINT node PTN000082858, independent of ProtNLM2 predictions. All 32 GOA rows reviewed: serine-type endopeptidase, peptide hormone processing and secretory granule accepted as core; generic peptidase/proteolysis/protein processing terms modified to GO:0004252/GO:0016486; transport vesicle modified to secretory granule; insulin processing kept as non-core because human beta cells process proinsulin with PC1/3 (PMID:32291281); ortholog-derived enkephalin and IAPP processing kept as non-core; nervous system development marked over-annotated; both protein binding rows removed. Added NEW GO:0120116 glucagon processing from human PC2/proglucagon experiments (PMID:28719828, PMID:32291281). Falcon deep research failed (403 auth) and is recorded in the notes; added cached literature on human islets, 7B2 and rodent substrates.
