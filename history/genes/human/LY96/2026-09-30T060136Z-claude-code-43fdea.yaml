  summary: 'Create review: LY96'
  details: |
    Reviewed all 104 GOA annotations for human LY96 (MD-2): 59 ACCEPT, 32 KEEP_AS_NON_CORE, 10 MODIFY, 3 REMOVE, no NEW. MD-2 is treated as the LPS-binding coreceptor of TLR4: LPS binding (GO:0001530), coreceptor activity (GO:0015026) and TLR4 binding (GO:0035662) are its own activities, while GO:0001875 LPS immune receptor activity (which includes transmembrane transmission) is accepted on the IBA/IDA rows but recorded in core_functions as contributes_to, since TLR4 performs transmission. Eight IPI protein-binding rows with TLR4 were modified to Toll-like receptor 4 binding; Der p 2, LCN2 and MESD protein-binding rows removed as uninformative. Detection of LPS and TLR4 signalling accepted as core; endosome membrane (Reactome), positive regulation of TNF production and IBA positive regulation of LPS-mediated signalling kept as non-core. Deep research returned an irrelevant Asta retrieval and was not used. just validate passes with no warnings; all 190 supporting_text quotes checked verbatim against cached sources.
