  details: |
    Ran OpenScientist (3 iterations) on whether the LRGUK GUK-like domain is an active guanylate kinase or a pseudoenzyme. The fold is intact (~1.3 A to GMP/ADP-bound GK), but the Walker A Ser/Thr is Arg428 (92/93 vertebrate orthologs), and the GUK1 active-site arginines map to Tyr454/Lys547/Ala558 (residues checked locally). Predicted pseudoenzyme, with degeneracy distinct from MAGUK GUKs. Gap OPEN -> NARROWING; nucleotide binding is unmeasured.
