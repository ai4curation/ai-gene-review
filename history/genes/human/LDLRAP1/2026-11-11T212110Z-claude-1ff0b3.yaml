- type: REVIEW
  outcome: changed
  summary: Complete GO annotation review of LDLRAP1 (ARH), a clathrin-cargo adaptor
  details: |
    First gene reviewed from the MOLECULAR_ADAPTOR_ACTIVITY phase-1 worklist. Reviewed all 90 GOA annotations: ACCEPT 48, REMOVE 17 (bare GO:0005515 interactome protein-binding rows, per policy), KEEP_AS_NON_CORE 10, MODIFY 9, MARK_AS_OVER_ANNOTATED 6. MODIFY calls: 6 protein-binding rows whose interactor is AP2B1/beta2-adaptin -> GO:0035612 AP-2 adaptor complex binding; lateral correction of GO:0035591 signaling adaptor activity and GO:0030159 signaling receptor complex adaptor activity -> GO:0035615 clathrin-cargo adaptor activity (LDLR endocytosis is not signaling); GO:0005737 cytoplasm -> GO:0005829 cytosol. Over-annotations: neurofilament/axon localisation, vague regulation-of-protein-binding, and rows where LDLRAP1 is the object of regulation (miRNA target, VSMC proliferation). Core functions: GO:0035615 clathrin-cargo adaptor activity and GO:0001784 phosphotyrosine residue binding, grounded in PMID:12221107 and PMID:15728179 (verbatim quotes). Added notes file and reference_review (HIGH/VERIFIED) for the two anchor papers. Validates (1 best-practice warning).
