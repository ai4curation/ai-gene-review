  summary: 'SRY family review: human SRY'
  details: |
    SRY family batch review (human, mouse, rat). Core function: HMG-box DNA-binding transcription factor (RNA polymerase II-specific), DNA binding and bending, activating SOX9 through its testis enhancer in pre-Sertoli cells; male sex determination and Sertoli cell differentiation. Generic DNA binding refined to DNA binding, bending plus cis-regulatory sequence-specific binding; cell differentiation IBA refined to Sertoli cell differentiation; bare protein-binding rows refined to PDZ domain binding (NHERF2), transcription corepressor binding (KRAB-O) or DNA-binding TF binding (Oct4), or removed for unidentified partners. Nuclear speck kept non-core because it is contested. Mouse: Sry-T and Sry-S functional isoforms recorded; spermatogenesis and an in vitro Sry-Oct4 complex marked over-annotated; two MGI rows flagged as possible wrong references. Human: NEW calmodulin binding (PMID:15746192). OpenScientist deep research used as leads; quotes verified against cached papers.
