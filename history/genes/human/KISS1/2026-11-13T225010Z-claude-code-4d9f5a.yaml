  summary: 'Create review: KISS1'
  details: |
    De novo review of all 14 GOA rows for human KISS1 (Q15726), the kisspeptin precursor, keeping the ligand/receptor division of labour consistent with the separately reviewed KISS1R. Nine extracellular-region and clade-level rows accepted; GO:0007186 modified to the two supported siblings GO:0007200 and GO:0007218; the Muir protein-binding IPI (partner KISS1R) modified to GO:0031773 and the HuRI UBQLN2 row removed under the protein-binding policy; the legacy ProtInc GO:0007010 cytoskeleton row marked over-annotated because the actin response is executed by the receptor-expressing cell; the mouse-derived bone-resorption ISS kept as non-core. One NEW row adds the missing ligand MF GO:0048018 receptor ligand activity, chosen over the descendants GO:0005179/GO:0005184 because the peptide acts as a CNS neuropeptide, a circulating placental hormone and a local paracrine ligand, and because GO already uses GO:0048018 for the kisspeptin-10 chain. Proposed a kisspeptin receptor signaling pathway term under GO:0007218. Could not verify: all cited papers except PMID:39151001, PMID:38346942 and PMID:32296183 are abstract-only in the cache, so no experimental annotation was overruled on abstract grounds; the rat and mouse mechanism papers are cited as mechanism, not as human evidence. paint-losses reports no IRD or IKR on this gene's lineage.
