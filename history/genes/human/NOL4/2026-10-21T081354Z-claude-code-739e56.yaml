  summary: 'Create review: NOL4'
  details: |
    De-novo review of human NOL4 (O94818) as the experimentally characterised relative of fly CG46301 (same PANTHER family PTHR12449; NOL4 in SF17). Deep research failed (falcon auth error, perplexity-lite quota), so the review rests on directly read literature (PMID:9813152, 25366156, 28125049, 34065612, 36282054, 24337411, 33613681) and a new ortholog comparison (NOL4-bioinformatics: mouse Nol4 P60954 is SF17 and 93.6% identical; NOL4L is SF19). Nucleolus (IEA, TAS) and nucleoplasm (IDA) accepted as the only experimentally established human properties; ProtInc RNA binding (TAS) set UNDECIDED because the abstract reports no RNA-binding data and the full text is unavailable. No NEW terms: the mouse Mlr1/Mlr2 coregulator data are heterologous overexpression reporter assays and MGI annotates mouse Nol4 ND for MF/BP. ProtNLM2 predictions were not consulted.
