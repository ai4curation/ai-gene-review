  summary: Review EML1 microtubule binding and organization
  details: |
    Reviewed 39 EML1 source annotations using primary human microtubule and soluble-tubulin experiments, source-specific interaction evidence, and verified mouse/PAINT provenance. Accepted 11, modified 4, retained 23 as non-core and left calcium binding undecided. The independent peer identified an explicit spindle-pole observation in the original Discussion, resolving two initially tentative locations without claiming endogenous human localization. Summarized one microtubule-binding core; preserved two natural products, source dictionaries and original normal caches, with no new annotations or publication quotations. Added research notes and a reproducible database-evidence archive.
