  summary: 'Create: human GRIN1 review (181 GOA rows)'
  details: |
    First review of human GRIN1 (Q05586). All 181 seeded GOA rows reviewed: 124 ACCEPT, 30 MODIFY, 12 KEEP_AS_NON_CORE, 8 MARK_AS_OVER_ANNOTATED, 6 REMOVE, 1 UNDECIDED. ISS rows were traced to their rat (P35439) and mouse (P35438) donor annotations through QuickGO and judged on the donor papers. Removals: glutamate binding (IDA, PMID:7685113; glutamate binds GluN2, GluN1 binds glycine), propylene metabolic process (ISS from a mouse row citing an unrelated paper, recorded as a source defect for ARUK-UCL), and four generic protein binding rows. General terms were refined to descendants the gene already carries (relationships checked in QuickGO). Three core functions: NMDA glutamate receptor activity (contributes_to), glycine binding, glycine-gated cation channel activity with GluN3 (contributes_to). Deep research: falcon and perplexity-lite providers were not available in the environment; see GRIN1-notes.md. No PAINT losses on the lineage. Validated with just validate human GRIN1.
