  summary: 'GRIN1: two OpenScientist hypothesis runs; fix glutamate-binding reasoning'
  details: |
    OpenScientist hypothesis test 1 (GluN1 glycine-site occupancy inhibits GluN1/GluN3 current) returned SUPPORTED; its key primary citations were verified against PubMed. Added citations (PMID:17214961, PMID:30425244) to core function 3 and registered the report as a file: reference; no verdict changed. OpenScientist hypothesis test 2 (GluN1-alone oocyte currents need an endogenous Xenopus GluN2 partner) returned PARTIALLY SUPPORTED: the glutamate-binding REMOVE is confirmed by direct evidence (PMID:16641235 no detectable glutamate binding to the GluN1 domain; PMID:16214956 no HEK293 response without GluN2), but the Xenopus-partner mechanism is refuted (XenU1 excluded, PMID:11809857, and is a kainate-binding protein). Rewrote the glutamate-binding reason to drop the unsupported mechanism and cite the direct evidence; verdict unchanged. Key primary citations from both reports verified against PubMed before use; reports cited with reference_review.
