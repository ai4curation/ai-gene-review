  summary: 'Create review: PLPBP'
  details: |
    Reviewed all 8 GOA rows for human PLPBP (O94903): accepted pyridoxal phosphate binding (IBA, IEA) as the core molecular function, vitamin B6 metabolic process (IBA), cytoplasm (IBA, IEA, NAS), cytosol (IDA) and mitochondrion (HTP, kept at the root organelle term). No NEW rows. Proposed a GO term for intracellular pyridoxal 5'-phosphate homeostasis and recorded the unknown mechanism as a BIOLOGY knowledge gap. Literature: PubMed search of 106 records, 40 cached. Bioinformatics (PLPBP-bioinformatics/): AlphaFold model superposed on four PLP-bound homolog structures places the Schiff-base lysine at Lys47; 28 reported patient variants checked against the RefSeq CDS and placed on the structure, with ClinVar and gnomAD v4 sets; the evidence is uniformly loss of function. OpenScientist: gene deep research completed and is cited, with two disputed claims recorded in its reference_review; two hypothesis jobs (mitochondrion row, exposed-variant surface) were launched and their status is in the notes file. just validate human PLPBP passes. GO-CAM: none contains this gene. The dismech disease entry is curated in a separate session.
