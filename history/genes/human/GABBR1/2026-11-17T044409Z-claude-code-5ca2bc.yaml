  details: |
    De novo review of human GABBR1 (Q9UBS5), all 79 GOA rows. Deep research failed (falcon and perplexity providers unavailable), so literature was researched by hand from cached PubMed records, recorded in GABBR1-notes.md. QuickGO annotation search returned HTTP 500 for the taxonName field, so the GOA file was fetched through the same code path without that field. Recorded a WRONG_REFERENCE source defect for three ComplexPortal rows citing PMID:987231, matching GABBR2. Cited PMID:15174078 (rat globus pallidus immunogold, misfiled by SynGO on Gabrb1) as support for existing pre/postsynaptic rows; no NEW rows added. Validated with just validate human GABBR1.
