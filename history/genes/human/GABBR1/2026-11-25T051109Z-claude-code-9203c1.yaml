  details: |
    Follow-ups from the PR 6487 review. (1) Added functional_isoforms for 1a (Q9UBS5-1; sushi-domain axonal targeting, PMID:20107064; presynaptic heteroreceptors, PMID:16701209), 1b (Q9UBS5-2; spines and postsynaptic Kir3 inhibition, PMID:16701209; Purkinje-cell transcripts, PMID:9844003) and 1e (Q9UBS5-5; secreted/membrane-associated ectodomain that binds GABBR2, PMID:10906333). (2) Named the rat sources behind two projected rows. GO:0033602 comes from RGD's IDA on rat Gabbr1 from PMID:12872287 (systemic baclofen reduces drug-evoked dopamine release); kept non-core. GO:0032811 comes from RGD's IMP from PMID:14568556, the only row RGD made from that paper (QuickGO 2026-11-25); its title and abstract measure noradrenaline, not epinephrine, release. The row is now MODIFY to GO:0010700 negative regulation of norepinephrine secretion, with a WRONG_TERM source defect for RGD (CONFIRMED, title and abstract depth). (3) Added a suggested question: GO:0004965 is not under GO:0099528 (QuickGO ancestors 2026-11-25). Both papers cached and added to references.
