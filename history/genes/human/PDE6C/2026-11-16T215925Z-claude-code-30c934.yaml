  summary: First review of PDE6C for the dismech vision-disorder alignment
  details: |
    First annotation review of human PDE6C (cone cGMP phosphodiesterase alpha-prime subunit), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1) together with the other PDE6 subunits. 18 GOA rows reviewed: 11 ACCEPT, 4 MODIFY, 2 MARK_AS_OVER_ANNOTATED, 1 REMOVE; one NEW row, cGMP binding (IDA on the human protein, PMID:39739818). Core function: GO:0047555 3',5'-cyclic-GMP phosphodiesterase activity of the PDE6C homodimer, in GO:0141190 at the cone disc membrane. Removed: nuclear-transcribed mRNA catabolic process, no-go decay (IDA, PMID:21127010). The cited paper characterises achromatopsia alleles of PDE6C; under any reading the protein does not carry out mRNA decay, and the same term appears on the PDE6C activity in four cone GO-CAM models where a fifth uses the phototransduction pathway term. A new GO term, cone photoreceptor phosphodiesterase 6 complex, is proposed because GO has only the rod complex. Validated with just validate human PDE6C: no errors.
