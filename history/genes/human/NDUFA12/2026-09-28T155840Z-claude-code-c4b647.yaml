  summary: 'Address re-review IMPORTANT 6 on PR #3066: restore GO:0006120 as core
    BP, keep GO:0032981 removed'
  details: |
    Response to IMPORTANT 6 in the 2026-09-25 re-review of PR #3066, which found
    that the previous fix for IMPORTANT 2 removed one term too many from
    core_functions.directly_involved_in. Applied the reviewer's minimal fix:
    restored GO:0006120 mitochondrial electron transport, NADH to ubiquinone and
    left GO:0032981 mitochondrial respiratory chain complex I assembly removed.

    Grounds, all checked before editing rather than taken from the review text:
    (1) GO:0006120 verified current and non-obsolete via OLS (label
    "mitochondrial electron transport, NADH to ubiquinone"). (2) Comparator check
    per CLAUDE.md - 25 human Complex I subunit reviews in genes/human/ carry
    GO:0006120; NDUFA11-ai-review.yaml:324-328 is the same core_functions block,
    so the term is the convention for accessory subunits in this role, not a gap
    being invented. (3) GO:0006120 is a descendant of GO:0042775 (QuickGO
    ancestors), which NDUFA12-goa.tsv already carries by IMP (PMID:24746669), so
    the direct involvement refines an existing experimental process assertion.
    (4) GO:0032981 stays out on the ground the reviewer accepted and the notes
    file already argued: complex I assembly is unaffected in NDUFA12-knockout
    cells because NDUFAF2 substitutes at the same site, making NDUFA12 dispensable
    for assembly per se - the one place it should differ from its paralogous
    accessory subunits.

    Also rewrote the core_function description to state the split explicitly
    (structural subunit of the complex that performs the activity -> GO:0006120
    involved_in and GO:0008137 contributes_to; assembly withheld; proton
    translocation / PMF ATP synthesis / aerobic respiration held non-core), and
    updated NDUFA12-notes.md line 51 so the curation journal and the YAML no
    longer disagree, which is what the reviewer flagged as point (a).

    No annotation action, GO term, or existing_annotations row was changed. just
    validate human NDUFA12 passes with 4 warnings; the one naming GO:0006120
    ("not reflected in existing_annotations") is the same class as the
    pre-existing GO:0005198 warning and reflects that GOA has no GO:0006120 row
    for NDUFA12 - no NEW annotation row was added, since the reviewer scoped the
    fix to core_functions.
