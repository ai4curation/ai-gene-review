  summary: Re-review NOTCH1 evidence and context-dependent IBA transfer
  details: "Replaced the SLIT-source-based axon-guidance exclusion with uncertainty informed by direct noncanonical\
    \ Notch guidance biology; restored supported FIH inhibitor activity and core parent annotations; awaits neutral\
    \ human guidance adjudication. The SLIT-seeded PTN002911625 trace does not establish a NOTCH1-specific axon-guidance\
    \ mechanism, but it also does not refute one. The axon-guidance IBA is now UNDECIDED: direct Drosophila evidence\
    \ identifies a noncanonical Notch/Disabled/Trio pathway for axon growth and guidance independent of canonical\
    \ cell-fate signaling [PMID:18062953, “Molecular separation of two signaling pathways for the receptor, Notch.”].\
    \ A neutral focused OpenScientist report has been submitted by the coordinating reviewer to distinguish directional\
    \ guidance, neurite growth and cell-fate effects in human NOTCH1; no duplicate was launched. Enzyme-inhibitor\
    \ activity is retained as non-core because Notch ankyrin repeats compete with HIF for FIH hydroxylation [PMID:17573339,\
    \ “Asparaginyl hydroxylation of the Notch ankyrin repeat domain by factor inhibiting hypoxia-inducible factor.”],\
    \ with follow-up FIH sequestration/cross-talk evidence [PMID:18299578]. Broad transcription/coactivator and\
    \ cell-periphery terms remain core where they directly capture canonical NOTCH1 function. DLL3 was removed from\
    \ the list of canonical activating trans ligands. All 378 rows were screened, preserving pleiotropic developmental\
    \ processes as non-core where appropriate. All current annotations were screened and just validate human NOTCH1\
    \ passed. Exact non-NEW source fields were preserved. Audit: projects/IBA_REVIEW/rereview-2026-09-20/context-transfer.yaml.\n\
    \ Focused OpenScientist report subsequently incorporated with exact excerpts and primary references PMID:21246649,29343637,10465425,27040987.\
    \ Corrected the report’s misidentification of SLIT source identifiers as Notch orthologs; human guidance conservation\
    \ remains UNDECIDED after independent adjudication. Report complete; audit status reviewed."
