  summary: 'Create: UNC13D (Munc13-4) review, 29 rows'
  details: |
    First review of UNC13D, the FHL3 gene, as part of the granule-killing campaign and under the ClinGen Mendelian project's standing instruction on generic binding.

    27 GOA rows plus two proposed annotations: 11 ACCEPT, 5 MARK_AS_OVER_ANNOTATED, 5 MODIFY, 3 TOO_GENERAL, 2 KEEP_AS_NON_CORE, 2 NEW, 1 UNDECIDED.

    The five MODIFY rows are the bare GO:0005515 rows whose WITH/FROM names RAB27A (three) or RHOG (one plus one), refined onto GO:0031267 small GTPase binding. That is the deepest term available, not a compromise: GO:0017137 Rab GTPase binding and GO:0017048 Rho GTPase binding are both alt_ids of GO:0031267 in the current edit file and survive only as NARROW synonyms, so there is no Rab- or Rho-specific child to use. Each of the three RAB27A rows has its own evidence for the interaction, including the mutation-spectrum paper, whose two-hybrid assay is easy to miss behind a genotyping title. The sixth binding row, with the Staphylococcus aureus Efb protein, is UNDECIDED: the cited paper's full text is cached, runs to about 84 kB and never mentions Munc13-4, so the proteomic hit list is in a supplement this review cannot read.

    Two proposed annotations. GO:0101004 cytolytic granule membrane (IC) adds the sub-compartment beside the kept lysosome rows, as the organelle policy requires, on colocalisation plus the Munc13-4-positive granule imaging plus the topology (no signal peptide, no transmembrane segment, C2 domains binding membrane lipids from the cytosol). GO:0043316 cytotoxic T cell degranulation (IC) fills a gap confirmed by a comparator check run by term id with the hit count checked non-zero first: of the 12 human rows on that term, the carriers are this gene's own fusion partners (STX11 five times, STXBP2 twice, SNAP23, VAMP8) while the cargo carries it zero times, so the convention admits the fusion machinery and UNC13D was the one member of the module missing from it.

    A second candidate was declined on the same kind of check. GO:0061792 secretory granule maturation, which UniProt's wording and the paper title both appear to license, carries six human rows between it and its descendant, all on neuroendocrine dense-core-vesicle biogenesis genes; what Munc13-4 does is deliver a separate endosomal vesicle that fuses with an already-formed granule. Recorded as a suggested question rather than annotated.

    Three mouse-ortholog projections are marked over-annotated for one shared reason: a secretion factor acquiring the downstream processes its cargo affects (vasculature development, platelet dense granule organization, positive regulation of substrate adhesion-dependent cell spreading). The two Reactome rows placing the protein in the azurophil granule lumen and the extracellular region are also marked over-annotated, with a PROBABLE WRONG_TERM source defect at requested_change CHECK, because the cached Reactome entry holds only the event summary and not the participant list.
