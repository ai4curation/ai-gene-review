  summary: Initial AI review of human FGF10 GO annotations (156 rows) for the FGFR
    signaling module
  details: |
    Reviewed all 156 GOA rows (110 ACCEPT incl. 75 Reactome extracellular TAS, 27 KEEP_AS_NON_CORE, 9 MARK_AS_OVER_ANNOTATED, 5 MODIFY, 4 REMOVE, 1 UNDECIDED). Removed family-root IBA to cytoplasm (secreted ligand) and uninformative protein binding rows; modified FGFR2 protein binding to GO:0005111, plasma membrane to cell surface, process-execution terms to positive regulation terms. Core functions: type 2 FGFR binding with FGFR signaling/MAPK, growth factor activity with epithelial proliferation, chemoattractant activity with branching morphogenesis and lung bud outgrowth. Wrote description, reference reviews, notes, questions and experiments.
