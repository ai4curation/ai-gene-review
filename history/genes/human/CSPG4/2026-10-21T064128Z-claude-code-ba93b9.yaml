  summary: 'Create review: CSPG4'
  details: |
    Created the CSPG4 review: all 73 GOA annotations reviewed. CSPG4/NG2/MCSP is a single-pass type I plasma-membrane proteoglycan with a 2200-residue exposed ectodomain; Golgi-lumen and lysosomal-lumen rows were kept as non-core because they record Reactome glycosaminoglycan biosynthesis and degradation reactions on its chondroitin sulfate chains rather than functional locations. Core functions are coreceptor/signalling-platform activity driving CDC42/ACK1/p130Cas-dependent spreading, and PDZ-motif scaffolding; 21 generic protein-binding rows from a PDZ fragmentomics screen were modified to PDZ domain binding and the IBA signal transduction row to intracellular signal transduction.
