  summary: De-novo review of ABCC3 (MRP3) canonical surfaceome annotations
  details: |
    Reviewed all 59 seeded GOA annotations for human ABCC3/MRP3 (O15438): 38 ACCEPT, 14 MODIFY, 4 KEEP_AS_NON_CORE, 2 MARK_AS_OVER_ANNOTATED, 1 TOO_GENERAL. Accepted the core ATP-driven basolateral efflux functions (ABC-type xenobiotic and glutathione-S-conjugate transporter activity, glucuronoside and icosanoid/LTC4 transport, ATP binding/hydrolysis, basolateral and basal plasma membrane). Refined general plasma membrane/membrane rows to basolateral plasma membrane (GO:0016323), xenobiotic metabolic process to xenobiotic transport (GO:0042908), and carboxylic acid transport to bile acid and bile salt transport. Kept weak bile-acid transport as non-core, marked transmembrane transporter activity TOO_GENERAL, and flagged the two NAS transport-across-blood-brain-barrier rows (PMID:26590417, PMID:30280653) as over-annotated since those general BBB reviews do not mention ABCC3. Authored description, 3 core_functions, notes, and reference reviews; all 68 quotes verified.
