  summary: De-novo review of all GOA annotations for SLC52A2 (RFVT2), a plasma-membrane
    riboflavin transporter
  details: |
    Batch 29 review of all GOA annotations for SLC52A2 (Q9HAB3, RFVT2), a plasma-membrane riboflavin (vitamin B2) transporter of the SLC52 family; finalized from an earlier INITIALIZED pass. Core MF GO:0032217 riboflavin TM transporter activity (Na+/Cl--independent, KM ~0.33 uM; IDA) + BP GO:0032218 riboflavin transport at the plasma membrane; loss-of-function causes riboflavin-transporter deficiency (BVVLS2). Actions (21 rows): 16 ACCEPT; 3 REMOVE (bare GO:0005515 protein binding IPI x2, interactors CDC23/FAM209A; and GO:0062124 4-hydroxybutyrate receptor activity, a superseded GPR172A/GHBh1 mis-identification - the protein is RFVT2 with no GPCR fold and UniProt keeps the GHB role only as Probable/ECO:0000305); 1 KEEP_AS_NON_CORE (GO:0016323 basolateral PM); 1 MARK_AS_OVER_ANNOTATED (GO:0006771 riboflavin metabolic process - transporter moves intact riboflavin). Support cites curated UniProt CC:FUNCTION/CC:SUBCELLULAR LOCATION (ECO:0000269) and the primary characterization papers. Addressed PR #7112 review (ai4c-reviewer): GO:0062124 -> REMOVE with biological rationale; re-cited the PMID:17197387 PM row to the curated UniProt location; dropped a misused proposed_replacement_terms on the GO:0006771 MARK row. Validates cleanly; quotes verbatim.
