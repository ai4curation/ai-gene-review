  summary: 'Create review: CD63'
  details: |
    Created the CD63 review: all 77 GOA annotations reviewed. CD63 is a tetraspanin whose steady-state pool is on late endosome, MVB/intraluminal-vesicle, lysosome, melanosome and secretory-granule membranes, with a functional plasma-membrane and cell-surface pool (extracellular loop exposed) that increases on degranulation and is released on exosomes. TIMP1 protein-binding rows were modified to signaling receptor activity; three uninformative interaction rows (EspZ, FRET-PLA methods paper, HuRI TMEM80) were removed; broad compartment terms were modified to the specific compartments already supported experimentally. Core functions: tetraspanin organization of VEGFR2/beta1-integrin and TIMP1 signaling complexes, and ESCRT-independent PMEL sorting for melanosome biogenesis.
