  summary: 'Create review: TLR1'
  details: |
    Reviewed all 80 seeded GOA annotations for human TLR1 (Q15399) against cached primary literature and Falcon deep research. TLR1 is modelled as the triacyl-lipopeptide-selecting partner of TLR2: core functions are contributes_to pattern recognition receptor activity in the TLR1-TLR2 complex at the plasma membrane (TLR1:TLR2 signaling pathway, detection of triacyl lipopeptide) and triacyl lipopeptide binding (added as NEW from the TLR1-TLR2-Pam3CSK4 structure). The IDA contributes_to GO:0001875 lipopolysaccharide immune receptor activity was modified to GO:0038187 because TLR1:TLR2 does not bind LPS, and the derived IEA LPS-mediated signaling pathway was removed. Protein binding rows were modified to TLR2 binding or Toll-like receptor binding where supported, otherwise removed; cytokine-regulation rows kept as non-core; microglial and macrophage activation marked over-annotated. just validate passes with no warnings; reference validation passes.
