  summary: 'Create review: EREG'
  details: |
    Reviewed all 183 seeded GOA annotations for EREG (O14944); provenance notes are in EREG-notes.md because deep-research providers were unavailable. Localization conclusion is secreted extracellular for the shed mature growth factor, which accounts for 89 rows including 83 Reactome reactions, plus plasma membrane for the uncleaved type I membrane precursor proepiregulin; the seven clathrin-coated endocytic vesicle membrane rows were kept as non-core because they reflect ligand internalised with its receptor. Core function rows for EGFR binding, receptor ligand activity, receptor tyrosine kinase activator activity and the EGFR, ERBB2-EGFR, ERBB2-ERBB4 and ERBB4-ERBB4 pathways were accepted. Two rows attributing nuclear transcription to the secreted ligand were marked as over-annotations, the cytokine-mediated signaling row was modified to the EGFR pathway, and the two positive regulation of phosphorylation rows were refined to peptidyl-tyrosine phosphorylation. Bare protein-binding rows were modified for EGFR and ERBB4 and removed for four high-throughput hits. Ovarian, immune, organismal and cell-type-specific proliferation rows were kept as non-core. Two core functions were recorded.
