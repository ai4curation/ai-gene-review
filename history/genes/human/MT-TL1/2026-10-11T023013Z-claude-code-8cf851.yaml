  summary: 'Create: MT-TL1 (mitochondrial tRNA-Leu(UUR)) ncRNA review'
  details: |
    New ncRNA review fetched with ai-gene-review fetch-ncrna (RNAcentral URS000061A10B_9606, resolved via HGNC:7490); product_type set to TRNA. GOA has two IEA rows: GO:0030533 triplet codon-amino acid adaptor activity (Rfam2GO) ACCEPTED as the core MF, and GO:0006412 translation MODIFIED to GO:0032543 mitochondrial translation. Core function: UUR leucine codon decoding in mitochondrial translation, grounded in PMID:15477592 (wild-type tRNA decodes UUA and UUG). No NEW process terms for tRNA aminoacylation or wobble uridine modification, because MT-TL1 is the substrate of LARS2 and MTO1/GTPBP3 in those steps. Six PMIDs verified in PubMed and cached; just validate human MT-TL1 passes. MT-TL1 was not added to the mitochondrial tRNA charging module: there it would be a synthetase substrate, its own adaptor activity lies outside the module boundary (mitoribosome), and LARS2 is not modelled.
