  details: |
    De-novo review of canonical NARF Q9UHQ1 (paired reference for ProtNLM2 target J3KS48), in alias folder NARF__Q9UHQ1 because genes/human/NARF holds J3KS48. Falcon and perplexity-lite deep research both failed (auth/quota); reviewed from cached literature, UniProt, PANTHER 19 (SF124) and QuickGO PAINT node PTN002614243. Accepted lamin binding (IBA, IPI), lamin filament, nuclear lamina, nucleus, nucleoplasm; nucleolus (HPA) non-core; nuclear lumen MODIFY to nucleoplasm + lamin filament. Added NEW transcription coactivator activity and positive regulation of transcription by RNA pol II from two independent cell-line studies (PMID:36490339, PMID:41655866), flagged human-only. No Fe-S assembly or hydrogenase terms transferred from paralog NARFL (different subfamily, PAINT omission, negative aconitase knockdown PMID:18270200). ProtNLM2 predictions not consulted.
