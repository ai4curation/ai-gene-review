  summary: Add premetazoan-origin assessment
  details: |
    Additive ORIGINS_OF_MULTICELLULARITY Track B pass on the COMPLETE CDH1 review. Read choanoflagellate and early-animal cadherin literature (PMID:18273011, 18276888, 22837400, 20817718, 27189570, 30629955). Concluded that cadherin EC-domain proteins predate animals, but classical cadherins and the beta-catenin-binding cytoplasmic domain (Pfam PF01049, 0 entries in Choanoflagellata/Filasterea/Ichthyosporea vs 23,575 in Metazoa) are animal-specific, with the cadherin-beta-catenin complex shown biochemically in Nematostella. Appended two sentences to description, six references with reference_review, three suggested_questions, and an evolutionary note (action unchanged, ACCEPT) on the GO:0008013 IBA row. Track C: CDH1 IBD nodes PTN000616280 (30 TreeGrafter IEA rows on S. rosetta F2UD23/F2UFV3/F2USU1) and PTN008601603 (5 IBA rows on M. brevicollis A9V8Y4) place beta-catenin binding, catenin complex and adherens junction terms on choanoflagellate cadherins that lack the CCD; reported only, no other genes edited. Added reproducible script CDH1-bioinformatics/premetazoan_check.py.
