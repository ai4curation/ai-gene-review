  details: |
    Second gene from the MOLECULAR_ADAPTOR_ACTIVITY worklist and the enzyme-substrate adaptor (GO:0140767) worked example. Reviewed all 170 GOA annotations: ACCEPT 82, MODIFY 38, REMOVE 24, KEEP_AS_NON_CORE 22, MARK_AS_OVER_ANNOTATED 4. The 61 GO:0005515 protein-binding rows were split by partner: MTOR (P42345 + mouse ortholog, 24 rows) MODIFY -> GO:0019901 protein kinase binding; TOS-motif substrates EIF4EBP1/RPS6KB1/AKT1S1 (11 rows) MODIFY -> GO:0140767 enzyme-substrate adaptor activity; other partners (MLST8, BRAF, singletons, 24 rows) REMOVE per policy. cytoplasm rows ACCEPTed; distal ISS/IEA rows (social behavior, osteoclast/odontoblast differentiation, xenobiotic) MARK_AS_OVER_ANNOTATED; mTORC1 downstream processes KEEP_AS_NON_CORE. Core functions: GO:0140767 enzyme-substrate adaptor activity (substrate presentation) and GO:0030674 protein-macromolecule adaptor activity (Rag-GTPase lysosomal recruitment), both in_complex GO:0031931 TORC1 complex, grounded in PMID:12747827/24403073/37541260/26588989 with verbatim quotes. Added notes and reference_review for 4 anchor papers. Validates; 21 advisory supported_by warnings on experimental ACCEPT rows whose papers are not cached.
