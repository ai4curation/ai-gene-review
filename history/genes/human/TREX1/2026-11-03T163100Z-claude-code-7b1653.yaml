  summary: 'Create review: TREX1 (cGAS-STING cohort)'
  details: |
    De-novo review of all 56 GOA rows for human TREX1 (Q9NSU2), the negative-regulator arm of the cGAS-STING cohort. No deep-research provider was reachable, so the literature synthesis is in TREX1-notes.md rather than a provider file. Recorded three core functions (3'-5' DNA exonuclease; ER-tethered negative regulation of cGAS activation at ruptured micronuclei; DNase-independent restraint of the oligosaccharyltransferase complex). Removed the two MGI IDA rows from PMID:16713580 (MutSalpha/MutLalpha complex binding) as an ATRIP mis-attribution, with a source defect for MGI; modified part_of GO:0008250 to GO:0062062 complex binding; marked the three PMID:10391904 NAS process rows over-annotated; raised a SUSPECTED UniProt topology query; proposed a CC term for the mammalian micronucleus. just validate human TREX1 passes with no warnings.
