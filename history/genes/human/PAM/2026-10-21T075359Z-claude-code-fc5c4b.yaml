  summary: 'Create review: PAM (P19021)'
  details: |
    De-novo review of human PAM, the experimentally characterised SF14 relative of quail A0A8C2TBA7, independent of ProtNLM2 predictions. Falcon deep research failed (Edison 403) and perplexity-lite timed out; review based on UniProt, GOA-cited papers and newly cached PMIDs 30054598, 39137152, 34089560, 19604476, 35380039. Accepted human-IDA PHM (GO:0004504) and PAL (GO:0004598) activities, peptide amidation, Cu/Zn binding and secretory granule membrane. Removed the IC cellular response to oxidative stress (PMID:39880951 attributes CTAPs to non-enzymatic oxidative cleavage; source defect recorded for UNIPROT), response to zinc ion (in vitro cofactor reconstitution) and generic protein binding. Generic MF/BP terms marked TOO_GENERAL; membrane and transport vesicle membrane modified to secretory granule membrane; NEW trans-Golgi network from human EndoC-betaH1 data. Noted that PAINT propagated only GO:0004504 (not PAL) from PTN000073733; human PAL is directly assayed.
