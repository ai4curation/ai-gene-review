  summary: 'Create review: EDN2'
  details: |
    New review of human endothelin-2 (P20800) for the LIGANDS_IN_SIGNALING campaign, from a
    manual PubMed search (no deep-research provider available). All 43 GOA rows reviewed. Core
    function: hormone activity (child of receptor ligand activity) involved in the endothelin
    receptor signaling pathway and its PLC-activating branch. endothelin B receptor binding (IPI,
    IBA) MODIFIED to hormone activity per LIGANDS_IN_SIGNALING decision 4; cytokine-mediated
    signaling pathway MODIFIED to endothelin receptor signaling pathway (EDNRB-mediated macrophage
    chemotaxis); positive regulation of calcium-mediated signaling MODIFIED to positive regulation of
    cytosolic calcium ion concentration. NEW: GO:0160135 (PMID:1917960). cell tip growth REMOVED
    (misread of endothelial tip cells); mouse retinal overexpression projections marked
    over-annotated; two mouse axon rows UNDECIDED (full texts not read). Added mouse genetics on
    ovulation and postnatal survival as references. Validated with ai-gene-review validate --terms
    (no errors; only environment warnings) and quote_check (all quotes verified). The EDN2 step in
    modules/endothelin_receptor_signaling.yaml was checked and is consistent; not edited.
