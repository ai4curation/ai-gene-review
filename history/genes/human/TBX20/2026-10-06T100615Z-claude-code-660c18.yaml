  summary: 'Create review: TBX20'
  details: |
    Reviewed all 81 GOA annotations for human TBX20 (mostly mouse-derived ISS/IEA). Core function is Pol II DNA-binding TF activity (activator and repressor) with partner-TF binding (NKX2-5, GATA4/5, TBX5) and SMAD1/5 sequestration; core processes heart tube elongation, chamber formation, AV canal development, atrial septum morphogenesis, cardiomyocyte proliferation. Removed rat-derived positive regulation of apoptotic process (source paper shows silencing induces apoptosis); marked Xenopus overexpression-based endoderm/lateral mesoderm formation as over-annotated; added NEW SMAD binding and negative regulation of SMAD signal transduction. Manual literature notes written because deep research providers were unavailable.
