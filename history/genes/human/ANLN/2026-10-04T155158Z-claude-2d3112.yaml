  summary: 'Initial review of human ANLN: contractile-ring scaffold; bleb regulation
    sign corrected, exit-from-mitosis and proximity cadherin rows removed, NEW RhoA
    and PIP2 binding'
  details: |
    23 GOA rows. Cytokinesis, contractile ring, cortex, nucleus and midbody accepted; IBA rows from opisthokont node PTN001853010. Actin binding modified to actin filament binding. Positive regulation of bleb assembly modified to negative (depletion causes premature and large blebs). Regulation of exit from mitosis (TAS) and BioID cadherin binding removed. Septin rows, podocyte migration and bleb location kept as non-core. NEW small GTPase binding (RhoA) and PI(4,5)P2 binding, both IDA.
