  summary: 'Initial review of human ANLN: contractile-ring scaffold; bleb regulation
    sign corrected, exit-from-mitosis and proximity cadherin rows removed, NEW RhoA
    and PIP2 binding'
  details: |
    23 GOA rows. Cytokinesis, contractile ring, cortex, nucleus and midbody accepted; IBA rows from opisthokont node PTN001853010. Actin binding modified to actin filament binding. Positive regulation of bleb assembly modified to negative (depletion causes premature and large blebs). Regulation of exit from mitosis (TAS) and BioID cadherin binding removed. Septin rows, podocyte migration and bleb location kept as non-core. NEW small GTPase binding (RhoA) and PI(4,5)P2 binding, both IDA.
- type: EDIT
  outcome: changed
  sections:
  - description
  - existing_annotations
  - core_functions
  - references
  - suggested_questions
  summary: 'Address PR #4151 review: add adaptor MF, split PIP2 core function, cytosol non-core'
  details: |
    Added NEW GO:0030674 protein-macromolecule adaptor activity (IDA, PMID:18158243 with PMID:12479805 and PMID:22197245) and made it the MF of the first core function. Added a third core function for PI(4,5)P2 binding (cleavage furrow). Cytosol (Reactome TAS) changed to KEEP_AS_NON_CORE. Description now attributes myosin II binding to Xenopus anillin. Added PMID:28147230 and PMID:34321459 as references without correctness, plus suggested questions on actin bundling and on the acts_upstream_of_or_within qualifier.
