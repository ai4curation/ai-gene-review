  summary: Review the five other SIRT2 rows that cite the Sir2 paper (PMID:12887892)
  details: |
    Added to ai4curation/ai-gene-review#6331 at the user's request. Six rows of this review cite a study of Sir2 in skeletal muscle differentiation (PMID:12887892). Its abstract does not say which sirtuin Sir2 is; UniProt cites the paper in its mouse Sirt1 entry (Q923E4) for function, the interaction with MYOD1 and PCAF and mutagenesis of His-355, and not in its SIRT2 entry, so the Sir2 of the study is probably SIRT1. The transcription factor binding row was handled earlier in this pull request; the other five rows, which were never REMOVE or UNDECIDED, were reviewed at the user's request, each claim judged on evidence about SIRT2 itself. Bare protein binding with KAT2B (IntAct) goes from MODIFY to REMOVE under the protein-binding policy: the earlier redirection to transcription factor binding read the partner as MyoD, and the paper gives no function for SIRT2. Histone acetyltransferase binding stays ACCEPT on the interaction of SIRT2 with p300 (PMID:18722353 and the UniProt record). Negative regulation of DNA-templated transcription goes from KEEP_AS_NON_CORE to TOO_GENERAL: it is true of SIRT2 (RELA, HIF1A) and entailed by negative regulation of transcription by RNA polymerase II, kept on three rows. Negative regulation of striated muscle tissue development goes from KEEP_AS_NON_CORE to UNDECIDED: studies of Sirt2 itself do not support it (deletion delays muscle regeneration, PMID:35636510; in aged muscle Sirt2 weakens Myf5 activity, PMID:41904135), and an experimental row is not removed without its full text. Response to redox state goes from ACCEPT to UNDECIDED: the author statement concerns Sir2 and nothing read shows SIRT2 mediating a response to the redox state itself. Each of the five rows carries a WRONG_GENE_PRODUCT source defect (PROBABLE, to be checked), on IntAct for the protein binding row and on UniProt for the others. The reference entry for the paper has a reference_review (relevance LOW, correctness MISCITED, with the uncertainty stated) and its two findings no longer name SIRT2. The summary of the cell differentiation row, which cited the paper for a role in muscle, now cites the Sirt2 knockout study. On the two transcription factor binding rows the quotes from the Sir2 papers moved from the row to the source defect. Actions changed: [42] protein binding (GO:0005515; IPI, PMID:12887892): MODIFY -> REMOVE; [183] negative regulation of striated muscle tissue development (GO:0045843; IDA, PMID:12887892): KEEP_AS_NON_CORE -> UNDECIDED; [184] negative regulation of DNA-templated transcription (GO:0045892; IDA, PMID:12887892): KEEP_AS_NON_CORE -> TOO_GENERAL; [185] response to redox state (GO:0051775; NAS, PMID:12887892): ACCEPT -> UNDECIDED. Rows revised without a change of action: [18] cell differentiation (GO:0030154; IEA, GO_REF:0000043), KEEP_AS_NON_CORE; [98] DNA-binding transcription factor binding (GO:0140297; IPI, PMID:12887892), ACCEPT; [99] DNA-binding transcription factor binding (GO:0140297; IPI, PMID:15126506), ACCEPT; [178] histone acetyltransferase binding (GO:0035035; IPI, PMID:12887892), ACCEPT. Added to the references list and cached in publications/: PMID:35636510, PMID:41904135. Validated with ai-gene-review validate --terms: no error and no new warning against the state before the edit.
