  details: |
    Follow-up after the maintainer ruling of 2026-11-14 on MODIFY (CLAUDE.md): a refinement to a deeper term needs the row's own evidence, while lateral corrections are a separate use of MODIFY. Row revised without a change of action: [18] cell differentiation (GO:0030154; IEA, GO_REF:0000043), MODIFY to negative regulation of fat cell differentiation (GO:0045599). The earlier reason described the change as a refinement of a general term; the row's own evidence is a UniProt keyword and cannot support a deeper term. The reason now says what the change is: a correction of the role, because SIRT2 regulates differentiation through its deacetylase activity and does not itself carry it out, redirected to the regulation term that the review keeps on two rows. Validated with ai-gene-review validate --terms: no error and no new warning.
