  summary: Withdraw the refuted GO:0051607 virus-defense proposal
  details: |
    Part of a single sweep repairing fabricated supporting_text across the gene reviews written in PR #2956. Those reviews set full_text_unavailable: true on supported_by entries whose cited publication is cached in full; that flag suppresses the repo's verbatim-substring validator, so every quote it covered entered the repo unverified. 76 of the 79 flagged entries quoted text that is not in the cited paper.

    Each entry was either re-grounded on a verified verbatim quote from the same paper, or the citation was deleted and its claim moved into review.reason as an explicit inference. No curation decision was changed: action, term, evidence_type, original_reference_id and proposed_replacement_terms are untouched unless stated below.

    Citation repair plus one annotation withdrawn on new evidence.

    Repair: 1 entry re-grounded, 3 citations deleted. The same two references had been pasted onto both the bacterium and the virus annotation, so each carried one about the wrong kind of pathogen.

    Withdrawal: a blinded OpenScientist function-assignment run (3 iterations, 738s, prior review decision withheld, no references supplied) found the direction of SIRT2's effect on virus replication to be virus-specific and, where infectious progeny is the readout, pro-viral -- the opposite sign to GO:0051607. Both decisive infectious-progeny studies point that way (dengue, PMID:34147476, inhibitor effect abolished by SIRT2 knockdown; HIV-1, PMID:41883165, >1 log10 in macrophages and humanized mice), as do six HBV studies and the HSV-1 G3BP1/cGAS-STING mechanism. The antiviral side rests on activation gain-of-function, signalling surrogates, and a minor isoform opposing the dominant one.

    Deleted rather than set to REMOVE: the row was an AI proposal (action: NEW, no original_reference_id) and SIRT2 carries no viral-defense annotation in GOA, so REMOVE would fail validation on a not-in-GOA term. GO:0051607 was also dropped from directly_involved_in on the GO:0140773 demyristoylase core function, the description rewritten to state the viral relationship positively, and the report added as a file: reference with four verified findings.

    Verification on the run rather than trust: all eight key PMIDs resolve and every title matches its claim. The run cited neither paper that prompted the question, reaching its verdict from a disjoint evidence base. GO:0042742 defense response to bacterium is untouched.

    OpenScientist report: genes/human/SIRT2/SIRT2-hypotheses/virus-restriction-vs-dependency/openscientist.md
