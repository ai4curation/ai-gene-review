  summary: Re-ground the bacterial core function; move curation commentary out of
    description
  details: |
    Second session on this branch, acting on review findings from ai4c-reviewer on PR #3123.

    The critical finding was correct and was a real gap in the first session: the sweep and the
    audit tool both covered existing_annotations[].review.supported_by only, never
    core_functions[].supported_by, so fabricated quotes survived below the ones the first pass
    deleted. Verified by stripping the flags and running the repo validator: 8 quotes failed,
    not the 4 reported. The audit now sweeps both sections; across the PR 50 flagged entries
    remain and none sits on a full-text cache.

    Four fabricated quotes in core_functions.

    Re-grounded the GO:0140773 / defense response to bacterium entry on the two verified Shigella
    quotes already used at the annotation level, and deleted the DOI:10.1172/jci158978 citation.
    That last one compounded an error the first session introduced: the review.reason asserted the
    paper 'has been dropped from this annotation' while it was still attached to the BACTERIAL core
    function, which is the mis-citation the session claimed to have removed.

    Two further quotes (PMID:23886946, DOI:10.1073/pnas.2319833121) sit on 2 kB abstract-only caches
    and are paraphrases rather than quotations. Deleted rather than re-grounded: inventing a quote
    to fit would be the defect this PR exists to remove.

    Separately, curation commentary was moved out of the top-level description and the core-function
    description per CLAUDE.md, keeping the biology. The withdrawal reasoning for GO:0051607 now lives
    in a new SIRT2-notes.md, which also records why PMID:25516616 (Koyuncu 2014) does not overturn
    the call: its SIRT2 evidence is one arm of a seven-sirtuin screen and SIRT2 is never discussed
    individually in its text.
