    inspected and none anchors on a URL template or a cache key, _fetch returns existing
    bytes for any non-empty cached file so a mutant can only ADD entries, cache/ is
    gitignored so an addition leaves the tree clean, and the real run that regenerates
    RESULTS.md reads that same cache. The exposure is latent rather than live, and the
    docstring now says why the exclusion is safe instead of only that directories are
    skipped, with the condition under which a future mutation would require walking cache/.

