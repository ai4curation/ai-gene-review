- type: CREATE
  outcome: changed
  summary: 'Review human ARHGAP23: three GAP-activity papers the provider missed,
    and a published arginine-finger mutant that misses the arginine finger'
  details: |
    De-novo review of all 8 GOA rows for ARHGAP23 (Q9P227), with the affinage
    deep-research provider (trust gates clear: accession Q9P227, human,
    self_evaluation_pairwise "win").

    Literature. The affinage record returned 3 citations and asserted that the
    enzymatic GAP activity of ARHGAP23 has not been experimentally characterized.
    An independent sweep (Europe PMC fully enumerated, NCBI gene2pubmed for GeneID
    57636, partner/paralog-targeted searches) found 3 papers that measure it
    directly, none naming the gene in its title: PMID:27226243 (RhoA, pulldown,
    loss and gain of function), PMID:28114311 (Rac1, FRET biosensor) and
    PMID:32203420 (family-wide FRET screen; RhoA and Rac1 significant, Cdc42 not).
    PMID:27226243 is in NCBI's curated gene2pubmed set for this gene id. The
    affinage file is cited in the review with reference_review correctness
    LOW_QUALITY recording the coverage failure.

    Actions. 3 ACCEPT (the IBA and both Reactome GO:0005096 rows), 2
    KEEP_AS_NON_CORE (the duplicated Reactome cytosol rows), 2 MODIFY
    (GO:0007165 and GO:0051056, both to GO:0035024 + GO:0035021), 1
    MARK_AS_OVER_ANNOTATED (GO:0070062, HDA from a parotid exosome MudPIT), and
    3 NEW (GO:0005938 cell cortex, GO:0005925 focal adhesion, GO:0051893
    regulation of focal adhesion assembly). Two core_functions and three
    knowledge_gaps.

    The GO:0007165 MODIFY is a branch change rather than a specialization:
    GO:0035024 is a descendant of GO:0051056 and is not a descendant of
    GO:0007165, checked on api.geneontology.org and OLS4.

    Bioinformatics, committed and re-runnable in
    genes/human/ARHGAP23/ARHGAP23-bioinformatics/. The arginine finger is
    RETAINED at R942, reciprocally in register with ARHGAP1 R282 (resolved in PDB
    1TX4), recorded as a structured residue_claim on the IBA row. The result is
    reported with its calibration rather than as support: of two controls known to
    be GAP-dead, the residue test calls one (ARHGAP11B) retained, and interface
    percent identity ranks GAP-dead ARHGAP11B above experimentally active
    ARHGAP21, so neither number discriminates activity. What does carry
    information is that ARHGAP23 matches ARHGAP21 residue-for-residue at 22 of the
    25 1TX4 GAP:GTPase interface positions. Each control's credential is verified
    from the repo's own GOA tables or the fetched UniProt record before the report
    describes it; an unverifiable credential aborts the run.

    New finding. PMID:32203420's supplementary describes ARHGAP23-R986K as a
    GAP-deficient arginine finger mutant, on a construct (NP_001186346.1, 1491 aa)
    of the same length as Q9P227. R986 is not the annotated arginine finger: it
    aligns to ARHGAP1 R323, which is in the 1TX4 interface but does not contact
    the transition-state ligands, whereas R282 does. That mutant was used for TIRF
    localization, and the clause naming the screen's catalytic controls is
    extracted verbatim from the supplementary PDF and does not include ARHGAP23.
    Recorded as a discrepancy, not a correction, and as a knowledge gap plus a
    suggested experiment. The mutant designation is derived from the PDF by regex
    rather than hardcoded in the script.

    Ontology gap. GO:0005100 "Rho GTPase activator activity" is obsolete and
    merged into GO:0005096, which carries the Rho/Rac/Ras/Rab/Ran/Ral/Rap/ARF/Sar
    GAP activities as narrow synonyms and has no is_a children. Verified on three
    independent services: OLS4 (is_obsolete true; 0 hierarchical children),
    api.geneontology.org (empty record for GO:0005100; 0 descendents for
    GO:0005096) and QuickGO (silently resolves GO:0005100 to GO:0005096; returns
    one child via capable_of, not is_a). The consequence is visible in this gene:
    three GO:0005096 rows descending from a RHOA reaction, a RAC1 reaction and a
    Cdc42-grounded phylogenetic node are textually identical.

    Checks. analyze_arhgap23.py --self-test applies 14 mutations across 16 anchors
    (2 baselines) and asserts each guard fires with its expected message.
    mutation_test.py breaks each of 9 guards in a copy of the analysis and asserts
    the self-test catches it, with a no-op negative control that stays silent; it
    found a real hole when written, where the missing-arginine-finger case had
    been re-implemented inside the self-test instead of driven through
    Protein.__init__, so deleting the real guard left the self-test passing. The
    fix was to give Protein an injectable record. check_file_quotes.py verifies
    all 18 file: and Reactome: supporting_text quotes in the review against their
    sources, since CI checks verbatim quoting only for PMID: references; its
    --self-test fabricates a quote and asserts rejection and rewraps a real quote
    and asserts acceptance.

    just validate human ARHGAP23 was green at this point, with one warning: cytosol
    appeared in a core function's locations while both cytosol rows were
    KEEP_AS_NON_CORE. That inconsistency was real and is resolved in the REVIEW
    event below.
- type: REVIEW
  outcome: changed
  summary: Applied three of five reviewer suggestions on PR #3080; declined two with reasons
  details: |
    ai4c-reviewer APPROVED the PR with no CRITICAL and no IMPORTANT issues and five
    non-blocking suggestions. Three were accepted because each changes a claim a
    curator would read differently; two were declined in a reply on the PR rather
    than silently, with the reasons and with what would have reversed the decision.

    Accepted.
    (1) core_functions[1].locations listed GO:0005829 cytosol while both GOA cytosol
    rows were KEEP_AS_NON_CORE, so the review asserted the same location was core and
    non-core. Cytosol removed from that core function, since the cytoplasmic pool the
    keratinocyte experiment reads out is the PKP4-knockout condition, an engineered
    background. This also clears the one validation warning, which confirms the
    inconsistency was real rather than cosmetic.
    (2) The reference_review on PMID:27481945 carried correctness VERIFIED while its
    own review_notes disclosed that the load-bearing negative rests on an external
    full-text check of an abstract-only record. Changed to UNVERIFIED, with the notes
    now saying explicitly that UNVERIFIED refers to the claim and not the identifier,
    and the same hedge added to the flat statement in ARHGAP23-notes.md section 2.
    (3) Added a suggested_question on the gap between what PMID:28114311 measures
    (focal adhesion maturation) and the nearest available term (GO:0051893 regulation
    of focal adhesion assembly), which is the same class of expressivity problem as
    the substrate gap one branch over.

    Also strengthened the stated rationale for splitting the two core functions, which
    the reviewer asked for and which was present but thin: they differ not in the
    activity, which is identical, but in which regulator licenses it - Prickle1
    delivers ARHGAP23 to the lateral cortex to keep RhoA off, plakophilin 4 binds it
    and lowers its access to RhoA so cortical RhoA is permitted.

    Declined, with reasons given on the PR.
    (4) Reordering the description so the cellular assays rather than the intact
    Rho-GAP domain carry the activity claim. The sentence already runs straight from
    intactness into the discriminating comparison (22 of 25 interface positions
    identical to the experimentally active paralog) and then into the cellular
    results, and the "retention is not evidence" argument is an evidential judgement
    that CLAUDE.md keeps out of description; it is stated in the IBA row's reason, in
    RESULTS.md and in a knowledge_gap. Would have been reversed if description had
    asserted activity from the residue, which it does not.
    (5) Merging the two core functions was offered as an alternative to explaining the
    split; the explanation was strengthened instead.

    After the edits: just validate human ARHGAP23 is green with zero warnings, all
    three committed self-tests still pass, and check_file_quotes.py still resolves all
    18 locally-sourced quotes.
- type: EDIT
  outcome: changed
  summary: Machine-check the one load-bearing claim the pipeline did not verify
  details: |
    The re-review on 82bfac26 approved and raised one further non-blocking point that
    was correct and worth acting on: the substitute claim introduced by the
    PMID:27481945 downgrade - that Müller et al.'s Supplementary Table 2 leaves its
    "in vitro" literature columns empty for ARHGAP23 - was presented as the
    independently verifiable form of "no purified-protein GAP assay exists", but was
    the only load-bearing assertion in the PR that nothing re-ran. It rested on a
    one-off manual read of a spreadsheet.

    analyze_arhgap23.py now parses Supplementary Table 2 alongside the tables it
    already read. The column groups are derived from the two header rows rather than
    assumed, and each block is the FIRST run of RhoA/Rac1/Cdc42 columns after its
    label: taking every matching column instead silently swallows the derived
    single-and-combination flag columns whose labels repeat, and the last value wins,
    so the table would be misread rather than visibly broken. That is not a
    hypothetical - the first implementation had exactly this defect and reported the
    screen's specificity calls as the flag triple (0, 0, 0) instead of (+, +, -).

    The parse confirms the claim: "in vitro" is empty for all three GTPases while
    "in vivo" is not, and the screen's own calls are RhoA +, Rac1 +, Cdc42 -. Both are
    now printed in RESULTS.md section 5, and the review's reference_review and the
    notes say where the check lives instead of asserting the fact bare.

    The group-presence guard was factored into _require_literature_groups so that
    --self-test can drive it with a synthetic layout; checked inline it could only ever
    have been exercised by a live table that happens to be correct, which is no test.
    mutation_test.py caught that: its first attempt at this mutation changed only the
    error message, the guard still raised, and the self-test passed anyway because it
    had no coverage for the missing-block case at all. That is the second real hole the
    mutation test has found in this gene's analysis.

    Self-test now 18 mutations across 21 anchors (3 baselines); mutation test 11 guards
    all caught with the negative control silent; check_file_quotes.py still clean on 18
    quotes; just validate human ARHGAP23 green with zero warnings.
- type: EDIT
  outcome: changed
  summary: Fix three defects in the new Supplementary Table 2 parser, including a rendered inversion
  details: |
    The third re-review approved and raised three non-blocking points, all inside the
    parser added in the previous event, and all three were real.

    (1) The presence guard required only the two groups the argument turns on, while
    render_markdown printed four with .get(g, {}) - so an absent "integrated" or
    "reference" block would have rendered as an empty row, which is the same
    absent-versus-empty confusion the guard was added to prevent, one level up. It bites
    hardest on "reference", whose block extent is the only unbounded one. The required
    set is now exactly the rendered set, and the renderer indexes directly so a missing
    group raises instead of printing.

    (2) The screen-block assertion compared against one known-wrong triple, (0, 0, 0),
    which is only the value the naive implementation happened to produce. It now asserts
    the values are in the +/- call vocabulary, so any collapse onto the numeric flag
    columns fails rather than just that one.

    (3) RESULTS.md rendered "the in vivo row is not (populated)", which parses as the
    negation of the table printed directly above it. This is the campaign's
    cosmetic-reflow-ships-an-inverted-fact failure mode arriving through a conditional
    expression rather than a line wrap. Rewritten so each row's state is stated
    positively, and so the sentence says why the contrast matters: an empty in-vitro row
    carries no information if every row is empty.

    Self-test now 19 mutations across 22 anchors (3 baselines), with a new case asserting
    that a group the report renders but the guard forgot also aborts. Mutation test 12
    guards all caught with the negative control silent. check_file_quotes.py clean on 18
    quotes, check_ontology_claims.py 4/4 on both services, just validate human ARHGAP23
    green with zero warnings.
- type: EDIT
  outcome: changed
  summary: Check the whole emptiness pattern the review's prose asserts, not two thirds of it
  details: |
    The fourth re-review approved and found the same asymmetry a third time, one column
    narrower each round. The review's reference_review on PMID:27481945 asserts that
    Supplementary Table 2 leaves the "in vitro" columns empty for ARHGAP23 "while filling
    the 'in vivo' and 'reference' columns", but only in_vitro_empty and in_vivo_empty were
    computed. The reference block was presence-checked and never emptiness-checked, so an
    all-empty reference block would have rendered as three empty cells while the prose
    claimed it was filled.

    Emptiness is now computed for every required group, and the self-test asserts the exact
    three-way pattern the prose states - in vitro empty, in vivo populated, reference
    populated - as a single comparison against an expected mapping, with a failure message
    naming the three places in the review that depend on it. The report prints the state of
    all four groups rather than two.

    The underlying lesson, recorded because it is now a pattern rather than an incident:
    each of the last three rounds added a guard whose asserted set was wider than its
    checked set. A guard should be derived from what the prose claims, not from the subset
    that was convenient to compute at the time.

    Self-test 19 mutations across 23 anchors (4 baselines); mutation test 13 guards all
    caught with the negative control silent; check_file_quotes.py clean on 18 quotes; just
    validate human ARHGAP23 green with zero warnings.
- type: EDIT
  outcome: changed
  summary: Make "caught" in the mutation test mean caught by the named guard
  details: |
    Fifth re-review, approved, two non-blocking points about the harness rather than the
    curation. Both were right.

    The first is the more important. mutation_test.py decided purely on exit code, so a
    non-zero exit counted as "caught" whichever guard produced it. Two mutations had
    started being caught incidentally by a KeyError downstream of the guard they break -
    which meant the dedicated self-test case verified in an earlier round was being
    shadowed and could have rotted silently while the harness still printed ok. Each
    MUTATIONS entry now carries a fourth element, the substring the failure must contain,
    and a mutation caught by anything else is reported as WRONG GUARD rather than as a
    pass.

    Two consequential changes came out of writing that down. The group-presence checks are
    now run on synthetic layouts BEFORE the live Supplementary Table 2 parse, because the
    parse's downstream bookkeeping also breaks under the same mutation and would raise
    first; order is part of what a mutation test measures. And the synthetic layouts are
    written out literally instead of being derived from LITERATURE_GROUPS_REQUIRED -
    derived, they shrank in step with the tuple and went quiet under exactly the mutation
    that mattered. The emptiness comparison also now reports a named missing-key failure
    instead of raising KeyError.

    The harness change was itself checked by pointing one expectation at a string that
    cannot appear and confirming the run reports WRONG GUARD and exits non-zero.

    The second point: in_vitro_empty and in_vivo_empty had become write-only after
    empty_by_group was introduced, but were still published in results.json as an
    unasserted second spelling of the asserted fact. Removed.

    Self-test 19 mutations across 23 anchors (4 baselines); mutation test 13 guards all
    caught by their named guard with the negative control silent; check_file_quotes.py
    clean on 18 quotes; just validate human ARHGAP23 green with zero warnings.
- type: EDIT
  outcome: changed
  summary: Close three harness nits, including an opt-out that could have reverted the previous fix
  details: |
    Sixth re-review, approved, three harness nits and all three correct.

    The first matters most: the expected-failure substring was read as
    entry[3] if len(entry) > 3 else None, which made the new check opt-out - a future
    three-element MUTATIONS entry would have silently reverted to deciding on the exit code
    alone, undoing the previous event's fix without any signal. The loop now unpacks four
    elements directly, so a short entry is a TypeError at import rather than a quiet
    regression.

    Second, one expectation was matching the wrong thing. The entry that disables the
    "carries no arginine finger" guard expected 'annotated arginine fingers', which is the
    wording of the adjacent count check rather than of the _expect_raises case that
    actually catches the mutation. It now expects
    'missing finger annotation: guard fired with the wrong message', which is that case's
    own label and is stable under rewording of the neighbouring guard.

    Third, the '# Mutation N:' comments in the self-test had drifted to 1..10, 13, 12, 14,
    11 against a 13-entry list after the cases were reordered, and indexed nothing. Rather
    than renumber, which would drift again at the next reorder, the numbers are dropped:
    each case is now labelled '# Case:' by what it breaks.

    Re-verified: the WRONG GUARD path still fires when an expectation is pointed at a
    string that cannot appear; self-test 19 mutations across 23 anchors (4 baselines);
    mutation test 13 guards all caught with the negative control silent;
    check_file_quotes.py clean on 18 quotes; just validate human ARHGAP23 green with zero
    warnings. No curation surface touched.
