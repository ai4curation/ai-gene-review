    (1) The mode committed two of _restore's three verbs. "deleted" and the
    "if not path.exists()" repair arm executed nowhere, which is the same
    asserted-versus-checked shape one verb wide. A second phase now writes a throwaway
    sentinel, snapshots with it present, deletes it, and requires _restore to report
    "deleted <name>", count it as a failure, and recreate the file with its original
    bytes. A sentinel is used rather than a real file so a crash mid-phase cannot lose
    anything.

    (2) The victim for the "modified" case was chosen as RESULTS.md, which is the source
    for the review's file: quotes, when results.json is cited nowhere and demonstrates the
    same verb identically. The order is reversed so the crash window lands on the
    lower-consequence file.

