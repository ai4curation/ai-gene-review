    Second, one expectation was matching the wrong thing. The entry that disables the
    "carries no arginine finger" guard expected 'annotated arginine fingers', which is the
    wording of the adjacent count check rather than of the _expect_raises case that
    actually catches the mutation. It now expects
    'missing finger annotation: guard fired with the wrong message', which is that case's
    own label and is stable under rewording of the neighbouring guard.

    Third, the '# Mutation N:' comments in the self-test had drifted to 1..10, 13, 12, 14,
    11 against a 13-entry list after the cases were reordered, and indexed nothing. Rather
    than renumber, which would drift again at the next reorder, the numbers are dropped:
    each case is now labelled '# Case:' by what it breaks.

    Re-verified: the WRONG GUARD path still fires when an expectation is pointed at a
    string that cannot appear; self-test 19 mutations across 23 anchors (4 baselines);
    mutation test 13 guards all caught with the negative control silent;
    check_file_quotes.py clean on 18 quotes; just validate human ARHGAP23 green with zero
    warnings. No curation surface touched.
- type: EDIT
  outcome: changed
  summary: Fix a platform-dependent bug that made the mutation test meaningless on Linux and CI
  details: |
    Seventh re-review, CHANGES_REQUESTED on the harness with the curation approved, and the
    finding was correct and serious: the mutation test was only meaningful on the author's
    platform.

    mutation_test.py wrote each mutant into tempfile.TemporaryDirectory(), so the mutant's
    module-level SCRIPT_DIR - and therefore CACHE_DIR and REPO = SCRIPT_DIR.parents[3] -
    resolved inside the temp directory. On macOS that is /var/folders/... with seven
    parents and it works. On Linux and in CI it is /tmp/tmpXXXX, which has two, so
    parents[3] raises IndexError at import and every entry fails for a reason unrelated to
    its mutation. This was reproduced rather than reasoned about: running the harness with
    TMPDIR=/tmp printed "got: IndexError: 3" for all thirteen entries. Before the
    expected-message check added two events ago, that same run would have printed
    "13 guards all caught" off nothing but import errors - the harness would have been
    asserting the guards were sound while never once executing them.

    The mutant is now written beside the original as .mutation_test_subject.py
    (gitignored, unlinked in a finally), so SCRIPT_DIR, CACHE_DIR and REPO resolve exactly
    as they do for the real script, and the fourteen runs share one warm cache instead of
    re-downloading the UniProt records, the 1TX4 mmCIF and the Müller workbook and SI PDF
    each time. The harness now passes under TMPDIR=/tmp, which it did not before.

    Also: removed the shutil import, unused since the mutant stopped being copied, and
    added a second negative control of the shape the previous commit actually made - a
    comment-label edit inside self_test - since fourteen such lines changed there and
    their neutrality had rested on inspection alone. It is silent, as it must be.

    Mutation test now 13 guards all caught with 2 negative controls silent, under both the
    default TMPDIR and TMPDIR=/tmp; the WRONG GUARD path re-verified against an impossible
    expectation; self-test 19 mutations across 23 anchors (4 baselines);
    check_file_quotes.py clean on 18 quotes; just validate human ARHGAP23 green with zero
    warnings.
- type: EDIT
  outcome: changed
  summary: Protect the committed artifacts from the mutant that now shares their directory
  details: |
    Eighth re-review, approved, two harness points. The first is the cost of the previous
    fix and was worth taking: moving the mutant beside the original made the mutant's
    output paths the committed ones, so "--self-test returns before the artifact writes"
    became a load-bearing invariant that nothing enforced. A future mutation anchored on
    the dispatch line would run the mutated analysis to completion and overwrite
    results.json and RESULTS.md in place - and RESULTS.md is the source for five file:
    supporting_text quotes in the review, so the blast radius reaches the curation.

    Both files' bytes are now snapshotted before the loop and restored in the finally that
    already existed, in BYTES rather than text so no newline or encoding normalisation can
    enter through the restore itself. A restore that was actually needed is reported as
    ARTIFACT OVERWRITTEN and counted as a failure, since a mutant reaching the artifact
    writes means a mutation escaped the early return.

    The restore path was then verified rather than assumed, and the first attempt at
    verifying it taught something: a mutant that merely runs the full analysis regenerates
    both files with IDENTICAL bytes, because the analysis is deterministic against a warm
    cache - so the snapshot correctly stayed silent and proved nothing. Re-run with a
    mutant that clobbers RESULTS.md outright, the harness reports ARTIFACT OVERWRITTEN and
    both files come back byte-identical by sha256.

    Second point, both stale counts fixed: the comment said "the 14 runs" where there are
    now 15, and the module docstring still had "a negative control" singular where there
    are two. The docstring also now states the named-guard requirement, which it did not.

