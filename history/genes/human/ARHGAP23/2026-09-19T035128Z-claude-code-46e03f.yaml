- type: EDIT
  outcome: changed
  summary: Commit the protection layer's own failure path, and say why cache/ is out of scope
  details: |
    Tenth re-review, approved, three points about the protection layer's own coverage.

    The second was the one with teeth, and it is this repository's own rule turned on my
    verification: in a passing run none of _restore's reporting or repairing branches
    execute, so the only evidence they worked was an uncommitted mutant I ran once by hand
    - exactly the "a check that does not re-run goes stale silently" argument this file
    makes about everything else. mutation_test.py now has a --self-check mode that creates
