- type: EDIT
  outcome: changed
  summary: Finish the self-check's coverage and stop a crashed run from wedging it
  details: |
    Eleventh re-review, approved, three points inside the --self-check mode added in the
    previous event. All three were right, and the third was a trap rather than a gap.

    (3) .self_check_invented.md was neither gitignored nor cleared before the baseline was
    taken, so a crashed run left a file that dirtied the tree AND wedged the mode
    permanently: the leftover entered the next baseline, the "created" assertion failed
