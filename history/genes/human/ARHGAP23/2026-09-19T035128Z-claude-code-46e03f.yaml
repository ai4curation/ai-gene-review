- type: EDIT
  outcome: changed
  summary: Commit the verdict rule's own coverage, the last thing here proved only by hand
  details: |
    Twelfth re-review, approved, three points inside --self-check. All three correct.

    (1) main()'s GUARD HOLE and WRONG GUARD branches were the last logic in this directory
    whose behaviour rested on an uncommitted experiment run once by hand - and the line in
    question, "expect not in full", is the one that made the Linux parents[3] bug visible
    instead of green. The decision is now a pure function, _classify(code, full, expect),
    and --self-check asserts all three of its outcomes with no subprocess and no network,
    including the exact regression that mattered: a non-zero exit whose output is an
    unrelated traceback must return WRONG GUARD, not caught.

    (2) Phase 2 asserted on read_bytes() directly, which evaluates before the assertion, so
    a broken not-exists repair arm - the arm that phase exists to cover - would have died
    with a bare FileNotFoundError and never printed the message written for it. Existence
