  summary: Assess inflammasome lead PMID:42714851; review unchanged, notes journalled
  details: |
    Litscan handoff #3920 proposed VPS4B as an inflammasome component on the strength of PMID:42714851 (J Exp Med 2026), which reports that Vps4B interacts with ASC and caspase-1, is recruited to the ASC speck by Ca2+ signalling, and forms a ring encircling the ASC filament that disassembles and liberates the spent caspase-1 CARD. VPS4B-ai-review.yaml is deliberately unchanged: no NEW annotation is proposed, because the evidence is a single primary report cached abstract-only with no independent replication, there is no ATPase-dead separation of function establishing that the phenotype needs ATP hydrolysis, the functional unit is unsettled (UniProt CC:SUBUNIT records heteromeric assembly with VPS4A; ComplexPortal CPX-338 is the VPS4A/B complex), and substrate selectivity is unexplained. The claimed activity is mechanistically continuous with the reviewed core function (ATP-driven disassembly of a protein polymer through the central pore of stacked VPS4 rings), so the lead is worth keeping rather than discarding; it is journalled in VPS4B-notes.md with the candidate terms to weigh if replicated (GO:0140545, GO:0051261, GO:0072559 as location). The module-side adjudication lives in modules/canonical_nlrp3_inflammasome.yaml, notes paragraph (9) plus a structured knowledge_gaps entry.
