  details: |
    Follow-up to the CREATE record from this session, covering commit 29271ced9, which landed after the history records were scaffolded in ed32d1e57.

    Two changes, both from the PR review:

    - The proposed NEW biological process moved from GO:0007266 Rho protein signal transduction to GO:0035025 positive regulation of Rho protein signal transduction. GPR50 sits upstream of the G12/13-RhoA cassette and activates it - the source's own title says it restrains neurite outgrowth 'by Activating the G(12/13) Protein-RhoA Pathway' - so the positive-regulation child is the paper's framing rather than an interpretation laid over it. core_functions.directly_involved_in followed.
    - Evidence on the two mouse-derived NEW rows (GO:0035025, GO:0010977) moved from IMP to ISO. PMID:40091563 is a mouse knockout study; IMP asserts the phenotype was observed in the annotated entity, so transfer to the human gene is by orthology.

    Note for anyone reading the chain: the CREATE record for this session lists GO:0007266 among the proposed NEW terms. That was accurate when written - the scaffold ran before this commit - and this record supersedes it. GO:0007266 is not proposed by this PR.
