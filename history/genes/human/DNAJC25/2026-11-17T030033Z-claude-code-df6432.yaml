  summary: Curate IBA propagation review and Affinage deep research for human DNAJC25
  details: |
    Curated human/DNAJC25 (Q9H1X3; status: COMPLETE retained). Added supporting_entities to all 4 GOA rows (including 2 IBA rows on PANTHER:PTN002544518). Reclassified GO:0005789 (endoplasmic reticulum membrane, IBA from Oryza sativa ERDJ7 UniProtKB:Q2QUP1 on legacy 2018 PAINT node PTN002544518 shared across PTHR44176 and PTHR44653, Tier 6 R1_SINGLE_GENE) from KEEP_AS_NON_CORE to MARK_AS_OVER_ANNOTATED with propagation_review (PROPAGATION_BAD / COMPARTMENT_OR_COMPLEX_MISMATCH) because rice ERDJ7 is a soluble ER-lumenal protein without transmembrane domains whereas human DNAJC25 has three predicted transmembrane helices and stays at GO:0016020 (membrane, ACCEPT), and added GO:0031072 (heat shock protein binding) as a NEW IC annotation matching core_functions. Updated description and core_functions[0].description so they describe DNAJC25 at a generic cellular membrane rather than asserting endoplasmic reticulum membrane localization. Added propagation_review (NO_FAILURE_NON_CORE) and fixed a non-verbatim supporting_text quote from DNAJC25-deep-research-falcon.md on GO:0006457 (protein folding, IBA from S. cerevisiae ERJ5 SGD:S000001937 on PTN002544518). Added file:human/DNAJC25/DNAJC25-deep-research-affinage.md with reference_review (relevance: MEDIUM, correctness: UNVERIFIED). Validated with just validate human DNAJC25.
