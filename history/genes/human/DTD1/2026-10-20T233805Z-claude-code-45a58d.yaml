  summary: 'Full re-review: DTD1 A0A2R8YCT7 (NMD-transcript truncated product)'
  details: |
    Full re-review independent of ProtNLM predictions. Rewrote bioinformatics script to read the sequence from the UniProt flat file and Ensembl REST: A0A2R8YCT7 is the 127-aa product of ENST00000647441 (nonsense_mediated_decay biotype), identical to Q8TEA8 1-124, lacking beta strand 131-146, the Gly139-cisPro140 motif and the C-terminal DNA-binding region. Kept REMOVE on the three deacylase MF rows with new structural/ortholog support, changed tRNA metabolic process and translational-fidelity BP rows from UNDECIDED to REMOVE (they rest on the removed catalytic function), kept cytoplasm UNDECIDED. Rewrote description and notes, dropped the ProtNLM source file reference, added PMIDs 10918062, 11568181, 18700836, 20065034, 28362257. PANTHER SF5 placement agrees with interpro/panther/PTHR10472 review; closest characterised ortholog yeast DTD1 Q07648 (PAINT donor, PTN000049487) has no repo review.
