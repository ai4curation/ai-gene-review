  summary: Record OpenScientist analysis of GSDMD-TMEM106A chimera conservation and
    its irrelevance to the pore mechanism
  details: |
    Ran an OpenScientist deep-research job (kgap-gsdmd-chimera-conservation) on the knowledge gap covering endogenous cofactors that tune GSDMD-NT pore assembly, specifically whether the mouse Gsdmd-Tmem106a trans-spliced chimera has a human counterpart. The gap stays OPEN, and the run reports three things that should not be collapsed into one.

    First, the genomic-architecture framing I supplied has no object. GSDMD and TMEM106A are on different chromosomes in both mouse and human, so gene order, relative orientation and intergenic distance are all undefined and a cis read-through is impossible in either species. The mouse event is inflammation-induced interchromosomal trans-splicing, a mechanism indifferent to linear proximity, so distance in the human genome is not evidence of anything, and the run warns explicitly against reading it that way. My hypothesis asked for exactly the measurements that do not apply.

    Second, the human locus is capable of producing the identical chimera. The donor and acceptor dinucleotides and the exon phases match between species, the same frameshift and short out-of-frame reading frame follow, and the reconstructed human chimeric protein is essentially the same length as the mouse one, retaining the residues the discovery paper mutated. The splice grammar is invariant out to marsupials, so architecture cannot discriminate species, while the short chimeric frame is intact across Euarchontoglires and collapsed in dog, cow and pig. The run calls this inherited capacity rather than maintained function, with no species reaching significance against a codon-usage null.

    Third, the human event has never been looked for at adequate power. No such transcript appears in the major sequence resources and it is absent from the discovery paper's own human macrophage long-read data, but the mouse chimera rested on a single read out of roughly 37,000, the human library is far shallower in chimeric reads, and the computed power is about four per cent, so that absence carries almost no information.

    The correction that matters most for this gap is the last. The junction lies at GSDMD exon 2, so the chimera contains neither the caspase-1 and caspase-11 cleavage site nor the pore-forming region, which the local P57764 record places at Asp275 and within residues 1-275 respectively, both confirmed here. The chimera is therefore a small accessory protein and nothing in this analysis touches the canonical GSDMD-NT mechanism, so the gap's broader question about cofactors tuning pore assembly is untouched.

    A numbering caution is recorded, and it was my own misreading rather than a run error. The acidic-patch residues the run names are in chimera numbering. Only those falling in the GSDMD-derived segment, the membrane anchor Phe49 and Trp50 and the first acidic residue, correspond to GSDMD positions in the local record; the remainder lie in the frameshifted TMEM106A-derived portion and cannot be checked against this entry's sequence at all. Checking them against GSDMD numbering produced apparent mismatches that are not mismatches.

    The exon phases, splice dinucleotides, 11-mammal survey, power calculation and chimeric-frame distribution were not independently recomputed. No annotation action was taken.
