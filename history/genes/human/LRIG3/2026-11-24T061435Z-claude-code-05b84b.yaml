  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch H13). GO:0007605 sensory perception of sound (IBD at PANTHER:PTN009094493) keeps MARK_AS_OVER_ANNOTATED; summary and reason rewritten and two quotes from PMID:24086156 added. The earlier reason said no experiment shows that LRIG3 lacks an auditory role. The seed paper, read in full, states (citing an earlier Lrig3 mutant study) that Lrig3 mutant mice exhibit normal auditory responses. That is evidence against the term for LRIG3 but not loss, because Lrig1 and Lrig3 act redundantly and the double mutant dies at or before birth. Clade ids for the LRIG1, LRIG2 and LRIG3 clades added to the reason.
