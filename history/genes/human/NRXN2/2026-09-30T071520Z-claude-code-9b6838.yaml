  summary: 'Create review: NRXN2'
  details: |
    Reviewed all 38 GOA annotations for neurexin-2-alpha (Q9P2S2) consistently with the NRXN1 review: 12 ACCEPT, 17 KEEP_AS_NON_CORE, 5 MARK_AS_OVER_ANNOTATED, 4 MODIFY (neuron cell-cell adhesion to synaptic membrane adhesion; signal transduction to trans-synaptic signaling by trans-synaptic complex), plus NEW cell-cell adhesion mediator activity and NEW presynaptic modulation of chemical synaptic transmission. Diverged from NRXN1 by keeping neurotransmitter secretion non-core, because NRXN2-specific knockouts show circuit-dependent effects (reduced neocortical release versus increased hippocampal release probability and synapse density), and added the NRXN2-alpha-selective ligand IgSF21 to the trans-synaptic organizer core function. Lin et al. 2023 is cited with a DISPUTED flag (companion PNAS paper retracted); PMID:28472659 and PMID:36961922 are not cited.
