  summary: 'Create review: VCL'
  details: |
    Full review of all 106 GOA rows for human vinculin (P18206) under Track B of ORIGINS_OF_MULTICELLULARITY, plus one NEW actin filament binding (GO:0051015) row from PMID:7816144. Generic protein binding rows converted to talin, alpha-actinin, Arp2/3 complex or SH3 domain binding where the paper defines the interface, otherwise removed; the NOT actin binding row removed because the cited paper shows a cryptic, not absent, F-actin site; cadherin binding marked over-annotated (indirect via catenins); Reactome granule-lumen/extracellular rows, platelet aggregation HMP and BBB NAS marked over-annotated. Core functions: talin-activated actin filament binding at cell-matrix adhesions (ancestral, supported by sponge VIN1 PMID:29880641 and Capsaspora PMID:32857975), talin binding, and alpha/beta-catenin binding at adherens junctions (animal-documented). Notes file written manually; no deep research available.
