  summary: 'Create review: ACAD9 alternative gene model A0A7P0T7Z1'
  details: |
    New review of ProtNLM2 benchmark accession A0A7P0T7Z1 (ENST00000680636, 626 aa), independent of ProtNLM2 output. Gene-model comparison script shows residues 1-521 identical to canonical Q9H845; an exon-16 alternative acceptor (+94 nt) frameshifts residues 522-626, removing most of the vestigial domain, the ECSIT-contact HTH 554-560 and the dimer-stabilising C-terminal helix. 9 GOA rows: 5 ACCEPT (catalytic MF terms, FAD binding, mitochondrion), 2 MODIFY (GO:0006631->GO:0006635; GO:0017099->GO:0004466, matching the canonical review), 2 UNDECIDED (membrane locations, since the C-terminal membrane-associated domain is lost). Complex I assembly/MCIA roles deliberately not transferred. Falcon and perplexity-lite deep research failed (auth/quota); recorded in notes.
