  summary: De-novo review of all 15 GOA annotations for SLC16A5 (MCT6), an SLC16 drug/monocarboxylate
    transporter
  details: |
    Reviewed every GOA row for SLC16A5 (O15375, MCT6/MCT5). SLC16/MCT family; UniProt FUNCTION (lactate/pyruvate/ketone) is By-similarity (ECO:0000250), not experimental; MCT6 is characterised chiefly as a monocarboxylate xenobiotic-drug carrier (bumetanide, nateglinide, probenecid, PGF2-alpha; Felmlee 2020 PMID:32144120 citing Murakami 2005/Kohyama 2013/Jones 2017); these are monocarboxylates, so GO:0008028 is experimentally supported for this member, while classical lactate/pyruvate transport is By-similarity only. Core MF GO:0008028 (demonstrated via drug substrates) at the plasma membrane. Actions (15 GOA rows + 1 NEW): 9 ACCEPT (GO:0005886 PM IBA/IEA/TAS; GO:0008028 IBA/IEA/TAS cited to Felmlee + UniProt FUNCTION; GO:0015718 IEA/TAS), 2 REMOVE (bare GO:0005515 protein binding IPI x2, PMID:32296183), 2 MODIFY (GO:0016020 membrane -> GO:0005886, IEA+TAS), 1 TOO_GENERAL (GO:0022857 anchored by GO:0008028), 1 KEEP_AS_NON_CORE (GO:0055085 TM transport; no GO:1905039 row to anchor a TOO_GENERAL), 1 MARK_AS_OVER_ANNOTATED (GO:0016323 basolateral PM IBA; not grounded for MCT6); plus 1 NEW GO:0042910 xenobiotic transmembrane transporter activity (demonstrated drug transport, Felmlee). source_defects: none. Addressed PR #6515 review (ai4c-reviewer). Batch 25.
