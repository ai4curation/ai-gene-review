  summary: Create DERL1 human GO review
  details: |
    Created a de novo DERL1 review in the PTHR11009 Derlin/RHBDD2 family pass. Reviewed all GOA rows, retained the ER membrane, ERAD, retrograde ER-to-cytosol transport, Derlin-1 complex, VCP/p97 binding and SRP binding calls, treated root membrane/protein-localization parents as too general, removed uninformative bare protein-binding rows, and marked UPR or broad proteasomal catabolism projections as over-annotations where the evidence supports an ERAD retrotranslocation component rather than direct UPR signalling or proteasomal substrate destruction. Added notes summarizing the literature and family-specific PAINT behavior.
