  summary: 'Create review: AP5S1'
  details: |
    Full review of the AP-5 sigma subunit: 28 seeded GOA rows reviewed (16 ACCEPT, 6 MARK_AS_OVER_ANNOTATED, 5 KEEP_AS_NON_CORE, 1 MODIFY of the GO:0030119 IDA to the specific child GO:0044599) plus 2 NEW rows (GO:0005198 structural molecule activity by IDA from the cryo-EM structure, and GO:0034499 late endosome to Golgi transport, which no AP-5 subunit carried). All five IBAs trace to PTN000413531 of PTHR16120, each seeded by the target's own accession alone; four NO_FAILURE_CORE and cytosol NO_FAILURE_NON_CORE. The InterPro IPR029392 to GO:0000724 IEA is marked EVIDENCE_CIRCULAR_OR_REDUNDANT because the InterPro entry cites the same single HeLa esiRNA experiment that already gives the gene its IMP. A new structural analysis (8YAB vs 2JKR, CE superposition with positive, negative and shuffled-sequence controls) shows sigma-5 buries 2622 A2 against the zeta trunk and 755 A2 against the SPG11 WD40-hairpin, and that the sigma2 dileucine site is structurally present but chemically not conserved (3/19 identical) and partly covered by the zeta N-terminus; encoded as five residue_claims. Affinage returned nothing for this gene. Validated with just validate (clean, 3 explained warnings), checkquotes.py (123 quotes, 0 failures), gene_residue_claims (94 pass), a GOA-to-YAML reconciliation script, and a reference-title check against the publication cache.
