  summary: 'Address ai4c-reviewer round 1: AP5S1'
  details: |
    Revision after the first ai4c-reviewer round on PR 3032, which requested changes on one item. Blocking: the NEW GO:0034499 row was coded IMP on PMID:22022230, but that paper shows CIMPR/Vps26 redistribution on sigma-5 knockdown without establishing the direction of transport (its own introduction flags directional uncertainty for AP-1), and the late-endosome-to-Golgi assignment comes from the 2018 AP5Z1 knockout. Re-encoded as IC on PMID:29381698 with supporting_entities GO:0016197 and GO:0044599 and a propagation_review naming what each contributes. Seven non-blocking items also addressed: dropped an unsourced claim that AP4S1 carries GO:0005198 (QuickGO shows it does not); GO:0016192 changed from ACCEPT to KEEP_AS_NON_CORE as a true grandparent superseded by the child; GO:0005765 added to core_functions locations; the description's 'the contact that licenses assembly' softened to what the cited abstract supports; the human/mouse sigma2 identity behind the R15 residue claim turned into an actual measurement in sigma5_structure.py rather than a prose assertion; the affinage reference correctness changed from VERIFIED to UNVERIFIED. Final counts: 30 rows, 15 ACCEPT, 6 KEEP_AS_NON_CORE, 6 MARK_AS_OVER_ANNOTATED, 1 MODIFY, 2 NEW, 12 propagation_review blocks; validation clean with 3 explained warnings, 127 quotes verified, 94 residue claims pass. Supersedes the count figures in the CREATE record, which were accurate when written.
