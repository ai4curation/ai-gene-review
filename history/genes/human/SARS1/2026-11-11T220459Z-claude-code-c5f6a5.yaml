  details: |
    Full review of all 81 GOA rows for cytoplasmic seryl-tRNA synthetase SARS1 (P49591), as part of completing the selenocysteine biosynthesis/incorporation module. Accepted serine-tRNA ligase and selenocysteine-tRNA ligase (tRNA(Sec) serylation) activity, cytosol, nucleus, and the nuclear VEGFA-promoter DNA binding / transcriptional repression; modified the six obsolete GO:0006434 rows to GO:0006418 (GO replaced_by), cytoplasm to cytosol, selenium compound metabolic process to L-selenocysteine biosynthetic process, and generic terms to their specific descendants; removed bare protein-binding rows under the policy; marked exosome HDA rows as over-annotated. Quotes checked by just validate human SARS1 (passes, only environment warnings).
