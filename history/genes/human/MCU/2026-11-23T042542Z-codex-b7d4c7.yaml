  summary: Create human MCU mitochondrial calcium uniporter review
  details: |
    Created a complete human MCU review from freshly fetched UniProt and GOA data. Reviewed 97 annotation rows for the pore-forming mitochondrial calcium uniporter subunit, accepted the calcium channel activity, uniplex complex and calcium-import core, modified mitochondrial calcium transmembrane transport to GO:0036444, and modified the older GO:0015292 uniporter activity rows to GO:0005262 because MCU is a channel pore rather than a carrier. Added curator notes linking the MCU decisions to PTHR13462 and the MCUB inhibitory paralog.
