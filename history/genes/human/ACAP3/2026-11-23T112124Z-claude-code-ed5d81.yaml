  summary: Narrow the ACAP3 lipid-binding knowledge gap with an OpenScientist run
  details: |
    Ran OpenScientist (3 iterations) on whether the ACAP3 PH domain keeps a phosphoinositide pocket. Yes, a conserved basic pocket (K277, R278, R289, K302; checked locally) is found by superposition on ASAP1/GRP1/PLCdelta1, but it is less basic than the references (F283, A307), so generic PIP binding is predicted without PI(4,5)P2 specificity. The BAR domain is not membrane-binding. Gap OPEN -> NARROWING.
