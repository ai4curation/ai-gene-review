  summary: Complete COQ8B review and align with CoQ10 module/dismech
  details: |
    Completed the COQ8B review. The core molecular function is now ATP hydrolysis activity (GO:0016887), not protein kinase activity. Three sources support this. PMID:27499294 shows the COQ8 family lacks canonical in-trans kinase activity and has ATPase activity. PMID:38425362 measured COQ8B ATPase directly, stimulated ten-fold by COQ6:COQ3. The COQ8A review uses the same term. The ISS GO:0016887 row changed to ACCEPT. The IDA protein kinase activity row (COQ3 phosphorylation with reconstituted ancestral tetrapod proteins) is retained as KEEP_AS_NON_CORE rather than removed. ATP binding was folded into the ATPase core function. Description rewritten. Added suggested questions and an experiment. Status COMPLETE; this matches the dismech COQ8 node (GO:0016887) and the module annoton.
