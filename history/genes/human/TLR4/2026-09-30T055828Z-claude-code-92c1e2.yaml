  summary: 'Create review: TLR4'
  details: |
    Reviewed all 275 GOA rows for human TLR4 (O00206) from UniProt, 61 cached publications and OLS/QuickGO; Falcon deep research failed and was not used. GO:0001875 LPS immune receptor activity accepted as the anchor MF because only TLR4 spans the membrane and transmits the signal (MD-2/CD14 co-receptors raised as a contributes_to question). Core functions: GO:0001875, signaling receptor activity for endogenous ligands, TIR domain binding for adaptor recruitment. Removed the NOT LPS-signaling row (TLR4 tested without MD-2), amyloid-beta binding (CD36 is the binder), the reversed M-CSF regulation row and uninformative protein binding; mouse-derived negative cytokine regulation rows marked over-annotated; mechanical-stimulus IEP left undecided (cited paper does not mention TLR4). just validate passes with one intentional warning; all supporting quotes verified verbatim.
