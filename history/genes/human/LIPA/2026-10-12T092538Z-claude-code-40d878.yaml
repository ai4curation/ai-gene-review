  summary: 'Round 3: ground the GO:0090122 proposal on direct assay'
  details: |
    The proposed GO:0090122 (cholesterol ester hydrolysis involved in cholesterol transport) row carried evidence_type TAS against PMID:1718995, a background sentence in a cloning paper. PMID:7204383 measures the reaction directly: cholesterol oleate is a substrate for the purified enzyme with an apparent Vmax of 1400 nmol/min/mg and a Km of 0.8 mM, and the recoveries of trioleoylglycerol and cholesterol oleate hydrolytic activity track each other through every purification step. The row now takes IDA from PMID:7204383, which puts it on the same basis as its GO:0019433 sibling - the triacylglycerol half of the same purification, already IDA on that reference. The two review-sentence quotes are retained as corroboration rather than as the primary support.
