  details: |
    Reviewed all 31 GOA annotations for DNAH7 (Q8WXX0). Falcon deep research was attempted repeatedly (just deep-research-falcon, 5 attempts over ~35 min) but failed every time with Edison API authentication errors (HTTP 503), so the review is based on direct reading of cached literature (PMID:11877439, 34476482, 35543642, 40810911, 37258679 cryo-EM IDAb/IDAe assignment, 39056782, 39849482) and the UniProt record. Core function: minus-end-directed microtubule motor activity in the inner dynein arm; IDA assembly. Calcium ion binding marked over-annotated; dynein intermediate chain binding and HPA sperm annulus left UNDECIDED. Human and mouse IBA sets compared in QuickGO: no PANTHER family split. just validate human DNAH7 passes.
