  summary: 'Create: DNAH8 gene review'
  details: |
    Reviewed all 27 GOA annotations for DNAH8 (gamma-type sperm outer dynein arm heavy chain) and added one NEW annotation (flagellated sperm motility). Falcon deep research failed with an Edison API authentication error (two attempts), so literature was gathered directly from PubMed and cached with just fetch-pmid (patient MMAF papers, Dnah8 knockout, mouse Dnahc8 localization, DNAH17 interdependence). Removed dynein light intermediate chain binding (IBA/IEA) as a cytoplasmic-dynein-specific propagation; modified generic dynein complex to outer dynein arm and cilium-dependent cell motility to flagellated sperm motility. Checked QuickGO: human and mouse Dnah8 have matching IBA sets. just validate human DNAH8 passes.
