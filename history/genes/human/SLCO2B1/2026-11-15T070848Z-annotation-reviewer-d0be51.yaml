  summary: De-novo review of all 81 GOA annotations for SLCO2B1 (OATP2B1), steroid-sulfate
    and drug uptake transporter
  details: |
    Reviewed every GOA row for SLCO2B1 (O94956, OATP2B1). Na+-independent, pH-sensitive (acidic-pH-enhanced) anion-exchange uptake of steroid sulfate conjugates (estrone-3-sulfate, DHEAS, pregnenolone sulfate) and many drugs (statins, fexofenadine, glibenclamide, montelukast). Intestinal apical, hepatic basolateral, placental. Core MF: GO:0015291 secondary active transmembrane transporter activity (the most specific non-obsolete real MF term; directly_involved_in GO:0043252 Na-independent organic anion transport) + proposed_molecular_function 'steroid sulfate transmembrane transporter activity' (proposed_new_term; the defining substrate class). QuickGO: GO:0008514, GO:0015347 AND GO:0015301 are ALL obsolete, and no steroid-sulfate MF term exists (verified), which is why the core steroid-sulfate activity needs a proposed_new_term. Actions (81): 31 ACCEPT (PM + apical/basolateral CC per UniProt enterocyte-localization caution, GO:0015291, GO:0043252, IBA with self in WITH/FROM as grounding), 23 TOO_GENERAL (GO:0022857 x16 incl IDA, GO:0055085 x5, GO:0016020, imprecise-on-their-own once GO:0015291/GO:0043252 asserted), 20 REMOVE (bare GO:0005515 PDZ affinity-mapping scaffolds, protein-binding policy), 4 KEEP_AS_NON_CORE (prostaglandin GO:0015132/GO:0015732, BBB transport NAS), 2 MODIFY (GO:0006805 xenobiotic metabolic process x2 -> GO:0006855 xenobiotic transmembrane transport), 1 MARK_AS_OVER_ANNOTATED (GO:0042167 heme catabolic process). proposed_new_terms: 1 (steroid sulfate transmembrane transporter activity, parent GO:0022857; cross-referenced to the SLCO5A1/SLC10A6/ABCC11 steroid-sulfate NTRs as their grouping parent). source_defects: none. Review-response (PR #6386): the two Reactome GO:0006805 xenobiotic-metabolic-process rows changed KEEP_AS_NON_CORE->MODIFY (GO:0006855 xenobiotic transmembrane transport; the role is transport not metabolism, lateral correction matching SLCO1A2), and the GO:0042167 heme catabolic process row changed KEEP_AS_NON_CORE->MARK_AS_OVER_ANNOTATED (imports heme substrate for HMOX2 but does not catabolize; participation-test fail, matching the SLCO1C1 GO:2000611 treatment). Batch 12.
