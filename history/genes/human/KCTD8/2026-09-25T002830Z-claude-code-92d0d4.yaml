  summary: Record the ECO:0000250 basis of the UniProt postsynaptic location on both
    downgraded terms
  details: |
    Follow-up to the same-session records under 2026-09-25T002122Z, acting on a review
    suggestion from ai4c-reviewer on PR #3123.

    The reasons on GO:0045211 and GO:0098794 said the UniProt subcellular-location mapping
    was 'the only remaining basis' and left open what that mapping rests on. It has now been
    checked. KCTD8-uniprot.txt carries both 'Presynaptic cell membrane {ECO:0000250}' and
    'Postsynaptic cell membrane {ECO:0000250}', and ECO:0000250 is sequence-similarity
    evidence used in a manual assertion -- an inference rather than an observation. So the
    postsynaptic CC line feeding the IEA is itself inferred.

    One nuance the review's framing glossed and this record states precisely: BOTH UniProt
    lines carry ECO:0000250, not just the postsynaptic one. What distinguishes them is not
    the UniProt evidence code but that the presynaptic claim has independent experimental
    support in this review (DOI:10.7554/eLife.68274) while the postsynaptic one has none.

    No action changed -- both terms were already UNDECIDED. This strengthens the recorded
    basis for that call and forestalls a future reader re-litigating whether a UniProt CC
    line should have settled it.
