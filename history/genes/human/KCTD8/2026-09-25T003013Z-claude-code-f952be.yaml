  summary: Strip edit narration from the GO:0031795 core-function description
  details: |
    Acts on a non-blocking review finding from ai4c-reviewer on PR #3123, on an
    already-approved PR.

    The GO:0031795 core-function description narrated the edit rather than describing
    biology: everything after the first sentence read 'previously carried', 'has been
    removed', 'the synthesized output should not assert'. CLAUDE.md wants that material in
    review.reason, the notes file, or a history record, not in a description field.

    This is the same defect class stripped from SIRT2 earlier in this branch, reintroduced
    by the KCTD8 fix that removed the postsynapse location. Worth recording plainly: the
    correction for one instance of a defect created another instance of it two commits
    later.

    The description now states where the protein acts and what is known about it. The facts
    about the removal remain in review.reason on both postsynaptic terms and in the
    2026-09-25T002122Z KCTD8 record.

    A scan across every core_functions and top-level description touched by this branch
    found no other instance.
