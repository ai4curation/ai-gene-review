  summary: Downgrade both postsynaptic terms to UNDECIDED and drop the core-function
    location
  details: |
    Second session on this branch, acting on review findings from ai4c-reviewer on PR #3123.

    The critical finding was correct and was a real gap in the first session: the sweep and the
    audit tool both covered existing_annotations[].review.supported_by only, never
    core_functions[].supported_by, so fabricated quotes survived below the ones the first pass
    deleted. Verified by stripping the flags and running the repo validator: 8 quotes failed,
    not the 4 reported. The audit now sweeps both sections; across the PR 50 flagged entries
    remain and none sits on a full-text cache.

    This record supersedes a claim in this gene's 2026-09-24 record. That record states 'No curation
    decision was changed: action, term, evidence_type... are untouched'. That is no longer true of
    this file, and history records are append-only, so the correction is recorded here rather than
    edited into the earlier one.

    GO:0045211 postsynaptic membrane: ACCEPT -> UNDECIDED. The citation attached in the first session
    does not support the term. DOI:10.1523/JNEUROSCI.1676-21.2021 concludes KCTDs contribute to
    'GABAB axonal expression and presynaptic excitation, but not soma expression and postsynaptic
    inhibition', so it also undercuts the reason's appeal to somatic expression. Citation removed
    rather than re-grounded: no sentence in that paper supports the term.

    GO:0098794 postsynapse: ACCEPT -> UNDECIDED. Flagged in review, and correctly. GO:0098794 is among
    GO:0045211's ancestors (confirmed via QuickGO), and it still carried verbatim the rationale
    withdrawn from the child, leaving the file holding the broader term on reasoning it disowned for
    the narrower one.

    Neither term is refuted. Both are cellular components, and that paper speaks to signalling function
    and soma expression in habenula cholinergic neurons rather than to whether the protein is present
    at a postsynapse. But both rest only on ortholog and subcellular-location mappings, so UNDECIDED is
    the honest state.

    GO:0098794 was also removed as a location on the GO:0031795 core function: the synthesized output
    should not assert a site the annotations decline to. The presynaptic active zone membrane location
    stands, with direct support from DOI:10.7554/eLife.68274.
