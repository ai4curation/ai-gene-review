  summary: 'Create review: IKBKB'
  details: |
    New review of 268 GOA annotations for IKK-beta, the catalytic kinase of the IKK complex. Core: IkappaB kinase activity, protein serine/threonine kinase, peptidyl-serine phosphorylation, IKK complex membership, canonical NF-kappaB signal transduction and its positive regulation (ACCEPT); generic protein kinase activity and protein phosphorylation MODIFIED to serine-specific terms. Bare protein binding REMOVED under policy; homodimerization kept, kinase/scaffold/heterodimer binding kept as non-core. The many upstream receptor pathways (TLR/TCR/TNF/IL-1/CD40/Fc-epsilon/CLR/PRR), innate/inflammatory responses, transcriptional and barrier processes kept as KEEP_AS_NON_CORE. Localization: intracellular kinase, predominantly cytoplasm/cytosol, recruited to the cytoplasmic side of the plasma membrane and membrane rafts, with a minor nuclear pool; not a cell-surface protein.
