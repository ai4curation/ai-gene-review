  summary: 'Reviewer round 2: late-endosome IEA re-argued from UniProt SubCell, IBA source statuses made consistent, duplicate references removed, NEW GO:0070530'
  details: |
    The GO:0005770 IEA row now cites UniProt's experimental late-endosome assertion (still KEEP_AS_NON_CORE, since the paper calls it marginal). The GO:0005770 IBA source entities are SUPPORTS_TRANSFER, with the caveat in the node comment. The UniProt and affinage reference entries were listed twice and are now listed once. Added NEW GO:0070530 for Lys63-over-Lys48 selectivity, and explained why GO:0002092 is not proposed.
