  summary: 'Initial review of human ANKRD13D: UIM reader of Lys63 ubiquitin on EGFR;
    negative-regulation terms made sign-neutral'
  details: |
    Reviewed 18 GOA rows on PMID:22298428 (full text). GO:0002091 x2 MODIFY to GO:0002090 because the paper proposes a positive role and dominant-negative truncations inhibit like wild type. Late endosome kept as non-core (13D only marginally colocalizes; PAINT node seeded by 13A/13B). Perinuclear IDA/ARBA UNDECIDED (text names only 13A/13B). Three ENTREP1 protein-binding IPIs removed as uninformative. Affinage record gates clear but omits the primary paper and misattributes an ANKRD13A result; nothing taken from it.
