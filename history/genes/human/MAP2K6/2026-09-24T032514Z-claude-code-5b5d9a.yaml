  summary: 'Create review: MAP2K6'
  details: |
    Created the MAP2K6/MKK6 review: all 69 GOA annotations reviewed (41 ACCEPT, 14 KEEP_AS_NON_CORE, 9 MODIFY, 3 REMOVE, 2 MARK_AS_OVER_ANNOTATED). Core function is MAP kinase kinase activity (GO:0004708) in the p38MAPK cascade (GO:0038066), located in cytosol and nucleoplasm. Protein-binding rows were modified to MAPK binding (MAPK14 partner) or protein kinase binding (PKR, LRRK2), or removed for high-throughput partners (PICK1, WFS1, NFE2L2), matching the MAP2K3 review. Identical protein binding was modified to protein homodimerization activity (autoinhibitory dimer). Unlike MAP2K3, Ser/Thr and serine kinase activity rows were kept as non-core because MKK6 has reported non-MAPK serine substrates (PIP4K2B, PAK6). Used the falcon deep research report, UniProt, Reactome and cached publications.
