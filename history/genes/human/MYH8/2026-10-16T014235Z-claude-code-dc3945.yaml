  summary: 'Create review: MYH8'
  details: |
    New review of human MYH8 (P13535, perinatal skeletal muscle myosin heavy chain). All 33 GOA rows reviewed: ACCEPT 13, MODIFY 17, KEEP_AS_NON_CORE 1, MARK_AS_OVER_ANNOTATED 1, REMOVE 1. Choices follow the paralog MYH7: location terms (cytoplasm, cytosol, myofibril, contractile muscle fiber, sarcomere, myosin filament) refined to striated muscle myosin thick filament; myosin complex and myosin II complex to muscle myosin complex; cytoskeletal motor activity to microfilament motor activity; muscle contraction and system process to skeletal muscle contraction; ATP metabolic process marked over-annotated. Removed: myosin phosphatase activity (Reactome TAS), since GO:0017018 is dephosphorylation of phosphomyosin, which the heavy chain does not catalyse. Disease (trismus-pseudocamptodactyly, R674Q) and knockdown phenotypes were kept as context and not converted into process terms. Recombinant motor studies of human perinatal myosin and the R674Q mutant were fetched and cited. Deep research: openscientist succeeded; falcon was not used. Validated with just validate human MYH8.
