  summary: 'Create review: PPP1R15B (CReP), ISR eIF2alpha phosphatase subunit'
  details: |
    Created the full gene review for human PPP1R15B/CReP, the constitutive non-catalytic subunit of the eIF2alpha holophosphatase, as one item of the integrated stress response project. All 30 GOA rows reviewed with no PENDING left. Core molecular function recorded as GO:0140767 enzyme-substrate adaptor activity, refining the GO:0060090 molecular adaptor IDA row and preserving the adaptor framing of GO-CAM 61e0e55600000407. Seven of eight bare GO:0005515 rows are PP1 catalytic-subunit interactions and were modified to GO:0008157; the TRIM23 HuRI row was removed per the protein-binding policy. GO:1903898 was modified to a proposed new term, negative regulation of integrated stress response signaling, because GO:0140467 has regulation children only under its PERK child while PPP1R15B acts on the node shared by all four ISR kinase branches. The GO:0005783 ER IBA row was kept as non-core under projects/ORGANELLES.md with no sub-compartment term added, since the only human imaging shows punctate foci with no ER co-stain. The broad ARBA GO:0051246 row was modified to GO:0001933 plus GO:0006446, the latter settled by a comparator check against PPP1R15A. A WRONG_EVIDENCE_CODE source defect was recorded against the DisProt GO:0019888 IEP row from PMID:34847777. Deep research was unavailable in this environment, so PPP1R15B-notes.md is the hand-written substitute. Validated with just validate human PPP1R15B: valid with one non-blocking warning, that the cytosol location in core_functions has no corresponding GOA row; status left at DRAFT for that reason.
