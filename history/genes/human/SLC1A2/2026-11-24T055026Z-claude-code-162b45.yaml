  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch H06). GO:0015175 neutral L-amino acid transmembrane transporter activity changed from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE. The IBD at PTN000238242 (234 leaves) has seven seeds, one of which is mouse Slc1a2, the EAAT2 ortholog in the same clade PTN008334080, annotated by IDA to L-cysteine transmembrane transporter activity (PMID:12614333). Human EAAT2 also carries L-cysteine at lower efficacy than EAAT3 (PMID:8782106). Both papers read as abstracts. The earlier reason, that neutral amino acid transport belongs only to the ASCT paralogs, was wrong. The propagation_review block was updated to NO_FAILURE_NON_CORE.
