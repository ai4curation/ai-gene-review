  summary: Narrow two ADIRF localization knowledge gaps with an OpenScientist run
  details: |
    Ran OpenScientist (3 iterations) on ADIRF secretion and nuclear signals. No SP/TM/NLS/folded domain. The conserved feature is a long apolipoprotein-class amphipathic helix permitting signal-free membrane binding and vesicle loading. Extracellular-route and nuclear-retention gaps OPEN -> NARROWING. The run's claim that no serum evidence exists was not adopted, because this review cites PMID:33737617.
