  summary: Review FANCM DNA remodeling and repair recruitment
  details: |
    FANCM couples ATP-dependent DNA remodeling to recruitment of DNA repair machinery. This review preserves positive RNA:DNA remodeling and conserved synthesis-dependent strand annealing evidence while distinguishing human motor experiments, donor activities and cofactor preparations. Review all 52 current imported contexts: 40 ACCEPT, eight KEEP_AS_NON_CORE, three MODIFY and one UNDECIDED. Retain two complementary core functions and all three natural products without assuming functional equivalence. Human meiotic intermediate resolution remains unresolved. Preserve all 54 inherited object positions, 38 quotation paths and reference associations. Retain the historical GO:0035825 source assertion as retired with its positive SDSA refinement; the recovered ARBA00027491 rule still exists, and neither rule deletion nor biological absence is inferred. The independent SDSA IBA remains active. Retire the inherited authored checkpoint proposal as UNDECIDED, distinguishing acute depletion, stable knockout and partial patient alleles. Adopt exact current GOA supporting entities in 20 mapped contexts. Preserve 35 original reference identities and findings, expand to 45 references and retain historical review notes. All six canonical checks pass, including strict GOA matching, ontology/component validation and rendering of 116 narratives. Computed status is DRAFT with eight advisories: seven supported generic-binding decisions under the project policy and one unused inherited research file. Existing UniProt, publication/Reactome/family caches, provider output, prior history and unrelated work remain unchanged. Nine missing publication files are genuine additive fetches. The current UniProt snapshot remains private consultation; its protein comments, features and sequence equal the preserved inherited record. No new quotation is authored. Generated HTML is checked without replacing the inherited file.
