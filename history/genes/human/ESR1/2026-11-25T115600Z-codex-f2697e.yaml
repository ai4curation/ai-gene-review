  summary: 'Create review: ESR1'
  details: |
    De novo review of all 325 GOA rows for human ESR1 (estrogen receptor alpha, P03372) in the context of GO-CAM 6606056e00000678. Actions: 123 ACCEPT, 132 REMOVE, 50 KEEP_AS_NON_CORE, 9 TOO_GENERAL, 7 MODIFY, 3 MARK_AS_OVER_ANNOTATED, 1 UNDECIDED. Core molecular functions were recorded as nuclear estrogen receptor activity (GO:0030284), estradiol binding (GO:1903924), and estrogen response element binding (GO:0034056). Generic GO:0005515 protein-binding IPI rows were removed consistently as uninformative rather than deduplicated. Generic steroid binding was refined to estradiol binding, nuclear steroid/steroid hormone receptor signaling parents were refined to estrogen-specific terms, membrane was refined to plasma membrane, and positive regulation of DNA-templated transcription was refined to the RNA polymerase II-specific child. Chromatin remodeling, smooth-muscle apoptosis, and stem-cell differentiation were marked as over-annotations; ATPase binding from PMID:12058073 was left undecided because the cached abstract exposes only androgen receptor work. Provider deep research was unavailable, so manual ESR1 literature notes were written. Validated with just validate human ESR1 and just validate-quotes.
