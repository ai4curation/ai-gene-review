  summary: Initial AI review of human FGF7 (KGF) GO annotations
  details: |
    Reviewed all 84 GOA rows plus one NEW (heparin binding, PMID:2915979). Core functions: GO:0005111 type 2 FGFR binding (FGFR2 IIIb selective ligand; FGFR signaling, MAPK) and GO:0008083 growth factor activity (epithelial/keratinocyte proliferation), extracellular region. protein binding IPI with FGFR2 IIIb modified to GO:0005111; signal transduction NAS modified to FGFR signaling pathway. Removed family-root IBA cytoplasm (secreted signal-peptide ligand); neurogenesis IBA, cortactin 'protein localization to cell surface' and transferred transcription regulation marked over-annotated. Mesenchymal cell proliferation IDA (PMID:11023837, an alpha2M/glycodelin paper with no FGF7 mention) left UNDECIDED pending source check. Mouse synapse terms (PMID:20505669) kept as non-core. Cached PMIDs 15806171, 20505669, 12837279, 17394208.
