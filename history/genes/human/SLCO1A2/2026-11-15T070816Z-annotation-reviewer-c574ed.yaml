  summary: De-novo review of all 47 GOA annotations for SLCO1A2 (OATP1A2), multispecific
    organic anion uptake transporter
  details: |
    Reviewed every GOA row for SLCO1A2 (P46721, OATP1A2). Na+-independent, polyspecific amphipathic organic anion uptake transporter (secondary-active anion exchange, HCO3- counter-exchange, pH-sensitive via His-107). Core MF: GO:0015125 bile acid transmembrane transporter activity + GO:0015291 secondary active transmembrane transporter activity (the mechanism-level core for its polyspecificity) + NEW GO:0015349 thyroid hormone transmembrane transporter activity (direct T3/T4, UniProt Rhea). QuickGO: the broad organic-anion grouping MF terms GO:0008514 and GO:0015347 are BOTH OBSOLETE (unnecessary grouping), so neither is used; recorded as suggested_question. Core location GO:0005886 (apical canonical). Actions (47+1 NEW=48): 22 REMOVE (bare GO:0005515 PDZ/PBM fragmentomics scaffolds), 14 ACCEPT (PM, bile-acid MF/BP IBA+TAS, secondary-active, Na-independent organic anion transport), 9 TOO_GENERAL (GO:0022857 x6 incl IDA, GO:0055085 x2, GO:0016020), 1 MODIFY (GO:0006805 xenobiotic metabolic process -> GO:0006855 xenobiotic transmembrane transport; transports drugs, does not metabolize), 1 KEEP_AS_NON_CORE (basolateral PM IBA, polarity tissue-dependent), 1 NEW (GO:0015349 TH). Review-response (PR #6386): added T3 (CHEBI:533015) to the polyspecific core_function substrates (the NEW GO:0015349 evidence shows both T3/T4 transport); added one source_defect (resource UNIPROT, WRONG_STATEMENT/CHECK) recording that P46721 CC FUNCTION names T3 as "3,3',5'-triiodo-L-thyronine" which is reverse-T3's isomer name (T3 is the 3,3',5- isomer); added a sentence to the GO:0015291 core reason explaining it is kept (not TOO_GENERAL) because the gene is polyspecific and the organic-anion grouping MF terms are obsolete. Batch 12 (SLCO/OATP family).
