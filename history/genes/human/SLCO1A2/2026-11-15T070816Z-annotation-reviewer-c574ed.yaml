  summary: De-novo review of all 47 GOA annotations for SLCO1A2 (OATP1A2), multispecific
    organic anion uptake transporter
  details: |
    Reviewed every GOA row for SLCO1A2 (P46721, OATP1A2). Na+-independent, polyspecific amphipathic organic anion uptake transporter (secondary-active anion exchange, HCO3- counter-exchange, pH-sensitive via His-107). Core MF: GO:0015125 bile acid transmembrane transporter activity + GO:0015291 secondary active transmembrane transporter activity (the mechanism-level core for its polyspecificity) + NEW GO:0015349 thyroid hormone transmembrane transporter activity (direct T3/T4, UniProt Rhea). QuickGO: the broad organic-anion grouping MF terms GO:0008514 and GO:0015347 are BOTH OBSOLETE (unnecessary grouping), so neither is used; recorded as suggested_question. Core location GO:0005886 (apical canonical). Actions (47+1 NEW=48): 22 REMOVE (bare GO:0005515 PDZ/PBM fragmentomics scaffolds), 14 ACCEPT (PM, bile-acid MF/BP IBA+TAS, secondary-active, Na-independent organic anion transport), 9 TOO_GENERAL (GO:0022857 x6 incl IDA, GO:0055085 x2, GO:0016020), 1 MODIFY (GO:0006805 xenobiotic metabolic process -> GO:0006855 xenobiotic transmembrane transport; transports drugs, does not metabolize), 1 KEEP_AS_NON_CORE (basolateral PM IBA, polarity tissue-dependent), 1 NEW (GO:0015349 TH). source_defects: none. Batch 12 (SLCO/OATP family).
