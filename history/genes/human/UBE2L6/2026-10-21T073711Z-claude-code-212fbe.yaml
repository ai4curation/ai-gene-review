  summary: 'Create review: UBE2L6'
  details: |
    De-novo review of human UBE2L6 (UbcH8) as the experimentally characterised ortholog reference for ProtNLM2 benchmark gene rabbit G1TUN6, written independently of ProtNLM2 output. Deep research failed (falcon auth error, perplexity-lite quota), so the review is built from cached GOA-cited papers plus UniProt-cited PMID:20508617 and PMID:11237715. All 64 GOA rows reviewed. Core functions: ISG15 conjugating enzyme activity (GO:0061653, human EXP/IDA) in ISG15-protein conjugation, and ubiquitin conjugating enzyme activity (GO:0061631). GO:0042296 ISG15 transferase activity rows (IBA from PAINT PTN000631065, IDA, IEA) modified to the E2-specific child GO:0061653; general MF/BP parents modified to carried specific terms; cytoplasm refined to cytosol; bare protein binding rows modified to ubiquitin protein ligase binding for E3 partners and removed for GNB2, LITAF and Shigella OspG; innate immune response kept as non-core because the cited HEV paper found no UBE2L6 effect. PANTHER placement checked: PTHR24068:SF43, separate from UBE2L3 subfamilies; the UBE2L3-only PAINT term K11-linked ubiquitination is not transferred.
