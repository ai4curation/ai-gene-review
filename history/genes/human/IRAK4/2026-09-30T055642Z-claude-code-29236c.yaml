  details: |
    Reviewed all 125 GOA annotations for human IRAK4 (Q9NWZ3) against cached primary literature, Reactome and UniProt (no deep research available; batch job terminated before IRAK4). Actions: 51 ACCEPT, 40 KEEP_AS_NON_CORE, 21 REMOVE, 11 MODIFY, 2 MARK_AS_OVER_ANNOTATED, plus 1 NEW (GO:0035591 signaling adaptor activity, scaffold role, PMID:35977521). Key decisions: IBA GO:0008063 Toll signaling pathway (PTN000701353, from fly tub/pll) modified to GO:0002755 MyD88-dependent TLR signaling since the Drosophila Toll term is not an ancestor of the TLR pathway term; IDA GO:0038172 IL-33 signaling from PMID:11960013 modified to IL-1-mediated signaling (paper studies IL-1 only); cell surface IDA modified to extrinsic component of cytoplasmic side of plasma membrane; NLRP3 inflammasome assembly modified to positive regulation; structural MyD88/IRAK2 protein-binding rows modified to death domain binding and HT/Pellino protein-binding rows removed; rat Compara extracellular region and smooth muscle proliferation removed. Core functions: Ser/Thr kinase of the Myddosome and death-domain scaffold. just validate passes with no errors or warnings; all 117 supporting_text quotes checked verbatim against cached sources.
