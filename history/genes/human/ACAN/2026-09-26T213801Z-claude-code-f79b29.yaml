  summary: Audit ACAN evidence, matrix roles and inherited annotations
  details: |
    Audited the existing main review at base blob c895b62b3f46eccc3e98fd8229faccee05c3d6ac against nine cached publications, genuine existing affinage research, source-specific Reactome records and primary public pages. All 40 seeded annotation fields remain unchanged; removed only the previous reviewer-authored NEW GO:0085029 after checking the fragment-binding assay, GO parents, limited BCAN/NCAN comparator snapshots and existing Reactome binding model. Final counts: 8 ACCEPT, 21 KEEP_AS_NON_CORE, 8 MODIFY, 1 REMOVE, 2 UNDECIDED. Corrected animal-versus-human lethality, COMP-versus-G3 domain attribution, gel-phase location, abstract-only interaction/source claims, and PAINT ancestral-node reasoning. Retained aggrecan as proteolysis substrate rather than catalytic or scaffold participant. Three core molecular functions remain. No generated sources or caches were edited.

    Final gene validation passes with three warnings: PMID:11222505 cannot be fetched by the normal cache tool due to DNS failure; extracellular-region actions differ between core matrix-binding and secretion/catabolic contexts; and no annotation cites the available provider report. The context-dependent location actions are intentional and independently reviewed. The primary PubMed abstract was verified directly, the missing cache is disclosed, and publication remains pending normal cache recovery. Source preservation was checked field-for-field against the original 40 rows; the three immutable gene-source blobs match main. The scaffolder defaulted to claude-code for filename/session id; these generated identifiers remain unchanged, while the draft actor name is corrected to codex.

    Independent review requested consistent specificity for the three core matrix-binding Reactome extracellular-region rows; each now refines to extracellular matrix. Secretion and degradation-context rows remain non-core with biological-context rationales.

    Final history validation and gene rendering pass. The final gene validation reports no quote mismatch or other blocking error. Publication remains a draft until the required missing publication cache is recovered normally.

    Publication preflight identified stale top-level reference summaries. InterPro adhesion, PAINT ancestry, ARBA gel-phase, the B4GALT1 disease reaction, and the aggrecan aggregate reaction now agree with the final row judgments. Trailing whitespace was removed from review YAML with parsed-YAML equality verified.
