  summary: 'Create review: MTRNR2L12'
  details: |
    Reviewed the four GOA rows on the nuclear humanin-like pseudogene MTRNR2L12 (P0DMP1); all four marked over-annotated, since the predicted peptide keeps every humanin determinant (23/24 identity, Leu12->Ser only) but has never been observed. No core functions and no new terms. Recorded two GOA/literature issues: MTRNR2L12 lacks the PANTHER IBA rows carried by MTRNR2L8, whose predicted peptide is identical, and the Down syndrome paper PMID:25720405 asserts an HN12 peptide confirmed in brain tissue without any citation.
