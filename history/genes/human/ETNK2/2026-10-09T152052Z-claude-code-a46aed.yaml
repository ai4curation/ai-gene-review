  details: |
    Weekly evidence-aware compliance pass. ETNK2 weighted compliance 44.23 -> 93.26. Added review.reason to all eight annotations (only the protein-binding row had one), arguing IBA node placement rather than restating terms: the GO:0004305 WITH/FROM carries fourteen descendant evidences across fungi, nematode, fly, rodent and human under PANTHER:PTN000503516, so ethanolamine kinase activity is ancestral to the family. Migrated the bare GO:0005515 row from MARK_AS_OVER_ANNOTATED to REMOVE per the generic-protein-binding policy; MODIFY was checked against the actual partner list and rejected because none of the six HuRI partners is lipid-metabolic and the screen assigns no function. Added source_entities to the GO:0005737 propagation_review naming PANTHER:PTN000503516 as SUPPORTS_TRANSFER, making explicit that this is a granularity call rather than a challenge to the node. Justified the pre-existing NEW ATP-binding row properly: the annotation already exists upstream as GO:0005524 F:ATP binding IEA:UniProtKB-KW in the Q9NVF9 DR block, and a comparator check against the committed files for ETNK1, CHKA and CHKB shows all four carry the same DR line while none of their GOA exports contains any GO_REF:0000043 row, so the absence is an export artefact across the whole choline/ethanolamine kinase family rather than a curatorial decision. Added findings to all seven references including four on the UniProt entry; GO_REF findings are statement-only because those documents are not cached. Added descriptions for the three alternative products. Added four suggested_questions and three suggested_experiments where none existed, centred on the fact that every functional statement on the human entry is ECO:0000250 transfer from mouse UniProtKB:A7MCT6 and only the tissue specificity rests on a human experiment. Added reference_section_type to the core_functions quotes. Also removed two stray markup lines that had been committed into the notes file. No GO term id or label was changed