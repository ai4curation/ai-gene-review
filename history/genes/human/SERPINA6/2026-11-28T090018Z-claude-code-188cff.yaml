  summary: De novo review of human SERPINA6 (corticosteroid-binding globulin) with
    variant-on-structure analysis
  details: |
    Reviewed all 15 GOA rows and added one NEW row (GO:0009914 hormone transport, IMP PMID:11502797; comparator SERPINA7 carries GO:0070327). REMOVE the three GO:0004867 serine-type endopeptidase inhibitor rows (IBA, IEA, TAS): neutrophil elastase cleaves CBG without being inhibited (PMID:2370299). REMOVE the Reactome TAS to glucocorticoid biosynthetic process (pathway membership; CBG only binds the secreted hormone). MODIFY steroid binding to cortisol binding (IDA) or steroid hormone binding (IEA), and molecular carrier activity to lipid carrier activity; ACCEPT six extracellular region rows; KEEP_AS_NON_CORE extracellular exosome. Source defects filed for InterPro2GO (IPR000215), the PINC TAS and Reactome R-HSA-194002. Two proposed GO terms (steroid hormone carrier activity, steroid hormone transport).

    Bioinformatics (SERPINA6-bioinformatics/, uv run 01_fetch_data.py then 02_analyze.py): numbering of 20 literature variants checked against P08185 (19 match; the common 'A224S' polymorphism is p.Ser246Ala with reference and alternate swapped in later papers); steroid pocket from 2VDY/4C49/4BB2; RCL register and elastase site; burial, conservation over 73 orthologues, AlphaMissense, gnomAD v4 and ClinVar. Conclusion: every reported disease allele is loss of function (null, secretion-defective, or binding-defective); none is gain of function or dominant negative.

    Deep research: falcon and perplexity providers are not installed in this environment; asta (retrieval only) and openscientist reports were generated. The openscientist deep-research report agrees with the review; its shorter contact distances come from hydrogen atoms in the 4C49 ligand model (verified). Two OpenScientist hypothesis jobs (function-hypothesis-go-0004867; helix-d-allosteric-variant-cluster) were launched 2026-11-26, lost to a container restart, relaunched 2026-11-28 and were still running when this record was written; their reports are not part of this session's evidence. Validation: just validate human SERPINA6 passes.
