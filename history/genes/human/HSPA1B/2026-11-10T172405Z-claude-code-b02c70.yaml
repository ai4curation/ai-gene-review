  details: |
    Follow-up to the REMOVE re-review of this file. After the direct-assay centriole row (GO:0005814; IDA, PMID:24061851) moved from REMOVE to ACCEPT, the electronic row for the same term ([16]; IEA, GO_REF:0000117) was the only one still marked as an over-annotation, beside two accepted direct-assay rows and against the HSPA1A review, which accepts the same electronic row. Rows that share a term are judged alike, so [16] moves from MARK_AS_OVER_ANNOTATED to ACCEPT, with the quote from PMID:24061851 as support and a reason that states the source limitation (the study expressed the HSPA1A product, which differs from the HSPA1B product at two residues). Validated with ai-gene-review validate --terms: valid, no new warning; the inconsistent-actions warning for this term is gone.
