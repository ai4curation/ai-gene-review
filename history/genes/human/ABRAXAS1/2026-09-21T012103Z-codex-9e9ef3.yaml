  summary: Re-review ABRAXAS1 evidence and context-dependent IBA transfer
  details: |
    Withdrew three spindle/microtubule exclusions based on nuclear enrichment, missing target assays or single-paralog support; incorporated the existing OpenScientist report with source-mechanism evidence and explicit uncertainty. All three challenged microtubule/spindle IBAs are UNDECIDED. PAINT places the assertions at metazoan PTN001272083 with ABRAXAS2/Q15018 support. The primary BRISC study directly establishes ABRO1/BRISC microtubule association and NuMA-dependent spindle regulation [PMID:26195665, “The deubiquitinating enzyme complex BRISC is required for proper mitotic spindle assembly in mammalian cells.”]. Its source mechanism does not by itself prove conservation or loss in ABRAXAS1. Distinct BRCA1-A versus BRISC partners make divergence plausible, but a principal nuclear DNA-repair location is not an exclusive localization statement. The existing OpenScientist report is marked disputed where it converts lack of target assays and a single paralog source into refutation. Its exact excerpt and the primary source are incorporated. Other DNA-repair, ubiquitin-recognition, localization and core-function claims were screened and retained; generic protein binding is removed for informativeness. All current annotations were screened and just validate human ABRAXAS1 passed. Exact non-NEW source fields were preserved. Audit: projects/IBA_REVIEW/rereview-2026-09-20/context-transfer.yaml.
