  summary: 'Create: GATB review'
  details: |
    De novo review of all 29 GOA annotations for human GATB (O75879), the GatB amidotransferase subunit of mitochondrial GatCAB. 6 protein-binding IPI rows removed (QRSL1 co-membership captured by GO:0030956; LINC01561 hits from binary screens unrelated to function). GO:0003824, GO:0016874 and GO:0016884 IEA rows modified to GO:0050567 (all are is_a ancestors). Obsolete GO:0070681 (3 rows) modified to GO:0019988, consistent with GATC and QRSL1. Core function: contributes_to GO:0050567 in GO:0030956, involved in GO:0019988 and GO:0032543. Deep research (claude-code) ran only 2 web searches and was used as leads only. Validated with just validate human GATB.
