  details: |
    New review of 177 GOA annotations for heterogeneous nuclear ribonucleoprotein K. Accepted core poly(C) RNA/mRNA binding, nuclear/nucleoplasm/chromatin/cytoplasm localization, spliceosome C complex and RNP complex membership; transcriptional and apoptotic regulation, splicing regulation, X-inactivation and LDLR transactivation kept as non-core. Bare protein binding REMOVED under policy (self-association and KI docking captured separately); nucleic acid binding and several general transcription/RNA-processing/apoptosis terms MODIFIED or TOO_GENERAL. High-throughput proteomic locations (extracellular exosome, membrane, focal adhesion, cadherin binding) MARK_AS_OVER_ANNOTATED. One unverifiable abstract-only IPI set to UNDECIDED. Localization: intracellular (predominantly nuclear/nucleoplasmic, chromatin; shuttles to cytoplasm/stress granules); not a cell-surface protein.
