  summary: 'Create review: IZUMO1'
  details: |
    New review of all 35 GOA annotations for IZUMO1, the sperm adhesion protein that binds egg JUNO and human FCRL3/MAIA after the acrosome reaction. Accepted plasma membrane, acrosomal membrane, sperm-egg recognition, sperm-egg fusion and heterotypic adhesion binding; removed zona pellucida binding (contradicted by knockout phenotype) and inferred signal transduction; marked receptor ligand activity and syncytium formation as over-annotations; refined membrane, acrosomal vesicle, cell adhesion and protein binding terms. Deep research providers were unavailable, so research notes were compiled from cached literature and UniProt.
