  summary: Reassess AFG3L2 protease evidence and source-specific annotation scope
  details: |-
    Audited all 77 machine-seeded AFG3L2 assertions while preserving every source field and all 39 original reference id/title pairs. Withdrew the redundant pre-existing NEW catabolic-process proposal; consolidated ATP-driven unfolding and zinc-dependent cleavage into one core protease function. The SLC25A45 processing assertion is refined to mitochondrial protein catabolism based on its turnover assay and the maturation scope of GO:0034982/GO:0016485. Six generic binding rows are removed as uninformative without rejecting reported interactions; inaccessible axonogenesis evidence remains UNDECIDED. Broad source-level membrane/mitochondrial localizations remain ACCEPT. Source-specific reviews distinguish human versus mouse, native versus engineered constructs, productive maturation versus degradation, and AFG3L2 proteolysis versus substrate transport/sensing. Added 40 manual reference assessments and appended primary-access notes. Independent coordinator read all decisions, the integrated core and all reference assessments. Final counts: 47 ACCEPT, 13 MODIFY, 10 KEEP_AS_NON_CORE, 6 REMOVE, 1 UNDECIDED. Genuine Falcon and perplexity-lite attempts both failed at client installation due to PyPI DNS before provider execution; the existing provider artifact is unchanged. Concurrent caching confirmed all 19 original PMIDs. Normal fetch of externally verified donor PMID:19656850 failed DNS; no cache or report was fabricated. DRAFT remains the publication state until that cache is recovered. Targeted validation, source/quote integrity and rendered output were checked; final validation outcomes are recorded in the publication manifest.
