  summary: 'Create review: FIBCD1'
  details: |
    De-novo review of human FIBCD1 (Q8N539) as the characterised FReD-family reference for fly CG10359, independent of ProtNLM2 output. Falcon deep research failed (403 auth) and the perplexity-lite fallback timed out, so the review uses cached primary literature. Accepted IDA chitin binding as core. Refined membrane (IDA, IEA) to plasma membrane. Removed two high-throughput MAL protein-binding rows per policy. Marked the family-root PTN000441162 extracellular matrix IBA as over-annotated (TM receptor, compartment mismatch). Added NEW chondroitin sulfate binding, cargo receptor activity and receptor-mediated endocytosis from human-FIBCD1 HEK293T experiments (PMID:35916241). Recorded that PANTHER puts FIBCD1 in SF45 and CG10359 in SF327, and that PAINT never propagated chitin binding.
