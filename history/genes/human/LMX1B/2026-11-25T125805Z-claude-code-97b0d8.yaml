  summary: Record OpenScientist LIR analysis showing ATG8 paralogs are indistinguishable
    for LMX1B
  details: |
    Ran an OpenScientist deep-research job (kgap-lmx1b-atg8-paralogs) on the knowledge gap covering which ATG8-family paralogs are endogenous LMX1B cofactors. The paralog question resolves in the negative, and the run adds two qualifications that matter more than the ranking.

    Residues 308-317 are SYTPLAPPQQ, confirmed in the local O60663 record, containing one LIR-like core at Tyr309-Thr310-Pro311-Leu312. It meets the bare aromatic-hydrophobic consensus but fails the curated canonical definition at one position, proline at X2, which appears in none of the validated LIR instances parsed, and fails the GABARAP-selective motif at all three defining positions. That position is the one that matters least for paralog choice: the docking-site floor reading a LIR core is effectively the same protein in all six paralogs, eight of thirteen core-reading positions being strictly identical and the rest conservative, so a non-canonical X2 predicts weak binding to all six rather than selective binding to some. The paralog-discriminating residues sit on the flank-reading surfaces, and the LMX1B element has no acidic upstream cluster and no GABARAP-interaction motif, so there is nothing there for those surfaces to read. No paralog has incompatible pocket residues. Only abundance narrows the set: MAP1LC3C sits at background in substantia nigra, more than a thousand-fold below GABARAP, while the other five are abundant, so MAP1LC3C is the single paralog that can be set aside, and on expression rather than sequence.

    The qualifications. First, the deleted 308-317 window also removes a Pin1 docking site, a proline-directed kinase site at Thr310-Pro311, a class II PxxP and a YxxPhi sorting signal, so the transcriptional and stress-protective phenotype attributed to that deletion does not isolate ATG8 binding. Second, a stronger canonical LIR candidate has never been tested: Phe356-His-Asp-Ile359 inside the acidic disordered DSIFHDIDSD at 353-362, also confirmed in the local record, reported 97 to 100 per cent invariant across 151 vertebrate LMX1B entries and lying 39 residues outside the deleted window. Testing that element should precede treating 308-317 as the ATG8 interface.

    Status moved from OPEN to NARROWING. Verified locally: the 402-residue length, the 308-317 sequence, the YTPL core, the flanking sequences and the 353-362 element with its FHDI core. The contact mapping of 29 ATG8-peptide complexes, the docking-site position assignments, the motif-server predictions, the expression figures and the 151-ortholog conservation statistics were not independently checked. No annotation action was taken.
