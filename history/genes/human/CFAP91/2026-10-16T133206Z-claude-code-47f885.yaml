  summary: 'Create: CFAP91 (MAATS1) GO annotation review'
  details: |
    New review of all 14 GOA rows for CFAP91 (MAATS1/AAT-1), the central CSC subunit spanning the RS2 and RS3 bases. Actions: 4 ACCEPT (axoneme x2, motile cilium, cilium movement), 2 MODIFY (radial spoke stalk -> radial spoke base 2 and base 3; spermatogenesis IMP -> GO:0120316 sperm flagellum assembly), 3 TOO_GENERAL (cytoplasm, entailed by axoneme), 4 MARK_AS_OVER_ANNOTATED (mitochondrion EXP/IEA from overexpressed short AAT-1 isoforms in somatic cell lines; axonemal central apparatus assembly IMP, a secondary MMAF feature since CFAP91 is on the doublets), 1 REMOVE (generic protein binding, HuRI DPY30), 2 NEW (GO:0062177 radial spoke assembly, comparator LRRC23; GO:0005200 structural constituent of cytoskeleton). Falcon deep research failed (Edison authentication error) and perplexity was unavailable; manual literature research is recorded in CFAP91-notes.md. New publication caches: PMID 12223483, 15863901, 32161152, 40931011, 39671309, 17967944. Validated with just validate human CFAP91 (only UV_NATIVE_TLS warnings) and just validate-references.
