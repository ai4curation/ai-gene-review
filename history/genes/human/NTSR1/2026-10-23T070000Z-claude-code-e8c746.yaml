  summary: Full de novo GO annotation review of human NTSR1 (neurotensin receptor
    1)
  details: |
    Reviewed all 75 seeded GOA annotations for human NTSR1 (P30989) and added one NEW
    annotation. Action counts: 22 ACCEPT, 28 KEEP_AS_NON_CORE, 7 TOO_GENERAL, 6 MODIFY,
    5 MARK_AS_OVER_ANNOTATED, 5 REMOVE, 2 UNDECIDED, 1 NEW.

    Core functions: (1) GO:0016492 G protein-coupled neurotensin receptor activity at the
    plasma membrane and in palmitoylation-dependent membrane rafts, driving GO:0007218
    neuropeptide signaling, GO:0007200 PLC-activating GPCR signaling and GO:0051281
    positive regulation of calcium release; (2) GO:0032795 heterotrimeric G-protein
    binding, covering the receptor's GEF action on Gi/Gq heterotrimers and the
    arrestin/G-protein arm separability.

    Notable decisions:
    - NEW GO:0007200 (phospholipase C-activating GPCR signaling pathway) proposed. The
      receptor itself performs the first step (GEF for Gq/11; PMID:17620610 reconstitution,
      PMID:21725197 Galphaq/11 co-IP, Reactome R-HSA-379048). Comparator check in QuickGO:
      AGTR1 13, TACR1 5, HTR2A 4 annotations to GO:0007200; NTSR1/NTSR2 none - a gap, not a
      convention.
    - REMOVE GO:0050965 (detection of temperature stimulus involved in sensory perception of
      pain): contradicted by both Ntsr1/Ntsr2 knockout studies (PMID:14725975, PMID:12384239),
      which assign thermal nociception to the paralog NTSR2.
    - Four bare GO:0005515 protein binding rows (RAMP1/RAMP3 screens, FGFR-paper-sourced NTS
      row) removed per the generic-protein-binding policy; the NTS row from PMID:17620610
      was instead MODIFYed to GO:0016492 since that paper measures agonist binding and Gq
      activation directly.
    - MODIFY GO:0044877 -> GO:0032795; GO:0006171 -> GO:0007189; GO:0007268 -> GO:0050804
      (the cited EM study reports receptors as predominantly extrasynaptic); GO:0009898 ->
      GO:0005886; GO:0040017 -> GO:0040012 (knockout data show NT-induced hypolocomotion).
    - UNDECIDED for the two rodent-transferred rows whose sign conflicts with human data
      (GO:0043065 positive regulation of apoptotic process, GO:0051280 negative regulation of
      calcium release) rather than removing annotations whose source publications are not
      accessible here.
    - MARK_AS_OVER_ANNOTATED for transport and degradative rows where NTSR1 performs no step
      (GO:0070779, GO:0098712, GO:0071545) and for the uninformative GO:0006950 / GO:0033993.
    - PMID:42870023 (Deutsch et al. 2026) added: Methods confirm full-length HUMAN NTSR1
      (Sf9, Flag-8xHis, NTS8-13), so its smFRET NTSR1-Gi results and SBI-553 modulation apply
      directly to P30989.
    - reference_review recorded for 17 references; PMID:23597562 flagged MISCITED/NONE (an
      FGFR inhibitor paper carried as the IntAct source of a protein-binding row).

    Deep research was attempted twice (just deep-research-falcon human NTSR1 --fallback
    perplexity-lite) and failed both times (falcon: "Edison API request failed: Failed to
    authenticate"; fallback provider perplexity-lite unavailable). No -deep-research-*.md file
    was authored; the failure and the sources actually used are documented in NTSR1-notes.md.

    Validation: `just validate human NTSR1` passes with no errors (only UV_NATIVE_TLS
    deprecation noise surfaced as warnings).
