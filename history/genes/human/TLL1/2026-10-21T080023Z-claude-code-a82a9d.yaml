  summary: 'Create full review: TLL1 (human tolloid-like 1 metalloproteinase)'
  details: |
    New review of all 23 GOA rows for human TLL1, written independently of ProtNLM2 predictions as the experimentally characterised reference for the TLL1 orthogroup. ACCEPT metalloendopeptidase activity, zinc ion binding, extracellular region, protein processing and collagen fibril organization, based on human-enzyme procollagen I/II C-proteinase, chordinase and SLIT2 cleavage data (PMID:10479448, PMID:30538173, PMID:41626796) and mouse Bmp1/Tll1 double-null data (PMID:12808086). REMOVE serine-type endopeptidase activity (ARBA IEA and Reactome TAS) as a catalytic-class error for an astacin zinc protease. TOO_GENERAL for proteolysis and metallopeptidase activity. KEEP_AS_NON_CORE for calcium ion binding, dorsal/ventral pattern formation (IBA) and skeletal system development (TAS whose cited cloning paper does not support it). Notes record that PTHR24251:SF45 holds both TLL1 and TLL2, which lacks procollagen C-proteinase activity, so pCP transfer needs TLL1 orthology and not subfamily membership alone. Deep research (falcon, perplexity-lite fallback) failed; literature was cached directly.
