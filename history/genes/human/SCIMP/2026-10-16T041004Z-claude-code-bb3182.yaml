  summary: 'Create review: SCIMP (human)'
  details: |
    De-novo review of human SCIMP together with its ortholog (human SCIMP Q6UWF3 / mouse Scimp Q3UU41). Deep research (falcon, perplexity-lite fallback) failed with an authentication error, so literature was gathered by manual PubMed search and 5 post-2017 primary papers were cached (PMID:34496234, 35337798, 37058370, 35201640, 38263143). Molecular adaptor activity modified to signaling adaptor activity; protein binding rows modified to SH2/SH3 domain or TLR4 binding where the interface is known, otherwise removed; membrane modified to plasma membrane; TLR4 signalling, IL-6/IL-12 production and ERK1/2 regulation accepted as core. Actions kept consistent across the two species.
