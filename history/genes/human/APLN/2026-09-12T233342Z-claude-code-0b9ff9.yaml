  summary: 'Create review: APLN'
  details: |
    Full review of all 41 GOA rows for human apelin (Q9ULZ1) plus 2 NEW rows: 22 ACCEPT, 13 KEEP_AS_NON_CORE, 5 MODIFY, 1 REMOVE, 2 NEW, with 17 propagation_review blocks whose source_entities are derived by script from each row's seeded supporting_entities. The single IBA (GO:0005576) resolves to PTHR15953 node PTN001041490, an IBD at Tetrapoda seeded by rat, bovine and human APLN, all experimentally grounded: NO_FAILURE_CORE. Two donor-side defects were found by tracing the rodent donors' own GO records: rat Apln GO:0045776 is an IMP citing PMID:11359874, whose abstract reports that central apelin did not affect blood pressure (SOURCE_WEAK_OR_INFERRED); and mouse Apln GO:0060976 is an IMP citing PMID:28890073, an ELABELA/Apj paper reporting that Apelin-KO hearts have the opposite coronary phenotype to Apj-KO, so the unsigned term transfers but its directional gloss does not. GO:0007595 lactation was removed as an expression-to-process inference. New rows GO:0007193 (Gi/adenylate-cyclase inhibition, human APJ-HEK) and GO:0090278 (apelin opposes vasopressin release). A new bioinformatics project shows apelin-13 and apelin-17 are identical in human, rat, mouse and bovine, that R66-F77 is 97-98.5 percent invariant across 333 PTHR15953 members, and that the ACE2 consensus and terminal Phe77 are present in 328/333, encoded as a RETAINED residue claim. Validated with just validate (Valid, no warnings), checkquotes.py (174 quotes, 0 failures), gene_residue_claims (3 pass), a GOA-to-YAML bijection script, and a build idempotency check.
