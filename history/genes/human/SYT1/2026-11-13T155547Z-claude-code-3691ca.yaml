  summary: 'Review: human SYT1 (P21579), all 175 GOA rows adjudicated'
  details: |
    Full GO annotation review of human synaptotagmin-1 against the UniProt record, the cached literature, the Reactome entries and the deep-research report; 175 rows, none left PENDING.

    Core functions settled on: calcium ion sensor activity (GO:0061891) driving calcium-dependent activation of synaptic vesicle fusion (GO:0099502) and fast, calcium ion-dependent exocytosis of neurotransmitter (GO:0098746) from the synaptic vesicle membrane (GO:0030672); calcium-dependent phospholipid binding (GO:0005544); SNARE binding (GO:0000149); and the same sensor activity on dense core granules (GO:0031045) for positive regulation of calcium ion-dependent exocytosis (GO:0045956).

    Main calls. 21 bare GO:0005515 protein binding rows removed as uninformative, the interactions not being contested; the informative binding activities are annotated separately. Terms that make SYT1 the executor of fusion (GO:0006906, GO:0031629, GO:0016192, GO:2000300, GO:0150037) modified to GO:0099502, since the SNAREs perform fusion and SYT1 makes it conditional on calcium. GO:0061588 calcium activated phospholipid scrambling removed: an ortholog-based electronic row asserting a scramblase activity SYT1 does not have. GO:0006855 xenobiotic transmembrane transport flagged rather than removed, because the botulinum B/G receptor role behind it is real while the translocation is the toxin's. Cytoplasm modified to synaptic vesicle membrane; the IDA row behind it cites a DYRK1A distribution study whose cached full text does not mention synaptotagmin, recorded as MISCITED. Postsynaptic rows (GO:0014069, GO:0045211, GO:0099524, GO:0060080) flagged as over-annotation on a presynaptic protein. GO:0050750 left UNDECIDED: the cited LRP1b paper is abstract-only and does not let the claim be checked.

    Five IBA MODIFY rows carry propagation_review blocks recording that the node placements are sound and the corrections are granularity or sign refinements.

    Validation: just validate clean, backfill-record-sections added 69 record_section values, quote_check 315 quotes verified with none missing.
