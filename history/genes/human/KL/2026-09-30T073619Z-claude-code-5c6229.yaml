  summary: Complete GO annotation review for human KL (alpha-Klotho) as FGF23 co-receptor
  details: |
    Reviewed all 92 seeded GOA annotations (no PENDING left) and added 2 NEW rows, for 94 total: 76 ACCEPT, 5 KEEP_AS_NON_CORE, 8 MARK_AS_OVER_ANNOTATED, 3 REMOVE, 2 NEW (the many repeated Reactome plasma-membrane and extracellular rows share one review object each). Core function is coreceptor activity (GO:0015026) at the plasma membrane and in the extracellular region, involved in FGF receptor signaling (GO:0008543) and phosphate ion homeostasis (GO:0055062), matching the KLB paralog review and the fgfr_signaling module. Key decisions: glucuronidase and O-glycosyl hydrolase MF terms marked over-annotated rather than removed (positive mouse Klotho-Fc assay in PMID:14701853 vs negative human ectodomain result and missing catalytic glutamates in PMID:29342138); beta-glucosidase (TAS, PMID:9363890 sequence-similarity statement) and carbohydrate metabolic process (InterPro IEA) removed; norepinephrine biosynthetic process removed as an indirect systemic effect of rat brain klotho knockdown (PMID:20086041); blood pressure, response to activity/vitamin D/angiotensin marked over-annotated as rat expression-based transfers; bone mineralization IMP marked over-annotated because PMID:12110410 is a non-coding microsatellite association study. Added NEW coreceptor activity (PMID:29342138) and NEW phosphate ion homeostasis (PMID:17710231, H193R tumoral calcinosis) after a comparator check showing FGF23 carries the term while FGFR1 and KLB do not. Cached PMID:29342138, 14701853, 17710231, 16123266, 20086041. Notes with inline provenance in KL-notes.md.
