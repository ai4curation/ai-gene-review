  summary: Initial review of human FGF1 (paracrine universal FGFR ligand) for the
    FGFR signaling module
  details: |
    Reviewed all 243 GOA annotations (157 Reactome TAS extracellular-region rows accepted). Core functions: FGFR binding (GO:0005104), heparin binding (GO:0008201), growth factor activity (GO:0008083) in the extracellular region, driving FGFR signaling, MAPK cascade, proliferation and angiogenesis. Generic protein-binding rows with FGFR partners modified to GO:0005104; HuRI VBP1 row removed; NAS signal transduction modified to FGFR signaling pathway; speculative morphogenesis TAS and apoE/LXR transcription regulation marked over-annotated. Intracellular/nuclear locations, integrin and S100A13 binding, and downstream cellular outputs kept as non-core. No NEW terms: p53-linked anti-apoptotic and metabolic roles raised as questions. Cached 7 additional papers (Fgf1 knockout, PPARgamma-FGF1 axis, FGF1 insulin sensitizer, intracellular FGF1/p53, NLS, LRRC59, AHNAK2).
