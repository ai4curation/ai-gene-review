  summary: 'Create review: LY6K'
  details: |
    New review of the 14 GOA annotations for LY6K, a GPI-anchored Ly6/uPAR cancer-testis antigen. Accepted GPI-anchored plasma membrane, acrosomal vesicle, and the mouse-ortholog-derived role in sperm binding to the zona pellucida; kept membrane raft, extracellular (shed/serum) and cytoplasmic (tumor) pools as non-core. Localization is cell surface (ectodomain exposed on the outer leaflet) plus acrosome. No molecular function term was asserted (three-finger fold, TEX101 partner, activity undefined). Deep research providers were unavailable; notes from literature and UniProt.
