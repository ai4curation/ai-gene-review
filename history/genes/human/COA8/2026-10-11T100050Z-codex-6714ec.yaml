  summary: Review COA8 complex IV assembly and source-specific functional evidence
  details: |
    Reviewed all 14 original COA8 annotations, preserving both product objects and eight original reference identities. Synthesized complex IV assembly and protein-stabilization functions with matrix-side localization from human primary experiments. Qualified the 2024 preprint evidence for COX10 binding and distinguished association from direct catalytic activation. Retained the original CLUH-specific interactions and positive mouse apoptosis evidence with construct and context limits; proposed no NEW annotations. Documented the internal localization discrepancy in the 2018 paper, limitations of the short splice product, and genuine provider/access failures. Normal validation, status, rendering and history checks passed; three advisories are documented: two campaign-retained generic-binding rows and core-term coverage, where a nested NEW enzyme-binding assertion would be redundant. Independent whole-gene review and bounded core consultation supported the assessment.
