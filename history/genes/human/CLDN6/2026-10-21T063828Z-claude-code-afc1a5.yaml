  summary: 'Create review: CLDN6'
  details: |
    Created the CLDN6 review: all 26 GOA annotations reviewed. Claudin-6 is a tetraspan plasma-membrane protein at bicellular tight junctions, with two short extracellular loops exposed; receptor-active pools associating with CD81 are basolateral in polarized hepatoma cells. Core function is structural tight-junction strand formation with calcium-independent cell-cell adhesion and ZO scaffold recruitment; the hepatitis C virus receptor role is kept as non-core. Nine generic protein-binding rows (CD81, occludin and large-scale screen hits) were removed, and generic membrane and cell adhesion rows were modified to specific terms.
