  summary: State the single-case and mouse-granularity limits on the GO:0001541 row
  details: |
    Review finding on PR #6363. The NEW GO:0001541 ovarian follicle development row rests primarily on PMID:30113650, which the cached record types as CASE_REPORT with full_text_available false: one woman with a heterozygous dominant-negative ESR2 allele, streak gonads and primary amenorrhoea. Its authors frame the phenotype as ovarian determination and/or maintenance, which is earlier and more severe than a follicle-stage defect, so the stage specificity the term carries (arrest between early and large antral follicle, in granulosa cells that under-respond to FSH) comes from Esr2-null mouse follicles and from nowhere else. The reason stated the direction of support but not that limit.

    The row is kept, as the reviewer asked. Its reason now says the limitation outright: the single case report, the abstract-only cache, the authors' own framing, the mouse origin of the granularity, and that whether the human phenotype runs through the mouse granulosa-cell mechanism at all is carried in this review as an open BIOLOGY knowledge gap rather than treated as settled. That gap already exists in the file; the row now points at it instead of leaving a reader to find it. No term, action, evidence code or quote changed.
