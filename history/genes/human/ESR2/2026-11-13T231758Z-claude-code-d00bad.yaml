  summary: 'Create review: ESR2'
  details: |
    De novo review of all 68 GOA rows for human ESR2 (estrogen receptor beta, Q92731), plus two proposed annotations. Actions: 30 ACCEPT, 21 MODIFY, 10 TOO_GENERAL, 6 REMOVE, 1 KEEP_AS_NON_CORE, 2 NEW. Core molecular function taken as nuclear estrogen receptor activity (GO:0030284), with estradiol binding (GO:1903924) and estrogen response element binding (GO:0034056) as the two component activities; generic nuclear receptor and nuclear steroid receptor rows were refined to GO:0030284 and steroid binding rows to GO:1903924, since the ligand is identified and its affinity measured (PMID:9671811, PMID:9048584). Nine of the thirteen bare protein-binding rows were replaced with evidence-backed specific terms (transcription coactivator, corepressor and coregulator binding, protein phosphatase binding, enzyme binding, transcription factor binding, protein heterodimerization plus nuclear estrogen receptor binding); four high-throughput or non-functional interaction rows were removed under the protein-binding policy. The mitochondrion IDA row (PMID:15024130) was removed: its MALDI-TOF identification failed independent reanalysis (PMID:16563354) and its immunocytochemistry used antibodies of the class later shown non-specific (PMID:28643774), while its companion claim of nuclear exclusion contradicts the nuclear rows retained here; the authors reply (PMID:16707101) is cited so the dispute is recorded. The cell-cell signaling TAS row was corrected laterally to the estrogen receptor signaling pathway, and the legacy negative-regulation-of-cell-growth NAS row to negative regulation of cell population proliferation (PMID:14745018 measures proliferation). GO:0006357 was kept undirected deliberately because ER-beta both activates and represses depending on element and ligand (PMID:9278514, PMID:15345745). Proposed: ovarian follicle development (IMP, human dominant-negative variant PMID:30113650, corroborated by mouse PMID:15831568 and PMID:15731357; comparator check against FSHR) and protein homodimerization activity (IDA, PMID:9636657). Isoform 2 (ER-beta-cx) recorded in functional_isoforms with GO:0140416 as its isoform-specific activity, which is also the replacement proposed for the receptor-antagonist-activity row. Could not verify: most cached references are abstract-only, so experimental detail in full texts (localization images in PMID:19126643 and PMID:20074560, per-receptor results in PMID:21951318) was deferred to the curators; granulosa cell differentiation and ovulation were not proposed because their support is mouse-only. No source defects found; the UniProt PELP1 caution (retracted paper) affects no current GOA row.
