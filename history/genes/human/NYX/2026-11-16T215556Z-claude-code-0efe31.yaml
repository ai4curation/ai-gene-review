  summary: First review of NYX for the dismech vision-disorder alignment
  details: |
    First annotation review of human NYX (nyctalopin), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1). 11 GOA rows reviewed: 5 REMOVE, 4 ACCEPT, 1 MODIFY, 1 MARK_AS_OVER_ANNOTATED; two NEW rows by ISS from mouse (protein localization to postsynaptic membrane; external side of plasma membrane). No molecular function is assigned: nyctalopin is a leucine-rich-repeat proteoglycan with no catalytic or channel activity, and its core role is stated at process level, as the binding partner that holds TRPM1 at the dendritic tip. Removed: signaling receptor activity (IBA), interstitial gel matrix (the cited review itself describes a membrane-anchored protein), and bare protein-binding rows. Validated with just validate human NYX: no errors.
