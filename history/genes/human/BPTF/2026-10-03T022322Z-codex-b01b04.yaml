  summary: Refine BPTF histone-reader and complex evidence
  details: |-
    Refined the BPTF histone-reader synthesis to the coupled H3K4me3 and H4K16ac reader activities, preserving the original H4 partner on its source annotation and attributing ATP-dependent remodeling to the NURF complex. Added five verified normal publication caches as references, distinguished wild-type PHD recognition from engineered Y17E specificity, and supported non-core SMARCA1/SMARCA5 associations with explicit source and assay limits. The 2017 recombinant complex panel excluded BPTF; its catalytic and direct-binding assays were not assigned to BPTF. Retained brain development as a context-dependent NURF role with curator deference, preserved three unresolved source assertions, and linked the task-specific binding instruction at its merged project commit. All 45 source objects, three named products, raw source files, existing histories and prior quotations were preserved.

    The independent science peer passed before application. Normal canonical gene validation passed; prior candidate validation also checked the two specific GO terms. Six binding-policy warnings, the FAC1-versus-NURF source-context warning and the separately supported H3-reader core warning are documented. Source caches were imported separately by the authenticated create-only route and were not edited during curation. Rendering and publication receipts are tracked separately.
