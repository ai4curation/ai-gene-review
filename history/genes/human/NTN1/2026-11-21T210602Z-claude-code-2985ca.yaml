    Re-review of the IBA REMOVEs on GO:0000981 and GO:0000978 (IBD at PTN000180816, root of the POU family PTHR11636). Both stand. The old reasons said the POU-seeded rows came from the PTHR10574 PAINT cache and called the link a provenance discrepancy needing upstream inspection. That misstated the tree: in the pinned PANTHER tree NTN1 (O95631) is itself a leaf of PTHR11636 (PTN002471715), placed with NTN3 and human POU1F1 in the three-leaf human-only node PTN008522537, while UniProt assigns it to PTHR10574 and the protein has no POU or homeobox domain. Reasons and source comments on the two rows now state this. No action changed; quotes untouched; the GO:0006357 row was not edited.
