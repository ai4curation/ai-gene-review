  summary: Re-review NTN1 evidence and context-dependent IBA transfer
  details: |
    Separated the POU-derived molecular-function mismatch from unresolved netrin-specific transcription regulation; incorporated nucleolar truncated NTN1 and direct basement-membrane guidance evidence; withdrew an abstract-only reference-misassignment assertion. The two specific POU-derived DNA-binding/Pol II transcription-factor transfers remain REMOVE based on recognition mechanism and protein architecture, but the broader Pol II transcription-regulation process is UNDECIDED: signaling can regulate transcription without the ligand being a sequence-specific factor. The current PTHR10574 PAINT export actually contains the POU-seeded PTN000180816 rows, so a demonstrated wrong-family tree placement must not be asserted without further upstream inspection. Primary secretion is not exclusivity: a truncated nucleolar netrin-1 associates with ribosomal-gene promoters in cancer cells [PMID:22871610, “Nucleolar localization of a netrin-1 isoform enhances tumor cell proliferation.”]. That ribosome-biogenesis finding does not establish the Pol II-specific molecular functions. Direct mouse work establishes basement-membrane-associated netrin-1 as a commissural guidance substrate [PMID:28780049, “Netrin1 establishes multiple boundaries for axon growth in the developing spinal cord.”]; basement membrane is therefore retained as a core location. The Slit/Robo-focused abstract of PMID:10102268 does not prove that NTN1 was not assayed. Its generic protein-binding annotation is removed for informativeness, not alleged reference misassignment. Description and core function were checked for consistency. All current annotations were screened and just validate human NTN1 passed. Exact non-NEW source fields were preserved. Audit: projects/IBA_REVIEW/rereview-2026-09-20/context-transfer.yaml.
