  summary: Drop non-supporting GO:0042803 quotes and re-attribute the Reactome C-propeptide
    finding
  details: |
    PR review round found three newly-authored text fields asserting more than their sources support. Fixed the two blocking ones. (1) GO:0042803 protein homodimerization: both supporting_text quotes added by the compliance pass were removed, leaving bare reference_ids, because the PMID:8660302 abstract gives type IX-type IX cross-links with no chain identity and the PMID:17880280 abstract gives heterotrimer/triple-helix assembly, neither of which is alpha3-alpha3 association; the summary that restated them was rewritten. The literature_support gap is now open on purpose and the reason is recorded in COL9A3-notes.md. (2) Reactome:R-HSA-8944229 findings[0].statement asserted that procollagen IX trimer association depends on a C-terminal propeptide region; collagen IX is a FACIT with no C-propeptide and its trimerization is set by NC2 per PMID:27897211 and PMID:17880280, so the statement now attributes the claim to Reactome's generic procollagen narrative. The supporting_text is unchanged and still verbatim. (3) Suggestion taken: PMID:27897211 findings[1] supporting_text extended to the contiguous Results sentences that also cover the alpha1-alpha3 disulfide bond the statement mentions. No annotation action, GO term or core function was changed. The GO:0005576 action-consistency item from the same review is a seven-row curation judgement and is left for a curator.
