  summary: 'Create review: STX3 (Q13277)'
  details: |
    De-novo review of human STX3 (Q13277), the experimentally characterised PTHR19957:SF34 relative of the HORSE STX3 ProtNLM2 benchmark gene, carried out independently of ProtNLM2 output. Deep research failed (falcon auth error; perplexity-lite quota), so the review is built from the GOA-cited papers plus 12 cached STX3 papers. All 112 GOA rows reviewed. Core functions: apical plasma membrane t-SNARE fusion in epithelia (human MVID genetics, Caco-2), granule exocytosis in secretory cells (mostly rodent), and STX3B ribbon synapse and photoreceptor trafficking (human retina IHC, mouse cKO). Notable actions: organelle membrane fusion modified to vesicle fusion to plasma membrane; integrin-knockdown adhesion, chemotaxis and proliferation phenotypes marked over-annotated; vacuole TAS and cell-cell junction IDA left undecided; generic protein binding removed, except Stx3S-ETV4/ATF2, modified to DNA-binding transcription factor binding. Added NEW exocytosis, backed by the newer PAINT node PTN000461524 IBD and experiments. Experimental findings in human are kept separate from rodent-only evidence for later transfer to horse.
