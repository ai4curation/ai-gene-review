  summary: Refine BMPR1A ligand-binding evidence and transcription-regulation rationale
  details: |
    Reviewed publisher Results, Methods and figure captions support BMP2/BMP4 binding
    to the BMPR1A ectodomain in PMID:20860622 and PMID:21054789. Four existing generic
    binding assertions are refined to BMP binding without inferring intact-receptor
    signaling from soluble-ectodomain assays. Two corresponding reference findings
    now record the source-specific assays and human construct evidence.

    Four existing positive-regulation-of-PolII-transcription annotations remain
    non-core with explicit regulatory-chain and assay-context reasoning. This does
    not assert that BMPR1A binds DNA or performs transcription. The narrower miRNA
    transcription inference remains unresolved because its specific donor evidence
    was not recovered. The historical TAS TGF-beta-pathway assertion is assessed as
    overly specific relative to the documented superfamily-membership prediction;
    the separate experimental pathway assertion remains UNDECIDED rather than being
    rejected from an unread experiment.

    Preserve all 140 source annotation objects, both negations, 19 supporting-text
    fields, the receptor-kinase core function, description and reference identities.
    Final actions: 44 ACCEPT, 72 KEEP_AS_NON_CORE, 13 MODIFY, 10 UNDECIDED and one
    MARK_AS_OVER_ANNOTATED; no NEW rows. Notes retain biological evidence and access
    limits while removing local execution metadata and adding the follow-up rationale.
    Raw GOA, UniProt and publication/Reactome caches and earlier history are unchanged.

    Normal focused gene validation passed. Four generic-binding retention advisories
    reflect supported non-core interactions retained under the task's curation policy.
    The fifth advisory flags different decisions for the two GO:0007179 source rows;
    those decisions intentionally distinguish historical TAS specificity from an
    unverified experimental context. The separate reference command reported zero
    checks; it is not treated as an independent quotation audit.
