  summary: Narrow the ITIH5 isoform-secretion knowledge gap with an OpenScientist
    run
  details: |
    Ran OpenScientist (3 iterations) on whether ITIH5 isoforms 3/4 have any route into the secretory pathway. None: they start downstream of the only hydrophobic N-terminal segment, with no SP/anchor/TM, and lack the VIT domain. Their alternative first exons are primate-specific, and no isoform-diagnostic peptides appear in PeptideAtlas. Gap OPEN -> NARROWING; translation and unconventional secretion are untested.
