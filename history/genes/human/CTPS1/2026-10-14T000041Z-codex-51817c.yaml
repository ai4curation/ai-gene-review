  summary: Review CTPS1 CTP synthesis and protein deamidation
  details: |
    Reviewed all 54 original CTPS1 annotations and both official products, preserving the literal source assertions and existing repository caches. Distinguished CTP synthesis and regulated filament assembly from protein asparagine deamidation of H1 and IRF3. Refined nine broad assertions while retaining positive phylogenetic and interaction evidence; kept four contextual processes non-core and the inaccessible membrane-proteomics assignment uncertain. Documented assay species, expression hosts, product limits, electronic-rule version differences and an ontology definition inconsistency. Genuine provider attempts failed and the review uses attributed primary-source manual research. Independent chemistry consultation, ROOT deamidase research and whole integration review passed, as did canonical validation, status and rendering checks.
