  details: |
    Created the AI gene review for human MFGE8 (lactadherin, Q08431). Provider deep research failed (Falcon HTTP 402 Payment Required; Perplexity not configured), so a manual literature synthesis with inline provenance was written to MFGE8-notes.md from the UniProt record and cached publications. Fifteen additional PMIDs (e.g. 12000961, 15155946, 18160406, 19204935, 20213738, 22357850, 23647050, 37652017, 10411933, 36385530) were located via PubMed E-utilities and cached with just fetch-gene-pmids. All 28 GOA annotations reviewed (10 ACCEPT, 14 KEEP_AS_NON_CORE, 4 MARK_AS_OVER_ANNOTATED for RCA extracellular matrix structural constituent); no NEW annotations. Core functions: phosphatidylserine binding (GO:0001786) and integrin binding (GO:0005178), both directly involved in apoptotic cell clearance (GO:0043277), framing MFG-E8 as a phosphatidylserine-bridging opsonin. Medin vascular amyloid described in the description. Validated with just validate human MFGE8 (no errors or warnings).
