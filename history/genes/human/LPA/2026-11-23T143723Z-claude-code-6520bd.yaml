  summary: Narrow the apo(a) protease-activity knowledge gap with an OpenScientist
    run
  details: |
    Ran OpenScientist (3 iterations) on the apo(a) protease-like domain. Human triad H1861/D1904/S1990 is canonical (checked locally), so inactivity is not from triad loss; the activation site is S1819 and its repair is insufficient. The catalytic His is retained in only 4/11 primate apo(a) orthologs vs 29/29 plasminogens, i.e. no selection for catalysis. Gap OPEN -> NARROWING. The run's suggestion to remove GO:0004252 was not adopted (IDA from a curator-read study); both rows stay UNDECIDED.
