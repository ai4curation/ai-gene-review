  summary: 'Review round 2: SLC16A1 core molecular function'
  details: |
    Review round 2 for PR 4815, item 2b, which is a defect the round-1 fix for item 2a created. Deleting core_functions[1] removed the GO:0008028 ancestor redundancy but left the surviving entry pairing a lactate-specific molecular function, GO:0015650 lactate:proton symporter activity, with directly_involved_in GO:1901475 pyruvate transmembrane transport, which that activity cannot execute, while the entry's own description and two of its three supporting quotes describe broad-substrate transport of lactate, pyruvate, acetate and ketone bodies.

    The file already adjudicated this the other way in its existing_annotations: the GO:0008028 IDA row is ACCEPTed as 'Core activity: MCT1 transports lactate, pyruvate, acetate and ketone bodies across the plasma membrane with a proton', and the GO:0015355 row is ACCEPTed as the correct parent of the proton-coupled monocarboxylate symport. So the activity the review itself called core was the one term core_functions lacked.

    Set the core molecular function to GO:0015355 secondary active monocarboxylate transmembrane transporter activity, which carries both the substrate breadth and the proton coupling the description states. Both directly_involved_in terms now follow from the molecular function and the description needed no change. Chose GO:0015355 over GO:0008028 because it states the secondary-active coupling rather than bare transporter activity; the ancestry objection from item 2a is moot now that there is a single entry.
