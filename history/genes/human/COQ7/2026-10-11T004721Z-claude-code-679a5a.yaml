  details: |
    Completed the COQ7 review. The description and core function now say that COQ7 hydroxylates the quinone DMQ (5-methoxy-2-methyl-3-polyprenylbenzoquinone) with NADH and O2 to 3-demethylubiquinone, as the GO:0160224 definition (RHEA:81211) states. Before, they said demethoxyubiquinol. Iron ion binding was removed from core_functions because it is cofactor binding; the NEW GO:0005506 row is kept. Three bare GO:0005515 rows changed to REMOVE. Added supported_by to the NAS row (PMID:28927698). Fixed split-hyphen wraps and a UniProt-name NADPH/NADH note. Changed the COQ8 suggested question from a kinase framing to an ATPase framing. Status COMPLETE; validation passes.
