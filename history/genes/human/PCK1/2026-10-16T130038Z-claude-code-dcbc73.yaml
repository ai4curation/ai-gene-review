  details: |
    Full review of all 59 GOA rows for human PCK1 (P35558). Core function is GTP-dependent PEP carboxykinase activity in cytosolic gluconeogenesis, oxaloacetate metabolism and glyceroneogenesis. The PMID:32322062 protein-serine-kinase/INSIG rows (GO:0106264 IDA+IEA, GO:0018105, GO:0046889, GO:0005783 IDA+IEA, GO:0032869) were kept as non-core with a single-study caveat; GO:0046890 marked TOO_GENERAL; the PEPCK and cytosol rows from that paper accepted. No GO:0036316 annotation added (PCK1 opposes SREBP-SCAP retention). IBA mitochondrion (PCK2 branch) and hepatocyte differentiation removed. Falcon deep research failed (Edison auth 403); recorded in notes. Validated with just validate human PCK1.
