  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch H15). (1) GO:0016020 membrane, IBA and the Ensembl IEA row, changed from MARK_AS_OVER_ANNOTATED to REMOVE. The IBD at the family root PTN008111916 has seven seeds; the only one inside the ALDH3A1 clade (PTN000193127, 14 leaves) is mouse Aldh3a1, an MGI located_in membrane IDA from PMID:25286108. The author manuscript of that paper was read: ALDH3A1 was recovered in the soluble fraction and is described as a soluble protein, while the other four mouse ALDH3 enzymes were membrane proteins. The seed row contradicts its source, and the direct evidence on the clade is that it is not a membrane enzyme. Suggested PAINT fix is an IRD at PTN000193127; the mouse Aldh3a1 membrane row is a query for MGI. (2) GO:0004028 3-chloroallyl aldehyde dehydrogenase activity stays MARK_AS_OVER_ANNOTATED, ground SEED_OVERREACH. The reason rested on the absence of a measurement on the human enzyme; it now names the node PTN002882967 and its two RGD seeds (rat Aldh3a1 PMID:2831537, rat Aldh3a2 PMID:1717467), cDNA cloning papers whose abstracts report aldehyde dehydrogenase activity and do not mention 3-chloroallyl aldehyde. Abstracts only, so the row is not removed. just validate passes.
