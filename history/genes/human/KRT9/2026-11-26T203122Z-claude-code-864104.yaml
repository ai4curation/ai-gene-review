  summary: 'Create review: KRT9'
  details: |
    New review of human KRT9 (P35527). All 35 GOA rows judged: structural and keratin-filament terms accepted as core; development terms kept as non-core; sixteen cytosol rows (Reactome, ARBA) kept as non-core; structural molecule activity and cytoskeleton marked too general; morphogenesis of an epithelium, spermatogenesis and seven proteomics locations marked over-annotated. No NEW rows. Literature: about 80 PubMed records cached, full text read for the Krt9 knockout and knock-in papers. Reproducible analysis in KRT9-bioinformatics (variant catalogue from UniProt, ClinVar and gnomAD v4 checked against the canonical numbering, conservation, heptad register, mapping onto keratin heterodimer and lamin/vimentin crystal structures). Deep research: asta (off-target) and openscientist; falcon and perplexity were not configured. Two OpenScientist hypothesis jobs launched (type II partner, 14-3-3 sigma binding). Companion PTHR23239 family review and keratin filament assembly module in the same change. Validated with just validate human KRT9 and just validate-quotes. The lcv gene-review checklist was not filled because the tool could not be installed in this environment.
