  summary: 'ORGANELLES pilot: mitochondrial sub-compartment for PYCR2'
  details: |
    Applied the projects/ORGANELLES.md policy to the four GO:0005739 mitochondrion rows of PYCR2 (IEA GO_REF:0000120, HTP PMID:34800366, IDA PMID:23024808, IDA PMID:25865492). All four stay ACCEPT; review.reason (and supported_by quotes on the IEA and HTP rows) were filled in. The IDA papers resolved only mitochondrion vs cytosol (differential centrifugation; whole-organelle localization), MitoCoP resolves whole-organelle membership and its membrane-association table is not cached, and the IEA row derives from the UniProt SubCell keyword (SL-0173) built on those same IDA papers. No sub-compartment was added (policy rule 4): the only positive line is functional (NADH use, access to P5CS-derived P5C), it does not separate matrix from the inner-membrane matrix face, and it conflicts with the absence of a cleaved presequence (directly sequenced N-terminus is acetyl-Ser-2) and a reported cytoplasmic pool; a PubMed search found no submitochondrial assay for PYCR1 or PYCR2. core_functions location left at GO:0005739. Notes entry dated 2026-10-18 added.
