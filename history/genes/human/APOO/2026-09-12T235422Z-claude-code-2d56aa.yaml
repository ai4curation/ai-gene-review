  summary: 'Create review: APOO'
  details: |
    Full end-to-end review of human APOO/MIC26 (Q9BUR5), PANTHER PTHR14564. All 35 GOA rows reviewed: 22 ACCEPT, 4 MODIFY, 9 REMOVE, plus 1 NEW (GO:1900208 regulation of cardiolipin metabolic process, IMP on PMID:32788226 human single-knockout lipidomics). The central finding is that the gene's secreted-apolipoprotein identity is withdrawn: the eight rows asserting extracellular region, Golgi membrane and ER membrane all trace to a 55 kDa immunoreactive species that PMID:37279200 showed is not MIC26 (persists through CRISPR knockout in four human cell lines, not produced by tagged MIC26, no MIC26 peptides by mass spectrometry), and all eight are REMOVE. A ninth REMOVE drops GO:0001401 SAM complex, an HDA projected from one complexome profile onto all 12 co-migrating MIB proteins and applied to an inner-membrane protein, where GO:0140275 MIB complex from the same reference is the correct term. GO:0007007 is MODIFYed to its GO:0042407 child; three bare protein-binding IPIs are MODIFYed to GO:0005198 with partners resolved to MIC60, MIC10 and MIC27. Both IBAs are ACCEPT with root_cause NO_FAILURE_CORE on PTHR14564 node PTN001803267, the family's only PAINT node, with the target's self-referential seed recorded as expected experimental grounding rather than circularity. Eleven propagation_review blocks carry source_entities generated by script from the seeded WITH/FROM lists. Cardiolipin binding is deliberately not annotated: that activity belongs to the paralogue APOOL, and the only MIC26 claim is a molecular-dynamics simulation. A new reproducible bioinformatics analysis scores the predicted SIGNAL 1-25 against mitochondrial-presequence and secretory-signal-peptide panels and finds it matches presequences on four of five metrics. Validation: just validate clean (one deep-research advisory warning), checkquotes.py 117/117 quotes verbatim, a GOA-to-YAML reconciliation script matching 35 rows to 35 with no drift in source_entities, verify-panther-paint clean, no duplicate YAML keys and no terms.csv deletions or duplicates.
