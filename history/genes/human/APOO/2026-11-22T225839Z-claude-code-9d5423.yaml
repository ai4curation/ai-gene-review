  summary: Narrow the MIC26 membrane-topology knowledge gap with an OpenScientist
    run
  details: |
    Ran OpenScientist (3 iterations, local bioinformatics withheld) on the CC_DARK gap of one vs two MIC26 transmembrane helices. The run favours a two-helix hairpin (TM1 ~108-128, TM2 ~136-153, matrix-facing basic turn, termini in the IMS). Its evidence: alignment to MIC27 TM2, conservation and hydrophobicity across 45 distant orthologs, AlphaFold hairpin geometry, and a hydropathy-threshold explanation of the UniProt 1-vs-2 split. Gap OPEN -> NARROWING. External topology predictors were unreachable and no experimental topology exists, so no annotation was changed.
