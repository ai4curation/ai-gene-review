  summary: 'Create review: SRC'
  details: |
    Created a DRAFT review of human SRC (P12931) covering all 550 GOA rows plus one NEW (protein autophosphorylation). Tyrosine kinase activity, plasma membrane, focal adhesion and integrin signalling rows were accepted as core; 186 generic protein binding rows were triaged by binding mode, with 62 modified to phosphotyrosine residue binding (SH2), proline-rich region binding (SH3), PDZ domain binding or receptor tyrosine kinase binding where the cited text defines the mode and 124 removed. Indirect screen and organism-level process rows were marked over-annotated, signaling receptor activator activity (ISS) was removed, and SH2 domain binding (PMID:8070403) was left undecided. Added premetazoan context from choanoflagellate Src/Csk studies (PMID:16873552, PMID:18390552, PMID:28939764), kept consistent with the human CSK review on the disputed ancestry of Csk inhibition. Automated deep research was unavailable; notes were compiled manually.
