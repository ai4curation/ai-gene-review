  summary: 'Create review: ARL5A'
  details: |
    De-novo review of human ARL5A as the experimentally characterised reference for XENTR/F6WPT1 (same PANTHER subfamily PTHR11711:SF147, ARL5-clade PAINT node PTN000195484), done independently of ProtNLM2 predictions. Deep research failed (falcon auth error; perplexity-lite quota), so the review was built from cached primary papers (PMID:25795912, 31575603, 39580461, 30478271, 22245584, 15896705, 12414990) and the PTHR11711 family review. All 10 GOA rows reviewed: GTP binding (IBA/IEA), GTPase activity (IEA, hydrolysis inferred not measured), trans-Golgi network (IBA) and protein localization to Golgi membrane (IBA/IEA/IGI) accepted; cytoplasm and intracellular protein transport kept as non-core; vesicle-mediated transport modified to GO:0042147 retrograde transport, endosome to Golgi. Lin et al. 2002 nuclear/HP1alpha claims not adopted (mutant numbering does not match ARL5A). PI4P synthesis via ARMH3/PI4KB not annotated (ARL5A performs no kinase step).
