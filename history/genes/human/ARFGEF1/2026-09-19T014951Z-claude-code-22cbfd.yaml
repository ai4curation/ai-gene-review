  details: |
    De-novo review of ARFGEF1 (BIG1, Q9Y6D6). All 63 GOA rows reviewed and
    reconciled 1:1 against the TSV; 4 NEW rows added (67 entries total).
    Actions: ACCEPT 28, KEEP_AS_NON_CORE 10, REMOVE 15, MODIFY 7,
    MARK_AS_OVER_ANNOTATED 2, UNDECIDED 1, NEW 4.

    Ontology finding: GO:0005086 ARF guanyl-nucleotide exchange factor activity
    is merged into GO:0005085, which lists 14 merged ids among its secondaryIds
    and has no substrate-specific is_a children. GO:0005085 is therefore already
    maximal for this gene; ARF1/ARF3 specificity is recorded as RO:0002233
    has_input extensions and in core_functions.substrates, and the loss is filed
    as an ONTOLOGY knowledge gap. Corroborated from the annotation side: all 18
    protein donors of the GO:0005085 IBA hold the generic term and none holds a
    descendant.

    Curation corrections: GO:0030532 small nuclear ribonucleoprotein complex
    MODIFY to GO:0005732 (the cited paper, PMID:18292223, is about U3 small
    NUCLEOLAR RNA; the two terms are sibling is_a children of GO:0030529);
    GO:0090303 MODIFY to GO:0030335 (tissue-level term for a scratch-wound
    migration assay); GO:0032012 MODIFY to GO:0032014 (a Sec7 domain activates);
    both GO:0006887 exocytosis rows MARK_AS_OVER_ANNOTATED.

    Reported but not acted on: a paralog shadow set on MYO9A from PMID:15644318,
    where MYO9A carries an exact copy of MYO9B's partner set (ARFGEF1, RHOA) but
    none of MYO9B's functional rows. Full text unavailable (JBC HTTP 403), so the
    affected row is UNDECIDED and the four annotations across three genes are
    named in suggested_questions.

    Diagnosis: coverage, not over-annotation. Of the 26 functional papers the
    affinage provider returned, only 6 have produced any GO annotation on
    ARFGEF1 and 17 have produced none anywhere in GOA, including PMID:10393931,
    which measured the exchange reaction and the brefeldin A inhibition constant
    on the human protein.

    Eight analysis scripts committed under ARFGEF1-bioinformatics/; RESULTS.md is
    generated and self-checking (make_results.py --check). Two carry --self-test.
    just validate human ARFGEF1 is Valid with 2 deliberate warnings.
