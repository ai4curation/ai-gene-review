  details: |
    De-novo review triggered by literature-scan issue 7137 (PMID:43019314, TRIB2-KO melanoma cells are less glycolytic). Deep research providers failed (falcon 403, perplexity quota), so the literature was searched manually via PubMed and recorded in TRIB2-notes.md. The trigger paper shows an indirect cell-line metabolic phenotype only; no NEW annotation was added from it. Removed the ISS NOT nucleotide binding row (contradicted by PMID:25583260 ATP binding) and two bare protein-binding rows; core function is the COP1 ubiquitin-ligase adaptor role.
