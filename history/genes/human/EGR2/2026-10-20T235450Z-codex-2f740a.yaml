  summary: Review EGR2 function and source-specific annotations
  details: |
    Reviewed all 76 source annotations while preserving their source identities and the five historical contexts absent from current GOA. Retained 59 annotations, kept 14 contextual assertions as non-core, refined HCFC1 binding to transcription coactivator binding, and removed two propagated protein-export assertions whose original experiment relocates EGR2 as cargo. Synthesized nuclear transcription activation and conserved NAB-directed SUMO E3 activity, explicitly distinguishing mouse reconstitution from human evidence and preserving both natural products. Corrected two inherited finding statements to the actually accessible evidence. Retained 39 inherited quotation occurrences after three documented retirements, with no new publication quotations. Added a source guide, reproducible database analysis and ten normally fetched publication caches; refreshed the bundled GOA with byte-exact normal fetch output and retained the previous snapshot in portable evidence. Five historical contexts absent from that current snapshot retain their scientific decisions and source fields with explicit retired lifecycle flags; existing UniProt, publication caches and provider artifacts remain unchanged.
