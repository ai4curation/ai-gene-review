  summary: 'Review human AIG1: superseded PAINT hydrolase term and an unsupported
    plasma-membrane call'
  details: |
    First review of human AIG1 (Q9NVV5), the FAHFA hydrolase that with its only
    paralogue ADTRP forms PANTHER family PTHR10989. 10 GOA rows reviewed (matching
    the TSV exactly - no stub collapse) plus 2 NEW proposals: 6 ACCEPT, 2 MODIFY,
    2 MARK_AS_OVER_ANNOTATED, 2 NEW.

    Two findings, both upstream-pipeline defects rather than curator errors.

    1. The GO:0016787 hydrolase activity IBA is a STALE PROJECTION. PANTHER node
       PTN001659973 carried that term dated 20260528 but replaced it with
       GO:0120573 FAHFA hydrolase activity on 20260603; the live IBD.gaf gives the
       node only GO:0120573 and GO:0042758, and PANTHER's leaf GAF already projects
       GO:0120573 by IBA onto both AIG1 and ADTRP. QuickGO returns zero IBA
       annotations to GO:0120573 anywhere in GOA, so GOA has not ingested the
       release. MODIFY to GO:0120573, root_cause SOURCE_STALE_OR_MISSING. This
       supersedes the KEEP_AS_NON_CORE verdict on the byte-identical row in the
       merged ADTRP review (PR #2338), which was correct on the data available in
       July 2026. Method note: a GOA IBA row's date is the projection date, not
       evidence of what the node currently holds, and deriving the node-to-term map
       from GOA's own WITH/FROM column cannot detect this because both sources are
       downstream of the same release.

    2. Both GO:0005886 plasma membrane rows are unsupported on this gene. The cited
       paper PMID:27018888 contains no localisation experiment (verified scan: zero
       occurrences of 'plasma membrane', 'cell surface', 'immunofluoresc',
       'confocal', 'subcellular', 'localization', against positive controls of
       'membrane fraction' 3, 'membrane lysates' 9, 'transmembrane' 29 - reproducing
       the merged ADTRP review's counts exactly). The paralogues legitimately
       diverge here: ADTRP's plasma-membrane call stands independently on
       PMID:21868574, AIG1 has no equivalent paper, and the only study that examined
       AIG1's localisation (PMID:27040980) places it in the ER membrane by protease
       protection. MARK_AS_OVER_ANNOTATED rather than REMOVE; no ER annotation added
       because that paper has no cached full text and is unreplicated. GO:0016020
       membrane accepted as the compartment the evidence supports.

    Also: GO:0005515 MODIFY to GO:0031625 ubiquitin protein ligase binding (partner
    Q96PM5 is RCHY1/Pirh2, EC 2.3.2.27; IntAct expansion shows four distinct assay
    types rather than sub-methods of one screen). GO:0042758 ACCEPT after checking
    that ChEBI classifies the substrate 9-PAHSA(1-) as a long-chain fatty acid
    anion, so the suspected direction inversion is not real. Two NEW rows, both ISS
    because every AIG1-specific experiment in PMID:38816388 and PMID:40303337 is
    murine.

    Non-confirmations worth recording: the activity HAS reached GO at full
    specificity, the androgen-induction observation has produced no GO annotation,
    and the catalytic residues Thr43/His134 are present with experimental MUTAGEN
    evidence, so the pseudoenzyme over-annotation pattern is absent.

    Tooling defect reported in the PR: the pre-edit validation hook resolves genes/
    and publications/ against the main checkout rather than the agent worktree, so
    it reports every file: reference and every newly-fetched PMID quote as missing
    for a gene folder not yet on main. All eight errors it raised were that
    artifact; the authoritative validator returns Valid.
