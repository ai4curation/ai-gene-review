- type: CREATE
  outcome: changed
  summary: 'Review human ARFGEF3 (BIG3): both GEF-activity rows removed on a controlled
    catalytic-residue analysis; two SubCell-derived CC rows moved to the secretory-granule
    branch; six functions added that GOA lacked'
  details: |
    De-novo review. 14 entries = 8 GOA rows + 6 NEW proposals; the GOA TSV has 8
    data rows and the fetch-gene stub seeded 8, so no rows were collapsed on this
    gene. Reconciliation and supporting_entities-vs-GOA equality were asserted by
    script, not by eye.

    Principal finding. Both GO:0005085 rows (IBA from PANTHER:PTN008950430, and IEA
    from InterPro:IPR000904) are REMOVEd. ARFGEF3 carries N692 where all 17
    catalytically-verified WITH/FROM donors with an annotated SEC7 domain carry the
    Sec7 glutamic finger, and it matches the Sec7 catalytic motif zero times in its
    domain; mouse Arfgef3 carries S688, so the loss is clade-level rather than a
    human annotation artefact. The analysis (ARFGEF3-bioinformatics/) builds its
    panel from the row's own WITH/FROM field, derives the scored column from the
    known-active donors instead of hardcoding it, cross-checks it against an
    alignment-free motif, and carries controls in both directions: a
    verified-active positive control and a Glu->Ala dead comparator that must score
    negative, the latter appearing in the published table and not only in the
    self-test. It reproduces PMID:24997568 as a precondition. Only the negative
    direction is claimed: losing the catalytic residue argues against the activity,
    whereas retaining it would not have argued for it.

    GO:0032012 is MARK_AS_OVER_ANNOTATED rather than REMOVE, deliberately. It is
    unsupported rather than contradicted - a dead Sec7 domain could still bind ARF
    and act as a decoy, which is the model the protein's own characterisers propose
    as an explicitly untested hypothesis.

    Propagation classification is PROPAGATION_BAD + PSEUDO_OR_SUBACTIVITY_LOSS, with
    a machine-checkable residue_claims block. SOURCE_WEAK_OR_INFERRED would have been
    contradicted by the analysis: 18/18 protein donors carry their own experimental
    evidence for the term and 15/18 their own IDA. The node is soundly placed; the
    target is the exception.

    GO:0016192 is ACCEPTed as core with no specificity upgrade, because its 18 donors
    hold thirteen different descendant processes between them, making the broad term
    the genuine LCA rather than lazy curation.

    Second, systematic finding. GO_REF:0000044 sends SL-0244 "Secretory vesicle" to
    GO:0030133 transport vesicle and SL-0245 to GO:0030658, but GO:0030141 and
    GO:0030133 are disjoint siblings under GO:0031410 (verified against QuickGO's
    is_a/part_of closure). GO defines GO:0030133 as the constitutive pathway while
    the underlying data are regulated insulin and glucagon granules, and UniProt's
    own SL-0244 definition is regulated-pathway language. Both rows MODIFYed to the
    secretory-granule branch. The rule is applied to 130685 and 90419 UniProtKB
    entries respectively, which is the scale of the mapping, not a claim that all
    those entries are mis-annotated.

    Six NEW terms proposed, none of which GOA records: GO:0140311, GO:0042308,
    GO:0008157, GO:0004865, GO:0051018 (annotated at the parent rather than
    GO:0034237, because the PKA interaction was measured but the RII-subunit
    specificity was only predicted), and GO:1904410 as ISS on the mouse accession
    because every granule experiment was performed in mouse.

    Provider assessment. The affinage record passed its trust gates and still cited
    two papers about a different gene (PMID:14657013, PMID:15707593 - "BIG-3 =
    BMP-2-induced gene 3 kb", a 34 kDa WD-40 protein, PMID:11551928), recorded as
    MISCITED with relevance NONE. An independent PubMed sweep found four papers the
    provider missed, including PMID:27696409, which supplies a fourth compartment
    and an entire tissue context.

    Reciprocal PAINT finding, derived by a committed script rather than asserted:
    reciprocal_donor_check.py selects suspect donors by measurement (a protein donor
    of the term lacking the term's own InterPro signature) and finds exactly one,
    yeast MON2. MON2 RECEIVES GO:0005085 by IBA from the same node PTN008950430
    with a WITH/FROM set identical to ARFGEF3's row (19 vs 19), holds no IDA, and
    its entire non-IBA support traces to one reference, PMID:12052896, which claims
    only a potential rather than a measured exchange activity. So one node donates
    the activity to two members lacking a functional Sec7 catalytic site.

    Left open: PMID:24997568 asserts a prior GST-GAT pull-down demonstration whose
    cross-reference resolves to PMID:24711543, but no such assay is locatable in
    that paper's accessible text. The review rests on the residue analysis and the
    authors' repeated sequence-level statements, not on that pull-down.

    One validation warning left standing rather than silenced: satisfying "no
    annotations reference available deep research files" would require quoting a
    provider sentence as supporting evidence.
