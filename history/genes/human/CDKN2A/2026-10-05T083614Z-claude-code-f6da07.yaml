    Created the full AI gene review for human CDKN2A (UniProt P42771, p16INK4a). Provider deep research failed (Falcon HTTP 402 Payment Required; Perplexity not configured), so a manual literature synthesis from UniProt, cached publications and PubMed lookups was written to CDKN2A-notes.md in its place. Reviewed all 79 GOA annotations: 29 ACCEPT, 9 MODIFY, 35 REMOVE, 4 KEEP_AS_NON_CORE, 1 MARK_AS_OVER_ANNOTATED, 1 UNDECIDED. Generic protein binding was removed or modified to GO:0004861. ARF-derived annotations on the p16 accession (spinophilin IPI PMID:11278317; smooth-muscle and macrophage apoptosis ISS/IEA rows from the p19ARF knockout study PMID:20381282, projected via mouse P51480) were removed and flagged for transfer to Q8N726. Core functions: GO:0004861 CDK inhibitor activity, with negative regulation of CDK activity, negative regulation of G1/S transition and cellular, replicative and oncogene-induced senescence. Added PMIDs 9529248, 9529249, 15520862 and 22048312 via fetch-gene-pmids. just validate human CDKN2A passes.
