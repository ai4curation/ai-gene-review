  summary: 'Create review: MRM2'
  details: |
    De-novo review of human MRM2 (Q9UI43), the experimentally characterised PTHR10920:SF18 member and IBD seed for PTN000100455/PTN000100456, written as the reference for the DROME/Mrm2 ortholog and independent of ProtNLM2 predictions. Falcon deep research failed (Edison authentication) and the perplexity-lite fallback timed out, so the review uses cached primary literature, UniProt and the PTHR10920 PAINT table. 27 GOA rows reviewed: experimental activity (GO:0008650), rRNA 2'-O-methylation (Um1369), mtLSU binding and mitochondrial LSU assembly accepted; the 2002 nucleolus IDA removed as contradicted (N-terminal GFP masks the transit peptide); general terms (mitochondrion, rRNA processing, rRNA methylation, methyltransferase activity, ribosomal LSU assembly) modified to the specific terms the gene already carries. Two core functions separate the catalytic activity from the catalysis-independent assembly-factor role shown by K59A/D154A rescue (PMID:35177605). No NEW annotations.
