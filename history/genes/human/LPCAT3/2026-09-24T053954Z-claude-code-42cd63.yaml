  summary: Four citations re-pointed to the paper that actually supports them
  details: |
    Part of a single sweep repairing fabricated supporting_text across the gene reviews written in PR #2956. Those reviews set full_text_unavailable: true on supported_by entries whose cited publication is cached in full; that flag suppresses the repo's verbatim-substring validator, so every quote it covered entered the repo unverified. 76 of the 79 flagged entries quoted text that is not in the cited paper.

    Each entry was either re-grounded on a verified verbatim quote from the same paper, or the citation was deleted and its claim moved into review.reason as an explicit inference. No curation decision was changed: action, term, evidence_type, original_reference_id and proposed_replacement_terms are untouched unless stated below.

    6 re-grounded, 4 deleted in the first pass; the four deletions were then resolved properly.

    GO:0045540 and GO:0036335 had cited DOI:10.1172/jci93616, which states twice that loss of LPCAT3 has no effect on the canonical SREBP-2 targets Hmgcr, Hmgcs and Sqs, i.e. it refutes the cholesterol term. Tracing the annotation rather than stopping there showed the annotation is sound and only the citation was wrong: human GO:0045540 is IEA/ISS from mouse Lpcat3, whose row is IMP from PMID:29395055 (Wang 2018, Cell Stem Cell), which shows Lpcat3 inhibition stimulates cholesterol biosynthesis and drives ISC proliferation.

    The two papers do not conflict: Rong is liver and the SREBP-1c lipogenic branch, Wang is intestine and the SREBP-2 cholesterol branch. Wang is Rong's own reference 31. Both terms now cite it, and it was added to references with a reference_review recording the trace.
