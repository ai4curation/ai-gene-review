  summary: 'Create review: ELP3'
  details: |
    Created the first complete review of human ELP3 (Q9H9T3), the radical SAM/GNAT catalytic subunit of Elongator, as part of the RADICAL_SAM project. All 41 GOA rows were reviewed and one NEW row (GO:1904047 S-adenosyl-L-methionine binding) added; the project treatment rule for generic radical SAM rows was applied (GO:0003824 to GO:0106261, GO:0051536 to GO:0051539). Historic histone acetyltransferase, Pol II transcription and cell-migration claims were kept as non-core or marked over-annotated in light of tRNA-bypass evidence; ELP1 protein-binding rows were removed as uninformative. Falcon deep research failed with an auth error, so an Asta retrieval-only file was generated; it returned no ELP3-relevant papers, and literature was gathered directly from PubMed and cached. Notes were written to ELP3-notes.md.
