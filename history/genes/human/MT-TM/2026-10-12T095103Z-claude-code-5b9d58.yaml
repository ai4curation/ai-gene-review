  summary: 'Round 3: record why GO:0070124 is not listed'
  details: |
    MT-TM is the single methionine tRNA of human mitochondria and serves initiation as well as elongation, so whether GO:0070124 mitochondrial translational initiation belongs in directly_involved_in was an open question. It does not: runoak ancestors -p i,p confirms GO:0070124 is a descendant of GO:0032543 mitochondrial translation, which the core function already carries, and adding a child of a term already held is redundancy rather than coverage. GO:0032543 is also the one term spanning both roles this tRNA has, where GO:0070124 alone would assert only the narrower one. The decision and its basis are now recorded in the core function description and in the new notes file rather than left implicit.
