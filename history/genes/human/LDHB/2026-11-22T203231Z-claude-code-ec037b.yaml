  summary: Apply the 2026-11-14 TOO_GENERAL/MODIFY ruling to the three general oxidoreductase
    parents
  details: |
    Revisited the general-term rows GO:0003824 (catalytic activity), GO:0016491 (oxidoreductase activity) and GO:0016616 (oxidoreductase, CH-OH donor, NAD or NADP acceptor), all InterPro2GO IEA rows under GO_REF:0000002, all previously MARK_AS_OVER_ANNOTATED with reasons arguing that the term was correct but too general.

    Under the maintainer ruling of 2026-11-14 the action has to match that reasoning, and MARK_AS_OVER_ANNOTATED does not: the claims are not over-reaches, merely uninformative. GO:0003824 and GO:0016491 are now TOO_GENERAL, which is the action for a term that is true but imprecise on its own once a more specific term is asserted elsewhere. Both are is_a ancestors of GO:0004459 L-lactate dehydrogenase (NAD+) activity, verified against the QuickGO ancestors endpoint, and GO:0004459 is ACCEPTed on five rows here, so this is the pattern action_consistency.yaml marks OK (TOO_GENERAL ANCESTOR_OF ACCEPT).

    GO:0016616 is deliberately NOT TOO_GENERAL. It names the donor group and the acceptor, i.e. the EC 1.1.1 chemistry, so it is informative on its own in the way the ruling protects for a respectably specific term, and it is exactly what an InterPro2GO LDH-family signature can support. It is ACCEPTed as core chemistry described one level above GO:0004459.

    MODIFY with GO:0004459 as replacement was considered and rejected. The ruling requires a MODIFY to rest on this row's own evidence reaching the deeper term, and an InterPro2GO mapping from a generic oxidoreductase signature stops at the general term. An earlier draft of this review proposed exactly that MODIFY; it would have been wrong.

    Added CC:FUNCTION and CC:CATALYTIC ACTIVITY support quotes (curated, ECO:0000269) and ran backfill-record-sections. The paralog LDHA carried the mirror-image inconsistency (MODIFY on all three) and was brought to the same treatment in the same change.
