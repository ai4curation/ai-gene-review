- type: EDIT
  outcome: changed
  summary: 'Correct two unchecked claims: the keratinocytes are human, and one affinage
    miss has a findable title'
  details: |
    Two corrections, both of the same class - a generalisation asserted rather than computed.

    1. The wound-repair keratinocytes are HUMAN, and an earlier revision said no human wound-healing experiment on ARHGEF19 existed. The cached record for PMID:20643356 was abstract-only, the abstract says 'keratinocytes' with no species, and the paper is framed around mouse genetics, so I inferred mouse. Re-fetched the full text from PMC2965174 with just fetch-pmid --force; it names the line: 'we utilized the shRNA lentivirus to target the RhoGEF19 transcript in the human keratinocyte cell line, HaCAT'. In those human cells RhoGEF19 knockdown leaves the scratch 20 percent closed where controls close it completely, activated RhoA falls, stress fibres are rudimentary and misdirected, and re-expressing RhoGEF19 in GRHL3-knockdown cells restores closure from 10 to 73 percent. Five new verbatim findings added to the reference; the GO:0042060 IBA row, the GO:0032956 IGI row, the core_function description and the CURATION knowledge gap all updated. This sharpens the coverage finding instead of softening it: a human knockdown-with-rescue for GO:0042060 exists in the very paper GOA cites for the mouse orthologue, and the human gene still carries only an IBA. It also means the declined suggestion about wound healing in directly_involved_in is now better supported than when it was declined.

    2. The claim that every paper affinage missed had a title that does not name the gene was falsified by the table printed directly beneath it. PMID:34813497 is titled 'ARHGEF19 promotes the growth of breast cancer in vitro and in vivo by the MAPK pathway' - the symbol is the first word - and COVERAGE_raw.txt already showed the live PubMed sweep found it. Caught by the reviewer. go_coverage_by_reference.py now computes the answer rather than leaving it to prose: it reads each missed paper's cached title and matches it against the gene's synonyms. Result: 2 of the 4 ARHGEF19-specific misses have titles that do not name the gene, 1 names it only as the abbreviation GEF19, and 1 names it in full and has no retrieval explanation at all. That fourth row is the sharper finding - a record whose gates passed omitted a paper whose title begins with the gene symbol. Corrected in the review YAML, RESULTS.md, the notes and the PR description.

    Also taken from the same review: a heading that split the Biological process bulleted list in the notes is now its own section, and 'Two of the mutations are anchored by name' in RESULTS.md now reads 'Both groups of mutations', which is what it meant.

    Checks on the new head: just validate human ARHGEF19 valid with the one deliberate warning; verify_quotes.py 95/95 verbatim including the 19 file: and Reactome: quotes CI does not check; selftest_guards.py 17/17.
