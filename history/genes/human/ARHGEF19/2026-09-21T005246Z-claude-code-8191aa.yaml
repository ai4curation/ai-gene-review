  summary: 'Fix a self-contradiction: PMID:18256687 is cited by GO, once'
  details: |
    Round-three review, all four items taken.

    Required change. The GO:0060071 NAS row said the primary paper that established the planar-cell-polarity role 'is cited nowhere in GO'. False, and the same document says so twice: PMID:18256687 is the original_reference_id of the GO:0005515 IPI with UniProtKB:P61586, reviewed about 110 lines earlier in the same file and present as row 5 of ARHGEF19-goa.tsv; COVERAGE_raw.txt scores it at 4 annotations with 1 on ARHGEF19; and the CURATION knowledge gap calls it 'the single richest paper ... yielded exactly one ARHGEF19 annotation'. No term or action turned on it, but the ACCEPT was argued from the contrast, so the false half was load-bearing for the argument. Replaced with the narrower claim, which is true and sharper: PMID:18256687 is cited by GO exactly once for this gene, for GO:0005515 protein binding with RhoA, and not for GO:0060071 at all. The reason field moved with the summary.

    Three suggestions taken. (1) The same class, softer: 'No human localisation experiment on ARHGEF19 exists' in the cytosol row and 'has been published' in the CC knowledge gap were each contradicted by their own next clause, which then cites the SH-SY5Y observation. Both now say 'worth annotating', which is the wording the notes file already used and is what was meant. (2) RESULTS.md still described PMID:20643356 as 'a mouse genetics paper whose subject is GRHL3' - the framing the previous commit corrected everywhere else. Now records that its RhoGEF19 knockdown was in human HaCaT keratinocytes with a scratch-closure readout and a rescue, and that the human gene nonetheless carries GO:0042060 only as an IBA. (3) This record, which the previous head lacked.

    The reviewer also confirmed the previous head's change was correct: PMID:29164615 and PMID:32993957 do report human co-immunoprecipitations, so the earlier 'only human-cell interaction study' claim did overcount, and the surviving localisation claim is the one that was doing the work.

    Checks: just validate human ARHGEF19 valid with the one deliberate warning; verify_quotes.py 95/95 verbatim including the 19 file: and Reactome: quotes CI does not check; selftest_guards.py 17/17.
