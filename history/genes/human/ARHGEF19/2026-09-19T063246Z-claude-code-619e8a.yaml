- type: CREATE
  outcome: changed
  summary: 'Review human ARHGEF19 (WGEF/Ephexin-2): a coverage gap, not an over-annotation
    gap'
  details: |
    Measured with go_coverage_by_reference.py (QuickGO by reference, all species; paper list assembled independently from the affinage record and a live PubMed sweep): 11 of 14 primary ARHGEF19 papers have produced no GO annotation of any gene in any species, 12 of 14 none on ARHGEF19 itself, and exactly 1 has produced an ARHGEF19 annotation beyond GO:0005515 protein binding. PMID:18256687 (EMBO J) yielded one annotation, protein binding with RhoA, from a paper that also contains a human RhoA activation assay, a Rac1/Cdc42 negative, Dvl2 and Daam1 co-IPs, an MCF-7 RNAi experiment and an autoinhibition mapping.

    No Rho-specific MF refinement was possible: GO:0005089 (Rho GEF), GO:0005088 (Ras GEF) and GO:0030676 (Rac GEF) are obsolete and merged into GO:0005085, and GO:0017048 (Rho GTPase binding) into GO:0031267. Verified across three independent services - OLS4 reports is_obsolete with term_replaced_by, the GO API returns no record, and cache/go/terms.csv has no row - while QuickGO silently resolves each merge and returns the replacement as live. Recorded as an ONTOLOGY knowledge gap with no term proposed.

    Actions: 3 MODIFY (GO:0005515 with RHOA to GO:0031267; GO:0005515 with PAK5 to GO:0019901; GO:0051056 to GO:0035025), 1 MARK_AS_OVER_ANNOTATED (the cytosol row whose Reactome source is a RAC1-producing reaction human WGEF cannot catalyse), 1 NEW (GO:0070374, three independent human tumour types), rest ACCEPT or KEEP_AS_NON_CORE. Both IBA donor sets resolved: MGI:1925912 is mouse Arhgef19 itself, a 1:1 orthologue.

    Bioinformatics committed under ARHGEF19-bioinformatics/: dh_competence_check.py computes the DH exchange surface live from PDB 1X86 and 1LB1, verifying author numbering against UniProt before mapping, and reports both directions - ARHGEF19 spans 24/25 RhoA-contact positions (matching the weakest verified-active comparator), but identity at that surface is 36% against LARG for both ARHGEF19 and Tiam1, a GEF for a different GTPase, so the analysis cannot assign a substrate. Isoform 2 clears the Pfam gathering threshold at 65.5 bits while spanning 5/25, which is why a domain hit is not read as evidence of activity. verify_quotes.py checks all 79 supporting_text quotes against their sources, including the 14 file: and Reactome: quotes CI never checks. selftest_guards.py mutation-tests 17 guards including two negative controls.

    Retrieval note: affinage gates were clear and all 11 of its citations resolve, but an independent sweep found three primary papers it missed, including PMID:18537266 (titled for the paralogue Tim) and PMID:21686262 (titled 'Grhl3 and GEF19 in the front rho').
