  summary: 'Address review: the target in its own WITH/FROM is not circular'
  details: |
    Required change, taken in full. The GO:0032956 IBA marked UniProtKB:Q8IW93 - the target itself - as CIRCULAR_OR_REDUNDANT. The reviewer's citation was checked against the repository's CLAUDE.md before acting and it holds verbatim at lines 297-303: 'The target appearing in its own WITH/FROM is correct and expected - not circular ... Never mark such a source CIRCULAR_OR_REDUNDANT or describe it as inflating support.' That section was truncated in the copy of CLAUDE.md supplied to this session, which is how the error survived my own reasoning from the enum definition. Changed to SUPPORTS_TRANSFER and rewrote the three pieces of prose that carried the redundancy framing (review.summary, review.reason, and the source comment). The verified observation is kept, with the correct interpretation: the seed set containing Q8IW93 marks that experimental grounding exists on the target, and the IBA adds what the IGI cannot - that actin-cytoskeleton regulation is ancestral to PTHR12845 rather than keratinocyte-specific.

    Reading that CLAUDE.md section properly surfaced a second, unflagged instance of the same class of error. The wound-healing IBA row called the single-seed ancestral call 'thin' and said 'inferred from biological ancestor is doing less work here than the phrase usually implies'. The adjacent rule is explicit that a short WITH/FROM donor list is not weak support and that donor count must not be used as a proxy for evidential strength. Rewritten: the single seed is recorded as a fact about the shape of the ancestral call and explicitly not as a weakness, and the caveat that remains is taxonomic - no human wound-healing experiment exists - not evidential.

    Three of four suggestions taken. (1) Guard count disagreed: the script printed 17 while RESULTS.md and the review's reference_review said 12, because the five quote-checker cases were added after the prose was written. The script's total was hardcoded as len(CASES)+5; it is now derived as len(CASES)+qc_ran so it cannot drift again, and both documents now say 17. (2) The GO:0005085 TAS row quoted the half of PMID:15485661 this review marks OVERTURNED; the quote is left whole rather than truncated at 'RhoA', since trimming would misrepresent the sentence, and the reason now points at the finding_review and states that only the RhoA clause is load-bearing. A second, non-overturned quote naming the DH-PH and SH3 architecture was added. (3) The NEW GO:0070374 row now states why IDA was chosen for the overexpression and co-IP arm and notes that the knockdown arms would support a parallel IMP a curator may prefer to split out.

    One suggestion declined, with reasons given on the PR: keeping GO:0042060 in core_functions[].directly_involved_in.

    Checks on the new head: just validate human ARHGEF19 valid with the one deliberate warning; just validate-families passed (1411 residue-site pass / 0 fail, 453 gene-residue-claim pass / 0 fail, this review carries no residue_claims); verify_quotes.py 85/85 verbatim including the 19 file: and Reactome: quotes CI does not check; selftest_guards.py 17/17.
