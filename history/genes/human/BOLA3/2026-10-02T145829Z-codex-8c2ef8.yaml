  summary: Restore BOLA3 core evidence and qualify complex stability
  details: |
    Restore direct supporting evidence for the BOLA3 core and the protein-maturation,
    mitochondrial-matrix and Fe-S-assembly annotations. Primary support for the GLRX5
    heterocomplex now cites the later human wild-type comparisons in PMID:34063696.
    Record PMID:27532772 NMR interaction alongside its kinetically unstable SEC behavior,
    weak GSH-dependent CD response and lack of cluster stabilization. Preserve the
    separate disputed isolated BOLA3-NFU1 binding result and later attributed conflict.

    Replace cache-access narration in five reference findings with the actual biological
    results; access limits remain in reference-review notes and gene notes. Restore
    succinate-dehydrogenase and respiratory-complex I/II context with yeast and human
    patient distinctions. Add a curator question about the narrower [4Fe-4S] assembly
    role without proposing a redundant new process annotation.

    Retain iron/redox-homeostasis uncertainty: a particular negative yeast regulon endpoint
    does not refute every human role, while Fe-S binding or BOLA1 redox phenotypes alone
    do not establish one. The HuRI generic-binding row changes to non-core retention on
    independently corroborated GLRX5 binding with curator deference; the original HuRI
    table and other six partner edges remain unverified. Notes explicitly record the
    scoped task instruction and project pointer without changing repository policy.

    Preserve all 15 machine-sourced objects, both existing authored proposals, all 11
    reference identities and the core GO terms. Final actions are eight ACCEPT, four
    KEEP_AS_NON_CORE, three UNDECIDED and two NEW. Eight excerpts are exact source substrings
    within 25 words per source. Raw gene files, seven publication caches, the provider
    report and earlier history are unchanged.

    Normal focused validation passed with five advisories: four generic-binding retention
    warnings accepted under the scoped task instruction and one deep-research-use advisory.
    Primary source evidence is used without manufacturing support from the provider report.
    The separate reference command reports zero checks and is not treated as an independent
    quotation audit.
