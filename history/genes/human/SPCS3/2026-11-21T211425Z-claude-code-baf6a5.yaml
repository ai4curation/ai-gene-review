  summary: 'IBA REMOVE re-review: GO:0045047 changed from REMOVE to MODIFY (GO:0016485)'
  details: |
    IBA REMOVE re-review (projects/IBA_REVIEW/rereview-2026-11-21, batch H01). GO:0045047 protein targeting to ER IBA changed from REMOVE to MODIFY with replacement GO:0016485 protein processing. The earlier REMOVE gave as its reason that the correct term already exists on another row, which is redundancy and not a ground for removal. The tree shows a sound inheritance: the IBD is on the family root, seeded by the yeast ortholog whose experimental annotation rests on signal peptidase phenotypes, and the human gene is in the same clade with no duplication or loss. Only the term is off (targeting versus signal peptide cleavage), which is what MODIFY records; this matches the yeast SEC11 review.
