  summary: 'Create review: HID1'
  details: |
    De-novo review of human HID1 as the experimentally characterised SF12 relative of Drosophila CG8841, independent of ProtNLM2 predictions. Falcon deep research and the perplexity-lite fallback timed out, so the review used primary literature cached from a PubMed search. Ortholog grounding script (HID1-bioinformatics/hid1_orthologs.py) shows human, mouse, rat, fly and worm HID1 in PTHR21575:SF12 and the fission yeast Golgi-organization seed SPAC17A5.16 in SF13. Actions: 12 bare protein-binding rows removed; cytoplasm, Golgi apparatus and membrane modified to cytosol and specific Golgi/TGN membrane terms; ORFeome-screen microtubule location marked over-annotated; Golgi organization IBA and exosome HDA kept as non-core; Golgi/TGN localization, dense core granule biogenesis and secretory granule maturation accepted. Review records that functional evidence comes from rat cell lines and mouse beta cells, with the human IMP resting on a patient variant modelled in rat HID1.
