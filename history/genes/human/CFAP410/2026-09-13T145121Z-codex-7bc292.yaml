  summary: Audit CFAP410 localization evidence and source attribution
  details: |
    Inspected the complete Bai 2011 localization experiment, Figure 8, supplementary-file inventory and relevant supplemental Word tables. Traced the plasma-membrane annotation through live QuickGO and UniSave history. Marked PMID21834987 miscited specifically for CFAP410 localization and, after complete experimental/source inspection, removed the unsupported plasma-membrane IDA without asserting biological absence; cytoplasmic localization remains accepted from independent evidence. Added human CFAP410-EGFP experiments in mouse photoreceptors from PMID26974433 as a context-specific counterpoint to historical mitochondrial localization. Documented HPA antibody validation limitations and Suga full-text access limits. Reconciled the completed targeted OpenScientist audit against primary sources; adopted evidence-specific REMOVE for the unsupported PM IDA while rejecting its overstrong biological CONTRADICTED verdict. Documented unverified outer-segment remapping, provider-specific Fang access failure, incomplete HPA reliability summary and under-reading of the functional 2023 complex study. Added the provider report as a disputed secondary reference supporting only independently checked findings.
    Refined the localization experiment to distinguish native peripheral plasma-membrane association from adjacent ciliary/basal-body signal using functional endogenous tags, knockout controls, orthogonal fractionation and compartment-purity controls in retinal, neuronal and B-cell contexts.
    Final verification used just validate human CFAP410 and just validate-history for this record. Provider-generated report and artifacts were preserved unchanged.
