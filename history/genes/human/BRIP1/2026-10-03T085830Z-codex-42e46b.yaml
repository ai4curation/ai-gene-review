  summary: Review BRIP1 source evidence and repair mechanisms
  details: |
    Completed source-specific review of all 92 machine-derived annotations (99 raw GOA rows), preserving every source field, all 68 reference identifiers/titles and both structured products. Final actions are 65 ACCEPT, 16 KEEP_AS_NON_CORE, 10 UNDECIDED and one REMOVE; status is DRAFT because documented warnings remain. Reviewed three helicase-centered core functions and preserved explicit gaps rather than adding a new molecular function.

    Corrected SPRTN's substrate to the protein adduct, removed the unqualified monoallelic breast-susceptibility assertion, and replaced the false XPD inference with the actual dog-1 NER donor and unresolved phylogenetic/source limits. Supported generic binding is retained as non-core under project policy; six unresolved interaction-source assertions remain undecided. The transcription-factor annotation removal uses positively identified BTB/bZIP assay constructs and an inspected term definition, not a title-only name-confusion inference; full-paper access limits are explicit. Nuclear localization is independently supported by PMID:17596542, while the original PMID:14504288 provenance is preserved and its citation problem recorded.

    Omitted two earlier author-proposed NEW rows with explicit reasoning: ICL repair is a descendant of existing DNA repair, while the available human iron-content assay does not establish intact [4Fe-4S] composition. Preserved 36 focused quote entries (52 in the prior review), append-only historical notes, the original publication/GOA/UniProt/provider caches, and selected primary evidence access limits. Independent scientific review and current source/ownership checks preceded application. The rendered gene page was regenerated.

    Validation: standard just validate human BRIP1 passed schema, ontology, reference/GOA and best-practice checks, plus its markdown-reference step, with 14 warnings and no errors. Eleven warnings concern the project-authorized non-core generic-binding decisions; the remaining three concern source-specific cytoplasm action differences, an uncited secondary research provider, and ICL core-process coverage without a redundant NEW annotation. Normal candidate status evaluation and these warnings support DRAFT. Standard rendering passed. Ten unresolved annotations and the documented imaging, screen and phylogenetic evidence limits remain available for follow-up.
