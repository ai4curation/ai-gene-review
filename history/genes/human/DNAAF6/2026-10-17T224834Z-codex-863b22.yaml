  summary: Refine DNAAF6 partner-class evidence and mechanism limits
  details: |
    Retained independently supported partner-class binding refinements after replaying literal validated interaction records against official reference sequences. Refined the POLDIP2 interaction using controlled human primary evidence for the partner class without transferring its cellular process to DNAAF6. Corrected four non-core propagation labels, qualified the natural YAF2 isoform and unresolved ARID4B role, and distinguished chaperone association from proposed recruitment and folding mechanisms. All 40 source dictionaries, the official 214-residue product, core GO slots, existing source caches and prior notes are preserved. Added one genuinely fetched primary cache and a portable raw-input interaction audit covering 16 source groups, 49 selected records and 98 participant checks. New short primary anchors bring two source totals to 21 and 16 words; the v2 guide correction changes only the reported word count. No NEW annotation is introduced. Canonical normal/strict validation, status inspection, rendering and append-only history validation were performed.
