  summary: 'Integrate falcon deep research: LAT'
  details: |
    Integrated the falcon deep research report. Fixed a description error: LAT tyrosines Y132/Y171/Y191/Y226 use short-isoform (O43561-2, 233 aa) numbering; in the canonical 262-aa long isoform they are Y161/Y200/Y220/Y255. Added the vesicular LAT pool and its Rab6/syntaxin-16 retrograde and VAMP7/GMAP210 anterograde Golgi trafficking to the description, verified against primary papers PMID:29789604, PMID:23666293, PMID:29440364 and PMID:33572370 (newly cached and added to references). Added the report as a reference with reference_review and added supporting text to core function 1. Added suggested questions on a vesicle/TGN CC annotation and on the preprint-only DNA-PKcs S224/S241 phosphorylation, plus one experiment. No existing-annotation actions changed. The GO:0030159, GO:0035591 and GO:0140693 MF choices and the NEW Fc-epsilon/collagen rows stay consistent with LCP2.
