  summary: 'Create review: LAT'
  details: |
    Reviewed all 87 GOA annotations for human LAT (O43561) as part of the ADAPTIVE_IMMUNITY TCR trunk. Core MF set to signaling receptor complex adaptor activity (GO:0030159) in the TCR signalosome, with NEW molecular condensate scaffold activity (GO:0140693) and NEW Fc-epsilon receptor and collagen-activated signaling pathway terms. Bare protein binding IPI rows were replaced by the adaptor term (8) or removed (9); COP9 signalosome rows were corrected to TCR signalosome; phenotype-level terms (inflammatory response, kinase activity regulation) marked over-annotated. Deep research (falcon with perplexity-lite fallback) failed, so the review used cached GOA publications plus seven additional PMIDs fetched with just fetch-pmid. Validated with just validate human LAT (no errors, no warnings).
