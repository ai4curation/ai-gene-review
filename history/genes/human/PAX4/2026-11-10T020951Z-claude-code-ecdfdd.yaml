  details: |
    De novo review of human PAX4 (O43316) for the BGEEDB_EXPRESSION project, kept consistent with the mouse Pax4 review. All 30 GOA rows reviewed: 16 ACCEPT, 7 MODIFY (DNA-binding rows to GO:0000978, broad transcription-regulation rows to GO:0000122, chromosome to chromatin), 3 MARK_AS_OVER_ANNOTATED (retina development and sensory organ development IBA, animal organ morphogenesis TAS), 2 TOO_GENERAL (ARBA animal organ development and system development, entailed by accepted type B pancreatic cell differentiation), 2 REMOVE (brain and forebrain development IBA, over-propagated from Pax6-seeded PAINT nodes PTN008693041 and PTN002900580). No NEW rows. Human evidence added: complete-loss patients with transient neonatal diabetes and no extra-pancreatic features (PMID:40614820), hiPSC knockout and risk alleles (PMID:37777536), CUT&RUN occupancy and nuclear localization of tagged PAX4. Bgee expression used as corroboration only. MODY9 status recorded as contested (PMID:35108381, PMID:36208030). Notes file written; record sections backfilled; just validate human PAX4 passes with no errors or warnings.
