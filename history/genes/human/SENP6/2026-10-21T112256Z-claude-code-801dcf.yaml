  summary: 'Create review: SENP6 as experimental reference for S. pombe ulp2'
  details: |
    De-novo review of human SENP6 (Q9GZR1), independent of ProtNLM2 predictions, as the experimentally characterised PTHR46896 relative of S. pombe ulp2. Falcon deep research failed (403 auth; perplexity-lite fallback timed out), so the review rests on cached primary literature. All 17 GOA rows reviewed. Evolutionary grounding from PAINT: desumoylation, SUMO-specific endopeptidase, nucleus and cytoplasm sit at the SENP6/SENP7/fungal-Ulp2 node PTN002930416; regulation of kinetochore and spindle assembly sit only at the vertebrate SENP6 node PTN002930429 and are flagged as non-transferable to ulp2. Added NEW GO:0016929 deSUMOylase activity (IDA, PMID:18799455) as core MF; GO:0070139 (precursor cleavage within SUMO) kept as non-core given weak processing activity; cysteine-type peptidase, proteolysis and small-protein-removal rows modified toward GO:0016929/GO:0016926; UniPathway protein sumoylation and bare protein binding removed; cytoplasm IBA marked over-annotated (human SENP6 is nucleoplasmic).
