  summary: 'Create review: ROR2'
  details: |
    Created the full AI gene review for human ROR2 (Q01974), reviewing all 55 GOA annotations. Confirmed single-pass type I plasma membrane localization with the Ig-like, Frizzled-like cysteine-rich and kringle domains exposed at the cell surface, where the receptor homodimerizes; the Reactome clathrin-coated vesicle row was kept as a non-core trafficking compartment and the IBA axon row as non-core. Accepted transmembrane receptor tyrosine kinase activity, tyrosine kinase activity, ATP binding, Wnt-protein binding, coreceptor activity, receptor tyrosine kinase signalling and positive regulation of cell migration, noting the reported weak in vitro catalytic activity; generic protein kinase activity and generic signal transduction were modified to the specific supported terms. The 29 generic protein binding rows were removed under the project policy while TAK1 (MAP3K) binding was kept. Deep research providers were unavailable; evidence came from cached publications and UniProt and is recorded in ROR2-notes.md.
