  summary: 'Create review: BACH1'
  details: |
    Full AI review of human BACH1 (O14867), the heme-regulated BTB-bZIP repressor. All 86 GOA rows reviewed: 35 ACCEPT, 8 KEEP_AS_NON_CORE, 22 MODIFY, 21 REMOVE, no NEW. Core functions: Pol II-specific DNA-binding repressor activity with small Maf partners at MARE/ARE elements (HMOX1, ferritins, SLC40A1, SPIC), and heme sensing via C-terminal CP motifs (ligand-modulated TF activity) leading to loss of DNA binding, nuclear export and proteasomal degradation. Cached and cited primary heme papers verified in Europe PMC (Ogawa 2001 PMID:11387216; Zenke-Kawasaki 2007 PMID:17682061; Suzuki 2004 PMID:15175654; Sun 2002 PMID:12356737) plus Cao 2024 and Lignitto 2019. The CACAO DNA repair IMP (PMID:11301010) was removed with a source defect: it concerns the DEAH helicase BRIP1/FANCJ (Q9BX63), formerly named BACH1. Bare protein-binding rows from bZIP coiled-coil arrays were modified to protein heterodimerization activity; high-throughput AP-MS/Y2H rows removed per policy. Notes in BACH1-notes.md.
