    Ran OpenScientist (3 iterations) on the rBAT GH13 domain. On 6LI9 the catalytic carboxylates are retained (D314, E384, D449) but invariant region II Arg and subsite -1 His are lost (S312, P448) and glucose clashes with R174 (all checked locally); conservation concentrates at Ca2+, disulfide and partner interfaces; cystinuria variants in buried core. Structural role predicted, consistent with measured lack of alpha-glucosidase activity. Gap OPEN -> NARROWING.
