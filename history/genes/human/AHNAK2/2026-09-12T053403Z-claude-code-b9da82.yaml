  summary: 'First full GO review of human AHNAK2: a record assembled almost entirely
    from its paralogue AHNAK and from periaxin'
  details: |
    First full GO annotation review of human AHNAK2 (Q8IVF2), covering all 13 GOA
    rows plus 4 NEW proposals (13 + 4 = 17 entries, reconciled row-by-row against
    the GOA TSV including WITH/FROM).

    Headline: only the two HPA immunofluorescence rows cite an experiment reported
    for AHNAK2 in a publicly readable source. Five rows come from PMID:17185750,
    whose public abstract is entirely about the paralogue AHNAK; three are PAINT
    transfers whose donors are periaxin and AHNAK; three are electronic. Ten of the
    eleven AHNAK2-relevant papers read here produced no GO annotation on AHNAK2 at
    all, including PDB 4CN0, a 1.75 A structure of its only folded domain. The
    diagnosis is a coverage defect, not an over-annotation defect.

    Paralogue test, measured rather than asserted: PANTHER PTHR23348 holds AHNAK2,
    AHNAK and the periaxins in three different subfamilies (SF37/SF41/SF42). At the
    only structured domain any of them has, AHNAK2's PDZ is 28.4% identical to
    AHNAK's and 56.8-58.0% to the periaxins', against an ortholog control scale of
    89.7-97.9%. The 4838-residue AHNAK2-vs-AHNAK alignment is 71.9% repeat-on-repeat
    and the two proteins do not share a repeat unit, so the apparent similarity is
    largely a low-complexity artefact.

    Actions: 3 ACCEPT, 5 KEEP_AS_NON_CORE, 4 MARK_AS_OVER_ANNOTATED, 1 UNDECIDED,
    4 NEW. No REMOVE: every candidate was unsupported rather than refuted, and the
    T-tubule REMOVE hypothesis was downgraded after reading PMID:15007166.

    NEW proposals: GO:0042803 protein homodimerization activity (IDA, PDB 4CN0 -
    gives the gene its first informative molecular function); GO:0043034 costamere
    (ISS from mouse Ahnak2); GO:0009306 protein secretion (ISS, stress-induced FGF1
    export); GO:0017134 fibroblast growth factor binding (IPI, limits stated).

    Recorded as an ONTOLOGY knowledge gap rather than a proposed term: GO has no
    unconventional-secretion term and no FGF child of GO:0009306, but GO:0090269
    fibroblast growth factor production may already be intended to cover it.

    Cross-checked row-by-row against the concurrent AHNAK review (PR #2999): 10
    shared keys, 5 divergences, all well-founded on one checkable fact - human AHNAK
    holds GO:0005634 and GO:0043484 by ISS from its own mouse orthologue, and AHNAK2
    has no such transfer.

    Committed eleven reproducible scripts under AHNAK2-bioinformatics/, two of them
    gates (reconcile_goa.py, audit_claims.py with --self-test).
