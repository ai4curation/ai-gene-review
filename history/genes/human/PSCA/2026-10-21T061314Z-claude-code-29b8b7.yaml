  summary: 'Create review: PSCA'
  details: |
    Created the full AI gene review for human PSCA (O43653), reviewing all 14 GOA annotations. Confirmed GPI-anchored plasma-membrane/cell-surface localization from flow cytometry and UniProt, keeping the Reactome extracellular-region row, the exosome row and the inter-ontology synapse inference as non-core secondary locations. Accepted the lynx/Ly-6 nicotinic acetylcholine receptor regulator activity, CHRNA4 binding, acetylcholine receptor signalling, negative regulation of the ERK1/2 cascade and regulation of neurotransmitter receptor activity, which together form the single core function. Deep research providers were unavailable, so evidence was taken from cached publications, Reactome and UniProt and recorded in PSCA-notes.md.
