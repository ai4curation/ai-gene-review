  summary: De-novo review of OPRM1 (mu-opioid receptor)
  details: |
    Reviewed all 97 seeded GOA annotations (38 ACCEPT, 21 KEEP_AS_NON_CORE, 9 MODIFY, 7 MARK_AS_OVER_ANNOTATED, 22 REMOVE). Removed voltage-gated calcium channel activity and derived calcium-transport IEA (MOR is a GPCR, not a channel) and uninformative protein-binding rows. Added core functions for opioid/beta-endorphin/morphine receptor activity. Incorporated Deutsch et al. 2026 (PMID:42870023) on ligand-dependent Gi dynamics. Deep research (falcon/perplexity-lite) failed to authenticate; based on UniProt, cached publications, Reactome and the new paper.
