  details: |
    De-novo AI review of human OPRM1 (mu-opioid receptor, P35372), first gene of the GPCR project. Reviewed all 97 GOA annotations: 33 ACCEPT, 28 KEEP_AS_NON_CORE, 23 REMOVE (21 uninformative protein-binding IPI rows plus a VGCC activity ISS and its derived calcium-transport IEA that confuse receptor-inhibited effector channels with the receptor), 9 MODIFY (generic GPCR activity -> morphine/beta-endorphin receptor activity; generic/cyclic-nucleotide/ACh GPCR pathways -> GO:0031635 adenylate cyclase-inhibiting opioid receptor signaling pathway; membrane -> plasma membrane; nerve-impulse transmission -> presynaptic modulation), 3 UNDECIDED (ER/Golgi TAS from an abstract-only insect-cell overexpression paper; a human craving genetics IMP whose stress result is attributed to CRH-BP not OPRM1), 1 MARK_AS_OVER_ANNOTATED (lung-cancer growth via all three opioid classes). Core functions: morphine receptor activity, beta-endorphin receptor activity, and G protein-coupled opioid receptor activity with presynaptic modulation. Deep research unavailable (Falcon/Edison 503 auth failures, OpenAI 401, perplexity provider absent); literature synthesized manually from cached GOA publications plus fetched key papers (knockout PMID:8893006, beta-arrestin2 PMID:10617462, receptor structures, PZM21 PMID:27533032). just validate passed with warnings only.
