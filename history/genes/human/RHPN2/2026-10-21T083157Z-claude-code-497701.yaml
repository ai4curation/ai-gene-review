  summary: 'Create review: RHPN2'
  details: |
    De-novo review of human RHPN2 as experimental reference for fly Rhp (PAINT PTN001126281), independent of ProtNLM2 predictions. Deep research failed (falcon auth, perplexity quota); reviewed from cached literature (PMID:12221077, 12473120, 17054945, 15767687, 22445486, 23774217). Found that the two MGI IDA rows from PMID:25071083 (plasma membrane; negative regulation of stress fiber assembly) are keyed to RHPN2 but the paper transfected human RHPN1; claims accepted on independent RHPN2 evidence with CONFIRMED WRONG_GENE_PRODUCT source_defects (Q8IUC4 -> Q8TCX5), and the PAINT seed caveat noted. Removed 2 bare protein-binding rows, modified signal transduction to Rho protein signal transduction, added NEW small GTPase binding and phospholipid binding.
