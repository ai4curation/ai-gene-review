  summary: 'De-novo GO annotation review of human SLC10A6 (SOAT): all 152 seeded annotations
    adjudicated'
  details: |
    Completed the de-novo review of human SLC10A6 (SOAT, Q3KNW5). Actions: 144 REMOVE (all GO:0005515 protein binding rows from the HuRI binary interactome map, PMID:32296183, removed as uninformative per repository policy; one uniform rationale applied programmatically), 4 ACCEPT (GO:0005886 plasma membrane IBA and TAS; GO:0016020 membrane IEA; GO:0043251 sodium-dependent organic anion transport IEA, retained as the core process), 4 KEEP_AS_NON_CORE (both GO:0008508 bile acid:sodium symporter activity rows and both GO:0015721 bile acid and bile salt transport rows). Central judgement: the family-level bile-acid terms are over-propagated onto this paralog as a statement of core function but are not false. Geyer et al. (PMID:17491011) show cholate, chenodeoxycholate and taurocholate are not SOAT substrates while taurolithocholate-3-sulfate is, and Grosser et al. (PMID:34079822) state SOAT transports sulfated steroids but not bile acids - yet the same paper shows taurolithocholate itself is a sodium-dependent SOAT substrate (Km 19.3 uM) and explicitly states that whether that activity is ancestral to NTCP/ASBT/SOAT or convergent cannot be decided. The IBA node placement at PANTHER:PTN000040761 (seeded by rat Ntcp RGD:3681 and Asbt RGD:3682) is therefore not falsified for SLC10A6, so REMOVE would overstate the evidence; the activity is retained as narrowed and non-core. Reactome R-HSA-433089 is kept on the same basis, noting its own summary states SOAT has no affinity for bile acids. Fetched and cached PMID:17491011, 23667501, 24717977, 28951227, 34079822, 37373074, 28743544, 31256060, 30186172. Verified every GO id against OLS4: GO:0043251 current (sole parent GO:0055085), GO:0008508 current but classified under GO:0015125 and GO:0015355 secondary active monocarboxylate transporter activity, GO:0008514 obsolete (replaced by GO:0022857). No GO molecular function exists for sodium-coupled steroid sulfate symport, so core_functions uses proposed_molecular_function with a new proposed_new_terms entry 'steroid sulfate:sodium symporter activity' under GO:0015370. No NEW annotation rows added. Deep research providers were unavailable in this container (Falcon 402, OpenAI 401, perplexity unregistered); the literature synthesis was written by hand into SLC10A6-notes.md with inline verbatim provenance. Validation (schema + terms + references + best practices) passes.
