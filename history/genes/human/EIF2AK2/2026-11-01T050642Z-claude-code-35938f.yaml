  summary: Create the human EIF2AK2 (PKR) gene review for the integrated stress response
    cohort
  details: |
    First review of human EIF2AK2 (P19525, PKR), the last of the four ISR eIF2alpha kinases still missing from the integrated stress response cohort (issue #3951).

    All 178 seeded GOA rows reviewed. Core functions: double-stranded RNA binding (GO:0003725) and eukaryotic translation initiation factor 2alpha kinase activity (GO:0004694) in the cytosol, plus serine/threonine kinase activity on non-eIF2alpha substrates (MAP2K6, PPP2R5A, ILF3/NFAR, NPM1, NCK1).

    Notable judgments:
    - Generic kinase rows (GO:0004672, GO:0016301) MODIFYed per row to the activity the cited paper assayed: GO:0004694 where the substrate is eIF2alpha, GO:0004674 otherwise. GO:0004674 itself is ACCEPTed rather than refined, because PKR has genuine non-eIF2alpha Ser/Thr substrates.
    - GO:0019888 protein phosphatase regulator activity (TAS, PMID:10866685) MODIFYed to GO:0004674: PKR phosphorylates the PP2A B56alpha subunit, so the molecular function is kinase activity and the PP2A effect is downstream.
    - GO:0034198 cellular response to amino acid starvation marked over-annotated. The cited paper (PMID:25329545) studies ER, hypothermic and prolonged-culture stress and identifies GCN2, not PKR, as the amino-acid/cold-shock sensor; the companion row is an unvetted ARBA rule.
    - GO:0016020 membrane (HDA, PMID:19946888) marked over-annotated: the source study states most of its identifications are not integral membrane proteins, and PKR has no TM segment.
    - GO:1900225 regulation of NLRP3 inflammasome complex assembly kept at the neutral term, with PMID:23401008 recorded: the requirement did not reproduce in two independent PKR-deficient mouse strains, so a directional term is not defensible.
    - NF-kB and IFN-beta rows kept non-core, citing PMID:22948139, which shows they follow from eIF2alpha-mediated loss of IkB-alpha rather than a separate adapter activity.
    - 58 bare GO:0005515 rows REMOVEd per the protein-binding policy; the EIF2S1 rows MODIFYed to GO:0031369 translation initiation factor binding and GO:0042802 to GO:0042803 protein homodimerization activity.
    - Three MODIFY IBA rows carry propagation_review with root_cause TERM_SCOPING_PROBLEM / GRANULARITY_MISMATCH; the node placements are sound, only the granularity is low.
    - Deep research providers were unavailable in this environment, so EIF2AK2-notes.md was hand-written from the cached UniProt record and publications, with provenance for every assertion.

    just validate human EIF2AK2 passes, including --strict and --ontology-checks; just validate-goa passes.
