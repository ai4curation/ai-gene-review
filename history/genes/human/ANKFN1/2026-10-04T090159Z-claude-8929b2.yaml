  - core_functions
  - description
  - references
  summary: 'Round 2 (#4072 review): replace NEW GO:1904326 (contradicted by quality-not-quantity result) with GO:1902608 BK channel regulation; spindle CC reasoning; affinage accounting'
  details: |
    Withdrew the NEW GO:1904326 row, because PMID:37821426 reports changes in the quality, not the quantity, of wakefulness. Proposed GO:1902608 positive regulation of large conductance calcium-activated potassium channel activity instead (ISS from PMID:39303704, supported by DMH and CeA excitability results) and made it the core function. The spindle IBA has its own CC reasoning. The affinage reference_review now accounts for PMID:40835437, PMID:36533556 and PMID:33140455. The description names BK/KCNMA1 and the quality-not-quantity phenotype.
