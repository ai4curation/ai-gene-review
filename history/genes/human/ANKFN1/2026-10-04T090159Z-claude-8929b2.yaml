  summary: 'Initial review of human ANKFN1 (mWAKE): clock-output brake on arousal;
    fly spindle-orientation IBAs kept non-core; NEW negative regulation of wakefulness'
  details: |
    Reviewed 3 GOA rows (IBA from fly Wake/Banderuola: spindle orientation, spindle, bipolar cell polarity) and kept them as non-core: plausibly ancestral, untested in vertebrates. NEW GO:1904326 negative regulation of circadian sleep/wake cycle, wakefulness (ISS from mouse PMID:37821426; comparator fly WAKE GO:0045938; mouse Ankfn1 is uncurated). MF_DARK gap.
- type: EDIT
  outcome: changed
