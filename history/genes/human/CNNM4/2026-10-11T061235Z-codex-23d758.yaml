  details: |
    Reviewed all 17 machine-sourced human CNNM4 assertions against original primary evidence, current official ontology and donor records. Preserved two alternative products and seven original reference identity pairs. Refined four sodium/magnesium transporter assertions to magnesium:sodium antiporter activity; retained two positive generic interactions as non-core. Added directly demonstrated human ion-channel regulator and ATP-binding molecular functions, with two nonredundant cores and no new biological process. Distinguished full-length human constructs, mouse physiology, short-product uncertainty and tentative structural mechanism. Preserved genuine source caches and recorded failed provider attempts without fabricating research output. Normal validation/status/rendering passed with two expected campaign binding advisories; the independent peer and source/publisher preservation gates are recorded separately. This session does not itself establish a merged campaign completion.
