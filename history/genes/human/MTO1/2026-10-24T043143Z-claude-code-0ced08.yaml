  summary: 'Create: MTO1 review'
  details: |
    De novo review of all 15 GOA annotations for human MTO1 (Q9Y2Z2), the MnmG-family subunit of the GTPBP3-MTO1 taurinomethyluridine synthase. 14 ACCEPT, 1 KEEP_AS_NON_CORE (HDA RNA binding from mRNA interactome capture). Complex-level terms kept consistent with the GTPBP3 review: contributes_to GO:0160236, part_of GO:7770010, involved_in GO:0070899. No NEW annotations; mitochondrial translation was deliberately not added because MTO1 modifies tRNAs that translation uses rather than performing a translation step. Deep research (claude-code) ran only 2 web searches and was used as leads only. Added references PMID:22608499, PMID:23929671, PMID:12011058. Validated with just validate human MTO1.
