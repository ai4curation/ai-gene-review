  summary: 'Create review: RSL1D1'
  details: |
    De-novo review of human RSL1D1 (O76021) as the experimentally characterised reference relative of DROME/CG13096; independent of ProtNLM2 predictions. Falcon deep research failed (auth) and the perplexity-lite fallback failed (quota), so the review is based on cached primary papers (PMID:18678645, 17158916, 22419112, 27811966, 34362424, 35940221, 36913375 and others). All 23 GOA rows were reviewed: RNA binding (HDA x2, IBA) and nucleolus (IBA, IDA x2, IEA) accepted; mRNA 5'- and 3'-UTR binding accepted on independent evidence (the cited CAFA paper PMID:16213212 could not be verified); regulation of cellular senescence MODIFY to negative regulation; regulation of protein localization MODIFY to positive regulation of protein localization to nucleolus (nucleostemin); regulation of apoptotic process kept as non-core with a PROBABLE WRONG_REFERENCE source defect (PMID:18678645 -> PMID:22419112); osteoblast differentiation (expression HDA) removed; membrane and cadherin binding HDA marked over-annotated; 7 bare protein-binding rows removed per policy. NEW: negative regulation of translation (PTEN 5'UTR) and mRNA stabilization (PPARG/FTH1 3'UTR). PANTHER placement recorded: RSL1D1 is PTHR23105:SF31 with yeast UTP30, while CG13096 is PTHR48162:SF1, so only general nucleolar RNA binding is flagged as transferable. The MDM2/p53 direction is contested and is not annotated.
