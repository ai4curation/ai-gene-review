  details: |
    Reviewed all 25 PENDING rows. Actions: 12 REMOVE (all GO:0005515 generic protein binding: 10 HuRI PMID:32296183, 1 BioPlex 3.0 PMID:33961781, 1 SLC interactome PMID:40355756; CLPTM1/O96005 reproduced by two methods but no functional term licensed), 13 ACCEPT (GO:0008508 x3, GO:0015721 x2, GO:0005886 x4, GO:0016324 x2, GO:0005902, GO:0016020), 0 MODIFY, plus 1 NEW (GO:0098719 sodium ion import across plasma membrane, IDA from PMID:9856990). Added propagation_review blocks with traced source_entities for all four IBA rows and the two GO_REF:0000107 Ensembl Compara rows and the GO_REF:0000120 row. Established from donor tracing that PAINT encodes the SLC10 apical/basolateral split at the node level: the apical term comes from the ASBT-specific sub-node PANTHER:PTN002570923 (donors mouse and rat Slc10a2 only), the mirror NTCP sub-node PANTHER:PTN002570905 carries basolateral on SLC10A1, and the shared ancestral node PANTHER:PTN000040759 carries only unqualified plasma membrane. Microvillus and apical IEA rows trace to mouse Slc10a2 (UniProtKB:P70172) IDA annotations. NEW term satisfies the participation test (the protein itself translocates 2 Na+ per bile acid, measured by voltage clamp) and the comparator check (SGLT1/P13866 GO:0098719 IDA, NaPi-IIa/Q06495 GO:0098719, NIS/Q92911 GO:0006814 and GO:0035725; absent across SLC10 only). Deep research unavailable in this container (Falcon 402, OpenAI 401, perplexity unregistered); literature synthesis hand-written in SLC10A2-notes.md with verbatim provenance. Cached four additional publications (PMID:9856990, PMID:15350125, PMID:19498215 plus PMID:12364586 which proved irrelevant). No GO-CAM model exists for Q12908.
