  summary: De-novo review of all 26 GOA annotations for SLCO2A1 (OATP2A1/PGT), the
    prostaglandin transporter
  details: |
    Reviewed every GOA row for SLCO2A1 (Q92959, OATP2A1/PGT). The prostaglandin transporter: Na+-independent secondary-active anion EXCHANGER (PG uptake coupled to efflux of intracellular lactate/monovalent anions, membrane-potential-dependent, bidirectional). Core MF GO:0015132 prostaglandin transmembrane transporter activity (QuickGO non-obsolete; is_a GO:0071714 icosanoid / GO:0170055 lipid transporter -> GO:0022857; NOT under GO:0015291, so the secondary-active mechanism row is a parallel ACCEPT, not an ancestor). GO:0015347/GO:0008514 obsolete, not used. directly_involved_in GO:0015732 prostaglandin transport + GO:0043252 Na-independent organic anion transport; locations GO:0005886 + GO:0009925 basal PM; substrates PGE2/PGE1/PGF2a/PGD2/PGE3/TxB2/(S)-lactate as ChEBI. Clears extracellular PGs for cytoplasmic 15-PGDH degradation. Actions (26): 15 ACCEPT (GO:0015132 x4, GO:0015291, GO:0015732, GO:0043252 x2, PM x4, GO:0009925 x2, basolateral IBA), 3 MODIFY (GO:0005319 lipid carrier -> GO:0015132; GO:0006869 lipid transport x2 -> GO:0015732), 4 KEEP_AS_NON_CORE (cytoplasm x2, lysosome x2, all ISS By-similarity to rat), 4 TOO_GENERAL (GO:0016020 x2, GO:0022857, GO:0055085). Disease (PHOAR2/pachydermoperiostosis, digital clubbing, chronic enteropathy) = loss of PGE2 clearance = necessity not participation; GOA is transport-only so no downstream over-annotations to downgrade. proposed_new_terms: none. source_defects: none. Batch 12.
