  summary: Qualify the quinone reading after OpenScientist structural run
  details: |
    The AlphaFold pocket analysis measured an enclosed aromatic pocket that discriminates sterically in the direction the reported affinities predict, but argued against naming a quinone as the function: catalytic efficiency favours a synthetic aryl-alkyl diketone about 15-fold over 1,4-naphthoquinone, Foldseek finds no quinone reductase among the nearest neighbours, menaquinone would not fit the pocket, and in human SPR quinone handling is cofactor-site redox cycling separable from sepiapterin reduction (PMID:23640889). Added two knowledge_gaps to the core function and two references. No annotation action changed.
