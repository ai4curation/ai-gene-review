  summary: Initial curation of BPQBE rep (RNA-directed RNA polymerase beta chain) gene review
  details: |
    Initial curation of Qubevirus durum (Escherichia phage Qbeta) RNA-directed
    RNA polymerase beta chain rep (P14647). Reviewed 12 existing GOA
    annotations: accepted GO:0003968 (RNA-directed 5'-3' RNA polymerase
    activity), GO:0039685 (single-stranded viral RNA replication via
    double-stranded RNA intermediate), and GO:0003723 (RNA binding); kept
    GO:0000166 (nucleotide binding) and GO:0043657 (host cell) as non-core;
    modified GO:0019079 (viral genome replication) to GO:0039685 based on
    crystallographic and biochemical studies of the Qbeta replicase holoenzyme
    (PMID:21074775, PMID:22337997, PMID:24121439, PMID:25079846).
