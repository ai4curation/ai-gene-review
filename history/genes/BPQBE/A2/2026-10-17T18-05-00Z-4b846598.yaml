  summary: Initial curation of BPQBE A2 (maturation protein A2) gene review
  details: |
    Initial curation of Qubevirus durum (Escherichia phage Qbeta) maturation
    protein A2 (Q8LTE2). Reviewed 12 existing GOA annotations: accepted
    GO:0039666 (virion attachment to host cell pilus), GO:0046718 (symbiont
    entry into host cell), GO:0039635 (symbiont-mediated suppression of host
    peptidoglycan biosynthetic process), and GO:0039640 (viral release via
    suppression of host peptidoglycan biosynthetic process); modified broader
    ancestors GO:0051701, GO:0031640, and GO:0019076 to specific supported
    terms; kept GO:0043657 (host cell) as non-core based on structural and
    biochemical studies (PMID:11423662, PMID:18996879, PMID:28111107,
    PMID:29078304).
