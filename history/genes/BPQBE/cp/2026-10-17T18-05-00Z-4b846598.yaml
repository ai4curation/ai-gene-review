  summary: Initial curation of BPQBE cp (capsid protein) gene review
  details: |
    Initial curation of Qubevirus durum (Escherichia phage Qbeta) capsid protein
    cp (P03615). Reviewed 9 existing GOA annotations: accepted GO:0039660
    (structural constituent of virion), GO:0030371 (translation repressor
    activity), and GO:0039617 (T=3 icosahedral viral capsid); modified
    GO:0003723 (RNA binding) and GO:0019013 (viral nucleocapsid) to specific
    supported terms; removed erroneous IEA mapping GO:0046740 (transport of
    virus in host, cell to cell) based on Qbeta virion structure and operator
    hairpin binding studies (PMID:8943226, PMID:16531233, PMID:27671640,
    PMID:28111107).
