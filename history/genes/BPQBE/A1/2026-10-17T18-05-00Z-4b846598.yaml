  summary: Initial curation of BPQBE A1 (minor capsid protein A1) gene review
  details: |
    Initial curation of Qubevirus durum (Escherichia phage Qbeta) minor capsid
    protein A1 (Q8LTE1). Reviewed 7 existing GOA annotations: accepted
    GO:0039660 (structural constituent of virion) and GO:0039617 (T=3
    icosahedral viral capsid); kept GO:0030371 (translation repressor activity)
    as non-core inherited from the N-terminal coat protein domain; modified
    GO:0003723 (RNA binding) and GO:0019013 (viral nucleocapsid) to specific
    supported terms; removed erroneous IEA mapping GO:0046740 (transport of
    virus in host, cell to cell) based on UGA readthrough and structural studies
    (PMID:956253, PMID:19913556, PMID:21109531).
