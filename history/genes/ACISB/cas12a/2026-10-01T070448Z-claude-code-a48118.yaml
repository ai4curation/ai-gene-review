  summary: 'Create review: AsCas12a (U2UMQ6), type V-A CRISPR effector'
  details: |
    Completed review from seeded stub. Both GOA GO:0004530 rows (IEA from EC:3.1.21.1; ISS from UniProtKB:A0Q7Q2) MODIFY -> GO:1990238 double-stranded DNA endonuclease activity: GO:0004530 is the GO rendering of EC 3.1.21.1 deoxyribonuclease I, a non-specific nuclease whose definition carries DNase I product specification not true of Cas12a. ISS transfer itself upheld (A0Q7Q2 is the correct source). Four NEW rows added: GO:0000014 single-stranded DNA endonuclease activity (IDA, PMID:30936531, target-activated trans cleavage from the same RuvC site); GO:0004521 RNA endonuclease activity (ISS from A0Q7Q2, the EC 4.6.1.22 pre-crRNA processing activity that the EC-to-GO pipeline never produced a row for); GO:0099048 CRISPR-cas system and GO:0051607 defense response to virus (both IMP, PMID:38261981 AsCas12a plaque-reduction data). Three core_functions. One proposed new term: guide RNA-dependent nucleic acid endonuclease activity. Biotechnology/genome-editing use deliberately excluded from description and core_functions. Notes file written in place of deep research (no provider API keys available).
