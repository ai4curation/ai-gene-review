  summary: 'Create review: BPP2 Q (P25480)'
  details: |
    End-to-end curation of BPP2 gene Q (P25480). Portal protein gpQ is a 344-amino-acid structural protein of Escherichia phage P2 that undergoes N-terminal proteolytic processing (removing residues 1-25 to yield capsid protein h6) and assembles into a dodecameric ring (135 A diameter with a 25 A central channel) at the unique fivefold vertex of P2 and P4 capsids, forming the conduit for viral DNA genome packaging and subsequent genome ejection through the contractile tail.. Reviewed all GOA annotations, synthesized core functions, and wrote comprehensive literature notes in Q-notes.md.
