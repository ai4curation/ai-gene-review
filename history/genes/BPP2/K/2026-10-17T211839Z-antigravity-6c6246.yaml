  summary: 'Create review: BPP2 K (P51771)'
  details: |
    End-to-end curation of BPP2 gene K (P51771). Endolysin gpK is an essential 165-amino-acid peptidoglycan-degrading lytic transglycosylase of Escherichia phage P2 (homologous to bacteriophage lambda endolysin R) that accumulates in the host cytoplasm during late infection and, upon inner-membrane permeabilization by holin Y, degrades the bacterial peptidoglycan sacculus to mediate host cell lysis and progeny virion release.. Reviewed all GOA annotations, synthesized core functions, and wrote comprehensive literature notes in K-notes.md.
