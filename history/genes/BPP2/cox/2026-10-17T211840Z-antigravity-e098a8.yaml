  summary: 'Create review: BPP2 cox (P07695)'
  details: |
    End-to-end curation of BPP2 gene cox (P07695). Protein Cox (control of excision) is a 91-amino-acid bifunctional winged-helix DNA-binding protein of Escherichia phage P2 that serves both as the lytic switch transcriptional repressor—inhibiting the lysogenic promoter Pc to block repressor C synthesis while negatively autoregulating the early promoter Pe—and as the recombination directionality factor (excisionase) required with integrase Int for prophage excision.. Reviewed all GOA annotations, synthesized core functions, and wrote comprehensive literature notes in cox-notes.md.
