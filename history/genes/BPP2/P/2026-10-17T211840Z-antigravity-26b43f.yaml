  details: |
    End-to-end curation of BPP2 gene P (P25479). Terminase ATPase subunit gpP is a 590-amino-acid motor protein of Escherichia phage P2 that associates with the endonuclease subunit gpM to form the viral terminase complex, docking at the gpQ portal vertex of empty procapsids and hydrolyzing ATP to power translocation of linearized P2 or P4 double-stranded DNA genomes into the capsid.. Reviewed all GOA annotations, synthesized core functions, and wrote comprehensive literature notes in P-notes.md.
