  summary: 'Create review: BPP2 lysB (P51770)'
  details: |
    End-to-end curation of BPP2 gene lysB (P51770). Inner membrane spanin subunit LysB (i-spanin) is a 141-amino-acid single-pass transmembrane protein of Escherichia phage P2 that anchors in the host inner membrane and extends a coiled-coil domain into the periplasm to pair with the outer-membrane lipoprotein o-spanin LysC, forming the spanin complex that disrupts the Gram-negative outer membrane following peptidoglycan degradation to complete host cell lysis.. Reviewed all GOA annotations, synthesized core functions, and wrote comprehensive literature notes in lysB-notes.md.
