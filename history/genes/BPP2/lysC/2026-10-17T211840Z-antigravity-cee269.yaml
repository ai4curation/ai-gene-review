  summary: 'Create review: BPP2 lysC (Q8LTD0)'
  details: |
    End-to-end curation of BPP2 gene lysC (Q8LTD0). Outer membrane lipoprotein spanin subunit LysC (o-spanin) is a 96-amino-acid lipoprotein of Escherichia phage P2 (processed by signal peptidase II at Cys-23) that anchors in the host bacterial outer membrane and pairs across the periplasm with the inner-membrane spanin subunit LysB to disrupt the outer membrane following peptidoglycan degradation during cytolytic viral release.. Reviewed all GOA annotations, synthesized core functions, and wrote comprehensive literature notes in lysC-notes.md.
