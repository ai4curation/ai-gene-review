  summary: 'Create review: BPP2 Y (P51773)'
  details: |
    End-to-end curation of BPP2 gene Y (P51773). Holin gpY is an essential 93-amino-acid three-transmembrane class I holin of Escherichia phage P2 that accumulates in the bacterial host inner (plasma) membrane and, at a genetically programmed time or upon membrane depolarization, oligomerizes into large membrane pores that allow the cytoplasmic endolysin gpK to access the periplasm and degrade the peptidoglycan cell wall.. Reviewed all GOA annotations, synthesized core functions, and wrote comprehensive literature notes in Y-notes.md.
