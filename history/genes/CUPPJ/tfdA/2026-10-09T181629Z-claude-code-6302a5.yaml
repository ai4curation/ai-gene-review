  summary: New review of tfdA (evolved xenobiotic-degradation counter-example set)
  details: |
    Created as part of projects/NONPHYSIOLOGICAL_REACTIONS.md, the category-4 counter-example set: enzymes acting on man-made substrates whose functions are nonetheless real, selected and pathway-committed. Established that substrate provenance does not predict whether an activity is physiological. Notable per-gene findings: atzA and dhlA carry fold-level InterPro/PANTHER transfers to the wrong reaction class (GO:0016810, GO:0004301) and these were removed; linA has no MF annotation because GO:0018830 was bulk-obsoleted in go-ontology#28108 on criteria that tracked curation coverage rather than evidence, and restoration is proposed; pcpB refutes low catalytic efficiency as a standalone detection signal; tfdA, pcpB and dhlA have no experimental MF annotation despite extensive enzymology.
