  summary: 'Full re-review: A0A2G9RZF1 identified as TLL1 CUB5 fragment'
  details: |
    Full re-review independent of ProtNLM2 predictions. New phmmer analysis (A0A2G9RZF1-bioinformatics/RESULTS.md) shows residues 30-156 are 126/127 identical to the C-terminal CUB5 (879-1005) of the complete bullfrog TLL1 RefSeq model XP_073462190.1, with TLL1-orthogroup identity ordering (Xenopus TLL1 86.6% > human TLL1 78% > BMP1/TLL2 66-68%); this resolves the prior BMP-1-vs-TLL1 ambiguity. Description rewritten; placeholder root MF GO:0003674 replaced by gene-level GO:0004222 metalloendopeptidase activity (explicitly not an activity of the non-catalytic fragment) supported by TLL1 orthology and PMID:10479448; bracket-only supporting_text replaced with verbatim quotes; PMID:10479448 and RESULTS.md added; no NEW annotations (GOA empty). Noted PANTHER SF37 placement is a fragment artefact (gene belongs to SF45) and that the PTHR24251 family review misdescribes the target as a sponge protein. Notes file created.
