    GO:0007338 (single fertilization): NPI -> UNC. The target is a 156-residue CUB-domain protein from Aquarana catesbeiana. CUB domains occur in diverse extracellular proteins, including both reproductive and nonreproductive proteins (PMID:8510165); a CUB or spermadhesin-like fold does not identify a fertilization-specific subfamily. Neither reproductive expression nor a fertilization phenotype is established in the inspected sources. The predicted process is absent from the cached annotations and remains uncertain rather than contradicted.

    GO:0005576 (extracellular region): COR -> COR. The sequence contains a nearly complete CUB domain at residues 31–147. The comparative analysis defining CUB domains places this module in extracellular proteins with diverse functions (PMID:8510165), supporting a broad extracellular localization inference for this vertebrate protein. The record does not establish the secretion route or whether the short sequence is a complete gene product; no specific extracellular tissue or function is inferred. Extracellular region is absent from the cached GOA/UniProt annotations.

