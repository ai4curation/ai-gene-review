  summary: Retire duplicate D9J262 folder; merged into NITRP/amoA
  details: |
    genes/NITRP/D9J262/ reviewed the same UniProt accession (D9J262) as genes/NITRP/amoA/ and reached different conclusions (1 ACCEPT + 2 NEW vs 1 MODIFY + 3 NEW). The coordinator chose genes/NITRP/amoA/ as the canonical folder (projects/PROTEOME_REMOVAL.md links to it), so this folder was removed with git rm -r and its content merged there. Its Falcon deep research was moved unchanged to genes/NITRP/amoA/amoA-deep-research-falcon.md (+ _artifacts). Of its review decisions: ACCEPT of GO:0004497 became MODIFY to GO:0018597 in the merged review; NEW membrane became NEW GO:0005886 plasma membrane; NEW GO:0019331 anaerobic respiration, using ammonium as electron donor (anammox; TAS from an ecological survey, PMID:22775980) was dropped as incorrect for an aerobic ammonia oxidiser; the proposed term 'archaeal ammonia oxidation' was dropped. Its UniProt/GOA files duplicated the amoA folder's and were not kept. No earlier history records existed for this target.
