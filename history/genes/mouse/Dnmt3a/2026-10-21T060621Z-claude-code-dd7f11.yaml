  summary: 'Create review: mouse Dnmt3a (DNMT3A reference ortholog)'
  details: |
    De novo review of mouse Dnmt3a (O88508), independent of ProtNLM2 predictions, as the experimentally characterised PTHR23068:SF10 ortholog of human DNMT3A. Falcon and perplexity-lite deep research both failed (auth/quota); review built from 29 cached primary papers (6 newly cached: neurogenesis, HSC, germline DMR/repeat methylation, ES rescue, H3K36me2, neuronal mCA). All 120 GOA rows reviewed: core activity GO:0003886, de novo methylation, genomic imprinting and CpG-island silencing accepted; protein-binding rows removed except HDAC1/2 (modified to histone deacetylase binding); rat-sourced response-to-X IEAs marked over-annotated as expression readouts; overexpression lethality (post-embryonic development) and BPA expression rows removed; nucleus/chromosome refined to chromatin; catalytic complex refined to DNA methyltransferase complex. NEW GO:0140003 H3K36me3 reader activity from mouse PWWP evidence.
