  summary: 'Create review: Hes6 (mouse)'
  details: |
    De-novo review of mouse Hes6 (Q9JHE6) as the experimentally characterised PTHR10985:SF11 ortholog reference for zebrafish hes6. Falcon deep research failed (perplexity-lite fallback timed out), so the review is built from 15 cached primary papers. All 27 GOA rows reviewed: core MF set to transcription regulator inhibitor activity (Hes1 antagonism), Hes1 binding and dimerisation; DNA-binding/DNA-binding repressor rows kept non-core because Hes6 DNA binding is contested (PMID:10851137 vs PMID:11959828/PMID:11551980) and not required for its biological activities; generic process rows modified to positive regulation of neuron differentiation/neurogenesis and regulation of myoblast differentiation; A/P pattern specification IBA kept non-core and flagged as inferred only for mouse. Added NEW transcription corepressor binding (TLE1 via WRPW, PMID:11551980). ProtNLM predictions were not consulted.
