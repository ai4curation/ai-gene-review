  summary: 'Create review: Hes6 (Q9JHE6)'
  details: |
    De-novo review of mouse Hes6 as the experimentally characterised PTHR10985:SF11 reference for zebrafish hes6 (HORSE40 ProtNLM2 cohort relative); ProtNLM2 predictions not consulted. Falcon deep research failed (Edison 403) and the perplexity-lite fallback failed (401 quota), so the review rests on 18 primary papers fetched into publications/. All 27 GOA rows reviewed: Hes1 antagonism (GO:0140416, GO:0061629, GO:0045944), dimerization, nucleus and Pol II repression accepted; DNA-binding terms kept as non-core because autonomous DNA binding is disputed (Bae 2000 vs Cossins 2002) and dispensable for neural/myogenic function; nervous system development -> positive regulation of neuron differentiation; IBA regulation of neurogenesis -> positive regulation of neurogenesis; cell differentiation -> regulation of myoblast differentiation; IBA A/P pattern specification marked over-annotated (only zebrafish hes6 has segmentation-clock evidence; Hes6-null mice lack patterning defects). NEW: transcription corepressor binding (TLE1 via WRPW, PMID:11551980) and negative regulation of astrocyte differentiation (PMID:17065448; comparator Hes5 carries the same term by IDA). ISO dimerization rows noted as sourced from chicken HES1 (different subfamily) but independently supported in mouse.
