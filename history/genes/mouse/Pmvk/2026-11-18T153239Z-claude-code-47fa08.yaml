  summary: 'Create review: Pmvk (Mus musculus)'
  details: |
    Reviewed all 32 GOA rows for mouse phosphomevalonate kinase (Q9D1G2) against mouse data (Pex5-/- liver enzyme assays, Pmvk knockout and liver conditional knockout, the 2024 mouse liver peroxisome proteome), the human and rat source papers behind the ISO/ISS rows, the PTHR13101 PAINT node and the MGI GO-CAM models. Catalytic, ATP, cytosol and IPP-pathway rows accepted; cholesterol and GGPP biosynthesis non-core; sterol and secondary alcohol biosynthesis too general; zymosterol and response-to-cholesterol rows over-annotated. Peroxisome kept as non-core on mouse proteomics plus the C-terminal AKL, and the UniProt NOT peroxisome row transferred from human removed, with a UniProt CHECK defect. Queried the GO-CAM cytosol ISO that cites a rat Mvd paper (PMID:11725955). Validated with just validate after backfill-record-sections.
