  summary: 'Cross-check review against Falcon deep research: Tlr13'
  details: |
    Compared Tlr13-deep-research-falcon.md with the completed review; the report surfaced a 2020-2025 literature the review had not seen. Fetched and read PMID:32209688 (mBio 2020), PMID:38358825 (JCI Insight 2024) and PMID:39853307 (J Exp Med 2025). Added one NEW annotation, GO:0050830 defense response to Gram-positive bacterium (IMP, PMID:32209688): single-knockout mice have moderately impaired antipneumococcal defence with late-onset lethality, knockout microglia produce less CXCL1/TNF, triple knockout with TLR7/TLR9 is extremely susceptible, and double-knockout work makes this receptor and TLR2 the major pneumococcal sensors in the subarachnoid space. Participation rests on direct 23S rRNA binding (structure of the complex), and the comparator check found mouse Tlr2 carrying GO:0050830 by IMP from three papers. Caveats recorded: phenotypes are all S. pneumoniae although the ligand is not Gram-positive-specific, and the same signalling drives meningitis brain pathology. Microbiome-RNA/tissue-protective-Kupffer-cell biology (PMID:39853307) added to description and cited on the rRNA-binding row but deliberately not annotated (RNase T2-deficient background; outcome produced by the macrophages). Human TLR8 as functional counterpart added to description. No existing annotation action changed.
