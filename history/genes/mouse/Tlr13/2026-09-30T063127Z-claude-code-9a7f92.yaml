  summary: 'Create review: Tlr13'
  details: |
    Created the full review for mouse Tlr13 (Q6R5N8) in INNATE_IMMUNITY batch 1; the best-characterised of the rodent-specific TLRs and the only one in this set with no nomenclature ambiguity. All 20 GOA rows reviewed: 10 accepted (rRNA binding x2, GO:0034178 toll-like receptor 13 signaling pathway x2, innate immune response x2, endosome, endosome membrane, GO:0002224, GO:0002755), 6 modified and 4 kept as non-core. The modifications are GO:0038023 to GO:0038187 pattern recognition receptor activity, the two GO:0042802 rows to GO:0042803 protein homodimerization activity (ligand-induced dimerisation shown structurally), GO:0005886 to GO:0010008 endosome membrane, and the two bare GO:0005515 rows to informative functions, GO:0051087 protein-folding chaperone binding for the UNC93B1 interaction and GO:0070976 TIR domain binding for MyD88. GO:0009615 response to virus was kept as non-core rather than accepted because the vesicular stomatitis virus claim is flagged as needing further evidence by UniProt and the later literature converged on bacterial 23S rRNA. Validation: clean.
