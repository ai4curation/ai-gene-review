  summary: Create mouse Megf10 gene review
  details: |
    New review of all 53 GOA annotations for mouse Megf10, consistent with the human MEGF10 review. Core functions: scavenger receptor activity in engulfment/recognition of apoptotic cells and synapse pruning; C1q complex binding. REMOVE the MGI IMP GO:1902742 apoptotic process involved in development (PMID:27170117): the full text (PMC4863057) shows the phenotype is an accumulation of uncleared apoptotic cells. Homotypic cell-cell adhesion ISO/ISS/IEA rows are MODIFY to cell-cell recognition (Kay 2012 shows repulsion), with propagation_review provenance. Transferred positive regulation of cell-cell adhesion is UNDECIDED, as in the human source. NEW synapse pruning (Chung 2013).
