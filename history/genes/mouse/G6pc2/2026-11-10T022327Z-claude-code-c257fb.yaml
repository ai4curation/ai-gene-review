  summary: Add alpha-cell glucagon-secretion role from Bahl 2025
  details: |
    Follow-up edit made while reviewing human G6PC2. Bahl et al. 2025 (PMID:39742505, full text) is the first functional study of G6PC2 in alpha cells and uses an inducible alpha-cell-specific mouse knockout, so it is mouse evidence that this review lacked. Added a NEW row for GO:0070094 positive regulation of glucagon secretion (IMP, PMID:39742505): deletion in 88 percent of alpha cells shifts the glucose set point for suppression of amino-acid-stimulated glucagon secretion leftward, with no difference at zero glucose but significantly less glucagon at 0.5 to 5 mM, and lowers fasting and glucose-suppressed plasma glucagon with insulin unchanged, islet composition unaffected, and paracrine insulin excluded by phloridzin and insulin-tolerance experiments. Participation and comparator tests recorded in the row. Revised the description, which called G6pc2 almost exclusively beta-cell, to islet endocrine cells with an approximately twenty-fold beta bias and both hormonal arms. Added GO:0070094 and CL:0000171 pancreatic A cell to core_functions. Rewrote the PMID:39121091 reference_review, whose earlier note gave the beta-cell bias as a reason not to propose a glucagon term, and raised its relevance to MEDIUM. Extended the gluconeogenesis IBA reason to note that the alpha-cell result strengthens the removal, since both arms of the fasting-glucose phenotype are islet-hormonal. Replaced the now-answered suggested question with the open quantitative one. Appended a dated notes entry; env -u UV_NATIVE_TLS just validate mouse G6pc2 passes with no errors.
