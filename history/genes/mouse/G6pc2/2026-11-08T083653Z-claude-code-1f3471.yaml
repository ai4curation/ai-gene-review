  summary: 'Create review: G6pc2'
  details: |
    De novo review of all 17 GOA annotations for mouse G6pc2 (Q9Z186). Accepted glucose-6-phosphatase activity (GO:0004346; IBA/IDA/IEA/IMP/ISO) as the core molecular function on the recombinant enzymology (PMID:14722102), loss of islet activity and glucose cycling in knockouts (PMID:23274894, PMID:25552595), and ER-membrane topology; the low turnover relative to G6pc1 is the physiology (glucokinase-opposing modulator), not noise. Removed gluconeogenesis (GO:0006094 IBA and IEA) as an over-propagation from the G6PC root PANTHER node to the islet-restricted G6PC2 clade, which cycles glucokinase-derived G6P to tune insulin secretion rather than producing glucose; beta-cell-specific deletion is sufficient for its fasting-glucose phenotype (PMID:32213654) and paint-losses shows no IRD on the lineage. Kept ER and ER-membrane rows (root organelle term plus supported sub-compartment), modified generic membrane to ER membrane, accepted glucose homeostasis, and modified regulation of insulin secretion to the specific negative-regulation-of-GSIS term GO:0061179. Recorded source defects for a suspected wrong IDA reference (PMID:10787428, an NPC1 paper) and for the by-similarity UniProt FUNCTION/PATHWAY gluconeogenesis text.
