  details: |
    Targeted PubMed search for direct measurements of glucose production in G6pc2-deficient animals or G6PC2 variant carriers found one nominal human association (PMID:19669124), now weighed in the gluconeogenesis reason; no mouse glucose-production study exists, added as a suggested experiment. A blinded OpenScientist function-assignment run (no review decision, rationale or Bgee report in the prompt) independently judged gluconeogenesis refuted; report cited with a reference_review noting its overstatement of liver absence. Chicken Bgee check (G6pc2-bioinformatics/chicken_paralogs.py) narrowed the suggested IRD to the mammalian G6PC2 node PTN000287500. REMOVE stands.
