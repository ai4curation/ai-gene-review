  summary: New full review of mouse Mtmr9 (Q9Z2D0) as the experimental reference for
    human MTMR9, independent of ProtNLM2 predictions
  details: |
    Created Mtmr9-ai-review.yaml and Mtmr9-notes.md. Reviewed all 30 GOA rows (16 ACCEPT, 8 KEEP_AS_NON_CORE, 6 MODIFY). Generic protein binding (Mtmr7 partner) and protein phosphatase binding were changed to phosphatase binding (GO:0019902) because the partners are lipid phosphatases. Enzyme regulator activity was changed to phosphatase activator activity, based on mouse Mtmr7 activation (PMID:12890864). The phosphatidylinositol dephosphorylation IBA was accepted because PAINT negated only the catalytic MF at PTN000086907. Separated mouse experimental findings (Mtmr7 binding and activation, dimerization, cytoplasm and ruffle localization dependent on the GRAM region) from ortholog-inferred ones (MTMR6/MTMR8 activation, stabilization, autophagy, ER and perinuclear localization), grounded in PANTHER PTHR10807:SF56. Falcon deep research failed (auth 403) and so did the perplexity-lite fallback; this is recorded in the notes.
