  summary: Review mouse Eno1 for gluconeogenesis
  details: |
    Created a mouse Eno1 gene review for the gluconeogenesis GO-CAM campaign. Reviewed all 63 seeded GOA rows, accepting the conserved cytosolic phosphopyruvate hydratase activity, dimeric enolase complex, cytosol, glycolysis, and gluconeogenesis rows; keeping the human MBP-1 transcriptional repressor, cell-surface plasminogen-receptor, glyceroneogenesis, and homodimerization moonlighting rows as non-core where the source evidence was traceable; modifying cytoplasm to cytosol, generic membrane to plasma membrane, identical protein binding to homodimerization, generic transcriptional repression to RNA polymerase II-specific repression, transcription corepressor activity to DNA-binding transcription repressor activity, and obsolete canonical glycolysis to glycolytic process; marking the Eno1 gene-trap and rat cardiomyocyte hypoxia/ATP rescue rows as over-annotated; removing only the bare protein-binding row; and leaving unresolved rat RGD-derived or supplemental-dataset rows undecided where the seed publication was not available. Added manual research notes that record the 61e0e55600001225/62d0afa500000298 evidential inconsistency: the GO-CAM chemistry is correct, but PMID:30679508 supports ENOblock-induced nuclear repression rather than direct catalytic gluconeogenesis. Then addressed AI review feedback by marking anti-corepressor binding and nuclear-outer-membrane transfers as over-annotated, replacing mismatched magnesium, cytosol, gluconeogenesis, and MBP-1 growth-suppression supporting quotes, adding a direct mouse GO:0031430 M band row from PMID:11229603, and updating that reference's finding statement.
