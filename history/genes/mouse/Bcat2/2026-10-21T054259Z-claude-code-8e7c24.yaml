  summary: 'Create review: mouse Bcat2 (ProtNLM2 ortholog reference, independent of
    predictions)'
  details: |
    New review of 53 GOA rows for mouse Bcat2 (O35855), done independently of ProtNLM2 output. Falcon deep research failed (403 at auth) and the perplexity-lite fallback also failed, so the review uses cached GOA papers plus 5 newly cached PubMed papers (PMID:36443523, 32029896, 20133434, 27886623, 9165094). Accepted: BCAA transaminase MFs (mouse IDA/IMP loss-of-function, SF39 orthology), Leu/Ile/Val and BCAA catabolism, mitochondrion and mitochondrial matrix. MODIFY: catalytic activity to GO:0004084, BCAA metabolic process to GO:0009083, leucine metabolic process to GO:0006552. Marked over-annotated: nucleoplasm (ISO; the human source term is gone from the cached GOA), leucine biosynthesis (ISO; reamination is not biosynthesis), LIF response (IEP), energy homeostasis and regulation of hormone levels (downstream knockout phenotypes). Brown fat differentiation kept as non-core. Notes separate mouse-established from ortholog-inferred properties.
