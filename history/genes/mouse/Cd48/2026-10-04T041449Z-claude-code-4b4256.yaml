  summary: 'Revise NK cell activation annotations: Cd48 (mouse)'
  details: |
    Re-assessed GO:0030101 natural killer cell activation after an OpenScientist hypothesis run (genes/mouse/Cd48/Cd48-hypotheses/cd48-nk-activation-direction) and verification of the cited primary papers, now cached. In mouse, CD48-2B4 is predominantly inhibitory (PMID:15123744, PMID:15870174, PMID:27573813), opposite to human, with a trans activating contribution (PMID:27054584). Mouse: IBA and two ISO rows changed to MODIFY with GO:0032814 regulation of natural killer cell activation, plus NEW GO:0045953 negative regulation of NK cell mediated cytotoxicity (comparator HLA-E). Rat: IBA and ISO rows set to UNDECIDED because rat direction is untested. Propagation reviews added; validated with just validate.
