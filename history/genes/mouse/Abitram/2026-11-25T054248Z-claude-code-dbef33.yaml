- type: EDIT
  outcome: changed
  summary: Record OpenScientist fold and surface analysis for Abitram actin binding
  details: |
    Ran an OpenScientist deep-research job (kgap-abitram-actin-surface) on the knowledge gap covering the structural basis of Abitram's actin interactions. The fold half is answered negatively. A Foldseek search of the AlphaFold model returns eight significant hits, every one a glycine cleavage system H protein, at TM-score 0.73-0.84 and core RMSD 1.07-1.44 Angstrom over 117-122 residue pairs at 10-14 per cent sequence identity, with no calponin homology domain, WH2 motif, ADF-H fold, gelsolin fold, formin FH2 or villin headpiece at any E-value. The local record agrees at sequence level, carrying Pfam PF01597 GCV_H, SUPFAM SSF51230 and Gene3D 2.40.50.100. The ancestral lipoylatable lysine maps to mouse position 117, which is aspartate, so the fold carries no residual GcvH chemistry and no GcvH-derived molecular function term should be added.

    The interface half becomes a specific prediction rather than an answer: restricted to the ordered core the protein is net positive where a true GcvH control is strongly negative, and the largest contiguous basic patch, 622 square Angstrom over Lys96, Arg99, Arg128, Arg130 and Lys161, exceeds the equivalent patch on utrophin's actin-binding domain, fimbrin ABD2, cofilin and gelsolin segment 1, with those positions ranking first, second, third, fifth and tenth of 85 exposed core positions for basic-residue conservation.

    Verification note worth recording. All seven candidate positions and the aspartate at 117 were confirmed in the local mouse sequence. A first attempt to check the run's claim that human Q9NX38 is identical at these positions appeared to contradict it, but that was my error: the two sequences differ in length, 193 against 181 residues, so raw index comparison is invalid. A pairwise alignment confirms the run exactly, with aspartate at the aligned 117 and lysine or arginine at all seven aligned candidate positions.

    Status set to NARROWING. Two caveats are recorded with the result. The run reports that it first obtained a neutral surface with no usable patch and traced that to including the disordered N-terminus, which carries net minus three and cancels the core, so the positive result depends on the core restriction. And no region of Abitram has ever been mapped to actin, the run finding no deletion, truncation or mutant construct anywhere in the full text of PMID:24782708, so the predicted patch has nothing to be validated against. That same full text strengthens the directness of the interaction, with purified GST-tagged protein coprecipitating purified G-actin as the only two proteins present and co-sedimenting with both G-actin and F-actin across five replicates, which corroborates the existing annotations rather than changing them. No annotation action was taken.
