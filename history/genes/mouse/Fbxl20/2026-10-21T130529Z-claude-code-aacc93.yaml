  summary: 'Create review: Fbxl20 (SCRAPPER) as experimentally characterised SF47
    reference for donkey FBXL20'
  details: |
    De-novo review of mouse Fbxl20 (Q9CZV8), independent of ProtNLM2 predictions. Deep research (falcon, perplexity-lite fallback) failed with an authentication error, so the review rests on cached primary literature (PMID:17803915 full text plus later mouse knockout papers). All 18 GOA rows reviewed: IBA SCF complex and SCF-dependent catabolism accepted (confirmed by mouse Skp1/Cul1 co-IP and RIM1 turnover); SynGO presynaptic catabolism, vesicle-exocytosis regulation, glutamatergic and CA3-CA1 synapse rows accepted; bare synapse rows refined to glutamatergic synapse; IPI protein binding with Rims1 modified to ubiquitin-like ligase-substrate adaptor activity; fear-response IMP kept as non-core downstream phenotype; cytoplasm kept as non-core. Human-only substrates (VPS34, PR55alpha) noted but not transferred as mouse facts.
