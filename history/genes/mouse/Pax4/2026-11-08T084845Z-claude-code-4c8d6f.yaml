  summary: 'Create review: Pax4'
  details: |
    De novo review of mouse Pax4 (P32115) for the BGEEDB_EXPRESSION project. All 50 GOA rows reviewed: 21 ACCEPT, 18 MODIFY, 6 MARK_AS_OVER_ANNOTATED, 5 REMOVE. Core functions: Pol II sequence-specific transcriptional repressor; pancreatic beta-cell fate allocation by Arx cross-repression; intestinal enterochromaffin/D-cell specification. IBA brain and forebrain development removed, and retina and sensory organ development marked over-annotated: the IBDs are Pax6-seeded (the only Pax4 seed is a rat IEP whose authors argue against a developmental role), PANTHER 19 splits PAX4 from PAX6 separately at Mammalia and Neopterygii duplications against the 2R origin (PMID:24951566; new bioinformatics script panther_tree_paths.py), and no Pax4 ortholog has an eye or brain phenotype. Rat IEP-derived Ensembl IEA rows (circadian rhythm, response to cAMP, response to xenobiotic stimulus) removed as expression patterns, with ENSEMBL and RGD source_defects. Bgee used only as a consistency check.
