  details: |
    New full review of mouse Pnkd as the experimentally characterised ortholog reference for rat Pnkd (B4F7D2), same PANTHER subfamily PTHR11935:SF116. All 29 GOA rows reviewed. Core MF thiolester hydrolase activity (IBA, PTN004322580) accepted but flagged as inferred (zinc-site motif conserved; only the human ortholog was assayed, with trace SLG hydrolysis). HAGH activity IEA marked over-annotated and methylglyoxal catabolic process IEA removed (human PNKD-L is not a glyoxalase II in vivo; PAINT did not propagate it). RIM1/RIM2 protein-binding IPI removed per GO:0005515 policy. Mouse-experimental locations accepted: presynaptic cytosol (IDA), mitochondrion (HDA/IBA), plasma membrane; membrane modified to plasma membrane. Neurotransmitter-secretion and dopaminergic-transmission rows kept as non-core; dopamine metabolism and posture IMP rows marked over-annotated as organismal phenotypes. Complex IV assembly ISO left UNDECIDED (human source annotation no longer in GOA). Deep research (falcon, perplexity-lite fallback) failed on auth/quota; recorded in notes.
