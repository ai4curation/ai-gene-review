  details: |
    Completed review of all 137 GOA rows for mouse Bnip3 (O55003): 45 ACCEPT, 62 KEEP_AS_NON_CORE, 25 MARK_AS_OVER_ANNOTATED, 3 MODIFY (GO:0045837 to GO:0010917), 1 REMOVE (obsolete GO:0061753), 1 UNDECIDED (GO:0071260). Core functions: mitochondrion autophagosome adaptor activity (GO:0140580) in mitophagy at the MOM, ER-autophagosome adaptor activity (GO:0140506) in reticulophagy, and hypoxia-induced positive regulation of macroautophagy. Mouse-specific IDA/IEP rows from expression or proteomics surveys (brown fat differentiation, postsynaptic density, response to bacterium) were marked over-annotated after checking sources (PMC2493586 full text for the brown fat row). Added mouse in vivo references (Bnip3-null liver, Bnip3-null heart, Fbxl4/Bnip3 genetics). PMID:18281291 noted as retracted and not used. Notes record PAINT node-placement concerns for PTHR15186. Validated with just validate mouse Bnip3 (no content warnings). Falcon deep research was still running and was not incorporated.
