  summary: De-novo full review of mouse Foxn4 (Q8K3Q3) as the experimental reference
    relative of fly jumu
  details: |
    Created the review from scratch, independent of ProtNLM2 predictions (none opened). Deep research failed (falcon auth error, perplexity-lite quota 401); recorded in Foxn4-notes.md and reviewed from cached primary literature (8 additional PMIDs fetched).
    All 26 GOA rows reviewed. ACCEPT: Pol II-specific DNA-binding TF activity (EMSA + reporter, PMID:23652001), cis-regulatory sequence-specific DNA binding (ChIP of ACGC-cluster Dll4 enhancer, PMID:22323600; IBA/ISO/IEA consistent), nucleus, positive regulation of transcription by Pol II, amacrine cell differentiation, ventral spinal cord interneuron fate commitment. MODIFY general terms to the specific descendants the gene already carries (0003700->0000981, 0006355->0045944, 0043565 and chromatin binding->0000987, cell differentiation->0035881, neuron fate commitment and ventral SC interneuron differentiation->0060579). KEEP_AS_NON_CORE retina layer formation. Zebrafish-derived ISS heart rows: heart looping and regulation of heart contraction MARK_AS_OVER_ANNOTATED (downstream organ phenotypes, never shown in mouse); AV canal development UNDECIDED for mouse (direct mechanism in zebrafish, untested in mammals, not propagated by PAINT).
    Evolutionary grounding: PANTHER 19.0 puts Foxn4, human FOXN4, zebrafish foxn4 and jumu in PTHR13962:SF17; PAINT node PTN000216159 spans FOXN2/3/4 and jumu and propagated only MF/nucleus/transcription regulation. Noted that current UniProt PANTHER xrefs place Foxn4 in PTHR46721:SF2 and jumu in PTHR46721:SF3. Proposed new term: retinal horizontal cell differentiation.
