  summary: 'Create review: Shld2 (mouse, Q3UEN2)'
  details: |
    New review of mouse Shld2 (Q3UEN2), the reviewed 1:1 ortholog of human SHLD2, made as the experimental reference for the ProtNLM2 benchmark gene human/SHLD2. It was done independently of the ProtNLM2 predictions. Deep research failed: falcon returned 403 and perplexity-lite returned 401 quota, so the review rests on cached primary literature. Orthology is grounded in PANTHER PTHR14495:SF2, PAINT node PTN001025652 and a new alignment (Shld2-bioinformatics/RESULTS.md). The mouse-experimental claims come from Shld2-/- mice and CH12 cells (CSR, PMID:32558186, PMID:30046110, PMID:39227718), MEF telomere resection (PMID:30022158), TRF2ts telomere fusions (PMID:30022119) and fill-in in Brca1-deficient MEFs (PMID:35027730). ssDNA binding and the adaptor role are marked as human-ortholog inferences. All 25 GOA rows were reviewed. GO:0002208 was modified to isotype switching, the IBA GO:0010569 to GO:2000042, and the chromosome rows to site of DSB. The ND MF row was modified to the inferred ssDNA binding and adaptor activity. Actin cytoskeleton (ISO from a secondary HPA signal) was marked over-annotated.
