  summary: 'De-novo review of mouse Slc10a1 (Ntcp, O08705): all 14 seeded annotations
    reviewed, 13 ACCEPT and 1 MODIFY'
  details: |
    Reviewed all 14 GOA rows for mouse Slc10a1. Actions: 13 ACCEPT, 1 MODIFY (GO:0016020 membrane IDA from PMID:11279518 deepened to GO:0016323 basolateral plasma membrane). propagation_review blocks added to all 13 propagated rows (IBA/ISO/ISS/IEA) with donors traced from the GOA WITH/FROM column: RGD:3681 (rat Slc10a1, IDA donor), RGD:3682 and MGI:MGI:1201406 (Slc10a2 paralogs), UniProtKB:Q14973 (human SLC10A1, IDA donor), UniProtKB:Q96EP9 (SLC10A4), UniProtKB:P26435 (rat Ntcp ISS donor), PANTHER nodes PTN000040759, PTN000040761 and PTN002570905. No donor judged problematic; no CIRCULAR_OR_REDUNDANT status used since every donor annotation is experimental. One core_function (sodium-coupled bile salt import at the hepatocyte basolateral membrane). No NEW annotations: in particular the GO:0001618 virus receptor activity and GO:0046718 symbiont entry terms proposed for human SLC10A1 were explicitly NOT propagated, because mouse Ntcp binds preS1 and transports taurocholate normally but cannot support HBV or HDV infection (PMID:23678176). Deep research was unavailable in this container; literature synthesis hand-assembled in Slc10a1-notes.md with inline verbatim provenance. Cached PMID:10209268 and PMID:23678176.
