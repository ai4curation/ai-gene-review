  summary: 'Create review: Tac2'
  details: |
    De novo review of all 15 GOA rows for mouse Tac2 (P55099, preprotachykinin-B / neurokinin B), plus two proposed rows. Symbol: UniProt's primary gene name is Tac3, but the record's own MGI cross-reference and the Alliance/MGI record for MGI:98476 give the approved symbol Tac2 (name 'tachykinin 2'), which the mouse literature uses; fetched by accession so the files are certainly P55099. Actions: 10 ACCEPT (three extracellular-region rows, all three GO:0007209 rows, the GO:0007217 InterPro parent, GO:0031836 neuromedin K receptor binding and both GO:0048018 rows), 2 KEEP_AS_NON_CORE (GO:0007189 cAMP pathway, measured only for the rat receptor; GO:0031837 substance K receptor binding, which mouse pharmacology supports as a real secondary action), 3 MARK_AS_OVER_ANNOTATED (both GO:0045777 blood-pressure rows, whose rat seed is ICV NK3 agonist injection partly mediated by vasopressin, and the GO:1902093 sperm-motility ISO, contradicted for mouse by the one transcript survey of mouse sperm), 2 NEW (GO:0033686 positive regulation of luteinizing hormone secretion, IMP, after a comparator check showing mouse Kiss1 and Tacr3 both carry it; GO:0001659 temperature homeostasis, IDA, matching the companion mouse Tacr3 review). Every GOA row is a transfer: there is no experimental row on the mouse gene, so each was judged on its donor plus the mouse literature, which is substantial and cited. Three core functions, all on GO:0048018. Recorded, not acted on: GO:0031836, GO:0031837 and GO:1902093 are ISO rows whose WITH/FROM donor, human TAC3 (and the NKB chain accession rat Tac3 cites), no longer carries those terms, so the citation is stale while two of the three claims hold in mouse on independent grounds; each row carries a propagation_review with root_cause SOURCE_STALE_OR_MISSING. I could not establish why the human rows went, so, as the human TAC3 review decided, I did not file it as a source defect. Mouse-specific divergences from the human reviews are stated on the rows: NKB's action is not NK3R-exclusive in mouse (a cocktail against all three tachykinin receptors is needed to block it), the mouse null phenotype is mild and sex-specific, and intact Tac2-null males have raised basal LH pulses, which is the sign caveat on the GO:0033686 row. Not proposed: GO:0046881 FSH secretion (comparator check argues against), GO:0160041 neuropeptide activity (declined for the same reason as in the human review), and behaviour terms for the fear-memory and social-isolation work, which is in the description and the reference reviews but is whole-animal readout from region-specific manipulation. Could not verify: most cited papers are abstract-only, so experimental detail beyond the abstracts is taken on the authors' and curators' reading; no mouse experiment removes the peptide and measures temperature, which is the first knowledge gap. All 57 review quotes and all 40 notes quotes verified; just validate and just validate-quotes clean.
