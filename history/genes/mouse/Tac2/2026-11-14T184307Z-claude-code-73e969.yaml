  summary: Refresh the GO:0001659 evidence-code prose after the Tacr3 regrade
  details: |
    Review finding on PR #6363, consequential edit. The companion mouse Tacr3 GO:0001659 row was regraded from IDA to EXP in the same change. This row's evidence_type stays IDA, which is correct: its original_reference_id PMID:29996088 is chemogenetic and optogenetic activation of the peptide-releasing arcuate Kiss1 neurons with tail-skin and core temperature as the readout, and the three-receptor antagonist infusion enters only as the blocking control. Under the campaign convention that is direct manipulation, not drug exposure, so the row was checked for the same defect and does not have it.

    What was stale is the justification, which said "IDA, following that review's treatment of the same claim" and "The human TACR3 and TAC3 rows for this term use EXP instead". Both sentences became false once mouse Tacr3 moved to EXP. The reason and the matching passage in Tac2-notes.md now state the distinction on its own terms: IDA here because the sufficiency arm is optogenetic and chemogenetic with no drug, EXP on all three companion rows because their primary experiment is agonist or antagonist exposure, which ECO files as pharmacological assay evidence (ECO:0006053). No term, action, code or quote changed on any row.
