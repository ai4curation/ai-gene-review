  summary: 'Create review: Map2k2 (mouse MEK2), independent of ProtNLM2 predictions'
  details: |
    De-novo review of all 101 GOA rows for mouse Map2k2 (Q63932) as the experimentally characterised ortholog reference for human MAP2K2. Deep research failed (falcon auth, perplexity quota); built from cached publications, UniProt and a new sequence comparison (Map2k2-bioinformatics/). Orthology grounded on PANTHER PTHR47448:SF3 and PAINT node PTN000684494. MAP kinase kinase activity and ERK1/ERK2 cascade accepted as core from mouse experimental data (PMID:8297798, PMID:19219045); residue-split Rhea kinase terms and kinase activator activity modified to MAP kinase kinase activity; developmental IGI rows from Mek1/Mek2 compound mutants kept as non-core acts-upstream context; myelination, Schwann cell development and ERBB2-ERBB3 rows left UNDECIDED and flagged as probable MGI gene mis-attributions (cited papers never mention Mek2); review-only localizations left UNDECIDED. No NEW annotations.
