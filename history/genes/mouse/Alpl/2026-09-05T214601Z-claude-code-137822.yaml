  summary: 'Create review: mouse Alpl (TNAP), source ortholog for human ALPL transfers'
  details: |
    Reviewed 98 GOA annotations. Removed both GO:0140928 rows (IDA and IMP from PMID:21490328), the source of the directionally inverted transfer into human and 30+ species; the paper shows TNAP overexpression increased aortic calcification and attributes the inhibitory role to pyrophosphate. Accepted the mitochondrial, phosphoamidase, futile creatine cycle and thermogenesis rows on direct evidence (PMID:33981039) while the human equivalents stay non-core as inferences. Flagged response-to-antibiotic (PMID:2133555, no antibiotic mentioned) as undecided and a marker-enzyme citation (PMID:10787428). Three core functions. Validated with just validate mouse Alpl (0 warnings).
