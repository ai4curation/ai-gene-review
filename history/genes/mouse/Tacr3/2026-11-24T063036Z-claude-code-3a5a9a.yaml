  summary: 'IBA over-annotation re-review: sperm rows moved to KEEP_AS_NON_CORE'
  details: |
    Re-judged the IBA rows for GO:0097225 sperm midpiece and GO:1902093 positive regulation of flagellated sperm motility against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N02). The IBD at PTN002538240 is seeded in all three tachykinin receptor clades by the human rows from PMID:17437961, and mouse Tacr3 sits in the TACR3 clade with the human TACR3 seed. The earlier ground was that the mouse sperm transcript survey (PMID:12773411) found only Tacr2. The human seed study itself found no TACR1, TACR2 or TACR3 transcript in sperm that carried the proteins, so the mouse result does not set mouse apart. All six rows on the two terms (IBA, IEA, ISO) moved from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE, matching the human TACR3 review. The family review PTHR46925 still describes mouse Tacr3 as a member exception on the old ground and was not edited. Validated with just validate mouse Tacr3.
