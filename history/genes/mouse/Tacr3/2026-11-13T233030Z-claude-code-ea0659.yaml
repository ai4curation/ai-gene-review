  summary: 'Create review: Tacr3'
  details: |
    De novo review of all 60 GOA rows for mouse Tacr3 (NK3R), plus one NEW row. Every row is a transfer (IEA/IBA/ISO/ISS) from rat Tacr3 or human TACR3; no experimental GO annotation exists on the mouse gene, so each row was judged on the donor's own evidence together with the mouse literature, which was cached and quoted. Core calls: GO:0016498 and GO:0007209 accepted on direct mouse pharmacology (PMID:11226387) and the Gq-mediated slow EPSP in native arcuate KNDy neurons (PMID:27549338); GO:0033686 accepted on mouse agonist, antagonist and knockout data; GO:0007189 kept non-core (rat-only cAMP evidence, no mouse measurement). Four deliberate divergences from the human TACR3 review, all driven by mouse-specific evidence: GO:0060068 vagina development REMOVED (role conflation plus normal maturation markers in Tacr3-null and Tac1/Tac2-null mice); GO:0070474 and the ARBA parent GO:0070472 marked over-annotated (mouse uterine contraction is NK1R/NK2R-mediated); the sperm-midpiece and sperm-motility rows marked over-annotated (human-seeded, and Tacr3 transcript absent from mouse sperm); GO:0042053 kept non-core rather than over-annotated (mouse knockout loses senktide responsivity of dopaminergic neurons). One NEW row, GO:0001659 temperature homeostasis (IDA, PMID:28531316 with PMID:30753503 and PMID:29996088), after a comparator check showed the term is used for GPCRs in mouse thermoregulatory circuits while the heat-dissipation terms have no mouse annotations. Two candidate NEW rows were declined and recorded in the notes: GO:0046881 positive regulation of FSH secretion (no hypothalamic-axis gene carries it, so the absence is a convention) and GO:0007611 learning or memory (single knockout study, abstract-only cache). Could not verify: all but five cited papers are abstract-only in the cache, so experimental detail beyond the abstracts was not checked; no source defects found.
