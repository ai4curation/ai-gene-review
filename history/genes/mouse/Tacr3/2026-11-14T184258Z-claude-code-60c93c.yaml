  summary: Regrade the NEW GO:0001659 row from IDA to EXP
  details: |
    Review finding on PR #6363. The NEW GO:0001659 temperature homeostasis row carried evidence_type IDA on original_reference_id PMID:28531316, a senktide (selective NK3R agonist) administration study, while the reason argued from the Tacr3-reporter neuron ablation and the Kiss1 chemogenetic arm. The code therefore matched neither the primary reference nor the argument.

    Decision: regrade to EXP rather than promote PMID:30753503 to primary. ECO files an organism's response to a receptor agonist as pharmacological assay evidence (ECO:0006053), which sits under experimental phenotypic evidence and under neither the IDA class nor the IMP class (ECO:0000315, whose descendants cover mutation, RNAi, morpholino, antisense and over-expression but no drug); its manual-assertion form resolves to EXP. That is the same code and the same reasoning the human TACR3 and TAC3 rows already record for this term. Promoting the ablation study would not have rescued IDA: ablating a Tacr3-reporter-defined neuron population perturbs the receptor-expressing cells rather than assaying the gene product, and it is not a mutation in Tacr3 either, so it fits neither class cleanly; it would also have misrepresented a row whose summary and bulk of support are the senktide response. EXP is the honest code for a set that mixes agonist exposure, cell-population ablation and chemogenetic circuit closure.

    The reason now carries that justification, including why the two genetic arms do not make the row an IDA and why the companion mouse Tac2 row keeps IDA. The thermoregulation section of Tacr3-notes.md gains the matching bullet, which it previously lacked entirely. No term, quote, action or supporting reference changed.
