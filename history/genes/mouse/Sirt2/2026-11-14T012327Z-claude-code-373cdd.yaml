  summary: Three transfers of a muscle term from human SIRT2 left UNDECIDED, like
    their source row
  details: |
    Carried over from the review of ai4curation/ai-gene-review#6331. The three rows for negative regulation of striated muscle tissue development are transfers of a human SIRT2 row that rests on a study of Sir2 which is probably about SIRT1 (PMID:12887892) and is UNDECIDED in the human review. Studies of mouse Sirt2 itself do not show inhibition of muscle development (PMID:35636510, PMID:41904135). The transfers are judged like their source row and are now UNDECIDED; they had been KEEP_AS_NON_CORE with the reason 'less well-characterized'. Actions changed: [231] negative regulation of striated muscle tissue development (GO:0045843; IEA, GO_REF:0000107): KEEP_AS_NON_CORE -> UNDECIDED; [232] negative regulation of striated muscle tissue development (GO:0045843; ISO, GO_REF:0000119): KEEP_AS_NON_CORE -> UNDECIDED; [233] negative regulation of striated muscle tissue development (GO:0045843; ISS, GO_REF:0000024): KEEP_AS_NON_CORE -> UNDECIDED. Added to the references list: PMID:12887892, PMID:35636510, PMID:41904135. Validated with ai-gene-review validate --terms: no error and no new warning against the state before the edit.
