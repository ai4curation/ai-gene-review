  summary: New full review of mouse Efr3a (Q8BG67), independent of ProtNLM2 predictions
  details: |
    Reviewed all 18 seeded GOA rows. Accepted plasma membrane (IDA PMID:15363888, IBA, IEA, ISO) and protein localization to plasma membrane (IBA/IEA/ISO/ISS) on PTHR12444:SF1 orthology with human EFR3A and mouse-protein palmitoylation and basic-patch mutagenesis (PMID:23229899, PMID:24360784, which used mouse Efr3a cDNA BC007482). Marked SynGO synaptic vesicle priming and glutamatergic synapse (PMID:30867420) and derived presynapse IEA as over-annotated: full text shows an AD-model modifier effect, not priming or synaptic localization. Removed three MGI ISO rows (cornified envelope, protein homodimerization, cell-cell adhesion) whose donor is human CDSN (Q15517, PTHR23207), not an ortholog. Added NEW protein-membrane adaptor activity (ISS from human EFR3A, PMID:39705356). Added bioinformatics comparison (Efr3a-bioinformatics/) and notes. Deep research failed (falcon auth, perplexity quota).
