  summary: 'Alpha-lactalbumin family review: mouse Lalba'
  details: |
    Alpha-lactalbumin family batch review (human/mouse/rat plus bovine exemplar), built with one shared text per claim so actions match across species. Core function: lactose synthase specifier subunit, GO:0140767 enzyme-substrate adaptor activity contributing to GO:0004461 lactose synthase activity, in lactose biosynthetic process in the Golgi lumen; plus structural calcium ion binding. Lysozyme activity and antibacterial-defence IBAs removed (activity lost after duplication from lysozyme; antibacterial effects come from proteolytic peptides). HAMLET-derived apoptosis/signalling rows removed (in vitro oleic-acid complex). Bovine steroid-response rows marked over-annotated, matching the casein family reviews of the same explant study. enables -> contributes_to qualifier errors recorded as source defects. OpenScientist deep research used as leads and verified against primary papers.
