  details: |
    Created full curation review for mouse Accsl (UniProtKB:Q3UX83, PTHR43795:SF1). Verified conservation of Lys417, Asp380, Trp229, and substrate alpha-carboxylate-binding Arg551 (conserved across non-human mammalian ACCSL orthologs per PMID:39876065) alongside the clade-wide SF1 substitution Tyr445 at the ACCS Arg351 pocket site. Accepted GO:0005575 ND (TRUE_GAP with WHOLLY_DARK biology knowledge gap), removed stale IBA rows GO:0006520 and GO:0008483 from retired PAINT node PTN002887088, and marked unverified InterPro2GO IEA GO:0030170 as MARK_AS_OVER_ANNOTATED.
