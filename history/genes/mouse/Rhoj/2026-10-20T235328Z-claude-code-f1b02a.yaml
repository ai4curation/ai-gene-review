  summary: 'Create review: Rhoj (Q9ER71)'
  details: |
    De novo review of all 39 seeded GOA annotations for mouse Rhoj, done as the experimentally characterised ortholog reference for the human RHOJ benchmark. Falcon and perplexity-lite deep research both failed (auth/quota), so the review was written from 14 cached papers. Evolutionary grounding: PTHR24072 RhoJ subfamily shared with human Q9H4E5, and inheritance from PAINT nodes PTN000632671 (Rho root), PTN008604842 and PTN008604840 (Cdc42 lineage); RhoJ is a Cdc42 duplicate. MF: GTPase activity, GTP binding and G protein activity accepted. Two Pak1 protein-binding rows modified to protein kinase binding; WASP and Dock10 protein-binding rows removed under the protein-binding policy. Plasma membrane accepted (transferred, not measured, in mouse). Angiogenic EC-migration terms accepted with mouse knockout support (PMID:32347571). Signal transduction marked TOO_GENERAL. Endocytosis, cell polarity, cell shape and retina vasculature morphogenesis kept as non-core. No NEW terms. The notes separate mouse-experimental functions from those shown only with human RHOJ.
