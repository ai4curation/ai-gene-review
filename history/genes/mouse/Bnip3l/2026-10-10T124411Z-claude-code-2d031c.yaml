  details: |
    Completed full review of mouse Bnip3l/NIX (Q9Z2F7): all 60 GOA rows reviewed plus 3 NEW (GO:0140580 mitochondrion autophagosome adaptor activity, GO:0000423 mitophagy, GO:0043249 erythrocyte maturation) grounded in mouse Nix knockout/rescue studies (PMID:18048346, PMID:18454133, PMID:20010802, PMID:22906961). Protein-binding rows MODIFY to GO:0140580 (Atg8-family partners) or REMOVE (POSH, ATG13). Obsolete GO:1903747 MODIFY to regulation of mitophagy (obsoletion verified in QuickGO). Defense response to virus REMOVE; nucleus, nuclear speck and apoptotic mitochondrial fragmentation IBA marked over-annotated. Flagged PAINT issues: IRD for mitophagy at NIX clade node PTN002689506 and GO:0140580 placed only on the BNIP3 clade node PTN002689498. Notes file written; additional publications cached via just fetch-pmid. Validated with just validate mouse Bnip3l (no non-environment warnings). Falcon deep research was not yet available when the review was completed.
