  details: |
    Created the full review for mouse Tlr12 (Q6QNU9) in INNATE_IMMUNITY batch 1. All 7 GOA rows reviewed: GO:0002224 IBA and GO:0042832 IMP accepted; GO:0038023 IBA modified to GO:0038187 pattern recognition receptor activity (flagellin and Toxoplasma profilin are both bound directly); GO:0005886 IBA modified to GO:0005768 endosome; GO:0007165, GO:0016020 and GO:0051707 kept as non-core; one NEW row, GO:0009617 response to bacterium, whose knockout evidence and UniProt reference assignment both point to this entry. Key decision: the same Tlr11/Tlr12 literature-name inversion documented in the paralogue's review, fixed here from cloning primers in cached full texts; on that basis this entry is the receptor the literature calls TLR11 (uropathogenic bacteria, flagellin, profilin, MyD88 recruitment). The numbered pathway terms GO:0034170 and GO:0034174 are deliberately left unassigned pending a GO/MGI decision. Validation: just validate and just validate-references pass with no errors or warnings.
