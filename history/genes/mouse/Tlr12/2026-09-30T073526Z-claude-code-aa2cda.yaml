  summary: 'Cross-check review against Falcon deep research: Tlr12'
  details: |
    Compared Tlr12-deep-research-falcon.md, and also the paralogue's report, since both use the inverted literature names; the Tlr11 report is the one about this entry. Fetched PMID:26859749 (Hatai 2016), which the review had not used: it is unambiguously this entry (signal sequence M1-S21, ectodomain T22-S709 matches Q6QNU9 SIGNAL 1..21 / TOPO_DOM 22..709, not Q6R5P0's 1..30 signal), giving a fourth independent check on the naming inversion and direct evidence that one receptor binds both flagellin and profilin through different ectodomain regions. Added as supported_by on the GO:0038023->GO:0038187 MODIFY row and on the location row (flagellin recognition placed in an acidic endolysosomal compartment), with the caveat that profilin binding needs the uncleaved receptor at neutral pH. Also corrected the rodent-restricted wording (PMID:37874499) and removed the NF-kappa-B framing (PMID:24078692). No annotation action changed.
