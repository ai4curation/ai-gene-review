  summary: 'Create review: Hoxa2 (P31245), donor relative for EQUAS/HOXA2'
  details: |
    De-novo review of mouse Hoxa2 as the PTHR45664:SF3 experimentally characterised ortholog of donkey HOXA2 (A0A9L0JBM7), independent of ProtNLM2 predictions. Falcon and perplexity deep research both failed (auth 403 / quota 401), so it was built from cached GOA papers plus four added key papers (PMID:9636074, 18547144, 22223247, 25640223). All 53 GOA rows reviewed: TF activity, cis-regulatory DNA binding, Pol II regulation and nucleus accepted as core; generic DNA-binding, TF and transcription terms modified to their specific descendants; developmental processes kept as non-core; pattern specification refined to A-P pattern specification; muscle structure development and RA response left UNDECIDED. Two MGI rows cite an unrelated SV40 tumour paper (PMID:7508007), recorded as WRONG_REFERENCE source defects. Proposed NEW negative regulation of chondrocyte differentiation and regulation of neuron migration (via direct Robo2 regulation).
