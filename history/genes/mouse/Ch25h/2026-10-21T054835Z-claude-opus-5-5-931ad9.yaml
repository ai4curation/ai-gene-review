  details: |
    First review of genes/mouse/Ch25h. All 27 GOA annotations given a considered action: 18 ACCEPT, 5 KEEP_AS_NON_CORE, 1 MODIFY (GO:0008395 steroid hydroxylase activity refined to GO:0001567, which the gene already carries from the same paper), 1 TOO_GENERAL (GO:0016705, an ARBA grandparent of GO:0001567), 2 REMOVE. The two REMOVEs are deep-node IBAs of PTHR11863 (GO:0000254 C-4 methylsterol oxidase activity from PTN000221246, GO:0036197 zymosterol biosynthetic process from PTN002275159) whose seeds are all methylsterol-oxidase-branch genes; mouse Ch25h is in PANTHER subfamily PTHR11863:SF213 with human CH25H, while Msmo1 is in SF225, and the subfamily node PTN002627316 carries the cholesterol 25-hydroxylase activity instead. The committed PTHR11863 family review reaches the same conclusion for GO:0000254. Added PMID:23273844 to the publication cache as the mouse-side evidence for the type I interferon and antiviral fusion rows, which GOA carries only as transfers from human. Notes file records which functions are experimentally established in mouse versus inferred, the QuickGO comparator check for GO:0035754, the absence of any oxysterol biological-process term in GO, and the failure of falcon and perplexity-lite deep research (Edison API 403).
