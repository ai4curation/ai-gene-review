  summary: 'Create review: Nkx2-5'
  details: |
    Created the first full review of mouse Nkx2-5 (P42582). All 209 GOA annotations were reviewed against cached publications (mostly abstract-only) and UniProt; automated deep research was unavailable (falcon 402, OpenAI 401), so manual notes with inline provenance were written to Nkx2-5-notes.md. Core functions: RNA polymerase II sequence-specific DNA-binding transcription factor activity (activator and context-dependent repressor) driving cardiomyocyte differentiation, heart looping, ventricle formation and cardiac conduction system development, cooperative binding with cardiac partner TFs, and spleen development. Generic DNA/chromatin/TF-activity and protein binding rows were modified to Pol II-specific or coregulator/TF binding terms; secondary or overexpression-based phenotypes (vasculogenesis, hemopoiesis, tongue, skeletal myotube and neuron differentiation, sodium transport, canonical Wnt) were marked as over-annotated.
