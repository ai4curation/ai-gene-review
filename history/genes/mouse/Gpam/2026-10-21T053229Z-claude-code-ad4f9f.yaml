  summary: New full review of mouse Gpam (GPAT1), independent of ProtNLM2 predictions
  details: |
    Created the first review of mouse Gpam (Q61586) as the experimental reference ortholog for human GPAM (same PANTHER subfamily PTHR12563:SF16; mouse Gpam is an IBD seed of PAINT node PTN000970957). Deep research failed (falcon auth error, perplexity-lite quota), recorded in Gpam-notes.md; review built from cached papers (full text for PMID:12417724 and PMID:18522808), UniProt, PAINT and the two mouse GO-CAMs. All 60 GOA rows reviewed. ACCEPT: G3P O-acyltransferase activity (mouse knockout/knockdown assays), TAG biosynthesis, PA biosynthesis, mitochondrial outer membrane. MODIFY: mitochondrion/mitochondrial membrane to outer membrane; generic acyltransferase, lipid/phospholipid/glycerophospholipid/TAG metabolic terms to specific ones; positive regulation of TAG biosynthesis to TAG biosynthesis (enzyme, not regulator). KEEP_AS_NON_CORE: DAG, CDP-DAG and human-derived phosphatidylglycerol biosynthesis (not propagated by PAINT), acyl-CoA and fatty acid metabolism, phospholipid homeostasis. MARK_AS_OVER_ANNOTATED: knockout immune, antiviral, glucose and insulin phenotypes, response to activity, fatty acid homeostasis. REMOVE: plasma membrane (PlsB InterPro mapping), ER membrane (Reactome gene-expression event), mitochondrial inner membrane (proteomic co-isolation), positive regulation of multicellular organism growth (full text attributes weight loss to fat mass). Notes separate mouse-established functions from orthologue-inferred ones (OMM location from rat and human).
