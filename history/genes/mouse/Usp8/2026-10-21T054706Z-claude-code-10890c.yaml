  summary: 'Create review: Usp8 (mouse, Q80U87)'
  details: |
    De-novo review of all 85 GOA rows for mouse Usp8, independent of ProtNLM2 predictions, to serve as experimental reference for human USP8 (same PANTHER subfamily PTHR21646:SF27). Falcon and perplexity-lite deep research both failed (auth / quota); review based on cached literature, UniProt and PAINT data. Core functions: cysteine-type deubiquitinase at endosomes (EGFR, Eps15 substrates; endosome organization), regulation of protein stability (Nrdp1, Ras-GRF1, RTKs in knockout), 14-3-3 binding (NEW GO:0071889 from PMID:17720156/16944949), SH3 domain binding (STAM2). Protein-binding rows modified to SH3 domain binding / ubiquitin protein ligase binding or removed. Ras protein signal transduction (IBA seeded only by mouse IPI), dexamethasone/NGF response and amyloid fibril formation marked over-annotated. Flagged MGI WITH/FROM PR:P48967 (Cdc25C) on the PMID:11500497 IPI row as a likely CDC25(Mm)/Ras-GRF1 name collision. No acrosome or microtubule-binding terms added (associative evidence only; PAINT did not propagate them).
