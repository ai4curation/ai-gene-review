  summary: 'Create review: mouse Traf2 (P39429)'
  details: |
    De-novo review of all 172 GOA rows for mouse Traf2, independent of ProtNLM2 predictions, to serve as the experimental reference for TRAF2 orthologs (PTHR10131:SF21; donor at PTN002562154, PTN000805720, PTN008301857). Falcon and perplexity-lite deep research failed (auth/quota); built from cached primary literature plus seven added mouse genetics papers (PMID:9390694, 10514016, 15539150, 18313334, 18997794, 18997792, 26701909). Actions: 64 ACCEPT, 57 KEEP_AS_NON_CORE, 32 MODIFY, 13 REMOVE, 6 UNDECIDED. Generic protein-binding rows refined to receptor/ligase/kinase binding or removed as uninformative; TNF (cytokine) binding removed; general terms refined to specific terms already carried; E3 activity kept as non-core because RING dispensability and cIAP recruitment make autonomous catalysis contested. Core functions: signaling adaptor activity in TNF/CD40 signaling, TNFR binding, cIAP binding (non-canonical NF-kB control, K63 ubiquitination), MAP3K binding in IRE1-TRAF2-ASK1. No NEW terms; GO:1901223 raised as a question after a comparator check.
