  summary: 'Create review: mouse Ptk7 (Q8BKG3)'
  details: |
    De-novo review of mouse Ptk7 as the experimental reference for rat Ptk7 (same PANTHER subfamily PTHR45080:SF21), done independently of ProtNLM2 predictions. Falcon deep research failed (auth) and perplexity-lite fallback failed (quota), so the review rests on directly read primary literature (13 additional PMIDs cached). All 41 GOA rows reviewed: PCP, convergent extension and neural tube closure accepted as core; NOT kinase/RTK/ATP-binding/protein-phosphorylation accepted; organ-level phenotypes kept non-core; membrane->plasma membrane, anchoring junction->cell-cell junction, actin cytoskeleton organization->regulation of actomyosin structure organization, positive->direction-neutral regulation of canonical Wnt signaling (matching the PAINT PTN000701324 choice); cellular response to retinoic acid removed and neurite outgrowth/cytosol marked over-annotated (human screen / stale source); apical-basal polarity left UNDECIDED (abstract-only source). No MF or NEW terms asserted; Wnt co-receptor activity raised as a question because mouse auditory data show Ptk7 acting in parallel to Fz3/6.
