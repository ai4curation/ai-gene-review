  summary: New full review of mouse Olfml2a (photomedin-1), the SF29 experimental
    donor for OLFML2A orthologs
  details: |
    Created the review from the fetch-gene stub (8 GOA rows), independent of ProtNLM2 predictions. Deep research failed (falcon auth error; perplexity-lite quota), so the review rests on PMID:15836428, PMID:18757743 (both abstract-only; PMC XML blocked), PMID:22913984, the UniProt record and PANTHER/PAINT data. Grounding: PTHR23192:SF29, PAINT root PTN000573635. Actions: extracellular region IBA/IEA and ECM IDA x2 ACCEPT; ECM binding IDA ACCEPT; identical protein binding IPI MODIFY to protein homodimerization activity; signal transduction IBA UNDECIDED (root-node inference seeded from myocilin-subfamily donors); ECM organization IDA UNDECIDED (Olfml2a-specific screen result not visible, not propagated by PAINT, family review UNRESOLVED). NEW: chondroitin sulfate binding and heparin binding (IDA, PMID:15836428). Core function: chondroitin sulfate binding in extracellular matrix.
