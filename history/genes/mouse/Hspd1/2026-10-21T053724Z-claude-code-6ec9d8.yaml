  summary: 'Create full review: mouse Hspd1 (P63038), independent of ProtNLM2 predictions'
  details: |
    New complete review of mouse Hspd1, written independently of the ProtNLM2 predictions. All 177 GOA rows were reviewed (16 ACCEPT, 77 KEEP_AS_NON_CORE, 21 MODIFY, 48 MARK_AS_OVER_ANNOTATED, 4 TOO_GENERAL, 9 UNDECIDED, 2 REMOVE). Function claims are grounded in the PTHR45633 PAINT nodes: PTN000143677 for folding, PTN000143509 for the mitochondrial clade (matrix and Hsp10 binding), and PTN002900230 for the Euteleostomi immune terms, for which mouse is a seed. Mouse-specific evidence added: the null allele is embryonic lethal (PMID:20393889); cardiomyocyte deletion shows Hsp60-dependent folding after import with import itself intact (PMID:31209364); heterozygotes show MnSOD folding and complex III assembly defects (PMID:24151936, 23466696). Folding activity and Hsp10 binding are marked as inferred from human and other mammalian biochemistry. Mouse data showing that LPS-free Hsp60 does not induce IL-6, IL-12 or TNF and acts independently of TLR4 and MyD88 (PMID:18256040, 15371451) were used to mark those cytokine rows over-annotated and to remove the MyD88-dependent TLR pathway rows. Rat IEP 'response to' projections were marked over-annotated. Falcon deep research failed (authentication error; the perplexity fallback hit its quota). This is recorded in Hspd1-notes.md.
