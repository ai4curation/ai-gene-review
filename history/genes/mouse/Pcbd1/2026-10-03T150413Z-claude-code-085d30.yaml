  summary: 'Create review: mouse Pcbd1 (go-annotation#6591)'
  details: |
    De-novo review of all 31 GOA annotations, triggered by geneontology/go-annotation#6591. Core change: MODIFY GO:0004505 phenylalanine 4-monooxygenase activity (IDA, PMID:15182178) to GO:0008124 4-alpha-hydroxytetrahydrobiopterin dehydratase activity, keeping the evidence code and reference; GO:0004505 is the activity of Pah one step upstream in the BH4 cycle, and GO:0008124 carries 'pterin-4-alpha-carbinolamine dehydratase activity' as an exact synonym. Also REMOVE the collateral GO:0006571 L-tyrosine biosynthetic process (inter-ontology inference whose WITH field is GO:0004505) and the independent GO:0004505 IEA from ARBA00029278; MODIFY the bare GO:0005515 Hnf1a interaction to GO:0140297; UNDECIDED on the Pcbd1-Pcbd2 paralog interaction pending full text. Identified mouse as the root cause of the erroneous GO:0004505 on human PCBD1 (Ensembl Compara transfer out of P61458). IBA node PTN002650414 verified against the cached PTHR12599 PAINT table. No deep-research file: no provider API key configured, so the evidence base is in Pcbd1-notes.md. Validated with 'just validate mouse Pcbd1' and rendered to HTML.
    Followed up on PR #3912 review by adding direct UniProt EC 4.2.1.96 support to the GO:0004505 -> GO:0008124 MODIFY row, replacing imprecise Hnf1a-binding support with a Pcbd1-HNF1A UniProt quote and a Mendel et al. DCoH-HNF-1 alpha complex quote, and removing issue-specific prose from the dehydratase core function.
