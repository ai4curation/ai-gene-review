  summary: Repair mismatched supporting_text on three Abi2 CC rows
  details: |
    PR-shepherd pass addressing the blocking item re-raised in the #3544 reviews of 2026-09-29 and 2026-09-30: three cellular-component rows carried supporting_text that did not bear on their claim.

    GO:0005634 nucleus and GO:0005654 nucleoplasm each cited a PMID:11516653 quote about Abi-1/Abi-2b at lamellipodia/filopodia tips, which is orthogonal to a nuclear localization. The nucleus reason also misstated provenance: verified against genes/human/ABI2/ABI2-goa.tsv that GO:0005634 is IEA GO_REF:0000044 from UniProtKB-SubCell:SL-0191 (line 8), while the HPA IDA GO_REF:0000052 row (line 126) is GO:0005654 nucleoplasm. Both rows moved KEEP_AS_NON_CORE -> MARK_AS_OVER_ANNOTATED with a propagation_review (SOURCE_WEAK_OR_INFERRED / SOURCE_EVIDENCE_WEAK + COMPARTMENT_OR_COMPLEX_MISMATCH), and support replaced with the falcon deep-research localization statement plus the Echarri title showing the nucleocytoplasmic-shuttling work is on the ABI1 paralog.

    GO:0005829 cytosol (ISO, GO_REF:0000119) cited a PMID:17101133 quote establishing Abi/WAVE complex membership rather than cytosolic localization. Replaced with the PMID:21107423 membrane-recruitment statement, which is what the resting-cytosolic-pool reason actually rests on, and the falcon fractionation observation recorded as the countervailing evidence; action left as ACCEPT but the reason now scopes cytosol as a resting compartment rather than a site of action.

    Validated with just validate mouse Abi2 (passes).
