  summary: 'Create review: Cxcr3 (mouse O88410), independent of ProtNLM2 predictions'
  details: |
    De-novo review of all 62 GOA rows for mouse Cxcr3, the 1:1 ortholog of human CXCR3 in PANTHER PTHR10489:SF671, without using ProtNLM2 output. Falcon and perplexity-lite deep research failed (auth/quota), so evidence comes from 13 cached primary papers. Mouse-experimental functions: C-X-C chemokine receptor activity (CXCL10 Ca2+ flux; Cxcr3-/- T cells lose chemotaxis to CXCL10/CXCL9), T cell chemotaxis, calcium mobilisation, surface location, and mouse-specific CCL21 responses (C-C chemokine receptor/binding rows kept as non-core). New bioinformatics (Cxcr3-bioinformatics/cxcr3b_exon_search.py) shows the mouse locus has no counterpart of the human CXCR3-B N-terminal extension, so ISO rows from human CXCR3-B data were removed (adenylate cyclase-activating signalling, pos. reg. execution phase of apoptosis, pos. reg. transcription), marked as over-annotated (neg. reg. endothelial proliferation) or left UNDECIDED (neg. reg. angiogenesis). General terms were refined to C-X-C chemokine receptor activity, chemokine-mediated signalling, T cell chemotaxis and plasma membrane.
