  details: |
    Changed the GO:0042413 carnitine catabolic process IMP row (PMID:9861014) from KEEP_AS_NON_CORE to REMOVE after the RAR plant/animal triage flagged it and the PR #6301 review asked for the fix. The term names breakdown of carnitine itself, which mammals do not do. The full text of the knockout paper mentions carnitine only as long-chain acylcarnitines that accumulate when beta-oxidation is blocked: necessity, not participation. Added a verbatim quote for that. LCAD's process stays fatty acid beta-oxidation using acyl-CoA dehydrogenase (GO:0033539).
