  details: |
    Changed the GO:0042413 carnitine catabolic process IMP row (PMID:9861014) from KEEP_AS_NON_CORE to REMOVE after the RAR plant/animal triage flagged it and the PR #6301 review asked for the fix. The term names breakdown of carnitine itself, which mammals do not do. The full text of the knockout paper mentions carnitine only as long-chain acylcarnitines that accumulate when beta-oxidation is blocked: necessity, not participation. Added a verbatim quote for that. LCAD's process stays fatty acid beta-oxidation using acyl-CoA dehydrogenase (GO:0033539). After re-review, also changed both GO:0019254 carnitine metabolic process, CoA-linked rows to REMOVE: the IMP row is the same curator's annotation from the same paper (no carnitine data on the mouse; the carnitine-acyl-CoA steps are done by CPT1/CPT2/CRAT/CROT, not LCAD), and the IBA row's PAINT node PTN000856953 is seeded only by that IMP; added propagation_review.
