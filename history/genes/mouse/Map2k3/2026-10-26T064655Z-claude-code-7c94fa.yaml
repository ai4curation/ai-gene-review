  summary: 'Create review: Map2k3'
  details: |
    Created the mouse Map2k3 (MKK3, O09110) review from 48 GOA rows, with a manual literature synthesis in place of deep research. Core function is MAP kinase kinase activity toward p38 in the p38MAPK cascade, supported by the Mkk3 knockout (PMID:10097111, PMID:10202148) and MKK3b characterization (PMID:8900184). Generic kinase MF and general cascade terms were modified to MAP kinase kinase activity and p38MAPK cascade; protein kinase binding and protein binding were refined to MAPKKK, MAPK and PP2A binding; the cardiac contraction rows (activated-mutant overexpression) and transcription/protein maturation transfers were marked as over-annotated; downstream inflammatory and stress contexts were kept as non-core. No new terms were proposed.
