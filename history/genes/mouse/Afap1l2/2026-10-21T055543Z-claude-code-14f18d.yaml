  summary: 'Create review: Afap1l2 (mouse)'
  details: |
    De-novo review of mouse Afap1l2 (Q5DTU0) as the experimental reference for the AFAP1L2 SF4 ortholog clade, independent of ProtNLM2 predictions. Falcon deep research failed (auth) and the perplexity fallback hit quota, so the review was built from cached primary literature. Mouse-experimental functions recorded as NEW: actin filament binding and actin crosslink formation (IDA, PMID:27462298, mouse construct = Q5DTU0-2) and positive regulation of PI3K/AKT signaling (IMP, PMID:30667096). Protein-binding IPI with Pik3r1 modified to PI3K regulatory subunit binding; IPI with Ptprz1 removed (enzyme-substrate contact). Plasma membrane ISO modified to apical plasma membrane (mouse IDA, PMID:34470464). Positive regulation of IL-8 production removed because mouse lacks the IL8 gene (PMID:10028286). Inflammatory response and transcription regulation marked over-annotated; Src activator, SH2/SH3 binding and cytosol accepted as ortholog inferences within PTHR14338:SF4. Added a small reproducible sequence-mapping analysis in Afap1l2-bioinformatics/.
