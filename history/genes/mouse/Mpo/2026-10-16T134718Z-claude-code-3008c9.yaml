  summary: 'Create review: mouse Mpo (hypochlorous acid obsoletion follow-up)'
  details: |
    Full review of mouse Mpo (P11247), 84 GOA rows, as the in-repo slice of issue #4098 (hypochlorous acid obsoletion follow-ups). Established that GO has no MF term for the myeloperoxidase reaction (chloride + H2O2 + H+ = hypochlorous acid + H2O, EC 1.11.2.2, RHEA:28218 - the issue's RHEA:43232 is isatin hydrolase): GO:0016691 is EC 1.11.1.10 organic chlorination and GO:0140825 is lactoperoxidase activity, so GO:0004601 peroxidase activity (narrow synonym 'myeloperoxidase activity'; Reactome xrefs for MPO-dependent HOCl production) is accepted as the most precise existing term and a child term is proposed, modelled on GO:0036393 thiocyanate peroxidase activity. Two core functions: HOCl-forming peroxidase activity in azurophil granule/phagosome/extracellular region, and non-catalytic nucleosome destabilization (GO:0140776) driving chromatin decondensation for NET formation. REMOVE on the lone HDA mitochondrion row (PMID:14651853, high-throughput co-purification); MODIFY lysosome, secretory granule and cytolytic granule to azurophil granule; MARK_AS_OVER_ANNOTATED on respiratory burst, removal of superoxide radicals, response to oxidative stress, the rat-derived response-to-stimulus rows and positive regulation of cholesterol import; TOO_GENERAL on immune effector process and neutrophil-mediated killing of symbiont cell; the NOT GO:0050830 row accepted on the normal S. aureus clearance in the knockout. Also confirmed from the fresh GOA and from QuickGO that neither mouse nor rat Mpo still carries GO:0002149. Validated with just validate mouse Mpo (passes; propagation_review added to the three flagged ISO rows).
