  summary: 'Create review: Dynlt2b'
  details: |
    De-novo review of mouse Dynlt2b (Q9CQ66), independent of ProtNLM2 predictions, as the experimentally characterised reference for transfer to human DYNLT2B (same PANTHER subfamily PTHR21255:SF7). Deep research failed (Falcon 403 auth; perplexity-lite timeout), so built from cached full text of PMID:39827215 (mouse KO/knock-in) plus human ortholog papers. All 22 GOA rows reviewed: dynein-2 membership and dynein intermediate chain binding accepted with mouse co-IP support; retrograde IFT accepted as inferred from human; regulation-of-retrograde-IFT and microtubule-based movement modified to intraciliary retrograde transport; cilium assembly modified to sperm flagellum assembly (comparators Ift81, Bbs4, Dnali1); dynein axonemal particle left UNDECIDED. NEW: sperm flagellum, manchette (IDA), dynein light chain binding (IPI). Inner dynein arm membership not asserted; raised as a question.
