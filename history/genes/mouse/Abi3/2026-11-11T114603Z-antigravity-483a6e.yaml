  details: |
    Created full curated review for mouse Abi3/Nesh (Q8BYZ1, PTHR10460:SF7; 40 GOA annotations: 17 ACCEPT, 1 MODIFY, 17 KEEP_AS_NON_CORE, 2 MARK_AS_OVER_ANNOTATED, 2 REMOVE, 1 UNDECIDED) harmonized with human ABI3 and PTHR10460. Removed the defective MGI ISO positive regulation of protein tyrosine kinase activity (GO:0061098) annotation transferred without negation from human ABI3 (PMID:17101133), removed the mis-attributed ARUK-UCL IDA defense response to tumor cell (GO:0002357) row citing human carcinoma cell-line study PMID:21223585 with a structured WRONG_GENE_PRODUCT source_defects entry while cross-referencing the orthology-projected GO:0002357 IEA/ISO rows as MARK_AS_OVER_ANNOTATED, documented why sign-neutral GO:0030334 (regulation of cell migration, IBA/ISO) is retained as ACCEPT rather than refined to GO:0030336 (because directional motility suppression in PMID:11956071 and PMID:26428302 derives exclusively from forced overexpression while endogenous loss-of-function migration directionality remains unestablished), captured Abi3's attenuation of WAVE2 membrane translocation and lamellipodia formation (PMID:26428302), differentiated IEA vs ISO vs ISS propagation channels across sibling rows, and audited title-only PMID:18480067 (GO:0005515 IPI, GO:0030027 IDA) and abstract-only donor PMID:17101133 (GO:0030027 IEA/ISO) with UNVERIFIED reference_review and explicit curator-deference notes.
