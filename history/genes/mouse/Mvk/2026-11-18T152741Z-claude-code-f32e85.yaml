  summary: 'Create review: Mvk (Mus musculus)'
  details: |
    Reviewed all 51 GOA rows for mouse mevalonate kinase (Q9R008) against mouse primary literature (Mvk+/- and CRISPR hypomorph mice, Pex5-/- liver enzyme assays), the rat and human source papers behind the ISO/ISS rows, the PTHR43290 PAINT nodes and the MGI GO-CAM models. Catalytic, cytosol and IPP-pathway rows accepted; cholesterol and GGPP biosynthesis kept as non-core; the three peroxisome rows marked over-annotated (rat-only, disputed source; no mouse evidence); rat LRBP mRNA-binding kept non-core with mRNA binding modified to sequence-specific mRNA binding; zymosterol, translation-repression and inflammation rows marked over-annotated. Recorded a cohort GO-CAM source defect (pathway-edge papers on other genes exported as IMP/IDA rows to Mvk, Pmvk and Mvd) and a UniProt CHECK on the by-similarity peroxisome location. Validated with just validate (schema, terms, references) after backfill-record-sections.
