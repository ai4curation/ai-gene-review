  summary: 'IBA over-annotation re-review: GO:0140359 to REMOVE, GO:0016323 to KEEP_AS_NON_CORE'
  details: |
    Re-judged two IBA rows against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N02). GO:0140359 ABC-type transporter activity: IBD at the family root PTN009085477; the CFTR clade PTN002795422 holds no seed and carries its own IBD for intracellularly ATP-gated chloride channel activity, and the term requires transport driven by ATP hydrolysis, so the IBA row and the InterPro IEA row on the same term moved from MARK_AS_OVER_ANNOTATED to REMOVE, matching the human CFTR review (PAINT fix: loss on PTN002795422). GO:0016323 basolateral plasma membrane: the IBD at PTN002384279 has four seeds, one of them rat Cftr (RGD:2332, IDA PMID:16575514, immunohistochemistry of bile duct brush cells), so the earlier reading that the term was an ABCC4 property was wrong on the tree; the IBA row and the ISO row moved to KEEP_AS_NON_CORE, matching human CFTR. The UniProt apical-membrane quote was dropped from those two rows. Validated with just validate mouse Cftr.
