  summary: 'Create review: Kiss1r'
  details: |
    De novo review of all 43 GOA rows for mouse Kiss1r (Q91V45) plus one proposed annotation, kept consistent with the ortholog review in genes/human/KISS1R unless mouse evidence differed. Core MF is GO:0008188 neuropeptide receptor activity (no kisspeptin-specific GO term exists); GPCR activity, peptide receptor activity, neuropeptide binding, generic membrane, signal transduction, GPCR signalling, hormone secretion and ARBA transport rows are TOO_GENERAL beside it. GO:0003254 regulation of membrane depolarization (IDA) was MODIFYed to GO:1904181 positive regulation of membrane depolarization, which human GOA already carries separately but mouse does not; the bare Kiss1 protein-binding IPI was removed under the protein-binding policy; the rat-derived arachidonate-secretion and stress-fibre ISO rows and the molecular-adaptor IDA row were marked over-annotated; GO:0045671 negative regulation of osteoclast differentiation was proposed as NEW from direct mouse loss-of-function data, closing an asymmetry with human, which holds the term by similarity to this mouse gene. just paint-losses reports Q91V45 is not a leaf of PTHR45695, so no IRD/IKR could be checked. Most cited mouse papers are abstract-only in the cache (full text available for PMID:18483150, PMID:38346942, PMID:28154160); PMID:18434521 and PMID:23744639 do not state the species in their abstracts, so the species attribution follows UniProt's experimental evidence line on this entry rather than my own reading. Validation: schema, terms, references and quote_check clean (90 quotes verified); the two residual warnings are uv deprecation notices from subprocess stderr, not content findings.
