  summary: Create mouse Cdh22 review; add perisomatic inhibitory-synapse adhesion
    role downstream of FEZF2 (Kroon et al. 2026)
  details: |
    De-novo review of mouse Cdh22 (Q9WTP5), 19 GOA rows (all IBA/IEA/ISO - generic cadherin biology). Added NEW GO:0098982 (GABA-ergic synapse, located_in, IDA) and GO:1904862 (inhibitory synapse assembly, involved_in, IMP) for CDH22's role as the FEZF2 downstream effector that is necessary for PV+ perisomatic inhibitory synapses onto L5 ET neurons. Marked the glutamatergic-synapse IEA (GO:0098978) MARK_AS_OVER_ANNOTATED (unvetted ARBA prediction; demonstrated role is inhibitory). Cited by DOI:10.1038/s41593-026-02515-6.
