  summary: 'Create review: Irak3 (mouse)'
  details: |
    De-novo full review of mouse Irak3 (Q8K4B2), done independently of the ProtNLM2 predictions as the experimental reference ortholog for human IRAK3. Deep research failed (falcon auth, perplexity quota), so the review relies on cached primary literature. All 91 GOA rows were reviewed. Kinase activity, Mg binding, protein phosphorylation and autophosphorylation are REMOVED: mouse Irak3 is a pseudokinase (CGN/Asn-306 in place of HRD, DFA loop; see Irak3-bioinformatics/RESULTS.md) in the same PANTHER 19.0 subfamily PTHR24419:SF7 as human IRAK3. Protein binding rows are refined to protein kinase binding (IRAK4) and ubiquitin protein ligase binding (TRAF6), and the PIN1 row is removed. The apoptosis RCA rows are removed. General regulatory terms are refined to p38MAPK, IL-1-mediated and MyD88-dependent TLR terms. The core functions are TLR/IL-1R negative feedback at the MyD88-IRAK4 complex and IRAK-M Myddosome signaling, both shown experimentally in mouse.
