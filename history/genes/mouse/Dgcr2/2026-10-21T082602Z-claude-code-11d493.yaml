  summary: 'Create review: Dgcr2'
  details: |
    De-novo review of mouse Dgcr2 (P98154), the experimental donor for PAINT node PTN000391897 (PTHR15256:SF6) used as reference for DROME/CG42404; independent of ProtNLM2 predictions. Falcon and perplexity-lite deep research failed (auth errors), so literature was gathered from PubMed and cached. Three membrane rows (IBA/IDA/IEA) MODIFY to plasma membrane; response to xenobiotic stimulus (PTZ expression change) and cognition (ISO from a human IMP resting on a single-case CNV also spanning HLA-DRA; source defect recorded) MARK_AS_OVER_ANNOTATED. NEW: postsynaptic density (IDA, mouse brain fractionation), dendritic spine development (IMP, mouse in vivo knockdown and mutant mice), cell adhesion molecule binding (ISO from human DGCR2-NRXN1 trans binding, PMID:37480133). Reelin/neuron migration and behavioural phenotypes not annotated.
