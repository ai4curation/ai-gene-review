  details: |
    Reviewed all 36 GOA rows for mouse diphosphomevalonate decarboxylase (Q99JF5) against mouse data (purified liver MPD kinetics and homodimer, B16F10 fractionation and digitonin permeabilisation, statin induction, epidermal conditional knockout and F250S knock-in, Pex5-/- liver enzyme assays), the rat and human source papers behind the ISO/ISS rows, the PTHR10977 PAINT node and the MGI GO-CAM models. Catalytic, cytosol, cytoplasm and IPP-pathway rows accepted; homodimerization and cholesterol/GGPP biosynthesis non-core; carboxy-lyase activity too general; the two rat-derived peroxisome and peroxisomal-matrix ISO rows removed (contradicted by mouse cytosol-only data; MGI DELETE_ROW defects); Hsp70 binding, proliferation and zymosterol rows over-annotated. Validated with just validate after backfill-record-sections; all quotes verified with quote_check.
