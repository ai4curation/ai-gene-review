  summary: 'Create review: mouse Gpat2 (Q14DK4)'
  details: |
    De-novo review of mouse Gpat2 as the experimentally characterised GPAT2 reference (PTHR12563:SF15, below PAINT node PTN000970957) for HORSE/donkey GPAT2 ortholog transfer; independent of ProtNLM2 predictions. Falcon deep research failed (Edison 403 auth) and the perplexity-lite fallback failed, so literature was gathered by PubMed search and the mouse primary papers cached (PMIDs 17013544, 22285183, 26268560, 28729426, 30951587, 18658143). All 26 GOA rows reviewed: GPAT activity, outer-membrane location, PA and TAG biosynthesis accepted; AGPAT activity kept as non-core (crude-membrane evidence the authors could not attribute directly); mitochondrion, lipid/glycerophospholipid metabolic process and generic acyltransferase terms modified to specific descendants; bare protein binding (PIWIL2 IPI) removed per policy; piRNA processing refined to primary piRNA processing (GO:0140990), noting the role is catalysis-independent, GPAT2-specific and not propagated by PAINT. No NEW terms: transposon silencing, spermatogenesis and germ-cell apoptosis are downstream phenotypes. Two core functions written (GPAT enzyme; catalysis-independent primary piRNA processing).
