  summary: 'Create review: mouse Oma1 (reference ortholog for human OMA1)'
  details: |
    De-novo review of all 67 GOA rows for Q9D8H7, independent of ProtNLM2 predictions. Deep research failed (falcon auth error; perplexity-lite quota), so the review rests on cached primary literature (Ehses 2009, Quiros 2012, Baker 2014, Zhang 2014, Anand 2014, Bohovych 2015, Korwitz 2016, Murata 2020, Qiu 2023) and the curated UniProt record. Metalloendopeptidase activity, OPA1 S1 processing, negative regulation of fusion, autoprocessing and inner-membrane location accepted as experimentally established in mouse; DELE1/HRI-ISR rows accepted as orthology transfers from human OMA1 (same PTHR22726:SF1, shared PTN000506393/4). Thermogenesis, energy homeostasis, lipid/glucose metabolism, respiratory chain assembly, inner-membrane fusion, mitophagy, translational initiation and protein localization rows marked over-annotated as downstream phenotypes; broad location/process rows modified to inner membrane, mitochondrial protein processing, negative regulation of fusion, regulation of cristae formation and ISR signaling.
