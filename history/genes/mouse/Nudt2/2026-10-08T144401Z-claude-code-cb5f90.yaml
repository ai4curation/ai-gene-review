  summary: New review of mouse Nudt2 (Ap4A hydrolase)
  details: |
    De novo review of all 10 GOA rows for mouse Nudt2 (P56380). Accepted asymmetrical Ap4A hydrolase activity (IBA, IEA, 2x ISS) and the parent IEA; MODIFY generic hydrolase activity to GO:0004081. Marked AMP and ATP biosynthetic process IBAs (PTN000482012, seeded only by worm ndx-4) as over-annotated, consistent with genes/worm/ndx-4. Removed the ISS apoptotic process transferred from ndx-4 (speculative statement in a structure paper). Kept HDA mitochondrion (MitoCarta) as non-core. Proposed NEW diadenosine tetraphosphate catabolic process (GO:0015967). In vitro RNA decapping (m7G, dpCoA, FAD caps; PMID:23353937, PMID:32432673) and human NUDT2 disease/decapping data (PMID:38141063) recorded in description and suggested questions; no decapping term proposed. OpenScientist deep research incorporated.
