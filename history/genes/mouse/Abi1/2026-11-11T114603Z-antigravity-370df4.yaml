    Created full curated review for mouse Abi1 (Q8CBW3, PTHR10460:SF2; 49 GOA annotations: 26 ACCEPT, 9 MODIFY, 12 KEEP_AS_NON_CORE, 2 REMOVE) covering WAVE2 regulatory complex assembly/stability and C-terminal SH3 scaffolding of Sos1/Sos2 and postsynaptic ProSAP2/Shank3 (GO:0035591, PMID:11003655, PMID:17304222, PMID:21482783, with core_functions[0] quotes focused on complex assembly/stability and effector binding), polyproline/PxxDY binding to partner SH3 domains of Eps8, c-Abl, and TOCA-1 (GO:0017124; noting mammalian conservation from human ABI1 in vitro TOCA-1 SH3 binding and co-immunoprecipitation assays in PMID:19798448 with direct SH3-binding quotes and brain Eps8 co-immunoprecipitation in PMID:19564905), c-Abl tyrosine kinase co-activation across GO:0030296 (MGI IDA on abstract-only PMID:12672821) and GO:0061098 (MGI ISO from human PMID:17101133, paired solely in core_functions[2].directly_involved_in; ACCEPT, NO_FAILURE_CORE with row-tailored curator deference while noting substrate-selective Mena/WAVE2 promotion, Y213-dependent inhibition of nonmyristoylated c-Abl by coexpressed full-length wild-type human ABI1 in human LNCaP cells in PMID:18328268, and mouse Abi2 for future family-level harmonization), live-cell TIRF grounding of Abi1-YFP at protruding lamellipodia tips in murine B16F10 cells on GO:0031252 (PMID:19200726 Fig. 1A / Movie S1), channel-differentiated IEA vs ISO rationales, explicit abstract-only curator deference and on-topic supporting quotes across MGI IDA/IMP/IPI rows (PMID:12672821, PMID:15755804, PMID:16831833, PMID:25297099), and GO:0005737 -> GO:0005829 / GO:0043005 -> GO:0030426+GO:0043197 refinements harmonized with human ABI1, rat Abi1, and PTHR10460.
