  summary: 'Cross-check review against Falcon deep research: Tlr11'
  details: |
    Compared Tlr11-deep-research-falcon.md with the completed review. The report is written around the literature receptor names, which are inverted relative to the MGI/UniProt symbols, so most of its content (Hatai flagellin/profilin binding, MIC3, testis expression) belongs to the paralogue and was cross-filed there. No annotation action changed. Two narrative corrections, each verified in a cached primary paper: the pair is not rodent-restricted (PMID:23246311 records TLR12 sequences in rodents, horses and lemurs; PMID:37874499 sequences equine TLR11 and TLR12 cDNAs), and the IL-12 route is MyD88/IRF8-dependent and NF-kappa-B-independent in dendritic cells (PMID:24078692), against NF-kappa-B activation reported in PMID:23246311. Edited description, the GO:0002224 summary, the core-function description, added one supported_by quote and one suggested question about the transcriptional route. Falcon file deliberately not cited as annotation support because its gene-name mapping is inverted.
