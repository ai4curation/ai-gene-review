  summary: 'Create review: Tlr11'
  details: |
    Created the full review for mouse Tlr11 (Q6R5P0) as part of INNATE_IMMUNITY batch 1 (Toll/TLR axis). Reviewed all 8 GOA rows: GO:0002224 IBA accepted; GO:0038023 IBA modified to GO:0038187 pattern recognition receptor activity (direct profilin binding); GO:0005886 IBA modified to GO:0005768 endosome (PAINT donors are surface TLRs, this branch is UNC93B1-dependent and endolysosomal); GO:0007165, GO:0016020 and GO:0051707 kept as non-core; GO:0009617 IMP and the GO:0005515 FliC IPI left UNDECIDED, and one NEW annotation added, GO:0042832 defense response to protozoan. Key decision: the literature names of Tlr11 and Tlr12 are inverted relative to the MGI/UniProt symbols, established here from cloning primers and open-reading-frame accessions quoted in three cached full texts plus MGI's own allele note, so literature TLR12 = Q6R5P0 and literature TLR11 = Q6QNU9; the two numbered GO pathway terms (GO:0034170, GO:0034174) are therefore not assigned to either entry and the question is raised for GO/MGI. Validation: just validate and just validate-references both pass with no errors or warnings.
