  summary: 'Create review: Gprc5c'
  details: |
    Full review of mouse Gprc5c (Q8K3J9) for the RAR_MISANNOTATION project. All 16 GOA rows reviewed. The Wei et al. 2020 flag on GO:0005118 sevenless binding holds: IPR002956 is the Drosophila Bride-of-sevenless PRINTS family (PR01223); among Swiss-Prot entries it matches only fly BOSS and mouse Gprc5c, on TM1/TM6 segments, and not human GPRC5C. BOSS binds Sevenless via a large extracellular region that GPRC5 receptors lack, and no evidence links GPRC5C to ROS1 (whose mammalian ligand is NELL2), so sevenless binding and visual perception (same InterPro2GO) were REMOVEd. Core functions: orphan class C GPCR activity at the plasma membrane (hyaluronic acid-GPRC5C signalling maintaining HSC dormancy) and heterodimerization with AT1/EP2/IP. Added NEW negative regulation of HSC proliferation and G protein-coupled receptor binding; reproducible InterPro check in Gprc5c-bioinformatics/.
