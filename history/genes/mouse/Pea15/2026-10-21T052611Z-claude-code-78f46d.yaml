  summary: 'Create review: Pea15 (mouse, Q62048)'
  details: |
    De-novo review of mouse Pea15, the experimental donor for the human PEA15 IBA (PTHR48169:SF1, PTN008298780), independent of ProtNLM2 predictions. Falcon deep research failed (authentication error; perplexity-lite fallback also failed), so the review used 20 cached publications. All 17 GOA rows reviewed: GO:1902042 rows accepted (mouse IDA and Pea15-null astrocyte TNF data); MAPK cascade and intracellular signal transduction modified to regulation of ERK1 and ERK2 cascade; cytoplasm modified to cytosol; apoptotic process and regulation of apoptotic process modified to GO:1902042; PKC binding and microtubule associated complex marked over-annotated; glucose import transfers and the TNFR1-positive IDA kept as non-core. Added NEW GO:0042308 and GO:0140311 from mouse loss-of-function and co-IP evidence for cytoplasmic ERK sequestration. Notes distinguish mouse-established from ortholog-inferred functions.
