  details: |
    Re-review of the REMOVE actions in the mouse and rat gene reviews (14 November 2026), under the rules of the human REMOVE re-review; the pass and its rules are described in projects/MOUSE_GENES_RE_REVIEW/REMOVE_RE_REVIEW.md, and every changed row is listed with its rule in projects/MOUSE_GENES_RE_REVIEW/remove_rereview_changes.yaml. Actions changed: [295] protein phosphorylation (GO:0006468; IMP, PMID:16025111): REMOVE -> MARK_AS_OVER_ANNOTATED. The row had been removed because APP is not a kinase, but its qualifier is acts_upstream_of_or_within and the observation is real: in the cited study dephosphorylation of the NMDA receptor subunit NR2B at Tyr1472 went with the receptor endocytosis that amyloid-beta promotes. The term has the direction wrong and overstates the part of APP, so the row is marked as an over-annotation; an experimental row that records a real observation is not removed as false. The two other rows from the same study are accepted in this review. A quote from the abstract was added. Validated with ai-gene-review validate --terms: no error and no new warning against the state before the edit.
