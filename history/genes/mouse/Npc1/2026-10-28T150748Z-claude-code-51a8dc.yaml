  summary: 'Create review: Npc1'
  details: |
    De-novo review of mouse Npc1 (O35604): all 107 GOA rows adjudicated (32 ACCEPT, 26 KEEP_AS_NON_CORE, 21 MARK_AS_OVER_ANNOTATED, 19 MODIFY, 5 REMOVE, 4 UNDECIDED). Core functions are cholesterol transfer activity (GO:0120020) and cholesterol binding (GO:0015485) at the lysosomal/late endosomal membrane, feeding intracellular cholesterol transport, lysosome-to-ER cholesterol transport, cholesterol homeostasis and negative regulation of TORC1 signaling via SLC38A9. Correct-but-general terms (lipid carrier activity, sterol transport, cholesterol transport, intracellular lipid transport, membrane, endosome, lysosomal transport, cytoplasmic side of lysosomal membrane) were MODIFYed to the specific terms the gene already carries, while the root-organelle rows (lysosome, ER, Golgi) were kept per projects/ORGANELLES.md. Phenotype-derived process terms from the Npc1-null mouse (gene expression, programmed cell death, neurogenesis, sterol metabolic process, endocytosis, adult walking behavior, cyclodextrin metabolic process, liver development) were marked over-annotated with source_defects raised against MGI; the engineered-construct extracellular-region row and the substrate-not-participant glycoprotein-biosynthesis propagations were removed with source_defects against UniProt; rat-sourced cadmium and epithelial-apoptosis propagations were left UNDECIDED as unresolvable. No NEW rows were added. Literature work was done by hand (no deep-research provider available) and written to Npc1-deep-research-manual.md and Npc1-notes.md.
