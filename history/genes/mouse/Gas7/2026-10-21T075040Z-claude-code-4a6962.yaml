  summary: 'Create review: Gas7'
  details: |
    De-novo review of mouse Gas7 (Q60780) as experimental reference for the PTHR23065:SF57 ProtNLM2 cohort (fugu A0A674PKV4); ProtNLM2 output not consulted. Falcon and perplexity-lite deep research both failed; review built from cached literature (PMID:9736752, 11795944, 20150425, 31628328, 15725398), UniProt and PANTHER/PAINT files. Accepted actin binding/polymerization/bundling, ruffle, actin filament, plasma membrane, cytoplasm and neuron projection morphogenesis (IMP + IBA from PTN001890901, seeded by this gene); kept cell shape, neuron differentiation and identical protein binding as non-core; marked the four FCHO-seeded clathrin IBA rows (PTN000552124) as over-annotated because GAS7 lacks the muHD and forms flat sheets. Added NEW phagocytosis, phagocytic cup, growth cone, phospholipid binding and positive regulation of Arp2/3 actin nucleation from mouse experimental data. Noted that only neuron projection morphogenesis is PAINT-propagated to chordate GAS7; actin and phagocytosis functions are mouse-experimental.
