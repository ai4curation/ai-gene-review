  summary: 'Full re-review: Vmn2r73 A0A3B2WCZ5 alternative product'
  details: |
    Full re-review independent of function predictions. Confirmed A0A3B2WCZ5 (496 aa) is the product of non-canonical transcript Vmn2r73-203: identical to canonical D3Z7M3 (851 aa) over 1-429, retains signal peptide, VFT and nine-cysteine domain, lacks all seven TM helices. Rewrote the bioinformatics script to read the target sequence from the UniProt record and added a hydrophobicity scan. GPCR activity REMOVE for this product; GPCR signaling, plasma membrane and membrane MARK_AS_OVER_ANNOTATED (soluble ectodomain predicted). Rewrote the description to cover gene and product; placed in rodent-specific PANTHER SF413 (Vmn2r66-79 clade) with no characterised member; nearest characterised relative Vmn2r116 (SF398) noted, its ligand not transferred. Dropped the ProtNLM source file reference.
