  summary: 'Full re-review: Spcs2 A0A140LHW5 (74-aa exon-3-skipping splice product)'
  details: |
    ProtNLM2 benchmark re-review, done without the ProtNLM predictions. Mapped A0A140LHW5 to Ensembl Spcs2-206: exon 3 is skipped and an internal exon-4 acceptor is used, so the product keeps residues 1-66 of canonical Q9CYN2, then has an 8-residue frame-shifted tail, and lacks both TM helices and the C-terminal domain. GOA is empty. No core functions asserted, because complex membership and ER-membrane location need regions this product lacks. Rewrote the description; removed the citation of the ProtNLM source JSON; the sequence-mapping script now reads Spcs2-uniprot.txt and Ensembl exon structures; added a BIOLOGY knowledge gap and experiments. Relative: human SPCS2 Q15005 (PTHR13085:SF0, ortholog of Q9CYN2), already reviewed.
