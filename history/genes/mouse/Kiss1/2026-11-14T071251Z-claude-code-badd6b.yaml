  details: |
    Re-decided the general-term rows under the maintainer rule now in CLAUDE.md (MODIFY only when the row's own evidence supports a deeper term). One row changed: GO:0007186 G protein-coupled receptor signaling pathway (IDA, PMID:12359743) stays MODIFY, with GO:0007218 neuropeptide signaling pathway added beside GO:0007200, because the paper shows the pathway initiated by the KiSS1 peptide, the receptor's endogenous ligand; the earlier reason had declined GO:0007218 because the assay was in transfected cells, which is inconsistent with the kisspeptin receptor reviews accepting neuropeptide terms from heterologous-cell assays. Left unchanged: the IBA row (MODIFY to GO:0007200 and GO:0007218, which the PTHR16955 family review records as holding family-wide) and GO:0032278 positive regulation of gonadotropin secretion (ISO, ACCEPT; the human donor currently has no row to trace, and the term also covers the FSH arm).
