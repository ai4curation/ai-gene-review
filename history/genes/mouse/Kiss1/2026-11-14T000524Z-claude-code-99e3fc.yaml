  summary: 'Create review: Kiss1'
  details: |
    First review of mouse Kiss1 (Q6Y4S4). All 27 seeded GOA rows reviewed plus one NEW row. Actions: 14 ACCEPT, 8 KEEP_AS_NON_CORE, 3 MODIFY, 2 MARK_AS_OVER_ANNOTATED, 1 NEW, and no REMOVE, TOO_GENERAL or UNDECIDED. Core function: receptor ligand activity (GO:0048018) of the secreted amidated kisspeptins on Kiss1r, acting in the extracellular region and driving GO:0007200, GO:0007218, GO:0033686 and GO:0060112. Decisions worth noting: the bare protein-binding IPI against Kiss1r is MODIFIED to GO:0031773 rather than removed, as in the human KISS1 review, because the ligand side has a specific partner-binding term; GO:0032278 positive regulation of gonadotropin secretion is ACCEPTED rather than treated as a redundant parent of GO:0033686, because mouse pharmacology and genetics demonstrate the FSH arm specifically (a deliberate divergence from the human review, which had no such row); both GO:0007186 rows are MODIFIED to GO:0007200 and GO:0007218; rat-derived ISO rows for apical plasma membrane and growth-hormone secretion are MARKED_AS_OVER_ANNOTATED (secretory-pole immunostaining and a high-concentration pituitary culture effect, neither with mouse data); and GO:0045671 negative regulation of osteoclast differentiation is added as NEW from the osteoclast-lineage Kiss1 deletion, mirroring the mouse Kiss1r review. The human review's placental core function is deliberately not carried over: mouse placental expression is negligible and mutant placentas are normal (PMID:25468546). Not verified: full text of 18 of 23 cited papers (abstract-only in the cache), the erratum PMID:39702286 to the bone study, and the species of PMID:15375028, which is why the recorded UniProt evidence-code source defect names only PubMed:15486019. just paint-losses reports no IRD or IKR on this lineage.
