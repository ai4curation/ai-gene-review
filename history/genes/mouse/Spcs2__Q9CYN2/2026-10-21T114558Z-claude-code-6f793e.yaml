  summary: 'Create review: Spcs2 canonical product Q9CYN2'
  details: |
    De-novo full review of canonical mouse Spcs2 (Q9CYN2), the same-gene canonical relative of the 74-aa fragment A0A140LHW5 in genes/mouse/Spcs2; written independently of ProtNLM2 output. Deep research failed (falcon auth error; perplexity-lite quota), so the review uses cached literature (PMID:34388369, 42173868, 39565596, 10921929, 8910564, 8632014) and UniProt. Evolutionary grounding: Q9CYN2 is in PTHR13085:SF0 with human Q15005, dog Q28250 and yeast Q04969, under PAINT node PTN000317824. All 12 GOA rows reviewed: SPC membership, ER membrane and protein processing ACCEPTed; membrane MODIFY to ER membrane; protein maturation (IBA, IEA) MODIFY to protein processing; protein targeting to ER (IBA) MARK_AS_OVER_ANNOTATED, since the SPC processes already-targeted chains. No NEW annotations; no function is experimentally established in mouse beyond proteomic detection.
