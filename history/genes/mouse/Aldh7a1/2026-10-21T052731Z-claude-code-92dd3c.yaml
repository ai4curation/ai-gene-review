  summary: New full review of mouse Aldh7a1, separating mouse-experimental functions
    (AASA dehydrogenase, lysine catabolism, mito/cytosol/nucleus) from human-inferred
    ones
  details: |
    New review of all 57 seeded GOA annotations (66 GOA rows), written without ProtNLM2 input. Deep research failed (falcon auth error; perplexity-lite quota), so it rests on cached primary literature. PMID:20207735 was re-fetched and now has full text, including mouse fractionation and IHC data.
    Accepted as mouse-experimental: GO:0004043 and GO:0019477 (KO mice, PMID:32969477 and PMID:39661514); mitochondrion and mitochondrial matrix; cytosol; nucleus (non-core).
    Inferred by orthology (88% identity, conserved catalytic E296/C330, shared PAINT node PTN000192435 despite the PANTHER 19.0 SF1 mouse vs SF5 human split): GO:0004029 (core), GO:0008802, GO:0052814, GO:0042802 (non-core).
    Bioinformatics (Aldh7a1-bioinformatics/): human AMPK phosphosite Ser130 is Arg130 in mouse and rat. Golgi and plasma membrane are kept only as non-core inferences. The COPI/energy-homeostasis/ferroptosis regulation ISO rows are marked over-annotated for mouse; PAINT also omitted them.
    Removed: GO:0016655 (quinone reduction is FSP1's activity) and three plain transport process terms (ALDH7A1 inhibits transport, it does not perform it). MODIFY GO:0009063 to GO:0019477 and GO:0016491 to GO:0004043/GO:0004029.
