  summary: 'Create review: mouse Cacnb3 (P54285)'
  details: |
    De-novo review of mouse Cacnb3, intended as the experimental reference for the human CACNB3 ortholog. Independent of ProtNLM2 predictions. Deep research failed (falcon auth error; perplexity-lite quota), so the review was built from cached primary literature: mouse beta3 knockout studies and the rat source papers behind the ISO/ISS rows. Added a bioinformatics check confirming that mouse, rat and human Cacnb3 share PANTHER PTHR11824:SF8 (99.2% identity) and that the paralogs sit in other subfamilies. All 51 seeded rows reviewed. Enables-channel-activity rows changed to calcium channel regulator activity; the contributes_to row accepted. Generic protein binding changed to transmembrane transporter binding. General transport and membrane terms refined. Rat-derived rows removed for regulation of membrane hyperpolarization (a misread inactivation shift) and for pain/touch detection (phenotype, sign inverted). Repolarization, negative regulation and EPSP rows marked as over-annotations; protein kinase binding left UNDECIDED. Core functions: HVA calcium channel regulation and alpha1 binding/surface delivery, both established in mouse by knockout.
