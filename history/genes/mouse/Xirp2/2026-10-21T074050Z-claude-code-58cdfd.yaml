  summary: 'Create review: Xirp2 (Q4U4S6), reference relative for BOVIN/E1BL04'
  details: |
    De-novo full review of mouse Xirp2, independent of ProtNLM2 predictions; deep research failed (falcon auth error, perplexity quota) so the review rests on cached primary literature. Reviewed all 30 GOA rows: accepted actin filament binding (IBA/IEA/ISO, grounded in PTHR22591:SF1 and PAINT PTN000502290), actin filament organization, Z disc, alpha-actinin binding, cell-cell junction and junction organization. Refined generic cell/anchoring junction to intercalated disc plus cell-cell junction, Reactome cytosol to stereocilium, and Kcna5/Scn5a protein binding to transmembrane transporter binding. Removed the eEF1A-pulldown protein binding row. Marked ventricular septum development (knockout phenotype) as over-annotated. Added NEW intercalated disc, stereocilium, cuticular plate, and isoform-3 actin monomer binding from mouse IDA. Separated mouse-established functions from same-subfamily inferences for later transfer.
