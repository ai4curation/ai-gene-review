  summary: 'Create review: Ghsr (mouse ortholog reference for human GHSR)'
  details: |
    De-novo review of all 145 GOA rows for mouse Ghsr (Q99P50), done independently of ProtNLM2 predictions. Falcon and Perplexity deep research failed (auth/quota), so the review used cached primary literature. Grounding: PTHR24243:SF7 and PAINT node PTN002797666 (IBD GO:0001616, GO:0009755). Accepted ghrelin receptor activity, GPCR/PLC/hormone signalling, plasma membrane, positive regulation of appetite, and mouse-established coreceptor activity (DRD1/DRD2) with regulation of synaptic plasticity. Modified GHRH-receptor and generic terms to GO:0001616, GH-secretion rows to GO:0060124, and other grouping terms to specific descendants. Removed 10 Compara rows derived from rat expression-only annotations and the ghrelin secretion row. Marked indirect physiological rows as over-annotated. Added propagation_review on the ISO rows, rat source papers and PMID:22284186.
