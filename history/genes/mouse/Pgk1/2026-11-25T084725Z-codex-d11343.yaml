  summary: Review mouse Pgk1 for gluconeogenesis
  details: |
    Created a mouse Pgk1 gene review for the gluconeogenesis GO-CAM campaign. Reviewed all 54 seeded GOA rows, accepting the conserved cytosolic phosphoglycerate kinase activity and glycolysis/gluconeogenesis placements, keeping human PGK1-derived mitochondrial and extracellular moonlighting rows as non-core where defensible, modifying obsolete canonical glycolysis rows, and marking weak human-derived epithelial, membrane-raft, KCC3-binding, and plasminogen-activation transfers as over-annotated. Added manual research notes after the external Perplexity deep-research provider was unavailable, then addressed AI review feedback by downgrading an abstract-only Pejvakin wrong-reference defect to a CHECK request, fixing the KCC3-binding reason, generalizing the NAD(P)H-specific disulfide reductase term to protein-disulfide reductase activity, keeping GO:0106310 protein serine kinase activity as non-core after fetching PMID:28238651 Beclin1 Ser30 evidence, and adding a UniProt source-defect CHECK request for the PMID:26942675/RHEA:17989 mis-citation.
