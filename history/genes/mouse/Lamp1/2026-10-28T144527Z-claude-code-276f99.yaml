  summary: 'Create review: Lamp1'
  details: |
    De novo review of mouse Lamp1 (P11438): all 124 GOA rows reviewed. Lysosome rows accepted under the root-organelle policy; late endosome, endosome, vesicle, cytoplasm, membrane, cytolytic granule and phagocytic vesicle rows refined to membrane sub-terms. Core function is TMEM175 ion channel inhibitor activity in lysosomal lumen acidification at the lysosomal membrane (human evidence PMID:37390818 transferred by ISS/ISO). Removed cytosol (GO_REF:0000108), spermatogenesis TAS, rat-marker-based autophagic cell death ISO and two bare protein binding rows; corrected inverted lysosomal lumen pH elevation and proton transmembrane transport ISO rows; recorded source defects for these and for Golgi-to-lysosome transport, granzyme pathway and an IMP-coded phagosome location. Manual literature synthesis written since no deep-research provider was available.
