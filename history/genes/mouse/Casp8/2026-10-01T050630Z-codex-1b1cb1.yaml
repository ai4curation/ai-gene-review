  details: |
    Created the mouse Casp8 review for the APOPTOSIS project after a current GOA fetch. The review scoped inherited GO:0006915 rows to death-domain receptor extrinsic apoptotic signaling, marked the PIDD/RAIDD experimental apoptosis row as over-annotated where the paper did not detect procaspase-8 processing, accepted cysteine endopeptidase, DISC/CD95-DISC, ripoptosome, and negative-necroptosis rows, and documented the manual literature review after Falcon deep research was unavailable.
