  summary: 'Create review: Bicdl1 (mouse BICDR-1)'
  details: |
    De-novo review of mouse Bicdl1 (A0JNT9) as the experimental reference for horse BICDL1 (PTHR32123:SF12, PAINT node PTN001281025), written from cached full texts of PMID:20360680, 29420470, 36071160 and 33734450 (falcon and perplexity-lite deep research both timed out). All 12 GOA rows reviewed: protein binding rows modified to kinesin binding / small GTPase binding; neuron projection development modified to negative regulation (overexpression phenotype, non-core); cytoskeleton modified to centrosome; Golgi to secretory granule transport kept non-core; centrosome, small GTPase binding, dynactin binding and vesicle transport along microtubule accepted. Added NEW cytoskeletal motor activator activity (IDA, PMID:29420470) and dynein complex binding (IDA, PMID:36071160) from studies using recombinant mouse BICDR1. Independent of ProtNLM2 predictions.
