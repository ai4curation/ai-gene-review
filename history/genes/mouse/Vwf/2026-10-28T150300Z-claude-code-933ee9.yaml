  details: |
    Created the mouse Vwf (Q8CIZ8) review: all 69 GOA rows reviewed and 3 NEW rows added (GPIb cell adhesion molecule binding, FVIII protein carrier, ER lumen). Core functions cover collagen binding, GPIb binding, integrin binding, FVIII carriage and multimerization in hemostasis, cell-substrate adhesion and coagulation. Recorded source defects: liver and placenta development rows from the Hgf knockout paper carrying an Hgf allele (wrong gene), a suspected wrong-gene CD24/P-selectin location row, immunoglobulin binding inherited from a human BiP-binding row (wrong term), an IDA for Weibel-Palade body that rests on human HUVEC data, and a clotting-cascade activation term not supported by the Tspan18 paper. Literature was gathered manually into Vwf-deep-research-manual.md.
