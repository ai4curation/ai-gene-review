    Created the mouse Pax6 (P63015) review: reviewed all 250 GOA annotations (86 ACCEPT, 135 KEEP_AS_NON_CORE, 10 REMOVE, 7 MODIFY, 6 MARK_AS_OVER_ANNOTATED, 6 UNDECIDED). Core functions are RNA polymerase II sequence-specific transcription activator and context-dependent repressor activity, plus coregulator binding. Generic protein binding rows removed (Tle6 row modified to transcription corepressor binding); co-SMAD binding removed because the source paper invalidates the Smad4 interaction; keratinocyte differentiation modified to corneal epithelial cell differentiation; several MGI rows citing papers without Pax6 content left UNDECIDED. Automated deep research was unavailable; notes compiled manually from cached literature.
