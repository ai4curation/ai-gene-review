  details: |
    Re-review of the REMOVE actions in the mouse and rat gene reviews (14 November 2026), under the rules of the human REMOVE re-review; the pass and its rules are described in projects/MOUSE_GENES_RE_REVIEW/REMOVE_RE_REVIEW.md, and every changed row is listed with its rule in projects/MOUSE_GENES_RE_REVIEW/remove_rereview_changes.yaml. Each REMOVE row was read again: a REMOVE that rests on a biological argument stands, and a row changes where the same term is kept elsewhere in the review, where the review of the donor ortholog keeps the source row, where the donor experiment shows the claim, or where a real observation had been removed as false. Actions changed: [14] endocytosis (GO:0006897; IEA, GO_REF:0000043): REMOVE -> TOO_GENERAL; [20] lipid binding (GO:0008289; ISO, GO_REF:0000119): REMOVE -> MARK_AS_OVER_ANNOTATED; [24] growth factor binding (GO:0019838; ISO, GO_REF:0000119): REMOVE -> MODIFY (replacement peptide hormone binding, GO:0017046); [25] receptor internalization (GO:0031623; ISO, GO_REF:0000119): REMOVE -> KEEP_AS_NON_CORE; [34] insulin-like growth factor receptor signaling pathway (GO:0048009; ISO, GO_REF:0000119): REMOVE -> MARK_AS_OVER_ANNOTATED; [47] regulation of response to nutrient levels (GO:0032107; ISO, GO_REF:0000096): REMOVE -> KEEP_AS_NON_CORE; [49] neuronal cell body (GO:0043025; ISO, GO_REF:0000096): REMOVE -> KEEP_AS_NON_CORE. Added to the references list: PMID:25846210, PMID:7565946, PMID:17258692. Validated with ai-gene-review validate --terms: no error and no new warning against the state before the edit.
