  summary: 'Create review: Vmn2r73 canonical product D3Z7M3'
  details: |
    De-novo review of the Ensembl-canonical Vmn2r73 product D3Z7M3 (851 aa, full class C V2R architecture with 7 TM helices), the same-gene canonical relative of the ProtNLM2 benchmark entry A0A3B2WCZ5; done independently of ProtNLM2 output. All six GOA rows reviewed: GPCR activity (IBA, IEA), plasma membrane (IBA, IEA) and GPCR signaling pathway (IEA) accepted as family/phylogeny inference; membrane (IEA) modified to plasma membrane. PAINT node PTN002373557 donors resolved: none of the V2R donors is in Vmn2r73's PANTHER subfamily SF413, and curators propagated only GPCR activity, not the olfactory/pheromone receptor descendants, so no ligand-specific term is proposed. No Vmn2r73-specific experimental literature exists; the receptor is an orphan. Falcon deep research for this folder failed (authentication; perplexity fallback out of quota), so the sibling-accession falcon report for the same gene was used for the negative literature finding, confirmed by a Europe PMC search.
