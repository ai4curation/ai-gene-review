  summary: 'Create review: mouse Pcbd2 (go-annotation#6591)'
  details: |
    De-novo review of all 13 GOA annotations, triggered by geneontology/go-annotation#6591. Core change: MODIFY GO:0004505 phenylalanine 4-monooxygenase activity (IDA, PMID:15182178) to GO:0008124, keeping the evidence code and reference. The contradiction is sharper for Pcbd2 than Pcbd1 because UniProt assigns EC 4.2.1.96 to this entry with ECO:0000269 from the same reference MGI cites for GO:0004505. Also REMOVE GO:0006571 (inferred from the wrong MF) and the independent ARBA00029278 GO:0004505 IEA; MODIFY the bare GO:0005515 Hnf1a interaction to GO:0140297; UNDECIDED on the Pcbd2-Pcbd1 paralog interaction pending full text. Proposed NEW GO:0003713 transcription coactivator activity from PMID:24389307, which is UniProt's source for FUNCTION and SUBCELLULAR LOCATION yet supports no GOA row; the comparator check (GO:0003713 on PCBD1 in three species, on PCBD2 in none, but human PCBD2 carrying the matching GO:0045893 IDA from PMID:11980910) is recorded in the review. Kept the lone HDA mitochondrion annotation as non-core rather than removing it, on the strength of a new bioinformatics analysis in Pcbd2-bioinformatics/ showing the Pcbd2-specific N-terminal extension sits at the median of 259 reviewed mouse mitochondrial transit peptides on net charge, Arg count, acidic count and hydrophobic moment while Pcbd1 sits at the opposite extreme, with 40.6 percent alanine content reported as an explicit confounder, plus human PCBD2 membership in the MitoCoP proteome (PMID:34800366). No deep-research file: no provider API key configured, so the evidence base is in Pcbd2-notes.md. Validated with 'just validate mouse Pcbd2' and rendered to HTML.
    Followed up on PR #3912 review by rewriting the mitochondrion rationale to treat the plant PANTHER IBD as organellar-family context rather than mouse evidence, adding PMID:23806337 to the reference list for the SIRT5 succinylome note, and removing issue-specific prose from the dehydratase core function.
