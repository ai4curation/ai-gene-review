  details: |
    De-novo review of the canonical Swiss-Prot Sdhaf2 product (Q8C6I2) as the same-gene experimental reference for HORSE40 benchmark entry A0A494B8X4, independent of ProtNLM2 output. Falcon/perplexity deep research failed (auth/quota), so the review rests on cached literature, PANTHER PTHR12469:SF2 membership and PAINT node PTN000279729. All 27 GOA rows reviewed: complex II assembly and protein-FAD linkage accepted as core (flavinylation inferred from human/yeast orthologs; mouse complex II assembly support from Drp1-Sdhaf2 muscle study PMID:38569044); mitochondrion refined to matrix; TCA cycle and succinate-ubiquinone electron transport marked over-annotated (assembly factor, not catalytic subunit); nucleolus ISO over-annotated; cytosol and EMT/Wnt/dephosphorylation rows kept as non-core; ND MF modified to protein folding chaperone by subfamily inference.
