  summary: 'Correct ISO donor identity: P0DP25 is human CALM3, not CALM1'
  details: |
    GO_REF:0000119 ISO rows name UniProtKB:P0DP25, which UniProt resolves to human CALM3 (the true ortholog); summaries, the section comment, the GO_REF:0000119 reference finding and the notes said CALM1. Rat GO_REF:0000096 donors are Calm1 (RGD:2257), Calm2 (RGD:2258) and Calm3 (RGD:2259); five terms, including chromatin (GO:0000785), come from rat Calm1 alone. The chromatin summary wrongly said all three RGD sources carry the term; corrected, noting rat Calm3 (P0DP31) now carries the same IDA (PMID:17482793) per QuickGO, and added propagation_review (NO_FAILURE_NON_CORE, CONTEXT_OR_TISSUE_MISMATCH) with both donors. Removed ISO-review commentary from description per description guidelines; no actions changed.
