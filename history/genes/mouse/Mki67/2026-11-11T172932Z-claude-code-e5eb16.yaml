    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (Mki67-phylo.yaml, from `just phylo mouse Mki67`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0007088 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the node is the family root at Eumetazoa and the single seed, 15 steps below it, is a one-to-one ortholog of Mki67 at 49% identity. This matches the review's statement that the term is inferred from the human gene, and the objection concerns the meaning of the term.
    - GO:0051321 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the node is the family root at Eumetazoa and its 1 seed is Mki67 itself, so the row rests entirely on the gene's own experimental annotation. This agrees with the review, whose verdict depends on judging that localisation-based annotation and not on the placement.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
