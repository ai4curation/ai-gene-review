  summary: 'Create review: mouse Wee1 (P47810)'
  details: |
    De novo review of mouse Wee1 as the experimentally characterised PANTHER PTHR11042:SF72 relative of human WEE1, independent of ProtNLM2 predictions. Deep research failed (falcon auth, perplexity quota); literature from PubMed title search, with full text for the Wee1 knockout (PMID:16810330) and APC/C (PMID:25088202) papers. Core function: nuclear CDK1 Tyr15 kinase (GO:0004715) in negative regulation of G2/M (GO:0010972), established in mouse by deletion data and grounded on PAINT nodes PTN008510964/PTN008510965. All 37 GOA rows reviewed: general kinase/cell-cycle terms MODIFIED to GO:0004713/GO:0010972/GO:0018108; three ISO rows from human (nuclear envelope organization, mitotic nuclear membrane disassembly, sign-inverted positive regulation of G2/M) REMOVED as stale donors absent from current human GOA; nucleolus and microtubule cytoskeleton organization UNDECIDED; neuronal polarity roles kept as non-core; bare protein binding REMOVED.
