  details: |
    Created the review de novo, as the characterised relative of HORSE FOXJ3 (F6SCJ5); ProtNLM2 output was not used. Falcon deep research failed (auth 403; perplexity-lite fallback also failed), so the review rests on cached primary literature (PMID:19914232, 27739607, 41803108, 37939221, 15366017 and the human SELEX/ChIP papers). All 18 GOA rows were reviewed. ACCEPT: PAINT PTN002918318 TF/DNA-binding/nucleus/Pol II regulation terms, plus the activator and positive regulation of Pol II transcription terms (direct mouse Mef2c ChIP plus FBS-dependent reporter evidence). MODIFY: generic GO:0003700, GO:0006355, GO:0043565 and GO:1990837 to their specific descendants. KEEP_AS_NON_CORE: spermatogenesis and male meiosis I (cKO phenotypes downstream of TF activity). No NEW terms: muscle fibre type, cortical lamination and thermogenesis are downstream phenotypes. Grounding: PANTHER PTHR46078:SF3 is shared with human Q9UPW0 and horse F6SCJ5, while FOXJ2 is SF1. Added a notes file.
