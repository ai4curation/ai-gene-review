  summary: 'Create review: Vmn2r116 (V2Rp5, ESP1 receptor)'
  details: |
    De-novo review of all 8 GOA annotations as the experimentally characterised family-A V2R reference for Vmn2r73 (ProtNLM2 benchmark). Falcon deep research failed (Edison 403 auth; perplexity-lite fallback also failed), so the review rests on the UniProt record and cached literature (PMID:20596023 abstract; PMID:23576433 and PMID:25073926 full text, newly cached). Pheromone receptor activity (IGI) accepted as core; GPCR activity (IBA, IEA) and membrane refined to the specific terms the gene already carries; GPCR signalling and positive regulation of female receptivity kept as non-core. The IBA rows come from deep class C node PTN002373557, which propagates only family-wide GPCR/plasma-membrane terms; ESP1 ligand specificity is gene-specific and flagged as not transferable to other PTHR24061 subfamilies. NEW detection of pheromone was considered but not added (comparator check: no mouse/rat/human gene carries it).
