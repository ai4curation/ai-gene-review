  summary: 'Review: SIRV1 orf114 (AcrIII-1 ring nuclease); resolve the module''s assayed-accession
    gap'
  details: |
    Completed review of SIRV1 protein 114 (Q8QL27, called gp29 in the literature and ORF 114a in the PDB), the seventh and last anti-CRISPR exemplar cited by modules/anti_crispr_suppression.yaml. The module carried an open curation gap stating that the DUF1874-family protein assayed as the AcrIII-1 cyclic-oligoadenylate ring nuclease in PMID:31942067 could not be matched to a UniProt accession from local data, and used Q8QL27 only as an orienting family exemplar with an explicit caveat that it is not the assayed protein. That gap is resolved, and in the direction the module did not anticipate: Q8QL27 IS the assayed protein. Four independent checks agree. The paper's phylogenetic methods name the query as RefSeq NP_666617, which Q8QL27 cross-references and whose NCBI sequence is identical to the entry over all 114 residues; the data-availability statement gives PDB 6SCF as the sole deposition, which Q8QL27 cross-references with eight chains spanning 1-114 and which RCSB resolves to this paper at the matching 1.55 A with the cA4 ligand; the four conserved residues the paper names, H47 R66 R85 E88 with H47A as the inactive variant, sit at exactly those positions in the sequence; and the apo structure the paper cites for the family member it assays is PDB 2X4I, also cross-referenced, titled 'ORF 114a from Sulfolobus islandicus rudivirus 1'. What obscured this was nomenclature, three numbering conventions for one molecule joined by NP_666617. The review therefore carries experimental evidence rather than family-level inference: IMP for GO:0098672 from the in-host plasmid rescue of the duf1874-less virus SSeV, IDA for GO:0004521 and GO:0030551, IC for GO:0030430. A cyclic oligoadenylate ring nuclease activity term is proposed under GO:0004521, since GO has no term for cleaving a cOA messenger and GO:0001730 is the wrong term; it would also serve the host Crn1/Crn2 enzymes and pairs with the cOA synthase gap in MODULE:crispr_cas_adaptive_immunity. Recommended module edits are recorded in the review's knowledge_gaps. Noted but unresolved: PubMed lists a 2025 Nature comment on PMID:31942067 whose content was not retrievable here.
