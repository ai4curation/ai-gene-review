  summary: Wire OpenScientist verdict that the MIC threshold endpoint, not CHAP instability,
    explains the truncation discrepancy
  details: |
    Wired an OpenScientist run (kgap-lysk-assay-discrepancy) into the knowledge gap
    asking why the CHAP-only truncation of LysK lyses staphylococci in zymogram,
    plate-lysis and turbidity assays yet scores as inactive in a minimum inhibitory
    concentration (MIC) assay. Status OPEN -> NARROWING.

    The run dissolves most of the question at the endpoint rather than in the protein.
    The MIC is the only one of the four formats scored as a threshold, so potency loss
    and stability loss multiply in it and in no other; a threshold integration at a
    1.386/h growth rate from 5x10^5 to 10^7 CFU/mL demands an initial specific lysis
    rate of 1.24/h from a non-decaying enzyme, 2.60/h at an eight-hour half-life and
    8.58/h at two hours. The 8.6-10x penalty measured for deleting the homologous
    PlyTW cell wall binding domain already exceeds an eight-fold dilution ceiling, so
    potency alone suffices.

    Three of the mechanisms the gap offered are closed: misfolding of the isolated
    CHAP domain is excluded by PDB 4CSH (ordered 2-165, mean B 15.4, triad 9.7);
    divalent-cation starvation is refuted (cation-adjusted Mueller-Hinton supplies
    0.50-0.62 mM Ca2+, and the Ca2+ site refines at occupancy 1.00 from a
    calcium-free liquor, with the fusion carrying the same site); ionic strength is
    refuted (Debye 0.99 nm vs 0.77 nm where the truncation works). A
    bulk-electrostatic account of the SH3b benefit also fails, since the cationic
    charge sits in the lysine-rich linker, not SH3b (full-length +22.5 at 0.41/kDa;
    CHAP-only +2.9 at 0.16/kDa; SH3b alone +1.6), leaving specific saturable
    peptidoglycan binding. O-acetylation is the wrong chemistry for a D-alanyl-glycyl
    endopeptidase; growth-phase wall teichoic acid stays live.

    What remains open is the stability leg: no melting temperature, DSF trace or
    aggregation comparison of the two constructs exists, and the methods of the paper
    reporting the discrepancy are paywalled, absent from PMC and unavailable from
    Europe PMC, with medium, inoculum, incubation and top concentration unstated in
    the abstract. The curation consequence recorded in the boundary is that the
    MIC-negative result says very little about whether the CHAP domain is
    catalytically competent.

    Verified locally against genes/BPPGK/lysK/lysK-uniprot.txt: 495 residues; triad
    Cys54/His117/Glu134; calcium ligand set Asp45/Asp47/Tyr49/His51/Asp56; zinc
    ligands His214/His324/Cys332; SH3b 412-481; linker 166-204 carrying twelve
    lysines or arginines in thirty-nine residues, which is the charge asymmetry the
    run reports. Not recomputed: PlyTW fold penalties, broth cation concentrations,
    crystallographic B-factors and occupancies, Debye lengths, the threshold
    integration. PMID:25790497 is not cached here, so no quote was taken from it; the
    new references entry is marked UNVERIFIED and lists what was and was not checked.

    No annotation action changed.
