  details: |
    De-novo review of Staphylococcus phage K endolysin LysK (Q6Y7T6) for the CACAO project: all 14 GOA rows judged, with the four CACAO experimental rows accepted or refined (GO:0008745 and GO:0001897 x2 ACCEPT; GO:0008233 IMP MODIFY to GO:0004197). The electronic rows carry the errors: GO:0009253 MODIFY to GO:0052009 (own-process term for a host-directed activity, here via InterPro2GO) and GO:0042742 REMOVE (KW-0081 keyword mapping inverting the interaction direction, a second instance after PRD1 P15), both recorded as source_defects. Two NEW rows added (GO:0042834 SH3b peptidoglycan binding, IMP; GO:0044659 viral release by cytolysis, IC) plus three core functions, a proposed D-alanyl-glycyl endopeptidase activity term, and notes; gene_symbol set to lysK since UniProt gives no gene name.
