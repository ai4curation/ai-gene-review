  details: |
    Ran OpenScientist (3 iterations) on the LysK CHAP zinc. In 4CSH the zinc has one protein ligand (Cys54, checked locally) plus waters at 0.67 occupancy and low bond-valence sum, solvent-exposed beside MES; unlike all catalytic/structural reference sites. Best explained as an adventitious adduct; CHAP structural metal is Ca (Asp45/Asp47/Asp56); UniProt Zn site (His214/His324/Cys332) is in the amidase domain. Added boundary, status NARROWING, provenance; run reference UNVERIFIED.
