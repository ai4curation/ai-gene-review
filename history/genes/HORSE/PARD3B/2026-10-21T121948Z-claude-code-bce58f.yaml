  summary: 'Create review: horse PARD3B (A0A9L0RMF2)'
  details: |
    New review of horse PARD3B A0A9L0RMF2 for the ProtNLM2 DONKEY40 horse-partner cohort, independent of ProtNLM2 predictions. Deep research failed (falcon auth failure, perplexity quota), so the review rests on directly cached literature (PMIDs 12459187, 12234671, 16458856, 15721295, 24859006, 41274508, 33565714, 34815476, 27908725) and a new PEP 723 analysis (PARD3B-bioinformatics/analyze.py, RESULTS.md) placing the protein in PANTHER PTHR16484:SF4 with human/mouse PARD3B, 88% identical to human, a full-length transcript model with one 31-aa N-terminal insertion, and conserved loss of the PARD3 aPKC-binding motif. All 10 IBA rows come from family node PTN001046835 seeded by PARD3/Bazooka/PAR-3; junction and cortex locations accepted, MT organization / cell adhesion / protein localization marked over-annotated (aPKC-complex functions PARD3B lacks), polarity terms and apical membrane kept as non-core, PI binding undecided, cell junction and apical junction complex refined to tight/adherens junction. Added NEW protein kinase binding (LKB1) and 14-3-3 protein binding by same-subfamily transfer.
