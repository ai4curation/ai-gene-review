  summary: 'Create review: horse ALDH7A1 canonical translation A0A9L0R3Y5'
  details: |
    De-novo full review of the Ensembl canonical horse ALDH7A1 translation (A0A9L0R3Y5), independent of ProtNLM2 predictions, to serve as the reference for transfer to A0A9L0RRL6. Falcon and perplexity-lite deep research both failed (auth / quota), and PubMed has no horse ALDH7A1 studies, so all functions are marked as inferred. Evolutionary grounding: PANTHER PTHR43521:SF1 and descent from PAINT vertebrate node PTN000192435 (human, mouse, zebrafish seeds). New bioinformatics (compare_sequences.py, RESULTS.md): 95.7% identity to human P49419 with no internal gap, all 14 catalytic/NAD/AASA-binding residues conserved, and a 27-aa N-terminal extension that leaves mitochondrial import unverified. Of the 13 IEA rows: ACCEPT for AASA dehydrogenase, aldehyde DH (NAD+), L-lysine catabolism, mitochondrion/matrix, cytosol, Golgi and plasma membrane, and identical protein binding. KEEP_AS_NON_CORE for nucleus and betaine-aldehyde DH. MODIFY for oxidoreductase activity (to GO:0004029) and amino acid catabolic process (to GO:0019477). No NEW terms, because PAINT did not propagate the ferroptosis, aldehyde metabolism or choline catabolism terms.
