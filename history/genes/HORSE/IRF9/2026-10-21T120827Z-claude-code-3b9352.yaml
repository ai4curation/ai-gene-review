  summary: 'Create review: horse IRF9 (A0A9L0SN53), DONKEY40 partner'
  details: |
    De-novo full review of horse IRF9 canonical model A0A9L0SN53, independent of ProtNLM2 predictions. Falcon deep research (and perplexity-lite fallback) failed; literature cached directly (PMID:1630447, 9078371, 29317535, 30143481). New gene-model comparison (IRF9-bioinformatics/compare_gene_models.py, RESULTS.md) shows the canonical model carries an 84-aa Pro-rich insertion inside the IRF-association domain absent from human, mouse, donkey and the RefSeq-backed horse model F6Z2B0. 16 GOA rows reviewed: ACCEPT 7, MODIFY 7 (general DNA-binding/TF/regulation terms refined to GO:0000978, GO:0000981, GO:0045944; immune system process refined to GO:0060337), KEEP_AS_NON_CORE 1 (cytosol), MARK_AS_OVER_ANNOTATED 1 (DNA-templated transcription). Function transfer grounded in PANTHER PTHR11949:SF26 membership shared with human Q00978 and mouse Q61179.
