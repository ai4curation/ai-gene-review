  summary: 'Create review: HORSE EPS8L2 (F7BFV0), ProtNLM2-independent'
  details: |
    New review of horse EPS8L2 F7BFV0 (DONKEY40 horse partner cohort), independent of ProtNLM2 output. Falcon deep research failed (403 auth) so the review rests on cached full-text literature (PMID:14565974, PMID:23918390, PMID:26282398). Added an ortholog alignment (EPS8L2-bioinformatics) showing 1:1 orthology to human/mouse EPS8L2 (PTHR12287:SF20, ~87% identity) and a 91-aa N-terminal gene-model extension (Met92 = human Met1). 20 annotations reviewed: actin binding, contributes_to GEF, ruffle membrane, positive regulation of ruffle assembly and stereocilium tip accepted; Rho signalling terms modified to Rac protein signal transduction / positive regulation of Rac signalling; general CC terms refined to ruffle membrane, cytosol and stereocilium tip; sensory perception of sound, cytosol and protein-containing complex kept as non-core. No NEW terms.
