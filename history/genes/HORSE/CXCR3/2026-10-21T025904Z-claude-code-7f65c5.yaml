  summary: Full re-review of horse CXCR3 (A0A9L0T1D1), independent of ProtNLM2
  details: |
    Full re-review grounded in PANTHER PTHR10489:SF671 orthology to human CXCR3 (P49682). New analysis compare_sequences_rereview.py / RESULTS-rereview.md (subfamily comparators, paralog outgroups, motif mapping, second horse gene model F6U4S6). Benchmark accession is the full-length CXCR3-A-like product, not a fragment. Refined general terms by MODIFY: GPCR activity and chemokine receptor activity to C-X-C chemokine receptor activity; signal transduction (was UNDECIDED) and GPCR signaling to chemokine-mediated signaling pathway; chemotaxis to T cell chemotaxis; membrane to plasma membrane. Demoted regulation of leukocyte migration and inflammatory response to KEEP_AS_NON_CORE. Rewrote description and core function; added PMID:9064356, PMID:31256888 and UniProt file references; replaced boilerplate reasons with claim-specific ones.
