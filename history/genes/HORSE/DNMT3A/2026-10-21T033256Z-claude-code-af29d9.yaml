  summary: Full re-review of HORSE DNMT3A (A0A9L0TK01), independent of ProtNLM2
  details: |
    Re-review done independently of the ProtNLM2 predictions. New live-data analyses (compare_isoforms_rereview.py, compare_exons_rereview.py, RESULTS-rereview.md) identify A0A9L0TK01 as an exon-9-skipping splice model: it lacks human residues 339-374 in the PWWP region and keeps the full ADD and catalytic domains (C671, E717, R797, R843 conserved). No horse UniProt model is a complete canonical product. Using mouse PWWP-disruption evidence (PMID:15456878), catalytic, CpG-silencing and nuclear rows were kept or refined. The heterochromatin, centromere, XY-body and constitutive-heterochromatin rows were left UNDECIDED. Broad terms were refined (MODIFY to GO:0044027, GO:0045322, GO:0003682, chromatin/nucleoplasm) in line with the human DNMT3A review. Self-association, catalytic complex, TF binding and piRNA transposon silencing rows were set to KEEP_AS_NON_CORE. The lncRNA rows stay UNDECIDED because the PTENpg1 source RNA has not been shown to be conserved in horse. IBA propagation_review was added and the description and core functions rewritten. Relative: human DNMT3A Q9Y6K1 (same PANTHER SF10), already reviewed.
