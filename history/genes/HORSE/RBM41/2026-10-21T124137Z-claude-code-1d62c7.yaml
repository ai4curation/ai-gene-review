  summary: 'Create review: horse RBM41 (A0A3Q2GZN1)'
  details: |
    New review for the DONKEY40_HORSE_PARTNER ProtNLM2 benchmark target, done without using the ProtNLM2 predictions. Falcon deep research failed (authentication), and the perplexity-lite fallback failed (quota). Evidence is the full text of Norppa et al. 2024 (PMID:38499487) on human RBM41, transferred via PANTHER PTHR16105:SF2 orthology. Horse sequence comparison is in RBM41-bioinformatics/. The horse model is the human isoform 1 sequence plus the 24-aa isoform-3 exon, with an intact RRM. Accepted 3 IBAs: U12 snRNA binding, U12-type spliceosomal complex, mRNA splicing via spliceosome. Marked pre-mRNA intronic binding (IBA) as over-annotated: the only donor is the 65K paralog, and the lariat association is indirect. Modified nucleic acid binding and RNA binding to U12 and U6atac snRNA binding. Added NEW U6atac snRNA binding and Cajal body.
