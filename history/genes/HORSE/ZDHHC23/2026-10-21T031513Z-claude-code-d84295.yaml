  details: |
    Full re-review independent of ProtNLM2. Identified A0A9L0T4E4 as the Ensembl-canonical alternative-3'-exon model of horse ZDHHC23: it has an intact DHHC-CRD (C283) and TM core, and a 49-aa tail without the rodent -EDIV NOS1 PDZ motif (new compare_models_rereview.py / RESULTS-rereview.md). Grounded the IBAs in PAINT nodes (PTN008583751 ZDHHC23 clade; PTN000525256 family root). ER IBA ACCEPT->KEEP_AS_NON_CORE, Golgi apparatus ACCEPT->MODIFY to Golgi membrane, protein targeting to membrane ACCEPT->KEEP_AS_NON_CORE; MF/PM localization kept. Replaced the boilerplate support with specific PMID:22399288 full-text quotes and added PMID:15105416. Falcon deep research failed (auth); recorded in notes.
