  summary: 'Create review: horse NDEL1 (A0A5F5PSW5)'
  details: |
    New full review of horse NDEL1 (A0A5F5PSW5, PTHR10921:SF0), independent of ProtNLM2 predictions. All 34 GOA rows (IBA + IEA) reviewed with orthology grounded in SF0 membership and a horse-vs-human alignment (bioinformatics/RESULTS.md): horse 1-338 is 98% identical to human NDEL1, but the gene model replaces human 339-345 with a 143-residue C-terminal extension of unknown origin (likely alternative/erroneous final exon). Kinesin complex IBA removed (family review WRONG_NODE); synaptic vesicle and insulin receptor signaling marked over-annotated; identical protein binding -> protein homodimerization activity; MTOC -> centrosome; mitotic and neuronal secondary roles kept as non-core. Added NEW cytoskeletal motor regulator activity and microtubule anchoring at centrosome (ISS from human/mouse). Falcon deep research and perplexity-lite fallback both failed; literature from the human NDEL1 review used.
