  summary: 'Create full review: horse HOXA2 (F7DP63)'
  details: |
    Full review of horse HOXA2 (F7DP63) for the DONKEY40 HORSE-partner cohort, done without the ProtNLM2 predictions. F7DP63 is an Ensembl gene model with a non-homologous 85-aa N-terminus, including a spurious SignalP signal peptide, in place of the conserved 54-aa HOXA2 N-terminus. Residues 86-404 match horse RefSeq XP_001499478.2 at 318 of 319 positions, with the hexapeptide and homeodomain intact (new bioinformatics/compare_gene_model.py, RESULTS.md). All 17 GOA rows were reviewed using PANTHER PTHR45664:SF3 placement and mouse Hoxa2 literature: 10 ACCEPT; 5 MODIFY (four general terms to specific descendants, and embryonic skeletal system development to embryonic viscerocranium morphogenesis); pharyngeal system development KEEP_AS_NON_CORE; muscle structure development MARK_AS_OVER_ANNOTATED (no muscle evidence in the source abstract; likely non-cell-autonomous). Falcon and perplexity-lite deep research both failed with authentication errors.
