  outcome: changed
  summary: ProtNLM2 prediction rescoring
  details: |
    Rescored 10 ProtNLM2 predictions for A0A9L0SWY1 at gene level (horse gene has no GOA on any product). UNC->COR for GO:0045505 dynein intermediate chain binding, GO:0035721 intraciliary retrograde transport, GO:0097546 ciliary base, GO:0005930 axoneme, GO:0060271 cilium assembly, GO:1902017 regulation of cilium assembly, GO:0005813 centrosome, GO:0031021 interphase MTOC, GO:0000922 spindle pole: justified transfer within PANTHER PTHR21255:SF7 from human/mouse experimental evidence, matching the horse, canonical-product, human and mouse reviews; the truncated-model caveat is retained in summaries but no longer treated as grounds for UNC. UNC->NPI (CURATION_MISTAKE) for GO:1905799 regulation of intraciliary retrograde transport: human and mouse reviews MODIFY it to GO:0035721 because loss-of-function shows participation, not regulation. Added mouse PMID:39827215 support for axoneme and cilium assembly; PubMed search found no newer decisive TCTEX1D2 papers.
