  summary: New full review of horse IRAK3 canonical product F6QZW8 (all 43 GOA rows),
    independent of ProtNLM2
  details: |
    Created genes/HORSE/IRAK3__F6QZW8 (fetch-gene with alias) for the Ensembl-canonical horse IRAK3 product F6QZW8, the closest characterised relative of ProtNLM2 benchmark A0A3Q2HDT6 (same gene, non-canonical model). Deep research failed (falcon auth, perplexity quota) and this is recorded in the notes. Added a reproducible bioinformatics analysis (map_human_features.py, features.json, RESULTS.md) mapping experimentally characterised human IRAK3 residues onto F6QZW8. W74/R97 death-domain surfaces, the CGS/DFA pseudokinase motifs, the ATP lysine, both dimer disulfide cysteines and the TRAF6 motif are conserved. Human Ser110 (IRAK1/PIN1 site) is Asn. Grounding: PANTHER PTHR24419:SF7 with human Q9Y616, and PAINT nodes PTN002815516, PTN000701353, PTN008405164 and PTN000784925. Reviewed all 43 rows. REMOVE Mg binding and the kinase activity IEAs (pseudokinase; PAINT did not propagate kinase activity). ACCEPT the negative-feedback TLR/IL-1R terms, complex retention, protein kinase binding, homodimerization, cytoplasm, and the IL-1 and LPS pathways. MODIFY general terms to MyD88-dependent TLR signaling, IL-1 signaling (not IL-33, because Ser110 is absent), p38MAPK, and the directional NF-kB terms. MARK_AS_OVER_ANNOTATED Toll signaling pathway, response to virus and positive regulation of immune system process. No NEW terms. All functions are inferred; none has been tested in horse.
