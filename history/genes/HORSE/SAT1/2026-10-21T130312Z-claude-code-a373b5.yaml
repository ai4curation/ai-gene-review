  summary: 'Create review: horse SAT1 (A0A5F5PNJ9), which is APOO/MIC26'
  details: |
    New full review of A0A5F5PNJ9, made independently of the ProtNLM2 predictions (DONKEY40_HORSE_PARTNER cohort). Identity check (SAT1-bioinformatics/identity_check.py): the UniProt gene name SAT1 is a misassignment, because the sequence is horse APOO/MIC26. Ensembl APOO-201, Compara one-to-one with human APOO, PANTHER PTHR14564:SF2, 91% identical to human MIC26 over the full 198 aa; the VGNC/Bgee xrefs belong to the overlapping SAT1 locus. Full-length product, not a fragment. Seven GOA rows: MICOS complex (IBA, IEA), cristae formation (IBA, IEA) and mitochondrial inner membrane ACCEPT; mitochondrion and mitochondrial membrane MODIFY to mitochondrial inner membrane. No NEW rows. Falcon deep research failed (authentication), so this rests on the cached human MIC26 literature.
