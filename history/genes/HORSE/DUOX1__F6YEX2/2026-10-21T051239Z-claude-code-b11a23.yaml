  summary: 'Create review: horse DUOX1 canonical product F6YEX2, independent of ProtNLM2'
  details: |
    New review of F6YEX2, the UniProt gene-centric and Ensembl canonical product of horse DUOX1 (PTHR11972:SF75, same subfamily as human DUOX1 Q9NRD9), in new folder genes/HORSE/DUOX1__F6YEX2 because genes/HORSE/DUOX1 is keyed to alternative product A0A9L0SQG9. All 32 GOA rows (IBA/IEA only) reviewed. REMOVE peroxidase activity (human NOT IDA PMID:19460756, PROSITE residue caution), response to oxidative stress and cellular oxidant detoxification (peroxidase-derived), cuticle development (nematode-only). MODIFY superoxide activity/process IBAs to the H2O2 activity/process carried by DUOX PAINT node PTN000944147, oxidoreductase activity to GO:0016174, cytokine-mediated signaling to cellular response to cytokine stimulus. Core function: H2O2-forming NAD(P)H oxidase at the apical plasma membrane in the NADPH oxidase complex, inferred by orthology; nothing is measured in horse. Gene-model caveat recorded: F6YEX2 lacks human 1517-1551 (5 of 11 NADPH contacts), which other horse DUOX1 transcripts encode (from genes/HORSE/DUOX1/DUOX1-bioinformatics/RESULTS-rereview.md). Falcon and perplexity-lite deep research failed (authentication/403), recorded in notes.
