  summary: 'Create review: horse ALKAL2 (F6XWZ3), ProtNLM2 DONKEY40 horse partner'
  details: |
    New review of horse ALKAL2 F6XWZ3, independent of ProtNLM2 predictions. Falcon deep research failed (Edison authentication error), so the review uses four cached full-text papers on human ALKAL2 plus a new gene-model comparison (ALKAL2-bioinformatics/compare_gene_models.py, RESULTS.md). F6XWZ3 is the Ensembl-canonical 271-aa model carrying a 119-residue N-terminal extension; residues 120-271 equal the 152-aa horse model A0A3Q2I4Q6 and align to human ALKAL2 at 86.6% identity with all augmentor-domain disulfide cysteines conserved. Eight GOA rows reviewed: extracellular region ACCEPT; plasma membrane KEEP_AS_NON_CORE; GO:0030298 (IBA, IEA) MODIFY to GO:0030297 transmembrane receptor protein tyrosine kinase activator activity (sibling-term correction; ALK/LTK are transmembrane RTKs); receptor tyrosine kinase binding (IBA, IEA) ACCEPT; positive regulation of ERK1/2 and ERK5 cascades KEEP_AS_NON_CORE. No NEW terms: PAINT omission of the human IDA cytokine-activity, RTK-pathway and neuron-projection terms treated as deliberate.
