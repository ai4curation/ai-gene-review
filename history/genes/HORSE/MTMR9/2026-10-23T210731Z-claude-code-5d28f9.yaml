  details: |
    GO:0050821 protein stabilization: UNC -> COR (CS 1 -> 2). Human MTMR9 IDA (PMID:19038970, PMID:22647598) is accepted as core in the re-reviewed human and mouse reviews, and transfer to the 1:1 SF56 horse ortholog rests on the same grounds (retained C-terminal coiled coil) as the other COR regulatory terms; requiring horse-specific evidence for this term alone was inconsistent. Other six assessments unchanged (GO:0010922, GO:0010507, GO:0032991, GO:0060304 COR; GO:0030234 CNN; GO:0019903 UNC, matching human/mouse MODIFY to GO:0019902). Rewrote summaries to cite mouse MTMR7-MTMR9 evidence (PMID:12890864, now in references), the re-reviewed gene reviews and PAINT node PTN002246859; updated the file description. PubMed search for MTMR9 (31 hits) found no new evidence changing the judgments.
