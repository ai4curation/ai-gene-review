  summary: Full re-review of horse MTMR9 A0A9L0T3C1 (exon-skipped isoform), independent
    of ProtNLM2
  details: |
    Full re-review of A0A9L0T3C1 without the ProtNLM2 predictions. New analysis compare_models_rereview.py / RESULTS-rereview.md compares all three horse MTMR9 UniProt models with the human, mouse and bovine SF56 orthologs and the Ensembl exon structures. It shows A0A9L0T3C1 is an in-frame exon-skipped splice isoform (ENSECAT00000122597, minus a 126-nt exon = human residues 98-139). A0A5F5PR89 is the full-length human-equivalent product, and F7CCR9 (Ensembl canonical) has a divergent C-terminal coiled coil. Changed enzyme regulator activity from ACCEPT to MODIFY -> GO:0019211 phosphatase activator activity, grounded in independent human (PMID:19038970, 22647598) and mouse (PMID:12890864) ortholog experiments within PTHR10807:SF56 rather than PAINT, which propagates only protein phosphatase binding and negative regulation of autophagy from PTN002246859. Re-justified the 4 CC rows (cytosol ACCEPT, ER/ruffle/perinuclear non-core) with curated human evidence and PMID:24591580 (newly cached). Rewrote the description to name the isoform, set the core location to cytosol, and added suggested questions and experiments. Deep research failed (falcon auth, perplexity quota); this is recorded in the notes.
