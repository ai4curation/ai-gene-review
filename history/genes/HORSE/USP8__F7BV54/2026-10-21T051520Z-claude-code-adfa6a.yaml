  summary: 'Create review: horse USP8 F7BV54 (canonical-structure product)'
  details: |
    New full review of F7BV54, the human-isoform-1-like product of horse USP8 (ENSECAG00000006611), as the transfer reference for benchmark A0A9L0T7K6. Independent of ProtNLM2 predictions. Deep research failed (falcon auth error, perplexity-lite quota), recorded in notes. New analysis compare_f7bv54.py shows PTHR21646:SF27 placement shared with human and mouse USP8, 92.75% identity to P40818-1, conserved MIT/SH3-binding/14-3-3/USP regions and catalytic C785/H1066, and that human and mouse inherit eight IBA rows that F7BV54 lacks. Nine IEA rows reviewed: deubiquitinase activity, protein deubiquitination, endosome membrane and cytosol ACCEPT; cytoplasm MODIFY to cytosol and endosome membrane; midbody, nucleus, plasma membrane KEEP_AS_NON_CORE; ubiquitin-dependent protein catabolic process MARK_AS_OVER_ANNOTATED. No NEW terms; endosome organization and linkage-specific activities raised as questions. No function is experimentally established in horse.
