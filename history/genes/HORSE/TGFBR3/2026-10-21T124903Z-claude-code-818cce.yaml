  summary: 'Create review: horse TGFBR3 (F7E1V2), DONKEY40 horse partner'
  details: |
    Full review of 15 electronic GOA rows (IBA/ARBA/SubCell), independent of ProtNLM2 output. Deep research failed (Edison/perplexity auth 403), so evidence comes from cached abstracts on rat/mouse/human/chick TGFBR3; transfer is justified by PANTHER PTHR14002:SF7 and PAINT node PTN002678643. Actions: 8 ACCEPT; GO:0005024 x2 MODIFY to GO:0070123 (type III receptor activity); GO:0016477 MODIFY to GO:0030334; GO:0090100 MODIFY to GO:0030513 + GO:0030511; GO:0001837 and GO:0005539 KEEP_AS_NON_CORE; GO:0048513 MARK_AS_OVER_ANNOTATED. 3 NEW: BMP binding, BMP signaling pathway, coreceptor activity. A sequence comparison (TGFBR3-bioinformatics/) shows 87% identity to human, with conserved GAG serines, ZP domain, TM, phospho-Thr and C-terminal tail, but the Ensembl model lacks a signal peptide (likely a first-exon error).
