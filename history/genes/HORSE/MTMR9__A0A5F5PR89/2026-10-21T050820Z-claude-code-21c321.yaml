  summary: 'Create review: horse MTMR9 full-length product A0A5F5PR89'
  details: |
    New review of the full-length horse MTMR9 product A0A5F5PR89 (ENSECAT00000074905), the experimentally anchored reference for the ProtNLM2 benchmark entry A0A9L0T3C1; written independently of ProtNLM2 output. Falcon deep research failed (authentication) and perplexity-lite fallback failed (quota); used cached primary literature and the human MTMR9 review. Grounding: PTHR10807:SF56 membership, PAINT node PTN002246859, and a new pairwise comparison to human Q96QG7 (98.0% identity, identical inactive HCX5R loop, 100% identical coiled coil) in MTMR9__A0A5F5PR89-bioinformatics/. The five IEA rows were reviewed: cytosol accepted; ER, perinuclear region and ruffle membrane kept as non-core; enzyme regulator activity modified to phosphatase activator activity. Three NEW ISS rows were proposed from human experiments: phosphatase binding, regulation of phosphatidylinositol dephosphorylation and protein stabilization. Autophagy, apoptosis and macropinocytosis phenotypes were deliberately not proposed. No function is experimentally established in horse.
