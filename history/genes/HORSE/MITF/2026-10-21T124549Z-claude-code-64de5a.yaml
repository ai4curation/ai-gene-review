  summary: 'Create review: horse MITF (F6ZKQ4, MITF-M isoform)'
  details: |
    New review for ProtNLM2 benchmark target F6ZKQ4, made independently of the ProtNLM2 predictions. Isoform analysis (MITF-bioinformatics/compare_isoforms.py, RESULTS.md) shows F6ZKQ4 is the melanocyte-type MITF-M(-) product. It is gapless to human O75030-10 at 97.8% identity and lacks the isoform-A N terminus that binds Rag GTPases, so lysosomal and Rag/mTORC1 regulation was not transferred. All 9 GOA rows reviewed: 5 ACCEPT (IBA DNA binding, TF activity, nucleus x2, melanocyte differentiation), cytoplasm KEEP_AS_NON_CORE, regulation of DNA-templated transcription TOO_GENERAL, regulation of Pol II transcription MODIFY to positive regulation (GO:0045944), protein dimerization MODIFY to homo- and heterodimerization. Each IBA was grounded on PANTHER PTHR45776:SF4 and PAINT nodes PTN005248237 and PTN000000820; horse EMSA evidence for M-box binding is from PMID:22511888. Falcon and perplexity-lite deep research both failed (auth and quota errors).
