  summary: 'Create review: horse SLC16A11 (F6YMY3)'
  details: |
    Full review of horse SLC16A11 (F6YMY3, ProtNLM2 DONKEY40 cohort), written without consulting ProtNLM2 output. Deep research failed (falcon error, then perplexity-lite timeout), so the review rests on cached human-ortholog papers (PMID:24390345, PMID:28666119) and a new gene-model comparison (SLC16A11-bioinformatics/compare_gene_models.py). Function transfer is grounded on PANTHER PTHR11360:SF80 membership shared with human Q8NCK7. F6YMY3 is recorded as an Ensembl-canonical but probably aberrant gene model: it has a 73-aa N-terminal extension and a divergent C-terminus replacing human TM12 and the tail, while A0A9L0RBE3 from the same gene keeps them. Actions: ACCEPT 5 (MCT activity IBA, monocarboxylic acid transport, PM x2, ER membrane), MODIFY 2 (GO:0022857 to GO:0008028; GO:0055085 to GO:1905039).
