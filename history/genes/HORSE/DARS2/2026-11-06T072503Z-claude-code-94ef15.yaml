  summary: Migrate horse DARS2 off the obsoleted mitochondrial aspartyl-tRNA aminoacylation
    term
  details: |
    Part of the tRNA aminoacylation BP obsoletion migration tracked in issue #2747, which lists human DARS2 but not this horse entry; it was found by scanning the corpus for the 43 obsoleted ids rather than by working the issue's list.

    Two places pointed at GO:0070146 mitochondrial aspartyl-tRNA aminoacylation, now obsolete: the GO:0006418 row proposed it as a replacement, and the core_functions directly_involved_in slot carried it. Both now resolve to GO:0070127 tRNA aminoacylation for mitochondrial protein translation. Verified in go-edit.obo: GO:0070146 is is_obsolete true with replaced_by GO:0070127, and its comment names GO:0004815 aspartate-tRNA ligase activity as the molecular function; GO:0070127 is live and still an is_a descendant of GO:0006418. So the target is the one the ontology declares, not an inference from the obsoletion prose.

    The reason was an argument that needed reworking, not an id. It derived the old term as the conjunction of two PAINT propagations, aspartyl-tRNA aminoacylation from PTN000502597 and mitochondrion from PTN000502598, and concluded that the conjunction is GO:0070146. That derivation is still sound about the facts but its conclusion is no longer a term: GO:0006422 was obsoleted in the same batch, so only the compartment half of the conjunction remains a process. The reason now says this, and points at the GO:0004815 proposal the same review already makes on its aminoacyl-tRNA ligase row for the aspartate half. The sentence distinguishing the similarly numbered GO:0070145, mitochondrial asparaginyl-tRNA aminoacylation, is dropped: both terms are now obsolete, so the confusion it guarded against can no longer arise.

    Validation: ai-gene-review validate --terms passes with 3 warnings, the same count as before these edits; backfill-record-sections reports nothing mismatched. The two surviving mentions of GO:0070146 in the file are in the prose explaining its obsoletion.
