  summary: 'Full re-review: KRIT1 (A0A9L0SR44), identified as a C-terminal alternative
    product lacking the HEG1-binding groove'
  details: |
    Full re-review, independent of the ProtNLM2 predictions. A0A9L0SR44 (719 aa, ENSECAT00000146800) is a non-canonical alternative product of horse KRIT1 (ENSECAG00000016850). It is identical to the 736-aa product A0A3Q2GZV2 except that residues equivalent to human 715-731 (HEG1-groove Leu717/Leu721, PMID:23007647) are absent; the Rap1 interface (Arg452) is retained. A new analysis was added (compare_sequences_rereview.py, RESULTS-rereview.md); existing bioinformatics files are unchanged. Annotation actions: cytoskeleton MODIFY to microtubule cytoskeleton; plasma membrane ACCEPT; anchoring junction changed from ACCEPT to UNDECIDED because the product lacks the junction-anchoring residues; two broad ARBA development terms changed from KEEP_AS_NON_CORE to MODIFY to negative regulation of angiogenesis (GO:0016525, a descendant IBA'd to the KRIT1 clade). NEW small GTPase binding and microtubule binding were added, transferred within PTHR13283:SF11. Added a microtubule-binding core function, PMID:23007647, GO_REF:0000033, reference reviews, questions and experiments. Falcon deep research failed (authentication), so cached literature was used.
