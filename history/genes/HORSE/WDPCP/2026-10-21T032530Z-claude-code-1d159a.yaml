  summary: Full re-review of horse WDPCP A0A3Q2KRK8 (non-canonical isoform), independent
    of ProtNLM2
  details: |
    Full re-review independent of ProtNLM2 predictions. Identified A0A3Q2KRK8 as a non-canonical Ensembl transcript product (ENSECAT00000034053) of horse WDPCP: WD40/alpha-solenoid intact, mouse-like N-terminus, alternative 12-residue C-terminus lacking the conserved end of the PIP-binding tail; Ensembl canonical is A0A9L0T876, which alone receives the PTHR13667 IBA set. Added reproducible gene-model comparison (WDPCP-bioinformatics/rereview/). Plasma membrane IEA MODIFY to cell cortex (Xenopus Fritz-GFP cortical, mouse actin/focal adhesion). Axoneme IEA UNDECIDED->ACCEPT (mouse IMCD3 and Xenopus axonemal staining). NEW IBA-grounded axonemal basal plate and cilium organization from PAINT node PTN001007408 (SF5). Rewrote description and core function around CPLANE scaffold role; cached PMID:20671153. Falcon deep research failed (Edison 403 auth), recorded in notes.
