  summary: 'Create review: horse ORC5 (A0A3Q2KSP7), ProtNLM2 DONKEY40 horse partner'
  details: |
    De-novo full review of horse ORC5 A0A3Q2KSP7 (437 aa, full-length; 90.5% identical to human O43913; PTHR12705:SF0). Falcon and perplexity-lite deep research failed (auth/quota), so the review rests on cached human ORC papers (PMID:28112645, 17716973, 12909626, 31160578) and a new horse/human/mouse alignment (ORC5-bioinformatics/compare_orc5.py, RESULTS.md) showing all human ORC5 ATP-site residues conserved. Accepted the three PTN000295037 IBAs (nuclear ORC, DNA replication initiation, DNA replication origin binding) and IEA nucleus; MODIFY IEA origin recognition complex -> nuclear ORC and IEA DNA replication -> DNA replication initiation; NEW ATP binding (ISS from human ORC5). ProtNLM2 predictions were not consulted.
