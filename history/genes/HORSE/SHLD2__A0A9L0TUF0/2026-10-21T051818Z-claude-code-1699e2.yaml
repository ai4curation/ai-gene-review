  summary: Created full review of horse SHLD2 canonical model (A0A9L0TUF0), independent
    of ProtNLM2 predictions
  details: |
    All 10 GOA rows reviewed (3 IBA from PAINT node PTN001025652, 7 Ensembl Compara IEA). Evolutionary grounding: PANTHER PTHR14495:SF2 with human Q86V20; PAINT node PTN001025652 (Eumetazoa) seeded by human SHLD2, which carries only the unsigned HR-regulation term, treated as a deliberate node-level choice; new alignment showing 73.9% identity and 100% coverage of human long isoform Q86V20-2, with the SHLD3/REV7-binding motif (human 6-11) identical, SHLD2C 81.8% identical, the OB-fold-B exon and OB-fold-C zinc-ribbon cysteines conserved, plus horse-specific 39-aa N- and 100-aa C-terminal extensions of unknown status. Accepted nucleus, nucleoplasm, site of DSB, negative regulation of HR and positive regulation of NHEJ; modified chromosome to site of DSB and the unsigned IBA HR term to negative regulation of HR; kept positive regulation of isotype switching as non-core; proposed NEW ISS single-stranded DNA binding and protein-macromolecule adaptor activity. No horse experimental data exists; all functions marked as inferred from the human ortholog. Falcon deep research failed (authentication), recorded in notes.
