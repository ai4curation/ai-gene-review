  summary: 'Create review: horse GPAM canonical product A0A9L0TCA8'
  details: |
    De-novo review of the UniProt gene-centric canonical horse GPAM product (A0A9L0TCA8), the experimentally closest relative of ProtNLM2 benchmark isoform A0A9L0TTC1; done independently of ProtNLM2 predictions. Deep research failed (falcon auth; perplexity quota) and no horse GPAM study exists, so all functions are transferred from human/mouse GPAT1 grounded by PANTHER PTHR12563:SF16 and PAINT node PTN000970957, with a new conservation script (gap-free 94.4% identity to human, HXXXXD and CoA-binding residues conserved). 13 GOA rows reviewed: activity and TAG synthesis accepted; mitochondrion/mitochondrial membrane refined to outer membrane; generic acyltransferase/lipid/phospholipid process rows refined to glycerol-3-phosphate O-acyltransferase activity and phosphatidic acid biosynthesis; bacterial-PlsB-derived plasma membrane removed; CDP-diacylglycerol biosynthesis kept as non-core.
