  summary: 'Create review: horse ATG3 (A0A3Q2L0A4), HORSE40/DONKEY40 partner'
  details: |
    New review of horse ATG3 A0A3Q2L0A4, independent of ProtNLM2 predictions. Deep research failed (falcon auth error, perplexity quota) so the review uses cached human/mouse ATG3 papers and the reviewed human record. New alignment (ATG3-bioinformatics/RESULTS.md) shows the 342-aa model is an alternative gene model with a 28-aa insertion in the catalytic core that no other horse ATG3 entry carries; catalytic Cys and motifs conserved; PTHR12866:SF2 shared with human, mouse and yeast. 21 GOA rows reviewed: ACCEPT 7, KEEP_AS_NON_CORE 5, MODIFY 5 (Atg8-family ligase to conjugating enzyme activity; protein ubiquitination to protein lipidation involved in autophagosome assembly; cytoplasm, autophagy and ubiquitin-like protein transferase to specific terms), MARK_AS_OVER_ANNOTATED 4 (plasma membrane, E3 complex part_of, apoptotic mitochondrial fragmentation, regulation of cilium assembly).
