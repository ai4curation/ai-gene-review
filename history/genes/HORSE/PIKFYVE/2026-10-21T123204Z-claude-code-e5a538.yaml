  summary: 'Create review: horse PIKFYVE (A0A3Q2HE51), DONKEY40 horse partner'
  details: |
    New review of full-length horse PIKFYVE A0A3Q2HE51 (2108 aa, PANTHER PTHR46715:SF1), independent of ProtNLM2 predictions. Falcon and perplexity deep research failed (auth/quota); literature read from cached mammalian PIKfyve papers. Added bioinformatics comparison to human/mouse (92.9% identity; catalytic K1887 and FYVE Zn cysteines conserved). 44 GOA rows reviewed: PtdIns3P 5-kinase, PtdIns 5-kinase, endosome membranes and PAS complex accepted; general MF/CC/BP terms modified to specific descendants (incl. PI(3,5)P2 and PI5P biosynthetic process); PAINT-propagated cell-type processes kept as non-core; Golgi, PI4P 5-kinase, virus endocytosis, nuclear localization and DEP-signal transduction marked over-annotated.
