  summary: 'Create review: horse PTPRN2 canonical model A0A9L0RAE3'
  details: |
    De-novo review of the canonical horse PTPRN2 model (UP000002281), independent of ProtNLM2 predictions. Falcon deep research failed (auth) and perplexity-lite fallback failed (quota), so the review uses cached ortholog literature and a new sequence analysis (PTPRN2__A0A9L0RAE3-bioinformatics/compare_sequences.py): PANTHER PTHR46106:SF5 shared with human/mouse/rat PTPRN2, 96.2% identity to human over the PTP-like domain, catalytic Cys984, P-loop, WPD Asp, Q-loop Gln and sorting motifs conserved. Of 11 GOA rows: protein tyrosine and Tyr/Ser/Thr phosphatase activity REMOVE (subfamily inactive on phosphoproteins); hydrolase activity MODIFY to phosphatidylinositol phosphate phosphatase activity; secretory granule MODIFY to dense core granule membrane; synapse and transport vesicle membrane MODIFY to synaptic vesicle membrane; insulin secretion and regulation of secretion IBA ACCEPT; signaling receptor complex (Compara projection of an unverifiable human IDA) UNDECIDED. All functions are inferred; none is experimentally established in horse.
