  summary: 'Create review: horse PDIA4 (A0A3Q2IEH6)'
  details: |
    New review of horse PDIA4 (A0A3Q2IEH6, DONKEY40_HORSE_PARTNER cohort), independent of ProtNLM2 predictions. Full-length 645 aa ortholog of human PDIA4 (90% identity, PANTHER PTHR18929:SF210, all three CGHC sites, signal peptide and REEL retrieval motif conserved; new alignment in PDIA4-bioinformatics). 11 GOA rows reviewed: ACCEPT PDI activity (IBA, IEA), ER lumen, protein folding; MODIFY ER (IBA, IEA) to ER lumen and catalytic activity acting on a protein to PDI activity; KEEP_AS_NON_CORE cell surface and response to ER stress; MARK_AS_OVER_ANNOTATED melanosome and cell redox homeostasis. Falcon deep research failed (Edison 403); review based on cached literature, UniProt and PAINT.
