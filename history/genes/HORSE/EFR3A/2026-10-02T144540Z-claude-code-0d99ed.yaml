  details: |
    Weekly compliance pass. The review had empty findings on all four references and no suggested_questions/suggested_experiments (weighted compliance 45.45). Added the horse UniProt record as a fifth reference and fourteen bounded reference findings with verbatim supporting_text and reference_section_type, plus reference_review on every reference. The findings make the existing UNDECIDED action on GO:0005886 checkable rather than asserted: the horse record's own sequence begins MIDKDGLVKA after the initiator Met, and the alignment shows human residues 2-26, carrying the Cys6-Cys9 palmitoylation cluster, are missing from this model; PMID:23229899 identifies that Cys-rich motif as conserved in all metazoans, shows the C6S/C7S/C8S/C9S mutant relocalizes to the cytosol, and shows the equivalent EFR3B mutant fails to recruit TTC7B and the kinase; and human UniProt records EFR3A as the membrane-anchoring component of the PI4KA-EFR3-TTC7-HYCC complex. Also recorded the Q14156-2 human splice isoform that lacks residues 1-36, human sequence cautions for erroneous extended N-termini, and the analysis's own refusal to establish orthology or verify the prediction-time input, keeping the truncation a model limitation rather than a demonstrated equine difference. Added three expert questions and three experiments covering 5-prime transcript mapping, palmitoylation plus localization with the published mutant controls, and separating complex assembly from membrane anchoring. No annotation actions, GO terms or core_functions were added or changed. Schema, reference and best-practices validation pass; weighted compliance 100.00.
    Followed up on PR #3876 review by correcting the residue accounting for the selected model: horse Met1 aligns to human Met1, human residues 2-26 are deleted, and residue 29 is only the point where contiguous identity resumes. Replaced the generic "three isoforms" finding with the exact Q14156-2/VSP_022217 deletion and added the neighboring human sequence-caution evidence.
