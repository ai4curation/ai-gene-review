  summary: Full re-review of SHLD2 (A0A9L0RGD6), independent of ProtNLM2
  details: |
    Established that A0A9L0RGD6 is a non-canonical Ensembl transcript model (883 aa, 8 exons) of horse SHLD2; the canonical product is A0A9L0TUF0 (1047 aa). New alignment of all seven horse models to human Q86V20 isoforms (compare_isoforms_rereview.py, RESULTS-rereview.md) shows the benchmark model keeps the SHLD3-MAD2L2-binding N-terminus, OB folds A/B and the OB-C zinc ribbon but loses the remainder of OB fold C and the distal SHLD1-binding region (human iso-1 731-835), replaced by a divergent tail. Rewrote the description; added NEW ISO nucleus and site of double-strand break (grounded in PTHR14495:SF2 and PAINT node PTN001025652, with human evidence that OB-fold mutants still localize); no process terms added because end protection needs the truncated module; core function is the shieldin scaffold at DSB sites, with a caveat and knowledge gap. Falcon deep research failed (403 authentication).
