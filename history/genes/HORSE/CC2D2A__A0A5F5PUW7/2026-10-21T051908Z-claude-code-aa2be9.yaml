  summary: 'Create review: horse CC2D2A A0A5F5PUW7 (gene-centric canonical model)'
  details: |
    De-novo review of the full-length horse CC2D2A model A0A5F5PUW7 (PTHR20837:SF7, below PAINT node PTN000464650), independent of ProtNLM2 predictions. Falcon deep research failed (authentication) and the perplexity-lite fallback failed (quota), so the review uses cached mouse, human, worm and zebrafish primary literature. New bioinformatics analysis (compare_orthologs.py, RESULTS.md) shows 88.9% identity to human CC2D2A, 42% to the CC2D2B paralog, and 25/26 human disease missense positions conserved. All 3 IBA rows and the 4 Compara IEA rows for transition zone, MKS complex, cilium assembly and TZ protein localization were ACCEPTed; smoothened signaling was kept as non-core (CC2D2A gates ciliary Smo entry). Added NEW ISS ciliary basal body and centriolar subdistal appendage rows from mouse immunogold and human RPE1 data. No horse experimental data exist; every function is an orthology inference.
