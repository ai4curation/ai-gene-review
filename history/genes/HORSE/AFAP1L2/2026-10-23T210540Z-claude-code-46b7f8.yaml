  summary: ProtNLM2 prediction rescoring
  details: |
    All 9 ProtNLM2 terms are carried in GOA by another horse AFAP1L2 product (A0A3Q2HBW2; IBA from PTN002682769 and/or Ensembl Compara IEA from human Q8N4X5), so none is novel. COR->CNN: GO:0032675, GO:0007346, GO:0030296, GO:0032757, GO:0042169, GO:0017124, GO:0045742 (supported by human/rodent XB130 experiments in the same PTHR14338:SF4 subfamily; human review ACCEPT or KEEP_AS_NON_CORE). COR->NPI (CURATION_MISTAKE): GO:0045893 (cytoplasmic adaptor, reporter gain is distal Src readout; human review MARK_AS_OVER_ANNOTATED) and GO:0006954 (cell-line cytokine readout only; human review MARK_AS_OVER_ANNOTATED; Xb130 KO mice show enhanced inflammation, PMID:27029000, PMID:30820526). Replaced RESULTS.md quotes with RESULTS-rereview.md feature-level quotes; added PMID:26446840, PMID:27029000, PMID:30820526 and PAINT tsv support.
