  summary: 'Create review: horse ATG4C (A0A3Q2H6C4), ProtNLM2-independent full review'
  details: |
    New review keyed to A0A3Q2H6C4 (DONKEY40_HORSE_PARTNER cohort). Sequence analysis (ATG4C-bioinformatics/compare_sequences.py, RESULTS.md) shows the 666-aa horse model conserves the human ATG4C catalytic domain (1-400, 90-100% identity) and the C111/D345/H347 triad but replaces the canonical C-terminal ~55 residues with ~263 residues of unrelated low-complexity sequence, most likely a gene-model error. 15 GOA rows reviewed: catalytic MF (cysteine-type endopeptidase, PE-deconjugating), autophagosome assembly, protein processing and cytoplasm accepted; general terms (cysteine-type peptidase activity, proteolysis, autophagy) refined to specific terms the gene already carries; mitophagy (ATG4C reported weakly or not involved) and yeast-specific piecemeal microautophagy of the nucleus marked over-annotated; aggrephagy kept as non-core. Falcon deep research and the perplexity-lite fallback both failed; recorded in notes. ProtNLM2 predictions were not used.
