  details: |
    GO:0006511 ubiquitin-dependent protein catabolic process: CNN (2) -> UNC (1). The term overlaps only an electronic UniRule IEA that the re-reviewed gene review marks MARK_AS_OVER_ANNOTATED; annotation overlap is not biological support. USP8 effects on turnover are substrate-dependent (stabilizes Nrdp1/STAM, PMID:15314180; required for EGFR/Met degradation, PMID:16520378); human curators used regulatory terms and no experimental or PAINT annotation assigns GO:0006511, so the evidence neither establishes nor refutes participation. Added PMID:16520378 and PMID:15314180 quotes.
