  summary: Full re-review of USP8 (A0A9L0T7K6), independent of ProtNLM2
  details: |
    Full re-review independent of ProtNLM2 predictions (falcon deep research failed: authentication). New gene-model analysis (compare_horse_models_rereview.py / RESULTS-rereview.md) shows A0A9L0T7K6 is an alternative-3'-terminal-exon product of horse USP8 (ENSECAG00000006611) that replaces the C-terminal YILFY strand segment of the USP domain while retaining MIT, rhodanese, Ser717 14-3-3 site and catalytic Cys785/His1066; F7BV54 is the human-isoform-1-equivalent product. Grounded functions on PANTHER SF27 and PAINT nodes PTN008371010/PTN008578257. Changes: cytoplasm ACCEPT->MODIFY (to cytosol, endosome membrane); ubiquitin-dependent protein catabolic process ACCEPT->MARK_AS_OVER_ANNOTATED (USP8 regulates turnover bidirectionally, does not perform catabolism); other rows re-justified with primary literature (PMID:16520378, 17711858, 18388320, 15314180, 28505279). Rewrote description and core_functions with splice-form caveat; added suggested question/experiment; status COMPLETE.
