    New review of the ProtNLM2 benchmark accession A0A5F5Q204 (DONKEY40 horse partner). All 40 IEA/IBA rows were reviewed: 13 ACCEPT, 5 MODIFY (apoptotic process to GO:0008625, signal transduction to GO:0033209, signaling receptor activity to GO:0005031, signaling receptor complex IBA+IEA to GO:0002947), 6 KEEP_AS_NON_CORE, 16 MARK_AS_OVER_ANNOTATED (mouse phenotype-derived and ARBA processes). Function was transferred from human TNFR1 on 1:1 orthology (PANTHER PTHR46861:SF1, PAINT PTN002930098). A new bioinformatics analysis shows A0A5F5Q204 keeps all four CRDs, the TM helix and the death domain, and has a 22-residue N-terminal extension relative to human and sibling model A0A5F5PQM0. Deep research failed (falcon auth, perplexity quota).
