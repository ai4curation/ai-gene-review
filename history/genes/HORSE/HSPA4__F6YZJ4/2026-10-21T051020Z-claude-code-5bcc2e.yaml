  summary: 'Create review: horse HSPA4 canonical product F6YZJ4'
  details: |
    De-novo review of F6YZJ4, the full-length canonical product (840 aa, PANTHER PTHR45639:SF6) of horse HSPA4, as the reference for the ProtNLM2 benchmark entry A0A9L0S5Z5; independent of ProtNLM2 output. All 12 GOA rows (IBA/IEA only) reviewed: Hsp110 NEF activity, cytosol and protein folding accepted via PAINT nodes PTN002900795/PTN000452854 and human Apg2 biochemistry; ATP hydrolysis marked over-annotated (PAINT omits it at the Hsp110 node); cytoplasm->cytosol and organelle->nucleus; two Compara projections of unverifiable human Tom40 IDAs left UNDECIDED. No function is experimentally established in horse. Falcon deep research failed (403 auth) and the perplexity-lite fallback failed; recorded in notes.
