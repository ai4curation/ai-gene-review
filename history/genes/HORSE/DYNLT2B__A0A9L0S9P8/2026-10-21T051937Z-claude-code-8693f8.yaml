  summary: 'Create review: HORSE DYNLT2B (A0A9L0S9P8, UniProt gene-centric entry)'
  details: |
    New review of the UniProt reference-proteome gene-centric entry for equine DYNLT2B (A0A9L0S9P8, PANTHER PTHR21255:SF7), independent of ProtNLM2 predictions. GOA has no rows, so no existing annotations were adjudicated. Falcon deep research failed (perplexity-lite fallback quota 401); review uses cached human/mouse papers and the human Swiss-Prot record. New sequence analysis (compare_s9p8.py -> RESULTS.md) shows the model lacks an initiator Met and its 40-residue N-terminal prefix replaces the human-like first Tctex beta-strand (1/8 identical), while the last 105 residues are identical to A0A9L0TLH8 and human-conserved including the C-terminal strand. Added two NEW ISO rows (GO:0045505 dynein intermediate chain binding, GO:0005868 cytoplasmic dynein complex) grounded in SF7 membership and the PAINT node PTN000478852; core function MF+complex only. Human IMP-only process terms (retrograde IFT, cilium assembly) not propagated by PAINT were deliberately not transferred; mouse sperm-flagellum phenotypes not annotated. No equine experimental evidence exists.
