  summary: 'Create review: horse RASGEF1A (A0A9L0R5H6)'
  details: |
    New full review of horse RASGEF1A A0A9L0R5H6 for the ProtNLM2 DONKEY40/DONKEY40_HORSE_PARTNER cohort, independent of ProtNLM2 predictions. Alignment to human Q8N9B8 (96.25% identity, both GEF domains complete; 5-aa N-terminal extension and 44-aa REM-region insertion in the horse gene model). GEF activity ACCEPTed (IBA+IEA); small GTPase-mediated signal transduction ACCEPTed as the most specific firmly supported process given the Rap2-vs-Ras substrate conflict between PMID:19645719 and PMID:17121879; Ras protein signal transduction, positive regulation of Ras signalling, cell migration and plasma membrane kept as non-core. Ura 2006 Ras-activity finding recorded as DISPUTED. Deep research failed (falcon auth, perplexity quota).
