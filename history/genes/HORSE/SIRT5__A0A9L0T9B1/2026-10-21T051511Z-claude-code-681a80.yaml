  summary: New full review of horse SIRT5 (A0A9L0T9B1), independent of ProtNLM2 predictions
  details: |
    Reviewed all 17 GOA rows. Acidic deacylase MFs (GO:0036054/36055/61697), mitochondrial matrix and cytosol accepted as inherited from SIRT5-subfamily PAINT nodes PTN000119399/PTN000872307 with all catalytic, acyl-pocket, zinc and NAD+ residues conserved (88% identity to human). Deep-node histone deacetylase IBA modified to the deacylase activities; mitochondrion refined to matrix; chromatin remodeling IEA removed; nucleus, zinc, NAD+ binding and weak deacetylase kept as non-core. No horse experimental data exist; all functions are ortholog inferences. Deep research (falcon/perplexity) failed on auth/quota.
