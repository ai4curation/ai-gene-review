  details: |
    New review of the full-length horse SLC27A5 model A0A5F5PXH2, the same-gene relative of ProtNLM2 benchmark F6X2Q2; independent of ProtNLM2 output. Corrected gene_symbol from the UniProt/VGNC name ZBTB45 to SLC27A5. All 14 GOA IEA rows reviewed: 6 ACCEPT (cholate-, long-chain and very-long-chain fatty acid-CoA ligase, LCFA and VLCFA metabolism, ER membrane), 4 KEEP_AS_NON_CORE (LCFA transporter activity and transport, basal plasma membrane, bile acid biosynthesis), 4 MODIFY of general terms to specific ones already on the gene; 1 NEW (bile acid metabolic process, matching PAINT node PTN008678717). Functions transferred on PANTHER PTHR43107:SF25 membership shared with human and mouse SLC27A5, backed by a new reproducible alignment (80.9% to human, motif conserved); nothing is experimentally established in horse. Falcon and perplexity-lite deep research failed (auth/quota); cached mouse knockout papers PMID:16618416 and PMID:16618417.
