  summary: 'Create review: horse SNAP23 (A0A3Q2HTF1)'
  details: |
    De-novo full review of horse SNAP23 A0A3Q2HTF1 (DONKEY40_HORSE_PARTNER), independent of ProtNLM2 predictions. Falcon deep research failed (authentication error; perplexity-lite fallback 403), so the review uses cached literature on human/mouse SNAP23 (same PANTHER subfamily PTHR19305:SF4) and a new sequence comparison (SNAP23-bioinformatics/RESULTS.md: 211 aa, 87.2% identical to human O00161, both SNARE motifs and palmitoylated cysteines conserved). Accepted t-SNARE fusogenic activity, syntaxin binding, SNARE complex, plasma membrane and exocytosis (IBA and IEA rows). Marked synaptic vesicle priming, synaptic vesicle fusion to presynaptic active zone membrane (IBA from PTN000447754, Drosophila Snap25 donor only) and the derived presynapse IEA as over-annotated, because SNAP23 diverged from SNAP25's synaptic role after duplication (PMID:12859899, PMID:17728451).
