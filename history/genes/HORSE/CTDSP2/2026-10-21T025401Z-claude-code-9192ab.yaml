  summary: 'Full re-review: CTDSP2 (F7A4N8), independent of ProtNLM2'
  details: |
    Full re-review of horse F7A4N8, with no GOA annotations to adjudicate. A new gene-model analysis (compare_sequences_rereview.py, RESULTS-rereview.md) shows that F7A4N8 is the product of the non-canonical Ensembl transcript ENSECAT00000020049. That transcript's extended exon adds a 90-residue unrelated tail and a premature stop, so the product lacks the FCP1 catalytic domain. The full-length catalytic product of the same gene is A0A9L0T5X1 (Ensembl canonical), which groups with the PANTHER SF187 CTDSP2 orthologs. The description was rewritten, the references updated (no reference removed), and the questions and experiments retargeted. No core function is asserted for the truncated product. Falcon deep research failed on authentication and the perplexity-lite fallback on quota; both are recorded in the notes.
