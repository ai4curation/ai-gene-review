  details: |
    Weekly compliance pass. The review had empty findings on all five references and no suggested_questions/suggested_experiments (weighted compliance 41.67). Added the two primary sources already cited in OLFML2A-notes.md (PMID:22913984 podocyte localization, PMID:18757743 extracellular-matrix screen) as proper references, bringing the list to seven, and added nineteen bounded reference findings with verbatim supporting_text and reference_section_type plus reference_review on every reference. The findings ground the existing UNDECIDED action on GO:0005576 in two directions: the human signal peptide occupies residues 1-27 and photomedin-1 is secreted as a disulphide-bonded dimer that is cleaved after secretion, so secretory entry is a prerequisite for the characterized mature form; while the alignment places a 26-residue gap opposite that region plus a second 22-residue internal deletion opposite human 123-144, and explicitly declines to conclude the horse gene is intracellular. Also recorded that the human Secreted, homodimer and cleavage annotations carry ECO:0000250 similarity transfer from mouse Q8BHP7 rather than direct human evidence, and that the PMID:18757743 abstract does not name OLFML2A or report which assay it passed - so it is cited only for screen design, per the notes' caution against a specific matrix-organization claim. Added three expert questions and three experiments covering 5-prime transcript mapping, secretion plus glycosaminoglycan binding, and tissue immunolocalization. No annotation actions, GO terms or core_functions were added or changed. Schema, reference and best-practices validation pass; weighted compliance 100.00.
