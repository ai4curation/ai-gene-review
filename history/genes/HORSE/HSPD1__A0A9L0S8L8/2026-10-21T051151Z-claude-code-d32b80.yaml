  details: |
    De-novo review of the canonical horse HSPD1 product (A0A9L0S8L8; Ensembl canonical ENSECAT00000137290), independent of ProtNLM2 predictions. All 63 electronic/IBA GOA rows reviewed: core chaperonin folding, Hsp10 binding, ATP binding and mitochondrial matrix accepted on the basis of 1:1 orthology to human P10809 (all residues present) and PAINT PTHR45633 node placement (PTN000143677, PTN000143509); CCT complex (ARBA) removed as the wrong chaperonin type; mitochondrion, T cell activation and cytokine production modified; LPS-confounded immune and exogenous-uptake location terms marked over-annotated; moonlighting terms kept as non-core, mirroring the human HSPD1 review. No horse experimental functional evidence exists; all functions are flagged as inferred. Falcon and perplexity-lite deep research failed (Edison 403 authentication), recorded in notes.
