  summary: Created full review of horse WDPCP (A0A9L0T876), independent of ProtNLM2
    predictions
  details: |
    All 11 GOA rows reviewed. A0A9L0T876 is the Ensembl canonical product of horse WDPCP (ENSECAG00000019956), PANTHER PTHR13667:SF5, carrying the PAINT PTN001007408 IBA set. New reproducible analysis (analyze_canonical_model.py) shows it is identical to the full-length model A0A9L0R7M2 over residues 1-660, then ends in a 96-residue tail from an alternative terminal exon inside an intron, losing the mouse-mapped PIP-binding last-60-residue tail (only 6 of 60 retained, S708 absent) while keeping the propeller and solenoid. Accepted cilium organization, establishment of protein localization, axonemal basal plate (IBA+IEA) and axoneme; modified ARBA plasma membrane to cell cortex; removed Ensembl Compara phosphatidylinositol binding for this product because the binding module is absent; kept nervous system development and the digit/tongue/palate phenotype-derived terms as non-core. No horse experimental data exist; all functions marked inferred. Falcon deep research failed (Edison auth 403) and is recorded in notes.
