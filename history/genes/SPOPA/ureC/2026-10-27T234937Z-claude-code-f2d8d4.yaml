  summary: Create review of Sporosarcina pasteurii urease alpha subunit (P41020)
  details: |
    Reviewed all 7 GOA rows for P41020. ACCEPT for cytoplasm, both urease activity rows (EXP PMID:30969470 and the UniRule IEA), nickel cation binding and urea catabolic process; TOO_GENERAL for hydrolase activity and for hydrolase activity acting on carbon-nitrogen bonds, both entailed by the accepted GO:0009039. Added GO:0035550 urease complex as NEW, since GOA gives the complex term only to the beta subunit. Core function: urease activity in the cytoplasmic urease complex, dinickel site on this subunit. Notes file records the structural and spectroscopic evidence and two caveats on CMMMech's MICP grounding (representative-only evidence; the reaction is cytoplasmic).
