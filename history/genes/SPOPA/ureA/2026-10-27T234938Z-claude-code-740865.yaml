  summary: Create review of Sporosarcina pasteurii urease gamma subunit (P41022)
  details: |
    Reviewed all 5 GOA rows for P41022. REMOVE for GO:0016151 nickel cation binding with two source_defects against InterPro's interpro2go mappings on IPR002026 and IPR036463, since the urease dinickel site is carried entirely by the alpha subunit P41020. MARK_AS_OVER_ANNOTATED for urease activity (complex-level reaction on a non-catalytic chain), KEEP_AS_NON_CORE for urea metabolic process, ACCEPT for cytoplasm and urea catabolic process. Added GO:0035550 urease complex and GO:0005198 structural molecule activity as NEW, following the PSEPK ureA precedent. Core function: structural subunit contributing to urease activity.
