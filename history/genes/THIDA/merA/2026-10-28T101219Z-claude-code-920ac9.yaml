  summary: Cite the committed UniRule UR000329331 record and remove the false no-committed-artifact
    claim
  details: |
    Third review follow-up on PR #5647, correcting a false claim made in the previous session. That session recorded the UniRule UR000329331 contents as reasoning only, stating that no committed artifact existed for the rule. That statement was wrong: `rules/unirule/UR000329331/UR000329331.json` is committed (with an `.enriched.json` beside it, one of 4535 cached rules), and `rules/rules-export-go-summary.csv` carries the same rule's GO assertions as a flat table. Both are now cited as `file:` references, following the `genes/PSEPK/tgt` precedent for citing a cached UniRule record. The rule's complete GO assertion set is quoted as the five contiguous rows the GO summary holds for UR000329331 and no others (GO:0016152, GO:0016668, GO:0046689, GO:0046872, GO:0050660), and the old rule number is quoted from the rule record itself. The absence of GO:0003955 is stated in the defect explanations as a reading of two complete records rather than left to be inferred from a quote, because a quote cannot carry a negative. The uncitable framing has been removed from the GO:0003955 and GO:0016668 defect explanations and from both passages in merA-notes.md that carried it. The `IEA:UniProtKB-UniRule` versus `IEA:TreeGrafter` contrast in the entry's own GO cross-references is kept as prose reasoning in the `reason` and defect explanations and is deliberately not cited in `supported_by`, since a record's own `DR GO` lines restate an annotation rather than support it. No action, confidence or defect routing changed: the three defects still route as GO_CENTRAL on PTN002453100 for GO:0003955, InterPro on IPR012999 and UniProt on UR000329331 for GO:0016668, with UniProt seeing only the GO:0016668 row.
