  details: |
    Reviewed all 9 IEA annotations for the TrEMBL entry Q3SJ73 (Tbd_1341). Accepted GO:0016152, GO:0045340, GO:0050660 and GO:0050787; kept GO:0050661 as non-core; refined GO:0016491 and GO:0046872 to the specific terms already present; removed GO:0003955 (TreeGrafter propagation from a PANTHER node seeded only by M. tuberculosis LpdA) and GO:0016668 (InterPro2GO mapping describing a sulfur-group donor, while the MerA substrate is Hg(II)), each with a source defect. Added a Biopython alignment against Tn501 MerA P00392 showing 61.2% identity and conservation of the NmerA, redox-active and C-terminal cysteine pairs.
