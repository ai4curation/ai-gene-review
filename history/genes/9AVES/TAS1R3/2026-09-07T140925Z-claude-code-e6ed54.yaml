  summary: 'Create review: TAS1R3 (hummingbird, shared dimerization partner of the
    repurposed sweet receptor)'
  details: |
    De-novo AI review of TAS1R3 (UniProt A0A7L3N407, fragment) in the hummingbird Oreotrochilus melanogaster (Bird 10,000 Genomes WGS assembly), curated alongside TAS1R1 as its obligate dimerization partner. TAS1R3 normally pairs with either TAS1R1 (umami) or TAS1R2 (sweet) in vertebrates; in hummingbirds it pairs with TAS1R1 to form the repurposed sugar receptor per Baldwin et al. 2014 (PMID:25146290), since TAS1R2 is pseudogenized/absent. Explicitly flagged that no species-specific experimental data exists for this exact accession/species; claims rest on family-wide literature and PANTHER homology (PTHR24061). Validated with just validate 9AVES TAS1R3 (clean).
