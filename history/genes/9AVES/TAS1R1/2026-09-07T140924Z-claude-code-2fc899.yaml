  summary: 'Create review: TAS1R1 (hummingbird, sweet-taste-repurposed umami receptor
    subunit)'
  details: |
    De-novo AI review of TAS1R1 (UniProt A0A7L3NBT4, fragment) in the hummingbird Oreotrochilus melanogaster (Bird 10,000 Genomes WGS assembly). Curated as the functional partner of the umami/sweet receptor heterodimer, deliberately excluding the pseudogenized/absent TAS1R2 paralog. Modified a TreeGrafter-propagated 'sensory perception of umami taste' annotation to 'sensory perception of sweet taste' and proposed a matching NEW term, per Baldwin et al. 2014 (PMID:25146290) which showed hummingbirds repurposed the ancestral TAS1R1+TAS1R3 umami receptor to detect sugars after losing TAS1R2. Explicitly flagged that no species-specific experimental data exists for this exact accession/species (the original Baldwin study used Calypte anna); claims rest on family-wide literature and PANTHER homology (PTHR24061). Corrected placeholder gene_symbol/taxon header metadata. Validated with just validate 9AVES TAS1R1 (clean).
