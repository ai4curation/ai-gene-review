- type: EDIT
  outcome: changed
  summary: Record OpenScientist refutation of FdeD as the FdeE reductase, with three
    partner classes excluded and the partner still unresolved
  details: |
    Ran an OpenScientist deep-research job (kgap-fded-electron-partner) on the gap asking whether FdeD is needed for naringenin degradation and which protein it exchanges electrons with. It confirms the suspicion in the gap's own significance clause, eliminates three of the four established partner classes, and then reports that the genome cannot finish the job.

    The reading the databases imply is refuted. FdeE carries the PF01494 signature of the PHBH/UbiH-like group A flavoprotein monooxygenases, which hold FAD as a tightly bound prosthetic group and are reduced directly by NAD(P)H, and the fde locus contains no flavin-reductase or ferredoxin-reductase domain at all. FdeD is therefore not the reductase of FdeE, and the KEGG association is operon co-membership. That is the alternative this review's hypothesis raised, and it holds.

    Three of four partner classes are then excluded: no ring-hydroxylating oxygenase gene is in the locus and the nearest complete system, about 300 genes away, already carries its own reductase; a Pfam scan for the diiron multicomponent monooxygenase hydroxylase domains returns zero hits genome-wide; and FdeD has no membrane anchor and is not in a bc1 operon. The diiron exclusion is the sharpest conflict in the analysis, because FdeD's own CPH ligand triad is the feature pointing at that class. The remaining locus-internal candidate is reactivation of a VOC-family extradiol dioxygenase: FdeC sits 45 base pairs upstream, exactly the operon position xylE occupies relative to xylT, a strong functional precedent, but XylT and its relatives are plant-type four-cysteine ferredoxins rather than Rieske proteins, so the analogy supports the category and not a structural homology claim.

    Two further results narrow without closing. FdeD belongs to no characterised Rieske clade: inter-cysteine spacing 24 residues against 18 to 21 across all 21 reviewed references and 19 to 20 across all 14 ring-hydroxylating ferredoxins, with fde-locus homologs spanning 24 to 29, a range not overlapping the reference range at any value. And structure discriminates nothing, the model superposing equally well on three different partner classes within 0.33 Angstrom.

    On requirement, fdeD co-occurs with fdeE in 58 of 65 genomes within six genes and 57 of 65 within two, with all four cluster ligands retained in 40 of 40 homologs; the local record confirms Cys43, His45, Cys67 and His70 in 112 residues. That is conservation under selection and it rules out the degenerate-relic reading the gap raises. It is not requirement: the one step with a purified enzyme runs without FdeD, no deletion exists in any organism, and eight of the 65 genomes carry no adjacent small Rieske gene, with two of those having directly adjacent flanking genes, which argues for genuine absence rather than an assembly gap.

    The run's one clean curation action is already taken here. It flags EC 2.7.1.50 and GO:0004417 hydroxyethylthiazole kinase activity, inherited from the EMBL submission in a protein whose entire length is one Rieske domain, and this review already removes that row. The local record confirms the EC carries submitter-imported evidence, that PF00355 Rieske is its only Pfam match, and protein-existence level 4. So this is corroboration rather than a new action.

    Three caveats the run states are recorded: the 89.2 per cent co-occurrence is a lower bound, since a 112-residue gene is easy to miss in a draft assembly and several windows lacking fdeD also lack other fde components and may not be naringenin loci; the CPH triad result rests on only three reference proteins in the diiron class; and its percent identities come from a custom alignment without a substitution matrix, so values near 20 per cent are approximate and should not be ranked against one another.

    Gap status moved from OPEN to NARROWING. No annotation action was changed. Not recomputed here: the 37-protein Rieske survey, the Pfam scans and absence calls, the locus-tag candidates, the 65-genome synteny counts, the 40-homolog ligand survey, and the superpositions.
