  summary: Record OpenScientist GH10 analysis refuting cleft-geometry substrate assignment
    for Tlr1902
  details: |
    Ran an OpenScientist deep-research job (kgap-tlr1902-glycan-specificity) on the knowledge gap covering which glycan Tlr1902 hydrolyses. The catalytic chemistry is confirmed and the structural approach is refuted, so the gap was left OPEN.

    Confirmed against the local Q8DHP3 record: the PROSITE GH10 domain at 60-329, both catalytic glutamates at the annotated active-site positions 166 and 264 in their canonical motif contexts, and all thirteen residues of the canonical GH10 minus-one subsite. The run adds a rotation-invariant check, the carboxylate separations of 6.96 and 5.37 Angstrom falling inside the range set by two crystallised retaining GH10 enzymes, so the enzyme is a retaining glycosidase with an undecayed active site.

    The refutation is the valuable result. The run built the comparison the hypothesis asked for across nine structurally characterised GH10 enzymes, and the assay failed its own negative control: Cellulomonas fimi Cex, a GH10 that hydrolyses glucose-configured substrates, is statistically indistinguishable from six strict xylanases. The mechanistic reason is in the data, since Streptomyces lividans Xyn10A shows 3.70 Angstrom clearance when glucosyl-bound against 2.43 to 2.50 when xylose-configured, with a different tryptophan contacting the sugar, so the apparent exclusion of the glucose hydroxymethyl is induced fit rather than a fixed steric filter. The run also reports its own assay underpowered independently of that, the superposition error exceeding the entire between-enzyme spread it would need to resolve.

    What survives is a genomic and physiological argument that plant xylan is an unlikely substrate: the strain encodes one of seven steps needed to use xylan as a carbon source, has no xylose catabolism or transport, the gene is not clustered with carbohydrate-utilisation genes, and it is not induced in the one usable public transcriptome. Also recorded is that no cyanobacterial GH10 has ever been assayed, with zero of 136 cyanobacterial family members in Swiss-Prot, so every activity statement on this entry is inference from distant homologues.

    A new gene_model_issues entry records, as WRONG_START_SITE with status SUSPECTED, the run's report that UniProt Q8DHP3 is truncated by 27 residues at the N terminus and that the missing extension carries a lipoprotein signal peptide with a canonical lipobox. If right, the entry omits the targeting information that places the protein outside the cytoplasm, which bears on whether it can reach an extracytoplasmic glycan, and the AlphaFold model built on the deposited sequence lacks the anchor. It is marked SUSPECTED because the local record contains only the truncated sequence, so confirming it needs the genomic sequence upstream of the annotated start. This is also the run withdrawing its own earlier objection that the protein is cytoplasmic.

    No annotation action was taken. The run recommends retaining the molecular function term with a family-inference flag and removing or generalising the xylan catabolic process term. Both relevant rows, GO:0031176 and GO:0045493, are already UNDECIDED in this review, which is the appropriate non-endorsement, and moving the process row to REMOVE would rest on a genome-content argument that could not be verified here.
