  summary: Record OpenScientist finding that the AcrIIC1 switch midpoint was never
    measured and the native cytoplasm is too reducing to form the bond
  details: |
    Ran an OpenScientist deep-research job (kgap-acriic1-native-redox) on the gap asking whether the AcrIIC1 redox switch operates in the native Neisseria meningitidis cytoplasm. It put the two numbers side by side as the hypothesis asked and found that one of them does not exist, which is the outcome the prompt licensed.

    The switch potential was never measured: no midpoint has been determined for this cysteine pair, so the original characterisation compared the protein against a borrowed range rather than against its own thermodynamics. The cytoplasmic side does have a number, -314.4 mV, but it is an E. coli measurement, which the run itself calls the weakest joint in the argument.

    Within those limits the direction is clear and quantitative: for the interchain bond to form, the pair's midpoint would have to be more reducing than thioredoxin itself, and nothing identified pushes the neisserial cytoplasm oxidising enough to form it. The organism has the reductive machinery, with a functional thioredoxin reductase shown in vivo, though it carries gshA and gshB with no detectable glutathione reductase by either KEGG orthology or an enzyme-number search, so its glutathione couple is not recycled by the canonical route and may sit differently.

    The compartment question is settled rather than assumed: the protein has no export signal, which the local record agrees with, so the cytoplasmic potential is the only one that applies. That matters because the run identifies compartment confusion as the most plausible route to a contrary reading, since this organism genuinely holds a strongly oxidising thiol environment, with DsbA paralogues measured at -80 mV in N. meningitidis itself and an essential DsbD, all of it periplasmic and where AcrIIC1 never arrives.

    The conservation test the hypothesis asked for returns the answer that argues against physiological importance, and it runs opposite to the usual inference: the cysteine pair is present in only 11 of 96 homologs and has been lost inside the same genus, which is the profile of a dispensable feature rather than a conserved regulator. The local record carries the pair as Cys17 and Cys80 among its four cysteines in 86 residues, annotated as an interchain disulphide from a deposited structure, which is an observation of the crystallised and biochemically handled protein rather than of an in vivo state. The run flags that a curator reading only that feature could reasonably infer a constitutive native disulphide.

    Two things keep this from being closed. The run notes that the original authors had already reached the same conclusion, writing that most AcrIIC1 molecules should be reduced under normal physiological conditions, so what has changed is that the claim now rests on a measured cytoplasmic number instead of a borrowed window, and the disagreement is only with secondary readings that treat the disulphide as a native regulator. And a transient oxidative excursion remains a real untested alternative, through the microaerobic niche or the host neutrophil burst, with no such measurement existing for this organism; the run weighs against it by noting that in E. coli a millimolar peroxide bolus was needed to see the effect in cells, and that direct work there argues protein thiols are not the primary targets of intracellular reactive oxygen species.

    Gap status moved from OPEN to NARROWING rather than closed, because the switch midpoint has never been measured and the cytoplasmic figure is a cross-species proxy. No annotation action was changed. Verified locally: 86 residues, four cysteines with Cys17 and Cys80 carrying the interchain DISULFID annotation from a deposited structure, no SIGNAL feature, protein-existence level 1. Not recomputed: the potential measurements and their provenance, the thioredoxin couple values, the 96-homolog conservation survey, the glutathione reductase searches, and the peroxide literature.
