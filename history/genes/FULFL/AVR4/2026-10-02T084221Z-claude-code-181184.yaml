  details: |
    Curated all 10 GOA annotations for Fulvia fulva AVR4 (Q00363), the CBM14 chitin-binding effector that shields hyphal wall chitin from plant chitinases and is recognised by tomato Cf-4. Actions: 3 ACCEPT (extracellular region IEA, chitin binding EXP and IEA), 5 KEEP_AS_NON_CORE (Cf-4-dependent HR / perturbation of host immunity rows), 1 MODIFY (GO:0140403 suppression of host innate immune response -> GO:0141177 symbiont-mediated evasion of recognition by host innate immune effector, since the evidence is chitinase protection), 1 MARK_AS_OVER_ANNOTATED (GO:0140320 PAMP receptor decoy activity; sequestration never tested, mechanism is wall shielding), plus 2 NEW locations (host apoplast, fungal-type cell wall). Added six PubMed-verified references. just validate passes with no warnings; status COMPLETE.
