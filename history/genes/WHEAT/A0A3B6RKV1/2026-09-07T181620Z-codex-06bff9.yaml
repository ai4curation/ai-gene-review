    GO:0010099 (regulation of photomorphogenesis): NPI -> UNC. The target shares F-box/JmjC architecture with Arabidopsis JMJ22, and the raw ProtNLM evidence record reports a phmmer match to reviewed JMJ22 Q67XX3 with score 689.2. Primary JMJ20/22 experiments establish a role in light-controlled germination (PMID:22483719), making a related developmental function plausible. This similarity does not resolve conservation of the broader photomorphogenic program in wheat. The exact process is absent from the cached target annotations and remains uncertain pending pathway-level evidence.

    GO:0010476 (gibberellin mediated signaling pathway): NPI -> UNC. The target has matching F-box/JmjC architecture and a strong reported phmmer match to characterized Arabidopsis JMJ22. JMJ20/22 affect gibberellin levels by modifying chromatin at biosynthetic genes (PMID:22483719), while gibberellin-mediated signaling is a distinct claim. Sequence similarity supports a related chromatin enzyme but does not establish the target's place in a hormone-signaling pathway. The exact process is absent from the cached target annotations and remains uncertain.

    GO:0040029 (epigenetic regulation of gene expression): COR -> COR. The target shares F-box/JmjC architecture with reviewed Arabidopsis JMJ22 Q67XX3, the phmmer match reported in the raw prediction evidence with score 689.2. Primary experiments establish histone arginine demethylation by JMJ20/22 and regulation of chromatin at gibberellin-biosynthetic genes (PMID:22483719). Together, the sequence relationship, domain architecture, and characterized relative support transfer of broad epigenetic regulation; this is a family-based inference, not an assay on wheat or a claim of H3K4 lysine demethylation. The process is absent from the cached target annotations.

    GO:0010114 (response to red light): NPI -> UNC. The target has a strong reported sequence match to Arabidopsis JMJ22 and matching F-box/JmjC architecture. JMJ20/22 are derepressed following phytochrome B activation (PMID:22483719), establishing a red-light-related regulatory context in Arabidopsis. The target's catalytic-family relationship does not establish conservation of that light-dependent regulation in wheat. The response term is absent from the cached target annotations and remains uncertain pending regulatory or expression evidence.

    GO:0010030 (positive regulation of seed germination): NPI -> UNC. The target shares domain architecture and a strong reported sequence match with Arabidopsis JMJ22. JMJ20/22 redundantly promote germination by affecting chromatin at gibberellin-biosynthetic genes (PMID:22483719), supporting a relevant developmental hypothesis. The wheat protein's expression context, target loci, and regulatory direction during germination are not established by this sequence relationship. The exact process is absent from the cached target annotations and remains uncertain.

