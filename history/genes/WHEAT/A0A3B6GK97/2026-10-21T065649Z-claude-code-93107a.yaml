  details: |
    Full re-review independent of ProtNLM2 predictions. New reproducible analysis (RESULTS-rereview.md) shows TraesCS3D02G033600 is an incomplete gene model whose upstream genomic N-terminus matches the 444-aa 3B homoeolog, but neither carries the catalytic Ser elbow (GTSTG) or DGGG oxyanion, so the product is predicted non-catalytic. PANTHER 19 tree places it in grass subfamily SF103, out-paralogous to Arabidopsis pPLAII. GO:0006629 ACCEPT -> MARK_AS_OVER_ANNOTATED; GO:0016787 MODIFY -> REMOVE (pseudoenzyme over-annotation); core_functions emptied; description rewritten; non-verbatim RESULTS.md quote fixed; all references retained.
