  summary: Audit 2 ProtNLM prediction assessments against source-independence guidelines
  details: |
    Audited genes/WHEAT/A0A3B6GK97/A0A3B6GK97-protnlm-predictions-review.yaml against the source-independence and final-state prose guidelines in .claude/skills/review-function-prediction/SKILL.md.

    Replaced rationale prose with the current assessment, traced biological claims to sequence/domain records, primary publications, and where relevant experimentally grounded curated annotations or reproducible analysis. Removed AI/OpenScientist verdicts as supporting evidence and unsupported error-mechanism claims. Source prediction terms and method/version metadata were preserved. Existing annotation overlap is separated from biological correctness and is not evidence of training-data contamination.

    GO:0016298 (lipase activity): LSP -> NPI. The existing reproducible sequence alignment and motif scan place this protein with plant patatins but show a missing N-terminal catalytic region, including the serine nucleophile and oxyanion block. Structural and mutational work establishes the patatin Ser-Asp catalytic dyad (PMID:12779324), so the missing serine region argues against lipase activity in the deposited 302-residue sequence. This is target-specific contrary evidence despite the more specific lipase IBAs in the cached UniProt record. Whether the deficiency reflects an incomplete gene model or a biological inactive protein remains unresolved.

    GO:0016042 (lipid catabolic process): CNN -> UNC. The reproducible alignment supports a patatin-family relationship but shows that the deposited sequence lacks the catalytic serine region. Thus, lipid hydrolysis by the encoded protein cannot be assumed from family membership. The predicted biological process could still apply through a noncatalytic role or to a corrected full-length gene model, neither of which is established by the inspected evidence. Lipid catabolic process is not present as an equivalent annotation in the cached records and remains uncertain.

    Validation: all 50 PredictionReview documents passed LinkML schema validation; all 77 predictions preserve their original source/term metadata and have category-consistent scores. Checked local evidence paths, cached PMID titles, and all 31 supporting excerpts against their sources. Substantive fields contain current reasoning; revision details are recorded here.

    Follow-up: reconcile the separate main gene-review YAML with the evidence limitations identified in this prediction audit. This session does not change its curation decisions or biological synthesis.
