  details: |
    Audited genes/WHEAT/F6LAX4/F6LAX4-protnlm-predictions-review.yaml against the source-independence and final-state prose guidelines in .claude/skills/review-function-prediction/SKILL.md.

    Replaced rationale prose with the current assessment, traced biological claims to sequence/domain records, primary publications, and where relevant experimentally grounded curated annotations or reproducible analysis. Removed AI/OpenScientist verdicts as supporting evidence and unsupported error-mechanism claims. Source prediction terms and method/version metadata were preserved. Existing annotation overlap is separated from biological correctness and is not evidence of training-data contamination.

    GO:0046982 (protein heterodimerization activity): NPI -> COR. The target has a PP2A regulatory A-subunit family assignment and HEAT-repeat scaffold architecture, consistent with its curated PP2A-complex IBA. Structural work establishes that the A and C subunits form a heterodimeric core enzyme before association with a regulatory B subunit (PMID:17174897). This conserved interaction supports protein heterodimerization even though a more informative functional description is PP2A scaffolding. The exact term is absent from the cached annotations and is not biologically incorrect merely because it is broad.

    GO:0043025 (neuronal cell body): NPI -> NPI. The target is a Triticum aestivum protein, as established by the sequence record and taxon. Neuronal cell body denotes the soma of a neuron, a cell type absent from wheat. This compartment is therefore incompatible with the target organism and is absent from its cached annotations. The prediction alone does not establish which training example or model mechanism produced the error.

    GO:0007059 (chromosome segregation): NPI -> UNC. The target is a PP2A A-subunit scaffold capable of participating in regulatory holoenzymes. The PP2A structure shows how the A subunit associates with catalytic and regulatory subunits (PMID:17174897); the scaffold need not itself catalyze a reaction to participate in a chromosome-related process. Chromosome segregation occurs in plants, but no specific complex or functional experiment connects this wheat product to it in the inspected sources. The process is absent from the cached annotations and remains uncertain.

    GO:0043005 (neuron projection): NPI -> NPI. The sequence record identifies the target organism as Triticum aestivum. Neuron projections are neuronal structures, and wheat has no neuronal cells. This localization is therefore biologically incompatible with the target taxon and is absent from the cached annotations. No inference about model frequency bias is needed to establish that incompatibility.

    GO:0000775 (chromosome, centromeric region): NPI -> UNC. The target PP2A scaffold can acquire specific localization through the regulatory complexes it assembles. Structural evidence for the PP2A A-B-C complex (PMID:17174897) does not identify a centromere-associated complex containing this wheat product. Plant chromosomes have centromeres, so the localization is biologically possible rather than taxon-inappropriate. It is absent from the cached annotations, and compartment-specific evidence is needed.

    GO:1990405 (protein antigen binding): NPI -> UNC. Protein antigen binding denotes binding a protein antigen and is not restricted by definition to antibodies or an adaptive immune system. Structural experiments show direct binding of SV40 small t antigen to the human PP2A A scaffold (PMID:17608567), so this kind of interaction is compatible with the scaffold family. The target has the PP2A A architecture, but no relevant antigen-binding interaction is established for this wheat protein. The exact function is absent from the cached annotations and remains uncertain.

    Validation: all 50 PredictionReview documents passed LinkML schema validation; all 77 predictions preserve their original source/term metadata and have category-consistent scores. Checked local evidence paths, cached PMID titles, and all 31 supporting excerpts against their sources. Substantive fields contain current reasoning; revision details are recorded here.

    Follow-up: reconcile the separate main gene-review YAML with the evidence limitations identified in this prediction audit. This session does not change its curation decisions or biological synthesis.
