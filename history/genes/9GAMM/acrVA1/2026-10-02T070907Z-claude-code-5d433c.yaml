  summary: 'Review follow-up: 9GAMM acrVA1 (PR #3861)'
  details: |
    Follow-up to the automated review on PR #3861, which requested changes. This review described the state of a module before the reconciliation commit 90bc0150b and prescribed a fix that had already been applied, so a reader was told to change something already changed; the cross-reference is rewritten in the past tense to report the reconciliation instead. Additionally, the GO:0004521 row's evidence code is changed from IDA to IC and a new MF_DARK knowledge gap is recorded: the primary work states that its data do not identify the component bearing the catalytic centre, AcrVA1 alone has no detectable ribonuclease activity, and its own wording is that AcrVA1 triggers the cleavage, which is compatible with the alternative reading in which AcrVA1 licenses a latent Cas12a ribonuclease and the molecular function belongs on Cas12a. What the assays show directly is that cleavage occurs with multiple turnover and sub-stoichiometric inhibitor; attributing the catalysis to AcrVA1 is a curator inference, which is what IC records. GO:0043021 continues to carry the part that is certain. Validated with ai-gene-review validate --strict --terms.
