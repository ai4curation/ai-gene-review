  summary: Wire OpenScientist prophage identification and a self-targeting spacer
    naming the candidate native Cas12a
  details: |
    Wired an OpenScientist run (kgap-acrva1-host-element) into the knowledge gap asking
    which mobile element carries acrVA1 and which Cas12a system it evolved against.
    Status OPEN -> NARROWING. The two halves resolve differently: the element is settled
    with direct sequence evidence, the pairing is an inference but a much tighter one
    than the gap assumed.

    The element. acrVA1 is locus tag AAX09_07405 in Moraxella bovoculi 58069, inside a
    roughly 55.8 kb prophage. The call rests on enumerated features rather than an
    impression: a tyrosine-type DNA recombinase 453 bp upstream, a second integrase at
    the far edge 147 bp from tRNA-Val, a siphovirus structural module (tail proteins,
    tail tube, tail terminator, minor tail protein L, a 1,364-residue tape measure
    protein, terminase), 55 of 60 CDS annotated only as hypothetical, GC 43.26% against
    a 45.52% genomic mean (p = 1.3e-16 over 2 kb windows), and codon usage further from
    the genome mean inside the element than outside (p = 1.9e-4) with acrVA1 itself at
    the 94.8th percentile of codon deviation.

    Competing element types are excluded on evidence, not by omission: no transposase
    within 92 kb; no relaxase, mob or type IV secretion gene anywhere in the region,
    ruling out an ICE; and the element is chromosomal, ruling out a plasmid. The one
    missing piece is the attachment site - the longest exact direct repeat between the
    left-boundary and tRNA-Val windows is 14 bp, within chance expectation - so attL and
    attR were not recovered and the boundaries are inferred from gene content rather
    than delimited by sequence. The run says this plainly rather than overstating the
    call.

    The pairing. The same chromosome carries a type V-A CRISPR-Cas locus about 1.57 Mb
    from acrVA1, whose Cas12a (AAX09_00210, 1,251 aa) was deposited in 2015 as a
    hypothetical protein - which is why this strain looks CRISPR-free on a keyword
    search, and is a good lesson about negative database searches. Downstream lie a
    Cas4-size endonuclease, a 1,039 bp unannotated gap where cas1 is expected, cas2, and
    a 2,062 bp array of 32 copies of a 36 nt repeat carrying the type V-A handle with 31
    spacers. Scanning all 31 spacers against the whole chromosome returned exactly four
    extra-array hits, and all four fall inside the acrVA1 prophage; spacer 16 matches
    perfectly behind a canonical 5'-TTTA PAM, 5.1 kb from acrVA1.

    A self-targeting, PAM-licensed protospacer in the very element that encodes the
    inhibitor is about as close to a native host-element pair as comparative genomics
    reaches, and it supplies the ecological setting the gap asked for. It remains an
    inference rather than a measured fitness effect, so the necessity test named in the
    gap's resolution - deleting acrVA1 and testing element persistence in a
    Cas12a-competent host - is still the experiment that closes it.

    Verified here: the ORF name AAX09_07405 and the structure 6NMD both appear in this
    entry's own UniProt record, independently confirming the locus tag the run assigns.

    One correction to the run, recorded in the reference review: it gives the protein as
    170 residues. This entry is 174 residues and PDB 6NMD covers chain B residues 5 to
    174, so 170 is the modelled length, not the protein length.

    Not reproduced here: the genome coordinates and assembly identifiers, the prophage
    boundaries and feature inventory, the GC and codon-usage statistics, the CRISPR
    array parse and the spacer scan.

    No annotation action changed.
