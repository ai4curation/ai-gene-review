  summary: Initial AI review of BPT4 gene 18 (tail sheath monomer gp18)
  details: |
    Reviewed existing GOA annotations for Bacteriophage T4 gp18 (P13332), the contractile tail sheath monomer. Accepted structural constituent of virion (GO:0039660) and virion component (GO:0044423) annotations, modified host cell inner membrane penetration (GO:0044694) to viral tail assembly (GO:0098003) because gp18 drives outer membrane contraction rather than inner membrane penetration, and kept generic protein binding IPI annotations as non-core.
