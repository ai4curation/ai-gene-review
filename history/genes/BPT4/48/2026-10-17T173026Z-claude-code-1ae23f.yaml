  details: |
    Reviewed existing GOA annotations for Bacteriophage T4 gp48 (P13339), the hexameric baseplate-to-tail-tube proximal junction ring protein. Accepted virion component (GO:0044423), proposed new structural constituent of virion (GO:0039660) and viral tail assembly (GO:0098003) annotations based on cryo-EM baseplate structures (PMID:27206196), and kept generic protein binding IPI annotations with gp19 and gp54 as non-core.
