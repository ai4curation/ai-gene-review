  summary: Initial AI review of BPT4 gene 54 (baseplate-tail tube junction initiator
    gp54)
  details: |
    Reviewed existing GOA annotations for Bacteriophage T4 gp54 (P13342), the hexameric distal baseplate-to-tail-tube junction ring that directly nucleates gp19 tail tube polymerization. Accepted virion component (GO:0044423), proposed new structural constituent of virion (GO:0039660) and viral tail assembly (GO:0098003) annotations supported by cryo-EM structures (PMID:27206196), and kept generic protein binding IPI annotations with gp19 and gp48 as non-core.
