  summary: Correct the Ni(2+) source-defect ADD shape and file the contradicted DISULFID
    features as a second defect
  details: |
    Review round on PR #5632. (1) The requested_change: ADD defect on the GO:0016151 row did not follow docs/source_defects.md: asserted_value held the current Ni position set, so export_source_defects._describe_change rendered it as 'add <full set> to <partial set>' with no record named. asserted_value is now UniProtKB:Q9L868 and corrected_value only the value to be added, with a corrected_label, following the genes/human/SYNGAP1 precedent; the exported UNIPROT.md line now reads 'add BINDING 540 /ligand="Ni(2+)" ... to UniProtKB:Q9L868 (FT BINDING)'. (2) New source defect on the same row: FT DISULFID 72..537 and 75..540 are contradicted by the structure they cite. PDB 1E3D (revision 2.4, 2026-09-02) contains no SSBOND record and carries LINK records bonding all four cysteine SG atoms to the cluster nickel, including the position that lacks a Ni(2+) feature; the two pairs are 2.87-2.96 A apart, well above a disulfide; none of the three reviewed orthologues carries a DISULFID feature. requested_change DELETE_VALUE, confidence CONFIRMED. (3) Those LINK records also make the Ni-at-540 request structural rather than comparative, so the first defect moves from PROBABLE to CONFIRMED and the 'which two cysteines bridge to the iron' claim is now sourced to the structure instead of to UniProt's own Fe typing. (4) The defect explanation no longer states that all of the Ni, Fe and Mg features rest on the PIRSR site rule alone: the Mg features also carry ECO:0007829|PDB:1E3D, which is the asymmetry the GO:0000287 NEW row relies on. (5) Notes: P21852's PROPEP 553..567 was missing, which made the propeptide suggested_question look as though it attributed a propeptide to an entry that has none; it is recorded, the question now names all three orthologues, and the P21852-to-Q9L868 offset of 9 derived from the metal features is shown to predict the precursor length (567-9=558, the length of ACL48945.1) and the propeptide boundaries (553..567 -> 544..558). The disulfide checks are written up in the notes with their provenance. Verified live against UniProt REST, RCSB files and the RCSB revision API on 2026-10-28.
