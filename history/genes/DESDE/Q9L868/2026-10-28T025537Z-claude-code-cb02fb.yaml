  summary: Correct the Ni(2+)/Fe ligand attribution in the Q9L868 review and reframe
    the length difference as precursor-versus-mature chain
  details: |
    Review-feedback corrections on PR 5632 (all four non-blocking items from the third review pass). (1) Factual error: the review's reason prose and the residue_mappings note described positions 72, 75, 537 and 540 as the entry's annotated Ni(2+) ligands. Verified against genes/DESDE/Q9L868/Q9L868-uniprot.txt FT BINDING lines: Ni(2+) is annotated at 72, 75 and 537; Fe cation at 75 and 540; Mg(2+) at 53, 489 and 543. There is no Ni(2+) feature at 540. Both passages now state the annotated sets exactly and separate them from the canonical [NiFe] architecture, in which all four cysteines coordinate the nickel and 75 and 540 are the bridging pair shared with the iron; that architectural claim is attributed to the reviewed homologues UniProtKB:P12944 (Ni(2+) at 65/68/530/533) and UniProtKB:P21852 (Ni(2+) at 81/84/546/549, Fe cation at 84/549), checked live against UniProt REST on 2026-10-28, not to this entry. The notes file records the resulting incompleteness of this entry's PIRSR-derived set (no Ni(2+) at 540) and reads FT DISULFID 72..537 / 75..540 (both ECO:0007829|PDB:1E3D) as structure-derived proximity of the four active-site cysteines rather than holoenzyme disulfides, since neither reviewed homologue carries a DISULFID feature at the equivalent positions. (2) The reason prose no longer derives the PDB-to-UniProt offset from the missing initiator methionine; the offset is attributed to the deposition author numbering as reported by PDBe SIFTS, matching the residue_mappings note. (3) residue_mappings as_reported.accession is now chain-qualified PDB:1E3D_B, since 1E3D holds two different proteins; the finding-residue-mapping validator still reports that side unresolved and the canonical side passes. (4) The 543-versus-558-residue difference is reframed as precursor versus mature chain: the entry ends at the His of the conserved DPCxxCxxH motif where the HycI/HybD-type endopeptidase cuts, His543 is an annotated Mg(2+) ligand with ECO:0007829|PDB:1E3D evidence and is the mature C-terminal Mg ligand in P21852 (BINDING 552 on CHAIN 1..552), 1E3D chains B/D cover 2-543 entire, and residues 544-558 of GenBank ACL48945.1 (VIDGESNEVHDYKVL, retrieved by NCBI efetch) align in length and position to the curated 15-residue propeptides of P0ACE0 (CHAIN 2..552 / PROPEP 553..567, cleaved by HybD) and P12944 (CHAIN 2..536 / PROPEP 537..551). Recorded in the notes and as a reframed suggested_question; not asserted in the review body, since no PROPEP or CHAIN feature exists on either sequence. No annotation action, GO term or core function changed.
