  summary: Reconcile the Cys536 structure numbering with the entry's own numbering
    via residue_mappings
  details: |
    Review follow-up on PR 5632, observation A. The GO:0044569 reason put the paper's Cys536 next to this entry's own nickel ligand positions without reconciling the two scales, so a reader could take Cys536 and Cys537 for different residues. The PMID:11191224 finding now carries residue_mappings: as_reported PDB:1E3D position 536 Cys, canonical UniProtKB:Q9L868 position 537 Cys with sequence_version 1, and a note recording how the correspondence was established. PDBe SIFTS maps chains B and D of 1E3D, residues 1-542, onto Q9L868 residues 2-543, so PDB residue n is Q9L868 residue n+1; the 1E3D residue listing gives CYS at PDB 536; Q9L868 position 537 is Cys and an annotated Ni(2+) ligand (72, 75, 537, 540) while position 536 is Pro. python -m ai_gene_review.validation.finding_residue_mappings confirms the canonical side against the real sequence and reports the PDB side as unresolved, which the note states. The reason prose now states the offset and the ligand positions explicitly.
