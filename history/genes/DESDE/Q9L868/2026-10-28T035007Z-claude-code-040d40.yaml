  summary: Strengthen the DISULFID 75..540 defect explanation and fix a notes citation
  details: |
    Review follow-up on PR #5632 (approved; non-blocking findings). (1) The source_defects explanation for DELETE_VALUE of FT DISULFID 75..540 understated its own case: residue 75 carries, in the same flat-file record, both FT BINDING 75 /ligand="Fe cation" and FT BINDING 75 /ligand="Ni(2+)" (verified at Q9L868-uniprot.txt lines 95-102), so the entry itself asserts that one residue coordinates the nickel, coordinates the iron, and forms a disulfide to 540 - a three-way contradiction internal to the record that needs no appeal to the structure. The explanation now states that directly, matching the shape of its sibling entry for DISULFID 72..537, while keeping the structural measurements and the distinction between what the entry annotates and what the coordinates show. (2) The Q9L868-notes.md citation bracket supporting 'Ni(2+) at 72, 75 and 537' quoted the Fe-cation feature at 75 rather than the Ni(2+) one; the missing FT BINDING 75 /ligand="Ni(2+)" quote was added and the double listing of position 75 explained. No other citation bracket in either file substitutes a quote for a different asserted position. (3) The two split DISULFID explanations were re-read as a pair: every shared argument (provenance/REVDAT reading, RP-scope point, orthologue point, pipeline disclaimer, live-check statement) remains byte-identical in both, and the notes paragraph describing the split was corrected, since it had said the two entries differ only in the value asked to be removed. No annotation action, GO term, core function, interpro2go defect, confidence value or ADD entry was changed; no existing supporting_text string was altered.
