  summary: File the incomplete Ni(2+) ligand feature set as a UniProt source defect
  details: |
    Added a review.source_defects entry on the GO:0016151 nickel cation binding row of genes/DESDE/Q9L868/Q9L868-ai-review.yaml (resource UNIPROT, record UniProtKB:Q9L868, slot FT BINDING, requested_change ADD, confidence PROBABLE, defect_type OTHER). The entry asks UniProt to add BINDING 540 /ligand=Ni(2+) beside the existing Fe-cation feature at that position. Q9L868 annotates Ni(2+) at 72, 75 and 537 and Fe cation at 75 and 540, so position 540 - one of the four active-site cysteines - carries no Ni(2+) feature. Verified live against UniProt REST on 2026-10-28: UniProtKB:P12944 (Megalodesulfovibrio gigas) annotates Ni(2+) at 65, 68, 530 and 533; UniProtKB:P21852 (Nitratidesulfovibrio vulgaris Miyazaki F) annotates Ni(2+) at 81, 84, 546 and 549 plus Fe cation at 84 and 549, a uniform offset of 9 from Q9L868's 72/75/537/540 that also aligns the three Mg(2+) positions. This was previously recorded only in Q9L868-notes.md, where it could not reach export-source-defects; the notes paragraph now points at the structured entry instead.
