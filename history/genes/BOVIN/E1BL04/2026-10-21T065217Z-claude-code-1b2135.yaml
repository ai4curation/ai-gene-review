  summary: 'Full re-review: E1BL04 (bovine XIRP2), independent of ProtNLM2'
  details: |
    Full re-review of all 16 existing annotations against the cached literature (PMID:15454575, 17046827, 20360251, 25772365, 37294664) and the PANTHER/PAINT evidence. ProtNLM2 output was not used. Fixed a donor mislabel: PAINT seed Q702N8 is human XIRP1, not mouse Xirp2. General terms (actin binding, actin cytoskeleton organization, cell junction, anchoring junction) changed to MODIFY with refined replacements. positive regulation of protein localization is marked as over-annotated because E1BL04 lacks the LIM/CTD region of the short isoform responsible for gamma-actin recruitment. Added a NEW intercalated disc location from the mouse ortholog. Added a bioinformatics comparison (E1BL04-bioinformatics/RESULTS.md) showing a full-length LIM-less long XIRP2 product, plus a notes file. Description and core functions rewritten.
