  details: |
    De-novo review of all five GOA rows for P26165 (3-vinyl bacteriochlorophyllide a hydratase): 1 ACCEPT, 3 MODIFY, 1 REMOVE. Removed the InterPro2GO row for GO:0019685 'photosynthesis, dark reaction' (the Calvin cycle) as a homonym mis-mapping of the family's light-independent pathway, with a source_defect repointing it to GO:0036070; refined both GO:0030494 rows to GO:0036070 and the generic hydro-lyase MF to a new-term request for the EC 4.2.1.165 reaction. Tested the batch-3 cross-isolate-transfer prediction on the CACAO IMP row (PMID:8158642) and found it absent: the two taxon ids are the R. capsulatus species and SB1003 strain nodes and the split is UniProt entry granularity, not an isolate transfer.
