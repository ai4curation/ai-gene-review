  summary: Correct Pc18g05100 Ser claim and re-weigh OAH evidence after PR review
  details: |
    Address PR #5631 review 5676338461 (comment 6457314983). Corrected the false claim that Penicillium paralog Pc18g05100 (B6HBX9) carries the OAH marker serine: results.tsv row S308 shows Pro (window VIIFPFATL), so the paralog lacks both Ser and activity and corroborates the Joosten marker. Re-weighed the basidiomycete reasoning: GO:0003824 reason, UniProt source_defects explanation (requested_change CHECK -> DELETE_VALUE) and knowledge_gap now state that the sequence evidence leans towards oxaloacetase (Ser-308; G. trabeum S7Q6Y6 Ser vs S7Q148 Pro split) while remaining unproven; DMML global-identity and Thr-113 arguments described as weak. Description now says 'only PF13714 protein' rather than 'only superfamily member', and drops 'single-copy' for G. trabeum. Shared RESULTS.md section 1 and 5 and notes updated accordingly; no EC 3.7.1.1 asserted.
