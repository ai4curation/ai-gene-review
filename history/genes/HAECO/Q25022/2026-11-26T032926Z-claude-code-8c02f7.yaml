- type: EDIT
  outcome: changed
  summary: 'Resolve the Q25022 locus-identity gap: the beta 12-16 cDNA is isotype-2
    HCON_00043670, not the benzimidazole-selected locus'
  details: |
    Ran an OpenScientist deep-research job (kgap-q25022-locus-identity) on the knowledge gap asking which modern H. contortus beta-tubulin locus and isotype class the beta 12-16 cDNA corresponds to. It resolves the gap, and this is the first gap in the campaign set to RESOLVED.

    Q25022 corresponds to HCON_00043670, the isotype-2 beta-tubulin gene on chromosome II of the chromosome-scale PRJEB506 reference assembly, not to isotype-1. The assemblies separate the candidates at three independent levels, each reported as a margin over the runner-up. At protein level Q25022 is 99.55 per cent identical with 2 differences to HCON_00043670, against 94.20 per cent and 26 differences to HCON_00005260 on chromosome I. At nucleotide level the 1347-base coding sequence is 98.52 per cent identical with 20 differences, 18 synonymous, against 79.36 per cent and 278 differences, so the margin widens from 5.35 to 19.16 percentage points once silent sites speak: purifying selection compresses protein divergence between the paralogs while their synonymous sites drift freely. At exon level the two loci place introns at identical coding positions but share no intron length, and isotype-2 carries a derived loss of the intron at coding position 1278 that isotype-1 and both chromosome X genes retain. The 20 nucleotide differences are read as isolate polymorphism rather than a separate paralog.

    The isotype naming is a field convention rather than an ontology term, so the run anchored it three ways instead of asserting it: chromosome placement in a genome-wide selection study, NCBI record titles carrying the isotype label, and the original cDNA paper's statement about isotype classes. WormBase ParaSite independently labels HCON_00005260 as tub8-9, and the alignment agrees, Q25024 being 2 differences from HCON_00005260 and 26 from HCON_00043670.

    This answers the question in the gap's significance clause, and it answers it against what the gene symbol invites: the best-matching locus is not the locus under primary benzimidazole selection. The canonical F167Y, E198A and F200Y mutations are scored in isotype-1 on chromosome I, and all four annotated beta-tubulin loci in the susceptible MHco3(ISE) reference carry Phe, Glu and Phe at those positions, which the local record confirms at Phe167, Glu198 and Phe200 of 448 residues. This entry's residues therefore describe a separate beta-tubulin isotype and not the benzimidazole-engaged pool.

    The run warns that any experimental-looking evidence line on this entry tracing to a benzimidazole resistance paper would almost certainly be paralog carry-over. That was checked and the warning does not apply here: all seven existing annotations are IEA from GO_REFs with no experimental row among them, so there was nothing to correct and no annotation action was changed.

    The top-level description was extended to name the locus and isotype class, since that is project-independent biology rather than curation commentary.

    What remains, and is recorded in the boundary so the RESOLVED status is not read as absolute: the second half of this gap's own resolution criterion, the isoform-resolved expression and benzimidazole-sensitivity assays, is unperformed; and the run states that an unannotated tandem duplicate about 99 per cent identical to HCON_00043670 cannot be excluded by sequence comparison of any kind and would need read-depth evidence. The second listed assembly, PRJNA205202, has no complete isotype-2 gene model, so only the chromosome-scale assembly can adjudicate. Five PubMed searches aimed at isotype 2 returned no primary functional, expression, knockdown or locus-level selection work, while all 12 beta-tubulin papers retrieved genotype isotype-1 only.

    Not recomputed here: the gene models and coordinates in either assembly, the identity figures and difference counts, the intron positions and derived loss, the isotype-naming anchors, the Q25024 comparison, and the PubMed counts. A pre-existing validation warning on this file, about a UniProt sequence quote in the uniprot.txt reference, is unchanged by this edit; it moved from references[4] to references[5] only because the new reference shifted the indices.
