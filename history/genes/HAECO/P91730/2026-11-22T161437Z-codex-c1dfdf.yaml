  summary: Create HAECO P91730 HG4 GluCl review
  details: |
    Created the accession-based HAECO P91730 review for the reviewed HG4/GluCl beta channel because UniProt does not assert a gene symbol for this entry. Curated all 13 seeded electronic or similarity-based GOA rows, accepting the broad Cys-loop channel parents, accepting inferred GluCl activity and chloride transport, keeping plasma membrane, marking postsynaptic membrane as over-annotated pending direct subcompartment localization in H. contortus, and removing the excitatory postsynaptic potential inference as sign-wrong for an anion-selective GluCl. Added manual notes documenting the P91730 accession choice, unavailable remote deep-research providers, the PAINT-loss result, and residual HG4 alpha-partner and localization gaps. Cached only the new HG4 cloning/localization paper PMID:9879896 and left project-page and rendered-page updates out of this content PR.
