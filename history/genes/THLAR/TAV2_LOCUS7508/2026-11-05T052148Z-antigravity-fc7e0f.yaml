  summary: 'Create review: THLAR TAV2_LOCUS7508 (APS1)'
  details: |
    Created AI gene review and notes for Thlaspi arvense APS1 (TAV2_LOCUS7508 / A0AAU9RRK7), the plastidic ATP sulfurylase targeted by tar-miR395a-f (PMID:34990041) at the entry point of sulfate assimilation and sinigrin (allylglucosinolate) biosynthesis. Accepted GO:0004022 and GO:0009507, refined GO:0005524 and GO:0000103, proposed GO:0019344 and GO:0019761 via ISS from Arabidopsis APS1 (UniProtKB:Q42559), and documented why miR395 mRNA cleavage substrates are not annotated to GO:0035195. Validated with 0 issues.
