  details: |
    Created AI gene review and notes for Thlaspi arvense LAC4 / IRX12 (TAV2_LOCUS14099 / A0AAU9S9S2), the apoplastic multi-copper oxidase laccase targeted by tar-miR397a/b (PMID:34990041) that polymerizes monolignols during secondary cell wall and silique valve-margin lignification. Accepted GO:0052716, GO:0005507, and GO:0048046, refined GO:0009808 to GO:0009809 (lignin biosynthetic process), and documented why miR397 mRNA targets are not annotated to GO:0035195. Validated with 0 issues.
