  summary: 'Replace two composed file: supporting_text quotes with verbatim text'
  details: |
    ai4c-reviewer round 10 found that both of this review's file: supporting_text quotes were composed rather than copied, which is the exact failure mode the audit exists to find. Verified before fixing. (a) On the GO:0005634 nucleus row that this audit re-adjudicated REMOVE -> MARK_AS_OVER_ANNOTATED, the quote read 'TaTFP acts at the cellular site where myrosinase-generated aglucones become available; no nuclear localization reported.' The cited file says 'site(s)' and 'after disruption', and the operative clause '; no nuclear localization reported.' appears nowhere in it (grep count 0) - that clause was the apparent evidence for the row. Replaced with two verbatim substrings that actually carry the claim: 'Direct experimental subcellular localization for TaTFP was **not** found in the gathered primary snippets' and 'its steady-state localization remains a gap requiring direct experimental confirmation'. (b) On the GO:0005829 cytosol row, the quote dropped '/localization studies' and the trailing clause from the source sentence; restored verbatim as 'broader glucosinolate-system reviews/localization studies discuss cytoplasmic organization for specifier proteins and compartmented myrosinases'. Both original quotes pre-exist on main, so they were inherited rather than introduced by this audit, but one of them underpinned a row this audit moved. Note that just validate passes on this file both before and after, because the verbatim check does not cover file: references - only publication ones - which is how these survived. No GO term, action or qualifier changed.
