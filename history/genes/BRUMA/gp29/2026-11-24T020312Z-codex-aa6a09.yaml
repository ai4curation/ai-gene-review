  summary: Complete BRUMA gp29 review
  details: |
    Completed the Brugia malayi gp29 cuticular GPx-fold peroxidase review. Curated all five existing GOA rows with direct support from the P67877 UniProtKB/Swiss-Prot flat file, the Brugia gp29 primary abstracts, B. malayi excretory-secretory proteomics, and the existing PTHR11592 family review; accepted peroxidase activity, extracellular region, response to oxidative stress as non-core, and cellular oxidant detoxification; and left glutathione peroxidase activity undecided because P67877 is a cysteine-type GPx with no direct glutathione-versus-thioredoxin reductant assay. Added manual notes because the configured deep-research providers were unavailable, recorded the B. pahangi membrane lipid-peroxidation paper as a close ortholog lead, added the gp29 primary-sequence conservation paper, and cross-checked the existing worm gpx-5 ortholog review for the cysteine-GPx reductant caveat.
