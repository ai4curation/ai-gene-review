  summary: Complete BRUMA gp29 review
  details: |
    Completed the Brugia malayi gp29 cuticular glutathione peroxidase review. Curated all five existing GOA rows with direct support from the P67877 UniProtKB/Swiss-Prot flat file, the Brugia gp29 primary abstracts, and B. malayi excretory-secretory proteomics; accepted glutathione peroxidase activity, extracellular region, and cellular oxidant detoxification; treated generic peroxidase activity as too general beside the accepted EC 1.11.1.9 row; and downgraded the broad InterPro oxidative-stress process row to MARK_AS_OVER_ANNOTATED pending direct physiological evidence. Added manual notes because the configured deep-research providers were unavailable, recorded the title-only Brugia pahangi lipid-peroxidation paper as a follow-up lead, and cross-checked the existing worm gpx-5 ortholog review for the cysteine-GPx reductant caveat.
