  summary: Wire OpenScientist isotype analysis; also find that Q66T51 is the same
    locus, not a separate isotype
  details: |
    Wired an OpenScientist run (kgap-bmaben1-isotype-target) into the knowledge gap on
    which Brugia beta-tubulin isotype is the benzimidazole target. Status OPEN ->
    NARROWING. The target stays unresolved, with this isotype weakly to moderately
    favoured; the run's four lines do not converge, and it says so.

    Inventory: B. malayi encodes exactly four beta-tubulins. bma-ben-1 (Bm4733) is the
    closest Brugia relative of C. elegans BEN-1 at 93.69%, ahead of Bm12766 (89.86%),
    Bm8661 (88.69%) and Bm9698 (87.61%), and is the reciprocal best hit. The other three
    map onto different C. elegans paralogs - Bm12766 to TBB-4 (95.72%), Bm8661 to MEC-7
    (92.74%), Bm9698 to nothing above 87.61% despite its WormBase name Bma-tbb-6, being
    only 55.3% identical to C. elegans TBB-6. That last point is a caution about reading
    gene names as orthology, which is exactly what the prompt warned against.

    Pharmacology: a clean negative. All four isotypes carry F167, E198 and F200, the
    three canonical resistance codons, so those positions discriminate nothing.
    Critically the run validated that negative instead of resting on it: the same
    alignment separates C. elegans TBB-1/TBB-2 (Y200), MEC-7 (S198) and human TUBB
    (Y200) from BEN-1, so the method has power where a difference exists. Widening from
    3 codons to 27 colchicine-site pocket positions cuts the candidate set from four to
    two - bma-ben-1 and Bm9698 match H. contortus isotype-1 at all 27, while Bm12766
    carries S165N plus M316I and Bm8661 S165T plus M316I. The pocket narrows the field
    but cannot separate the final pair.

    Comparative genomics gives the one definite answer: every filarial beta-tubulin
    actually used in benzimidazole-resistance genotyping is the orthologue of this
    locus. The B. malayi genotyping reference AY705382 is 99.8% identical to bma-ben-1
    against 85.5-87.9% for the other three, and the O. volvulus and D. immitis cDNAs are
    98.4% identical. So the favouring rests on orthology and reagent provenance, not on
    any functional test in B. malayi.

    Two negatives are correctly recorded as limitations rather than findings. No
    isotype-resolved expression matrix was obtained - EBI Expression Atlas holds zero
    B. malayi experiments and WormBase ParaSite REST timed out on three attempts - so
    expression excludes nobody and this is a retrieval failure. And both UPGMA and
    neighbour joining fail to nest bma-ben-1 inside the ben-1 clade, with NJ placing
    human TUBB inside a nematode paralog clade, which is provably wrong; the run flags
    its own phylogeny as unreliable and states that 93.69% is a distance ranking, not a
    resolved 1:1 orthology.

    No benzimidazole or drug-response GO term is supportable and none is proposed. No
    annotation action changed.

    A finding of this review's own, which independently confirms the run: the PE=2 entry
    it identifies as the sole transcript-level B. malayi beta-tubulin, Q66T51, is this
    same locus rather than a separate isotype. The two sequences are 448 residues each
    and differ at exactly one position - Ala352 here against Thr352 in Q66T51 - for
    99.78% identity, reproducing the run's 99.8% figure for the genotyping reference.
    Q66T51 is reviewed in this corpus as its own gene folder carrying this same
    benzimidazole-target gap. One folder per accession is the project convention so
    neither folder is wrong, but a reader comparing them would treat them as two
    isotypes, which would inflate the apparent size of the Brugia beta-tubulin family in
    precisely the comparison this gap turns on. Raised as a suggested_questions entry
    rather than acted on, since merging or cross-linking folders is a structural
    decision for the maintainer.

    Verified here against the local records: F167, E198, F200 in this entry, and the
    single-residue difference to Q66T51. Not reproduced here: the four-isotype identity
    matrix, the 27-position pocket inventory, the cross-species cDNA comparisons and the
    transcript assignments.
