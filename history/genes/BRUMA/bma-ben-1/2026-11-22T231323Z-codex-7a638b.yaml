  details: |
    Created the Brugia malayi bma-ben-1 beta-tubulin review for the benzimidazole drug-target lane. Seeded A0A1U7F2B2 from UniProt, reviewed all nine GOA rows, accepted conserved beta-tubulin GTPase, GTP-binding, cytoskeletal structural, microtubule and microtubule-organization annotations, marked the root cytoskeleton and broad microtubule-based process rows too general, and marked EnsemblMetazoa chemosensory and egg-laying behavior transfers from C. elegans ben-1 as over-annotated for the parasite ortholog. Cross-checked the merged worm ben-1 review and the PTHR11588 FamilyReview, added a residual knowledge gap for the untested B. malayi benzimidazole-sensitive isotype assignment, and validated the review and all local quotes.
