  details: Curated dual-function peptidoglycan hydrolase P5 (P07582) of Pseudomonas phage phi6 based on biochemical cell wall digest analysis (PMID:1390911) and genetic/heterologous lysis assays (PMID:41574337). Accepted peptidoglycan muralytic activity (GO:0061783), symbiont entry into host cell via disruption of host cell wall peptidoglycan (GO:0098932), and killing of cells of another organism (GO:0031640), marked broader hydrolase and entry terms as TOO_GENERAL, and added a NEW IC annotation for virion component (GO:0044423).
