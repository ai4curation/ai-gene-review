  summary: Curate Pseudomonas phage phi6 (BPPH6) gene P2
  details: Curated RNA-directed RNA polymerase P2 (P11124) of Pseudomonas phage phi6 using biochemical and structural evidence (PMID:10619851, PMID:11602748, PMID:17237359, PMID:18614640, PMID:18940872). Accepted core annotations for RNA-directed RNA polymerase activity (GO:0003968), viral RNA genome replication (GO:0039694), RNA-templated transcription (GO:0001172), RNA/nucleotide/metal ion binding, kept terminal RNA uridylyltransferase activity (GO:0050265) as KEEP_AS_NON_CORE, removed the spurious InterPro-derived DNA-templated transcription term (GO:0006351), and added a NEW IC annotation for viral inner capsid (GO:0039625).
