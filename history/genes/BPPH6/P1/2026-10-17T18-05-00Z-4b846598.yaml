  summary: Curate Pseudomonas phage phi6 (BPPH6) gene P1
  details: Curated major inner capsid protein P1 (P11126) of Pseudomonas phage phi6 based on cryo-EM and crystallographic structures (PMID:16765897, PMID:23891288) and UniProtKB. Accepted core annotations for RNA binding (GO:0003723), identical protein binding (GO:0042802), T=2 icosahedral viral capsid (GO:0039616), and viral inner capsid (GO:0039625), marked broader viral capsid/nucleocapsid terms as TOO_GENERAL, and added a NEW IC annotation for viral genome packaging (GO:0019072).
