    Reviewed all 3 GOA rows for P. furiosus MoaB (molybdopterin adenylyltransferase) for the molybdenum cofactor biosynthesis module, from UniProt and the cached Bevers et al. 2008 abstract (PMID:18154309); deep research providers were unavailable. GO:0061598 accepted as core; GO:0006777 generalized to GO:0032324 because the adenylylation serves tungsten and molybdenum cofactor maturation in this W-dependent archaeon; cytosol non-core. Validated with just validate PYRFU moaB.
