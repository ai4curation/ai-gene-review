  summary: New review of S. meliloti DusA (Q92P85) from KBase Dark Protein Atlas item
    NZ_RPHN01000062.1_55
  details: |
    Created review for Q92P85 (SMc04235); KBase protein NZ_RPHN01000062.1_55 (E. meliloti USDA1810) contains Q92P85 exactly as residues 40-398. Accepted GO:0002943, GO:0010181, GO:0102264 and GO:0102266; kept GO:0000049 as non-core; modified GO:0008033 to GO:0002943 and GO:0017150 to GO:0102264/GO:0102266; removed GO:0050660 FAD binding (Dus enzymes use FMN; IPR018517 InterPro2GO over-mapping). Recorded a suspected WRONG_START_SITE gene model issue: the 359-aa model omits the conserved FMN-binding VAP motif, restored by the 385-aa RefSeq WP_015241224.1 start; the USDA1810 N-terminus likely comes from a dusA-associated integrase island (PMID:25883135). Bioinformatics shows conservation of E. coli DusA C114, FMN and tRNA signature residues. Dashboard verdict recorded in notes: supported.
