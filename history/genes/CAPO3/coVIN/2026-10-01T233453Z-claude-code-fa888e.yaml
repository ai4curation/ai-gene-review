  summary: 'Create review: coVIN'
  details: |
    New DRAFT review of Capsaspora owczarzaki vinculin coVIN (A0A0D2WSN3, CAOG_05123), identified as the antigen of the anti-vinculin antibody in Parra-Acero et al. 2020 (bioRxiv preprint methods). All four IEA rows accepted (actin binding, actin filament binding, cytoplasm, cell adhesion) as family/domain inferences, with the caveat that talin-activated actin binding is shown only for sponge and vertebrate vinculins. One NEW row: filopodium (GO:0030175) IDA from immunostaining of the endogenous protein. No adhesion process term added by experimental evidence because there is no vinculin-specific perturbation. Second paralog CAOG_03344 (A0A0D2UBD6) noted as unstudied. No propagated (TreeGrafter/IBA/GO_REF:0000120) rows, so no Track C issues.
