    Created DRAFT review of Capsaspora owczarzaki coWts (A0A0D2VGR4, CAOG_00619; locus mapping checked via RefSeq XP_004365490.1). Reviewed all 12 IEA rows against the cached full text of Phillips & Pan 2024 (PMID:38517944): kinase MF, ATP binding, cytoplasm and negative regulation of protein localization to nucleus accepted (the latter directly supported by increased nuclear coYki in coWts knockouts); generic MF parents kept as non-core; cytoskeleton and cytoskeleton organization marked over-annotated and actomyosin structure organization removed, because TreeGrafter places coWts in PTHR22988 (ROCK/MRCK/citron) rather than the LATS clade (PTHR24356) and the Capsaspora phenotypes run through coYki transcription; cell periphery left undecided. Added NEW IMP hippo signaling (GO:0035329). Noted that coWts kinase activity and coYki phosphorylation were not measured. No deep-research provider was available; manual notes written instead.
