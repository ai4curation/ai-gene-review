  summary: 'Create review: coHpo'
  details: |
    Created the first review of coHpo (CAOG_01932, UniProt A0A0D2WLF3, the only one of three CAOG_01932 gene models carrying the SARAH domain; A0A0D2VKT0 and A0A0D2X1E3 recorded as SARAH-less alternative models) from cached full text of Phillips & Pan 2024 (PMID:38517944) and Sebe-Pedros et al. 2012 (PMID:22832104), with MST SARAH structural papers (PMID:17517604, PMID:25004971) for the oligomerization question. All six GOA rows are IEA: protein serine/threonine kinase activity, ATP binding and cytoplasm accepted (kinase activity not measured with purified protein); nucleotide binding kept as non-core; signal transduction modified to hippo signaling (GO:0035329) on the basis that coHpo knockout releases coYki from cytoplasmic sequestration and coHpo activates the Warts-Yorkie cascade in Drosophila; protein tetramerization removed as an InterPro2GO artefact of the p53-like tetramerisation fold superfamily, since MST SARAH domains form dimers. No NEW rows. Automated deep research unavailable; notes written manually.
