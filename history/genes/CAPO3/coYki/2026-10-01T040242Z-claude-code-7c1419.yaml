  details: |
    Created DRAFT review of coYki (A0A0D2WY30, CAOG_07866), the Capsaspora owczarzaki Yorkie/YAP/TAZ ortholog, for the ORIGINS_OF_MULTICELLULARITY Track C propagation audit, using cached full text of PMID:35659869, PMID:38517944, PMID:22832104, PMID:38729842 and PMID:24368732 (no deep-research provider; manual notes file). All five TreeGrafter/ARBA IEA rows accepted: transcription coactivator activity, nucleus, cytoplasm, hippo signaling and positive regulation of transcription by RNA polymerase II are each supported by Capsaspora genetics (kinase-dependent cytoplasmic sequestration, transcription-dependent 4SA phenotypes) or heterologous Drosophila assays; none is an animal-specific process mis-propagated to a unicellular protein. Added NEW GO:0140297 DNA-binding transcription factor binding (IPI, co-IP with coSd, PMID:22832104). No process NEW terms: blebbing, substrate adhesion and aggregate-shape phenotypes are necessity evidence downstream of unidentified targets, and proliferation control is contradicted by the knockout.
