  summary: 'Create review: Q9KWG3 (Streptomyces sp. CL190)'
  details: |
    Reviewed all 3 GOA rows (IEA only) for the Streptomyces sp. CL190 phosphomevalonate kinase Q9KWG3, the orfC product of the cluster in PMID:10894721. EMBL AB037666 and the paper give no gene symbol (orfC is an ORF label), so the folder uses the accession. PMK activity, ATP binding and IPP biosynthesis via mevalonate are accepted on three lines: TIGR01220/PTHR31814:SF2 classification, reconstitution of a working mevalonate pathway in E. coli by the cluster (PMID:10894721), and the curated UniProt function citing PMID:23378249, whose cached abstract does not mention the Streptomyces enzyme (recorded as UNVERIFIED, not as a citation error). Actions: 3 ACCEPT; no NEW rows. Validated with just validate and the quote checker; record sections backfilled.
