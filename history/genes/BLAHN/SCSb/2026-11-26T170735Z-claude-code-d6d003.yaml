  summary: Wire OpenScientist geometry and electrostatics arguing against an entrance
    gate for GTP exclusion
  details: |
    Wired an OpenScientist run (kgap-scsb-gtp-exclusion-site) into the knowledge gap
    asking whether GTP is excluded from this ATP-specific enzyme at the entrance of the
    nucleotide site, inside it, or both. Status OPEN -> NARROWING. Unresolved, but moved
    decisively toward exclusion inside the site, by computation on deposited
    coordinates rather than new measurement.

    Residue numbers below are beta-subunit numbering of the mature chain, as the
    structural papers use; that is this entry's UniProt numbering minus 14.

    Three geometric results bear on the entrance hypothesis. The pocket is closed in
    every crystal form - adenine 87.1% buried, whole nucleotide 78.2%, no opening
    admitting a probe wider than ~2.3 A - so the crystallographic channel is a solvent
    opening and the ATP-grasp fold must open for a nucleotide to enter. The two lysines
    do not line that opening: their side-chain tips sit 11.6 and 13.6 A off the channel
    axis and 7.44 and 5.78 A from the base, while the charges nearest the axis are
    Lys9 at 4.45 A and Lys50 at 5.04 A, the latter contacting the phosphates directly.

    The decisive point is that the electrostatic effect is base-blind. ATP and GTP
    carry identical net charge, so the 0.66 kT/e shift in mouth potential the K46E/K114D
    swap produces applies equally to both. The only base-specific term at the mouth is
    the guanine-versus-adenine dipole difference, which across 40 combinations of
    dielectric, ionic strength and evaluation distance never reaches 1 kT, ceiling
    0.358 kT = 1.43-fold discrimination, against the complete exclusion the wild type
    shows. An entrance gate of this geometry buys affinity, not selectivity - and the
    kinetics agree: in the ED mutant the ATP Km rises from 145 to 230 uM with kcat
    unchanged, the signature of altered approach or association rather than altered
    chemistry.

    What cannot be closed: wild-type turnover with GTP is reported only as "not
    detected", with no Km and no kcat, so a raised Km and an abolished kcat cannot be
    told apart; and no structure of this enzyme with a guanine nucleotide exists in
    either wild type or mutant.

    The run supplies a competing account that fits better than a gate. Superposing the
    purine rings of the bound nucleotides in this enzyme and the pig GTP-specific
    enzyme (9 atoms, RMSD 0.040 A), five of ten base-lining residues differ, the pig
    site carries two more units of negative charge at every radius from 8 to 15 A, and
    three of the four specificity-reversing substitutions install the exact residue the
    pig enzyme carries at the structurally equivalent position (K46E -> pig Glu42,
    V113L -> pig Leu109, L227F -> pig Phe219). So the quadruple change is a partial
    conversion of this site into a GTP-using architecture, second shell included,
    rather than the opening of a gate.

    This explains the companion Mortierellomycota result rather than conflicting with
    it: those same two lysines fail to predict measured specificity across the family
    while sitting outside the cavity, and a substitution that changes preference in
    this structural context is therefore not a general determinant.

    Curation action taken, and it is the narrow one the run recommends: the description
    said the two lysines are "at the entrance of the nucleotide site", which the
    geometry does not support. That now reads "near the nucleotide site". No annotation
    action changed and none proposed.

    Verified here against this entry's own record (416 residues): all eight cited
    positions at the stated offset - Gln20, Lys9, Lys46, Lys50, Gly111, Val113, Lys114,
    Leu227 of the mature chain are Gln34, Lys23, Lys60, Lys64, Gly125, Val127, Lys128,
    Leu241 of the UniProt sequence. The offset matches the one independently derived in
    the Mortierellomycota run, a cross-check on both. Not reproduced here: the burial
    and solid-angle calculations, the channel-axis geometry, the electrostatic
    potentials and dipole terms, the superposition and the charge-radius comparison.

    Note on structured residue mapping: the schema's residue_mappings field was
    considered and deliberately not used. Both numberings refer to the same sequence,
    mature chain versus full precursor, so there is no second accession for the
    validator to resolve; that field is for isoform and cross-accession numbering. The
    offset is stated in prose instead.
