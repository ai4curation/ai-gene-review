- type: EDIT
  outcome: changed
  summary: 'Complete the SCS presequence pair: plural arginine-at-minus-two claim
    confirmed, charge chance-level, amphipathicity 97.8th percentile'
  details: |
    Added a local presequence feature analysis for the SCS beta subunit location gap,
    completing the alpha/beta pair, and wired it into the boundary. Gap KEEPS status OPEN.

    Why the pair had to be done together. The source behind both subunits' gaps makes a
    PLURAL claim - "the Blastocystis SCS leader sequences also have arginine at position
    -2 from the putative cleavage site" - so testing only the alpha subunit left it
    half-checked. This completes it.

    Result: the plural claim holds. Both subunits carry an arginine at exactly -2 relative
    to their CURATED cleavage points - R13 here (cut between 14 and 15), R17 in the alpha
    subunit. Neither depends on a guessed cut, which is what distinguished these from the
    Mortierellomycota SUCLG2-type model analysed earlier.

    Charge composition again adds nothing: against this protein's background (0.120
    acidic, 0.132 basic), zero acidic residues in 14 occurs 16.7% of the time by chance
    and three or more basic residues 28.0%. That is the third consecutive protein whose
    gap quotes charge observations that turn out to be chance-level, which is worth
    recording as a pattern rather than three coincidences.

    Amphipathicity is the feature that discriminates, and it is strongly positive:
    hydrophobic moment +0.521, ninth of 403 windows, 97.8th percentile - closely matching
    the alpha subunit's 98.0th and in clear contrast to the SUCLG2-type model's 64.1st by
    the same method. That three-way contrast is the useful output: the test separates
    strong presequences from weak ones rather than calling everything chance-level, which
    retroactively supports the earlier negative on the SUCLG2 model as a property of that
    sequence rather than of the method.

    Incidental confirmation worth recording: the curated transit peptide here is residues
    1-14, which is exactly the mature-chain numbering offset of -14 that the structural
    literature on this subunit uses and that I verified independently from the SCSb and
    SUCLG2 OpenScientist analyses earlier in this campaign. The curated feature and the
    crystallographic numbering convention agree.

    What this does not establish, and the boundary says so: nothing here detects the beta
    subunit in the organelle of this strain, shows the presequence is removed, or assigns
    a compartment within the organelle - which is exactly what the gap asks. A strong
    presequence prediction is neither import nor processing nor sub-organellar location.
    The resolution still requires the immunogold or epitope-tag localisation and
    N-terminal sequencing it already names.

    New files: genes/BLAHN/SCSb/SCSb-bioinformatics/presequence_features.py (adapted from
    the alpha subunit's script by path substitution; stdlib only, no network, hardcodes no
    results) and RESULTS.md. Every figure quoted was checked against a fresh run. No
    targeting-sequence predictor was run. No annotation action changed and no localisation
    dataset was consulted.
