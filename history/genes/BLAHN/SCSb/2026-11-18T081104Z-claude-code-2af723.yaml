  summary: 'Create review: SCSb'
  details: |
    New review of the Blastocystis sp. subtype 1 (strain ATCC 50177 / NandII) succinyl-CoA synthetase beta subunit SCSb (UniProtKB:B3FHP0), written as a follow-up to the evolutionary reviews of the beta family PTHR11815 and the alpha family PTHR11117. The entry is an InterPro member of PTHR11815:SF10 and not a leaf of the PAINT tree, so it has no IBA rows; five GOA rows name PTN000212530, the eukaryotic duplication node, in WITH/FROM: the three TreeGrafter rows (GO:0005739, GO:0006104, GO:0042709) and the two combined rows (GO:0004775, GO:0006099).

    All 11 GOA rows reviewed; none is a no-data row. Accepted: GO:0004775 succinate-CoA ligase (ADP-forming) activity (EXP from PMID:18452512, and IEA), GO:0006104 succinyl-CoA metabolic process (IEA), both GO:0042566 hydrogenosome rows (EXP and IEA; the term that the usage comment of GO:0005739 gives for mitochondrion-related organelles, and the core location) and GO:0042709 succinate-CoA ligase complex (IEA; the row's evidence stops at the nucleotide-neutral complex). MARK_AS_OVER_ANNOTATED: GO:0005739 mitochondrion (TreeGrafter IEA), on the usage comment and PMID:24316280, as in the review of the alpha subunit SCSa. Kept as non-core: GO:0005524 ATP binding and GO:0000287 magnesium ion binding. TOO_GENERAL: GO:0003824 catalytic activity. REMOVE: GO:0006099 tricarboxylic acid cycle (IEA), because the organism has no complete cycle and the paper on this enzyme says it is outside the malate dismutation route. One NEW row: GO:0009361 succinate-CoA ligase complex (ADP-forming), from the co-purification of the tagged subunits and the ATP-specific assay in PMID:18452512.

    Main findings. The recombinant alpha/beta enzyme is ATP-specific with no detectable activity with GTP in two studies of the same strain (PMID:18452512, PMID:27478903), although the subunit has Gln at position 20 of the mature chain (Gln34 of the precursor). The localisation experiment of PMID:18452512 was on the alpha subunit of a subtype 4 isolate (the entry is from subtype 1 strain NandII); the antibodies against the beta subunit failed, so the experimental evidence code of the hydrogenosome row on this entry is recorded as a source defect (WRONG_EVIDENCE_CODE, check requested). The paper does not call the organelle a hydrogenosome and its main text does not mention a matrix; the matrix note of the UniProt location comment is recorded as a suspected WRONG_STATEMENT (check requested) on the IEA row. Two further source defects, both check requests, concern the tricarboxylic acid cycle statements of the UniProt entry and the propagation of GO:0006099 from the family root.

    Depth: PMID:18452512, PMID:27478903 and PMID:18403202 were read in full in the cache; PMID:21439036, PMID:28892507 and PMID:33174373 are cached with full text and were searched for the relevant passages; PMID:31282474, PMID:18694756, PMID:18757809 and PMID:24316280 are abstract only. Seven publications were fetched with just fetch-pmid. The perplexity deep-research provider was not available (no provider file written); the literature search is recorded in the notes file. No bioinformatics analysis was added; tree placement is cited from genes/yeast/LSC2/LSC2-bioinformatics/RESULTS.md. Residue mappings from mature to precursor numbering are recorded on three findings and checked against the sequence (12 pass, 4 unresolved for the mature-chain side, which is not a UniProtKB sequence).

    Validation: just validate BLAHN SCSb passes with 0 errors; the two warnings are the uv environment-variable deprecation message captured from the term and reference validators and carry no content finding. Quote check: 91 verified, 0 failures. Four BIOLOGY knowledge gaps (direction and pathway in the organism, structural basis of ATP specificity, direct and sub-organellar location of the beta subunit, requirement for growth).

    Follow-up after independent checks (same day). The organelle rows were aligned with the review of the alpha subunit SCSa and with the usage comment of GO:0005739, as described above; the first version of this review accepted the TreeGrafter mitochondrion row, kept the hydrogenosome rows as non-core, used mitochondrion as the core location and asked UniProt to consider mitochondrion in place of hydrogenosome. That request was withdrawn. The GO:0006099 propagation query is now filed to PANTHER (TreeGrafter row) and not to GO_CENTRAL. The supporting quote of the magnesium row now is the abstract sentence on the wild-type domain. The isolate of PMID:18694756 is no longer stated, since its abstract does not give it.
