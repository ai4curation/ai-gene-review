  summary: 'Create review: SCSa'
  details: |
    New review of the Blastocystis sp. subtype 1 (strain ATCC 50177 / NandII) succinyl-CoA synthetase alpha subunit SCSa (UniProtKB:B3FHT4), written as a follow-up to the evolutionary reviews of the alpha family PTHR11117 and the beta family PTHR11815, and as the partner of the SCSb review (B3FHP0). The entry is an InterPro member of PTHR11117:SF2 and not a leaf of the PAINT tree, so it has no IBA rows; its five PANTHER-derived rows name PTN000874228, an Alveolata-Stramenopiles node with 7 leaves below the eukaryotic node PTN000122014 (read from the PANTHER tree service on 2026-11-18).

    All 9 GOA rows reviewed; none is a no-data row. Accepted: GO:0004775 succinate-CoA ligase (ADP-forming) activity (EXP from PMID:18452512, and IEA), GO:0009361 succinate-CoA ligase complex (ADP-forming) (TreeGrafter IEA) and both GO:0042566 hydrogenosome rows (EXP and IEA). TOO_GENERAL: GO:0003824 catalytic activity. REMOVE: GO:0004776 succinate-CoA ligase (GDP-forming) activity (TreeGrafter IEA; no detectable activity with GTP in two preparations) and GO:0006099 tricarboxylic acid cycle (IEA; the organism has no complete cycle and the paper on this enzyme says it is outside the malate dismutation route). MARK_AS_OVER_ANNOTATED: GO:0005739 mitochondrion (TreeGrafter IEA). One NEW row: GO:0006104 succinyl-CoA metabolic process, from the assay of the recombinant enzyme, after a comparator check on other alpha subunits.

    Main findings. The recombinant alpha/beta enzyme is ATP-specific with no detectable activity with GTP in two studies of the same strain (PMID:18452512, PMID:27478903), and the alpha subunit forms an active ATP-using enzyme with the Plasmodium falciparum beta subunit (PMID:33174373). The localisation experiment of PMID:18452512 was on the alpha subunit, with an antiserum against the pig protein, in cells of a subtype 4 isolate; this is recorded as a source defect on the experimental hydrogenosome row (evidence code, check requested). The usage comment on GO:0005739 directs locations in mitochondrion-related organelles to hydrogenosome or mitosome, and the review it cites (PMID:24316280) lists Blastocystis; on that ground hydrogenosome is accepted and used as the core location and the TreeGrafter mitochondrion row is marked as over-annotated. This differs from the SCSb review, which accepts mitochondrion and keeps hydrogenosome as non-core without considering the usage comment; in the follow-up of the same day the SCSb review was aligned with this one (mitochondrion marked as over-annotated, hydrogenosome accepted and used as core location). Further source defects, all check requests: the TreeGrafter rows for GO:0004776 and GO:0006099 on this grafted sequence (filed to PANTHER as PROBABLE queries; the PAINT IBDs at PTN000122012 are not disputed), the tricarboxylic acid cycle statements of the UniProt entry, and the matrix note of its subcellular location comment, which the main text of the cited paper does not support. No sub-compartment row is added.

    Depth: PMID:18452512 was read in full in the cache; PMID:27478903, PMID:33174373, PMID:18403202 and PMID:21439036 are cached with full text and were read for the relevant passages; PMID:31282474, PMID:18694756, PMID:18757809 and PMID:24316280 are abstract only. PMID:24316280 was fetched with just fetch-pmid. The perplexity deep-research provider was not available (no provider file written); the literature search is recorded in the notes file. No bioinformatics analysis was added.

    Validation: just validate BLAHN SCSa passes with 0 errors; the two warnings are the uv environment-variable deprecation message captured from the term and reference validators and carry no content finding. Quote check: 98 verified, 0 failures. Four BIOLOGY knowledge gaps (direction and pathway in the organism; location in the strain and within the organelle, and processing; the untested roles of the alpha subunit and the stoichiometry; requirement for growth).

    Follow-up after independent checks (same day). The GO:0004776 defect was lowered from CONFIRMED to PROBABLE and, with the GO:0006099 propagation defect, refiled from GO_CENTRAL to PANTHER with the TreeGrafter row as the record. The isolate of PMID:18694756 is no longer stated, since its abstract does not give it. The sentences on the disagreement with the SCSb review were replaced, the two reviews now being aligned.
