  summary: Wire OpenScientist thermodynamic analysis of succinyl-CoA synthetase direction
  details: |
    Wired an OpenScientist run (kgap-blahn-scs-direction) into the knowledge gap asking
    which direction the Blastocystis succinyl-CoA synthetase runs and which pathway it
    serves. Status OPEN -> NARROWING. Two cited papers added as references with
    verified reviews.

    The run makes the ATP-forming direction the better-supported reading while leaving
    it unestablished, and notably it weakens the best argument for that reading rather
    than strengthening it.

    Thermodynamics settles the question as a question. The apparent free energy change
    for succinyl-CoA + ADP + Pi -> succinate + CoA + ATP lies between -1.79 and -4.62
    kJ/mol at 37 C across four independent estimates, every one smaller in magnitude
    than the 5.94 kJ/mol a single ten-fold concentration ratio is worth. Direction is
    therefore set by mass action, and neither the enzyme's name, its EC number, nor the
    direction the published assay was run in carries information about physiological
    direction. The reported assay was run in the succinyl-CoA-forming direction with
    saturating substrates, which for an enzyme this close to equilibrium is a statement
    about a cuvette.

    For the ATP-forming reading: the genome of this subtype encodes exactly two
    CoA-transferase family I proteins at 58.5-59.7% identity to the Trichomonas
    hydrogenosomal ASCT family, so the cycle partner exists. Summing the transferase
    step with this enzyme's cancels succinate and succinyl-CoA exactly, giving a net
    acetyl-CoA + ADP + Pi -> acetate + CoA + ATP at -0.90 to -2.17 kJ/mol; the
    succinate-concentration objection therefore drops out of the thermodynamics and the
    binding constraint moves to acetate (below roughly 1 mM). The biosynthetic
    alternative is weakened close to elimination: neither this subtype's proteome nor
    subtype 7's contains any heme biosynthesis gene or a lysine-to-succinyl-CoA route,
    so demonstrable succinyl-CoA demand is near zero.

    Against it: the one-step ADP-forming acetyl-CoA synthetase route has the identical
    overall reaction and identical free energy change, so thermodynamics cannot choose
    between the two acetate routes at all. And the strongest indirect argument - that an
    organelle with a membrane potential, a genome and protein import but no ATP synthase
    must make matrix ATP somehow, and this is the only candidate ligase - is removed:
    the glycolytic pay-off phase sits in the matrix and already supplies that ATP, shown
    in the same work that confirms the absence of an ADP/ATP carrier. What remains is an
    inventory argument plus an analogy, and the analogy is imperfect: the decisive
    genetic and in organello evidence comes from an organism with an F1Fo ATP synthase
    whose oligomycin readout has no counterpart here. No flux, metabolite pool or axenic
    end-product measurement exists for Blastocystis of any subtype.

    Curation consequence unchanged but better argued: this bears on commentary, and no
    GO annotation asserting a direction is licensed. No annotation action changed.

    Verification done here: the three load-bearing publications were checked against
    their PubMed records and each supports what is claimed of it, including the absence
    of complexes III and IV, ATP synthase and ADP/ATP carriers alongside matrix ATP
    production, and the ASCT kinetics with their explicit high-succinate caveat. A
    fourth identifier the run's validator reported as unresolved (PMID:8410536) is a
    real record, a review of hydrogenosome biogenesis in Trichomonas, so that was a
    lookup failure rather than a confabulation; it bears on the presequence gap in this
    file rather than this one. Not reproduced here: the two CoA-transferase accessions
    and their identity figures, the absence of heme and lysine-route genes, the free
    energy arithmetic and the acetate bound.

    One self-correction during wiring: I first added the material under a
    boundary_addendum key, which is not in the schema. Validation caught it; the text
    was moved into the existing boundary field.
