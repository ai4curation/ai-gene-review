events:
- type: EDIT
  outcome: changed
  summary: 'Add presequence analysis: charge observations are chance-level but amphipathicity
    is 98th percentile against a curated cut'
  details: |
    Added a local presequence feature analysis for the SCS alpha location/presequence gap
    and wired it into the boundary. Gap KEEPS status OPEN. The result strengthens the
    presequence prediction, but for different reasons than the boundary quotes, and it
    calibrates the companion analysis on the beta subunit.

    Why this was tested rather than inherited. The gap cites as established "a predicted
    N-terminal presequence with arginine two residues before the predicted cleavage
    site". The companion analysis on 9FUNG/SUCLG2__A0A9P6TY68 had just shown that
    observations of exactly that shape can be chance-level, so the claim needed checking.

    Why this case is stronger than that one. The cleavage point here is CURATED in the
    record (TRANSIT 1..18, CHAIN 19..318), not inferred from an alignment, so the
    arginine-at-minus-two observation is not conditional on a guessed cut - which was the
    caveat that weakened the beta subunit's equivalent claim. The script reads the
    boundary from the record's own feature table rather than taking a typed-in number.

    Results, with the beta subunit alongside:
    - P(zero acidic in 18) = 0.215 here, 0.138 there - both chance-level
    - P(>= observed basic) = 0.318 here (3 basic), 0.404 there (2 basic) - both
      chance-level
    - Hydrophobic moment +0.460, 6th of 301 windows, 98th percentile HERE, against +0.283
      and the 64th percentile THERE
    - R17 at minus two of a CURATED cut here; R13 at minus two of an ASSUMED cut there

    So the charge observations both gaps lean on add nothing in either case. The two cases
    come apart on amphipathicity, which is the feature cleavable presequences actually
    display: strongly positive here, unremarkable there. That contrast also calibrates the
    method - it distinguishes a strong case from a weak one rather than calling everything
    chance, which is what I would have worried about after the SUCLG2 result alone.

    At sequence level the presequence prediction for this protein is therefore well
    supported, on amphipathicity and the curated arginine rather than on the composition
    the boundary cites.

    What this does NOT establish, and the boundary says so: nothing here shows the
    presequence is removed, which is half of what the gap asks, and nothing locates the
    protein in the strain of this entry or within the organelle, which is the other half.
    A strong presequence prediction is neither import nor processing. The gap's resolution
    still requires the protease protection, carbonate extraction and N-terminal sequencing
    it already names.

    New file: genes/BLAHN/SCSa/SCSa-bioinformatics/presequence_features.py (stdlib only,
    no network, hardcodes no results) plus RESULTS.md. Every figure quoted in RESULTS.md
    was checked against a fresh run. No targeting-sequence predictor was run; TargetP and
    MitoFates are not installed and there is no network. No annotation action changed and
    no localisation dataset was consulted.
