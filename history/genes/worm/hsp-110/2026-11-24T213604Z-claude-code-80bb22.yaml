  summary: Narrow the HSP-110 ATPase gap with an OpenScientist nucleotide-site analysis
  details: |
    Ran OpenScientist (3 iterations) on HSP-110 NBD. Keeps ATP-binding half (adenosine pocket, Mg ligands D7/D204, K68, E175) but lost beta/gamma-phosphate threonines (N10, L11), DLGGGT loop (H207/S208/S209) and Mg/K ligand (Q211), all checked locally; positions fully retained in nematode Hsp70s. ATP binding predicted, canonical hydrolysis lost; consistent with existing MARK_AS_OVER_ANNOTATED on IEA GO:0016887. Gap OPEN -> NARROWING; run reference UNVERIFIED.
