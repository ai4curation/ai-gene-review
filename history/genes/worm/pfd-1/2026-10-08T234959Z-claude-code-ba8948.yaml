  details: |
    New review of C. elegans pfd-1 (Q17827, C08F8.1), a beta-class prefoldin subunit. All 9 GOA rows were reviewed: 8 ACCEPT and the gonad development IMP kept as non-core because it acts indirectly through tubulin biogenesis. Core function: protein folding chaperone (GO:0044183) in the prefoldin complex, cytoplasm. Evidence: Lundin 2008 (abstract), Vainberg 1998, the Meissner 2011 muscle GFP screen and Falcon deep research.
