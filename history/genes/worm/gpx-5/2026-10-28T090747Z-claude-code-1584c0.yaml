  summary: 'Create review: gpx-5'
  details: |
    New review of C. elegans gpx-5 (C11E4.1, Q93204), a secreted Cys-type glutathione peroxidase-family protein. All 10 GOA rows reviewed against the full text of PMID:23593298 and the UniProt record. Peroxidase activity, extracellular region and cellular oxidant detoxification accepted as core; glutathione peroxidase activity (IBA, IEA) left UNDECIDED because Cys72 replaces the selenocysteine and GSH dependence is unmeasured; the WormBase IMP to response to reactive oxygen species modified to response to arsenic-containing substance with a source defect, since knockdown sensitised worms to arsenite but not juglone; cell redox homeostasis marked over-annotated. Manual literature notes added; no new terms proposed.
