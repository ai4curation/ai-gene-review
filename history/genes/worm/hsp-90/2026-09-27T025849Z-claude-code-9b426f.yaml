  summary: Retire duplicate worm/daf-21 folder; canonical review is worm/hsp-90
  details: |
    genes/worm/daf-21 and genes/worm/hsp-90 both reviewed UniProt Q18688 (HSP90_CAEEL, WormBase WBGene00000915, C47E8.5). I chose hsp-90 as the canonical folder because it is the current primary symbol in every source I checked: the UniProt entry (GN Name=hsp-90; Synonyms=daf-21), its WormBase cross-reference (DR WormBase; ...; WBGene00000915; hsp-90), the gene symbol in the GOA rows, and MyGene/NCBI (symbol hsp-90). daf-21 is the historical mutant name and is now a synonym. This contradicts the premise in the task that the WormBase symbol is daf-21. The two folders' uniprot.txt and goa.tsv files were identical. A structural diff of the reviews found the same annotation rows and differences only in curator judgement: 6 ACCEPT/KEEP_AS_NON_CORE choices differ, and hsp-90 carries one extra NAS alignment row. The hsp-90 review is the larger and more recent one (bioreason, GO-GPT and SFT prediction files were added later), so its actions were kept. daf-21 held nothing that hsp-90 lacked beyond a cached re-run of the same falcon query with fewer citations (19 vs 23), which was dropped. The daf-21 folder was deleted.
