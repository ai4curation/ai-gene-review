  details: |
    GO:0010466 negative regulation of peptidase activity: UNC(1) -> NPI(0), PSEUDOENZYME_OVERANNOTATION. GO:0004867 serine-type endopeptidase inhibitor activity: UNC(1) -> NPI(0), PSEUDOENZYME_OVERANNOTATION. Reason: the re-reviewed gene review and its bioinformatics analysis show C28G1.2 has no counterpart to the hinge/reactive-centre loop of its inhibitory paralogs, and PMID:25786854 restricts bona fide inhibitors among C. elegans serpins to SRP-1/2/3/6/7. PubMed search found no paper naming C28G1.2. Added PMID:25786854 and the bioinformatics RESULTS as references; replaced the uninformative UniProt domain-coordinate quote.
