  summary: Full re-review of C28G1.2 (Q18287), independent of ProtNLM2 predictions
  details: |
    Placed Q18287 in the PANTHER 19 PTHR11461 tree: it is inside the Caenorhabditis intracellular serpin duplication clade (PTN002479232), with no characterised ortholog. Added bioinformatics (tree placement; hinge/RCL and alignment check showing that the reactive-centre loop is missing; Phobius shows no signal peptide). Changed the extracellular region IBA from UNDECIDED to REMOVE (over-propagated from the family root into a cytosolic clade; PMID:25786854, PMID:14739286). Rewrote the description, added paralog references, and suggested that PAINT add IKR/NOT for GO:0004867 and GO:0005576. Appended to the notes.
