  details: |
    New review of C. elegans gpr-1 (Q95QJ7), a TPR-GoLoco G-alpha GDI acting with its near-identical paralog gpr-2. All 17 GOA rows reviewed: GDI activity, G-alpha binding, cell cortex and establishment of mitotic spindle localization accepted as core; spindle IEA and GTPase regulator IEA modified to mitotic spindle and GDP-dissociation inhibitor activity; spindle elongation, nuclear migration, aster and mitotic spindle kept as non-core; regulation of GPCR signaling marked over-annotated (pathway is receptor-independent); three bare protein binding rows removed. Fetch used the accession with an alias because the UniProt symbol search timed out. Literature compiled manually into a deep-research-manual file.
