  summary: New mec-3 review (LIM homeodomain TRN selector) using the WormBase description
    as a recall checklist
  details: |
    New review of C. elegans mec-3 (P09088), the LIM homeodomain partner of UNC-86 and terminal selector of touch receptor neuron identity. Automated deep research was unavailable (no provider keys); the literature was searched by hand (PubMed E-utilities, queries recorded in mec-3-notes.md). fetch-gene was run with --uniprot-id P09088 because UniProt's gene-symbol search was rate-limited earlier. Newly cached papers include the classic touch-cell papers (PMID:2898300, PMID:2576011, PMID:8103239, PMID:10848606) and full texts of PMID:26096732 (ALM/BDU competition), PMID:23889932 (MEC-3 level and AHR-1 in PVD versus AVM), PMID:20537990, PMID:26547238, PMID:37729192 and PMID:39423233 (MBL-1 splicing of mec-3). All 31 GOA rows reviewed: 21 ACCEPT, 5 MODIFY, 3 KEEP_AS_NON_CORE, 2 TOO_GENERAL; one NEW row, GO:0042490 mechanoreceptor differentiation (IMP, PMID:2898300), because MEC-3 directly activates the touch-receptor gene battery with UNC-86 (comparator: only mec-17 carries the term in C. elegans). MODIFY: GO:0005515 protein binding (LDB-1) to GO:0001221 transcription coregulator binding; both GO:0006355 rows to Pol II children; both GO:0106027 PVD rows to GO:0140059 dendrite arborization. KEEP_AS_NON_CORE: transcription coactivator activity (IDA; MEC-3 is itself a DNA-binding heterodimer partner), mechanosensory behavior and response to mechanical stimulus. TOO_GENERAL: DNA binding and plasma membrane bounded cell projection organization. The four neuron differentiation rows are accepted with one consistent action. Two core functions: Pol II DNA-binding TF activity with UNC-86 in mechanoreceptor differentiation, and in PVD dendrite and identity control. WormBase reference VERIFIED with a CONFIRMED MISSING_STATEMENT (heterodimer and targets, ALM/BDU competition, PVD role); UniProt reference VERIFIED with a CONFIRMED MISSING_STATEMENT on CC:TISSUE SPECIFICITY (PVD omitted). Descriptions sidecar scored and set COMPLETE.
