  summary: Fold the NEW mechanoreceptor differentiation row into MODIFYs of the two
    IMP rows
  details: |
    Coordinator check of the batch review. The review proposed GO:0042490 mechanoreceptor differentiation as a NEW IMP row (PMID:2898300). GO:0042490 is a direct is_a child of GO:0030182 neuron differentiation, which mec-3 already carries on four rows, and the CLAUDE.md NEW bar rejects a term that is a descendant of one the gene already carries. The sanctioned route is MODIFY of the rows whose own evidence supports the specific term: the IMP rows from PMID:7227647 (Developmental genetics of the mechanosensory neurons) and PMID:8187641 (Combinatorial control of touch receptor neuron expression) are both about touch receptors, so both now MODIFY to GO:0042490, carrying the quotes that supported the NEW row (PMID:2898300, PMID:9735371, PMID:2576011). The IBA and IEA rows on GO:0030182 rest on family-level evidence and stay ACCEPT, under the 2026-11-14 ruling that MODIFY needs the row's own evidence; validation reports this ACCEPT/MODIFY split as an action-consistency warning, as it does for lin-31 GO:0043565. The core function's GO:0042490 directly_involved_in is unchanged. The descriptions sidecar insight finding was reworded to match.
