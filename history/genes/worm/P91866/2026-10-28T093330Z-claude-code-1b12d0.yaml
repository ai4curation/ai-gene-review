  summary: 'Create review: P91866'
  details: |
    New review of P91866 (F32H2.6, WBGene00009343), a 187-residue partial paralog of the N-terminal region of fatty acid synthase FASN-1. A local alignment (P91866-bioinformatics) shows 67% identity to FASN-1 residues 28-194, ending just before the ketoacyl synthase active-site motif, so the product lacks the KS catalytic Cys and both catalytic His residues. The single GOA row (GO:0016746 acyltransferase activity, IEA InterPro2GO via IPR016039) was removed as a fragment over-annotation, with a source_defects entry against the InterPro2GO mapping. The only paper naming the gene (PMID:15340492) was read in full; its RNAi phenotype is confounded by cross-targeting of fasn-1, so no NEW terms were proposed and core_functions is empty. Manual literature notes, questions and a suggested experiment were added.
