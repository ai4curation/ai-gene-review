  summary: 'Create review: rfth-1'
  details: |
    De novo review of C. elegans rfth-1 (ZK180.3, UniProt Q23444), the worm RFT1-family member. No worm primary literature exists; all 9 GOA rows (IBA/ISS/IEA) were judged against yeast and human RFT1 literature and a local pairwise-identity check (about 31% to human RFT1). ER membrane, dolichol-linked oligosaccharide biosynthesis, N-linked glycosylation and glycolipid translocation accepted; generic membrane modified to ER membrane; NEW ISS intramembrane lipid carrier activity added as the core MF with the family caveat that M5-DLO scrambling may not be the essential in-vivo role. PMID:23483992 was found to concern the unrelated riboflavin transporters rft-1/rft-2 and is recorded with relevance NONE to document the name collision.
