  summary: Record OpenScientist IFT-B contact and sub-complex analysis for DYF-13
  details: |
    Ran an OpenScientist deep-research job (kgap-dyf13-iftb-position) on two knowledge gaps, the molecular activity and direct IFT-B contacts of DYF-13, and whether it sits in the IFT-B core or periphery. Both moved from OPEN to NARROWING, and neither further, because every structural result is from Chlamydomonas rather than C. elegans.

    Partner identity is answered. Computed from PDB 8BD7, the in situ cryo-electron tomography structure of the Chlamydomonas anterograde IFT train, IFT56 contacts exactly IFT46, IFT52 and IFT70 and none of the other nine modelled subunits; the set is identical in both train repeats, survives loosening the contact cutoff, and matches biochemistry from mouse, human cells and trypanosomes. All three partners have worm orthologs at 36 to 48 per cent identity. The transfer rests on orthology alone, since the run reports the IFT56-binding residues of those partners are no better conserved than the rest of the same proteins, and no experimental structure of DYF-13 or any C. elegans IFT-B protein exists.

    Sub-complex position resolves to peripheral, by a measure the hypothesis did not propose: IFT56 buries 31 interface residues across 555 modelled, ranking twelfth of thirteen against a median of 124, has betweenness centrality of zero, is not an articulation point, and makes no contacts across the train repeat boundary. The run also shows this does not contradict the mammalian core assignment, which is a statement about salt-resistant association that three well-formed interfaces can supply.

    The discriminator I proposed in the hypothesis, convex versus concave solenoid face, was tested and refuted outright, with contacts splitting 6 concave to 9 convex against a 218 to 305 background. That is recorded in the second gap's boundary.

    One finding outside the question is recorded in the first gap because it bears on the molecular-function problem: IFT-B binding explains only the N-terminal half of DYF-13, all transferred contact positions lying at or before residue 324, while the C-terminal half is equally conserved and better ordered yet contacts nothing, and all four conserved exposed surface patches fall outside the mapped contacts.

    Verified against local records: the 574-residue length, and the run's observation that Q95QT8 carries eleven GO annotations with six IBA, four NAS and one IEA and no experimental evidence code, which the local GOA file reproduces exactly. The GOA file was used only to check that claim about annotation state, not as support for any biological assertion. The contact computation, interface-size ranking, network measures and ortholog identities were not independently recomputed, and the run is explicit that 8BD7 is a 9.9 Angstrom map with docked models, so partner identity is more reliable than its residue lists. No annotation action was taken.
