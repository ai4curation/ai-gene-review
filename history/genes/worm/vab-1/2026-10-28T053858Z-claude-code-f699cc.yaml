  summary: 'Create review: vab-1'
  details: |
    Initial review of C. elegans vab-1 (UniProt O61460), the sole Eph receptor tyrosine kinase. All 28 seeded GOA rows reviewed: ephrin receptor activity, transmembrane RTK activity, plasma membrane, axon guidance and embryonic epithelial morphogenesis accepted; general kinase terms modified to transmembrane receptor protein tyrosine kinase activity; oocyte maturation modified to negative regulation of oocyte maturation (MSP sperm-sensing checkpoint); axonogenesis and regulation of axon guidance modified to axon guidance; embryo development modified to morphogenesis of embryonic epithelium; two bare protein binding rows modified to protein domain specific binding (VPR-1 MSP domain) and phosphatase binding (DAF-18). No NEW terms proposed. Literature compiled manually (no deep-research provider) in vab-1-deep-research-manual.md; PMID:22363657 was found to be an RHGF-2 paper with no VAB-1 experiment.
