  summary: 'Create review: unc-29'
  details: |
    De novo review of C. elegans unc-29 (P48181), the non-alpha subunit of the levamisole-sensitive acetylcholine receptor. All 41 GOA rows were reviewed against cached literature, including full texts of PMID:10461217, 15990870, 19020092 and 23577128. Core: contributes to GO:0022848 within GO:0005892 at the postsynaptic membrane, in neuromuscular transmission and EPSP. Generic InterPro, IBA and inter-ontology terms were refined (MODIFY). Seven rows are UNDECIDED: four pharyngeal pumping IGI rows plus the GO:0014057 and GO:0090326 rows, whose cited papers are abstract-only and do not name unc-29 in the abstract; and GO:0006937, whose cited full text (PMID:19028454) never mentions unc-29 and is recorded as a suspected wrong-reference source defect. No NEW terms were added.
