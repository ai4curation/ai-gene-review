    IBA over-annotation re-review 2026-11-24 (batch N09). GO:0005768 endosome stays MARK_AS_OVER_ANNOTATED, but the earlier reason said the Rab3 clade has no endosome evidence. The IBD at PTN000635134 (309 leaves) has nine seeds: eight in the Rab8/Rab12/Rab13 clade PTN001179164 (190 leaves) and one, mouse Rab3a (located_in IDA PMID:11182090, MGI), in the Rab3 clade PTN001178498 (102 leaves). PMID:11182090 is a ClC-3 paper from which MGI made the same endosome annotation for Clcn3 and Lamp1, so Rab3a was probably a marker; abstract only, recorded as a query. Reason and propagation_review rewritten; quotes unchanged.
