  summary: 'Create review: worm gpx-3'
  details: |
    Created a de novo C. elegans gpx-3 review for the nematode GPx antioxidant-defense lane. Reviewed the UniProt Q95003 record, PANTHER PTHR11592/SF88 context, the Luersen et al. RNAi screen and the existing gpx-5 comparator to accept peroxidase activity, extracellular localization and cellular oxidant detoxification, leave glutathione-specific activity undecided pending a reductant assay, and keep broad oxidative-stress response terms as non-core. Validated the gene review and checked quoted support.

    Followed up on AI review by rewording the oxidative-stress response reasons so KEEP_AS_NON_CORE no longer argued that the terms were too general, making the cellular-response rationale consistent with the accepted cellular oxidant detoxification row, and adding a Brugia malayi GP29 UniProt subcellular-location quote to support the secreted/cuticular SF88 family context used for GPX-3 extracellular localization.
