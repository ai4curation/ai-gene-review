  details: |
    De novo review of C. elegans rsks-1 (Q9NAH6), the p70 S6 kinase ortholog. All 18 GOA rows reviewed: Ser/Thr kinase activity and TORC1 signaling accepted as core; generic protein kinase activity and signal transduction modified to the specific terms already carried; lifespan, larval development, autophagy and neuronal localization rows kept as non-core; the NOT lifespan row from PMID:17277769 left UNDECIDED (abstract only, conflicts with other studies). PMID:22560223 full text shows rsks-1 RNAi reduces autophagy, supporting the BHF-UCL row; the opposite statement in UniProt is recorded as a source defect. No deep-research provider was used; a manual literature file was written instead.
