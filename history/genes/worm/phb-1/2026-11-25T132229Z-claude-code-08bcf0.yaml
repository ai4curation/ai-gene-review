- type: EDIT
  outcome: changed
  summary: Record OpenScientist structural analysis refuting a holdase groove in the
    prohibitin ring
  details: |
    Ran an OpenScientist deep-research job (kgap-phb1-holdase-vs-scaffold) on the knowledge gap covering the molecular mechanism of the mitochondrial prohibitin complex. The result is an asymmetric narrowing: the holdase limb is refuted, the scaffold limb remains open.

    The run first corrected the premise it was given. My hypothesis asked for analysis from predicted structures; four cryo-EM prohibitin depositions were released in 2025, so it ran on measured coordinates instead. That mattered and the run showed why: superposing the C. elegans AlphaFold monomers onto the assembled protomers gives about 1.2 Angstrom over the SPFH core but about 5 Angstrom over the coiled-coil arm and about 10 Angstrom whole chain, so the arm that builds the compartment wall sits at a different hinge angle in an isolated monomer prediction, and any groove or cavity claim from monomer models alone would have been unreliable.

    On the measured assembly there is no continuous hydrophobic groove or cleft of the kind a holdase uses. The only large contiguous exposed apolar surface is a flat band about 138 Angstrom long at the membrane-proximal rim, built from residues immediately following the membrane anchors, and the enclosed intermembrane-space compartment is 7 to 17 times wider at the membrane end than a holdase cleft while being slightly more polar than the whole-complex background rather than apolar-enriched. Compared on measured features rather than by name, the largest contiguous exposed hydrophobic patch per 100 residues groups prohibitin with SPFH scaffolding rings and away from characterised holdases, whose patches are compact, the footprint of one client segment. Conservation agrees: across 68 nematode PHB1-type and 16 PHB2-type sequences selection tracks the buried core and the subunit interfaces with no conserved lumen-lining set, and the lumen surface is the least conserved class between human and worm.

    Status moved from OPEN to NARROWING. The run's closing statement is recorded as the operative one: a ring of this kind can be denied a holdase groove from structure, but it cannot be assigned a scaffold molecular function from structure alone, because a scaffold is defined by what it holds and coordinates do not show that.

    Two caveats are recorded. Nothing here is C. elegans structure; the measured coordinates are human and the worm reading is a superposition, which is also what exposed the hinge problem. And this run's own reference validation flagged every quotation it attempted as unsupported and one reference as unresolved, so none of its literature quotations is relied on in the review and only its computed results are recorded. Locally I could check only the 275-residue length, the 180-213 coiled-coil annotation and the Band_7/SPFH Pfam assignment, all consistent with its domain map. No annotation action was taken.
