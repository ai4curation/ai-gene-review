  summary: 'Create review: fasn-1'
  details: |
    Created the first review of C. elegans fasn-1 (P91871, TrEMBL), the sole type I fatty acid synthase. All 15 GOA rows (IBA/IEA only) reviewed: overall FAS activity, the partial KS, MAT acetyl-transfer, KR, DH, ER and TE activities, and fatty acid biosynthetic process accepted on domain architecture, a new alignment showing every human FASN catalytic residue conserved, and in vivo palmitate output (PMID:21178429); oxidoreductase, transferase, acyltransferase and monocarboxylic acid metabolic process marked TOO_GENERAL; phosphopantetheine binding kept as non-core. Added NEW [ACP] S-malonyltransferase activity (conserved MAT Ser621) and cytoplasm (endogenous FASN-1::mNG, PMID:39007804). Phenotype-only processes (molting, embryogenesis, eggshell, innate immunity, anchor cell invasion) were deliberately not proposed. Literature synthesis written manually (no deep-research API).
