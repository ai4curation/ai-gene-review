  summary: 'Create review: gon-2'
  details: |
    Created the gon-2 (Q93971) review. All 16 GOA rows were reviewed. Generic channel, transport and membrane rows were refined (MODIFY) to calcium channel activity, calcium/magnesium ion transmembrane transport and plasma membrane, based on patch-clamp evidence of a Ca2+-selective, Mg2+-permeable GON-2-dependent intestinal current (PMID:18299395). Plasma membrane rows were accepted. The mitotic cell cycle, gonad development and defecation IMP/IGI rows were kept as non-core, because the channel most likely supports these processes by supplying cations. No NEW terms were proposed. A manual literature review and notes were written, since no deep-research provider was available.
