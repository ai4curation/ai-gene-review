  summary: Narrow the FNDC-1 LIR/ATG8 knowledge gap with an OpenScientist run
  details: |
    Ran OpenScientist (3 iterations) on whether FNDC-1 carries a FUNDC1-equivalent LIR. Refuted: the YEVL LIR and its phosphosites are absent at the aligned position in all 12 nematode FUN14 proteins; the only LIR-like core (YYVV 27-30) is at chance level and not conserved; DCT-1's LIR is recovered as a positive control. FNDC-1 is a co-ortholog of FUNDC1/FUNDC2. Added a caveat to the NEW ISS GO:0140580 row (kept, on the genetic evidence) and reworded the description. Gap OPEN -> NARROWING.
