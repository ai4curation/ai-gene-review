    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N05). GO:0034045 phagophore assembly site membrane (IBA) changed from MARK_AS_OVER_ANNOTATED to MODIFY with proposed replacement GO:7770114 phagophore membrane. The earlier review held the row because the term was defective and GO had no destination. GO has since made GO:0034045 obsolete with replaced_by GO:7770114 (QuickGO, checked 2026-11-24). The IBD at the family root PTN000132136 is seeded by WIPI1, WIPI2 and yeast ATG18 in ATG-18's own child clade PTN000132137, so the location claim is sound. Same replacement as the human WIPI2, yeast ATG18 and worm epg-6 reviews. The proposed_new_terms entry for phagophore membrane is now redundant and was left in place for a later full revision. Validated with just validate; no new error or warning.
