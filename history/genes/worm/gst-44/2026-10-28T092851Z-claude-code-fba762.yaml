  details: |
    New review of the omega-class GST gst-44 (O45352), grounded in the full text of PMID:40186509 (biochemistry, reporter and deletion-mutant study) and PMID:23593298 (RNAi screen). DHAR, methylarsonate reductase and cytoplasm rows accepted; glutathione transferase (conjugation) rows marked over-annotated because recombinant GST-44 showed no CDNB or ethacrynic acid activity; the WormBase IMP to response to reactive oxygen species was modified to response to arsenic-containing substance, with a source defect recorded, because the cited screen found arsenite but not juglone sensitivity; peroxidase activity and detoxification of arsenic-containing substance added as NEW rows.
