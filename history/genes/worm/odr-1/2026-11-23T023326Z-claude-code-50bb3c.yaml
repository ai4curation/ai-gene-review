  details: |
    Ran OpenScientist (3 iterations) on whether the ODR-1 cyclase domain has the full class III catalytic set for an autonomous homodimer. It lacks both metal-binding Asp (Gln864, Glu908 in the cached 1067-aa numbering) but keeps the substrate half (Glu904 = the E904A residue, Cys976, Asn983, Arg987). Residues were checked locally. DAF-11 has the mirror-image pattern, which predicts an obligate heterodimer. Gap OPEN -> NARROWING; co-assembly and enzymology are untested.
