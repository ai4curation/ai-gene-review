  summary: Narrow the OSM-6 GIFT-domain residual-activity knowledge gap with an OpenScientist
    run
  details: |
    Ran OpenScientist (3 iterations) on the MF_DARK gap of whether the OSM-6/IFT52 GIFT (class-I GATase-like) domain keeps any catalytic or ligand role. Fold confirmed (TM ~0.72 to CarA), but the Cys-His-Glu triad and oxyanion glycines are absent in all 15 orthologs examined, so residual GATase activity is effectively ruled out. Only a buried, solvent-inaccessible cavity remains, with no conserved surface pocket. Gap OPEN -> NARROWING (a gated small-ligand site is not formally excluded).
