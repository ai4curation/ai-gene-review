  details: |
    New review of C. elegans nprl-2 (W6RQZ3, NPRL2/GATOR1 ortholog). All 6 GOA rows reviewed: contributes_to GTPase activator activity, GATOR1 complex and negative regulation of TORC1 signaling (IBA and ARBA IEA) accepted; vacuolar membrane IBA modified to lysosomal membrane with propagation review; cellular response to amino acid starvation kept as non-core. Worm support comes from nprl-2 RNAi suppression of elo-5 L1 arrest (PMID:23705068); molecular function and location from human and fly orthologs. No NEW terms proposed; manual literature notes written as no deep-research provider was available.
