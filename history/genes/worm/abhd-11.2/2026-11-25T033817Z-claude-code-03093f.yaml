  summary: Record OpenScientist paralog-divergence analysis for abhd-11.2 and abhd-11.1
  details: |
    Ran an OpenScientist deep-research job (kgap-abhd112-paralog-divergence) on the knowledge gap covering the relationship between the duplicated Caenorhabditis paralogs abhd-11.2 and abhd-11.1. The run refutes the pseudoenzyme arm: both carry a complete Ser-His-Asp triad on an identical GHSMGG nucleophile elbow, with abhd-11.2 Ser124, Asp150 and His279 confirmed against the local O45707 record, and neither lineage shows relaxed or positive selection (omega 0.082 and 0.071 against C. briggsae). The predicted mitochondrial presequences are statistically indistinguishable, so the sub-mitochondrial half of the gap is untouched.

    What separates the paralogs is pocket chemistry and dosage: 7 of 29 residues within 9 Angstrom of the nucleophile serine are subfamily-diagnostic, led by a Phe-to-Arg change 5.10 Angstrom from the serine placing a charged side chain in the acyl channel of abhd-11.1 alone; abhd-11.2 outscores abhd-11.1 across 10 Bgee tissue terms at a median 3.1-fold; and only abhd-11.2 has protein-level evidence and shares the human subfamily PTHR46118:SF4. Status moved from OPEN to NARROWING on that basis, with the run's own caveat recorded that the separation is relative and rests on no worm assay.

    Two of the run's leads were handled explicitly. Its observation that the diacylglycerol lipase name, EC 3.1.1.116 and the catalytic-activity statements on O45707 are ARBA propagation from a contested human assignment was confirmed in the local record and recorded in the boundary; none of that content was imported into the review. Its lead to amend review text asserting a missing HGGG motif does not apply, because HGGG came from the hypothesis prompt rather than from this review; that is noted in the reference review so the lead is not acted on later by mistake. The duplication could not be dated, since paralog synonymous divergence is saturated.
