  summary: 'Create review: gtl-2'
  details: |
    De novo review of C. elegans gtl-2 (Q20766), a TRPM cation channel. All 9 GOA rows reviewed: cation channel activity, cation transmembrane transport, plasma membrane and basal plasma membrane (IDA, PMID:20221407) accepted; generic IEA rows refined to cation channel/transport and plasma membrane; metal ion transport IBA refined to magnesium ion transmembrane transport. One NEW row, magnesium ion homeostasis (IMP, PMID:20221407), based on excretory-cell basal localization, GTL-2-dependent current and Mg2+-specific excretion phenotypes. Selectivity of GTL-2 has not been measured, so MF stays at cation channel activity. Literature summary written by hand (no deep-research API).
