  summary: 'Create full review: mtm-9 (Q965W9), inactive MTM-6 partner'
  details: |
    New gene review created independently of ProtNLM2 predictions, as the experimental reference for SF73 (PTHR10807:SF73). All 21 GOA rows reviewed. The catalytic-loop check (mtm-9-bioinformatics) shows G346 in place of the nucleophilic Cys and Ser in place of the loop Arg, so NOT PI3P phosphatase activity is accepted. Core functions: phosphatase binding to MTM-6 within the MTM-6/MTM-9 PI-phosphate phosphatase complex (phosphatidylinositol dephosphorylation), and pinocytosis by coelomocytes. The endocytosis rows were refined to pinocytosis (fluid-phase endocytosis). The IBA for protein phosphatase binding was modified to phosphatase binding because the partners are lipid phosphatases. Synapse assembly (NAS) and negative regulation of autophagy (IBA, human MTMR9 SF56 donor) were marked over-annotated as downstream readouts. Regulation of cell migration was kept as non-core. Apical plasma membrane was left UNDECIDED. PAINT propagated MTMR9 binding but not phosphatase activator activity; that omission was respected and no NEW activator term was added. Deep research failed (falcon 403, perplexity quota) and this is recorded in the notes.
