  summary: 'Create review: tol-1'
  details: |
    Reviewed all 6 distinct GOA annotations (7 GOA rows; GO:0050829 duplicated) for C. elegans TOL-1, the sole nematode Toll-family receptor. Accepted signaling receptor activity (IBA), signal transduction (IEA), cell surface receptor signaling pathway (TAS) and embryo development (IMP, reinforced by the 2025 TOL-1/LAT-1 structure and interface-mutant phenocopy, PMID:40588662). Modified defense response (IMP, PMID:11516642) to GO:0002209 behavioral defense response, because the phenotype was Serratia avoidance and the same paper found no role in pathogen resistance. Kept defense response to Gram-negative bacterium (IMP, Salmonella, PMID:17975555) as non-core given contested immune role. Added NEW GO:0001664 G protein-coupled receptor binding (direct LAT-1 latrophilin binding, SPR and structure; comparator: GPCR ligands carry it, teneurins carry parent GO:0005102). Did not assign GO:0002224, GO:0038187 or GO:0008063; raised the Toll-pathway scope as a question. No deep research was queued for this gene. just validate passes with no warnings.
