  summary: Narrow the NHR-47 ligand knowledge gap with an OpenScientist run
  details: |
    Ran OpenScientist (3 iterations) on whether the NHR-47 LBD has a ligand pocket. The HNF4-like core has no enclosed hydrophobic cavity (resembles ligand-free Nurr1), and the HNF4alpha fatty-acid site is occupied or open. A disordered 178-residue insertion replaces the pocket-roofing H6-H7 segment, so this is inconclusive but leans negative. Gap OPEN -> NARROWING.
