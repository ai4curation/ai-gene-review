  summary: New review of lin-31 (FoxB forkhead effector of MPK-1 in vulval fate) with
    WormBase description checked
  details: |
    New review of C. elegans lin-31 (P34683) for the MOD descriptions project. Automated deep research was unavailable; literature was searched manually (PubMed, Europe PMC, QuickGO by reference) and recorded in lin-31-notes.md. All 14 GOA rows reviewed: 12 ACCEPT, 1 KEEP_AS_NON_CORE (IBA anatomical structure morphogenesis), 1 MODIFY (IDA sequence-specific DNA binding, PMID:16782085, to GO:0000978 RNA polymerase II cis-regulatory region sequence-specific DNA binding, since the bound DNA is the lin-39 P6.p enhancer). No NEW rows: vulval cell fate specification descends from the carried vulval development term, and the cki-1/VPC quiescence role (PMID:18082681) rests on abstract-level reporter evidence. The vulval development IMP/IGI rows cite PMID:11861555, whose abstract does not mention lin-31; accepted and deferred to the curator. The WormBase description is DISPUTED: an OUTDATED_STATEMENT defect (PROBABLE, SPECULATION_AS_ASSERTION) for the claim that phosphorylated LIN-31 leaves LIN-1 and promotes vulval fates, which PMID:9604932 offered only as a possibility and which endogenous 4T-to-A and 4T-to-E knock-ins (PMID:23995389, PMID:30544993) do not support for fate patterning; and a MISSING_STATEMENT (CONFIRMED) for the cki-1 quiescence and male spicule/Bgamma roles. A MISSING_STATEMENT (PROBABLE) is recorded on the UniProt FUNCTION text. The descriptions sidecar was scored and set COMPLETE.
