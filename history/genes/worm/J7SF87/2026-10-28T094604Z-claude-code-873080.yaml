  summary: 'Create review: J7SF87'
  details: |
    New review of the C. elegans sqrd-2 product Y9C9A.16b (UniProt J7SF87, unreviewed). All six GOA rows were reviewed: both mitochondrion rows accepted by subfamily membership and function (no presequence noted, no sub-compartment added); both sulfide:quinone oxidoreductase (GO:0070224) rows modified to the glutathione-dependent sibling GO:0106436, with suspected WRONG_TERM source defects; GO:0106436 accepted as core; FAD binding kept as non-core. A pairwise alignment to human SQOR (J7SF87-bioinformatics) shows both catalytic persulfide cysteines and the FAD motif are retained. No NEW process term was added because the only sqrd-2 genetics (no H2S sensitivity, early recovery) do not show the protein performing sulfide oxidation; manual literature notes replace deep research.
