  summary: 'Create review: worm cht-1'
  details: |
    Created the C. elegans cht-1 review as the GH18 endochitinase comparator for Brugia malayi MF1. Fetched the Q11174 UniProt and GOA scaffold, added the WormBase curated gene description, cached new PMID:21731485 and PMID:33691404 publication files, and recorded that Falcon plus Perplexity Lite deep research providers were unavailable. Reviewed all 14 GOA rows, accepting the chitinase activity, endochitinase activity and chitin catabolic process rows as core, refining the broad O-glycosyl hydrolase and carbohydrate metabolic process rows to specific child terms, keeping extracellular region and chitin binding as supported non-core context, and marking the Candida response and ATF6-mediated UPR expression rows as over-annotated. Cross-checked Q11174 against PTHR11177 PAINT and the BRUMA MF1 review, and found no PAINT IRD or IKR loss on the cht-1 lineage.
