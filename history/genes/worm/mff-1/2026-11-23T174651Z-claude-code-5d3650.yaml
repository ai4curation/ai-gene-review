  summary: Narrow the MFF-1 DRP-1-binding knowledge gap with an OpenScientist run
  details: |
    Ran OpenScientist (3 iterations) on whether MFF-1 keeps MFF Drp1-binding motifs. The tail anchor is retained, but there is only one degenerate N-terminal repeat (two in other metazoan MFFs), and no MFF-side DRP1-binding residues have been mapped by mutagenesis. Direct DRP-1 binding cannot be predicted from sequence, consistent with Mff-independent recruitment in worms. Gap OPEN -> NARROWING.
