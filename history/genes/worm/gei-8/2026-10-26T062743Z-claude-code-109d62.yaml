  summary: 'Create review: gei-8'
  details: |
    Created the first review of C. elegans gei-8 (P34333), the sole NCoR/SMRT nuclear receptor corepressor orthologue. Literature was compiled manually (no deep-research provider) from PMID:23484030, PMID:22078881, PMID:11922622 and PMID:31645584. Of the 5 GOA rows, chromatin, nucleus and regulation of transcription by RNA polymerase II were accepted, protein-containing complex was kept as non-core, and the bare protein-binding row (GEX-3 two-hybrid) was removed per the protein-binding policy. A NEW nuclear receptor binding annotation was added from the GST-NHR-60 pull-down. Core functions record transcription corepressor activity (inferred from orthology) and nuclear receptor binding.
