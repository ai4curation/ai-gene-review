  summary: 'Create review: unc-75'
  details: |
    Created the initial review of C. elegans unc-75 (UniProt G5EE68, CELF-family RRM protein). Read PMID:23468662 and PMID:24910101 in full (abstracts only for PMID:12906792 and PMID:7498734). All 20 GOA rows reviewed: accepted splicing regulation, ssRNA binding, nucleus and nuclear speck; modified generic nucleic-acid/RNA/mRNA binding rows to pre-mRNA intronic binding (GO:0097157) and mRNA metabolic process to regulation of alternative splicing; marked cytoplasm, splice site recognition, ribonucleoprotein complex, bare cholinergic synaptic transmission and regulation of neuron differentiation as over-annotated; kept positive regulation of cholinergic and GABAergic transmission as non-core; removed the inferred synapse location with a source_defects entry. Added a NEW IDA pre-mRNA intronic binding row from the EMSA data, and core functions for intronic RNA binding and neuron-specific alternative splicing regulation.
