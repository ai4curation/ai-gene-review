  summary: Record OpenScientist collagen acceptor-site negative and PDI-2 evidence-provenance
    corroboration
  details: |
    Ran an OpenScientist deep-research job (kgap-pdi2-collagen-substrates) touching two knowledge gaps on this gene.

    The collagen-substrate gap stays OPEN, with one approach now closed off. The run tested whether acceptor-site composition can nominate the likeliest dependents and showed that it cannot. Across 177 cuticle collagens and 3,807 canonical acceptor sites, density is 42.3 plus or minus 10.7 per 100 Gly-X-Y triplets, the distribution is unimodal and indistinguishable from normal, and there is not one outlier by either of two outlier tests. Collagens with published cuticle phenotypes span ranks 3 to 173 and are statistically inseparable from the rest, with no enrichment at any cutoff from the top 10 to the top 50. The failure generalises past proline counting: a 17-feature panel covering acceptor chemistry, helix-stability proxies and block architecture yields no discriminator surviving multiple-testing correction, with imino acid fraction and longest uninterrupted Gly-X-Y block essentially null. Sweeping the run-length definition leaves every statistic unchanged, closing the obvious methodological objection. The structural explanation is worth keeping: the Gly-X-Y repeat the hydroxylase recognises is the repeat that confers collagen family membership, so the acceptor count is near-constant by construction. This is the motif-counting failure mode the hypothesis anticipated, and it is the second time this session that a within-family motif scan has failed in the same way.

    The transglutaminase gap moved from OPEN to NARROWING. While tracing evidence, the run corroborated what this review already recorded: the protein-glutamine gamma-glutamyltransferase IDA row cites a paper about pdi-3. It adds supporting detail, that global alignment places PDI-2 closest to human P4HB at 57.4 per cent identity with an 18.7-point margin while PDI-3 is closest to PDIA3/ERp57 at 48.3 per cent, matching the ERp60 class the paper names in its title, and that across all of GO the only protein disulfide isomerases holding experimental-evidence GO:0003810 are the three C. elegans entries from that single paper.

    It also adds a tempering observation that I treated as decisive for how to act: the same single reference supplies the same term to pdi-1, pdi-2 and pdi-3 alike. Per the project's rules on claiming a wrong gene, a row made across a family from one paper is a reference-level curation practice rather than a slip, and is a reason to drop or soften an accusation rather than confirm it. So the row stays UNDECIDED with its existing SUSPECTED wrong-gene-product defect and requested change of CHECK; neither the confidence nor the requested change was raised, and the resolution remains to read the full text or re-assay the two proteins side by side.

    The collagen census and all its statistics, the 17-feature panel, the run-length sweep and the two alignment identities were not independently recomputed; human PDIA3 is not in this repository.
