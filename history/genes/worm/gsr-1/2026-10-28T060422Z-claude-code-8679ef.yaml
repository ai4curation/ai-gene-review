  summary: 'Create review: gsr-1'
  details: |
    De novo review of C. elegans gsr-1 (Q93379), the sole glutathione reductase. All 25 GOA rows reviewed against full texts of PMID:23593298 and PMID:27117030 and the abstract of PMID:21199936: GSSG reductase activity, cytosol, mitochondrion, glutathione metabolism, cell redox homeostasis and oxidative-stress response accepted; generic oxidoreductase terms and cytoplasm refined by MODIFY; response to superoxide generalized to cellular response to oxidative stress; ecdysis and oxidant detoxification kept as non-core. Added mitochondrial matrix (IC) for the GSR-1a isoform. Core functions split into cytosolic GSR-1b (essential) and mitochondrial GSR-1a. Manual literature notes written as no deep-research provider was available.
