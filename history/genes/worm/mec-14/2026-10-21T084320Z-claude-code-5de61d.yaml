  summary: 'Create review: mec-14'
  details: |
    De-novo review of mec-14 (Q20127), done independently of ProtNLM2 predictions as the reference relative of fly CG18547. Falcon and perplexity-lite deep research failed (Edison 403 auth), so literature was gathered directly (PMID:8692859, PMID:2646709, PMID:34875684). New bioinformatics (mec-14-bioinformatics/): PANTHER 19 tree placement confirms Ecdysozoa node PTN000199440 with fly CG18547/CG3397/CG12224 and Opisthokont node PTN000199433 with yeast ARA2, and no vertebrate member; PAINT places substrate-specific activities only on fungal and land-plant nodes; AKR catalytic tetrad D132/Y137/K163/H206 conserved. Actions: oxidoreductase activity IBA/IEA ACCEPT; L-galactose dehydrogenase IEA REMOVE (PAINT confined it to land plants; substrate varies in SF1); touch-detection IGI ACCEPT as the only experimentally established (genetic) function; mechanosensory behavior and positive-regulation IGI rows KEEP_AS_NON_CORE.
