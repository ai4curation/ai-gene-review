  details: |
    Created the first review of C. elegans rheb-1 (P34443). All 12 GOA rows (IBA/IEA/ISS) reviewed: GTPase activity, GTP binding, kinase activator activity, small GTPase signalling and positive regulation of TORC1 signaling accepted; signal transduction, membrane and positive regulation of TOR signaling modified to more specific terms; plasma membrane rows marked over-annotated because endogenous CRISPR-tagged RHEB-1 colocalizes with lysosomal membrane markers (PMID:32041790). Added a NEW lysosomal membrane IDA row. Core function: lysosomal Rheb GTPase activating TORC1, supported by the GTP-locked rheb-1 transgene in PMID:23705068. Literature compiled manually (no deep-research provider).
