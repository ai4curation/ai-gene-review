  details: |
    New full review written independently of ProtNLM2 output. All 13 GOA rows got an action. UDP and GDP phosphatase activity (IDA from PMID:15102851 and IBA from PTN008981015) were accepted as core. The IBA node spans the SF127 subfamily (fly NTPase, uda-1) and the SF35/SF99 subfamilies (ENTPD5/ENTPD6). NDP phosphatase (IEA) was modified to the two specific activities, because UniProt curation says UDP and GDP are the only substrates. Hydrolase activity was marked TOO_GENERAL. The UDP and GDP metabolic process IDA rows were modified to the catabolic child terms, and the UDP catabolic process IBA was accepted. Protein N-linked glycosylation (IBA, mouse Entpd5 donor) was kept as non-core: it is inferred from ENTPD5 (PMID:21074248) and only hypothesised for worm. Cytoplasm (IBA) was modified to endomembrane system. Cytoplasmic vesicle membrane (IDA) and endomembrane system (IEA) were accepted, with the note that localisation comes from expression in yeast. No NEW terms were proposed. Deep research failed for both falcon (auth 403) and perplexity-lite (quota 401), and this is recorded in the notes.
