  details: |
    New review of HRDE-1/WAGO-9 (Q09249), the germline nuclear WAGO Argonaute. All 17 GOA annotations were reviewed against PMID:22810588, PMID:22738725, PMID:22738726 and PMID:37083324. The slicer RNA endonuclease IBA was removed: the WAGO clade has lost the DEDH tetrad, which a local AGO2 alignment confirmed (hrde-1-bioinformatics). miRNA binding was changed to siRNA binding, RISC to RNAi effector complex, and post-transcriptional silencing to ncRNA-mediated heterochromatin formation. Core function: siRNA binding guiding NRDE-pathway H3K9me3 in germ-cell nuclei. Deep research failed (falcon timeout).
