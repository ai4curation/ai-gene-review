  details: |
    De novo review of C. elegans asd-1 (G5EEW7), an RBFOX-family RRM splicing regulator. Fetched by accession because the gene-name UniProt search timed out. Reviewed all 13 GOA rows from the primary literature (full text of PMID:23468662, PMID:29121637 and PMID:26430555; abstracts of the others). ACCEPTED regulation of alternative mRNA splicing, nucleus and single-stranded RNA binding. MODIFIED nucleic acid binding, RNA binding and mRNA binding to pre-mRNA intronic binding, added as a NEW IDA row from the unc-32 intron 7b EMSA. REMOVED the two bare protein-binding IPI rows with SUP-12 under the protein-binding policy. Kept cytoplasm as non-core and marked nervous system development as over-annotated. No new process terms were proposed. Wrote a manual literature synthesis and notes, because no deep-research provider was available.
