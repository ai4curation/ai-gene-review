  details: |
    New review of C. elegans SMA-4 (P45897), the co-Smad of the DBL-1/BMP-like Sma/Mab pathway. All 37 GOA annotations were reviewed: 18 ACCEPT, 10 KEEP_AS_NON_CORE, 7 UNDECIDED (parturition, lifespan and dauer rows backed by abstract-only papers whose abstracts do not describe them; the abstract of PMID:9847239 states that sma-4 mutants are not Daf-c) and 2 MARK_AS_OVER_ANNOTATED (IBA I-SMAD binding; positive regulation of protein catabolic process). Core function: GO:0000981 DNA-binding TF activity in BMP signaling and body growth, in a heteromeric SMAD complex.
