  summary: 'Create review: gsto-1'
  details: |
    Created the review of C. elegans gsto-1 (P34345), an intestinal Omega-class GST. All 17 seeded GOA rows were reviewed: DHA reductase activity (GO:0045174), cytoplasm and cellular oxidant detoxification accepted as core; glutathione transferase activity kept as non-core because the authors report minimal CDNB activity; stress-response processes kept as non-core; methylarsonate reductase (EXP, IEA) and detoxification of inorganic compound left UNDECIDED because the cited full text was unavailable and a later RNAi screen showed no arsenite phenotype, with a CHECK source defect filed against UniProt's ECO:0000269 attribution. No NEW terms were proposed. Manual literature notes were written in place of deep research.
