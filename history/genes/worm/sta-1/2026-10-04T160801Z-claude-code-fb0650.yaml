  details: |
    Completed the C. elegans sta-1 (Q9NAD6) review: all 25 GOA annotations reviewed (15 ACCEPT, 1 KEEP_AS_NON_CORE, 6 MODIFY, 1 MARK_AS_OVER_ANNOTATED, 2 REMOVE) plus 2 NEW (GO:0001227 DNA-binding transcription repressor activity, RNA polymerase II-specific; GO:0000122) from PMID:28874466. GO:0007259 JAK-STAT IBA (PTN000927860) REMOVED as lineage-inappropriate (no JAK in C. elegans, PMID:28874466) with propagation_review PROPAGATION_BAD/LINEAGE_OR_TAXON_MISMATCH, consistent with sta-2. Defense response IBA MODIFY to GO:0050687; five dauer larval development IMP/IGI rows MODIFY to GO:0061067; proliferation IBA marked over-annotated; Y2H protein binding removed. Core functions: STA-1 Pol II repressor in negative regulation of antiviral defense (nucleus); TF activity in negative regulation of dauer development. Notes file written with provenance. Validated with just validate worm sta-1 (clean); module c_elegans_jak_independent_stat_signaling no longer warns FUNCTION_UNREVIEWED for STA-1 GO:0001227.
