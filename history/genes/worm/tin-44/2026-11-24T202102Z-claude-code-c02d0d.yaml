  summary: Narrow the TIN-44 activity gap with an OpenScientist Tim44 structural analysis
  details: |
    Ran OpenScientist (3 iterations) on TIN-44. Full-length Tim44 family (Pfam PF04280, TIGR00984, PIRSF037871 in local record); C-terminal domain superposes on human 2CW9 and yeast 2FXT (~1.1-1.5 A) with hydrophobic cavity and strongly amphipathic A1/A2 membrane-recognition helix: inner-membrane binding predicted. N-terminal mtHsp70/Tim23-contacting region disordered and interface not conserved above background (also in human), so tethering unassessable. Gap OPEN -> NARROWING; run reference UNVERIFIED.
