  summary: 'Create review: fath-1'
  details: |
    Initial review of C. elegans fath-1 (C25A1.5, Q9XVS0), the sole FA2H/Scs7 ortholog. Accepted fatty acid 2-hydroxylase activity (IBA, IEA), ceramide biosynthetic process (IBA), ER (IBA, root-organelle policy) and ER membrane (IEA); modified lipid metabolic process to fatty acid metabolic process plus ceramide biosynthetic process, and membrane to ER membrane; removed bare protein binding (DAF-3 Y2H) under the protein-binding policy. Evidence from full texts of PMID:30184537 (stereospecific (R)-2-OH fatty acid rescue), PMID:23705068 and PMID:21926990 (GlcCer pathway epistasis; hydroxylated GlcCer). No NEW terms: phenotype-only process evidence was not used. Manual literature notes written as no deep-research provider was available.
