    De novo review of C. elegans pdha-1 (P52899), the PDH E1 alpha subunit. All 9 GOA rows reviewed: 8 ACCEPT (IBA/IEA E1 activity, pyruvate decarboxylation to acetyl-CoA, mitochondrial matrix, PDH complex, HDA mitochondrion) and 1 MODIFY (InterPro2GO GO:0016624 refined to GO:0004739). Core function records contributes_to GO:0004739 because the ThDP site is shared with the beta subunit; WRONG_QUALIFIER source defects were recorded on the two enables rows. Manual literature summary written from cached RNAi papers (PMIDs 15340492, 21533078, 24445252, 42844987, 30586284); no new process terms were proposed from phenotype data.
