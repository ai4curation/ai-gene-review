  details: |
    IBA over-annotation re-review 2026-11-24 (batch N09). GO:0007276 gamete generation and GO:0030154 cell differentiation moved from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE. The earlier reasons treated the terms as Vasa-clade functions. The IBD node PTN002774652 (107 leaves) is seeded in both child clades, and MUT-14 is in the DDX3/Belle clade PTN002774722 with seeds worm VBH-1 (IMP germ cell development, PMID:17868112, same 7-leaf nematode clade PTN002774787 as MUT-14), fly belle (IMP, PMID:15572142) and mouse D1Pas1 (IMP, PMID:27473657). Nothing on MUT-14 argues against the terms. GO:0005634 nucleus was re-judged and left as MARK_AS_OVER_ANNOTATED (localization studies place MUT-14 in perinuclear Mutator foci).
