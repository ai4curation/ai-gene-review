  summary: 'Create review: unc-51'
  details: |
    New review of unc-51 (Q23023, Swiss-Prot), the C. elegans Atg1/ULK1 kinase. All 55 GOA rows reviewed. Kinase activity (IDA/IBA/ISS) and autophagosome assembly were accepted as core. Axon guidance and axon outgrowth were also accepted as core: they form a separate neuronal kinase role (UNC-14/VAB-8 substrates, UNC-5 localization). The five generic protein binding IPI rows were removed. The obsolete GO:0034045 and the generic Ser/Thr kinase complex were modified to GO:0000407 and GO:1990316. Piecemeal microautophagy of the nucleus was marked as over-annotated. Developmental and organismal phenotypes were kept as non-core. Deep research was not available (falcon failed).
