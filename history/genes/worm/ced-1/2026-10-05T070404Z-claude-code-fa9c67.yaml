  summary: Create ced-1 gene review
  details: |
    Reviewed all 48 GOA annotations for C. elegans ced-1 (CED-1 engulfment receptor). Core: scavenger receptor activity in recognition/engulfment of apoptotic cells; signaling receptor activity through CED-6/DYN-1 driving phagolysosome assembly. MODIFY: protein binding (CED-6 -> signaling receptor activity; TTR-52 -> scavenger receptor activity), positive regulation of engulfment -> engulfment, apoptotic process involved in development -> positive regulation (Reddien 2001). Over-annotations from the Wnt paper (spindle, L/R axis, DTC migration) per its own text. Apoptosis rows sourced from papers that used ced-1 only as a background genotype are documented in the APOPTOSIS readout page.
