  details: |
    IBA REMOVE re-review of 2026-11-21 (projects/IBA_REVIEW/rereview-2026-11-21, batch N05), judged against the PANTHER tree and PAINT IBD nodes with treeview.py and QuickGO seed lookups by GO id. GO:0005112 Notch binding (IBD at PTN002371879, 415 leaves of PTHR24044, 17 seeds) and GO:0045746 negative regulation of Notch signaling pathway (IBD at PTN001170801, 82 leaves, seeds rat Dll3 and mouse Dll4 in child PTN007764856): both REMOVEs upheld. The PAINT tree places LIN-12 with C. briggsae GLP-1 (node PTN007764842) inside the bilaterian Delta clade PTN001170801; the earlier reasons attributed the propagation to PTHR24049:SF22 and APX-1, which is UniProt's cross-reference and not the tree the IBA comes from, and the Notch binding reason also argued from absence of LIN-12 binding data. Both reasons (and the Notch binding summary) were rewritten to state the tree placement and the missing DSL domain. Action unchanged. Validated with just validate.
