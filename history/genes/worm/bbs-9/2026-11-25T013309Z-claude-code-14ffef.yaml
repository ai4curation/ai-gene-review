  summary: Narrow the BBS-9 scaffold gap with an OpenScientist BBSome interface analysis
  details: |
    Ran OpenScientist (3 iterations) on BBS-9. In bovine BBSome 6VBU/6VBV, BBS9 buries large interfaces with BBS5, BBS8, BBS1, BBS2 and BBS7 and none with ARL6; 139 interface positions transferred to the worm protein. BBS-1 contact already supported in C. elegans, BBS2 by cross-linking. Membrane/cargo half refuted: BBS9 is the subunit most depleted from the membrane-proximal surface, its membrane-facing potential is negative, and it contributes no residues to the acidic cargo cleft (BBS2/BBS7). Intra-complex scaffold predicted. Ontology half of the gap untouched. Gap OPEN -> NARROWING; run reference UNVERIFIED.
