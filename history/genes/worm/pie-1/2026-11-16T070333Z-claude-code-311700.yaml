  summary: New pie-1 review using the WormBase description as a recall checklist
  details: |
    Created the pie-1 (Q94131) review from GOA (36 rows), UniProt, the WormBase curated description and a manual literature search (automated deep research unavailable; queries in pie-1-notes.md). Core functions: nuclear repression of Pol II transcription in germline blastomeres and oocytes (P-TEFb/cyclin T binding plus a Ser5 mechanism), and a cytoplasmic RNA-binding function promoting mom-2 and nos-2 expression. IBA TTP-family repressor/deadenylation rows marked over-annotated; ARE binding generalised to mRNA 3'-UTR binding; CIT-1.1 protein binding modified to cyclin binding; other protein-binding rows removed. NEW: positive regulation of translation (PMID:24131629) and nucleolus (oocytes, PMID:37478128). Source defects: two UniProt CC FUNCTION WRONG_STATEMENTs (HDA-1 inhibition inverts PMID:34003111; P-TEFb sentence) and one WormBase MISSING_STATEMENT (cytoplasmic nos-2/mom-2 function). Scored the descriptions sidecar (status COMPLETE).
