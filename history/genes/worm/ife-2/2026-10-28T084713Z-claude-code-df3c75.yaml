    New review of C. elegans ife-2 (Q21693), the major somatic eIF4E isoform. All 34 GOA rows reviewed. Cap-binding (m7G and TMG), translation initiation factor activity, translational initiation, cytoplasm and eIF4F complex accepted as core; RNA binding refined to the two cap-binding terms; positive regulation of translation modified to translational initiation with a suspected WRONG_TERM source defect; lifespan, embryo development and stress granule rows kept as non-core; negative regulation of response to oxidative stress marked over-annotated; bare protein binding removed. Literature compiled manually (no deep-research API), including PMID:23705068, PMID:20530576 and PMID:30282029; no NEW terms proposed.
