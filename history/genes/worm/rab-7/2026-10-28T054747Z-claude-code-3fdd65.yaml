    De novo review of C. elegans rab-7 (Q23146, unreviewed TrEMBL) covering all 27 GOA rows. GTPase activity, GTP binding, late endosome/lysosome/phagosome locations, endosome to lysosome transport, phagosome-lysosome fusion and phagolysosome assembly in apoptotic cell clearance were accepted from cached full-text and abstract evidence. RNAi-based oocyte growth and body morphogenesis rows were marked over-annotated; endosomal transport, organelle membrane, organelle fusion and positive regulation of early-to-late endosome transport were modified to more specific participation or location terms. No NEW terms were added. A manual literature summary replaced provider deep research, which was unavailable.
