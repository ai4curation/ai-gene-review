  summary: New egl-44 review (TEAD) using the WormBase description as a recall checklist
  details: |
    New review of C. elegans egl-44 (Q19849), the single TEAD transcription factor. Automated deep research was unavailable (no provider keys); the literature was searched by hand (PubMed E-utilities and web search, queries recorded in egl-44-notes.md) and 10 extra papers were cached, including the Hippo-pathway papers PMID:31358532, PMID:41746831, PMID:32857822 and PMID:40178516. Most GOA papers are abstract-only; the PMC full text of PMID:30291162 and the Development page of PMID:23946438 were read only through a summarising web-fetch tool, and nothing from them is quoted. All 30 GOA rows reviewed: 20 ACCEPT, 7 MODIFY, 2 MARK_AS_OVER_ANNOTATED, 1 KEEP_AS_NON_CORE, no NEW rows. MODIFY: the three GO:0006355 rows to directional or Pol II-specific children, GO:0045893 to GO:0045944, GO:0010468 to GO:0010628, GO:0106027 to GO:0140059, and GO:0031536 positive regulation of exit from mitosis to GO:0007406 negative regulation of neuroblast proliferation (with a PROBABLE WRONG_TERM source defect for UniProt, because the Q-lineage defect is an extra division, not a mitotic-exit defect). Over-annotated: GO:0048568 embryonic organ development (IBA seeded by mouse Tead1/Tead4) and GO:0055059 asymmetric neuroblast division (the paper assigns asymmetry to HAM-1). Two core functions: Pol II DNA-binding transcription factor activity as a repressor with EGL-46 in neuron differentiation, and transcription coactivator (YAP-1) binding in hippo signaling. The WormBase reference is UNVERIFIED (the TEAD-reporter claim could not be read) with two CONFIRMED MISSING_STATEMENT defects (Hippo-pathway roles; the EGL-46 complex and its Q-lineage, HOB and PVD roles); the UniProt reference is UNVERIFIED with one CONFIRMED MISSING_STATEMENT defect (Hippo-pathway roles). Descriptions sidecar scored and set COMPLETE.
