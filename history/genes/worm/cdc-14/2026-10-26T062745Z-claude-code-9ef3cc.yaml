  summary: 'Create review: cdc-14'
  details: |
    Created the cdc-14 (P81299) review from all 44 GOA rows, with literature research done by hand (no deep-research provider). The core function is a CDC14-family Ser/Thr phosphatase that maintains developmental G1 quiescence upstream of CKI-1 and in parallel with LIN-35 (PMID:15247923, PMID:21723944). The RNAi-based cytokinesis, central spindle, polar body and microtubule IMP rows (PMID:12213836) were removed because null alleles contradict them, and the inherited fungal mitotic-exit and cytokinesis IBA rows were marked over-annotated. Spindle, midbody and centrosome localizations were kept as non-core. No NEW terms were proposed.
