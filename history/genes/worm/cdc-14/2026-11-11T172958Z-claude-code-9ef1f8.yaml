    - GO:0032467 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the seeds are 2 one-to-one orthologs of cdc-14 whose common ancestor is a speciation node at Ascomycota, 4 steps below the PAINT node, and cdc-14 is outside that clade; the evidence is fungal only, which is compatible with the verdict, though the verdict rests on worm null-allele data.

