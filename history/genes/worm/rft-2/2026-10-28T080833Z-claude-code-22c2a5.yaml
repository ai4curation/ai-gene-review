  summary: 'Create review: rft-2'
  details: |
    Created the rft-2 (G4SDH4) review. Seven GOA rows for riboflavin transmembrane transporter activity, riboflavin transport and plasma membrane (IDA, IBA, IEA) were accepted on the basis of heterologous riboflavin uptake by rft-2 in ARPE-19 cells (PMID:23483992) and SLC52 family membership. The HEP row for IRE1-mediated unfolded protein response (PMID:16184190) was marked as over-annotated because UPR-dependent expression does not show participation. Core function is riboflavin uptake at the plasma membrane; no NEW terms were proposed. A manual literature summary and notes were added because no deep-research provider was available.
