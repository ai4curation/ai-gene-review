  summary: 'Re-review of over-annotated IBA: membrane kept as non-core'
  details: |
    IBA over-annotation re-review 2026-11-24 (batch N09). GO:0016020 membrane moved from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE. The IBD at PTN000795297 (39 leaves) has three seeds with experimental membrane locations: human BBS2 ciliary membrane IDA PMID:19081074, mouse Bbs2 membrane IDA PMID:22139371, Trypanosoma brucei ortholog ciliary pocket membrane and clathrin-coated endocytic vesicle membrane IPI PMID:26721397. Human and mouse seeds are in the same 33-leaf animal clade PTN001286745 as BBS-2. The earlier reason (too broad to be informative, transient association) is not a ground for an over-annotation call; the term is true and as specific as the seeds allow, and no other row entails it.
