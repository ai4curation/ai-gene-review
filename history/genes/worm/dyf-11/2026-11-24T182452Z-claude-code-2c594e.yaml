  summary: Narrow the DYF-11 function gap with an OpenScientist CH-domain and interface
    analysis; correct gap wording
  details: |
    Ran OpenScientist (3 iterations) on DYF-11/IFT54. N-terminal NN-CH domain (3-111, Pfam PF10243 in local record) superposes on mouse 5FMU and human 8KCQ at ~1.2-1.3 A and keeps the conserved basic tubulin-binding core (K16, R26, K30, K62, K65, K85, K88; checked locally). IFT train cryo-EM (8BD7, 8RUY) shows extensive IFT54-IFT20 contact (DYF-11 ~424-528) and essentially none with IFT57. Corrected gap statement that wrongly said it had only a C-terminal coiled coil. Gap OPEN -> NARROWING; run reference UNVERIFIED.
