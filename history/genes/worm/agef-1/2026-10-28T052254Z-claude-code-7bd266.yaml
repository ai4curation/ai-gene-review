  summary: 'Create review: agef-1'
  details: |
    De novo review of C. elegans agef-1 (UniProt G5EFH7), the BIG1/BIG2/Sec7p-subfamily Arf GEF. All 8 GOA rows (IBA/IEA only) were reviewed against full text of PMID:23840591, PMID:25329472 and PMID:42312793, plus PMID:42388253 and abstract-only PMID:22446376 and PMID:16672374. GEF activity, trans-Golgi network, Golgi apparatus and regulation of ARF signal transduction were accepted. Membrane was modified to trans-Golgi network membrane and vesicle-mediated transport to Golgi to plasma membrane transport. Perinuclear region was marked over-annotated because the worm Golgi is dispersed mini-stacks. No NEW rows were proposed under the strict participation bar. A manual literature file replaces deep research.
