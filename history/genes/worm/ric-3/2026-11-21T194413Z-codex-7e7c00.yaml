  summary: Create worm ric-3 review
  details: |
    Created the C. elegans ric-3/Q22472 gene review for the nematode levamisole-sensitive nAChR expression-factor lane. The review accepts RIC-3 as an ER-membrane nAChR maturation factor with protein-folding chaperone activity, keeps nAChR surface-localization and positive cholinergic-transmission regulation as core processes, marks muscle contraction, neuronal cell body, and weak neuron-process localization as non-core outputs or locations, and records over-annotation judgements for neuron-projection active-in and synapse localization rows.
