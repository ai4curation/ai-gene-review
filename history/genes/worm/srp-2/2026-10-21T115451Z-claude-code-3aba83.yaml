  summary: 'Create review: srp-2 (reference relative for C28G1.2)'
  details: |
    De-novo review of C. elegans SRP-2, independent of ProtNLM2 predictions; reference relative (paralog, PTHR11461 PAINT seed for GO:0004867 at PTN002479231) for worm/C28G1.2. Deep research failed (falcon 403 auth; perplexity-lite fallback failed), so built from primary literature (PMID:14739286, PMID:25786854, PMID:21683259, PMID:23335331). Accepted IDA/IEA serine-type and IDA cysteine-type endopeptidase inhibitor activity (cross-class activity noted as SRP-2-specific, not PAINT-propagated). Removed IBA/IEA extracellular region: SRP-2 lacks a signal peptide, is cytosolic and not secreted (PMID:25786854); added propagation_review on root node PTN000156123. Added NEW cytosol (IDA, PMID:25786854). No process terms added from the overexpression larval-arrest phenotype.
