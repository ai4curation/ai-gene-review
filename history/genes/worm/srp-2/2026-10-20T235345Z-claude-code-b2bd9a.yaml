  summary: 'Create review: srp-2'
  details: |
    De-novo review of C. elegans SRP-2 (O17365) as the characterised clade-L paralog reference for C28G1.2. Deep research failed (falcon 403 auth, perplexity-lite quota); review based on cached PMID:14739286 (abstract) and PMID:25786854 (full text) plus PTHR11461 PAINT data. Accepted both IDA inhibitor activities (serine-type via granzyme B, cysteine-type via cathepsins K/L/S/V; in vitro, mammalian enzymes) and the matching IEA. Removed extracellular region IBA (root PTN000156123) and IEA because SRP-2 is experimentally cytosolic and non-secreted; added NEW cytosol IDA from PMID:25786854. No process terms proposed: overexpression larval arrest is not participation. Noted PAINT propagated GO:0004867 but not GO:0004869 from srp-2 to clade-L node PTN002479231.
