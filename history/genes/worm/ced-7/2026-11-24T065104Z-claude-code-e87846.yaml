  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N07). GO:0005319 lipid carrier activity moved from MARK_AS_OVER_ANNOTATED to ACCEPT. The earlier reason was that the term describes soluble lipid-transfer proteins and not ABCA transporters. In GO, GO:0140326 ATPase-coupled intramembrane lipid carrier activity is_a GO:0140303 is_a GO:0005319, and the 11 mammalian ABCA seeds of the IBD at PTN000442469 carry experimental rows on those descendants. CED-7 is inside the seeded ABCA clade (joins ABCA1 at PTN008362549). No PAINT change.
