  summary: 'Create review: bir-1'
  details: |
    New review of C. elegans bir-1 (G5EFA2), the Survivin-like targeting subunit of the chromosomal passenger complex. All 30 GOA rows reviewed against PMID:12707312 and PMID:12682297 (full text), PMID:10983970, PMID:10209096 and PMID:17116281 (abstracts). CPC membership, mitotic cytokinesis and spindle midzone assembly accepted; chromosome, spindle and segregation rows refined to condensed nuclear chromosome, mitotic/meiotic spindle midzone and mitotic/meiotic segregation, consistent with csc-1 and icp-1; ComplexPortal SAC and sister-chromatid-separation rows and larval RNAi phenotypes (egg laying, growth, DTC migration) marked over-annotated; the IBA for negative regulation of apoptotic process removed as contradicted by PMID:10209096, with a missing-NOT source defect recorded. Manual deep-research and notes files written.
