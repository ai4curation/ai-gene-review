  summary: 'Create review: rho-1'
  details: |
    New review of C. elegans rho-1 (Q22038), the sole RhoA ortholog. All 35 GOA rows reviewed using cached literature (full text for PMID:16391233, 18801371, 22363657, 21387015, 28085666) and a manual literature synthesis. Core functions: G protein activity at the plasma membrane/cortex driving actomyosin contractility (contractile ring assembly, regulation of actin cytoskeleton organization, Rho protein signal transduction), and presynaptic DGK-1 binding promoting acetylcholine release. GTPase activating protein binding (RHGF-2 is a GEF) removed and protein kinase binding (DGK-1 is a lipid kinase) modified to kinase binding, both with source_defects; cytosol is_active_in IBA marked over-annotated; signal transduction refined to Rho protein signal transduction; bare protein binding removed.
