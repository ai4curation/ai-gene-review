  summary: New review of C. elegans ndx-4 (Ap4A hydrolase)
  details: |
    De novo review of all 17 GOA rows. Accepted asymmetrical Ap4A hydrolase activity (IBA, 2x IDA), the parent IEA, and diadenosine tetraphosphate catabolic process. Marked AMP/ADP/ATP biosynthetic process and ribose phosphate metabolic process as over-annotated (product-based inferences from a catabolic enzyme or an in vitro screen). Kept PRPP pyrophosphatase activity as non-core. Removed TAS apoptotic process (speculative statement in a structure paper). MODIFY generic hydrolase activity to GO:0004081. Cached publications are abstract-only.
