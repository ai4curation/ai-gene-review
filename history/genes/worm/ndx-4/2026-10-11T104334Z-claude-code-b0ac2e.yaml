  summary: 'Update ndx-4: add 8-oxo-dGTP pyrophosphatase activity and in vivo data'
  details: |
    Added three papers missed by the first review and by OpenScientist deep research (PMID:21111690, PMID:24435662, PMID:24347047). Full text of PMID:21111690 read from a curator-supplied PDF (paywalled; verbatim excerpts and Table 1 kinetics in ndx-4-notes.md). NEW non-core MF GO:0035539 (IDA, PMID:21111690): 8-oxo-dGTP to 8-oxo-dGMP + PPi (and 8-oxo-dGDP + Pi), kcat/Km about 660-fold below Ap4A, about 2-fold over dGTP; activity reduced in ndx-4 mutant worm extracts. Ap4A hydrolase kept as core. No process term proposed. Corrected the description, which had said no in vivo phenotype was reported. Ran a focused OpenScientist hypothesis job (ndx-4-hypotheses/ndx-4-8oxo-dgtp-sanitiser); verdict partially supported; its DNA repair lead and its reading of PMID:11937063 were rejected after checking primary data; pocket residues re-derived from PDB 1KTG.
