  summary: 'Create review: worm glc-1'
  details: |
    Created the C. elegans glc-1 review for the GluCl/ivermectin anthelmintic-target lane. Reviewed all 25 seeded GOA rows for G5EBR3, accepted or refined the core extracellularly glutamate-gated chloride-channel, chloride-transport and plasma-membrane assertions, retained locomotory behavior and homomeric self-association as non-core/contextual, removed the excitatory-postsynaptic-potential inference and modified the excitatory-channel PAINT row to inhibitory extracellular ligand-gated channel activity, marked postsynaptic membrane as over-annotated pending native C. elegans localization, and added notes resolving the avr-14/avr-15 IGI partners through Alliance. Followed PR review by modeling GLC-1 as contributing to heteromeric extracellularly glutamate-gated chloride-channel activity, recording a GO:0005234 parentage change request, grounding the IGI rows in Dent et al. 2000 rather than WormBase prose, adding the Ghosh et al. 2012 natural glc-1 deletion paper, and documenting an unavailable deep-research provider.
