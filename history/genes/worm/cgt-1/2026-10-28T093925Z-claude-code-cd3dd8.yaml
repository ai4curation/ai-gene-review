  details: |
    Created the first review of C. elegans cgt-1 (O18037), a ceramide glucosyltransferase. All 14 GOA rows reviewed: ceramide glucosyltransferase activity, glucosylceramide biosynthesis and membrane accepted as core; glycosyltransferase activity and sphingolipid metabolic process modified to the specific terms; nematode larval development kept as non-core; regulation of protein localization to basolateral plasma membrane marked as over-annotated (suppression of an sgk-1 phenotype only). A suspected wrong-reference source defect was recorded for the IGI glucosylceramide row from PMID:26115433. Manual deep research and notes were written from cached literature, including full text of PMID:23705068 and PMID:26115433.
