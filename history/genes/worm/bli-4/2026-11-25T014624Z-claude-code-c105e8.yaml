- type: EDIT
  outcome: changed
  summary: Record OpenScientist findings on BLI-4 furin-type specificity and collagen
    cleavage sites
  details: |
    Ran an OpenScientist deep-research job (kgap-bli4-collagen-cleavage-sites) on the knowledge gap covering direct BLI-4 cleavage of cuticle collagens. The run confirms BLI-4 has the full furin-type S1/S4 determinants (Asp305, Asp348, Asp353; Glu283, Trp301, Asp311) and catalytic Ser415, and that its propeptide ends at an RVKR autoprocessing site at 113-116; all of these were checked against the local BLI-4 UniProt record. Furin-type R-X-X-R sites are enriched 5.5-fold in the disordered N-terminal non-collagenous region of cuticle collagens and present in 15 of 16. The gap was kept OPEN because the motif scan has no discriminating power within the collagen family and ranks the experimentally validated SQT-3 site only 14th of 25, so it cannot nominate direct substrates. Also recorded that SQT-3 is cut at its C terminus by the unrelated astacin DPY-31, so any BLI-4/SQT-3 statement must specify the N terminus.
