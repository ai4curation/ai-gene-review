    Initial review of C. elegans csc-1 (O45952), a Borealin-family targeting subunit of the chromosomal passenger complex. Read the full text of PMID:12707312 and PMID:21110867; PubMed found no further CSC-1-specific papers. Reviewed all 24 GOA rows: accepted CPC membership, chromosome and spindle-midzone locations, metaphase alignment, meiotic chromosome segregation and mitotic cytokinesis; modified mitotic cell cycle, poleward chromosome movement, spindle, microtubule cytoskeleton and condensed chromosome to the specific supported terms; marked the ComplexPortal spindle-checkpoint and sister-chromatid-separation statements as over-annotated; removed four Y2H protein-binding rows under policy. No NEW annotations; no molecular function asserted after a comparator check on human Borealin.
