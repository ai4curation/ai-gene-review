  summary: 'Create review: mpz-1'
  details: |
    Created the first review of C. elegans mpz-1 (G5ECZ8), a MUPP1/PATJ-family multi-PDZ scaffold. All 8 GOA rows were reviewed. Three Y2H protein-binding rows were removed under the protein-binding policy. GTPase activating protein binding (IPI, WormBase) was removed and recorded as a WRONG_TERM source defect because the partner RHGF-2 is a RhoGEF, not a GAP (PMID:22363657 full text). Axon (IDA) was accepted. Membrane (IEA/ARBA) and the two Complex Portal NAS rows for the ARR-1/MPZ-1/DAF-18 complex were kept as non-core. Two NEW rows were added from PMID:16890216: G protein-coupled serotonin receptor binding (IPI, SER-1 at PDZ10) and synapse (IDA). No NEW process terms were proposed. Literature was compiled manually in mpz-1-deep-research-manual.md.
