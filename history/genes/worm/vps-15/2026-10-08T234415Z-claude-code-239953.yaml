  summary: 'Create review: vps-15'
  details: |
    New review of vps-15 (Q23669, full-length ZK930.1a, chosen over the 445-aa WD40 fragment E9P864), the C. elegans VPS15/PIK3R4. All 16 GOA rows reviewed; none had a PMID. The kinase/transferase activity rows were removed because VPS15 is a GTP-binding pseudokinase (PMID:39913640). This matches the human PIK3R4 review and a new gatekeeper-conservation check in vps-15-bioinformatics. ATP binding and the nucleus-vacuole junction were marked as over-annotated. PI3KC3-C1/C2 membership, macroautophagy and endosome-to-vacuole transport were accepted. Core functions contribute to 1-phosphatidylinositol-3-kinase activity. Deep research was not available.
