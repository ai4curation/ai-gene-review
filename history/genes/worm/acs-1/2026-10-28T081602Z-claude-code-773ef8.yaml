  summary: 'Create review: acs-1'
  details: |
    New review of C. elegans acs-1 (Q5TKA3), an ACSF2-subfamily acyl-CoA synthetase required for monomethyl branched-chain fatty acid (C15ISO/C17ISO) synthesis and for incorporating C17ISO into phospholipids. The single GOA row (IEA GO:0031956 medium-chain fatty acid-CoA ligase activity, from an ARBA-derived EC 6.2.1.2) was modified to GO:0120515 fatty acid-CoA ligase activity, because no substrate assay exists and the genetically implicated substrates are iso-branched C13-C17 fatty acids. Core function: fatty acid-CoA ligase activity in methyl-branched fatty acid biosynthesis. No NEW rows were added. Manual literature notes were written because no deep-research provider was available.
