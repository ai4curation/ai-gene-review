  summary: 'Create review: gst-32'
  details: |
    New review of C. elegans gst-32 (Y53F4B.37, UniProtKB Q9NA96, TrEMBL). Five GOA rows reviewed: glutathione transferase activity (IBA, IEA) and glutathione metabolic process (IBA) accepted from family evidence (GST N/C domains, sigma-like CDD hits, N-terminal catalytic-tyrosine motif); cytoplasm (IEA) accepted for a soluble GST. The WormBase IMP to response to reactive oxygen species (PMID:23593298) was modified to response to arsenic-containing substance, because gst-32 RNAi reduced survival on arsenite but not on juglone in that screen; recorded as a WRONG_TERM source defect. Manual literature notes added because no deep-research provider was available; no NEW terms proposed.
