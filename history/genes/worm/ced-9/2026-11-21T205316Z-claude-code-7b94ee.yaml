  details: |
    Re-review of three IBA rows against the PTHR11256 tree (projects/IBA_REVIEW/rereview-2026-11-21, batch 05). GO:0015267 channel activity: the root IBD at PTN000135648 is seeded by human BCL2, BAX and BAK1 in three child clades, and CED-9 shares the child clade PTN000883460 with the BCL2 seed. The earlier REMOVE rested on the absence of CED-9 data, which is not a ground for removing an IBA, and no evidence of loss was found, so the action was changed to MARK_AS_OVER_ANNOTATED with a rewritten summary, reason and propagation_review (the existing PMID:16208361 quote was kept verbatim). The GO:0055085 logical-rule row derived from this IBA was left as REMOVE and untouched; a later pass should decide whether it should follow the new action. GO:0001836 release of cytochrome c from mitochondria and GO:0097192 extrinsic apoptotic signaling pathway in absence of ligand: REMOVE upheld on lineage grounds (the worm EGL-1/CED-9/CED-4/CED-3 pathway does not use cytochrome c release or ligand-withdrawal receptor signaling); those rows were not edited. Validated with just validate worm ced-9 (valid; warnings pre-existing).
