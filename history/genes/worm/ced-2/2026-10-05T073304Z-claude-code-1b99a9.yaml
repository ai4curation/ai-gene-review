  summary: Initial AI review of C. elegans ced-2 (CrkII orthologue) GO annotations
  details: |
    Reviewed all 27 GOA rows. Core function: signaling adaptor activity linking corpse-recognition signals (PSR-1, MOM-5/Frizzled) to the CED-5/CED-12 GEF and CED-10/Rac, in engulfment of apoptotic cells and distal tip cell migration. Bare protein binding modified to signaling adaptor activity or phosphotyrosine residue binding; clearance-phenotype death terms marked over-annotated or modified to positive regulation of apoptotic process involved in development; positive-regulation terms from Cabello 2010 modified to the direct engulfment and distal tip cell migration processes.
