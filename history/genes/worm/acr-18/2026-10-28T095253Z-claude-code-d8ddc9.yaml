  summary: 'Create review: acr-18'
  details: |
    Created the first review of C. elegans acr-18 (G5EG72), a DEG-3-group alpha-type nAChR-like subunit. All 18 GOA rows (IBA/IEA only) were reviewed using the one primary paper (PMID:23577128, full text), which shows by null mutants and cell-specific rescue that an ACR-18-containing cholinergic receptor in the backward command interneurons mediates PVY/PVX-driven reversal during male mating. Core function: contributes_to acetylcholine-gated cation channel activity in an acetylcholine-gated channel complex, involved in cholinergic synaptic transmission. Generic channel, transport, membrane-potential, membrane and synapse rows were refined by MODIFY; calcium ion transport left UNDECIDED; ligand identity raised as a suggested question. Added a manual literature summary, notes and a reproducible Cys-motif sequence check.
