  summary: 'Create review: sma-2'
  details: |
    New review of C. elegans SMA-2 (Q02330), an R-Smad of the DBL-1/BMP-like Sma/Mab body-size pathway. All 29 GOA annotations were reviewed: 16 ACCEPT, 11 KEEP_AS_NON_CORE, 1 MODIFY (pharynx development to positive regulation of organ growth) and 1 MARK_AS_OVER_ANNOTATED (IBA I-SMAD binding, since C. elegans has no I-Smad subfamily member). The core function is DNA-binding transcription factor activity (GO:0000981) in BMP signaling and positive regulation of body growth, in a heteromeric SMAD complex.
