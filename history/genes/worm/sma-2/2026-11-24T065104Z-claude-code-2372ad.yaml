  summary: 'IBA over-annotation re-review: GO:0070411 moved to KEEP_AS_NON_CORE'
  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N07). GO:0070411 I-SMAD binding moved from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE. The earlier reason said no C. elegans family member falls in the inhibitory-Smad subfamilies. The PANTHER tree shows otherwise: tag-68 (G5EDS9) is in the inhibitory-Smad clade PTN001008964 with SMAD6, SMAD7 and fly Dad. The IBD at the family root PTN000344419 has five human IPI seeds (SMAD1, SMAD2, SMAD4, SMAD6, SMAD7) in all four child clades and the target is inside a seeded clade, so no ground for an over-annotation remains. Kept as non-core, as in the human SMAD2 and SMAD4 reviews. No PAINT change.
