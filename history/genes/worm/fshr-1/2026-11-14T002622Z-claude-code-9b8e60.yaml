  summary: Revisit fshr-1 hormone-receptor rows after GPLA-1/GPLB-1 ligand evidence
  details: |
    Targeted revisit prompted by the PTHR24372 family review, whose family/gene cross-check reported a CONFLICT on GO:0016500 for fshr-1 (SF74). The earlier review removed the root IBA GO:0009755 and the InterPro IEA GO:0016500, and modified the root IBA GO:0008528 to GO:0004930, all on the premise that FSHR-1 has no known hormone ligand. Cached and read the primary ligand paper, Kenis et al. 2023 (PMID:37409228, full text): recombinant GPLA-1, GPLB-1 or the heterodimer raises cAMP signaling by FSHR-1 in a HEK-cell CRE-luciferase assay with no response in vector controls, and gpla-1, gplb-1 and fshr-1 act in one growth pathway in vivo, with FSHR-1 acting in intestine and glia. Buckley et al. 2024 (PMID:39561202) shows that intestinal FSHR-1 activity in neuromuscular regulation requires both ligands. Changes: GO:0009755 IBA REMOVE -> ACCEPT; GO:0016500 IEA REMOVE -> ACCEPT; GO:0008528 IBA stays MODIFY but the replacement is now GO:0004930 plus GO:0016500, with a propagation_review matching the human FSHR review and the family review's TOO_DEEP verdict on the root peptide-receptor IBD; GO:0007189 IBA KEEP_AS_NON_CORE -> ACCEPT, since its non-core reason was the absence of a cAMP assay. Added a core function (GO:0016500, directly_involved_in GO:0009755 and GO:0007189, plasma membrane), the PMID:37409228 reference with a reference_review, and reworded the description, one suggested question and one suggested experiment that assumed an unknown or non-hormone ligand. Other rows, including the immune and stress rows and their core functions, were not re-reviewed. Not verified: direct ligand binding (a GPLA-1 co-precipitation is cited in PMID:39561202 but its source is not cached), and whether the immune role uses the same ligands. After the edit the family/gene cross-check for PTHR24372 reports 0 conflicts.
