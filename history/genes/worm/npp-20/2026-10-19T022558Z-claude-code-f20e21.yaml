  summary: 'Create review: npp-20'
  details: |
    Full review of C. elegans npp-20 (SEC13 homolog, Q9N4A7), 21 GOA rows, for the RAR_MISANNOTATION project. Read the Galy et al. 2003 full text (PMC284812, not in cache): npp-20 RNAi blocked cytokinesis in early embryos, attributed by the authors to Sec13 pleiotropy; the GO:0010973 positive regulation of division septum assembly IMP row (Wei et al. 2020 flag) is MODIFIED to GO:0000281 mitotic cytokinesis rather than removed. structural molecule activity refined to structural constituent of nuclear pore; positive regulation of TOR signaling refined to TORC1; centromere condensation marked over-annotated (downstream of HCP-4 import defect); NPC, COPII coat/budding and nuclear import accepted as core.
