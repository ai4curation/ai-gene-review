  summary: New pos-1 review using the WormBase description as a recall checklist
  details: |
    Created the pos-1 (G5EF15) review from GOA (24 rows), UniProt, the WormBase curated description and a manual literature search (automated deep research unavailable; queries in pos-1-notes.md). Core functions: PRE-specific 3'-UTR binding with target-specific translational repression (glp-1, zif-1, neg-1 polyadenylation) and activation (nos-2, apx-1, mom-2). The two transcription rows from the PIE-1 GAL4 tethering paper (PMID:9925644) are marked over-annotated with PROBABLE WormBase CHECK defects; metal ion binding modified to zinc ion binding (NMR zinc ligands); adaptor IBA left UNDECIDED. NEW: positive regulation of translation (PMID:16499902) and P-body (PMID:36196602). Text defects: UniProt CC FUNCTION places endo-mesoderm promotion in anterior blastomeres (WRONG_STATEMENT, CONFIRMED) and omits translational activation (MISSING_STATEMENT); WormBase calls the yeast three-hybrid mex-6 result in vitro (WRONG_STATEMENT, PROBABLE) and omits the neg-1 mechanism (MISSING_STATEMENT). Scored the descriptions sidecar (status COMPLETE).
