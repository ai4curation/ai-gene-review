  details: |
    De novo review of C. elegans fib-1 (Q22053, fibrillarin) covering all 22 GOA rows. Literature research done manually from cached full-text papers (PMID:18804378, 22768349, 26492166, 36329008, 23705068, 28853436, 30190478) and recorded in fib-1-deep-research-manual.md and fib-1-notes.md. Core functions: rRNA methyltransferase activity and rRNA methylation as catalytic subunit of the box C/D snoRNP in the nucleolar fibrillar compartment, and rRNA processing as part of the small-subunit processome. Generic methyltransferase and protein-glutamine methyltransferase rows modified to the specific rRNA and histone H2AQ104 methyltransferase terms; chromatin remodeling (IEA) and positive regulation of translation (IMP, indirect ribosome-biogenesis effect) marked as over-annotated; Cajal body IBA left undecided; no NEW terms.
