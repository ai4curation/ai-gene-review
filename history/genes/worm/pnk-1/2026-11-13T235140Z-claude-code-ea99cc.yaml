  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (pnk-1-phylo.yaml, from `just phylo worm pnk-1`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0004594 (REMOVE): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the negation sits at a speciation node at Metazoa-Choanoflagellida with 37 leaves, 7 steps above pnk-1 with 0 duplications between, and the row cites no seed; the tree places pnk-1 inside the clade carrying the loss, so the verdict rests on the residue and genetic evidence.
    - GO:0005634 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the 5 seeds are 1 one-to-one ortholog and 4 paralogs of pnk-1 and the node is their common ancestor; the ortholog seed shares the branch of pnk-1 at 43% identity, so the isoform argument covers the paralog seeds but not that one.
    - GO:0016791 (REMOVE): the reason made a claim the tree contradicts; the reason was corrected. Added to the reason: In the PANTHER 19.0 tree the single seed is a one-to-one ortholog of pnk-1 with 0 duplications on the path, so this is not a paralog transfer; the aligned columns span 70% of pnk-1 but only 40% of the seed, consistent with a seed that carries sequence pnk-1 lacks.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
