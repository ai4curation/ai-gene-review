  details: |
    Created the pnk-1 (H2KYP7) review. Own alignment shows PNK-1 retains the PanK catalytic Glu214/Arg281 (PANK3 Glu138/Arg207) and lacks the PANK4 C-terminal phosphatase domain, so the PAINT NOT pantothenate kinase activity and phosphatase activity rows (PANK4 subfamily node PTN000957966) were removed with GO_CENTRAL source_defects, and positive pantothenate kinase activity was added as NEW (IC). CoA biosynthesis, ATP binding and cytosol rows were accepted, cytoplasm was refined to cytosol, and the nucleus IBA was marked over-annotated as an isoform-specific mammalian property. Manual literature notes and a reproducible bioinformatics script were added.
