  summary: 'Create review: wdr-23 canonical product P90794 (WDR-23A/B)'
  details: |
    De-novo review of the canonical Swiss-Prot wdr-23 product (P90794), the same-gene reference for ProtNLM2 benchmark entry S6FN32; independent of ProtNLM2 output. Falcon and perplexity-lite deep research failed (auth / quota); built from primary literature (PMIDs 19273594, 23555279, 31409866, 28453520, 26056713, 23721876). All 16 GOA rows reviewed: CRL4 complex (IBA) and proteasomal catabolism (IBA+IMP) accepted; three protein-binding rows (SKN-1, DDB-1 x2) modified to GO:1990756 substrate adaptor activity; SKN-1 TF binding and nucleus accepted; lifespan, growth, stress, manganese and transcription regulation rows kept as non-core SKN-1-dependent consequences; cellular detoxification marked over-annotated (WDR-23 represses detox). NEW isoform-a locations: mitochondrial outer membrane and cytoplasm (PMID:23555279). Two retracted Choe-lab MCB papers (PMID:24912676, 23836880) recorded as is_invalid and not used. Added DxR-motif mapping script (bioinformatics/dxr_motifs.py).
