  summary: Narrow the NPHP-2 EF-hand calcium-binding knowledge gap with an OpenScientist
    run
  details: |
    Ran OpenScientist (3 iterations) on whether the NPHP-2 'EF-hand' is a canonical calcium-binding loop. No EF-hand is annotated by InterPro/Pfam/PROSITE profile. The only PROSITE pattern hit (521-533 DDDAEDHLDILDV; checked locally) fails loop positions 6 (Gly) and 12 (Glu), is disordered in AlphaFold, is absent from vertebrate inversins, and carries an indel in C. briggsae. The description was reworded so the required C-terminal region is no longer called a calcium-binding EF-hand. Gap OPEN -> NARROWING.
