  summary: 'Create review: cey-2'
  details: |
    New review of C. elegans cey-2 (P91306), a germline cytoplasmic Y-box protein in the CAR-1/CGH-1 maternal mRNP. Five GOA rows were reviewed against full text of PMID:16247027, PMID:25378320 and PMID:39423228. Both nucleic acid binding rows (IBA, IEA) were accepted and the RNP complex IDA was accepted. The nucleus IBA was removed because of CEY-2-specific evidence that it is only cytoplasmic. Regulation of gene expression was modified to post-transcriptional regulation of gene expression. A NEW cytoplasm IDA row was added. No new process terms were proposed from the RNAi or mutant phenotypes. The literature survey is in a manual deep-research file because no provider was available.
