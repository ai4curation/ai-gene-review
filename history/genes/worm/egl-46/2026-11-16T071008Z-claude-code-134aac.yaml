  summary: New egl-46 review (INSM zinc-finger TF) using the WormBase description
    as a recall checklist
  details: |
    New review of C. elegans egl-46 (G5EFY4), the INSM1/INSM2-family zinc-finger partner of EGL-44. Automated deep research was unavailable (no provider keys); the literature was searched by hand (PubMed E-utilities queries recorded in egl-46-notes.md). Newly cached: PMID:25395666 (GOA), PMID:2721931 (GOA), PMID:29553368 (HSN transcription factor collective, full text) and PMID:32550488 (BAG rp4 allele). The gene-symbol UniProt lookup hit HTTP 429, so fetch-gene was run with --uniprot-id G5EFY4; this also wrote the PANTHER PTHR15065 family metadata. All 33 GOA rows reviewed: 17 ACCEPT, 6 MODIFY, 5 KEEP_AS_NON_CORE, 2 MARK_AS_OVER_ANNOTATED, 2 UNDECIDED, 1 TOO_GENERAL; no NEW rows. MODIFY: both GO:0006355 rows to GO:0045944, GO:0010468 to GO:0010628, GO:0045165 to GO:0048663, GO:0106027 to GO:0140059, and GO:0031536 to GO:0007406 (PROBABLE WRONG_TERM defect for UniProt, as in egl-44). Over-annotated: detection of oxygen and of carbon dioxide (EGL-46 specifies BAG identity; the guanylyl cyclases sense). UNDECIDED: neuroblast division (PMID:2721931 unreadable; later data show egl-46 stops division) and axon guidance (WormBase's own text says axon outgrowth). TOO_GENERAL: ARBA cell differentiation. Two core functions: Pol II repressor activity with EGL-44 in neuron differentiation, and Pol II TF activity activating identity genes in HSN, HOB and BAG. WormBase reference DISPUTED: PROBABLE WRONG_STATEMENT (Q-neuroblast terminal divisions), PROBABLE OUTDATED_STATEMENT (TFIIA-like family label), CONFIRMED MISSING_STATEMENT (EGL-44 complex, HSN collective, BAG, HOB, PVD). UniProt reference VERIFIED with a CONFIRMED MISSING_STATEMENT (HSN serotonergic role). Descriptions sidecar scored and set COMPLETE.
