  summary: 'Create review: dpm-1 full-length product Q9TYJ7'
  details: |
    De novo review of full-length C. elegans DPM-1 (Q9TYJ7, Y66H1A.2a), the same-gene canonical relative of the U4PF58 fragment, done independently of ProtNLM2 predictions. Falcon and perplexity-lite deep research both failed (auth/quota), recorded in notes. All 5 GOA rows reviewed: GO:0004582 IBA and IEA ACCEPT; ER membrane IBA ACCEPT; ER IEA MODIFY to ER membrane; dolichol-linked oligosaccharide biosynthesis IBA KEEP_AS_NON_CORE. Added NEW GO:0180047 dolichol phosphate mannose biosynthetic process (enzyme's own reaction; human DPM1/DPM2 IDA comparators). Transfer grounded on PTHR43398:SF1 membership and PAINT nodes; PAINT omissions of GPI anchor, O-mannosylation and complex terms treated as deliberate and raised as questions. Added a reproducible sequence check (motifs, hydropathy, DPM2/DPM3 presence). No function is experimentally established in C. elegans.
