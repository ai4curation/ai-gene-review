  details: |
    IBA re-review 2026-11-21 (projects/IBA_REVIEW/rereview-2026-11-21, batch N02). The IBA row for GO:0043653 mitochondrial fragmentation involved in apoptotic process was changed from REMOVE to MARK_AS_OVER_ANNOTATED. The IBD sits at the family root PTN001032684 (64 leaves) with one seed, human BNIP3 (IDA PMID:20436456), which is in the vertebrate BNIP3 clade PTN002689498; DCT-1 is in the protostome clade PTN000390271. The node placement is doubtful, but the earlier REMOVE rested on the single seed and on the absence of worm data, which are not grounds for removal: nothing shows DCT-1 lost the function, and the dct-1 loss phenotype (fragmented networks from failed mitophagy) does not test apoptotic fragmentation. The new action matches the call for fly BNIP3 in the same clade and the PTHR15186 family review's TOO_DEEP assessment. Summary, reason and one propagation_review comment were rewritten; supporting_text quotes unchanged; no other row touched. just validate passes.
