  summary: 'PTHR15186 pass: resolve refreshed GOA rows, complete dct-1 review'
  details: |
    Completed the dct-1 review (status DRAFT/IN_PROGRESS -> COMPLETE) after a
    GOA refresh (`just fetch-gene ... --force`) during the PTHR15186 (BNIP3/NIX)
    family pass. New PAINT IBAs from PTN001032684 (taxon:6072): mitophagy
    ACCEPT (DCT-1 is itself a seed and has its own IMP, PMID:25896323);
    positive regulation of apoptotic process KEEP_AS_NON_CORE (vertebrate
    seeds only, but ceBNIP3 kills mammalian cells on overexpression and
    curators annotated an apoptotic process IMP, so it is not overruled);
    mitochondrial fragmentation involved in apoptotic process REMOVE, with a
    propagation_review (single human BNIP3 seed placed at a eumetazoan node,
    and no invertebrate evidence). The nucleus IBA went from UNDECIDED to
    MARK_AS_OVER_ANNOTATED, with a propagation_review. All four GO:0005515
    rows (CED-9 and CED-3, PMID:11114722 and PMID:9824163; the WB ids were
    mapped to ced-3/ced-9 via the local UniProt files) are REMOVE, replacing
    MARK_AS_OVER_ANNOTATED. Protease binding and the ternary complex went from
    ACCEPT to KEEP_AS_NON_CORE, since they come from heterologous
    overexpression. Removed four review rows that are no longer in GOA:
    IBA GO:0043067, IBA GO:0097345, and keyword IEAs GO:0006914 and GO:0006915.
    The description no longer claims direct DCT-1-LGG-1 binding: only LGG-1
    colocalization and the WXXL motif are documented. To match, the NEW
    GO:0140580 row is recoded from IDA to ISS. Also added the UniProt flat file
    as a reference, reference_review blocks, and new suggested
    questions/experiments, and wrote dct-1-notes.md. The four dct-1 entries in
    conf/local_quote_baseline.yaml are now stale (those quotes were replaced
    with verbatim ones); they were not pruned in this session.
    `just validate worm dct-1` passes with only the environment UV_NATIVE_TLS
    warnings.
