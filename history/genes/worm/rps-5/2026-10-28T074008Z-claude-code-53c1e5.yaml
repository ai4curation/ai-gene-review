  details: |
    New review of C. elegans rps-5 (P49041, uS7). All 15 GOA rows (IBA/IEA/ISS, no PMIDs) reviewed using the UniProt record, the C. elegans 80S cryo-EM structure (PMID:39209556) and the RPS-5 RNAi control data in PMID:16247027 (full text). Structural constituent of ribosome and cytosolic small ribosomal subunit accepted; translation refined to cytoplasmic translation, ribosome/small ribosomal subunit to cytosolic small ribosomal subunit, cytoplasm to cytosol, RNA binding to rRNA and mRNA binding; nucleolus, SSU processome and small-subunit biogenesis kept as non-core orthology-based claims. No NEW terms; manual literature summary written because no deep-research provider was available.
