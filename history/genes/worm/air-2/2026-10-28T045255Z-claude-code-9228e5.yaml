  details: |
    De novo review of C. elegans AIR-2 (O01427), the Aurora B catalytic subunit of the chromosomal passenger complex. All 64 GOA rows reviewed against cached literature (full text for the CSC-1, REC-8, ICP-1, BMK-1, KLP-7, meiotic CPC and midbody papers; abstracts otherwise). Generic protein kinase activity, spindle, cytoskeleton and chromosome segregation rows were refined to serine/threonine kinase activity, spindle midzone and mitotic/meiotic segregation; centrosome, spindle pole and kinetochore IBA rows were marked over-annotated as Aurora A or monocentric localizations that do not apply to AIR-2; ComplexPortal checkpoint and sister-separation rows were marked over-annotated; bare protein binding rows were removed except BMK-1, modified to kinesin binding. No NEW annotations were proposed. A manual literature synthesis replaces provider deep research.
