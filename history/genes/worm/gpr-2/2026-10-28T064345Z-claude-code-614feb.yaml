  details: |
    New review of C. elegans gpr-2 (Q03569), fetched by accession with --alias gpr-2 because the UniProt gene-symbol search timed out. All 13 GOA rows reviewed: GoLoco GDP-dissociation inhibitor activity (two IDA rows) and cell cortex accepted as core; establishment of mitotic spindle localization accepted as the core process; spindle elongation, nuclear migration, aster and mitotic spindle kept as non-core; spindle (IEA) and GTPase regulator activity (IEA) modified to their specific supported children; regulation of GPCR signaling marked over-annotated because the embryonic G-alpha pathway is receptor-independent. Kept consistent with the gpr-1 review since all functional data are for GPR-1/2 jointly. No NEW terms. Literature compiled manually (no deep-research provider).
