  details: |
    De novo review of C. elegans nhr-60 (O17898), an orphan HNF4-derived supplementary nuclear receptor. All 14 GOA rows reviewed: IBA nuclear receptor activity, Pol II cis-regulatory DNA binding, regulation of Pol II transcription and nucleus accepted as core; general InterPro IEA rows (DNA-binding TF activity, sequence-specific DNA binding, regulation of DNA-templated transcription) modified to the specific terms the gene carries; zinc ion binding, cell differentiation, intracellular receptor signaling pathway and the IDA nuclear envelope row kept as non-core. Added NEW transcription corepressor binding (IPI) from the GST-NHR-60 pull-down of the GEI-8 NCoR/SMRT homologue (PMID:23484030). Manual literature summary written because no deep-research provider was available.
