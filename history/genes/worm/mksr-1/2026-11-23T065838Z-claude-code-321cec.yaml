  summary: Narrow the MKSR-1 B9/C2 binding knowledge gap with an OpenScientist run
  details: |
    Ran OpenScientist (3 iterations) on whether the MKSR-1 B9/C2 domain keeps calcium/lipid binding residues. The C2 fold is confirmed by structure (~1.6 A to PKC-alpha/Syt1 C2). There is no calcium site: E23/N25/S87/D89/C95 occupy the canonical ligand positions (checked locally), and an unbiased carboxylate-cluster test finds none. There is no polybasic lipid patch either. Gap OPEN -> NARROWING; partners and non-redundant role remain open.
