  summary: Create review for C. elegans T04F3.1 (G5EE32)
  details: |
    Created full curation review for C. elegans T04F3.1 (UniProtKB:G5EE32, WB:WBGene00011436, 3,460 aa in paraphyletic PTHR43795:SF39; verified absence of WormBase curated gene description). Documented its ~3,100-aa intrinsically disordered repeat N-terminus and divergent C-terminal PF00155 domain (residues 3107-3444) retaining cofactor-anchoring Lys3294 and Asp3255 plus Arg3427 while lacking PROSITE PS00105 (IPR004838) and substituting Glu3105, Val3108, and Met3322 across the inter-subunit pocket. Removed stale IBA rows GO:0006520 and GO:0008483 from retired PAINT node PTN002887088 (aligned with PTHR43795-review.yaml's TOO_DEEP assessment of Unikonts PTN000923144 GO:0016846, which sweeps SF39 members including G5EE32 in over-deeply rather than gating them out), marked InterPro2GO IEA GO:0030170 as MARK_AS_OVER_ANNOTATED on this unassayed divergent homolog, and recorded a WHOLLY_DARK biology knowledge gap.
