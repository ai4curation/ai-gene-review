- type: EDIT
  outcome: changed
  summary: Record OpenScientist finding that the T04F3.1 PLP pocket is intact and
    the gene model sound, and correct a residue correspondence it asserted
  details: |
    Ran an OpenScientist deep-research job (kgap-t04f31-plp-and-gene-model) on the T04F3.1 gap. It answers two of the four sub-questions, says plainly that two cannot be settled, and corrects a claim this review asserts in three places.

    PLP binding is predicted. Contacts were computed from deposited coordinates rather than quoted: every residue with a heavy atom within 4 Angstrom of PLP in apple ACC synthase, tomato LE-ACS2 and two E. coli aspartate aminotransferase structures, mapped by global alignment. The same-chain pocket is largely intact, keeping the Ser-x-Ser-Lys phosphate cup at Ser3291, Ser3293 and Lys3294, the pyridinium aspartate Asp3255, the phosphate-loop asparagine Asn3227, the re-face tyrosine Tyr3171 and the carboxylate arginine Arg3427, all identical to apple ACS and all confirmed in the local record. Of 14 cofactor and substrate positions, 8 are identical and 4 conservative. Across 14 nematode orthologs the same-chain contacts hold at 0.87 mean identity while cross-subunit interface positions drift to 0.50 in the same alignments.

    The gene model is sound: a single compact 14,047 base-pair gene on chromosome V with 17 exons, no protein-coding gene inside its span, two curated isoforms both carrying repeat region and domain, and the same giant architecture independently annotated in ten nematode species across at least four genera. A mis-joined model is a per-assembly error and does not recur independently across ten genome projects.

    Two sub-questions cannot be settled: pocket enclosure and N-terminal occlusion, since no AlphaFold model exists for G5EE32 and there is no experimental structure, although MobiDB places the disordered region ending about 700 residues before the domain, which weakly argues against the simplest occlusion scenario; and direct end-to-end transcript support, since WormBase and ParaSite endpoints were unreachable and the RefSeq entry is genome-derived.

    The correction concerns a residue correspondence this review asserts in its description and in two annotation reason fields: that Glu3105, Val3108 and Met3322 sit at human ACCS Tyr132, Trp135 and Arg351. Only Met3322 against Arg351 is reproduced. Global alignment maps ACCS Tyr132 to Tyr3110 and Trp135 to Ala3113, an offset of five residues, and re-aligning the local windows under six gap-penalty settings gave the same answer every time. All four residues exist in the local sequence and the quoted window matches verbatim, so the disagreement is about alignment register rather than sequence, and the run itself calls this loop the least certain part of its alignment, noting a nearby Trp3116 and that apple ACS carries Ser where ACCS has Arg351, so ACCS is not a conserved benchmark there either.

    A second premise is weakened: the absence of PROSITE PS00105 is not diagnostic, because T04F3.1 fails it at exactly one position, a conservative Arg to Lys at 3302 that preserves the charge, and human ACCS also fails the pattern while keeping a complete phosphate cup; the genuinely degraded case is human ACCSL, which has lost the Schiff-base lysine region.

    The description was qualified accordingly, since it stated the correspondence as fact, and a suggested question was added naming the two annotation reason fields that argue partly from the PS00105 absence and from the disputed correspondence, asking whether those actions still stand on their remaining grounds. No annotation action was changed, consistent with this campaign recording gap provenance rather than re-deciding actions.

    The run's deeper point stands independently of the register: these residues are cross-subunit dimer-interface positions rather than same-chain cofactor contacts, so their divergence bears on substrate specificity and on whether the canonical dimer can form, not on whether the chain binds PLP. Gap status moved from OPEN to NARROWING. Everything is computational, with no assay, mutant, localization or interaction evidence in any organism, and the contact mapping rests on alignments at 23 to 27 per cent identity.
