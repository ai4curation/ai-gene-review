  summary: New review of cki-1 (CIP/KIP CDK inhibitor) with WormBase description checked
  details: |
    New review of C. elegans cki-1 (Q22197) for the MOD descriptions project. Automated deep research was unavailable; literature was searched manually (PubMed, web) and recorded in cki-1-notes.md, and seven further papers were cached. All 21 GOA rows reviewed: 15 ACCEPT, 3 KEEP_AS_NON_CORE (gonad development, regulation of DNA endoreduplication, regulation of cell differentiation), 1 MODIFY (IGI regulation of cell cycle G1/S phase transition, PMID:11684669, to GO:2000134 negative regulation of G1/S transition, as the paper shows G1/S inhibition), 1 TOO_GENERAL (IEA regulation of cell cycle), 1 MARK_AS_OVER_ANNOTATED (IBA cytoplasm, seeded only by mammalian p27/p57; worm CKI-1 is nuclear in every assay and PMID:21074724 contrasts nuclear worm CKI-1 control with cytoplasmic human p21), with a propagation_review. No NEW rows. Rows from PMID:16198291 (abstract does not mention cki-1) were accepted or kept non-core on independent evidence and deferred to the UniProt curator. WormBase description VERIFIED (all claims trace to PMID:9716524) with a MISSING_STATEMENT (CONFIRMED) for the essential embryonic role (PMID:12885569) and the regulators DAF-16, CDC-14 and CRL2-LRR-1. UniProt FUNCTION VERIFIED with a MISSING_STATEMENT (PROBABLE): the CUL-2 hedge is resolved by CRL2-LRR-1 (PMID:21074724), and the embryonic and DAF-16 roles are absent. Descriptions sidecar scored and set COMPLETE.
