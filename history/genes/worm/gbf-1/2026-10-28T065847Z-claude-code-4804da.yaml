  summary: 'Create review: gbf-1'
  details: |
    Created the gbf-1 (G5EGS5) review. The data were fetched by accession because the gene-name UniProt search timed out. All 15 GOA rows were reviewed against the full text of PMID:23840591, the abstract of PMID:25190516 and the full text of PMID:26115433. Sec7 GEF activity, cis-Golgi/ERGIC localization, retrograde Golgi-to-ER transport and regulation of ARF signalling were accepted as core. Golgi and ER organization, secretion, endosomal transport, mitochondrion organization and the ER exit site location were kept as non-core, because the authors judge several of them indirect. No NEW terms were added. A manual literature summary and notes were written in place of deep research.
