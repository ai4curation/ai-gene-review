  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N05). GO:0016477 cell migration (IBA) changed from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE. The IBD at PTN000100522 is seeded on both sides of its split, by fly nudE (border follicle cell migration, IMP, PMID:22808215) in NUD-2's own 10-leaf protostome clade PTN002589161 and by mouse Nde1 and Ndel1 in the deuterostome clade. The earlier reason was that no worm data implicate NUD-2 in cell migration, which is not a ground; the family review PTHR10921 calls the node sound. The four other re-reviewed IBA rows (centrosome, microtubule nucleation, mitotic centrosome separation, centrosome localization) were upheld and not edited. Validated with just validate; no new error or warning.
