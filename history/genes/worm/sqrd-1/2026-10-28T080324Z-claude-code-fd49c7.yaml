  summary: 'Create review: sqrd-1'
  details: |
    New review of C. elegans sqrd-1 (C6KRP5; fetch-gene resolved C6KRP5 rather than the requested A0A061ADY3, both TrEMBL entries for WBGene00008538, with GOA keyed to C6KRP5). Four IEA rows reviewed: mitochondrion accepted under the organelle policy (orthology and quinone-pool function, with the caveat that no worm localization assay exists and the gene model lacks an obvious presequence); oxidoreductase activity and the bacterial-type sulfide:quinone oxidoreductase activity modified to glutathione-dependent SQR activity (GO:0106436), which is accepted as core. Added NEW sulfide oxidation (GO:0019418), since SQRD-1 catalyses the first step and genetics places it with ethe-1. Manual literature review written (no deep-research API); phenotype-only evidence (proteostasis, gonad RNAi) not turned into process terms.
