  summary: New review of yap-1 (YAP/TAZ/Yorkie coactivator) with WormBase description
    checked
  details: |
    New review of C. elegans yap-1 (Q19404) for the MOD descriptions project. Automated deep research was unavailable; literature was searched manually (PubMed, QuickGO by reference and a comparator query) and recorded in yap-1-notes.md; four further papers were cached. All 20 GOA rows reviewed: 11 ACCEPT (coactivator activity IBA/ISS, nucleus x4, hippo signaling, positive regulation of Pol II transcription x2, EGL-44 TF binding, Pol II transcription regulator complex), 8 KEEP_AS_NON_CORE (cytoplasm x2, cilium, axoneme x2, ciliary base, protein kinase binding with WTS-1 as the substrate relationship, establishment of cell polarity for ALM dendrites), 1 MARK_AS_OVER_ANNOTATED (ISS cell-cell junction from mouse Yap1; no worm evidence of junctional YAP-1). One NEW row: GO:0050829 defense response to Gram-negative bacterium (IMP, PMID:32857822), after the participation test (YAP-1/EGL-44 drive the immune gene program after barrier loss) and a comparator check (worm infection-response TFs carry the term; the paper is uncurated). WormBase description UNVERIFIED (all claims from PMID:23396260; the EGL-44 TEAD-reporter claim is full-text only) with a MISSING_STATEMENT (CONFIRMED) for the intestinal WTS-1/YAP-1/EGL-44 module, the immune role and the neuronal roles. UniProt DISPUTED: MISSING_STATEMENT (CONFIRMED) on FUNCTION, and a WRONG_STATEMENT (SUSPECTED) for the self-contradictory S104A MUTAGEN note. Descriptions sidecar scored and set COMPLETE.
