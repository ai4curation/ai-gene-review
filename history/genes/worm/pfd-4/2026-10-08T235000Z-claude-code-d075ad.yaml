  summary: 'Create review: pfd-4'
  details: |
    New review of C. elegans pfd-4 (Q17435, B0035.4), a beta-class prefoldin subunit. All 5 GOA rows (IBA/IEA complex, folding, cytoplasm) were accepted. A caveat records that pfd-4 RNAi and deletion reportedly give no phenotype and that worm PFD-4 is divergent (Falcon summary of Lundin's 2008 thesis). For that reason no NEW MF annotation was added. The core function is recorded as protein folding chaperone by homology, with uncertainty noted.
