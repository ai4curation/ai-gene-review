  summary: 'gei-17: GO:0140416 MARK_AS_OVER_ANNOTATED -> UNDECIDED'
  details: |
    Responding to the ai4c-reviewer finding on PR 4199. GO:0140416 is defined as inhibiting a transcription regulator via direct binding and/or post-translational modification, so the earlier over-annotation argument (GEI-17's effects need its ligase) misread the term. The OpenScientist run refuted only a SAP-domain binding route; GEI-17 inhibits piRNA USTC transcription condensates in a SUMOylation-dependent way (PMID:40316696, abstract only), so the modification route is plausible but not shown. Action -> UNDECIDED; propagation_review root_cause -> UNRESOLVED. Notes record the correction.
