  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N07). GO:0098978 glutamatergic synapse moved from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE. The IBD at PTN000070016 has four rodent endophilin seeds (SynGO IDA) in the vertebrate child clade PTN008554470; UNC-57 is in the protostome child PTN002680757 with fly EndoA, which acts at the glutamatergic larval neuromuscular junction. The earlier reason was that the synapse type had not been examined in the worm, which is not a reason to doubt an IBA, and nothing in the protostome clade argues against the term. No PAINT change.
