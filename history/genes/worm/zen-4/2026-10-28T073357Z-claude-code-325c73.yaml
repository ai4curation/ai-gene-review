  details: |
    De novo review of C. elegans zen-4 (G5EG83, kinesin-6/MKLP1 motor subunit of centralspindlin). All 24 GOA rows reviewed: motor IEA rows refined to plus-end-directed microtubule motor activity based on in vitro motility of purified ZEN-4 (PMID:25875822); midzone/midbody localization and central spindle assembly accepted; centrosome IDA, pronuclear migration IGI, chromatid segregation IGI and meiotic spindle midzone assembly IMP marked over-annotated (the last contradicted by its own paper, recorded as a suspected source defect); bare protein binding removed. Added NEW centralspindlin complex and mitotic cytokinesis rows. Literature notes written manually (no deep-research provider).
