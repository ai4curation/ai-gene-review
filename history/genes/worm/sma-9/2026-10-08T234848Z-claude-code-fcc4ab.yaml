  summary: 'Create review: sma-9'
  details: |
    New review of C. elegans SMA-9 (Q7JM44), the Schnurri/HIVEP zinc-finger cofactor of the DBL-1 Sma/Mab pathway. All 46 GOA annotations were reviewed: 33 ACCEPT, 8 KEEP_AS_NON_CORE, 2 MODIFY (both GO:0007179 rows to GO:0030509 BMP signaling pathway) and 3 UNDECIDED (lifespan, heat response and nuclear-localization rows from an abstract-only amyloid-beta study). Core functions: transcription corepressor activity (GO:0003714) in body growth; corepressor-mediated antagonism of BMP signaling (repressing unc-130) to specify dorsal M lineage fate; and coactivator activity (GO:0003713) in male tail patterning.
