  summary: 'Create review: rme-2'
  details: |
    De novo review of C. elegans rme-2 (O44191), the LDLR-family oocyte yolk receptor. All 16 GOA rows reviewed against Grant and Hirsh 1999 (full text) and four supporting localization papers. The LDL particle receptor activity IDA row was modified laterally to vitellogenin receptor activity (GO:0008196) with a WormBase WRONG_TERM source defect; vesicle-mediated transport was refined to clathrin-dependent endocytosis involved in vitellogenesis; generic membrane/endomembrane rows refined to plasma membrane and endosome membrane; ovulation IMP marked over-annotated as an indirect consequence; developmental IMP rows kept as non-core. Manual literature synthesis written because no deep-research provider was available.
