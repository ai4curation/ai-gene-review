  summary: New mes-1 review using the WormBase description as a recall checklist
  details: |
    Created the mes-1 (G5EBL2) review from GOA (17 rows), UniProt, the WormBase curated description and a manual literature search (automated deep research unavailable; queries in mes-1-notes.md). Added mes-1-bioinformatics/kinase_motifs.py and RESULTS.md: the kinase domain lacks the catalytic-loop Asp (R832), the DFG Asp (N860) and the glycine-rich loop, so MES-1 is a pseudokinase. Removed all four kinase-activity rows (IBA S/T kinase with a GO_CENTRAL query and residue claims, IEA protein kinase, IEA and ISS tyrosine kinase, the ISS with a CONFIRMED WormBase DELETE_ROW defect because its own reference predicts no activity); ATP binding marked over-annotated. Modified left/right axis specification to establishment of mitotic spindle orientation (UniProt WRONG_TERM defect, PROBABLE) and embryonic digestive tract morphogenesis to endodermal cell fate specification. Gamete generation marked over-annotated. Text defects: UniProt CC FUNCTION GPR-1/2/LET-99 mechanism OUTDATED (PROBABLE); WormBase MISSING_STATEMENT (P2/EMS SRC-1 role, pseudokinase). Scored the descriptions sidecar (status COMPLETE).
