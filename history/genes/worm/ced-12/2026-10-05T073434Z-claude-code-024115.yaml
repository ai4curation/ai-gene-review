  details: |
    Reviewed 45 GOA annotations (24 ACCEPT, 8 KEEP_AS_NON_CORE, 10 MODIFY, 2 REMOVE, 1 MARK_AS_OVER_ANNOTATED). Core MF is guanyl nucleotide exchange factor activator activity (CED-12 activates CED-5/DOCK180 toward CED-10/Rac) in engulfment of apoptotic cells and distal tip cell migration. Protein binding and complex binding rows changed to GEF activator activity; proline-rich region binding changed to SH3 domain binding (orientation reversed). Positive regulation of engulfment changed to engulfment of apoptotic cell; positive regulation of DTC migration changed to distal tip cell migration. Apoptotic process rows from the CED-8 paper (background genotype) changed to positive regulation of apoptotic process involved in development. Spindle orientation and left/right axis rows from Cabello 2010 removed after reading the full text, which concludes spindle orientation does not signal through CED-2/5/12.
