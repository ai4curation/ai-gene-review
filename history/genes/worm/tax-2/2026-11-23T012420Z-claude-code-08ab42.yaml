  summary: Narrow the TAX-2 CNBD cGMP-binding knowledge gap with an OpenScientist
    run
  details: |
    Ran OpenScientist (3 iterations) on the MF_DARK gap of whether the TAX-2 CNBD binds cGMP. Mapping the cGMP-contact residues from the cGMP-bound TAX-4 structure onto TAX-2 gives a canonical pocket: 11/15 contacts identical, an intact phosphate-binding cassette, and guanine-selective T619 and D663 retained. The pocket is more conserved than the rest of the domain. Gap OPEN -> NARROWING; binding is still unmeasured. The run's flag on the IBA cAMP-activated channel row matches the existing MARK_AS_OVER_ANNOTATED, so no action changed.
