  summary: Record OpenScientist refutation of the Ile44-patch test for worm BAG-1
    proteasome targeting
  details: |
    Ran an OpenScientist deep-research job (kgap-bag1-ubl-proteasome-surface) on the knowledge gap covering whether worm BAG-1 routes Hsc70 clients to folding or degradation. The run refuted the test I proposed by running the positive control, and that refutation is the useful result.

    The test asked whether the ubiquitin Ile44 hydrophobic patch with its Arg42 and Arg72 rim survives in the worm ubiquitin-like domain. It does not discriminate, because human BAG1, which carries the experimental evidence for proteasome association, also lacks that triad, having Ser, Lys and Lys at the three positions and no canonical patch either. A cryo-EM structure nonetheless shows the human domain bound directly to the proteasome subunit Rpn1 through an interface dominated by lysines and by an arginine with no ubiquitin counterpart. The ubiquitin triad is the surface ubiquitin uses on Rpn10 and Rpn13, whereas BAG1 uses a different receptor with different chemistry, and the published mutagenesis implicating the BAG-1 domain in proteasome binding points to a lysine rather than a hydrophobic patch. So absence of the canonical patch in worm BAG-1 is not evidence against proteasome targeting, and my framing was the wrong comparison standard.

    What the run says positively: the worm N-terminal domain is a genuine beta-grasp ubiquitin fold, at least as ubiquitin-like as the human domain by structural similarity, presenting a comparable contiguous exposed hydrophobic patch; placing it rigidly in the human pose on Rpn1 puts sixteen residues in contact at the same positions as the sixteen human contacts; the receptor side is conserved, most contacting proteasome residues being identical in the worm orthologue; and the five largest contributors to the human interface are conserved in chemical class in worm BAG-1 as Lys49, Leu51, Lys75, Ile77 and Met79, all confirmed in the local O44739 record, while the single position losing its class entirely, Gly81, does under three per cent of the interface work. Neither domain has a C-terminal diglycine or processing site, so both are built-in non-conjugatable signals, and the paralog UNC-23, lacking the domain, is a clean negative control.

    The gap stays OPEN because the curation question is untouched. No published C. elegans experiment links BAG-1 to the proteasome or to the Rpn1 orthologue; the only structure for this protein covers the BAG domain rather than the ubiquitin-like domain, which the local record's cross-reference confirms; and surface analysis cannot discriminate the folding route from the degradation route in any case, the same human domain having been reported to stabilise a client in one system and to associate with the proteasome in another. Everything supporting a degradation route here is human or in silico.

    Verified locally: the 210-residue length, the ubiquitin-domain and BAG-domain boundaries, the PDB cross-reference covering only 74-210, and all five named interface residues plus Gly81. unc-23 is not in this repository, so the negative control was not checked. The superpositions, TM-scores, patch areas, rigid-body docking and proteasome-side conservation were not recomputed. This run's reference validation reported all three attempted quotations as unsupported, so none of its literature quotations is relied on. No annotation action was taken.
