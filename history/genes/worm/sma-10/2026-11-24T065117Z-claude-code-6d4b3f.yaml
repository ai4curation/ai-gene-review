    IBA over-annotation re-review 2026-11-24 (projects/IBA_REVIEW/overannotated-2026-11-24, batch N09). GO:0038023 signaling receptor activity moved from MARK_AS_OVER_ANNOTATED to REMOVE on MISPLACED_IBD grounds. The IBD is at the PTHR24373 family root PTN002809265 (725 leaves) with six seeds in the Toll-like (TLR3, CD180, fly Toll-7) and Nogo-receptor-like (RTN4RL1, RTN4RL2, rat Rtn4rl2) subclades. SMA-10 is in the 13-leaf clade PTN009094627 with no seed, and its established function is binding and regulating the BMP receptors SMA-6 and DAF-4. Same call as human LRIG1, LRIG2, LRIG3 and LRRC32 for this node. Seed annotations checked in QuickGO by accession and GO id. Summary, reason and propagation_review rewritten; quotes unchanged.
