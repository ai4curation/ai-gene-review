  summary: 'Create review: sma-3'
  details: |
    New review of C. elegans SMA-3 (P45896), the principal R-Smad of the DBL-1/BMP-like Sma/Mab pathway. All 44 GOA annotations were reviewed: 28 ACCEPT, 13 KEEP_AS_NON_CORE, 2 MODIFY (GO:0030511 to BMP signaling pathway, since SMA-3 is a pathway component, not a regulator; pharynx development to positive regulation of organ growth) and 1 MARK_AS_OVER_ANNOTATED (IBA I-SMAD binding). Core functions: GO:0000981 DNA-binding TF activity in BMP signaling and body growth (hypodermis), and the non-canonical SMA-3 branch activating caenacin genes in antifungal defense.
