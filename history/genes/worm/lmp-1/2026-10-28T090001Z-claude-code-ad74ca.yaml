  summary: 'Create review: lmp-1'
  details: |
    New review of C. elegans LMP-1 (Q11117), a LAMP-family lysosomal membrane glycoprotein. All 13 GOA rows reviewed: lysosome, lysosomal membrane, late endosome membrane and gut granule membrane rows accepted on direct imaging evidence; plasma membrane (IBA) and phagocytic vesicle (IDA, supported independently by PMID:18256195) kept as non-core; generic membrane (IEA) modified to lysosomal membrane; establishment of protein localization to organelle (IBA, seeded by vertebrate LAMP1/LAMP2 NK-granule and chaperone-mediated autophagy roles) marked as over-annotated. Core function recorded as location-only since no molecular activity is established. Literature compiled manually (no deep-research API) in lmp-1-deep-research-manual.md.
