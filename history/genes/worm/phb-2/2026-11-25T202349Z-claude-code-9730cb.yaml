  summary: Record OpenScientist LIR prediction for worm PHB-2 with topology objection
    removed and two cautions
  details: |
    Ran an OpenScientist deep-research job (kgap-phb2-lir-topology) on the knowledge gap covering how phb-2's mitophagy-receptor activity is separated from its structural role. The run predicts a LIR core, removes the topology objection I raised, and then supplies two controls that keep the claim below an asserted function.

    The core is Tyr120-Arg-Thr-Leu123, which the local P50093 record confirms reads YRTL with the surrounding window LVHIYRTLGQNW at 116-127. It aligns gaplessly to the mammalian motif, where the human entry annotates an LC3-interaction region at the equivalent position. The aromatic and hydrophobic anchor positions are both retained while the two intervening positions are substituted, so both species carry weak-consensus rather than canonical LIRs, and neither has the acidic flank.

    The topology objection I put to the run does not hold, and the local record is what settles it: the transmembrane segment at 20-42 is annotated as a signal-anchor for a type II membrane protein, which places the short N-terminus on the matrix side and the entire C-terminal bulk, including this motif 78 residues past the anchor, in the intermembrane space. Cytosolic LGG-1 and LGG-2 can therefore reach it once the outer membrane is lost, and inner-membrane rupture is not required. Topology makes the interaction damage-gated in time rather than implausible, which matches the mammalian conclusion.

    Two results keep this at lead level. A degeneracy control: the equivalent fold position in PHB1 also satisfies the aromatic-plus-hydrophobic core in both species even though PHB1 is reported not to bind LC3 directly, and the worm protein contains six such cores in total, which the local sequence independently confirms at positions 52, 76, 120, 174, 247 and 286. Core retention is therefore a property of the prohibitin fold rather than evidence of a receptor. And a structural occlusion result: across three experimental human prohibitin assemblies the two anchor residues lose most of their accessibility when the subunit is placed in the assembly, with a neighbouring PHB1 chain as the burying partner in every case, so the motif sits on the PHB1-PHB2 interface and the receptor would need two gates, outer-membrane rupture and release of the motif from PHB1, rather than one.

    Status moved from OPEN to NARROWING. The run's own verdict is recorded, that this should remain an ISS-level lead until a C. elegans binding assay or a Tyr120 or Leu123 point mutant exists. The LGG-1 versus LGG-2 partner question and the pathway question are untouched.

    Verified locally: the length, the YRTL core, the 116-127 window, the 20-42 signal-anchor annotation and the count of six cores at the stated positions. Human PHB2 and PHB1 are not in this repository, so the mammalian annotation, the paralog comparison, the alignment statistics and the accessibility measurements were not checked locally. No annotation action was taken.
