  summary: 'Create review: daf-7'
  details: |
    De novo review of C. elegans daf-7 (P92172), the ASI/ASJ-secreted TGF-beta-family ligand that inhibits dauer entry. All 46 GOA rows were reviewed against cached literature (full text for 9 papers) and a manual literature synthesis (no deep-research provider was available). Ligand MF and extracellular-region rows accepted; the plain dauer entry/development and general regulation rows were modified to the negative-regulation terms the gene already carries; detection-of-bacterium, cellular response to cGMP and RNA Pol II transcription rows marked over-annotated as indirect or downstream; behavioural, lifespan and feeding rows kept as non-core. No NEW terms were proposed. PMID:23705068 was checked and found to use daf-7 only as an epistasis control.
