  summary: 'Create review: cec-10'
  details: |
    Created the first review of C. elegans cec-10 (ZK973.2, Q9N4L7), an uncharacterized chromodomain plus ankyrin-region protein, as part of the RAR_MISANNOTATION re-examination of Wei et al. 2020. Its six IBAs come from PANTHER node PTN000917496 (PTHR43828, fungal SBF/MBF seeds Res2/Cdc10/Res1/Swi4/Mbp1/Swi6). Domain and pairwise-alignment checks (cec-10-bioinformatics) show cec-10 lacks the KilA-N/APSES DNA-binding domain and has only weak similarity to the seeds. SBF/MBF is fungal-specific (PMID:27162172). MBF complex, contributes_to RNAPII cis-regulatory DNA binding, DNA-binding activator activity, positive regulation of RNAPII transcription and G1/S transition are therefore REMOVE (PROPAGATION_BAD, LINEAGE_OR_TAXON_MISMATCH, node too deep). Cytoplasm (yeast Swi6 donor) is MARK_AS_OVER_ANNOTATED and ARBA nucleus is KEEP_AS_NON_CORE. No core function is stated; knowledge gaps and experiments are recorded instead.
