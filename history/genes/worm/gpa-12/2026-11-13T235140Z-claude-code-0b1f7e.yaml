  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (gpa-12-phylo.yaml, from `just phylo worm gpa-12`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0007188 (REMOVE): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree the term sits at the family root and gpa-12 lies 13 steps below it across 3 duplications; the 21 seeds are 3 orthologs across later duplications and 18 paralogs of gpa-12, which agrees with a transfer made mostly from paralogous subfamilies, although the nearest seed is a mouse ortholog at 50% identity.
    - GO:0031526 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the 2 seeds are orthologs across later duplications of gpa-12 and their common ancestor lies 4 steps below the Bilateria node, with gpa-12 outside that clade, so the term was placed above its evidence; the tissue objection itself is not a tree question.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
