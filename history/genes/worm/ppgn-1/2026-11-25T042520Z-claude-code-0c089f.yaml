  summary: Record OpenScientist analysis of ppgn-1 catalytic motifs and m-AAA assembly
    competence
  details: |
    Ran an OpenScientist deep-research job (kgap-ppgn1-maaa-assembly) on the knowledge gap covering the oligomeric composition of the C. elegans m-AAA complex containing ppgn-1. The catalytic half of the question is settled by sequence and was verified here: all six motifs appear verbatim in the local G5EDB6 record at the stated positions, Walker A GPPGCGKT at 325, pore loop 1 EFVEVIGGLG at 353, Walker B IIYIDEID at 380, the second region of homology VLASTNRADVLDKALLRPGRFDRH at 432, the zinc motif YHEAGHAL at 554 and the third zinc ligand in SGAQDDLQ at 626, and the two transmembrane segments the run maps are the ones UniProt annotates. ppgn-1 is therefore predicted to be a catalytically active protease, and neither the pseudoprotease nor the assembly-only regulatory-subunit alternative is supported.

    Two premises of the hypothesis were refuted rather than answered. There is no extended coiled coil in any of the six subunits compared, so the assembly determinant maps to the metallopeptidase-domain interface instead; interface typing there favours hetero-oligomer competence with spg-7 but cannot confirm it. And both subunit types are present across nematode clades I, III, IV and V as well as fly, zebrafish and human, so the duplication is not Caenorhabditis-specific.

    Status moved from OPEN to NARROWING, not further: the run states plainly that sequence cannot settle whether a subunit is autonomously active or requires a partner, and human paraplegin makes the point, since it has an intact active site yet is found only in hetero-oligomers. Three caveats are recorded in the boundary. ppgn-1 still has no experimental GO annotation of any kind; the STRING ppgn-1 to spg-7 edge has an experiment score of exactly zero and rests on orthology transfer, so it is not independent evidence of assembly; and the absence of zinc-ion-binding and mitochondrial-inner-membrane terms traces to InterPro signature thresholds rather than to functional loss.

    The run also reports that the worm gene symbols are inverted relative to orthology, with ppgn-1 the SPG7 orthologue and spg-7 the AFG3L2 orthologue. This was not independently checked, since human SPG7 is not in this repository, and no action follows from it here because the review already types the two subunits that way.
