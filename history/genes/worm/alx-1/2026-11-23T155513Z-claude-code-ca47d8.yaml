  summary: Drop NEW row asserting obsolete GO:0070676; no replacement term
  details: |
    Same obsolete term as the SCAMP3 record in this batch: GO:0070676
    'intralumenal vesicle formation', obsoleted 2026-10-20 with no replaced_by,
    only the consider targets GO:0032509 and GO:1990182, reason "the term is not
    clearly defined and usage has been inconsistent". Asserted here on an
    action: NEW row (IMP, PMID:17997305). Found by the corpus scan in issue 6783.

    Change: the row was dropped, with no replacement term. The two genes in this
    batch deliberately diverge.

    Rationale: re-examined against CLAUDE.md's NEW bar, the row did not clear it.
    Its own reason argued from homology and necessity -- ALX-1's conserved role as
    an ESCRT accessory protein "suggests" it promotes ILV formation, and the
    enlarged-MVE mutant phenotype "is consistent with" defective ILV formation --
    which is a plausibility argument plus loss-of-function, not an answer to which
    entity performs the step; budding and scission are ESCRT-III/VPS4 work. Its
    PMID supporting_text was the fragment "2007 Nov 8. A novel requirement for C.",
    a piece of the citation line rather than evidence. And nothing is lost: the
    substance is already carried by GO:0007032 endosome organization (IMP,
    PMID:17997305, ACCEPT) and by the GO:0042176 MODIFY row proposing the MVB
    sorting pathway, so substituting GO:0032509 would have duplicated that
    replacement rather than adding coverage.

    Noticed but not fixed, outside this sweep: core_functions[1] and the GO:0042176
    proposed_replacement_terms use GO:0071985, which QuickGO also reports obsolete
    (replaced_by GO:0032509). just validate worm alx-1 does not flag it despite
    core_functions ids being hard-validated.

    just validate worm alx-1 passes; the two remaining quote warnings are
    pre-existing hash-keyed entries in conf/local_quote_baseline.yaml, unaffected by
    removing a row. Notes recorded in genes/worm/alx-1/alx-1-notes.md.
