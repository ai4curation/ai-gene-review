  details: |
    New review of C. elegans pfd-2 (Q9N5M2, H20J04.5), a beta-class prefoldin subunit. All 8 GOA rows were reviewed. The IBA protein-macromolecule adaptor activity row is MODIFIED to protein folding chaperone. The three HDA muscle-screen locations (ER, sarcomere, dense body) are kept as non-core. Core function: protein folding chaperone in the prefoldin complex. Son 2018 notes that pfd-2 RNAi modestly shortens daf-2 longevity, consistent with a prefoldin-like complex role.
