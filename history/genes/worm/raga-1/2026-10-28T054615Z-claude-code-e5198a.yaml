    Initial review of C. elegans raga-1 (Q22743, TrEMBL). All 17 GOA rows reviewed against cached full texts (PMID:20523893, 23705068, 31411562, 37721956, 40385374; PMID:22560223 abstract in cache, PMC full text read via PubMed). Accepted the RagA/B family IBA rows (GTPase activity, GTP binding, lysosome, Gtr1-Gtr2 complex, positive regulation of TORC1 signaling), with worm phospho-RSKS-1 evidence supporting the TORC1 role. Modified the IGI positive regulation of TOR signaling row to TORC1 signaling. Kept lifespan, growth, autophagy, starvation and nucleus rows as non-core. No NEW annotations proposed. Manual deep-research and notes files written; no provider deep research run.
