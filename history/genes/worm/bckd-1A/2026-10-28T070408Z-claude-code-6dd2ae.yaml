  details: |
    New review of C. elegans bckd-1A (O45924), the BCKDH E1 alpha chain. All 8 GOA rows reviewed: core E1 activity (GO:0003863, EXP and IEA), mitochondrial matrix, BCKDH complex and branched-chain amino acid catabolism accepted; the InterPro oxidoreductase parent modified to GO:0003863 and the UniPathway fatty acid biosynthesis row refined to methyl-branched fatty acid biosynthetic process (GO:1902321) after a comparator check against elo-5/elo-6. The EXP evidence code from PMID:15340492 is flagged as a probable UniProt source defect, since that paper reports RNAi phenotypes and no enzyme assay. Manual literature notes written because no deep-research provider was available.
