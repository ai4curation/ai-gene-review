  details: |
    Created the first AI review of C. elegans nuc-1 (Q17778), the major DNase II-family acid endonuclease. All 17 GOA rows were reviewed against cached literature (Wu 2000, Lyon 2000, Lai 2009, Guo 2010, Yu 2015 x2) and newly cached papers (Hevelone and Hartman 1988, PMID:3228446; Dong 2023, PMID:37523858; PMID:40349596). DNase II activity and apoptotic DNA fragmentation were accepted. Generic DNA endonuclease activity and DNA metabolic process were refined (MODIFY). The TAS nucleus row was marked over-annotated, and the indirect antimicrobial-peptide regulation row was kept as non-core. Lysosomal lumen (IC) and extracellular region (IDA) were added as NEW. Notes were written manually (no deep-research provider), recording the site-of-action controversy and the 2026 preprint PPR1304135.
