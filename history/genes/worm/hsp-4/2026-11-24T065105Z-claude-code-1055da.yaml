  summary: 'IBA over-annotation re-review: GO:0016020 moved to KEEP_AS_NON_CORE'
  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N07). GO:0016020 membrane moved from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE. The IBD at the BiP node PTN001834223 has five seeds, all BiP orthologs with direct membrane observations, and HSP-4 is inside the seeded clade. The earlier reason was that BiP is lumenal and not a membrane protein, which is not a ground because the term covers peripheral association. No more specific membrane term is asserted elsewhere in this review, so TOO_GENERAL (the call for human HSPA5) does not apply. The proposed replacement term (ER lumen) was removed with the action change. No PAINT change.
