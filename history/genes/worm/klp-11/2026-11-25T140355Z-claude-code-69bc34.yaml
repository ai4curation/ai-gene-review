  summary: Record OpenScientist interface analysis for KLP-11 and refutation of neck-linker
    asymmetry
  details: |
    Ran an OpenScientist deep-research job (kgap-klp11-subunit-asymmetry) touching two knowledge gaps on this gene, both moved from OPEN to NARROWING.

    What the published partial structure can support, recomputed from the deposited coordinates: KLP-11's two interfaces are nearly disjoint, 61 residues contacting KLP-20 in the hetero-pairing trigger coiled coil and tail hairpin, 54 contacting KAP-1 from 644 to 721, with only 18 shared positions, all in the folded tail. The trigger helix is exclusively a KLP-20 interface and the final stretch exclusively a KAP-1 interface. The engagement is markedly asymmetric and belongs to KLP-11, which buries roughly twice as much surface on KAP-1 as KLP-20 does, while KLP-20 makes no contact past residue 624. The coiled-coil core carries one asymmetric polar layer, KLP-11 Lys560 against KLP-20 Asn550, with a lysine and a glutamine at the vertebrate equivalents. So a subunit-resolved statement is available for cargo-adaptor anchoring even though none is available for the motor head.

    What cannot be supported, with numbers: the structure resolves 134 of 782 KLP-11 residues and 87 of 646 KLP-20 residues, with zero coverage of the motor domain, neck linker, neck coil and stalk CC1 in both subunits. Since kinesin-2 autoinhibition is reported to need contacts between the motor domains and the C-terminal coiled coil plus tail hairpin, the structure contains one half of that contact pair and not the other, so it cannot support subunit-resolved autoregulation claims.

    One route to working around that is refuted outright, and this is the part I could verify myself. The 11-residue neck linker TLRYANRAKNI is identical in KLP-11 and KLP-20 and in both vertebrate subunits; the local records confirm it directly, at position 333 in klp-11 and 321 in klp-20. There is no neck-linker asymmetry to find in either lineage. The autoinhibitory tail element cannot be assigned to one subunit either, since the kinesin-2 C-terminal domain is annotated once in each of the four proteins.

    Also verified locally: Lys560 of KLP-11, Asn550 of KLP-20, the 782- and 646-residue lengths, and the PDB cross-reference. The contact recomputation, buried-surface areas, coverage percentages and vertebrate alignment equivalents were not independently recomputed. A small numbering caution is recorded in the boundary, that author numbering in the deposited entry runs one higher than UniProt for KLP-11 past residue 644. No annotation action was taken.
