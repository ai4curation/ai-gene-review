  summary: ProtNLM2 prediction rescoring
  details: |
    Both ProtNLM2 predictions kept as UNC (confidence 1): GO:0045182 translation regulator activity and GO:0043022 ribosome binding. Neither term is carried by S6FN32 or the canonical wdr-23 product P90794 in GOA; the re-reviewed gene review assigns ubiquitin-like ligase-substrate adaptor activity in the CUL-4/DDB-1 complex, with no ribosome or translation evidence. PubMed searches (wdr-23, WDR23, DCAF11 with ribosome/translation) found no ribosome-binding or translation-regulator data; human WDR23 ubiquitylates the histone-mRNA factor SLBP (PMID:27203182, newly cited and cached), which is substrate-adaptor activity not translational regulation. Donor is RACK1, a different WD-repeat lineage.
