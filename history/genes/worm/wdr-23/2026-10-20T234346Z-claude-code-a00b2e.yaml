  summary: Full re-review of wdr-23 (S6FN32, D2030.9d N-terminally short product)
  details: |
    Full independent re-review of S6FN32. Recorded identity: S6FN32 = P90794 (WDR-23A) residues 74-571 / P90794-2 (WDR-23B) 33-530, lacking both isoform-specific N termini but retaining all WD repeats and both DDB-1-binding DxR boxes (R269/R316 = WDR-23A R342/R389). GOA has no rows for S6FN32 (all on P90794). Added three NEW core annotations grounded in PTHR19847:SF7 / PAINT PTN000457302 and gene-level experiments, including the Hasegawa 2010 exon4-11 cDNA rescue that matches this product: GO:1990756 (replacing generic GO:0060090), GO:0080008, GO:0043161. Nucleus and organismal phenotype terms deliberately not assigned. Removed all dependence on prediction source files; rewrote bioinformatics script to use UniProt-derived inputs only and deleted the prediction-dependent isoform comparison. Relative: human DCAF11 (Q8TEB1), complete review exists.
