  summary: Narrow the MEX-6 RNA-specificity gap with an OpenScientist tandem zinc
    finger analysis
  details: |
    Ran OpenScientist (3 iterations) on the MEX-6 tandem zinc finger. Mapped the 30 RNA-contacting positions of RNA-bound TIS11d onto MEX-6 and MEX-5; identical at 27/30 including the specificity discriminator (Arg/Lys, not the TTP Glu). Calibrated against family pairs with known specificity, this predicts MEX-6 binds the same U-rich elements as MEX-5, not TTP-type AU-rich elements. Both C3H1 fingers confirmed in the local record; no AU-rich element term present. Gap OPEN -> NARROWING; run reference UNVERIFIED.
