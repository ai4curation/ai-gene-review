  summary: 'Create review: REL1'
  details: |
    Reviewed all 15 GOA annotations for T. brucei REL1 (TbMP52, mitochondrial RNA-editing ligase 1). Accepted RNA ligase (ATP) activity, mitochondrion (IDA/IEA/ISS/RCA) and mitochondrial mRNA editing complex (IDA/IEA/RCA); modified generic ligase activity to RNA ligase (ATP) activity, RNA modification (IDA, IEA) to mitochondrial mRNA modification (GO:0080156), and the TrypTag cytoplasm call to mitochondrion; kept ATP binding and kinetoplast as non-core. Core function: ATP-dependent RNA ligase of the editosome deletion subcomplex. Automated deep research was unavailable, so a manual literature review (UniProt, PMIDs 11134327, 11251122, 15465048, 14536071, 20660476, 26991453) was recorded in REL1-notes.md instead.
