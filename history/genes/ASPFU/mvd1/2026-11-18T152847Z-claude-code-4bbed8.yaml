  summary: 'Create review: mvd1 (Aspergillus fumigatus Af293)'
  details: |
    New review of A. fumigatus diphosphomevalonate decarboxylase mvd1 (Q4WNV9, AFUA_4G07130, PTHR10977:SF3), a PE 3 entry with no direct experimental data. All 8 GOA rows reviewed: 7 ACCEPT (GO:0004163 IBA/IEA, GO:0019287 IBA/IEA, cytosol IBA/IEA, GO:0008299 IEA) and GO:0016831 carboxy-lyase activity TOO_GENERAL (IPR005935 also covers phosphomevalonate decarboxylases). The PTN000104601 IBAs were checked against the PTHR10977 tree (fungal subclade PTN000104638, no PAINT loss). One NEW row, GO:0006696 ergosterol biosynthetic process (ISS from S. cerevisiae MVD1), supported by the A. oryzae ortholog AoErg19 (PMID:31156588: rescue of yeast erg19 ergosterol deficiency; overexpression lowers ergosterol); the comparator check was positive (A. fumigatus erg12 and erg8 IBA, yeast MVD1 IDA). Cytosol rows accepted despite the vacuolar signal of overexpressed AoErg19 DsRed fusions, which is discussed in the review. A suspected UniProt CC:FUNCTION source defect (vacuole sentence, CHECK) is recorded. Validated with just validate ASPFU mvd1 (UV_NATIVE_TLS noise warnings only) after backfill-record-sections.
