  summary: Wire OpenScientist finding of a rank asymmetry that is explicitly not a
    division of labour
  details: |
    Wired an OpenScientist run (kgap-erg13a-paralog-division) into the knowledge gap on
    the respective in-vivo contributions of the duplicated A. fumigatus HMG-CoA
    synthases. Status OPEN -> NARROWING. The paralogues still cannot be distinguished
    functionally, but the question is sharpened and one tempting answer is explicitly
    refused.

    Each of the three axes the prompt specified fails, for a different reason:
    - Catalytic integrity fails because both proteins are intact. Every active-site and
      substrate-binding residue of the family is present in both, in register with the
      characterised yeast and human enzymes, so neither is a degenerate copy. That route
      to an answer is closed rather than merely unexplored.
    - Measured expression fails because exactly one published dataset resolves both loci
      and it moves them in the same direction.
    - Requirement fails because it is empty: neither gene has ever been deleted,
      repressed or called essential, and no double perturbation has been attempted.

    A compartmental division of labour was already excluded by the erg10A run earlier in
    this campaign, which found neither paralogue mitochondrial, so that reading was off
    the table from the start and the prompt said so.

    What the run establishes instead is an asymmetry of RANK, on three independent
    sequence-level lines the gap did not name, with erg13B principal and erg13A
    accessory: an ancestral Eurotiomycete duplication splitting into two reciprocally
    monophyletic clades, with the erg13B clade retained in all seven species sampled
    while the erg13A clade is absent from A. nidulans and T. marneffei (sign test p =
    0.016); erg13A sitting 63,094 bp from the end of chromosome 8, inside the
    sub-telomeric 100 kb, against erg13B 1,316,463 bp from the nearest end of chromosome
    3, 20.9-fold further in; and markedly stronger codon adaptation in erg13B (CAI 0.587
    at the 96.2nd percentile against 0.454 at the 86.7th, paired bootstrap p = 0.0003),
    surviving chromosome, GC3 and gene-length confound checks.

    The run then draws the distinction that governs the curation decision, and this
    review adopts it: rank is not division of labour. Codon bias indexes average
    translation, chromosomal address predicts population-level dispensability, and clade
    retention predicts that an erg13A-type gene is dispensable somewhere in the group.
    None says which reaction either protein performs, and the reaction is identical in
    both. So no GO term assigning a branch of isoprenoid biosynthesis to one paralogue is
    supportable, and none is proposed. That refusal is the most useful thing in the run.

    The separating experiment is the double-perturbation design already used in this
    organism for ERG11A/ERG11B: delete one paralogue, put the other under a repressible
    promoter, and score growth, ergosterol content and triacetylfusarinine C output under
    iron starvation and hypoxia.

    Verified here against both entries' own records (467 and 460 residues): the catalytic
    triads of both paralogues - erg13A Glu86/Cys118/His259 and erg13B Glu86/Cys120/His263
    - all six positions confirmed, which is what closes the degenerate-copy route.

    Citation check: the run reported a confabulation rate of 0.143, its two "unresolved"
    identifiers being PMID:18787699 and PMID:25375670. Both were checked against PubMed
    and are real, on-topic records - an A. fumigatus expression study during infection
    initiation, and an SrbA ChIP-seq and hypoxia transcriptome study. So both were lookup
    failures. This is the third run in this campaign where that flag was a transport
    failure rather than a confabulation, and it should not be read as a confabulation
    signal without a check.

    Not reproduced here: the phylogenetic clade analysis and sign test, the chromosomal
    distance measurements, the codon-adaptation comparison with its bootstrap and
    confound checks, and the reading of the single expression dataset.

    No annotation action changed.
