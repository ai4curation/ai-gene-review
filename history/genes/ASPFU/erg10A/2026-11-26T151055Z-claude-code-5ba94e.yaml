  summary: 'Wire OpenScientist inventory: beta-oxidation and ketone-body system excluded,
    acetoacetate module from leucine, assignment still open'
  details: |
    Wired an OpenScientist run (kgap-erg10a-mitochondrial-pathway) into the knowledge
    gap asking which mitochondrial pathway uses AfErg10A's acetoacetyl-CoA thiolase
    activity. Status OPEN -> NARROWING. The assignment is not settled, but two
    candidates are excluded and one premise of my own prompt is refuted.

    Premise refuted. My prompt proposed that an absent succinyl-CoA:3-oxoacid
    CoA-transferase would make ketone-body utilisation impossible and remove the
    mammalian analogy. A. fumigatus Af293 has three full-length family I 3-oxoacid
    CoA-transferases - Q4WLU8, Q4WK09, Q4WEZ2 - at 56.6, 54.0 and 48.6% identity to
    human OXCT1, with matching InterPro/Pfam assignments and mitochondrial-type
    presequences, and the Ach1-type acetyl-CoA hydrolase is ruled out as a confounder
    because it is a separate non-homologous gene. Acetoacetate activation is permitted,
    so the absent-enzyme argument is unavailable and has been dropped rather than
    retained.

    What the inventory does settle. No mitochondrial-type HMG-CoA synthase: both
    paralogues, Q4WBQ3 and Q4WXT8 - which are this corpus's own erg13A and erg13B, an
    independent check I confirmed locally - have N-terminal net charges inside the
    cytosolic control range against a mitochondrial control median of +5. No credible
    3-hydroxybutyrate dehydrogenase: the sole candidate is a generic SDR at 22.3%
    identity to human BDH1. So the organism has an acetoacetate module, not a mammalian
    ketone-body system, and its acetoacetate comes from leucine via a clustered locus
    set plus a mitochondrial-type HMG-CoA lyase; across 15 fungal proteomes the
    transferase and the leucine module co-occur in 14 of 15.

    Terminal beta-oxidation is excluded for this protein on two independent grounds:
    Erg10A is ACAT-clade (50.1% to human ACAT1, 47.4% to yeast Erg10, but 36.1% and
    35.6% to the ACAA-clade enzymes), and the organism keeps four separate ACAA-clade
    thiolases for the 3-ketoacyl-CoA step, of which a PTS2 analysis marks two
    peroxisomal and one - no PTS2, net charge +6 - as the mitochondrial counterpart. The
    mitochondrial thiolysis step therefore has a dedicated enzyme that is not this one.

    Two things stay open, and one answers a prompt question negatively. Essentiality
    supports no pathway assignment at all, because every candidate route is dispensable
    in fungi, so the essential phenotype must be explained by something other than a
    choice among these pathways. And isoleucine catabolism cannot be separated from the
    acetoacetate loop, because the discriminating measurement - activity on
    2-methylacetoacetyl-CoA - has never been run on this enzyme.

    Verified here: Q4WBQ3 and Q4WXT8 match this corpus's erg13A and erg13B entries
    exactly, and this entry is the 433-residue reviewed record whose curated name and EC
    come from the same publication the gap cites. Not reproduced here: the
    Smith-Waterman identity figures, the N-terminal charge statistics, the PTS2
    assignments, the InterPro and Pfam lookups for the transferase candidates, and the
    15-proteome co-occurrence test. The three transferase candidates are unreviewed
    entries with no experimental characterisation, which the run states, so they show
    the chemistry is possible rather than that it happens.

    No annotation action changed.
