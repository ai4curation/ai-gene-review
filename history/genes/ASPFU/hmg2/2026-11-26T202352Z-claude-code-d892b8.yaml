- type: EDIT
  outcome: changed
  summary: 'Wire OpenScientist result: sequence decay excluded, the iron-chelation
    expression signal refuted with an internal control'
  details: |
    Wired an OpenScientist run (kgap-hmg2-paralog-contribution) into the knowledge gap
    on the individual in-vivo contribution of the weakly expressed hmg2 paralogue.
    Status OPEN -> NARROWING. The contribution remains unresolved, but one sub-question
    is closed and the one candidate signal is refuted.

    The unresolved verdict has a specific cause rather than being a weighing of
    conflicting data: no experiment has ever deleted, depleted, overexpressed or
    enzymatically assayed hmg2 in any organism, and no hmg1 null allele has been
    published, so the genetic background in which a Hmg2 contribution would become
    visible has never been constructed. Everything in the record is sequence inference
    or transcript abundance, and neither can answer a flux question.

    Closed: sequence decay. Hmg2 carries the complete class I HMG-CoA reductase
    catalytic tetrad at E744, K877, D953, H1049, computed independently by
    Needleman-Wunsch against human HMGCR, plus eight transmembrane helices, a
    sterol-sensing domain at 233-403 and all four class I motifs; the lineage is
    retained with the tetrad intact across Aspergillus section Fumigati at 90.1-93.6%
    catalytic-domain identity. A decayed copy would have answered the question outright
    and this is not one.

    Refuted: the expression signal. hmg2 appeared to rise 5.2-fold under iron chelation
    in one medium of GSE256524. Reparsing the full 9907-gene x 24-sample matrix with the
    siderophore pathway as an internal positive control shows that rise is noise: the
    TAFC cluster is induced 30x-870x reproducibly in both media of the same experiment
    (sidD +9.76 and +7.82 log2FC, sidF +9.52 and +6.67, sidI +8.82 and +5.81, with the
    iron-sufficiency repressor sreA down), while hmg2 inverts sign between media and sits
    at the 74.7th percentile of 584 abundance-matched genes. The control is what makes
    this negative worth having - the same analysis demonstrably detects the response it
    was looking for elsewhere in the same data, so the negative is powered rather than
    merely inconclusive.

    Curation consequence, carried forward from the erg13A run and holding here: intact
    catalytic machinery licenses a molecular-function annotation by similarity and
    nothing more; weak expression ranks the paralogue; clade retention says the gene is
    maintained for something; none of them says which reaction branch it serves when the
    reaction is identical in both paralogues. The run's GO audit finds the current
    annotation state already correct and names the term at risk: GO:1900551
    triacetylfusarinine C biosynthetic process is the pair's only experimental
    annotation, sits on Hmg1 by IMP from PMID:22106303, and must not propagate to Hmg2.
    I confirmed that term does not appear on this review, so it is a constraint to
    respect rather than a defect to fix.

    Verified here against the entry's own record (1062 residues): E744, K877, D953,
    H1049 are exactly the four ACT_SITE features the record carries, so the run's
    independently computed alignment positions agree with the curated features position
    for position. Not reproduced here: the transmembrane and sterol-sensing assignments,
    the cross-species identities, the expression-matrix reparse and its percentile, and
    the GO audit.

    No annotation action changed.

    Operational note: this run completed and wrote its full report at 19:45 before the
    session worker restarted at about 20:20. The restart emptied the process list, so the
    job appeared dead; the output was intact. plsY, submitted in the same batch, wrote
    nothing and was resubmitted.
