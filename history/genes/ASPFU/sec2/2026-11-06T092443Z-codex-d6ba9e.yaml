  details: |
    Created the Aspergillus fumigatus sec2 review in the PTHR14430 fungal Sec2/Rabin3 family. Accepted the Opisthokonta PTN000374167 guanyl-nucleotide exchange factor IBA and the fungal PTN001024876 cell-tip IBA as sound transfers for the long Aspergillus Sec2 ortholog. Cached and reviewed Liu et al. 2025 for direct AFUA_3G06430/sec2 deletion and complementation phenotypes, and kept its autophagy, cell-wall-stress, hyphal morphology and virulence data as context rather than adding unsupported downstream process annotations.
