  summary: Record OpenScientist finding that the erg13 paralogs are regulatorily,
    not catalytically, diverged with erg13B the retained copy
  details: |
    Ran an OpenScientist deep-research job (kgap-erg13b-paralog-divergence) on the gap covering the respective in-vivo contributions of the duplicated A. fumigatus HMG-CoA synthases. It refutes the expectation the hypothesis itself offered, that the paralogs would be too similar for sequence to separate them, and then answers the divergence question across three iterations.

    The pair is only 61.0 per cent identical over 454 ungapped columns, and erg13B is closer to the characterised S. cerevisiae Erg13 at 63.6 per cent than to its own paralog, a value Ensembl Compara reproduces. A pair that divergent is sequence-distinguishable.

    Three measurements follow. First, no asymmetric loss of catalytic machinery: both proteins keep the complete Cys-His-Asn triad, the catalytic Glu and every audited CoA-binding position, with zero positions conserved in one copy and lost in the other, and the same holds for six copies in an independently duplicated dermatophyte lineage. The erg13B residues are Glu86, Cys120, His263 and Asn340, all four confirmed in the local record, which independently annotates ACT_SITE at 86, 120 and 263.

    Second, the selection asymmetry is real and about 2.8-fold, with erg13B the constrained copy: a Mantel-Haenszel common odds ratio of 2.89 at p = 1.1e-12 across four strata in two lineages, both copies still strongly purifying at omega 0.03 to 0.09. The route matters because the run corrected itself twice. An initial 2.75-fold dN difference rested on a saturated comparison, which it stated rather than hid. The one unsaturated Aspergillus pair gave a 4.00-fold dN excess but also a 1.73-fold higher dS at the erg13A locus, so part of the raw excess is a faster local rate, and the count-based test conditioning out local rate reached only p = 0.154 on 25 differences. It was settled only by adding dermatophytes, where three independent species pairs replicate at odds ratios 2.98, 3.00 and 2.87, the per-stratum ratios staying flat across a four-fold range of synonymous divergence, which is what shows saturation is not generating the signal.

    Third, the orthology makes erg13B the copy that matters: the duplication sits at the Pezizomycotina node, and across 341 species 150 retain the B-type copy alone, 12 retain both, and none retain the A-type copy alone.

    The predicted difference is therefore regulatory rather than catalytic. No targeting signal partitions the pair, neither protein carrying a PTS1 tripeptide nor the yeast enzyme's N-terminal extension, and the local record confirms the erg13B C-terminus as IKA. What distinguishes them is genomic context: erg13B sits among ribosomal, ATP synthase, Arp2/3 and Rab GTPase genes, erg13A among secreted hydrolases, transporters and three Zn2Cys6 transcription factors, the signature of conditionally induced metabolism. For this gap that constrains the relative contributions without measuring them: erg13B is predicted to carry the constitutive mevalonate requirement and erg13A a conditional one.

    It establishes no flux, and the run says so: every result is sequence-level, neither protein has been assayed, no expression measurement was made, and the regulatory reading rests on genomic neighbourhood and rate asymmetry, both inferences. The run also withdrew an iteration-1 claim that the duplication spans Aspergillus section Nigri.

    One error of mine is recorded rather than hidden. The run reports catalytic positions as paired numbers whose order is erg13B first and erg13A second. I initially read them the other way round, which made three of the four appear to mismatch the local record; the record's own ACT_SITE annotations at 86, 120 and 263 resolved it. A caution to that effect is in the boundary for anyone reading the run directly. This is the same class of error as the chimera-numbering misreading recorded earlier in this campaign on GSDMD.

    Gap status moved from OPEN to NARROWING. No annotation action was changed.
