  details: |
    Created a de novo Aspergillus nidulans cbr1 GO review focused on the fungal CBR1-like branch of PTHR19370. Reviewed all 16 GOA rows; accepted the inferred mitochondrial outer membrane and Dph3-dependent tRNA wobble/diphthamide process assignments, modified broad NADH dehydrogenase, NAD(P)H cytochrome-b5 reductase, and InterPro oxidoreductase rows to GO:0090524, split the core cytochrome-b5 reductase and proposed Dph3 reductase activities, and modified the GO:0090560 row to a proposed NADH-dependent Dph3 reductase activity term. Audited the family-wide PANTHER:PTN001833551 IBA assignment against cached PTHR19370 PAINT data and recorded a node-level propagation review. Read cached PMID:27694803 and PMID:34154323 evidence, searched for newer Aspergillus-specific cbr1 literature, and found no newer direct Q5AZB4 functional paper. Validated with UV_FROZEN=1 just validate EMENI cbr1 and regenerated cbr1-ai-review.html. The generated session id retains the helper's default claude-code actor token; the actor block records codex as the actual tool for this session.

    Follow-up review fixes added the missing UniProt complex-membership support for contributes_to GO:0090560 and the Dph3 reductase core function, cited the RHEA:71231 UniProt reaction on the proposed NADH-dependent Dph3 reductase term, and incorporated GO-CAM index evidence for PomBase cbr1 in the fungal ergosterol model and mouse Dph3 as the electron-transfer component in the diphthamide model.
