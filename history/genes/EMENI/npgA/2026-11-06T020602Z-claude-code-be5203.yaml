  summary: Review EMENI npgA PTHR12215 annotations
  details: |
    Created the Aspergillus nidulans npgA review for the PTHR12215 Sfp-type 4'-phosphopantetheinyl transferase family. Reviewed all nine seeded GOA rows, accepted the PTN000259224 cytosol and transferase IBAs and the PTN000954835 fungal L-lysine biosynthesis IBA, treated magnesium binding as non-core, and modified the broad GO:0051604 protein maturation IBA to a proposed carrier-protein 4'-phosphopantetheinylation process term. The review cites the GOA-seeded NpgA catalytic papers, the UniProt-cited npgA/cfwA penicillin, siderophore and secondary-metabolism papers, and the local PTHR12215 PAINT rows.
