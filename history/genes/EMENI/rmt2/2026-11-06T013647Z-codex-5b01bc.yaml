  summary: Create EMENI rmt2 PTHR32379 review
  details: |
    Created a de novo EMENI rmt2 review from the Q5B058 UniProt record, the local PTHR32379 PAINT snapshot, cached budding-yeast RMT2 experimental papers, and manual PubMed/web searches.

    Accepted the PAINT fungal-node protein arginine N5-methyltransferase IBA, accepted broad nucleus/cytoplasm localization transfers, treated the InterPro protein-arginine N-methyltransferase mapping as too general relative to GO:0019702, and marked the Ensembl translational-fidelity transfer as over-annotated for Aspergillus without direct reporter or ribosome assays.
