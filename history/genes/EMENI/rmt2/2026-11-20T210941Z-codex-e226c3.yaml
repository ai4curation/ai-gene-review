  summary: Create EMENI rmt2 PTHR32379 review
  details: |
    Created a de novo Aspergillus nidulans rmt2 review for the PTHR32379 Rmt2/GAMT family after fetching UniProt accession Q5B058 with the rmt2 alias, inspecting the local PAINT slice, reading the completed yeast/pombe/Neurospora Rmt2 reviews, and searching for direct A. nidulans rmt2 literature. Accepted the fungal PTN001285370 protein arginine N5-methyltransferase IBA, accepted root nucleus/cytoplasm localization transfers, accepted the EnsemblFungi GO:0019702 orthology transfer, marked the broad InterPro2GO PRMT row as TOO_GENERAL, and flagged EnsemblFungi transfer of the budding-yeast translational-fidelity process as over-propagated without direct A. nidulans ribosome-function evidence.
