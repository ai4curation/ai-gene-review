  summary: Full re-review of flbB as the experimental reference for the FlbB clade
  details: |
    Independent of ProtNLM2. Placed flbB in PTHR40621:SF6 FlbB clade (separate from the Yap1 clade that supplied the IBA donors; shared ancestor PTN008082960) and kept only the generic bZIP IBA terms. Refined general terms to descendants the gene already carries: GO:0003700 to GO:0001228, GO:0006355/GO:0006357 to GO:0045944, GO:0003677 to GO:0000976 (ChIP at the brlA promoter). Core MF is now GO:0001228; core processes are GO:0045944 and GO:0075307. Cached and cited PMID:26256571, PMID:25701285 and PMID:31065746 (tip-to-nucleus dynamics, the FlbE/FlbD dependence, the RNA-seq targets). Rewrote the description and added a quote to every row. Recorded that the N. crassa ortholog knockout conidiates normally (PMID:21423749), as a caution for transfer. Falcon deep research failed (authentication), and this is recorded in the notes.
