  summary: 'Create review: mstE (A. nidulans low-affinity glucose transporter)'
  details: |
    De-novo review of all 15 GOA rows, independent of ProtNLM2 predictions; reference for transfer to SF92 ortholog NEUCR/glt-1. Deep research failed (falcon auth error; perplexity-lite quota), so the review rests on directly read literature: PMID:16418173 (abstract only), plus full-text PMID:24751997, 24282591, 28361917, 28115989, 33509260. New bioinformatics (panther_placement.py, tm1_site.py, RESULTS.md) confirms MstE and GLT-1 are SF92 orthologs meeting at speciation node PTN002362094 and that MstE is not a seed of the family-root carbohydrate:proton symporter IBD. ACCEPT: D-glucose transmembrane transporter activity (IDA, IMP), D-glucose transmembrane transport (IMP), plasma membrane (IDA). MODIFY general membrane/transporter/transport terms to those specific terms. MARK_AS_OVER_ANNOTATED: carbohydrate:proton symporter activity (IBA) and derived proton transmembrane transport (energetics untested; non-acidic TM1 Ser67). UNDECIDED: mannose transporter activity/transport and vacuole (AspGD IDA from inaccessible full text).
