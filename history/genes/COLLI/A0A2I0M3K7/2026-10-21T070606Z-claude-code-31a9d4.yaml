  summary: 'Full re-review: A0A2I0M3K7 (pigeon TRUB2 truncated gene model)'
  details: |
    Full re-review independent of ProtNLM2 predictions. Identified A0A2I0M3K7 as an N-terminally truncated WGS gene model (142 aa = human TRUB2 178-307, 72.7% identity) lacking catalytic D98 and transit peptide (new bioinformatics/RESULTS.md). Withdrew tRNA Psi55-specific refinements (GO:0160148, GO:0070902) because PAINT node PTN000324318 deliberately projects only GO:0009982, GO:1990481, GO:0070131 and GO:0005759 from human TRUB2. GO:0009982 now ACCEPT; GO:0001522 and GO:0009451 MODIFY to GO:1990481; GO:0006396 kept over-annotated with corrected rationale (RNA modification is not under RNA processing); NEW mitochondrial matrix. Core function and description rewritten; deep-research quote fixed to verbatim and reference marked not used.
