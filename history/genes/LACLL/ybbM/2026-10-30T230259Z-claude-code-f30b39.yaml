  summary: New review of L. lactis plasmid UPF0014 permease ybbM (G1FE25) and the
    KBase dashboard call for NZ_CP016699.1_28
  details: |
    Review of KBase gene-annotate dashboard protein NZ_CP016699.1_28 (L. lactis strain 275 plasmid p275A), filed on UniProtKB G1FE25 (98.8% identical; the exact-sequence entry A0A1V0NBR7 was deleted). Accepted plasma membrane IEA; kept membrane as non-core. Added ABC-type transporter activity (contributes_to), ABC transporter complex and transmembrane transport by ISS. Did not add iron ion transport: the query scores 359.9 bits against the NCBIfam FetB equivalog TIGR00245, below its 410-bit trusted cutoff (E. coli FetB 476.8), and the family includes the rice UDP-glucose transporter STAR2. Dashboard predictions scored COR (ABC-type transporter activity), UNC (iron ion transport) and UNC (stress response to nickel ion, a single Klebsiella fitness phenotype). Bioinformatics in ybbM-bioinformatics/ (pyhmmer, plasmid neighbourhood).
