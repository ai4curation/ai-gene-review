  summary: De novo review of RBMP2 (Cre09.g416850), a pyrenoid tubule membrane protein
    that builds the CAH3-hosting reticulated region
  details: |
    GOA had no annotations. Added NEW pyrenoid tubule (IDA, PMID:33177094) and thylakoid membrane organization (IMP, PMID:42427617, bioRxiv preprint cached in this session). No MF asserted: the rhodanese domain has no cysteine (Asp in the catalytic position), and the Rubisco-binding motifs are dispensable for reticulated-region formation, so neither sulfurtransferase nor adaptor activity is supported. Added a reproducible sequence check under RBMP2-bioinformatics/. Deep research unavailable (falcon HTTP 402, perplexity missing).
