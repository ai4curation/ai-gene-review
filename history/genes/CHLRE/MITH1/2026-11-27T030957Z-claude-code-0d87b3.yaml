- type: EDIT
  outcome: changed
  summary: 'Add reproducible membrane-element scan with a coiled-coil control: amphipathic
    helix excluded, two candidates localised to the disordered N-terminus'
  details: |
    Added a local, reproducible sequence scan for the MITH1 molecular-activity gap and
    wired its result into the gap boundary. The gap KEEPS status OPEN: it asks what
    activity MITH1 performs, and no activity has been established. What changed is that
    one candidate mechanism is excluded and the search is narrowed to a defined region.

    Why local analysis. The OpenScientist run intended for this gap
    (kgap-mith1-membrane-element) could not be obtained; the service has returned nothing
    for any submission after 2026-11-26 19:52 (five runs, four genes; see
    genes/BACSU/plsY/plsY-notes.md).

    New files:
    - genes/CHLRE/MITH1/MITH1-bioinformatics/membrane_element_scan.py - stdlib only, no
      network, reads ../MITH1-uniprot.txt, hardcodes no results.
    - genes/CHLRE/MITH1/MITH1-bioinformatics/RESULTS.md
    Every figure quoted in RESULTS.md was checked against a fresh run.

    The script was built around a CONTROL rather than a ranking, which is the whole point.
    624 of 1304 residues (47.9%) are annotated coiled-coil, and coiled coils present
    periodic hydrophobic faces that score as amphipathic helices by construction. So every
    window is reported with whether it sits inside an annotated COILED region, and each
    score distribution is compared between coiled and non-coiled positions.

    Result 1, negative and useful: an amphipathic-helix mechanism is NOT supported. All
    five top-scoring Eisenberg hydrophobic-moment windows lie inside annotated coiled
    coils; the best window outside reaches +0.519 against +0.572 inside, with means +0.214
    outside and +0.255 inside. Nothing amphipathic separates from the coiled-coil
    background. This is exactly the false positive the control was designed to catch.

    Result 2, two candidates that do separate, both in or beside the annotated
    low-complexity region 60-180:
    - most basic 18-residue window 71-88 at net charge +8, exceeding every coiled-coil
      window (best inside +4), means +0.560 outside against +0.051 inside;
    - most hydrophobic window 179-196 at mean Kyte-Doolittle +1.789 against a best of
      +0.506 inside.
    A basic patch engaging anionic lipid headgroups is a recognised peripheral mechanism,
    and this is where to look.

    Why those remain candidates and not findings, stated in RESULTS.md and in the
    boundary: low-complexity and disordered regions commonly carry skewed composition, so
    a charge extreme inside one may be composition bias that this scan cannot distinguish
    from a functional patch; 1287 windows were scored with no multiple-testing correction;
    and although the 179-196 hydrophobicity reaches the range a TM helix would occupy, the
    record annotates no TRANSMEM segment and the published detergent-sensitive
    co-pelleting argues against one, so that window must not be read as membrane-spanning.

    Nothing here identifies a lipid, a leaflet or a mechanism, and nothing here tests
    binding. No molecular-function term is supportable and none is proposed. No annotation
    action changed.

    Gap 1 in this file is an ONTOLOGY gap (GO has no pyrenoid tubule biogenesis term) and
    was deliberately not targeted: that belongs in proposed_new_terms, not in research.
