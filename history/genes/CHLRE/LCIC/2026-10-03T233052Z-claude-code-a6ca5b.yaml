  summary: De novo review of LCIC (Q75NZ1), LCIB paralog in the stromal LCIB/LCIC
    complex
  details: |
    GOA had no rows. Added NEW chloroplast stroma (IDA, PMID:28938113) and zinc ion binding (IDA, PMID:27911826, PDB 5B5X). Core function: LCIB/LCIC complex subunit in chloroplast stroma at the pyrenoid periphery, required for LCIB relocalization. Carbonate dehydratase activity deliberately not asserted for LCIC, because recombinant LCIC and the native LCIB-LCIC complex were CA-inactive in vitro (Jin 2016) and only LCIB has complementation evidence (Kasili 2023). Proposed new complex term LCIB-LCIC complex. Deep research unavailable (falcon 402, perplexity missing).
