  summary: Re-review of LCI5 as EPYC1, the pyrenoid Rubisco linker/condensate scaffold
  details: |
    Recognised LCI5 (Q94ET8, Cre10.g436550) as EPYC1 (PMID:27166422, PMID:28938114). GOA has no rows; replaced earlier NEW proposals (protein binding, cation binding, thylakoid membrane, carbon utilization, photosynthesis, response to CO2) with NEW GO:0140693 molecular condensate scaffold activity (IDA PMID:30498228), GO:1990732 pyrenoid (IDA PMID:27166422), GO:0140694 membraneless organelle assembly (IMP PMID:27166422; participation test passed as scaffold case) and non-core GO:0009570 chloroplast stroma (IDA PMID:28938114). Core function: condensate scaffold in pyrenoid. Added references incl. newly cached PMIDs 41845050 (KEY1 kinase), 31504763, 36611062, 42601498 with reference_review blocks; reinterpreted 2006 thylakoid localization (PMID:16572472) as DISPUTED. Rewrote description, notes, questions, experiments, knowledge gaps. Resolves FUNCTION_UNREVIEWED for modules/pyrenoid_ccm.yaml epyc1_linker.
