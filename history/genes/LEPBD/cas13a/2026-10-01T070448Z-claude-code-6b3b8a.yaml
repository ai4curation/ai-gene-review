  summary: 'Create review: LbuCas13a/C2c2 (C7NBY4), type VI-A RNA-targeting CRISPR
    effector'
  details: |
    Completed review from seeded stub; GOA held zero annotations, so both rows are NEW. GO:0004521 RNA endonuclease activity (IDA, PMID:27669025) covering both activities, which are separable in both directions by mutation (HEPN mutants keep processing; R1079A keeps target cleavage) and differ in metal requirement and product chemistry. GO:0099048 CRISPR-cas system asserted with evidence code IC, not IMP and deliberately not ISS from P0DOC6: no interference phenotype exists for this ortholog, and PMID:28475872 found the Cas13a family splits into two functionally orthogonal groups whose specificities cannot be predicted bioinformatically, so propagating specificity within the family is unsafe. GO:0051607 deliberately NOT asserted for the same reason. Two core_functions. Two proposed new terms, identical to the P0DOC6 review for merging. Recorded that UniProt's 'Also targets DNA (PubMed:40542106)' is not a DNase claim: that abstract states explicitly that LbuCas13a does not degrade DNA targets, so no DNA nuclease function is asserted. Diagnostics applications deliberately excluded. Notes file written in place of deep research (no provider API keys available).
