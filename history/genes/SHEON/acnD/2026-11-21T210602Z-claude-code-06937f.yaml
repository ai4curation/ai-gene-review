  summary: 'IBA REMOVE re-review: IRE binding IBA changed to MARK_AS_OVER_ANNOTATED'
  details: |
    Re-review of the two IBA REMOVEs. GO:0006099 (IBD at PTN000186788) stands unchanged on direct evidence of loss (PMID:14702315). GO:0030350 iron-responsive element binding (IBD at the family root PTN000186700) changed from REMOVE to MARK_AS_OVER_ANNOTATED. Eight of nine seeds are animal IRP1/IRP2 in PTN000186701, but the ninth, M. tuberculosis aconitase O53166 (IDA, PMID:17384188), sits in PTN007525429, a sister of the proteobacterial clade PTN002268880 that holds AcnD, so the old lineage argument was incomplete, and the other stated ground was absence of RNA-binding data on AcnD, which is not a ground for removal. No loss of apo-protein RNA binding is shown for the AcnD subclade PTN002617363; the root placement is too deep for a term defined on canonical IREs. Treated like the E. coli and Salmonella acnA reviews, which do not remove the row. Quotes untouched. The PTHR11670 family review still says this review removes the term.
