  summary: 'Create review: SHEON prpF (Q8EJW4)'
  details: |
    De-novo review of S. oneidensis PrpF, the experimentally characterised PTHR43709:SF2 member that seeds PAINT IBD PTN002017920 (GO:0016863); reference for the BORPE Q7VZI5 ProtNLM2 re-review, done independently of ProtNLM2 output. Falcon and perplexity-lite deep research both failed (auth/quota), so the review rests on three full-text papers (PMID:14702315, PMID:17567742, and newly cached PMID:29145506). All 7 GOA rows reviewed: generic isomerase activity MODIFY to GO:0016863; GO:0016863 (IDA/IBA/IEA) and propionate catabolic process (IDA x2/IEA) ACCEPT. Proposed NTR methylaconitate isomerase activity; GO:0047614 deliberately not added because it fits only the in vitro aconitate model reaction. Notes record which functions are established in this species versus inferred, and that only the EC 5.3.3-level term is safe to transfer within heterogeneous SF2.
