  summary: Correct GO id cited in GO:0016722 decline rationale
  details: |
    The GO:0016722 reason cited GO:7770068 as the NADPH-coupled child of GO:0000293 ferric-chelate reductase activity. GO:7770068 is real but is 'ferric iron reductase activity', a parent of GO:0000293; the NADPH-coupled child is GO:0052851 ferric-chelate reductase (NADPH) activity (is_a GO:0000293, verified in QuickGO 2026-10-28). Replaced the id in the reason; the earlier history record's details carry the old id and are superseded by this record. PMID:15280383 for the NrfB comparator was verified via QuickGO (P0ABL1 GO:0019645 IDA, EcoCyc).
