  summary: Create gene review for Shewanella oneidensis MR-1 CymA (Q8E8S0), inner-membrane
    tetraheme menaquinol dehydrogenase
  details: |
    De novo review of Q8E8S0 (CYMA_SHEON, Swiss-Prot), created for the CMMMech
    protein-grounding effort: ten CMMMech material records ground microbial
    metal-reduction mechanisms to this accession.

    All 15 GOA rows reviewed, no PENDING left. Actions: 11 ACCEPT (four EXP and one
    IEA row on GO:0008121 quinol-cytochrome-c reductase activity, three EXP and one
    IEA row on GO:0005886 plasma membrane, the GO:0019645 IBA and the GO:0020037
    heme-binding IEA), 1 MODIFY (GO:0016020 membrane to GO:0005886, the descendant
    the gene already carries by direct evidence), 1 TOO_GENERAL (GO:0009055 IBA,
    entailed by the accepted GO:0008121; propagation_review records node
    PTN001251186 of PTHR30333 and its TorC/TorY seeds as sound, with the issue
    being term breadth), 1 MARK_AS_OVER_ANNOTATED (GO:1902600 proton transmembrane
    transport, an inter-ontology inference from the bc1-derived transporter
    parentage of GO:0008121, which a monotopic single-helix protein with a wholly
    periplasmic catalytic domain cannot perform), and 1 REMOVE (GO:0019333
    denitrification pathway).

    One source defect: the interpro2go mapping of IPR024717 (NapC/NirT/NrfH) to
    GO:0019333, requested DELETE_VALUE, CONFIRMED. S. oneidensis performs
    respiratory ammonification rather than denitrification, and the signature also
    contains NrfH, which serves the competing pathway.

    Two NEW rows added: GO:0048038 quinone binding (IDA, from the
    removal-and-restoration electrochemistry showing menaquinone-7 is a bound
    cofactor), GO:0098567 periplasmic side of plasma membrane (IC, from the
    topology plus the exclusively periplasmic partner set);
    no proposed_new_terms were needed.

    Two core functions recorded (the quinol dehydrogenase activity that feeds every
    anaerobic branch except TMAO, and the four-heme cofactor chain), plus four
    suggested questions and three suggested experiments. cymA-notes.md carries the
    manual literature review with inline quotes and a section comparing each
    CMMMech record's functional_role with what the evidence supports; no CMMMech
    file was edited. No deep-research provider file was generated (no API keys in
    this environment).
