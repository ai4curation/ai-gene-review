  summary: Remove last copy of refuted proton-release premise from cymA notes; anchor
    Rhea reaction as a quote
  details: |
    Review round 3 (PR #5646, finding 8): the GO:1902600 bullet in the annotation-call section of cymA-notes.md still argued that CymA is a 'monotopic single-TM protein ... so the protons released on quinol oxidation are released on the side they are already on'. That premise was refuted and corrected in the mechanism bullet and in the YAML reason in 7a7f6e5, but the notes carried the argument twice and only the first copy was fixed, so the file and the rendered HTML stated both accounts. The bullet is rewritten to match the YAML reason: no proton channel and no Q-cycle, single-pass with a wholly periplasmic catalytic domain and one periplasmic quinol site; UniProt/Rhea model the curated reaction (RHEA:11484) with H(+) only as an (out) product and no H(+)(in) term; and then explicitly that this does not mean no proton crosses the membrane, since the cytoplasm-facing dehydrogenases take the protons up, menaquinol carries them, and CymA performs the periplasmic release half-reaction. 'monotopic single-TM' becomes 'single-pass', per the FT TOPO_DOM/TRANSMEM features; the verbatim PMID:22393052 quote that uses the word is untouched. Taking finding 9, the bracket-free span '+ 2 H(+)(out); Xref=Rhea:RHEA:11484' from cymA-uniprot.txt line 153 is added to the GO:1902600 row's supported_by with record_section CC:CATALYTIC ACTIVITY, so the curated reaction is in the evidence layer and not only in the prose. No action changed; the GO:0009055 TOO_GENERAL row is untouched. Re-rendered so the published page no longer shows the stale clause.
