  summary: Drop uncited nirS/nirK/norB/nosZ-class absence clause from GO:0019333 reason;
    add orientation control to proteoliposome experiment
  details: |
    Review round 4 (PR #5646), taking the two carried-forward blue items the PR
    author asked to land before merge.

    Item 3 -- uncited absence claim. The GO:0019333 reason argued that
    S. oneidensis 'has no nitric oxide or nitrous oxide reductase for this pathway,
    so the last two steps of the definition never occur'. Nothing in the review
    supported that absence: the row's two supporting_text entries both quote
    PMID:19387485 for the positive claim (two-step reduction of nitrate to ammonium,
    and CymA as the functional replacement of NapC and NrfH), neither of which is a
    statement about which reductases the genome lacks. This is the defect class
    filed as issue #5670 -- supporting_text is a positive-evidence slot and cannot
    carry a negative proposition. The clause is deleted rather than cited. The
    REMOVE does not rest on it and is unchanged: the term definition names reduction
    of nitrate to dinitrogen, S. oneidensis instead performs respiratory
    ammonification via NapA and NrfA (cited), and the pathway named by the mapping
    is therefore not the one CymA serves. The same uncited clause was also present
    in cymA-notes.md ('and has no NO or N2O reductase in this pathway'), where it
    sat inside the same sentence as the PMID:19387485 quote that does not support
    it; it is dropped there too, so the folder no longer states it anywhere. The
    recital of the GO term's own definition, which does mention nitric and nitrous
    oxide, is left as it is -- that is the definition being tested, not an absence
    claim.

    Item 10 -- orientation control. The proteoliposome experiment measures proton
    uptake and release on both sides, so its readout is which face the protons
    appear on; a mixed-orientation vesicle population would make the two faces
    indistinguishable and confound exactly that measurement. A design clause is
    added naming the control: assay the fraction with the heme domain exposed using
    an impermeant oxidant, or by protease protection, then either select for a
    single orientation or correct the measured stoichiometry for the mixed fraction.
    Kept as part of the experiment's design, not promoted to a knowledge_gaps entry.

    No action, term, qualifier, annotation row, source_defect or quote was added,
    altered or removed; the only supporting_text in the GO:0019333 row and
    everywhere else is byte-identical. Re-rendered in the same commit as the source
    edits so the published page cannot drift. Negative control: perturbing the
    PMID:19387485 span to a non-matching string made validation fail with 'Text part
    not found as substring', confirming the reference check runs on this file rather
    than silently passing, then the file was restored and revalidated clean.
