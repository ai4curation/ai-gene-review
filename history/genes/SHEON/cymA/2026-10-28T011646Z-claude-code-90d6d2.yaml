  summary: 'Rewrite the GO:1902600 reason: CymA performs the periplasmic release half
    of the redox loop, so the false ''protons were already there'' premise is replaced
    by the curated non-translocating reaction argument'
  details: |
    Review follow-up on PR #5646 (finding 2). The GO:1902600 proton transmembrane transport row's reason asserted that the protons released on quinol oxidation 'are released where they already were' and that the vectorial contribution of the pathway belongs solely to the quinone-reducing dehydrogenases. That is wrong for a Mitchellian redox loop: the cytoplasm-facing dehydrogenase takes up 2 H+ from the cytoplasm to reduce menaquinone, those protons ride across the membrane on the menaquinol, and CymA releases them to the periplasm, so CymA performs the release half of net H+ translocation and the vectorial contribution is shared. Action unchanged at MARK_AS_OVER_ANNOTATED. The reason now rests on the curated statement instead: CymA has no proton channel and no Q-cycle, and the CC:CATALYTIC ACTIVITY line of cymA-uniprot.txt (RHEA:11484) writes H(+) only as an (out) product with no H(+)(in) term, so UniProt/Rhea model this entry's reaction as non-translocating; any net translocation is a property of the loop, to which CymA contributes only the periplasmic release half-reaction, so a protein-level involved_in over-reads the bc1-derived parentage. The same false premise was corrected in the matching cymA-notes.md passage and in the proteoliposome suggested_experiments entry built on it, which now asks for the H+/e- stoichiometry with and without a co-reconstituted menaquinone-reducing dehydrogenase. 'monotopic' in the review's own prose replaced by 'single-pass', matching the FT TOPO_DOM/TRANSMEM features. Finding 1 (whether GO:0008121 is_a GO:0009055) was checked against QuickGO from both directions and does hold, so the TOO_GENERAL row is unchanged.
