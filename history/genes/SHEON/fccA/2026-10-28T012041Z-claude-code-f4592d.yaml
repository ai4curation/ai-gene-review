  summary: Correct the PTN000180369 seed-set lineage claim and apply PR review polish
  details: |
    Correction session answering the PR 5648 review. The blocking finding was a
    factual error in the GO:0005737 cytoplasm IBA row: three of the five seeds of
    PANTHER node PTN000180369 were described as archaeal. The five accessions were
    resolved against the UniProt REST API on 2026-10-28 and are all eukaryotic:
    SGD:S000000773 = P32614 FRDS_YEAST (S. cerevisiae, cytoplasm), SGD:S000003812 =
    P21375 OSM1_YEAST (S. cerevisiae, mitochondrion), and UniProtKB:Q38BN4, Q57W38,
    Q57W39 = Trypanosoma brucei brucei 927/4 GUTat10.1 NADH-dependent fumarate
    reductases (glycosome/mitochondrion/kinetoplast, glycosome, and cytoplasm/nucleus
    respectively by IDA in GeneDB). The review summary, reason and the
    propagation_review source_entities comment were rewritten to state the real
    lineages and locations; the "all cytoplasmic" claim was dropped, since three of
    five seeds are organellar; and the assertion that the node's own placement is not
    at fault was replaced with an explicit hedge leaving that question open for PAINT.
    LINEAGE_OR_TAXON_MISMATCH was retained, now stated as eukaryotic-intracellular
    versus bacterial-periplasmic rather than archaeal versus bacterial. The REMOVE
    action is unchanged. fccA-notes.md gained a Localization subsection tabulating the
    five seeds with their verification date so a later reader need not recheck them.

    Also applied, from the review's suggestions: an NTR entry was added beside
    GO:0016632 in the GO:0016491 MODIFY so the row links to the proposal that core
    function 1 names in proposed_molecular_function; the proposed_new_terms
    justification now requests GO:0000104 succinate dehydrogenase activity as a second
    parent (the proposed_parent slot is single-valued), matching GO's placement of the
    quinone-linked sibling GO:0008177; the InterPro description quote in the
    interpro2go source defect is now backed by a cached entry
    (interpro/interpro/IPR010960/IPR010960-metadata.yaml, fetched with
    just fetch-interpro-family) and that file was added to references; the GO:0009061
    IC row gained supporting_entities (GO:0016632, GO:0009055) plus a reason stating
    why GO:0019645 anaerobic electron transport chain was not preferred and citing the
    PTN001701398 IBD for GO:0009061 in the same family as precedent; and the
    description's "one of the two most abundant periplasmic cytochromes" was corrected
    to "one of the most abundant", since PMID:23067389 names three (STC, FccA, ScyA).
