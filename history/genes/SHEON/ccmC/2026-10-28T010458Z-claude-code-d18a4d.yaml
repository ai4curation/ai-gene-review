  summary: Create AI gene review for Shewanella oneidensis MR-1 ccmC (Q8EK42), the
    System I cytochrome c maturation heme-handling protein CcmC
  details: |
    Reviewed all 10 GOA rows. Accepted heme binding (GO:0020037) as the core molecular function and plasma membrane (GO:0005886, IBA and IEA), cytochrome complex assembly (GO:0017004), cytochrome c biosynthetic process (GO:1903607) and heme transport (GO:0015886). MODIFY generic membrane (GO:0016020) to plasma membrane. MARK_AS_OVER_ANNOTATED on heme transmembrane transporter activity (GO:0015232): the route by which heme reaches the periplasmic WWD domain is unresolved and no intramembrane heme site exists in CcmC. REMOVE catalase activity (GO:0004096, IBA) and its inter-ontology consequence cellular oxidant detoxification (GO:0098869); source defects filed against the GO_CENTRAL PAINT IBD on PTHR30071 node PTN001247822 and against the PseudoCAP donor row on UniProtKB:Q9I3N5, whose catalase IMP is one of six phenotype rows keyed to a paper on E. coli CcmABC. No NEW rows proposed: CcmC is required for, but does not participate in, Shewanella metal reduction.
