  summary: Correct the unsupported E. coli attribution of PMID:16824107 and add sequence-level
    evidence for the heme site
  details: |
    Correction session answering the review of PR 5651. No existing history record was
    modified.

    Blocking fix. The review asserted in four places that PMID:16824107 is a study of
    Escherichia coli CcmABC. The cached publications/PMID_16824107.md is abstract-only
    (full_text_available: false) and its abstract names no organism; a case-insensitive
    search for Escherichia/coli in it returns nothing. CLAUDE.md forbids inferring the
    organism of a cached reference the abstract does not state, and the claim sat in a
    source_defects explanation that just export-source-defects sends to PseudoCAP. All
    four places now rest only on what the abstract states - a biochemical study of
    System I CcmABC-mediated release of holoCcmE whose abstract reports none of the
    Pseudomonas phenotypes - and say explicitly that the organism is not determinable
    from the cached record: the GO:0004096 review.reason, the propagation_review
    source_entities comment on UniProtKB:Q9I3N5 (a fourth site the review feedback did
    not list), the PseudoCAP source_defects explanation, and the PMID:16824107
    reference_review notes. The REMOVE action is unchanged; it rests on the two
    independent arguments that a mutant phenotype cannot establish a molecular function
    and that no WWD-superfamily member dismutates H2O2. The corresponding passage in
    ccmC-notes.md was corrected the same way, with the superseded wording recorded.

    New bioinformatics analysis. ccmC-bioinformatics/ was added to replace the weaker
    "family membership plus the mutant phenotype" framing of the GO:0020037 assignment.
    align_wwd_domain.py fetches Q8EK42 and E. coli P0ABM1 from the UniProt REST API,
    aborts unless the fetched Q8EK42 matches the SQ block of the committed
    ccmC-uniprot.txt, computes a global BLOSUM62 alignment with Biopython, and reads the
    Q8EK42 residue and position each E. coli landmark aligns to off the alignment; a
    landmark aligning to a gap or a non-histidine would be reported as NOT CONSERVED.
    The run gives 58.8% identity, gap-free from the N-terminus through residue 184, both
    axial histidines mapping to His60 and His184 of Q8EK42, and the WWD motif intact as
    WWVWD at Q8EK42 122-126. RESULTS.md and the captured run output are committed.
    Nothing is hardcoded and no position was hand-written: the positions in the review
    are those the script reported, and they are stated as positions in Q8EK42 rather
    than as E. coli numbers carried across. The core function description, the
    GO:0020037 reason and the notes now cite
    file:SHEON/ccmC/ccmC-bioinformatics/RESULTS.md, which was added to the references
    list with three findings.

    Ontology gap. A suggested_questions entry now records that GO has no molecular
    function term for the heme-to-apoCcmE attachment step that distinguishes CcmC (the
    field's informal holoCcmE synthase), previously only a parenthetical in the
    GO:0015232 reason. It is a question rather than a proposed_new_terms stub because
    the right parent depends on an unsettled decision about the reaction chemistry, and
    no term id is guessed.

    Section label. The PMID:16875436 finding quoting "we evaluated a mutant lacking all
    functionally active c-type cytochromes" was labelled RESULTS. The quote is at
    publications/PMID_16875436.md:144, inside the Introduction of the cached full text
    (the abstract ends at line 88; the Full Text section opens with Introduction at line
    92). Corrected to INTRODUCTION rather than to the ABSTRACT value the review feedback
    proposed, which the file does not support.

    Checks: just backfill-record-sections (no changes), just validate SHEON ccmC
    (valid), just render SHEON ccmC, just validate-history on this record.
