  summary: Rescope the IBA reach claim in the GO_CENTRAL source defect and record
    the PSEPK ccmC divergence
  details: |
    Correction round on PR #5651. The GO_CENTRAL source_defects explanation on the GO:0004096 row asserted that the IBD "currently propagates to every bacterial CcmC in the family". That quantifier is not checkable from what the repository holds and has an in-repo counterexample, so it is rescoped to what interpro/panther/PTHR30071/PTHR30071-paint.tsv supports: the IBD sits on PTN001247822 and the IBA reaches the leaves descending from that node, UniProtKB:Q8EK42 among them. The explanation now states explicitly that the retraction request does not depend on the reach, and names the counterexample. Verified here: genes/PSEPK/ccmC/ccmC-goa.tsv (UniProtKB:Q88EX7, every row dated 20260727) has zero GO:0004096 rows and zero IBA rows of any kind, and its GO:0005886 row is a GO_REF:0000120 IEA citing PANTHER:PTN002409360, which does not occur anywhere in PTHR30071-paint.tsv; Q88EX7 and Q8EK42 both carry DR PANTHER PTHR30071 and PTHR30071:SF1 in their own UniProt records. No claim is made about why Q88EX7 falls outside PTN001247822. The REMOVE action and the CONFIRMED confidence are unchanged.

    ccmC-notes.md gains a section recording the divergence with genes/PSEPK/ccmC/ccmC-ai-review.yaml, which reviews the same IPR003557 / IPR045062 rows on a same-subfamily CcmC: six terms are shared and four are called differently (GO:0015232 REMOVE vs MARK_AS_OVER_ANNOTATED; GO:0015886 MARK_AS_OVER_ANNOTATED vs ACCEPT; GO:0016020 MARK_AS_OVER_ANNOTATED vs MODIFY to GO:0005886; GO:0017004 MODIFY to GO:1903607 vs ACCEPT). The section states that reconciliation is a follow-up, that the PSEPK file carries status: DRAFT, and that on GO:0015232 both reviews rest on the same family-level argument, which cannot licence REMOVE in one file and MARK_AS_OVER_ANNOTATED in the other; it argues MARK_AS_OVER_ANNOTATED is right because an open mechanism is not a refuted one. No action in this review was changed. A stale parenthetical describing the GO_CENTRAL defect as against "the IBD node placement" was corrected to the IBD row, since the page and the review both hold the placement to be sound.
