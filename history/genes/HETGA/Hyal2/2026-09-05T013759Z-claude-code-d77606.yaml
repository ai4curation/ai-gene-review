  details: |
    Reviewed all 45 GOA annotations, mostly Ensembl Compara projections from human Q12891 and mouse O35632. Removed GO:0001618 virus receptor activity: the GO_REF:0000120 donor set contains mouse Hyal2, on which GOA separately records a curated NOT|enables IDA for the identical term, so the pipeline propagated a positive assertion out of an explicit experimental negation. GO:0046718 depends on it and was removed with it. Also removed GO:0005829 cytosol on a topology argument for a GPI-anchored ectoenzyme. Proposed a new term for regulation of hyaluronan polymer size.
