  summary: 'Create review: HETGA/Cd44'
  details: |
    Reviewed all 38 GOA annotations plus 3 new rows. Kept hyaluronic acid binding as the core molecular function and demoted a large tail of immune and developmental terms projected from human P16070 that no naked-mole-rat evidence supports. Proposed a new term for positive regulation of basal ATF6-mediated signalling, distinguished from the existing GO:1903893 because the published phenotype is an elevated resting set-point rather than an amplified stress response.
