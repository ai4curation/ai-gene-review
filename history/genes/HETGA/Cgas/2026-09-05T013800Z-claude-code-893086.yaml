  details: |
    Reviewed all 13 GOA annotations, all TreeGrafter propagations from a single PANTHER node. Removed GO:2000042 and replaced it with a positive-regulation term: the annotation traces to a Euteleostomi IBD seeded by human and mouse cGAS, which do suppress homologous recombination, while the naked-mole-rat protein promotes it. Classified PROPAGATION_BAD with REGULATORY_SIGN_INVERSION. Added a reproducible alignment under Cgas-bioinformatics confirming the catalytic triad, zinc thumb and arginine anchor are intact and the divergent residues sit in the C-terminal HhH domain. Left the four innate-immune terms UNDECIDED, since nothing tests DNA sensing in this species.
