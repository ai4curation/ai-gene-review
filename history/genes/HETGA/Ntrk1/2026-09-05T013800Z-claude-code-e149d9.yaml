  summary: 'Create review: HETGA/Ntrk1'
  details: |
    Reviewed all 24 GOA annotations plus 1 new row. Retained the core receptor tyrosine kinase function: the naked-mole-rat deficit is a right-shifted dose response that reaches rat-equivalent sensitisation at high NGF, not a lost function, so no REMOVE was warranted. Added positive regulation of the ERK1/ERK2 cascade, which was measured and found reduced but present, and left the PI3K/AKT branch non-core because it was never measured. The existing annotation set had this backwards.
