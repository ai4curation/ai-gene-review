  summary: 'Create review: HETGA/Trpv1'
  details: |
    Reviewed all 8 GOA annotations plus 3 new rows. The result is a well-supported negative: the naked-mole-rat channel is unremarkable, with cloned cDNA giving normal heat- and pH-gated currents in Trpv1-null mouse neurons, and the species pain phenotype arising upstream. Re-termed the generic ion channel activity to the cation-level children GO:0097604 and GO:0099094, since TRPV1 is a non-selective cation channel. Proposed a new term for vanilloid-gated monoatomic cation channel activity.
