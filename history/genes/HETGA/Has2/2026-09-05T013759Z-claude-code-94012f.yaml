  details: |
    Reviewed all 24 GOA annotations, every one an electronic projection (ISS from human Q92819, mouse P70312 and rat O35776, plus IEA). Confirmed the core hyaluronan synthase activity against naked-mole-rat evidence rather than the ortholog transfer alone. Marked the two rat-derived renal terms (GO:0035810, GO:0070295) over-annotated on a positive species argument: the naked mole rat renal medulla has lower hyaluronan than comparators, running against its own species trend. Proposed a new term for high molecular mass hyaluronan biosynthetic process, verified absent from GO. Validated with just validate; all supporting_text checked verbatim.
