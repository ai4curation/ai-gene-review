  summary: 'Review: STRTR cas10'
  details: |
    Completed review of STRTR cas10 as a type III CRISPR-Cas exemplar cited by modules/crispr_cas_adaptive_immunity.yaml. These entries carried few or no GOA rows, so the work was establishing function from UniProt and the primary literature rather than adjudicating existing annotations. Two ontology terms are formally proposed across this group: cyclic oligoadenylate synthase activity for the Cas10 Palm/GGDEF domain, argued as the missing third member of the series containing GO:0106408 diadenylate cyclase activity and GO:0052621 diguanylate cyclase activity under GO:0016779, with RHEA:58276 and RHEA:58280 as external mappings, and explicitly not GO:0001730 whose product is a linear 2'-5'-linked oligomer retaining a 5'-triphosphate; and cyclic oligoadenylate binding for the CARF domain, argued as the missing third member of GO:0035438 cyclic-di-GMP binding and GO:0180001 cyclic-di-AMP binding under GO:0030551, whose own definition requires the phosphate in diester linkage to two positions on a single sugar and so cannot stand in. Cas10 bifunctionality is modelled as two independent core functions on the strength of reciprocal mutagenesis separating the ssDNase from the cyclase. Evidence codes distinguish the organisms: the Streptococcus cOA synthesis is IDA while the Thermus one is ISS, since UniProt codes that reaction ECO:0000305 for the Thermus entry.
