  summary: 'Create review: Cf-4'
  details: |
    Created the review of tomato (S. habrochaites) Cf-4 (Hcr9-4D, O50025), the RLP that recognises the Fulvia fulva effector AVR4. Reviewed all 6 GOA rows: 5 ACCEPT, 1 MODIFY, 0 NEW. Main correction: pattern recognition receptor activity (GO:0038187, defined by binding a conserved PAMP) changed to innate immune receptor activity (GO:0140376), because AVR4 is a race-specific effector and direct Cf-4-AVR4 binding is unproven; this matches the paralogous CF-9 review. The PHI-base EXP row citing PMID:15469522 (an Hcr9-4E/Avr4E paper) was accepted, deferring to the curator, and raised as a suggested question. Core function: plasma-membrane innate immune receptor acting with SOBIR1 and BAK1/SERK3 in cell-surface immune signalling and defence against the fungus. just validate and validate-changed pass with no warnings.
