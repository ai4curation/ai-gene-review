  summary: New review of L. lactis yxcA (Q9CDI2) as single-chain plasmalogen synthase
    PlsA
  details: |
    Started from KBase Dark Protein Atlas hackathon item NZ_VXKC01000008.1_19 (eggNOG hgdC; UniParc UPI00072AC48C, whose TrEMBL entries were deleted). Q9CDI2 is the closest active UniProt entry (98.3% id). GOA empty; added NEW GO:0008611 (ISS from L. cremoris LACR_2543 PlsA, PMID:41427725) and GO:0051539 (ISS, conserved Act-domain Cys). Proposed new MF term for reductive ester-to-vinyl-ether plasmalogen synthase activity; GO:0047159 is an unrelated acyltransferase. Bioinformatics: global/local alignments to characterized PlsA/PlsR and Pfam HMM scan of the C-terminal Red2 region.
