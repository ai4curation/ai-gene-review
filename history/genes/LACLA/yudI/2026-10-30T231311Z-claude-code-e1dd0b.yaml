  details: |
    Created review for Q9CE84 (IL1403 L19272); KBase protein CP006766.1_2177 differs at one position (E267G). Accepted GO:0017150 and GO:0002943; modified GO:0003723 to GO:0000049, GO:0008033 to GO:0002943 and GO:0016491 to GO:0017150; removed GO:0050660 FAD binding (Dus enzymes use FMN; InterPro2GO over-mapping); added GO:0010181 FMN binding (ISS). Position-specific Dus terms not assigned: L. lactis has a single Dus, closest to the Firmicute DusB1 subgroup, and site specificity varies within DusB (E. coli D17 only; M. capricolum D17/D20/D20a). Dashboard call scored in a predictions sidecar: supported.
