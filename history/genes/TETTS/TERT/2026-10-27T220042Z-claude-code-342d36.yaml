  summary: 'TERT: declare the UniProt reference and support the core-function locations'
  details: |
    Third-round review follow-up on PR #5300. The UniProt record was cited from the GO:0005634 row but not declared in the top-level references list, so it now has an entry with a reference_review noting that the Nucleus and Chromosome, telomere statements carry RuleBase:RU365061 and, for the telomere statement, ECO:0000269|PubMed:16462747 - curated UniRule rather than a DR GO restatement. core_functions[0] listed nucleus and chromosome, telomeric region under locations while its supported_by covered only catalysis, so both location quotes were added there too. record_section values were filled by just backfill-record-sections rather than by hand; the tool emitted them as unquoted flow scalars containing a colon, which parses under PyYAML but not under the stricter scanner the reference validator uses, so they were quoted to match the form used elsewhere in the corpus. No annotation action changed.
