- type: REVIEW
  outcome: changed
  summary: Complete GO annotation review for Tetrahymena thermophila TERT (O77448)
  details: |
    Reviewed all 27 GOA rows: 17 ACCEPT, 8 TOO_GENERAL, 2 MODIFY. Accepted telomerase activity (GO:0003720, 4 IDA + 1 IEA), telomerase holoenzyme complex (GO:0005697, 5 IDA), telomerase catalytic core complex (GO:0000333), telomere maintenance via telomerase (GO:0007004), telomerase RNA binding (GO:0070034), nucleus and chromosome telomeric region. Marked the strict ancestors TOO_GENERAL: DNA polymerase activity (GO:0034061, 4 EXP + 1 IEA), RNA-directed DNA polymerase activity (GO:0003964), DNA binding (GO:0003677) and telomere maintenance (GO:0000723). MODIFY GO:0042162 telomeric repeat DNA binding to GO:0043047 single-stranded telomeric DNA binding on both rows, per the TEN-domain structure paper (PMID:16462747). No NEW rows and no proposed new terms: holoenzyme assembly belongs to p65 and processivity/telomere bridging to Teb1/p82/p50, not to TERT. Added three core_functions, suggested questions and experiments. Automated deep research was unavailable (no working provider), so TERT-notes.md records a manual literature review from the cached publications.
