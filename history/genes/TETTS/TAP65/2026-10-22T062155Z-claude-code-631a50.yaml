- type: REVIEW
  outcome: changed
  summary: 'TAP65: make the GO:0140691 NEW row self-contained after PR #5300 review'
  details: |
    PR #5300 review asked that the GO:0140691 RNA folding chaperone NEW row carry its own caveat and that its comparator figures be auditable. Added a clause to the reason recording that the discriminating chaperone test (substoichiometric p65 turning over multiple TER molecules) has not been done and that p65 stays in the assembled RNP as a molecular buttress rather than releasing, which is atypical for a chaperone. Recorded the QuickGO comparator query in TAP65-notes.md with its URL; re-run on 2026-10-22 it returns 36 experimental annotations across 32 distinct products, including UniProtKB:Q9BUR4 WRAP53 and UniProtKB:Q8VC51 mouse Wrap53, both IDA. No annotation action changed.

