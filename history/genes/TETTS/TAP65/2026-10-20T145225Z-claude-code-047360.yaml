- type: REVIEW
  outcome: changed
  summary: Complete GO review of Tetrahymena TAP65/p65 (W7X6T2), the LARP7-family
    telomerase holoenzyme subunit
  details: |
    Reviewed all 25 GOA rows and added one NEW molecular function. Actions: 22 ACCEPT, 2 MODIFY, 1 KEEP_AS_NON_CORE, 1 NEW. MODIFY: GO:0003676 nucleic acid binding and GO:0003723 RNA binding (both IEA, InterPro/PANTHER) refined to GO:0070034 telomerase RNA binding, a descendant the gene already carries six times by IDA; p65 is demonstrably TER-specific and not a general La-type Pol III transcript binder. KEEP_AS_NON_CORE: GO:0000781 chromosome, telomeric region, an ECO:0000305-derived UniProt subcellular-location mapping that is reasonable for a constitutive holoenzyme subunit but peripheral to p65's demonstrated biogenesis role, with no direct localization data. NEW: GO:0140691 RNA folding chaperone, proposed after the participation test (p65 itself bends TER stem IV by 105 degrees and rescues misfolded TER variants) and the comparator check (36 experimental annotations to the term, including WRAP53/TCAB1 and mouse Wrap53, telomerase-RNP biogenesis factors in the same role). Declined GO:0000333 telomerase catalytic core complex as a part_of descendant of the already-held GO:0005697, GO:1905323 and GO:0034337 as redundant; raised GO:0000333 as a suggested question instead. Confirmed no COMPLEX_ACTIVITY_TRANSFER (no telomerase catalytic MF on this non-catalytic subunit; PMID:15696174 shows p65 does not alter primer extension) and no import of human LARP7 7SK/P-TEFb biology. Two core functions recorded: TER binding with 3'-end protection, and RNA folding chaperone driving catalytic core assembly and telomere maintenance. Automated deep research was unavailable (all providers failed); a manual literature review was written to TAP65-notes.md.
