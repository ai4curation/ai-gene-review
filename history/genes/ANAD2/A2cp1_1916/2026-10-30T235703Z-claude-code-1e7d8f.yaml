  summary: New review of A2cp1_1916 (B8J768), GH57_6/DUF3536 glycosidase without trehalose-gene
    neighbours; dashboard call NC_011891.1_1918 assessed
  details: |
    LBNL hackathon alpha-glucan batch. Reviewed the KBase gene-annotate dashboard call for NC_011891.1_1918 (exact UniParc match to B8J768) in A2cp1_1916-dashboard-predictions-review.yaml: GO:0016798 COR; dashboard verdict supported. Full review: GO:0003824 IEA MODIFY to GO:0004553; GO:0005975 IEA MODIFY to GO:0030978. Evidence: conserved GH57 catalytic Glu154/Asp261, CAZy GH57_6, characterized GH57_6 relatives (PoGH57 38.9% identity, PMID:38930854), no alpha-glucan/trehalose genes within 5 genes in three Anaeromyxobacter genomes, no TreY fusion in the BERDL pangenome (STRING fusion link unsupported). Analyses shared with GSU2359 (BERIL runs gh57-catalytic, gh57-identity, gh57-cazy, gh57-synteny, gh57-fusion-check). Deep research run once for the family, on GSU2359 (claude-code); not repeated here. No FEBA fitness data for Anaeromyxobacter.
