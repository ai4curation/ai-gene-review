  summary: Full independent review of blue whale CDK16 (A0A8B8WEF1), reference relative
    for ProtNLM2 benchmark A0A8B8WEG2
  details: |
    Created review of all 13 IEA annotations, with function grounded by PANTHER SF174 membership, PAINT node PTN004656776 and a whale-human alignment (98.19% identity, all catalytic and regulatory residues conserved). Accepted the core MF cyclin-dependent Ser/Thr kinase activity, plus ATP binding and cytoplasm. Refined generic kinase/transferase/nucleotide terms. Changed exocytosis to regulation of exocytosis (NSF phosphorylation). Kept neuron projection development as non-core. Marked nucleus, synaptic vesicle and regulation of cell cycle as over-annotated. Added NEW plasma membrane and CDK holoenzyme complex by orthology. Did not propose mouse/human terms that PAINT did not propagate (spermatogenesis, autophagy). Deep research failed (falcon auth error, perplexity quota), so the literature was taken from 20 cached PubMed papers. ProtNLM2 predictions were not consulted.
