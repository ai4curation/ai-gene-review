  summary: 'Correct QueH [4Fe-4S] ligands and add notes: ACIAD queH'
  details: |
    Same misassignment as the Thermotoga entry, found in PR review. Verified from this record's own sequence that Q6FAK7 carries nine cysteines and that six of them reproduce the structurally characterized spacing (22-23, 101-X2-104, 184-X-186), so the cluster ligands are Cys101, Cys104, Cys184 and Cys186 while Cys22 and Cys23 belong to the mononuclear site, whose Thermotoga Asp13 is replaced here by Cys26 as the paper says happens in some species. Corrected the reason, kept the ACCEPT, and recorded the FT BINDING and FT DISULFID features as UNIPROT source_defects at PROBABLE confidence, since no structure of this protein exists and the assignment rests on the family alignment. Added queH-notes.md with the literature checked and the absence of a deep-research provider.
