  summary: Re-type and relocate the P07771 PATHWAY defect as WRONG_STATEMENT
  details: |
    PR #5366 re-review 5731326273. Suggestion taken, with a placement correction the reviewer did not ask for but the schema requires. The defect was WRONG_TERM/DELETE_VALUE on the GO:0042203 annotation row with a UniPathway xref as asserted_value. It is now WRONG_STATEMENT, slot CC:PATHWAY, requested_change CHECK, asserted_value the verbatim sentence 'Xenobiotic degradation; toluene degradation.'. Both the schema's slot_usage for ReferenceReview.source_defects and docs/source_defects.md ('Cited source text') say a WRONG_STATEMENT about a source's own curated text belongs on the reference_review of the reference citing that text, not on the annotation row, so it moved there; this also required adding the missing references entry for file:ACIAD/benC/benC-uniprot.txt, with reference_review correctness DISPUTED. requested_change is CHECK rather than REPOINT because BenC serves more than one oxygenase in vivo (PMID:9721284), so UniProt may have meant a broader xenobiotic-degradation statement whose basis the flat file does not record. Verified the relocated entry still exports: just export-source-defects lists it under UNIPROT as 'revise ... in CC:PATHWAY'. just validate passes.
