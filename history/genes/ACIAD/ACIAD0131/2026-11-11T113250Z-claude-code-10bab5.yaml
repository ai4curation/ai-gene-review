  summary: 'Create review: ACIAD0131 (KgsD, A. baylyi alpha-ketoglutaric semialdehyde
    dehydrogenase)'
  details: |
    New review for Q6FFQ0, created to give the module's terminal reaction a characterized exemplar. The two broad oxidoreductase IEA rows are changed to the substrate-specific GO:0047533, which UniProt curates from the biochemical characterization of the purified enzyme; that row and the D-glucarate catabolic process row are accepted. The review records that KgsD's own pathway is D-glucarate degradation, which converges on the same 2,5-dioxopentanoate intermediate, rather than hydroxyproline catabolism. A UniProt source defect is filed: the FUNCTION comment says D-glutarate where the cited study and the entry's own PATHWAY comment say D-glucarate. Deep research was unavailable (provider API 403). Validation clean.
