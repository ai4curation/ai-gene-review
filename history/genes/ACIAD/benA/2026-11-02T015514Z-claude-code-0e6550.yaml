  summary: Backfill record_section on UniProt quotes (ACIAD benA)
  details: |
    PR #5366 re-review 5731326273. Blocking item: the eight new reviews cited UniProt flat-file quotes with no record_section, while every sibling review in the same folders carries it 1:1. CLAUDE.md requires the field and validation cannot catch its absence (validate_record_sections only warns when a stated value disagrees with the file), so CI was silent. Ran 'uv run ai-gene-review backfill-record-sections' rather than writing the values by hand; the run reported 24 added, 0 fixed, 0 mismatched, 0 ambiguous across two sections, 0 unplaceable, so no quote needed extending to disambiguate it. Sections landed as DR:NCBIfam, DR:InterPro, CC:SUBUNIT, CC:PATHWAY and CC:CAUTION. just validate passes.
