  summary: Create gene review for Cylindrotheca fusiformis SIL1 (silaffin-1, Q9SE35)
  details: |
    Q9SE35 had zero GO annotations (empty GOA, QuickGO numberOfHits 0), so the review proposes three NEW rows rather than adjudicating existing ones: GO:0030312 external encapsulating structure (IDA), GO:0005199 structural constituent of cell wall (IDA) and GO:0042546 cell wall biogenesis (IDA). Three ontology gaps recorded as proposed_new_terms: a silica polycondensation molecular function, a silica deposition vesicle component, and a diatom-specific child of GO:0005618. Mature mineralization peptides modelled as CLEAVAGE_PRODUCT functional_isoforms sharing the accession. GO:0031214 biomineral tissue development rejected as multicellular-only.
