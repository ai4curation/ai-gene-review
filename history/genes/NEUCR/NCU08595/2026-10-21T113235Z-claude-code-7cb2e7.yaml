  details: |
    Full re-review independent of ProtNLM2 predictions. Grounded transfer in PANTHER PTHR12728:SF0 and PAINT PTN000296192; new motif analysis (bioinformatics/RESULTS-rereview.md) shows the 5S rRNA-binding KKR loop (K94-K96) and the yeast R236-equivalent arginine (R242) are conserved, with 74% identity to the C. thermophilum Rpf2 used for direct EMSA (PMID:26117542, added). rRNA binding rows (IBA, IEA) changed ACCEPT->MODIFY to 5S rRNA binding (GO:0008097), which is now the core MF; maturation of LSU-rRNA changed ACCEPT->MODIFY to GO:0000463; ribosome biogenesis MODIFY now lists GO:0000027 and GO:0000463; GO:0000027 stated as the primary process. Description rewritten. No NEW annotations. Q7SCN3 is the complete canonical product, not a fragment.
