  summary: Record OpenScientist finding that the APG-6 lipidation cycle is possible,
    supported as prediction and unresolved as demonstration
  details: |
    Ran an OpenScientist deep-research job (kgap-apg6-lipidation-cycle) on the gap recording that APG-6 processing, PE lipidation and phagophore recruitment have not been demonstrated in N. crassa. It finds the cycle possible and frames the result the way this gap needs: supported as a prediction, unresolved as a demonstration.

    Each requirement was checked individually rather than assumed from family membership, and the local record confirms the central ones verbatim: 121 residues, the Atg4 cleavage context SGENTFG at 110-116 identical to S. cerevisiae Atg8 and shared by 36 of 39 assignable reviewed fungal ATG8 entries, the lipidation acceptor Gly116 with no numbering offset, and the propeptide DFETA at 117-121, which the run predicts as a disordered solvent-exposed arm at per-residue pLDDT 37.5 against 95.8 for the folded core.

    The alternative of a complete substrate in a gutted pathway is excluded: N. crassa encodes the protease, the E1 and the E2 single-copy with nucleophiles intact, atg4 with its Cys-Asp-His triad and atg7 and atg3 each with their catalytic cysteine, plus the stimulatory Atg12-Atg5 arm.

    The receptor-docking surface transfers, and this is the sharpest number: contact analysis of the yeast Atg8 complex with an Atg19 AIM peptide identifies 15 residues within 4.5 Angstrom reproducible in at least three of four copies of the asymmetric unit, and all 15 are identical in APG-6 at identical residue numbers, including 13 of 13 lining both hydrophobic pockets. That is 100 per cent identity at contact positions against a whole-protein background of 78.6 per cent, one-sided p = 0.027. Geometry agrees, the model superposing on yeast Atg8 at 1.65 Angstrom over 111 CA pairs with a rigid AIM transplant recovering 14 of 15 crystallographic contacts.

    The run then states the limit this gap turns on as load-bearing rather than as a footnote: sequence cannot distinguish a functional ATG8 from a family member that has lost the cycle. What sequence and structure can do is enumerate the ways the cycle fails and show none applies, since there is no missing glycine, no absent cleavage site, no buried C-terminus, no orphaned substrate and no collapsed pocket; loss of the cycle in a real protein is usually written in expression, regulation or a changed partner set, none of which a sequence shows.

    The one line that partly closes the gap is comparative rather than computational: the Podospora anserina ortholog IDI-7 shares the same 121-residue architecture with Gly116 and a five-residue xFETA extension, its GFP fusion marks autophagic bodies and its deletion blocks female reproductive structures. Against that, no deletion, GFP-tagging, cleavage, PE-conjugation or localisation assay has been reported for apg-6 itself, and the local record rates protein existence as inferred from homology.

    The run's curation consequence is conservative and matches this review's position: the existing similarity-based annotations are justified at their current strength and should be retained rather than upgraded. Across 19 evidence items over three iterations, 14 support the hypothesis, 5 qualify it and none refutes it, with no competing interpretation surviving.

    Gap status moved to NARROWING. No annotation action was changed. Not recomputed here: the pLDDT values and superposition, the 2ZPN contact analysis and its 15 positions, the binomial test, the AIM transplant, the N. crassa locus tags and catalytic residues, the 39-sequence fungal survey, and the Podospora phenotypes.
