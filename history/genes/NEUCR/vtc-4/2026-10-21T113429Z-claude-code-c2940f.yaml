  summary: 'Full re-review: vtc-4 (Q7SCX0), independent of ProtNLM2 predictions'
  details: |
    Full re-review of all 15 GOA rows. New phylogenetic placement/catalytic-site analysis (vtc-4-bioinformatics/RESULTS-rereview.md) places VTC-4 in the Vtc4 clade (with C. thermophilum, S. cerevisiae, S. pombe Vtc4; separate from PTHR46140:SF2 Vtc2/Vtc3) and shows conservation of all yeast Vtc4 catalytic/ATP-binding residues including active-site K462. Replaced the earlier claim that SF1 alone defines the catalytic subfamily (SF1 also holds Vtc1/Vtc5). Inositol hexakisphosphate binding ACCEPT->KEEP_AS_NON_CORE (regulatory). Vacuolar transport retained ACCEPT, now justified by synthesis-coupled polyP import (PMID:25315834) and added to core function. Added reasons to every row, reference_review entries, PMID:25315834 and PMID:27080106, rewrote description, added suggested question/experiment. Notes appended (append-only).
