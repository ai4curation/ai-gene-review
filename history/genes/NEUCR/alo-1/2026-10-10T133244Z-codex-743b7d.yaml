  summary: 'Create review: NEUCR alo-1'
  details: |
    Created a de novo NEUCR alo-1 review for the fungal ALO1 PTHR43762 family from seeded GOA annotations, UniProt, PAINT node rows, cached ortholog literature, a newer Magnaporthe Alo1 paper, and a manual web/PubMed search. Accepted the PTN000356435 D-arabinono-1,4-lactone oxidase IBA and PTN001015900 mitochondrial IBA, redirected over-specific S. cerevisiae outer-membrane transfers to mitochondrial membrane, removed a Myo2-binding transfer that is not supported for Neurospora, and kept FAD binding and oxidative-stress response as supported non-core rows. Falcon deep research was attempted but unavailable because no supported provider credentials were configured. Validated with just validate NEUCR alo-1.
