  summary: Record OpenScientist determinant analysis on the unidentified N. crassa
    RTT109 substrate
  details: |
    Ran an OpenScientist deep-research job (kgap-ncu09825-rtt109-substrate) on the knowledge gap covering the direct RTT109 substrate that supports N. crassa PRC2-repressed chromatin independently of H3K56 acetylation. The run shows the gap is real, excludes the route that would most plausibly have answered it, and demonstrates that specificity determinants cannot identify the substrate, which is a more informative negative than a failed method.

    The catalytic and cofactor machinery is intact and was verified in the local Q7S1R7 record: the yeast catalytic residues map to Asp145, Arg192, Tyr197, Trp226, Asp304 and Asp305, the autoacetylation lysine to Lys307, and the acetyl-CoA contacts to Ala144, Phe190, His215 and Trp225, all eleven present. Those residues are shared by every candidate reaction, so their conservation shows the enzyme works and says nothing about what it works on. The residues that would discriminate are the ones implementing the S. cerevisiae chaperone switch, where Asf1-bound Rtt109 makes H3K56ac and Vps75-bound Rtt109 makes H3K9ac and H3K27ac, and those are exactly the positions not conserved: four of nine mapped Vps75-interface positions are non-conservative substitutions, and across seven fungal orthologs the interface determinants are conserved in only 0 to 43 per cent of cases. The substrate side gives nothing either, with N. crassa and S. cerevisiae histone H3 at 94.9 per cent identity and the windows around every candidate lysine character-for-character identical.

    Published N. crassa genetics closes the remaining route, and it is already cited in this review as PMID:42832562, cached locally. Catalytically inactive alleles fail to restore H3K27me3 while a wild-type construct does, neither hH3 K56R nor K56Q phenocopies the deletion, and loss of the Vps75 homolog does not either, so the active site is required, its canonical product is dispensable, and the Vps75-type programme is excluded. The run audited that paper's full text and found no occurrence of H3K9ac, H3K14ac, H3K18ac, H3K23ac or H3K27ac and no acetylome survey, so the mark is genuinely unidentified rather than reported and overlooked.

    Status moved from OPEN to NARROWING. No annotation change was made. The run's reading is that this evidence shape, a demonstrated catalytic requirement with an unidentified product, supports a biological-process annotation by IMP and no new site-specific molecular-function term, and that reading is recorded. I did not add a process row: the review already carries chromatin organization and chromatin remodeling, and whether RTT109 performs a step of PRC2 repression or is merely required for it cannot be decided while the mark is unknown, which is precisely what a more specific process term would be asserting an answer to.
