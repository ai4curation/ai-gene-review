  details: |
    Full re-review of all six GOA rows for Q1K6K5 (full-length 516 aa RPC4; Pfam PF05132 at 345-494). DNA binding (InterPro2GO IEA) changed ACCEPT->KEEP_AS_NON_CORE: C53 cross-linking to the template strand shows proximity inside the yeast pol III elongation complex, not an autonomous activity, and PAINT PTN000334172 does not propagate DNA binding. Complex membership, tRNA transcription and pol III transcription remain ACCEPT with reasons re-grounded in PTHR13408:SF0 membership (with yeast RPC53 and human POLR3D) and the PAINT node; nucleus ACCEPT grounded on pol III membership rather than the ARBA SubCell line. No NEW terms: yeast RPC53 IDA initiation/termination terms were not propagated by PAINT and are treated as a deliberate omission (raised as suggested question). Description and core function rewritten; reference_review added. ProtNLM2 predictions not consulted.
