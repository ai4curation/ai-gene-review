  summary: Full re-review of NCU02539 (Mcm4) independent of ProtNLM2 predictions
  details: |
    Re-examined all 37 GOA rows with ortholog primary literature (15 newly cached PMIDs) and a new sequence analysis (RESULTS-rereview.md). The analysis shows Q7SHS5 is a full-length Mcm4 with intact Walker A/B and arginine-finger motifs, and that the UniProt Walker motif coordinates are misplaced. Refined generic DNA binding/helicase/replication terms to GO:0003697, GO:1990518 and GO:0033260 (MODIFY). Marked in vitro-only RNA, DNA/RNA hybrid and four-way-junction activities and the S. pombe rDNA protrusion location as over-annotated. Demoted chromatin binding, origin binding and MCM core complex to non-core. Rewrote description and core functions (CMG helicase motor; pre-RC licensing). Appended a dated notes section.
