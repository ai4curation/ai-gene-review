  summary: Reword IPR052541 use in GO:0070224 reason; add PMID:42031311 reference
  details: |
    Addressed PR 5624 review: the GO:0070224 ACCEPT reason no longer presents IPR052541 as corroborating SQR activity or excluding FCSD/Type IV-VI. IPR052541 is the InterPro integration of PTHR43755 and is non-discriminative (RESULTS.md point 4), so it is now cited only for SQR-family membership; the ACCEPT rests on pairwise identity to B7JBP8 and the conserved C128/C160/C356 triad. Action unchanged. Also added PMID:42031311 to references with a reference_review recording that it was considered but not used (locus not matched to Atc_1705).
