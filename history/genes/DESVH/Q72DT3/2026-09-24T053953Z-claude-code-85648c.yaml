  summary: Eleven re-grounded; file was already failing validation on main
  details: |
    Part of a single sweep repairing fabricated supporting_text across the gene reviews written in PR #2956. Those reviews set full_text_unavailable: true on supported_by entries whose cited publication is cached in full; that flag suppresses the repo's verbatim-substring validator, so every quote it covered entered the repo unverified. 76 of the 79 flagged entries quoted text that is not in the cited paper.

    Each entry was either re-grounded on a verified verbatim quote from the same paper, or the citation was deleted and its claim moved into review.reason as an explicit inference. No curation decision was changed: action, term, evidence_type, original_reference_id and proposed_replacement_terms are untouched unless stated below.

    11 re-grounded in existing_annotations, plus 9 in references[].findings[].supporting_text and 3 in core_functions.

    The findings field is not shielded by full_text_unavailable, so this file was a blocking validation error on main before this change, not merely an unverified one.

    Cache-integrity bug found, not fixed here: publications/DOI_10.1128_mmbr.00181-23.md declares content_type: full_text_html but holds 7.9 kB of repeated summary, with zero occurrences of potassium, Trk, Ktr or RCK in a paper about bacterial cell volume regulation. The header makes the validator check quotes against text that is not there. Recommend re-fetching or re-marking it abstract_only.
