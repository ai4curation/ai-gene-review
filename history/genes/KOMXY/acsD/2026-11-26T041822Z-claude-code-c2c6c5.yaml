  summary: Record OpenScientist refutation of the AcsD four-channel conduit reading
    against a BcsA control
  details: |
    Ran an OpenScientist deep-research job (kgap-acsd-passageway-geometry) on the gap asking how the AcsD octamer organizes glucan chains. It refutes the conduit reading on geometry, leaves the organiser reading standing on phenotype, and does so against a calibrated positive control rather than by assertion.

    A clearance field computed on the deposited octamer coordinates finds that four compartments and a traversable route never coexist: at a 1.4 Angstrom probe there is a single compartment of about 59,000 cubic Angstrom, 80 Angstrom long and open at both ends, while at a 3.2 Angstrom probe the four sites are closed pockets of 13 to 17 cubic Angstrom. Width and burial alone do not separate the sites from a real channel, since AcsD's pore radius of 3.8 to 4.7 Angstrom and burial of 0.84 to 0.87 fall inside the range measured for BcsA, the cellulose-conducting synthase channel used as the reference standard, so the run leans on discriminating tests instead.

    Three of those are negative. There is no aromatic sliding track: zero aromatics within 4.5 Angstrom at all four sites against 13 of 41 contacts in BcsA, Fisher p = 0.0024, nearest aromatic 4.9 Angstrom. The four sites cannot template a crystallite, lying 19.1 Angstrom apart against the 8.20 Angstrom spacing of a cellulose I-beta sheet, with chain axes 54.6 to 58.0 degrees apart for adjacent sites and 85.7 to 86.9 degrees for opposite ones where 0 degrees is required. And the lining is not conserved across the family, 0.241 against 0.301 over 491 PF03500 sequences, Mann-Whitney p = 0.31, with the twelve most conserved positions a median 11.0 Angstrom from the sugar and Lys6 itself at 0.04 family-wide. Two further tests were non-discriminating and the run says so: no induced fit between apo and holo linings, but two crystal forms cannot exclude lattice-suppressed motion, and the rigid-slide test did not separate AcsD from BcsA.

    What survives is the organiser reading, supported from phenotype rather than structure: tuning bcsD expression changes crystallinity and porosity while yield does not fall significantly, heterologous BcsD alone raises the crystallinity index of E. coli cellulose by about 17 per cent, and BcsD interacts with the BcsAB complex directly and through the product cellulose. One conflict is recorded rather than resolved: the original operon-disruption genetics reports impaired cellulose production for bcsD mutants, against those yield-neutral expression studies, with strain and assay differences unresolved. PF03500 spans 141 genera but is absent from Escherichia and Salmonella, which make cellulose without BcsD.

    The review's free text was checked against the run's warning that a conduit or template description should be softened, and it needs no change: it already calls directed chain transport and the crystallisation mechanism proposed, and its use of passageway follows the source paper's structural description.

    The run's molecular-function lead, adding a polysaccharide-binding term as an IDA from the cellopentaose complex, was recorded as a suggested question rather than acted on, together with two others it raised: whether a GO term exists for bacterial cellulose crystallisation, and how to settle the yield conflict. No annotation action was changed, consistent with this campaign recording gap provenance rather than adding annotations.

    Unusually little of this run is locally verifiable, and the reference review says so plainly: the local record carries sequence and family data but no structural coordinates, so the clearance fields, pore radii, contact counts, site spacing and axis angles, superposition, conservation analysis and PF03500 taxonomy all rest on the run. Its BcsA positive control is what gives the negatives their force. Gap status moved from OPEN to NARROWING.
