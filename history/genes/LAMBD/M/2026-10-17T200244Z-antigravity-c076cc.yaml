  summary: Complete end-to-end curation of Escherichia phage Lambda gene M (P03737)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene M (UniProtKB:P03737). Reviewed 7 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in M-notes.md.

    Biological summary: Distal tail protein gpM is a structural component of the bacteriophage lambda tail tip complex that forms a C6-symmetric homohexameric adaptor ring bridging the C3-symmetric tail tip hub (gpL and gpI) and the first hexameric ring of the major tail tube protein (gpV). During tail morphogenesis, gpM cooperates with the tape measure protein (gpH) and chaperones (gpG/gpGT) to convert the 15S tail tip precursor into the 25S initiator complex that nucleates gpV tail tube polymerization, and in the mature virion its central pore forms part of the continuous channel for gpH* and viral DNA ejection.
