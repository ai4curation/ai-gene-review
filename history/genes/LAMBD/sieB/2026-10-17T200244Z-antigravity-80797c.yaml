  summary: Complete end-to-end curation of Escherichia phage Lambda gene sieB (P03762)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene sieB (UniProtKB:P03762). Reviewed 1 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in sieB-notes.md.

    Biological summary: Integral inner-membrane superinfection exclusion protein (184 amino acids) of Escherichia phage lambda that is expressed in lysogens from a rightward promoter located between ral and N (counter to PL transcription) and aborts lytic development of superinfecting phages lacking a cognate escape (esc) determinant. Contains two N-terminal transmembrane alpha-helices that anchor the protein in the host cytoplasmic membrane and is homologous to the SieB exclusion protein of Salmonella phage P22. Upon superinfection by susceptible heteroimmune phages, SieB triggers premature cessation of macromolecular synthesis and abortive infection, whereas phage lambda itself evades SieB-mediated exclusion during lytic growth via expression of an overlapping escape factor.
