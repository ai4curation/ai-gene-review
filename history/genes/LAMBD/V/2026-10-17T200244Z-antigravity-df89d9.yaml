  summary: Complete end-to-end curation of Escherichia phage Lambda gene V (P03733)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene V (UniProtKB:P03733). Reviewed 9 GO annotations, synthesized 1 core function(s) across 6 literature/database references, and authored detailed mechanistic notes in V-notes.md.

    Biological summary: Major tail protein gpV is the principal structural subunit of the long, flexible, non-contractile tail tube of bacteriophage lambda. Comprising an N-terminal tube-forming domain (gpVN) and a C-terminal immunoglobulin-like Big2 domain (gpVC), gpV polymerizes upon encountering the tail tip initiation complex (gpM/gpL) and the gpH-gpG-gpGT chaperone-tape measure scaffold into a stack of 31 to 32 C6-symmetric hexameric rings that enclose the tape measure protein (gpH*) and form the hollow conduit for viral DNA ejection into the host cell.
