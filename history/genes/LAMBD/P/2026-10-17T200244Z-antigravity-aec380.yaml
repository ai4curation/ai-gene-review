  summary: Complete end-to-end curation of Escherichia phage Lambda gene P (P03689)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene P (UniProtKB:P03689). Reviewed 5 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in P-notes.md.

    Biological summary: Replicative helicase loader protein required for the initiation of bidirectional theta-mode replication of bacteriophage lambda DNA. Forms a pentameric complex on the hexameric Escherichia coli DnaB helicase (DnaB6:P5) that cracks open the DnaB ring to load single-stranded DNA into its central channel while suppressing DnaB ATPase activity, and docks onto the origin-bound lambda O initiator (O-some) at ori lambda prior to DnaK/DnaJ/GrpE chaperone-mediated P release and fork activation.
