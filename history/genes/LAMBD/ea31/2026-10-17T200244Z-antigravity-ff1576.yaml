  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene ea31 (UniProtKB:P03753). Reviewed 0 GO annotations, synthesized 1 core function(s) across 1 literature/database references, and authored detailed mechanistic notes in ea31-notes.md.

    Biological summary: Uncharacterized 296-amino-acid (33.5 kDa) protein encoded in the nonessential b2 region of bacteriophage lambda between ea47 and ea59. Contains a conserved C-terminal HNH endonuclease domain (HNHc, InterPro:IPR003615, residues 197-244), suggesting a putative DNA endonuclease or nicking activity, although its physiological substrate and role during phage lambda infection remain experimentally uncharacterized.
