  summary: Complete end-to-end curation of Escherichia phage Lambda gene D (P03712)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene D (UniProtKB:P03712). Reviewed 7 GO annotations, synthesized 1 core function(s) across 7 literature/database references, and authored detailed mechanistic notes in D-notes.md.

    Biological summary: Capsid decoration protein (gpD) of Escherichia phage lambda that assembles as homotrimeric spikes at the three-fold and quasi-three-fold axes on the exterior surface of the expanded T=7 icosahedral capsid. When DNA packaging triggers procapsid expansion, hydrophobic binding sites between major capsid protein (gpE) subunits are exposed and cooperatively bound by gpD trimers, whose N-terminal beta-strands augment gpE beta-sheets to mechanically cement the capsid shell against high internal DNA pressure and allow packaging of the full-length viral chromosome.
