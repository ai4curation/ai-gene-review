  summary: Complete end-to-end curation of Escherichia phage Lambda gene cro (P03040)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene cro (UniProtKB:P03040). Reviewed 14 GO annotations, synthesized 1 core function(s) across 9 literature/database references, and authored detailed mechanistic notes in cro-notes.md.

    Biological summary: Transcriptional repressor and lytic switch regulator of Escherichia phage lambda that antagonizes the lysogenic repressor CI to commit the phage to lytic development and facilitate prophage induction. Forms a stable homodimer via an antiparallel beta-sheet interface and uses an N-terminal helix-turn-helix motif to bind the six operator subsites at OR (OR1, OR2, OR3) and OL (OL1, OL2, OL3) with an affinity hierarchy opposite to that of CI, binding most tightly to OR3. Occupancy of OR3 directly represses the lysogenic maintenance promoter PRM to prevent de novo synthesis of CI during infection or UV-induced prophage derepression, while occupancy of OR1, OR2, and OL1-OL3 at higher Cro concentrations downregulates early rightward (PR) and leftward (PL) viral transcription—including expression of cII, cIII, N, and cro itself—to allow orderly progression into the late lytic phase.
