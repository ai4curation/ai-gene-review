  summary: Complete end-to-end curation of Escherichia phage Lambda gene ninB (P03765)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene ninB (UniProtKB:P03765). Reviewed 2 GO annotations, synthesized 1 core function(s) across 1 literature/database references, and authored detailed mechanistic notes in ninB-notes.md.

    Biological summary: Homodimeric single-stranded DNA-binding recombination mediator protein (NinB / Orf, 146 AA) encoded in the ninR region of bacteriophage lambda. Supplies a phage-encoded functional analog of the Escherichia coli RecFOR mediator complex that binds single-stranded DNA via a positively charged central groove (PDB:1PC6) and interacts with host SSB to promote homologous DNA recombination during phage infection.
