  summary: Complete end-to-end curation of Escherichia phage Lambda gene P03766 (P03766)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene P03766 (UniProtKB:P03766). Reviewed 1 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in P03766-notes.md.

    Biological summary: Uncharacterized 290-amino-acid enzyme (ORF290 / NinC) encoded in the ninR region of bacteriophage lambda between ninB and ninF. Contains a conserved Rossmann-like alpha/beta/alpha domain homologous to the phosphoadenosine phosphosulfate (PAPS) reductase / PP-loop ATP pyrophosphatase superfamily (residues 67-252), indicative of an nucleotide- or nucleic-acid-modifying catalytic activity whose physiological substrate during phage infection remains unknown.
