  summary: Complete end-to-end curation of Escherichia phage Lambda gene B (P03710)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene B (UniProtKB:P03710). Reviewed 8 GO annotations, synthesized 1 core function(s) across 6 literature/database references, and authored detailed mechanistic notes in B-notes.md.

    Biological summary: Portal protein (gpB) of Escherichia phage lambda that multimerizes into a 12-fold rotationally symmetric homododecameric ring at a single unique vertex of the icosahedral capsid. Processed by the prohead protease gpC via removal of its N-terminal 22 residues (yielding gpB*), the portal complex forms the central axial channel that nucleates procapsid assembly, docks the terminase motor (gpA/gpNu1) for ATP-driven viral DNA packaging, recruits the head-completion proteins gpW and gpFII for tail attachment, and serves as the conduit for genome ejection through the long flexible tail into the host cell.
