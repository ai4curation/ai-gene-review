  summary: Complete end-to-end curation of Escherichia phage Lambda gene A (P03708)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene A (UniProtKB:P03708). Reviewed 33 GO annotations, synthesized 3 core function(s) across 17 literature/database references, and authored detailed mechanistic notes in A-notes.md.

    Biological summary: Terminase large subunit (gpA) of Escherichia phage lambda that serves as the catalytic endonuclease and ATP-driven DNA translocation motor of the viral terminase holoenzyme. Its C-terminal maturation domain catalyzes divalent-cation-dependent, site-specific staggered nicking at the cosN sub-site of concatemeric phage DNA, while its N-terminal motor domain houses a high-affinity ATPase center and strand-separation activity that unwinds the nicked 12-base cohesive ends and powers rapid translocation of unit-length viral dsDNA into the procapsid through the portal vertex.
