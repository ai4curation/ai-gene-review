  summary: Complete end-to-end curation of Escherichia phage Lambda gene rexA (P68924)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene rexA (UniProtKB:P68924). Reviewed 0 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in rexA-notes.md.

    Biological summary: Cytoplasmic sensor and activator component (279 amino acids) of the two-component RexAB superinfection exclusion (abortive infection) system expressed from the lysogenic promoter PRM in Escherichia phage lambda prophages. Upon infection of a lambda lysogen by heterologous bacteriophages (such as T4 rII mutants) or when overexpressed relative to RexB, RexA is activated and interacts at a stoichiometry of at least two RexA subunits with the prophage inner-membrane protein RexB to trigger opening of the RexB ion channel pore. The resulting depolarization of the Escherichia coli cytoplasmic membrane causes a rapid loss of proton motive force and intracellular ATP, halting macromolecular synthesis and inducing cellular growth arrest or altruistic death that aborts lytic propagation of the superinfecting virus.
