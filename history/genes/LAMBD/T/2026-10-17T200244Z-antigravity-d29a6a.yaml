  summary: Complete end-to-end curation of Escherichia phage Lambda gene T (P03735)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene T (UniProtKB:P03735). Reviewed 6 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in T-notes.md.

    Biological summary: Tail assembly protein gpGT is a non-structural cytoplasmic chaperone produced by programmed -1 ribosomal frameshifting from gene G into the overlapping gene T open reading frame during translation of ~3.5% of G transcripts. Comprising an N-terminal G domain that binds gpG and the tail length tape measure protein (gpH) and a C-terminal T domain that binds the major tail tube subunit (gpV), gpGT bridges the chaperone-coated gpH ruler and incoming gpV monomers to direct tail tube polymerization to the proper length before dissociating prior to virion completion.
