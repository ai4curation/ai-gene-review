  summary: Complete end-to-end curation of Escherichia phage Lambda gene bor (P26814)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene bor (UniProtKB:P26814). Reviewed 1 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in bor-notes.md.

    Biological summary: Lysogenic conversion lipoprotein (Bor) of Escherichia phage lambda that is constitutively expressed from the integrated prophage during lysogeny in Escherichia coli and anchored via an N-terminal lipid-modified cysteine in the bacterial host cell envelope. Highly homologous to the plasmid ColV2-K94 Iss serum-resistance virulence protein, Bor protects the lysogenic E. coli host cell from complement-mediated serum killing.
