  summary: Complete end-to-end curation of Escherichia phage Lambda gene int (P03700)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene int (UniProtKB:P03700). Reviewed 15 GO annotations, synthesized 2 core function(s) across 10 literature/database references, and authored detailed mechanistic notes in int-notes.md.

    Biological summary: Heterobivalent tyrosine site-specific recombinase (integrase) that catalyzes both the integration of the bacteriophage lambda genome into the Escherichia coli chromosome during the establishment of lysogeny and, in complex with excisionase (Xis), the excision of the prophage upon lytic induction. Contains an N-terminal arm-type DNA-binding domain, a central core-type DNA-binding domain, and a C-terminal catalytic domain that cleaves and rejoins DNA strands via a transient 3'-phosphotyrosyl covalent intermediate at Tyr342 within higher-order tetrameric intasome complexes.
