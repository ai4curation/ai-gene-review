  summary: Complete end-to-end curation of Escherichia phage Lambda gene Nu1 (P03707)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene Nu1 (UniProtKB:P03707). Reviewed 11 GO annotations, synthesized 2 core function(s) across 8 literature/database references, and authored detailed mechanistic notes in Nu1-notes.md.

    Biological summary: Terminase small subunit (gpNu1) of Escherichia phage lambda that forms the viral DNA recognition and regulatory component of the heterotrimeric terminase holoenzyme (one gpA large subunit associated with two gpNu1 small subunits). Using an N-terminal winged helix-turn-helix domain, gpNu1 binds and bends specific R elements within the cosB sub-site of concatemeric viral DNA cooperatively with host integration host factor (IHF), positioning the catalytic gpA subunit at cosN to initiate site-specific maturation cleavage and ATP-driven viral DNA packaging into the procapsid. It also possesses a low-affinity, DNA-stimulated ATPase activity that modulates cos binding and cleavage dynamics.
