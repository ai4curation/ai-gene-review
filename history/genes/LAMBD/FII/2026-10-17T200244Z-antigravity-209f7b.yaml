  summary: Complete end-to-end curation of Escherichia phage Lambda gene FII (P03714)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene FII (UniProtKB:P03714). Reviewed 4 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in FII-notes.md.

    Biological summary: Head-tail connector protein (gpFII) of Escherichia phage lambda that polymerizes as a hexameric ring onto the gpW-capped portal vertex of the DNA-filled capsid at the final step of head morphogenesis. Forming the bottom ring of the head-tail connector complex (gpB12-gpW6-gpFII6), gpFII uses its N-terminal region to bind the gpW-modified head and its bottom surface loops to bind the tail terminator protein gpU of the pre-assembled tail, joining the head and tail into an infectious virion.
