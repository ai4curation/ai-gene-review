    Biological summary: Uncharacterized 60-amino-acid (7.4 kDa) basic early protein (Nin60) encoded in the translationally coupled ninR region of the bacteriophage lambda pR operon between ninD and ninF. Founding member of the conserved phage NinE protein family (Pfam:PF05322, InterPro:IPR007986) with one binary protein interaction recorded in IntAct, although its molecular function and physiological role during lambda infection remain experimentally uncharacterized.
