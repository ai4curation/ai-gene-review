  summary: Complete end-to-end curation of Escherichia phage Lambda gene Rz (P00726)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene Rz (UniProtKB:P00726). Reviewed 6 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in Rz-notes.md.

    Biological summary: Inner membrane spanin subunit (i-spanin) that forms a periplasm-spanning heterotetrameric complex with the outer membrane lipoprotein Rz1 (o-spanin) to execute the final step of bacteriophage lambda host cell lysis. Anchored in the Escherichia coli inner membrane by an N-terminal transmembrane helix (residues 5-25), Rz extends a disulfide-linked alpha-helical coiled-coil periplasmic domain through the peptidoglycan meshwork to bind Rz1 at the outer membrane. Once the R endolysin degrades the peptidoglycan layer, liberated Rz-Rz1 spanin complexes oligomerize and undergo a conformational collapse that fuses the inner and outer membranes, disrupting the host outer membrane to release progeny virions.
