  summary: Complete end-to-end curation of Escherichia phage Lambda gene xis (P03699)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene xis (UniProtKB:P03699). Reviewed 4 GO annotations, synthesized 2 core function(s) across 6 literature/database references, and authored detailed mechanistic notes in xis-notes.md.

    Biological summary: Winged-helix DNA-binding architectural protein and recombination directionality factor (excisionase) required for the excision of the bacteriophage lambda prophage from the Escherichia coli chromosome during lytic induction. Cooperatively binds in a head-to-tail trimeric micronucleoprotein filament across the X1-X1.5-X2 sites of the attR attachment region, bending the DNA by over 70 degrees and recruiting the N-terminal arm-binding domain of lambda integrase (Int) via its C-terminal tail to promote excisive intasome assembly while inhibiting reintegration.
