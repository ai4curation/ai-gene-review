  summary: Complete end-to-end curation of Escherichia phage Lambda gene U (P03732)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene U (UniProtKB:P03732). Reviewed 7 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in U-notes.md.

    Biological summary: Tail terminator protein gpU is a structural protein that forms a C6-symmetric homohexameric ring capping the proximal end of the bacteriophage lambda tail tube. During tail morphogenesis, once the major tail protein (gpV) has polymerized along the tape measure protein (gpH) to the required length, gpU binds the terminal gpV ring to arrest further polymerization and provides the docking interface for the tail completion protein (gpZ) and head-tail joining protein (gpFII) within the portal-neck complex.
