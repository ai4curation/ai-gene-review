  summary: Complete end-to-end curation of Escherichia phage Lambda gene cII (P03042)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene cII (UniProtKB:P03042). Reviewed 4 GO annotations, synthesized 1 core function(s) across 8 literature/database references, and authored detailed mechanistic notes in cII-notes.md.

    Biological summary: Homotetrameric helix-turn-helix transcriptional activator of Escherichia phage lambda that serves as the primary decision-making switch for establishing lysogeny after host infection. Assembles into an asymmetric dimer-of-dimers tetramer that recognizes direct-repeat sequences (TTGC-N6-TTGC) flanking the -35 promoter element to recruit host RNA polymerase and coordinately activate three viral promoters: PRE (driving initial synthesis of the CI immunity repressor), PI (driving synthesis of the Int integrase for prophage integration), and PaQ (producing an antisense RNA that downregulates the late lytic antiterminator Q). Because its unstructured C-terminal tail targets it for rapid ATP-dependent proteolysis by the host membrane metalloprotease FtsH (HflB)—a process counteracted by the viral protease inhibitor CIII—the intracellular half-life and accumulation of CII directly couple the phage lysis-lysogeny decision to host physiological state and multiplicity of infection.
