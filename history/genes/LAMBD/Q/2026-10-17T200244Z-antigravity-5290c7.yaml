  summary: Complete end-to-end curation of Escherichia phage Lambda gene Q (P03047)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene Q (UniProtKB:P03047). Reviewed 7 GO annotations, synthesized 1 core function(s) across 7 literature/database references, and authored detailed mechanistic notes in Q-notes.md.

    Biological summary: Late-gene transcription antitermination factor (207 amino acids) of Escherichia phage lambda that modifies bacterial RNA polymerase (RNAP) initiating at the late promoter PR' into a termination-resistant elongation complex, enabling expression of the ~26 kb late lytic operon encoding virion morphogenesis and host lysis proteins. Contains a helix-turn-helix DNA-binding domain and an extended beta-ribbon arm stabilized by a four-cysteine (Cys118, Cys121, Cys144, Cys147) zinc-binding module. Binds specifically to the qut DNA element between the -35 and -10 regions of PR' while RNAP is arrested at the sigma70-dependent +16/+17 early elongation pause, contacts sigma70 region 4 and the RNAP beta-flap tip helix, and directly recruits the host elongation factor NusA to form a protective ring at the RNAP RNA exit channel that suppresses transcriptional pausing and both intrinsic and Rho-dependent termination.
