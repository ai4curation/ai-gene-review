  summary: Complete end-to-end curation of Escherichia phage Lambda gene C (P03711)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene C (UniProtKB:P03711). Reviewed 8 GO annotations, synthesized 2 core function(s) across 7 literature/database references, and authored detailed mechanistic notes in C-notes.md.

    Biological summary: Bifunctional capsid morphogenesis locus of Escherichia phage lambda that encodes both the full-length procapsid maturation serine protease gpC (P03711-1) and, via an internal in-frame translation initiation site, the internal scaffolding protein gpNu3 (P03711-2, identical to the C-terminal 145 residues of gpC). During prohead assembly, gpNu3 transiently scaffolds the portal (gpB) and major capsid (gpE) subunits while recruiting gpC into the procapsid core; the N-terminal serine protease domain of gpC then degrades the gpNu3 scaffold, cleaves the N-terminus of portal protein gpB to gpB*, catalyzes covalent fusion and processing of gpC with gpE to generate minor capsid proteins pX1 and pX2, and undergoes autoproteolysis to prime the procapsid for viral DNA packaging.
