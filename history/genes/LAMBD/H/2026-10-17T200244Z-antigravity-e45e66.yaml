  summary: Complete end-to-end curation of Escherichia phage Lambda gene H (P03736)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene H (UniProtKB:P03736). Reviewed 10 GO annotations, synthesized 1 core function(s) across 7 literature/database references, and authored detailed mechanistic notes in H-notes.md.

    Biological summary: Tail length tape measure protein gpH is a multifunctional minor tail protein that acts as a molecular ruler to determine the exact length of the bacteriophage lambda tail tube during morphogenesis and subsequently forms part of the trans-envelope conduit for viral DNA ejection. Chaperoned by gpG and gpGT during assembly, gpH associates with the tail tip complex (gpJ, gpI, gpL, gpK, and gpM) to nucleate polymerization of 31 to 32 hexameric rings of the major tail protein (gpV), undergoes proteolytic maturation within the tail lumen into gpH* and C-terminal gpHC, and upon host receptor binding is extruded to assemble a hexameric trans-envelope channel across the bacterial cell envelope.
