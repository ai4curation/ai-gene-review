  summary: Complete end-to-end curation of Escherichia phage Lambda gene S (P03705)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene S (UniProtKB:P03705). Reviewed 8 GO annotations, synthesized 1 core function(s) across 8 literature/database references, and authored detailed mechanistic notes in S-notes.md.

    Biological summary: Dual-start late lysis gene that encodes both the lethal class I holin S-105 (initiating at Met-3) and the antiholin lysis inhibitor S-107 (initiating at Met-1). S-105 is a three-transmembrane-domain protein that accumulates in the Escherichia coli inner membrane during the late phase of the infective cycle until an allele-specific triggering time, when it rapidly coalesces into two-dimensional rafts and forms micron-scale (>300 nm) lesions that collapse the proton motive force and allow the cytoplasmic endolysin R to escape into the periplasm. S-107 possesses an additional positively charged Lys-2 residue at its N-terminus that prevents translocation of its first transmembrane domain across an energized inner membrane, enabling S-107 to heterodimerize with S-105 and inhibit premature raft formation and host cell lysis until membrane depolarization occurs.
