  summary: Complete end-to-end curation of Escherichia phage Lambda gene J (P03749)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene J (UniProtKB:P03749). Reviewed 11 GO annotations, synthesized 1 core function(s) across 7 literature/database references, and authored detailed mechanistic notes in J-notes.md.

    Biological summary: Host specificity protein gpJ (central tail fiber protein) is a large C3-symmetric homotrimeric structural protein forming the distal hub and central receptor-binding fiber of the bacteriophage lambda tail tip complex. During tail morphogenesis, the gpJ trimer nucleates assembly of the 15S tail tip precursor with gpI, gpL, and gpK; during infection, the C-terminal receptor-binding domains of trimeric gpJ bind directly to the trimeric Escherichia coli outer membrane maltoporin LamB, mediating irreversible entry receptor attachment and triggering conformational opening of the tail tip complex for gpH* extrusion and viral DNA ejection.
