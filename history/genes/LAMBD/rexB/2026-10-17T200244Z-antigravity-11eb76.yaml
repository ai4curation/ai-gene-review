  summary: Complete end-to-end curation of Escherichia phage Lambda gene rexB (P03759)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene rexB (UniProtKB:P03759). Reviewed 1 GO annotations, synthesized 2 core function(s) across 6 literature/database references, and authored detailed mechanistic notes in rexB-notes.md.

    Biological summary: Polytopic four-transmembrane inner-membrane protein (144 amino acids) of Escherichia phage lambda that forms the pore-forming subunit of the prophage-encoded RexAB superinfection exclusion system and also modulates host ClpP-dependent proteolysis. Co-expressed with cI and rexA in lambda lysogens, RexB resides in the Escherichia coli cytoplasmic membrane and opens as an ion-conducting pore upon binding at least two activated RexA molecules during superinfection by susceptible phages (such as T4 rII or lambda ren mutants), depolarizing the membrane and depleting ATP to abort lytic infection. In addition, RexB inhibits host ClpP protease-mediated degradation of short-lived substrates—including the phage lambda replication initiator O and the labile antitoxins Phd and MazE of bacterial toxin-antitoxin systems—thereby protecting the lysogenic host from toxin-antitoxin-mediated cell death during nutrient stress.
