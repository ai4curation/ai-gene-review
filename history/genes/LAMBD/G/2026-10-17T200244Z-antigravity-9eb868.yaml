  summary: Complete end-to-end curation of Escherichia phage Lambda gene G (P03734)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene G (UniProtKB:P03734). Reviewed 6 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in G-notes.md.

    Biological summary: Tail assembly protein gpG is a non-structural cytoplasmic chaperone essential for bacteriophage lambda tail morphogenesis. Synthesized in a ~30:1 molar excess over the programmed -1 ribosomal frameshift fusion protein gpGT, gpG binds along the length of the tail length tape measure protein (gpH) in the bacterial host cytoplasm to maintain gpH in a soluble, assembly-competent state, promote formation of the 25S tail tip initiator complex, and coordinate with gpGT to template polymerization of the major tail protein (gpV) before being displaced from the maturing tail.
