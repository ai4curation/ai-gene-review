  summary: Complete end-to-end curation of Escherichia phage Lambda gene ninG (P03770)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene ninG (UniProtKB:P03770). Reviewed 2 GO annotations, synthesized 1 core function(s) across 1 literature/database references, and authored detailed mechanistic notes in ninG-notes.md.

    Biological summary: Branched-DNA structure-specific endonuclease (NinG / Rap, 204 AA) encoded in the ninR region of bacteriophage lambda. Acts as a phage-encoded Holliday junction and D-loop resolvase functionally analogous to Escherichia coli RuvC that cleaves crossover DNA intermediates during homologous DNA recombination.
