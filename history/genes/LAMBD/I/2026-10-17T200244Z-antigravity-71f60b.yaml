  summary: Complete end-to-end curation of Escherichia phage Lambda gene I (P03730)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene I (UniProtKB:P03730). Reviewed 3 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in I-notes.md.

    Biological summary: Minor tail protein gpI (baseplate hub protein) is an essential structural subunit of the bacteriophage lambda tail tip complex. Present as a C3-symmetric trimer in the mature tail tip, gpI assembles with the central tail fiber (gpJ), tip attachment protein (gpL), and gpK to form the 15S tail tip precursor during tail morphogenesis, anchors three copies of the C-terminal cleaved fragment of the tape measure protein (gpHC, residues 818-849) within the tail tip lumen, and participates in the conformational opening of the tail tip conduit during viral genome ejection.
