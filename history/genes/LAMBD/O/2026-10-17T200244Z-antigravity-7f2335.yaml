  summary: Complete end-to-end curation of Escherichia phage Lambda gene O (P03688)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene O (UniProtKB:P03688). Reviewed 4 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in O-notes.md.

    Biological summary: Origin-recognition and replication initiator protein required for early bidirectional theta-mode replication of the bacteriophage lambda double-stranded DNA genome. Binds cooperatively via its N-terminal winged-helix domain to four 19-bp iteron repeats within the phage replication origin (ori lambda) to assemble the nucleosome-like O-some complex, and recruits the phage P-host DnaB helicase loader complex via its C-terminal domain to initiate origin unwinding.
