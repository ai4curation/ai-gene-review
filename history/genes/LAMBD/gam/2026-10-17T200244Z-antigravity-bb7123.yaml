  summary: Complete end-to-end curation of Escherichia phage Lambda gene gam (P03702)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene gam (UniProtKB:P03702). Reviewed 6 GO annotations, synthesized 1 core function(s) across 7 literature/database references, and authored detailed mechanistic notes in gam-notes.md.

    Biological summary: Homodimeric B-form double-stranded DNA mimic (host-nuclease inhibitor protein Gam) that binds directly to the DNA-binding channel of the Escherichia coli RecBCD helicase-nuclease complex and competitively blocks DNA binding without subunit displacement. Produced as full-length (GamL) and N-terminally truncated (GamS) isoforms from alternative translation initiation sites, both of which inhibit all RecBCD exonuclease, endonuclease, and helicase activities to protect linear phage DNA ends from host degradation and enable rolling-circle DNA replication and Red-mediated recombination.
