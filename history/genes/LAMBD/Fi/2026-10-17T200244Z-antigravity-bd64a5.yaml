  summary: Complete end-to-end curation of Escherichia phage Lambda gene Fi (P03709)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene Fi (UniProtKB:P03709). Reviewed 2 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in Fi-notes.md.

    Biological summary: DNA-packaging chaperone protein (gpFI) of Escherichia phage lambda that promotes efficient viral DNA genome packaging in the host cytoplasm by facilitating the productive docking of the terminase-DNA complex (gpA/gpNu1 bound to concatemeric viral DNA) onto empty procapsids. Organized as a two-domain protein connected by a flexible linker, gpFI uses its C-terminal domain to bind directly to the major capsid protein gpE on the prohead shell while its N-terminal domain assists in coordinating the terminase-DNA complex.
