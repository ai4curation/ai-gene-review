  summary: Complete end-to-end curation of Escherichia phage Lambda gene L (P03738)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene L (UniProtKB:P03738). Reviewed 10 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in L-notes.md.

    Biological summary: Minor tail protein gpL (tip attachment protein) is an iron-sulfur cluster-containing structural subunit of the bacteriophage lambda tail tip complex. Present in three copies per virion, gpL coordinates a [4Fe-4S] cluster via four conserved C-terminal cysteine residues (Cys173, Cys182, Cys205, and Cys212) required for proper folding and tail morphogenesis, associates with the baseplate hub protein (gpI), central tail fiber (gpJ), and the C-terminal segment of the tape measure protein (gpHC) to form the tail tip complex, and transmits receptor-triggered conformational changes that open the tail conduit for viral genome ejection.
