  summary: Complete end-to-end curation of Escherichia phage Lambda gene Rz1 (Q37935)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene Rz1 (UniProtKB:Q37935). Reviewed 9 GO annotations, synthesized 1 core function(s) across 9 literature/database references, and authored detailed mechanistic notes in Rz1-notes.md.

    Biological summary: Outer membrane lipoprotein spanin subunit (o-spanin) encoded entirely within the +1 reading frame of the Rz gene. Following cleavage of its 19-residue signal peptide by signal peptidase II and lipid modification at Cys-20, the mature 40-residue proline-rich Rz1 lipoprotein is anchored to the inner leaflet of the Escherichia coli outer membrane, where it forms a disulfide-linked homodimer via Cys-29 and binds the C-terminal periplasmic domain of the inner membrane subunit Rz (i-spanin). Once endolysin R degrades the periplasmic peptidoglycan meshwork, the periplasm-spanning Rz-Rz1 complex oligomerizes and mediates fusion of the inner and outer membranes, rupturing the host outer membrane for progeny phage release.
