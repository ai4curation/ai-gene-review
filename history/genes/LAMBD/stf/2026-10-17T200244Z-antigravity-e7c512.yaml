  summary: Complete end-to-end curation of Escherichia phage Lambda gene stf (P03764)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene stf (UniProtKB:P03764). Reviewed 10 GO annotations, synthesized 1 core function(s) across 7 literature/database references, and authored detailed mechanistic notes in stf-notes.md.

    Biological summary: Side tail fiber protein gpStf is a structural protein that forms four long, thin, jointed side tail fibers on ancestral bacteriophage Ur-lambda virions (disrupted by a laboratory frameshift mutation in lambda PaPa). Twelve copies of gpStf assemble with the assistance of the tail fiber assembly chaperone gpTfa, anchoring via their N-terminal domains (gpStfN) as a dodecameric collar around the junction between the distal hexameric ring of major tail tube protein (gpV) and the hexameric ring of distal tail protein (gpM), while their C-terminal receptor-binding tips reversibly bind the Escherichia coli outer membrane porin OmpC to accelerate primary host adsorption and orient the virion for LamB engagement.
