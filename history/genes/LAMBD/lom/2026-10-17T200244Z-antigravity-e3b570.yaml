  summary: Complete end-to-end curation of Escherichia phage Lambda gene lom (P03701)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene lom (UniProtKB:P03701). Reviewed 2 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in lom-notes.md.

    Biological summary: Lysogenic conversion outer membrane protein (Lom) of Escherichia phage lambda that is expressed by the integrated prophage during lysogeny in Escherichia coli and incorporated into the bacterial host outer membrane. Belonging to the OmpX/PagC/Ail family of outer membrane beta-barrel virulence proteins, Lom modifies the host cell envelope and contributes to adhesion of lysogenic E. coli to mammalian epithelial cells.
