  summary: Complete end-to-end curation of Escherichia phage Lambda gene ren (P03761)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene ren (UniProtKB:P03761). Reviewed 0 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in ren-notes.md.

    Biological summary: Early lytic anti-exclusion protein (96 amino acids) of Escherichia phage lambda, encoded immediately downstream of the replication genes O and P in the rightward PR operon, that protects lytically replicating phage lambda from self-exclusion by the prophage-encoded RexAB abortive infection system. Without functional Ren, lytic lambda DNA replication triggers RexA-dependent activation of the RexB inner-membrane pore and premature cessation of phage growth; Ren counteracts this pathway so that prophage induction and homoimmune superinfection variants can complete the lytic cycle.
