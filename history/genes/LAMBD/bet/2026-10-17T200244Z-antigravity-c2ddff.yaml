  summary: Complete end-to-end curation of Escherichia phage Lambda gene bet (P03698)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene bet (UniProtKB:P03698). Reviewed 3 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in bet-notes.md.

    Biological summary: Single-stranded DNA-binding and annealing protein (Red beta, RecT/Redbeta family synaptase) of the bacteriophage lambda Red homologous recombination system. Loaded onto nascent 3'-single-stranded DNA overhangs through direct interaction with the 5'-to-3' exonuclease Exo, it protects single-stranded DNA and catalyzes ATP-independent annealing of complementary DNA strands to drive homologous recombination and late rolling-circle phage DNA replication.
