  summary: Complete end-to-end curation of Escherichia phage Lambda gene P03772 (P03772)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene P03772 (UniProtKB:P03772). Reviewed 5 GO annotations, synthesized 2 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in P03772-notes.md.

    Biological summary: Calcineurin-like metallophosphoesterase (lambda protein phosphatase, encoded by ninI / ORF221, EC 3.1.3.16 / EC 3.1.3.48) that catalyzes the Mn2+-dependent dephosphorylation of phosphoserine, phosphothreonine, and phosphotyrosine residues in proteins. Adopts a conserved beta-alpha-beta-alpha-beta core fold housing a dinuclear Mn(II) active-site center that activates a bridging water molecule for direct nucleophilic attack on protein phosphomonoester substrates.
