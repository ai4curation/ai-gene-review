  summary: Complete end-to-end curation of Escherichia phage Lambda gene exo (P03697)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene exo (UniProtKB:P03697). Reviewed 5 GO annotations, synthesized 2 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in exo-notes.md.

    Biological summary: Homotrimeric toroidal 5'-to-3' double-stranded DNA exonuclease (Red alpha, EC 3.1.11.3) of the bacteriophage lambda Red recombination system. Threading double-stranded DNA ends into its tapered central channel, it processively hydrolyzes the 5'-terminated strand in a Mg2+-dependent manner to release 5'-mononucleotides and extrude a 3'-single-stranded DNA overhang, onto which it loads the partner single-strand annealing protein Beta (bet) to drive homologous recombination via double-strand break repair and single-strand annealing as well as late rolling-circle phage DNA replication.
