  summary: Complete end-to-end curation of Escherichia phage Lambda gene ral (P03703)
  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene ral (UniProtKB:P03703). Reviewed 3 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in ral-notes.md.

    Biological summary: Early anti-restriction and modification-enhancement protein (66 amino acids) of Escherichia phage lambda, encoded in the PL operon between N and cIII, that counteracts the host Escherichia coli Type I restriction-modification system (EcoKI, HsdR2M2S1). Rather than acting as a DNA mimic, Ral interacts directly with the HsdM/HsdS methyltransferase-specificity core of EcoKI to shift its conformational state, inhibiting restriction endonuclease cleavage of unmodified viral DNA while stimulating de novo adenine methylation of completely unmethylated EcoKI recognition sites so that newly replicated phage genomes become modified and protected.
