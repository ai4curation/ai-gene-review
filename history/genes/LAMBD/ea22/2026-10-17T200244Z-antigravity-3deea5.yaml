    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene ea22 (UniProtKB:P03756). Reviewed 0 GO annotations, synthesized 1 core function(s) across 1 literature/database references, and authored detailed mechanistic notes in ea22-notes.md.

    Biological summary: Early pL-operon protein of 182 amino acids (20.9 kDa) belonging to the conserved lambdoid Ead/Ea22 family (Pfam:PF13935, InterPro:IPR025153). Contains a central coiled-coil region (residues 63-90) and a C-terminal alpha+beta homodimerization domain (residues 102-182) whose solution NMR structure has been determined (PDB:8DSX), though its direct molecular target in Escherichia coli remains experimentally uncharacterized.
