  details: |
    Completed comprehensive gene review for Escherichia phage Lambda (NCBITaxon:2681611) gene ea10 (UniProtKB:P68658). Reviewed 1 GO annotations, synthesized 1 core function(s) across 1 literature/database references, and authored detailed mechanistic notes in ea10-notes.md.

    Biological summary: Early leftward pL-operon accessory protein Ea10 (122 AA, DUF2528 family) encoded in the non-essential b-N region of bacteriophage lambda. Genetically associated with the Tro phenotype, in which derepressed leftward transcription in cro-deficient, thermolabile cI mutant phages triggers shutoff of host Escherichia coli macromolecular synthesis at restrictive temperatures, although its direct molecular target and biochemical mechanism remain uncharacterized.
