    Biological summary: Uncharacterized 56-amino-acid (6.4 kDa) early protein encoded in the translationally coupled ninR region of the bacteriophage lambda pR operon between ninE and ninG (rap). Founding member of the conserved phage NinF domain family (Pfam:PF05810, InterPro:IPR008712) with three binary protein-protein interactions recorded in IntAct, although its specific molecular function and biological role during lambda infection remain experimentally uncharacterized.
