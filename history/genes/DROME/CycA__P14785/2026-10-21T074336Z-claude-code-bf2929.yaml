  summary: 'Create review: CycA (P14785, canonical isoform A)'
  details: |
    De-novo review of the reviewed canonical CycA product P14785 (FBgn0000404), written in its own folder because genes/DROME/CycA holds M9NFR3. It is independent of ProtNLM2 predictions, and falcon/perplexity deep research failed (auth/quota), so evidence comes from cached publications. All 38 GOA rows were reviewed. Accepted: GO:0016538 kinase regulator activity (IBA/IDA/NAS), nucleus/cytoplasm/cytosol, embryonic mitotic-cycle regulation and syncytial cycles. Mitotic cell cycle (IEA, IMP) was modified to G2/M transition, sister chromatid segregation to its regulation, regulation of mitotic nuclear division to positive regulation, and regulation of exit from mitosis to negative regulation of APC-dependent catabolism (CycA-Cdk inhibits Fzr). G1/S, cyclin A2-CDK2 complex (supported by fly CycA-Cdc2c data) and germline fusome/spectrosome/nucleus rows are kept as non-core. The MTOC IBA (B-cyclin/cyclin F seeded node) and positive regulation of stem cell differentiation (CycA is the Bam-Otu substrate) are marked over-annotated. Synapse and asymmetric neuroblast division are UNDECIDED because the full text is unavailable. Six generic protein binding rows were removed. Grounding: PANTHER PTHR10177:SF593 and PAINT nodes PTN000019791/PTN000020367/PTN007424001 were checked against PTHR10177-paint.tsv.
