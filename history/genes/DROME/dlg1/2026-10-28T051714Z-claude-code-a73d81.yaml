  summary: 'Create review: dlg1'
  details: |
    De novo review of Drosophila dlg1 (P31007, 97 GOA rows) from cached literature and PubMed, with a manual deep-research summary. GMP kinase activity and the derived GMP/GDP metabolic process rows were removed because the MAGUK GUK domain is non-catalytic (PMID:26740169). Shaker protein-binding rows were modified to transmembrane transporter binding, and GukH protein-binding rows were removed. Follicle-cell fate, EGFR, germ plasm and immune rows were marked over-annotated as downstream of polarity loss. A NEW protein-macromolecule adaptor activity was added for the Pins-Dlg-Khc-73 bridge (PMID:19766567). Core functions cover the epithelial basolateral polarity and septate junction scaffold, the NMJ postsynaptic scaffold, and the cortical adaptor for spindle orientation.
