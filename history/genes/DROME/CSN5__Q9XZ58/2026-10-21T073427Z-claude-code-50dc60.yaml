  summary: 'Create review: CSN5 (Q9XZ58, canonical CSN5-PA)'
  details: |
    De-novo review of the reviewed canonical CSN5-PA entry (Q9XZ58), the experimentally characterised same-gene relative of ProtNLM2 benchmark entry A0A0B4KHM2; independent of ProtNLM2 predictions. Falcon deep research failed (auth) and perplexity-lite fallback failed (quota), so review is based on cached publications and UniProt. Added a bioinformatics check (JAMM His135/His137/Asp148 intact; PANTHER 19.0 PTHR10410:SF6 with CSN5 orthologs). 38 GOA rows reviewed: core metal-dependent deNEDDylase activity (IDA), protein deneddylation (IMP), COP9 signalosome, cytoplasm/nucleus accepted; peptidase activity and deNEDDylase IBA modified to GO:0140758; regulation of protein neddylation (NAS) modified to protein deneddylation; oocyte axis specification rows marked over-annotated (mei-41-suppressible checkpoint effect); deep-node metal-dependent deubiquitinase IBA (PTN000045368) marked over-annotated; 7 generic protein binding rows removed; developmental rows kept as non-core. No NEW annotations.
