  details: |
    Re-review of the IBA REMOVE on GO:0005777 peroxisome (IBD at PTN002483519). The action stands. The old reason ended by calling the IBA an automated row removed where the curator ISS row was only marked over-annotated; that distinction is not a ground. The reason now states the tree (seeds human, mouse and rat IDH1 in the animal clade PTN000930158 that holds fly Idh, plus yeast IDP3 and an Aspergillus enzyme in the fungal sister clade PTN001722017) and the divergence evidence: C-termini read from UniProt show a PTS1-like tripeptide in human (AKL), mouse (AKL), zebrafish (PKL), Anopheles (SRL), Trichoplax (SKL), yeast IDP3 (CKL) and Aspergillus (ARL), while fly Idh ends AVAAK, so the signal was lost on the fly lineage. Quotes untouched.
