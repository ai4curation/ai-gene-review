  summary: 'Create review: Serinc isoform F (M9PFR2)'
  details: |
    De-novo review of the UniProt gene-centric canonical isoform of Drosophila Serinc (FBgn0028399/CG4672), written independently of any ProtNLM output. Both GOA rows (GO:0016020 membrane, IBA from PTN000043695 and IEA from InterPro IPR005016) are ACCEPTed; GO:0016021 was checked at OLS4 and is obsolete, so no refinement exists. One NEW row, GO:0008289 lipid binding, is added with evidence ISS rather than IDA: a new sequence analysis in Serinc__M9PFR2-bioinformatics/ shows the cryo-EM study PMID:31907454 numbered its residues by isoform A (Q9VV58), and isoform F shares the lipid-binding groove and 17 of 18 named residues but diverges completely after isoform-A residue 419, losing Lys438 and the final transmembrane helix. Scramblase activity and antiviral process terms are deliberately not transferred from human SERINC3/5 (PTHR10383:SF51/:SF16) or yeast TMS1, since SF9 is a catch-all of non-vertebrate members and the family's only PAINT node propagates membrane alone. Deep research failed twice (falcon and the perplexity-lite fallback both timed out), which is recorded in the notes file.
