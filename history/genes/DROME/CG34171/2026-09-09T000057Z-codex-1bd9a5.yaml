  summary: Review CG34171-PC catalytic-region loss and ProtNLM activity prediction
  details: |
    Preserved X2JEK1 as the native 176-aa PC product and distinguished the 292-aa PB isoform A8DZ15. Reproduced H72/D124 conservation, missing short-product catalytic-serine region, and long-product F222 substitution using two MAFFT modes and reference-domain controls. Accepted the explicit NOT IKR annotation; kept proteolysis UNDECIDED because intrinsic catalytic loss does not exclude cofactor participation. ProtNLM GO:0004252 assessed NPI without forcing an unsuitable error subtype. Falcon research and artifact completed and were critiqued; primary full text, original prediction metadata, source records and reproducible analysis retained. Main validation passes with two deliberate advisories; prediction validation has zero errors/warnings, one title and two quotes verified.
