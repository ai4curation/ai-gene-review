  summary: 'Create review: ea (easter)'
  details: |
    De-novo review of Drosophila Easter (P13582), the experimentally characterised PTHR24256 relative used as transfer reference for CG30288; ProtNLM2 predictions not consulted. Deep research failed (falcon 403 auth, perplexity-lite quota), so review rests on cached GOA-cited papers plus PMID:20605458 and PMID:16566925. All 42 GOA rows reviewed: serine-type endopeptidase activity, proteolysis, Toll receptor ligand protein activation cascade, D/V axis specification and perivitelline space ACCEPTed; extracellular region rows MODIFY to perivitelline space; GO:0009953 and GO:0007311 (oocyte polarization; ea acts post-fertilization) MODIFY to GO:0009950; ventral furrow formation marked over-annotated as a downstream dorsalization phenotype. Notes record PANTHER placement: ea alone in SF527, CG30288 in SF546; only PTN001207268 node-level functions (GO:0004252, GO:0006508, GO:0005576) are transferable, not the Toll/D-V role.
