  details: |
    Re-judged against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N18). GO:0032224 and GO:0032230 (positive regulation of cholinergic and GABAergic synaptic transmission) IBA: MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE. Single seed C. elegans nca-2 (IGI, PMID:18336069) in the same child clade as NA; the seed paper (abstract read) measures reduced neuromuscular transmission and synaptic calcium and gives the channel a role in carrying depolarisation to synapses. Absence of fly data is not a ground. Non-core because the terms follow from the sodium leak that sets excitability.
