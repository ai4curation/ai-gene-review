  summary: Complete review of Drosophila Rubicon (PTHR45971 family review)
  details: |
    Reviewed 4 GOA rows: early endosome ISS MODIFY to late endosome (glial Rubicon::mRFP on Rab7, rarely Rab5; PMID:37248218); phagocytosis IMP ACCEPT; phagocytic vesicle IDA ACCEPT; phosphatidylinositol phosphate binding IBA (root PTN002915557, Pacer-only seed) KEEP_AS_NON_CORE. NEW: negative regulation of autophagy (IMP, PMID:30783089), phagosome maturation (IMP, PMID:37248218), multivesicular body membrane (IDA, PMID:38977659), PI3K regulator activity (ISS from RUBCN). Fly Rubicon has RUBCN-like RUN+PIKBD+RH architecture and behaves like vertebrate Rubicon (anti-autophagy; pro-LAP). Added notes; fetched PMID:30783089, 34189208, 38977659, 35235784.
