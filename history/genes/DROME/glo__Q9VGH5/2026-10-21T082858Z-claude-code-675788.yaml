  summary: 'Create review: glo (Q9VGH5, full-length Glorund)'
  details: |
    De-novo review of the full-length 586-aa Glorund product (isoforms A/B/D), done independently of ProtNLM2 predictions. Falcon deep research failed (Edison 403; Perplexity fallback out of quota), so the review rests on cached primary papers (PMIDs 16516833, 19013444, 21460235, 28380354, 35699205, 37427795). PANTHER/PAINT placement checked with a new script (glo__Q9VGH5-bioinformatics): Glo is in its own subfamily PTHR13976:SF76, so only the deep-node IBA terms (RNA binding, nucleoplasm, regulation of RNA splicing, RNP complex) are transferred. Of the 17 GOA rows: RNA/nucleic acid binding refined to mRNA binding; regulation of translation refined to negative regulation of translation; bare protein binding removed per policy; developmental IMP rows kept as non-core (indirect, via otu splicing); wound-healing screen HMP marked over-annotated. NEW: mRNA regulatory element binding translation repressor activity, mRNA 3'-UTR binding, cytoplasm. The splicing role is flagged as inferred, not demonstrated, in Drosophila.
