  details: |
    De novo review of Drosophila muscle myosin heavy chain Mhc (P05661), 48 GOA rows. Motor (microfilament motor activity, actin filament binding), structural constituent of muscle, muscle contraction, myofibril assembly, sarcomere organization and A band/thick filament locations accepted as core. General component/process rows modified to muscle myosin complex, striated muscle myosin thick filament, A band and striated muscle myosin thick filament assembly (the latter also replacing regulation of myosin II filament assembly). Protein stabilization, muscle thin filament assembly, muscle cell differentiation and animal organ development marked over-annotated; bare protein binding removed; polytene chromosome puff and muscle organ development from an abstract-only screen left undecided. No NEW terms. Manual literature review written in place of deep research.
