  summary: 'Create review: Sp7 (MP2/PAE1)'
  details: |
    De-novo review of Sp7 (Q9V3Z2) as the experimentally characterised family-level comparator for ProtNLM2 benchmark gene CG4793, done independently of ProtNLM2 output. Falcon deep research failed (Edison auth error; perplexity-lite fallback timed out), so the review uses UniProt and cached primary literature (PMID:16256951, 16322759, 16861233, 19071960, 24260243, 31018123). Sp7 placed in PANTHER PTHR24256:SF537, separate from CG4793 (SF462) and easter (SF527); catalytic triad His182/Asp244/Ser341 verified intact. All 19 GOA rows reviewed: 18 ACCEPT (serine-type endopeptidase activity, proteolysis, extracellular region, melanization defense response, positive regulation of melanization) and defense response to Gram-positive bacterium KEEP_AS_NON_CORE. No NEW terms; zymogen activation raised as a question pending a comparator check.
