  details: |
    Q7KVQ7 is the short isoform (= Q9W2S1 residues 103-530, lacking only a disordered N-terminal extension; same PANTHER PTHR10281:SF1 as human VMP1). Added Shen et al. 2021 (PMID:34019822) fly Vmp1 evidence. ND MF -> MODIFY to phospholipid scramblase activity (PAINT PTN000031590); ER rows -> MODIFY to ER membrane; vacuolar membrane -> MARK_AS_OVER_ANNOTATED (historical name); Golgi organization and protein secretion IMP -> KEEP_AS_NON_CORE (screen phenotypes; PAINT did not propagate secretion). NEW scramblase activity (IBA) and autophagosome assembly (IMP, PMID:34019822; PAINT PTN000031591). Rewrote description and core_functions; added isoform comparison analysis in Tango5-bioinformatics/ and a notes file.
