  summary: 'IBA over-annotation re-review: glutamate receptor activity moved to REMOVE'
  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED (batch N17). GO:0001640 (IBD at PTN001173582): moved to REMOVE. PAINT records NOT IRD on the BOSS clade PTN004658103 for G protein-coupled glutamate receptor signaling pathway and for regulation of glutamatergic synaptic transmission, and blocks GO:0001640 itself on the sister orphan clade PTN008392231, but the activity was left to propagate to BOSS. A receptor outside glutamate receptor signaling cannot have a glutamate receptor activity, and the evidence on BOSS (divergent Venus flytrap domain that binds Sevenless, glucose response) agrees. The dependent IEA row GO:0007196 (GO_REF:0000108, inferred from GO:0001640, and a child of the lost process GO:0007216) was moved to REMOVE with it. Requested PAINT change: ADD_IRD for GO:0001640 at PTN004658103. Quotes unchanged. Validated.
