  details: |
    De novo review of Drosophila Atg18a (M9PER1, the accession carrying all 31 GOA rows including the PAINT IBAs; GOA fetched with the taxonName include field dropped because QuickGO's taxonomy backend was down). All IBDs sit at the PROPPIN family root PTN000132136. Non-duplicative IBA verdicts: PI3P binding ACCEPT (core; LRRG motif kept, Vps34-dependent puncta), protein-macromolecule adaptor activity ACCEPT (fly Atg18a binds Atg9, bridges Atg9 to Ref(2)P, binds BNIP3), protein localization to phagophore assembly site ACCEPT (Atg9 recruitment to PAS needs Atg18a), PI(3,5)P2 binding KEEP_AS_NON_CORE, obsolete GO:0034045 PAS membrane MODIFY to GO:7770114 phagophore membrane, pexophagy KEEP_AS_NON_CORE (fly pexophagy is Atg5-dependent, Atg18a untested), nucleophagy MARK_AS_OVER_ANNOTATED (yeast-only seeds, no fly nucleophagy described). FlyBase IMP rows on macroautophagy and autophagosome assembly accepted; selective-autophagy, cell death, T-tubule and antiviral rows kept as non-core; regulation of defense response to virus MODIFY to defense response to virus. One NEW row: phagophore assembly site (IDA, PMID:24374083). FlyBase description reviewed: UNVERIFIED (isolation-membrane elongation claim not traced to fly data, which place Atg18a upstream at Atg9 recruitment); no source defects; UniProt record has no FUNCTION text. Bioinformatics: PROPPIN motif alignment. Descriptions sidecar scored COMPLETE. just validate passes.
