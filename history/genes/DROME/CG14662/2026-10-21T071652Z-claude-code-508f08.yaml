  summary: Full re-review of CG14662 (Q9VN74) independent of ProtNLM2 predictions
  details: |
    Re-examined all three ND annotations. GO:0005575 ND changed from UNDECIDED to MODIFY -> GO:0016020 membrane (two Phobius TM segments recovered by an independent hydropathy scan, glycosylation sequons in the intervening region). GO:0003674 and GO:0008150 ND kept as ACCEPT. Rewrote the description from the predicted architecture. Added PMID:17868438 (Dolan 2007, the only paper naming the gene) and a new reproducible sequence-feature analysis (CG14662-bioinformatics/sequence_features_rereview.py, RESULTS-rereview.md). Documented a weak InterPro PANTHER PTHR24365:SF541 HMM match that PANTHER 19.0's own classification does not support, and a Brachycera-restricted OrthoDB orthogroup with no characterised member, so no function is transferred. Added a knowledge gap, questions and experiments; core_functions left empty.
