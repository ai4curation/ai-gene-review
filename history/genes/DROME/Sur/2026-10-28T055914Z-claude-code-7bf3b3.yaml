  summary: 'Create review: Sur'
  details: |
    Created the review of Drosophila Sur (Q9VL32), the sulfonylurea receptor of the SUR subfamily of ABCC proteins. All 10 GOA rows reviewed. ABC-type transporter activity (IBA/IEA) was modified to potassium channel regulator activity and transmembrane transport to potassium ion transmembrane transport, consistent with the human ABCC8/ABCC9 reviews; membrane was refined to plasma membrane; ATP binding, ATP hydrolysis (supported by a local NBD motif scan), plasma membrane and the NOT chitin biosynthetic process annotation were accepted; response to hypoxia kept as non-core. No NEW terms were proposed because the heart, sleep and antiviral evidence is knockdown phenotype only. Literature work was done manually (deep-research-manual and notes files) since no deep-research provider was available.
