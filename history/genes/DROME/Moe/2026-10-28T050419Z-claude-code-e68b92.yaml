  details: |
    Created the review of Drosophila Moesin (P46150, 110 GOA rows). Literature synthesized manually (no deep-research provider) from cached abstracts and full texts including PMID:18283112, PMID:23857773, PMID:23468526, PMID:16216927 and PMID:25065756. Core functions: actin-membrane linkage at the apical cortex, PI(4,5)P2 binding, FERM-mediated microtubule anchoring, and cortical recruitment of the RhoGAP Conu. Removed generic protein-binding rows (Conu rows modified to protein-membrane adaptor activity) and positive regulation of endocytosis (paper places endocytosis upstream of phospho-Moe); marked membrane-potential, proliferation, motile cilium and endosomal IBA terms as over-annotated; left left/right symmetry and spindle midzone undecided. No NEW terms.
