  details: |
    Reviewed all 55 seeded GOA annotations for Drosophila patched (P18502), replacing every PENDING action: 34 ACCEPT, 12 KEEP_AS_NON_CORE, 3 REMOVE (all bare GO:0005515 protein binding rows, per the generic-protein-binding policy), 3 MARK_AS_OVER_ANNOTATED (GO:0005119 smoothened binding IBA, GO:0007411 axon guidance, GO:0042981 regulation of apoptotic process), 2 MODIFY (GO:0007346 -> GO:0072091 regulation of stem cell proliferation; GO:0016192 -> GO:0006898 receptor-mediated endocytosis), 1 UNDECIDED (GO:0045169 fusome, abstract-only source). Wrote the top-level description and four core_functions grounded on the Drosophila record: hedgehog receptor activity, hedgehog family protein binding, phosphatidic acid binding and phosphatidylinositol-4-phosphate binding, with an explicit MF_DARK knowledge gap. Deliberately did NOT import the human PTCH1 framing of GO:0140303 intramembrane lipid carrier activity: the fly GOA carries no such annotation and UniProt asserts cholesterol transport for ptc only By similarity from Q13635, so the transport question is raised in suggested_questions instead. Added a propagation_review for the GO:0005119 IBA and reference_review entries for 37 references. Also wrote genes/DROME/ptc/ptc-notes.md as the research journal; all 45 inline quotes there and all 113 supporting_text snippets in the YAML were verified as verbatim substrings of the cached publications.
