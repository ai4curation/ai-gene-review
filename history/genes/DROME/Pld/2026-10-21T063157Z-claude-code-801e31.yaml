  summary: Full re-review of Pld (A4UZ54) independent of ProtNLM2 predictions
  details: |
    Re-examined all 14 GOA rows against full text of PMID:17156430 and PMID:15883198 and the newly cached PMID:27848911. Changed: lipid metabolic process to MODIFY (to GO:0006654); Golgi organization and intracellular signal transduction to KEEP_AS_NON_CORE; gastrulation involving germ band extension to MARK_AS_OVER_ANNOTATED (secondary to cellularization defects); phosphatidylinositol binding from UNDECIDED to KEEP_AS_NON_CORE (the definition includes PIPs). Added NEW GO:2001137 positive regulation of endocytic recycling (IMP, PMID:27848911). Rewrote the description and core functions. Recorded that A4UZ54 is a 1260-aa splice isoform (18-aa PX-domain deletion relative to the 1278-aa cDNA product; gene-centric canonical is B7YZT5) and that PAINT places fly Pld with PLD1/PLD2 at PTN001051940 although its HMM subfamily is PTHR18896:SF76.
