  summary: 'Create review: polo'
  details: |
    Created the first review of Drosophila polo (P52304), the fly Polo-like kinase. All 64 GOA rows reviewed using cached literature (full text for PMID:9813088, 18832073, 18798690 and others; abstracts for older papers) and a manually compiled literature summary, since no deep-research provider was available. Generic protein kinase activity and mitotic cell cycle rows were refined to Ser/Thr kinase activity and mitotic spindle organization, spindle to spindle midzone/pole, and intracellular protein localization to protein localization to meiotic spindle midzone. Ring canal formation and pronuclear fusion were marked over-annotated as downstream consequences, protein binding rows were removed per policy, one kinetochore microtubule row left UNDECIDED pending full text, and developmental roles kept as non-core. Core functions cover centrosome maturation, kinetochore attachment and cytokinesis. No NEW annotations.
