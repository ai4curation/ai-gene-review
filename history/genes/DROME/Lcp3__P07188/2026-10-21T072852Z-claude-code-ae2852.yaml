  details: |
    New full review of the reviewed canonical Lcp3 entry P07188 (FBgn0002534), the experimentally characterised same-gene relative of benchmark accession A0A0B4KEF3 (identical 112-aa polypeptide), in folder Lcp3__P07188 following the HOST__ACC convention. All 10 GOA rows reviewed: GO:0005214 IEA MODIFY to GO:0008010; GO:0008010 IDA x2 and ISM ACCEPT; GO:0062129 IDA x2, IEA and ISM ACCEPT; GO:0008363 IC and GO:0040003 ISM KEEP_AS_NON_CORE (structural component deposited into cuticle; no Lcp3 loss-of-function phenotype). Experimentally established: major protein of third-instar larval cuticle (isolation and sequencing, PMID:101231, PMID:6817923, PMID:6168386). Inferred only: chitin binding via R&R domain (family-level), raised as a suggested question, not annotated. Larval specificity is gene-specific, not a PTHR10380:SF237 property (subfamily includes pupal Pcp and lobster proteins). Falcon deep research failed (Edison 403 auth); existing Falcon report for the identical polypeptide used for context only. ProtNLM2 predictions not consulted.
