  summary: 'Full re-review: hbt (Q9VK03, isoform D)'
  details: |
    Full re-review independent of ProtNLM2 predictions. Recorded that Q9VK03 is isoform D, an N-terminally truncated product identical to residues 513-963 of canonical isoform E (A0A6H2EJZ8), retaining the full Rost region and six TM helices (new hbt-bioinformatics/compare_isoforms.py, RESULTS.md). Found the real hbt study (PMID:32761438: larval head-touch defect, expression in sensory sheath cells/glia) and flagged the deep-research primary citation (PMID:24671768, Mabiki) as MISCITED. BP ND changed to MODIFY -> GO:0051931 regulation of sensory perception, matching the FlyBase IMP on isoform E; MF ND and membrane ISS (from Rost, PTHR12242:SF46) accepted. Rewrote description, added core function, knowledge gap, questions and experiment. No Rost-subfamily function transferred (hbt is SF49).
