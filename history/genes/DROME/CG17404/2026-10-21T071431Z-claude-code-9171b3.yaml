  summary: 'Full re-review: CG17404 (Q9VGC0) independent of ProtNLM2'
  details: |
    Full re-review of all 10 GOA rows, independent of ProtNLM2 output. Added reproducible sequence and PANTHER-tree analyses (CG17404-bioinformatics/RESULTS-rereview.md). These confirm an intact His80-Asp124-Ser225 triad, a single-domain secreted S1A architecture with no clip domain, a predicted R34-I35 zymogen activation site, and placement in the uncharacterised PTHR24256:SF562 clade that branches from the PTN001207268 IBD node, with no PAINT NOT node on its lineage. Actions are unchanged: GO:0004252, GO:0005576 and GO:0006508 are ACCEPTed; peptidase and hydrolase activity are MODIFYed to GO:0004252. Rationales were rewritten on phylogenetic grounds. The description was rewritten to drop the ProtNLM-derived CTRL wording. Added reference reviews, the deep-research reference, a BP_DARK knowledge gap, questions and experiments. Status set to COMPLETE.
