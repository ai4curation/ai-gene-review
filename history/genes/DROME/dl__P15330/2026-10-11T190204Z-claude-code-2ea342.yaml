  details: |
    Moved the dorsal (P15330) review from genes/DROME/dl to genes/DROME/dl__P15330 and renamed its files to the dl__P15330- prefix, following the existing SYMBOL__ACC folder convention (e.g. MIEF1__L0R8F8). genes/DROME/dl (dorsal) and genes/DROME/Dl (Delta, P10041) are distinct FlyBase genes whose symbols differ only by case, so the two folders collided on case-insensitive filesystems such as default macOS APFS, and a checkout there showed one gene's files as modifications of the other's. Curated content is unchanged: gene_symbol stays dl. Updated the file: reference paths inside the review, the artifact links in the falcon deep-research file, and the notes filename. The earlier CREATE record was moved here with target.superseded_by; projects/INNATE_IMMUNITY.md now links dorsal through gene tags because bare-symbol autolinking resolves by folder name.
