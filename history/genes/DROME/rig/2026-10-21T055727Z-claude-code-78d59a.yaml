  summary: 'Create review: rig (Drosophila Gemin5)'
  details: |
    De-novo review of all 32 seeded GOA rows (33 GOA lines), independent of ProtNLM2 predictions. Falcon deep research failed (Edison API authentication error; perplexity-lite fallback also failed), so the review is built from cached primary literature plus PMID:18621711 and PMID:33963192. Evolutionary grounding: rig shares PANTHER PTHR46362:SF1 with human GEMIN5 and donates to PAINT node PTN005299808. Accepted SMN complex, U body, nucleus, cytoplasm and snRNP assembly (IBA/ISS/NAS); five protein binding IPI rows modified to nuclear receptor binding; mRNA 3'-UTR binding, response to ecdysone and gem kept as non-core; molting, flight and locomotory behaviour IMP rows marked over-annotated as downstream organismal phenotypes. No snRNA binding added: PAINT did not propagate it, S2-cell data show the fly SMN complex binds snRNAs without stable Rig, and a new pairwise alignment (rig-bioinformatics/snrna_site_conservation.py, RESULTS.md) shows the human Sm-site contact residues are not retained.
