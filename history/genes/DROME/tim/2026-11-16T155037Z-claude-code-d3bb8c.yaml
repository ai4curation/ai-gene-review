  summary: 'Create review: tim (circadian TIM; replication IBAs from the TIMELESS
    root removed)'
  details: |
    De-novo review of all 66 GOA rows for Drosophila timeless (P49021): 42 ACCEPT, 10 KEEP_AS_NON_CORE, 3 MODIFY, 1 MARK_AS_OVER_ANNOTATED, 10 REMOVE (4 replication IBAs and 6 bare protein-binding IPIs). Key test: the five non-duplicative IBA rows come from PTN000533813, the Eukaryota root of PTHR22940, which sits above the Eumetazoa duplication (PTN008585095) separating the insect TIM clade (PTN008585096, SF5, fly tim) from the TIMELESS-homolog clade (PTN000533822: fly timeout, human TIMELESS, worm tim-1); PAINT has no loss on the SF5 clade (tim-bioinformatics/RESULTS.md). Replication fork protection complex, replication fork arrest, DNA replication checkpoint signaling and DNA repair are REMOVEd (timeout is the essential chromosome-integrity paralog, PMID:20153199; tim nulls are viable; the tim1-type gene is lost in mammals and bees, PMID:17065608); DNA binding is MARK_AS_OVER_ANNOTATED (HTH_TIMELESS region retained, but UniProt curators record no DNA binding). Entrainment of circadian clock IBA ACCEPTed. MODIFY: mating behavior to circadian mating behavior, rhythmic behavior to circadian behavior, regulation to positive regulation of phagocytosis. FlyBase text DISPUTED: 'DNA replication' untraced, recorded as a WRONG_STATEMENT source defect (PROBABLE). UniProt FUNCTION VERIFIED, no defects. Descriptions sidecar scored COMPLETE. GOA was fetched through a wrapper that drops QuickGO's failing taxonName include field. just validate passes.
