  summary: 'Cross-check review against Falcon deep research: cact'
  details: |
    Reviewed all 47 seeded GOA annotations for Drosophila Cactus (IkappaB). ACCEPT 33, KEEP_AS_NON_CORE 5, MODIFY 4, REMOVE 3, UNDECIDED 2. Core: protein sequestering activity and NF-kappaB binding (Dorsal/Dif) in the cytosol, negative regulation of Toll signaling pathway, dorsoventral patterning. GO:0043124 (IBA and IMP) was changed to GO:0045751, because the canonical NF-kappaB term is IKK-dependent and Pelle is the Cactus kinase in the fly Toll pathway (PMID:24086459). Dorsal protein-binding rows were changed to NF-kappaB binding; the cactin, Kurtz and IKKbeta rows were removed as uninformative. The HMP oogenesis and dorsal appendage rows are UNDECIDED. Cross-checked against Falcon deep research. just validate and validate-references pass.
