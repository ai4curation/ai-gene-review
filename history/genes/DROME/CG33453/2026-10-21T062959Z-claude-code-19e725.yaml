  summary: Full re-review of CG33453 (A0A0B4LFV5, PB isoform), independent of ProtNLM2
  details: |
    Full re-review, independent of ProtNLM2 output. The three ND root rows (MF, CC, BP) changed from KEEP_AS_NON_CORE to ACCEPT, because ND correctly records that no function is known: there is no gene-specific literature, no Swiss-Prot member of PTHR20898 and no PAINT function. The description was rewritten to give the PANTHER PTHR20898:SF0 placement (an insect-restricted, Diptera-expanded family), the PA/PB isoform structure and the absence of known function. A new analysis (indels_rereview.py, RESULTS-rereview.md) maps the PB-vs-PA differences: a 2-residue indel in the signal peptide and a 1-residue indel in the mature chain. It also gives a UniProt census of the family by taxon. Added references PMID:32502405 (daedalus, a paralog in the same subfamily with no known molecular function) and the Falcon deep research. No NEW annotations were added and core_functions stays empty. Notes were appended, not rewritten.
