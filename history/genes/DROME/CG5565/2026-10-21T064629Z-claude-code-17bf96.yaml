  details: |
    Re-examined all 3 GOA annotations. Added a reproducible PANTHER 19 tree walk (CG5565-bioinformatics/panther_tree_rereview.py, RESULTS-rereview.md) showing CG5565 descends from PTN000431252, the PAINT IBD node for GO:1990738 pseudouridine 5'-phosphatase activity (seeded by human PUDP and yeast YKL033W-A); a dipteran duplication (PTN000431298) yields five fly paralogs; the SF38 vs SF43 subfamily split vs human PUDP is a recent primate-lineage event. Kept GO:0016791 IBA/IEA as MODIFY to GO:1990738, ACCEPT GO:1990738 ISS with phylogenetic support; rewrote description (paralog context, testis enrichment, unassayed status); added suggested question/experiments on paralog subfunctionalisation. Appended dated notes section; no files deleted.
