  summary: 'Create review: CG3226'
  details: |
    Created full review of Drosophila CG3226 (Q9W3Y3), the CacyBP/SIP ortholog, as part of RAR_MISANNOTATION re-examination of Wei et al. 2020. Removed IEA S100 protein binding (InterPro2GO IPR037893) because S100 proteins are restricted to chordates and D. melanogaster has none (literature plus InterPro PF01023 taxon counts in CG3226-bioinformatics). Marked tubulin binding IEA and SCF complex IBA as over-annotated (consistent with human CACYBP review); accepted ubiquitin protein ligase binding, molecular adaptor activity, nucleus and cytoplasm by orthology; kept heart development (IMP, PMID:22398840; IBA) as non-core.
