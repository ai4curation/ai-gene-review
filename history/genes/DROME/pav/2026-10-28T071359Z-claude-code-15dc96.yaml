  summary: 'Create review: pav'
  details: |
    New review of Drosophila pavarotti (Pav-KLP, kinesin-6, UniProt Q9VZF5). All 49 GOA rows reviewed against cached literature, including the full text of PMID:9813088 (Carmena et al. 1998), plus three additionally cached key papers (PMID:9585508, PMID:12530961, PMID:25557664). Core functions: kinesin-6 microtubule motor subunit of centralspindlin driving spindle midzone assembly and mitotic cytokinesis, contractile ring assembly and ring canal localization, and post-mitotic braking of kinesin-1 microtubule sliding in neurons. Over-general terms were refined (kinesin complex to centralspindlin complex, microtubule sliding to its negative regulation, arborization to neuron projection development, contractile ring contraction to assembly); bare protein binding removed; PNS development and IBA cargo transport marked over-annotated; kinetochore microtubule left undecided. No NEW annotations. Manual literature synthesis written to pav-deep-research-manual.md since no deep-research provider was available.
