  summary: Set status DRAFT; IN_PROGRESS required a PENDING row this review does not
    have
  details: |
    A review bot on PR #4404 flagged stale IN_PROGRESS status on three reviews and argued this one should stay IN_PROGRESS because it retains two UNDECIDED rows. The premise does not hold: GeneReviewStatusEnum defines IN_PROGRESS by PENDING annotations, not UNDECIDED ones, and this review has no PENDING rows, so the flag was stale here too. It validates with no warnings, which by the letter of the enum would make it COMPLETE, but calling a review with two unresolved annotations fully complete would be misleading. DRAFT, defined as no PENDING annotations but needing refinement, is the accurate value. The two UNDECIDED rows are unchanged.
