  summary: 'Create review: hh'
  details: |
    Reviewed all 157 GOA annotations for Drosophila hedgehog (Q02936), replacing every PENDING action: 71 ACCEPT (patched binding, smoothened signaling pathway, morphogen activity, protein autoprocessing, cholesterol-protein transferase activity, extracellular region), 68 KEEP_AS_NON_CORE (tissue-level developmental outcomes and downstream pathway consequences), 10 REMOVE, 6 MODIFY, 2 UNDECIDED. Removals: nucleus and cytoplasm (EXP plus UniProt-derived IEA) because PMID:1280560 reports localisation of the hh RNA rather than the protein; three Reactome cytosol rows because Hh autoprocesses in the ER lumen and is never cytosolic; GO:0016539 intein-mediated protein splicing because Hedgehog cleaves without ligating exteins; GO:0035232 germ cell attraction, refuted by PMID:19389345; and one bare GO:0005515 protein binding row (Shifted). Modifications: GO:0004175 endopeptidase activity to GO:0140853 cholesterol-protein transferase activity, four GO:0005515 Ihog rows to GO:0005102 signaling receptor binding, and the InterPro cell-cell signalling IEA to GO:0007224. UNDECIDED for GO:0048066 and GO:0048099, whose sole citations have no abstract in the cache or in PubMed. Added a project-independent description, three core functions, nine reference_review entries, and a research journal in hh-notes.md. Checked the fly Ca2+ coordinating residues against UniProt features, which supports the PTHR11889 family review's open question about calcium binding outside vertebrates.
