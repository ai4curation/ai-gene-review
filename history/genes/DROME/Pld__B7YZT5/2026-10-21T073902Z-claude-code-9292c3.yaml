  summary: 'Create review: Pld (B7YZT5)'
  details: |
    New full review of the gene-centric canonical B7YZT5 for FBgn0286511, done independently of ProtNLM2 predictions. Falcon deep research failed (403 auth) and the perplexity-lite fallback failed (401 quota), so the full texts of PMID:17156430, 15883198, 27848911 and 30369483 (newly cached) were read directly. Grounding: PTHR18896:SF76, a different subfamily from human PLD1 (SF57) and PLD2 (SF121); fly Pld sits under PAINT nodes PTN004499769 and PTN001051940. All 19 GOA rows were reviewed. PLD activity, cytoplasmic vesicle, PA biosynthesis and regulation of vesicle-mediated transport were accepted. Plasma membrane IBA, PI binding, Golgi organization, cellularization and Golgi vesicle fusion were kept as non-core. Phototransduction, gastrulation and intracellular signal transduction were marked over-annotated. Catalytic activity and lipid metabolic process were marked too general. Added NEW GO:2001137 positive regulation of endocytic recycling from PMID:27848911, which is not yet in GOA.
