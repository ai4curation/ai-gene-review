  summary: 'Create review: Toll-7'
  details: |
    Reviewed all 24 GOA annotations for Drosophila Toll-7 (Q7KIN0): 18 ACCEPT, 4 KEEP_AS_NON_CORE, 2 UNDECIDED. Core functions are neurotrophin receptor activity (GO:0005030) for DNT1 and DNT2 in axon targeting and neuronal survival, and a cell-surface receptor role in virus-induced antiviral autophagy. Toll-7 is the only gene in this set with PRR-branch terms: GO:0038187 pattern recognition receptor activity and GO:0002752 cell surface PRR signaling pathway, both IC from PMID:22464169. Both are kept as non-core rather than accepted. The evidence is co-precipitation of whole VSV and RVFV virions with no defined viral ligand, the specificity control is contradicted by PMID:31088910, and Falcon deep research describes the antiviral role as unresolved. The virion binding IDA rows are accepted as direct observations. The Toll signaling pathway and AMP-induction IMPs from PMID:31088910 are UNDECIDED because they conflict with earlier chimera and in vivo data. No GO:0002224 terms are attached. Falcon deep research integrated. just validate passes.
