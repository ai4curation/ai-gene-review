  summary: Full re-review of Synj (Q5U0V7), independent of ProtNLM2 predictions
  details: |
    Full re-review of fly synaptojanin. Q5U0V7 confirmed as the full-length 1218-aa product (the only other entry, Q8MR94, is 959 aa; no Swiss-Prot entry). Cached 8 primary papers (Chen 2014, Geng 2016, Peng 2021, Vanhauwaert 2017, Dickman 2005, Ahaley 2018, Guo 1999, McPherson 1996). Added Synj-bioinformatics/catalytic_motifs.py and RESULTS.md, which show that the SAC and 5-phosphatase catalytic motifs are intact. Changes: nucleic acid binding UNDECIDED->REMOVE (fold-level IPR035979 match); membrane IBA ACCEPT->MODIFY to vesicle membrane; synapse ACCEPT->MODIFY to presynapse; phosphatase activity MODIFY now lists both GO:0004439 and GO:0043812; Ins(1,4,5)P3 5-phosphatase IBA UNDECIDED->KEEP_AS_NON_CORE. NEW rows: synaptic vesicle uncoating (comparator check passed: unc-26, mouse Synj1), PI4P phosphatase activity (SAC), autophagosome maturation. Description and core_functions rewritten to cover both catalytic modules. New notes file. PANTHER SF257 placement agrees with the PTHR11200 family review.
