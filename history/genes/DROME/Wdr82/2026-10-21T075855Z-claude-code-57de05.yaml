  summary: 'Create review: Wdr82 (Q9VLN1), reference relative for ProtNLM2 gene CG3515'
  details: |
    De-novo review of fly Wdr82, independent of ProtNLM2 predictions, as the experimentally characterised Swd2/WDR82-subfamily (PTHR19861:SF0, PAINT PTN000458398) relative of CG3515. Falcon deep research failed (Edison 403) and perplexity-lite fallback failed; review built from cached primary literature (PMID:21875999, 26577379, 39417277, 23295261 full text; 21694722 abstract). 15 GOA rows reviewed: Set1C/COMPASS (IBA/IDA/IPI), nucleus, chromatin binding (IBA), chromatin remodeling (IMP), Su(s)-dependent negative regulation of transcription elongation and nuclear RNA surveillance (IDA + ARBA IEA) accepted; histone methyltransferase complex MODIFY to Set1C/COMPASS; bare protein binding REMOVE per GO:0005515 policy; heart development KEEP_AS_NON_CORE as a pleiotropic RNAi consequence. No NEW terms; contributes_to H3K4 trimethyltransferase activity raised as a suggested question because neither FlyBase nor PAINT asserts it. Notes record which functions are PAINT-grounded subfamily properties versus fly-only experimental findings, for later transfer to CG3515.
