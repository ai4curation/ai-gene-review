  summary: Full re-review of CG3515 (Q9VQD1) independent of ProtNLM2 predictions
  details: |
    Established that CG3515 is a rapidly diverging, testis-biased SWD2/WDR82-family paralog (PTHR19861:SF0; about 35% identity to fly Wdr82 and human WDR82, versus 69% between those two), distinct from the conserved fly COMPASS subunit Wdr82/CG17293. Kept the IBA chromatin binding and Set1C/COMPASS rows and the nucleus IEA as family inferences with caveats. Changed RNA metabolic process (ARBA IEA) from UNDECIDED to MARK_AS_OVER_ANNOTATED because PAINT propagated no RNA-processing term. Rewrote the description, added PMID:21875999, PMID:15024081, PMID:15146080, the FlyBase report and a new paralog comparison (CG3515-bioinformatics/RESULTS-rereview.md), and added questions and experiments.
