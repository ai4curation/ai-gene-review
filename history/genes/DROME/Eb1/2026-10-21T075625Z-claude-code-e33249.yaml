  summary: 'Create review: Eb1'
  details: |
    De-novo full review of Drosophila EB1 (A1Z6P3), the experimentally characterised PTHR10623:SF6 relative of the ProtNLM2 benchmark gene Mst27D. It is independent of the ProtNLM2 predictions. Deep research failed (falcon auth; perplexity quota), so the review rests on the 17 cached GOA papers. All 39 GOA rows reviewed. IBAs were grounded on PAINT node PTN000065701, for which Eb1 is an experimental seed. Core functions: plus-end binding, regulation of MT dynamics, plus-end recruitment of Sentin/Shot/CLIP-190, and spindle assembly/elongation. General location, MF and process terms refined (MODIFY). Organismal and indirect phenotypes (hearing, locomotion, flight, wound healing, encapsulation, pseudocleavage) marked as over-annotated. The three protein-binding rows were removed under the protein-binding policy.
