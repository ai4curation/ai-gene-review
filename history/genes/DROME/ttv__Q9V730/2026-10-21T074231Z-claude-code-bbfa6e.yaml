  summary: 'Create review: ttv (Q9V730, EXT1 ortholog)'
  details: |
    De-novo full review of the Swiss-Prot canonical ttv product Q9V730 (FBgn0265974), in its own folder because genes/DROME/ttv is keyed to D5SHU8. Independent of ProtNLM2 predictions (none consulted). Falcon deep research failed (authentication; perplexity-lite fallback quota 401), recorded in notes; review built from 15 cached papers, UniProt and PANTHER/PAINT data. All 35 GOA rows reviewed: GlcNAcT-II (GO:0050508) and GlcAT-II (GO:0050509) IDA activities, HSPG and GAG biosynthesis, Golgi membrane and EXT1-EXT2 complex accepted as core; generic IBA/IEA MF and membrane/glycoprotein terms refined by MODIFY; bare protein binding removed; heparin proteoglycan biosynthesis marked over-annotated (no heparin in Drosophila); positive germ cell migration IMP removed as contradicted by a null-allele study and indirect, NOT row kept. Core functions record that Ttv-Sotv lacks GlcNAcT-I chain initiation (Botv does this), a deliberate difference from human EXT1. PANTHER subfamily discrepancy between UniProt (PTHR48261:SF3) and the cached PANTHER 19.0 classification (PTHR11062:SF129 vs EXT1 SF97) noted.
