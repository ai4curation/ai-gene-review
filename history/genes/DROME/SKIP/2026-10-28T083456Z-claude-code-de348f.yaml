  summary: 'Create review: SKIP'
  details: |
    New review of Drosophila SKIP long isoform A0A0B4K6C1 (TrEMBL, FBgn0051163). GOA holds two rows. Cytoplasm (IEA/ARBA) was accepted on independent grounds: imaging of myc-SKIP1 in neurons (PMID:19463952) and the soluble SAM/SH3 architecture. Sensory perception of smell (IMP, PMID:22530061, full text) was kept as non-core: the gene-trap excision reversion is sound, but the EAG is normal and the isoforms involved are unknown. Neuronal cell body was added as a NEW IDA from PMID:19463952. An isoform comparison script shows that the Shal K+ channel-binding octapeptide unique to SKIP3 (identified as the 128-aa product A0A0B4KH49) is absent from A0A0B4K6C1, so no Shal binding or channel-regulation terms were transferred to this accession. The core function is recorded without an MF term, with a knowledge gap, questions and experiments. Manual deep-research and notes files were written because no deep-research API was available.
