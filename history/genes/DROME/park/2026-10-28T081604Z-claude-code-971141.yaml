  summary: 'Create review: park'
  details: |
    Created the park (Q7KTX7) gene review from 87 GOA rows. Literature was synthesised by hand into park-deep-research-manual.md because no deep-research provider was available. Core function is the PINK1-activated RBR E3 ubiquitin ligase activity (GO:0061630) acting in type 2 mitophagy, mono- and polyubiquitination of outer membrane substrates, and negative regulation of mitochondrial fusion. The three IGI mitochondrial fission rows were modified to positive regulation of mitochondrial fission, with WRONG_TERM source defects. A WRONG_REFERENCE defect was recorded for the positive regulation of mitophagy IMP row that cites PMID:28435104. ER, Golgi and ubiquitin ligase complex IBA rows were marked as over-annotated, ARBA regulation of anatomical structure morphogenesis was removed, bare protein binding rows were removed, and phenotype-level rows were kept as non-core.
