  summary: Full re-review of NtR (Q9W288), independent of ProtNLM2 predictions
  details: |
    Full re-review. PANTHER 19.0 places Q9W288 in PTHR18945:SF430 with nAChRalpha2 (UniProt xref still PTHR36695:SF12); the Matthews 2018 ML tree places NTR outside the nAChR clade. New MAFFT motif analysis (NtR-bioinformatics/compare_motifs_rereview.py, RESULTS-rereview.md) shows loss of loop-C vicinal Cys (Dalpha2 C243/C244 -> NtR M412/M413) and the M2 GEK ring (E291 -> S460), recorded as verified residue_claims. Broad Cys-loop channel, plasma membrane and ion transmembrane transport terms ACCEPT; ion transport and membrane MODIFY to the specific terms already carried; membrane potential KEEP_AS_NON_CORE; nine acetylcholine/calcium/cholinergic/synaptic IBA and derived IEA rows moved from UNDECIDED to MARK_AS_OVER_ANNOTATED with propagation_review. Description, core function, questions and experiments rewritten; notes appended.
