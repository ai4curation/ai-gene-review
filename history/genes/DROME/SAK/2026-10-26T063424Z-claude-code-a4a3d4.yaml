  summary: 'Create review: SAK'
  details: |
    Created the first review of Drosophila SAK/Plk4 (O97143). All 31 GOA rows were reviewed against cached literature, including the full text of PMID:21987638. Core functions are protein serine/threonine kinase activity driving centriole replication through Ana2 STAN-motif phosphorylation, and trans-autophosphorylation that primes SCF-Slimb degradation. The review accepts the centriole replication rows, modifies the centrosome cycle rows to centriole replication, modifies regulation of centriole replication to the positive term, and modifies identical protein binding to homodimerization. The family-wide nucleus IBA and the male meiosis term are marked over-annotated, and one NEW protein autophosphorylation IDA is added. No deep-research provider was available, so the literature synthesis is in SAK-deep-research-manual.md.
