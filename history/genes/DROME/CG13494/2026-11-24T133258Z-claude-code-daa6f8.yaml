  summary: Narrow the CG13494 origin and protein-class gap with an OpenScientist analysis
  details: |
    Ran OpenScientist (3 iterations) on CG13494. Single-pass membrane peptide (internal TM helix, no signal peptide) with disordered flanks; purifying selection (dN/dS ~0.13-0.28) in four species; invariant TM core IICLPLLC (present in local sequence) defines orthologs in six melanogaster-group species. Reported intronless, non-overlapping; outgroups carry only CG43405 at the locus, favouring de novo origin. Public orthology groups are composition artefacts. Added status NARROWING and provenance; run reference UNVERIFIED.
