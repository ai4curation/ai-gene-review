  summary: 'Full re-review: CG13494 (Q8MZA7), independent of ProtNLM2'
  details: |
    Full re-review independent of ProtNLM2 output. GOA has no rows for Q8MZA7, the canonical and only UniProt entry for FBgn0034671. A new reproducible analysis (CG13494-bioinformatics/analyze_rereview.py, RESULTS-rereview.md) found no InterPro/PANTHER signature and no Pfam CYSTM match, and OMA places the gene in a HOG rooted at the melanogaster species group, so no characterised relative exists and no function was transferred. Rewrote the description (architecture: TM helix 37-61 plus a Gly/Cys-rich tail; lineage restriction; testis expression), added reference_review blocks, a WHOLLY_DARK knowledge gap, suggested questions and experiments. No NEW annotations; membrane is raised as a question only because it rests solely on the Phobius TM prediction. Appended a dated section to the notes.
