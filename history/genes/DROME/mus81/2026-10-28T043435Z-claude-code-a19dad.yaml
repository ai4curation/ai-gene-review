  summary: 'Create review: mus81'
  details: |
    De novo review of Drosophila mus81 (Q9V3T1, unreviewed TrEMBL). All 18 GOA rows reviewed against full texts of PMID:22022278, PMID:17603121, PMID:25205745 and PMID:28369583. Core function is the catalytic subunit of the MUS81-MMS4 structure-selective endonuclease acting in mitotic DNA repair and replication fork processing as a backup to GEN and alternative to BLM. The IBA rows for resolution of meiotic recombination intermediates and mitotic intra-S DNA damage checkpoint signaling were marked over-annotated because fly mutants show no meiotic crossover role and no checkpoint evidence; DNA catabolic process marked over-annotated; DNA recombination modified to mitotic recombination. No NEW terms proposed.
