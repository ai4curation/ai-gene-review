  summary: 'Create review: GstO1'
  details: |
    New review of Drosophila GstO1 (CG6662, Q9VSL6). All 14 GOA rows reviewed: glutathione transferase and dehydroascorbate reductase activities, the NOT pyrimidodiazepine synthase row and cytoplasm accepted from direct assays of recombinant CG6662 (PMID:16712527) and Omega-class membership; glutathione metabolic process and cellular oxidant detoxification kept as non-core. Added NEW protein glutathionylation (IMP) and endoplasmic reticulum (IDA) from Hossain et al. 2023 (PMID:37389657, GstO1-mediated Gbb glutathionylation). Documented that PMID:22219196's DmGSTO1 is CG6673 (now GstO2), so its findings were not transferred to GstO1. Manual literature notes written; no deep-research provider used.
