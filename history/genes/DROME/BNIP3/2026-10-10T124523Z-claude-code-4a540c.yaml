  summary: 'Create review: DROME BNIP3 (CG5059)'
  details: |
    Full review of Drosophila BNIP3 (Q9VPD6), the single fly ortholog of BNIP3/BNIP3L in PANTHER PTHR15186. All 24 GOA rows were reviewed against cached full text (PMID:40801807, 37633267, 41576035, 36213625, 31092924) and the abstract of PMID:36323236. Core function: OMM mitophagy receptor (GO:0140580; LIR binds Atg8a, MER binds Atg18a) driving developmental and stress mitophagy (GO:0000423). Bilateria-node PAINT IBDs for positive regulation of apoptotic process and mitochondrial fragmentation involved in apoptotic process were marked over-annotated (vertebrate-only seeds, no fly evidence, no BH3 consensus by alignment). Nucleus IBA/HDA kept as non-core, protein binding (Rtnl1 Y2H) removed, obsolete GO:0061753 removed. Added notes and a reproducible motif-alignment analysis (BNIP3-bioinformatics/). just validate DROME BNIP3 passes.
