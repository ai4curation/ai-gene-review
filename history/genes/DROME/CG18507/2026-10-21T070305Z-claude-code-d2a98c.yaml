  summary: 'Full re-review: CG18507 (M9PBB3), independent of ProtNLM2'
  details: |
    Full re-review independent of ProtNLM2 output. No GOA annotations exist for any of the five CG18507 UniProt products. Established M9PBB3 as a full-length C-terminal alternative isoform (not a fragment) and placed CG18507 as the PANTHER PTHR31193:SF1 ortholog of human TMEM268 by subfamily membership plus a new reproducible alignment (CG18507-bioinformatics/). Rewrote the placeholder description; added references for the Trh tracheal-expression screen (PMID:21963537) and human/mouse TMEM268 (PMID:30361615, PMID:38730209) with reference reviews; added one NEW CC annotation (GO:0016020 membrane) from Phobius TM helices and ortholog localization; did not transfer the vertebrate integrin-stabilization function (partners have no fly ortholog); recorded MF and CC knowledge gaps, questions and experiments. Appended a dated section to the notes journal.
