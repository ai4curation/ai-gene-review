  summary: 'Create review: Pcf11 long product A1Z9W4'
  details: |
    De-novo review of A1Z9W4, the 1953-aa long product of Drosophila Pcf11 (FBgn0264962), as the experimentally characterised reference for ProtNLM2 benchmark product C0P8M6; done independently of ProtNLM2 output. Falcon deep research failed (auth) and the perplexity-lite fallback failed (quota), so the review uses cached primary literature. Grounded transfer in PANTHER PTHR15921:SF3 (shared with yeast and human Pcf11) plus a new sequence comparison (bioinformatics/compare_pcf11.py, RESULTS.md) showing A1Z9W4 contains every region used in the fly experiments. 14 GOA rows reviewed: RNAPII complex binding (IBA, IEA) MODIFY to RNAPII CTD binding; termination IEA MODIFY to poly(A)-coupled termination (IBA accepted); RNA/mRNA binding, nucleus, mRNA cleavage factor complex, 3'-end processing accepted; cytoplasm IBA marked over-annotated (no fly evidence); ARBA gene expression and protein-containing complex TOO_GENERAL; piRNA heterochromatin IMP kept as non-core. Added NEW mRNA alternative polyadenylation (IMP, PMID:39111825; comparator CPSF6/CPSF7) and chromatin (IDA, PMID:16387654). Cached PMID:40896257 and PMID:22992452.
