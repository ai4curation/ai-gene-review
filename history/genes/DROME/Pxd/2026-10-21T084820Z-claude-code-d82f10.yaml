  summary: 'Create review: Pxd (chorion peroxidase), reference relative for CG42331'
  details: |
    De-novo review of Pxd (Q01603), independent of ProtNLM2 predictions; deep research failed (Falcon auth 403, Perplexity quota 401), so the review uses cached PubMed abstracts (PMID:15979004 primary) and a new PANTHER tree/PAINT placement analysis (Pxd-bioinformatics/RESULTS.md). Experimentally established: phenolic-donor peroxidase (GO:0140825, IDA; recombinant tyrosine to di-tyrosine) and egg chorion location (IDA); chorion assembly accepted as catalytic participation, though untested genetically. Pxd inherits only the PTN000158755 peroxidase IBD; vertebrate halide/thiocyanate activities are not transferred. GO:0004601 rows MODIFY to GO:0140825; oxidative stress and oxidant detoxification IEAs MARK_AS_OVER_ANNOTATED; heme binding non-core. Notes that PTN008518854 is Hexapoda-Crustacea in the unfiltered tree, not fly-specific.
