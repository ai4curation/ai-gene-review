  summary: 'Full re-review: CG10359 (B7Z0B2), independent of ProtNLM2'
  details: |
    Full re-review independent of ProtNLM2 predictions. Confirmed B7Z0B2 is the longest of four CG10359 isoforms (not a fragment). Placed CG10359 in insect/nematode PANTHER PTHR19143:SF327, separate from FIBCD1 (SF45) and FCN1 (SF377), with a new FReD MAFFT/NJ analysis (CG10359-bioinformatics/RESULTS-rereview.md). Changed the four FlyBase ISS rows from UNDECIDED: GPCR binding and GPCR signaling (FCN1 donor, ficolin-specific GPR43 docking) to REMOVE; membrane (FIBCD1 transmembrane-anchor donor; CG10359 is a secreted hemolymph protein) to REMOVE; chitin binding (cross-subfamily FIBCD1 transfer, untested) to MARK_AS_OVER_ANNOTATED. Kept the root-node ECM IBA as MODIFY to extracellular region. Rewrote description; added a location-only core function, a knowledge gap, questions and experiments; cited donor papers PMID:19710473 (already cached) and PMID:21037097 (newly cached, abstract only).
