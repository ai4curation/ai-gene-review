  details: |
    Created the review of Drosophila Cdc42 (P40793) covering all 109 GOA rows: GTPase, G protein activity, GTP binding, plasma membrane, cortex and kinase-effector binding accepted as core; bare protein binding rows modified to protein kinase binding (Mbt, Gek) or GBD domain binding (Frl) or removed (Par-6, Baz, Wash); rhabdomere (IMP) modified to rhabdomere development, actin filament polymerization to its positive regulation, neuromuscular synaptic transmission to regulation of neurotransmitter secretion; pleiotropic developmental phenotypes kept as non-core; five rows whose cited abstracts do not mention Cdc42 left UNDECIDED. No NEW terms were added; the heart function data in PMID:21690310 are necessity evidence and are raised as a suggested question. Literature synthesis was done manually (no deep-research provider).
