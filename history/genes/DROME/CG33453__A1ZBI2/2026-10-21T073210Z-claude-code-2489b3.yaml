  details: |
    New review of the canonical CG33453-PA product A1ZBI2 (FBgn0053453), written independently of ProtNLM2 predictions as the same-gene reference for benchmark accession A0A0B4LFV5 (PB). All three ND root rows (MF, CC, BP) accepted: no gene-specific literature (Europe PMC 0 hits), no Swiss-Prot or PAINT/IBA-annotated member of insect-restricted PANTHER PTHR20898, and the only studied SF0 paralog (daedalus/CG33690) has organismal phenotypes but no molecular function, so nothing is transferred. Signal peptide (1-23) and DUF1091 recorded as sequence inferences only; no NEW terms; core_functions empty. Falcon deep research failed (auth error; perplexity-lite fallback out of quota), so the gene-level Falcon report in genes/DROME/CG33453 was used.
