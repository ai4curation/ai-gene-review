  details: |
    Re-grounded substrate specificity on PANTHER PTHR21600:SF40 (RPUSD2 subfamily) membership: yeast Rib2/Pus9 (PMID:15466869) and human RPUSD2 (PMID:41136621, PMID:41698914) are tRNA anticodon-loop Psi32 synthases and RPUSD2 lost bacterial rRNA activity. GO:0160151 tRNA Psi32 synthase UNDECIDED->ACCEPT and made core MF; GO:0160152 Psi31 -> KEEP_AS_NON_CORE; GO:0000455 rRNA pseudouridine synthesis IBA UNDECIDED->MARK_AS_OVER_ANNOTATED with propagation_review; generic GO:0009982, GO:0001522, GO:0003723, GO:0006396, GO:0009451 -> MODIFY to GO:0160151/GO:0031119. Kept NEW nucleus (IDA, endogenous GFSTF exon trap). Dropped previously proposed NEW GO:1904057 negative regulation of sensory perception of pain as a downstream organismal phenotype that FlyBase curators did not annotate. Rewrote description; added three references; appended dated section to notes.
