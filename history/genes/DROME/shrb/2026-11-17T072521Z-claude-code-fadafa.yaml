  details: |
    De-novo review of all 44 GOA rows for Drosophila shrub (Q8T0Q4): 26 ACCEPT, 10 KEEP_AS_NON_CORE, 3 MODIFY, 2 TOO_GENERAL, 1 MARK_AS_OVER_ANNOTATED, 1 REMOVE (bare protein binding), 1 UNDECIDED, plus 1 NEW (protein polymerization, IDA PMID:27452459). Non-duplicative IBA verdicts (shrb-bioinformatics/RESULTS.md): nuclear envelope and nuclear membrane reassembly ACCEPT (IBDs on the PTHR22761 root with CHMP4A/B/C among the seeds; shrb is a CHMP4 ortholog with no loss on its path; flies have the CHMP7-type paralog CG5498; Shrub-GFP lines reforming daughter nuclei in neuroblasts and is needed for acentric reintegration, PMID:32032426; no direct fly sealing assay, recorded as a knowledge gap); vesicle budding from membrane ACCEPT (ILV budding and scission, PMID:33349255, PMID:19234443); cytoplasmic side of plasma membrane ACCEPT (PTN000509454, CHMP4A/B seeds; Shrub acts at the midbody bridge in abscission, PMID:37226981). MODIFY: mitotic cytokinesis (2 rows) to midbody abscission; obsolete multivesicular body assembly to GO:0032509. Contractile ring over-annotated (Shrub seen at midbody rings, not the constricting ring). FlyBase text UNVERIFIED: membrane repair untraced in flies; the duplicated phrase 'encodes Shrub encodes' recorded as an OTHER (editorial) defect, CONFIRMED. UniProt FUNCTION VERIFIED, no defect. Descriptions sidecar scored COMPLETE. just validate passes.
