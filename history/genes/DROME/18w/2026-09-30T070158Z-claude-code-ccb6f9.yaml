  details: |
    Reviewed all 20 GOA annotations for Drosophila 18 wheeler/Toll-2 (A1ZBR2): 14 ACCEPT, 4 KEEP_AS_NON_CORE, 2 MARK_AS_OVER_ANNOTATED. Core functions are developmental: a positional cell-surface receptor with Toll-6 and Toll-8 in convergent extension and axis elongation, and an adhesion-promoting receptor in morphogenesis. The immune rows (antibacterial humoral response IMP, immune response IEP) are marked over-annotated because PMID:12101100 shows that 18w is dispensable in adults, that its larval AMP defect is secondary to fat-body developmental delay, and that it is not a PRR. The NOT antimicrobial humoral response row is accepted. No PRR or GO:0002224 terms are present. Falcon deep research integrated; a candidate ligand, DNT-2 (from a 2025 study, not cached), is recorded in the notes only. just validate passes.
