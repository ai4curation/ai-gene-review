  summary: Full re-review of CG33090 PC isoform X2JE45, independent of ProtNLM2
  details: |
    Full re-review of X2JE45 (CG33090-PC, 799 aa native N-terminal isoform of the fly GBA2 ortholog, PANTHER PTHR12654:SF0). Added a new boundary-mapping analysis (CG33090-bioinformatics/map_isoform_boundary_rereview.py, RESULTS-rereview.md) that reuses the existing alignments: PC lacks the region corresponding to human GBA2 residues 1-193 but keeps both catalytic residues. GO:0004553 stays UNDECIDED with a strengthened reason: PMID:33261081 shows that a six-residue insertion at human 189/190, inside the region PC lacks, abolishes activity. GO:0005975 changed from UNDECIDED to MARK_AS_OVER_ANNOTATED: it is a generic six-hairpin-glycosidase superfamily mapping, and glucosylceramide catabolism does not fall under carbohydrate metabolic process. Rewrote the description; added a gene-level core function (beta-glucosidase activity, matching the PAINT gene-level IBA) with an isoform caveat; added a knowledge gap, questions and experiments; added references for the new analysis, UniProt and PMID:25344605. No NEW annotations. Notes appended (append-only).
