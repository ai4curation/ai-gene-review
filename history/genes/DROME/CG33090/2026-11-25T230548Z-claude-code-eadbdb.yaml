  summary: Record OpenScientist analysis of the CG33090-PC truncation and the limits
    of structural inference
  details: |
    Ran an OpenScientist deep-research job (kgap-cg33090-pc-foldability) on the knowledge gap covering whether the CG33090-PC isoform folds into an active GH116 glucosidase. It answers three of the four sub-questions and states plainly that structure cannot settle the fourth, which is what the hypothesis asked for.

    Mapped onto the first GH116 structure, the PC truncation removes five beta-strands of the N-terminal beta-sandwich and no helix, so it is fold core rather than a peripheral or membrane-association module. The lost segment makes hundreds of heavy-atom contacts with well over a hundred residues, including the helix carrying the nucleophile and the segment carrying an active-site arginine, and within the N-terminal domain it is the only part that approaches the catalytic centre at all, everything PC retains staying beyond about 15 Angstrom.

    It nonetheless donates no residue to the catalytic pocket or the glucose subsite: the closest lost residue lies about 8 Angstrom from the catalytic carboxylates and from the covalently bound glucosyl group, and every residue within 4.5 Angstrom of that ligand is in the C-terminal domain. PC keeps all six GH116 active-site residues, which the local X2JE45 record confirms at Glu362, Asp373, His428, Asp575, Glu765 and Arg774, the entry also carrying both the GH116 N-terminal and catalytic Pfam domains.

    The run corrects the gap statement on one point: the human equivalent of the removed region is about residue 207 rather than 193, because a fly segment aligns to an indel in the human sequence.

    What structure cannot settle is whether the remaining chain folds. The model is built confidently, but model confidence is not calibrated for construct stability, so a high score for a truncated chain is the expected output either way. The quantity with physical content is that the truncation uncovers some 7,100 square Angstrom of previously buried surface, nearly 40 per cent of it hydrophobic. The run states that structure cannot distinguish an inactive, aggregation-prone fragment from a folded protein with an altered N terminus, and warns that calling PC foldable or unfoldable from model confidence alone over-reads the model.

    Its best single prediction is that PC is inactive, and it rests that on the human precedent rather than the fly structure: of nine human GBA2 isoforms assayed, only full-length isoform 1 was active, with the two lacking five N-terminal beta-strands at background despite confirmed protein, as was an isoform whose only change was a six-residue insertion. A family sweep adds that the N-terminal domain length is tightly constrained and PC sits near the bottom of the distribution.

    Status moved from OPEN to NARROWING. The isoform-resolved assays already named in the resolution remain what would settle it. The structural mapping, contact counts, distances, buried-surface calculation, model-confidence values and the family sweep were not independently recomputed, and this run's single attempted quotation failed its own validation, so no literature quotation from it is relied on. Figures the run quotes in another numbering frame do not correspond to positions in this entry and were not checked. No annotation action was taken.
