  summary: 'Create review: CG5644 (Q9VSS3), EcKL subfamily D ortholog of AgEcK2'
  details: |
    De-novo review of CG5644 (Q9VSS3) as the nearest characterised relative of ProtNLM2 benchmark gene CG6830; ProtNLM2 predictions were not consulted. fetch-gene initially resolved to the TrEMBL cDNA entry Q7JVM8 (no GOA rows) and was re-run with --uniprot-id Q9VSS3. Falcon deep research failed (authentication) and the perplexity-lite fallback failed (quota), so the review uses primary literature directly (PMID:35794471, 38291829, 39208453, 32540344). A new bioinformatics analysis (compare_eck2.py, RESULTS.md) shows CG5644 and the biochemically characterised mosquito 20E 22-kinase AgEcK2 (F5HIV2) share PANTHER subfamily PTHR11012:SF47 and eggNOG ENOG502SGND, with a conserved HGDxWVNN catalytic loop, whereas CG6830 is in SF6. The single FlyBase TAS for GO:0106389 ecdysteroid 22-kinase activity was ACCEPTed as the core function, explicitly flagged as an orthology-based inference supported in Drosophila only by misexpression phenotypes; no process terms were added because misexpression arrest is not evidence of in vivo participation.
