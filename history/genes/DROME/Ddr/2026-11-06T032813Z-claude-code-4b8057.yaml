  summary: 'Create review: Ddr (DROME)'
  details: |
    First review of Drosophila Ddr (Q59DZ7). Manual literature search (no deep-research provider); the only functional study is PMID:36355066 (glial Ddr in axon ensheathment and axon caliber; genetic interaction with Multiplexin). New bioinformatics (Ddr-bioinformatics/) shows dipteran Ddr has lost the kinase beta3 Lys, catalytic-loop Asn and DFG Asp (predicted pseudokinase) and that the vertebrate DDR collagen-binding pocket is not conserved. Ten GOA rows reviewed (2 ACCEPT, 1 MODIFY, 4 MARK_AS_OVER_ANNOTATED, 2 UNDECIDED, 1 KEEP_AS_NON_CORE) and 2 NEW IMP rows added (non-myelinated axon ensheathment; regulation of axon diameter). Validated with just validate DROME Ddr.
