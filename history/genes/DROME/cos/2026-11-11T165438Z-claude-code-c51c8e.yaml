  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (cos-phylo.yaml, from `just phylo DROME cos`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0003777 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the node is a duplication before Eukaryota spanning 2099 leaves, and cos sits 11 steps below it across 1 duplication; 52 of the 53 seeds are paralogs of cos and one mouse seed is an ortholog across later duplications at 34% identity, so the tree does not contradict a lineage-specific loss of motility.
    - GO:0030705 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the term sits at the family root, 1 step above the common ancestor of the seeds; cos is itself a seed and the other 41 resolved seeds are all paralogs of cos. The tree offers no ortholog evidence for transport by cos beyond its own annotation.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
