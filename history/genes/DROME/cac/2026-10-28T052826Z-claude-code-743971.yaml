  summary: 'Create review: cac'
  details: |
    Created the first review of Drosophila cac (P91645), the sole Cav2-type voltage-gated calcium channel alpha1 subunit. All 68 GOA rows were reviewed against cached literature (full text for PMID:12122048, 19249276, 19596851, 22952921, 24275199, 25811491, 25831426; abstracts otherwise); a manual literature synthesis replaced deep research. Core functions: voltage-gated calcium channel activity at the presynaptic active zone membrane triggering synaptic vesicle exocytosis and neurotransmitter release, and somatodendritic HVA current. The FlyBase NOT neurotransmitter secretion row (PMID:25811491) was removed with a source defect, ARBA stimulus-detection rows were removed, general transport/membrane terms were refined, and Malpighian tubule fluid-transport rows were left UNDECIDED. No NEW terms were proposed.
