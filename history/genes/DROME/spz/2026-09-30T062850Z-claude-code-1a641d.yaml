    Reviewed all 89 GOA annotations for Drosophila Spaetzle (P48607): 75 ACCEPT, 11 KEEP_AS_NON_CORE, 1 MARK_AS_OVER_ANNOTATED (GO:0007310 oocyte D/V axis specification, IEP), 1 MODIFY (GO:0010628 to GO:0002804 positive regulation of antifungal peptide production), 1 UNDECIDED (GO:0050829 defense response to Gram-negative bacterium, abstract-only source). Core function: cytokine activity (Toll ligand) in the Toll signaling pathway, D/V axis specification, antifungal and anti-Gram-positive defence, extracellular. Neurotrophic growth factor activity, muscle patterning, cell competition, tumour and wound roles kept as non-core. No NEW proteolysis/processing terms: a QuickGO comparator check showed GO:0160032 Toll receptor ligand protein activation cascade is carried by the proteases and recognition factors (SPE, ea, snk, gd, psh, modSP, grass, Hayan, MP1) and not by spz, which is only the substrate. Validation passed (just validate DROME spz; validate-references).
