  summary: 'Create review: ci'
  details: |
    Reviewed all 155 seeded GOA annotations for Drosophila ci (P19538) and added one NEW proposal (156 rows total): 109 ACCEPT, 17 KEEP_AS_NON_CORE, 17 REMOVE, 11 MODIFY, 1 MARK_AS_OVER_ANNOTATED, 1 NEW, 0 UNDECIDED. Wrote the project-independent description covering both forms (activator Ci-155 and processed repressor Ci-75) and three core functions: DNA-binding transcription activator activity (GO:0001228), DNA-binding transcription repressor activity (GO:0001227, the NEW row), and RNA Pol II cis-regulatory region sequence-specific DNA binding (GO:0000978). Kept transcription, smoothened signaling pathway, nucleus, cytosol and Hedgehog signaling complex as core; marked every organ-level patterning, cell-cycle and immunity outcome non-core. All 22 GO:0005515 rows resolved under the protein-binding policy (17 REMOVE as uninformative, 5 MODIFY to GO:0031625 ubiquitin protein ligase binding or GO:0001223 transcription coactivator binding). MODIFY also used to specialise GO:0003677 and GO:0043565 to GO:0000978, GO:0006355 to GO:0006357, GO:0032991 to GO:0035301, and GO:0008140 to GO:0001223 (nejire is CREB-binding protein, not CREB). REMOVE of GO:0140297 (ARBA IEA): no characterised Ci partner is a DNA-binding transcription factor except Ci itself, already covered by GO:0042803. MARK_AS_OVER_ANNOTATED for GO:0035224 (IEP marker-expression evidence only). PAINT check: ci has no IBA descending from PTN001836086 (a taxon:33511 Deuterostomia node), so the vertebrate-seeded smoothened-pathway IBD does not reach the fly; ci's four IBAs come from PTN000456649 (taxon:33213 Bilateria), recorded with propagation_review. Added 90 references with titles taken verbatim from the cached publications, plus a research journal at genes/DROME/ci/ci-notes.md with inline verbatim citations. just validate DROME ci reports valid with no errors and no warnings; rendered to HTML.
