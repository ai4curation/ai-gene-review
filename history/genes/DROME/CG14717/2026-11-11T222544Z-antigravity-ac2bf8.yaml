  details: |
    Completed review of Drosophila CG14717 (8 GOA rows: 4 ACCEPT, 4 REMOVE) with CG14717-notes.md. Demonstrated by alignment against E. coli YbfF (PDB:3BF7, PMID:18215690), human ABHD11 (Q8NFV4 sv=2), and active fly sister paralog CG2059 (Q9W3R8) that 306-aa Q9VGJ4 (sv=1) substitutes the essential beta-5 nucleophilic serine with Gly120 (116-ALGHGMGGR-124) and remodels the oxyanion loop to 52-HDLNL-56 while retaining Asp144 (140-VILVDITPA-148) and His282 (278-LDAGHCVYE-286), consistent with absence of ABPP activity in PMID:33827210. Removed GO:0052689 (IBA), GO:0106435 (ISS from Q9W3R8), and GO:0006629 (IBA) with LOST Ser132->Gly120 residue_claims and GO_CENTRAL/FLYBASE source_defects plus single FlyBi Y2H GO:0005515 (IPI PMID:37061542), and accepted GO:0005739 (IBA), GO:0005759 (ISS), GO:0008233 (NOT peptidase activity, IKR), and BP ND GO:0008150 (nd_case: TRUE_GAP with BP_DARK knowledge gap).
