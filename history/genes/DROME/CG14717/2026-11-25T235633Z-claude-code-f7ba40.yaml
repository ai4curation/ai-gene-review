  summary: Record OpenScientist analysis of which non-catalytic surfaces the CG14717
    pseudoenzyme retains
  details: |
    Ran an OpenScientist deep-research job (kgap-cg14717-noncatalytic-surfaces) on the knowledge gap covering the endogenous non-catalytic role and partners of the CG14717 pseudoenzyme. It tests both halves of the gap's own boundary and splits them: the architecture supports ligand binding and gives no positive support for complex scaffolding.

    The pseudoenzyme call is now auditable position by position, and every residue was confirmed in the local Q9VGJ4 record. The nucleophile elbow reads GHGMGG at 118-123 against GHSMGG in human ABHD11 and in the catalytic fly paralog CG2059, so the attacking serine is Gly120; the oxyanion-hole glycine equivalent to human Gly65 is Asp53 and human Phe67 is Asn55, giving the 52-HDLNL-56 loop; and the charge-relay pair is untouched, Asp144 with His282 preceded by Gly281, hydrogen bonding at 2.72 Angstrom, the same distance measured in the human model. Exactly one triad residue is lost, on an otherwise intact catalytic scaffold.

    The cavity has not collapsed: after a superposition pairing 241 CA atoms at 1.31 Angstrom, with every catalytic anchor landing within half an Angstrom of its sequence-predicted partner, the enclosed site is still at the ABHD11 active-site position, lined by equivalent residues, with 75 per cent of the human cavity volume reproduced at 0.77 Angstrom mean displacement. The run reads this as retained rather than enlarged, because the absolute volumes reverse between two grid thresholds.

    The scaffolding test is negative on both available proxies. Across 16 Drosophilid orthologs the most conserved surface residues show no spatial clustering, sitting if anything more dispersed than chance, while the same test on cavity-lining residues returns a strong positive, so the method detects a real cluster when one exists; and the exposed face of the cap insertion, where this fold normally makes partner contacts, is the protein's least conserved surface. The run states the power caveat and a firmer limit: no experimental structure of ABHD11 exists in any species, and the human ABHD11 association with the 2-oxoglutarate dehydrogenase complex has no interface map, so the assembly surfaces the gap asks about have never been defined in the catalytic relative.

    On partners, some exist and all are weak: six chaperone associations from a tagged affinity-purification map, which for a matrix protein reads as a folding client and is a known background pattern, and one yeast two-hybrid hit with a cytosolic farnesyltransferase subunit that is topologically inconsistent with the matrix. No 2-oxoglutarate dehydrogenase complex subunit has been reported for CG14717 or any invertebrate ortholog.

    Two results sharpen what remains. The nucleophile loss is old and repeated: 16 of 19 scorable CG14717-orthogroup proteins have lost the serine, by glycine in 13 lineages and independently by aspartate and asparagine in two others, spanning the melanogaster group, the repleta and virilis radiations and the Hawaiian lineage, while the catalytic paralog orthogroup keeps it in 41 of 42. That is relaxed selection on catalysis rather than one switch to a single conserved non-catalytic role. Yet the gene is maintained as a full-length well-folded ORF and the import signal is more presequence-like than the catalytic human ortholog's, consistent with the N-terminal 40 residues of the local record, which carry five arginines, one lysine and one acidic residue. Selection acting differently on the two ends is the strongest argument available that the protein still does something.

    Three of the run's findings are blinded reproductions of local analyses that were withheld from the prompt, and they agree exactly: Gly120, Asp144 and His282; the 52-HDLNL-56 oxyanion loop; and the correction of the human Q8NFV4 charge-relay acid from the annotated Asp228 to Asp156, which this project had already recorded in its human ABHD11 review and bioinformatics file.

    No annotation action was changed. The run's reading of the carboxylesterase ISS row as carry-over from the catalytic paralog is the conclusion this review had already reached in the same terms, and it confirms that neither activity-based proteomics study produced a CG14717 record, both methods requiring an intact nucleophile. The eight GOA rows were checked against the local GOA file and match. Gap status moved from OPEN to NARROWING; the reference is recorded as UNVERIFIED with the unrecomputed items listed.
