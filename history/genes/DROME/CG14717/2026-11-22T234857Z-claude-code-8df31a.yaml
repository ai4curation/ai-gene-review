  details: |
    Ran a focused OpenScientist hypothesis (residue-loss-esterase) asking only whether the GxSxG nucleophile, oxyanion hole and Asp/His triad of CG14717 are conserved; the review decision and the held-out ABHD11 alignment were withheld. The run reproduced Gly120 and H52-D53 with an intact Asp144/His282 pair, matching the held-out table exactly, and found the serine loss is Drosophilidae-specific (mosquitoes retain it). Added the report as a reference and support on the GO:0052689 IBA REMOVE row; noted that a PAINT NOT belongs on the drosophilid clade, not a pan-Dipteran node. Action unchanged.
