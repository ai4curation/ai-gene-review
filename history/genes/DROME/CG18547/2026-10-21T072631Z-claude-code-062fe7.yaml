  details: |
    Full re-review independent of ProtNLM2 output. Added PANTHER tree placement and AKR tetrad analysis (CG18547-bioinformatics/). CG18547 is a Drosophila-specific paralog (with CG3397, CG12224) co-orthologous to C. elegans mec-14; yeast ARA2 and Arabidopsis LGALDH sit in separate fungal and plant clades. PAINT placed the L-galactose DH and erythroascorbate terms only at plant/fungal nodes, so GO:0010349 (IEA) and GO:0070485 (ISS) changed from UNDECIDED to MARK_AS_OVER_ANNOTATED; GO:0016491 IBA/IEA kept as ACCEPT, now supported by the retained catalytic tetrad. Description rewritten; status set COMPLETE; notes file created.
