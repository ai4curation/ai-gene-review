  summary: Full re-review of CG33116 (Q9VIU4), independent of ProtNLM2 predictions
  details: |
    Re-examined all 8 GOA rows against PMID:23449981 full text, PAINT PTHR10414 and a new phylogeny/CAPT-motif analysis (CG33116-bioinformatics/RESULTS-rereview.md). Established that SF71 is the invertebrate EPT1/SELENOI-type subfamily (no vertebrates; sister to SF47 SELENOI) and that CG33116/CG7149 are fly-lineage duplicates. Rewrote description and core function as lineage-inferred PE synthesis at the ER membrane. Changed GO:0016780 from KEEP_AS_NON_CORE to MODIFY -> GO:0004307. Kept the Golgi IBA REMOVE, with seeds identified as CHPT1 and the paralog CG7149. Choline transfer is not assumed. Added findings, reference_review, suggested experiments; appended a dated notes section.
