  summary: 'Create review: Ank2 (M9MRX4, isoform U)'
  details: |
    De-novo review of M9MRX4, the gene-centric canonical Ank2 product, which contains the full Ank2-XL sequence plus the Ank2-L C-terminal tail (analysis.py in Ank2__M9MRX4-bioinformatics). Falcon and perplexity-lite deep research both failed (auth/quota), so the review rests on cached primary literature with re-fetched full text for 9 papers. All 20 GOA rows reviewed: 11 ACCEPT, 2 MODIFY (cytoplasm, membrane), 3 KEEP_AS_NON_CORE, 1 UNDECIDED (axon extension), 3 REMOVE (death-domain signal transduction; two PMID:22153373 rows where ank2 is only the degeneration background, recorded as FlyBase source defects). Added NEW fly-experimental terms: microtubule binding, cell adhesion molecule binding, cytoskeletal adaptor activity, axon, maintenance of synapse structure, regulation of axon diameter. PANTHER 19 places Ank2 in PTHR24123:SF141 outside the bilaterian ankyrin PAINT node PTN002380879 (now PTHR24133), so no PAINT terms were transferred; ProtNLM2 output was not used.
