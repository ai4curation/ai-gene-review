  summary: 'Create review: Svil'
  details: |
    New review of Drosophila Svil isoforms AG/AH (UniProt M9MRN1, TrEMBL), fetched by accession because the gene-name UniProt search timed out. GOA holds only two FlyBase ND root-term rows, and both were accepted after a manual PubMed search found no Svil localization or mechanistic study. A bioinformatics comparison shows M9MRN1 shares its N-terminal 1292 residues with the long Svil isoform AE but lacks every gelsolin-like repeat and the villin headpiece, so actin binding was not added. The olfactory gene-trap screen (PMID:22530061, full text) has an ambiguous gene assignment (CG42669 vs CG42699), and the Mib2/border cell migration report (PMID:36067835, abstract only) is phenotype-level, so no NEW process terms were proposed. A manual deep-research file, notes, a core-function description with a knowledge gap, and suggested questions and experiments were added.
