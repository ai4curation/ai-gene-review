  summary: 'Create review: MESK2 canonical isoform I (Q7KVN0)'
  details: |
    New review of the gene-centric canonical MESK2 product Q7KVN0 (= Q9GU50), the experimentally characterised same-gene relative of ProtNLM2 benchmark Q8T0V2; independent of ProtNLM2 output. The single GOA row (HDA serine hydrolase activity, PMID:33827210) was judged MARK_AS_OVER_ANNOTATED after reading the full text from PMC: MESK2 is identified only at protein level after FP-biotin enrichment (Table 1, male head, 'Unknown hydrolase'), and it has Gly152 at the catalytic-serine elbow like noncatalytic NDRG2. Added NEW cytoplasm (IBA) inherited from PAINT node PTN000867215 (already on sequence-identical Q9GU50); signal transduction IBD not added and raised as a question. PANTHER SF56 placement verified against PANTHER 19.0 classification files; no NDRG1-4 subfamily functions transferred. Ras/circadian/lethal evidence is genetic only, so no process term. Falcon deep research failed (auth; perplexity-lite quota) and is recorded in notes. Full-text extraction script and RESULTS.md added under MESK2__Q7KVN0-bioinformatics/.
