  summary: 'Create review: raskol (Q8T498), reference relative for AEDAE/A0A6I8TLE4'
  details: |
    De-novo review of all 8 GOA rows, done without reference to ProtNLM2 output. Falcon deep research failed (HTTP 403), and so did the perplexity-lite fallback; the review relies on the cached full texts of PMID:30763317 and PMID:25294944 and on the abstract of the gap-2 donor paper PMID:9619631. Evolutionary grounding: PANTHER PTHR10194:SF60 shared with C. elegans gap-2 (the ISS donor), Bud2 and ngap, under PAINT root PTN008939999; the arginine finger Arg515 and the FLR motif are conserved. GTPase activator activity IBA and negative regulation of Ras signalling ISS were accepted, flagged as inferred and not measured in fly. The root-node term regulation of intracellular signal transduction IBA was MODIFIED to GO:0046580. Cytoplasm EXP/IEA rows were kept as non-core; plasma membrane, apical plasma membrane and apical cortex were accepted as experimentally established. No NEW terms: border cell migration rests on a single RNAi line without rescue, so it is raised as a question.
