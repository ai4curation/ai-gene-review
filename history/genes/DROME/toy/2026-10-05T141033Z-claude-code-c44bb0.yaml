  summary: 'Create review: toy'
  details: |
    Created the first complete review of Drosophila toy (twin of eyeless, Q9V490). Automated deep research was unavailable, so literature was gathered manually (11 additional PMIDs cached, including Czerny 1999, Punzo 2002/2004, Blanco 2010, Brockmann 2011, Zhu 2017) and summarized in toy-notes.md. All 19 GOA annotations were reviewed: the Pol II DNA-binding TF activity, nucleus, positive regulation of Pol II transcription, ocellus, eye-antennal disc and compound eye development annotations were accepted; brain/mushroom body and gene-expression terms kept as non-core; generic DNA binding and regulation of transcription modified to more specific terms; generic ARBA developmental terms and DNA-templated transcription marked as over-annotations. Core functions capture Toy as the upstream Pax6 activator of ey in compound eye specification and the principal Pax6 regulator of ocellus development.
