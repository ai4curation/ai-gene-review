  summary: Re-review DROME Hsp26 IBA assignments
  details: |
    Full-gene IBA re-review for Hsp26, aligned with the small-HSP IBA project
    record. Refreshed GOA from the current QuickGO/UniProt inputs and confirmed
    all 22 original non-NEW source assertions were preserved.

    Added propagation_review blocks to the five PTHR45640 IBA rows using
    PTN000897708 as the ancestral source. Current PAINT places the cytoplasm,
    nucleus, response-to-heat, and protein-refolding IBDs at this node; the
    old GO:0051082 source assertion is absent from current PAINT after term
    obsoletion and was treated as a term-scoping issue, not functional loss.

    Kept cytoplasm, response to heat, and protein refolding as core ACCEPT
    rows. Full PMID:16572729 directly shows purified Hsp26 protects heated
    citrate synthase and luciferase and maintains luciferase for later
    reactivation by other chaperones in ATP-supplemented reticulocyte lysate;
    full PMID:26705243 directly shows Hsp26 induction and S2-cell luciferase
    refolding support.

    Changed the nucleus IBA from ACCEPT to UNDECIDED. The PAINT source is real,
    but cached primary Hsp26 papers verify cytosolic localization and only the
    generated report currently mentions a minor Hsp26 nuclear-matrix pool.
    Queued that localization claim for primary-source retrieval and specificity
    review.

    Replaced obsolete unfolded-protein-binding and protein-folding-chaperone
    rows with GO:0140309 unfolded protein holdase activity, matching the
    sibling Hsp22/Hsp23 re-reviews. Updated core_functions to use this active
    molecular-function term directly. Also changed the 2024 DPIM2 generic
    GO:0005515 Hsp23 interaction from legacy MARK_AS_OVER_ANNOTATED to MODIFY
    with GO:0031072 heat shock protein binding, supported by full PMID:32437379.

    Added Hsp26-notes.md with full cached-entry and PubMed recency-search notes
    and recorded the Hsp26 row in
    projects/IBA_REVIEW/rereview-2026-09-20/small-heat-shock-compartments.yaml.
