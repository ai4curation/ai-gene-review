  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED (batch N17). GO:0000381 (IBD at PTN009063129) and GO:0016607 nuclear speck (IBD at PTN000567445): actions unchanged. The earlier reasons said the transfer rested only on shared RRM ancestry and that Modulo belongs to a nucleolin-like lineage. In the PAINT tree (PTHR23147) Modulo is one of three fly leaves with SC35 and maca (PTN008591610) inside the SRSF2 clade, confirmed by a PANTHER gene lookup, while UniProt cross-references PTHR24012. Reasons and comments rewritten to state the placement and to put the doubt on the target (nucleolin-like architecture, no RS domain, nucleolar and chromatin localization, no splicing evidence). Quotes unchanged. Validated.
