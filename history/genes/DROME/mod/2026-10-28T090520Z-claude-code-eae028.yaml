  summary: 'Create review: mod'
  details: |
    Created the review of Drosophila Modulo (P13469), a nucleolin-like nucleolar and chromatin-associated RNA/DNA-binding protein. All 13 GOA rows reviewed: RNA binding, DNA binding, nucleus and nucleolus accepted; nucleic acid binding modified to RNA binding plus DNA binding; protein binding (dCBP) modified to transcription coactivator binding; splicing-regulation and nuclear-speck IBA rows marked over-annotated as transfers from SR-protein nodes; sequence-specific DNA binding, mRNA binding, cytoplasm and protein-containing complex kept as non-core. Added heterochromatin location (IDA, PMID:9718368). No new process terms, because the centromere, transposon-silencing and growth roles rest on loss-of-function phenotypes. Manual literature synthesis written, as no deep-research API was available.
