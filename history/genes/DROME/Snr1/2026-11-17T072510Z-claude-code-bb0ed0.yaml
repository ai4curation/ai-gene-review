  details: |
    De-novo review of all 43 GOA rows for Drosophila Snr1 (Q24090): 21 ACCEPT, 9 KEEP_AS_NON_CORE, 5 MODIFY, 7 REMOVE (npBAF and nBAF IBAs, 5 bare protein-binding IPIs), 1 UNDECIDED, plus 1 NEW (cytoplasm, IDA PMID:27923836). Non-duplicative IBA verdicts: the three IBDs sit on PTN000001220, the Bilateria node of PTHR10019 (Snr1-bioinformatics/RESULTS.md). GO:0003713 transcription coactivator activity ACCEPT (seed human SMARCB1; fly BRM complex coactivates Zeste and Akirin/Relish targets, Snr1 knockdown lowers br/Eip93F; the repressor and cytoplasmic tumour-suppressor roles coexist with it). GO:0071564 npBAF and GO:0071565 nBAF REMOVE: seeded only by mouse Smarcb1, they name vertebrate assemblies defined by the BAF45a/BAF53a to BAF45b/c/BAF53b switch, which flies lack (single Bap55, PMID:21284845); GO_CENTRAL source defects (PROBABLE) suggest moving the IBDs to a vertebrate node. MODIFY: Tat protein binding (WITH Erm) to DNA-binding transcription factor binding with a UNIPROT WRONG_TERM defect (CONFIRMED); cell dedifferentiation to a proposed NTR negative regulation of cell dedifferentiation (UNIPROT WRONG_TERM, PROBABLE); positive regulation of DNA-templated transcription (2 rows) to the Pol II child; cyclin E protein binding to cyclin binding. FlyBase text VERIFIED (complex, tumour suppressor, endosomal trafficking all traced); UniProt entry is unreviewed with no FUNCTION text, no defect. Descriptions sidecar scored COMPLETE. just validate passes.
