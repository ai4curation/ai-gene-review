  details: |
    De novo review of Drosophila norpA (P13217), the rhabdomeric PLCbeta effector of phototransduction. Reviewed all 52 GOA rows against cached literature: accepted PIP2-PLC activity, GAP activity, opsin-PLC signalling, inaD complex and rhabdomere; refined generic lipid/signalling/phototransduction terms to specific carried terms; converted the INAD IPI row from PMID:9545241 to PDZ domain binding and removed two uninformative protein-binding rows; marked blindness-derived locomotion, ARBA homeostasis, calcium-mediated signalling and retinal PCD regulation as over-annotated; kept non-visual roles (gut immunity, thermotaxis, bitter avoidance, circadian entrainment) as non-core. Added one NEW axon location from PMID:22952921 immunostaining; no new process terms. Literature synthesis written manually (no deep-research provider).
