  summary: 'Full re-review: CG32086 (M9NF85), independent of ProtNLM2'
  details: |
    Full re-review of M9NF85, ignoring ProtNLM2 output. Established that M9NF85 is a 475-aa alternative splice isoform of CG32086 (16 residues shorter than the canonical CG32086-RA product Q8IQG0, EFHB C-terminal EF-hand domain intact) and that PANTHER 19.0 places the gene in the EFHB subfamily PTHR12086:SF12 with human EFHB and two fly paralogs. New analysis CG32086-bioinformatics/compare_sequences_rereview.py and RESULTS-rereview.md (isoform diff, PS00018 EF-hand loop scan showing no canonical Ca-binding loop in fly SF12 proteins, local alignments). GOA has no rows for M9NF85. Added one NEW annotation, axonemal microtubule (GO:0005879, ISS), from the family-wide PAINT node PTN000250051 plus spermatid expression; declined to transfer calcium ion sensor activity and SOCE/NFAT regulation because the fly protein lacks a canonical Ca loop and those rest on one human study (raised as a suggested question for the Q8IQG0 IBA rows). Rewrote description, added core function (location only, MF unknown), a BIOLOGY knowledge gap, questions and experiments. Appended a dated notes section. Next relative: Q8IQG0 (same-gene canonical, no review).
