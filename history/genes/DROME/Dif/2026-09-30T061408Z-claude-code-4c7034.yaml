  summary: 'Create review: Dif'
  details: |
    Reviewed all 81 GOA annotations for Drosophila Dif (P98149) consistently with its paralogue dl. Accepted the TF/DNA-binding activities, nucleus/cytoplasm, Toll signaling pathway (GO:0008063), innate immune response, defense response to fungus and to Gram-positive bacteria, and antimicrobial/antifungal peptide production terms as core. Removed salivary gland histolysis (IMP PMID:11973616), whose abstract states that Rel null mutants have no effect on that death response. Removed the non-canonical NF-kappaB IBA (NIK/p100 processing does not apply to Dif). Kept canonical NF-kappaB as non-core because drosomycin induction is ird5/IKK-independent (PMID:11156609). Modified Dorsal/Relish protein binding to protein heterodimerization activity and dTRAP80 binding to mediator complex binding. Removed Cactus protein binding as uninformative. No NEW terms were added. just validate passes with no errors or warnings, and quotes were verified against cached publications. Falcon deep research arrived after drafting; it is consistent with the review and is cited in core_functions.
