  summary: 'Create review: Tap42'
  details: |
    New review of Drosophila Tap42 (Q9VJZ5), the IGBP1/alpha4-family regulatory subunit of PP2A-family phosphatases. Full texts of PMID:22701670 and PMID:15802506 were read; a manual literature summary replaces deep research. Core function is protein phosphatase regulator activity (accepted IBA and IMP). The TOR signaling IBA is removed because fly Tap42 has been shown experimentally to act independently of TOR (PMID:15802506, PMID:17570358). The InterPro2GO regulation of signal transduction row is marked as over-annotated. The two protein binding IPI rows are modified to protein phosphatase 2A binding. The PP2A complex IDA, phosphatase inhibitor IGI and phenotype-based process rows are kept as non-core. No NEW terms were proposed.
