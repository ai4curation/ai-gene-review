  summary: 'Create review: CG34171 PB product (A8DZ15)'
  details: |
    New review of the full-length CG34171-PB product A8DZ15 (FBgn0085200), written independently of ProtNLM2 predictions as the same-gene reference for benchmark accession X2JEK1 (PC). New bioinformatics (CG34171__A8DZ15-bioinformatics/subfamily_analysis.py, RESULTS.md): PANTHER 19.0 places A8DZ15 in PTHR24260:SF136 (13 fly members, triad intact in only modSP, CG6592, CG30091), while UniProt says PTHR24276:SF96 and the IBAs come from PTHR24256 PTN000667087; A8DZ15 has H72/D124/F222 (catalytic Ser lost), a signal peptide, and an unannotated hydrophobic C-terminal segment 274-292 (possible GPI/membrane anchor). Actions: NOT serine-type endopeptidase activity and NOT peptidase activity (IKR) ACCEPT; extracellular region (IBA) ACCEPT with anchor caveat; proteolysis (IEA) MARK_AS_OVER_ANNOTATED (no PAINT proteolysis IBA, matches X2JEK1 row); innate immune response (IBA) KEEP_AS_NON_CORE (node seeds include noncatalytic CLIPA8; only modSP shares SF136 at 23% identity, its Toll role not transferred). No NEW terms. No function is experimentally established for this gene; gene-level Falcon report in genes/DROME/CG34171 reused (no CG34171-specific literature).
