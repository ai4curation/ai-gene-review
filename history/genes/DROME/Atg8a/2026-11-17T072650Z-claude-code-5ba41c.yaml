  details: |
    De novo review of Drosophila Atg8a (Q9W2S2, 38 GOA rows including 8 PAINT IBAs; GOA fetched with the taxonName include field dropped; X2JJA8 carries 20 mostly duplicate FlyBase rows, noted, not reviewed). PANTHER tree check: Atg8a and Atg8b sit in the Eumetazoa GABARAP clade PTN000861087; 88% identical to human GABARAP. Non-duplicative IBA verdicts: autophagosome assembly ACCEPT (core), autophagosome membrane ACCEPT (core), mitophagy KEEP_AS_NON_CORE (Atg8a recruited around mitochondria being cleared in the midgut), autophagosome maturation KEEP_AS_NON_CORE (Klp98A-Atg8 association; GO definition makes Atg8 the thing removed), ubiquitin protein ligase binding KEEP_AS_NON_CORE (Nedd4 by Y2H only), phosphatidylethanolamine binding MARK_AS_OVER_ANNOTATED (PE link is covalent conjugation, GO binding is non-covalent; departs from the other Atg8-family reviews), GABA receptor binding MARK_AS_OVER_ANNOTATED (seeds bind the vertebrate GABA-A gamma2 subunit; insects have RDL/LCCH3/GRD; no fly binding data), cellular response to nitrogen starvation MODIFY to cellular response to amino acid starvation. Protein tag activity ISS MARK_AS_OVER_ANNOTATED (target is a lipid, not a protein). Bare protein binding REMOVE; autophagy MODIFY to macroautophagy; phagocytosis MODIFY to phagosome-lysosome fusion; regulation of protein ubiquitination MARK_AS_OVER_ANNOTATED. One NEW row: protein-membrane adaptor activity (IMP, PMID:35649355, Atg8a-LDS flies), used as the core MF. FlyBase description VERIFIED, with one MISSING_STATEMENT source defect (lipidation-independent essential roles, PMID:33249988). UniProt record has no FUNCTION text. Bioinformatics: PAINT node placement and sequence check. Descriptions sidecar scored COMPLETE. just validate passes.
