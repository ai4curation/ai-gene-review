  details: |
    Created the first review of Drosophila Smn (Q9VV74) covering all 82 GOA rows. Core function: Smn is the scaffold of the minimal SMN-Gemin2 complex that loads Sm proteins onto Sm-site snRNAs (spliceosomal snRNP assembly), accepted from IDA/IMP/NAS rows, with SMN complex, SMN-Gemin2 and SMN-Sm complex memberships and cytoplasm/U body locations accepted. Phenotype-derived developmental, NMJ, locomotor, stem cell and tracheal process rows were kept as non-core; positive regulation of cholinergic transmission, AMPA receptor clustering, EPSP, basal protein localization and IEA RNA binding were marked over-annotated; IEA plasma membrane and bare protein binding rows removed; identical protein binding modified to homodimerization; one NEW contributes_to protein carrier chaperone row added from PMID:18621711. Literature synthesis was done manually (no deep-research provider) in Smn-deep-research-manual.md.
