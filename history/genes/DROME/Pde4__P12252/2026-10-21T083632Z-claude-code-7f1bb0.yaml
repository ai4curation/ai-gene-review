  summary: 'Create review: dnc (P12252, canonical dunce entry)'
  details: |
    De-novo review of the canonical Swiss-Prot dunce entry P12252 (isoform II), written independently of the ProtNLM2 predictions as the experimental reference for the Pde4 (Q9W4S9) benchmark gene. Falcon and perplexity-lite deep research both failed (auth/quota), so the review rests on cached literature plus five classic dnc papers fetched for it. All 36 GOA rows reviewed. GO:0004115 cAMP PDE activity is accepted from direct Drosophila evidence (PMID:1660926, PMID:6265472). Generic PDE/hydrolase terms go to MODIFY toward GO:0004115. Signal transduction goes to MODIFY toward GO:0141162, consistent with the PAINT IBD at PTN001682918, where dnc is a seed. Chemical synaptic transmission goes to MODIFY toward modulation of chemical synaptic transmission. learning and memory are refined to olfactory learning and short-term memory. Behavioural terms are kept as non-core. Axon extension is marked as over-annotated. The cGMP PDE IBD on the same deep PAINT node was deliberately not transferred and is raised as a question.
