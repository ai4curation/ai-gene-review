  summary: 'Create review: Gpdh1 (reference paralog for Gpdh3)'
  details: |
    New full review of Drosophila Gpdh1 (P13706), the experimentally characterised PTHR11728:SF8 paralog of ProtNLM2 benchmark gene Gpdh3, done independently of ProtNLM2 output. All 29 GOA rows reviewed. Core: NAD+-dependent G3P dehydrogenase activity (GO:0141152) in cytosol, G3P biosynthesis and the G3P shuttle; the flight-muscle isoform C is targeted to Z disc/M band via its C-terminal QNL (added PMID:9307964). Cytoplasm, the generic oxidoreductase term and the NAD(P)+ IBA (GO:0047952) are refined to specific terms the gene already carries. Glycolysis (IGI with Ldh), flight behavior, response to hyperoxia, carbohydrate metabolic process and G3P catabolic process are marked over-annotated (necessity or organismal phenotype, not participation). Ethanol metabolic process is UNDECIDED because the full text is unavailable. Falcon and perplexity-lite deep research both failed (authentication and quota); this is recorded in the notes.
