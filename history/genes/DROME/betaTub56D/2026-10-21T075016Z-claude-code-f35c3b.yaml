  summary: 'Create review: betaTub56D'
  details: |
    De-novo review of betaTub56D (Q24560, PTHR11588:SF504) as the experimentally characterised sister-clade relative of betaTub97EF, independent of ProtNLM2 predictions. Falcon and perplexity-lite deep research both failed (auth error / quota), so the review rests on directly cached PubMed literature. All 15 GOA rows reviewed: core structural terms (structural constituent of cytoskeleton, microtubule, MT cytoskeleton organization) and GTP binding/GTPase accepted with gene-specific support from fat body RNAi (PMID:32066907) and spindle immunolocalization (PMID:1903298); cytoskeleton and microtubule-based process MODIFY to specific terms; mitotic cell cycle and cytoplasm non-core; three ARBA developmental terms marked over-annotated as necessity rather than participation. Added NEW located_in mitotic spindle (PMID:1903298). Notes separate experimentally established from family-inferred functions and list which betaTub56D-specific properties must not be transferred to betaTub97EF.
