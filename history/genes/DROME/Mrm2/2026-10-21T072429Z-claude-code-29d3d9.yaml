  summary: Full re-review of Mrm2 (Q9VDT6), independent of ProtNLM2 predictions
  details: |
    Full re-review of the Drosophila Mrm2 GO annotations against PMID:35177605 and PANTHER/PAINT placement (PTHR10920:SF18 with human MRM2 and E. coli RlmE; PAINT node PTN000100455). Rewrote the description as a project-independent summary. Changed GO:0006364 rRNA processing from ACCEPT to MODIFY -> GO:0031167, because the general term is entailed by the rRNA methylation the gene already carries. Kept GO:0000027 as MODIFY -> GO:1902775 and added propagation_review. Kept the mitochondrion, matrix, GO:0008650, GO:0031167 and the GO:1902775 IMP as ACCEPT, with a caveat that the fly study did not directly assay assembly or methylation. Added a reproducible catalytic-site check (Mrm2-bioinformatics/compare_catalytic_sites.py, RESULTS-rereview.md): the RlmE catalytic K164 maps to fly K201 and the SAM-binding residues are conserved. Added reference_review entries, findings, suggested questions and experiments, and a new notes file. Next relative to review: human MRM2 (Q9UI43), which has no review in the repo.
