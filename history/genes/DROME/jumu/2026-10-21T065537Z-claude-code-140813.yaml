  summary: 'Full re-review: jumu (independent of ProtNLM2)'
  details: |
    Full re-review of Q9XTP7 jumu independent of ProtNLM2 predictions. Added PANTHER 19.0 placement analysis (jumu-bioinformatics/panther_placement_rereview.py, RESULTS-rereview.md): jumu is in PTHR13962:SF17 with vertebrate FOXN4, disagreeing with the UniProt PTHR46721:SF3 cross-reference. Refined GO:0003700 (IBA/IEA) to GO:0001227 RNA pol II-specific repressor activity and GO:0006355 (IBA/IEA) to GO:0000122, based on EMSA plus cis/trans enhancer assays in PMID:22378636; activator activity not asserted because direct targets are untested (PMID:39684645). Core function MF updated to GO:0001227. Chromatin organization, euchromatin, polytene chromosome and chromocenter rows demoted from ACCEPT to KEEP_AS_NON_CORE. Dorsal closure TAS stays UNDECIDED. Added reference_review entries, the falcon report and the analysis file as references; rewrote the description; added suggested questions/experiments; status COMPLETE. Appended a dated notes section.
