  summary: 'Full re-review: Gpdh3 (E1JIT1), independent of ProtNLM2'
  details: |
    Full re-review independent of ProtNLM2. E1JIT1 is the Gpdh3-PB isoform (1291 aa; lacks a 14-aa segment present in PA/Q8IN06). New residue analysis (bioinformatics/*_rereview.py, RESULTS-rereview.md) shows D. melanogaster Gpdh3 has Thr at the GPD1 proton-acceptor Lys204 position (lost in the melanogaster group, retained in obscura/willistoni orthologs) and a GxExxG NAD loop conserved across the Gpdh3 lineage. Catalytic/NAD/process annotations moved from ACCEPT/MODIFY/KEEP to UNDECIDED; glycerol-3-phosphate catabolic and glycerophospholipid metabolic process marked over-annotated; core function removed; description rewritten; added PMID:33083121 (testis-biased long-branch paralog) and deep-research reference.
