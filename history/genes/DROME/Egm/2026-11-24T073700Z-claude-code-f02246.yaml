  summary: 'IBA over-annotation re-review: GO:0051793 and GO:0070991 moved to REMOVE'
  details: |
    Re-judged against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N18). GO:0051793 medium-chain fatty acid catabolic process and GO:0070991 medium-chain fatty acyl-CoA dehydrogenase activity IBA: MARK_AS_OVER_ANNOTATED to REMOVE. In the PAINT tree the Egm leaf PTN000098640 sits inside the MCAD clade (IBD node PTN000098033) as a Drosophila-only sister of fly Mcad, although Egm is the ACAD9 ortholog (UniProt PANTHER PTHR43884:SF9). The terms are the specificity of a paralogous family, and ACAD9 lineage evidence points to long-chain substrates (PMID:16020546, PMID:25721401). The earlier reason said the tree lacks this node and leaf, which the current tree does not bear out. PAINT-side form: loss at the leaf; durable fix: leaf reassignment. Quotes unchanged.
