  summary: 'Create review: CG33090 canonical product Q7KT91 (CG33090-PB)'
  details: |
    New review of the Swiss-Prot canonical CG33090-PB product (Q7KT91), as the experimentally closest relative of benchmark gene X2JE45 (same gene, FBgn0028916), written independently of ProtNLM2 output. Falcon and perplexity-lite deep research both failed (auth/quota), so the review was built from cached literature and QuickGO PAINT data. All 12 GOA rows reviewed. Beta-glucosidase activity (IBA from family-root node PTN000291742; ISS) accepted as the core function and the generic O-glycosyl hydrolase row was refined to it. Glucosylceramidase activity and glucosylceramide catabolism were left UNDECIDED because PAINT never propagated them and no fly assay exists. Bile acid metabolic process was removed (no insect bile acid pathway; normal bile acids in mouse Gba2 KO). Glucosyltransferase, glycoside catabolism and plasma membrane were marked over-annotated (vertebrate-only in vitro data; mouse GBA2 is peripheral ER/Golgi; fly phosphosites contradict the predicted extracellular topology). Membrane accepted. Nothing was experimentally established in Drosophila.
