  summary: 'Create review: smo'
  details: |
    Reviewed all 101 seeded GOA annotations for Drosophila smoothened (P91682), replacing every PENDING action: 65 ACCEPT, 22 KEEP_AS_NON_CORE, 9 MODIFY, 4 REMOVE, 1 MARK_AS_OVER_ANNOTATED. Wrote the top-level description and six core_functions (GPCR activity, C-tail protein-macromolecule adaptor activity, protein kinase binding, homodimerization, PI(4)P binding, phosphatidic acid binding). MODIFY actions: the InterPro rows GO:0004888 -> GO:0004930, GO:0007166 -> GO:0007224 and GO:0016020 -> GO:0005886 + GO:0060170 (matching the human SMO review), plus six bare GO:0005515 protein binding rows whose partner is Costal-2, modified to GO:0030674 protein-macromolecule adaptor activity in line with the smo_tail_recruitment annoton of modules/hedgehog_signaling.yaml. REMOVE: three uninformative GO:0005515 rows (Sex-lethal co-IP; two Usp8 rows where smo is the deubiquitinase substrate) and the IBA GO:0071679 commissural neuron axon guidance, which carries a propagation_review recording PROPAGATION_BAD with LINEAGE_OR_TAXON_MISMATCH, consistent with the TOO_DEEP assessment of that row in interpro/panther/PTHR11309/PTHR11309-review.yaml. MARK_AS_OVER_ANNOTATED: GO:0042981, whose cited study shows the anti-apoptotic effect is non-cell-autonomous and executed by Notch/Diap-1. Settled the UNRESOLVED cilium assessment on PAINT node PTN000885245: fly smo carries its own experimental GO:0005929 cilium annotation (IDA, PMID:24768000) from ciliary Smoothened localisation in olfactory sensory neurons, corroborated by UniProt cilium membrane with the same ECO reference, so the eumetazoan placement is grounded in protostome evidence and the assessment resolves in favour of the node; the same paper resolves the parallel UNRESOLVED dendrite row. Added smo-notes.md as the research journal with 47 verbatim inline citations, and reference_review entries on four references. No annotations left UNDECIDED.
