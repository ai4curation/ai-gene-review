  summary: 'Create review: sqz (Q9VDZ3), paralog reference for dati'
  details: |
    De-novo review of Drosophila squeeze, done as the closest characterised paralog of ProtNLM2 benchmark gene dati and independent of ProtNLM2 output. Deep research failed (falcon 403 auth, perplexity-lite quota), so the review rests on UniProt, PTHR16515 PAINT files and cached abstracts (PMIDs 12679036, 15748845, 17428824, 17442544, 17276922, 18948419). 13 GOA rows: IBA DNA-binding TF activity, cis-regulatory DNA binding, regulation of transcription by Pol II and nucleus ACCEPTed (PTN004619861 Eukaryota-level clade; Sqz-specific DNA binding not shown, stated as inferred); neuron development IMP ACCEPTed as the core role; neuroblast development and dendrite guidance IMP kept as non-core; Rel Y2H protein binding REMOVEd under the GO:0005515 policy; four ARBA IEA rows TOO_GENERAL (ancestors of the IMP terms). No NEW terms: neuron fate specification rejected after a comparator check (ap, nab, dimm lack it), raised as a question. Notes record which functions are experimental versus inferred for later transfer to dati; SF66 flagged as a heterogeneous subfamily.
