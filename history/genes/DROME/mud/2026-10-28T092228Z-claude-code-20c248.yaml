  details: |
    De novo review of Drosophila mud (UniProt M9NEG4, FlyBase FBgn0002873), the NuMA/LIN-5 counterpart. All 22 GOA rows reviewed: spindle orientation, asymmetric neuroblast division, cell cortex, apical cortex, centrosome and spindle accepted; axon guidance, mushroom body development, meiosis II spindle assembly and tricellular junction kept as non-core; DNA binding (PMID:21855794, no DNA assay in full text) and bare protein binding removed, with a FlyBase source defect for DNA binding; spindle midzone modified to meiotic spindle pole (suspected source defect); cytoplasm modified to cell cortex; thermosensory behavior marked over-annotated; basal cortex and microtubule anchoring at centrosome undecided (abstract only). Added NEW microtubule binding (IDA, PMID:16740476) and core functions for cortical spindle orientation and spindle-pole roles. Manual literature synthesis written; no deep-research provider used.
