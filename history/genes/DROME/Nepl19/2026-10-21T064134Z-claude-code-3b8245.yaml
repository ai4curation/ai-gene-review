  summary: Full re-review of Nepl19 (Q9VAS1), done independently of the ProtNLM2 predictions
  details: |
    Re-examined all 5 annotations. The plasma membrane IBA and IEA rows are kept as MODIFY to extracellular region (signal peptide, no anchor); a propagation_review was added to the IBA row. The proteolysis IEA (InterPro2GO) was changed from UNDECIDED to REMOVE because the catalytic HExxH residues are lost (QQLAH) and the row contradicts the accepted NOT peptidase activity. Both NOT peptidase activity IKR rows are ACCEPT. The description was rewritten, and a knowledge gap, suggested questions and experiments were added. A new subfamily-placement analysis (subfamily_tree_rereview.py, RESULTS-rereview.md) puts Nepl19 in the 98F1 Nepl tandem clade within PTHR11733:SF238 and shows that the HExxH loss is specific to Nepl19. The notes received an appended dated section.
