  summary: 'Create review: bi'
  details: |
    Created the first review of Drosophila optomotor-blind (bi, Q24432), a Tbx2-subfamily T-box transcription factor. All 29 GOA rows were reviewed against cached literature, including the full text of PMID:22412948 (bantam regulation of omb in optic-lobe glia). Core functions are RNA polymerase II-specific DNA-binding transcription factor activity acting mainly as a repressor, and Dpp-responsive wing disc A/P patterning and morphogenesis. The protein binding IPI row (Zelda, PMID:23891688) was removed and flagged as a probable FlyBase source defect because the paper reports Zelda ChIP at the omb locus; the InterPro-derived positive regulation of transcription row was marked over-annotated; generic DNA binding and ARBA developmental rows were marked too general; no NEW terms were proposed.
