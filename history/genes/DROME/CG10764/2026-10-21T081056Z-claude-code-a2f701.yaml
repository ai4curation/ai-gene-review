  summary: 'Create review: CG10764 (SP77)'
  details: |
    De-novo review of CG10764/SP77 (A1ZAT2), done as the experimentally studied paralog reference for DROME/CG43742 (PANTHER 19.0 PTHR24260:SF147), independent of ProtNLM2 output. Falcon deep research failed (auth error; perplexity fallback 403), so the review rests on cached literature (PMID:33644706 RNAi encapsulation, PMID:20168330 JAK/STAT target and hopTum IGI, PMID:30367934 PD+PLD architecture, PMID:12568721) and a new motif scan in CG10764-bioinformatics/ (complete triad H78/D121/S214 in domain 1, S1-pocket D208; domain 2 non-catalytic). All 12 GOA rows reviewed: GO:0004252, GO:0005576, GO:0006508 and IBA GO:0045087 accepted; peptidase, serine-type peptidase and hydrolase activity modified to GO:0004252; IGI negative regulation of hemocyte proliferation kept as non-core. No NEW terms. Notes record which functions are experimental (RNAi immune requirement) versus sequence-inferred (enzyme activity, secretion).
