  summary: 'Create review: loqs canonical Swiss-Prot entry Q9VJY9'
  details: |
    New full review of the canonical loqs accession Q9VJY9 (Loqs-PB; isoforms PA, PC, PD), kept separate from genes/DROME/loqs, which is keyed to isoform F (X2J5X6). The review is independent of ProtNLM2 predictions. Falcon deep research failed (authentication), and the perplexity-lite fallback hit its quota, so the review relies on cached primary literature and the curated Swiss-Prot record. Four extra PMIDs were cached. All 44 GOA rows were reviewed. Evolutionary grounding comes from PANTHER PTHR46205:SF3 and the family-root PAINT node PTN005287422. Nucleus and RISC complex IBAs are MARK_AS_OVER_ANNOTATED: Loqs is cytoplasmic and sits in the RISC-loading complex, not in AGO1-GW182 miRISC (PMID:19451544). siRNA-pathway rows are ACCEPTED at gene level, attributed to Loqs-PD and recorded in functional_isoforms. The four GO:0005515 Dcr-1 IPIs and the GO:1905172 Dcr-1 IPI are MODIFIED to GO:0170054 ribonuclease activator activity. Dosage compensation (sensitized viability IGI) is over-annotated, and developmental IMPs are kept as non-core. Core functions cover PB dsRNA binding and Dcr-1 activation in pre-miRNA processing, PD Dcr-2 activation in siRNA processing, and PD siRNA binding in the alternative RLC.
