  summary: 'Create review: Aef1'
  details: |
    New review of Drosophila Aef1 (P39413), a C2H2 zinc finger repressor of fat body enhancers. All five GOA rows (IBA/IEA) reviewed: DNA-binding and nucleus rows accepted; GO:0000981 refined to GO:0001227 repressor activity and GO:0006357 refined to GO:0000122 on the basis of Falb and Maniatis 1992, An and Wensink 1995, Ren and Maniatis 1998 and Brodu et al. 2001. Genome-wide S2 cell ChIP/RNAi data (PMID:40771843) and the olfactory gene-trap screen (PMID:22530061) were read in full; no NEW terms were added because the olfactory phenotype rests on a line with two insertions and no excision rescue. Manual literature notes written as Aef1-deep-research-manual.md.
