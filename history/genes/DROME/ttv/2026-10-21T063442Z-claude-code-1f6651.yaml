  summary: 'Full re-review: ttv-PC (D5SHU8) isoform'
  details: |
    Full re-review of D5SHU8, independent of ProtNLM2 predictions. D5SHU8 is the 299-aa ttv-PC alternative product (Q9V730 residues 462-760), lacking the signal anchor and GT47 domain. Added rereview analyses (human EXT1/EXT2 GT-A residue mapping, hydropathy) under ttv-bioinformatics/rereview/. Changed the 5 IEA rows from UNDECIDED: ER membrane REMOVE (ARBA type II topology contradicted by sequence); membrane, glycosyltransferase activity, glycoprotein biosynthetic process and carbohydrate derivative metabolic process MARK_AS_OVER_ANNOTATED, using subfamily-matched (PTHR48261:SF3) human EXT1 GT-A data (PMID:36593275, PMID:36402845). Rewrote description; core_functions left empty; added PMID:36402845 and the canonical Q9V730 UniProt file as references. Next relative: canonical Q9V730 (unreviewed).
