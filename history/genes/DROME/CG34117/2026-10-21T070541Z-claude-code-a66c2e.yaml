  summary: 'Full re-review of CG34117 (Q0KI97): re-grounded support on in-subfamily
    human FMC1 instead of separate-family yeast Fmc1'
  details: |
    Rebuilt the description, core function and annotation support on human FMC1 (Q96HJ9; same PANTHER subfamily PTHR31716:SF1; PMID:28719601 knockout/rescue, ATPAF2 binding, mitochondrial IDA). Yeast Fmc1 (P40491) is in PTHR28015 and has no detectable homology, so the ISS mitochondrial matrix row (with P40491) was changed from ACCEPT to UNDECIDED and a WRONG_WITH_FROM CHECK source defect was recorded for FlyBase. The mitochondrion IBA, complex V assembly IBA/ISS and ND MF rows are kept as ACCEPT. Added a sequence comparison under CG34117-bioinformatics (compare_fmc1_rereview.py, RESULTS-rereview.md), a new notes file and reference reviews; status set to COMPLETE. ProtNLM2 predictions were not used.
