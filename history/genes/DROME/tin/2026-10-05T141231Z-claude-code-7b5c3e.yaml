  summary: 'Create review: tin'
  details: |
    Created a full review of Drosophila tinman (P22711), an NK-2 homeodomain TF (Nkx2-5 ortholog). Automated deep research failed (falcon 402, OpenAI 401), so tin-notes.md is a manual literature synthesis; 11 additional PMIDs were cached (Bodmer 1990/1993, Azpiazu & Frasch 1993, Yin 1997, Gajewski 1997/1999/2001, Lockwood 2002, Lee & Frasch 2005, Qian 2011, Junion 2012). All 41 GOA annotations reviewed: TF activity, cis-regulatory binding, nucleus and cardiac/mesodermal differentiation terms accepted; non-autonomous phenotypes (salivary gland positioning, gut L/R looping, anterior midgut morphogenesis, germ cell migration, ventral cord FMRFa neurons) marked over-annotated; ARBA nervous system development removed; DNA binding and digestive tract development modified to more specific terms; somatic muscle development added as NEW. Core functions emphasize that tin is necessary but not sufficient for heart induction, acting combinatorially with Dpp/Wg effectors, Pannier and Doc.
