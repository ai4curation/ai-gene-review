  details: |
    Created the first review of Drosophila Sk2 (Q9VZW0), covering all 12 GOA rows. Kept sphingosine kinase activity (IDA, IBA, IEA), cytoplasm and lysosomal membrane (IDA, from the full text of PMID:21321100). Refined general IEA kinase, transferase and endomembrane rows to their specific terms. Changed IDA sphingolipid metabolic process and IBA sphingosine biosynthetic process to sphingoid metabolic process, because the kinase consumes sphingosine and does not make it. Removed bare protein binding. Added no NEW process terms, because the phenotype data (ovulation, flight, photoreceptor trafficking, synaptic homeostasis) do not show which step Sk2 itself performs.
