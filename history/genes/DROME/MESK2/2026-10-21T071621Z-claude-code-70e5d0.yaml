  summary: Full re-review of MESK2 benchmark isoform Q8T0V2 (ProtNLM2-independent)
  details: |
    Replaced the INITIALIZED stub (gene_symbol Q8T0V2, TODO description) with a complete review. Established that Q8T0V2 (447 aa) is a full-length MESK2 isoform A/E/F, sequence-identical to reference-proteome record A4UZR7 (recorded in alternative_records); the gene-centric canonical is Q7KVN0 (isoform I, = Q9GU50), which carries the gene's GOA rows. Q8T0V2 has no GOA rows. New analysis (MESK2-bioinformatics/pseudo_active_site_rereview.py, RESULTS-rereview.md) shows the shared 338-residue Ndr block and a Gly at the catalytic-serine position, as in human NDRG2, so no hydrolase activity is assigned. PANTHER PTHR11034:SF56, separate from human NDRG1-4 subfamilies; added one NEW cytoplasm row from the Eumetazoa PAINT node PTN000867215. Ras/KSR misexpression and glial-RNAi circadian phenotypes not annotated as process participation. Cached PMID:11063696, 29487148, 16980395. ProtNLM2 predictions not consulted.
