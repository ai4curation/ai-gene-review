  details: |
    New review of Drosophila Arl1 (P25160, FBgn0000115). All 25 GOA rows reviewed against cached literature (PMID:22291037, 19001129, 24610947 full text; 1901655, 21693198, 10798391 abstract only) plus PMID:26116655 on Arfaptin. Core functions: Arf-family GTPase switch at the trans-Golgi, and GTP-dependent recruitment of GRIP golgins, Sec71 and Arfaptin to the Golgi membrane. Bare protein binding removed per policy; cytoplasm, establishment of localization in cell and protein localization to Golgi apparatus modified to more specific terms; TAS synaptic rows from a homology survey and the derived presynapse IEA marked over-annotated; ER membrane, ER-to-Golgi regulation, secretory granule organization and intracellular protein transport kept as non-core. No NEW annotations. Manual literature notes written as Arl1-deep-research-manual.md since no deep-research provider was available.
