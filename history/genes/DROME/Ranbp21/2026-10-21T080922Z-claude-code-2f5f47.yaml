  summary: 'Create review: Ranbp21 (Drosophila exportin-5)'
  details: |
    De-novo review of Ranbp21/Q9VWE7 (dmExp5), independent of ProtNLM2 predictions, as the experimentally characterised reference for Drosophila exportin-5 orthologs. Falcon deep research failed (403 auth) and the perplexity-lite fallback failed, so the review rests on cached primary literature (PMID:16963774, PMID:39098529, PMID:17599402; background PMID:12426392, PMID:14730017). All 9 GOA rows (IBA/IEA only) reviewed: generic RNA binding and RNA export from nucleus MODIFIED to tRNA binding/pre-miRNA binding and tRNA/pre-miRNA export from nucleus on fly evidence; nuclear export signal receptor activity, nucleus, cytoplasm and small GTPase binding ACCEPTED; protein export from nucleus and intracellular protein transport MARKED_AS_OVER_ANNOTATED (XPO1-driven family mappings that PAINT declined to propagate to the exportin-5 clade; no fly protein cargo). Added NEW IDA tRNA binding and pre-miRNA binding and IMP tRNA export and pre-miRNA export from nucleus, noting the export evidence is indirect (RNAi lowers mature RNA levels).
