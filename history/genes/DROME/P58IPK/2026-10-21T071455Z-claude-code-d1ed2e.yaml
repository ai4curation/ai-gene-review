  summary: 'Full re-review: P58IPK (Q9VHA8), independent of ProtNLM2'
  details: |
    Full re-review independent of ProtNLM2 predictions. Confirmed Q9VHA8 is the full-length FlyBase product (identical to Q7K3H7). New PANTHER tree analysis (P58IPK-bioinformatics/RESULTS-rereview.md) shows fly P58IPK and vertebrate DNAJC3 are orthologs at the Bilateria node; SF2/SF3 label split reflects a vertebrate duplication. All six annotations kept (5 ACCEPT, 1 KEEP_AS_NON_CORE); supporting evidence re-grounded in PMID:18923430 (ortholog mechanism, HPD H422 = fly H424) and PMID:39242711 (fly HTT103Q co-IP) instead of InterPro lines only. Description and core functions rewritten; eIF2-alpha kinase inhibition not transferred (PAINT did not propagate it). Status DRAFT to COMPLETE.
