  summary: 'Full re-review: glo (Q8INJ6, isoform C)'
  details: |
    Full re-review independent of ProtNLM2 predictions. Established that Q8INJ6 is Glorund isoform C (179 aa; residues 1-168 identical to the 586-aa long product Q9VGH5; complete qRRM1 only, qRRM2 truncated, no qRRM3) via new compare_isoforms_rereview.py. Cached and read 7 full-text Glorund papers (PMID:28380354, 37427795, 35699205, 21460235, 33537463, 41837177, 39092172). Replaced the prior blanket-UNDECIDED isoform framing with gene-level judgements: RNA binding and mRNA binding ACCEPT; nucleic acid binding MODIFY to RNA binding; regulation of translation MODIFY to negative regulation of translation; protein binding x2 REMOVE (policy); developmental/mRNA localization rows and complex rows KEEP_AS_NON_CORE; chromosome organization MARK_AS_OVER_ANNOTATED (downstream of otu splicing); wound healing UNDECIDED (abstract-only screen). Added NEW mRNA 3'-UTR binding, mRNA regulatory element binding translation repressor activity, nucleus, cytoplasm, with explicit caveats that a single-qRRM product does not repress nanos (PMID:37427795). Recorded PANTHER SF76 placement (not hnRNP F/H or ESRP subfamilies) and disagreement with the lumped PTHR13976 family review.
