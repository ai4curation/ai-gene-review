  summary: Full re-review of CG13096 (H0RNN8), independent of ProtNLM2 predictions
  details: |
    H0RNN8 has the same sequence as canonical Q9VLK2, so it is a redundant clone record, not an isoform or fragment. GOA has no rows for H0RNN8, and Q9VLK2 has only ND roots. Rewrote the description and added one hedged core function (RNA binding, nucleolus), supported by a falcon report that relays an unpublished thesis and by a new family-placement analysis (CG13096-bioinformatics/l1_family_placement.py, RESULTS.md). The analysis groups CG13096 with RSL1D1/Utp30/Cic1 (phmmer, eggNOG KOG1685, OrthoDB, four Alliance methods), while PANTHER places it separately in PTHR48162:SF1. No NEW annotations: the only direct evidence is unpublished and FlyBase has ND. Appended a dated notes section.
