  summary: Full re-review of dati (Q9V4C9, isoform B) independent of ProtNLM2 predictions
  details: |
    Re-examined all six GOA rows against PMID:25291190 (full text). Kept the actions (nucleus, generation of neurons and neuron projection development ACCEPT; locomotion, mushroom body development and female receptivity KEEP_AS_NON_CORE) and tightened the supporting quotes. Removed the Nmp4/ZNF384 (PMID:11867614) DNA-binding transfer from the core function: ZNF384 is in a different PANTHER family (PTHR23234), and the primary paper restricts dati orthologs to arthropods. The reference is retained and marked MISCITED/no longer used. Added NEW GO:0003700 (ISS, from the six-finger domain architecture) to match the core function. Added an isoform/relative analysis (compare_isoforms_rereview.py, RESULTS-rereview.md): Q9V4C9 is full-length and differs from isoform A/C only by lacking a 10-aa segment in finger 4. PANTHER SF49/SF66 placement is inconsistent across dati products. Rewrote the description, set status COMPLETE, and added suggested questions and experiments. Next relative: sqz (paralog, PTHR16515).
