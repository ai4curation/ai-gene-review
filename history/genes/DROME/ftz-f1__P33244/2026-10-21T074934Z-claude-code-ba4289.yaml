  summary: 'Create review: ftz-f1 (P33244, Swiss-Prot canonical)'
  details: |
    New review folder for the reviewed canonical entry P33244 (FBgn0001078), separate from genes/DROME/ftz-f1 (M9NFK2 = isoform P33244-2), done without reference to ProtNLM2 predictions. All 41 GOA rows reviewed from primary literature; falcon deep research failed on authentication, as recorded in the notes. PANTHER SF15 placement and the bilaterian PAINT node PTN000639680 were checked (bioinformatics/RESULTS.md), and no vertebrate NR5A ligand or steroidogenic function was transferred. Both nuclear receptor activity rows were modified to GO:0001228 because FTZ-F1 does not bind phospholipids and has no known ligand. Protein binding with Ftz was modified to GO:0061629, and generic DNA-binding and transcription terms were refined to GO:0000978, GO:0006357 and GO:0045944. Hormone-mediated signaling (IBA) was modified to the JH pathway, the cytoplasm NAS row is UNDECIDED, and developmental phenotypes are kept as non-core. Added NEW GO:0007366 (pair-rule partitioning) because FTZ-F1 is the DNA-bound Ftz cofactor (PMID:9020363, 9020364, 19679121). Core functions are the RNA polymerase II activator, the Ftz cofactor and the ecdysone competence factor.
