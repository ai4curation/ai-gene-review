  summary: Full re-review of CG42331 (Q9VC41) independent of ProtNLM2 predictions
  details: |
    Replaced uncurated stub with a full review. Identified Q9VC41 as CG42331-PC, an N-terminally truncated isoform (residues 177-1615 of Q9VC42) lacking the signal peptide but retaining the complete peroxidase domain with all catalytic/heme residues. PANTHER tree places the SF109 leaf in a fly-specific polytomy (PTN008518854) with cardinal and the Pxd/CG4009/CG10211 clade. Accepted peroxidase activity and heme binding; MODIFY oxidoreductase activity to peroxidase activity; UNDECIDED extracellular region (isoform lacks signal peptide); over-annotated response to oxidative stress and cellular oxidant detoxification; removed three ARBA developmental/reproductive BP terms. Added bioinformatics script and RESULTS.md, and a notes file.
