  summary: Full re-review of Fbxo42 (Q9W281), adding the Ataxin-2 substrate evidence
    from PMID:40804044
  details: |
    Full re-review, done independently of the ProtNLM2 predictions. Cached the peer-reviewed PMID:40804044 (Santos et al. 2025 Nat Commun), which shows Fbxo42 binding SkpA through its F-box and binding Ataxin-2, and Fbxo42-dependent ubiquitylation and proteasomal degradation of Ataxin-2 during the UPR. The falcon deep-research report had cited this work only as a dissertation. All 7 GOA rows are still ACCEPT. Replaced the supporting text that had been copied identically into every row with row-specific quotes; GO:0031146 now has direct support. Noted that the PMID:33382409 IPs contained the PP2A A and C subunits and deferred to the curators on the Wrd IPI partner. Rewrote the description and split core_functions into the SCF adaptor function and germline synaptonemal-complex regulation. Added reference_review entries, including one for the deep-research file. No NEW annotations: the stress-granule CC and UPR-regulation BP are raised as suggested_questions. The next relative to review is human FBXO42 (Q6P3S6), the ortholog in the same subfamily PTHR46432:SF1; it has no review yet.
