  summary: 'Create review: Gfat1 (Q7PLC7, Gfat1-PA)'
  details: |
    De novo review of the full-length Gfat1-PA product (694 aa), done independently of the ProtNLM2 predictions. All 17 GOA rows reviewed. GO:0004360 GFAT activity (IBA/IDA/IEA/IMP) and GO:0006048 UDP-GlcNAc biosynthesis (IBA/IEA/ISS) accepted as core, grounded in PTHR10937:SF0 membership, PAINT node PTN000101302 (fly Gfat1 is a seed), the fly heterologous-expression activity data (PMID:11716769) and zep/Gfat1 genetics with Gfat1/Gfat2 cross-rescue (PMID:35159258). Cytoplasm refined to cytosol. Carbohydrate metabolic process, carbohydrate derivative metabolic/biosynthetic process and UDP-GlcNAc metabolic process MODIFY to GO:0006048. Carbohydrate binding MODIFY to GO:0097367. Glutamine metabolism, F6P metabolism and carbohydrate derivative binding kept as non-core. Cuticle and tracheal phenotypes not annotated as process participation. Falcon and perplexity deep research both failed (authentication/quota); this is recorded in the notes.
