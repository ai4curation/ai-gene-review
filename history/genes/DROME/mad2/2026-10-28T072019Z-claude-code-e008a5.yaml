  summary: 'Create review: mad2'
  details: |
    De novo review of Drosophila mad2 (Q9VRQ2, FBgn0035640). All 33 GOA rows were reviewed against cached literature, with full text read for PMID:19273613, 31913420, 18562695, 17576797, 20421417, 27159240, 26714316 and 24335260. Kinetochore and spindle assembly checkpoint rows were accepted. Regulation-of-SAC, regulation of mitotic cell cycle and the ARBA negative regulation of mitotic cell cycle phase transition rows were modified to GO:0007094. Indirect phenotypes (spindle assembly, chromosome organization, male GSC asymmetric division) were marked as over-annotated, and bare protein binding was removed. A NEW IC ubiquitin ligase inhibitor activity MF was added, based on Cdc20 binding and conserved MCC function. No deep-research provider was available, so a manual synthesis was written.
