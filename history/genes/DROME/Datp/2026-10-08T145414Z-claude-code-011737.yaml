  summary: New review of Drosophila Datp (Apf/CG31713, Q4V6M1) asymmetrical Ap4A hydrolase
  details: |
    Created review for Datp (current FlyBase symbol for Apf/CG31713, FBgn0287788) using Q4V6M1, the UniProt entry with the FlyBase xref (A0ACM8PZ70 is a sequence-identical new TrEMBL entry carrying FlyBase's ISS/ND rows). Reviewed 6 GOA rows: GO:0004081 IBA ACCEPT; GO:0006167 and GO:0006754 IBA MARK_AS_OVER_ANNOTATED (product-based, seeded only from ndx-4; consistent with genes/worm/ndx-4); GO:0008796 IEA ACCEPT; GO:0016787 IEA MODIFY to GO:0004081; GO:0046872 IEA KEEP_AS_NON_CORE. Proposed NEW GO:0015967 diadenosine tetraphosphate catabolic process (IDA) and GO:0005634 nucleus (IDA, Apf-EGFP) from PMID:17344088 (abstract only). Cached PMID:17344088, 2558922, 4066685 (and 3929079, not cited). OpenScientist deep research incorporated.
