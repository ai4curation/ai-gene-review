  details: |
    Grounded the gene in PANTHER PTHR12311:SF7 (a single subfamily holding yeast Esf2 and human ABT1) and PAINT node PTN000267771, and added a new pairwise alignment (compare_sequences_rereview.py, RESULTS-rereview.md) showing the RRM and family core are intact. Q8IRM9 is the canonical, complete product. The three early pre-rRNA endonucleolytic-cleavage IBA rows went from ACCEPT to KEEP_AS_NON_CORE, because Esf2 is a processome assembly factor and not the nuclease. RNA binding (IBA/IEA), nucleolus and SSU-processome assembly stay core. Nucleic acid binding is MODIFY to RNA binding. Defense response to bacterium (IMP, PMID:18245331) went from UNDECIDED to KEEP_AS_NON_CORE after reading the PMC full text (a single PBac insertion, defense class). Added PMID:16772403 and reference_reviews, rewrote the description, and appended to the notes.
