  summary: 'Create review: Tl'
  details: |
    Reviewed all 104 GOA annotations for Drosophila Toll (P08953): 73 ACCEPT, 21 KEEP_AS_NON_CORE, 4 MODIFY, 3 REMOVE, 1 MARK_AS_OVER_ANNOTATED, 2 UNDECIDED. Dorsoventral axis specification and antifungal/Gram-positive defence are both treated as core, via the same Spatzle cytokine receptor activity (GO:0004896) in the Toll signaling pathway (GO:0008063). No PRR (GO:0038187) or toll-like receptor signaling (GO:0002224) terms are attached, which is correct because Toll binds the endogenous cytokine Spatzle and not microbial molecules. The protein binding rows with MyD88 were modified to TIR domain binding and the Spatzle row to cytokine binding; the Tehao and Weckle rows were removed. Virion binding and detection of virus (PMID:31088910) are UNDECIDED because two other studies used Toll as a non-binding control for VSV and RVFV. Developmental roles in heart, muscle, synaptic targeting, cell competition, wound response and growth control are kept as non-core. Falcon deep research integrated. just validate passes.
