  summary: Full re-review of Gfat1-PF (A8Y5A1) independent of ProtNLM2 predictions
  details: |
    Re-verified that A8Y5A1 is the 434-aa Gfat1-PF isoform (exact suffix of Q7PLC7 from residue 261), which lacks the GATase domain and the Cys2 nucleophile but keeps both SIS domains. Rewrote the description to describe the gene first. Kept REMOVE of GO:0004360 for this accession only and added gene-level evidence (PMID:11716769, PMID:32615907) and PANTHER/PAINT grounding (SF0, PTN000101302). Changed GO:0030246 carbohydrate binding from ACCEPT to MODIFY, replacing it with GO:0097367. Kept the four process rows UNDECIDED. Added reference reviews, suggested questions and suggested experiments. Next relative: canonical Q7PLC7 (no review).
