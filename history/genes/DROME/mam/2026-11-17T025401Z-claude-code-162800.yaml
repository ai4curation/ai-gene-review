  details: |
    Follow-up to the tree re-read of 2026-11-11 (record 2026-11-11T165438Z-claude-code-ca2efc), after review of the pull request.

    - GO:0000775 and GO:0034080 (both REMOVE): the re-read had removed WRONG_ORTHOLOG_OR_PARALOG from the GO:0000775 row because the PANTHER 19.0 tree places fission yeast mis18 as a one-to-one ortholog of mam. The two rows share one propagation_review block, so the removal also reached GO:0034080, although the script had refused to edit that row. The failure mode is put back on both. The review's argument is that the family placement is itself the artefact (mam has no Mis18 domain; the family alignment with mis18 covers 10% of mam at 8% identity), and the tree's ortholog call is read from that placement, so it cannot be the ground for retiring the mode.
    - Both reasons now say this in the same words: mam lies inside the clade the seeds span and both seeds are placed as its orthologs, and why that does not answer the objection.
    - GO:0034080 now carries the corrected reason and quotes its own extract row (sentences 1, 2, 4, 5 and 6 of the summary). GO:0000775 quotes sentence 4 as well, which says that mam is inside the seed clade.

    Verdicts are unchanged. The review validates.
