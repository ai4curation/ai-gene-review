  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (mam-phylo.yaml, from `just phylo DROME mam`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0000775 (REMOVE): the reason made a claim the tree contradicts (propagation_review failure mode WRONG_ORTHOLOG_OR_PARALOG (the seeds are the wrong orthologs or paralogs of mam): by the tree the two seeds are 1 one-to-one ortholog and 1 ortholog across later duplications of mam, with 0 duplications on the path from the node to mam and mam inside the seed clade.). The reason was rewritten to correct it; the rest of its argument is kept. The script also changed the row's failure modes as the reading proposed (removed WRONG_ORTHOLOG_OR_PARALOG). Through a YAML block the two rows share, the removal also reached the GO:0034080 row, whose own edit the script had refused. That change of failure modes was undone by hand on 2026-11-16; see the later record.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
