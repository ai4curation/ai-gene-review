  summary: 'Create review: CG32086 (Q8IQG0, CG32086-RA)'
  details: |
    De novo review of the canonical CG32086-RA product (Q8IQG0), independent of ProtNLM2 predictions. Placed in PANTHER PTHR12086:SF12 (EFHB). Of the five IBA rows: axonemal microtubule ACCEPT (deep PAINT node PTN000250051, core, inferred); flagellated sperm motility KEEP_AS_NON_CORE (sole seed is mouse Efhb cryo-EM localization); calcium ion sensor activity REMOVE (new alignment shows the fly protein lost the coordinating residues of human EFHB's single canonical Ca-binding loop); regulation of SOCE and of calcineurin-NFAT signaling MARK_AS_OVER_ANNOTATED (single human cell-line seed with a Ca-dependent mechanism). Added a GFG/EF-hand loop analysis in CG32086__Q8IQG0-bioinformatics/ and a notes file. No experimental function is established for the fly protein.
