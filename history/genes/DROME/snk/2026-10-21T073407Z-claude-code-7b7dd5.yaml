  summary: New full review of snk (Snake), the characterised SF147 relative of CG43124
  details: |
    Created the snk review from scratch (falcon deep research failed with a 403 authentication error; perplexity-lite fallback also failed; review built from cached primary literature). All 22 GOA rows reviewed. Serine-type endopeptidase activity, zymogen activation, Toll receptor ligand protein activation cascade and dorsal/ventral axis specification accepted on biochemical (PMID:11296245, PMID:20638387, PMID:20605458) and genetic evidence. Endopeptidase activity, proteolysis and protein processing refined (MODIFY) to serine-type endopeptidase activity / zymogen activation. Extracellular region rows refined to perivitelline space (GO:0098595), as carried by gd, ea, ndl and Spn27A. Innate immune response IBA marked over-annotated: snk is in PANTHER 19.0 PTHR24260:SF147, outside every donor subfamily of PTN000667087, and has no immune evidence. Added snk-bioinformatics/ (PANTHER placement and catalytic triad check) and snk-notes.md. Independent of ProtNLM2 predictions; snk-specific substrate and patterning functions flagged as not transferable to other SF147 members.
