  summary: 'Create review: Cyp301a1'
  details: |
    New review of Drosophila Cyp301a1 (Q9V6D6), an insect mitochondrial-clan cytochrome P450 of unknown substrate. All 6 GOA rows reviewed: the InterPro monooxygenase and paired-donor oxidoreductase rows and the SubCell mitochondrial membrane row were accepted at family level (a GO:0016713 refinement was withheld because no biochemistry exists and the heme motif carries an atypical conserved Tyr); iron and heme binding were kept as non-core; the FlyBase IMP tergite morphogenesis row from Sztal et al. 2012 (PMID:22574182, full text read) was kept as non-core because the mechanism linking the P450 to adult abdominal closure is unknown. No NEW terms were added. A manual literature summary and notes were written since no deep-research provider was available.
