  summary: 'Create review: Blm'
  details: |
    New review of Drosophila Blm (Q9VGI8; mus309) covering all 49 GOA rows. Core functions are 3'-5' DNA helicase and DNA-dependent ATPase activity driving SDSA D-loop disassembly, four-way junction branch migration with Top3alpha for dHJ dissolution in the RTR complex, and strand annealing linked to suppression of homeologous SSA. Generic DNA repair, DSB repair, DNA damage response and recombination rows were modified to HR-mediated DSB repair; NHEJ (Ku RNAi epistasis), DNA synthesis involved in repair and IBA cytoplasm were marked over-annotated. A probable FlyBase source defect was recorded for the nucleus IDA from PMID:31772289, which images transfected human BLM. Literature synthesis was done manually (no deep-research provider).
