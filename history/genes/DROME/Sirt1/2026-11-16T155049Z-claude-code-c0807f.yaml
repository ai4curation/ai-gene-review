  summary: 'Create review: Sirt1 (NAD-dependent deacetylase; yeast-only IBAs removed
    or flagged)'
  details: |
    De-novo review of all 51 GOA rows for Drosophila Sirt1/Sir2 (Q9VK34): 31 ACCEPT, 15 KEEP_AS_NON_CORE, 2 MARK_AS_OVER_ANNOTATED, 3 REMOVE. Fly Sirt1 is the 1:1 ortholog of human SIRT1 below PTN000872222 (Eukaryota, SF9) and PTN000872223 (Metazoa), no PAINT losses (Sirt1-bioinformatics/RESULTS.md). Non-duplicative IBA verdicts: H3K9, H3K14 and H4K16 NAD-dependent deacetylase ACCEPT (purified dSir2 deacetylates these and other sites in vitro, PMID:12571358 full text on PMC, PMID:11281647; in vivo specificity broad, PMID:25578876); transcription corepressor activity ACCEPT (binds Hairy/Dpn/E(spl), NAD-dependent repression in vitro); negative regulation of DNA-templated transcription ACCEPT; DNA damage response KEEP_AS_NON_CORE (UV-induced apoptosis, H3K56ac); subtelomeric heterochromatin formation REMOVE (yeast-only seeds; fly Sir2 not needed for telomeric silencing, PMID:12086602) together with the derived telomeric-region IEA; rDNA heterochromatin and nuclear inner membrane MARK_AS_OVER_ANNOTATED (single human seed, no fly data). The Burnett 2011 NOT determination of adult lifespan row is REMOVEd as over-reaching (the authors say their data do not rule out a role); the positive lifespan IMP is non-core. FlyBase text VERIFIED (all claims traced). UniProt FUNCTION DISPUTED with three source defects: inverted PEV direction (CONFIRMED), 'silencing of the polycomb group proteins' (CONFIRMED), maternal segmentation and sex determination from the ex10 allele (OUTDATED, PROBABLE; PMID:12663533). Descriptions sidecar scored COMPLETE. just validate passes.
