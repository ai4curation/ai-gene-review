  summary: 'Create review: Nepl15'
  details: |
    De-novo review of Nepl15 (Q9VCU1), the nearest experimentally studied SF238 paralog of the benchmark gene Nepl19, independent of ProtNLM2 predictions. Re-seeded on the reference-proteome accession Q9VCU1 (the symbol first resolved to the cDNA entry Q95U74). Falcon deep research failed (403 auth; perplexity-lite fallback timed out), so the review rests on full-text PMID:33483521, PMID:22952997, PMID:34189422 and the PMID:42523199 preprint abstract. A new local alignment (Nepl15-bioinformatics/RESULTS.md) confirms the loss of the zinc ligands H584 and E647 (now R) and of catalytic E585 (now Q), and finds no membrane anchor after the signal peptide. Plasma membrane IBA/IEA were modified to extracellular region, proteolysis IEA was removed, NOT peptidase IKR x2 were accepted, and compound eye morphogenesis IMP (RNAi-only) was kept as non-core. No NEW process terms: the storage phenotypes are genetic necessity and sufficiency without a mechanism.
