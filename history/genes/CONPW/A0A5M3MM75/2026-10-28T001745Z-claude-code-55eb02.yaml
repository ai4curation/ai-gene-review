  details: |
    Created the review for UniProtKB:A0A5M3MM75 (CONPUDRAFT_105298). Removed the IEA GO:0004451 isocitrate lyase activity row as a demonstrably wrong PROSITE-ProRule PRU10119 / EC mapping, kept GO:0003824 catalytic activity, and filed source defects against UniProt (name and EC) and the PROSITE rule. Added a reproducible sequence-marker analysis under A0A5M3MM75-bioinformatics comparing the protein with characterised oxaloacetases, dimethylmalate lyase, methylisocitrate lyase and true isocitrate lyases. No EC is asserted: the protein is in the OAH branch but its substrate is not established.
