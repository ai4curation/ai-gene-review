  details: |
    Aligned O27134 to membrane MtrA (mtrA1 60.6% identity over residues 1-180; no counterpart for the C-terminal 58 residues and TM 219-237). The HAMAP-derived TRANSMEM 102-118 has mean KD 0.49 and aligns to non-membrane mtrA1 99-115. His87/Glu57 (=His84/Glu54) conserved. Removed plasma membrane, sodium ion transport, Mtr methyltransferase activity and sodium ion transmembrane transport rows; marked one-carbon metabolism and methanogenesis over-annotated; cobalt ion binding modified to cobalamin binding; added cytoplasm (IC). Source defects to UniProt (HAMAP MF_01093) and InterPro (IPR005778). Function recorded as an open knowledge gap.
