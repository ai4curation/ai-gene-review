  details: |
    New review of P0A149. GOA has no rows. Proposed NEW ATP hydrolysis activity (ISO from P. aeruginosa ParA, PMID:25139949, with conserved Walker A box per parA-bioinformatics/RESULTS.md) and chromosome segregation (IMP, PMID:11832517). Added a PGAP prediction review: NCBI's SPARCLE architecture 11439703 GO (ATP binding, ATP hydrolysis activity) is correct (COR) and fills the GOA gap. Added ortholog comparison script parA-bioinformatics/compare_orthologs.py covering ParA and ParB.
