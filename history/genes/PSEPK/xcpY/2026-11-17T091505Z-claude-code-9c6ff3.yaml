  details: |
    Fifth review round on PR 6489. The NEW plasma-membrane row and the core function both cite the GspL periplasmic domain from the cached record, and the module descriptor already recorded that the current InterPro release has withdrawn that match for this protein. The note is now here too, where the citation is: the protein matches only the ATPase nucleotide-binding superfamily IPR043129 today, while the P. aeruginosa GspL P25060 still carries IPR025691 with Pfam PF12693 and NCBIfam TIGR01709, checked against the InterPro API on 2026-11-17. The GspL identity is unaffected, resting on the xcp locus and on the ortholog, and the withdrawal looks like a model or threshold change; it is recorded so that a refresh of this record reads as a signature change rather than a new error. No action, term or quote changed.
