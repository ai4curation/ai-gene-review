  summary: 'Retrospective audit corrections: sucD'
  details: |
    Corrections after a retrospective audit (2026-11-12) of the succinyl-CoA synthetase reviews (eleven subunit reviews, the families PTHR11117 and PTHR11815, and the tca_cycle module), followed by a cross-file consistency pass. This record supersedes the reading in the 2026-11-11 records where they differ. Action changes, reversals of the 2026-11-11 record: GO:0004776 succinate-CoA ligase (GDP-forming) activity (IEA) KEEP_AS_NON_CORE -> ACCEPT, for the reason given for SucC. GO:0042709 succinate-CoA ligase complex (IEA) TOO_GENERAL -> ACCEPT, because the generic complex is the term that covers an enzyme forming ATP or GTP and the partner subunit already accepted it. GO:0003824 catalytic activity (IEA) MARK_AS_OVER_ANNOTATED -> TOO_GENERAL; the reason is now worded the same way in all eleven subunit reviews (true but uninformative, entailed by the accepted specific activity). core_functions now has two entries, GO:0004775 and GO:0004776, as contributes_to_molecular_function, with in_complex GO:0042709 (was GO:0009361) and location GO:0005829 cytosol. The location is an inference from the soluble SucC/SucD complex and the absence of signal or transmembrane features; SucD has no cytosol row, so validation gives two advisory warnings that the location is not among the annotations. ARBA-only CATALYTIC ACTIVITY quotes were replaced by the HAMAP-rule FUNCTION statement. A notes file was created. The tracked rendered page was regenerated. Validated with just validate PSEPK sucD.
