  summary: Review all existing PSEPK arginine annotations against primary and curated
    evidence
  details: |
    PP_0372/Q88QW2 must be distinguished from PP_4481/astC. Full PMID31451546 Table1 explicitly maps its argD insertion to PP_4481; retained prototrophy does not demonstrate absent activity and does not prove PP_0372 compensation. PMID35254100 identifies astC as the AST-pathway succinylornithine transaminase. PP_0372 acetylornithine activity and the pre-existing NEW biosynthetic annotation remain explicit SF79/classIII inferences, supported by comparative E. coli ArgD enzymology (PMID10074354). No new BP is proposed. PLP binding is supported by a curated RuleBase family statement and InterPro classification rather than the ARBA cofactor line. Comparative ArgD/AstC dimer structures support homomerization as an inference, not direct KT2440 measurement. Free-ornithine activity remains unresolved; family preference for acylated substrate is not proof of its absence. Provider claims of exclusive anabolic/catabolic separation or exact measured target kinetics are not adopted. Preserved all imported annotation payloads; added no rows. Reused existing research, documented FEBA source failure, replaced label-only support, backfilled record sections, validated terms and rendered HTML.
