  summary: 'Create review: PP_3198 (Q88I04), FdeD-like Rieske [2Fe-2S] ferredoxin
    component'
  details: |
    De-novo review of Q88I04 in the ppu00946 batch. GO:0051537 2 iron, 2 sulfur cluster binding ACCEPT (structurally supported by the Rieske domain); GO:0009812 flavonoid metabolic process added NEW by ISS with supporting_entities UniProtKB:D8J0W8 (45.6% identity by the committed alignment). No reaction-level molecular function is asserted: the donor is itself uncharacterized and the only evidence for the R13074 hydroxylation step is a KEGG KO-to-reaction arrow, so the review states that this supports pathway placement but not a defined electron-transfer reaction. This record was scaffolded retrospectively by the PR shepherd. The history/ mechanism (scripts/new_history.py, docs/history.md, src/ai_gene_review/schema/history.yaml) was added to main in 38a025114e on 2026-09-03 and reached this branch with the 2026-09-13 merge of main, after the curation described here; the session is therefore reconstructed from the branch contents and the formal review rounds on PR #2832 rather than written during curation.
