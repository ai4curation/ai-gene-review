  details: |
    De-novo review of Q88HZ7 in the ppu00946 batch. The uninformative GOA IEA GO:0003824 catalytic activity is MODIFY, replaced by GO:0016831 carboxy-lyase activity (NEW, ISS), which is what the fumarylacetoacetate-hydrolase family fold and the predicted R13078 beta-keto acid decarboxylation support; GO:0009812 flavonoid metabolic process added NEW by ISS. The second predicted late reaction is left in proposed_new_terms rather than asserted. This record was scaffolded retrospectively by the PR shepherd. The history/ mechanism (scripts/new_history.py, docs/history.md, src/ai_gene_review/schema/history.yaml) was added to main in 38a025114e on 2026-09-03 and reached this branch with the 2026-09-13 merge of main, after the curation described here; the session is therefore reconstructed from the branch contents and the formal review rounds on PR #2832 rather than written during curation.
