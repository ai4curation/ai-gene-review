  summary: Record OpenScientist structural analysis of the AlgJ acetyl-relay step
  details: |
    Ran an OpenScientist deep-research job (kgap-algj-acetyl-relay-direction) on the knowledge gap covering the substrate and direction of the AlgJ step in the periplasmic alginate acetylation relay. The enzymology and orientation are settled, the direction is not.

    Measured directly from PDB 4O8V, the SGNH triad is complete and geometrically competent, with Ser288 OG 2.56 Angstrom from His192 NE2 and His192 ND1 2.74 Angstrom from Asp190 OD1, plus a modelled oxyanion position accepting three donors from Tyr289 and Thr287. Asp190, His192, Thr287, Ser288, Tyr289 and Ser290 were all confirmed in the local Q88ND3 record, where 190, 192 and 288 are the annotated active-site residues, and the catalytic domain faces the periplasm on the basis of a single N-terminal hydrophobic segment and a positive-inside N-terminus, consistent with published fractionation work.

    The informative new argument is electrostatic. The net formal charge within 12 Angstrom of the catalytic serine is minus seven in AlgJ, against minus one to plus one for every SGNH enzyme in the comparison panel with an experimentally demonstrated polymer acceptor, AlgX from the same operon included. That supplies a structural explanation for the already measured binding asymmetry, in which AlgJ shows weak or no detectable polymer binding while AlgX binds polymannuronic acid specifically. Status set to NARROWING on that basis.

    What the structure cannot settle is recorded as plainly as the run states it. An acidic active-site surface and the absence of a carbohydrate-binding module argue against AlgJ acetylating the alginate chain at its own catalytic site, but they are not evidence that an acetyl group passes from AlgJ to AlgX; no structure places AlgJ in contact with AlgI, AlgF or AlgX, and no published assay measures transfer between any two of them.

    One premise of the hypothesis I submitted was wrong, and the correction belongs with the run rather than with the review. There are no Pseudomonas aeruginosa AlgJ structures: 4O8V is the KT2440 protein itself, covering residues 75-370 of Q88ND3, which the local record's own PDB cross-reference confirms. So this entry has structural evidence of a grade usually reserved for the organism under review, while the P. aeruginosa side has only a predicted model. The run suggests review text citing P. aeruginosa AlgJ structures needs correcting; this review never asserted that, referring to P. aeruginosa only for deletion and complementation genetics, so no change was needed. No annotation action was taken.
