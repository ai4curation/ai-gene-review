  summary: Re-review RetS as a kinase-dead GacS antagonist; status COMPLETE
  details: |
    Removed the electronic kinase MF rows (GO:0000155, GO:0004673, GO:0016772): the P. aeruginosa ortholog cannot autophosphorylate (PMID:29880803) and a reproducible motif scan (retS-bioinformatics/) shows KT2440 RetS lacks the HATPase G1/G2 boxes that both GacS kinases keep. Removed GO:0071474 (TreeGrafter graft onto a Nematostella leaf inside a eukaryote-only PTHR45339 clade, PTN000703787). Added NEW GO:0004721 phosphoprotein phosphatase activity and GO:0070298 negative regulation of phosphorelay signal transduction system (ISS), kept GO:0033103 acts_upstream_of_negative_effect (IMP, PMID:36748579) and plasma membrane. Replaced non-verbatim quotes; pruned its local quote baseline entry.
