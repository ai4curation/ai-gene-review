  summary: Re-review ilvA-I metabolic scope and comparative evidence
  details: "All seven annotations were re-reviewed with the existing OpenScientist report and primary comparative\
    \ biochemistry. L-threonine catabolism is ACCEPT: the enzyme breaks down threonine even though its carbon skeleton\
    \ feeds isoleucine biosynthesis. Broad amino-acid metabolism and required PLP binding are also core. Secondary\
    \ L-serine ammonia-lyase activity is retained as inferred non-core capacity, supported by recombinant M. smegmatis\
    \ TD (PMID:30226377) and Salmonella IlvA assays (PMID:30327426), without pretending these are KT2440 measurements.\
    \ Physiological serine catabolism is UNDECIDED for each paralog because actual target flux remains unknown.\
    \ The report explicitly says KT2440 serine-side-reaction physiology is untested. Its 75% identity does not date\
    \ the duplication, and the exact E. coli 23-angstrom allosteric relay was not measured in either target. The\
    \ net reaction follows RHEA:22108 (threonine to 2-oxobutanoate and ammonium), without the report's extraneous\
    \ water product. Serine generates 2-aminoacrylate whereas threonine generates 2-aminocrotonate; the primary\
    \ paper explicitly distinguishes them. Original source metadata preserved. Validation is recorded in projects/TREEGRAFTER/rereview-2026-09-20/metabolic-scope.yaml.\n\
    \ Gene validation passed; all original source fields and rows are preserved."
