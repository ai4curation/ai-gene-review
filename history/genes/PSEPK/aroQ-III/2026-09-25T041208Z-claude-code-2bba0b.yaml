  summary: Merge duplicate aroQ folder into aroQ-III (same protein Q88IJ6)
  details: |
    genes/PSEPK/aroQ and genes/PSEPK/aroQ-III were two separate review folders for the same protein, Q88IJ6 / PP_3003; the duplication was surfaced by the TreeGrafter rejection re-review (projects/TREEGRAFTER/rereview-2026-09-24/batch-03.yaml).

    Kept aroQ-III as canonical: UniProt gives GN Name=aroQ-III for Q88IJ6 (EMBL AAN68611.1), and the KT2440 paralog series is aroQ1 (PP_0560), aroQ2 (PP_2407), aroQ-III (PP_3003), so a bare aroQ symbol was both non-standard and ambiguous.

    Merged the richer aroQ content into aroQ-III: the mechanistic description (type-II trans-dehydration via enolate intermediate, flavodoxin-like fold, homododecamer), the detailed annotation summaries and reasons for GO:0003855, GO:0009423 and GO:0019631, the core_functions entry with its GO_REF:0000120 supporting_text, and the PMID:12534463 reference_review. Retained from aroQ-III: the paralog-ambiguity framing, PMID:41029715, the suggested question, the newer GOA snapshot (20260616) and the reference titles matching the cached publications. Both folders recorded identical actions on all three annotations, so no adjudication changed.

    Moved aroQ-deep-research-falcon.md and its artifacts folder into aroQ-III with renamed paths and updated internal links; deleted genes/PSEPK/aroQ. Schema-validated with linkml-validate (GeneReview): No issues found.
