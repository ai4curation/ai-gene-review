  summary: Re-target GO:0097171 MODIFY to the NTR and cite the HldD-absence evidence
  details: |
    Review follow-up on PR #5909, findings 1, 2, 4 and 5. GO:0097171's replacement was GO:0009226, which is already the replacement for the generic GO:0005975 row in this same file, so the file's most generic and most specific BP rows proposed the identical target and all heptose information was lost from the process aspect. Re-targeted to proposed_replacement_terms [{id: NTR, label: ADP-D-glycero-beta-D-manno-heptose biosynthetic process}], matching the proposed_new_terms entry this review already carried. The reason no longer claims the ontology gap is unfiled, because this review files it.

    The evidence that flipped the row was asserted in prose and cited nowhere. Added supported_by entries for the committed PANTHER inventory row showing KT2440's only PTHR43103 member is Q88NN6 at SF5, for the project deep-research page quote 'is a genome-confirmed GAP in KT2440', and for a new reproducible analysis. Wrote genes/PSEPK/hldE/hldE-bioinformatics/ holding a script that runs the UniProt queries with P. aeruginosa as a positive control, its raw TSV output, a README and RESULTS.md; the script hardcodes no accession, count or conclusion and exits non-zero if any query fails, so a partial run cannot read as a negative.

    For the cytosol ACCEPT, the descent step is now explicit: the GO_REF:0000118 row's with/from is the TreeGrafter graft node PTN005327360, while the cytosol IBD sits at PTN000062036, and that ancestry follows from the TreeGrafter mechanism rather than from the committed PAINT slice, which records IBD rows but no tree topology. Recorded as the one unverified link. Added supported_by for the two E. coli proteomics papers behind the seed's IDA rows (PMID:15911532, PMID:18304323), both newly declared in references with reference_review notes stating that neither names HldE in the available text, so they support the experiment and not a target-specific peptide. Also aligned the wording with its own evidence: the L,D endpoint is never reached, so REMOVE would be sanctioned for this UniPathway mapping and MODIFY is stated as the more informative choice. Appended a dated notes entry and corrected the stale row ledger (rows 3 and 11) and action counts.
