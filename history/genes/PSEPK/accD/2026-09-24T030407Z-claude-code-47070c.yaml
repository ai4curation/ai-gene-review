  summary: 'Re-review rejected TreeGrafter annotations: accD'
  details: |
    TreeGrafter rejection re-review (audit file projects/TREEGRAFTER/rereview-2026-09-24/batch-02.yaml). GO:0009329 acetate CoA-transferase complex (IEA, GO_REF:0000118) changed from REMOVE to ACCEPT: the rejection read the term's label rather than its definition. GO defines GO:0009329 as the heterotetrameric alpha2beta2 complex that is part of acetyl-CoA carboxylase and makes malonyl-CoA; it is part_of GO:0009317, GO:0009317's definition names it as an ACC component, and its only child is the plastid accD subcomplex. The term is thus more informative than the GO:0009317 already carried. The misleading label, and a stale capable_of axiom to GO:0008775, are ontology defects worth reporting upstream.
