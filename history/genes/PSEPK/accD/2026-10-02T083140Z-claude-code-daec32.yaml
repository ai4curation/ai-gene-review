  summary: Cite the PTHR42995 PAINT IBD as reproducible in-repo grounding for GO:0009329
  details: |
    ai4c-reviewer round 9 found that part of the GO:0009329 question was answerable from the repo all along, correcting my claim that nothing in-repo could settle it. Two findings, both verified here before acting. First, cache/enums/goproteincontainingcomplexenum_e26f9f8ed709.csv lists GO:0009329 at line 289 alongside GO:0009317 (:280) and GO:0032283 (:662); that enum is a branch-reachability list of protein-containing complex descendants and core_functions.in_complex is bound to it, so just validate passing on this gene was already asserting that the term is current and is a CC complex term. Second and stronger, interpro/panther/PTHR42995/PTHR42995-paint.tsv line 2 holds an IBD for GO:0009329 on node PTN000523527, seeded by UniProtKB:P0A9Q5 and scoped to taxon:1224 Proteobacteria, dated 20230720. P0A9Q5 is E. coli K-12 accD, 'Acetyl-coenzyme A carboxylase carboxyl transferase subunit beta', PTHR42995:SF5 per PTHR42995-entries.csv line 264 - the same family and subfamily as PSEPK accD per its own UniProt DR lines 91-92. So a PAINT curator used this term for bacterial AccD, which is the definition reading expressed as curation, and it shows the TreeGrafter graft sits downstream of a human judgement rather than being a label-matching artefact. That line is now a supported_by entry on the row, with a matching references entry. It is the grounding that survives a reader with no network, where my live QuickGO verification is not reproducible from the repo. No GO term, action or qualifier changed.
