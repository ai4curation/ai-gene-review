- type: REVIEW
  outcome: changed
  summary: GO:0009329 definition reading verified against the live QuickGO API
  details: |
    The GO:0009329 ACCEPT on this gene rested on reading the term's definition rather than its label, and that reading was the PR's one open item: the reviewer was blocked from checking it in eight consecutive rounds for lack of network, and cache/go/terms.csv holds only the label, so nothing in-repo could settle it. Verified directly against the QuickGO ontology API on 2026-10-02. Every structural claim in the rationale holds: the term is not obsolete; aspect is cellular_component; the definition returns verbatim, 'A heterotetrameric enzyme complex made up of two alpha subunits and two beta subunits. Part of the acetyl-CoA carboxylase complex. Catalyzes the transfer of a carboxyl group to form malonyl-CoA', with xrefs PMID:2719476 and PMID:8423010; GO:0009317 is a current ancestry relation; GO:0032283 (the plastid accD subcomplex) is still the sole child; and the capable_of GO:0008775 relation is present, added 2015-06-18. So the label and that axiom do contradict the definition, which is the ontology defect worth reporting upstream, and the annotation itself is sound. Recorded in the row's reason and in the project page's label-vs-definition bullet. No GO term, action or qualifier changed.
