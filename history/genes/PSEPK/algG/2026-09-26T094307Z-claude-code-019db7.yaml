  details: 'Restored the full_text_unavailable flag(s) on PMID:12534463 that earlier commits in this PR
    removed. They were accurate and should never have been touched.


    The chain: a warming sweep in 6fc4a17ed resolved PMID:12534463 through openalex to a university repository
    landing page (research.wur.nl) and accepted its content as full text, flipping full_text_available
    to true. That content is the page header, the abstract as prose, and a RIS citation export repeating
    the abstract as N2 and AB - `grep -ciE ''cheZ|CheY|chemotaxis|pilin|aroB|dehydroquinate|shikimate''`
    over it returns 0, which is impossible for the KT2440 genome paper''s body. Two later commits then
    deleted twelve flags across ten reviews on the strength of that boolean.


    The paper''s full text is still not cached, so every one of those flags was substantively correct.
    The record is reverted to its origin/main state and all ten reviews are now byte-identical to main.


    Root cause fixed rather than only the data: is_usable_full_text now rejects `TY  - JOUR` and the Pure
    landing-page header. The old guards could not catch this shape - no paywall marker, longer than the
    abstract, and the citation metadata supplied enough characters to clear MIN_FULL_TEXT_CHARS. Bulk
    without body. Three regression tests built from the actual text, mutation-verified.


    Blast radius audited rather than assumed: all 19 publications this PR marked full_text_available:
    true were run through the guard, and only PMID_12534463 fails.

    '
