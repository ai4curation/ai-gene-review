  summary: Rewrite the GO:0008963 MODIFY reason after the stem-tolerance discriminator
    was withdrawn
  details: |
    Second review round on PR #6492. The MODIFY reason rested on the discriminator that this enzyme, unlike MurF, has no cross-species evidence of accepting both stem forms - which this project's own family review contradicts, since the enzyme class is stem-tolerant and does not select the third residue. The action is unchanged and still right, but for the correct reason: this row is an electronic mapping and nothing has been assayed on the KT2440 protein, whereas an experimental row recording the L-lysine reaction on an organism's own enzyme, as EcoCyc and EcoliWiki have for Escherichia coli, is retained as a non-core capability instead of corrected.
