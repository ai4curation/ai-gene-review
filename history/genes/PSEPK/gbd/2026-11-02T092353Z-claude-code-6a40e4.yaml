  summary: 'Resolve the last UNDECIDED row: 4HB dehydrogenase marked over-annotated'
  details: |
    Completed the review for the module bar by resolving the GO:0047577 row from UNDECIDED to MARK_AS_OVER_ANNOTATED. The substrate-specific claim for PP_2650 rests only on the EMBL submitter name and the EC mapping derived from it; the independent signatures establish a broad group III iron alcohol dehydrogenase, and the KT2440 work that looked for this chemistry tested other loci and failed to obtain direct 4-hydroxybutyrate activity in extracts. Not removed, because the enzyme class is right and the activity has not been excluded. The matching family-level judgement is recorded as a member_exception on the GO:0047577 scope in the PTHR11496 review, and the module treats PP_2650 only as a comparator.
