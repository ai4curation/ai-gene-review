  summary: Move the retired GO:0070680 proposal and core process to GO:0043039
  details: |
    Retired process term: GO:0070680 (asparaginyl-tRNAAsn biosynthesis via transamidation) is obsolete since GO release 2026-05-19. Its replaced_by, GO:0070981 L-asparagine biosynthetic process, names the wrong process for a route ending at Asn-tRNA(Asn), so the action NEW proposal (ISS, PMID:14729703) and core_functions[].directly_involved_in are moved to GO:0043039 (tRNA aminoacylation), the is_a parent GO:0070680 had before retirement and the root concept of the bacterial_aminoacyl_trna_charging module, which deliberately carries the transamidation route without a term id. GO:0043039 is absent from this gene's GOA (which has GO:0070681 for the Gln branch and GO:0006412) so the proposal stands and adds the Asn-branch evidence. Evidence and reasoning unchanged; a dated notes entry records the change.
