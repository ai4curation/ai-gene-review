  summary: 'Weekly compliance: strengthen pvdQ (Q88IU8) IEA-only review'
  details: |
    Weekly compliance pass on an IEA-only Pseudomonas putida KT2440 review (weighted compliance 51.61%). All four annotation actions are unchanged; the gap was that nothing was documented.

    The two MODIFY rows (GO:0016787 -> GO:0016811 and GO:0017000 -> GO:0002049) had a reason but no supported_by at all, so neither met the inference_support expectation for an IEA MODIFY. Both now cite the record and the deep research. The GO:0017000 reason additionally explains why the InterPro mapping misfires - IPR002692 is the whole peptidase S45 family, which also contains the penicillin G and cephalosporin acylases of semi-synthetic antibiotic manufacture, and even those hydrolyse rather than build the antibiotic - and states plainly that the pyoverdine replacement rests on orthology and the NCBIfam bifunctional-acylase model, since the deep-research report records that deacylation of a pyoverdine precursor by Q88IU8 has not been shown in KT2440.

    Added findings to all five references, which previously had findings: [] throughout, including four from the Bokhove 2010 abstract (Ntn-hydrolase fold, the large hydrophobic C12 pocket, the Ser-beta1 nucleophile from the covalent ester intermediate, and quorum quenching as signal degradation) and eight from the UniProt record. Added reference_review blocks for the UniProt record and the falcon report; extended the existing PMID:20080736 review note to record that the cached entry is abstract-only and that the work is on the P. aeruginosa protein.

    core_functions.supported_by previously carried bare reference ids with no quotes; both now have quoted support, and core_functions[0] gained the periplasmic-space location.

    Added a proposed new term for acyl-homoserine lactone acylase activity. EC 3.5.1.97 and RHEA:18937 exist and are assigned to this entry, but GO has no matching term: searching GO for homoserine lactone returns only GO:0061579 N-acyl homoserine lactone synthase activity, so the catabolic half of the AHL cycle is unrepresented, and the best available term GO:0016811 sits two levels above the reaction. Also checked and recorded in the GO:0016811 reason that GO:0102007 is a lactonohydrolase, a different reaction.

    Added four suggested questions and two hypothesis-bearing experiments, including whether the IPR002692 -> GO:0017000 mapping should be narrowed, and noting that KT2440 is not itself an AHL producer so the physiological relevance of its quorum-quenching activity is unresolved. The 2024 KT2440 hypervesiculation phenotype from the falcon report is recorded as a finding and a question but deliberately not annotated: it identifies no substrate and no mechanism links AHL or pyoverdine-precursor hydrolysis to envelope vesiculation.

    Weighted compliance 51.61% -> 96.46%. The four remaining gaps are supporting_text and reference_section_type on the two GO_REF findings, which have no quotable source text.
