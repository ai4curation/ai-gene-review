  summary: Resolve PP_1256 UNDECIDED terminal-dehydrogenase row
  details: |
    The GO:0047533 row moves from UNDECIDED to ACCEPT on three lines that were not previously assembled: the IPR044151 KGSADH subgroup signature, membership of PANTHER PTHR43353:SF3 together with A. baylyi KgsD whose NADP+ reaction UniProt curates from experiment, and the hydroxyproline-inducible NADP+-preferring KGSADH-III of A. brasilense. The two broad oxidoreductase IEA rows change from KEEP_AS_NON_CORE to MODIFY toward that specific term, matching the sibling ACIAD0131 review and the project rule that a correct but general term is MODIFY. The earlier NEW GO:0004030 row is dropped because it is an ancestor of the accepted term; the cofactor-neutral proposed term is kept in case PP_1256 proves to prefer NAD+. No process row is added, since synteny does not show which of PP_1256, PP_2585 and PP_3602 carries pathway flux. The GO cross-reference quote that restated an electronic annotation is replaced. Validation clean.
