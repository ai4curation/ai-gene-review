  summary: Make all three PP_1256 MODIFY rows point at the same replacement term
  details: |
    Second #6274 review round found a contradiction introduced by the previous fix: rows 1 and 2 still replaced the broad oxidoreductase terms with GO:0047533 and called it preferred, while row 3 moved GO:0047533 itself to the proposed cofactor-neutral term, so applying the actions in order landed on a term the same file rejects. All three rows now name the same replacement, {id: NTR, label: 2,5-dioxovalerate dehydrogenase [NAD(P)+] activity}, and their reasons were rewritten to match. Row 3 gains a sentence on why the proposed term is preferred to GO:0004030, the existing cofactor-neutral parent used by the sibling PP_3602 review: GO:0004030 drops the cofactor claim but also the substrate, and the substrate is the well-supported half here, so once the proposed term exists it should serve both paralogs. The claim that the characterized relative turns over faster with NAD+ was weakened to the Vmax figures, because the same UniProt record's kcat values point the other way.
