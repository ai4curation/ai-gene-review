  summary: Change PP_1256 GO:0047533 from ACCEPT to MODIFY toward the cofactor-neutral
    term
  details: |
    PR #6274 review observed that the row accepted a cofactor-specific term while its own reason called NADP+ specificity an inference. The new A. brasilense LhpG review settles the point: the characterized hydroxyproline-pathway isozyme carries both cofactor reactions, preferring NADP+ about 75-fold on Km but turning over faster with NAD+, its aldarate paralog prefers NAD+, and P. aeruginosa PA2217 is curated NAD+-first. GO splits the reaction into GO:0047533 and GO:0044104 with no substrate-specific neutral parent, so for an unassayed protein either child asserts more than the evidence. The row is now MODIFY with proposed_replacement_terms [{id: NTR}] pointing at the already-drafted neutral term, and the core function uses proposed_molecular_function instead of the NADP+ id. The substrate claim and the candidate status of PP_1256 are unchanged, and the asymmetry with the ACCEPT rows of the two assayed relatives is stated in the reason.
