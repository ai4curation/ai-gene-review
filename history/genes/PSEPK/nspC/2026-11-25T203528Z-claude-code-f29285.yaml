  summary: Record OpenScientist replication showing NspC pocket permissive and the
    carboxynorspermidine branch absent in KT2440
  details: |
    Ran an OpenScientist deep-research job (kgap-nspc-substrate-partition) deliberately set up as a replication test. The Bacteroides counterpart BT_0674, run earlier in this campaign, concluded that an identical decarboxylase pocket turns over both carboxyspermidine and carboxynorspermidine and that selectivity sits upstream at the partner dehydrogenase. That conclusion was written into this hypothesis and tested on the Pseudomonas pair. It replicates.

    Nine of the ten residues within 4.5 Angstrom of the product in the Campylobacter decarboxylase complex are identical in NspC, the single substitution sitting on the aliphatic wall away from either terminal-amine anchor, and the Bacteroides enzyme for which dual turnover was reported matches eight of the same ten. The method has resolution: three negative controls, two lysine decarboxylases and an ornithine decarboxylase, match only two or three of ten. So the pocket gives no basis for assigning one chain length over the other, and this is the second organism in which that holds.

    KT2440 then departs from the Bacteroides case one step earlier, in a way that answers the gap more firmly than pocket analysis could. The syntenic partner dehydrogenase is PP_2928, which the local record confirms carries the saccharopine-dehydrogenase Pfam pair, and its diamine pocket differs from the agmatine-preferring reference enzymes at four of thirteen positions, including loss of the asparagine making the closest contact to the agmatine guanidinium. Above that, diamine supply constrains the outcome: the run finds no 2,4-diaminobutyrate decarboxylase in this genome, so KT2440 has no biosynthetic source of 1,3-diaminopropane, while putrescine supply runs intact. Carboxyspermidine is therefore the substrate the cell can actually present, and the carboxynorspermidine branch is absent from the physiological picture rather than merely disfavoured. The run also reports both arms of the canonical aminopropyltransferase route missing from the genome, confirmed by an independent domain scan with returned positive controls, which makes NspC the only candidate spermidine-forming enzyme and means there is no flux partition to resolve because there is only one route.

    Status moved from OPEN to NARROWING. The biochemical and genetic validation named in the resolution is still what would confirm it; what changed is that the substrate question now has a genome-level answer and the pocket route is closed.

    Verified locally: the 365-residue length, the Tyr273 substitution position, the PF00278 and TIGR01047 assignments, and PP_2928's saccharopine-dehydrogenase Pfam pair from its own record in this repository, which is the same cross-check that held for the Bacteroides partner BT_4612. The contact mapping, negative-control matches, thirteen-position dehydrogenase comparison and genome-level absence calls were not independently recomputed, and the run reports one unresolved reference in its own validation. No annotation action was taken.
