  summary: Correct the PTN000159906 claim in the PSEPK nspC record
  details: |
    Correction to the earlier record in this folder (2026-11-02T085446Z-claude-code-431168.yaml), which is append-only and is left as written. That record said the GO:0008836 removal was backed by the PTHR43727 family review's NEEDS_PRUNING verdict on PAINT node PTN000159906. That is wrong for this gene. Q88IS0 has no IBA row at all: its GO:0008836 is a TreeGrafter IEA (GO_REF:0000118) grafted from PANTHER:PTN001691018, a node absent from interpro/panther/PTHR43727/PTHR43727-paint.tsv, so PAINT does not expose it and the family review does not assess it. PTN000159906's IBA rows reach Vibrio cholerae Q9KRL4 instead. The removal itself stands and is unchanged: it rests on the chemistry (the assayed orthologue has no activity with meso-diaminopimelate) and on Q88IS0 being classified in the NspC subfamily PTHR43727:SF1 rather than the LysA subfamily SF2; the family review's reasoning about SF1 divergence supports it, but is not the node this row came from. The annotation review's reason and the notes file now say this, and the family review's node assessment was corrected in the same change. Raised in review of PR #5911.
