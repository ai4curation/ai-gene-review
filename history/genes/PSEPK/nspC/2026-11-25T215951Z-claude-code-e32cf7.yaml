- type: EDIT
  outcome: changed
  summary: Withdraw the genome-absence argument from the nspC boundary after it failed
    a positive control
  details: |
    Correction to the nspC record made in this session. The earlier nspC entry recorded a genome-level argument as settling the substrate question: that no annotated 2,4-diaminobutyrate decarboxylase exists in KT2440, hence no 1,3-diaminopropane source, hence the carboxynorspermidine branch is absent from the physiological picture rather than merely disfavoured, hence no flux partition to resolve.

    That argument is withdrawn. A subsequent OpenScientist run on the partner dehydrogenase PP_2928 (kgap-pp2928-diamine-preference) put the same reasoning through a positive control and it failed. Vibrio cholerae demonstrably makes 1,3-diaminopropane and sym-norspermidine, yet the same database reports that decarboxylase as absent from that organism, and neither of the two main resources annotates the fused enzyme the primary literature credits with the step. A detection method that cannot see the step in an organism where the step is proven cannot be used to rule the step out in KT2440.

    The nspC boundary has been edited to state the retraction and its basis, and the provenance quote replaced, since the sentence previously cited no longer reflects the conclusion. What survives is narrower than first recorded: the decarboxylase pocket route is closed, because nine of ten product-contacting residues match the Campylobacter enzyme that handles both chain lengths and three negative controls match only two or three; putrescine supply runs intact; both arms of the canonical aminopropyltransferase route are missing, making NspC the only spermidine-forming candidate; but which diamine the pair actually uses remains open among putrescine, agmatine and 1,3-diaminopropane, and the gap status remains NARROWING on that narrower basis.

    No annotation action was taken on either gene, and the biochemical and genetic validation already named in the nspC resolution remains what would settle the substrate.
