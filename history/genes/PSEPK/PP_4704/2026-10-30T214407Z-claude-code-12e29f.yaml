  details: |
    New review of PP_4704 (Q88DW4), reached from KBase gene-annotate dashboard protein NZ_BCBP01000038.1_47 (99.1% identical over 978/978 aa; exact-match UniProt entries deleted, not part of a reference proteome). PP_4704 is the full-length reciprocal-best-hit orthologue of P. aeruginosa PA4735/EpaF (64.9% id), an AsmA-like protein absent from E. coli that is redundantly essential with YhdP, TamB and YdbH for growth and outer-membrane integrity (PMID:38305166). It is not an orthologue of any E. coli AsmA-like protein. GOA: GO:0005886 ACCEPT; GO:0090313 regulation of protein targeting to membrane REMOVE. NEW ISS: GO:0043165 outer membrane assembly, GO:0120010 intermembrane phospholipid transfer (indirect). KT2440 RB-TnSeq from BERDL (Fitness Browser 403): no phenotype in 300 experiments, consistent with redundancy.
