  details: |
    Type1 reductase membership, NADPH chemistry and pathway participation are supported by curated HAMAP plus comparative primary biochemistry (PMID17316682). The NAD-binding mapping is refined to NADP+ binding; NADP specificity does not prove zero affinity for NAD. PMID176312 assays P. putida A90 activities, not PP_0432 specifically. The OpenScientist claim that KT2440 lacks ArgA is false (PP_5185 and native auxotrophy); its claims of measured native paralog function/regulation are not adopted. Preserved all imported annotation payloads; added no rows. Reused existing research, documented FEBA source failure, replaced label-only support, backfilled record sections, validated terms and rendered HTML.
