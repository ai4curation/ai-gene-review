  summary: Add HolPase substrate-specificity fingerprint evidence
  details: |
    The GO:0004401 histidinol-phosphatase row was already accepted (on NCBIfam NF052360 membership, reciprocal best hits with PA0335 and conserved HAD catalytic residues). Those residues are shared with phosphoserine phosphatases, so this session adds specificity evidence. New PP_5147-bioinformatics/holpase_fingerprint.py (output FINGERPRINT.md): PP_5147 is 67.7% identical to PA0335, within the paper's 45.8%-identity cluster, and carries the full Kinateder et al. 2024 (PMID:38284491) HolPase fingerprint (D16, D18, Y47 required; Y57, T113 supporting). Of the SerB-type PSPase models only TIGR00338.1 discriminates (M. jannaschii SerB passes it; PP_5147 and PA0335 are below its noise cutoff); NF008350.0 does not, since SerB fails it too. SerB is too distant (24%) for its fingerprint residues to be read. Added sentences to the row's reason, three supported_by entries (two also on the core function), the PMID:38284491 and FINGERPRINT.md references, and a notes entry. No action changed.
