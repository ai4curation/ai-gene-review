  summary: Add HolPase substrate-specificity fingerprint evidence
  details: |
    The GO:0004401 histidinol-phosphatase row was accepted in an earlier session on NCBIfam NF052360 membership, reciprocal best hits with PA0335 and conserved HAD catalytic residues. Those residues are shared with phosphoserine phosphatases, so this session adds specificity evidence. New PP_5147-bioinformatics/holpase_fingerprint.py (output FINGERPRINT.md): PP_5147 carries the full Kinateder et al. 2024 (PMID:38284491) HolPase fingerprint (D16, D18, Y47 required; Y57, T113 supporting) and is below the noise cutoff of both SerB-type PSPase models (TIGR00338.1, NF008350.0), as PA0335 is; M. jannaschii SerB shows the reverse. Added one sentence to the row's reason, two supported_by entries (also on the core function), the PMID:38284491 and FINGERPRINT.md references, and a notes entry. No action changed.
