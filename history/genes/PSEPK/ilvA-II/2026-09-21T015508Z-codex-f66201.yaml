    \ and regulatory contributions are not measured. Report caveats include an undated duplication, an unmeasured\
    \ target-specific 23-angstrom allosteric relay and an incorrect net water product; 2-aminoacrylate is serine-derived,\
    \ whereas the threonine intermediate is 2-aminocrotonate. Original source metadata preserved. Validation is\
    \ recorded in projects/TREEGRAFTER/rereview-2026-09-20/metabolic-scope.yaml.\n Gene validation passed; all original\
    \ source fields and rows are preserved."
