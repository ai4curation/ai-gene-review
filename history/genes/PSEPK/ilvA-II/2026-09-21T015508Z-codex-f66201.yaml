  summary: Re-review ilvA-II metabolic scope and comparative evidence
  details: "All seven annotations were re-reviewed using the existing IlvA-I OpenScientist report, which substantively\
    \ compares both KT2440 paralogs; no duplicate report was requested. L-threonine catabolism, amino-acid metabolism\
    \ and PLP binding are ACCEPT for the conserved core reaction. Secondary serine molecular activity is retained\
    \ as comparative non-core capacity, supported by PMID:30226377 and PMID:30327426; physiological serine catabolism\
