  summary: 'Create review: bglX (Q88N13), periplasmic GH3 beta-glucosidase, scoped
    out of the flavonoid module'
  details: |
    De-novo review of Q88N13, curated alongside the ppu00946 batch because KEGG places a beta-glucosidase upstream of flavonoid aglycone release. All five GOA IEA annotations adjudicated: GO:0008422 beta-glucosidase activity and GO:0042597 periplasmic space ACCEPT (the latter supported by the signal peptide); GO:0004553, GO:0005975, and GO:0009251 KEEP_AS_NON_CORE as parent or peripheral terms. The in/out question for the module was open across four review rounds and is decided out: bglX is not part of the five-reaction A-ring-degradation core, and the decision is argued in the description, the notes file, and the batch page. The OpenScientist deep-research run for this gene DNS-failed; no research file was written, and the failure is recorded in bglX-notes.md rather than substituted for. This record was scaffolded retrospectively by the PR shepherd. The history/ mechanism (scripts/new_history.py, docs/history.md, src/ai_gene_review/schema/history.yaml) was added to main in 38a025114e on 2026-09-03 and reached this branch with the 2026-09-13 merge of main, after the curation described here; the session is therefore reconstructed from the branch contents and the formal review rounds on PR #2832 rather than written during curation.
