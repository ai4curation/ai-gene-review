  summary: 'Create review: PP_3206 (Q88HZ6), FdeJ-like epimerase/dehydratase-fold
    pathway component'
  details: |
    De-novo review of Q88HZ6 in the ppu00946 batch, and the batch's one substantive curation disagreement. Earlier commits asserted GO:0016822 (hydrolase activity, acting on carbon-carbon bonds) for the predicted R13076 step; it was withdrawn from existing_annotations, core_functions, and the module annoton after five review rounds. The reasons: PF01370/COG0451 is an NAD(P)-binding Rossmann epimerase/dehydratase fold, which is not EC 3.7 carbon-carbon hydrolase chemistry; the donor D8J0X4 is itself uncharacterized at 51.1% identity; the only evidence for the reaction is a KEGG KO-to-reaction arrow; and the file's own knowledge_gaps state that no FdeJ-family protein has been shown to catalyze R13076. What remains is the single NEW ISS annotation to GO:0009812 flavonoid metabolic process plus a core function with no MF, matching the calls made for PP_3198 and PP_3204 on the same evidence shape. The R13076 chemistry survives in proposed_new_terms with proposed_parent GO:0016822. This record was scaffolded retrospectively by the PR shepherd. The history/ mechanism (scripts/new_history.py, docs/history.md, src/ai_gene_review/schema/history.yaml) was added to main in 38a025114e on 2026-09-03 and reached this branch with the 2026-09-13 merge of main, after the curation described here; the session is therefore reconstructed from the branch contents and the formal review rounds on PR #2832 rather than written during curation.
