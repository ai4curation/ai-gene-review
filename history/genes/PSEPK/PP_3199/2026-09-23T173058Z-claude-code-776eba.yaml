  summary: 'Create review: PP_3199 (Q88I03), FdeE-like FAD-dependent monooxygenase'
  details: |
    De-novo review of Q88I03 in the ppu00946 batch. Three GOA IEA molecular functions accepted (GO:0004497 monooxygenase activity, GO:0016709 as the core function, GO:0071949 FAD binding); GO:0009812 flavonoid metabolic process added NEW by ISS with supporting_entities UniProtKB:D8J0W9. The orthology claim rests on a real reciprocal-best-hit search rather than a single pairwise alignment: PP_3199-bioinformatics/analyze_fdee_ortholog.py streams both complete proteomes (UP000000556 and organism_id:757424) from UniProt and runs mmseqs easy-search in both directions, with reciprocal_hits.tsv committed. D8J0W9 to Q88I03 is 40.4% with the next hit at 28.4%; Q88I03 to D8J0W9 is 40.6% with the next at 26.5%. The ~12-point margin in both directions is what makes 40.4% read as ortholog rather than as one of many FAD monooxygenases. This record was scaffolded retrospectively by the PR shepherd. The history/ mechanism (scripts/new_history.py, docs/history.md, src/ai_gene_review/schema/history.yaml) was added to main in 38a025114e on 2026-09-03 and reached this branch with the 2026-09-13 merge of main, after the curation described here; the session is therefore reconstructed from the branch contents and the formal review rounds on PR #2832 rather than written during curation.
