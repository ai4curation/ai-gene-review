  summary: Merge the duplicate pedI review of Q88JG9 into aldB-II
  details: |
    genes/PSEPK/pedI and genes/PSEPK/aldB-II both reviewed Q88JG9 (PP_2680). Kept aldB-II, the UniProt gene name, with pedI as an alias, and merged the pedI review's literature (PMID:18177365, PMID:23023748), notes, Falcon deep research and NEW aldehyde catabolic process row. Reconciled the two rows they disagreed on: GO:0004029 stays ACCEPT (pedI had MODIFY to GO:0008957 phenylacetaldehyde dehydrogenase, but the EC-mapping row's evidence and the unassayed KT2440 substrate do not reach that term; recorded as a suggested question) and GO:0004030 stays KEEP_AS_NON_CORE (pedI had MARK_AS_OVER_ANNOTATED), with a reason resting on the unestablished NAD(P) acceptor claim rather than on breadth, and GO:0016491 oxidoreductase activity moves from MARK_AS_OVER_ANNOTATED to TOO_GENERAL under the 2026-11-14 ruling. Description rewritten to combine both. pedI folder retired.
