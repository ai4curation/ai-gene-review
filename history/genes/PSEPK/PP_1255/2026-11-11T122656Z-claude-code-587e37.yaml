  summary: Soften PP_1255 oxidase rows from IDA to IGC with a stated attribution basis
  details: |
    PR #6274 review found that the two NEW rows asserted IDA on PMID:22833679 while nothing cited linked the characterized P. putida enzyme to accession Q88NF6: the cached abstract is abstract-only and names no locus tag, and the UniProt protein name is submitter-imported (ECO:0000313), which this project does not treat as evidence. The activity itself is directly measured, but its assignment to this locus is an inference from genomic context, so both rows now carry IGC and each reason states that basis explicitly. The description, the core-function description, the PMID:22833679 reference_review and the module's single-chain variant text were reworded to match. Verdicts and terms are unchanged.
