- type: EDIT
  outcome: changed
  summary: Drop a supporting_text that was never a quote from its cited reference
  details: 'The dropped text quoted UniProt''s FUNCTION line for Q88EW3. UniProt attributes that line
    to the KT2440 genome paper, so the reference_id is defensible, but the wording is UniProt''s and is
    not in the paper.


    Round 12 on #3102. This PR''s own force-re-fetch of PMID_12534463.md flipped it to full_text_available:
    true, making a full_text_unavailable flag on a core_functions[].supported_by[] entry false. Removing
    that flag then exposed that the entry''s supporting_text was never a quote from the cited paper: none
    of its distinctive phrases occurs in the now-complete cache. It had validated only because the flag
    suppressed the check.


    That is a scope limit of this PR worth recording. The rule ''a snippet must be checkable'' was implemented
    in validate_reference_finding_supporting_text, which covers references[].findings[]. The external
    reference validator still honours the flag on supported_by entries, and 914 snippets sit behind it
    repo-wide. Three of three checked here were unverifiable, but that is one PMID in one organism and
    is not a rate.


    The supporting_text is dropped; reference_id is kept, because the citation is legitimate and only
    the claim to be quoting it was not.

    '
