  summary: 'Create review: PP_3204 (Q88HZ8), FdeH-like cupin type-2 pathway component'
  details: |
    De-novo review of Q88HZ8 in the ppu00946 batch. A single NEW ISS annotation to GO:0009812 flavonoid metabolic process, and a core function with no molecular_function term: the cupin type-2 domain does not show whether the protein is catalytic, metal-binding, structural, or dispensable in the predicted R13075 A-ring cleavage, and knowledge_gaps leaves all four open. Review rounds corrected the support for the pathway claim twice: an earlier draft cited a report sentence establishing the absence of primary literature on PP_3204, which cannot support a positive claim; both sites now cite the report's KEGG K26182 (FdeH) assignment instead. The reference_review additionally names two overclaims in the deep-research report (Hsero_1010 described as experimentally characterized when the cited paper assayed FdeE and FdeC, and 55.0% identity against the committed alignment's 57.6%). This record was scaffolded retrospectively by the PR shepherd. The history/ mechanism (scripts/new_history.py, docs/history.md, src/ai_gene_review/schema/history.yaml) was added to main in 38a025114e on 2026-09-03 and reached this branch with the 2026-09-13 merge of main, after the curation described here; the session is therefore reconstructed from the branch contents and the formal review rounds on PR #2832 rather than written during curation.
