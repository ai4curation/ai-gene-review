  summary: Review galB reaction specificity and assay provenance
  details: |
    Recombinant GalB directly hydrates OMAenol/CHM to CHA, contains one zinc per subunit and forms a homohexamer (PMID:21219457, full publisher text read). This is not an amidase merely because the fold belongs to the MshB/LmbE group. GO:0047584 remains the established hydratase assignment; its current keto-OMA wording differs from the experimentally resolved enol immediate substrate and curated RHEA:17401. Neither that term nor fold identity establishes KCH-specific LigJ chemistry. Native galB insertion has downstream galD polarity, so its growth defect is not treated as a clean single-step assay; recombinant chemistry independently supports participation.

