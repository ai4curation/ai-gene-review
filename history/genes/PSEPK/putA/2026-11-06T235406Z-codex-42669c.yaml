  details: |
    GO:0009898 changes from ACCEPT to UNDECIDED. The frozen UniProt cross-reference traces it to TreeGrafter; no independent target subcellular-location statement is present, and the available tree did not resolve target placement. Family membrane-coupled chemistry establishes plausibility, but the PpPutA45 construct and KT2440/KT2442 promoter results do not locate full-length target catalysis. This differs from GsPutA's quinone-site geometry and BjPutA's retained PAINT inference plus characterized catalytic architecture. [PMID:18767154 "PpPutA45 was shown to bind a 14 base-pair DNA oligomer"] The before/after ledger retains the other three action refinements: sequence-specific regulatory DNA binding and specific catalytic ligand binding. Live QuickGO ancestry confirms NAD binding is not below anion binding, so its omission from that replacement list is intentional. Focused schema/reference validation, gene rendering, original-row preservation, and protected-source hashes are checked in the round1 audit. No source payloads or cached literature/provider artifacts are edited.
