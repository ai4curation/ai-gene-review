  summary: Complete source-specific aminoacyl-tRNA review of PSEPK serS
  details: |
    Reviewed all 8 existing annotations and the standalone description, references and core functions. Preserved the complete ordered machine annotation payloads and both raw source files. Replaced live-verified obsolete charging process IDs in reviewer metadata while retaining original IDs/labels; retained integral ATP/tRNA/cofactor properties. SerS is a cytoplasmic class II seryl-tRNA synthetase that charges tRNA(Ser) for translation and is predicted to charge tRNA(Sec), supplying the serine-bearing intermediate for selenocysteinyl-tRNA formation. HAMAP MF_00176 specifies both tRNA(Ser) and tRNA(Sec) reactions and a homodimer spanning the tRNA-binding surface. Current GO:0004828 explicitly includes the tRNA(Sec) reaction, so no extra MF proposal is required. Actual provider/fallback and fitness attempts failed, publication caching succeeded; manual source review and access limits are documented in gene notes. No new annotation row was added. Focused strict term/source validation, record-section backfill, HTML rendering and independent payload/raw preservation proof are recorded in .cache/module-audit-logs/aminoacyl-fourteen/.
