  summary: Remove wrong-reaction GO:0004321 (synthase/synthetase confusion) and record
    upstream defects
  details: |
    GO:0004321 fatty-acyl-CoA synthase activity is the fatty acid synthase reaction (EC 2.3.1.86); PP_2213 is an AMP-forming acyl-CoA synthetase (EC 6.2.1.-). The earlier review MODIFYed the row as too broad; it is a wrong-reaction term, now REMOVE. Traced via TreeGrafter graft PTN000644270 to the PTHR43605 root IBD PTN001944787, whose sole seed is an RGD IDA on rat Acsm4 (PMID:12709059), a paper that reports acyl-CoA synthetase (ligase) activity. Added source_defects for GO_CENTRAL (IBD, CONFIRMED) and RGD (seed IDA, PROBABLE; abstract only). GO:0006633 fatty acid biosynthetic process from the same node changed from KEEP_AS_NON_CORE to MARK_AS_OVER_ANNOTATED. Core-function support now quotes the PANTHER family line instead of a DR GO line. Added PMID:12709059 and the PTHR43605 PAINT file as references.
