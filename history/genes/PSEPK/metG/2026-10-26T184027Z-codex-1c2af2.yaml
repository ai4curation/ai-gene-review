  summary: Complete source-specific aminoacyl-tRNA review of PSEPK metG
  details: |
    Reviewed all 9 existing annotations and the standalone description, references and core functions. Preserved the complete ordered machine annotation payloads and both raw source files. Replaced live-verified obsolete charging process IDs in reviewer metadata while retaining original IDs/labels; retained integral ATP/tRNA/cofactor properties. MetG charges both elongator tRNA(Met) and initiator tRNA(fMet) with methionine, providing substrates for elongation and bacterial translation initiation. HAMAP MF_00098 supports methionylation of initiator and elongator tRNAs; the C-terminal tRNA-binding domain is independently classified. Formylation of initiator methionine is a subsequent reaction and is not catalysed by MetG. Actual provider/fallback and fitness attempts failed, publication caching succeeded; manual source review and access limits are documented in gene notes. No new annotation row was added. Focused strict term/source validation, record-section backfill, HTML rendering and independent payload/raw preservation proof are recorded in .cache/module-audit-logs/aminoacyl-fourteen/.
