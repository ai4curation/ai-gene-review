  summary: 'Correct the P0AEY3 framing: sibling propagation, not corroboration; cite
    the IBD'
  details: |
    ai4c-reviewer round 9 made a correctness point, not just a citation one. The reason had offered the E. coli ortholog P0AEY3 carrying GO:0046047 by IBA as support for softening the rejection, but interpro/panther/PTHR30522/PTHR30522-paint.tsv shows the GO:0046047 IBD on node PTN000775634 is seeded by UniProtKB:P96379 alone - M. tuberculosis MazG - at taxon:2, dated 20170228, while P0AEY3 seeds only the GO:0047429 molecular-function IBD on line 2. Both P0AEY3 and Q88MB7 are PTHR30522:SF0 (PTHR30522-entries.csv lines 3 and 8; mazG-uniprot.txt lines 87-88). So P0AEY3's row is a sibling propagation off the same family node, not independent corroboration, and CLAUDE.md is explicit that an IBA's weight lies in the node placement rather than in who appears beside it. The reason now cites the IBD itself as the phylogenetic grounding, names Mtb MazG as the descendant evidence, and states plainly that P0AEY3 is a sibling propagation; the IBD line is added as a verbatim supported_by entry with a matching references entry. The action stays MARK_AS_OVER_ANNOTATED and its primary ground (PMID:18353782, 'all eight canonical NTPs as substrates') is untouched.
