  summary: Review all existing PSEPK arginine annotations against primary and curated
    evidence
  details: |
    Acetyl recycling is a supported ArgJ family inference. Acetyl-CoA initiation is UNDECIDED: HAMAP assigns it, but PMID10931207 experimentally distinguishes mono- and bifunctional ArgJ proteins and PMID17347518 explicitly warns against blanket bifunctionality transfers. Native argA auxotrophy limits physiological replacement, not residual ArgJ catalytic activity. Nonauxotrophy of argJ does not prove inactivity or establish which backup pathway operates. Preserved all imported annotation payloads; added no rows. Reused existing research, documented FEBA source failure, replaced label-only support, backfilled record sections, validated terms and rendered HTML.
