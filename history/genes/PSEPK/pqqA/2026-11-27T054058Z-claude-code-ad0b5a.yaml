  summary: 'Weekly compliance: document findings in pqqA (Q88QV4) review'
  details: |
    Weekly compliance pass on an IEA-only Pseudomonas putida KT2440 review (weighted compliance 48.15%). No annotation action changed: the single GOA row (GO:0018189 pyrroloquinoline quinone biosynthetic process, IEA from GO_REF:0000120) was already correctly ACCEPTed, and the PqqA-is-a-substrate-not-an-enzyme reading was already in place.

    What was added:
    - A statement and reference_section_type on each of the eleven previously quote-only findings across the UniProt record and the falcon report, so each quote now says what it is being read to show.
    - A fourth UniProt finding for the curated CROSSLNK feature (Glu15-Tyr19), which the review already quoted in supported_by but had not recorded as a finding.
    - A finding on GO_REF:0000120 recording that the row's WITH/FROM names InterPro:IPR011725, UniRule UR000098295 (HAMAP MF_00656) and UniPathway UPA00539, i.e. a curated family rule rather than an ARBA association rule - relevant because the whole review rests on one IEA row.
    - Two findings on the previously empty OpenScientist reference, including the Glu15/Tyr19 motif read off the target's own 23-residue sequence, and that quote added to core_functions.supported_by.
    - reference_review blocks for the UniProt record (noting its FUNCTION and CROSSLNK statements are ECO:0000250 by-similarity, not experimental) and for the falcon report (noting its KT2440 phosphate/PQQ and phosphate-solubilization data concern downstream PQQ-dependent glucose dehydrogenase physiology and are deliberately not annotated to pqqA).
    - reference_section_type on every core_functions and review supported_by item.

    Weighted compliance 48.15% -> 97.06%. The two remaining gaps are supporting_text and reference_section_type on the GO_REF finding, which has no quotable source text.
