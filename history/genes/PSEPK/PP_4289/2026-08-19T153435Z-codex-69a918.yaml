    PR description:
    ## Summary

    - Add a reusable three-step bacterial module from urate through HIU and OHCU to (S)-allantoin.
    - Identify PP_4289/Q88F11 as the KT2440 COG3748 membrane/cytochrome-c PuuD candidate.
    - Curate the exact PucM HIU-hydrolase and PucL OHCU-decarboxylase steps, with full OpenScientist reports adjudicated against primary evidence.
    - Keep upstream xanthine oxidation and downstream allantoin degradation outside this module.
    - Preserve the PP_3099 false-positive boundary report without duplicating its canonical TssC1 review in PR #2515.

    ## Curation decisions

    The PuuD step is not assigned GO:0004846 or RHEA:21368 because those identifiers require oxygen reduction to hydrogen peroxide. PMID:26349049 supports a cytochrome-mediated route, but the physiological acceptor and balanced PuuD reaction remain unresolved. GO:0016661 captures the supported nitrogenous-donor oxidoreductase class; GO:0009055 is retained for the electron-transfer component.

    The generated species, module, PP_4289, PucM, and PucL reports remain unchanged. Oxygen-specific PuuD chemistry, respiratory-chain coupling, soluble-uricase co-localization, a false KT2440 pathway-hole call, and target-level oligomer/localization claims were explicitly rejected where unsupported.

    ## Review follow-up

    - Re-anchored PP_3099 notes to the committed provider report, eliminating the dangling local UniProt provenance.
    - Restored the source-exact COG3748 label `predicted membrane protein`.
    - Verified UniProtKB:A9CI11 directly
