  summary: Resolve GO:0097171 to the stereochemistry-neutral parent; KT2440 has no
    HldD
  details: |
    Re-examined the one remaining UNDECIDED row. The previous verdict rested on an unresolved HldD assignment not being proof of absence; that proof is now available and converges from two independent directions. Three UniProt queries over taxon 160488 return nothing (gene name hldD or rfaD, EC 5.1.3.20, and protein-name text, whose only hit is the generic NAD-dependent epimerase PP_3206), while the identical queries against P. aeruginosa return Q9HYQ8 hldD. Independently, KT2440's sole member of the HldD family PTHR43103 is the uronate dehydrogenase Q88NN6 in the 4-epimerase subfamily SF5, whereas the 161-member heptose 6-epimerase subfamily SF3 that holds PSEAE hldD and E. coli P67910 has no KT2440 member. KT2440 therefore terminates the pathway at ADP-D-glycero-beta-D-manno-heptose, so the L,D stereochemistry asserted by GO:0097171 is not reached. Changed UNDECIDED to MODIFY with proposed_replacement_terms GO:0009226 nucleotide-sugar biosynthetic process, an is_a ancestor, generalizing an over-specific term rather than removing a true-in-kind claim. No GO term exists for the D,D endpoint; recorded as an ontology gap. just validate clean.
