    Review follow-up on PR #5909, findings 1, 2 and 5. This review asserted the same ADP-D,D-heptose ontology gap as the sibling hldE review while carrying proposed_new_terms: []. Added the matching proposed_new_terms entry and re-targeted GO:0097171's replacement from GO:0009226 to the NTR for ADP-D-glycero-beta-D-manno-heptose biosynthetic process, so the heptose chemistry stays machine-readable instead of being generalized two levels up.

