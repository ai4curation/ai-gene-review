  summary: Merge the duplicate aroE review of Q88IJ7; correct it to the Ael1 class
  details: |
    genes/PSEPK/aroE and genes/PSEPK/aroE__Q88IJ7 both reviewed Q88IJ7 (PP_3002). Kept aroE__Q88IJ7, matching its paralogs aroE__Q88K85 and aroE__Q88RQ5, and moved the aroE folder's Falcon deep research here. The aroE review called PP_3002 the canonical AroE and cited PMID:21846128 as confirming it; the abstract and the RCSB title of its structure (PDB 3PWZ, 'Crystal structure of an Ael1 enzyme from Pseudomonas putida') place it in the AroE-like1 class instead, and the KT2440 AroE-class structure is PDB 4OMU on PP_0074. GO:0004764 stays ACCEPT (Ael1 uses shikimate in vitro with the AroE catalytic dyad); GO:0009423 chorismate biosynthetic process moves from ACCEPT to KEEP_AS_NON_CORE and leaves the core function, since its in vivo contribution beside PP_0074 is unresolved. Added a suggested question and experiment, verbatim UniProt quotes tying PDB 3PWZ to PMID:21846128, and a direction-neutral reason for the non-core GO:0019632 row. Updated interpro/panther/PTHR21089/PTHR21089-review.yaml, whose notes still described the duplicate folder and listed PP_3002 among biosynthetic AroE. aroE folder retired.
