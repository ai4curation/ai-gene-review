  summary: Complete source-specific aminoacyl-tRNA review of PSEPK ileS
  details: |
    Reviewed all 12 existing annotations and the standalone description, references and core functions. Preserved the complete ordered machine annotation payloads and both raw source files. Replaced live-verified obsolete charging process IDs in reviewer metadata while retaining original IDs/labels; retained integral ATP/tRNA/cofactor properties. IleS charges tRNA(Ile) with isoleucine and proofreads near-cognate valine through pretransfer hydrolysis of Val-AMP and posttransfer deacylation of Val-tRNA(Ile). HAMAP MF_02002 describes separate aminoacylation and editing sites and one zinc ion per subunit. The two valine-editing reactions are family-rule inferences for this sequence. Hydrolysis of Val-tRNA(Ile) is the posttransfer reaction covered by GO:0002161. The separately inferred Val-AMP pretransfer reaction acts on an adenylate, so it must not be called tRNA deacylation. Actual provider/fallback and fitness attempts failed, publication caching succeeded; manual source review and access limits are documented in gene notes. No new annotation row was added. Focused strict term/source validation, record-section backfill, HTML rendering and independent payload/raw preservation proof are recorded in .cache/module-audit-logs/aminoacyl-fourteen/.
