  summary: 'Retrospective audit corrections: sucC'
  details: |
    Corrections after a retrospective audit (2026-11-12) of the succinyl-CoA synthetase reviews (eleven subunit reviews, the families PTHR11117 and PTHR11815, and the tca_cycle module), followed by a cross-file consistency pass. This record supersedes the reading in the 2026-11-11 records where they differ. Action changes, several of them reversals of the 2026-11-11 record: GO:0004776 succinate-CoA ligase (GDP-forming) activity (IEA) KEEP_AS_NON_CORE -> ACCEPT, because calling it secondary transferred the E. coli kinetic ranking to an enzyme for which no ranking is known (the P. aeruginosa enzyme forms ATP and GTP in similar amounts, PMID:10671455; the P. putida enzyme is unassayed). GO:0006104 succinyl-CoA metabolic process (IEA) KEEP_AS_NON_CORE -> ACCEPT. GO:0003824 catalytic activity (IEA) MARK_AS_OVER_ANNOTATED -> TOO_GENERAL; the reason is now worded the same way in all eleven subunit reviews (true but uninformative, entailed by the accepted specific activity). GO:0046872 metal ion binding (IEA) MARK_AS_OVER_ANNOTATED -> MODIFY to GO:0000287. GO:0000287 magnesium ion binding and GO:0005524 ATP binding (IEA) ACCEPT -> KEEP_AS_NON_CORE. core_functions now has two entries, GO:0004775 and GO:0004776, as contributes_to_molecular_function, with location GO:0005829 and in_complex GO:0042709. Quotes of the record's own DR GO lines were removed. A notes file was created. The tracked rendered page was regenerated. Validated with just validate PSEPK sucC.
