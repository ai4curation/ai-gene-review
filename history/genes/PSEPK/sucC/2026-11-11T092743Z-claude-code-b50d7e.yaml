    Part of a joint evolutionary re-review of the succinyl-CoA synthetase subunit families PTHR11117 (alpha) and PTHR11815 (beta). Evidence: the PANTHER release 19 trees, a reproducible local analysis (genes/yeast/LSC2/LSC2-bioinformatics: paralog census, bootstrapped neighbor-joining and maximum-likelihood trees, position-20 residue comparison), cached literature, and two OpenScientist hypothesis runs. Action unchanged (ACCEPT on GO:0004776). Added PMID:10671455, a direct assay showing that the succinyl-CoA synthetase of the congener P. aeruginosa forms ATP and GTP, as support and as a reviewed reference. Pre-existing warnings about quoted UniProt GO cross-references on other rows were not addressed.
