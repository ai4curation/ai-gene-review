  summary: 'Create review: PP_3197 (Q88I05), FdeC-like VOC-superfamily ring-cleavage
    dioxygenase'
  details: |
    De-novo review of Q88I05, the first gene curated in the ppu00946 batch. PP_3197-goa.tsv is header-only, so both annotations are NEW by ISS from UniProtKB:D8J0W7: GO:0016702 (extradiol-type single-donor ring cleavage, narrowed from the initially proposed GO:0051213 dioxygenase activity after review) and GO:0009812 flavonoid metabolic process. The inference is backed by PP_3197-bioinformatics/analyze_fdec_ortholog.py, which fetches both sequences from UniProt and aligns them with Biopython (BLOSUM62, -10/-0.5), reproducing 69.5% identity over 305 aligned pairs and confirming the GCEHFTFHMG motif at Q88I05 214-223 / D8J0W7 207-216. The deep-research report's 71.3% figure was not reproduced, the disagreement is recorded rather than adopted, and the report's reference_review correctness is UNVERIFIED. This record was scaffolded retrospectively by the PR shepherd. The history/ mechanism (scripts/new_history.py, docs/history.md, src/ai_gene_review/schema/history.yaml) was added to main in 38a025114e on 2026-09-03 and reached this branch with the 2026-09-13 merge of main, after the curation described here; the session is therefore reconstructed from the branch contents and the formal review rounds on PR #2832 rather than written during curation.
