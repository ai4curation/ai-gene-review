  summary: Record OpenScientist finding of a competent tether-hydrolase site with
    unmeasured specificity, and confirm KT2440 lacks a 3-to-3 crosslinker
  details: |
    Ran an OpenScientist deep-research job (kgap-pp1451-tether-hydrolase) on two PP_1451 gaps: the untested tether-hydrolase activity and substrate specificity, and the proposal that KT2440 may lack a dedicated 3-to-3 crosslinking L,D-transpeptidase. It gives one clean positive, one clean negative and one explicit limit.

    On activity, the catalytic site is competent. Structural superposition of the characterised E. coli DpaA onto the PP_1451 model, 126 aligned pairs at 1.56 Angstrom over a 118-residue core, places the catalytic nucleophile on Cys159 at 0.97 Angstrom, the proton donor on His137 at 1.04 and the DpaA-diagnostic alanine on Ala161 at 0.95, with a measured cysteine-histidine spacing of 4.05 Angstrom against 4.32 in DpaA. All three are confirmed in the local record, which is 184 residues with the YkuD Pfam domain and a signal peptide at 1..18. The alanine two positions after the cysteine is the residue separating hydrolases from transpeptidases in this family, and PP_1451 carries the hydrolase form. The substrate exists in the organism: a scan of all 5,527 KT2440 proteins against P. aeruginosa OprI returns one hit far above background, PP_2322 at 94.0 per cent identity with the lipobox cysteine and attachment lysine conserved.

    The limit is stated plainly and is the part the gap should carry: a competent cysteine-histidine pair with alanine at the diagnostic position identifies a YkuD-fold hydrolase but does not say which amide bond it cuts. MEROPS places DpaA-like proteins in the same subfamily as L,D-carboxypeptidases of Helicobacter and Campylobacter, and E. coli LdtF itself also acts as a glycine-specific carboxypeptidase and as an L,D-endopeptidase. Two caveats weaken specificity further: of the six non-catalytic positions alanine scanning tested in DpaA, the two whose mutation cost the most activity, at 0.7 and 4 per cent of wild type, are exactly the two PP_1451 does not conserve, carrying Phe106 and Met133 instead, both confirmed locally; and the closest characterised ortholog at 57.1 per cent identity was never purified in soluble form, its deletion changed no muropeptide and its hydrolase assignment was made by exclusion, while the only measured hydrolase biochemistry sits on DpaA at 29.0 per cent identity. So specificity should be treated as unmeasured rather than assumed identical to DpaA.

    On the inventory gap, the stronger half is confirmed and the weaker half declined. Three independent censuses agree KT2440 carries exactly two YkuD-family proteins with no YcbB/LdtD-type crosslinking enzyme above background, the best YcbB-like hit scoring 64 against a background of 64, 60, 56, 55 and 54 for unrelated proteins, the YcbB-specific accessory domain absent, and no ortholog of the single L,D-transpeptidase that deletion showed to be the only peptidoglycan crosslinker in P. aeruginosa. But the weaker claim, that KT2440 therefore makes no 3-to-3 crosslinks at all, is not established, because PP_2320 was not assignable against E. coli paralogues alone and would have to cover whichever such reactions occur.

    Both gaps moved from OPEN to NARROWING; a third gap on this gene, already RESOLVED, was left untouched. No annotation action was changed.

    Incidental: the first wiring attempt used line-anchor surgery and put the second boundary into the already-RESOLVED gap, because peek only lists OPEN gaps and the file has three. The file was reverted and rewritten by gap index with a YAML round-trip, which also kept the diff to 26 insertions and the two status lines.
