  summary: Record OpenScientist paralog-flux analysis for the KT2440 PuuD family
  details: |
    Ran an OpenScientist deep-research job (kgap-pp3598-puud-paralog-flux) on the knowledge gap covering which KT2440 PuuD-family paralog carries the physiological gamma-glutamyl-gamma-aminobutyrate hydrolase flux. The catalytic test the gap's own experiment proposes turns out to be uninformative as a discriminator: all family members retain an intact Cys-His-Glu triad and C-R-G nucleophile elbow. For PP_3598 the run's Cys124, His232 and Glu234 are exactly the three ACT_SITE residues UniProt annotates, and the elbow is present as GICRGMQ at 122-128 in the local Q88GW9 record. The run also finds four family members rather than the three the gap's suggested question names, adding PP_0727 as the most divergent.

    What discriminates is genomic context. PP_2179 (spuA) and PP_5298 are each co-transcribed with a PuuA-type glutamate-putrescine ligase, the enzyme that makes the hydrolase substrate, at intergenic gaps of 84 bp and 4 bp, while PP_3598 sits alone between an amino-acid-transport block and a glucarate block with 425 bp and 347 bp flanking gaps, the two largest of the twenty measured, and no polyamine or GABA gene within four loci either side. PP_2179 is also 69.6 percent identical to P. aeruginosa SpuA and reproduces all fourteen glutamate-contacting pocket residues of PDB 7D53, against 42.8 percent and eleven of fourteen for PP_3598.

    Status set to NARROWING. The run predicts the flux runs through PP_2179 and PP_5298 and reads PP_3598 as a clade-restricted paralog decoupled from putrescine catabolism with an unresolved physiological substrate. The only primary evidence touching PP_3598 is a triple base-edit knockout on hexamethylenediamine, a non-natural C6 diamine, which impaired but did not abolish growth and cannot attribute flux to any single gene.

    No annotation action was taken. The run recommends generalising or qualifying the IEA GO:0033969 row, and the observation behind that recommendation is recorded, namely that the row descends from a PANTHER subfamily holding all four KT2440 paralogs plus E. coli PuuD and SpuA undifferentiated. But the evidence concerns which paralog carries pathway flux, not whether this protein can catalyse the reaction, and the triad and family membership are intact, so the molecular-function row is not contradicted. Three existing MODIFY rows also point at GO:0033969, and changing it on flux-share grounds would make the review internally inconsistent on a question the run itself leaves to assay.
