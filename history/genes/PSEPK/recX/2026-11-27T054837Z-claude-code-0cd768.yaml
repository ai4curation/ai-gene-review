  summary: 'Weekly compliance: strengthen recX (Q88ME3) IEA-only review'
  details: |
    Weekly compliance pass on an IEA-only Pseudomonas putida KT2440 review (weighted compliance 50.70%).

    One new annotation. GOA gives recX a regulatory process and a location but no molecular function at all, even though the entry's whole curated functional content - written under HAMAP-Rule MF_01114 - is the activity claim 'Modulates RecA activity'. Added GO:0030234 enzyme regulator activity as a NEW ISS row against the UniProt record. This also clears the two validation warnings that core_functions[0] and [1] molecular_function were not reflected in existing_annotations. Deeper existing terms were checked and rejected in the reason: GO:0120230 recombinase activator activity has the wrong sign, and GO:0140776 protein-containing complex destabilizing activity would assert the filament-disassembly mechanism, which rests on E. coli and B. subtilis biochemistry rather than on anything shown for this protein.

    Both existing rows keep their action, with reasons extended to record what was checked. The GO:0006282 reason now says why it was not MODIFYed to a descendant: GO:0062110 negative regulation of DNA recombinase disassembly has the wrong sign for RecX, which promotes disassembly, and GO has no positive counterpart. The GO:0005737 reason records that the row's WITH/FROM is UniProtKB-SubCell SL-0086 plus UniRule UR000038450 (HAMAP MF_01114), a curated rule rather than ARBA, and why no sub-compartment term was added.

    Removed the file:PSEPK/recX/recX-goa.tsv reference: a GOA file says what is annotated, never why it is true.

    Added statements and reference_section_type to all eleven previously quote-only findings on the UniProt record and the falcon report; added a supporting_text quote and a second finding to the PANTHER metadata reference, which previously had a bare statement; added reference_review blocks to all four remaining references, recording in particular that the falcon report's mechanistic claims are ortholog biochemistry and that the one KT2440-specific claim adopted is the recA-recX co-transcription in the LexA1 regulon. Extended the proposed-term justification with the three existing candidates checked, added two suggested questions and one suggested experiment, and added the missing hypothesis to the existing experiment.

    Weighted compliance 50.70% -> 97.56%. The two remaining gaps are supporting_text and reference_section_type on the GO_REF finding, which has no quotable source text. One validation warning remains by design: core_functions names cytoplasm as a location while the cytoplasm row is KEEP_AS_NON_CORE rather than ACCEPT or NEW.
