  summary: Audit assimilatory sulfate-reduction chemistry and evidence scope
  details: |
    Re-reviewed all five rows. Supersedes the first-pass donor choice: the prior NEW ferredoxin-specific GO0050311 is retired and UNDECIDED, because full23794620 leaves direct FprA transfer or carrier-mediated transfer unresolved. Positive sulfite-reduction chemistry is retained, and the general oxidoreductase term is refined to current GO0016667 sulfur-group redox activity. Live QuickGO confirmed GO0016002 is obsolete. PTHR32439 contains multiple reductase substrates and is not used as a donor assay. The old P9WJ02 comparator is CDC1551, whereas direct H37Rv experiments concern P9WJ03. OpenScientist’s CysJ assignment remains disputed; Fpr is an FAD-containing FNR, not a CysJ diflavin subunit.
