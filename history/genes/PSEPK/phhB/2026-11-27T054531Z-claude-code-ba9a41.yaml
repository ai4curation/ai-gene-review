  summary: 'Weekly compliance: strengthen phhB (Q88EH2) IEA-only review'
  details: |
    Weekly compliance pass on an IEA-only Pseudomonas putida KT2440 review (weighted compliance 49.35%). Both rows stay ACCEPT, but the reasons were rewritten because they argued against their own action.

    - GO:0006729 tetrahydrobiopterin biosynthetic process: the old reason called the term 'usable but broad and slightly mismatched' while keeping ACCEPT, which CLAUDE.md forbids. The new reason defends ACCEPT on its merits: PCD performs the carbinolamine dehydration step of a cycle whose product is the reduced pterin, which is what involved_in requires, and the curated Swiss-Prot keyword and the HAMAP MF_00434 FUNCTION statement make the same call independently of the InterPro mapping. The recycling-versus-de-novo point stays as the proposed term and the biopterin-versus-monapterin point as a suggested question, since neither makes the term false.
    - GO:0008124: reason now records that the row's WITH/FROM is UniRule UR000031216 (HAMAP-Rule MF_00434), a curated rule rather than ARBA, and that GO:0102434 'pterin-4alpha-carbinolamine dehydratase activity' was checked as a possible alternative and rejected - its definition is the 10-formyltetrahydrofolate-4a-carbinolamine reaction, a different substrate, despite the generic-sounding label.

    Removed the file:PSEPK/phhB/phhB-goa.tsv reference: a GOA file states what is annotated, never why it is true, so it is not admissible as a reference here.

    Added statements and reference_section_type to all thirteen findings on the UniProt record and the falcon report, plus a fifth UniProt finding for the family assignment; added reference_review blocks to both (noting that nothing on the UniProt record is an experimental observation of the KT2440 protein, and that the falcon report itself states no KT2440-specific characterization of PP_4491 was retrieved); added reference_section_type throughout core_functions and proposed_new_terms; added hypotheses to the two existing suggested experiments plus a third; added a fifth suggested question on the phylogenomic finding that catalytically competent COG2154 proteins occur in genomes with no aromatic amino acid hydroxylase.

    Weighted compliance 49.35% -> 94.81%. The four remaining gaps are supporting_text and reference_section_type on the two GO_REF findings, which have no quotable source text.
