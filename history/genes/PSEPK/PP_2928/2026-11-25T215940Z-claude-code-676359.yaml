- type: EDIT
  outcome: changed
  summary: Record OpenScientist refutation of both pocket and genome arguments for
    PP_2928 substrate assignment
  details: |
    Ran an OpenScientist deep-research job (kgap-pp2928-diamine-preference) to test the companion conclusion that selectivity in the NspC/PP_2928 pair must sit in the dehydrogenase, since the decarboxylase pocket is permissive. The run refutes both candidate arguments and leaves the substrate assignment open, and one of those refutations retracts a claim this campaign had already recorded.

    The pocket cannot carry the load, for two independent reasons. The five positions lining the distal amine in the only agmatine-bound structure in the family are identical in enzymes assayed with putrescine and in enzymes assayed with agmatine, so they carry no discriminating information even where assays exist. And PP_2928 does not have that pocket: a survey of 242 bacterial family sequences places it in a Pseudomonadota-restricted pocket type of 66 sequences, no member of which has ever been assayed with any substrate.

    The genome-level argument fares no better, and this is the consequential part. That argument runs from the absence of an annotated 2,4-diaminobutyrate decarboxylase to the absence of a 1,3-diaminopropane source and hence to exclusion of the carboxynorspermidine branch. The run put it through a positive control and it failed: Vibrio cholerae demonstrably makes 1,3-diaminopropane and sym-norspermidine, yet the same database reports that decarboxylase as absent from that organism, and neither of the two main resources annotates the fused enzyme the primary literature credits with the step. A detection method that cannot see the step in an organism where it is proven cannot be used to rule the step out in KT2440.

    I had wired that same genome argument into the nspC boundary earlier in this campaign, recording the carboxynorspermidine branch as absent rather than merely disfavoured. That claim is now withdrawn in the nspC record, which has been edited to state the retraction, its basis, and what survives: putrescine supply running intact, both arms of the canonical aminopropyltransferase route missing, and NspC as the only spermidine-forming candidate, while which diamine the pair actually uses remains open among putrescine, agmatine and 1,3-diaminopropane. The nspC provenance quote was also replaced, since the sentence it cited no longer reflects the conclusion.

    What survives intact here is the half-reaction chemistry. PP_2928 has a complete NADPH-specific cofactor site and a complete aspartate-semialdehyde co-substrate cavity including a verbatim GFDPGV motif, which the local Q88IS1 record confirms at position 150, with the saccharopine-dehydrogenase Pfam pair and the carboxynorspermidine-synthase PANTHER subfamily both present. It is a catalytically competent aspartate-semialdehyde-dependent diamine dehydrogenase whose diamine end is open to all three candidates.

    Status left OPEN. No annotation action was taken; the run's curation reading matches this review as it stands, that no substrate-specific molecular function should be asserted pending assay while the generic oxidoreductase function and the spermidine biosynthetic process remain safe. The pocket-type survey, agmatine-bound structure comparison, cofactor-site assessment and Vibrio positive control were not independently recomputed.
