  details: |
    PR #5366 review round (ai4c-reviewer review 5636943045). Suggestion taken. The GO:0018623 row carried qualifier: contributes_to, which its GOA row does not state (the row says enables, verified in benB-goa.tsv). Changed the qualifier to the value GOA actually asserts and added the same review.source_defects entry (WRONG_QUALIFIER, GOA_EBI, enables -> contributes_to) used by the ACIAD and RHOJR benB reviews, so all three record the upstream error the same way instead of silently correcting it. The reason text now says where the correction is reported. core_functions still records contributes_to_molecular_function, unchanged. just validate passes; its 4 warnings are pre-existing quotes of UniProt protein names in supported_by, untouched by this change.
