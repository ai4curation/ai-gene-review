  details: |
    Reviewed all 10 existing annotations and the standalone description, references and core functions. Preserved the complete ordered machine annotation payloads and both raw source files. Replaced live-verified obsolete charging process IDs in reviewer metadata while retaining original IDs/labels; retained integral ATP/tRNA/cofactor properties. TyrS is a class I tyrosyl-tRNA synthetase that forms a tyrosyl-adenylate intermediate and transfers tyrosine to tRNA(Tyr); its C-terminal RNA-binding region helps recognize the tRNA substrate. HAMAP MF_02007 identifies the type 2 TyrRS reaction, while the S4-like RNA-binding region at residues 336–396 supports tRNA engagement. This does not imply unrestricted binding to other nucleic acids. Actual provider/fallback and fitness attempts failed, publication caching succeeded; manual source review and access limits are documented in gene notes. No new annotation row was added. Focused strict term/source validation, record-section backfill, HTML rendering and independent payload/raw preservation proof are recorded in .cache/module-audit-logs/aminoacyl-fourteen/.
