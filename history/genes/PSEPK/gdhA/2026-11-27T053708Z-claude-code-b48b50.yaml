  summary: 'Weekly compliance: strengthen gdhA (Q88Q23) IEA-only review'
  details: |
    Weekly compliance pass on an IEA-only Pseudomonas putida KT2440 review (weighted compliance 51.6%).

    Added review.reason to all six existing annotations and sourced supported_by for every row, drawing only on non-ARBA parts of the UniProt record (curated PIRNR/PIRSR/RuleBase family and site rules, and the InterPro/PIRSF/NCBIfam/PANTHER signature cross-references); the entry's FUNCTION, CATALYTIC ACTIVITY and SUBUNIT comments rest on ARBA alone and are therefore not cited as support.

    Three action changes, all following the correct-but-general rules in CLAUDE.md:
    - GO:0004353 L-glutamate dehydrogenase [NAD(P)+] activity: KEEP_AS_NON_CORE -> MODIFY to GO:0004354. The earlier review called it a sibling of GO:0004354; it is in fact its direct parent in GO, and the same ARBA source that supplied it also asserts the NADP-specific RHEA:11612 / EC 1.4.1.4 reaction.
    - GO:0006520 amino acid metabolic process: KEEP_AS_NON_CORE -> MODIFY to GO:0006536 glutamate metabolic process (direct child). Checked that GO:0006537 glutamate biosynthetic process is obsolete, and left the direction-specific GO:0097054 / GO:0006538 unasserted because the physiological direction in KT2440 is unknown.
    - GO:0016491 oxidoreductase activity: MARK_AS_OVER_ANNOTATED -> TOO_GENERAL, matching the 2026-11-14 maintainer ruling (imprecise on its own, entailed by GO:0004354 asserted elsewhere, row evidence sound).
    - GO:0016639 kept as MODIFY-eligible: its WITH/FROM signatures (IPR014362 Glu_DH, IPR033922 NAD_bind_Glu_DH) are glutamate-dehydrogenase-specific, unlike the wider ELFV signatures behind the GO:0016491 row, so KEEP_AS_NON_CORE -> MODIFY to GO:0004354.

    Also added findings to all four GO_REF references (statement only; GO_REFs have no readable text to quote), a new file: reference for the UniProt record with five quoted findings, a reference_review for the Asta deep-research file recording that its retrieval returned no on-topic literature (relevance NONE), directly_involved_in and locations on the core function, three suggested_questions and two hypothesis-bearing suggested_experiments.

    Weighted compliance 51.61% -> 89.04%. The remaining eight gaps are supporting_text and reference_section_type on the four GO_REF findings, which have no quotable source text.
