  details: |
    New review of PP_2389 (Q88KA1), reached from KBase gene-annotate dashboard protein NZ_CP026332.1_3351 (99.6% identical over 262/262 aa; exact-match UniProt entries deleted, not part of a reference proteome). GOA empty; three NEW ISS annotations: GO:0020037 heme binding, GO:0004497 monooxygenase activity, GO:0005737 cytoplasm. Core function: predicted cysteine-ligated heme N-hydroxylase of the YqcI/YcgG family (PF08892), substrate undetermined, by homology to DcsA (38.4% id, PMID:22547619), AglA (PMID:35616638, PMID:41221789) and GntA (PMID:35583956), with conservation of the AglA Cys44 heme ligand at Cys46 plus the heme-propionate and substrate-gate residues. Homology-only; no activity measured for any Pseudomonas member. KT2440 RB-TnSeq (pulled from BERDL; Fitness Browser returned 403) confirms the dashboard's quoted gain-of-fitness scores on DL-2-aminobutyrate and L-methionine as nitrogen sources, but the phenotype is shared with the cofit neighbours PP_2390 (LysR) and PP_2388 (LysE), so it is not gene-specific.
