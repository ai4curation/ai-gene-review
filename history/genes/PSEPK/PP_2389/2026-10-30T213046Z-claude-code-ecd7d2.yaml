  details: |
    PredictionReview sidecar for the KBase gene-annotate dashboard (Dark Protein Atlas, gpt-rosalind-5.5-codex) call on NZ_CP026332.1_3351, scored on Q88KA1 (99.6% identity). The call's single GO term, GO:0005737 cytoplasm, is scored COR (confidence 2): correct and novel, since GOA holds no annotations for Q88KA1 and DeepTMHMM finds no signal peptide or membrane-spanning segment. Recommended dashboard verdict: supported but under-called. The fitness numbers the call cites were reproduced exactly from BERDL, but the phenotype is shared with the cofit neighbours PP_2390 and PP_2388 and the gene has no specific-phenotype flag, so it is not gene-specific. The call also treats YqcI/YcgG as functionless, missing the 2022-2026 literature characterizing the family as heme N-hydroxylases; the dashboard's PaperBLAST panel was empty and the InterPro and eggNOG descriptions it saw still read uncharacterised.
