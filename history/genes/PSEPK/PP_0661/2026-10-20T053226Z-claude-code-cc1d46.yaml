  details: |
    New review of the uncharacterized LysR-type regulator PP_0661 (Q88Q37). Of 5 IEA annotations: ACCEPT 3 (GO:0003700, GO:0006355, GO:0043565), TOO_GENERAL 1 (GO:0003677), MARK_AS_OVER_ANNOTATED 1 (GO:0006351). Core function: DNA-binding transcription factor activity in regulation of transcription; targets and effector unknown. Genomic context and pairwise identity (about 40% to both AmpR and GcvA; not adjacent to the ampC-like gene PP_2876) do not support the submitter name AmpR. Added a PGAP predictions review: PGAP gives no GO because its naming model NF015431 (PF03466) has none and the GO on the matched HTH model NF012354 is discarded, a recall failure for two core terms. Falcon deep research failed (Edison authentication error); review grounded in UniProt, InterPro, KEGG context, PMID:19047729 and PMID:22479525.
