  summary: Refresh the stale UniProt record and the prose written against the old one
  details: |
    Third and fourth review rounds on PR 6489. The cached UniProt record was entry version 95 (28 January 2026) and lacked the PANTHER cross-reference that version 97 (4 November 2026) carries, which made the module's PTHR39583:SF2 grounding look unsupported for this protein. Refreshed with just fetch-gene --force. The GOA table is unchanged, so no annotation row was added or removed and no existing annotation needed re-reviewing; the new record also brings the InterPro entry IPR051621 (Type II secretion system protein J), ARBA-derived membrane statements, a PROSITE caution about a missing conserved residue and a PROPEP feature. All quotes citing this file still match verbatim.

    The refresh did, however, falsify prose written against the older record, and the fourth round caught it: the core function said the record carried no GspJ-specific family signature, so that the GspJ assignment rested on the submitter-supplied name and the locus context, and the reference finding enumerated only the name, locus, methylation signature and transmembrane helix. Both now record the two GspJ-specific assignments the refreshed record carries, IPR051621 and PTHR39583:SF2, which place the protein in the GspJ clade rather than among the type IV pilins and strengthen the three NEW rows. The NEW actions and their rationales are unchanged.
