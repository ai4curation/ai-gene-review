  summary: 'Create review: PP_3195 (Q88I07), FdeB-like serine hydrolase in the KT2440
    flavonoid locus'
  details: |
    De-novo review of Q88I07 as part of the ppu00946 bacterial flavonoid degradation batch. Four annotations adjudicated: GO:0006508 proteolysis and GO:0008236 serine-type peptidase activity both REMOVE, argued from IPR050261 (FrsA/cutinase/hydrolase-like) family membership as positive esterase-family evidence rather than from absence of peptidase evidence; GO:0052689 carboxylic ester hydrolase activity ACCEPT as the substrate-neutral MF the fold supports; GO:0009812 flavonoid metabolic process added NEW by ISS with supporting_entities UniProtKB:D8J0W6. A re-runnable alignment (PP_3195-bioinformatics/analyze_fdeb_ortholog.py, fetched from the UniProt REST API at runtime) reports 81.6% identity to the Herbaspirillum seropedicae donor. The predicted R13077 lactone hydrolysis is left in proposed_new_terms rather than asserted, since no FdeB-family protein has been assayed for it. This record was scaffolded retrospectively by the PR shepherd. The history/ mechanism (scripts/new_history.py, docs/history.md, src/ai_gene_review/schema/history.yaml) was added to main in 38a025114e on 2026-09-03 and reached this branch with the 2026-09-13 merge of main, after the curation described here; the session is therefore reconstructed from the branch contents and the formal review rounds on PR #2832 rather than written during curation.
