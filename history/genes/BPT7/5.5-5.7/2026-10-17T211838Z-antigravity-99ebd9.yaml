  summary: 'Create review: BPT7 5.5-5.7 (P03787)'
  details: |
    End-to-end curation of BPT7 gene 5.5-5.7 (P03787). Fusion protein gp5.5-5.7 of Escherichia phage T7 produced by a -1 ribosomal frameshift near the 3' end of gene 5.5 into the overlapping reading frame of gene 5.7, combining the N-terminal gp5.5 H-NS-binding anti-silencing domain (residues 1-98) with the C-terminal gp5.7 domain (residues 101-169).. Reviewed all GOA annotations, synthesized core functions, and wrote comprehensive literature notes in 5.5-5.7-notes.md.
