  summary: 'Create review: BPT7 1.7 (P03781)'
  details: |
    End-to-end curation of BPT7 gene 1.7 (P03781). Metal-independent Class II deoxynucleoside monophosphate kinase (gp1.7) expressed in two equally active isoforms (22.2 kDa full-length and 17.8 kDa initiated at Met40) that catalyzes the phosphorylation of dGMP and dTMP (as well as dideoxythymidylate, ddTMP) to dGDP and dTDP using GTP, dGTP, or dTTP as the phosphoryl donor. Reviewed all GOA annotations, synthesized core functions, and wrote comprehensive literature notes in 1.7-notes.md.
