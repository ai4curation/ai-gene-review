  summary: 'Create review: PMK1'
  details: |
    Curated all 13 GOA annotations for Magnaporthe oryzae PMK1 (G4N0Z0), the Fus3/Kss1-type MAPK of the Mst11-Mst7-Pmk1 cascade. Actions: 10 ACCEPT, 3 KEEP_AS_NON_CORE (ATP binding; hyphal growth; septin ring assembly, kept as non-core because Pmk1 acts upstream of septin reorganisation via Mst12 rather than assembling septins), 0 MODIFY/REMOVE/NEW. Accepted symbiont-mediated cell-to-cell migration by invasive hypha because the 2018 analog-sensitive inhibition was applied after penetration and targets a fungal morphogenetic step, not a loss-of-virulence inference. Added references PMID:34707224 (Hox7/Mst12 substrates), PMID:38252344 (MoFim1 Ser94 substrate), PMID:15749760 (cascade) and PMID:11952120 (Mst12). Core functions: MAP kinase activity in MAPK cascade driving appressorium formation, and in invasive cell-to-cell movement. Validation passes with no warnings.
