  summary: 'Create review: PWL2'
  details: |
    Curated the Magnaporthe oryzae cytoplasmic effector PWL2 (G5EI71) from UniProt, the 12 cached publications and the Falcon deep-research report. All 15 GOA rows are cellular-component annotations (extracellular region x8, host cell cytoplasm x7, including two GO_REF:0000044 subcellular-location mappings) and all were ACCEPTed: Pwl2 is secreted by invasive hyphae into the biotrophic interfacial complex by a brefeldin A-insensitive exocyst/SNARE route and is then translocated into the rice cytoplasm, where it meets its host target. Several cited sources are methods chapters or marker-line resource papers that use PWL2 only as a reporter; these were kept with explanatory reasons and LOW/MEDIUM reference_review relevance rather than removed. GOA had no process or molecular-function annotation, so one NEW symbiont-side process annotation was added, GO:0052034 effector-mediated suppression of host pattern-triggered immunity, supported by Were et al. 2025 (PMID:40341381, HIPP43 binding and displacement from plasmodesmata, attenuated chitin/flg22 ROS bursts, binding-dead variant failing to complement) and Zdrzalek et al. 2024 (PMID:38968126, 1.8 A Pwl2-OsHIPP43 structure, Kd 191 nM); the parent term was chosen over the signaling child GO:0140423 because the authors leave open whether HIPP43 acts in the signalling chain. No molecular-function term was asserted, since protein binding is uninformative and the sequestration-versus-stabilisation question is unresolved; this plus the absent BIC component term and the host-side nature of avirulence recognition are recorded as suggested_questions. Five new PMIDs were cached (7549480, 37820736, 38968126, 40341381, 23774898). Action counts: ACCEPT 15, NEW 1. Validation: just validate PYRO7 PWL2 passes with no errors or warnings; status COMPLETE.
