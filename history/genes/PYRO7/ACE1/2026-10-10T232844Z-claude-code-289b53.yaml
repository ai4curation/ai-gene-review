  details: |
    Curated the P. oryzae PKS-NRPS ACE1 (G4MVZ2) review from UniProt, the falcon deep research and cached papers (full text: PMID:15319478, 17142568, 29142718). Of 10 GOA rows: 3 ACCEPT (cytoplasm EXP and IEA; secondary metabolite biosynthetic process), 3 KEEP_AS_NON_CORE (3-oxoacyl-ACP synthase, acyltransferase, phosphopantetheine binding), 4 MODIFY, 0 REMOVE, 0 NEW. Main corrections: IEA fatty acid synthase activity and the general transferase activity changed to polyketide synthase activity (GO:0016218); fatty acid biosynthetic process changed to polyketide biosynthetic process (GO:0030639); condensation-domain catalytic activity changed to non-ribosomal peptide synthetase activity (GO:1904091), following the iccA/iliA PKS-NRPS precedent. Core functions are PKS and NRPS activities in the appressorial cytoplasm. No host-interaction term was added because the Pi33-recognized signal is a pathway metabolite, not the protein; this is raised as a suggested question. just validate and validate-changed pass with no warnings.
