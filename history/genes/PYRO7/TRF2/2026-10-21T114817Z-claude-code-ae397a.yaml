  summary: 'Create review: TRF2 (G4N2B2)'
  details: |
    De-novo review of P. oryzae TRF2 (MGG_04853), independent of ProtNLM2 predictions, as the experimental reference for its N. crassa ortholog kal-1. Falcon and perplexity-lite deep research failed (403 auth); review built from PMID:27902426 (abstract cached, full text read on PMC) and UniProt. New bioinformatics (TRF2-bioinformatics/compare_relatives.py, RESULTS.md) confirms PTHR24324:SF5, intact homeodomain WFQNRR, 1:1 orthology with KAL-1. All 8 IEA rows reviewed: homeodomain MF and nucleus accepted; DNA binding and GO:0000977 refined to GO:0000978; GO:0006355/GO:0006357 refined to GO:0000122 on the basis of the deletion-raises-MoPKS19 result; TreeGrafter cell differentiation marked over-annotated (no TRF2 developmental phenotype). No NEW secondary-metabolism term because pyriculol output was not measured in TRF mutants.
