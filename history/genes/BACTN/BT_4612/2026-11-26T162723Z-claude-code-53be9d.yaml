  summary: 'Wire OpenScientist result: carboxynorspermidine excluded, remaining two
    candidates blocked by one unassignable ureohydrolase'
  details: |
    Wired an OpenScientist run (kgap-bt4612-amine-supply) into the knowledge gap on
    BT_4612's physiological substrate and molecular function. Status OPEN -> NARROWING.

    The substrate is constrained only by exclusion, and the exclusion removes exactly
    one of three candidates.

    Excluded: carboxynorspermidine. B. thetaiotaomicron VPI-5482 can make agmatine (a
    biosynthetic arginine decarboxylase is present) but cannot make
    1,3-diaminopropane: a Pfam census over all 4,782 entries of the reference proteome
    returns zero members of the fold-III ornithine decarboxylase and SpeC/SpeF/CadA
    lysine decarboxylase families, and nothing is annotated to diaminobutyrate
    aminotransferase or diaminobutyrate decarboxylase.

    A collateral finding raises the stakes rather than resolving them: the same census
    returns zero for spermidine synthase and S-adenosylmethionine decarboxylase, so the
    classical spermidine route is absent at family level and whatever BT_4612 does is
    this organism's only path to spermidine.

    Not separable: carboxyspermidine versus carboxyaminopropylagmatine. The reason is a
    single protein. The genome has exactly one arginase/agmatinase/ureohydrolase
    superfamily protein, annotated only as "Arginase" with no EC, and it is required by
    either route - as an agmatinase it makes putrescine upstream of BT_4612
    (carboxyspermidine); as an N1-aminopropylagmatine ureohydrolase it acts downstream
    on the aminopropylagmatine product (carboxyaminopropylagmatine). Its specificity is
    unrecoverable from sequence: unfiltered alignment scores of 39, 38, 48 and 96
    against human arginase, a bacterial arginase, E. coli SpeB agmatinase and a
    characterised N1-aminopropylagmatine ureohydrolase, while those four characterised
    proteins span 172-257 against each other. Its best match falls below the lowest
    distance the family's own characterised members show. Genomic context does not
    rescue it: the four route genes are maximally dispersed, no shared operon, no
    polyamine gene within four loci of any of them.

    Two results stand independently, both answering things the prompt demanded. The
    enzyme has no paralogue - the only protein of its Pfam domains and PANTHER family
    in the proteome, confirmed by an annotation-independent proteome-wide alignment
    (self 2167, best non-self 54) - so the count required before interpretation is one.
    And the cofactor is NADP: all 33 cofactor-contacting residues of a 96.7% identical
    ortholog's structure are identical here, the 2'-phosphate held by Ser34, Arg35,
    Thr36, Lys39 and Lys286, with alanine at the end of beta-2 where an NAD-preferring
    enzyme would carry an acidic residue. This agrees with the Cj0172c run, which read
    the same cofactor signature at the equivalent positions from the same structure.

    Verified here against this entry's own record (397 residues): Ala33, Ser34, Arg35,
    Thr36, Lys39, Lys286. Verified separately that the carboxyspermidine decarboxylase
    the run places at the end of this route is this corpus's own BT_0674 entry
    (Q8A9Z1), whose review records that deletion depletes spermidine and decarboxylase
    activity - so the route assignment is consistent with work already in the
    repository. Not reproduced here: the proteome-wide Pfam census, the alignment scores
    for the arginase-superfamily protein, the paralogue search, the 33-residue contact
    set and the ortholog identity.

    No annotation action changed and no core function added; the substrate the gap asks
    about is still unnamed.
