  summary: Record OpenScientist family assignment for BT_0674 and refutation of pocket-based
    selectivity
  details: |
    Ran an OpenScientist deep-research job (kgap-bt0674-substrate-selectivity) on the knowledge gap covering BT_0674's substrate selectivity. The family and reaction are settled; the premise that the pocket determines the substrate is refuted.

    On assignment, BT_0674 is the decarboxylase step of the aspartate-semialdehyde-dependent spermidine route, PLP-dependent on a fold-type-III alanine-racemase scaffold, and not the dehydrogenase. The two steps are non-homologous folds, and in this genome the dehydrogenase is the separate protein BT_4612, which the local record confirms by carrying the saccharopine-dehydrogenase Pfam pair while this entry carries PF00278, NCBIfam TIGR01047 and CDD cd06829 for the carboxynorspermidine decarboxylase subfamily. Thirteen of fourteen PLP and product-contacting positions mapped from the characterised Campylobacter product complex are identical here, including the subfamily-diagnostic Leu310 where authentic diaminopimelate decarboxylases carry Glu. All fourteen positions were confirmed in the local Q8A9Z1 record.

    The refutation: the pocket cannot discriminate among carboxyspermidine, carboxynorspermidine and carboxyaminopropylagmatine, and the decisive evidence is experimental rather than computational. The Campylobacter enzyme carrying exactly this residue set was shown by gene deletion to make spermidine in vivo despite being named for carboxynorspermidine, so an identical pocket turns over both chain lengths. The single Bacteroidota-specific substitution near the product amine changes the computed buried cavity volume by nothing under side-chain truncation. The run places selectivity upstream at the partner dehydrogenase, which is where the question should go next rather than into kinetics on this enzyme alone.

    Status moved from OPEN to NARROWING.

    The run's annotation recommendations were checked and need no action, because this review already makes every one of them: removal of the diaminopimelate decarboxylase and lysine-biosynthesis IBA rows, modification of the name-based nor-spermidine row to spermidine biosynthesis, and a new-term request for the molecular function since no GO term exists for this EC number. The local GOA independently confirms the provenance argument behind the removals, listing the same PANTHER node in the withFrom of both IBA rows. That is a useful independent corroboration of decisions already taken rather than a change.

    One caution recorded: this run's own reference validation reported every quotation it attempted as unsupported, so none of its literature quotations is relied on in the review and only its computed results and the locally checkable provenance are used. The structural mapping, cavity-volume calculation and comparison-set statistics were not recomputed.
