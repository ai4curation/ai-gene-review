  details: |
    Response to two CHANGES_REQUESTED reviews from ai4c-reviewer on PR 5758.

    Three blocking items, all accepted:

    1. Half-applied correction. The earlier correction commit (17342911b) rewrote the
       GO:0030214 row and the description but left the GO:0030340 row asserting that
       HA is "the substrate on which the gene is required for growth" and "the
       physiologically decisive substrate (PMID:33657378)", which contradicted the BP
       row in the same file. Both rewritten to rest on the two direct enzyme assays,
       with the fitness screen named as not relied on.

    2. Unqualified all-strains claim. "All tested hyaluronan-degrading gut Bacteroides
       strains carry it" is true only of the 17-strain panel of PMID:36523841, which
       scores B. eggerthii a CS-only degrader. PMID:32005816 scored B. eggerthii among
       the best HA utilisers while reporting BT3328-BT3330 "completely lost" in it.
       The description now attributes the claim to its panel and states the
       disagreement, and the finding carries finding_status DISPUTED with both quotes.

    3. Missing history record. The record scaffolded in the correction session was
       never committed, because git commit -a does not stage an untracked file; the
       commit titled "Add history record for the BT_3328 correction" contained only a
       two-line notes reflow. That record (2026-10-30T235708Z-claude-code-601302) is
       committed in this session alongside this one, unedited, since records are
       append-only.

    Suggestions also taken:

    - The RB-TnSeq finding now carries finding_status DISPUTED with the two
      targeted-deletion quotes, per docs/reference_curation.md, instead of the
      conflict living only in review.reason prose.
    - core_functions[1] no longer reads "Hyaluronan-specific lyase activity, the
      physiologically decisive substrate". PMID:32005816 reserves "hyaluronan
      specific lyase" for BT4410, and the decisive-substrate claim was retracted. It
      is now described as a second EC-derived descriptor of the same beta-elimination
      site, and GO:0009279 is added to its locations to match core_functions[0].
    - Dropped "its contribution is detectable under competition rather than essential
      for growth" from description and core_functions[0]. The competition reading is
      speculative in the source ("may be important in a multi-organism, competitive,
      environment") and its one in vivo competition result inverts it ("bt3328
      mutants showed increased bacterial numbers, compared with monocolonized mice").
    - The missing chondroitin sulfate catabolic process term moved from
      suggested_questions to proposed_new_terms, parented on GO:0006027.
    - Removed curation and workflow framing from the standalone description field.

    No GO term changed: the five terms were not challenged in either review.
    just validate, validate-terms, validate-references and render all pass;
    validate-predictions does not apply, as this branch carries no
    -dashboard-predictions-review.yaml.
