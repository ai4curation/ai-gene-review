  summary: New review of B. thetaiotaomicron BT_3328 (Q8A2H7, PL29 lyase BtCDH) from
    KBase Dark Protein Atlas item CAKXSP010000006.1_105
  details: |
    Created review for Q8A2H7 (BT_3328, BtCDH), which has no GOA annotations and a DUF4955-only UniProt name. The KBase Dark Protein Atlas query CAKXSP010000006.1_105 is 98.8% identical over its full length. Proposed NEW GO:0030341 chondroitin AC lyase activity and GO:0030340 hyaluronate lyase activity (IDA), GO:0030214 hyaluronan catabolic process (IMP, RB-TnSeq), GO:0009986 cell surface (IDA) and GO:0009279 cell outer membrane (IC, lipobox + surface exposure). Did not use the dashboard's GO:0034000 chondroitin-sulfate-ABC endolyase activity, because dermatan sulfate activity is contested between PMID:30262663 and PMID:32005816. Dashboard verdict: supported, with the DS caveat and a likely DeepTMHMM mis-call of the lipoprotein signal as soluble secreted.
