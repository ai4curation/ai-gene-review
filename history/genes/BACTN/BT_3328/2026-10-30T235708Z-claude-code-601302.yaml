  summary: Correct the HA genetics of BT_3328 and record the DUFMech PF16315 contribution
  details: |
    Correction. The initial review said BT_3328 is required for growth on hyaluronan and annotated GO:0030214 by IMP from pooled RB-TnSeq (PMID:33657378). Both characterisation papers report that the clean deletion strain grows like wild type on HA, CS-A, CS-C and DS in pure culture (PMID:30262663; PMID:32005816 'no impact on growth was observed, consistent with Δbt3328 mutant growth data'), and PMID:32005816 assigns the required HA lyase role to BT4410. GO:0030214 is kept but rebased on the enzyme's own catalysis of HA at the cell surface (IDA, PMID:30262663), the description and core_functions wording are corrected, and the fitness-versus-monoculture discrepancy is added to suggested_questions. Also contributed a DUFMech overlay for PF16315 (DUF4955), CultureBotAI/DUFMech PR 385, with one mechanistic causal graph for BtCDH and no edge assigning the chemistry to the DUF4955 interval.
