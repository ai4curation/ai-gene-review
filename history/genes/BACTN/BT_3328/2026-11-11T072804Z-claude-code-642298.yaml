  summary: 'Re-ran DeepTMHMM and SignalP 6.0: the KBase topology call is under-resolved,
    not a mis-call'
  details: |
    The review said the KBase DeepTMHMM topology call ('soluble/secreted') was probably a mis-call of a lipoprotein signal peptide. Both sequences were re-run on current DTU predictors via BioLib, outside the KBase pipeline (beril run 20261111T071416Z-deeptmhmm-signalp6-bt3328).

    DeepTMHMM 1.0 (DTU/DeepTMHMM:1.0.57) returns class SP with S 1-18 and O 19-868 for both the KBase query and Q8A2H7, exactly reproducing the dashboard, so the backend was not misconfigured. DeepTMHMM's label alphabet has a single S state for signal peptide, so it cannot separate Sec/SPI from Sec/SPII. SignalP 6.0 (DTU/SignalP-6:0.0.56, slow mode, organism other), which scores the classes separately, calls both sequences LIPO (Sec/SPII) with cleavage between 18 and 19, placing the lipidated cysteine at 19.

    So the characterisation 'mis-call' was wrong: DeepTMHMM's output is correct and consistent with a surface lipoprotein, and the call is under-resolved for signal-peptide type. What does not survive is the dashboard's derived gloss that the mature protein is soluble. The GO:0009279 conclusion is unchanged and now rests on a third independent line; its reason and the bioinformatics RESULTS.md are corrected, and the SignalP result is added to supported_by and to the file reference's findings.

    DeepTMHMM2 exists as a preprint (doi:10.64898/2026.08.24.746435) and as DTU/DeepTMHMM2 on BioLib but is not usable through pybiolib: the only retrievable output is a report built from a CLV3_ARATH example regardless of input, and override_command is refused. Both attempts are recorded with input_sequence_found_in_output false so they cannot be mistaken for results about this protein.

    No GO term, action or qualifier changed.
