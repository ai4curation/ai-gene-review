  summary: Give the contested endo-acting mode its own DISPUTED finding, so all four
    conflicts in this review are queryable
  details: |
    Follow-up to 5e118867d1. Splitting the DS claim left 'endo-acting' bundled in the undisputed statement, although PMID:32005816 contests the mode too, reading it from reducing-end-labelled oligosaccharides and reporting a minimum length of eight sugars. That was prose-only in reference_review.review_notes and suggested_questions.

    The mode now has its own statement with finding_status DISPUTED, superseded_by PMID:32005816 and both contesting quotes. The remaining undisputed statement carries the CS and HA activities and the PL29 family definition.

    Unlike the DS dispute, no annotation turns on the mode: GO:0030341 and GO:0030340 are mode-agnostic and GO has no endo-acting chondroitin AC lyase term, which the GO:0030341 reason already says. Recorded because the two readings are incompatible, not because a term depends on it.

    All four conflicts in this review are now structured the same way: DS activity, endo versus exo mode, the RB-TnSeq HA requirement, and the all-strains co-occurrence claim.

    No GO term, action or qualifier changed.
