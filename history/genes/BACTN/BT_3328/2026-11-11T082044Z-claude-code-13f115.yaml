  summary: 'Ran DeepTMHMM2 0.1.0 locally: it agrees with 1.x, assigns no membrane
    type, and does not resolve Sec/SPII either'
  details: |
    DeepTMHMM2 was installed from its own distribution, github.com/fteufel/DeepTMHMM2 (MIT; deeptmhmm2_predictor 0.1.0, CLI dtm2, commit 526f6c60f93c0868c7315413da8e669d12373cc3), and run on CPU with the repo's checkpoints and the esm2_t33_650M_UR50D encoder. No licence step, unlike DeepTMHMM 1.x. Run: projects/hackathon/runs/20261111T081528Z-deeptmhmm2-local-bt3328.

    Both the KBase query and Q8A2H7: type 'Globular + SP', segments signal 1-18 and outside 19-868, identical to DeepTMHMM 1.0.57. The membrane-type head, which covers 17 environments including the bacterial Gram-negative outer membrane, assigns no membrane type at all: all 21 probabilities are 0.0, the outer membrane included.

    That is the expected output for a lipid-anchored protein, which is tethered by acyl chains rather than embedded in the bilayer, so a predictor of membrane-spanning topology has nothing to report. DeepTMHMM2 also has no lipoprotein state (one 'signal' segment type, as 1.x has one 'S'), so it does not resolve Sec/SPI from Sec/SPII either: the under-resolution belongs to this family of predictors, not to one release.

    GO:0009279 is unchanged. The review now states explicitly that no topology predictor gives positive evidence for it and none contradicts it, and that the call rests on the lipoprotein signal peptide (SignalP 6.0 LIPO, UniProt FT LIPID 19, the acidic export motif) plus the experimental protease accessibility on intact cells.

    No GO term, action or qualifier changed.
