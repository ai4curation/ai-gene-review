  summary: Narrow the endo/exo dispute to the reducing-end datum; record the subsite
    requirement as an undisputed finding
  details: |
    Follow-up to the merged PR 5758, which merged at head 4fea080e7c and so did not include this change. It addresses the last review thread on that PR.

    The DISPUTED endo-acting finding cited two PMID:32005816 quotes. The second, the
    DP >= 8 minimum and the inference of at least eight subsites, does not contest endo
    versus exo and is not a disagreement at all: PMID:30262663 reports the same kind of
    observation at its own number, 'preferentially cleaves sugars with a degree of
    polymerization (DP) typically >=10', and draws the same conclusion, 'It may be
    possible that BtCDH contains over 10 subsites in its active site'. A many-subsite
    cleft is the signature of an endolyase; the exo-acting lyase of the same locus,
    BT3324PL8, is characterised the opposite way, 'releasing exclusively disaccharides
    from all the GAGs tested'. Carrying the quote as contesting evidence made the
    dispute look broader than it is.

    The dispute now rests on the reducing-end result alone, and the review_notes clause
    about minimum length is replaced by a statement that both papers read it the same
    way. The subsite requirement is recorded as its own undisputed finding on
    PMID:30262663 with that paper's own quote.

    No GO term, action or qualifier changed.
