  summary: Split the bundled PMID:30262663 finding so DISPUTED scopes to the dermatan
    sulfate claim alone, and narrow the duplicated CS-term question
  details: |
    Follow-up to 9bccdf9601.

    1. The PMID:30262663 finding bundled four claims (endo-acting mode, CS, DS, HA, and
       the PL29 family definition) under one finding_status, so marking it DISPUTED for
       the contested DS activity also marked the founding characterisation of PL29 as
       disputed, and the GO:0030341 row rests on a quote from it. The statement is now
       split: the CS and HA activities and the family definition stay undisputed, and a
       separate statement carries the DS claim with finding_status DISPUTED and
       superseded_by PMID:32005816.
    2. suggested_questions asked whether GO should have a chondroitin sulfate catabolic
       process term, which proposed_new_terms now answers. Narrowed to the open part,
       what parentage it should take and how it relates to GO:0030207.

    On superseded_by for the RB-TnSeq finding, the reviewer flagged that
    [PMID:30262663, PMID:32005816] includes a paper predating PMID:33657378. Left as
    is: the slot covers references that dispute a finding, the status is DISPUTED
    rather than OVERTURNED, and review_notes already explains that the 2018 deletion
    result is prior art the 2021 screen did not reconcile.

    No GO term, action or qualifier changed.
