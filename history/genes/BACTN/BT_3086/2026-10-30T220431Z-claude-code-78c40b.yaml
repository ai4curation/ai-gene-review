  summary: Replace GO:0033904 with a proposed mechanism-neutral alpha-1,6-glucan hydrolase
    activity term
  details: |
    The first pass asserted GO:0033904 dextranase activity while its own reason called the endo/exo question unresolved; GO:0033904 is defined as endohydrolysis, so the two conflicted. GO:0043896 commits the other way (exo-acting EC 3.2.1.70) and GO has no common parent asserting only linkage and substrate, so this adds a proposed_new_terms entry for alpha-1,6-glucan hydrolase activity (parent GO:0004553), repoints both MODIFY rows to it as an NTR replacement, sets proposed_molecular_function on the core function with molecular_function unset, and drops the NEW GO:0033904 ISS row. Notes record why the cleavage mode is genuinely open: the conserved subsite -2 pair excludes an alpha-glucosidase pocket but fits an isomaltose-releasing exodextranase as well as an endodextranase, the only product data is an overnight endpoint digest, and the ortholog transglycosylates.
