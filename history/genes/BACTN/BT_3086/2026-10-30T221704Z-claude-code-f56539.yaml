  details: |
    Review bot found two real errors. (1) The NTR justification claimed GO has 'two terms' for alpha-1,6-glucan hydrolysis and the MODIFY reason attributed the isomaltose-releasing exodextranase alternative to GO:0043896/EC 3.2.1.70, which releases glucose. Verified in OLS that the isomaltose-releasing enzyme is GO:0033923 (EC 3.2.1.94, isomaltodextranase, 'remove successive isomaltose units from the non-reducing ends'), and that GO:0004574 oligo-1,6-glucosidase (EC 3.2.1.10) is also in scope; justification, MODIFY reason, suggested_questions and notes now enumerate all four candidate terms and note that BT3086's glucose-plus-isomaltose mixture is exactly what would distinguish EC 3.2.1.70 from EC 3.2.1.94. (2) The BP MODIFY stopped at GO:0000272. OLS confirms GO:0030980 alpha-glucan catabolic process is_a GO:0009251 glucan catabolic process is_a GO:0000272, and dextran is an alpha-1,6-glucan, so the target is now GO:0030980, one level more specific than the bot's suggested GO:0009251. Also dropped the NEW GO:0000272 IC row for symmetry with the dropped NEW GO:0033904 row (both restated a MODIFY target), and changed 'secreted' to 'exported' in the description to avoid implying extracellular in a diderm.
