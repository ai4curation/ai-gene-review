events:
- type: EDIT
  outcome: changed
  summary: Add presequence feature analysis showing both cited N-terminal observations
    are within chance expectation
  details: |
    Added a local feature analysis to the existing bioinformatics folder for the
    presequence/location gap on this SUCLG2-type beta subunit, and wired it into the gap
    boundary. The gap KEEPS status OPEN. The result weakens the boundary's own
    observations rather than supporting them, which is the useful contribution.

    Why local. The OpenScientist service returned nothing for any submission after
    2026-11-26 19:52 (six runs, five genes; see genes/BACSU/plsY/plsY-notes.md), so this
    was done with local sequence analysis instead. It runs no targeting-sequence
    predictor - TargetP and MitoFates are not installed and there is no network - which
    is the same limitation the folder's existing RESULTS.md already recorded. What it
    adds is the piece that was missing: the expectation for each cited feature under the
    protein's own composition.

    New file: presequence_features.py (stdlib only, no network, hardcodes no results).
    The addendum section of RESULTS.md records the numbers. The pre-existing RESULTS.md
    text was appended to, not altered, and the quote the gap already took from it still
    verifies.

    The gap's boundary cites two observations about the 14-residue extension
    (MPIQRGIVASQVRF): "two arginines and no acidic residue". Against this protein's own
    background (acidic 54/409 = 0.132, basic 40/409 = 0.098):
    - P(zero acidic in 14 residues) = 0.138 - happens about one time in seven by chance
    - P(at least two basic in 14) = 0.404 - happens two times in five by chance
    Both cited features are therefore within chance expectation and neither
    discriminates. They are not the kind of signal a presequence call should rest on.

    Amphipathicity is the feature cleavable presequences actually display, since they
    form amphipathic helices, and here it is unremarkable: the extension's hydrophobic
    moment is +0.283, the 64th percentile of this protein's own 14-residue windows. That
    argues against a classical cleavable presequence rather than for one.

    One observation does point the right way: R13 sits at position -2 relative to the
    putative cleavage point, matching the mitochondrial processing peptidase preference
    for Arg at -2 or -3. But the cleavage point was assumed to be after residue 14 from
    the E. coli alignment, so an arginine at -2 is conditional on that assumption rather
    than independent support for it. Recorded as consistent, not as evidence. Noting this
    explicitly matters, because it would be easy to present as the positive finding.

    What this does not touch: whether the protein is mitochondrial. The family is, and
    that is what the electronic annotation reflects. What is weak is specifically the
    sequence-level case for a removed presequence in this gene model. And the start codon
    is unverified in a preliminary WGS entry, so if the model's start is wrong the
    analysed extension is not the real N-terminus and none of the numbers apply.

    No annotation action changed; no location term was added or altered. The gap's
    resolution still requires the experiments it already names.
