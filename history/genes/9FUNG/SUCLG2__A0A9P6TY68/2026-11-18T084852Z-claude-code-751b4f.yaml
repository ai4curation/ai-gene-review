  summary: 'Create review: SUCLG2 (A0A9P6TY68)'
  details: |
    New review of the Actinomortierella ambigua (Mortierellomycota) succinyl-CoA synthetase beta subunit SUCLG2 (UniProtKB:A0A9P6TY68, unreviewed), written as a follow-up to the evolutionary reviews of the beta family PTHR11815 and the alpha family PTHR11117. The entry has a submitter gene symbol shared with other fungal entries of the pooled mnemonic 9FUNG, so the folder is genes/9FUNG/SUCLG2__A0A9P6TY68. It is a SUCLG2-type (G-type) beta gene with Gln at position 20 of the mature subunit (Gln34 of this sequence) in a fungus that also has an A-type beta gene and one alpha gene.

    There is no literature on this gene product. The only paper on the entry is the genome paper PMID:33364917, fetched with just fetch-pmid and searched in full text; it does not mention the gene. The literature search log (12 PubMed and Europe PMC queries, run for the dossier of this review and not rerun) is in the notes file. The perplexity deep-research provider was not available; no provider file was written.

    All 9 GOA rows are IEA and all were reviewed. ACCEPT: GO:0004776 succinate-CoA ligase (GDP-forming) activity (TreeGrafter, from the PAINT gain at PTN000929335; accepted as core by descent and stated as unmeasured), GO:0006099 tricarboxylic acid cycle, GO:0006104 succinyl-CoA metabolic process, GO:0042709 succinate-CoA ligase complex (the row's evidence stops at the nucleotide-neutral complex) and GO:0005739 mitochondrion (root-organelle policy; no sub-compartment row added because only one line of evidence points to the matrix). MODIFY, both lateral corrections: GO:0004775 succinate-CoA ligase (ADP-forming) activity to GO:0004776, and GO:0005524 ATP binding to GO:0005525 GTP binding. KEEP_AS_NON_CORE: GO:0000287 magnesium ion binding. TOO_GENERAL: GO:0003824 catalytic activity. No NEW rows; no ND rows exist.

    Main finding. The ADP-forming name, EC number and GO:0004775 row come from UniRule UR000405968 (HAMAP MF_03219), the fallback rule for eukaryotic beta subunits; the GTP-specific and ATP-specific rules are limited to Metazoa and Amoebozoa (UniRule REST, read 2026-11-18), so the nucleotide is a default of the rule. GOA therefore gives this protein both the ADP-forming term and, from TreeGrafter, the GDP-forming term. A source defect on the rule is recorded as a check request with confidence SUSPECTED, because no enzyme of any Mortierellomycota species has been assayed.

    A small reproducible analysis was added (SUCLG2__A0A9P6TY68-bioinformatics: pairwise alignments, residue correspondences, inventory of the organism's subunits). The protein is 80.3% identical to Linnemannia A0A197JV50, one of the fungal genes that group with human SUCLG2 in the LSC2 trees, and 52.5% identical to the A-type beta subunit of its own genome. No tree contains the protein itself; no targeting predictor was run.

    Validation: just validate 9FUNG SUCLG2__A0A9P6TY68 passes with 0 errors; the two warnings are the uv environment-variable deprecation message captured from the term and reference validators and carry no content finding. Quote check: 69 verified, 0 failures. Four BIOLOGY knowledge gaps (nucleotide specificity, expression and alpha pairing, location and N-terminus, reason for retention of the G-type gene in this phylum).

    Follow-up after independent checks (same day). Three statements about UniRule UR000405968 were narrowed: the rule has no taxon limit below Eukaryota and catches only subunits that miss both dedicated HAMAP profiles (A0A9P6TY68 and Linnemannia A0A197JV50 fall to it; Lobosporangium A0A1Y2H5W1 hits MF_03221 and does not). The bioinformatics script now compares the N-terminus with the two closest ortholog models: residues 9 to 13 are shared with both, only residues 1 to 8 are specific to this model, and the Lobosporangium model has a 40-residue basic leader that this model lacks. A gene_model_issues entry (WRONG_START_SITE, SUSPECTED) was added, and the mitochondrion reason, the location knowledge gap and the start-codon question were reworded.
