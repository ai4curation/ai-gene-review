  summary: 'Wire OpenScientist validated negative: gatekeeper positions map cleanly
    but fail their own validation set'
  details: |
    Wired an OpenScientist run (kgap-suclg2-nucleotide-gatekeeper) into the knowledge
    gap asking whether the succinyl-CoA synthetase containing this beta subunit forms
    GTP or ATP. Status OPEN -> NARROWING. The verdict is a validated negative, and its
    two halves should be read separately: the gatekeeper positions map with high
    confidence, and they predict nothing.

    The run was designed to test the electrostatic-gatekeeper model from the
    Blastocystis work (carried forward from the BLAHN SCSa run earlier in this
    campaign), where residues inside the nucleotide site predicted GTP specificity
    while the enzyme is ATP-specific, and discrimination was attributed to two lysines
    whose side chains lie outside the cavity. The prompt warned that an alignment across
    this evolutionary distance could invent a result by setting a column wrongly.

    On mapping, that risk did not materialise. The two lysines are identified across
    three numbering systems; two independent methods (BLOSUM62 global alignment and
    Kabsch superposition of predicted models onto the liganded Blastocystis structure)
    agreed at 48 of 48 site-protein combinations; and the structural method
    independently reproduced the published proline assignment in the Thermus enzyme.
    The residues sit 6.98 and 5.21 A from bound ADP against 1.77 A for the contact
    glutamine, confirming they lie outside the cavity as published.

    On prediction, the model fails its own validation set. Across seven beta subunits
    of measured preference, basic character at either gatekeeper position does not
    separate GTP from ATP users (Fisher p = 1.000 at both), the contact glutamine fails
    equally (p = 1.000), and aggregate pocket charge fails at every radius (best p =
    0.115). The failures come from explicit counterexamples, not missing data: Thermus
    prefers GDP/GTP while carrying a basic arginine at the first gatekeeper position,
    whereas pig and human ATP-specific subunits carry aspartate there; Blastocystis is
    ATP-specific while carrying the glutamine supposed to mark GTP use; and E. coli and
    Thermus share a proline at the contact position despite opposite preferences.

    For this protein the two signals agree rather than conflict - it is identical to the
    pig and human G-type subunits at all six mapped positions and matches Blastocystis
    at one of six - but that agreement carries no weight, because these residues covary
    perfectly with subfamily membership among the animal paralogs. They restate the
    G-type assignment already recorded here, which is exactly the inference this gap
    identifies as unsupported. So specificity cannot be predicted from sequence or from
    an apo predicted model, and no GO term naming GTP or ATP is supportable.

    This is worth noting as a methodological result: the negative is strengthened, not
    weakened, by the mapping having succeeded. The model fails on its own validation
    set rather than for want of alignable positions, which is a stronger finding than
    "could not be tested".

    Verified here against this entry's own record (409 residues): all six mapped
    positions - Gln34, Glu56, Glu121, Leu123, Asp124, Phe233 - with Gln34 being the
    contact glutamine the gap already names. Not reproduced here: the cross-species
    superposition and alignment, the distances to bound ADP, the seven-protein panel
    and its statistics, and the charge-radius analysis.

    No annotation action changed, and no core function asserted.
