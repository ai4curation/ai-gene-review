  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene P21417 (UniProtKB:P21417). Reviewed 0 GO annotations, synthesized 0 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in P21417-notes.md.

    Biological summary: Uncharacterized 201-residue (22.8 kDa) protein (ORF201) encoded in the late operon intergenic region between spanin gene 15 and small terminase subunit gene 3 of Salmonella phage P22. It contains a phage Rha-like domain (InterPro:IPR014054, Pfam:PF09669, NCBIfam:TIGR02681) and a C-terminal ORF201 domain (InterPro:IPR018877, Pfam:PF10549) with similarity to Haemophilus influenzae HI_1412; deletion analysis shows that it is non-essential for lytic growth or lysogeny under standard laboratory conditions.
