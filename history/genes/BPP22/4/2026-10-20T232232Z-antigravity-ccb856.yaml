  summary: Complete end-to-end curation of Lederbergvirus P22 gene 4 (P26746)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene 4 (UniProtKB:P26746). Reviewed 11 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in 4-notes.md.

    Biological summary: Head-to-tail adapter protein (gp4) of Salmonella phage P22 that oligimerizes into a dodecameric ring (~75 Å tall) bound to the bottom of the dodecameric portal protein (gp1) after termination of headful viral DNA packaging. Monomeric gp4 is intrinsically unstable in solution and undergoes binding-induced folding upon docking to the portal vertex, forming a hollow bi-dodecameric neck channel that recruits the hexameric tail hub (gp10) and tailspikes (gp9) to complete virion assembly and serve as part of the conduit for viral DNA genome ejection into the host cell.
