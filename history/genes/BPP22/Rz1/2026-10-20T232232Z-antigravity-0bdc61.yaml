  summary: Complete end-to-end curation of Lederbergvirus P22 gene Rz1 (A8CGF6)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene Rz1 (UniProtKB:A8CGF6). Reviewed 3 GO annotations, synthesized 1 core function(s) across 8 literature/database references, and authored detailed mechanistic notes in Rz1-notes.md.

    Biological summary: Outer membrane lipoprotein spanin subunit (o-spanin Rz1) of Salmonella phage P22, encoded in an overlapping +1 reading frame embedded within the inner membrane spanin gene 15 (Rz). Synthesized as a 61-residue prolipoprotein, it is processed to a 33-residue mature periplasmic lipoprotein anchored to the inner leaflet of the host outer membrane and interacts via its C-terminus with the inner membrane subunit gp15 to form the periplasm-spanning spanin complex that disrupts the host outer membrane during viral release by cytolysis.
