  summary: Complete end-to-end curation of Lederbergvirus P22 gene gtrB (P57022)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene gtrB (UniProtKB:P57022). Reviewed 3 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in gtrB-notes.md.

    Biological summary: Bactoprenol glucosyltransferase GtrB of Salmonella phage P22 is a 310-amino-acid, two-transmembrane glycosyltransferase family 2 (GT2) enzyme of the host bacterial inner membrane (plasma membrane) encoded by the prophage-expressed gtrABC O-antigen conversion operon. GtrB catalyzes the transfer of a glucosyl residue from cytoplasmic UDP-glucose to undecaprenyl phosphate (bactoprenol phosphate), generating the lipid-linked glucose donor used by GtrA and GtrC to glucosylate the C-6 position of galactose in the host lipopolysaccharide O-antigen (converting Salmonella enterica serovar Typhimurium from serotype 4,12 to 1,4,12).
