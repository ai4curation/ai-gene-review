  summary: Complete end-to-end curation of Lederbergvirus P22 gene sieB (P38396)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene sieB (UniProtKB:P38396). Reviewed 3 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in sieB-notes.md.

    Biological summary: Superinfection exclusion protein B (SieB) of Salmonella phage P22 is a 192-amino-acid, two-transmembrane integral membrane protein expressed by the P22 prophage in lysogenic host cells. SieB mediates abortive superinfection exclusion against heteroimmune and P22-like phages lacking the P22 Esc escape determinant by arresting phage and host macromolecular synthesis midway through the lytic cycle.
