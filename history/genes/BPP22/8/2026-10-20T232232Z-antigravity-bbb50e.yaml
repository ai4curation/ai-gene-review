  summary: Complete end-to-end curation of Lederbergvirus P22 gene 8 (P26748)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene 8 (UniProtKB:P26748). Reviewed 3 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in 8-notes.md.

    Biological summary: Scaffolding protein (gp8) of Salmonella phage P22 that transiently forms the internal core of the procapsid and directs high-fidelity T=7 icosahedral capsid morphogenesis. It catalyzes oligomerization of the portal protein (gp1) into dodecameric rings to nucleate procapsid assembly, recruits the internal ejection proteins, and binds the N-arm of the major coat protein (gp5) via an electrostatic C-terminal helix-loop-helix motif before exiting intact upon viral DNA packaging to allow procapsid expansion and recycle into new assembly reactions.
