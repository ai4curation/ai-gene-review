  summary: Complete end-to-end curation of Lederbergvirus P22 gene 3 (P04893)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene 3 (UniProtKB:P04893). Reviewed 5 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in 3-notes.md.

    Biological summary: Terminase small subunit (gp3) of Salmonella phage P22 that assembles into a homononameric ring with a ~23 Å central channel and initiates headful viral DNA genome packaging. It recognizes the viral packaging initiation site (pac) and binds double-stranded DNA via its basic C-terminal tail (residues 140-162), recruits two protomers of the terminase large subunit (gp2) to form the viral terminase holoenzyme, and stimulates gp2 genome-packaging ATPase activity in a DNA-dependent manner.
