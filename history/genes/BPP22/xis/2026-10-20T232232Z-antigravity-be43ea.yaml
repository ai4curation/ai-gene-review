  summary: Complete end-to-end curation of Lederbergvirus P22 gene xis (P04889)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene xis (UniProtKB:P04889). Reviewed 3 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in xis-notes.md.

    Biological summary: Architectural DNA-binding excisionase (Xis, recombination directionality factor) of Salmonella phage P22 that binds cooperatively to four repeated motifs (X1-X4) within the attR attachment site and bends the DNA by approximately 137 degrees, promoting integrase-catalyzed excisive recombination (provirus excision) from the host chromosome.
