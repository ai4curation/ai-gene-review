  summary: Complete end-to-end curation of Lederbergvirus P22 gene gtrA (P57021)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene gtrA (UniProtKB:P57021). Reviewed 3 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in gtrA-notes.md.

    Biological summary: Bactoprenol-linked glucose translocase GtrA of Salmonella phage P22 is a 120-amino-acid, four-transmembrane integral protein of the host bacterial inner membrane (plasma membrane) encoded by the prophage-expressed gtrABC O-antigen conversion operon. GtrA functions as a flippase that translocates undecaprenyl-phosphate-glucose from the cytoplasmic face to the periplasmic face of the inner membrane, supplying the lipid-linked glucose donor for GtrC-mediated C-6 glucosylation of the host lipopolysaccharide O-antigen galactose unit (converting Salmonella enterica serovar Typhimurium from serotype 4,12 to 1,4,12).
