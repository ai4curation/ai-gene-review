  summary: Complete end-to-end curation of Lederbergvirus P22 gene ral (P14113)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene ral (UniProtKB:P14113). Reviewed 4 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in ral-notes.md.

    Biological summary: Antirestriction protein Ral of Salmonella phage P22 (homolog of phage lambda Ral) that enables unmodified phage DNA to evade host Type I restriction-modification systems by modulating the host restriction-modification methyltransferase to methylate unmethylated recognition sites rather than cleaving them.
