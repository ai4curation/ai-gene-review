  summary: Complete end-to-end curation of Lederbergvirus P22 gene sieA (Q38674)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene sieA (UniProtKB:Q38674). Reviewed 7 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in sieA-notes.md.

    Biological summary: Superinfection exclusion protein A (SieA) of Salmonella phage P22 is a 164-amino-acid, three-transmembrane integral protein of the host bacterial inner membrane (plasma membrane) expressed by the prophage during lysogeny. SieA is necessary and sufficient for the P22 SieA superinfection exclusion system, which prevents DNA translocation across the host inner membrane by superinfecting P22-like phages and P22 generalized transducing particles by interfering with the assembly or function of the periplasmic gp20 and inner-membrane gp16 DNA delivery conduit.
