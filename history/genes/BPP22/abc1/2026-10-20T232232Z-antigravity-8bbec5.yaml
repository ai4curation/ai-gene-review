  summary: Complete end-to-end curation of Lederbergvirus P22 gene abc1 (P11190)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene abc1 (UniProtKB:P11190). Reviewed 2 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in abc1-notes.md.

    Biological summary: Anti-RecBCD protein 1 (Abc1) of Salmonella phage P22, a 10.9-kDa winged-helix protein encoded in the PL recombination operon that contributes with Abc2 to modulating the host RecBCD helicase-nuclease complex, protecting linear viral double-stranded DNA from exonucleolytic degradation during phage recombination in the host cell cytoplasm.
