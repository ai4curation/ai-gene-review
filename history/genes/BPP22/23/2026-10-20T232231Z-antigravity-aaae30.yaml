  summary: Complete end-to-end curation of Lederbergvirus P22 gene 23 (P57020)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene 23 (UniProtKB:P57020). Reviewed 7 GO annotations, synthesized 1 core function(s) across 6 literature/database references, and authored detailed mechanistic notes in 23-notes.md.

    Biological summary: Late gene transcriptional antiterminator gp23 (homolog of phage lambda Q) of Salmonella phage P22 that binds the DNA Q-binding element (QBE) at the late promoter PR' via a C-terminal helix-turn-helix motif and C4 zinc finger, loads onto paused host RNA polymerase, and modifies the elongation complex to read through the late transcription terminator into the lysis and morphogenetic gene cluster.
