  summary: Complete end-to-end curation of Lederbergvirus P22 gene 2 (P26745)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene 2 (UniProtKB:P26745). Reviewed 12 GO annotations, synthesized 2 core function(s) across 9 literature/database references, and authored detailed mechanistic notes in 2-notes.md.

    Biological summary: Terminase large subunit (gp2) of Salmonella phage P22 that serves as the catalytic motor and endonuclease of the viral terminase complex during headful DNA genome packaging. It comprises an N-terminal P-loop ATPase domain (residues 1-271) that binds the small terminase subunit (gp3) and hydrolyzes ATP to translocate viral DNA into the procapsid, and a C-terminal RNase H-like endonuclease domain (residues 289-499) that coordinates two Mg2+ ions to cleave concatemeric viral dsDNA at packaging initiation and headful termination.
