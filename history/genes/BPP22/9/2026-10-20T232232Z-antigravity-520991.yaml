  summary: Complete end-to-end curation of Lederbergvirus P22 gene 9 (P12528)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene 9 (UniProtKB:P12528). Reviewed 16 GO annotations, synthesized 1 core function(s) across 9 literature/database references, and authored detailed mechanistic notes in 9-notes.md.

    Biological summary: Tailspike protein (gp9) of Salmonella phage P22 that assembles into six thermostable 215-kDa homotrimers anchored radially around the hexameric tail hub (gp10) via an N-terminal dome-like head-binding domain (residues 1-124). Its central 13-turn right-handed parallel beta-helix domain (residues 143-540; GH90 family) specifically binds the O-antigen polysaccharide of Salmonella serogroups A, B, and D1 lipopolysaccharide (LPS) to mediate initial virion attachment and catalyzes endo-1,3-alpha-L-rhamnosidase cleavage (via catalytic triad Glu359, Asp392, Asp395) of the O-antigen chain, driving the virion toward the outer membrane to force insertion of the gp26 tail needle and trigger viral DNA genome ejection.
