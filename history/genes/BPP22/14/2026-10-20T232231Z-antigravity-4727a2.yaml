  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene 14 (UniProtKB:Q01075). Reviewed 0 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in 14-notes.md.

    Biological summary: Morphogenetic gene product gp14 (151 AA) of Salmonella phage P22, encoded between the tail needle gene 26 and the internal ejection protein gene 7 within the late morphogenetic operon and comprising a conserved DUF2824 domain (IPR022568 / PF11039). Although mapped genetically to the late morphogenetic cluster, gp14 is not packaged into mature virions and its specific molecular function in phage development remains uncharacterized.
