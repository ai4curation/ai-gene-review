  summary: Complete end-to-end curation of Lederbergvirus P22 gene 20 (Q01076)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene 20 (UniProtKB:Q01076). Reviewed 6 GO annotations, synthesized 1 core function(s) across 6 literature/database references, and authored detailed mechanistic notes in 20-notes.md.

    Biological summary: Internal virion ejection protein (gp20, 471 AA) of Salmonella phage P22 that is packaged at approximately 10 to 20 copies per procapsid via the scaffolding protein gp8. Upon virion binding to host lipopolysaccharide and outer membrane protein OmpA and release of the gp26 plug, gp20 is ejected prior to the viral genome and assembles into the outer-membrane-periplasmic channel spanning the host periplasm, linking the extracellular gp7* channel to the inner-membrane gp16 pore within the ~40 nm trans-envelope DNA translocation apparatus while serving with gp16 as a co-target of prophage SieA-mediated superinfection exclusion.
