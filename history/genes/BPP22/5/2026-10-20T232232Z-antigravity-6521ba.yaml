  summary: Complete end-to-end curation of Lederbergvirus P22 gene 5 (P26747)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene 5 (UniProtKB:P26747). Reviewed 14 GO annotations, synthesized 1 core function(s) across 8 literature/database references, and authored detailed mechanistic notes in 5-notes.md.

    Biological summary: Major capsid protein (gp5) of Salmonella phage P22 that assembles into the T=7 laevo icosahedral procapsid shell (415 subunits arranged as 60 hexons and 11 pentons) around the scaffolding protein (gp8) core and single portal vertex (gp1). It adopts an HK97-like core fold augmented by an inserted 124-residue telokin-like immunoglobulin domain (I-domain) whose D-loops staple adjacent capsomers across 2-fold axes, and undergoes a major conformational expansion during viral DNA packaging to form the stable mature virion capsid without chemical crosslinks or cementing proteins.
