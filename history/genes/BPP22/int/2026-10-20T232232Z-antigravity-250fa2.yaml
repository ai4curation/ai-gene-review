  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene int (UniProtKB:P04890). Reviewed 10 GO annotations, synthesized 1 core function(s) across 6 literature/database references, and authored detailed mechanistic notes in int-notes.md.

    Biological summary: Site-specific tyrosine recombinase (Integrase, Int) of Salmonella phage P22 that catalyzes integrative recombination between the phage attachment site (attP) and the host Salmonella thrW tRNA gene attachment site (attB/ataA) to establish an integrated prophage, and in conjunction with excisionase (Xis) catalyzes excisive recombination (attL x attR) during prophage induction.
