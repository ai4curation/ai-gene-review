  summary: Complete end-to-end curation of Lederbergvirus P22 gene P57019 (P57019)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene P57019 (UniProtKB:P57019). Reviewed 3 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in P57019-notes.md.

    Biological summary: Serotype-converting O-antigen alpha-1,6-glucosyltransferase GtrC (also designated ORF485 or ConC) of Salmonella phage P22. Encoded as the third gene of the three-gene gtrABC lysogenic conversion operon alongside the bactoprenol glucosyltransferase GtrB and the flippase GtrA, it is a 485-residue multi-pass host membrane protein with 10 transmembrane helices (InterPro:IPR025686, Pfam:PF14264) that transfers glucosyl residues from undecaprenyl-phosphate-glucose onto the galactosyl moiety of the Salmonella enterica lipopolysaccharide O-antigen repeat unit, converting the host surface antigen from serotype O:4,[5],12 to O:1,4,[5],12.
