  summary: Complete end-to-end curation of Lederbergvirus P22 gene ant (P03037)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene ant (UniProtKB:P03037). Reviewed 3 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in ant-notes.md.

    Biological summary: Antirepressor protein (Ant) encoded in the immI region of Salmonella phage P22 that binds and non-covalently inhibits the P22 C2 immunity repressor (as well as the cI repressors of related lambdoid phages such as lambda and 434), preventing operator DNA binding to derepress early lytic transcription and trigger release from viral latency.
