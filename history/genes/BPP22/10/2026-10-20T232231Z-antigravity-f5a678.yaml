  summary: Complete end-to-end curation of Lederbergvirus P22 gene 10 (P26749)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene 10 (UniProtKB:P26749). Reviewed 4 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in 10-notes.md.

    Biological summary: Tail hub protein (gp10) of Salmonella phage P22 that assembles into a hexameric beta-propeller-like baseplate hub attached to the distal face of the dodecameric head-to-tail adapter ring (gp4). It serves as the central structural organizer of the distal tail apparatus by docking the six lateral homotrimeric tailspikes (gp9) and anchoring the N-terminal plug domain of the trimeric tail needle (gp26) within its central channel, and after tail needle release during infection it forms the base from which the ejected gp7* extracellular channel extends to deliver the viral DNA genome into the host cell.
