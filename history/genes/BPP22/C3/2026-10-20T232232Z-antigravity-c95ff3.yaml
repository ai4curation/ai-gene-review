  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene C3 (UniProtKB:P14110). Reviewed 2 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in C3-notes.md.

    Biological summary: Peptidase inhibitor (C3, homolog of phage lambda cIII, MEROPS family I75) of Salmonella phage P22 that promotes the establishment of lysogeny by inhibiting host protease-mediated degradation of the unstable phage transcriptional activator C1 (cII homolog), thereby stabilizing C1 to activate c2 repressor transcription.
