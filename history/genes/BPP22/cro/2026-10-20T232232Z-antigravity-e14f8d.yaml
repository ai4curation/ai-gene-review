  summary: Complete end-to-end curation of Lederbergvirus P22 gene cro (P09964)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene cro (UniProtKB:P09964). Reviewed 3 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in cro-notes.md.

    Biological summary: Transcriptional repressor (Cro) of Salmonella phage P22 that favors lytic development over lysogeny by binding specifically to the OL and OR operator sites (with highest affinity for OR3) via an all-alpha-helical helix-turn-helix fold, repressing c2 repressor transcription from PRM and down-regulating early lytic transcription from PL and PR.
