  summary: Complete end-to-end curation of Lederbergvirus P22 gene C2 (P69202)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene C2 (UniProtKB:P69202). Reviewed 6 GO annotations, synthesized 2 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in C2-notes.md.

    Biological summary: Primary immunity repressor (C2) of Salmonella phage P22 that establishes and maintains the lysogenic state by binding cooperatively to the OL and OR operator sites via an N-terminal Cro/C1-type helix-turn-helix DNA-binding domain, repressing transcription of early lytic genes from the PL and PR promoters. Contains a C-terminal LexA/cI-like Peptidase S24 domain that undergoes RecA-stimulated intramolecular autoproteolysis during the host SOS response, inactivating the repressor and triggering prophage induction (release from viral latency).
