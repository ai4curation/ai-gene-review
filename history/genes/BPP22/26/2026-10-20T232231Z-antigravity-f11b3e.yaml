  summary: Complete end-to-end curation of Lederbergvirus P22 gene 26 (P35837)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene 26 (UniProtKB:P35837). Reviewed 7 GO annotations, synthesized 1 core function(s) across 7 literature/database references, and authored detailed mechanistic notes in 26-notes.md.

    Biological summary: Tail needle protein (gp26) of Salmonella phage P22 that assembles into an ultra-stable 240-Å-long homotrimeric coiled-coil fiber at the distal tip of the central tail axis. Its N-terminal 60 residues adopt an extended pre-ejection conformation inside the hexameric tail hub (gp10) to plug the portal-tail channel and trap the pressurized dsDNA genome inside the mature virion, while its C-terminal inverted coiled-coil tip penetrates the host outer membrane upon tailspike-mediated LPS hydrolysis and dissociates from the tail hub to trigger ejection of the internal pilot proteins and viral genome.
