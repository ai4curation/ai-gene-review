    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene 17 (UniProtKB:P14109). Reviewed 0 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in 17-notes.md.

    Biological summary: Protein gp17 of Salmonella phage P22 is a 103-amino-acid early protein encoded in the leftward P_L operon between orf80 and orf56/c3. While non-essential on prophage-free hosts, gp17 is required for P22 to overcome a superinfection exclusion system encoded by the resident Fels-2 (fel-2) prophage in Salmonella enterica.
