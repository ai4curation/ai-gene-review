  summary: Complete end-to-end curation of Lederbergvirus P22 gene 19 (P09963)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene 19 (UniProtKB:P09963). Reviewed 10 GO annotations, synthesized 1 core function(s) across 11 literature/database references, and authored detailed mechanistic notes in 19-notes.md.

    Biological summary: Endolysin (lysozyme / muramidase, EC 3.2.1.17) of Salmonella phage P22 belonging to glycoside hydrolase family 24 (GH24). Synthesized during the late lytic phase, gp19 accumulates in the host cell cytoplasm until the class I holin gp13 forms micron-scale pores in the inner membrane, allowing gp19 to escape into the periplasm where it hydrolyzes beta-(1->4) glycosidic linkages between N-acetylmuramic acid and N-acetyl-D-glucosamine in the host peptidoglycan sacculus. Together with the gp13 holin and the gp15-Rz1 spanin complex, gp19 mediates programmed host cell lysis to release mature progeny virions.
