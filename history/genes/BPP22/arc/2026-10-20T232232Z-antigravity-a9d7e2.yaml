  summary: Complete end-to-end curation of Lederbergvirus P22 gene arc (P03050)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene arc (UniProtKB:P03050). Reviewed 4 GO annotations, synthesized 1 core function(s) across 7 literature/database references, and authored detailed mechanistic notes in arc-notes.md.

    Biological summary: Ribbon-helix-helix transcriptional repressor (Arc) of the Salmonella phage P22 immI region that negatively regulates its own synthesis and that of the Ant antirepressor during lytic growth by cooperative binding of two homodimers (forming a DNA-bound homotetramer) to a 21-bp operator at the Pant promoter via an antiparallel beta-sheet DNA-recognition motif.
