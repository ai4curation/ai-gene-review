  summary: Complete end-to-end curation of Lederbergvirus P22 gene 13 (P09962)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene 13 (UniProtKB:P09962). Reviewed 3 GO annotations, synthesized 1 core function(s) across 8 literature/database references, and authored detailed mechanistic notes in 13-notes.md.

    Biological summary: Class I holin and dual-start antiholin of Salmonella phage P22 that control the timing of host cell lysis at the end of the lytic cycle. Alternative translational initiation at Met1 and Met4 produces a 108-amino-acid antiholin (lysis inhibitor 13-108, P09962-1) with two transmembrane helices and a 105-amino-acid active holin (lysis protein 13-105, P09962-2) with three transmembrane helices in the host cell inner membrane. The holin isoform accumulates in the cytoplasmic membrane until it reaches a critical concentration and oligomerizes into micron-scale pores that disrupt the inner membrane and allow the cytoplasmic endolysin gp19 to escape into the periplasm, while the antiholin isoform binds the holin to inhibit premature multimerization and pore formation.
