  summary: Complete end-to-end curation of Lederbergvirus P22 gene 7 (Q01074)
  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene 7 (UniProtKB:Q01074). Reviewed 7 GO annotations, synthesized 1 core function(s) across 7 literature/database references, and authored detailed mechanistic notes in 7-notes.md.

    Biological summary: Internal virion ejection protein (gp7) of Salmonella phage P22 that is packaged at approximately 10 to 20 copies inside the procapsid via the scaffolding protein gp8 and proteolytically matured by host oligopeptidase A (OpdA) through removal of its N-terminal 20 residues (producing gp7*). Upon virion adsorption to host lipopolysaccharide and outer membrane protein OmpA and release of the gp26 tail needle, gp7* is ejected ahead of the viral DNA and assembles into the extracellular channel bridging the gp10 tail hub to the host outer membrane as part of the ~40 nm trans-envelope genome delivery conduit.
