    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene eaa (UniProtKB:Q03544). Reviewed 0 GO annotations, synthesized 0 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in eaa-notes.md.

    Biological summary: Protein EaA of Salmonella phage P22 is a 317-amino-acid early accessory protein encoded in the non-essential ea region between int and erf, detected in UV-irradiated host cells infected with P22. EaA contains an N-terminal MazZ-like dATP/dGTP diphosphohydrolase domain (IPR007538 / PF04447) and a C-terminal DUF551 domain (IPR007539 / PF04448), but its specific physiological role during phage infection has not been experimentally determined.
