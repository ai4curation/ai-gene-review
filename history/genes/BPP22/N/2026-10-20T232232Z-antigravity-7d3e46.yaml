  details: |
    Completed comprehensive gene review for Lederbergvirus P22 (NCBITaxon:10754) gene N (UniProtKB:P04891). Reviewed 4 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in N-notes.md.

