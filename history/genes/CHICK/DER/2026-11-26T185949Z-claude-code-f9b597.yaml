  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N29). GO:0006006 glucose metabolic process: the IBD at the family root PTN001211870 is seeded by human, mouse and rat DCXR (IDA, PMID:11882650). The earlier reason said the donors were in a sister subfamily; in the tree chicken DER lies in the amniote clade PTN001211873 (27 leaves) with all three seeds, as the bird and reptile counterpart of the mammalian DCXR and Cbr2 clade. The claim follows from the inherited L-xylulose reductase activity, which this review already keeps as non-core, and the human DCXR review keeps the same term as non-core. Action changed from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE; summary, reason, propagation_review rewritten and the PMID:11882650 quote replaced by the uronate cycle sentence from the same abstract. Validated with just validate CHICK DER.
