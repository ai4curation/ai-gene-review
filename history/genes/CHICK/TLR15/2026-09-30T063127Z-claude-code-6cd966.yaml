  summary: 'Create review: TLR15'
  details: |
    Created the full review for chicken TLR15 (A0A8V0Z0H8) in INNATE_IMMUNITY batch 1. Entry identity confirmed first, since the record is unreviewed TrEMBL: Ensembl ENSGALG00010016958 resolves to NCBI Gene 421219 TLR15, so this accession is the right gene (the project table had listed Q2XQ10, whose submitter name is Toll-like receptor 2). All 7 rows reviewed: GO:0002224 IBA modified to GO:0035681 toll-like receptor 15 signaling pathway; GO:0005886 IBA and GO:0038023 IBA accepted; GO:0007165, GO:0016020 and GO:0043235 kept as non-core; GO:0042497 triacyl lipopeptide binding REMOVED as an over-propagated ligand specificity from human TLR2, since TLR15 is an avian/reptilian receptor with no TLR2 orthology and acylated lipopeptides were experimentally shown not to activate it. The other project-relevant decision is deliberate: GO:0038023 was NOT upgraded to GO:0038187, because this receptor is activated by proteolytic cleavage of its own ectodomain rather than by binding a pathogen-associated pattern. Validation: clean.
