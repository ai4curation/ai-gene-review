  summary: 'Cross-check review against Falcon deep research: TLR15'
  details: |
    Compared TLR15-deep-research-falcon.md with the completed review; it surfaced four later papers, all fetched and read. PMID:36605191 shows the gene is an ancient jawed-vertebrate lineage with orthologues in lungfish and holocephalan cartilaginous fish, correcting the birds-and-reptiles-only wording, and strengthens the GO:0042497 REMOVE structurally (distinct subfamily; single-domain ectodomain rather than the TLR1-family three-domain architecture in which the lipopeptide site is built). PMID:37079400 gives TIR-domain dimer crystal structures and an argument for MyD88, so the GO:0043235 reason no longer says the complex composition is unknown (homodimer likely; still non-core). PMID:33514434 adds gain/loss-of-function support in DF-1 cells to the pathway row. PMID:40639002 shows the one candidate protein ligand is itself a protease, cited in the GO:0038023 reason. No annotation action changed and no NEW term: the Eimeria evidence is fibroblast-line signalling with a candidate ligand the authors call potential, so it became a suggested question instead. Also removed duplicated reference entries.
