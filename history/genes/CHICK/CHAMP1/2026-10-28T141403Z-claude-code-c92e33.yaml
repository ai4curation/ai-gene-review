  summary: 'Create review: CHAMP1'
  details: |
    New review of chicken CHAMP1 (A0A8V0YM97, TrEMBL; GeneID 418733). All 10 GOA rows are IEA transfers from human Q96JM3. Accepted kinetochore, spindle, condensed chromosome, nucleus, nucleoplasm, sister chromatid biorientation and attachment of mitotic spindle microtubules to kinetochore on the basis of human experimental work (PMID:21063390, PMID:28887307) and conserved CAMP family signatures; kept nuclear body and protein localization to kinetochore as non-core; marked protein localization to microtubule UNDECIDED because the human REV7-binding WK motif is not clearly conserved in the diverged chicken repeat region (own sequence comparison in CHAMP1-bioinformatics). Added the chicken H3K9me3 pull-down (PMID:26703087) as the only chicken datum. The workflow-designated paper PMID:22448145 concerns MARS2 and was not used. No NEW rows.
