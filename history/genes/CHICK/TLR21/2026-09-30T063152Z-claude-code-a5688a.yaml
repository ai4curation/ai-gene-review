  summary: 'Create review: TLR21'
  details: |
    Created the full review for chicken TLR21 (A0A8V0ZKW5) in INNATE_IMMUNITY batch 1. Entry identity checked because the record is unreviewed TrEMBL with only an Ensembl cross-reference: Ensembl ENSGALG00010023066 resolves to NCBI Gene 415623 TLR21, so the accession is the right gene, though the model is longer than the cDNAs used in the functional literature. All 5 rows (all electronic) reviewed: GO:0002224 IBA modified to GO:0035682 toll-like receptor 21 signaling pathway; GO:0038023 IBA modified to GO:0038187 pattern recognition receptor activity; GO:0005886 IBA modified to GO:0005768 endosome (the receptor is ER-resident when resting and its activation requires endosomal maturation); GO:0007165 and GO:0016020 kept as non-core. GO:0045322 unmethylated CpG binding was considered and deliberately not proposed, because no direct binding assay exists for the chicken receptor and even human TLR9 holds that term only by similarity. Project-relevant point: the wrong transfer to avoid here would be a TLR9 term, since the resemblance is convergence on a ligand rather than orthology, and GOA has correctly not made it. Validation: clean.
