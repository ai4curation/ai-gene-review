  summary: 'Cross-check review against Falcon deep research: TLR21'
  details: |
    Compared TLR21-deep-research-falcon.md with the completed review; the report agrees throughout and added one substantive item, which was traced from its preprint citation to the published paper and fetched as PMID:37951324. Added one NEW annotation, GO:0032728 positive regulation of interferon-beta production (IMP): chicken TLR21 triggers NF-kappa-B activation and a potent type I interferon response in chicken macrophages, and interferon-beta transcription downstream of it depends on NF-kappa-B and IRF7 but not TBK1. Participation is the receptor's own sensing step; the comparator check found human TLR9 and mouse Tlr9 carrying GO:0032728 by IDA (PMID:16286015, PMID:15356140, checked in QuickGO) and human TLR3 by IDA/IMP, and the term is neither ancestor nor descendant of the proposed GO:0035682. Added to core_functions and to description. No existing annotation action changed. CpG-adjuvant and in-ovo vaccination work not used, being ligand application rather than gene-product function.
