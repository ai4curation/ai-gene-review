  summary: 'Create review: BTBD3'
  details: |
    New review of chicken BTBD3 (F1NI11, TrEMBL) for the RAR_MISANNOTATION project, re-examining the Wei et al. 2020 (PMID:32470107) flag on GO:0021987 cerebral cortex development. All six GOA rows reviewed: dendrite morphogenesis IBA and cytosol IBA accepted (mouse Btbd3 PMID:24179155 donor); cytoplasm IEA modified to cytosol; neurogenesis IBA marked too general; identical protein binding IEA kept as non-core; cerebral cortex development IBA modified to GO:0021543 pallium development as a term-scoping problem, because birds lack the layered cortex the GO definition requires and avian pallium-neocortex homology is disputed (PMID:23027930, PMID:39946453), while the gene-level node PTN002908884 is otherwise sound. Literature notes written manually because Falcon deep research failed (auth).
