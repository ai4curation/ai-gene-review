  summary: 'Create review: K5'
  details: |
    De-novo review of KSHV K5/MIR2 (P90489): all 23 GOA rows judged - 12 ACCEPT, 6 REMOVE (4 bare protein-binding rows from the Uetz intraviral Y2H screen plus both GO:0075509 rows), 3 TOO_GENERAL, 1 MODIFY, 1 KEEP_AS_NON_CORE - with two core functions and twelve adjudicated references added. All four CACAO rows come from PMID:23460925, which is cached with full text, so each was judged against the figures rather than the abstract. Three are accepted (GO:0006511, GO:0039504, GO:0039648); GO:0075509 endocytosis involved in viral entry is removed as host-receptor endocytosis read as viral-entry endocytosis - the endocytosed entity is the host lectin DC-SIGN, the paper's only entry data were collected with a virus lacking K3 and K5, and the authors read K5's effect as reducing superinfection - with its ARBA echo removed for consistency. GO:0039502 is modified to GO:0140884 (type II interferon), with a UniProt source defect recorded against the class-neutral KW-1114 to type-I-specific GO mapping. GONUTS was offline, so the student's own evidence page could not be consulted.
