  summary: 'RADICAL_SAM Phase 3: applied the generic-row treatment rule'
  details: |
    RADICAL_SAM Phase 3 consistency pass: applied the project's treatment rule for the domain-derived generic rows (projects/RADICAL_SAM.md) to this pre-existing review.

    Action changes: GO:0003824 MARK_AS_OVER_ANNOTATED -> KEEP_AS_NON_CORE; GO:0051536 ACCEPT -> MODIFY; GO:0051539 ACCEPT -> KEEP_AS_NON_CORE.

    Core molecular function withdrawn: GO:0051539; nothing is established for this protein (PE 4, unreviewed submitter name, reaction row UNDECIDED), so it now asserts no core molecular function, matching the project's other uncharacterised members.

    Also dropped the entry's directly_involved_in GO:1901115 erythromycin biosynthetic process. Its supported_by, after the DE-label quote was removed under the UniProt-label policy, held only the two radical SAM family signatures, which say nothing about erythromycin; the record has no CC:PATHWAY line and no erythromycin keyword, so the only pathway signal is the submitter gene name this same review discounts when declining to name a molecular function. The entry now asserts no term at all, matching PSEPK/PP_1969 and PSEPK/PP_2482.

    Reasons were rewritten so the action matches the argument; `just backfill-record-sections` derived record_section for the new UniProt quotes. Validation passes with no errors. The rule is now checked in code over this gene via projects/RADICAL_SAM/data/phase3_scope.yaml.

    Second review round: removing GO:1901115 from core_functions left the GO:0033068 row's summary asserting that the term was 'captured in core_functions', which was then false and was the file's only remaining mention of it. Rewrote that row. The ACCEPT is kept but is now grounded on family membership rather than on the gene name: GO:0033068 is an InterPro2GO mapping and the entry matches three independent DesII-family signatures (InterPro IPR016863 DesII, NCBIfam TIGR04426 rSAM_desII, SFLD SFLDG01116 DesII-like), which place the protein in macrolide deoxysugar biosynthesis without relying on the unreviewed submitter annotation. The genus term follows from the family; the erythromycin-specific child GO:1901115 would need this cluster to be the erythromycin one, which rests only on that submitter name, so it is neither asserted nor proposed. Adjusted the core_functions description accordingly: it had said nothing places the protein in a pathway, which contradicted the accepted row; the family does, but a pathway without an established activity is not a core function.

    Third review round: the GO:0033068 row's action was still ACCEPT, which contradicted the reason the previous round gave it. ACCEPT means retain as representing the core function, but this review asserts no core molecular function and no core process, so a pathway term with no established activity behind it cannot be that. Changed to KEEP_AS_NON_CORE, matching GO:0003824 in this same review and every retained row in PSEPK/PP_1969 and PSEPK/PP_2482. Strengthened the evidence while there: the GOA row's WITH/FROM names InterPro:IPR016863, so the first quote is the signature the InterPro2GO mapping actually fired on rather than merely a consistent one, and added the substrate-level SFLD SFLDF00425 dTDP-4-amino-4,6-dideoxy-D-glucose signature, which names the desosamine precursor and is a tighter match to the claim than the family-level signatures alone. Also quoted the InterPro and SFLD DesII-like signatures in the core function's supported_by, so every family the description names is backed by a quote.

    Follow-up: the action change left one consequential wording behind. The core function's description still said the GO:0033068 row 'is accepted on that basis', which was no longer true once the row became KEEP_AS_NON_CORE. Reworded to say it is kept, and kept as non-core, with the reason stated: a pathway with no established activity behind it is not a core function.

    Fifth round: two row summaries still credited the UniProt iron/iron-sulfur/SAM keywords as their basis, on GO:0051539 and GO:0051536, after this pass replaced both rows' supported_by with the Pfam PF04055 and NCBIfam TIGR04426 signature quotes. Those keywords carry only ARBA evidence (ECO:0000256|ARBA), which the repository policy excludes twice over, as an unvetted prediction and as a label, so the summaries named as support the one kind of evidence the rows had deliberately stopped citing. Both now state the signature match they actually rest on. The reference_review note at the top of the file still observes that those keywords are consistent with a radical SAM enzyme; that is a reviewer's note rather than an evidence claim, and it predates this pass, so it is left as it is.

    Sixth round: replacing the keyword credits with named signatures made the attribution checkable, and it checked off. The GOA WITH/FROM column says which InterPro entry each InterPro2GO row fired on, and the record matches both: GO:0051536 fired on IPR007197 rSAM, GO:0051539 and GO:0033068 on IPR016863 DesII. GO:0051539's quote and new summary named Pfam PF04055, which belongs to IPR007197 -- the one entry that row did not fire on -- so the attribution was inverted, and GO:0051536 carried the TIGR04426 quote that belongs to the other entry. Each of the three rows now leads with the InterPro entry its own GOA row cites, with the member signature beside it and any other match named as corroboration rather than as the source. This is the standard the GO:0033068 row set two rounds earlier; the other two rows now meet it.
