  summary: 'Create review: Map2k4'
  details: |
    De novo review of rat Map2k4 (A0ABK0L269, RGD:1307040). All 35 GOA rows reviewed against cached literature (full text for PMID:20550965, 12514131, 9487126, 10521398) and the human MAP2K4 review. Core functions are JUN kinase kinase activity in the JNK cascade and MAP kinase kinase activity toward p38 (minor, stimulus-dependent). Generic kinase rows refined to MAP kinase kinase activity; MAPK cascade ISO rows refined to JNK and p38 cascades. The NMJ development ISO was removed as a wrong-gene propagation (mouse source cites an ErbB2 paper with an Erbb2 allele) and the motor neuron apoptosis ISO was corrected from negative to positive regulation, both recorded as source defects. Manual deep-research and notes files added.
