  summary: 'Create review: Capn3'
  details: |
    Created the rat Capn3 (P16259) review: all 105 GOA rows reviewed. Core functions are calcium-dependent cysteine endopeptidase activity with calcium-dependent autolysis in titin-bound myofibrillar calpain-3, and a non-proteolytic adaptor role at the triad that supports SR calcium release (mouse evidence). Root catalytic/peptidase terms were refined to GO:0004198. Sodium-dependent autolysis was kept as non-core and sodium ion binding left undecided because PMID:37298357 reproduces the sodium effect only in the absence of potassium. Programmed cell death, salt stress and the transcription terms were marked over-annotated. Positive regulation of satellite cell activation was modified to regulation of myoblast differentiation. Source defects were recorded for the mouse programmed-cell-death and satellite-cell-activation donor rows, for the RyR1 signaling-receptor-binding term, and for the titin-binding IDA evidence code. No NEW annotations were proposed.
