  details: |
    Created the first review of rat Stat3 (P52631): all 318 GOA rows over 142 terms reviewed using cached rat literature (including full text of PMID:19450559 and PMID:22284190) and the UniProt record, with a manual literature synthesis since no deep-research provider was available. Core functions are Pol II-specific transcription activator activity via JAK-STAT/IL-6/leptin signalling and phosphotyrosine-dependent homodimerisation; general terms were refined to specific descendants, physiological ISO terms kept as non-core, nuclear receptor activity, intracellular receptor signalling, TGF-beta signalling, protein import into nucleus and postsynapse-to-nucleus signalling marked over-annotated, and bare protein binding removed. No NEW terms proposed.
