  summary: 'De-novo review of rat Slc10a1 (Ntcp): 17 ACCEPT, 4 REMOVE of IEP response-to-X
    over-annotations'
  details: |
    Completed the de-novo review of all 21 seeded annotations for rat Slc10a1 (P26435), the founding member of the BASS family, as a companion to the human SLC10A1 review.

    Tally: 17 ACCEPT, 4 REMOVE, 0 MODIFY, 0 NEW, 0 UNDECIDED.

    ACCEPT (17): all transport MF rows (GO:0008508 x3 via IBA/IDA/TAS; GO:0015125 x3 via IDA/IEA/ISO), all bile acid transport BP rows (GO:0015721 x3 via IBA/IDA/IEP), and all localization rows (GO:0005886 x3 via IBA/IEA/ISO; GO:0016323 x3 via IBA/IDA/IDA; GO:0016020 x2 via IEA/ISO). propagation_review blocks were added to the 9 IBA/IEA/ISO rows with donors traced: PANTHER PTN000040759 / PTN000040761 / PTN002570905, UniProtKB:Q14973 (human 1:1 orthologue), RGD:3681 (the target itself, expected in its own WITH/FROM), InterPro:IPR002657, ARBA:ARBA00028763, and MGI:MGI:97379 which was verified via UniProt cross-reference to resolve to mouse Slc10a1/Ntcp (O08705) rather than to the Slc10a2 paralogue MGI:1201406/P70172. All marked NO_FAILURE_CORE except the two broad GO:0016020 rows (NO_FAILURE_NON_CORE, GRANULARITY_MISMATCH).

    REMOVE (4): the IEP response-to-X rows GO:0031667 response to nutrient levels (PMID:25612518), GO:0043627 response to estrogen (PMID:27090119), GO:0045471 response to ethanol (PMID:27939985) and GO:0071466 cellular response to xenobiotic stimulus (PMID:27090119). All four rest on expression-pattern evidence: hepatic Ntcp mRNA/protein falls when the stimulus is applied. Under the repo participation rule an involved_in annotation requires the gene product to do some of the work of the process, and Ntcp performs no step of nutrient sensing, estrogen signalling, ethanol metabolism or xenobiotic sensing - it is the downstream transcriptional target. PMID:27090119 is full-text cached and decisive: the mechanism is AMPKalpha1/FXR, and Ntcp suppression is notably NOT rescued by compound C, GW4064 or FXR overexpression, unlike Bsep/Mrp2/Oatp2. Per the ortholog-source rule this is the right place to say so, since the human copies of the first three terms are GO_REF:0000107 transfers from this very gene (UniProtKB:P26435).

    Divergence from the human review, recorded explicitly in the notes: human GO:0071466 was MODIFIED to GO:0042908 xenobiotic transport on the strength of human-specific drug-substrate data (rosuvastatin), but the rat row is removed with no replacement, because the definitive rat substrate-specificity study found bumetanide and cyclosporin A to be inhibitors and not substrates (PMID:9486191). Nothing else contradicts the human review.

    GO:0015721 IEP (PMID:28827769) was ACCEPTed rather than removed, as the contrast case: the term names a process Ntcp genuinely executes and the cited paper itself asserts that role.

    GO:0016323 IDA from PMID:17082223 was ACCEPTed deferring to the curator. The cached record is abstract-only and the abstract is about Bsep N-glycosylation without naming Ntcp; per SKILL.md this is not grounds for a mis-attribution claim, and the taurocholate-transport assay in polarized MDCK II cells requires a basolateral uptake carrier. The reference carries correctness: UNVERIFIED with a note for a future full-text reviewer.

    Added PMID:9486191 (Schroeder et al. 1998, rat Ntcp substrate specificity) as a new reference; it is the source for the substrate range and for the absence of demonstrated rat xenobiotic transport, and is cross-checked against the UniProt catalytic-activity annotations for P26435.

    Two core_functions (sodium-coupled bile salt symport; the hepatic uptake leg of the enterohepatic circulation), no proposed_new_terms, four suggested_questions and four suggested_experiments. No NEW annotations: the HBV/HDV receptor function that justified two NEW terms on human SLC10A1 does not transfer to rodent Ntcp.

    Deep research was unavailable in this container (Falcon 402, OpenAI 401, perplexity unregistered); no -deep-research-*.md file was created, and the literature synthesis was written by hand into Slc10a1-notes.md with inline PMID provenance. All supporting_text quotes were verified as verbatim substrings of the cached publications before writing. No GO-CAM model for Slc10a1 exists in gocams/index.tsv.
