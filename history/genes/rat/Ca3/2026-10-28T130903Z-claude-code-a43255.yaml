  summary: 'Create review: Ca3'
  details: |
    New review of rat Ca3 (carbonic anhydrase III, P14141) covering all 35 GOA rows. Carbonate dehydratase activity in the cytosol is the core function (recombinant rat CA III retains native CO2 hydratase activity, PMID:10845711). The IDA phosphatase activity row (PMID:8633035) was removed because the same laboratory showed the activity to be a contaminant (PMID:10845711), with a source defect filed against RGD. Cytoplasm rows and the sarcomere IDA row were refined to cytosol, response to alcohol to response to ethanol, and negative regulation of apoptotic process to the H2O2-specific intrinsic apoptosis term. Oxidative-stress protection and expression-response rows were kept as non-core given normal Car3-null mice (PMID:15509796); liver regeneration, proliferation, ROS biosynthesis, muscle contraction and mouse-derived response to bacterium rows were marked over-annotated. No NEW terms.
