  summary: 'Create review: Alpl'
  details: |
    Created the rat Alpl (P08289, tissue-nonspecific alkaline phosphatase) review from 99 GOA rows, with a manual literature synthesis (no deep-research provider) and full-text reading of PMID:20048161 (which used human recombinant TNAP) and PMID:32710882 (rat bone-marrow TNAP). Core functions are inorganic diphosphate phosphatase activity in bone and cementum mineralization at the plasma membrane and matrix vesicles, pyridoxal phosphatase activity in PLP metabolism, and phosphoamidase (phosphocreatine) activity in the mitochondrial futile creatine cycle. Pyrophosphatase and phosphatase rows were modified to their specific descendants; the sign-inverted inhibition of non-skeletal tissue mineralization rows were removed with a source defect against the mouse MGI donor; response-to-stimulus rows kept as non-core, M-CSF and reproduction rows marked over-annotated, response to antibiotic left undecided.
