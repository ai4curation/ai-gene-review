  details: |
    Created the rat Psmc4 (Q63570, Rpt3/TBP7) review from 25 GOA rows. Core function is proteasome-activating ATPase activity in the 19S base subcomplex, acting in proteasome-mediated ubiquitin-dependent protein catabolism in the cytosol and nucleoplasm. General complex, location and process rows (proteasome complex, proteasome accessory complex, cytoplasm, nucleus, proteasomal protein catabolic process) were modified to the more specific terms the gene already carries. Rat inclusion-body localisation (PMID:18986984, full text read) and the mouse knockout blastocyst phenotype were kept as non-core. Synaptic vesicle and regulation of AMPA receptor activity rows from the abstract-only PMID:37228199 were left undecided. No new terms were proposed. The literature work is in Psmc4-deep-research-manual.md because no deep-research provider was available.
