  summary: 'Create review: Gria1'
  details: |
    New review of rat Gria1 (GluA1, P19490) covering all 277 GOA rows. Core functions: AMPA glutamate receptor activity in the AMPA receptor complex at the postsynaptic density membrane of dendritic spines, Ca2+-permeable (GluA2-lacking) glutamate-gated calcium channel activity, and SAP97 PDZ domain binding driving synaptic delivery in LTP. Bare protein binding removed; general MF/CC terms refined to AMPA receptor activity, PSD membrane, glutamatergic synapse and related descendants; IEP drug/toxin/hormone response rows marked as over-annotations. Source defects recorded for a mis-keyed IgSF11 reference (PMID:16108831), immunoglobulin binding for IgSF11, cytosol from a non-synaptosomal fraction, cellular response to dsRNA from a miR-132 mimic, and CC rows carrying IEP/IMP evidence. Literature synthesis written manually (no deep-research provider).
