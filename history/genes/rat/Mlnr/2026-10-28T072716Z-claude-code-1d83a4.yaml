  summary: 'Create review: Mlnr'
  details: |
    Created the review of rat Mlnr (UniProt A0ACM8Q218, TrEMBL; GeneID 252859, RGD:621262). The locus carries the motilin receptor symbol but encodes the rodent TRH receptor type 2 (former Trhr2); the true rodent MLNR is pseudogenized. Reviewed all 8 GOA rows: accepted TRH receptor activity (IDA PMID:9735333 and InterPro IEA) and plasma membrane; MODIFY of generic GPCR activity, membrane, signal transduction and GPCR signaling to TRH receptor activity, plasma membrane and PLC-activating GPCR signaling pathway; neuronal cell body (IDA PMID:17760865, full text read) kept as non-core. No NEW terms. Literature work done manually (no deep-research provider) in Mlnr-deep-research-manual.md and Mlnr-notes.md; nomenclature anomaly raised as a suggested question.
