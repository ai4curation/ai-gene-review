  summary: 'Create review: rat Pnkd canonical product D3ZXB0'
  details: |
    De-novo full review of D3ZXB0 (rat Pnkd canonical, RGD:2300155), independent of ProtNLM2 predictions, as the same-gene reference for benchmark product B4F7D2. All 22 GOA rows are IEA/RGD ISO; no rat experimental annotation exists. Orthology grounded in PANTHER PTHR11935:SF116 (with human Q8N490, mouse Q69ZP3) and PAINT node placements. GO:0004416 MODIFY to GO:0016790 (PAINT placed GO:0004416 outside the PNKD branch; trace SLG activity); methylglyoxal catabolism REMOVE; mitochondrion, presynaptic cytosol and negative regulation of neurotransmitter secretion ACCEPT; ER/Golgi (MR-1M-specific), COX IV assembly (MR-1S-specific) and mutant-allele phenotype terms (dopamine, posture) MARK_AS_OVER_ANNOTATED. New bioinformatics script compare_d3zxb0.py/RESULTS-d3zxb0.md maps D3ZXB0 onto mouse isoform 3 and conserves Zn ligands and MTS. Falcon and perplexity-lite deep research both failed (auth/quota); recorded in notes.
