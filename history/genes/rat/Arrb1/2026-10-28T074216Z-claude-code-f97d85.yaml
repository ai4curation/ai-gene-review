  summary: 'Create review: Arrb1'
  details: |
    Created the first review of rat Arrb1 (beta-arrestin-1, P29066). All 136 GOA rows were reviewed against cached literature, nine papers read in full (including PMID:19171933, PMID:19254952 and PMID:20650893), with manual deep-research and notes files. Core functions: phospho-GPCR binding and desensitization, clathrin-cargo adaptor for GPCR internalization, ERK signalosome scaffold, and E3 ligase-substrate adaptor (one NEW MF row, GO:1990756, from PMID:20650893). Removed two ISO rows inherited from apparently defective mouse MGI annotations (phototransduction from a rod-arrestin knockout paper; caspase inhibitor activity from a Bad-phosphorylation paper) and recorded source defects; general terms were refined by MODIFY.
