  details: |
    Created the rat Rhoa (P61589) review. All 207 GOA rows were reviewed against cached publications (full text for PMID:20472934, PMID:20858895, PMID:14517206, PMID:14662747, PMID:17662049, PMID:21423166; the rest abstract-only) and the UniProt record. Core function: GTP/GDP-cycling G protein at the cytoplasmic face of the plasma membrane, driving Rho signal transduction, stress fibre/actin organization and cleavage furrow formation. Row actions: the microtubule depolymerization IMP was modified to Rho protein signal transduction, the sign-inverted positive regulation of cell migration IEP was modified to negative regulation, IEP response-to-chemical rows and indirect mouse-phenotype transfers were marked as over-annotations, and general location terms were refined. No NEW terms were proposed. A manual literature synthesis replaces deep research, because no provider was available.
