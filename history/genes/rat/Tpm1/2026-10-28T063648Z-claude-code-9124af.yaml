  details: |
    De novo review of rat Tpm1 (P04692, alpha-tropomyosin). All 51 GOA rows reviewed using cached publications (full text of PMID:19041430 and PMID:22812662; other papers abstract-only) and the curated UniProt record, with a manual literature synthesis in place of provider deep research. Core functions: actin filament binding underlying troponin-dependent striated/cardiac thin-filament regulation and stabilization of non-muscle actin filaments and stress fibers. General terms (actin binding, cytoskeletal protein binding, identical protein binding, cytoplasm, cytoskeleton, actin cytoskeleton, myofibril, muscle contraction) were modified to specific supported terms; the ISO heart-rate-by-epinephrine row was marked over-annotated; cell motility/adhesion phenotypes kept as non-core; one NEW part_of muscle thin filament tropomyosin (GO:0005862) row added.
