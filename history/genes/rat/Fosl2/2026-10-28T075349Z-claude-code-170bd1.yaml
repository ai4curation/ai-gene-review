  details: |
    De novo review of rat Fosl2 (Fra-2, P51145): all 102 GOA annotations reviewed. Core function is AP-1 heterodimeric RNA polymerase II-specific DNA-binding transcription factor activity in the nucleus with context-dependent activation (C/EBPbeta, fra-2 autoregulation) and repression (Rgs4 via a variant AP-1 element and CBP dismissal, PMID:21367864); generic DNA-binding/TF terms were refined to GO:0000978/GO:0000981, two NEW rows added (GO:0001227, GO:0000122), IEP immediate-early induction rows mostly marked over-annotated, and mouse phenotype-derived ISO process rows split into kept differentiation roles and over-annotated systemic phenotypes. Manual literature notes written in place of deep research.
