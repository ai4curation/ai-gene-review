  summary: 'Create review: Prkcz'
  details: |
    De novo review of rat Prkcz (P09217, PKCzeta/PKMzeta): all 108 GOA rows reviewed from cached abstracts and six full texts (including PMID:19254952, PMID:16525020, PMID:19885391). DAG- and calcium/DAG-dependent kinase activity rows were removed because atypical PKCs are not regulated by DAG or calcium (source defects recorded for the EC mapping and the human donor); the stress fiber IDA was modified to cortical actin cytoskeleton after full-text reading; IMP-coded synapse location rows were accepted with their IDA companions, with WRONG_EVIDENCE_CODE source defects asking RGD to check the evidence code; generic protein kinase activity rows were refined to protein serine/threonine kinase activity. Core functions capture PAR-complex polarity and migration, PI3K/PDK1-dependent insulin and ERK signaling, and PKMzeta-dependent maintenance of late LTP via AMPA receptor trafficking. No NEW annotations were proposed.
