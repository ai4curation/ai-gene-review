  summary: 'Create review: Akap7'
  details: |
    New review of rat Akap7 (Q6JP77, AKAP18 delta/gamma). All 39 GOA rows reviewed against cached literature, including a full-text read of PMID:21177871 (AKAP18delta-RIIalpha disruptor screen). Core functions are a PKA-anchoring signaling adaptor at the cardiac SR (PKA-RII plus phospholamban), PKA regulatory subunit binding, and AMP binding by the 2H phosphoesterase-like domain. PKA binding, protein kinase binding and cytoplasm/plasma membrane rows were refined, and bare protein binding was removed. The lateral membrane, membrane repolarization and K+ transport ISO rows were marked over-annotated because their human source is the short alpha/beta entry O43687, not Q9P0M2 as the With/From says; this was recorded as WRONG_WITH_FROM source defects for RGD. The missing rat alpha isoform (A0ABK0LH41) was recorded as a functional isoform with a MISSING_ISOFORM defect.
