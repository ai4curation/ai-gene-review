  summary: 'Full re-review: Mtmr12 (A0A8I5ZMD5), independent of ProtNLM2'
  details: |
    Full re-review independent of ProtNLM2 predictions. New sequence comparison (compare_sequences_rereview.py, RESULTS-rereview.md) shows A0A8I5ZMD5 is an Ensembl alternative gene model: first 40 residues replace the conserved canonical N-terminus (Q5FVM6 1-56), rest 691/692 identical; CX5R catalytic motif absent in all MTMR12 products. GO:0016529 sarcoplasmic reticulum UNDECIDED->ACCEPT (mouse RyR1 co-localization, PMID:23818870, same PANTHER SF37). GO:0030017 sarcomere UNDECIDED->MODIFY to GO:0030314 junctional membrane complex (paper restricts MTMR12 to triads, not Z-lines). Description rewritten; core function adds cytoplasm/SR locations and PMID:12847286. Next relative: canonical rat Q5FVM6.
