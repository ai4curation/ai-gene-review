  summary: Full re-review of rat Mtmr12 (A0A8I5ZMD5), independent of ProtNLM
  details: |
    Re-ran the sequence comparison with the target sequence taken from the UniProt flat file instead of the ProtNLM source JSON, and added alignments to human MTMR12 (Q9C0I1) and human MTM1 (Q13496). The comparison shows a non-conserved 40-residue N-terminal exon (the SignalP call falls inside it), identity to reviewed rat Q5FVM6 over residues 41-732, and replacement of both CX5R catalytic positions (E376, L382). Sarcoplasmic reticulum changed from UNDECIDED to ACCEPT, based on mouse ortholog triad and RyR1 colocalization (PMID:23818870) within PTHR10807:SF37. Sarcomere changed from UNDECIDED to KEEP_AS_NON_CORE as a loose positional description. Added PMID:12847286 (3-PAP adapter). Rewrote the description, added a core-function location, and dropped the ProtNLM file reference.
