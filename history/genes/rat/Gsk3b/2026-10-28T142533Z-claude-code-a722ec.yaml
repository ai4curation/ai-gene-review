  details: |
    New review of rat Gsk3b (P18266) covering all 280 GOA rows plus one NEW mitochondrion IDA row (PMID:8576078). Literature work was done manually (no deep-research provider) and recorded in Gsk3b-deep-research-manual.md and Gsk3b-notes.md; PMID:20042609 was read in full. Core functions: priming-dependent Ser/Thr kinase activity, beta-catenin destruction complex kinase (negative regulation of canonical Wnt), insulin-regulated inhibition of glycogen synthesis, tau-protein kinase/microtubule regulation, and PSD-95 Thr-19 phosphorylation in hippocampal LTD. General terms were refined by MODIFY, phenotype/IEP-only process rows marked over-annotated, and source defects recorded for a microtubule row whose paper reports mitochondria, NMJ terms applied to rat hippocampal data, a sign-suspect EPSP row, a protein kinase binding row naming Dvl1, a suspect With/From, and IMP-coded location rows.
