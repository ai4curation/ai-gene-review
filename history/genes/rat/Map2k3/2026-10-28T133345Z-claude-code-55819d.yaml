  details: |
    New review of rat Map2k3 (MKK3). fetch-gene resolved TrEMBL F7EXM7 rather than the requested B1H230; both carry RGD:1306620 and GOA is keyed to F7EXM7, which is B1H230 plus an 87-residue N-terminal extension. All 37 GOA rows reviewed: MAP kinase kinase activity, ATP binding, p38MAPK and stress-activated cascades accepted as core, supported by the full-text rat heart ischaemia study (PMID:20550965) with immune-complex MKK3 kinase assays; generic kinase, Ser, Tyr and Ser/Thr kinase rows modified to MAP kinase kinase activity; MAPK cascade and positive regulation of MAPK cascade modified to p38MAPK cascade (with suspected WRONG_TERM source defects for the regulation rows); heart development (IEP), cardiac muscle contraction and positive regulation of transcription marked over-annotated; stimulus and cell-context rows kept as non-core. Manual literature synthesis and notes written; no deep-research provider used.
