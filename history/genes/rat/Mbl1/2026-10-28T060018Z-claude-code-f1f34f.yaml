    Created the rat Mbl1 (MBP-A, P19999) review from the 29 GOA rows, with a manual literature synthesis (no deep-research provider available). Core functions are Ca2+-dependent carbohydrate binding and MASP (protease) binding, both directly involved in lectin-pathway complement activation. Six extracellular region rows were modified to extracellular space (serum protein). IBA surfactant homeostasis was removed and IBA multivesicular body marked over-annotated as surfactant-collectin carry-overs. The protein homodimerization IPI row (PMID:10913141, abstract describes MASP homodimers) was left UNDECIDED pending full text. Opsonophagocytosis and anti-bacterial defence ISO/IBA rows kept as non-core; no NEW terms were added.
