  details: |
    Created the rat Lpl (Q06000) review. All 85 GOA rows were reviewed from the cached rat papers (PMID:12551943, 11788374, 21569266, 25931001 and 11016888), the full text of PMID:18722549 (rat heart LPL activity), the UniProt record and the human LPL review. Lipoprotein lipase activity, triglyceride catabolism, chylomicron and VLDL remodeling and clearance, extracellular region and cell surface were accepted as core. General parent terms were changed with MODIFY to the specific terms the gene already carries. Fatty acid biosynthesis, HDL remodeling (paralog-only IBA donors), catalytic complex, triglyceride biosynthesis and xenobiotic response were marked as over-annotated. No REMOVE or NEW actions. The literature summary was written by hand (no deep-research provider).
