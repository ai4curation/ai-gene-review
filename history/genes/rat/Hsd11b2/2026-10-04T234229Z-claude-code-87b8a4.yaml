  summary: 'Re-review Hsd11b2 after GOA refresh: smoothened and 7beta-HSD rows upgraded
    from REMOVE/over-annotated to non-core on donor IDA evidence'
  details: |
    Re-audited all 25 existing_annotations rows; no PENDING or retired rows were present. Two action groups changed. GO:0045880 positive regulation of smoothened signaling pathway (IEA GO_REF:0000107 and ISO GO_REF:0000121) went REMOVE -> KEEP_AS_NON_CORE: the mouse donor (UniProtKB:P51661 / MGI:MGI:104720) annotation derives from PMID:30340023, where HSD11B2 is an oxysterol synthase producing 7-ketocholesterol upstream of SMO-activating oxysterols, acting between PTCH1 and SUFU, with rescue by the downstream oxysterols, and where the alternative glucocorticoid-mediated explanation was explicitly excluded (cerebellar deletion did not alter glucocorticoid target gene expression). GO:0047022 7-beta-hydroxysteroid dehydrogenase (NADP+) activity (IEA GO_REF:0000120, ISS GO_REF:0000024, ISO GO_REF:0000121) went MARK_AS_OVER_ANNOTATED -> KEEP_AS_NON_CORE: the previous family-level-transfer rationale is wrong, since the 7beta-specific oxidation was shown directly in the same paper and the rat UniProt record carries the reaction (RHEA:68656); retained with a caveat that the NADP(+) cofactor named in the term is unverified for rat. The three propagation_review blocks on those rows moved from PROPAGATION_BAD (ROLE_CONFLATION, WRONG_ORTHOLOG_OR_PARALOG, FUNCTIONAL_DIVERGENCE) with SUPPORTS_SOURCE_BUT_NOT_TARGET / SOURCE_WEAK_OR_INFERRED sources to NO_FAILURE_NON_CORE with SUPPORTS_TRANSFER. No other action changed. The description was rewritten as standalone biology (the prior text contained curation commentary and asserted the smoothened over-extension). Support quotes were repaired on GO:0005783 endoplasmic reticulum (now the SUBCELLULAR LOCATION line) and GO:0007565 female pregnancy ISO (now the preimplantation/fetal-protection statement), the UniProt CAUTION note on rat cortisol was added to both GO:0034650 rows, PMID:30340023 was added to references with four findings and a VERIFIED reference_review, and Hsd11b2-notes.md was created. core_functions unchanged. just validate rat Hsd11b2 passes with no errors or warnings.
