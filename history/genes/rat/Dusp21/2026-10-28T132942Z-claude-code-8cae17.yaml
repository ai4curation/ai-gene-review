  details: |
    Created the rat Dusp21 (D3ZAQ8) review from the 26 GOA rows. Full text of Rardin et al. 2008 (PMID:18385140) supports the mitochondrial matrix IDA and inner-membrane location and catalytic activity; core MF set to protein tyrosine/serine/threonine phosphatase activity with locations mitochondrial matrix and axonemal A tubule inner sheath (mouse sperm DMT structures). Generic phosphatase/hydrolase/cytoplasm rows modified to specific terms; nucleus, nucleolus, MAP kinase phosphatase and flagellated sperm motility rows marked over-annotated, the latter with a CHECK source defect because the mouse Dusp21 knockout (PMID:41764189) has normal sperm motility.
