    New review of rat Grk4 (P70507), all 22 GOA rows reviewed. Core function is G protein-coupled receptor kinase activity (GO:0004703) driving homologous desensitization (GO:0002029) and GPCR internalization (GO:0002031), supported by rat mGlu1 studies in Purkinje cells (PMID:11099476, PMID:12519791) and the rat GRK4A/B rhodopsin assay (PMID:9607785). Generic kinase, regulation of signal transduction, receptor internalization and cytoplasm rows were refined by MODIFY; rhodopsin kinase activity was modified to GPCR kinase activity with a suspected WRONG_TERM source defect for RGD; signal transduction was marked over-annotated. Most experimental papers were abstract-only; PMID:17908240 does not mention GRK4 and was recorded as not relevant. No NEW rows.
