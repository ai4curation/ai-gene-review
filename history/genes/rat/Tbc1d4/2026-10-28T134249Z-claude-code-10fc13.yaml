  details: |
    De novo review of rat Tbc1d4 (AS160, TrEMBL D3Z881). All 9 GOA rows reviewed: cytosol, vesicle-mediated transport, negative regulation of vesicle fusion (IMP, PMID:21454690 full text read) and all four cellular response to insulin stimulus rows accepted; cytoplasm IEA refined to cytosol; vesicle IDA refined to insulin-responsive compartment (GLUT4 vesicles immunoisolated from rat adipocytes). Added a NEW ISS GTPase activator activity row from human AS160 TBC-domain GAP assays (PMID:15971998) backed by a local check that both TBC catalytic fingers (R919, Q956) are conserved and rat L6 data (PMID:21041651). Core function: Rab GAP restraining GLUT4 vesicle fusion, inactivated by insulin/Akt and 14-3-3. Manual literature synthesis written (no deep-research provider).
