  details: |
    Created the rat Sipa1l1 (SPAR, O35412) review from 52 GOA rows using cached literature (full text of PMID:18723513, 19900557, 21382555, 18094260; abstracts otherwise) and a manual literature synthesis. GTPase activator activity and actin filament binding were accepted as core functions; regulation/activation of GTPase activity rows were refined to positive regulation of GTPase activity (GO:0090630 is a GEF-type term), InterPro2GO small GTPase signalling was refined to its negative-regulation child, and general location terms were refined to actin cytoskeleton and glutamatergic synapse. Kinase, ubiquitin ligase and complex binding rows reflecting SPAR as a Plk2/SCF(beta-TRCP) degradation substrate were kept as non-core; PSD location kept as non-core given the 2022 mouse knockout super-resolution study (PMID:35121636); bare protein binding rows removed by policy; the AQP2-complex row (PMID:15823548, abstract names SPA-1) left UNDECIDED. No NEW terms proposed.
