  summary: 'Create review: Mapk8'
  details: |
    De novo review of rat Mapk8 (JNK1, P49185): all 134 GOA rows reviewed against cached literature (six full texts including PMID:19332540) and the UniProt record, with a manual literature summary in place of deep research. General kinase MF and MAPK cascade rows were refined to MAP kinase activity and JNK cascade; the INS-1 beta-cell IMP row was corrected to negative regulation of type B pancreatic cell apoptotic process; bare protein binding rows were removed; IEP/indirect rows (glial apoptosis, neuron development, SMAD signalling) and the Ser/Thr/Tyr kinase ISO were marked over-annotated. Core functions: JUN kinase in the JNK cascade, SCG10/stathmin-2 phosphorylation controlling neuronal microtubules, and Syt4 phosphorylation capturing dense core vesicles at synapses. No NEW terms proposed.
