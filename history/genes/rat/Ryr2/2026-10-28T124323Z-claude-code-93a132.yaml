  summary: 'Create review: Ryr2'
  details: |
    De-novo review of rat Ryr2 (UniProt B0LPN4, RGD:620314): all 187 GOA rows adjudicated plus one NEW IC row for junctional sarcoplasmic reticulum membrane. Core function recorded as ryanodine-sensitive calcium-release channel activity (GO:0005219) in the junctional SR membrane within the ryanodine receptor complex, driving SR calcium release, cardiac muscle contraction and its regulation, with a second non-cardiac core function for smooth-ER calcium release underlying agonist-evoked calcium oscillations. Generic ancestors (calcium channel activity, calcium ion transport, sarcoplasmic reticulum, regulation of cardiac muscle contraction) were MODIFYed to the specific terms the gene already carries; GO:0051481 negative regulation of cytosolic calcium ion concentration was corrected for inverted sign; GO:0042383 sarcolemma and GO:0031234 extrinsic component of cytoplasmic side of plasma membrane were marked over-annotated with source_defects entries, since RyR2 is a multi-pass SR membrane protein and the cited papers (PMID:21474431, PMID:20177054) do not place it in the plasma membrane. Literature work was done manually from cached publications; no deep-research provider was available.
