  details: |
    New review of rat Pecam1 (Q3SWT0, PECAM-1/CD31). All 69 GOA rows reviewed against cached rat papers (full text of PMID:17662049 and PMID:18466611; abstracts of rat in vivo antibody-blockade and RBL-2H3 SHP-2 studies) plus human background papers. Core functions: homophilic/leukocyte cell-cell adhesion via Ig domain 1, diapedesis/neutrophil and monocyte extravasation, ITIM/SHP-2 inhibitory signaling counteracting ICAM-1-induced RhoA activation, and mechanosensing. General adhesion, migration, membrane and signaling rows were refined by MODIFY; IEP cytokine-response rows, the Fc-receptor-node immune response IBA and an IEP-derived glomerular endothelium development ISO (with an RGD source defect) were marked over-annotated; three rows with unread donor papers left UNDECIDED; one NEW MF (cell-cell adhesion mediator activity) added.
