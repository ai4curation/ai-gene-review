  summary: 'Create review: Klf4'
  details: |
    De novo review of rat Klf4 (Q923V7, unreviewed TrEMBL) covering all 151 GOA rows. Core functions are Pol II sequence-specific DNA binding with activator and repressor activity; general DNA-binding, transcription-factor and transcription-regulation rows were refined to the Pol II-specific terms. The IMP phosphatidylinositol 3-kinase regulator activity row (PMID:19531492) was removed because the paper attributes the PI3K effect to transcriptional repression of RARA and PDGFRB, and canonical Wnt signaling was modified to its negative regulation. Expression-only IEP rows and ortholog-derived developmental and endothelial roles were kept as non-core, two unverifiable ISO rows were left undecided, and no NEW terms were proposed. Literature work was manual (no deep-research provider).
