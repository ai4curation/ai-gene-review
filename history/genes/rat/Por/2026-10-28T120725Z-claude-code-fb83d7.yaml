  summary: 'Create review: Por'
  details: |
    Reviewed all 63 GOA rows for rat Por (P00388, NADPH--cytochrome P450 reductase) from the cached publications and the UniProt record; no deep-research provider was available, so the literature synthesis was written by hand into Por-deep-research-manual.md and Por-notes.md. The core function is NADPH-hemoprotein reductase activity on the ER membrane; generic oxidoreductase and cytoplasm rows were MODIFYed to it and to endoplasmic reticulum membrane, and the mis-mapped iron-cytochrome-c reductase row was repointed. Nitric oxide biosynthesis (IBA from a NOS-seeded PAINT node) was removed and the hydrolase row (an H2O2-driven oxidative deformylation) removed; the NO dioxygenase, cytosol, nucleoplasm, enzyme activator, carnitine, organofluorine and chondrocyte-phenotype rows were marked over-annotated, with source_defects filed against RGD, GO_CENTRAL and the human donor annotations. Refined propagated rows carry propagation_review.
