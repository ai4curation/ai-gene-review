  summary: 'Create review: Cdc42'
  details: |
    De novo review of rat Cdc42 (Q8CFN2): all 155 GOA rows reviewed (33 ACCEPT, 91 KEEP_AS_NON_CORE, 16 MODIFY, 8 MARK_AS_OVER_ANNOTATED, 3 TOO_GENERAL, 2 REMOVE, 2 UNDECIDED) plus one NEW Rho GDP-dissociation inhibitor binding row from PMID:20472934. Core functions are G protein activity in Rho signalling and cell polarity, and GBD domain binding driving filopodium assembly and actin filament organization. Rat NRK data (PMID:21763307) were used to mark the HeLa-derived cytokinesis and kinetochore-attachment transfers as over-annotated; source defects were recorded for the propagated storage vacuole, COG complex and ubiquitin ligase terms and for the SynGO IMP location row. Literature synthesis was written by hand (no deep-research provider).
