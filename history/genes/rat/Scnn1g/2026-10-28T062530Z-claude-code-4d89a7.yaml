  summary: 'Create review: Scnn1g'
  details: |
    De novo review of rat Scnn1g (P37091, gamma-ENaC) covering all 87 GOA rows, with a manual literature synthesis (no deep-research provider available) that includes PMID:18308722 on CK2 regulation. Core function: contributes to the sodium channel activity of the alpha-beta-gamma ENaC heteromer, which imports Na+ across the apical plasma membrane and maintains sodium homeostasis. Ligand-gated sodium channel activity was modified to sodium channel activity because ENaC is constitutively open. General transport, location and channel terms were refined to the specific terms the gene already carries. IEP expression-response terms were marked as over-annotated, except aldosterone and vasopressin, which were kept as non-core. The NOT response to dexamethasone row is left undecided. No new annotations.
