  summary: 'Re-review Tp53 after GOA refresh: 135 PENDING rows resolved, protein-binding
    rows migrated, support added'
  details: |
    Re-reviewed all 351 existing_annotations rows after the GOA refresh. Resolved 135 PENDING rows (mostly MGI acts_upstream_of_or_within qualifier splits and human isoform donor splits, plus about 60 new mouse phenotype terms): 29 ACCEPT, 77 KEEP_AS_NON_CORE, 24 MARK_AS_OVER_ANNOTATED (mainly developmental phenotypes from compound-mutant mice where p53 activation causes the defect, ER as a synoviolin-substrate site, p53-as-cargo terms), 1 MODIFY (necroptotic process to programmed necrotic cell death) and 4 UNDECIDED (site of double-strand break, whose donor paper only reports 53BP1; negative regulation of miRNA processing; negative regulation of proteolysis; NOT in utero embryonic development). Changed 7 existing actions: protein binding MARK_AS_OVER_ANNOTATED to MODIFY x2 (TAFII31 to transcription coactivator binding, WT1 to Pol II-specific DNA-binding TF binding) and to REMOVE x2 (nucleostemin; retired nucleophosmin row); mitochondrial matrix IEA MODIFY to KEEP_AS_NON_CORE (matrix accumulation shown by PMID:22726440); response to caffeine and response to metal ion IEP KEEP_AS_NON_CORE to MARK_AS_OVER_ANNOTATED. One retired row kept. Added verbatim supported_by to 185 rows lacking it, removed curation commentary from the description, status COMPLETE. Validation: 0 errors, 1 advisory warning (positive vs NOT in utero development). The 4 UNDECIDED rows need donor-side checks at MGI.
