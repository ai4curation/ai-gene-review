  details: |
    De novo review of rat Trpc7 (UniProt F1LQF7, the TrEMBL entry to which GOA keys the gene's 17 annotations; requested accession A0A8I6GIE6 is another unreviewed entry for the same RGD:628820 gene). Core function is a receptor-operated, diacylglycerol-activated Ca2+-permeable nonselective cation channel at the plasma membrane mediating Ca2+ import. Store-operated channel activity, IP3 binding, single fertilization (IBA) and manganese transport (ISO) were marked over-annotated; membrane, calcium ion transport and calcium transmembrane transport rows were refined; Golgi apparatus added as NEW IDA from endogenous rat GH4C1 data (PMID:18452405). Manual literature synthesis written in place of deep research.
