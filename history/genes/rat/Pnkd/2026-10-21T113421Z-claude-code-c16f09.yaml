  summary: 'Full re-review: Pnkd B4F7D2 (independent of ProtNLM2)'
  details: |
    Corrected product identity: B4F7D2 is an alternative splice isoform (= Ensembl A0A0G2JTS8) collinear with PNKD-L over 1-340, retaining the N-terminal hydrophobic segment and all seven Zn ligands; only the last 29 residues diverge, truncating the HAGH_C domain. The prior claim that it lacks the TM segment was an artefact of aligning to the isoform-3-like D3ZXB0. New analysis in Pnkd-bioinformatics/compare_isoforms_rereview.py / RESULTS-rereview.md. GO:0004416 MARK_AS_OVER_ANNOTATED -> MODIFY to GO:0016790 thiolester hydrolase activity, following PAINT (root-node GO:0016790 IBD reaches the PNKD subfamily; GO:0004416 node excludes it). GO:0051596 UNDECIDED -> REMOVE (PNKD-L fails HAGH complementation; no glyoxalase process IBD on PNKD branch). Added core function GO:0016790; mitochondrion not added because PNKD-L localization is directly disputed. Added PMID:19124534, 15496428, 22214848 references.
