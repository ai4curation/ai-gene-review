  summary: 'Create review: Tardbp'
  details: |
    New review of rat Tardbp (TDP-43, UniProt A0A8I6GLU8). All 65 GOA rows reviewed. RNA binding rows (including the rat RIP-seq IDA, PMID:21051541) refined to pre-mRNA intronic binding and mRNA 3'-UTR binding; RNA splicing refined to regulation of alternative mRNA splicing; the RGD IMP to positive regulation of insulin secretion (PMID:21127054, a PI3K-C2alpha paper that never mentions TDP-43) removed with a wrong-gene source defect; the ER-stress IEP modified to response to misfolded protein; positive regulation of protein import into nucleus removed as cargo/regulator conflation from mouse PMID:28585542; knockdown-phenotype processes marked as over-annotated. Core functions: intronic binding for splicing regulation, 3'-UTR binding for mRNA destabilization/autoregulation, and condensate scaffolding.
