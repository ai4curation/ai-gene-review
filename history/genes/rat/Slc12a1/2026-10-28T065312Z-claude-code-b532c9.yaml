  details: |
    Created the review of rat Slc12a1/NKCC2 (TrEMBL F7EUW9, RGD:3685). fetch-gene by symbol timed out on UniProt search, so it was run with --uniprot-id F7EUW9. All 11 GOA rows are IEA: apical plasma membrane and the sodium, potassium and chloride ion transmembrane transport rows were accepted; generic membrane/plasma membrane, transporter, ion transport and chloride:cation symporter rows were modified to apical plasma membrane, sodium:potassium:chloride symporter activity or the specific ion transport processes. Added NEW GO:0008511 (oocyte flux, PMID:8021284) and GO:0070294 renal sodium ion absorption (NKCC2 performs the apical Na entry step in the thick ascending limb). Literature read manually (PMID:19592485 full text, plus trafficking and phosphorylation papers); manual deep-research and notes files written.
