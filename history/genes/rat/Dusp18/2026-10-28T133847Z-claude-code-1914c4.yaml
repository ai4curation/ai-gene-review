  details: |
    Created the rat Dusp18 (Q6AXW7) review. All 28 GOA rows reviewed using the full text of Rardin et al. 2008 (PMID:18385140; endogenous rat kidney DSP18 on the IMS face of the mitochondrial inner membrane), ortholog enzymology (PMID:12591617, PMID:12408986) and recent human/mouse substrate and knockout papers (Src pY416, PMID:38346942; USF1 pT100, PMID:38992029). Dual-specificity phosphatase activity is the core function; generic phosphatase/dephosphorylation rows were refined, cytoplasm rows refined to mitochondrial intermembrane space (added as a NEW IDA row), nucleus/nucleoplasm and the InterPro-derived MAP kinase phosphatase term marked over-annotated with source defects, and negative regulation of bone resorption kept as non-core.
