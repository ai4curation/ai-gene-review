  summary: 'Create review: Casp9'
  details: |
    De novo review of rat Casp9 (Q9JHK1, RGD:61867). All 76 GOA rows reviewed (24 MODIFY, 18 ACCEPT, 18 MARK_AS_OVER_ANNOTATED, 16 KEEP_AS_NON_CORE; no REMOVE, no NEW). Core functions: cysteine-type endopeptidase activity in the cytosolic apoptosome, driving the intrinsic apoptotic signaling pathway and processing executioner procaspases. General terms refined to the specific terms the gene already carries; IEP response-to-stimulus rows marked as over-annotations of caspase-9 used as an apoptosis marker. Two RGD source defects recorded for checking (PMID:17869439 IMP that the abstract contradicts; IDA code on an I3C response row). Added a manual literature synthesis and a human-rat alignment showing the catalytic dyad and ABL1 site are conserved but the AKT1 site Ser196 is not.
