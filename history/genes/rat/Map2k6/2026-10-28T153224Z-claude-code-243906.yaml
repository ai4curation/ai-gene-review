  details: |
    Full review of rat Map2k6 (UniProt A0ABK0M3C5, TrEMBL). All 35 GOA rows reviewed. MAP kinase kinase activity accepted as the core function on rat IDA evidence (immune-complex assay of endogenous cardiac MKK6, PMID:20550965, full text read) plus human/mouse orthologs; generic kinase, transferase, Ser/Thr kinase and nucleotide-binding rows refined to MAP kinase kinase activity or ATP binding; MAPK cascade rows refined to p38MAPK cascade and positive regulation of MAPK cascade to positive regulation of p38MAPK cascade; identical protein binding refined to protein homodimerization activity (autoinhibitory dimer). Cardiac muscle contraction rows (gain-of-function transgene) and correlative IEP rows for ovulation cycle process and response to xenobiotic stimulus marked as over-annotated; tissue outcomes (bone, prostaglandin secretion, apoptosis, thermogenesis) kept as non-core. No NEW terms. Manual literature synthesis and notes added.
