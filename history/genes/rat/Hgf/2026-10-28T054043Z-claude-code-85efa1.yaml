  summary: 'Create review: Hgf'
  details: |
    Created the rat Hgf (P17945) review from 46 GOA rows. Core function is secreted growth factor activity as the activating ligand of the MET receptor tyrosine kinase (HGF receptor signaling pathway, extracellular space). The NOT endopeptidase IBA was accepted and the InterPro proteolysis IEA removed, since HGF is a pseudoprotease that is processed by HGFAC/TMPRSS13 rather than cleaving anything. General terms (signaling receptor binding, extracellular region, signal transduction, regulation of anatomical structure morphogenesis) were modified to specific descendants; cellular response to HGF stimulus on the ligand was marked over-annotated; two abstract-only experimental rows were left UNDECIDED. Downstream proliferation, survival, migration and immunomodulatory outcomes were kept as non-core. No NEW terms were proposed. Literature synthesis is in Hgf-deep-research-manual.md (no deep-research provider used); PMID:20097747 was read in full and supports only HGF secretion.
