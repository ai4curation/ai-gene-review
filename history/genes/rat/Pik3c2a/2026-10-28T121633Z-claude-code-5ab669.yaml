  details: |
    Created the rat Pik3c2a (D3ZTF6) review from 46 GOA rows (IBA, IEA, ISS, ISO, ND; no rat experimental rows). Core functions are the PI4P 3-kinase activity making PI(3,4)P2 at clathrin-coated pits, clathrin binding, and PI 3-kinase activity making local PI3P pools. General terms (kinase, transferase, cytoplasm, vesicle, endocytosis, phosphatidylinositol binding, PIP biosynthesis) were refined by MODIFY. Starvation, cell migration and PI3K/PKB signalling rows were marked over-annotated. The mouse-derived zinc transport row is UNDECIDED with a suspected MGI source defect. The ND row was removed, and clathrin-coated pit was added as a NEW location. Rat INS1 (PMID:21127054, full text) and PC12 evidence was used in the narrative but not as a NEW process row.
