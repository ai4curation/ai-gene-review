  summary: 'Post-review edits: Pik3c2a PI(4,5)P2 3-kinase rows'
  details: |
    Changed the two GO:0046934 1-phosphatidylinositol-4,5-bisphosphate 3-kinase activity rows (IEA from EC 2.7.1.153, ISO from human O00443) from KEEP_AS_NON_CORE to MARK_AS_OVER_ANNOTATED and added a propagation_review to the ISO row. The PANTHER PTHR10048 family review scopes this activity to the class I PI3K catalytic subunits, and the review's own evidence (PMID:9337861, PMID:17644513) shows the class II enzyme phosphorylates PtdIns(4,5)P2 only with a phosphatidylserine carrier and makes PI3P and PI(3,4)P2 in cells. Notes record the change.
