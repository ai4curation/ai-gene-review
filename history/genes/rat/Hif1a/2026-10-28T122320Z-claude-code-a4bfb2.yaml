  summary: 'Create review: Hif1a'
  details: |
    Reviewed all 247 GOA rows for rat Hif1a (O35800) from cached publications and the UniProt record; no deep-research provider was available, so the literature synthesis was written by hand into Hif1a-deep-research-manual.md and Hif1a-notes.md. Core functions record HIF-1alpha as the oxygen-regulated subunit of the HIF-1/ARNT heterodimer: HRE binding in RNA polymerase II cis-regulatory regions, heterodimerisation, CBP/p300 coactivator recruitment, transcriptional activation and context-dependent repression. Generic transcription and DNA-binding rows were refined by MODIFY to the specific terms the gene already carries; mouse and human ISO developmental and phenotype rows were kept as non-core; IEP rows that record only an expression change were marked over-annotated, while those where HIF-1alpha activation is the mechanism of the response were kept as non-core. One row was removed (GO:0062029, whose own source attributes the phenotype to an RNAi artefact) and one left undecided (GO:0045722, abstract describes an HNF4alpha perturbation); upstream problems were recorded as source_defects for RGD and for the human GO:0140537 row.
