  details: |
    Created the rat Kcnj8 (Kir6.1, Q63664) review: all 93 GOA rows reviewed (14 ACCEPT, 16 KEEP_AS_NON_CORE, 43 MARK_AS_OVER_ANNOTATED, 18 MODIFY, 2 REMOVE). Core function is the pore-forming subunit of the vascular Kir6.1/SUR2B KATP channel (GO:0015272, potassium ion transmembrane transport, plasma membrane, inward rectifying potassium channel complex) and its role in vasodilation. Mis-typed ARUK-UCL rows (ATPase-coupled transporter activity, potassium-transporting ATPase complex) were modified to channel terms; mouse knockout ISO developmental, immune and signalling processes were marked over-annotated. A probable RGD source defect was recorded for sulfonylurea receptor binding from PMID:20123112, whose co-IP used Kir6.2. Manual literature notes were written because no deep-research provider was available; no NEW terms proposed.
