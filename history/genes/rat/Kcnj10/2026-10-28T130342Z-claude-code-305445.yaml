  summary: 'Create review: Kcnj10'
  details: |
    De novo review of rat Kcnj10 (Kir4.1, P49655): all 49 GOA rows reviewed. Core function is inward rectifier K+ channel activity (homotetramer and Kir4.1/Kir5.1 heteromer) mediating K+ uptake, resting potential and K+ spatial buffering in glia and basolateral K+ recycling in distal nephron. General rows (potassium channel activity, potassium ion transport, membrane, regulation of membrane potential) were modified to the specific terms the gene already carries; bare protein binding and the inter-ontology presynapse IEA were removed (source defect recorded for the latter); knockout-phenotype and expression rows (glutamate uptake, myelination, oligodendrocyte development, behaviour, visual perception, plasticity, ciliogenesis, light and hormone responses) were marked over-annotated, with response to glucocorticoid left undecided. New rows add astrocyte end-foot, PIP2 binding and potassium channel complex. Literature synthesis written manually (no deep-research provider).
