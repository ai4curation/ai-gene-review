  details: |
    New review of rat Trpc6 (A0ABK0M635, TrEMBL; RGD:619788). All 33 GOA rows reviewed using full text of PMID:20501650, PMID:19889962 and PMID:20479868 and abstracts of the other papers. Core function is a receptor-operated, DAG-activated Ca2+-permeable nonselective cation channel at the plasma membrane. Generic membrane, ion channel and positive regulation of calcium ion transport rows were modified to specific terms; store-operated channel, IP3 binding and neuron differentiation rows were marked over-annotated; brain co-IP cytoskeletal binding rows and the dendrite morphogenesis IMP (whose abstract reports the opposite sign) were left undecided, with source defects recorded for the dendrite and IP3 binding rows.
