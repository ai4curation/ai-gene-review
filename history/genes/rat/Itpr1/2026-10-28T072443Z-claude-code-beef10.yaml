    De novo review of rat Itpr1 (P29994, IP3R1): all 133 GOA rows reviewed from cached literature (no deep-research provider; manual synthesis in Itpr1-deep-research-manual.md). Core function is IP3-gated Ca2+ release channel activity in the ER membrane and inner nuclear membrane, supported by rat bilayer, DT40 patch-clamp and cryo-EM data. General transport/channel/regulation terms were refined to GO:0005220 and GO:1903514; phosphatidylinositol binding refined to IP3 binding; human-derived calcium channel inhibitor and negative regulation of calcium-mediated signaling ISO rows removed as apparent IRBIT mis-attributions; contentious vesicle/granule, nucleolus, calcineurin complex and expression-only hypoxia rows marked over-annotated; bare protein binding removed (syntaxin 1B to SNARE binding). No NEW terms.
