  summary: 'Create review: Anxa2'
  details: |
    Created the rat Anxa2 (Q07936) review: reviewed all 103 GOA annotations using cached rat papers (notably the full text of PMID:19193640 on v-Src targeting and transformation in Rat-1 cells, and PMID:14734570 on PI(4,5)P2 binding) plus Anxa2-null mouse and actin-regulation abstracts. Core functions are Ca2+-dependent anionic phospholipid and PI(4,5)P2 binding, F-actin binding at the cell cortex, and S100A10 heterotetramer formation that promotes plasminogen activation on the cell surface. Generic terms were refined (cytoplasm to cell cortex, vesicle to recycling endosome, membrane to plasma membrane). Indirect phenotype, transcription and PLA2-inhibitor propagations were marked as over-annotations, and no NEW terms were proposed. Literature synthesis was done manually because no deep-research provider was available.
