  summary: 'Create review: Gria2'
  details: |
    Created the rat Gria2 (GluA2, P19491) review: all 240 GOA rows reviewed against cached literature (full text read where available, including PMID:19321442) and the UniProt record. Core functions are AMPA glutamate receptor activity in the AMPA receptor complex at the postsynaptic density membrane, and C-terminal PDZ domain binding for receptor trafficking. Bare protein binding rows were removed under policy; general MF/CC terms were refined to AMPA receptor activity, PSD membrane, plasma membrane and glutamatergic synapse; expression-response and drug-response process rows were flagged as over-annotations. Upstream defects recorded: kainate-selective receptor term (should be AMPA), immunoglobulin binding for IgSF11, SNARE binding with PICK1, a mis-keyed IGSF11 reference, a GluD1 paper attached to GluA2, SynGO presynaptic channel rows from an oocyte kinetics paper, an RGD presynapse row, and phenotype/expression codes on location rows.
