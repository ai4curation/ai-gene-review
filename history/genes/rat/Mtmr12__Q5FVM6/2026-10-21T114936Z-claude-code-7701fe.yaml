  details: |
    New full review of the Swiss-Prot canonical rat Mtmr12 product (Q5FVM6), the reference relative of the ProtNLM2 benchmark product A0A8I5ZMD5; done independently of ProtNLM2 output. All 9 GOA CC rows reviewed: cytoplasm (IBA/IEA/ISO/ISS) and sarcoplasmic reticulum (IEA/ISO/ISS) accepted; membrane IBA kept as non-core (peripheral association, catalytic term from the same PAINT node deliberately not propagated to SF37); sarcomere IEA modified to junctional membrane complex because mouse data place MTMR12 at triads, not Z-lines. Added NEW phosphatase binding and protein stabilization (ISS from PMID:23818870, within PTHR10807:SF37; comparator MTMR9 carries both). Notes state that all experimental evidence is from human, mouse and zebrafish, none from rat. Falcon deep research failed and is recorded in the notes.
