    Created the rat Il1rl1 (Q62611, ST2) review from fetched UniProt and GOA data, reading cached rat papers including PMID:18406357. All 40 GOA rows reviewed. Core functions are IL-33 receptor activity of membrane ST2L in IL-33-mediated signalling and IL-33 binding by secreted sST2 acting as a decoy. InterPro2GO interleukin-1 receptor activity was modified laterally to interleukin-33 receptor activity. The EC-mapped TIR NAD+ nucleosidase (cADPR-generating) activity was removed as an over-propagated PROSITE-rule inference, and source defects were recorded for both. Expression (IEP) and downstream immune-regulation rows were kept as non-core.
