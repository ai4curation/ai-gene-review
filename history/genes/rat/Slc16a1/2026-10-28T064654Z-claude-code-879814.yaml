  details: |
    De novo review of rat Slc16a1 (MCT1, P53987). All 79 GOA rows reviewed against cached literature (full text of PMID:19473976, 17127621, 19929853, 32766828; abstracts of the oocyte, localisation and FRET papers). Core function is proton-coupled lactate/pyruvate/ketone-body symport at the plasma membrane, dependent on basigin/embigin. Identical protein binding (IPI, PMID:19473976) removed because the paper attributes the dimer band to detergent aggregation; bare protein binding removed per policy; mouse phenotype-derived process transfers and human centrosome transfers marked over-annotated; generic MF/BP/CC terms modified to specific supported terms; succinate transport kept as non-core (acidic-pH protonated form only). Added NEW pyruvate transmembrane transporter activity (IDA, PMID:9639576). Manual deep-research synthesis and notes written; no deep-research provider was available.
