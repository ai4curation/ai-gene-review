  summary: 'Create review: Pck1'
  details: |
    New review of rat Pck1 (P07379, cytosolic PEPCK-C; 124 GOA rows). Accepted the GTP-dependent PEPCK activity, gluconeogenesis, oxaloacetate metabolic process and cytosol rows; refined general PEPCK activity, cytoplasm, glucose metabolic process and regulation of lipid biosynthesis rows to their specific children; corrected tricarboxylic acid metabolic process to oxaloacetate metabolic process and glycerol biosynthesis to glycerol-3-phosphate biosynthesis (glyceroneogenesis); removed the PAINT mitochondrion IBA inherited from PCK2 donors (supported by PMID:6049928 and PMID:19635791); kept the human-derived Ser90 protein-kinase, ER and lipogenesis rows as non-core; marked incidental expression (IEP) responses, memory T cell differentiation, hepatocyte differentiation, NDP kinase (carbovir) and the RNA pol II regulation transfer as over-annotated, with source_defects for Reactome, GO_Central, MGI, UniProt and BHF-UCL. Literature synthesis written by hand to Pck1-deep-research-manual.md (no deep-research provider).
