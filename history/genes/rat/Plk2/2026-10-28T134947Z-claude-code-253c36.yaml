    Created the rat Plk2 (Q9R012) review: all 83 GOA rows reviewed using full text of PMID:18723513, PMID:20802490 and PMID:21382555 plus abstracts. Core functions are postsynaptic Ser/Thr kinase activity on Ras/Rap regulators driving synaptic scaling, kinase-independent NSF binding that removes surface GluA2, and centriole duplication. Regulation of synaptic plasticity rows were refined to regulation of synaptic scaling; Ras/Rap signal transduction rows were refined to regulation terms; PLK1-type IBA locations and miRNA-target phenotype rows were marked over-annotated; RGD IPI rows with wrong terms (protein kinase binding to adaptins, GTPase binding to non-specifically bound dynamins) were removed with source defects.
