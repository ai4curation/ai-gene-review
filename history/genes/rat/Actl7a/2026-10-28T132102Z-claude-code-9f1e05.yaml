  details: |
    New review of rat Actl7a (Q641W9), 33 GOA rows plus one NEW row. Read PMID:21278383 in full; its only rat experiment is the TES/Mena co-IP from rat testis, so the protein-containing complex IDA is accepted and the cytoplasm EXP row gets a WRONG_EVIDENCE_CODE CHECK defect (localisation used mouse sections and GFP-human Arp7A in HeLa). Acrosomal vesicle rows are modified to perinuclear theca (subacrosomal layer) with WRONG_TERM defects; nucleus rows to male germ cell nucleus; cytoplasm and cytoskeleton rows to perinuclear theca (and Golgi for cytoplasm). Golgi kept as non-core, fertilization kept as non-core, motile cilium left undecided (2003 abstract-only tail report), ND row removed. Added LIM domain binding (ISS from human; TES-binding segment identical in rat). Core functions: structural molecule activity in the perinuclear theca for acrosome assembly and spermatid development, and LIM domain binding. No deep-research provider was used; manual synthesis written to Actl7a-deep-research-manual.md.
