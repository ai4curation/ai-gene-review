  summary: 'Create review: Cdkn1b'
  details: |
    Created the rat Cdkn1b (p27Kip1, UniProt O08769) review: all 86 GOA rows reviewed, mostly RGD ISO transfers from human CDKN1B and mouse Cdkn1b, aligned with the human CDKN1B review. CDK inhibitor activity, cyclin binding, molecular adaptor activity, negative regulation of G1/S and of cell proliferation and nuclear localization accepted as core; generic inhibitor/regulator MF and cell-cycle regulation rows modified to GO:0004861 and GO:2000134; substrate/cargo-conflated transfers (ubiquitin ligase activator, positive regulation of protein catabolic process, nuclear export) removed with source_defects; bare protein binding to E1A removed; phenotype-derived transfers (potassium ion transport, Notch signaling, sensory perception of sound, regulation of exit from mitosis, cellular response to antibiotic) marked over-annotated. Literature synthesis written manually (no deep-research API) in Cdkn1b-deep-research-manual.md and Cdkn1b-notes.md.
