  details: |
    Created the rat Vcp (P46462) review from 230 GOA rows. ATP hydrolysis, nucleotide binding, the VCP-NPL4-UFD1 and VCP-NSFL1C complexes, ERAD and retrotranslocation were accepted on rat experimental evidence (PMID:18332143, PMID:10811609, PMID:12847084, PMID:16103111). Regulation-of-catabolism terms were modified to direct-participation terms. Bare protein binding was removed. Phenotype-derived mitochondrial-metabolism, viral-replication and stress-response transfers were marked as over-annotated, and broad parents as too general. One NEW Golgi reassembly (IDA, PMID:10811609) was proposed and flagged for expert check. Literature synthesis was written manually because no deep-research provider was available.
