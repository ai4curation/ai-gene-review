  summary: 'Create review: Slc18a2'
  details: |
    Created the rat Slc18a2 (VMAT2, Q01827) gene review from a freshly fetched GOA set of 77 annotations, with literature work done by hand (no deep-research provider available) and written to Slc18a2-deep-research-manual.md and Slc18a2-notes.md. All 77 rows were reviewed: the monoamine/proton antiporter activity, vesicle-loading process and synaptic-vesicle / dense-core-vesicle membrane locations were accepted as core; amine-specific uptake rows were accepted; generic terms were refined by MODIFY (amine transporter activity to monoamine:proton antiporter activity, neurotransmitter transport and synaptic vesicle and transport vesicle membrane and dense core granule and cell body to their supported descendants), insulin secretion was corrected to regulation of insulin secretion, and drug/toxicant/expression-response rows were kept as non-core. The PANTHER-derived serotonin:sodium:chloride symporter activity IBA was removed (wrong mechanism for an SLC18 proton antiporter, flagged to GO_CENTRAL), and the plasma membrane IDA was marked over-annotated (contradicted by immunogold EM; the cited paper was read as abstract only, flagged to RGD to check). Mast-cell secretion ISOs, post-embryonic development, endocytic recycling, heterocyclic compound binding and the ammonium-ion response were marked over-annotated, the last two with source_defects for RGD to check. Three core functions were synthesised (vesicular monoamine antiport, somatodendritic dense-core vesicle loading, cationic xenobiotic sequestration), plus one proposed new term, four expert questions and three suggested experiments.
