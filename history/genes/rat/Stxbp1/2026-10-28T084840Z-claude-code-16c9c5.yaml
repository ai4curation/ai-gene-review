  details: |
    New review of rat Stxbp1 (Munc18-1, P61765) covering all 107 GOA rows. Core functions: syntaxin-1 binding in synaptic vesicle priming and SNARE complex assembly, a syntaxin-1/VAMP2 template (protein-macromolecule adaptor) driving SNAREpin assembly and fusion, and dense-core vesicle exocytosis (PMID:20801887, PMID:19255244, PMID:24532794). Regulation-of rows for priming, exocytosis and degranulation were modified to the executed processes; KO-phenotype ISO rows and platelet rows were marked over-annotated; three RGD rows from PMID:22810233 (tethering activity, tethering complex, phospholipid scrambling) were marked over-annotated with source_defects; bare protein binding removed. Literature synthesis written manually (no deep-research provider).
