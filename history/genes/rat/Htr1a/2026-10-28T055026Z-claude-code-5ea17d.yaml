  details: |
    Created the rat Htr1a (P19327) review from 68 GOA rows using cached literature and a manual synthesis (no deep-research provider). Core function is Gi/o-coupled serotonin receptor activity in the adenylate cyclase-inhibiting serotonin receptor signalling pathway at the somatodendritic plasma membrane. Generic GPCR, serotonin receptor and signalling terms were refined to these. FGFR1 interaction rows were refined to receptor-receptor interaction. NMDA receptor clustering was corrected to negative regulation of NMDA glutamate receptor activity, as the receptor reduces surface NR2B clusters. Yif1B protein binding and the mouse-propagated serotonin metabolic process were removed. IEP drug-response and family-level InterPro physiology rows were marked as over-annotated. No NEW terms were proposed.
