    De novo review of rat Chrm1 (P08482, muscarinic acetylcholine receptor M1). All 40 GOA-derived rows reviewed against cached literature (full text of PMID:17908240 and PMID:9371842; abstracts of rat cloning, signalling and EM localization papers). G protein-coupled acetylcholine receptor activity, plasma membrane and postsynaptic signalling accepted as core; Gi-coupled cyclase inhibition kept as non-core; generic GPCR activity, GPCR signalling and membrane refined; positive regulation of intracellular protein transport (biosensor readout) and phototransduction marked over-annotated; circadian entrainment ISO left undecided. Added NEW GO:0007207 PLC-activating acetylcholine receptor pathway from rat receptor data, plus manual research and notes files.
