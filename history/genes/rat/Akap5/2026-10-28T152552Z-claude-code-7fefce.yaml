  summary: 'Create review: Akap5'
  details: |
    De novo review of rat Akap5 (AKAP150, P24587), all 108 GOA rows. Literature synthesis written by hand (no deep-research API), with full text read for the AC8 paper PMID:20410303 and five other papers. Core functions are PKA-RII and calcineurin anchoring as a signaling adaptor at excitatory postsynaptic membranes, AMPAR endocytosis, calcineurin-NFAT signaling and AC8 binding with negative regulation of AC8. Molecular adaptor rows were refined to signaling adaptor activity, protein kinase binding rows to PKA-specific terms, and expression-only IEP and broad ISO process rows were marked over-annotated. Source defects were recorded for the complex-disassembly row (removed), a suspected sign inversion on the TRPV1 ion transport row, and SynGO location rows that carry IEP or IMP codes.
