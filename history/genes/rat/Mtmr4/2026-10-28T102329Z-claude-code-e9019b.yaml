  summary: 'Create review: Mtmr4'
  details: |
    New review of rat Mtmr4 (TrEMBL A0A8I6A3Q2, RGD:1310306). All 31 GOA rows reviewed against cached literature on human MTMR4 (12 PubMed hits plus abscission and heteromer papers) and the rat full-text paper PMID:19125695; a motif scan confirmed the catalytic Cys407, FYVE RRHHCR, PY and GPPxxxY motifs. Core function is endosomal PtdIns3P 3-phosphatase activity; generic membrane rows were refined to early, recycling and late endosome membranes, metal ion binding to zinc ion binding, the EC-derived protein tyrosine phosphatase row and the denervation IEP row were marked over-annotated (source defect recorded for the EC mapping), and PtdIns3P binding by the FYVE domain was added as NEW.
