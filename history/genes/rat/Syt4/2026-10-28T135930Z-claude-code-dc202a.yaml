  summary: 'Create review: Syt4'
  details: |
    Created the rat Syt4 (P50232) review from 128 GOA rows, with manual literature synthesis because no deep-research provider was available. Core functions: Ca2+-independent SNARE/syntaxin binding on dense-core vesicle membranes and inhibition of Ca2+-triggered DCV exocytosis; syntaxin-6-dependent homotypic fusion and maturation of immature secretory granules; and KIF1A binding for DCV transport, regulated by JNK. Removed IBA calcium ion sensor activity and calcium-dependent activation of synaptic vesicle fusion, and the ISO calcium-ion and Ca2+-dependent phospholipid binding rows, all contradicted by rat structural and biochemical data. Removed the microvesicle rows (extracellular-vesicle term misapplied to intracellular microvesicles). Recorded source defects for the TANC2 With/From, the axon IMP evidence code, NOT syntaxin binding, human dendrite extension and mouse microvesicle. Added NEW kinesin binding.
