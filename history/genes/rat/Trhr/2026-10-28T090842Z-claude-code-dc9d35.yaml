  summary: 'Create review: Trhr'
  details: |
    Created the rat Trhr (Q01717, TRH-R1) review covering all 17 GOA rows. Core function is TRH receptor activity at the plasma membrane signalling through Gq/11 to phospholipase C, supported by cloning/expression and Gq-immunoblocking papers. Generic IEA GPCR activity, GPCR signalling and membrane rows were refined to the specific terms already carried; identical protein binding was refined to protein homodimerization activity; positive regulation of protein-containing complex assembly (agonist-enhanced receptor homodimerization) was marked over-annotated. PMID:17760865 was read in full: it shows TRH-R2, not TRH-R1, in histaminergic TMN neurons, so no NEW annotation was proposed.
