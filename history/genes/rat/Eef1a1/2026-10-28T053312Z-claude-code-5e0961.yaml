  summary: 'Create review: Eef1a1'
  details: |
    Created the rat Eef1a1 (P62630) review covering all 66 GOA rows. Core functions are translation elongation factor activity and GTPase activity in translational elongation in the cytosol and on cytosolic ribosomes. General terms were refined (tRNA binding to alpha-aminoacyl-tRNA binding, mRNA binding to mRNA 3'-UTR binding, cytoplasm to cytosol, ribosome to cytosolic ribosome, translation to translational elongation). Expression-only and drug-context rows, plus identical protein binding, were marked over-annotated. The IMP for negative regulation of ROS biosynthesis (PMID:23041468) appears to belong to mitochondrial EF-Tu (Tufm) and was left UNDECIDED with a source defect for RGD. Calmodulin binding ISO and NOT nucleus ISO were left UNDECIDED. No NEW terms were proposed.
