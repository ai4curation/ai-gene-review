  summary: 'Create review: Cd48 (rat)'
  details: |
    Initial review of rat Cd48 (OX-45/CD48, P10252). All 26 GOA rows reviewed: location terms (plasma membrane, external side, membrane raft) accepted on the basis of the biochemically defined GPI anchor; extracellular region kept as non-core (soluble form documented only in human); receptor ligand activity, NK cell activation, immune response and heterotypic cell-cell adhesion accepted, reflecting CD48 as the shared rodent ligand of CD2 and 2B4/CD244 (and rat 2B4R); signal transduction, T cell activation and mast cell activation kept as non-core; the IDA protein-containing complex from the CD2-CD48 binding study marked over-annotated, with NEW cell adhesion molecule binding proposed instead. Added PMID:16803907 (rat CD48 structure) and PMID:9841922; deep research unavailable in this environment.
