  details: |
    New review of rat Atp2a2 (SERCA2, P11507) covering all 111 GOA rows. Core: P-type Ca2+ pump moving Ca2+ from cytosol into ER/SR lumen (SERCA2b housekeeping ER store; SERCA2a cardiac SR re-uptake and relaxation). General transport/membrane terms refined to cytosol-to-ER/SR import and ER/SR membrane; precomposed GO:0086039 decomposed to GO:0005388. Source defects recorded for RGD GO:0031234 (subplasmalemmal SR, not plasma membrane; PMID:20177054), human UniProt GO:0016240 autophagosome docking (PMID:28890335) and MGI GO:0045822 (PLN, not SERCA2a, is the negative regulator; PMID:10555147). Mouse phenotype-derived process rows marked over-annotated; unverifiable BHF-UCL membrane-potential rows and the IEP heat row left UNDECIDED. Literature synthesis written manually (no deep-research provider).
