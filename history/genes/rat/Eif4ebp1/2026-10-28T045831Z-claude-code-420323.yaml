  details: |
    Created the rat Eif4ebp1 (Q62622) review. All 45 GOA rows were reviewed against the cached literature (PMID:20736160 read in full, the others abstract-only) and the UniProt record. Accepted translation repressor activity, eIF4E binding, negative regulation of translational initiation and cytosol as core. Refined general terms (translation initiation factor binding, negative regulation of translation, protein-containing complex assembly, cytoplasm, nucleus) to the specific terms. Kept stress-response, TOR signaling, insulin signalling, PP2A binding and synaptic locations as non-core, and marked cell-cycle, IRES-dependent initiation, lung development and ethanol-response rows as over-annotated. No new terms were proposed. A manual literature synthesis and notes file were written because no deep-research provider was available.
