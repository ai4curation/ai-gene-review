  details: |
    Re-audited all 165 existing_annotations rows of rat Casp3 (P55213) after the GOA refresh. Resolved 6 PENDING rows: cytoplasm IBA/ISO/ISS and caspase complex ISO were accepted; regulation of protein localization ISO and response to hydrogen peroxide IEA were marked as over-annotated. The old cytoplasm IBA row, whose WITH/FROM set GOA no longer carries, was retired; the protein-binding IPI and CDK-regulation ISO rows were already retired and kept. Action changes: enzyme activator activity IBA MODIFY->MARK_AS_OVER_ANNOTATED (carried over from the interrupted session). Negative regulation of cytokine production IEA/ISO REMOVE->KEEP_AS_NON_CORE, because caspase-3 cleaves cGAS/MAVS/IRF3 and NF-kB. Pyroptotic inflammatory response and its positive regulation IEA/ISO (4 rows) MARK->KEEP_AS_NON_CORE, because of GSDME activation. Staurosporine IEA/ISO, TRK signalling, wounding, DNA damage response and UV ISO (6 rows) REMOVE->MARK_AS_OVER_ANNOTATED. Sensory perception of sound ISO REMOVE->KEEP_AS_NON_CORE (PMID:11374883). Heart development, T cell homeostasis and activated T cell proliferation ISO KEEP->UNDECIDED, because no source was available. Added supported_by to about 60 ACCEPT/KEEP rows that lacked it, citing UniProt CC lines and cached papers, and added 11 references. Status set to COMPLETE. just validate rat Casp3 passes with 0 errors and 0 warnings; the UniProt stale-quote check reports 0. Follow-up: a human should adjudicate the three UNDECIDED mouse-phenotype ISO rows.
