    De novo review of rat P2rx2 (P49653), the P2X2 extracellularly ATP-gated non-selective cation channel subunit. All 91 GOA rows were reviewed against cached literature (full text for PMID:18616429, PMID:16000618 and PMID:11160443) and a manual literature summary. The channel activity, plasma membrane, receptor complex and cation transport rows are accepted. Generic protein binding IPI rows were removed. Neuronal action potential rows built on voltage-clamp current recordings, response to ischemia, and three over-interpreted mouse ISO phenotypes were marked over-annotated. General terms were refined to their specific descendants. No NEW terms were added.
