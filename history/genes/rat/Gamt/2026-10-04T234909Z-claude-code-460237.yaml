  details: |
    Re-audited all 22 existing_annotations rows. One PENDING row was resolved: the newly seeded second ISO row for GO:0006601 creatine biosynthetic process whose donor is human GAMT (UniProtKB:Q14353), split from the pre-existing mouse-donor ISO row; accepted with its own propagation_review (NO_FAILURE_CORE, SUPPORTS_TRANSFER) noting that it duplicates the rat gene's own IDA evidence. No rows were retired and no action changed on re-audit. The three mouse-donor ISO phenotype rows (spermatogenesis, animal organ morphogenesis, regulation of multicellular organism growth) remain MARK_AS_OVER_ANNOTATED as organismal consequences of creatine deficiency; GO:0005634 nucleus (IBA) remains MARK_AS_OVER_ANNOTATED on the existing node-placement argument (deep eukaryote IBD seeded by the yeast member, same node asserting cytoplasm, rat activity in the liver cytosolic fraction); GO:0042802 identical protein binding remains KEEP_AS_NON_CORE but with a specific rationale replacing the generic one, since the resolved dimer is of the N-terminally truncated protein while UniProt records the physiological species as a monomer and the cleavage abolishes activity. Substantive support-quote repair: five rows cited only the paper title as supporting_text (GO:0006601 TAS, GO:0008757 and GO:0030731 IDA, GO:0030731 NAS, GO:1990402 IEP) and now quote abstract text bearing on the annotation; the core_functions UniProt quote was a paraphrase splicing FUNCTION and PATHWAY and is now the two lines quoted separately. Description rewritten as standalone biology (the prior text narrated the review's own decisions). status moved IN_PROGRESS to COMPLETE. Gamt-notes.md created. just validate rat Gamt passes with no errors and no warnings.
