    Initial review of rat Src (Q9WUD9): all 272 GOA rows reviewed from cached abstracts/full texts and the UniProt record, with a manual literature synthesis (no deep-research provider). Kinase MF rows refined to non-membrane spanning protein tyrosine kinase activity; generic CC rows refined to plasma membrane, focal adhesion, cell-cell junction and podosome; bare protein binding removed except two rows refined to phosphotyrosine residue binding and transmembrane transporter binding; expression-only IEP process rows marked over-annotated; RGD source defects recorded for dendritic growth cone, dendritic filopodium, mitochondrion-derived vesicle, DNA biosynthetic process, signaling receptor activator activity and IEP evidence on CC rows. Added NEW regulation of NMDA receptor activity (PMID:9005855) and three core functions: integrin/RTK signalling at focal adhesions, angiotensin II GPCR-Ras coupling, and NMDA receptor regulation at glutamatergic synapses.
