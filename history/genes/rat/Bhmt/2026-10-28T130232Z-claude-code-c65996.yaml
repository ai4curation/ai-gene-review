  details: |
    Created the rat Bhmt (O09171) review from 30 GOA rows. Betaine-homocysteine S-methyltransferase activity (GO:0047150), cytosol, L-methionine salvage and amino-acid betaine catabolic process were accepted as core. Generic methyltransferase rows were modified to GO:0047150, amino-acid betaine metabolic process to its catabolic child, and L-methionine biosynthetic process to L-methionine salvage. Nucleus, zinc binding, homotetramer, the NOT S-adenosylmethionine metabolic process and the ethanol response were kept as non-core. Serum, exosome and affinity co-purification complex rows were marked over-annotated. Literature synthesis was written manually because no deep-research provider was available.
