  details: |
    De-novo review; automated deep research unavailable, manual literature research recorded in Msed_0638-notes.md. Han et al. 2012 (PMID:22752162) identifies Msed_0638 as the catalytic MCM-alpha subunit of an alpha2beta2 B12-dependent mutase with the remote B12-binding subunit Msed_2055, autotrophically upregulated. GO:0004494 accepted (contributes_to in core_functions); catalytic activity and intramolecular transferase TOO_GENERAL; cobalamin binding KEEP_AS_NON_CORE; carbon fixation GO:0015977 NEW. PMID:22752162 and PMID:20008169 were cached while NCBI esummary was failing, via cache_publication with esummary metadata rebuilt from PubMed efetch XML.
