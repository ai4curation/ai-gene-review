- type: CREATE
  outcome: changed
  summary: New review of Msed_1700 (A4YHF3), the M. sedula aspartate-semialdehyde
    dehydrogenase misnamed malonyl-CoA reductase by ARBA
  details: |
    Reviewed all 7 IEA GOA rows. ACCEPT (2): GO:0004073 ASD activity and
    GO:0009088 L-threonine biosynthesis. MODIFY (2): GO:0016620 to GO:0004073, and
    GO:0008652 to GO:0009088. KEEP_AS_NON_CORE (2): NADP binding, protein dimerization.
    UNDECIDED (1): NAD binding, which is plausible because the M. jannaschii ASD is
    dual-specific. No experimental data exist for Msed_1700. Its identification as ASD
    rests on the asd gene cluster (Msed_1698 threonine synthase, Msed_1699 aspartokinase),
    69% identity to the S. tokodaii asd (ST1242) against about 40% to the MCRs, and the
    ASD-type CDD models. The ARBA00067001/ARBA00052213 malonyl-CoA reductase naming is
    judged wrong. Wrote notes (automated deep research unavailable) and a reproducible
    bioinformatics comparison. Found that TIGR00978 is present on both Msed_0709 and
    Msed_1700, so it does not discriminate the paralogs, while the CDD subfamily models
    do. Cached PMID:16225889 and PMID:26869335.
