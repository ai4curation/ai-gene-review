  summary: Initial review of Msed_0406 4-hydroxybutyrate-CoA ligase (PTHR43605:SF10)
  details: |
    First review of M. sedula Msed_0406 (A4YDT1), a PTHR43605:SF10 relative of P. putida PP_2213. Removed GO:0004321 fatty-acyl-CoA synthase (synthase/synthetase confusion from PAINT IBD PTN001944787; GO_CENTRAL source defect), GO:0006633 fatty acid biosynthetic process (enzyme acts in the 3HP/4HB CO2-fixation cycle; IBD seeds point to oxidation) and GO:0016020 membrane (predicted TM helix is a buried helix in the 8BIQ crystal structure; UniProt source defect, PROBABLE). Marked acetyl-CoA synthetase and propionate-CoA ligase IDA/IEA rows as over-annotated (in vitro side activities; Msed_1353 is the dedicated acetate/propionate synthetase). Modified medium-chain fatty acid-CoA ligase and fatty acid ligase rows to GO:0031955 short-chain fatty acid-CoA ligase activity (all measured substrates C2-C5). Added NEW GO:0015977 carbon fixation (IDA, PMID:24532060). Proposed new terms 4-hydroxybutyrate-CoA ligase activity (core MF) and carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle. Deep research providers unavailable; PMID:23258541 abstract-only, kinetics from curated UniProt text.
