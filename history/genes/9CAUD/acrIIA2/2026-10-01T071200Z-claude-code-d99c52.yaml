  summary: 'Review: 9CAUD acrIIA2 (anti-CRISPR)'
  details: |
    Completed review of acrIIA2, an anti-CRISPR exemplar cited by modules/anti_crispr_suppression.yaml: a sequence-unrelated Listeria phage Cas9 inhibitor that converges on the same PAM surface as AcrIIA4, which is the evidence that mechanism rather than family is the reusable unit; carries the same drafted mimicry term. Reviewed as part of a set of seven, organised by the step of the host CRISPR pathway each protein attacks rather than by family, since anti-CRISPR families share no sequence homology. Consistency with the existing genes/BPZF4/AcrF8 review was a design requirement, including its MODIFY from the generic GO:0052170 to the specific GO:0098672. Several of these are unreviewed TrEMBL entries with uninformative names despite having published structures bound to their targets, which is itself recorded as a curation gap in the module.
