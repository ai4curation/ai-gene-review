  details: |
    Two commits on this file, both from review of PR #5984, and this record
    supersedes two statements in 2026-11-05T064840Z-claude-code-18a735.

    1430cafdf2. The DUPLICATE_ASSERTION explanation gained a precedence
    paragraph. The two 2025 rows it asks CACAO to delete are the same rows
    that genes/9CAUD/acrIIA5 asks CACAO to repoint, so the corpus was asking
    for two incompatible things about one record, and because acrIIA5's entry
    was filed resource: OTHER the two reached different per-resource reports.
    The explanation now names that defect and states that deletion takes
    precedence: the surviving 2019-02-12 row already carries the same term,
    reference and evidence code with the correct qualifier, so retiring the
    pair resolves the qualifier defect as a side effect, whereas repointing
    them would leave two further copies of a row that already exists.
    acrIIA5's entry was re-filed to CACAO in the same commit so both reach
    one report; that half is recorded under its own target.

    304aafaa2b. The prose corrected_value added in the previous session was
    removed. SUPERSEDES the earlier record's "it now names only the two to
    delete, with corrected_value naming the row to keep": true for 975542f80
    and 1430cafdf, since the field existed in the committed tree for those
    two commits, and false afterwards. Three grounds, each checked: the slot
    is documented "as a CURIE" (gene_review.yaml:833-839); the DELETE_ROW
    branch of _describe_change returns
    f"delete the record asserting {asserted}" and never reads
    corrected_value, so it reached only the TSV column; and
    DUPLICATE_ASSERTION's own description assigns which-row-to-keep to the
    explanation, where it already was. asserted_value alone had fixed the
    render.

    That earlier record was first corrected in place and then reverted to its
    original wording on review. The in-place edit was wrong on the rule I had
    argued for a round earlier: docs/history.md turns the choice on whether
    the statement was ever true, and this one was. My reason for editing it -
    that the field "should not have existed" - is a judgement about whether
    the state deserved to exist, which is not the test. The never-true branch
    covers miscounts and wrong identifiers; a field that really was committed
    is neither.

    Also removed from the DUPLICATE_ASSERTION explanation in the same review
    round: a sentence recording that acrIIA5's entry had been re-filed from
    OTHER to CACAO and that the two defects previously reached different
    reports. docs/source_defects.md:59 defines explanation as self-contained
    text a curator at the resource can act on, and render_report emits it
    verbatim into reports/CACAO.md, so this repository's filing history and a
    PR number in our tracker do not belong there - least of all a description
    of a routing failure that the report's own existence disproves. The
    cross-reference and the precedence statement stay, being actionable. The
    cbcW precedent is the model: PR references live in review.reason or
    review_notes, which stay internal.

