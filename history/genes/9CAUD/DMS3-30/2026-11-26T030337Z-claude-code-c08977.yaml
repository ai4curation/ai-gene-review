  summary: Record OpenScientist analysis of AcrIE3 host discrimination, with the charge
    argument refuted and the host-side candidates named
  details: |
    Ran an OpenScientist deep-research job (kgap-acrie3-cas8e-discrimination) on the AcrIE3 host-discrimination gap. It supports one half of the question, refutes the reasoning this review's own hypothesis rested on, and states plainly that the remaining half is not answerable from deposited data.

    Supported: the Cas8e PAM recognition site is rebuilt between the two hosts and the rebuild is species-fixed, so this is a species boundary rather than a strain accident. The two proteins are twilight-zone homologs at 21.7 per cent identity overall, yet of the 21 residues contacting the PAM duplex in the E. coli Cascade structure only 3 are identical, below the whole-protein figure, with 9 of 21 substitutions changing formal charge. The largest local change is the PAM-reading L1 loop, GFGGGFK at E. coli 157-163 against the six-residue-longer PGGLVKTVRDSDK at P. aeruginosa 171-183, present in 16 of 16 E. coli K-12-like and 65 of 66 P. aeruginosa sequences. Forward and reciprocal mappings, which make different errors, converge on the same patch and nominate K176 and K183 flanked by D180 and D182, with L174 and V175 adding about 100 cubic Angstrom where E. coli has G159 and G160; the reciprocal mapping also removed an earlier candidate, R179.

    Refuted: the electrostatic premise supplied by the prompt. AcrIE3 is net charge -13 at pI 3.94, which the local A0SMP0 sequence reproduces exactly at 19 acidic against 6 basic residues in 68, yet it inhibits the less basic Cas8e at pI 5.48 and fails against the more basic Cse1 at pI 8.55. Bulk and patch charge complementarity therefore predict the wrong host, so that argument cannot be used.

    Not answerable: the choice between a residue-identity and a conformational explanation. AlphaFold has no model for A0SMP0 and no P. aeruginosa type I-E Cascade structure is deposited, and the modelling substitute fails its own same-protein control, scoring 0.495 for the two Cas8e models against 0.834 for the E. coli model onto its own crystal structure, while a sequence-seeded superposition fitted three atoms and was meaningless. The AcrIC8 and AcrIC9 precedent, where PAM recognition is blocked allosterically and competitively, shows an inhibitor can suppress PAM read-out without contacting PAM residues, so the conformational alternative has precedent rather than merely being unexcluded.

    The inhibitor side is settled: one dominant acidic patch of E35, D53, E54, E61, E64, D66 and E67, spanning 27.9 Angstrom with 723 square Angstrom exposed, all seven confirmed in the local record.

    An incidental hazard was captured for the project: most entries labelled Cse1 or CasA across E. coli, Klebsiella and P. aeruginosa sit in Cas8e clades only about 21 to 25 per cent identical to E. coli K-12 CasA, with 0 of 54 sampled non-E. coli Enterobacteriaceae sequences passing a 40 per cent identity filter, so residue-level or mechanistic annotation must not be transferred across the Cas8e label.

    The first gap moved from OPEN to NARROWING with named host-side candidates. The second gap, on whether AcrIE3 mimics the DNA phosphate backbone or locks Cas8e in a non-permissive conformation, gains the deposited-structure status and the allosteric precedent in its boundary but stays OPEN, since neither mechanism can be tested. No annotation action was changed. The local record carries no PDB cross-reference, so the 1.33 Angstrom AcrIE3 structure the run used was not checked here; also not recomputed were the Cas8e alignments and identities, the PAM-contact positions, the L1 loop species frequencies, the host-side numbering, the superposition scores and the solvent-accessibility figures.
