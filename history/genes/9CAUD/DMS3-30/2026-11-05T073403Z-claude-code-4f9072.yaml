  summary: Three repo-facing passages removed from the DUPLICATE_ASSERTION explanation
  details: |
    One commit on this file, from review of PR #5984. Nothing in the two
    existing records for 2026-11-05 becomes false: both describe the precedence
    cross-reference and the corrected_value removal, which this change leaves
    intact.

    Three repo-facing passages removed from the DUPLICATE_ASSERTION
    explanation, which render_report emits verbatim into
    reports/source-defects/CACAO.md. Round 4 blocked on two sentences of the
    same kind; these survived it because they predate that round rather than
    because they belong.

    "Filed from this review because AcrIE3's own qualifier defect is one row of
    the same campaign; the defective record is another gene product, so it is
    named in `record`" - entirely our filing mechanics. CACAO has no record
    slot, and which review a defect was filed from is printed by the report as
    "Recorded in:" already. Removed.

    "Read from file:9CAUD/acrIIA5/acrIIA5-goa.tsv, which carries four
    GO:0098672 rows for A0A220GHA5" - a repo-relative path with no precedent in
    this field anywhere in the corpus, naming one of our derived files as the
    place a CACAO curator should look for their own annotations. Replaced with
    the fact itself: "A0A220GHA5 carries four GO:0098672 rows, all assigned_by
    CACAO."

    "No supported_by: ... and a GOA file is never support" - the reviewer did
    not flag this one; it is the same class and I removed it on the same
    grounds. supported_by is our slot and the GOA-file rule is our policy, so
    neither means anything to the reader. The substance survives as "No
    publication is cited because the claim here is the state of this annotation
    set rather than a biological one", which is the part that answers a curator
    wondering why an evidence-backed report cites nothing.

    Kept deliberately: the cause paragraph, since cause is itself exported as
    "Likely cause:" and the reasoning distinguishes this defect from its
    sibling; and the repo path inside the cross-reference, which the reviewer
    judged fine for the same reason the "Recorded in:" line is.

    The explanation was also re-wrapped to one width with real paragraph breaks,
    which changes no words; the folded scalar renders to the same text.

    Verified in reports/source-defects/CACAO.md after the change: no "file:",
    no "named in `record`", no "No supported_by", two "preferred fix"
    statements still present, and the DELETE_ROW Change: line still names only
    the two 2025 rows.

    No annotation, term, action, evidence code or core function changed.
