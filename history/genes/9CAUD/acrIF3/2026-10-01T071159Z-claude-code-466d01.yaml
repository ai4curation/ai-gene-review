  summary: 'Review: 9CAUD acrIF3 (anti-CRISPR)'
  details: |
    Completed review of acrIF3, an anti-CRISPR exemplar cited by modules/anti_crispr_suppression.yaml: the Cas3 sequestering inhibitor, asserted as GO:0140311 protein sequestering activity; this mechanism has no class 2 counterpart because recognition and cleavage share one protein there. Reviewed as part of a set of seven, organised by the step of the host CRISPR pathway each protein attacks rather than by family, since anti-CRISPR families share no sequence homology. Consistency with the existing genes/BPZF4/AcrF8 review was a design requirement, including its MODIFY from the generic GO:0052170 to the specific GO:0098672. Several of these are unreviewed TrEMBL entries with uninformative names despite having published structures bound to their targets, which is itself recorded as a curation gap in the module.
