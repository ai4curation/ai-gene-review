- type: EDIT
  outcome: changed
  summary: Wire OpenScientist finding that no published format can order interception
    against extraction
  details: |
    Wired an OpenScientist run (kgap-acrif3-extraction-order) into the knowledge gap
    asking whether AcrIF3 can extract Cas2/3 already engaged with a licensed R-loop or
    only intercept it free. Status OPEN -> NARROWING. The verdict is unresolved by
    absence of evidence rather than by conflicting evidence, which is the more
    actionable state because it names the missing experiment.

    Every mechanistic experiment on this protein is a steady-state or pre-incubation
    format in which the inhibitor is present before or alongside the Csy complex and
    Cas2/3; such formats cannot order events by construction. The run looked for the
    three designs that could order them and found none: no order-of-addition assay
    supplying AcrIF3 after R-loop formation, no kinetic or single-molecule measurement
    of Cas2/3 dissociation with inhibitor present, and no in vivo experiment inducing
    AcrIF3 after interference has begun. The thermodynamics cannot be evaluated either,
    because no dissociation constant is published for AcrIF3 binding Cas2/3 or for
    Cas2/3 binding the target-bound Csy complex - precisely the two numbers extraction
    would have to compare.

    Three computed results constrain without settling, and they do not all point the
    same way:
    - The AcrIF3 and Csy footprints on Cas2/3 overlap sterically: 8 of 18
      Csy-contacting residues of an R-loop-engaged Cas2/3 fall inside the 58-residue
      AcrIF3 footprint, and modelling AcrIF3 onto the recruited nuclease gives
      1731-1833 heavy-atom pairs below 3.0 A. Necessary for extraction, equally
      consistent with interception.
    - The ADP state is not a conformational lock: the RecA1-RecA2 hinge varies by
      0.00-1.17 degrees across 16 independent Cas3 copies spanning apo, ADP, AMPPNP and
      ATP. Nucleotide identity does not reorganise the enzyme, so it does not define a
      state a recruited Cas2/3 could not occupy - removing one mechanism by which
      extraction might work.
    - In the only structure of a recruited Cas2/3, Csy supplies just 17.1% of the
      partner interface (841 A^2) against the Cas1 dimer (2662 A^2 per side) and the DNA
      (1409 A^2). An inhibitor masking the Csy-binding surface therefore has limited
      purchase on an already assembled complex, which argues against extraction.

    The in vivo literature leans the same way - acr operons fire immediately after DNA
    injection, a single Acr-producing phage still loses its own genome while
    contributing to the dose that lets later genomes succeed, and Acr phages must
    cooperate - all of which interception predicts. But that evidence is
    population-level, indirect, and was obtained with AcrIF1 and AcrIF4 rather than
    AcrIF3. The run treats it as constraining rather than settling, and so does this
    review; it also notes that the single-molecule technique needed for the decisive
    experiment was published in 2015 and has never been run with an anti-CRISPR.

    Nothing here was independently recomputed, and the reference review says so: the
    footprint overlap and clash counts, the hinge-angle survey, the buried-surface-area
    partition and the searches establishing the absence of the three designs are all
    taken as reported. What earns the entry credit is the run's own discipline - it
    declines to borrow the AcrIF1/AcrIF4 evidence, reports its structural results as
    constraining rather than deciding, and two of the three argue against the model the
    gap entertains.

    No annotation action changed.
