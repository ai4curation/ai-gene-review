  details: |
    Two changes, both from review of PR #5984.

    The WRONG_QUALIFIER defect moves from resource: OTHER to CACAO. The row is
    assigned_by CACAO and the value has always existed, so this was a
    misfiling rather than a schema gap - one of roughly eleven left in the
    corpus after that PR swept seven others.

    It mattered more than a routing tidy-up here. PR #5984 filed a
    DUPLICATE_ASSERTION defect against this same record from
    genes/9CAUD/DMS3-30, asking CACAO to delete the 2025-04-07 and 2025-04-10
    rows, while this entry asked CACAO to repoint the qualifier on those same
    two rows. Filed as OTHER, the two landed in separate per-resource reports,
    so a CACAO curator reading reports/CACAO.md would have seen the deletion
    and no sign that a repoint had also been requested. Both now reach the
    CACAO report together, confirmed by re-running the exporter: six mentions
    of A0A220GHA5 in CACAO.md and none in OTHER.md.

    Each explanation now names the other defect and states which fix takes
    precedence. Deletion is preferred: the two 2025 rows are exact duplicates
    of each other, and the surviving 2019-02-12 row already carries the same
    term, reference and evidence code with the correct qualifier, so deleting
    the pair resolves the qualifier defect as a side effect. Repointing them
    instead would leave two more copies of a row that already exists. This
    entry is kept rather than deleted because the qualifier is genuinely
    wrong and the duplication request might be declined, in which case
    repointing the survivor is the remedy.

    cause: OTHER -> PRACTICE_CHANGE, matching the sibling qualifier defects
    across the same dated CACAO campaign.

    Noted for the schema, not acted on here: SourceDefect has no structured
    way to say that one defect supersedes another, so the relationship is
    prose in both explanations. report_status covers only the reporting
    lifecycle (NOT_REPORTED through FIXED or DECLINED). Raised on the PR
    rather than added, since the same PR had just extended three enums and
    each addition was argued on measured need.

    No annotation, term, action, evidence code or core function changed.
