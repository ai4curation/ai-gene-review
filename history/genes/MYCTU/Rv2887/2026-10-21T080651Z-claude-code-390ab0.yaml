  details: |
    New folder genes/MYCTU/Rv2887 seeded with just fetch-gene. Deep research unavailable (falcon auth failure; perplexity quota 401), recorded in the notes file; review built from the three cached primary papers (PMID:26303802 abstract-only, PMID:27432954 and PMID:28743871 full text) plus the UniProt record. All four GOA rows actioned: GO:0003700 IEA MODIFY to GO:0141096 ligand-modulated transcription repressor activity; both GO:0006355 rows (IBA and IEA) MODIFY to GO:0045892 consistently, with propagation_review recording PAINT node PTN002109389 as a sound transfer whose only gap is the sign of regulation; GO:0006950 IBA KEEP_AS_NON_CORE. Two NEW rows added from direct species evidence: GO:0000976 (27-bp DNase I footprint on the Rv0560c promoter, co-crystal, EMSA with an mbtB negative control) and GO:1901149 (ITC, salicylate- and PAS-bound structures, R42A/D114A mutagenesis). No process term proposed for methylation or drug susceptibility: the methyl transfer is performed by Rv0560c, not by Rv2887. Reviewed independently of the ProtNLM2 predictions; notes flag that the low (~29%) identity to CHRVO/Q7NUH2 means only the generic DNA-regulatory claim is transferable on subfamily membership.
