  summary: 'Create review: MYCTU sigI (P9WGH3)'
  details: |
    De-novo review of M. tuberculosis SigI (Rv1189), independent of ProtNLM2 predictions. Falcon and perplexity deep research both failed (Edison 403), so the review was built from primary literature fetched from PubMed/PMC; that failure is recorded in sigI-notes.md. All 8 GOA rows actioned: ACCEPT for DNA binding, transcription initiation and both sigma factor activity rows (IBA + IEA) and for regulation of transcription initiation; MODIFY of the two generic parents (GO:0003700 to GO:0016987, GO:0006355 to GO:2000142), both ancestor relationships verified via OLS; KEEP_AS_NON_CORE for the MTBBASE cold-shock IEP, retained because the cached publication is abstract-only. Core function grounded on Lee et al. 2012 (PMID:22434196), which reconstituted SigI with core RNA polymerase and showed motif-dependent transcription of katG. The IBA was checked against PAINT node PTN001249270, seeded by SigJ (SF36) and sitting above SigI's subfamily SF43, so only the family-wide sigma factor activity transfers; no SigJ-specific function and no downstream organismal phenotype (isoniazid resistance, hypervirulence) was annotated.
