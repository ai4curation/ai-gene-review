  summary: Apply replication-primer scope consistently across LigD orthologs
  details: |
    The PMID:16023671 abstract directly demonstrates unprimed RNA synthesis by H37Rv LigD and Ku-stimulated primer extension in an NHEJ context. This establishes primase chemistry, but GO:0006269 is part_of DNA-templated DNA replication; the definition's DNA-damage clause does not by itself establish that process for LigD. The full article remains unavailable here, so the experimental process annotation is UNDECIDED rather than rejected from an abstract-only reading. Apply the same unresolved process judgment to its IBA; the target's appearance as a seed is legitimate and not circular. The biochemical activity itself remains supported.
