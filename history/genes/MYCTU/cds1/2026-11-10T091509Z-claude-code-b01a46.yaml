  details: |
    Verdict unchanged: GO:0019344 (L-cysteine biosynthetic process, IBA at the PTHR10314 root PTN000034104) stays REMOVE. The reason no longer cites the Cds1 branch as the longest from the root, which was wrong: the five root branches are 0.412, 0.528 (Cds1), 0.659 (threonine synthase), 0.458 and 0.402. It now rests on what the PANTHER 19.0 tree shows: the root is a duplication with five branches, all 19 seeds sit in three of the other four and none in the Cds1 branch (PTN008304321), so every seed is a paralog of cds1, 21-27% identical to it over the aligned columns. WRONG_ORTHOLOG_OR_PARALOG added to failure_modes; the row now quotes cds1-phylo.yaml (generated by just phylo MYCTU cds1). Two quotes that were not verbatim (deep-research file, family notes) were replaced with verbatim text and their entries dropped from conf/local_quote_baseline.yaml. cds1-notes.md carries a dated correction. Checked with just validate MYCTU cds1: valid, no tree-evidence warning.
