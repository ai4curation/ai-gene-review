  summary: Record OpenScientist genome reconstruction selecting the lipoprotein-acetylation
    fate for the PcrB product, with the acceptor supply unexplained
  details: |
    Ran an OpenScientist deep-research job (kgap-pcrb-product-fate) on the gap covering the downstream fate and physiological role of the PcrB ether-lipid product in G. kaustophilus HTA426. The genome does select between the candidate routes, names the two downstream enzymes that have gene assignments anywhere, and leaves two holes the run says the genome cannot fill.

    The selected route is dephosphorylation, then acetylation, then use as the acetyl donor for N-acetylation of lipoprotein alpha-amino termini. Both assigned steps have unambiguous single-copy orthologs in HTA426, GK3078 for the YvoF acetyltransferase and GK2189 for the lipoprotein N-acetyltransferase LhaT, each separated from its nearest competitor by more than 200 bits, and the terminal step has a substrate pool: lgt as GK3081, lspA as GK1145, and 77 lipobox candidates, 2.2 per cent of the 3516-protein proteome. The competing archaeal reading fails at all three of its steps, with no digeranylgeranylglyceryl phosphate synthase, no CDP-archaeol synthase and no geranylgeranyl reductase, best scores of 28.6, 30.9 and 53.4 bits against 250 to 285 for genuine orthologs in the same search. The processing genes cluster as a conserved Bacillales operon, so the pathway is retained as a unit rather than as chance orthologs.

    Two holes remain. The dephosphorylation step has no assigned gene in any organism, the original work supposing only that some phosphatase acts non-specifically, so the genome offers candidates led by GK3079 for PpaX, which overlaps yvoF by 4 base pairs, but cannot choose. More sharply, the genome encodes no source for the sn-glycerol-1-phosphate acceptor: AraM has no ortholog by three independent checks and the corresponding KEGG group is absent from all three Geobacillus genomes examined. The structure sharpens rather than dissolves this, because PDB 4NAE is this protein itself at 2.0 Angstrom with sn-glycerol-1-phosphate bound, and the local record carries both 4NAE and 4NAF, so the enzyme demonstrably binds an acceptor whose supply route is not in the genome. In vivo flux through PcrB in this strain is therefore not established.

    The run corrects an expectation the hypothesis carried: the pcrB neighbourhood is uninformative about product fate. GK0274 sits in a pcrB-pcrA-ligA arrangement invariant across 13 of 13 Bacillales genomes carrying pcrB, a DNA replication and repair context with no phosphatase, acetyltransferase or lipoprotein-processing gene adjacent; the informative clustering is one locus away, around yvoF.

    Nothing in this pathway has been measured in any Geobacillus, so the downstream assignment is orthology transfer from B. subtilis, and the 2025 paper assigning the terminal step reports a species-dependent immunological outcome among Bacillus, which makes the untested status of this genus a real gap rather than a formality.

    One annotation nuance is recorded without acting on it: the run judges GO:0046474 chemically defensible, since the product is a glycerophosphate derivative bearing an O-alkyl group, while noting that the term implies a membrane-phospholipid destination the product does not have, its destination being lipoprotein acetylation. It also notes that neither downstream partner carries any annotation from the 2025 reassignment, so that pathway change has not propagated into GO anywhere.

    Gap status moved from OPEN to NARROWING, since the route is now named with orthologs while two steps remain unassigned or unexplained. No annotation action was changed. Verified locally: the 4NAE and 4NAF cross-references, locus GK0274 and protein existence level 1. Not recomputed: the ortholog searches and bit scores, the absence calls, the lipobox scan, the operon and neighbourhood surveys, and the QuickGO inventory.
