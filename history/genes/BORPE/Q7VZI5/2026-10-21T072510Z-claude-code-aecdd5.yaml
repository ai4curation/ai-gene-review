  summary: 'Full re-review: Q7VZI5 (BP0922) independent of ProtNLM2'
  details: |
    Full re-review independent of ProtNLM2 output. New bioinformatics (compare_prpf_family.py, RESULTS.md) shows BP0922 is a divergent PTHR43709:SF2 paralog (about 36% identity to PrpF, no TIGR02334 match, outside the prp cluster BP2368-BP2371, which has its own PrpF, BP2370) and is about equally related (35-45%) to Mii, Adi1, LigU and GalD. Withdrew the earlier NEW proposals GO:0050100 (methylitaconate delta-isomerase: substrate unresolved) and GO:0019543 (propionate catabolism: role belongs to paralog BP2370). Added NEW GO:0016853 isomerase activity (family-wide, catalytic Lys/Cys retained). Kept NEW cytoplasm with hydropathy support. Rewrote description/core_functions as substrate-agnostic. Rated the falcon deep research LOW_QUALITY. Added notes file.
