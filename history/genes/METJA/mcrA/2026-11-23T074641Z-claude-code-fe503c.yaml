  details: |
    PR #6211 (ARCHAEA round 5) and PR #6335 (mcrA across clades) both reviewed Q58256. #6335 merged first. On merging main into #6211 the cross-clade review was kept: it agrees with the round 5 review on all six GOA rows (cytoplasm IEA/ISS ACCEPT, methanogenesis MODIFY to GO:0019386, GO:0050524 IEA/ISS ACCEPT) and on the NEW MCR complex row, and adds tetrapyrrole binding. The round 5 review's UniProt source defect (MISSING_STATEMENT, FT:MOD_RES 448 thioglycine) and its references PMID:31139720 and PMID:17725644 were carried over to the reference review of the UniProt record. Three further M. jannaschii references from the round 5 review were also carried over with their reference reviews: PMID:30824444 (expression under H2 limitation), PMID:24505058 (growth only on H2 plus CO2, supporting GO:0019386) and PMID:15253435 (checked, not used). Notes file appended, including the round 5 reading that PMID:28559298 places M. jannaschii MCR in type III (from the uncached PMC full text).
