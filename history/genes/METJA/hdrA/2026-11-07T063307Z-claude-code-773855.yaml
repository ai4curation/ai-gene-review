  summary: New review of M. jannaschii HdrA (P60200), the FAD electron-bifurcating
    subunit of cytoplasmic HdrABC
  details: |
    Reviewed 3 GOA rows. Both GO:0051912 rows (IBA, IDA) are MODIFY to a proposed term for EC 1.8.98.5 (H2:CoB-CoM heterodisulfide,ferredoxin reductase activity) with contributes_to. Reasons: GO:0051912 is defined with methanophenazine as acceptor, and the disulfide is reduced at HdrB, not HdrA (archaea pattern 16). GO:0016491 (ARBA IEA) is MODIFY to the same proposed term. NEW rows: electron transfer activity, FAD binding, 4Fe-4S cluster binding, CoB-CoM heterodisulfide reductase complex, and methanogenesis from CO2. Source defects: the MENGO IDA cites a 75Se selenoprotein-labelling paper (suspected wrong reference), and this row is the only seed of PAINT node PTN000078336, which also propagates to Korarchaeum. Cached PMIDs 21262829, 20534465 and 28818947.
