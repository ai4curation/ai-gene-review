  summary: New review of M. jannaschii Hmd, the structurally characterised [Fe]-hydrogenase;
    P5C reductase IBA rows removed
  details: |
    Reviewed all 5 GOA rows. ACCEPT GO:0047068 N5,N10-methenyltetrahydromethanopterin hydrogenase activity (core; direct evidence on the reconstituted M. jannaschii enzyme, Cys176 iron ligand, apo/holo/C176A/substrate-complex structures PDB 2B0J, 3DAF, 3DAG, 3F46, 3F47, 3H65) and GO:0019386 methanogenesis from CO2. KEEP_AS_NON_CORE GO:0006730. REMOVE IBA GO:0004735 P5C reductase activity and GO:0055129 L-proline biosynthesis from PTN000182176 (ARCHAEA pattern 1): the node is sound for the ProC/PRO3/PYCR seeds but Hmd is a neofunctionalized branch (H2 and FeGP, methenyl-H4MPT+, no NAD(P)H); source_defects to GO_CENTRAL requesting an IRD. Pairwise check (hmd-bioinformatics/) puts Hmd vs P5CRs at shuffled background, so no P5CR catalytic residue maps onto Hmd. NEW cytoplasm (IC). Reused the METTH hmd proposed term iron-guanylylpyridinol cofactor binding. PTHR11645 family review already lists Q58194 as member exception for both FAMILY_WIDE terms; family_gene_crosscheck reports no conflict, so the family review was not changed. Cached PMID:16887798, 19162018, 19623593, 26094576, 30600878, 20235826, 37671838.
