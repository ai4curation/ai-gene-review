  details: |
    Reviewed all 11 GOA rows for M. jannaschii mevalonate kinase MJ1087 (Q58487). Primary biochemistry (PMID:10497066, PMID:12880770, PMID:42808591) and structure (PMID:11751891) confirm the classical EC 2.7.1.36 reaction; the organism's modified mevalonate pathway diverges only after mevalonate 5-phosphate (PMID:16621811), so the PTHR43290 root-node IBAs (PTN000048555: MVK activity, IPP biosynthesis via mevalonate, cytosol) are sound for this member. Actions: 8 ACCEPT, 1 KEEP_AS_NON_CORE (Mg ion binding), 2 TOO_GENERAL (kinase activity and alcohol-acceptor phosphotransferase from the shared mevalonate/galactokinase InterPro signature). No NEW rows. Validated with just validate (schema, terms, references) and the quote checker; record sections backfilled.
