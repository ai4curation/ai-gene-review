  summary: 'Full re-review: A0A061AL94 mcm-4 Y39G10AR.14b fragment'
  details: |
    Full re-review independent of ProtNLM2 predictions. Established that A0A061AL94 is the 74-aa Y39G10AR.14b product, identical to canonical MCM-4 Q95XQ8 residues 750-823 (internal Met750 start, single-exon model), lacking the zinc finger, AAA+ ATPase domain, Walker A/B, ATP-binding residues and arginine finger (new bioinformatics/compare_to_canonical.py + RESULTS.md). Corrected the canonical accession (previous draft said P34579, which is UNC-47). GOA is empty; dropped the five author-proposed ISS/NEW rows (DNA helicase activity, DNA replication initiation, DNA replication, nucleus, MCM complex) transferred from full-length orthologs, since the fragment lacks the domain these depend on. Rewrote description and core_functions; added PMID:21146520 (single full-length transcript by cDNA and northern). Kept all prior references with review notes. Relative: same-gene canonical Q95XQ8 (unreviewed in repo).
