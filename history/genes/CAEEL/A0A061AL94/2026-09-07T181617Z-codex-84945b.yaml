  details: |
    Audited genes/CAEEL/A0A061AL94/A0A061AL94-protnlm-predictions-review.yaml against the source-independence and final-state prose guidelines in .claude/skills/review-function-prediction/SKILL.md.

    Replaced rationale prose with the current assessment, traced biological claims to sequence/domain records, primary publications, and where relevant experimentally grounded curated annotations or reproducible analysis. Removed AI/OpenScientist verdicts as supporting evidence and unsupported error-mechanism claims. Source prediction terms and method/version metadata were preserved. Existing annotation overlap is separated from biological correctness and is not evidence of training-data contamination.

    GO:0006367 (transcription initiation at RNA polymerase II promoter): NPI -> UNC. The record links this 74-residue sequence to mcm-4, whose full-length Caenorhabditis elegans product is experimentally established in DNA replication and replication checkpoint control (PMID:21146520). These findings do not establish RNA polymerase II transcription initiation, and the short sequence lacks the architecture of a complete MCM helicase subunit. They also do not exclude every indirect transcriptional role. The exact process is absent from the cached annotations and remains unverified for this gene product.

    GO:0005634 (nucleus): COR -> UNC. Full-length C. elegans MCM-4 associates with chromatin and functions in nuclear DNA replication (PMID:21146520). The accession being evaluated encodes only 74 residues, so transfer of nuclear localization requires evidence that this fragment retains targeting or complex-association determinants or represents an incomplete model of the full-length product. The inspected sources do not resolve that relationship experimentally. Nucleus is absent from the cached annotations and is uncertain for the deposited sequence, despite being appropriate for full-length MCM-4.

