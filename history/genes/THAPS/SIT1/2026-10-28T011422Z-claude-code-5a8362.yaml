  summary: Re-point TpSIT3 ISS donor citation and record donor verification (PR 5637
    follow-up round)
  details: |
    Second review round on PR 5637. The ISS GO:0015115 reason previously asserted that the T. pseudonana paralog TpSIT3 transports silicic acid on the strength of the PMID:22530967 abstract, which names no paralog. Re-pointed to PMID:27305972, adding the verbatim quote that names TpSIT3 among the reconstituted SITs and the quote qualifying its activity as only just discernible above background; the reason now states that B7T1F4 (PtSIT1) carries the inference and B8C4N0 (TpSIT3) is a supporting conspecific donor rather than an equal one. The PMID:22530967 quote is kept only for the family-level sodium-dependence claim it does make. The ISS summary wording corrected: it said no GO term exists for silicic acid transport, which the accepted GO:0015708 silicic acid import contradicts; it now says no silicic-acid-specific transporter activity term. Notes record that both donor accessions were verified against the UniProt REST API on 2026-10-28 (B7T1F4_PHATR 512 aa gene SIT1; B8C4N0_THAPS 437 aa gene SIT3) and carry forward that B8C4N0 is itself a third instance of the gene-model truncation, for a future THAPS SIT3 review.
