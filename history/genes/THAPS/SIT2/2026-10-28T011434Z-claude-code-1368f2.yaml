  details: |
    Second review round on PR 5637. Same ISS donor correction as SIT1: the claim that the T. pseudonana paralog TpSIT3 transports silicic acid is now cited to PMID:27305972, which names TpSIT3 among the reconstituted SITs, instead of the PMID:22530967 abstract, which names no paralog; the quote qualifying TpSIT3 as only just discernible above background is added, and the reason now distinguishes B7T1F4 (PtSIT1, carries the inference) from B8C4N0 (TpSIT3, supporting conspecific donor). The ISS summary no longer says no GO term exists for silicic acid transport, which the accepted GO:0015708 contradicts. The B5YNJ0 sequence source defect moves from PROBABLE to CONFIRMED: for this gene the exact C-terminal-suffix comparison with the cDNA-derived Q0QVM7 plus the full-text TpSIT2 cloning primer encoding MSSAEV (PMID:17172435) are primary data on their own, without relying on the eleven-SIT length range that covers TpSIT1 only. requested_change stays CHECK because the start codon used in vivo is untested. Donor accessions were verified against the UniProt REST API on 2026-10-28 and recorded in the notes.
