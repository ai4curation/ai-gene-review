  summary: 'Create review: Pi-ta'
  details: |
    Reviewed all 6 GOA rows for rice Pi-ta (Q84UB1): 1 ACCEPT (ADP binding, NB-ARC with intact P-loop), 2 KEEP_AS_NON_CORE (defense response IEA and IMP), 2 MARK_AS_OVER_ANNOTATED (ARBA plant-type hypersensitive response and innate immune response-activating signaling pathway), 1 REMOVE (ARBA defense response to bacterium, no bacterial data), 0 NEW. Key findings: Q84UB1 (cv. Tsuyake, AY196754) carries Ser918 and is a susceptible pi-ta allele; the resistant Ala918 record is Q9AY26, and both carry the same Gramene IMP. Xiao et al. 2024 (PMID:38834685) show that AVR-Pita recognition and Pi-ta/Pi-ta2 resistance are conferred by Ptr alleles and not by the NLR, which contradicts the Bryan/Jia 2000 model. He et al. 2022 (PMID:36050368) is a conflicting knockout result. Core function limited to ADP binding; biological role recorded as unresolved. Cached five new PMIDs. just validate and validate-changed pass with no warnings.
