  summary: 'Create review: BURP16 (OsBURP16, Q7XES5)'
  details: |
    De-novo review of OsBURP16 as the closest experimentally studied relative (grass in-paralog, PANTHER PTN000779097) of ProtNLM2 benchmark gene ORYSI/B8BAB0, independent of ProtNLM2 output. GOA has no annotations for Q7XES5. Deep research failed (falcon auth error; perplexity-lite quota), so the review rests on cached literature (PMID:24237159 full text, PMID:19363683, PMID:32005373, family context PMID:1392611, PMID:26106400) and a new PANTHER tree/motif analysis (BURP16-bioinformatics/). Added one NEW CC (GO:0005576 extracellular region, ISS from signal peptide and SF2 membership). Cell wall was not added because PAINT restricted GO:0009505 to the Brassicaceae node PTN004827911, which does not cover OsBURP16. No MF/BP asserted: the only functional data are overexpression phenotypes (more PG activity, less pectin, stress hypersensitivity), with no localisation, interaction or loss-of-function evidence; OsBURP16 also lacks the FTNYG repeats of tomato PG1 beta.
