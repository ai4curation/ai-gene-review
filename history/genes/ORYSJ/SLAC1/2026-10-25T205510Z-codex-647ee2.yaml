  summary: Review rice SLAC1 nitrate-selective guard-cell channel
  details: |-
    Reviewed all 14 seeded GOA rows using the primary 2019 full text, the explicit 2016 abstract findings, and current GO definitions. Corrected monoatomic-anion claims to nitrate-specific transport while retaining channel mechanism, refined broad locations to experimentally observed plasma membrane, retained specific kinase/phosphatase interactions as non-core, and left light response unresolved. Distinguished locus-label conflicts from experimental misidentification and withheld 2012 functional support pending sequence reconciliation. Created core functions and manual notes because provider failures were established; ran gene validation.
     Added the reproducible paired-primer construct identity analysis contributed by the parent agent: both SLAC1 termini and six internal boundaries match Q7XTX7, SAPK10 provides an independent positive control, and the older AK106615 comparison has no reportable match. Cited retained results for identity inference, with explicit limits; biological evidence remains the primary study.
