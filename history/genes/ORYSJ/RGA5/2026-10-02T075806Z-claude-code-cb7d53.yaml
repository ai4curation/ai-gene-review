  details: |
    Reviewed all 16 GOA annotations for rice sensor NLR RGA5 (F7J0N2): 7 ACCEPT, 4 KEEP_AS_NON_CORE, 2 MODIFY, 2 MARK_AS_OVER_ANNOTATED, 1 REMOVE. Key corrections: removed InterPro metal ion binding (the integrated HMA has a degenerate metal motif, PMID:30355769); changed protein binding with RGA4 to molecular function inhibitor activity (GO:0140678) and regulation of PRR signaling to regulation of plant-type hypersensitive response (GO:0010363); marked defense response to bacterium as over-annotated (resistance only in an engineered system expressing a fungal AVR, PMID:27289079); hypersensitive response rows kept as non-core because RGA4 executes cell death. Core functions: innate immune receptor activity (direct AVR-Pia/AVR1-CO39 binding) and inhibition of RGA4, cytosol. Added PMIDs 21251109, 27289079, 30355769. just validate passes with no warnings.
