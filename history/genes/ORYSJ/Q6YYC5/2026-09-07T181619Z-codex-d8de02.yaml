    Audited genes/ORYSJ/Q6YYC5/Q6YYC5-protnlm-predictions-review.yaml against the source-independence and final-state prose guidelines in .claude/skills/review-function-prediction/SKILL.md.

    Replaced rationale prose with the current assessment, traced biological claims to sequence/domain records, primary publications, and where relevant experimentally grounded curated annotations or reproducible analysis. Removed AI/OpenScientist verdicts as supporting evidence and unsupported error-mechanism claims. Source prediction terms and method/version metadata were preserved. Existing annotation overlap is separated from biological correctness and is not evidence of training-data contamination.

    GO:0070534 (protein K63-linked ubiquitination): UNC -> UNC. The target has a RING domain and an RGLG4 subfamily assignment. Arabidopsis RGLG3 and RGLG4 have experimentally demonstrated ubiquitin ligase activity (PMID:22898498), supporting general ubiquitination but not specifying a Lys63-linked chain for this rice protein. Chain linkage depends on the E2/E3 system and cannot be established by the RING domain alone. The linkage-specific process is absent from the cached annotations and requires appropriate biochemical or pathway evidence.

    GO:0061630 (ubiquitin protein ligase activity): CNN -> COR. The target contains the RING domain and accompanying RGLG-family architecture, with a specific RGLG4 subfamily assignment. Ubiquitin ligase assays on Arabidopsis RGLG3/RGLG4 provide biological grounding for transfer of E3 activity (PMID:22898498). The target already has the broader curated IBA ubiquitin-protein transferase activity, but the exact E3 ligase term is absent from the cached annotations. The prediction is a supported refinement without a claim about substrate or ubiquitin-chain linkage.

