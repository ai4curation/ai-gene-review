  details: |
    Curated rice OsCERK1 (A0A0P0XII1), the LysM receptor kinase partner of OsCEBiP in chitin immunity and of OsMYR1 in arbuscular mycorrhizal signalling. Reviewed all 20 GOA rows: 15 ACCEPT, 2 MODIFY (GO:0038187 PRR activity -> GO:0019199 transmembrane receptor protein kinase activity, since rice chitin binding is by OsCEBiP; GO:0002768 -> more specific GO:0002752), 2 REMOVE (chitin binding IEA/ARBA and TAS, transferred from AtCERK1 biology and contradicted by rice binding data), plus 1 NEW (GO:0036377 arbuscular mycorrhizal association, passing participation and comparator checks) so that immunity and symbiosis roles are recorded separately. Added 8 references (cached). Validation passes with no warnings.
