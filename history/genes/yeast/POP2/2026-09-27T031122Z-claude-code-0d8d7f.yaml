  summary: Rename yeast/CAF1 to yeast/POP2 (SGD standard name of the CCR4-NOT deadenylase)
  details: |
    The genes/yeast/CAF1 review is of UniProt P39008 (POP2_YEAST; GN Name=POP2, Synonyms=CAF1; YNR052C), the Pop2/Caf1 deadenylase subunit of CCR4-NOT. Its content is correct for that protein. The folder name was misleading, however: SGD's standard name for YNR052C is POP2 (SGD backend: display_name POP2, S000005335), and in yeast 'CAF-1' usually means the chromatin assembly factor, whose large subunit is RLF2 (alias CAC1), with CAC2 and MSI1. Yeast folders in this repo use SGD standard names, so the folder and all its files were renamed CAF1 -> POP2. In the review, gene_symbol became POP2 and aliases list CAF1 in place of POP2. The description opening became 'POP2 (also called CAF1)', and file: reference ids were repointed to yeast/POP2/POP2-*. POP2-descriptions.yaml gene_symbol was updated, the falcon report's artifact paths were repointed to the renamed artifacts folder, and the HTML was re-rendered. No annotation actions changed. just validate yeast POP2 passes. The chromatin-assembly CAF-1 subunits (RLF2, CAC2, MSI1) have no reviews in the repo; this is left as a follow-up.
