  summary: 'Create review: SWS2 (uS13m), reference ortholog for SCHPO/sws2'
  details: |
    De-novo review of all 17 GOA rows for S. cerevisiae SWS2/uS13m, independent of ProtNLM2 predictions. Falcon deep research failed (Edison 403), so the review uses cached literature (cryo-EM PMID:28154081 plus its supplementary table, copied into the gene folder; deletion screens PMID:32904421 and PMID:10649453; SGA PMID:15579722) and PTHR10871 PAINT nodes PTN000093238/PTN000093341. Core function: structural constituent of the mitochondrial small ribosomal subunit in mitochondrial translation. General IEA/IBA terms (nucleic acid binding, ribosome, translation, small ribosomal subunit) were refined by MODIFY. The peroxisome IDA from an N-terminal GFP screen is UNDECIDED because its supplementary data could not be inspected.
