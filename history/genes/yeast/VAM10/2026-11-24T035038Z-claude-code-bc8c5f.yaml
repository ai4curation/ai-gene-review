  summary: Narrow the VAM10 ortholog knowledge gap with an OpenScientist run
  details: |
    Ran OpenScientist (3 iterations) on VAM10 taxonomic range. Singleton in UniRef/OrthoDB/InterPro; no match above shuffled background in six reference proteomes. VAM10 lies antisense within VPS5 (confirmed via Ensembl: YOR068C XV:453869-454213 -, YOR069W XV:453768-455795 +); Vam10p-like frame only in Saccharomyces sensu stricto, under selection. Recent overprinted gene; deletion removes ~17% of VPS5 CDS, confounding phenotype attribution. Gap OPEN -> NARROWING.
