  summary: Reassess complete fungal sulfate-assimilation member review
  details: |
    All 25 rows and core functions reviewed; original machine annotation payloads preserved and no row added. The NADPH/FAD electron-input alpha subunit contributes to the assembled sulfite reductase; it does not independently execute the whole six-electron sulfite-to-sulfide reaction. PMID:6751400 measured holoenzyme FAD, FMN, heme and alpha/beta stoichiometry; it did not localize every cofactor by isolated-subunit assay. PMID:7928966 identified MET10 FAD/NADPH motifs and lack of an obvious FMN module. Positive beta-subunit architecture is now supported by PMID:11319255 publisher full text: Figure 3F/G and the results explicitly identify S. cerevisiae P47169, place the CPR-like FMN domain on beta, and FAD/NADP modules on Met10. The canonical PMID cache remains abstract-only; the full text was cached through the normal URL fetcher at url:https://oup.silverchair-cdn.com/article-minimal/1018655. FMN binding on alpha remains REMOVE based on domain architecture and the existing PTHR19384 fungal-subfamily adjudication, not simply missing annotation or low donor count. The competing UniProt ECO:0000250 FMN note is acknowledged without inventing a particular donor. MMS19 association does not establish that Met10 carries an Fe-S cluster or prove direct CIA-mediated maturation of Met5. Wine-yeast H2S variants and peripheral cellular phenotypes are retained at their demonstrated scope. Normal Falcon/fallback attempts failed with provider access/quota errors; publication caching succeeded and manual evidence assessment is documented in the appended notes. Focused validation, rendering and record-section backfill accompany this review.
