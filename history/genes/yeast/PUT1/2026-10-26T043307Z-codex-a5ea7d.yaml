  summary: 'Audit fungal arginase-pathway enzyme PUT1: all rows and core functions'
  details: |
    Purified-protein PMID:20450881 demonstrates FAD-associated proline dehydrogenase and strong CoQ1 electron acceptance; low oxidase turnover does not make oxygen the obligatory immediate acceptor. ETF knockout growth tests support dispensability of ETF for the tested yeast proline use. PMID:3125423 demonstrates mitochondrial targeting and explicitly shows high expression in respiratory-deficient cells; the old assertion that expression requires a functional respiratory chain is corrected. Oxygen-regulated transcription is distinct from respiratory coupling of proline utilization. Matrix assignment remains curated/comparative; membrane topology is not newly measured here. PMID:32978391 measures mitochondrial proline uptake and metabolite flux in Put6/Put7 mutants but does not identify those factors as the carrier. No transport activity is assigned to Put1. Preserved all 20 annotation payloads; no new rows. Normal caching and failed provider attempts documented honestly. Initial focused validation passed; final backfill/term/reference/render/history checks are logged. Independent annotation-reviewer consultation confirmed cycle topology, structural core properties and bounded localization uncertainty.
