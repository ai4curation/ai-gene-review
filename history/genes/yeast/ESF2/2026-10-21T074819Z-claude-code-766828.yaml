  summary: 'Create review: ESF2 (ABT1/Esf2 family donor for PTHR12311:SF7)'
  details: |
    De novo review of all 27 GOA rows for yeast ESF2 (P53743), written independently of ProtNLM2 predictions as the experimental reference for the PTHR12311:SF7 subfamily (PAINT node PTN000267771). Deep research failed (falcon 403, perplexity quota), so the review rests on the cached full-text primary papers PMID:15964808 and PMID:16772403. Accepted the A0/A1/A2 cleavage, SSU processome assembly, RNA binding, ATPase activator (Dbp8) and nucleolus rows. Marked nucleic acid binding IEA TOO_GENERAL. Removed cytoplasm HDA, contradicted by a dedicated GFP re-examination, and the 10 generic protein-binding rows. Added NEW small-subunit processome (IDA). Recorded that PAINT did not propagate GO:0001671 ATPase activator activity, so it is a yeast-only experimental function and not for transfer.
