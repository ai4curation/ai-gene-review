  summary: Reassess complete fungal sulfate-assimilation member review
  details: |
    All 31 rows and core functions reviewed; original machine annotation payloads preserved and no row added. The sulfate-assimilation role overlaps Trx1 under standard tested conditions; the double mutant phenotype is not universal proof that no other donor can ever work. PMID:10844700 establishes conditional bypass under low-oxidant conditions and leaves the alternative donor unidentified. The former glutaredoxin-dependent-backup wording is corrected. Disulfide-reductase activity retains glutathione-disulfide as well as protein substrate scope (PMID:23242256); glutathione homeostasis, Yvc1 deglutathionylation (PMID:27708136), redox stress, and LMA1 transport roles were considered independently. Genetic redundancy and curated complex evidence support Trx2 in LMA1; redox-inactive cysteine-mutant rescue in PMID:9015301 was performed with Trx1, not Trx2. The Golgi claim remains UNDECIDED because the available localization evidence does not resolve it; no misattribution is inferred from an incomplete source. No new row is added. Normal Falcon/fallback attempts failed with provider access/quota errors; publication caching succeeded and manual evidence assessment is documented in the appended notes. Focused validation, rendering and record-section backfill accompany this review.
