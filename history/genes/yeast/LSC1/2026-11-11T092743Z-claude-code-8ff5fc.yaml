  summary: 'Evolutionary re-review: LSC1'
  details: |
    Part of a joint evolutionary re-review of the succinyl-CoA synthetase subunit families PTHR11117 (alpha) and PTHR11815 (beta). Evidence: the PANTHER release 19 trees, a reproducible local analysis (genes/yeast/LSC2/LSC2-bioinformatics: paralog census, bootstrapped neighbor-joining and maximum-likelihood trees, position-20 residue comparison), cached literature, and two OpenScientist hypothesis runs. No action changed. The REMOVE on the GO:0004776 (GDP-forming) IBA is now argued from the node: the root placement is defensible but fungi lost the G-type beta paralog, so the fungal alpha branch needs pruning. Added phylogenetic reasons to the IBA rows, an ortholog statement to the description, findings and reference reviews, suggested questions and experiments, the SGD description as a reviewed reference, and the OpenScientist report with one disputed finding (dating of the beta duplication). Validated with just validate yeast LSC1 and the quote check.
