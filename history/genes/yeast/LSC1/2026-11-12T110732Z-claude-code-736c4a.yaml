  summary: 'Retrospective audit corrections: LSC1'
  details: |
    Corrections after a retrospective audit (2026-11-12) of the succinyl-CoA synthetase reviews (eleven subunit reviews, the families PTHR11117 and PTHR11815, and the tca_cycle module), followed by a cross-file consistency pass. This record supersedes the reading in the 2026-11-11 records where they differ. Action changes: NEW row GO:0005759 mitochondrial matrix (IC, PMID:28819139), because the audit found three agreeing lines for the sub-compartment (matrix assignment in the Voegtle 2017 fractionation, a cleavable presequence, a soluble TCA-cycle enzyme); the root GO:0005739 rows are all kept and core_functions.locations gained the matrix. GO:0003824 catalytic activity (IEA) MODIFY (to GO:0004775) -> TOO_GENERAL, the action already used on the other subunit reviews; the reason is now worded the same way in all eleven subunit reviews (true but uninformative, entailed by the accepted specific activity). No other action changed: GO:0004776 (IBA) stays REMOVE, now with the caveat that the yeast assay is qualitative and known from the abstract, and with the loss of the G-type beta gene stated for S. cerevisiae and the fungal genomes under PTN000874203, not for fungi as a kingdom (Mortierellomycota, Basidiobolus and Rozella keep a SUCLG2-type gene; the ascomycete Saitoella complicata has one of unresolved origin). Reference verdicts: PMID:15692048 and the SGD description UNVERIFIED -> VERIFIED; eight references added, among them PMID:18452512 and PMID:7771809. One BIOLOGY knowledge gap added (why loss of Lsc1 destabilises mtDNA). Description, findings, suggested questions and notes reworded to match the reworked family analysis in genes/yeast/LSC2/LSC2-bioinformatics. Validated with just validate yeast LSC1 and the repository quote check.
