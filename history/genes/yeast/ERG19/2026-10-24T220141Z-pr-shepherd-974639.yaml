  details: |
    PR Shepherd follow-up on PR #3750, which was formally CHANGES_REQUESTED but whose
    review feedback had already been addressed by the author in 30f211acd5, and whose
    branch had since gone CONFLICTING against main. Merged origin/main into the branch
