    1. genes/yeast/ERG19/ERG19-ai-review.yaml had one conflict hunk, in taxon/description.
       Took main's side: taxon.label becomes 'Saccharomyces cerevisiae S288C', the
       normalized NCBITaxon:559292 label introduced by the taxon dynamic-enum binding
       (#4166). The two sides' description text was identical apart from line reflowing,
       so no biological content changed.

    2. existing_annotations GO:0005773 vacuole (MARK_AS_OVER_ANNOTATED): its
       file:yeast/ERG19/ERG19-deep-research-falcon.md supporting_text was a paraphrase,
       not a verbatim quote. It had been grandfathered in conf/local_quote_baseline.yaml
       under the pre-merge hash, so merging main turned the advisory into a blocking
       error. Replaced it with verbatim text from the falcon report's localization row:
       'One review/preprint describes MDD/Mvd1 as a cytosolic homodimer and a 2020
       cell-factory review states the MVA-pathway proteins are mostly cytosolic. ...
       direct ERG19-specific localization experiment in *S. cerevisiae* was not found
       in retrieved texts.' The new quote supports the same argument more directly: the
       vacuole placement comes from a review figure rather than an ERG19 localization
       assay. No GO term, evidence code, action or reason was changed.

    3. projects/IBA_REVIEW/rereview-2026-09-20/progress.json and
       source-preservation-check.json are generated files; regenerated them with
       inventory.py and verify_sources.py rather than hand-merging the counters.
       progress now reads reviewed 166 / unreviewed 3204 / awaiting_adjudication 56,
       i.e. main's totals plus this PR's ERG19 row; source-preservation-check reports
       no missing source assertions for ERG19 (19 non-NEW annotations preserved).

