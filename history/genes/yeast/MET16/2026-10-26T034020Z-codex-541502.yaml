  summary: Reassess complete fungal sulfate-assimilation member review
  details: |
    All 22 rows and core functions reviewed; original machine annotation payloads preserved and no row added. Purified yeast PAPS reductase converts PAPS to PAP and sulfite and requires reduced thioredoxin (PMID:3060034). Its early steady-state interpretation does not establish an obligatory thioredoxin-first molecular sequence. The PAP-bound yeast structure (PMID:18991405; abstract cached) identifies the PAPS phosphate pocket and C-terminal Cys245 geometry. PMID:2203779 is the structural-gene study and reports an early cysteine-mutant interpretation; it should not be silently reconciled into modern direct mutagenetic proof. PMID:16008502 full text provides bacterial sulfonucleotide-reductase mechanistic context, not a native yeast assay. The description now distinguishes these levels of evidence. The existing selenate-reductase non-core assertion is supported by Reactome:R-SCE-2408518, explicitly describing MET16 reduction of PAPSe. PMID:22234534 glutathione engineering effects are retained as over-annotation of direct glutathione biosynthesis, not declared false. Other localization, regulation, and interaction assertions were considered across the complete row set. Normal Falcon/fallback attempts failed with provider access/quota errors; publication caching succeeded and manual evidence assessment is documented in the appended notes. Focused validation, rendering and record-section backfill accompany this review.
