  summary: 'Review: ADA2 (SAGA/ADA HAT-module subunit, activator of Gcn5)'
  details: |
    Reviewed all 86 GOA rows for yeast Ada2 (Q02336) for the CHROMATIN project. Added a NEW acetyltransferase activator activity row (GO:0010698, IDA, PMID:11773077), supported by PMID:30224453 and PMID:18950642, and made it the primary core function alongside transcription coactivator activity. All 50 protein binding rows were removed by partner (Gcn5, Ada3/Ngg1, Tra1, Ada1/Hfi1, Slt2): none of the cited studies measures Ada2's effect on Gcn5 activity. Chromatin organization was modified to chromatin remodeling, SAGA-type complex to SAGA, SLIK and ADA complex, and positive regulation of DNA-templated transcription to positive regulation of transcription by RNA polymerase II. Phosphatidylserine binding was marked over-annotated (in vitro, relevance unknown). Silencing, telomeric location, chromatin binding, zinc binding and DNA damage rows kept as non-core. Fetched PMID:7642611 and PMID:7957049. Two biology knowledge gaps recorded. Validated with just validate and quote_check.
