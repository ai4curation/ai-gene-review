  summary: Narrow the MAL33 activator-function knowledge gap with an OpenScientist
    run
  details: |
    Ran OpenScientist (3 iterations) on whether S288C MAL33 carries disabling coding changes relative to Mal63p. None found: full length and colinear, Zn2Cys6 and DNA-contact residues intact, the only indel shared with hyperactive MAL23-C, identical in three other strains, and functional residues at the block that tracks loss of function. Any inactivity is unlikely to be coding-intrinsic; the 'non-functional' statement traces to papers without an ORF activity assay. Central gap OPEN -> NARROWING; provenance added to the paralog-relationship gap.
