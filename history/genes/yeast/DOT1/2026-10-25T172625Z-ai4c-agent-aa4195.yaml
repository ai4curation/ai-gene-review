    PR shepherd follow-up on the ai4c-reviewer CHANGES_REQUESTED finding that rows still carried bare paper titles as supporting_text. Seven supported_by entries quoted the cited paper's title rather than its text; six of them were also blocking reference-validation errors (title lines are not part of the searchable cached record).

