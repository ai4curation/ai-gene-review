    - GO:0031151 H3K79 methyltransferase activity, IDA (PMID:12080090): the Dot1-dependent H3 Lys 79 methylation sentence.
    - GO:0031151 H3K79 methyltransferase activity, IMP (PMID:12080090): the catalytically-dead dot1 mutant sentence.
    - GO:0031151 H3K79 methyltransferase activity, IDA (PMID:18158898): the H4 N-terminal domain requirement for H3 K79 methylation.
    - GO:0031573 mitotic intra-S checkpoint (PMID:16166626): the dot1Delta intra-S checkpoint defect sentence.

    All seven quotes were checked as whitespace-normalized substrings of the committed publications/PMID_*.md caches, which are abstract-only for PMID:12080090, 16166626, 16554755 and 18158898; two earlier candidate quotes drawn from refreshed full text were dropped for that reason. No term ids, actions or reasons were changed. just validate yeast DOT1 passes; just render yeast DOT1 regenerated the HTML.
