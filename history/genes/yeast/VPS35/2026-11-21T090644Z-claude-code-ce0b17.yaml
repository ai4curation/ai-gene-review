  summary: First review of S. cerevisiae VPS35, the retromer cargo-recognition subunit
  details: |
    Reviewed all 33 GOA rows for VPS35 (P34110) from the cached papers, 17 newly cached PubMed papers and the SGD description; hosted deep research was unavailable.
    - ACCEPT: retromer complex and cargo-selective complex rows, retrograde transport endosome to Golgi (IBA/IEA/IPI/NAS), cargo adaptor activity contributes_to (IBA/IMP/IPI), late endosome (IBA), protein transport (IEA).
    - MODIFY: endosome (IPI) and endomembrane system (NAS) to GO:0010008 endosome membrane.
    - TOO_GENERAL: membrane (IEA SubCell).
    - KEEP_AS_NON_CORE: cytosol, fungal-type vacuole membrane, CROP complex, protein retention in Golgi apparatus.
    - MARK_AS_OVER_ANNOTATED: GO:0032456 endosome to plasma membrane transport (ComplexPortal NAS) and obsolete GO:0099638 (IBA, metazoan-only seeds): in yeast, retromer recycling to the plasma membrane goes through the Golgi (PMID:17420293, PMID:32074001). Also GO:1900102 negative regulation of ER UPR (IGI, PMID:25533483), an indirect consequence of Vps10 recycling.
    - REMOVE: nine bare protein binding IPI rows.
    - NEW: GO:0031267 small GTPase binding (Ypt7-GTP, IPI PMID:22593205).
    - Recorded a SUSPECTED CHECK source defect against ComplexPortal CPX-1653 for GO:0032456.
    - Core functions: contributes_to GO:0140312 in GO:0030906, part of GO:0042147 at the endosome membrane; and GO:0031267 Ypt7 binding.
