  summary: Re-review HST1 function specificity and evidence transfer
  details: |
    All 38 source rows were re-reviewed against the actual general OpenScientist report and primary texts. PMID:18990212 explicitly reports "Only ARS1223 and ARS1511 showed a significant higher H4 K16 acetylation level in both sum1Δ and hst1Δ yeast strains" immediately after stating that H4K16 is not a general target. Thus H4K5 predominance is not exclusivity: H4K16 IBA is retained as non-core context-dependent activity. The report's H3K9/H3K14 specificity examples largely concern Sir2/Hst2, not purified Hst1; these two activities remain UNDECIDED pending site-specific assessment, with genuine PTN000872222 IBD support acknowledged. PMID:11711434 full text was retrieved and read: Hst1 occurs in both Set3C and Sum1 complexes, which exhibit histone deacetylation. Hst1 dispensability for Set3C integrity and tested early-meiotic repression does not negate every meiotic role, and the exact negative meiotic division attribution remains unresolved. PMID:27185881's official PubMed Figure 1 caption states "Full-length HST1 mediates cohesion at HMR in a SUM1-1 background." That primary source, retained in a clearly labeled manual excerpt file, plus PMID:11313477 supports conditional HMR silencing as non-core. Current native subtelomeric, DNA-damage and recombination claims remain unresolved rather than impossible from differing Sir2 cofactors or an HML/rDNA deletion result. Nuclear lumen and direct THI transcriptional repression were restored as compatible core context; generic protein binding removed. Descriptions, reference reviews, core synthesis and suggested experiments now distinguish predominant, conditional and unresolved activities. Original source metadata preserved; just validate yeast HST1 passed. Audit: projects/IBA_REVIEW/rereview-2026-09-20/chaperone-and-silencing-specificity.yaml.
