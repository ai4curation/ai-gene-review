  summary: Re-review ACL4 function specificity and evidence transfer
  details: |
    All 18 source rows were re-reviewed. Direct target evidence in PMID:26447800 supports Rpl4 capture, shielding, cytoplasmic/nuclear localization and delivery to pre-60S assembly. It states "We conclude that Acl4 has the capacity to recognize Rpl4 in a co-translational manner." This establishes cotranslational recognition but does not by itself settle the noncovalent folding step. PMID:19325107 remained abstract-only after full-text retrieval attempts, so its HGI folding annotation is UNDECIDED rather than rejected from a missing assay. The obsolete unfolded-protein-binding annotation remains MODIFY to the supported carrier-chaperone activity. All five mitochondrial IBAs were reconsidered against PTN002340064: the existing OpenScientist report computed zero transmembrane segments, but it omitted the source contributes_to qualifier on transporter activity. A soluble factor or peripheral complex contributor need not span the membrane. The report did not reconstruct a misplaced PAINT target branch or demonstrate target-specific loss of each activity. Established Rpl4 chaperoning alone is nonexclusive; the mitochondrial inferences are UNDECIDED pending the corrected focused assessment. Current PAINT does not contain the older targeting-sequence-binding row, a version discrepancy rather than biological refutation. Original source metadata preserved; just validate yeast ACL4 passed. Audit: projects/IBA_REVIEW/rereview-2026-09-20/chaperone-and-silencing-specificity.yaml.
