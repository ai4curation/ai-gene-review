  summary: 'Create review: PTA1'
  details: |
    De-novo review of S. cerevisiae PTA1 (Q01329) as the experimental reference for SCHPO/pta1 (same PANTHER subfamily PTHR15245:SF20; PTA1 is a donor to PAINT node PTN000391745). Falcon deep research failed (perplexity-lite fallback timed out), so the review uses cached literature. Accepted CPF complex (IDA/IPI/IBA), nucleus and poly(A)-coupled termination rows; kept CF II RNA binding (contributes_to) as non-core; marked tRNA processing (pta1-1 IMP) as over-annotated since splicing endonuclease is normal and the cause is unknown; modified scaffold-mapping protein binding rows to GO:0140378 protein complex scaffold activity and removed high-throughput/control protein binding rows. Added NEW mRNA 3'-end processing (IMP, PMID:10523662) after a comparator check (CFT2, FIP1, PTI1, human SYMPK carry mRNA processing experimentally) and NEW GO:0140378. Recorded that Pta1 is dispensable for the chemical steps in recombinant CPF (PMID:30737185) and left snoRNA termination as a question because sources conflict. ProtNLM2 predictions were not consulted.
