  summary: 'Create review: STE5'
  details: |
    Reviewed all 40 GOA annotations for S. cerevisiae STE5 (P32917), the pheromone-pathway MAPK scaffold. Accepted MAP kinase scaffold activity (4 rows), pheromone response MAPK cascade, G-protein beta-subunit binding, PI(4,5)P2 binding, positive regulation of protein phosphorylation and plasma membrane/cytoplasm/mating projection tip locations; kept nucleus, invasive growth and negative regulation of MAPK cascade as non-core. Bare protein-binding rows were modified to MAPKKK/MAPKK/MAPK binding, G-protein beta-subunit binding or SH3 domain binding by partner, with heterologous-MAPK rows (PMID:23953117) and the Fus1 two-hybrid row (PMID:15020407) removed. Added NEW protein serine/threonine kinase activator activity (IDA, PMID:19303851) for the Ste5 VWA-domain co-catalyst function, and wrote description, notes, core functions and reference reviews.
