  summary: 'Create review: YPD1'
  details: |
    Reviewed all 21 GOA annotations for S. cerevisiae YPD1 (Q07688), the HPt intermediate of the Sln1-Ypd1-Ssk1/Skn7 phosphorelay. Accepted GO:0009927 histidine phosphotransfer kinase activity (IBA, IEA) as core MF, GO:0007234 osmosensory signaling via phosphorelay pathway (IDA, IMP, IEA), GO:0000160, GO:0043424 protein histidine kinase binding, and nucleus/cytoplasm localizations. Modified broad GO:0016772 (IDA, IEA) to GO:0009927 and the Sln1 GO:0005515 row to GO:0043424; removed the two high-throughput Ssk1 GO:0005515 rows as uninformative (interaction itself is genuine). Added PMID:9843501, PMID:11073911, PMID:15628880 with reference reviews, two core functions (Ssk1 cytoplasmic branch; Skn7 nuclear branch), notes file, and suggested questions/experiments.
