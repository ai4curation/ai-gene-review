  summary: Re-action AVT2 ND root terms to ACCEPT per the ND acceptance rule
  details: |
    PR Shepherd follow-up. Changed the two ND root-term rows (GO:0003674 molecular_function, GO:0008150 biological_process) from REMOVE to ACCEPT. The prior REMOVE rationale was that each aspect is already covered by GO:0015179 / GO:0003333, but both of those rows are IBA from the AAAP-family node PANTHER:PTN000535793, and the ND acceptance rule states that IBA/ISO/ISS/IEA rows in the same aspect are not literature on the gene and never make an ND stale. No literature identifies an MF or BP for AVT2 in S. cerevisiae: PMID:11274162 demonstrated transport for four of the seven AVT proteins and AVT2 is not among them, and the notes record that no later primary paper assigns a substrate or direction. Cited that abstract as the literature-search support on both rows. The existing MF_DARK and WHOLLY_DARK BIOLOGY knowledge gaps are the true-gap record for these aspects; review.nd_case does not exist in this branch's schema (added on main by #5416) so nd_case: TRUE_GAP must be set when this branch is reconciled with main. Also normalized the taxon label to Saccharomyces cerevisiae S288C, the OLS-verified label for NCBITaxon:559292. Revalidated and re-rendered.
