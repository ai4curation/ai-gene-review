  details: |
    Two fixes from the ai4c-reviewer review on PR 4677, both verified before acting. (1) The GO:0050664 propagation_review asserted root_cause SOURCE_BAD with failure_modes SOURCE_MISCITATION. The schema defines SOURCE_MISCITATION as source evidence pointing to the wrong gene, organism, publication or homonym, none of which happened: the SGD IDA cites the right gene, organism and paper, and only the term is wrong. Changed to root_cause TERM_SCOPING_PROBLEM with no failure_modes, since no enum value describes a wrong-acceptor term, and sharpened the comment to say the citation is correct. (2) Supporting quotes that cited B. cereus results for yeast-specific rows were replaced with gene-specific verbatim quotes. Also added a gene-specific section to the notes file, which had been byte-identical across three genes.
