  summary: New full review of yeast SUS1 (ENY2/Sus1 family experimental reference
    for PTN000282153)
  details: |
    Created a full review of S. cerevisiae SUS1 (Q6WNK7), independent of ProtNLM2 predictions, as the experimental reference for ENY2/Sus1 transfer (PANTHER PTHR12514, PAINT node PTN000282153, where SUS1 is a donor). Deep research (falcon, perplexity-lite fallback) failed on authentication/quota and is recorded in SUS1-notes.md; the review uses cached primary literature and the curated UniProt entry. All 58 GOA rows reviewed: SAGA, SLIK, DUBm, TREX-2, nucleoplasm, nuclear pore, poly(A)+ mRNA export, gene tethering and positive regulation of Pol II transcription accepted; 14 generic protein binding rows removed per policy; enzyme activator activity refined to deubiquitinase activator activity (GO:0035800); general regulation-of-transcription, mRNA export, nucleus and cytoplasm terms refined to their supported children; regulation of protein localization refined to protein localization to nuclear pore; cellular response to stress refined to cellular response to cell wall damage; chromatin binding, elongation, nucleosome organization, nuclear mRNA surveillance and P-body kept as non-core. Notes record which functions are yeast-experimental only (not propagated by PAINT) to guide later ortholog transfer.
