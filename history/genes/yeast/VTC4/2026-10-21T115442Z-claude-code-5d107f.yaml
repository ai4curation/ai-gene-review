  summary: 'Create review: VTC4 (P47075), reference ortholog for NEUCR vtc-4'
  details: |
    De-novo review of S. cerevisiae Vtc4, written as the experimentally characterised reference for N. crassa vtc-4 (same PANTHER subfamily PTHR46140:SF1, Vtc4 clade). Deep research failed (falcon auth error, perplexity-lite quota), so the review uses the cached literature plus the PMC full text of PMID:17079729. Accepted the core annotations: polyP kinase activity, polyP biosynthesis, VTC complex, fungal-type vacuole membrane, InsP6 binding. Refined vacuolar membrane to fungal-type vacuole membrane, ER to ER membrane, and polyP metabolic process to polyP biosynthetic process. Changed autophagosome membrane to vacuolar membrane, because the microautophagy evidence concerns invaginations of the vacuolar membrane, not autophagosomes. Removed engulfment of target by autophagosome (a macroautophagy term) and bare protein binding (PIN3 HTP). Kept microautophagy, calmodulin binding, ER and cell periphery as non-core. Added NEW vacuolar transmembrane transport (Vtc4 TM1 lines the polyP channel, PMID:36759618) and proposed a polyphosphate transmembrane transport term. ProtNLM2 predictions were not consulted.
