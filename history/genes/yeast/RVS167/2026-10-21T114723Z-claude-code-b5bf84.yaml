  summary: 'Create review: RVS167 (Rvs167 subfamily reference for NCU04637)'
  details: |
    De-novo review of S. cerevisiae RVS167 (P39743), the experimentally characterised member of PANTHER PTHR47174:SF1 and a donor to PAINT nodes PTN002932529/PTN002932538, written as the transfer reference for Neurospora NCU04637. Independent of ProtNLM2 output. Falcon and perplexity-lite deep research both failed (auth, quota); built from 29 cached publications and UniProt. All 114 GOA rows reviewed: 69 GO:0005515 rows -> MODIFY to protein heterodimerization activity (Rvs161 partner) or proline-rich region binding (SH3-domain-mapped ligands), otherwise REMOVE as uninformative; general locations (cytoplasm, cytoskeleton, actin cytoskeleton) MODIFY to actin cortical patch; ComplexPortal regulation of endocytosis MODIFY to endocytosis; pombe-only medial cortex IBA marked over-annotated (taxon mismatch). Added NEW vesicle scission involved in endocytosis (IMP, PMID:27093085) after participation and comparator checks. Core functions separate S. cerevisiae-established N-BAR membrane tubulation/scission, Rvs161 heterodimerization and SH3 proline-rich ligand binding; notes flag that S. pombe hob1 lacks the endocytic requirement, so endocytosis should not be transferred across SF1 without species evidence.
