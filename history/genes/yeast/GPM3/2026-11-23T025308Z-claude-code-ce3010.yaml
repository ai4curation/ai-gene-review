  summary: Narrow the GPM3 molecular-function knowledge gap with an OpenScientist
    run
  details: |
    Ran OpenScientist (3 iterations) on whether GPM3's lack of mutase activity is explained by lost active-site residues. Refuted: GPM3 keeps 14/20 Gpm1 ligand-contact positions, including both catalytic His, the general acid and all substrate/cofactor arginines (residues checked locally). The AlphaFold model superposes on liganded Gpm1 at ~1 A. Remaining untested candidates are three substitutions invariant in active dPGMs, the insertion, and an altered C-terminal tail. Gap OPEN -> NARROWING; annotation actions unchanged.
