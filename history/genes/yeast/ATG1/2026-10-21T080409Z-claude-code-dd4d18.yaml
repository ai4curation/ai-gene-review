  summary: 'Create review: ATG1'
  details: |
    De-novo full review of S. cerevisiae ATG1 (P53104), done as the experimentally characterised reference for the PTHR24348:SF22 / PTN000681272 Atg1/ULK node and independent of ProtNLM2 predictions. Falcon and perplexity-lite deep research failed (Edison 403 auth), so the review was built from 34 cached publications and the UniProt record. Reviewed all 69 GOA rows. Accepted the core Ser/Thr kinase activity (in vitro autophosphorylation and Atg9/Atg4/Atg13 phosphorylation), autophagosome assembly, Cvt pathway, PAS/phagophore/cytosol and Atg1/ULK1 kinase complex. Selective-autophagy and starvation-response terms were kept as non-core. Broad terms were set to MODIFY: protein kinase activity to GO:0004674, autophagy to macroautophagy, autophagy of mitochondrion to mitophagy, response to starvation to nitrogen/potassium starvation responses. GO:0034045, which QuickGO reports as obsolete, was set to MODIFY to GO:0000407/GO:0061908. Bare protein binding rows were removed, except the Atg8 LIR binding row, which was set to MODIFY to GO:0032182. Two core functions were written, and the notes record which functions are yeast-specific (Cvt pathway, the kinase-independent scaffold role) and should not be transferred without checking.
