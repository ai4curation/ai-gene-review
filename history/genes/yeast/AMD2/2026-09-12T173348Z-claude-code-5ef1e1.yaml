  summary: Calibrate AMD2 evidence statements to what the sources support
  details: |
    PR-shepherd follow-up to the ai4c-reviewer CHANGES_REQUESTED review of 2026-09-11. Two blocking evidence-calibration items in newly added references[].findings[].statement text. (1) UniProt:P22580 finding no longer asserts "a catalytically competent enzyme rather than a pseudoenzyme": all three ACT_SITE features (132/209/233) carry /evidence="ECO:0000250" (by similarity, verified in AMD2-uniprot.txt lines 135-143) and 233 is noted "Acyl-ester intermediate" not "Charge relay system", so the statement now records the triad as similarity-annotated, notes no catalytic residue is disrupted, and stops short of asserting competence. (2) PMID:32024536 finding no longer claims "direct evidence that the native AMD2 protein does not provide classical acetamidase activity": the paper never mentions AMD2/YDR242W (0 literal hits in the cached full text) and the control is untransformed S288C on acetamide as sole nitrogen source, a whole-genome growth readout, so the statement now stops at what the reference supports and names the confounders. Applied the same calibration to the locations the review flagged for consistency: the top-level description, the reference_review notes for PMID:32024536, both knowledge_gaps[].boundary fields carrying the pseudoenzyme framing, and the top-level knowledge_gaps acetamidase claim. Also took the non-blocking suggestion to phrase the GO_REF:0000120 inference route as a reviewer reconstruction rather than a finding of that generic pipeline reference. No GO terms, annotation actions, or core_functions changed. just validate yeast AMD2 passes.
