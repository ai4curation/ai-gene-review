  summary: First review of yeast retromer SNX-BAR subunit VPS5 (Q92331)
  details: |
    Reviewed all 39 GOA rows for VPS5 and set status DRAFT. Hosted deep research was not configured, so the literature was read directly: the cached GOA papers plus 19 further papers (14 newly cached), found through PubMed E-utilities searches recorded in VPS5-notes.md. The SGD MOD description was fetched and checked claim by claim.
    Actions: 19 ACCEPT, 12 REMOVE (all bare protein binding), 4 MARK_AS_OVER_ANNOTATED, 3 KEEP_AS_NON_CORE, 1 TOO_GENERAL, 3 NEW.
    Over-annotated: Golgi membrane (IEA, UniProt ECO:0000305 inference; imaging puts Vps5/Vps17 on endosomes), endosome to plasma membrane transport (ComplexPortal NAS; no plasma-membrane recycling shown for yeast Vps5-Vps17), and cargo adaptor activity contributes_to (IMP, IPI PMID:9700157; cargo recognition is done by Vps26/Vps35, and the PomBase GO-CAM 693b3c0900002174 puts cargo adaptor activity on the cargo-selective complex and membrane bending on the Vps5-Vps17 tubulation complex).
    NEW: GO:0180020 membrane bending activity (PMID:28100638, PMID:36644906), GO:0043495 protein-membrane adaptor activity (PMID:40234461, PMID:38598303, PMID:22593205), GO:0097750 endosome membrane tubulation (PMID:24567361). Participation and comparator checks are recorded in the rows.
    Core functions: membrane bending in the retromer tubulation complex, PI3P binding, and recruitment of the cargo-selective subcomplex to endosome membranes.
    Noted that VAM10 is embedded in VPS5 (PMID:40234461), a confound for vps5 deletion vacuole phenotypes.
