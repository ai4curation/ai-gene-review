  summary: Stop citing S. pombe GO-CAMs as support or comparators
  details: |
    Maintainer instruction on PR 6587: do not use a GO-CAM as support. The S. pombe GO-CAMs cited in this review are not independent evidence. In gomodel:693b3c0900002174 the function nodes carry no evidence, the retromer complexes' edges are curator inferences from complex membership (ECO:0000305), and the Snx3 edge is an IBA seeded by S. cerevisiae Snx3. Removed the GO-CAM sentences from four reasons: cargo adaptor activity (over-annotated), and the NEW membrane bending activity, protein-membrane adaptor activity and endosome membrane tubulation rows. Comparators now come from experimental annotations only (QuickGO, 2026-11-21): human SNX1 and SNX5 (IDA, ComplexPortal, PMID:37322239) for tubulation, and Drosophila Snx3 (IPI, FlyBase, PMID:22041890) for protein-membrane adaptor activity. No SNX-BAR yet carries membrane bending activity, so that NEW row rests on the reconstitution data. No actions changed.
