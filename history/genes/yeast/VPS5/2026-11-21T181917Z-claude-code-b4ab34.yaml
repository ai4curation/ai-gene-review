  summary: Refine the endosome IDA rows and harmonise the recycling call
  details: |
    Review follow-up on PR 6587 (cross-gene consistency in the yeast retromer batch). Both IDA endosome rows (PMID:9175702 and PMID:9700157) now MODIFY to GO:0010008 endosome membrane, which the gene already carries. They no longer appeal to the root-organelle policy, which does not cover the endosome. The ARBA endosome row is kept at the organelle. The GO:0032456 row keeps MARK_AS_OVER_ANNOTATED. Its summary now gives the current GO label, its reason cites the Ftr1 recycling data (PMID:17420293, added to the references), and it carries the shared CPX-1653 query. The cytosol row's reason says why it differs from the VPS17 row. The description no longer says the Vps5-Vps17 heterodimer comes from a cytosolic pool; only Vps5 has been shown to. Expected warning: inconsistent_review_actions for GO:0005768 (IEA ACCEPT, IDA MODIFY).
