  summary: Reassess complete fungal sulfate-assimilation member review
  details: |
    All 39 rows and core functions reviewed; original machine annotation payloads preserved and no row added. Thioredoxin performs reducing-equivalent transfer to protein substrates, glutathione disulfide, and the PAPS-reductase system; the broad disulfide-reductase term therefore retains non-protein substrate scope (PMID:19362171). PMID:2026619 establishes conditional double-mutant methionine auxotrophy and cell-cycle effects. PMID:10844700 explicitly reports sulfate assimilation without both cytoplasmic thioredoxins when reactive oxygen species are minimized. The alternative donor remains unidentified; enhancement after additional glutaredoxin deletions does not prove direct glutaredoxin substitution. The pre-existing NEW sulfate-assimilation row is retained: the thioredoxin supplies reducing equivalents to the performed reaction, not merely a passive requirement. Trx2 and S. pombe Trx1 are role-matched comparators, with the native fission-yeast GO-CAM further supporting that role. No additional process row is manufactured. LMA1-mediated vacuole and ER/Golgi transport roles were reviewed separately (PMID:9015301, PMID:9657146, PMID:9813082); redox-inactive rescue in PMID:9015301 specifically used Trx1. PMID:22984289 full text supports mitochondrial intermembrane-space localization, refining the broad mitochondrial row, but does not resolve the Golgi attribution. Golgi rows remain UNDECIDED rather than falsely removed. Nuclear/glutathione and stress contexts remain distinct from sulfate assimilation. Normal Falcon/fallback attempts failed with provider access/quota errors; publication caching succeeded and manual evidence assessment is documented in the appended notes. Focused validation, rendering and record-section backfill accompany this review.
