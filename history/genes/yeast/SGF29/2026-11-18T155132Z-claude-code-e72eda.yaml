  summary: 'Review: SGF29 annotations, core function and references'
  details: |
    Reviewed all 30 GOA rows for Sgf29 against cached papers (PMID:21685874 full text, PMID:21734642 full text, PMID:22224423, PMID:12052880, and PMID:26401015 fetched for this review). Complex rows, nucleus, H3K4me3 reader activity, RNA polymerase II regulation and SAGA complex localization were accepted. Eight protein binding rows with Ngg1 or Hfi1 partners were removed; the row with histone H3 as partner was modified to histone H3K4me3 reader activity. Chromatin organization (IEA) was modified to chromatin remodeling. Intracellular protein localization (IMP, TBP recruitment) was marked over-annotated. Core function: histone H3K4me3 reader activity in the SAGA HAT module. One biology knowledge gap on Sgf29's contribution to SAGA occupancy (Bian 2011 versus Shukla 2012). The deep-research file's attribution slips (PDB 3MEA is human SGF29; PMC10226619 is Haile et al. 2023) are recorded in its reference_review. Validated with just validate, quote_check and backfill-record-sections.
