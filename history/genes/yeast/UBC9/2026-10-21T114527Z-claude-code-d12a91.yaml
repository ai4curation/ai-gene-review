  summary: 'Create review: UBC9'
  details: |
    De-novo review of S. cerevisiae Ubc9 (P50623) as the experimental reference for NEUCR/NCU04302 (Q1K772), independent of ProtNLM2 predictions. Deep research failed (falcon auth, perplexity quota), so the review uses cached abstracts, UniProt and PANTHER/PAINT. A new reproducible script confirms PTHR24067:SF248 membership shared with hus5 and Q1K772 (human UBE2I in SF280) and that Cys93 is conserved. 21 GOA rows reviewed. SUMO transferase activity rows MODIFY to SUMO conjugating enzyme activity. Protein sumoylation, nucleus and E2 IBA rows ACCEPT. Mitotic spindle elongation IMP MARK_AS_OVER_ANNOTATED, since the short spindle is an arrest phenotype. Four bare protein-binding rows REMOVE. Chromosome locations kept as non-core. NEW SUMO binding added from PMID:23644018 (backside binding).
