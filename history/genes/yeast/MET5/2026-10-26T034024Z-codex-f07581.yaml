  summary: Reassess complete fungal sulfate-assimilation member review
  details: |
    All 33 rows and core functions reviewed; original machine annotation payloads preserved and no row added. The beta subunit supplies the sulfite-reducing siroheme/[4Fe-4S] catalytic module to the alpha2beta2 enzyme. PMID:6751400 is whole-enzyme biochemistry; cofactor biosynthesis is performed by Met1/Met8, not by Met5 itself (PMID:9003798). FMN placement has positive flavodoxin-domain evidence, not just absence from alpha. PMID:11319255 publisher full text explicitly names P47169 and Figure 3F/G identifies the beta FMN-domain architecture. Full text is normally cached as url:https://oup.silverchair-cdn.com/article-minimal/1018655; the PMID record remains abstract-only. The FMN-binding assignment is domain-based inference combined with holoenzyme FMN measurement, not a direct isolated-subunit FMN assay. The broad iron-sulfur-binding assertion is refined to the supported [4Fe-4S] term. Peripheral HDA vacuole, cell-periphery and stress-granule localizations are retained without inventing a tag artifact or requiring an established local function. Wine-yeast mutant H2S output (PMID:19236486) informs phenotype without asserting every allele abolishes all activity. Normal Falcon/fallback attempts failed with provider access/quota errors; publication caching succeeded and manual evidence assessment is documented in the appended notes. Focused validation, rendering and record-section backfill accompany this review.
