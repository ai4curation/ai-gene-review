  summary: 'Create review: SPH1'
  details: |
    Full review of 28 GOA rows for S. cerevisiae SPH1 (Q06160) during the PTHR21601 family pass. Results: 20 ACCEPT, 5 KEEP_AS_NON_CORE, 2 REMOVE (the ND root MF row, and the GO:0120105 contractile-ring intermediate-layer IBA propagated from the PomBase-only seed on root node PTN004550576), 1 MARK_AS_OVER_ANNOTATED (cytoskeleton, UniProt SubCell mapping). PTN001091461 transfers and the GO:0043332 and GO:0005078 IBAs were accepted. Sph1 has its own two-hybrid binding to Mkk1, Mkk2 and Ste7 (PMID:9443897). Added a description, two core functions (cortical polarity factor; putative MAPK-module tether), questions, an experiment and SPH1-notes.md. Validated with just validate yeast SPH1.
