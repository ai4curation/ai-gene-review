  details: |
    De-novo review of all 39 GOA rows for S. cerevisiae VPS74 (Q06385, GOLPH3 orthologue) for the CACAO project, written from the cached full texts because no deep-research provider was available. Judged the four CACAO rows explicitly: both IDA localizations (GO:0005794 from PMID:24019977, GO:0005802 from PMID:19837035) are supported by the cited figures and kept, while the paired glycosylation IMP rows (GO:0006487 and GO:0035269 from PMID:18410729) are marked over-annotated as phenotype-read-as-process, since the same paper states Vps74p's role in glycosylation is indirect and the mechanistic term GO:0045053 is already annotated from it.
