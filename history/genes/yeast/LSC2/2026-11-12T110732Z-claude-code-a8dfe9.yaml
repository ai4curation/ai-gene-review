  summary: 'Retrospective audit corrections: LSC2'
  details: |
    Corrections after a retrospective audit (2026-11-12) of the succinyl-CoA synthetase reviews (eleven subunit reviews, the families PTHR11117 and PTHR11815, and the tca_cycle module), followed by a cross-file consistency pass. This record supersedes the reading in the 2026-11-11 records where they differ. Action changes: NEW row GO:0005759 mitochondrial matrix (IC, PMID:28819139), on four agreeing lines (Voegtle 2017 fractionation, UniProt transit peptide, soluble TCA-cycle enzyme, and the matrix assignment of its obligate partner Lsc1); the root GO:0005739 rows are kept and core_functions.locations gained the matrix. GO:0003824 catalytic activity (IEA) MODIFY (to GO:0004775) -> TOO_GENERAL; the reason is now worded the same way in all eleven subunit reviews (true but uninformative, entailed by the accepted specific activity). No other action changed. Statements corrected: Gln at position 20 of the beta subunit is not a marker of GDP specificity and is not confined to the clade under PTN000929335 (PMID:18452512 added); the G-type beta gene was lost within fungi and not by all fungi, with Saitoella complicata named as a Gln20 gene of unresolved origin. One sentence of LSC2-bioinformatics/RESULTS.md was corrected (no number changed): Dictyostelium is no longer listed among the unassayed Gln20 subunits, because the enzyme purified from D. discoideum uses GTP (PMID:7771809, PMID:8448193, PMID:8240297); the assays are not assigned to a beta gene. Validated with just validate yeast LSC2 and the repository quote check.
