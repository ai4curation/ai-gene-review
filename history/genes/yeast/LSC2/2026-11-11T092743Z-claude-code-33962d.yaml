  summary: 'Evolutionary re-review: LSC2'
  details: |
    Part of a joint evolutionary re-review of the succinyl-CoA synthetase subunit families PTHR11117 (alpha) and PTHR11815 (beta). Evidence: the PANTHER release 19 trees, a reproducible local analysis (genes/yeast/LSC2/LSC2-bioinformatics: paralog census, bootstrapped neighbor-joining and maximum-likelihood trees, position-20 residue comparison), cached literature, and two OpenScientist hypothesis runs. Lsc2 is placed in the A-type (SUCLA2) lineage by three trees and has the ancestral Pro at the nucleotide-specificity position. Two actions changed to match the S. pombe ortholog: GO:0042709 IBA from ACCEPT to TOO_GENERAL and GO:0005737 ARBA row from MARK_AS_OVER_ANNOTATED to TOO_GENERAL. Added phylogenetic reasons to the IBA rows, findings and reference reviews, suggested questions and experiments, the bioinformatics analysis, and the OpenScientist report with one disputed finding. Validated with just validate yeast LSC2 and the quote check.
