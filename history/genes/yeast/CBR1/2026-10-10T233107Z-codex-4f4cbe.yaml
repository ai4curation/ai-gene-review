  summary: Review yeast CBR1 fungal PAINT annotations
  details: |
    Created a de novo Saccharomyces cerevisiae CBR1 review for the fungal PAINT family workflow. Reviewed all 25 GOA rows, including the PTHR19370 IBA assignments at PTN001064671, retained the valid cytochrome-b5 reductase PAINT assertion as non-core beside the experimentally specific NADH child term, and modified broad NADH/cytochrome-b5 rows supported by the Dph3 literature to a proposed NADH-dependent Dph3 reductase activity. Added reference reviews, literature notes, a Dph3 reductase GO term request, and core-function synthesis for cytochrome-b5 reduction and Dph3 reduction in tRNA wobble uridine modification and diphthamide biosynthesis.
