- type: CREATE
  outcome: changed
  summary: 'Create review: TMT1 (trans-aconitate/3-isopropylmalate methyltransferase)'
  details: |
    New full review of S. cerevisiae TMT1 (P32643), the experimentally characterised PTHR44942:SF4 relative of SCHPO/SPAC25B8.09, done independently of ProtNLM2 predictions. Six GOA rows reviewed: trans-aconitate 3-methyltransferase activity (IDA, IEA) and cytosol (IDA x2) accepted; cytoplasm (IEA) modified to cytosol; cellular response to amino acid starvation (IDA) kept as non-core (Gcn4 induction plus secreted signal, full text unread). Core functions separate the experimentally established trans-aconitate activity from 3-isopropylmalate methylation, for which a new MF term is proposed under GO:0010340. Evolutionary limits on transfer documented: SF4 is 2:2 between the yeasts (TMT1/CRG1 vs SPAC25B8.09/.10), so only the SAM-dependent methyltransferase activity is safely transferable. Falcon deep research failed (403 auth) and fallback failed; recorded in notes.
