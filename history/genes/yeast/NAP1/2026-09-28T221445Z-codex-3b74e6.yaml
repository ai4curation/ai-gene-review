  summary: Re-review NAP1 IBA propagation
  details: |
    Re-reviewed yeast NAP1 with emphasis on its five IBA rows. Fetched the PTHR11875 PAINT slice, added structured propagation_review blocks for PTN000221934 and PTN000221935, migrated generic GO:0005515 IntAct annotations from legacy MARK_AS_OVER_ANNOTATED to REMOVE, retained Nap1 homodimerization as non-core identical protein binding, and corrected pre-existing non-verbatim abstract-only reference findings for PMID:12788058 and PMID:38571760. Re-read cached H2A-H2B, Rps6/eS6, and nucleosome-disassembly publications and found no newer primary paper that changed the curation calls. PR follow-up promoted the self-seeded nucleus IBA to core, demoted sparsely seeded chromatin and plant/metazoan-seeded chromatin binding to non-core, removed a duplicate bare histone-binding core function, and clarified the PMID:38571760 Xenopus/family-level evidence.
