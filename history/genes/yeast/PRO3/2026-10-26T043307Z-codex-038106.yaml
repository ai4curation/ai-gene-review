  summary: 'Audit fungal arginase-pathway enzyme PRO3: all rows and core functions'
  details: "PRO3 activity is supported by genetic complementation and overproduction (PMID:2824433), proline\
    \ rescue of ore2/pro3 mutants (PMID:1508147), and the enzyme-expression study PMID:1592829. Direct\
    \ GFP and fractionation evidence establishes cytosol (PMID:25112878/7009582). The existing self-binding\
    \ annotations are retained as core biochemical assembly, with tetramer stoichiometry attributed to\
    \ curated UniProt rather than inferred from binary screens. Arginine-to-proline conversion remains\
    \ a secondary physiological route (PMID:6997271). The ER-stress study establishes context-dependent\
    \ consequences of proline depletion, not new direct chaperone activity of Pro3; no new annotation\
    \ was proposed. Preserved all 22 annotation payloads; no new rows. Normal caching and failed provider\
    \ attempts documented honestly. Initial focused validation passed; final backfill/term/reference/render/history\
    \ checks are logged. Independent annotation-reviewer consultation confirmed cycle topology, structural\
    \ core properties and bounded localization uncertainty.\n Final synthesis qualifies the historical\
    \ compartmentation interpretation using PMID:32978391: spatial separation does not imply absence of\
    \ all regulated proline/P5C cycling."
