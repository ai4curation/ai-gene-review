  summary: 'Review: NGG1 (Ada3) annotations, core functions and references'
  details: |
    Reviewed all 50 GOA rows for Ngg1/Ada3 against cached abstracts and full texts (PMID:7862114, PMID:11773077, PMID:9224714, PMID:10490601, PMID:21734642 and others). Complex rows (SAGA, SLIK, ADA), nucleus, RNA polymerase II regulation, the IBA transcription coactivator row and the contributes_to histone acetyltransferase IDA row were accepted. All 29 protein binding rows were removed as uninformative; partners are SAGA subunits (Ada2, Sgf29, Spt8, Hfi1, Tra1). Chromatin organization (IDA) was modified to chromatin remodeling and positive regulation of DNA-templated transcription (IEA) to positive regulation of transcription by RNA polymerase II. The DNA damage response IMP row was left undecided because the cited paper is a Drosophila Ada2b study whose full text could not be read. Core functions: contributes_to histone acetyltransferase activity (Ada2-Ada3-Gcn5 nucleosomal HAT core) and transcription coactivator activity. Two biology knowledge gaps. Validated with just validate, quote_check and backfill-record-sections.
