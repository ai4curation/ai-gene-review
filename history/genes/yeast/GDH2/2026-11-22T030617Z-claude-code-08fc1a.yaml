  details: |
    Answer to review of PR 6613. The IBA row on GO:0005739 carries the is_active_in qualifier. The re-review had set it to KEEP_AS_NON_CORE to match the two mitochondrial proteome rows, while its own reason said activity in the mitochondrion is unproven and the fungal subclade is experimentally cytosolic. The proteome rows say located_in and stay non-core. This row claims activity, so it is now MARK_AS_OVER_ANNOTATED with root cause PROPAGATION_BAD and failure mode COMPARTMENT_OR_COMPLEX_MISMATCH. The general same-term consistency warning between the HDA and IBA rows is expected and is explained by the qualifier difference in the reason. just validate passes.
