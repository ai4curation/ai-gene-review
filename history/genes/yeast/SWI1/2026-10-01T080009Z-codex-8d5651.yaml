  summary: Refresh SWI1 against current GOA
  details: |
    Forced a current GOA refresh for SWI1, resolved three newly seeded live rows, and preserved 14 vanished exact source assertions as retired rows: one older GO_REF:0000120 DNA-binding row, three UniProt-keyword GO_REF:0000043 ancestor rows, and ten older aggregate protein-binding IPI rows.

    Rechecked current PTHR13964 PAINT. PTN000359478 still supports the Pol II transcription-regulation and nuclear-localization transfers but still over-propagates cis-regulatory-region binding from human ARID5B to budding-yeast Swi1; PTN002303792 still supports fungal inheritance of SWI/SNF-complex membership.

    Accepted the new ComplexPortal SWI/SNF-complex row and the new Hap4 exact RNA polymerase II-specific DNA-binding transcription-factor-binding row, kept the new InterPro DNA-binding row as non-core, and added PMID:39235627 as newer support for Swi1 activator-domain binding.

    PR review follow-up replaced the remaining live paper-title anchors with exact evidential PMID:3143101, PMID:28249159, and PMID:3542227 abstract sentences. The proposed GO:0031491 nucleosome-binding row and matching core function now use contributes_to rather than enables so the review asserts Swi1 contribution to SWI/SNF-complex nucleosome binding without claiming isolated Swi1 directly binds nucleosomes.

    Validated with `just validate yeast SWI1` and rendered the updated review HTML with `just render yeast SWI1`.
