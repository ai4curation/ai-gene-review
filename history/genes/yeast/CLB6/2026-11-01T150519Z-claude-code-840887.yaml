  summary: 'Create CLB6 gene review: S-phase cyclin with Clb6-specific Swi6 and Rnr2
    substrates'
  details: |
    New review of S. cerevisiae CLB6 (P32943, YGR109C) for the Yeast Cell Cycle &
    Translation Control project. All 25 GOA rows adjudicated.

    The review deliberately does not mirror its paralog CLB5. Two Clb6-specific
    substrate findings carry most of the signal: of the nine Cdc28 cyclins only
    Clb6 directs Swi6 Ser160 phosphorylation, and the Clb6-Swi6 interaction needs
    no RXL/Cy motif (PMID:14993267); Rnr2 Thr5 phosphorylation is likewise
    Clb6-specific and not Clb5-dependent (PMID:29263158). Both events reduce the
    substrate's nuclear pool.

    Actions over the 25 rows: 16 ACCEPT, 4 MODIFY, 2 REMOVE,
    2 MARK_AS_OVER_ANNOTATED, 1 KEEP_AS_NON_CORE.

    - GO:0032880 -> GO:1900181 (negative regulation of protein localization to
      nucleus) rather than GO:0046827, because the Rnr2 mechanism is anchor release
      and Geymonat et al. explicitly leave export-versus-import open.
    - GO:0006355 -> GO:0045892. This is the row the CLB5 review had to leave
      UNDECIDED for want of Clb5-specific evidence; for Clb6 the sign is
      established by both directions of perturbation.
    - GO:0044772 -> GO:0000082 (ancestor refined to the descendant the gene
      already carries).
    - GO:0005515 (PMID:20489023) REMOVE under the protein-binding policy;
      GO:0005515 (PMID:8253070) MODIFY to GO:0016538, mirroring CLB5.
    - GO:0005815 microtubule organizing center and GO:0007089 traversing start
      control point: both MARK_AS_OVER_ANNOTATED with propagation_review. Grounds
      are stronger than in CLB5: Clb6 is degraded by SCF-Cdc4/APC in early S phase,
      before SPB separation, and its documented relationship to the Start program
      is negative feedback via Swi6 export rather than participation in the
      commitment loop.
    - Root cellular_component ND (SGD, 2013) REMOVE with nd_case: STALE. It
      coexists on the same entry with an experimentally evidenced CC annotation
      (Complex Portal GO:0000307 IPI, PMID:8319908) and with the Clb6-Cdc28
      holoenzyme purified in PMID:14993267. The narrower reading - that nobody has
      localized Clb6 microscopically - remains true and is carried as a suggested
      question and experiment instead. No term needed adding: GO:0000307 and
      GO:0005634 are already in the review.
    - GO:0005634 nucleus IBA ACCEPTed although CLB6 is not among the WITH donors;
      the organelle claim was checked independently against the two nuclear
      substrates rather than taken from the propagation.

    No NEW rows. GO:0046827 and a DNA-replication-initiation term were both
    considered and rejected (comparator check recorded in CLB6-notes.md).

    Deep research was unavailable (no provider API keys configured, so
    `just deep-research yeast CLB6 --provider perplexity` failed), so the
    literature synthesis is in CLB6-notes.md rather than a
    -deep-research-<provider>.md file. PMID:9734354 was added to references: it is
    cited by no GOA row for CLB6 but is load-bearing for the review's reading of
    the weak clb6 single-mutant phenotype.

    Validation: `just validate yeast CLB6` passes with one warning (core function
    GO:0061575 not present in existing_annotations), identical to the pre-existing
    warning on the CLB5 review and accepted for the same reason - GO:0016538 is
    retained because it additionally covers substrate targeting, which is Clb6's
    distinguishing feature.
