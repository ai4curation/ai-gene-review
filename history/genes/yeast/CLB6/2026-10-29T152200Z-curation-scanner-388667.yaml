  summary: 'Create review: yeast CLB6 (S-phase cyclin Clb6)'
  details: |
    New gene review for S. cerevisiae CLB6 (P32943, YGR109C), the second S-phase B-type cyclin, reviewing all 25 GOA annotations. Deep research providers were unavailable (no API keys), so the literature synthesis was hand-assembled into CLB6-notes.md from the cached publications. Five publications were fetched into the cache: PMID:16508019, PMID:26994663 and PMID:21518961 (cited in the review), plus PMID:35522675 and PMID:15744308 as context; PMID:9734354 was already cached. Actions: 13 ACCEPT, 7 MODIFY, 2 KEEP_AS_NON_CORE, 2 MARK_AS_OVER_ANNOTATED, 1 REMOVE. The four GO:0016538 rows were refined to GO:0061575 following the CLN1/CLN2 precedent in this project; GO:0032880 was refined to GO:0046827 positive regulation of protein export from nucleus on the strength of the two Clb6-specific substrates (Swi6 Ser160 and Rnr2 TPSK); GO:0044772 was refined to the GO:0000082 the gene already carries. The propagated microtubule organizing center and traversing-Start rows were marked as over-annotations with propagation_review blocks, matching the CLB5 review. No NEW annotations were proposed. Validated with just validate yeast CLB6 (clean) after just backfill-record-sections.
