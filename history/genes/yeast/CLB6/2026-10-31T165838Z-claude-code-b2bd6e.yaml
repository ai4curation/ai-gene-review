  summary: 'Create review: yeast CLB6 (S-phase cyclin, 25 GOA rows)'
  details: |
    Full review of all 25 GOA rows for S. cerevisiae CLB6 (P32943, YGR109C), completing the S-phase cyclin pair alongside the already-reviewed CLB5, for the Yeast Cell Cycle & Translation Control project.

    Actions consistent with CLB5: GO:0000082 (IBA, 2xIGI, IMP), GO:0045740 (3xIGI) and GO:0000307 (IBA, IPI) accepted; GO:0005815 microtubule organizing center and GO:0007089 traversing Start marked over-annotated with propagation_review recording the inspected PAINT nodes (PTN007424001 is seeded only by mitotic and meiotic cyclins, PTN000808767 by a single fission-yeast cyclin); GO:0005737 cytoplasm kept as non-core.

    Divergent from CLB5, with reasons in each row: GO:0016538 refined to GO:0061575 activator activity on all four rows following the CLN1/CLN2/CLN3 precedent (CLB5 still accepts the parent and is flagged for a later pass); GO:0006355 refined to GO:0045892 on the Swi6 Ser160 result in PMID:14993267; GO:0032880 refined to GO:0046827 positive regulation of protein export from nucleus, covering both Clb6-private substrates Swi6 and Rnr2; both GO:0006279 premeiotic replication rows kept as non-core because PMID:9732268 states clb6/clb6 homozygotes replicate normally; GO:0005575 ND removed with nd_case STALE because ComplexPortal has since curated the Clb6-Cdc28 holoenzyme CPX-339 from PMID:8319908. Both GO:0005515 rows modified to GO:0019901.

    No NEW annotations proposed; a meiotic replication-checkpoint term was rejected on the participation test. PMID:16508019 was added to the publications cache (identifier confirmed against PubMed by title search) as the source for the SCF(Cdc4)-driven Clb6 destruction that explains the Clb5/Clb6 asymmetry. Deep research was unavailable (only claude_code configured), so the literature synthesis is in CLB6-notes.md. Validated with 'just validate yeast CLB6' (clean, no warnings) after running 'just backfill-record-sections genes/yeast/CLB6'.
