  summary: Create the yeast CLB6 gene review (25 GOA rows) for the Yeast Cell Cycle
    project
  details: |
    New review of all 25 GOA rows for P32943 (CLB6, YGR109C), the S-phase cyclin
    paired with the already-reviewed CLB5. Fetched with `just fetch-gene yeast CLB6`;
    deep research was unavailable in this run (no provider API keys), so the
    literature synthesis is in CLB6-notes.md rather than a
    -deep-research-<provider>.md file.

    Actions. 17 ACCEPT (the four GO:0000082 G1/S rows, both GO:0000307 complex rows,
    all four GO:0016538 rows, both GO:0006279 premeiotic-replication rows, the three
    GO:0045740 IGI rows, GO:0005634 nucleus and GO:0044772); 1 KEEP_AS_NON_CORE
    (GO:0005737 cytoplasm, IBA); 2 MARK_AS_OVER_ANNOTATED with a propagation_review
    (GO:0005815 microtubule organizing center from PTN007424001, seeded by mitotic
    B-type cyclins; GO:0007089 traversing Start from PTN000808767, seeded by
    S. pombe cig2 - both mirror the CLB5 review's calls); 4 MODIFY; 1 REMOVE.

    MODIFY rows. GO:0032880 regulation of protein localization (IMP, PMID:29263158)
    -> GO:0046827 positive regulation of protein export from nucleus, on two
    independent Clb6-specific substrates that converge on the same process: Swi6
    Ser160 (PMID:14993267) and the Rnr2 TPSK site/Wtm1 anchor (PMID:29263158). The
    Swi6 export-versus-import ambiguity is quoted in the row and raised as a
    suggested question. GO:0006355 regulation of DNA-templated transcription (IMP,
    PMID:8319908, ComplexPortal) -> GO:0045892, on PMID:14993267, PMID:7651421 and
    PMID:29263158 rather than on the uncached Schwob & Nasmyth evidence; the
    conflicting swi6-S160A observation is quoted. The two bare GO:0005515 rows are
    refined per the protein-binding policy: the Kuehne & Linder co-IP row to
    GO:0016538, the Breitkreutz mass-spectrometric row to GO:0019901.

    REMOVE row. The SGD GO:0005575 CC ND (GO_REF:0000015, 2013) is removed with
    nd_case: STALE, because ComplexPortal has since made a literature-based CC
    annotation on CLB6 itself (GO:0000307 IPI from PMID:8319908, curated as CPX-339
    CLB6-CDC28 kinase complex) and the 1993 papers already reported the Clb6-Cdc28
    association. The IBA nucleus/cytoplasm rows are explicitly not the reason, since
    propagated rows are not literature on the gene.

    No NEW rows. GO:0045736 negative regulation of cyclin-dependent protein
    serine/threonine kinase activity was considered for the Clb5/Clb6
    down-regulation of Cln2- and Clb2-associated kinase (PMID:7651421) and rejected:
    the paper places the mitotic arm genetically downstream of CDC6, so the route is
    indirect, and the record is abstract-only. Recorded as a BIOLOGY knowledge gap
    and a suggested question instead. proposed_new_terms is empty.

    Interpretive key. PMID:16508019 (Jackson, Reed & Haase 2006) is cited by no GOA
    row and was cached in this run. It shows Clb6 is degraded by SCF(Cdc4) at the
    G1/S border while Clb5 survives to mitosis, and that hyperstabilized Clb6
    rescues the clb5 slow-S-phase defect. The "early origins only" restriction
    (PMID:9734354) is therefore a lifetime difference, not a narrower activity,
    which is why the Clb5-shared annotations are accepted for Clb6 rather than
    graded down.

    Two core functions: the Cdc28 activator (GO:0061575) driving G1/S and positive
    regulation of DNA replication from the nucleus, and the substrate-targeting
    regulator (GO:0016538) responsible for the Swi6 and Rnr2 nuclear-export arms.
    Two gene-level knowledge gaps (the indirect CDK down-regulation route; the
    complete absence of direct Clb6 localization data) and one core-function gap
    (whether Clb5/Clb6 substrate specificity is docking-encoded or stability-imposed).

    Newly cached publications: PMID:16508019, PMID:7651421. Validation:
    `just validate yeast CLB6` passes with one warning (GO:0061575 in
    core_functions is not an existing_annotations row, the same warning CLB5
    carries). `just backfill-record-sections` filled record_section on the nine
    UniProt quotes. Compliance 98.05 global / 98.18 weighted.

    Also updated projects/YEAST_CELL_CYCLE.md: CLB6 moved to Done, counts to 12
    reviewed / 11 open and 542 annotations assessed, and a 2026-10-31 notes entry.
