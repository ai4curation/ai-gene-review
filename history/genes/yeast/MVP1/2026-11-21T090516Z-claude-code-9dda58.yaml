  summary: Initial review of S. cerevisiae MVP1 (SNX8 homologue SNX-BAR) GO annotations
  details: |
    First full review of the 19 GOA rows for Mvp1 (P40959), plus one NEW row. Deep research providers were not configured; literature was read directly from cached papers (PMID:24567361, PMID:32198400, PMID:34524084, PMID:41883240, PMID:21954159 in full; PMID:7862158, PMID:11557775, PMID:27883263 abstract only). PMID:34524084, PMID:41883240 and PMID:27883263 were newly cached. Actions: 10 ACCEPT, 6 KEEP_AS_NON_CORE, 2 MODIFY (plasma membrane tubulation to endosome membrane tubulation GO:0097750; cryo-EM identical protein binding to protein homodimerization activity GO:0042803), 1 MARK_AS_OVER_ANNOTATED (nucleus, PMID:21954159), 1 NEW (membrane bending activity GO:0180020, IDA). Core functions: membrane bending SNX-BAR coat on the endosome membrane (endosome membrane tubulation, retrograde transport endosome to Golgi) and PI3P binding. Source defects: SGD WRONG_TERM on the GO:0097320 row; MISSING_STATEMENT for the UniProt FUNCTION comment and the SGD description. Recorded the Chi 2014 versus Suzuki 2021 disagreement on Vps10 retrieval and Mvp1-Vps1 binding as a knowledge gap and suggested questions. The S. pombe mvp1 GO-CAM activity (gomodel:6918f23700004102) was noted in the notes file; no GO-CAM review written.
