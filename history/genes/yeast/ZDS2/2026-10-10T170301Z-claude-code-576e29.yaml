  summary: 'Create review: ZDS2 (PTHR28089 family pass)'
  details: |
    Completed the initial review of ZDS2 (P54786), covering 18 GOA rows: 7 ACCEPT, 5 KEEP_AS_NON_CORE, 1 MODIFY and 5 REMOVE, plus 1 NEW. The IBA GO:0004864 protein phosphatase inhibitor activity from PANTHER PTN001999034, which is seeded only by ZDS1, is MODIFY to GO:0019888 protein phosphatase regulator activity. Zds proteins activate PP2A-Cdc55 towards Mih1 (PMID:21119008) as well as down-regulating it at mitotic exit (PMID:18762578), and PMID:22427694 calls direct inhibition unlikely. The ND root MF row and four high-throughput GO:0005515 rows are REMOVE. NEW GO:0031536 positive regulation of exit from mitosis (IGI, PMID:18762578), checked against ESP1, LTE1 and GLC7. The core function is GO:0019888 in the cytoplasm, acting in G2/M promotion, mitotic exit and Cdc55 localization. Validated with just validate yeast ZDS2; only uv environment warnings remain. A Falcon deep-research job was pending when the review was written, so no deep-research file is cited.
