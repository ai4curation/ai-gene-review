  summary: 'Create review: GPI16'
  details: |
    De-novo review of S. cerevisiae GPI16 (P38875) as the experimentally characterised PIG-T ortholog (PTHR12959:SF11, PAINT donor at PTN000311103) of the ProtNLM2 benchmark gene SCHPO/gpi16, independent of ProtNLM2 output. Falcon deep research failed (authentication) and the perplexity-lite fallback hit a quota error, so the review rests on cached literature and UniProt. All 27 GOA rows reviewed: complex, ER membrane and attachment-of-GPI-anchor rows accepted as core (IDA/IMP in yeast); GO:0006506 modified to GO:0016255 because depletion leaves the complete GPI lipid accumulated; fungal-type cell wall organization marked over-annotated (downstream effect); eleven bare protein-binding rows removed per policy. Notes record which functions are experimental in yeast versus inferred, including that the UniProt by-similarity Gpi8-Gpi16 disulfide is contradicted in yeast (PMID:28374821).
