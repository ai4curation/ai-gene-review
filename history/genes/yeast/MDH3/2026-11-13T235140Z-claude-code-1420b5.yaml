  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (MDH3-phylo.yaml, from `just phylo yeast MDH3`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0005737 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree MDH3 is itself a seed and the other seeds are 14 orthologs across later duplications, 2 paralogs and 1 xenolog of MDH3, so the gene's own experimental annotation is part of the evidence for the family-root node; the objection is to the breadth of the term, which the tree cannot settle.
    - GO:0005739 (REMOVE): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree the single seed is a paralog of MDH3, joined to it at a duplication node at 51% identity, and MDH3 lies 7 steps below the PAINT node across 1 duplication; this agrees with a location carried by the paralog and not shown for MDH3.
    - GO:0006099 (REMOVE): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree the 2 seeds are 1 ortholog across later duplications and 1 paralog of MDH3, and MDH3 lies below the node across 1 duplication; this fits a role kept by the other copy after the duplication, though MDH3 is inside the clade the seeds span.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
