  details: |
    Ran a focused OpenScientist hypothesis (residue-loss-phosphatase) asking only whether the CX5R cysteine/arginine and general-acid aspartate of OCA6 are conserved, withholding the review decision. The run found Cys114 retained, Ile120 at the invariant-arginine position, no C(X)5R motif anywhere, and arginine absent from all surveyed Oca6-clade orthologues. Added the report as a reference and support on the GO:0016791 IBA REMOVE row. Action unchanged; the negative remains a residue-level inference since Oca6 has never been assayed.
