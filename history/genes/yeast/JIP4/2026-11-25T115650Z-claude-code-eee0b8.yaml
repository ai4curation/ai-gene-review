  summary: Record OpenScientist UspA fold assignment for JIP4 with no activity following
    from it
  details: |
    Ran an OpenScientist deep-research job (kgap-jip4-fold-and-motifs) on the knowledge gap recording that JIP4's molecular function is entirely unknown. The run corrects one clause of that gap statement and leaves the rest standing, which is the useful outcome.

    The correction: JIP4 is not without a recognisable module. 27.5 per cent of the AlphaFold model is confidently ordered, enough for a structure search to be meaningful, and residues 183-487 form one coherent module that Foldseek assigns to the universal stress protein fold, with the ATP-bound archaeal USP MJ0577 as top experimental hit at 1.55 Angstrom core RMSD over 79 aligned Calpha pairs. Three independent lines agree: Pfam places JIP4's own domain PF29926, which the local record carries, in the same clan as the universal stress protein family; the hit composition resolves that clan to the UspA branch while returning no class I aminoacyl-tRNA synthetase or PP-loop ATPase hits in any database; and the homologous region carries explicit UspA calls in the paralog YOR019W and in the S. pombe counterpart.

    No molecular function follows from the fold, and that is why the gap stays substantially open. The nucleotide site that makes MJ0577 an ATPase is degenerate and sterically occluded here: the archaeal ATP-contacting loop corresponds to JIP4 Ser438-Thr-Leu-Arg-Trp-Glu-Arg-Thr445, confirmed verbatim in the local Q03361 record, with both glycines of the glycine-rich nucleotide loop substituted, and transplanting the archaeal ATP into the JIP4 frame produces twelve clashing heavy atoms where the archaeal protein with its own ligand has none. The second ordered unit returns nothing. In the disordered 71.5 per cent, twelve motif classes scanned against a thousand composition-preserving shuffles produced nothing above background, with no test surviving multiple-testing correction.

    Status moved from OPEN to NARROWING. The boundary now records that the clause about no recognizable domain should be read as superseded while the clause about no demonstrated activity stands and is better supported than before: there is a fold, it is an ancient nucleotide-binding fold, and this member cannot bind the nucleotide. The boundary also notes the bearing on the companion gap about whether the metazoan SRRM1 splicing function transfers, since a UspA-branch module is not an SR-related splicing module. The gap statement itself was left unedited, since gap statements record what was asked and the correction belongs in the boundary.

    Verified locally: the 876-residue length, the Ser438 to Thr445 loop sequence, and the presence of Pfam PF29926 and PF29925. The Foldseek search and hit composition, the superposition RMSD, the Pfam clan membership, the ATP-transplant clash count, the ordered fraction and the motif-shuffle statistics were not independently checked. No annotation action was taken.
