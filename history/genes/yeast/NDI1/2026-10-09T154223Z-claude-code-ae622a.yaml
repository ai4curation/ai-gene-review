  summary: 'Create review: NDI1'
  details: |
    New review of S. cerevisiae NDI1, the internal rotenone-insensitive type II NADH:ubiquinone oxidoreductase (NDH-2), selected from the MITOTOL project (Chen et al. 2026). All 22 GOA rows reviewed: the NDH-2 activity (GO:0120555 and its parents), NADH-to-ubiquinone electron transport and mitochondrial localization rows were accepted; the two identical protein binding IPI rows were modified to protein homodimerization activity based on the Ndi1 crystal structures; positive regulation of apoptotic process (overexpression and ROS phenotypes) was marked as over-annotated; the cytosol is_active_in row from the YeastPathways GO-CAM conversion was removed as contradicting the matrix-side topology. New FAD binding and matrix side of mitochondrial inner membrane annotations were proposed. No complex I terms (GO:0008137, GO:0045271) are annotated to NDI1, consistent with its loss of complex I.
