  details: |
    Created a de novo S. cerevisiae BCY1 review from GOA, UniProt, the PTHR11635 PAINT annotations, cached primary publications, and a manual PubMed search that found PMID:38865242. Accepted core PKA regulatory-subunit IBAs at PTN004280545, accepted the fungal nuclear and cytosolic localization IBAs, redirected the over-scoped GO:0007189 IBA to negative regulation of cAMP/PKA signal transduction, narrowed TPK1/TPK2/TPK3 generic binding rows to protein kinase A catalytic subunit binding, removed generic Ess1 binding rows, removed the miscited mammalian PMID:16683188 self-interaction row, and removed Ras/Lte1 bud-neck localization rows in which bcy1 was only a bypass background.
