  details: |
    New full review of S. cerevisiae HAP2 (P06774), the closest experimentally characterised relative (PAINT donor to PTN000290575/PTN000290576) of N. crassa NCU03033. Fetched gene data and cached 13 publications. Deep research failed: falcon 403, and the perplexity-lite fallback failed. Added HAP2-bioinformatics/panther_subfamily.py, which shows that PANTHER 19 places P06774, Q7SGY4 and human NFYA in PTHR12632:SF6. Reviewed all 23 GOA rows. Accepted contributes_to CCAAT DNA binding, activator activity, CCAAT-binding factor complex, nucleus, positive regulation of Pol II transcription and the GO:0000981 IBA. Modified the generic regulation-of-transcription rows, including the GO:0006357 IBA, to GO:0045944. Marked generic DNA binding and DNA-binding TF activity IEA as TOO_GENERAL. Removed five GO:0005515 HAP5 rows under the protein-binding policy. Kept regulation of cellular respiration and of carbohydrate metabolism as non-core and yeast-specific, not for transfer. Wrote the description, core_functions, questions and experiment. ProtNLM2 predictions were not consulted.
