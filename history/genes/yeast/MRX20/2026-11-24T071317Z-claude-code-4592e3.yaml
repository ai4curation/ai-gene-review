  summary: 'Re-review of over-annotated IBAs: citrate rows reasons rewritten'
  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N14). GO:0071913 and GO:0006843 keep MARK_AS_OVER_ANNOTATED. The earlier reasons rested on MRX20 being uncharacterised in an uncharacterised subfamily. The tree shows more: MRX20 sits inside the seeded node PTN000640552 and is one product of a budding-yeast duplication at PTN001182708 whose other product is the CTP1 clade, the characterised yeast citrate carrier and a seed of the process term. The reasons now state that ground (doubt after duplication, with the ancestral role carried by the sister paralog) and name the experiment that would settle it. The summary of the activity row was corrected where it said the subfamily holds only Saccharomyces strains; its members are orthologs from Eremothecium, Candida and Yarrowia.
