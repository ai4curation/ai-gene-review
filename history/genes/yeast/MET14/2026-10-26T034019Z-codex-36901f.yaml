  summary: Reassess complete fungal sulfate-assimilation member review
  details: |
    All 24 rows and core functions reviewed; original machine annotation payloads preserved and no row added. APS kinase transfers phosphate from ATP to APS, producing PAPS. PMID:1654509 identifies the MET14 structural gene; PMID:3019265 reports purified kinase behavior and thiol-dependent activation. ATP is an actual substrate, so its binding is core rather than peripheral. Thiol activation does not establish thioredoxin as an obligatory electron donor to this phosphorylation step. The true broad sulfur-amino-acid metabolic claim is refined to the already supported biosynthetic term. PMID:22234534 engineering effects on glutathione production are pathway-flux effects, not evidence that this kinase catalyzes glutathione peptide assembly. Normal Falcon/fallback attempts failed with provider access/quota errors; publication caching succeeded and manual evidence assessment is documented in the appended notes. Focused validation, rendering and record-section backfill accompany this review.
