  summary: Outer membrane row from a proteome kept as non-core
  details: |
    Follow-up to the automated review of ai4curation/ai-gene-review#6551 (re-review of REMOVE actions in yeast). The mitochondrial outer membrane row (index 4, HDA) had been moved from REMOVE to MARK_AS_OVER_ANNOTATED earlier in this pass, with a reason that added a condition the policy does not contain for direct evidence. Rule 2 of the organelle policy (projects/ORGANELLES.md) keeps a location that a direct assay observed, because the row says what the experiment showed. The rows are now KEEP_AS_NON_CORE: the detection is unrefuted, and the location is peripheral to what is known of the protein. The reason no longer says that ER membrane comes down with the preparation: the outer membrane vesicles were made from mitochondria that were virtually free of ER marker proteins (PMID:16407407, quote added). Whether the signal is a second pool of Gsf2 or ER membrane held at contact sites is not known. Validated with ai-gene-review validate --terms: no error and no new warning.
