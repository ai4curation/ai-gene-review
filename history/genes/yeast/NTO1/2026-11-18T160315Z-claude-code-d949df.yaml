  summary: 'Review: NTO1 NuA3 scaffold subunit, 18 GOA rows plus 2 NEW'
  details: |
    Reviewed all 18 GOA rows for Nto1 (Q12311) as part of the CHROMATIN project NuA3 module. Actions: 12 ACCEPT, 4 KEEP_AS_NON_CORE, 1 MODIFY, 1 MARK_AS_OVER_ANNOTATED, 2 NEW. Main calls: the IDA H3K36me3 reader row is kept as non-core because the binding is weak and NuA3 H3K36me3 binding in cells depends on Pdp3 (PMID:33010166); the IBA histone reader row is modified to that specific term; the HDA/IEA cytoplasm rows are non-core; DNA-templated transcription (NAS) is over-annotated, as in SAS3. Two NEW rows from the NuA3 cryo-EM full text (PMID:41318527): histone binding (Nto1 PZP contacts the H3 tail in the substrate cleft) and contributes_to histone H3K14 acetyltransferase activity (N354A partly reduces activity). Core function: histone binding contributing to H3K14 acetyltransferase activity in NuA3. One BIOLOGY gap on whether the Nto1 PHD fingers read a methyl mark in vivo. Validated with just validate, quote_check and backfill-record-sections.
