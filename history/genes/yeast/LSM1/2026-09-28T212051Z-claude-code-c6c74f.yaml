  details: |
    Re-reviewed LSM1 GOA annotations with special attention to PAINT/IBA transfers. Verified that the current PTHR15588 PAINT tree keeps mRNA binding on PTN000400405 and the cytoplasmic Lsm1-7-Pat1 complex, P-body, and deadenylation-dependent decapping functions on PTN000400406, so the existing IBA rows were left supported and were updated with structured propagation_review blocks. Converted eleven generic IntAct GO:0005515 protein binding buckets from MARK_AS_OVER_ANNOTATED to REMOVE and removed cellular-component replacement suggestions. Reclassified generic protein-containing complex and ribonucleoprotein complex parents as KEEP_AS_NON_CORE because the specific Lsm1-7-Pat1 complex annotation is present. Searched for newer LSM1 literature, cached PMID:38625794, and cited it as corroboration for the established decapping role without using it as mRNA-binding support. Synced the rendered curation summary with the corrected chromatin, nucleus, complex-parent, and protein-binding decisions.
