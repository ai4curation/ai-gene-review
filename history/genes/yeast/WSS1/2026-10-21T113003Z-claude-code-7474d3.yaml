  summary: 'Create review: WSS1 (P38838), experimental donor for the Wss1 subfamily'
  details: |
    De novo full review of S. cerevisiae WSS1, independent of ProtNLM2 predictions. Falcon deep research failed (authentication) and the perplexity-lite fallback hit its quota, so the review rests on cached primary literature (Stingele 2014, Balakirev 2015 full text, Yang 2017 structure, Maddi 2020, Mullen 2010, Serbyn/Noireterre 2020-2023 and others). Evolutionary grounding: PTHR46622:SF1, the same subfamily as S. pombe wss1. WSS1 is the donor for PAINT node PTN001503361. All 19 GOA rows were reviewed. Accepted as core: metalloendopeptidase activity, DPC repair, nucleus, SUMO binding, histone catabolic process. The IBA/IDA metallopeptidase and IBA DNA repair rows were changed (MODIFY) to the specific terms the gene already carries. SUMO ligase activity and protein sumoylation (one lab, not propagated by PAINT), TLS, sister chromatid recombination, vacuole and zinc binding are kept as non-core. Nuclear envelope is marked over-annotated (the focus is near the membrane, not in it). DNA binding (GO:0003677) was added as NEW from curated UniProt experimental text. The notes record which functions are safe to transfer to orthologs.
