  details: |
    Ran OpenScientist (narrowed to 2 iterations after the first broad run was cancelled while queued) on whether AIM6 keeps the catalytic machinery of the PLC-like phosphodiesterase fold. In the GlpQ/GDPD register AIM6 keeps both catalytic His (120, 156) and the Glu141/Asp143 metal pair, invariant across 117 fungal family members. The phosphate-activating Arg is replaced by an invariant Asn121. Gap OPEN -> NARROWING: an active enzyme family is favoured, but catalysis and substrate are untested.
