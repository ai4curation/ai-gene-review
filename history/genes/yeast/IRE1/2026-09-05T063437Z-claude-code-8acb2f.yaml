  summary: Reconcile IRE1 SFT prediction review with the curated nuclear annotation
  details: |
    PR #2936 changed the curated GO:0005634 (nucleus) annotation on yeast IRE1 from UNDECIDED to KEEP_AS_NON_CORE, on the strength of an IDA from PMID:17035634 reporting a validated nuclear localization signal. The SFT prediction review still assessed the matching nucleus prediction as NPI with error_type PATHWAY_CONTEXT_IGNORED, asserting that Ire1p is not found in the nucleus. That is now contradicted by the repository's own curated annotation, so the assessment becomes CNN (correct but not novel; the term is already in GOA as an IDA) with confidence 2 and no error_type. Regenerated the benchmark sidecars and updated the reported CNN/NPI counts in the project page, manuscript and supplement to match, plus the two hardcoded cnn_exact_frozen_goa expectations in the test.
