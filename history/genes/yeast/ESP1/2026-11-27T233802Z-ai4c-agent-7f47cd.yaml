  summary: Record the UniProt provenance for the Q4GYR1 PAINT source species
  details: |
    PR review round asked for the trypanosome attribution of UniProtKB:Q4GYR1 in the GO:0005634 and GO:0005737 IBA summaries to be either sourced or dropped, because nothing in the repository recorded it and genes/human/ESPL1/ESPL1-notes.md records the same accession as mouse Espl1. Looked the accession up against the UniProt REST API on 2026-11-27: Q4GYR1_TRYB2, Trypanosoma brucei brucei (strain 927/4 GUTat10.1), NCBI_TaxID=185431, ORFNames=TB927.1.3120. The review's attribution is correct, so the dated lookup was appended to ESP1-notes.md rather than the species adjective being removed. No annotation action, GO term, core function or supporting_text was changed. The conflicting ESPL1-notes.md line is left for its own change: it belongs to a different gene's slice.
