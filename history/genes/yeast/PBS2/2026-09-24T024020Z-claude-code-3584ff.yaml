  summary: 'Create review: PBS2'
  details: |
    Reviewed all 51 GOA annotations for S. cerevisiae PBS2 (P08018), the HOG-pathway MAPKK. Accepted MAP kinase kinase activity, MAP kinase scaffold activity (IPI with Sho1, Ste11, Hog1), p38MAPK cascade, osmosensory signaling and hyperosmotic response rows as core. Modified nine bare protein-binding rows (Sho1 SH3, Nbp2 SH3 partners) to SH3 domain binding. Removed three UniProt-assigned rows from PMID:12783868 (N-terminal acetyltransferase activity, NatB complex, Mdm20 binding) as an apparent NAT3 accession mix-up: the abstract defines NatB as Nat3p/Mdm20p, Pbs2 lacks any acetyltransferase domain, and SGD's current curated PBS2 set omits them. Marked Hog1 nuclear import and Rhea-derived protein serine kinase activity as over-annotations; kept bud tip/neck, actin organization, stress granule, macroautophagy and protein-containing complex as non-core. Added notes, description, reference reviews, two core functions, questions and one experiment.
