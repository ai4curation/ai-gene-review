  summary: Record OpenScientist negative result on a biophysical rule for MIM-complex
    dependence
  details: |
    Ran an OpenScientist deep-research job (kgap-mim1-client-rule) testing whether any biophysical rule predicts which alpha-helically anchored outer-membrane protein requires the MIM complex. No rule emerges, and the gap was deliberately left OPEN on that basis rather than marked as narrowed.

    Across 16 anchor parameters scored on the published dependence table (10 MIM-dependent clients, 3 MIM-independent proteins), no parameter separates the sets after Benjamini-Hochberg correction, the smallest false-discovery-rate p being 0.246. The closest parameter is mean anchor hydrophobicity on a transfer free-energy scale, in the mechanistically coherent direction that clients carry the less hydrophobic, less spontaneously insertion-competent anchors. Three results stop that trend being usable: the entire signal sits in the terminal residues of the UniProt-annotated segment rather than its hydrophobic core, so it is partly a statement about where a database annotation stops; a boundary-free window collapses the leave-one-out classifier below the trivial baseline of always predicting dependence; and the best single threshold misclassifies the multispan clients Ugo1 and Scm4. Helical hydrophobic moment, anchor length, glycine-proline content and flanking net charge carry no discriminating information. The run also reports that the non-client set has three members, one of them Mim1 itself and therefore self-referential, that power at the observed effect size is 0.592, and that roughly eight non-clients would be needed for 0.878, so the published literature cannot settle the question whatever the analysis.

    An error of mine is recorded with the result. The hypothesis I submitted named Tom22 and Fis1 among the MIM-dependent clients. Both are published MIM-independent controls, so 2 of the 5 positives I supplied had the wrong sign, and the run caught it. This review's own boundary text already stated that Tom22 is a long-standing MIM-independent exception citing PMID:17974559, and the notes file records the same, so the information needed to avoid the mistake was already in the repository. The mislabelling was in the prompt and not in the review, and nothing in the review rests on it; the Fis1 assignment was not separately checked here.

    No annotation action was taken. The run also states that it could not retrieve the full text of PMID:32348752 and flags that paper's per-protein substrate list as unverified rather than guessing it.
