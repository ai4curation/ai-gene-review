  summary: 'Create review: PHO91 (reference relative for NEUCR/NCU01540)'
  details: |
    De-novo review of all 25 GOA rows of yeast PHO91 (P27514), independent of ProtNLM2 predictions; falcon/perplexity deep research failed (auth/quota) so evidence is from cached literature incl. full-text Bru et al. 2025 (PMID:41324358) and Potapenko et al. 2018 (PMID:30315104). Core: phosphate transmembrane transporter activity at the fungal-type vacuole membrane (vacuolar Pi export). Generic transport/membrane/ARBA rows MODIFY to GO:0035435/GO:0000329/GO:0005315; plasma-membrane IBA (PTN000031793, Pho91 not a seed), polyphosphate metabolic process and regulation of phosphate transmembrane transport marked over-annotated as indirect phenotypes; glycerol-3-phosphate transport and vCLAMP kept as non-core. Notes record which functions are experimentally established in S. cerevisiae for later SF92 transfer.
