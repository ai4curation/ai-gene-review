  summary: 'Create review: SEN15'
  details: |
    De novo review of S. cerevisiae SEN15 (Q04675), written as the experimental reference for the PTHR28518:SF1 relative SCHPO/sen15 and independent of the ProtNLM2 predictions. Deep research failed (falcon authentication error; perplexity-lite quota exceeded), so the review was built from cached primary literature: PMID:9200603, 12925762 (full text), 16710424, 22391451, 25971974 (full text), 17166513 and 37028420. Of the 16 GOA rows: ACCEPT for contributes_to GO:0000213 (IDA), all four GO:0000214 rows, the three GO:0000379 rows and both GO:0005741 rows (the NAS reference attribution is flagged in the reason); MODIFY GO:0006388 to GO:0000379; MARK_AS_OVER_ANNOTATED for GO:0003676 (superfamily IEA) and GO:0012505 (endomembrane system excludes mitochondria); KEEP_AS_NON_CORE for nucleus; REMOVE for both bare GO:0005515 IPI rows with SEN34, per the protein-binding policy. Complex-level tRNA-independent functions (CBP1 mRNA cleavage, the essential cytoplasmic function) were not annotated to Sen15 and are raised as questions. PAINT's omission of the MF term from PTN002003396 is recorded as deliberate.
