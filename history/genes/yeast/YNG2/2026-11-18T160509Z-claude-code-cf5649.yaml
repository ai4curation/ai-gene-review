  summary: 'Review: YNG2 GO annotations, core functions and references (CHROMATIN
    project)'
  details: |
    Reviewed all 29 GOA rows for Yng2. Main decisions: contributes_to histone acetyltransferase activity refined to histone H4 and H2A acetyltransferase activity; nucleosome (part_of) modified to nucleosome binding; chromatin organization IBA refined to chromatin remodeling; regulation of DNA-templated transcription IBA and DNA-templated transcription NAS refined to regulation of transcription by RNA polymerase II; all six protein binding rows (partner Epl1) removed; cytosol (hypoxia relocalization, PMID:22932476 Table 2 lists YNG2) and zinc ion binding kept as non-core; H3K4me3 reader, piccolo and NuA4 rows accepted; DNA repair accepted with Yng2-specific support (PMID:12417725, PMID:26564157). Core functions: contribution to H4 acetylation in piccolo NuA4 and histone H3K4me3 reader activity. One BIOLOGY knowledge gap on how PHD reading directs local acetylation. Fetched PMID:12417725, PMID:11544250, PMID:11604499, PMID:27550811, PMID:26564157. Validated with just validate, quote_check and backfill-record-sections.
