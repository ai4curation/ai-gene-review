  details: |
    Created the SSK1 (Q07084) review from GOA, UniProt, the Falcon deep-research report and cached publications (Maeda 1994, Posas 1996, Posas and Saito 1998, Horie 2008, Lu 2003, Motizuki and Xu 2009). All 32 GOA rows reviewed: phosphorelay response regulator activity, osmosensory signaling via phosphorelay, protein kinase activator activity, MAP3K binding, cytoplasm, cellular hyperosmotic response and regulation of p38MAPK cascade accepted; low-pH/actin rows kept as non-core; generic response to stress modified to cellular hyperosmotic response; protein-binding rows with Ssk2/Ssk22 modified to MAP3K binding (GO:0031435) and those with Ypd1 removed as uninformative (interaction itself is real and captured by GO:0000156). Core functions: GO:0000156 receiver activity in the Sln1-Ypd1-Ssk1 phosphorelay, and GO:0030295 activation of Ssk2/Ssk22 MAP3Ks. Homodimerization raised as a suggested question rather than NEW. Notes file added.
