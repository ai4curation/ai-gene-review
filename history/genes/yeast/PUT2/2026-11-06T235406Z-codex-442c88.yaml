  summary: Resolve PutA review consistency findings for yeast/PUT2
  details: |
    The existing GO:0097054 IDA row changes KEEP_AS_NON_CORE to ACCEPT, and the same process is included beside proline catabolism in the core synthesis. Live QuickGO defines this term as reactions/pathways forming L-glutamate, without a de novo GDH/GOGAT restriction. Put2 directly performs the glutamate-forming reaction; calling that chemistry catabolic does not make it peripheral. This matches the bacterial PutA GSALDH judgment, without claiming Put2 is the principal cellular glutamate source. [PMID:387737 "Proline is converted to glutamate in the yeast Saccharomyces cerevisiae by the sequential action of two enzymes, proline oxidase and delta 1-pyrroline-5-carboxylate (P5C) dehydrogenase"] The original PMID:4145181 payload is preserved; its bibliographic-only cache is not promoted to an independently read assay. Focused schema/reference validation, gene rendering, original-row preservation, and protected-source hashes are checked in the round1 audit. No source payloads or cached literature/provider artifacts are edited.
