  summary: New full review of budding-yeast CRT10 (Q08226) as the experimental reference
    for SCHPO/crt10, independent of ProtNLM2 predictions
  details: |
    Reviewed all 6 GOA rows from primary literature (falcon deep research failed with 403). Accepted nonfunctional rRNA decay (IMP, IGI) as core; accepted MF ND (substrate-adaptor role unproven); removed two bare protein-binding rows (Mms1-bridged Rtt101 interaction); modified CC ND to Cul8-RING ubiquitin ligase complex (GO:0035361) from TAP-MS co-purification, supported by a comparator check showing Mms22/Mms1/Rtt101 carry that term. Added PMID:16600900 and PMID:20139071, core function, knowledge gap, questions and experiments. No PANTHER family, so no IBA/PAINT basis exists.
