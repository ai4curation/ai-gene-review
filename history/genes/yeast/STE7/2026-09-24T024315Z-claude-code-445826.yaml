  details: |
    De novo review of S. cerevisiae STE7 (P06784), the MAP2K of the pheromone response (Fus3/Kss1) and filamentous growth (Kss1) MAPK cascades. All 50 GOA annotations reviewed: MAP kinase kinase activity, pheromone response MAPK cascade, filamentous-growth signalling and localization (cytoplasm, mating projection tip) accepted; invasive/pseudohyphal growth kept as non-core; GO:0000196 cell integrity MAPK cascade modified to generic MAPK cascade because the term is defined by the Slt2 cascade; Rhea-derived protein serine kinase activity marked over-annotated; protein binding rows modified to MAP kinase binding (Fus3/Kss1) or scaffold protein binding (Ste5), with Hog1 and Cdc14 AP-MS rows removed. Added description, reference reviews, two core functions, notes, questions and experiments.
