  summary: Correct the GO_REF:0000117 ARBA finding to match the actual rule condition
    set
  details: |
    Review follow-up on PR #2992 (ai4c-reviewer CHANGES_REQUESTED). The GO_REF:0000117 finding claimed ARBA assigns AAD3 'generic aldo/keto reductase oxidoreductase terms purely from Pfam PF00248'. Both halves were wrong and were corrected against verifiable sources rather than softened: (1) AAD3-goa.tsv carries exactly one GO_REF:0000117 row, and it is the specific term GO:0047681 aryl-alcohol dehydrogenase (NADP+) activity via ARBA:ARBA00093038 -- consistent with the file's own annotation review, which calls it 'the specific molecular function'. (2) The cached rule record in rules/arba/rules_data.json gives ARBA00093038 a single condition set with condition_types [taxon, FunFam id] and funfam_ids ['3.20.20.100:FF:000024 (Aryl-alcohol dehydrogenase)'] -- no Pfam condition. AAD3-uniprot.txt line 96 confirms AAD3 carries that same FunFam, so the rule genuinely fires on AAD3. The finding now states the specific term, the real taxon+FunFam condition set, and retains the unchanged conclusion that a fold/family-level condition cannot see the AAD3-specific Cys73 substitution. No annotation actions, GO terms, core_functions, or description text were changed; compliance remains at 0 rows.
