  summary: 'Create review: MSD1 (mitochondrial AspRS, DARS2 ortholog)'
  details: |
    De-novo review of yeast MSD1 (P15179) as the experimental reference for human DARS2 (same PANTHER subfamily PTHR22594:SF5), independent of ProtNLM2 predictions. Deep research failed (falcon auth error; perplexity quota), so the review uses cached literature (PMID:2668951, PMID:10710420, PMID:35820270, three mitochondrial proteomics HDA papers) and UniProt. All 20 GOA rows reviewed: aspartate-tRNA ligase activity accepted (IMP, ISA, IBA, IEA); mitochondrion and matrix accepted; obsolete GO:0006422/GO:0070146 modified to GO:0070127; nucleic acid binding modified to tRNA binding; broad parents (nucleotide binding, aminoacyl-tRNA ligase, ligase, cytoplasm, GO:0006418) marked TOO_GENERAL. Notes distinguish yeast-established evidence (loss of mitochondrial tRNA(Asp) acylation in disruptant; allele-specific suppression of a mt tRNA(Asp) mutation) from homology inferences (matrix location, dimerization, binding residues). No NEW terms; mtDNA-maintenance and respiratory phenotypes not annotated as processes.
