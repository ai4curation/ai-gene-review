  summary: Review yeast CLN1 annotations (G1/S cyclin)
  details: |
    Created the CLN1 review covering all 24 GOA rows, plus CLN1-notes.md (hand-assembled from cached publications; deep research providers were unavailable in this run, so no -deep-research-<provider>.md file was written).

    Actions mirror the paralog genes/yeast/CLN2, whose annotation set is a superset of CLN1's: GO:0016538 (4 rows) MODIFY to GO:0061575 activator activity; the seven bare GO:0005515 rows MODIFY to GO:0019901 protein kinase binding (six with CDC28, one with PHO85); GO:2000045 and GO:1902806 MODIFY to GO:1900087 for sign; GO:0000082, GO:0000307 (x3), GO:0005634 (x2), GO:0005737 (x2) and GO:0007089 (x3) ACCEPT.

    proposed_new_terms is empty. A NEW GO:0180040 negative regulation of pheromone response MAPK cascade row was considered on the strength of the Cln1-specific Ste5/Ste20 phosphorylation in PMID:21945277 and rejected on a comparator check: only PPQ1 and AKR1 carry GO:0180040 in budding yeast, and CLN2 does not despite stronger Ste5 evidence, carrying GO:0000321 instead. Raised as a suggested question.

    Added PMID:21945277 and PMID:14688790 to the cache and references. Corrected an SGD id mix-up during drafting: S000000038 is CLN3 and S000006177 is CLN2, not the reverse.

    Project page projects/YEAST_CELL_CYCLE.md updated: 11 of 23 rows reviewed, 517 annotations assessed.
