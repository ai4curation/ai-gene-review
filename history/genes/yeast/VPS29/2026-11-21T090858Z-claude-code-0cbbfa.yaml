  details: |
    Reviewed all 23 GOA rows: 14 ACCEPT, 2 KEEP_AS_NON_CORE, 1 TOO_GENERAL, 6 REMOVE (bare protein binding). Hosted deep research was unavailable; literature found by PubMed E-utilities searches (recorded in the PEP8 and VPS29 notes) and read from cached papers. The SGD description was fetched and verified. The contributes_to cargo adaptor activity rows (IBA, IMP, IPI) were accepted: Vps29 links Vps35 to the Vps5 N-terminus (PMID:38598303, PMID:40234461), consistent with the PTHR11124 family review and the S. pombe retromer GO-CAM gomodel:693b3c0900002174. Endomembrane system marked TOO_GENERAL; cytosol and endosome-to-plasma-membrane transport kept as non-core; CROP complex accepted with a second core function. No NEW rows; no phosphoesterase activity proposed.
