  summary: 'Create review: FUS3'
  details: |
    Reviewed all 56 GOA annotations for the pheromone-response MAPK Fus3 (P16892). Accepted MAP kinase activity, pheromone response MAPK cascade, response to pheromone and nucleus/cytoplasm/mating projection tip; modified the four invasive-growth (GO:0001403) rows to negative regulation of invasive growth (GO:2000218) because Fus3 restrains invasive growth via Tec1 degradation; modified bare protein-binding rows to MAPKK binding (Ste7), MAPKKK binding (Ste11) or scaffold protein binding (Ste5), consistent with the KSS1 review, and removed uninformative/xeno rows (Kss1, Bck2, Tim12, V. polyspora Ste5, self-binding); removed the erroneous UniProt periplasm mapping; marked mitochondrial proteomics hits as over-annotated. Fetched PMIDs 1628831, 8334305, 9094309, 12732146 and 19897738 for substrate and activation evidence.
