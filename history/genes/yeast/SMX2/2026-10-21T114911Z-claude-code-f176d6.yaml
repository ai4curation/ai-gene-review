  summary: 'Create review: SMX2 (SmG, P40204)'
  details: |
    De-novo review of S. cerevisiae SmG as the experimentally characterised reference for PTHR10553:SF2 (SmG subfamily shared with N. crassa NCU09880 and S. pombe smg1; human SNRPG is in SF26 under the same PAINT node PTN000058285). Falcon and perplexity-lite deep research both failed (auth/quota), so the review is built from cached primary literature, chiefly PMID:27417296 (structure-guided SmG mutagenesis), PMID:9528767 (SmE-SmG interaction) and snRNP purification papers. All 58 GOA rows reviewed: snRNP/tri-snRNP/prespliceosome memberships and mRNA splicing accepted; SMN-Sm protein complex IBA removed (S. cerevisiae lacks SMN); cap hypermethylation IMP marked over-annotated (experiment depleted SmE; Tgs1 catalyses); spliceosomal tri-snRNP IBA modified to U4/U6 x U5 tri-snRNP; ND rows modified to snRNA binding (contributes_to) and mRNA splicing; three SME1 protein binding rows removed per policy. ProtNLM2 predictions were not consulted.
