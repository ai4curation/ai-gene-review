  summary: New review of PEP8/VPS26, the arrestin-fold subunit of the yeast retromer
    cargo-selective complex
  details: |
    Reviewed all 28 GOA rows: 15 ACCEPT, 5 KEEP_AS_NON_CORE, 1 MODIFY, 1 TOO_GENERAL, 6 REMOVE (bare protein binding). Hosted deep research was unavailable; literature found by PubMed E-utilities searches and read from cached papers (queries recorded in PEP8-notes.md). The SGD description was fetched and checked. Cargo receptor activity (IDA, PMID:28362258) was modified to cargo adaptor activity because Vps26 is a peripheral coat subunit, not a transmembrane receptor; the direct binding of Vps26 to the Chs3 recycling signal is the row's evidence. Endomembrane system marked TOO_GENERAL. Endosome-to-plasma-membrane transport, Golgi retention, cytosol, cytoplasm and vacuole membrane kept as non-core. CROP complex accepted, with a second core function; vacuole fission (GO:0140572) was not proposed because no S. cerevisiae gene carries it. No NEW rows. GO-CAM check: no S. cerevisiae model; the S. pombe retromer model gomodel:693b3c0900002174 uses cargo adaptor activity for the cargo-selective complex.
