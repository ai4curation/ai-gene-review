  summary: Refine the endosome IDA row and harmonise the recycling call
  details: |
    Review follow-up on PR 6587 (cross-gene consistency in the yeast retromer batch). The IDA endosome row from PMID:9700157 now MODIFYs to GO:0010008 endosome membrane, as on VPS35. The endosome term is a series organelle, which the organelle policy does not cover, and the row's own evidence (a peripheral membrane-associated complex that assembles on an endosomal membrane) reaches the membrane. The IBA endosome row is kept, because a family inference stops at the organelle. The core function location moves from endosome to endosome membrane. The GO:0032456 row moves from KEEP_AS_NON_CORE to MARK_AS_OVER_ANNOTATED, with the shared CPX-1653 query. A CONFIRMED WRONG_QUALIFIER (is_active_in to part_of) defect is added on the CROP complex row. Expected warning: inconsistent_review_actions for GO:0005768 (IBA ACCEPT, IDA MODIFY), the same per-row pattern as VPS1 GTPase activity.
