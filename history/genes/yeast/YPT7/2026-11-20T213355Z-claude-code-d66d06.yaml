  summary: Mitochondrion and outer membrane rows from proteomes kept as non-core
  details: |
    Follow-up to the automated review of ai4curation/ai-gene-review#6551 (re-review of REMOVE actions in yeast). The mitochondrion row (index 22, HDA) and the mitochondrial outer membrane row (index 23, HDA) had been moved from REMOVE to MARK_AS_OVER_ANNOTATED earlier in this pass, with a reason that added a condition the policy does not contain for direct evidence. Rule 2 of the organelle policy (projects/ORGANELLES.md) keeps a location that a direct assay observed, because the row says what the experiment showed. The rows are now KEEP_AS_NON_CORE: the detection is unrefuted, and the location is peripheral to what is known of the protein. The reason of the outer membrane row now records that the authors of the proteome count Ypt7 among the GTP-binding proteins of the outer membrane (quote added); the role of Ypt7 at the contact site between vacuole and mitochondrion accounts for both detections. Validated with ai-gene-review validate --terms: no error and no new warning.
