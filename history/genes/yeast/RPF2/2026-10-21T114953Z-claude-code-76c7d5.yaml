  summary: 'Create review: RPF2'
  details: |
    De-novo review of S. cerevisiae RPF2 (P36160), the PAINT seed donor of PTN000296192 for the HORSE40/NEUCR ProtNLM2 cohort, done independently of ProtNLM2 output. Deep research failed (falcon auth, perplexity quota), so the review uses cached primary literature (Morita 2002, Zhang 2007, Talkish 2012, Asano 2015, Madru 2015, Micic 2020, Castillo 2023). Accepted 5S rRNA binding, rRNA binding, nucleolus, pre-60S membership, LSU assembly and 27SB-to-25S maturation as experimentally established; demoted 5.8S maturation to non-core; MODIFIED general IEA terms to specific descendants; MODIFIED GO:0008312 (SRP 7S RNA binding) to rRNA binding with a PROBABLE source defect for SGD; removed 27 bare protein-binding rows per policy. Notes record that PAINT propagated only rRNA binding, nucleolus and LSU-rRNA maturation from this donor.
