  summary: Narrow the ICY1 molecular-function knowledge gap with an OpenScientist
    Foldseek run
  details: |
    Ran OpenScientist (3 iterations) to look for a structural homolog of ICY1. There is none in any Foldseek database because the AlphaFold model is disordered. The conserved element is a C-terminal amphipathic helix (106-127; A116/Y120/W123/L124 invariant in 46 orthologs; checked locally) shared with paralog ATG41/ICY2. Gap OPEN -> NARROWING; the MF ND row is unaffected because no literature on ICY1 function exists.
