  summary: First review of yeast retromer SNX-BAR subunit VPS17 (P32913)
  details: |
    Reviewed all 39 GOA rows for VPS17 and set status DRAFT, in the same session as VPS5 (literature search in VPS5-notes.md; VPS17-specific searches and two more cached papers, PMID:8416961 and PMID:35506766, in VPS17-notes.md). The SGD MOD description was fetched and checked claim by claim.
    Actions: 18 ACCEPT, 17 REMOVE (all bare protein binding), 2 MARK_AS_OVER_ANNOTATED, 2 TOO_GENERAL, 3 NEW.
    Over-annotated: cytosol (IEA from the process term; wild-type Vps17 is particulate, PMID:8416961) and endosome to plasma membrane transport (ComplexPortal NAS). TOO_GENERAL: endomembrane system (IEA, NAS).
    PI3P binding kept (IDA PMID:11557775, also PMID:12244127), but the conflict with the Vps17 PX crystal structure (PMID:35506766, no canonical basic site) is recorded and raised as a question.
    Kept SGD's contributes_to protein-membrane adaptor activity (IMP PMID:12181349); the direct contacts with Vps29/Vps35 are on Vps5 (PMID:40234461).
    NEW: GO:0180020 membrane bending activity (contributes_to; PMID:28100638, PMID:30188774, PMID:36644906), GO:0097750 endosome membrane tubulation and GO:0010008 endosome membrane (PMID:24567361, PMID:8416961).
