  details: |
    Maintainer instruction on PR 6587: do not use a GO-CAM as support. The S. pombe GO-CAMs cited in this review are not independent evidence. In gomodel:693b3c0900002174 the function nodes carry no evidence, the retromer complexes' edges are curator inferences from complex membership (ECO:0000305), and the Snx3 edge is an IBA seeded by S. cerevisiae Snx3. Removed the GO-CAM sentences from three reasons: the retromer tubulation complex IBA, and the NEW membrane bending activity and endosome membrane tubulation rows. The tubulation comparators are human SNX1 and SNX5 (IDA, ComplexPortal, PMID:37322239). No actions changed.
