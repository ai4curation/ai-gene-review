  summary: 'IBA REMOVE re-review 2026-11-21: five Utp13-derived IBA REMOVEs upheld,
    family named correctly in the reasons'
  details: |
    Re-judged the five IBA REMOVE rows (GO:0000472, GO:0000480, GO:0005730, GO:0030686, GO:0034511) against the PANTHER tree. All descend from PTN000457905, which is a node of PTHR19854 (the Utp13/TBL3 family), not of PTHR19849 as the reasons said. The PANTHER tree places the Cdc4 sequence P07834 as a leaf of PTHR19854, sister to yeast Utp13 at the two-leaf node PTN008571587, while UniProt cross-references Cdc4 to PTHR19849:SF1 with its ortholog FBXW7 (node PTN008571532). The REMOVE actions stand (the leaf is misplaced in the tree and Cdc4 is an F-box substrate receptor, not an SSU processome subunit); only the family identification in the five reasons and propagation_review comments was corrected. Utp13 seed annotations checked in QuickGO by GO id (IDA PMID:12068309 nucleolus and U3 snoRNA binding, IMP PMID:15489292 for both cleavage terms, HDA PMID:12150911 90S preribosome). Validated with just validate yeast CDC4.
