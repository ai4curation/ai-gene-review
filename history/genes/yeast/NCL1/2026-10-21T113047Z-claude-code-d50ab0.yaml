  summary: 'Create review: NCL1 (Trm4), reference relative for S. pombe trm402'
  details: |
    De-novo review of all 24 GOA rows, independent of ProtNLM2 predictions. Deep research failed (falcon auth, perplexity quota) so the review rests on cached primary literature (PMIDs 10445884, 17567576, 22760636, 9767141, 16387656, 21187895, 23913415, 30646830). Established in S. cerevisiae: multisite tRNA m5C methyltransferase (C34/C40 intron-dependent, C48/C49), sole tRNA m5C enzyme, nuclear/nucleolar, H2O2-induced wobble m5C34 on tRNA-Leu(CAA). Removed three IBA rows (rRNA C5 MTase, rRNA processing, mitochondrial LSU assembly) donated only by Nsun4 (PTHR22808:SF3, not Ncl1's SF1), with yeast evidence that 25S rRNA m5C is Rcm1/Nop2-dependent and unchanged in trm4 deletion cells. General IEA/TAS terms MODIFY to tRNA-specific terms.
