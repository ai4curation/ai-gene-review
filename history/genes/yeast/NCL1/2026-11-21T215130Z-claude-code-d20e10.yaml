  summary: 'IBA re-review: NCL1 Nsun4-seeded REMOVE rows upheld, reasons made node-aware'
  details: |
    IBA REMOVE re-review of 2026-11-21 (projects/IBA_REVIEW/rereview-2026-11-21, batch N04), read against the PTHR22808 tree with treeview.py and QuickGO seed lookups by GO id. The Nsun4-seeded IBDs at PTN000516076 (GO:1902775, GO:0006364, and one of two seeds of GO:0009383) rest on MGI:1919431, which the tree attaches to leaf C4P6S0 (SHTAP, a testis product of the Nsun4 locus) inside the Trm4/NSUN2 clade PTN000516078. The experimental annotations (IMP PMID:24516400) are on the NSUN4 methyltransferase Q9CZ57, whose ortholog clade PTN008374330 (human NSUN4 Q96CB9) lies outside PTN000516076. The second GO:0009383 seed, Arabidopsis TRM4B, is in the other child PTN007710015. REMOVE stands for GO:0006364, GO:0009383 and GO:1902775. The earlier reasons said the PAINT tree had not been inspected and that Nsun4 was the only donor for GO:0009383; reasons, one summary and the PTN000516076 source comments (status now SOURCE_BAD) were rewritten to state the tree reading. Quotes unchanged. Validated with just validate.
