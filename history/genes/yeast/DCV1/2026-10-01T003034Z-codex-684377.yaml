  summary: Review yeast DCV1 IBA localizations
  details: |
    Reran just fetch-gene yeast DCV1 from origin/main, which preserved the existing GOA cache and
    backfilled deterministic supporting_entities onto the five computational rows in the review.

    Read the DCV1 review YAML, notes, UniProt record, GOA cache, PMID:33002606,
    PMID:22042866, the older Falcon report and artifact, the focused OpenScientist
    report for secondary membrane/division-site/tip localization, the PTHR28013 PAINT
    cache, and the DCV1 entry in the 2026-09-20 IBA rereview tracker. Searched for
    newer DCV1 papers and fetched PMID:36601911 after the focused report identified
    it as the first direct Dcv1 localization/function paper.

    Accepted the PTHR28013 and InterPro plasma-membrane rows because PMID:36601911
    directly localizes Dcv1 to the plasma membrane in vegetative cells. Removed only
    the growing-cell-tip IBA because the same target assay puts Dcv1 at the rear of
    pheromone-responding cells rather than at the mating front. Kept the cell-division-site
    IBA unresolved because bud-neck or cytokinesis-plane enrichment still has not been
    tested directly, and retained the SGD nuclear-envelope IDA from PMID:33002606 rather
    than second-guessing a curator from the abstract-only cache. Marked the BP ND row
    undecided now that PMID:36601911 establishes DCV1-specific pheromone-polarity biology
    but no exact BP term should be proposed until the full paper is curated.

    Updated the core-function summary, residual knowledge gaps, suggested questions,
    and suggested experiments around the new plasma-membrane and mating-polarity evidence.
    Appended notes documenting the asymmetric IBA decisions and marked the DCV1 focused
    OpenScientist report incorporated in the chaperone/tetraspanin IBA tracker.
