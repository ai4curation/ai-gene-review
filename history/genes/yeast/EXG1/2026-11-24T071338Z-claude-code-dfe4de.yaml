  details: |
    Re-review of the IBA row GO:0009251 glucan catabolic process (PTHR31297, IBD at PTN001262628) in the 2026-11-24 pass over IBA rows marked MARK_AS_OVER_ANNOTATED. Moved to KEEP_AS_NON_CORE. The two A. nidulans seeds (exgD, exgB; IDA) are on the EXG1 side of the root and exgB joins the EXG1 lineage at PTN000779048, so the node is soundly seeded and EXG1 is inside the seeded clade. The accepted core activity, glucan exo-1,3-beta-glucosidase, is itself glucan breakdown, and EXG1 overexpression lowers wall beta-1,6-glucan, so substrate preference for small substrates is not a ground for over-annotation. Kept as non-core beside fungal-type cell wall beta-glucan metabolic process. Batch record projects/IBA_REVIEW/overannotated-2026-11-24/batches/batch-N13.yaml.
