  summary: First review of PEP1/VPS10, the yeast CPY sorting receptor and reference
    retromer cargo
  details: |
    Reviewed all 19 GOA rows for P32319 and added two NEW location rows. Deep-research providers were not configured, so the literature was read directly from cached papers (10 newly cached PMIDs plus PMID:35175277 and PMID:9700157 already in the repository); searches are listed in PEP1-notes.md.

    Actions: ACCEPT 9 (vacuolar sorting signal receptor activity; protein targeting to vacuole, Golgi to endosome transport and Golgi to vacuole transport; three Golgi apparatus rows), TOO_GENERAL 5 (two membrane rows, two vacuolar transport rows, vesicle-mediated transport), MARK_AS_OVER_ANNOTATED 3 (mitophagy and pexophagy IMP, an indirect effect through Pep4 delivery; fungal-type vacuole HDA from an overexpression screen), REMOVE 2 (bare protein binding with Vti1, which the source paper could not confirm; cytosol IEA for an integral membrane protein), NEW 2 (trans-Golgi network membrane and late endosome membrane, IC).

    Core function: GO:0010209 vacuolar sorting signal receptor activity at GO:0032588, in protein targeting to vacuole, Golgi to vacuole transport and Golgi to endosome transport.

    SGD description reviewed: one statement ('targeted to vacuole via AP-3 pathway') recorded as a PROBABLE WRONG_STATEMENT source defect (CHECK), contradicted by PMID:9105038 and PMID:35175277. No production GO-CAM contains Vps10 or S. pombe vps10. No PAINT losses on the lineage.
