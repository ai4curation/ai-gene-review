  details: |
    De-novo review of S. cerevisiae RPO41 (P13433) as the experimental reference for SCHPO/rpo41, independent of ProtNLM2 predictions. Deep research failed (falcon auth; perplexity quota), so review is based on directly read cached literature (7 additional PMIDs cached). All 26 GOA rows reviewed: polymerase activity, mitochondrial transcription and mtRNAP complex rows accepted (this gene is an experimental donor to PTN000010146); GO:0001018 IBA accepted with S. cerevisiae support (PMID:15342628); general terms (DNA binding, 5'-3' RNA polymerase activity, DNA-templated transcription, mitochondrion, cytoplasm) modified to the specific terms the gene carries; in vitro primer synthesis kept as non-core given in vivo genetic doubts (PMID:7651397). No NEW annotations; N-terminal mtDNA-maintenance role recorded as a question (GO:0000002 obsolete; necessity evidence).
