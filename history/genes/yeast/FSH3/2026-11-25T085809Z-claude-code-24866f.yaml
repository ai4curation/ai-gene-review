  summary: Record OpenScientist pocket and conservation analysis of the FSH3 glycerophospholipid
    hypothesis
  details: |
    Ran an OpenScientist deep-research job (kgap-fsh3-phospholipid-pocket) on the knowledge gap covering whether peroxisomal FSH3 acts directly on a glycerophospholipid. The run did something the hypothesis implied but did not state: it calibrated its own metric against structures whose substrate is already known, and the metric failed. Across six such crystal structures, cavity volume at the nucleophile has no relationship to substrate size and neither does channel length; lysosomal phospholipase A2, the one panel member certain to hydrolyse diacyl phosphatidylcholine, has the smallest measured cavity of all, and a triacylglycerol lipase shows no cavity because its lid is closed in the deposited structure. The FSH3 cavity is the largest in the panel, which read naively would say a phosphocholine headgroup and a diacyl chain both fit, but the run declines that reading and notes its ceiling is formed by the only loops in the folded core below pLDDT 70.

    What carries information is conservation across 65 single-domain fungal orthologs. The invariant pocket positions are the catalytic ones, Gly12, Phe116, Ser117, Asp180 and His209, while the residues that would have to read a phosphocholine or phosphoserine headgroup, Lys59, Arg61 and Lys154, are among the least conserved in the whole protein, and the two conserved basic residues are both charge-reversed in human OVCA2. No cationic headgroup site is under selection in this family. All fourteen named positions, the GXSXG motif and the 266-residue length were confirmed in the local Q99369 record.

    The run also traces where the glycerophospholipid framing comes from and finds no FSH3-specific experimental basis for it. This entry's only molecular-function annotation is a hydrolase-activity IBA with MF and BP both ND, which the local GOA reproduces exactly; the phospholipase reading arrives by transfer from the paralog FSH1, whose phosphatidylcholine-naming GO term disagrees on headgroup with its own cited assay, which used lysophosphatidylserine; yeast phosphatidylcholine deacylation is already attributed to PLB1, PLB2, PLB3 and NTE1; and the human relative OVCA2 was characterised as a carboxylesterase preferring long straight-chain alkyl esters, with no headgroup component.

    Status moved from OPEN to NARROWING. The FSH1 term claim was not verifiable here because that gene is not in this repository, so nothing was filed against it, and absence of annotation is not absence of activity, so this is an argument against the direct-PC reading rather than its exclusion. No annotation action was taken. Worth noting for future reading of this entry: the run's conclusion that FSH3 has never been assayed enzymatically is consistent with its ND rows for both MF and BP, so those rows look sound rather than stale.
