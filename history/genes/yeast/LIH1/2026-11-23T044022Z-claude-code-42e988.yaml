  summary: Record a suspected LIH1 wrong-start gene model and narrow its localization
    gap via an OpenScientist run
  details: |
    Ran OpenScientist (3 iterations) on whether LIH1 is intracellular. The run found that the UniProt 328-aa model starts at an internal ATG; an in-frame upstream ATG (-45 nt, no stop until -123 nt) gives a 343-aa ORF with a predicted signal peptide. Re-verified by translating NC_001142.9. Supported by strain alleles lacking the internal ATG and by the S. kudriavzevii ortholog. Added a SUSPECTED WRONG_START_SITE gene_model_issues entry; localization gap OPEN -> NARROWING.
