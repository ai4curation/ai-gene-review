  details: |
    Automated PR Shepherd follow-up on PR #3683 (codex/review-yeast-cct8).

    The single blocking issue from the 2026-10-01 review was already resolved by commit 7b1c325 (2026-10-05): core_functions now uses molecular_function GO:0016887 with contributes_to_molecular_function GO:0140662, exactly the split form the reviewer proposed, matching TCP1 and CCT2-CCT7.

    This record covers five blocking validation errors the review did not see, plus one suggestion.

    Blocking fixes:
    - taxon.label: Saccharomyces cerevisiae -> Saccharomyces cerevisiae S288C. Term-validation ERROR against NCBITaxon:559292; main normalized labels in PR #4166 after this branch diverged.
    - Four supporting_text values were paraphrases rather than verbatim quotes, each a blocking error. Replaced with genuine verbatim source text:
      * existing_annotations[0] PANTHER row: the pseudo-quote "PANTHER PTHR11353 classifies CCT8 in the chaperonin family" does not appear in PTHR11353-metadata.yaml, and that file does not mention CCT8 at all, so it could not support a membership claim. Repointed to PTHR11353-entries.csv and quoted the P47079 member row verbatim, which names CCT8 directly. Added that file to references with a finding.
      * existing_annotations[0] falcon row: replaced with the verbatim CCT8/YJL008C theta-subunit sentence.
      * existing_annotations[3] falcon row: replaced with the verbatim equatorial/intermediate/apical domain sentence, which is what actually supports a nucleotide-binding fold.
      * core_functions[0] falcon row: replaced with the verbatim ~1 MDa ATP-dependent chaperonin sentence.

    Suggestion addressed:
    - PMID:40070846 was cached by this PR but cited nowhere. It is yeast TRiC cryo-EM, so same-organism evidence. Added to references with two findings and a reference_review (MEDIUM/VERIFIED), and wired into the live GO:0016887 ACCEPT row, which feeds core_functions[0].molecular_function and had no evidence anchor. The ADP-preloading quote is CCT8-specific.

    Not done, left for the author: three cytoplasm-policy warnings (GO:0005737 ACCEPTed on existing_annotations[5] and [16], and named in core_functions[0].locations[0]). Changing an annotation action is a curation call outside shepherd scope. Also note the falcon research file reports Cct8 as a low-ATP-affinity subunit that did not exchange nucleotide in one yeast structural study, which is worth reconciling with GO:0016887 sitting in core_functions.

    just validate yeast CCT8 passes (exit 0); quote check reports 22 verified, 0 not found, 0 unchecked. The branch remains CONFLICTING against main.
