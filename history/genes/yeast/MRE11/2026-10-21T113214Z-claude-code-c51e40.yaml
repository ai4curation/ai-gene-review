  summary: 'Create review: MRE11 (S. cerevisiae)'
  details: |
    De-novo full review of S. cerevisiae MRE11 (P32829), the PTHR10139:SF1 ortholog of SCHPO/mre11, written as a transfer reference and independent of any ProtNLM2 output. Falcon deep research failed (authentication error, perplexity-lite fallback out of quota), so the review rests on 40 cached publications and the UniProt record. All 92 GOA rows were reviewed. Endonuclease and DNA endonuclease rows are MODIFY to ssDNA endonuclease (GO:0000014) and dsDNA endonuclease (GO:1990238). 3'-5' exonuclease is MODIFY to the DNA-specific GO:0008296. DNA repair and meiotic cell cycle are MODIFY to their specific terms. The 23 GO:0005515 rows are REMOVE under the protein-binding policy. Downstream phenotypes (ascospore formation, regulation of Pol II transcription) and the TNR-maintenance row are MARK_AS_OVER_ANNOTATED; the TNR row is backwards, because MRX promotes expansions. R-loop processing is UNDECIDED. One NEW term, meiotic DNA double-strand break processing (GO:0000706), was added. UniProt source defects were recorded on three IMP rows that cite an S. pombe paper (PMID:23080121) and on the R-loop IDA (PMID:31537797). The notes distinguish yeast-specific roles (nuclease-independent meiotic DSB formation through the C-terminus) from conserved nuclease chemistry that is safe to transfer within SF1.
