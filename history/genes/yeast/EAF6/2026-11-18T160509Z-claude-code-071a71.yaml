  summary: 'Review: EAF6 GO annotations, core functions and references (CHROMATIN
    project)'
  details: |
    Reviewed all 16 GOA rows for Eaf6, covering both NuA4 and NuA3. Main decisions: electronic histone acetyltransferase complex row refined to NuA4 and NuA3 complexes; the IC contributes_to histone acetyltransferase activity row refined to histone H3K14, H4 and H2A acetyltransferase activity; DNA-templated transcription NAS rows modified to regulation of transcription by RNA polymerase II; DNA repair kept as non-core (complex-level, no Eaf6-specific evidence); NuA4, NuA3, NuA3a and NuA3b membership and nucleus accepted. No NEW piccolo row: GO and ComplexPortal define piccolo NuA4 without Eaf6, while reconstitution and structural studies include it; recorded as a BIOLOGY knowledge gap with a suggested experiment. Core functions: contribution to H4 acetylation in NuA4 and to H3K14 acetylation in NuA3. Validated with just validate, quote_check and backfill-record-sections.
