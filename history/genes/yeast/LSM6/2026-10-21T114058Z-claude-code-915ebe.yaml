  summary: 'Create review: LSM6'
  details: |
    De-novo review of S. cerevisiae LSM6 (Q06406), the experimental donor at the Lsm6 PAINT node PTN000111600, done independently of ProtNLM2 predictions. Falcon deep research failed (authentication) and the perplexity-lite fallback failed (quota), so the review uses cached publications and the curated UniProt entry. All 70 GOA rows reviewed: U6 snRNP, tri-snRNP, U4/U6 snRNP, splicing, Lsm1-7-Pat1 complex, P-body, nucleus, cytoplasm and decapping accepted; nucleolus, snoRNA RNP, rRNA/tRNA processing and SSU-rRNA maturation kept as non-core; RNA binding modified to U6 snRNA/snoRNA/mRNA binding; ARBA Sm-like complex modified to Lsm2-8 and Lsm1-7-Pat1 complexes; 30 generic protein-binding rows removed per policy. Relationship to S. pombe lsm6 grounded in PANTHER PTHR11021:SF1 membership; noted that PAINT did not propagate decapping or Lsm1-7-Pat1 from this donor. No NEW annotations.
