- type: CREATE
  outcome: changed
  summary: 'Create review: MSC2 (Msc2-Zrg17 ER zinc importer)'
  details: |
    New full review of S. cerevisiae MSC2 (Q03455), done as the experimentally characterised PTHR45755:SF4 relative of S. pombe cis4 and independent of ProtNLM2 predictions. Falcon deep research failed (Edison 403) and the perplexity-lite fallback timed out; recorded in notes. Reviewed all 28 GOA rows. Accepted zinc ion transmembrane transporter activity, intracellular zinc ion homeostasis and ER membrane. Refined the zinc/transmembrane/cation transport rows (including the 2004 SGD IMP) to GO:0140209 zinc ion import into endoplasmic reticulum. Corrected the IBA Golgi zinc import laterally to the ER term, and marked the IBA Golgi, cis-Golgi cisterna and cytoplasmic vesicle locations as over-annotated, because budding-yeast Msc2 acts in the ER whereas the Cis4 and ZnT5/ZnT7 donors act in the Golgi. Removed four bare protein-binding IPI rows (Zrg17) per policy. Added a MAFFT site-A analysis (MSC2-bioinformatics/) showing that Msc2 keeps the His-Asp-His-Asp zinc site and partner Zrg17 has lost it. UPR and ERAD defects were treated as downstream and not annotated.
