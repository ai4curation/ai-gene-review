  summary: 'Create review: APS1 (AP-1 sigma1 subunit)'
  details: |
    De-novo review of all 32 GOA rows, independent of ProtNLM2 predictions, as the experimentally characterised SF5 relative of S. pombe vas2. Falcon deep research failed (perplexity-lite fallback timed out); the review is built from cached primary literature (Yeung 1999, Phan 1994, Valdivia 2002, Whitfield 2016 full text, Phelan 2006, Ma 2009 pombe). AP-1 complex membership, CCV membrane, Golgi/endosome accepted; clathrin-cargo adaptor activity accepted and set as contributes_to in core_functions, because it is established for the complex but not for Aps1 alone. Ten bare protein-binding IPI rows removed per policy. Nucleus marked over-annotated, since it comes from the pombe ORFeome screen only. Cytoplasm, membrane coat and protein transport marked TOO_GENERAL. ARBA intercellular transport removed. IMP Golgi to vacuole transport kept as non-core (indirect via Fab1). No NEW terms.
