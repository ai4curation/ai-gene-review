  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (ADH3-phylo.yaml, from `just phylo yeast ADH3`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0005737 (MARK_AS_OVER_ANNOTATED): the reason made a claim the tree contradicts (The IBA cytoplasm is inherited from the cytosolic ADH clade and conveys an ancestral cytosolic location that ADH3 does not share (source note: cytoplasmic location holds for ADH1/ADH2/ADH5 but not ADH3): ADH3 is itself one of the 3 seeds, so its own experimental annotation is part of the evidence for the node; the other two seeds are the paralogs ADH1 and ADH2.). The reason was rewritten to correct it; the rest of its argument is kept. The script also changed the row's failure modes as the reading proposed (added GRANULARITY_MISMATCH).

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
