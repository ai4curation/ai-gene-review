  summary: 'Create review: yeast DTD1'
  details: |
    De-novo review of S. cerevisiae DTD1 (Q07648) as the experimentally characterised ortholog reference for human DTD1 (PTHR10472:SF5; PAINT donor at PTN000049487). Deep research failed (falcon auth error, perplexity quota), so the review used cached primary papers (PMID:10766779, 10918062, 14562095), the family papers PMID:24302572 and 28362257, and UniProt. All 14 GOA rows reviewed. ACCEPT: D-Tyr-tRNA(Tyr) deacylase (IMP/IBA/IEA), D-aminoacyl-tRNA deacylase, D-Leu-tRNA(Leu) deacylase (accepted but flagged as a genetic inference), translational-fidelity aminoacyl-tRNA metabolism, cytoplasm (x3). MODIFY: aminoacyl-tRNA deacylase -> GO:0051499; tRNA metabolic process (IMP, IBA) -> GO:0106074. KEEP_AS_NON_CORE: Gly-tRNA(Ala) deacylase (ISS/IEA), which is not tested in yeast and not propagated by PAINT. Notes record which functions are yeast-experimental and which are inferred.
