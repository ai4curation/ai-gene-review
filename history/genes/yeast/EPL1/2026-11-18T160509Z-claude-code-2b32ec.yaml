  details: |
    Reviewed all 29 GOA rows for Epl1 against cached abstracts and full texts (PMID:21984211, PMID:36263929, PMID:36417436), UniProt and the SGD and claude-code deep-research files. Main decisions: contributes_to histone acetyltransferase activity refined to histone H4 and H2A acetyltransferase activity; nucleosome (part_of) modified to nucleosome binding; chromatin organization IBA refined to chromatin remodeling; DNA-templated transcription NAS modified to regulation of transcription by RNA polymerase II; protein binding rows with partner Yng2 removed except the GST pull-down row from PMID:21984211, modified to protein-macromolecule adaptor activity; macroautophagy IMP kept as non-core (abstract names only Esa1, SGD text supports Epl1). Added a NEW acetyltransferase activator activity row (IDA PMID:21984211; comparator Vps75). Four core functions: contribution to H4 acetylation in piccolo NuA4, acetyltransferase activator activity, nucleosome binding and adaptor activity. One BIOLOGY knowledge gap on the Epl1 N-terminal basic region. Fetched PMID:23109429, PMID:28108589, PMID:36066422, PMID:36263929, PMID:36417436 and others. Validated with just validate, quote_check and backfill-record-sections.
