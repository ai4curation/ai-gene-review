  summary: 'Review: TAF14 YEATS subunit of TFIID, TFIIF, SWI/SNF, RSC, INO80 and NuA3,
    68 GOA rows plus 3 NEW'
  details: |
    Reviewed all 68 GOA rows for Taf14 (P35189), keeping NuA3 in proportion among its six host complexes. Actions: 44 ACCEPT, 13 REMOVE, 8 MODIFY, 2 KEEP_AS_NON_CORE, 1 TOO_GENERAL, 3 NEW. Complex rows for TFIID, TFIIF, SWI/SNF, INO80, NuA3, NuA3a and NuA3b accepted; mediator complex (IDA PMID:8187178) removed because TFIIF co-purified with the first mediator preparation and Pol II-TFIIF and Pol II-Mediator are separate complexes (PMID:14749386), with a source defect for SGD. Twelve protein binding rows removed (partners are fellow subunits). Histone binding IBA modified to H3K9ac and H3K9cr reader activities, added as NEW rows (PMID:26341557, PMID:27089029); NEW RSC-type complex row (PMID:32826896). General transcription and regulation rows modified to transcription initiation at RNA polymerase II promoter or regulation of transcription by RNA polymerase II. DNA binding (linker, PMID:35970389) accepted; UniProt's 'Does not bind DNA' sentence recorded as a source defect (it rests on the isolated YEATS domain, PMID:30385749). Fetched eight full-text papers. One BIOLOGY gap on how Taf14 activities are used by each host complex. Validated with just validate, quote_check and backfill-record-sections.
