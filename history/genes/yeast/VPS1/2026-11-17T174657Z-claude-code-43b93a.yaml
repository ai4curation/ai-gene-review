  summary: New review of yeast Vps1 dynamin-related GTPase (51 GOA rows + 1 NEW)
  details: |
    First review of VPS1 (P21576). Hosted deep research providers were not configured and the Alliance API timed out, so the literature synthesis is manual (VPS1-notes.md); six extra papers were cached (PMID:30087125, 25512334, 31009484, 11733545, 26711254, 22082017).
    Core functions: membrane scission GTPase motor activity (GO:1990606) in endosome-to-Golgi retrograde carrier fission and endocytic vesicle scission; GTPase-dependent peroxisome fission and Atg9 delivery to the PAS.
    GTPase activity rows whose evidence is the 2026 reconstitution (PMID:42477131) are MODIFYed to GO:1990606; other GTPase rows are ACCEPTed (MODIFY only where the row's own evidence supports the narrower term).
    Over-annotations: microtubule and microtubule binding IBA (root-node PTN000170013 placement), mitochondrion and outer membrane HDA, phagophore assembly site IMP (the paper maps Vps1 to Atg9 reservoirs), and BIR HMP (screen hit, no participation).
    General terms refined: vacuolar transport -> protein targeting to vacuole, autophagy -> autophagosome assembly, peroxisome organization (IDA/IMP) -> peroxisome fission.
    NEW: phosphatidylinositol phosphate binding (GO:1901981), IDA from PMID:42477131, with PMID:31009484 corroborating.
