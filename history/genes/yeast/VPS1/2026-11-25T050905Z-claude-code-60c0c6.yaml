  summary: Drop the S. pombe GO-CAM pointer from the endocytic scission decomposition
  details: |
    Follow-up to the maintainer instruction on PR 6587 not to use a GO-CAM as support. The S. pombe GO-CAMs repeat claims inferred from S. cerevisiae (ISO or IBA seeded by the same genes), so they are not independent of these reviews. The GO:0099051 MODIFY no longer points at the S. pombe endocytosis GO-CAM (gomodel:6918f23700004722), whose vps1 part_of edge is an ISO from S. cerevisiae Vps1. The endocytosis context is recorded only in core_functions (decomposed_into.in_core_functions), where it rests on the endocytosis-specific mutant papers. No actions changed.
