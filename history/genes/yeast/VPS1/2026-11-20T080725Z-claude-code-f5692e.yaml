  summary: 'Make proposed term consistent with its parent: ''Atg9 vesicle'' (is_a
    cytoplasmic vesicle)'
  details: |
    Addresses the requested change on PR 6545. The proposed term was defined as a compartment of 'Atg9-containing vesicles and tubules' while its parent was cytoplasmic vesicle, which cannot hold. The tubular description had no cached source either. The term is now 'Atg9 vesicle', defined in the vesicle sense the source supports ('the Atg9 reservoirs or Atg9 vesicles', PMID:37060997), with the reservoir named as the yeast pool; parent unchanged (GO:0031410). Transport vesicle (GO:0030133) was considered and not used, because its GO definition is tied to the constitutive secretory pathway. The justification now says the location can be annotated only uninformatively, rather than not at all. Core function 4 points to the renamed term.
