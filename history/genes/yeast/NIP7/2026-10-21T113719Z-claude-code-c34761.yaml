  summary: 'Create review: NIP7 (Q08962)'
  details: |
    De-novo full review of budding-yeast Nip7, the PAINT donor (SGD:S000006132) at PTN000602113 and closest characterised relative (same PANTHER subfamily PTHR23415:SF4) of SCHPO/nip7. Independent of ProtNLM2 predictions. Falcon deep research failed (authentication) and the perplexity fallback failed (quota), so the review uses cached literature: PMID:9271378, 9891085, 18001138, 22735702 and others. All 26 GOA rows reviewed: LSU precursor, nucleolus, GO:1902626 and GO:0000463 accepted; ND MF modified to RNA binding (PUA domain, PMID:18001138); nucleus modified to nucleolus; ribosome assembly and LSU biogenesis (IBA, IMP) refined to GO:1902626/GO:0000463 for this gene, noting that PAINT deliberately kept the eukaryote node at LSU-biogenesis level; cytoplasm kept as non-core; six protein binding rows removed per policy. Core function: nucleolar non-catalytic RNA-binding assembly factor of the LSU precursor, in a Nop2 subcomplex that recruits later B-factors (PMID:22735702).
