  summary: Resolve GOA refresh and complete ZDS1 review (PTHR28089 family pass)
  details: |
    Brought the ZDS1 (P50111) review from DRAFT to COMPLETE after a GOA refresh. Removed 7 review rows no longer in GOA: GO:0051028 and GO:0071555 (IEA), and five GO:0005515 IPI rows. Resolved 7 new PENDING rows: the IBA GO:0004864 is MODIFY to GO:0019888; the Gfd1 protein binding row is REMOVE; the DBP5 mRNA-export IGI and IPI rows are KEEP_AS_NON_CORE; the ZDS2 G2/M IGI row is ACCEPT; and the CDC42 and ZDS2 polarity IGI rows are KEEP_AS_NON_CORE. The molecular function was re-assessed: the IMP and IGI GO:0004864 rows (PMID:18762578) are now MODIFY to GO:0019888 protein phosphatase regulator activity, because Zds1/2 also activate PP2A-Cdc55 towards Mih1 (PMID:21119008) and PMID:22427694 judges direct inhibition unlikely. The core function MF changed from GO:0004864 to GO:0019888. Added NEW GO:0031536 positive regulation of exit from mitosis (IMP, PMID:18762578), comparator-checked against ESP1, LTE1 and GLC7. Corrected IGI with-gene descriptions (S000003158 is CDC55, S000004868 is GFD1), rewrote the description, and added references PMID:21119008 and PMID:22427694. Final counts: 8 ACCEPT, 14 KEEP_AS_NON_CORE, 3 MODIFY, 2 REMOVE and 1 NEW. Validated with just validate yeast ZDS1; only uv environment warnings remain.
