  details: |
    De-novo full review of S. cerevisiae MCM4/CDC54 as the experimentally characterised PTHR11630:SF66 reference for ortholog transfer (HORSE40 ProtNLM2 cohort; ProtNLM2 predictions not consulted). Deep research failed (falcon auth error, perplexity-lite quota) and was recorded in notes; review based on the 31 cached GOA-cited publications, UniProt and PAINT nodes PTN000179711/PTN000179712/PTN000179968. All 91 GOA rows reviewed: 27 GO:0005515 rows removed per policy; general helicase/DNA replication/DNA binding rows modified to 3'-5' DNA helicase (contributes_to), strand elongation, mitotic replication initiation, ss/dsDNA binding; origin binding, Mcm467 core complex, four-way junction helicase, cytoplasm, BIR, zinc and ATP terms kept as non-core; premeiotic DNA replication left UNDECIDED (cited PMID:20484375 has no meiotic data). Two core functions written (CMG motor subunit; origin licensing/firing).
