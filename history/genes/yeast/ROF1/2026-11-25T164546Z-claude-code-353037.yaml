  summary: Record OpenScientist finding that the WOPR footprint is too short to nominate
    Rof1 targets
  details: |
    Ran an OpenScientist deep-research job (kgap-rof1-wopr-targets) on the knowledge gap covering Rof1's direct in vivo target genes. The gap stays OPEN, but the motif route is now closed rather than merely untried, which is the useful outcome.

    The structural half of the hypothesis holds. Recomputing protein-DNA contacts from the deposited Wor1 WOPR co-crystals, five residues make every base contact, and all five map onto Rof1 as exact identities at Arg63, Ser73, Arg74, Leu80 and Tyr82, confirmed in the local P38867 record. Twelve of fourteen contact positions are identical across Wor1, Mit1 and Rof1, the two exceptions being backbone contacts. So Rof1 and Mit1 are predicted to read the same element, which recasts their opposite reported phenotypes as a question of partners, timing and chromatin rather than of intrinsic DNA specificity.

    The predictive half fails for a structural reason that generalises. Of the base contacts, exactly one is a strictly base-discriminating hydrogen bond, specifying a single G:C pair, while the arginine contacts are minor-groove acceptors reading an A/T tract without specifying base order. The chemically justified consensus is one G:C followed by a four-base A/T run. The literal crystal version occurs about 30,700 times in the nuclear genome against a third-order Markov expectation of about 29,500, a ratio of 1.04, which is chance frequency, and the degenerate form appears in every promoter. FLO11 sits at the 44th percentile and FLO10 and TEC1 at the 22nd, the three showing no enrichment on either a rank test or a permutation, and ROF1's own promoter outranks all three.

    What makes this a finding rather than a failed attempt is that the run included a positive control through the identical pipeline. It recovers clear enrichment for the 13-base Rap1 site and the 16-base Mcm1 P-box while returning chance-level ratios for the 7-base Gcn4 and Ste12 sites. Short consensus strings give chance-level ratios even for textbook activators with hundreds of validated targets, and the WOPR footprint sits at the extreme short end of that range, so no refinement of the string can rescue the approach. The ChIP-seq or CUT&RUN already named in this gap's resolution is therefore necessary rather than merely convenient.

    Verified locally: the five contact residues, the 453-residue length and the Gti1_Pac2 Pfam assignment. MIT1 is not in this repository, so the Mit1 equivalences were not checked. The contact recomputation, genome-wide counts and Markov expectations, promoter ranks and positive-control enrichments were not independently recomputed. No annotation action was taken.
