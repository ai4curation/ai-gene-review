  details: |
    Ran OpenScientist (3 iterations, local bioinformatics withheld) on the gap asking whether YIL164C is a functional gene or a fragment, and whether YIL164C+YIL165C form one protein. Result: one in-frame TAG at codon 200 (Trp200 in intact alleles) splits a single 322-codon reading frame; there is no frameshift. Re-verified here by translating NC_001141.2 c34686-33718, where the only internal stop is codon 200. The intact ORF is present in 6/29 SGD strain sequences and in other Saccharomyces species. Added a CONFIRMED SPLIT_GENE_MODEL gene_model_issues entry; gap OPEN -> NARROWING, with translation and read-through still unmeasured. Annotation actions unchanged. The run's branch-10 placement contradicts the branch-1 placement quoted from Pace & Brenner and was not adopted.
