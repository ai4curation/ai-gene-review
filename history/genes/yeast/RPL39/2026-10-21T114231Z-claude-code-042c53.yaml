  summary: 'Create review: RPL39 (eL39, P04650)'
  details: |
    De-novo review of yeast RPL39 as the experimentally characterised PTHR19970:SF0 relative of Neurospora NCU08990, independent of ProtNLM2 predictions. Deep research failed (falcon auth error; perplexity-lite quota), so literature was retrieved from PubMed and cached (PMID:10852723, 35639884, 24072706, 11434779, 2408148, 18829863). 23 GOA rows reviewed: structural constituent of ribosome, cytosolic large ribosomal subunit and cytoplasmic translation accepted (IBA root node PTN000463054, which includes this gene as an SGD seed); cytoplasm, ribosome and translation rows modified to cytosol, cytosolic LSU and cytoplasmic translation; Reactome cytosol rows accepted; bare protein binding (Yih1/IMPACT) removed per policy. Added NEW GO:0000027 ribosomal large subunit assembly (IMP, PMID:35639884) after participation and comparator checks against SGD r-protein annotations. Noted that the PAINT spermatogenesis IBD sits on a eutherian RPL39L node, so it does not apply to fungal SF0 members.
