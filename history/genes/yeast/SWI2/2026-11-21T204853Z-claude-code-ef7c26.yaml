  details: |
    Re-review of IBA rows marked REMOVE against the PAINT tree (projects/IBA_REVIEW/rereview-2026-11-21, batch 03). GO:0031507 heterochromatin formation (IBA, IBD at PTN004198564) changed from REMOVE to MARK_AS_OVER_ANNOTATED. The earlier reason said the term was seeded elsewhere in the family, but one seed, S. pombe snf21 (heterochromatin boundary formation, IMP), lies in the fungal Snf2/Sth1 clade PTN000084867 that also holds Snf2. Evidence on the target is mixed: SWI/SNF evicts Sir3p in vitro (PMID:19766565), and snf2 deletion mutants lose rDNA and telomeric silencing (PMID:15340082, abstract read through PubMed; the paper is not in the publications cache and is cited in prose only). A loss in the Snf2 branch is not shown, so REMOVE does not hold. Reason, summary and propagation_review were rewritten for that row only; the supporting_text quote is unchanged. The GO:0140750 nucleosome array spacer IBA row was re-read and its REMOVE left as written. just validate yeast SWI2 passes.
