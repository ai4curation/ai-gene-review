  details: |
    Re-judged two IBA REMOVE rows against the PTHR19443 tree. GO:0032473 cytoplasmic side of mitochondrial outer membrane: IBD at PTN000455350 (505 leaves) with two seeds, human HK2 (IDA PMID:18350175) in vertebrate clade PTN000455353 and Brassica M4FD55 (IDA PMID:21896887) in PTN007675299; Glk1 is in the unseeded fungal clade PTN000455506. The earlier REMOVE rested on the missing N-terminal motif plus absence of Glk1 data; that makes the node placement doubtful but does not show exclusion (yeast HXK1 and HXK2 carry IDA and HDA mitochondrion annotations, checked in QuickGO). Action changed to MARK_AS_OVER_ANNOTATED, matching the HXK1 and HXK2 reviews, and a reason added. GO:0008865 fructokinase activity: REMOVE left unchanged, it rests on Glk1-specific aldohexose specificity (PMID:6300872). Validated with just validate yeast GLK1.
