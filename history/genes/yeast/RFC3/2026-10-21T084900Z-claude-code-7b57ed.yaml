  summary: 'Create review: RFC3'
  details: |
    De-novo review of S. cerevisiae RFC3 (P38629), reference relative for the ProtNLM2 benchmark ortholog SCHPO/rfc3 (same PANTHER subfamily PTHR11669:SF9), done independently of ProtNLM2 output. Deep research failed (falcon auth, perplexity quota), so the review used cached literature and UniProt. All 54 GOA rows reviewed: complex membership (RFC, Rad24-, Ctf18-, Elg1-RFC), contributes_to clamp loader, ATP binding/hydrolysis, replication and nucleus accepted; 15 generic protein-binding IPI rows removed as captured by complex terms; leading strand elongation, cohesion, DNA repair, mismatch repair, cytosol and DNA binding kept as non-core. No NEW rows; whether small subunits should carry DNA clamp unloader activity is raised as a suggested question, since PAINT placed it only on large-subunit nodes. Added PMIDs 14530260, 15964801, 15201901.
