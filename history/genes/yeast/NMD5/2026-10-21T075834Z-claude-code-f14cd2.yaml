  details: |
    De-novo review of yeast Nmd5/Kap119 as the experimental reference for PTHR10997:SF18 (incl. Drosophila Msk), independent of ProtNLM2 predictions. Falcon deep research failed (auth 403; perplexity-lite fallback also failed); review built from directly read literature (PMID:9852143, 9755161, 11535618, 23335962, 11279056, 15001563, 12684370). All 16 GOA rows reviewed: import receptor MF, protein import BP, nucleus/cytoplasm/cytosol and small GTPase (RanGTP) binding accepted; two generic transport IEAs modified to GO:0006606; nuclear envelope IBA and nuclear periphery HDA kept as non-core. Notes distinguish yeast-established functions from yeast-specific cargoes not to be transferred.
