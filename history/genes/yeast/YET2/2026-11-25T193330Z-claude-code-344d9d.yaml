  summary: Record OpenScientist refutation of the interface-loss explanation for Yet2p's
    exclusion
  details: |
    Ran an OpenScientist deep-research job (kgap-yet2-interface-exclusion) on the knowledge gap covering Yet2p's cargo and partners. The run refuted the test I proposed at the source, then showed the expected prediction fails in both directions it could fail, so the gap stays OPEN.

    The premise has no source. The only solved BAP-family interfaces are homodimers, and the paper that determined them reports that no interaction between the BAP29 and BAP31 cytoplasmic domains could be detected, so there is no characterised BAP29-BAP31 heterodimer interface to map from. My hypothesis asked for exactly that mapping and named it as established.

    The run computed the real homodimer interface anyway and mapped it onto all three yeast paralogs. On substitution, Yet2p has no charge-reversing or charge-introducing substitution at any crystallographic interface position, while Yet3p, the protein that does form the stable complex, has two charge reversals; where Yet2p aligns it matches the human protein better at the interface than across the rest of the sequence, with a permutation test giving no evidence of interface-specific degradation. On coverage, Yet2p reaches only a quarter of the interface positions against two thirds of non-interface positions, which looks decisive until the internal control is read: Yet1p, which does form the complex, has the same shortfall, and Yet3p has none. The control I asked for is what defeats the coverage argument.

    What survives is architecture rather than interface. Yet2p's cytosolic tail is 36 residues, which the local record independently gives, since the protein is 160 residues with its third transmembrane segment ending at 124, against roughly twice that in the complex-forming paralogs and more than three times in the human proteins. At 160 residues it sits at the 2.2nd percentile of several hundred fungal family members and the truncation is conserved across Saccharomyces sensu stricto, so it is selected rather than decay. A shorter coiled coil has lower intrinsic affinity, but the run states plainly that this is an avidity argument which does not distinguish a genuinely altered interface from an ordinary sequence difference, which is what I asked it to say if true.

    A competing explanation fits at least as well and is recorded alongside: Yet2p's third transmembrane segment is far more similar to Yet1p's than the two complex-forming paralogs are to each other, so Yet2p may simply be a second copy of the Yet1p side of the family, for which no free complementary partner exists.

    Verified locally: the 160-residue length, three transmembrane segments with the third ending at 124 and hence the 36-residue tail, and the PF05529 family assignment. YET1 and YET3 are not in this repository, so every paralog comparison including the Yet3p charge reversals and the Yet1p coverage control was not checked locally; nor were the interface computation, permutation test, fungal percentile or transmembrane identity figures. No annotation action was taken.
