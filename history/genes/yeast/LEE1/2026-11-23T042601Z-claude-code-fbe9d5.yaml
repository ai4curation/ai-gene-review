  summary: Narrow the LEE1 CCCH nucleic-acid-binding knowledge gap with an OpenScientist
    run
  details: |
    Ran OpenScientist (3 iterations) on whether the LEE1 CCCH fingers are TIS11/TTP- or makorin-type RNA-binding fingers. The spacing (C-x7-C-x5-C-x3-H, 12-residue linker; checked locally) is makorin/ZC3H15-like, not TTP. The ARE base-reading segment is absent, so TTP-type ARE binding is excluded. The zinc ligands are invariant across 113 fungal orthologs, and a conserved RNA-facing Lys/aromatic surface makes non-specific RNA stacking plausible. Gap OPEN -> NARROWING.
