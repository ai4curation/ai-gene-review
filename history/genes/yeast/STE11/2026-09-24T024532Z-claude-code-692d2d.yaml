  summary: 'Create review: STE11'
  details: |
    Created the STE11 (P23561) review. All 44 GOA annotations were reviewed: 20 ACCEPT, 6 KEEP_AS_NON_CORE, 1 MARK_AS_OVER_ANNOTATED, 16 MODIFY, 1 UNDECIDED. Core functions are MAP kinase kinase kinase activity (GO:0004709) in three pathways: the pheromone response MAPK cascade (Ste7 -> Fus3/Kss1), filamentous-growth signaling (Ste7 -> Kss1), and the Sho1 branch of HOG (Pbs2 -> Hog1, GO:0007232/GO:0038066). Pseudohyphal growth, invasive growth and hyperosmotic response were kept as non-core outcomes. The GO:0000196 cell integrity MAPK cascade IGI was marked over-annotated because the cited pathway is the Kss1 module, not the Slt2 cascade. Bare protein-binding rows were modified by partner: Ste50 to SAM domain binding, Ste5 and Sho1 to scaffold protein binding, Fus3 and Kss1 to MAPK binding, and Mkk1 to MAPKK binding. One IntAct self-interaction citing a mammalian Rac1/POR1 paper (PMID:8670882) was left UNDECIDED. Added PMID:10837245 and PMID:10397774.
