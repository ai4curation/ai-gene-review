  summary: Confirm the HP_1507 wrong-start-site gene model issue from the 26695 genomic
    sequence
  details: |
    Ran an OpenScientist deep-research job (kgap-hp1507-start-site) on the knowledge gap asking whether the native 26695 translation product includes the N-terminal NADP-contacting segment absent from the O26037 reference sequence. It settles the start-site half on the genomic sequence, which is exactly what both the gap and this review's gene model issue had asked for, and leaves the substrate half untouched.

    The 26695 genome carries an in-frame TTG 42 nucleotides upstream of the annotated GTG, with all 13 intervening codons open and the first in-frame stop a further 31 codons back inside the intergenic region. Translating from it gives exactly 399 residues: the 14-residue extension MHTVLQIGAGGVGS followed by the 385 residues of O26037, which the local record confirms begins MVAHKMGMNRD. That translation is byte-identical to the RefSeq protein and 99 per cent identical to the NCTC11637 protein of 8H52, with none of the four differences inside the extension.

    Four further lines agree and are largely independent. The extension restores the Rossmann GxGxxG fingerprint at positions 8-13 that O26037 lacks; no one of 382 sampled H. pylori ortholog annotations reproduces the 385-residue N-terminus while 375 use the 399-residue start, and all 11 non-pylori Helicobacter orthologs examined begin with the same motif across 71 to 97 per cent identity; InterPro clips the PF03435 match by 12 residues and the SSF51735 match by 27 on O26037 while the C-terminal PF16653 match agrees exactly, which is the signature of a truncated N-terminus rather than real divergence; and RefSeq already annotates the 1200-nucleotide CDS with the TTG initiator across all 78 assemblies of its identical-protein group. The extension abuts an 85-base-pair divergent intergenic region and creates no overlap, and TTG initiates 9.5 per cent of 26695 genes against 6.1 per cent for GTG.

    On the structural question the run reaches the same conclusion as this review but corrects the framing. Of the 15 heavy atoms within 4 Angstrom of NADP contributed by the missing segment, 12 are backbone and only 3 are side chain, which is weak evidence of essentiality on its own, as the hypothesis anticipated. What carries the argument is position: the missing Thr3-Ile7 is an interior strand of a seven-stranded sheet, helix A runs Gly10 to Asn23 so the O26037 start falls mid-helix, and residues 2-14 make 285 heavy-atom contacts with 33 core residues.

    The gene_model_issues entry was therefore upgraded from SUSPECTED to CONFIRMED, its description rewritten to record the genomic verification and to assert the correction as the 399-residue product from the TTG at AE000511.1:1580280, CDS 1580280..1581479, and its evidence_types extended from ORTHOLOG_COMPARISON alone to GENOMIC_SEQUENCE, ORTHOLOG_COMPARISON, DOMAIN_ARCHITECTURE and ADJACENT_GENES. The earlier entry had withheld the claim precisely because the 26695 genomic start and translated N-terminus were unverified, and the strain-divergence and shortened-product alternatives it kept open are no longer tenable: the 385-residue form is unique to the original 1997 GenBank submission and the UniProt entry derived from it.

    The limits are stated and are why the gap stays OPEN rather than moving further. No proteomic or ribosome-profiling evidence reports this protein's N-terminus in any strain, six PubMed queries returning nothing to quote; the 8H52 construct carries an engineered GSHMAS tag so its first residue is a construct boundary, not a native initiator; the ortholog agreement is annotation rather than observation; and the Shine-Dalgarno comparison explicitly does not discriminate between the two starts. The substrate choice between putrescine, diaminopropane and agmatine is untouched, so this review's withholding of confident catalytic transfer stands and no annotation action was changed. Verified locally: the 385-residue sequence and its N-terminus, that prefixing the extension gives 399 residues with the fingerprint at 8-13, and the PF03435, PF16653, SSF51735, EMBL AE000511 and PE 4 lines the argument uses. Not recomputed: the genomic coordinates and codon walk, the RefSeq records, the ortholog survey, the genome-wide codon and ribosome-binding statistics, and the 8H52 contacts.
