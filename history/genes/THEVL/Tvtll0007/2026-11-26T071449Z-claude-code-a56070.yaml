  summary: Record OpenScientist finding that the periplasmic half of the XcsA export
    conduit has no owner, with XcsB refuted as the BcsB equivalent
  details: |
    Ran an OpenScientist deep-research job (kgap-xcsa-export-architecture) on the gap asking how XcsA engages XcsB and TolC and whether this is the complete export apparatus. It answers the second half with a no, and splits the tripartite model into claims that do not stand or fall together.

    The inner-membrane step is supported. XcsA superposes on the crystallised Cereibacter sphaeroides BcsA at 1.68 Angstrom core RMSD over 404 CA pairs from 674 aligned positions at 31.2 per cent identity, all of BcsA's catalytic and acceptor-site residues map onto it, the finger helix aligns without a gap, and the QxxRW motif is intact, confirmed locally at position 392 of 736 residues. The product-conducting channel is reproduced at a bore indistinguishable from BcsA's, median 4.05 against 4.29 Angstrom, with 74 against 72 per cent of the path at or above 3.0 Angstrom. One apparent defect dissolves on a family survey: BcsA Thr341 becomes Val354 here, confirmed locally, but across 45 homologs that position is Val in 16, Thr in 13, Ser in 11, Ala in 3 and Cys in 2, while the acidic Glu-Asp pair that does the work is conserved in 45 of 45.

    The periplasmic step is where the model breaks, and this is the finding that matters. XcsB is a UPF0194 membrane fusion protein of the HlyD type with one transmembrane anchor and two coiled coils, carrying neither of the two domains that build BcsB's periplasmic body. The absence is genome-wide rather than a property of one protein: the BcsB carbohydrate-binding domain returns zero proteins here, zero in T. vestitus BP-1 and zero in Synechocystis PCC 6803, while returning hits in Calothrix parasitica, Dulcicalothrix desertica and Cereibacter BcsB itself, so the negative is calibrated against positive controls. The deficit is load-bearing, since in the characterised complex 44 per cent of the glucan path lies within 10 Angstrom of BcsB, and over the periplasmic first 36 Angstrom the bore collapses from 16 to 87 Angstrom with BcsA alone, open to bulk solvent, to 5 to 24 Angstrom once BcsB is present. The periplasmic half of the conduit therefore has no owner here. The boundary records what this does not say: XcsB remains genetically required, so it is refuted only as the BcsB equivalent and not as a participant, an efflux adaptor being a different job from walling a sugar channel.

    The outer-membrane step cannot be decided. The TolC homolog is a genuine TolC by fold, 1.47 Angstrom over 210 CA against the E. coli structure, a modelled trimer 146 against 143 Angstrom, narrowest pore radius 3.97 against 4.32 Angstrom, lumen charge -5.02 against -7.95 per 100 lining atoms. A single extended glucan needs roughly 3 Angstrom half-width and carries no net charge, so it would fit and feel nothing specific; the run calls the measurements permissive, which is weaker than supportive, since the same channel suits its default small-molecule or protein efflux annotation equally well.

    The operon reading is refuted outright, and the primary paper says so itself: the four genes sit 0.91, 0.75 and 0.32 Mb apart on opposite strands of the 2.59 Mb chromosome, the partners having been linked by synteny and knockout rather than proximity, and the only adjacency is tll0007 with tll0008, 27 base pairs apart. The run names a second cellulose synthase in the same genome, the gene it calls xcsC being tlr1902, which this project reviews separately under the THEVB organism code.

    Two caveats bound all of this and are recorded: the missing BcsB-like domain is a negative from HMM annotation rather than from structure, so a sufficiently diverged carbohydrate-binding module would escape detection and reconcile the two models; and every structural result on these proteins uses AlphaFold monomer models, with the TolC trimer assembled by superposing a monomer onto a crystallographic trimer frame.

    Gap status moved from OPEN to NARROWING. No annotation action was changed. Verified locally: the 736-residue length, Val354, the QxxRW motif position and the PilZ cross-references. Not recomputed: the superpositions and RMSDs, the bore and charge measurements, the 45-homolog survey, the Pfam searches and absence calls, and the chromosomal coordinates.
