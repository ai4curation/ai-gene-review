  summary: Remove the electronic pyruvate rows on Syntrophotalea AcoA
  details: |
    PR #5918 review, blue item 4. GO:0004739 and GO:0006086 move from MARK_AS_OVER_ANNOTATED to REMOVE. Three things coincide only in this organism: both rows are electronic TreeGrafter transfers from PTN007511179 with no experimental grounding on the protein; the purified reconstituted E1/E2/E3 system of P. carbinolicus is specific for acetoin and does not use pyruvate; and the E1 alpha subunit is the component that determines that substrate specificity, so the negative result bears on this protein directly. CLAUDE.md allows REMOVE for over-propagated electronic inferences that can be argued against on biological grounds. The supporting node stays in supporting_entities as provenance. The AcoA proteins of B. subtilis, C. necator and KT2440 keep MARK_AS_OVER_ANNOTATED, their evidence being comparative, and the PTHR11516 member exception for Q57102 was reworded to match.
