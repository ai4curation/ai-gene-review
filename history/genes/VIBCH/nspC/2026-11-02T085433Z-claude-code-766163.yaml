  summary: 'Create review: VIBCH nspC (CANSDC)'
  details: |
    New gene review for Vibrio cholerae carboxynorspermidine/carboxyspermidine decarboxylase Q9KRL4, the terminal step of the route and the reference protein of the PTHR43727 family review. Removed the two IBA rows propagated from the family-root PAINT node PTN000159906 (diaminopimelate decarboxylase activity, L-lysine biosynthesis): the gene is classified in the NspC subfamily SF1 and the assayed orthologue has no activity with meso-diaminopimelate, lysine or arginine; the PTHR43727 family review assesses that node as needing pruning at SF1. Accepted carboxy-lyase activity (the most specific term GO offers), both norspermidine and spermidine biosynthesis, PLP binding and cytoplasm; kept dimerization and single-species biofilm formation as non-core, the latter because the biofilm defect is downstream of the lost norspermidine and is rescued by adding it back. Marked catalytic activity TOO_GENERAL, matching the KT2440 orthologue review. Proposed a specific EC 4.1.1.96 term. No provider deep-research file for this gene; retrieval from the module report, all claims checked against cached papers. just validate clean.
