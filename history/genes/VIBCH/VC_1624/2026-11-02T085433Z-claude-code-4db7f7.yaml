  summary: 'Create review: VIBCH VC_1624 (CANSDH)'
  details: |
    New gene review for Vibrio cholerae carboxynorspermidine synthase Q9KRL3, the experimentally characterized first step of the bacterial carboxyspermidine route and the reference protein of the PTHR43796 family review. Accepted the single GOA row (GO:0102143, IEA from EC/Rhea) as core, since the term definition covers both the carboxynorspermidine and carboxyspermidine directions and deletion with complementation identifies this gene as the functional CANSDH. Added two NEW IMP process rows, norspermidine and spermidine biosynthesis, on the deletion and overexpression experiments: the enzyme performs the committed condensation step rather than merely being required for the outcome. Recorded as a knowledge gap that no kinetics exist for this protein, so the in vivo product split is unexplained. No provider deep-research file exists for this gene and none was fabricated; retrieval came from the module-level report and claims were checked against the cached full text. just validate clean.
