  summary: Record OpenScientist finding that VC1624 diamine preference is unpredictable
    from determinants but transferable by orthology
  details: |
    Ran an OpenScientist deep-research job (kgap-vc1624-diamine-preference) on the gap covering the quantitative substrate preference and in vivo flux partition of VC1624. The prompt deliberately asked the prior question, whether preference is predictable at all, and carried forward the caution from the companion PP_2928 analysis that pocket analysis could not discriminate diamine preference. The answer is that it cannot be predicted, for a reason that is arithmetic rather than interpretive, and the run states that the pocket approach fails here for the same reason it failed there, having nothing to calibrate against.

    The structural literature assigns specificity residues in this enzyme class exactly once, and the assignment is for agmatine: a 1.19 Angstrom Streptococcus pneumoniae structure with agmatine and NADPH bound shows a conserved Asn-Glu-Phe-Glu motif coordinating the guanidinium, a group neither 1,3-diaminopropane nor putrescine carries. A survey of the Protein Data Bank returned 12 entries for the two enzymes of this pathway and not one has a diamine bound, so no published residue set has ever been tied to a measured diaminopropane-versus-putrescine ratio anywhere in the family. The transfer test the hypothesis named cannot be run: the three enzymes with modern measured kinetics all prefer agmatine and are identical at 13 of 13 amine-pocket positions, so the within-class contrast a rule would be fitted to is zero, and none has a measured diamine ratio. Exactly one enzyme in the family has one, the Vibrio alginolyticus carboxynorspermidine synthase, where putrescine runs at about 7 per cent of the diaminopropane rate.

    This review's boundary needs updating on one point: it describes the 2023 kinetics on B. fragilis and C. leptum as putrescine and diaminopropane kinetics, and the run reports those enzymes have since been reassigned to agmatine, which is why they cannot anchor a diamine rule. That correction is recorded in the boundary.

    Two usable results survive. VC1624 retains only one of the four agmatine motif residues, which argues against an agmatine route: by alignment-free structural superposition onto the agmatine complex, the reference asparagine and glutamate map to Val112 and Val114, the phenylalanine has no counterpart at all since the Vibrio chain does not reach that position, and only the last glutamate is kept at Glu199, all confirmed in the local 414-residue record. The superposition also resolves an alignment ambiguity the sequence method could not, showing Ser111-Val112-Ser113-Val114 physically occupying the four reference positions where a pairwise alignment had placed a gap, and the local record confirms that SVSV segment verbatim. And VC1624 matches the one enzyme with a measured diamine preference at 12 of 13 pocket positions on 84.1 per cent full-length identity, against 43 to 46 per cent to the agmatine enzymes.

    So a preference can be carried to VC1624 by orthology to a measurement while remaining unpredictable from determinants, and the run offers that distinction as the practical answer for a curator. The adjacent NspC decarboxylase does not constrain the answer, acting one step downstream with both polyamines lost on its deletion. What the question needs is steady-state kinetics on VC1624 itself, with catalytic efficiency measured for diaminopropane, putrescine and agmatine side by side.

    Gap status moved from OPEN to NARROWING. No annotation action was changed. Not recomputed here: the PDB survey, the superpositions and CA offsets, the pocket equivalences in other homologs, the identity percentages, and the reassignment of the 2023 kinetics enzymes.

    Incidental: this file was edited with a YAML round-trip rather than line surgery, after the line-anchor approach misplaced a boundary on PP_1451 earlier in this batch. The round-trip reflowed existing folded scalars, giving a larger diff than the edit warranted; a semantic comparison against the previous revision confirmed nothing outside the intended edits changed.
