  summary: 'Create review: parP (VC_2060, Q9KQE0) and dashboard prediction review'
  details: |
    De-novo review of V. cholerae ParP (VC_2060) from the KBase gene-annotate dashboard batch (dashboard id NZ_VSFT01000037.1_102, 98.8% identical over 338 aligned residues). Gene directory named parP after the published symbol (Alvarado et al. 2017, PMID:29058677; Ringgaard et al. 2014, PMID:24379357) because UniProt gives only the ordered locus name; VC_2060 kept as alias. Accepted chemotaxis IEA, kept signal transduction IEA as non-core, added protein-macromolecule adaptor activity, receptor clustering, intracellular protein localization and cell pole. Dashboard call judged supported; all four GO terms COR.
