  summary: 'Create VIBCH/VC_A0218 (Q9KMV0) review: identified as the characterised
    V. cholerae lecithinase/Tlh; removed the sole-seeded GO:0008610 IBA'
  details: |
    De novo review of Vibrio cholerae O1 El Tor N16961 VC_A0218 (Q9KMV0), fetched with
    `just fetch-gene VIBCH Q9KMV0 --alias VC_A0218`. Entered as a leaf test of the argument in
    genes/PSEAE/estA that the PANTHER PTN005219546 IBD for GO:0008610 lipid biosynthetic
    process, seeded solely by P. aeruginosa EstA, does not fit its clade. That argument leaned
    on leaf names; this review tests it on a leaf's own evidence.

    Three things were established.

    1. The entry is not uncharacterised, despite looking it (bare TrEMBL record, PE 4
       Predicted, no CC FUNCTION, genome paper as its only reference). Q9KMV0 is the
       V. cholerae lecithinase Lec cloned and assayed by Fiore et al. 1997 (PMID:9234762):
       the GenBank protein from that work (U50074 / AAA92960.1, El Tor strain E7946) aligns to
       Q9KMV0 over the full 418 residues, gap free, with exactly two mismatches (99.5%
       identity). The reported gene neighbourhood (adjacent to hlyA) corresponds to
       VCA0218/VCA0219 in N16961. Alignments are in VC_A0218-bioinformatics/ (reproducible:
       fetch_seqs.sh + compare.py, sequences from UniProt and NCBI REST).

    2. The submitter-supplied name "Thermolabile hemolysin" (a SubName with only
       ECO:0000313|EMBL:AAF96130.1) is uncurated but turns out to be correct, and not merely
       inherited from the better-studied V. parahaemolyticus TLH. Syed et al. 2009
       (PMID:19717600) identify VCA0218 as V. cholerae's Tlh, construct the deletion, and show
       that haemolysis of human type O erythrocytes by a flagellar regulatory mutant is
       abolished when tlh is inactivated, having excluded the other two upregulated haemolysin
       genes on independent grounds. So the estA review's leaf-level remark about this gene
       needs correcting: the provenance observation was right, the implication that the name is
       unsupported was not.

    3. GO:0008610 lipid biosynthetic process does not hold, and now for a positive reason
       rather than an absence. This protein hydrolyses glycerophospholipid, and every
       experimentally characterised bacterial member of the clade is a phospholipase
       (V. parahaemolyticus LDH, PMID:1791426; V. alginolyticus TLH, PMID:20662368;
       P. damselae PPP, PMID:17958612; Vibrio sp. Vhe1, PMID:37458864). The one element of the
       record pointing away from hydrolysis, CDD cd01846 fatty_acyltransferase_like, names a
       clade containing Aeromonas GCAT, which is 29.1% identical to this protein, no closer
       than ChoE (29.0%) or EstA (26.4%). So the bacterial side of PTN005219546 is not merely
       uncharacterised as the plant leaves are; it is characterised, and hydrolytic.

    Annotation actions: GO:0008610 (IBA) REMOVE with propagation_review (SOURCE_BAD;
    ROLE_CONFLATION, FUNCTIONAL_DIVERGENCE); no new source defect filed, since the node defect
    is already reported from the estA review. GO:0052689 (IBA) MODIFY to GO:0004620
    glycerophospholipase activity, with propagation_review recording that this IBD is sound
    (TERM_SCOPING_PROBLEM / GRANULARITY_MISMATCH, all three sources SUPPORTS_TRANSFER) -
    the refinement comes from the target's own direct evidence, not from the node. GO:0016298
    and GO:0016788 (IEA) likewise MODIFY to GO:0004620. GO:0006629 (IEA) MODIFY to GO:0046475
    glycerophospholipid catabolic process. Two NEW rows: GO:0019836 symbiont-mediated
    hemolysis of host erythrocyte (IMP, PMID:19717600), added after a comparator check showing
    that the only two experimental annotations to that term in GOA are V. parahaemolyticus tdh
    (O87079, IDA) and Salmonella hlyE (Q8Z727, IMP), i.e. GO does annotate a bacterial
    haemolysin this way; and GO:0005576 extracellular region (IC) from the SignalP signal
    peptide plus the diffusible egg-yolk clearing activity.

    Deliberately not asserted: a positional-specificity term (GO:0004623 / lysophospholipase).
    The A2/lysophospholipase assignment was made on the V. parahaemolyticus orthologue (63.2%
    identical) and has not been measured on the V. cholerae enzyme; recorded as an MF_DARK
    knowledge gap on the core function instead. Also recorded: a BP_DARK gap for the unknown
    physiological substrate and selective role (the deletion is near-normal in rabbit ileal
    loops and infant mice) and a CC_DARK gap for the untested secretion route.

    A MISSING_STATEMENT source defect is filed against UniProt (record UniProtKB:Q9KMV0, slot
    CC:FUNCTION, requested_change ADD, confidence CONFIRMED) asking for a FUNCTION comment
    citing PMID:9234762 and PMID:19717600 and a protein existence level above 4.

    PMID:3886626's negative hybridisation result ("no homologous DNA sequences ... detected in
    the chromosomes of Vibrio cholerae") is recorded as an OVERTURNED finding superseded by
    PMID:9234762, with the reference marked DISPUTED, so the claim is on record as checked
    rather than silently ignored.

    Validation: `just validate VIBCH VC_A0218` passes (the 2 reported warnings are UV_NATIVE_TLS
    environment noise, not review findings); record_sections backfilled with
    `just backfill-record-sections`. No deep-research provider file was generated; literature
    work and its provenance are in VC_A0218-notes.md (34 inline verbatim quotes, all checked
    against the cached publications).
