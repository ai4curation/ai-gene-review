  summary: 'Create review: comEC (VC_1879, Q9KQW8) and dashboard prediction review'
  details: |
    De-novo review of V. cholerae ComEC (VC_1879) from the KBase gene-annotate dashboard batch (dashboard id NZ_CWQE01000001.1_287, 100% identical over 747 aligned residues). The directory was seeded as VC_1879 and renamed to comEC after the published V. cholerae symbol (Seitz & Blokesch 2013, PMID:24127573; Watve et al. 2015, PMID:26401962) because UniProt gives only the ordered locus name. VC_1879, VC1879 and the dashboard id are kept as aliases. Accepted the plasma membrane IBA and IEA rows and the membrane IEA. Modified establishment of competence (GO:0030420) to DNA import into cell involved in transformation (GO:0009290). Added GO:0009290 (IMP, PMID:24127573), DNA transmembrane transporter activity (ISS) and DNA nuclease activity (ISS, PMID:33772889/PMID:40985778; motif II HLDNDH conserved; beril run 20261030T213831Z-vc1879-comec-motifs). Dashboard call judged supported. GO:0009290 and GO:0005215 scored COR, GO:0009294 and GO:0005886 CNN, and GO:0015267 channel activity UNC. The call missed the MBL-domain nuclease.
