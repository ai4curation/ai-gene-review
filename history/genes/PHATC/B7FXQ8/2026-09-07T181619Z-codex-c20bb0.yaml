  details: |
    Audited genes/PHATC/B7FXQ8/B7FXQ8-protnlm-predictions-review.yaml against the source-independence and final-state prose guidelines in .claude/skills/review-function-prediction/SKILL.md.

    Replaced rationale prose with the current assessment, traced biological claims to sequence/domain records, primary publications, and where relevant experimentally grounded curated annotations or reproducible analysis. Removed AI/OpenScientist verdicts as supporting evidence and unsupported error-mechanism claims. Source prediction terms and method/version metadata were preserved. Existing annotation overlap is separated from biological correctness and is not evidence of training-data contamination.

    GO:0009651 (response to salt stress): NPI -> UNC. The target has an alpha-crystallin/Hsp20 domain and is assigned to the small heat-shock protein family. Characterized sHSPs bind unfolded proteins and form regulated oligomers (PMID:29983375), but those properties do not establish a salt-triggered response in this diatom protein. The inspected evidence contains no target expression or functional assay under salt stress. Response to salt stress is absent from the cached annotations and remains uncertain.

    GO:0051259 (protein complex oligomerization): COR -> COR. The 163-residue target has the small heat-shock protein architecture, including the alpha-crystallin domain. Structural and functional experiments on sHSPs establish conserved oligomer assembly and plasticity (PMID:29983375), supporting transfer of broad protein oligomerization to this family member. This inference does not prescribe a particular oligomer size. The process is absent from the cached annotations.

    GO:0006457 (protein folding): LSP -> COR. The alpha-crystallin/Hsp20 domain and small-HSP family assignment support a holdase chaperone role. Characterized sHSPs bind nonnative clients and protect them from aggregation (PMID:29983375), allowing subsequent recovery of folding with other chaperones. The broad protein-folding process can encompass this assistance; it does not imply that the protein itself catalyzes ATP-dependent refolding. There is no more specific existing GOA/UniProt annotation against which to call this prediction less precise.

    GO:0009408 (response to heat): COR -> COR. The target is a compact small-HSP family protein with the conserved alpha-crystallin chaperone domain. Experimental sHSP work links oligomer remodeling and binding of destabilized client proteins to protection of proteostasis (PMID:29983375). This conserved protective role provides a reasonable family-based inference for a broad heat response, without asserting heat induction or a measured heat-tolerance phenotype in this diatom. Response to heat is absent from the cached annotations.

    GO:0042542 (response to hydrogen peroxide): NPI -> UNC. The small-HSP architecture supports a chaperone function, but it does not establish involvement in a response specifically triggered by hydrogen peroxide. General protection of unfolded proteins and evidence for stress responses in other sHSPs do not determine the target's peroxide response. No relevant target or close-ortholog expression, perturbation, or protection experiment is established in the inspected sources. The predicted process is absent from the cached annotations and remains uncertain.

    GO:0051082 (unfolded protein binding): COR -> COR. The target has the characteristic alpha-crystallin/Hsp20 domain of small heat-shock proteins. Client-binding experiments on characterized sHSPs demonstrate recognition of partially or globally unfolded proteins (PMID:29983375), providing a mechanistic basis for transferring broad unfolded-protein binding. This does not establish a particular client or ATP-dependent foldase activity. The molecular function is absent from the cached annotations.

