- type: EDIT
  outcome: changed
  summary: 'Add reproducible local topology analysis: tail anchor and cytosolic heme
    domain firm, tail translocation and membrane identity not settled'
  details: |
    Added a local, reproducible sequence analysis for the C. albicans Cyb5 topology gap
    and wired its result into the gap boundary. The gap KEEPS status OPEN, because what
    it asks for is direct measurement in this organism and none has been added.

    Why local analysis. The OpenScientist run intended for this gap
    (kgap-cyb5-topology) could not be obtained: the service has returned nothing for any
    submission after 2026-11-26 19:52 (five runs, four genes; see
    genes/BACSU/plsY/plsY-notes.md). Rather than leave the gap untouched or resubmit
    into an outage, I did the part of the question local sequence analysis can reach.

    New files:
    - genes/CANAL/CYB5/CYB5-bioinformatics/tail_anchor_topology.py - stdlib only, no
      network, reads ../CYB5-uniprot.txt, prints every number it derives, hardcodes no
      results.
    - genes/CANAL/CYB5/CYB5-bioinformatics/RESULTS.md - the numbers and their limits.
    Every figure quoted in RESULTS.md was checked against a fresh run of the script.

    Two results are firm.
    - Tail anchor rather than a conventional transmembrane helix. The most hydrophobic
      19-residue window is 100-118, mean Kyte-Doolittle +1.87 against a whole-protein
      mean of -0.26, with only 8 residues beyond it (YYYKTNFA). There is not enough
      C-terminal sequence for a translocated domain, which is the defining feature of a
      tail anchor. The computed window independently reproduces the record's curated
      TRANSMEM 102..121 without being given it, so the segment assignment does not rest
      on either source alone.
    - The heme domain faces the cytosol. Both curated heme ligands, His41 and His65, lie
      inside the cytochrome-b5 domain (6-82), entirely N-terminal to the anchor. For a
      C-terminally anchored protein the N-terminal domain is necessarily cytosolic, so
      this conclusion does not depend on charge rules at all.

    What the analysis explicitly cannot settle, and says so: whether the short tail is
    translocated - equivalently whether the segment crosses the bilayer or forms a
    hairpin. The flanking charges are weak and nearly balanced (N-flank -1 over 15
    residues, tail +1 over 8 with a single lysine), so the positive-inside rule has
    almost no purchase, and the question is genuinely contested for cytochrome b5
    proteins generally.

    Out of scope entirely: this constrains the orientation of the functional domain
    relative to a bilayer, not which bilayer. It is no evidence for the ER or microsomal
    assignment specifically, which remains transferred from the S. cerevisiae orthologue
    and family membership exactly as the boundary already said. No localisation dataset
    was consulted.

    No annotation action changed; no cellular-component term was added or altered, since
    nothing here identifies which membrane.

    The CANGA/CAGL0L03828g orthologue carries this gap verbatim. The script is not
    specific to this protein beyond its record path, so the same analysis could be run
    there, but it has NOT been run and no claim is made about that protein.
