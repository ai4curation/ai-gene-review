  summary: Re-quote the PTHR43323 family review after its text changed
  details: |
    The ergosterol biosynthetic process IBA row (GO:0006696, ACCEPT) quotes the PTHR43323 family review's assessment of node PTN000933803. That assessment was reworded when the family review was extended to the fungal members, so the quoted sentence ("Every reviewed recipient retains this IBA: ERG13 (yeast), hcs1 (SCHPO).") was no longer in the file and the review stopped validating. The row now quotes the sentence as it stands: "Every reviewed fungal ERG13/hcs1 recipient retains this IBA: S. cerevisiae ERG13, S. pombe hcs1, C. albicans ERG13, and the duplicated A. fumigatus erg13A/erg13B pair." It is the same assessment (SOUND) of the same node and term, and now names C. albicans ERG13 itself. Nothing else changed; the review validates. Found when main was merged into the tree-evidence branch, whose checks validate every gene review.
