  summary: Re-review of over-annotated IBA rows on the PROPPIN root node
  details: |
    Re-judged four IBA rows from the PTHR11227 root PTN000132136 against the tree. Candida ATG18 is in the fungal clade PTN000881190, where the Candida ATG18 and ATG21 pair is sister to the S. cerevisiae Atg18 and Atg21 group under PTN000881193. Mitophagy (seeds S. cerevisiae Atg21 and fly Atg18a), pexophagy (seed S. cerevisiae Atg18) and nucleophagy (seeds S. cerevisiae Atg18, Atg21, Hsv2) are seeded inside the target's clade, so they changed from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE; the IEA rows for pexophagy and nucleophagy changed with them for consistency. Glycophagy stays MARK_AS_OVER_ANNOTATED with a rewritten reason: its single fly seed is in the metazoan sister clade PTN000881175 and glycogen autophagy is not described in C. albicans. The old reasons described an Atg21/Hsv2 branch that the tree does not show. Seeds checked in QuickGO by GO id. Consistent with the earlier calls on S. cerevisiae ATG18 and S. pombe atg18. Validated with just validate.
