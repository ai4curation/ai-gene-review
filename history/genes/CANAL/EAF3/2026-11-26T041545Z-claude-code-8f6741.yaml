  summary: Record OpenScientist interface analysis predicting CaEaf3 membership in
    CaRpd31S, settled from the Rco1 side
  details: |
    Ran an OpenScientist deep-research job (kgap-caeaf3-rpd31s-interface) on the gap asking whether C. albicans Eaf3 associates with the Rco1/Rpd31-containing CaRpd31S deacetylase complex. It predicts the association, settles it from the Rco1 side rather than the Eaf3 side, and corrects a premise that this review's boundary and the hypothesis sent to the run both carried.

    The interface was computed rather than quoted. From two S. cerevisiae Rpd3S-nucleosome cryo-EM structures the Eaf3-Rco1 contact set is 353 residue-residue pairs over 74 ScEaf3 and 84 ScRco1 residues, 72 of the 74 Eaf3 residues lying in the MRG domain, and an independent 1.62 Angstrom crystal structure reproduces 96 per cent of that set, defining a 48-residue high-confidence core. In CaEaf3 that core is 29 of 48 identical, 60.4 per cent, against 35.2 per cent for the rest of the resolved surface, odds ratio 2.80 at p = 0.00183.

    All twenty residues the run names were checked against the local Q59K07 record in Candida numbering and every one matches, with zero mismatches: Trp213, Tyr215, Tyr266, Tyr277, Tyr284, Leu199, Leu209, Val210, Leu263, Leu275, Leu276, Leu282, Leu288, Leu320, Leu334, Gly262, Arg312, Met326, Asp327 and Pro318, in a 369-residue protein whose record places the MRG domain at 193-368. That also confirms the cerevisiae-to-albicans offset the run used, which was worth checking explicitly after an earlier batch recorded a numbering misreading on another gene.

    The shortening relative to S. cerevisiae is a trimmed rim rather than a lost core: the six contact positions lost to a gap all fall in one contiguous C-terminal deletion of an acidic, charged, surface-exposed block carrying 11 of 353 contact pairs, while the buried aromatics and aliphatics are completely retained. A decayed interface would show the opposite pattern.

    The partner is present and intact. C. albicans encodes a single 688-residue Rco1 ortholog, the only Candida entry in the Rco1 InterPro family, keeping both diagnostic PHD fingers and the Sin3 arm, and CaSin3 retains 91 of 129 Rco1 contacts identical with zero gaps. The decisive asymmetry is that CaRco1 has deleted none of the 84 positions it uses to touch Eaf3, against 12.3 per cent across the whole protein and 12.4 per cent across resolved non-contact residues, Fisher exact p = 1.08e-4; since Rco1 belongs to Rpd3S and nothing else, that conservation is attributable.

    The Eaf3 side cannot settle the question, which is the plain answer to the sub-question the hypothesis asked. Rco1 and the NuA4 subunit Eaf7 bind the same face of the MRG domain, with 38 of the 48 core residues also Eaf7 contacts, so a CaEaf3 that had left Rpd3S while staying in NuA4 would conserve exactly those residues; the 10 Rco1-specific positions give 7 of 10 identical at p = 0.719, which is underpowered.

    The premise correction: the 2016 study is not a negative result about an Rco1-containing complex. The same paper reports that Rco1 interacted with Rpd31 but not Rpd3 and names the assembly CaRpd31S. Its non-detection of Eaf3 came from a one-step anti-myc immunoprecipitation, SDS-PAGE, silver staining and manual excision of visible bands, so only polypeptides abundant enough to form a band picked by eye reached the mass spectrometer. The run also rules out the salt-lability explanation the hypothesis offered: the buffer was at physiological ionic strength and milder than conditions under which yeast Rpd3S survives purification, so the limit is detection depth, not complex stability.

    Gap status moved from OPEN to NARROWING rather than closed, because no experiment places CaEaf3 in any complex. No annotation action was changed. Not recomputed here: the contact sets from 8TOF, 8KD2, 8I3F and 8I3G, the Fisher statistics, the CaRco1 and CaSin3 alignments and deletion rates, the PHD boundaries, and the Rpd3S parts-list survey.
