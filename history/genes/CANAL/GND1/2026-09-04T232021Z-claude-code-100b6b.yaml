  summary: Complete enzyme-specificity review of GND1 (cofactor-specificity control)
  details: |
    Closed out the last pending gene of projects/ENZYME_SPECIFICITY.md. Verified that GO:0004616 (NADP+-dependent, EC 1.1.1.44) is at the correct cofactor specificity for C. albicans Gnd1 with a reproducible sequence check of the NADP+ specificity determinants from PMID:35234135 (GND1-bioinformatics/check_coenzyme_motifs.py: Gly-X-Ala-X-Met-Gly at 13-18 and Asn-Arg-Thr at 36-38 present, NAD+-type Asp-Arg-Asp absent) plus the NADP+-acceptor oxidative-PPP lysate assay in PMID:40183578. Re-assessed the keyword-derived GO:0019521 D-gluconate metabolic process as MARK_AS_OVER_ANNOTATED (substrate is 6-phospho-D-gluconate; keyword imports bacterial gluconate-utilization context). Added PubMed-verified references PMID:34065948 and PMID:35234135, supporting_by quotes for all accepted annotations, reference_review blocks, suggested questions and experiments, GND1-notes.md, and set status COMPLETE. Validated with ai-gene-review validate.
