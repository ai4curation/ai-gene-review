  summary: Explore Pde1-Gpa2 relationship; rescope glucose-GPCR IBA; integrate falcon
    deep research
  details: |
    Follow-up on the Pde1-Gpa2 'regulatory module' (PMID:20558315). Found no evidence of physical interaction; the link is genetic/functional. Literature on whether C. albicans Gpr1-Gpa2 mediates glucose-induced cAMP is split (PMID:15302825 yes; PMID:15673611 no, Cdc25-Ras1 instead; PMID:30761119 ligands methionine/lactate). Changed IBA GO:0110034 (negative regulation of glucose-activated GPCR pathway, donor S. pombe cgs2) from ACCEPT to MARK_AS_OVER_ANNOTATED with propagation_review TERM_SCOPING_PROBLEM; GO:0141162 retained as core. Marked PMID:15302825 finding DISPUTED. Added PMID:12477787 (Gpa2 acts via MAPK, cAMP-independent) to filamentous-growth rows, kept non-core. The falcon deep research job completed after the wrapper's timeout; integrated it (pde1 filaments normally; cAMP ~13.6x preferred over cGMP; Gpr1/Gpa2 not required for glucose cAMP). Revised description/core function wording. Recorded orf19.4235/orf19.11710 identifier note.
