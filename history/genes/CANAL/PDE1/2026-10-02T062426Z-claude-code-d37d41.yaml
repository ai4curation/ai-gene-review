  summary: De novo review of C. albicans PDE1 (Q5AGE4), low-affinity class II cAMP
    phosphodiesterase
  details: |
    Fetched gene data and reviewed all 15 GOA annotations. Accepted MF annotations (cAMP/cGMP/cyclic-nucleotide PDE, phosphoric diester hydrolase) on the basis of recombinant enzyme assays (PMID:8075796) and class II PDE family membership; accepted cAMP catabolism and negative regulation of cAMP/PKA and glucose-activated GPCR signalling (Pde1 terminates glucose/acidification-induced cAMP spikes, PMID:20558315; ortholog PMID:9880329). Kept the three filamentous-growth IMP annotations as non-core (phenotypes largely synthetic with gpa2; full text not cached, curator call retained). Accepted ND cellular_component. Added 4 PubMed-verified references, core function, questions and experiments. Deep research failed (falcon timeout, perplexity unavailable); documented in PDE1-notes.md.
