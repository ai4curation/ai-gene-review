  summary: 'Create review: SAG1'
  details: |
    Created the first full review of Toxoplasma gondii SAG1 (P13664) under the PROTISTS project. Automated deep research was unavailable in this environment, so the gene notes are a manual literature review built from the UniProt record, PubMed searches, and newly cached primary papers. Both GOA rows are cellular-component IEAs: GO:0016020 membrane (InterPro SRS domain) was MODIFYed to plasma membrane and external side of plasma membrane on the strength of the biochemical GPI-anchor evidence (PMID:2925621, PMID:11522346), and GO:0020003 symbiont-containing vacuole was kept as non-core because the parasitophorous-vacuole pool reflects shed or exported surface material (PMID:8570580). Two NEW annotations were proposed: host cell surface binding (IDA, PMID:15151144, where purified SAG1 rather than whole parasites was assayed) and adhesion of symbiont to host cell (IMP, PMID:40607979 CRISPR knockout plus complementation), giving a single core function as a GPI-anchored tachyzoite surface adhesin. Reported host interactors (S100A6, KRCC1, RACK1) were judged single-laboratory and were recorded as a knowledge gap rather than annotated.
