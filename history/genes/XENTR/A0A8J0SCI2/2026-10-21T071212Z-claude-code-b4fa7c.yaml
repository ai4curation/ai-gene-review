  details: |
    Re-examined all 5 GOA rows. Replaced ARBA-sourced UniProt quotes with PANTHER/PROSITE/SMART/InterPro cross-references and PTHR24381 family-review node-assessment quotes. GO:0000978 KEEP_AS_NON_CORE -> ACCEPT (sequence-specific DNA binding is core TF function). Description rewritten: removed name-derived gastrulation inference, added single-exon gene structure and SF440 placement. Removed Klf analogy from core_functions and all ProtNLM2 mentions. Live InterPro confirms PTHR24381:SF440, contradicting the member-index PTHR24377:SF929 entry that led the family review to drop SF440 (reported, not edited). SF440 has no experimentally characterised member; no closest characterised relative can be named phylogenetically since the IBD node is Eumetazoa-level.
