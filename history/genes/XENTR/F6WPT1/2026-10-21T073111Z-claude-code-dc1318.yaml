  summary: Full re-review of Xenopus arl5a (F6WPT1), independent of ProtNLM2 predictions
  details: |
    Confirmed F6WPT1 is the full-length arl5a product in PTHR11711:SF147 (vertebrate ARL5A). Cytoplasm IBA changed to MODIFY with trans-Golgi network as the replacement. Vesicle-mediated transport IBA changed to MODIFY with GO:0042147 as the replacement. Intracellular protein transport IBA changed from ACCEPT to KEEP_AS_NON_CORE. NEW GO:0042147 now records the participation, comparator and PAINT-omission reasoning plus double-KO support. Description and core function were rewritten to flag ARL5B-specific evidence (Ragulator, single-paralog knockdown); core processes are now GO:0042147 and GO:1903292.
