  summary: 'Create review: yorkie'
  details: |
    Created the first review of S. rosetta yorkie (F2UDK1, PTSG_06057), a two-WW-domain Yorkie/YAP homolog. Both IEA rows (cytoplasm, signal transduction) came from TreeGrafter grafting F2UDK1 onto an ecdysozoan node (PTN002569196) of the MAGI-related family PTHR10316; kept both as non-core with propagation reviews flagging the wrong family, since the terms are independently plausible for a Yorkie homolog. Added a reproducible motif scan (yorkie-bioinformatics) showing four HXRXXS Warts motifs, no recognizable TEAD-binding motif, and closer similarity to YAP1, Yorkie and coYki than the S. rosetta protein PANTHER places in the YAP1 family (F2U5K0). No MF asserted and no NEW rows; knockout has no proliferation or rosette-size phenotype.
