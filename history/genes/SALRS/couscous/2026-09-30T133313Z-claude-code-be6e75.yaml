  summary: 'Create review: couscous'
  details: |
    Created the first review of S. rosetta couscous (F2UJ78, PTSG_07368) from Wetzel et al. 2018 (PMID:30556809), with supporting context from PMID:25299189, PMID:31896587 and PMID:41037400; automated deep research was unavailable, so reviewer notes are in couscous-notes.md. Of 7 IEA annotations: alpha-1,2-mannosyltransferase activity, glycosyltransferase activity, glycoprotein biosynthetic process and membrane were accepted as homology-based predictions; Golgi membrane and Golgi apparatus were left UNDECIDED because tagged Couscous was reported not to localize to the Golgi, with authors uncertain; mannan biosynthetic process (defined as plant hemicellulose) was removed as an over-propagated fungal/plant term. No NEW annotations were added because rosette and adhesion phenotypes are necessity-level with no identified substrate; a clonal colony development term was proposed instead.
