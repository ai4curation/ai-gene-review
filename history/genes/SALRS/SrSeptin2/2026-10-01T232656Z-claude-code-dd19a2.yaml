  summary: 'Create review: SrSeptin2'
  details: |
    New DRAFT review of S. rosetta SrSeptin2 (F2UEE2, PTSG_07215), a Group 4 (Cdc12-family) septin per Booth et al. 2018 (PMID:30281390). All four IEA rows accepted (GTP binding, cytoplasm, cytoskeleton, septin complex). Added NEW IDA rows for basal part of cell and septin cytoskeleton from mTFP1-fusion imaging. No process terms: rosette-development role is only hypothesised and no septin knockout exists in PMID:32496191, PMID:41037400 (abstract) or the 2024 bioRxiv knockout preprint. Track C: no animal tissue/development terms propagated. Reviewed together with SrSeptin6.
