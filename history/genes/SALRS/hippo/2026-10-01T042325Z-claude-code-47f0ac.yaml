  summary: 'Create review: hippo'
  details: |
    Created the first review of S. rosetta hippo (F2UQC7, PTSG_10780), the MST1/2-type STE20 kinase with a Hippo-type SARAH domain. Accepted the four domain/family-level IEA rows (Ser/Thr kinase, ATP binding, cytoplasm, signal transduction) and kept nucleotide binding as non-core; noted that the TreeGrafter node PTN004698602 is a deep germinal-centre kinase duplication node rather than the MST clade, harmless for these generic terms. Added knockout evidence from the Combredet and Brunet preprint (slower growth, normal rosette size). No NEW rows: hippo signaling was not added because no S. rosetta data place Hippo upstream of Warts and the hippo and warts phenotypes differ. Notes written manually because automated deep research was unavailable.
