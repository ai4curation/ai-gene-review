  summary: 'Create review: jumble'
  details: |
    Created the first review for S. rosetta jumble (F2TWH0, PTSG_00436), which has no GOA annotations. Evidence is drawn chiefly from Wetzel et al. 2018 (PMID:30556809): the L305P jumble-lw1 allele causes promiscuous clumping and loss of rosettes and is rescued by the wild-type transgene; tagged Jumble localizes apically at the Golgi position while the mutant is retained in the ER; basal jacalin staining and Rosetteless secretion are lost in mutants. One NEW annotation was proposed: Golgi apparatus (GO:0005794, IDA). Glycosyltransferase activity (GO:0016757) is recorded only in core_functions as a fold-recognition prediction, because InterPro reports no entries for the protein and no activity has been demonstrated. Glycosylation BP and rosette/adhesion BP terms were deliberately not proposed: the glycosylation terms are obsolete, the substrate is unknown, and the defect may be in trafficking. Notes were written manually because automated deep research was unavailable.
