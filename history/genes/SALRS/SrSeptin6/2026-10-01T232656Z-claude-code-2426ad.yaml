  details: |
    New DRAFT review of S. rosetta SrSeptin6 (F2UDE9, PTSG_06009), a Group 1B (SEPT6-family) septin per Booth et al. 2018 (PMID:30281390). Both IEA rows accepted (GTP binding, septin complex). Added NEW IDA basal part of cell from mTFP1-fusion imaging in single cells; septin cytoskeleton and rosette locations not proposed because those panels used SrSeptin2. No process terms; no septin knockout data found. Track C: no propagation problems. Reviewed together with SrSeptin2.
