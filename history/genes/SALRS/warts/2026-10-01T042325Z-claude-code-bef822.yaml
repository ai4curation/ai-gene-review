  summary: 'Create review: warts'
  details: |
    Created the first review of S. rosetta warts (F2U943, PTSG_04961), the LATS-clade AGC kinase. Traced the TreeGrafter rows to the M. brevicollis Warts leaf PTN001220369 and its IBD parent PTN002390470 (Metazoa-Choanoflagellida). Removed regulation of organ growth (choanoflagellates have no organs; organ-level outcome term placed at a node spanning unicellular taxa), marked G1/S transition and positive regulation of apoptotic process as over-annotations (vertebrate and fly tissue-growth donors, no choanoflagellate data), accepted Ser/Thr kinase activity, ATP binding, cytoplasm and hippo signaling, kept generic parents as non-core and left cell periphery undecided. Recorded the preprint and Cell Reports findings (rosettes about twice as large with a larger branched ECM core, slower growth, shared ECM targets with Yorkie). No NEW rows.
