  summary: 'Create review: Variovorax paradoxus S110 ureG (C5CY05, Vapar_4248)'
  details: |
    Curated Variovorax paradoxus S110 ureG (C5CY05, Vapar_4248, 216 aa), the cytoplasmic SIMIBI-class G3E GTPase and nickel metallochaperone for urease maturation (HAMAP MF_01389, InterPro IPR004400, PANTHER PTHR31715:SF0) preserving the P-loop GTP-binding site (24-GPVGSGKT-31) and Cys72-Pro73-His74 nickel-binding motif. Accepted GO:0003924 (GTPase activity), GO:0016151 (nickel cation binding), GO:0043419 (urea catabolic process), and GO:0005737 (cytoplasm), and added GO:0005525 (GTP binding, IC) supported by PMID:10500143 and PMID:22369361.
