  summary: Wire OpenScientist finding that no pocket determinant can assign this decarboxylase's
    substrate
  details: |
    Wired an OpenScientist run (kgap-clolep-substrate-assignment) into the single
    knowledge gap on CLOLEP_01503, which asked about native substrate distribution and
    isolated-enzyme selectivity. Status OPEN -> NARROWING.

    The selectivity half is answered in the negative, and firmly. The structural
    literature names exactly one residue as a substrate-selection determinant anywhere
    in the carboxypolyamine decarboxylases (Leu314 of the C. jejuni enzyme), and
    CLOLEP_01503 carries the wild-type leucine at the equivalent position 307 and the
    wild-type residue at all nine polyamine-contact positions in the family's only
    ligand complex. Across 500 members of IPR005730 those positions average 96.0%
    identity to the C. jejuni reference against 42.7% at 118 control positions
    (Mann-Whitney p = 1.13e-05, r = 0.850). The one variable position, the Glu236
    equivalent at 79.4%, splits by phylum (Ser in 64/65 Bacteroidota; Glu in 341/371
    Pseudomonadota and all 31 Campylobacterota), which is lineage drift, and it is
    broken outright by the B. thetaiotaomicron enzyme, which carries the Ser yet is
    assigned carboxyspermidine by deletion and assay. This is the same wall the
    companion VC_1624 run hit, reached here family-wide rather than over a handful of
    homologs.

    Structures supply no constraint either: an RCSB search from this entry's sequence
    returns twelve entries at >=25% identity, four in class before a fourteen-point gap
    to ornithine and diaminopimelate decarboxylases, and the ligand audit finds no
    carboxypolyamine complex in the family. The one polyamine-bound entry, 3N29, holds
    the product norspermidine in the enzyme later shown by deletion to make spermidine
    in vivo, so the ligand is not native to its own protein; in 9EAF the polyamine
    channel holds a His-tag octapeptide from the construct.

    The carboxyaminopropylagmatine assignment survives on pathway context only: no
    diaminobutyrate aminotransferase or decarboxylase (removing carboxynorspermidine
    for want of 1,3-diaminopropane), no ornithine decarboxylase, and the adjacent
    CLOLEP_01502 with a measured 34-fold agmatine preference. CLOLEP_01503 itself has
    never been assayed with any substrate. The exclusion of carboxyspermidine is
    weaker, hinging on the unassigned CH238_05280, whose arginase-fold Mn site maps
    identically onto both candidate activities and whose identity separates them by 2.1
    points, less than the shift phylum alone produces.

    No annotation action changed. The run independently reaches the two
    recommendations this review already makes: GO:0008836 diaminopimelate decarboxylase
    activity is not defensible (a correctly assigned lysA exists separately in this
    genome) and GO:0045312 nor-spermidine biosynthetic process is over-annotated.

    Verified locally against genes/9FIRM/CLOLEP_01503/CLOLEP_01503-uniprot.txt: 376
    residues; Leu307; the transferred contact set Lys43, Cys173, Glu174, Glu240,
    Asp276, Met280, Tyr335, Lys339, Phe343; the record's own BINDING 240 and 276 and
    the pyridoxal-phosphate Schiff-base MOD_RES at Lys43 all agree. Not recomputed: the
    family-scale identity statistics, the 3N29-to-9EAF superposition, the RCSB hit list,
    the 114-protein arginase-fold panel. The new references entry is marked UNVERIFIED
    and lists this split.
