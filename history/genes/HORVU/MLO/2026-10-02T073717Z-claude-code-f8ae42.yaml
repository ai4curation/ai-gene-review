  summary: 'Create review: MLO'
  details: |
    Curated barley MLO (P93766), the seven-transmembrane calmodulin-binding plasma membrane powdery mildew susceptibility factor. Both GOA rows were IEA and were modified: defense response (InterPro2GO) -> negative regulation of defense response (wild-type MLO suppresses defense; resistance results from loss of function; matches Arabidopsis MLO2 convention; defense response to fungus deliberately not proposed), and membrane -> plasma membrane (fractionation evidence). Added one NEW annotation, calmodulin binding (IDA, PMID:11919636). Actions: MODIFY 2, NEW 1. Core function: Ca2+-calmodulin-regulated plasma membrane protein that negatively regulates defense at fungal entry sites; Ca2+ channel activity raised as a question (shown only for Arabidopsis paralogs). Cached 9 PMIDs. Validation passes with no warnings; status COMPLETE.
