  summary: 'Create review: mvaD (Haloferax volcanii)'
  details: |
    Reviewed the 3 GOA rows for H. volcanii HVO_1412 (D4GXZ3), the phosphomevalonate decarboxylase of the haloarchaeal alternate mevalonate pathway (ATP-dependent decarboxylation of (R)-mevalonate 5-phosphate to isopentenyl phosphate; PMID:24375100). Accepted GO:0090710 (core MF) and GO:0008299; marked GO:0016831 TOO_GENERAL because the IPR005935 signature spans DMD, PMD and MBD and cannot support MODIFY; added NEW GO:0019287 (IDA, PMID:24375100). Added a reproducible PANTHER tree-placement script (mvaD-bioinformatics) showing the haloarchaeal/Chloroflexi MPD clade lies outside PAINT node PTN000104601. Validated with just validate (clean, term checks on) and quote_check (all quotes verified).
