  summary: 'Create review: THEMA queH'
  details: |
    Review of the four GOA annotations for Thermotoga maritima QueH (Q9WZJ0), the structurally characterized member of the cobalamin-independent epoxyqueuosine reductase family and a representative of the QueH route in the bacterial queuosine maturation module. The activity is accepted on the strength of heterologous complementation of an Escherichia coli queG deletion plus the HAMAP MF_02089 assignment, with the unresolved in vitro chemistry (substrate consumed, no queuosine product detected) and the unassigned second active-site metal recorded as biology knowledge gaps. Generic tRNA modification was refined to the queuosine biosynthesis term. Deep research generation was unavailable (no provider API keys); no provider file was fabricated. Validated clean with just validate THEMA queH.
