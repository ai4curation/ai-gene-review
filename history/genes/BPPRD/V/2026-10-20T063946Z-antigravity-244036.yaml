  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene V (P22536)
  details: 'Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene V (UniProtKB:P22536).
    Reviewed 3 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed
    mechanistic notes in V-notes.md.


    Biological summary: Homotrimeric vertex spike protein P5 (34.4 kDa, 340 residues) of Enterobacteria phage PRD1. P5 comprises
    an N-terminal P31-homologous jelly-roll base domain that binds directly to the homopentameric penton protein P31 at the
    five-fold capsid vertices, a central collagen-like triple-helical shaft interrupted by a flexible glycine-rich hinge,
    and a C-terminal trimeric beta-stranded knob domain. At the capsid vertex, P5 forms a separate spike adjacent to the monomeric
    receptor-binding protein P2 and interacts with P2 near the capsid shell to mediate P2 incorporation into the virion and
    coordinate vertex conformational switching during host attachment.'
