  details: 'Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene XXX (UniProtKB:P27391).
    Reviewed 3 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed
    mechanistic notes in XXX-notes.md.


    Biological summary: Minor capsid tape-measure and cementing protein P30 (9 kDa, 84 residues) of Enterobacteria phage PRD1.
    P30 forms extended homodimers (60 copies per capsid) that span the 30 icosahedral two-fold edges from one five-fold vertex
    to the next beneath the major capsid protein P3 lattice, defining the dimensions of the pseudo T=25 capsid and cementing
    adjacent P3 facets onto the internal viral lipid membrane vesicle. In the absence of P30, P3 trimers fail to assemble
    into a stable capsid shell and only empty phage-specific membrane vesicles are produced.'
