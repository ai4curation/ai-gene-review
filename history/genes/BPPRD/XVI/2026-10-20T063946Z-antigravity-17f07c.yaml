  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene XVI (P27392)
  details: |
    Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene XVI (UniProtKB:P27392). Reviewed 2 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in XVI-notes.md.

    Biological summary: Protein P16 (gene XVI) is a 117-residue single-pass integral membrane protein of the Enterobacteria phage PRD1 viral inner membrane (`Pfam:PF09301`, `PDB:1W8X`). Located at the fivefold icosahedral vertices via an N-terminal transmembrane helix (residues 7-24) and a structured C-terminal vertex-interacting region (residues 34-93), P16 anchors the capsid vertex complex to the underlying viral lipid membrane, increases vertex stability, and is essential for viral infectivity.
