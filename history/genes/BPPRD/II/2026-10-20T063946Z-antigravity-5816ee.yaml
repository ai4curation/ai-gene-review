  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene II (P27378)
  details: |
    Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene II (UniProtKB:P27378). Reviewed 2 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in II-notes.md.

    Biological summary: Monomeric receptor-binding adsorption spike protein P2 (63.8 kDa, 591 residues) of Enterobacteria phage PRD1. P2 folds into an elongated club-shaped architecture comprising a distal pseudo-beta-propeller receptor-binding head and an extended beta-sheet shaft anchored at the five-fold capsid vertices through interactions with the P31 penton base and the P5 trimeric spike. At the onset of infection, P2 recognizes and binds the host cell conjugative plasmid-encoded mating pair formation receptor complex, triggering a conformational switch in the P5-P31 vertex complex that initiates vertex disassembly, membrane tube formation, and viral genome delivery.
