  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene VIII (P09009)
  details: |
    Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene VIII (UniProtKB:P09009). Reviewed 4 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in VIII-notes.md.

    Biological summary: Genome terminal protein (protein P8) covalently linked via a phosphodiester bond between a tyrosine residue and 5'-dGMP to both 5' ends of the linear double-stranded DNA genome of bacteriophage PRD1. Serves as the protein primer for initiation of viral DNA replication by DNA polymerase P1 in the bacterial host cytoplasm and remains covalently attached to the packaged viral genome inside the mature virion.
