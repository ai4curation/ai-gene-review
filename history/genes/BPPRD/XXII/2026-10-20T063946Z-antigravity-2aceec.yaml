  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene XXII (P27388)
  details: |
    Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene XXII (UniProtKB:P27388). Reviewed 5 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in XXII-notes.md.

    Biological summary: Small single-pass integral viral inner membrane protein (packaging protein P22, 47 amino acids) that co-assembles with P20 into a ring-shaped heterododecamer embedded in the internal lipid membrane at the unique packaging vertex of bacteriophage PRD1. Anchors the external P6/P9 portal ring to the viral inner membrane and is required for efficient viral DNA genome packaging and virion maturation.
