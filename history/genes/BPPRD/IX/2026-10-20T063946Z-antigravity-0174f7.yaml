  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene IX (P27381)
  details: |
    Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene IX (UniProtKB:P27381). Reviewed 2 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in IX-notes.md.

    Biological summary: Viral DNA packaging ATPase (protein P9) that assembles with the packaging efficiency factor P6 into a ring-shaped heterododecamer at the unique vertex of the bacteriophage PRD1 capsid, anchored to the inner membrane portal proteins P20 and P22. Powers ATP-dependent translocation of the unit-length P8-linked double-stranded DNA genome into the preformed lipid-containing procapsid and remains bound at the vertex of the mature virion as a structural plug.
