  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene XXXI (P27384)
  details: |
    Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene XXXI (UniProtKB:P27384). Reviewed 1 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in XXXI-notes.md.

    Biological summary: Penton protein P31 (14 kDa, 126 residues) of Enterobacteria phage PRD1. P31 adopts a single eight-stranded jelly-roll beta-barrel fold and assembles into homopentamers that occupy the five-fold vertices of the pseudo T=25 icosahedral capsid. At each vertex, the P31 penton interlocks with peripentonal major capsid protein P3 trimers, the tape-measure protein P30, and the inner-membrane vertex protein P16, and serves as the structural base that anchors the homotrimeric P5 spike and the monomeric P2 receptor-binding spike.
