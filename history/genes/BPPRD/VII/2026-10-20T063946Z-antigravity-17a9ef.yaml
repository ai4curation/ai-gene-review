  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene VII (P27380)
  details: 'Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene VII (UniProtKB:P27380).
    Reviewed 15 GO annotations, synthesized 1 core function(s) across 6 literature/database references, and authored detailed
    mechanistic notes in VII-notes.md.


    Biological summary: Gene VII of Enterobacteria phage PRD1 encodes two structural viral inner-membrane proteins via nested
    in-frame translational initiation: full-length transglycosylase P7 (265 residues) and the N-terminally truncated protein
    P14 (150 residues, corresponding to residues 116-265 of P7). Isoform P7 contains an N-terminal soluble lytic transglycosylase
    (SLT) catalytic domain (residues 19-98, active site Glu32) and a C-terminal transmembrane helix (residues 219-239), and
    acts as a virion-associated muralytic exolysin (EC 4.2.2.n1) that locally cleaves beta-1,4-glycosidic bonds in the host
    peptidoglycan sacculus to facilitate viral DNA entry into the Gram-negative host cell. Isoform P14 lacks the N-terminal
    SLT domain and has no muralytic activity, but forms a vertex-associated heteromultimer with P7 in the viral inner membrane
    and is essential for viral infectivity and membrane tail-tube formation during genome injection.'
