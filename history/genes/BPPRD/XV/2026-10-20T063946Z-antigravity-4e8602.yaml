  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene XV (P13559)
  details: 'Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene XV (UniProtKB:P13559).
    Reviewed 15 GO annotations, synthesized 1 core function(s) across 9 literature/database references, and authored detailed
    mechanistic notes in XV-notes.md.


    Biological summary: Endolysin P15 (gene XV) is a 149-residue soluble peptidoglycan beta-1,4-N-acetylmuramidase (lysozyme,
    EC 3.2.1.17; `Pfam:PF11860`, `InterPro:IPR016284`) of Enterobacteria phage PRD1. Following permeabilization of the host
    cytoplasmic membrane by holin P35 (gene XXXV) at the end of the infective cycle, P15 translocates into the periplasm and
    hydrolyzes beta-(1->4)-glycosidic bonds between N-acetylmuramic acid and N-acetyl-D-glucosamine in the host peptidoglycan
    sacculus, causing host cell lysis and release of progeny virions. In addition, P15 is incorporated into mature PRD1 virions
    as a peripheral viral inner-membrane protein via interactions dependent on the small integral membrane proteins P20 and
    P22.'
