  details: |
    De-novo review of PRD1 endolysin P15 (gene XV, P13559) for the CACAO audit: all 15 GOA rows judged (7 ACCEPT, 2 KEEP_AS_NON_CORE, 4 TOO_GENERAL, 1 MODIFY, 1 REMOVE), with the five CACAO rows assessed against the cited papers. GO:0044277 cell wall disassembly is modified to GO:0052009 symbiont-mediated disruption of host cell wall (own-wall term used for a host-directed activity), the keyword-derived GO:0042742 defense response to bacterium is removed with a UniProt source defect, and the CACAO lysozyme row citing PMID:10931330 (a P7 paper) is accepted but its reference flagged MISCITED. Deep research and the GONUTS wiki were unavailable.
