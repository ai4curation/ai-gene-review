  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene III (P22535)
  details: |
    Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene III (UniProtKB:P22535). Reviewed 1 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in III-notes.md.

    Biological summary: Major capsid protein P3 of the lipid-containing tectivirus Enterobacteria phage PRD1. P3 folds into a tandem double-jelly-roll (two eight-stranded beta-barrel) architecture and forms pseudohexameric homotrimers that assemble in 240 copies (720 subunits) onto the outer surface of the internal viral lipid membrane vesicle to construct the pseudo T=25 icosahedral capsid shell. Within the capsid lattice, P3 facets are cemented along icosahedral edges by the tape-measure protein P30 and interlock at the five-fold vertices with the P31 penton base and the integral membrane vertex protein P16.
