  details: 'Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene XVII (UniProtKB:P27383).
    Reviewed 2 GO annotations, synthesized 1 core function(s) across 1 literature/database references, and authored detailed
    mechanistic notes in XVII-notes.md.


    Biological summary: Nonstructural homotetrameric assembly factor (protein P17, 86 amino acids) required late in bacteriophage
    PRD1 procapsid morphogenesis inside the bacterial host cell. Acts together with the major coat protein P3 and the membrane
    scaffold factor P10 so that capsid protein multimers enclose the host-derived viral lipid membrane containing virus-encoded
    membrane proteins.'
