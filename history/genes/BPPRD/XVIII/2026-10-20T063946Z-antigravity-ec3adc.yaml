  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene XVIII (P27389)
  details: |
    Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene XVIII (UniProtKB:P27389). Reviewed 3 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in XVIII-notes.md.

    Biological summary: Protein P18 (gene XVIII) is a 90-residue multi-pass integral membrane protein of the Enterobacteria phage PRD1 viral inner membrane containing three transmembrane helices (residues 1-21, 37-57, and 60-80). It is an essential component of the phage DNA injection machinery required for the spherical-to-tubular transformation of the internal viral membrane vesicle, forming the tail-like membrane conduit that connects the virion interior with the host bacterial cytosol to deliver the viral dsDNA genome.
