  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene VI (P27379)
  details: |
    Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene VI (UniProtKB:P27379). Reviewed 3 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in VI-notes.md.

    Biological summary: Minor capsid vertex protein and packaging efficiency factor (protein P6) located exclusively at the unique packaging vertex of bacteriophage PRD1. Multimerizes with the DNA packaging ATPase P9 into a ring-shaped heterododecamer anchored to the inner membrane portal proteins P20 and P22, stabilizing P9 association with the procapsid and promoting efficient ATP-driven viral DNA genome packaging.
