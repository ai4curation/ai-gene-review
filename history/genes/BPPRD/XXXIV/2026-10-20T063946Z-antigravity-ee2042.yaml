  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene XXXIV (P27390)
  details: |
    Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene XXXIV (UniProtKB:P27390). Reviewed 2 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in XXXIV-notes.md.

    Biological summary: Protein P34 (gene XXXIV, also known as ORFO) is a 68-residue multi-pass integral membrane protein of the Enterobacteria phage PRD1 viral inner membrane containing two transmembrane helices (residues 4-24 and 41-61). It belongs to the conserved tectiviral DNA delivery protein P32/P34 family (`Pfam:PF11087`, `InterPro:IPR020085`) and is a structural component of the internal virion lipid membrane alongside its single-pass paralog P32 (gene XXXII).
