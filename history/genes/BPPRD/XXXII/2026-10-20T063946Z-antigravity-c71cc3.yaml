  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene XXXII (Q3T4M7)
  details: 'Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene XXXII (UniProtKB:Q3T4M7).
    Reviewed 4 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed
    mechanistic notes in XXXII-notes.md.


    Biological summary: Protein P32 (gene XXXII) is a 54-residue single-pass integral membrane protein of the Enterobacteria
    phage PRD1 viral inner membrane (`Pfam:PF11087`, `InterPro:IPR020085`) containing an N-terminal transmembrane helix (residues
    4-24). Related to PRD1 protein P34 (gene XXXIV), P32 is a component of the phage DNA injection machinery required for
    the spherical-to-tubular transformation of the internal viral membrane vesicle and formation of the membrane tail tube
    that delivers the viral dsDNA genome into the host bacterial cytosol.'
