  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene X (P28732)
  details: |
    Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene X (UniProtKB:P28732). Reviewed 4 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in X-notes.md.

    Biological summary: Nonstructural membrane-scaffolding assembly protein (protein P10, 203 amino acids) essential for bacteriophage PRD1 procapsid morphogenesis inside the host cell. Coats virus-specific lipid vesicles pinched off from the host cytoplasmic membrane to form a membrane-vesicle scaffold on top of which the major coat protein P3 and capsid proteins assemble.
