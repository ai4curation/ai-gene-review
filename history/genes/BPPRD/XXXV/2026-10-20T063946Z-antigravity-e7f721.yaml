  summary: Complete end-to-end curation of Enterobacteria phage PRD1 gene XXXV (Q3T4L9)
  details: 'Completed comprehensive gene review for Enterobacteria phage PRD1 (NCBITaxon:10658) gene XXXV (UniProtKB:Q3T4L9).
    Reviewed 8 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed
    mechanistic notes in XXXV-notes.md.


    Biological summary: Holin P35 (gene XXXV, also known as ORFM) is a 117-residue class I phage holin (`Pfam:PF16083`, `InterPro:IPR032126`)
    of Enterobacteria phage PRD1 containing three transmembrane helices (residues 6-26, 40-60, and 67-87) and a charged C-terminal
    cytoplasmic tail (residues 97-117). P35 inserts into the host bacterial inner (plasma) membrane during late infection,
    initially mediating potassium ion efflux and, upon depletion of intracellular ATP, assembling into large transmembrane
    lesions that collapse the membrane potential and allow soluble endolysin P15 (gene XV) to reach the periplasmic peptidoglycan
    layer to trigger host cell lysis and progeny virion release.'
