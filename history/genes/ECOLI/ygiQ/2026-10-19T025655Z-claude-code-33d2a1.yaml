  summary: 'Create review: ygiQ'
  details: |
    Created the ai-gene-review for E. coli K-12 ygiQ (Q46861, UPF0313 family) as part of RADICAL_SAM project Phase 2. No reviewer-run deep research was available; an OpenScientist report appeared during the review and was read critically. That report concludes that ygiQ is rlmX, the cobalamin-dependent radical SAM methyltransferase that methylates the ribose C5-prime of two 23S rRNA nucleotides in the peptidyl-transferase centre (PMID:41380683). The paper is real but its abstract does not name ygiQ, b4469 or Q46861, the full text is paywalled, UniProt and NCBI Gene carry no rlmX name, and two 2026 papers citing RlmX give no former gene name, so the identity is recorded as an unverified hypothesis in notes and in a knowledge gap rather than annotated. All four GOA rows reviewed: GO:0003824 and GO:0051539 KEEP_AS_NON_CORE per the project treatment rule, GO:0051536 and GO:0005506 iron ion binding MODIFY to GO:0051539. No NEW rows and no core functions; one WHOLLY_DARK BIOLOGY knowledge gap with suggested questions and experiments.
- type: EDIT
  outcome: changed
  sections:
  - description
  - references
  - existing_annotations
  - core_functions
  summary: 'Re-review ygiQ on newly available full text: ygiQ = rlmX'
  details: |
    Re-reviewed E. coli K-12 ygiQ (Q46861) after the full text of PMID:41380683 (Ishiguro et al., Mol Cell 86:78-96, 2026) became available in the publication cache. The full text settles the identification that the first pass had to leave open: the anaerobic screen of 15 uncharacterised and 6 known RNA methyltransferases found the modifications lost in the ygiQ deletion (Keio JW5501) and restored by plasmid-borne ygiQ, and the authors state "Hereafter, we refer to ygiQ as rlmX." Catalysis is therefore established, so the RADICAL_SAM treatment rule for generic rows was applied in its normal branch: GO:0003824 MODIFY to the specific activity, GO:0051536 and GO:0005506 MODIFY to GO:0051539, GO:0051539 ACCEPT as core. Four NEW rows added from the paper: GO:1904047 SAM binding, GO:0031419 cobalamin binding, GO:0019843 rRNA binding and GO:0031167 rRNA methylation. GO has no molecular-function term for ribose C5-prime methylation of RNA, so a proposed new term was added under GO:0008649 and the first core function points at it via proposed_molecular_function; five core functions in total. Notes rewritten with provenance, including the correction that RlmX carries one [4Fe-4S] cluster (3.69 Fe per protein) and that the Cys453/Cys458/Cys464 triad is a putative zinc/RNA-recognition site rather than a second cluster, contradicting the OpenScientist report, whose reference_review was downgraded accordingly while recording that its central claim is confirmed. Three BIOLOGY knowledge gaps (zinc site, physiological reductant, hypoxic activation) replace the earlier WHOLLY_DARK gap; status COMPLETE.
