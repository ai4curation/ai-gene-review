  summary: 'Create review: ECOLI epd'
  details: |
    Full review of all 18 GOA annotations for E. coli K-12 Epd (P0A9B6), the reference exemplar for step 1 of the DXP-dependent de novo PLP module. GAPDH activity (IBA from PTN001652504 and IDA from PMID:9182530) and glucose metabolic process (IBA and IDA) removed under the promiscuous-noise tier: the GAPDH side activity is at least 2000-fold below the erythrose-4-phosphate activity and E. coli has the dedicated GapA; a PANTHER source defect records the over-propagation into the Epd subfamily. GO:0042823 refined to the de novo child GO:0036001 (added as NEW); broad oxidoreductase class refined to GO:0048001; cytoplasm refined to cytosol, cytosol and NAD binding kept as non-core. Deep research generation was unavailable (no provider API keys); built from UniProt, PAINT and cached abstracts. Validated with just validate ECOLI epd.
