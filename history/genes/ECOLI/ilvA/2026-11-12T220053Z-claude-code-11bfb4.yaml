  details: |
    Reviewed all 16 GOA rows for P04968 and added one NEW cytosol row. ACCEPT 11 (threonine deaminase IBA/IDA x4/IEA, PLP binding x3, isoleucine biosynthesis IBA/IEA), MODIFY 3 (amino acid metabolic process and both branched-chain amino acid biosynthetic process rows to L-isoleucine biosynthetic process), KEEP_AS_NON_CORE 2 (amino acid binding for the Ile/Val allosteric sites; L-threonine metabolic process, not refined to catabolic, following the PTHR48078 family review). Recorded a suspected UniProt reference defect: PMID:5321308 is on the AMP-activated threonine dehydrase (TdcB) but supports the IlvA PLP-binding IDA row. GOA has no serine row, so the KT2440 serine standard had nothing to apply to; dedicated SdaA/SdaB/TdcG accessions verified and noted. Wrote ilvA-notes.md (no provider deep research).
