- type: EDIT
  outcome: changed
  summary: Drop a finding_status whose schema meaning is the opposite of the intent
  details: 'See the shared context below.


    Round 8 on #3102. finding_status: UNVERIFIED was removed from every finding this PR added it to. The
    schema defines that value as ''The finding has not yet been manually assessed (default)'', which is
    the opposite of what these findings are - they are the most carefully triaged in the review, and a
    consumer filtering UNVERIFIED for the un-triaged backlog would have collected them. They were also
    the only four uses of the value in the repository, so the convention was being set here rather than
    followed. No permissible value fits ''the claim may be right but the reference filed under it does
    not establish it''; DISPUTED and OVERTURNED both require contrary evidence. finding_status is optional,
    so it is now omitted and review_notes carries the adjudication.

    '
