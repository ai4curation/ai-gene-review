  summary: 'Review: ECOLI rnc (RNase III)'
  details: |
    Completed review of E. coli K-12 RNase III, cited by modules/crispr_cas_adaptive_immunity.yaml as the exemplar for the tracrRNA-dependent crRNA maturation route. 23 annotations resolved: 15 ACCEPT, 4 MODIFY, 1 KEEP_AS_NON_CORE, no NEW. The CRISPR role is deliberately absent from the YAML as an annotation action and appears only as scoped prose: PMID:21455174 is S. pyogenes, and the newly fetched PMID:23535272 demonstrates the requirement only in an E. coli host carrying a transplanted S. thermophilus type II system, while E. coli K-12's own type I-E system matures pre-crRNA with Cas6e instead. A process term would therefore assert something the native pathway contradicts. The module's exemplar description was updated to record that the E. coli enzyme has direct functional data on a type II substrate rather than being a sequence stand-in, and to record the single-spacer exemption.
