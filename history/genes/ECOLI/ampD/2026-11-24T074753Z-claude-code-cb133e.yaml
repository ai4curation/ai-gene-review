  details: |
    Re-review of the IBA row GO:0009276 Gram-negative-bacterium-type cell wall (PTHR30417, IBD at PTN002019137) in the 2026-11-24 pass over IBA rows marked MARK_AS_OVER_ANNOTATED. Action changed from MARK_AS_OVER_ANNOTATED to REMOVE on MISPLACED_IBD grounds. The earlier reason said all three seeds were periplasmic AmiD/AmpDh amidases; the tree shows that only AmpDh2 (Q9HT86) and AmpDh3 (Q9I5D1) are in the AmiD/AmpDh clade PTN001252283, while the third seed G3XCW9 is P. aeruginosa AmpD in the target's own clade PTN002825391, with an IMP located_in row from a cloning and complementation paper (PMID:9835532, abstract only). E. coli AmpD is cytosolic (PMID:7925310, quoted), so the cell wall term is wrong for it and not merely stronger than the evidence. Reason and propagation_review rewritten; PMID:7925310 quote added to supported_by. Requested PAINT fix: move the IBD to PTN001252283. Batch record projects/IBA_REVIEW/overannotated-2026-11-24/batches/batch-N23.yaml.
