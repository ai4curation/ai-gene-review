  summary: 'Create review: E. coli phoA (bacterial alkaline phosphatase), family deep
    anchor'
  details: |
    Reviewed 20 GOA annotations and proposed 2 new ones: protein homodimerization (IDA, the refined crystal structure PMID:3910843 states the enzyme forms an isologous dimer) and cellular response to phosphate starvation (IEP, PMID:2241934), the only substantive process the gene lacked. Two rows left undecided as citation problems: an FTIR coiled-coil paper (PMID:8634266) cited as IDA for two molecular functions with no mention of alkaline phosphatase, and a human LRRK2 paper cited for protein binding. Self-review corrected an initial MODIFY on the hydrogenase term: GO catalytic definitions are undirected, so the H2-evolving reaction is covered; kept non-core. Validated with just validate ECOLI phoA (0 warnings).
