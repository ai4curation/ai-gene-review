  summary: Name every co-mapping signature in the InterPro record
  details: |
    PR #6750 review round 1. The record named one signature where the GOA row cites several that all carry the faulted GO term in rules/arba/_interpro2go.txt. The intersection rule this batch documented guards against over-naming (a signature the explanation names only to ask for its exclusion) but not against under-naming, which is what happened here. Corrected by asking the mapping file which of the row's signatures actually carry the term; that set is the defective record and it guards both directions. A sweep of all 200 INTERPRO records found 8 (file, term) groups genuinely under-naming, of which this PR wrote 2.
