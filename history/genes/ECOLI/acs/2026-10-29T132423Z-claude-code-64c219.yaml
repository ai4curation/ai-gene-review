  details: |
    De-novo review of all 15 GOA rows for E. coli acs (P27550) for the CACAO audit: 9 ACCEPT, 2 KEEP_AS_NON_CORE, 3 MODIFY, plus one NEW row (GO:0019543 propionate catabolic process). The four CACAO rows were judged against their papers: GO:0003987 IDA accepted as core, GO:0018394 kept as non-core, GO:0034421 modified to the residue-specific sibling as a parent-level restatement, and GO:0033558 modified to GO:0061733 because the deacetylase term inherits a hydrolytic definition that an adenylate-forming ligase running its own transfer in reverse cannot satisfy. The UniRule GO:0006935 chemotaxis IEA was modified to GO:0050920 regulation of chemotaxis, and the disputed Delta-acs chemotaxis phenotype was recorded with finding_review DISPUTED superseded_by PMID:20345663.
