  summary: 'Create review: ydeM'
  details: |
    Created the ai-gene-review for E. coli K-12 ydeM (P76134) as part of RADICAL_SAM project Phase 2; no deep research was available, so the review rests on cached primary literature, PubMed searches, UniProt and the paralog sequence analysis in genes/ECOLI/aslB/aslB-bioinformatics. All six GOA rows reviewed: generic radical SAM rows per the project treatment rule (GO:0003824 and GO:0051539 KEEP_AS_NON_CORE, GO:0051536 MODIFY to GO:0051539), GO:0016491 UNDECIDED as an unverified family reaction class, the ISS GO:0051604 protein maturation row UNDECIDED because the K-12 knockout refutes only Cys-type sulfatase maturation while the adjacent gene ydeN encodes a predicted Ser-type sulfatase that was never tested, and the IEP GO:0006974 DNA damage response row MARK_AS_OVER_ANNOTATED since it rests only on transcript changes in a response involving a third of the genome. No core functions asserted; one BIOLOGY knowledge gap with suggested questions and an experiment.
