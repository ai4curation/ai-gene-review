  summary: 'Create review: rsfS'
  details: |
    New review of E. coli RsfS (P0AAT6). 18 GOA rows reviewed: ribosomal large subunit binding, negative regulation of translation, negative regulation of ribosome biogenesis, cytosol and the IBA ribosomal large subunit assembly accepted; cytoplasm rows refined to cytosol; the UniRule cytosolic ribosome assembly row modified to ribosomal large subunit assembly with a source defect (RsfS antagonises subunit joining); five bare protein binding rows removed per policy. Core functions: 50S binding via uL14 to block subunit joining and silence translation, and participation in late pre-50S maturation with ObgE/RluD/DarP. Literature work done manually (PMID:22829778 and PMID:41965359 full text).
