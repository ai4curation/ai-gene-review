  summary: Resolve UNDECIDED DNA damage response rows
  details: |
    Resolved the two UNDECIDED GO:0006974 (DNA damage response) rows while completing the bacterial alkanesulfonate uptake and desulfonation module. The earlier review left them undecided because the PAINT node behind the IBA could not be inspected; the node has since been fetched (interpro/panther/PTHR43408/PTHR43408-paint.tsv) and shows PTN001577184 seeded solely by this gene's own expression annotation from PMID:11967071, a mitomycin-C gene-array survey in which nearly 30% of all genes changed significantly. Both the IEP source row and the inherited IBA are therefore MARK_AS_OVER_ANNOTATED: the expression response is real but it reports regulation, not participation in DNA repair or damage signalling, and no assay links SsuE flavin-reductase chemistry to DNA damage. This matches how the same study's rows are treated for other E. coli genes in the corpus. The propagation review now records SOURCE_WEAK_OR_INFERRED rather than UNRESOLVED, and notes that the gene appearing in its own with/from is expected rather than circular. Validated with just validate ECOLI ssuE and just backfill-record-sections.
