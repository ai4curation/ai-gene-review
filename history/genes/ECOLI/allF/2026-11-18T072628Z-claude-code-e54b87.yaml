  summary: 'Create review: allF'
  details: 'New review of E. coli AllF (formerly FdrA, UniProtKB:Q47208), written as a follow-up to the evolutionary reviews
    of the succinyl-CoA synthetase alpha family PTHR11117, where AllF is a member of the divergent SF24 clade (PTN001671414).


    All 11 GOA rows reviewed. Accepted as core: GO:0050205 oxamate carbamoyltransferase activity (contributes_to IDA and the
    EC-derived IEA) and GO:0000256 allantoin catabolic process (IDA and IEA), from the purified AllF-AllG-AllH assay, deletion
    and complementation in PMID:38888336. Accepted: GO:0005829 cytosol (IBA from the SF24 node), on indirect grounds; the
    seed, a YahF IDA from an inner-membrane proteome paper cached as abstract only, is left unresolved. TOO_GENERAL: GO:0003824
    catalytic activity. Removed as over-propagated IBAs from the LUCA node PTN000122012: GO:0004775, GO:0004776, GO:0006099
    and GO:0009361, each with a GO_CENTRAL source defect asking for a loss at PTN001671414. UNDECIDED: GO:0071973 flagellum-dependent
    cell motility (IMP, PMID:17122336), because the cached text lacks the body of Table 1 and the gene is not named in it;
    a SUSPECTED CHECK query to EcoCyc notes that the twelve other genes annotated from that paper carry the swarming term
    GO:0071978.


    One proposed new term (oxamate carbamoyltransferase complex), four BIOLOGY knowledge gaps (subunit roles, retained succinyl-CoA
    synthetase chemistry, stoichiometry, FtsH suppression by a truncated fragment). No NEW rows.


    Deep research with the perplexity provider was attempted once and failed for lack of credentials; no deep-research file
    was written. Five publications were fetched with just fetch-pmid (PMID:34494882, 7500942, 36384810, 41016821, 41081392).
    PANTHER tree placement was read from the release 19 treeinfo service on 2026-11-18 and pairwise identities from local
    alignments that are not stored as a committed analysis; both are recorded in allF-notes.md. Validated with just validate
    ECOLI allF (0 errors) and the quote check (86 quotes verified).

    Follow-up after independent checks (same day). The three statements that AllF, AllG and AllH copurify were replaced: the purified preparation carried a His tag on both AllF and AllH, so only the co-elution of untagged AllG is evidence of association, and with a single tag on AllH the paper reports that AllF and AllG were washed out (PMID:38888336); the proposed complex term now says that physical association of all three has not been shown directly. The swarming row no longer states as fact that the screen was aerobic or that the operon is not expressed under its conditions; expression there is described as unlikely and not measured. The four GO_CENTRAL defects keep requested_change CHECK.

    '
