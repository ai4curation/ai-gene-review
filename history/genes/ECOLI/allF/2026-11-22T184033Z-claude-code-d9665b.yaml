  summary: Narrow AllF knowledge gaps with a verified catalytic-histidine analysis
  details: |
    The two knowledge gaps on AllF chemistry and architecture were narrowed with a sequence, profile and structure analysis, after two OpenScientist reports (provider output, cited as file: references, not edited) gave different answers on which AllF residue stands at the catalytic phosphohistidine of E. coli SucD (His247): Val293 in one, Gln467 in the other. Three independent checks of the reports were made, and their reproducible parts are now genes/ECOLI/allF/allF-bioinformatics (catalytic_his_mapping.py, results.yaml, RESULTS.md), run on 2026-11-22; two measurements on His389 were added afterwards and the earlier numbers did not change on re-run.

    Result used in the review: AllF has no histidine at the catalytic position. Val293 is wrong (outside the PF00549 domain, 26 A from the superposed histidine). Gln467 is the residue at the Pfam PF00549 profile column of the histidine (also Gln in YahF and Salmonella FdrA), but by TM-align superposition on PDB 3DMY the SucD segment 242-251 that carries the histidine has no AllF counterpart and Gln467 lies 18 A away, so the loop is absent and not substituted. The independent checks disagreed on this point (two confirmed Gln467 from the profile without a structure, one refuted it by superposition); both results are reproduced by the script and the review reports the profile column and the structural finding separately. Also recorded: Met391 at the histidine position and the family-specific His389 about 5 A from it when the SucD C-terminal domain is superposed on lobe 2 (9-10 A in the dimer frame in which lobe 1 of the other chain takes the alpha role), with its side chain 3.2-6.2 A from the lobe 2 helix N-terminus (residues 338-340); retained phosphate-binding helix N-termini in both SucD-like lobes; the crystal dimer resembling the alpha-C plus beta-C pair of succinyl-CoA synthetase in trans; histidine in 53 of 53 reviewed succinyl-CoA synthetase alpha entries against glutamine in 764 of 951 AllF-family entries; 150 UniProtKB entries with AllG and AllF domains in one chain; a rigid CoA transplant that clashes (stated with its limit).

    Changes. description: one clause on the lost histidine. The four REMOVE rows (GO:0004775, GO:0004776, GO:0006099, GO:0009361): actions unchanged; reason extended, two quotes from the analysis added, residue_claims_not_applicable replaced by a residue_claims entry (LOST, anchor SucD His247, no target), and the GO_CENTRAL source-defect explanations extended. No other action changed and no NEW row. Knowledge gaps: none closed. The gap on retained succinyl-CoA synthetase chemistry now asks whether any covalent intermediate forms and whether the inherited domains bind a ligand; the subunit-role and stoichiometry gaps gained boundary text and provenance; the FtsH-suppression gap is untouched. suggested_questions and suggested_experiments: His389 and Thr341 variants and assay of a natural AllG-AllF fusion added. references: the analysis and the two OpenScientist reports added with reference_review; the Val293 mapping is recorded as an OVERTURNED finding and the GHAGA to QQIAT reading as DISPUTED. source_defects was not used for the reports, which have no upstream record.

    Left as unverified leads in allF-notes.md and not used: the Foldseek fold assignments of AllG and AllH, the AllH D170-D171 loop, STRING scores, individual CoA-contact substitutions, and Gln467 as a substrate contact. Gln467 and AllH loop mutagenesis were deliberately not added to the experiments.

    Validation: just validate ECOLI allF passes with 0 errors; the quote check verifies all quotes in the review and in the PTHR11117 family review; the residue-claim check passes the four anchors and reports the four targets unresolved because none is given.
