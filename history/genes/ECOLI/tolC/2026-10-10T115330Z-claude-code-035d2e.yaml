  summary: Relocate two prohibited knowledge gaps; propose an exit-duct term
  details: |
    PR review found knowledge_gaps entries whose only gap_kind was ONTOLOGY and/or CURATION, which CLAUDE.md prohibits: those values may appear only alongside BIOLOGY, on a gap a wet-lab experiment could close. Relocated per the reviewer's direction, with the boundary prose preserved as what was asserted instead. The ontology gap on the absence of a molecular function distinguishing a gated outer-membrane exit duct from a passive diffusion porin becomes a top-level proposed_new_terms entry, with a definition, transmembrane transporter activity as the proposed parent, and two verbatim supporting quotes on the sealed periplasmic gate and the sub-porin conductance. The curation gap on no outer-membrane factor carrying the type I secretion process term is folded into the suggested question that already asked it. Two live-ontology checks the reviewer could not run are recorded in the notes: GO:0015562 does define transfer of a substance rather than a solute, so the module description stands, and the GO:0008320 label in these notes matches the live ontology while the repository cache is the stale copy.
