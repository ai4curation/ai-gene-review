  summary: Review all 87 tolC annotations and correct two wrong-membrane groups
  details: |
    First review of P02930, the shared outer-membrane exit duct. 54 ACCEPT, 18 REMOVE, 9 MODIFY, 6 MARK_AS_OVER_ANNOTATED. Two coherent error groups are corrected, both assigning TolC the inner membrane that belongs to its partner transporters: six NAS rows of periplasmic side of plasma membrane are removed, and one plasma-membrane detoxification row is modified to its outer-membrane sibling. Twelve bare protein-binding rows are removed per repository policy and one is modified to colicin transmembrane transporter activity, following the verified precedent that OmpF carries that term for colicins E3 and N. Porin activity and the bilayer ion-channel rows are marked over-annotated rather than removed, since they follow family-wide convention; the IBA row carries a structured propagation review classifying this as term scoping rather than bad propagation. A NEW type I secretion process term was drafted and then rejected on a comparator check: only two experimental annotations to it exist in all of GO, on the cargo and adaptor of one system, and no outer-membrane factor anywhere carries it. Three core functions keep the efflux, protein-secretion and colicin-import uses distinct.
