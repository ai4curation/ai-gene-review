  summary: 'Create review: nrdG'
  details: |
    Created the nrdG (P0A9N8, class III anaerobic ribonucleotide reductase activase) review for the RADICAL_SAM project Phase 2 from cached abstracts, UniProt, PubMed and QuickGO; no deep research was available. All 20 GOA rows reviewed: generic radical SAM rows treated per the project rule, the InterPro2GO PFL-activase (GO:0043365) and thioredoxin RDR (GO:0004748) rows removed as wrong, protein binding removed, and deoxyribonucleotide process rows marked as over-annotation because the activase acts upstream of NrdD catalysis. Added NEW SAM binding, peptidyl-glycine modification and protein maturation rows, and proposed a NrdG-specific child of GO:0043364.
