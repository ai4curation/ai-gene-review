  summary: Review F-plasmid traC and record its molecular function as dark
  details: |
    First review. Accepts the plasma-membrane location, noting the association is peripheral and partner-dependent. Proposes pilus assembly and unidirectional conjugation from the traC1044 mutant phenotype, neither of which GOA carried. Asserts no molecular function: the protein is routinely called the VirB4-family ATPase of the F system but has never been assayed for nucleotide binding or hydrolysis, and PANTHER does not place it with VirB4. Recorded as an MF_DARK knowledge gap with a proposed experiment.
