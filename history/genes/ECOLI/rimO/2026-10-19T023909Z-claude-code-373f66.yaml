  summary: 'Create review: rimO'
  details: |
    Reviewed all 16 GOA rows for E. coli RimO (ribosomal protein uS12 Asp88/89 beta-methylthiotransferase) as part of RADICAL_SAM project Phase 2; no deep research available, so the review was built from cached primary papers (PMID:18252828, 19736993, 21169565, 23542644, 18304323), UniProt and QuickGO. Took GO:0103039 protein methylthiotransferase activity (RHEA:37087) as the core MF alongside the accepted sibling GO:0035599, removed the family-wide InterPro tRNA modification IEA (RimO modifies protein, not tRNA), applied the project treatment rule for generic rows, and added a NEW S-adenosyl-L-methionine binding row (IDA, PMID:19736993). No BP asserted because the specific protein-modification BP terms are obsolete; raised as an ontology question.
