  summary: Review E. coli epmC (P76938) EF-P lysine hydroxylase
  details: |
    New review of 4 GOA rows plus one NEW IC cytoplasm row. Core: GO:0016709 (the most specific existing term for the EC 1.14.13.- reaction; RHEA:83439 has no GO mapping) involved in GO:0017185 peptidyl-lysine hydroxylation, plus GO:0005506 iron ion binding for the 2-His-1-carboxylate site. Monooxygenase activity modified to GO:0016709 and metal ion binding to iron ion binding; GO:0043687 modified to GO:0017185 since the oxygen goes onto Lys34 itself. Iron rather than ferrous iron was chosen because the metal in the native structure is explicitly unidentified. The missing EF-P-specific hydroxylase term is raised as a question rather than a proposed term.
