  summary: Relocate a prohibited knowledge gap; propose a coupling-protein term
  details: |
    PR review found knowledge_gaps entries whose only gap_kind was ONTOLOGY and/or CURATION, which CLAUDE.md prohibits: those values may appear only alongside BIOLOGY, on a gap a wet-lab experiment could close. Relocated per the reviewer's direction, with the boundary prose preserved as what was asserted instead. The ontology gap on the absence of a molecular function for the coupling-protein role becomes a proposed_new_terms entry, with protein carrier activity as the proposed parent, noting the role is shared across TraD of F, TrwB of R388, TraG of RP4 and VirD4 so a term would serve more than one gene. A hierarchy check the reviewer asked for is recorded in the notes: GO:0044097 and GO:0009291 are in neither direction ancestor and descendant, so proposing the secretion term alongside the conjugation term adds coverage rather than redundancy.
