  summary: Review F-plasmid traD, the type IV coupling protein
  details: |
    First review. Accepts both existing annotations. Proposes ATP hydrolysis as ISS from TrwB (Q04230), the biochemically characterised member of the same coupling-protein family, with the supporting entity naming the source so the inference stays visible; no assay of F TraD itself was found. Also proposes the secretion-system complex and the cargo-agnostic type IV secretion process. Records an ontology gap: no GO molecular function expresses coupling-protein activity, the selective recruitment of one complex to another.
