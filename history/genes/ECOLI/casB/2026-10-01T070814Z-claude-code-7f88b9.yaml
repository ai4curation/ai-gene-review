  summary: 'Review: ECOLI casB (type I-E Cascade subunit)'
  details: |
    Completed review of E. coli K-12 type I-E Cascade subunit casB, reviewed together with the other four subunits so the set answers the structural-subunit question once rather than five times. Status left DRAFT rather than COMPLETE: validation is clean but three decisions are genuine judgement calls wanting a second opinion. All nine intra-complex GO:0005515 rows across the five subunits were modified uniformly to GO:0005198 structural molecule activity, which is a live GO-slim molecular function whose 22 children all name specific complex types that do not fit a non-ribosomal ribonucleoprotein, so the parent is the right level; each is backed by a verbatim structural quote naming that subunit's actual contact. All ten GO:0032991 rows were modified to GO:1990904 ribonucleoprotein complex, directly supported by the 11-subunit-plus-61-nt-crRNA composition, and the set carries a proposed CRISPR RNA-guided surveillance complex term under GO:1990904 after establishing that GO's entire CRISPR vocabulary is biological-process terms and no cellular-component term for such a complex exists. casA gained GO:0030674 as a NEW row for Cas3 recruitment rather than a binding term. casE retains GO:0004521 as a core function so its catalysis is not buried under complex membership, and the Cas1-interaction rows were handled asymmetrically on purpose: casE to GO:0060703 where a functional readout exists, casC removed where none does.
