  summary: Add structured propagation_review to the epmB IBA aminomutase row
  details: |
    The IBA GO:0016869 row carries action MODIFY with a full prose rationale but no structured propagation_review, which the best-practices check flags. Added root_cause TERM_SCOPING_PROBLEM with failure mode GRANULARITY_MISMATCH and two source entities, both SUPPORTS_TRANSFER: the PAINT node PTN000776770, whose general aminotransferase claim is correct for the KamA clade because members form either beta-lysine enantiomer, and EpmB itself, which appears in its own WITH/FROM because its experimental annotation is one of the descendant evidences behind the node. This records that the MODIFY refines the term for this gene rather than challenging the node placement, matching the new PTHR30538 family review. Touched while curating modules/efp_translation_stall_rescue.yaml, for which EpmB is the (R)-beta-lysine supplier.
