  summary: 'Create review: miaB'
  details: |
    Reviewed all 18 GOA rows for E. coli MiaB (tRNA i6A37 to ms2i6A37 radical SAM methylthiotransferase) as part of RADICAL_SAM project Phase 2; no deep research available, so the review was built from cached primary papers (PMID:10572129, 11882645, 15339930, 23542644, 23543739, 18304323), UniProt and QuickGO. Applied the project treatment rule for generic rows, kept terms identical to the human MiaB-subfamily ortholog CDK5RAP1 (GO:0035597, GO:0035600), refined tRNA methylation and tRNA modification to GO:0035600, removed the GrxD/NfuA protein binding row as uninformative, and added a NEW S-adenosyl-L-methionine binding row (IDA, PMID:15339930). Wrote notes, core functions, questions, experiments and a sulfur-donor knowledge gap.
