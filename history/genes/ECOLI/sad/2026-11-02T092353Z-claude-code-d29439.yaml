  summary: 'Create review: E. coli sad (P76149)'
  details: |
    Full review of P76149 (Sad/YneI), created as the reference protein of PANTHER PTHR43217 for the bacterial_4_hydroxybutyrate_oxidation module. All 21 GOA rows adjudicated. Core function is the cofactor-general GO:0009013, since both the NAD+ and NADP+ reactions are curated on the accession from direct assay. GO:0006099 tricarboxylic acid cycle (IBA) was removed with a structured propagation_review: the IBD at PTN000193476 rests on Mycobacterium tuberculosis GabD1, where the GABA shunt is read as a TCA bypass, whereas E. coli has a complete oxidative cycle and Sad feeds succinate into it from outside. GO:0070458 was modified to GO:0110095 cellular detoxification of aldehyde, because succinate semialdehyde contains no nitrogen. Broad class terms refined; arginine and putrescine catabolism kept as non-core substrate context; GABA catabolism accepted on all four rows; homodimerization and the NADP-specific child kept as non-core. Deep research providers are unavailable in this environment, which is recorded in sad-notes.md; nothing was fabricated. Validated clean with just validate ECOLI sad.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  - references
  - description
  details: |
    Second round, responding to the PR review. The GO:0004030 row now refines to GO:0009013 rather than to the two cofactor-specific children, matching the sibling PSEPK sad-I review that handled the identical row and carrying the same ancestry caveat (live GO does not place GO:0009013 below GO:0004030, so no is_a relation between that pair is claimed); the n-butyraldehyde activity reported for the NAD-specific form in PMID:7004491 is weighed there and judged a single qualitative observation that does not establish broad substrate scope. A source_defects entry records that the entry's second Km from PubMed:7011797, labelled "for succinate semialdehyde", is the paper's Km for NAD (WRONG_STATEMENT, UNIPROT, REPOINT, PROBABLE because only the abstract is cached). Strain provenance added to both 1980s reference_reviews: PMID:7011797 used E. coli B and PMID:7004491 used K-12 3300, so each links to P76149 only through PMID:17873044. The word "cytoplasmic" was dropped from the description, since the entry carries no cellular-component annotation and no location assay was found.
  summary: Align the GO:0004030 refinement, record the UniProt Km defect and strain provenance
