  summary: 'Create review: E. coli sad (P76149)'
  details: |
    Full review of P76149 (Sad/YneI), created as the reference protein of PANTHER PTHR43217 for the bacterial_4_hydroxybutyrate_oxidation module. All 21 GOA rows adjudicated. Core function is the cofactor-general GO:0009013, since both the NAD+ and NADP+ reactions are curated on the accession from direct assay. GO:0006099 tricarboxylic acid cycle (IBA) was removed with a structured propagation_review: the IBD at PTN000193476 rests on Mycobacterium tuberculosis GabD1, where the GABA shunt is read as a TCA bypass, whereas E. coli has a complete oxidative cycle and Sad feeds succinate into it from outside. GO:0070458 was modified to GO:0110095 cellular detoxification of aldehyde, because succinate semialdehyde contains no nitrogen. Broad class terms refined; arginine and putrescine catabolism kept as non-core substrate context; GABA catabolism accepted on all four rows; homodimerization and the NADP-specific child kept as non-core. Deep research providers are unavailable in this environment, which is recorded in sad-notes.md; nothing was fabricated. Validated clean with just validate ECOLI sad.
