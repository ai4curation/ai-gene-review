  summary: 'RADICAL_SAM: cite GOA rather than the project for the SAM-binding comparator'
  details: |
    Review finding on PR #5691. The GO:1904047 NEW row's comparator check cited other reviews in this project that carry the term, which is circular where those rows are themselves unaccepted proposals: it cannot falsify the claim, and CLAUDE.md is explicit that a systematic absence from GOA should first be read as a convention the reviewer has not identified.

    Replaced with the comparator that is actually in GOA and was verified in the GOA files: GOA annotates GO:1904047 to radical SAM enzymes in the same role by UniRule, in ECOLI/queE (UR000100349), ECOLI/moaA and PSEPK/moaA (UR000101305), and METEA/pqqE and PSEPK/pqqE (UR000098303). Three distinct UniRule systems annotating a radical SAM enzyme's own cosubstrate is positive evidence that GO has no objection to the term, so the absence here is patchy UniRule coverage rather than a convention against it. It also explains why those five genes have an existing row to ACCEPT or MODIFY while this one needs a NEW row.

    Only review.reason changed; the action, evidence code and supported_by quotes are untouched. This reaches outside the Phase 3 scope deliberately, at the reviewer's suggestion, so that the project does not argue two different ways for the same assertion.
