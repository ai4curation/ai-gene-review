  summary: 'Edit review: lipA, review response on PR #5810'
  details: |
    Response to the ai4c-reviewer review on PR #5810, in commits 0c67e0d and 58bb652. No action changed; the evidence attached to them did.

    GO:0042803 keeps MARK_AS_OVER_ANNOTATED, but the rationale is corrected. The CREATE record of 2026-10-31 and the review file both argued that reading a functional homodimer into the IDA was contradicted by both sulfur atoms of one lipoyl group coming from the same polypeptide (PMID:15740115). That inference does not follow: the result refutes the inter-subunit sulfur-sharing model, so it retires the rationale that made the 1:2 LipA:product stoichiometry look like evidence for an obligate dimer, but a homodimer whose subunits each run a complete reaction is untouched by it. The earlier record was accurate about the file as it then stood, so this is appended rather than edited in place, per docs/history.md.

    The corrected rationale: no defined homodimer has been established. UniProt declines to choose ('Monomer or homodimer.'), LipA alone runs near its monomer mass by molecular-sieve chromatography (44.1 kDa against 38.2 theoretical, PMID:29051382), and the one defined complex that experiment resolves is a 1:1 LipA-NfuA heterodimer. Two earlier reports that did read a homodimer -- PMID:10747808 'Biotin synthase and lipoate synthase are homodimers' and PMID:15157071's two-LipA model -- are now cited in the row and stated to be superseded on this point, rather than left unmentioned while the review concluded against them.

    Three rows gained the evidence their reasons actually rest on. The GO:0005737 IDA row cited only the UniProt catalysis sentence, which says nothing about localisation; it now cites the PMID:18304323 cytosolic-fraction measurement and CC:SUBCELLULAR LOCATION. The GO:0009107 IMP row rested on PMID:8444795's genetics but quoted only UniProt; it now quotes that paper's glycine-cleavage requirement and its failure to convert protein-bound octanoyl in vivo, plus the PMID:29051382 growth defect.

    Added knowledge_gaps (2), suggested_questions (3) and suggested_experiments (3), which the review had omitted while naming genuine unknowns in prose. Both gaps are RESIDUAL_SUBGAP: the core function is settled and each hole is one load-bearing mechanistic piece. The first is the oligomeric state under turnover, which is where the GO:0042803 row now points instead of litigating the question in its reason. The second is which carrier rebuilds the sacrificed auxiliary cluster in vivo, drawn at the width the evidence leaves open -- NfuA and [4Fe-4S]-loaded IscU are both competent in vitro, and a tolerated nfuA deletion implies a second route in the cell whose identity is unknown. ECOLI/bioB records the analogous question for its own consumed cluster.

    lipA-notes.md carried the same retired inference in its undated 'Quaternary structure' section, which the next editor would read as current. Rewritten to state what PMID:15740115 shows, to record both superseded reports, and to mark the old inference as one those notes previously drew wrongly. The dated 2026-10-31 journal entry below it is left as written.

    Two wording tidy-ups from the same review: the first gap's statement carried the same 'defined catalytic complex measured' overclaim that was removed from the GO:0042803 reason, and the IscU provenance quote was truncated short of naming the carrier. The fuller cache text is verbatim including its bracketed [4Fe-4S] span, which confirms that the validator's bracket exemption is about content (literal_bracket_patterns keeps any bracketed span containing a digit) rather than about the exact [4Fe-4S] string noted in the CREATE record.

    Also declined one reviewer suggestion, correctly: the IMP row's acts_upstream_of_or_within qualifier mirrors lipA-goa.tsv, so rewriting it for the GO:0009249 replacement would misreport the source row. The reviewer withdrew it.
