  summary: Review E. coli lipA (lipoyl synthase), closing the RADICAL_SAM gene scope
  details: |
    Completed the last unreviewed gene in the RADICAL_SAM project. 19 rows: 8 ACCEPT, 7 MODIFY, 2 REMOVE, 1 MARK_AS_OVER_ANNOTATED, 1 NEW; 3 core functions (GO:0016992 lipoate synthase activity, GO:0051539, GO:1904047); status COMPLETE.

    An earlier attempt was interrupted by a safety classifier partway through writing this file, with an instruction not to reproduce that content. This review was written from the notes that attempt had already committed, plus the cached publications and the UniProt record, rather than by reissuing the blocked text or routing the task through another agent. Nothing in the subject matter needed special handling.

    Generic rows follow the project treatment rule: GO:0003824 and GO:0016783 MODIFY to GO:0016992 (the LIAS precedent for the sulfurtransferase row), GO:0051536 MODIFY to GO:0051539, and the three GO:0051539 rows ACCEPT as core cofactor binding. GO:1904047 added as a NEW IC row, grounded in the HAMAP-curated cofactor note recording an exchangeable S-adenosyl-L-methionine on the radical SAM cluster and in the measured two-SAM stoichiometry, with the comparator taken from GOA's UniRule coverage rather than from this project's own proposals.

    Two obsolete GO:0009107 rows MODIFY to GO:0009249 protein lipoylation, which is also the biologically right target: free octanoate is not a substrate, so the cofactor is assembled in place on the carrier protein. The IMP row's underlying genetics stands even though that paper's model of LipA acting on free octanoate was later superseded.

    Both cytoplasm rows MODIFY to cytosol. GO:0005737 is not one of the five root organelle terms projects/ORGANELLES.md exempts from refinement, and GO:0005829 is carried by IDA from a cytosolic proteome measurement.

    GO:0042803 protein homodimerization is MARK_AS_OVER_ANNOTATED rather than REMOVE: the IDA observation is a monomer/dimer purification mixture, which is real, so the term is not false, but reading a functional homodimer into it is contradicted by UniProt's own 'Monomer or homodimer', by both sulfur atoms coming from the same polypeptide (PMID:15740115), and by the 1:1 NfuA complex (PMID:29051382).

    The two GO:0005515 rows REMOVE under the protein-binding policy. Their informative content is asserted better elsewhere: AceF and SucB carry the lipoyl domains LipA modifies, so they are substrates of GO:0016992, and NfuA's role is auxiliary-cluster regeneration, which is recorded in the core function description.

    Validation note for later editors: the supporting_text checker strips square brackets as editorial, so a quote containing [lipoyl]H-protein fails although it is verbatim in PMID:15157071; [4Fe-4S] is exempt as scientific notation. The quote uses the sanctioned ... form for non-contiguous parts instead.
