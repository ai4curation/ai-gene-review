  summary: Review F-plasmid traB and remove a cross-plasmid ATPase annotation
  details: |
    First review. The single GOA row, GO:0016887 ATP hydrolysis activity by IDA, is REMOVEd as attributed to the wrong protein: the cited paper characterises the VirB4 homologue of pKM101, which has its own accession (Q46698, 866 aa, TrbE/VirB4 family), while P41067 is the 475 aa TraB of plasmid F and ColB2 in the TraB family. Four independent facts separate them and F already assigns the VirB4-family role to TraC. Reference marked MISCITED. Four terms proposed in its place from the F-type outer-membrane core complex structure, where TraB forms the central cone; all carry ISS because the structure is of an F-family plasmid rather than F itself.
