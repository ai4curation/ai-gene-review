  summary: 'Review: ECOLI ygbF (cas2)'
  details: |
    Completed review of the E. coli K-12 Cas2 adaptation-complex subunit. 5 annotations resolved: 3 ACCEPT, 2 MODIFY (both bare GO:0005515 to GO:0030674 protein-macromolecule adaptor activity). The review establishes that Cas2 is non-catalytic but not functionless: deleting the beta6-beta7 hairpin destroys complex assembly, CRISPR-DNA binding and acquisition while leaving the putative active site intact, whereas active-site substitutions remain fully functional. This corrected modules/crispr_cas_adaptive_immunity.yaml, which had asserted no molecular function for Cas2 on the mistaken premise that non-catalytic implies no MF; the module now carries GO:0030674 and its knowledge gap is narrowed to the molecular-ruler behaviour alone. The UniProt endoribonuclease name was adjudicated as a family-level holdover resting on archaeal homologues with no assay on the E. coli protein; GOA carries no nuclease row, so nothing propagates today, and the issue is recorded in suggested_questions.
