  summary: 'Create review: E. coli rbsB'
  details: |
    New review of all 21 GOA rows for the periplasmic ribose-binding protein RbsB. Four bare protein-binding rows were removed. Periplasmic space and transmembrane transport were refined with MODIFY, and the two generic membrane rows are marked over-annotated. Ribose binding and positive chemotaxis are accepted as core functions. A D-ribose binding term is proposed, because GO:0048029 has no ribose child in OLS, and a suggested question covers the RbsB-Trg docking activity. No deep research was available; this is noted in rbsB-notes.md.
