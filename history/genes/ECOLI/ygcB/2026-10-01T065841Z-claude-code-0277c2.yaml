  summary: 'Review: ECOLI ygcB (cas3)'
  details: |
    Completed review of the E. coli K-12 type I-E Cas3 helicase-nuclease. 12 annotations resolved plus one NEW: 6 ACCEPT, 3 MODIFY, 2 KEEP_AS_NON_CORE, 1 NEW. The GO:0003724 RNA helicase IBA was retargeted to GO:0033677 DNA/RNA helicase activity: the argument is at the PAINT node, not the similarity score, since the ancestral activity propagated from genuine DEAD-box donors is duplex-RNA unwinding whereas Cas3 was measured unwinding the RNA strand out of an RNA:DNA hybrid, and the two terms are siblings under GO:0004386 with neither subsuming the other. GO:0008296 was refined to GO:0008310 because the measured exonuclease is single-strand-restricted. GO:0099048 added as NEW after a comparator check showed every other cas gene of the same locus carries it by IDA with Cas3 the sole absentee. This review also corrected the module's Cas3 annoton, which now asserts GO:0000014 as the committing HD nick with GO:0008310 and GO:0033677 named as coupled activities, and cites PMID:22521689 instead of citing the GO term as evidence for itself.
