    Re-review of the IBA REMOVE on GO:0019344 L-cysteine biosynthetic process (IBD at PTN000211591). The action stands: E. coli MetB consumes cysteine and E. coli has no reverse trans-sulfuration. The old text said the seeds were all gamma-lyases and that the term was over-propagated to the bacterial gamma-synthase branch as a whole. That misstated the tree: M. tuberculosis MetB (P9WGB7, IMP PMID:15576367 per QuickGO) is a seed and shares the bacterial node PTN000211711 with E. coli MetB. Summary, reason and source comment now state that, and name PTN001720873 (11 leaves, no seed) as the clade to block, matching the PTHR11808 family review. No action changed; quotes untouched.
