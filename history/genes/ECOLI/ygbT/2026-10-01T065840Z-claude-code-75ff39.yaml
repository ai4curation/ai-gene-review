  summary: 'Review: ECOLI ygbT (cas1)'
  details: |
    Completed review of the E. coli K-12 type I-E Cas1 protospacer integrase. 24 annotations resolved: 11 ACCEPT, 4 MODIFY, 5 KEEP_AS_NON_CORE, 3 REMOVE, 1 UNDECIDED. The three REMOVEs are bare GO:0005515 rows removed on informativeness, not correctness, as the protein_binding_policy check requires. GO:0017108 5'-flap endonuclease was generalised to GO:0004520 because the term's definition excludes other DNA structures while the cited paper's own figures show cleavage of Holliday junctions, 3'-flaps, splayed arms and forks; GO:0008821 was kept as non-core as a genuine IDA reinterpreted as integrase-active-site disintegration chemistry. Confirmed via QuickGO that GO:0043571 and GO:0099048 are in disjoint branches, so both legitimately apply. Two new terms proposed: protospacer integrase activity (GO:0004520 captures only the cleavage half of a concerted cleave-and-join reaction; GO:0008907 integrase activity was deliberately not used, being scoped to RNase H fold integrases that Cas1 lacks) and protospacer length determination activity.
