  details: |
    New review of all 18 GOA rows for the cytosolic ribokinase RbsK. RbsK has no protein-binding rows and is not a transporter subunit. Ribokinase activity is accepted from direct assays. Kinase, phosphotransferase, D-ribose metabolic process, cytoplasm and metal ion binding rows were refined with MODIFY to ribokinase activity, D-ribose catabolic process, cytosol and potassium ion binding. Homodimerization, ATP binding and carbohydrate phosphorylation are kept as non-core. No deep research was available; this is noted in rbsK-notes.md.
