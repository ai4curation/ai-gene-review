  summary: 'Retrospective audit corrections: sucC'
  details: |
    Corrections after a retrospective audit (2026-11-12) of the succinyl-CoA synthetase reviews (eleven subunit reviews, the families PTHR11117 and PTHR11815, and the tca_cycle module), followed by a cross-file consistency pass. This record supersedes the reading in the 2026-11-11 records where they differ. No annotation action changed. GO:0003824 catalytic activity (IEA) stays TOO_GENERAL; the reason is now worded the same way in all eleven subunit reviews (true but uninformative, entailed by the accepted specific activity). Status INITIALIZED -> DRAFT. Five references added (among them PMID:2496297, PMID:16445752, PMID:2254275 and PMID:27487822) and quoted on the GO:0006104 and GO:0006099 rows. Reference verdicts: the high-throughput papers and the OpenScientist report VERIFIED -> UNVERIFIED; the OpenScientist claim that Pro20 is the molecular determinant of ADP preference is a separate DISPUTED finding superseded by PMID:22751660. The statement that fungal enzymes do not use GTP now names the S. cerevisiae enzyme only. Validated with just validate ECOLI sucC.
