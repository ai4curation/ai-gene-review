  summary: 'Create review: aslB'
  details: |
    Created the ai-gene-review for E. coli K-12 aslB (P25550) as part of RADICAL_SAM project Phase 2; no deep research was available for this gene, so the review was built from cached primary literature, PubMed searches and UniProt. Reviewed all five GOA rows: the generic radical SAM rows were handled per the project treatment rule (GO:0003824 and GO:0051539 KEEP_AS_NON_CORE because no reaction is established, GO:0051536 MODIFY to GO:0051539), GO:0016491 and the ISS GO:0051604 protein maturation row were left UNDECIDED because the E. coli K-12 knockout evidence is negative for Cys-type sulfatase maturation while a BL21 overexpression report is positive and the Ser-type substrate AslA was never tested. Added a reproducible bioinformatics analysis (aslB-bioinformatics/) mapping the C. perfringens anSME cluster, SAM and catalytic-base residues onto AslB, YdeM and Klebsiella AtsB, which shows the catalytic machinery is intact. No core functions asserted; one BIOLOGY knowledge gap plus suggested questions and experiments.
