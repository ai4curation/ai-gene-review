  summary: Record OpenScientist finding that Ser-type typing and the aslB-aslA operon
    argument cannot assign the AslB substrate
  details: |
    Ran an OpenScientist deep-research job (kgap-aslb-substrate-assignment) on the knowledge gap covering the substrate and reaction of AslB. The gap stays OPEN, with two routes to it now closed off, which is the useful outcome.

    The run was blinded to this gene's local bioinformatics analysis and independently reached the Ser136 assignment that this review's own resolution already names, reporting the motif SSPTR in AslA. It finds E. coli K-12 encodes exactly three type I sulfatases, with AslA and YdeN both Ser-type and YidJ the single Cys-type enzyme, the other proteins returned by the sulfatase Pfam query being alkaline-phosphatase-superfamily phosphotransferases with no sulfatase-context motif.

    That typing is compatible with an AtsB-like maturase acting on AslA but discriminates nothing, for two reasons the run states explicitly: characterised anSMEs are dual-substrate and recognise substrates through backbone hydrogen bonding with low sequence specificity, and AslB itself raised the activity of both Cys-type and Ser-type heterologous sulfatases; and the typing cannot select AslA over YdeN, since both are Ser-type.

    The genomic-context argument, which is the one my hypothesis proposed as the discriminator, fails outright on inspection. In the K-12 reference genome aslB and aslA are convergent, pointing towards each other with about 158 bp between their stop codons, and convergent genes lie in separate transcription units by definition, so the two cannot be in one operon. The characterised Ser-type precedent atsB-atsA is co-oriented with 44 bp between the genes and the maturase first, and the second E. coli pair reproduces that arrangement, ydeM and ydeN being co-oriented about 51 bp apart, while the aslB-aslA pair does not. The run also reports no dataset showing the two genes co-expressed and none reporting AslA Ser136 as formylglycine-modified, with all four proteins at protein-existence level 3.

    The curation consequence recorded is the run's own: AslB should hold family-level radical SAM and iron-sulfur cluster terms and should not carry a substrate-specific statement naming AslA. That is how the review already stands, with its protein-maturation row left UNDECIDED, so no annotation action was taken.

    Verification note: none of aslA, ydeN or yidJ is in this repository, so the SSPTR motif, the three-sulfatase census, the gene coordinates and orientations and the proteomics absence could not be checked locally. Only the aslB record's own radical SAM and SPASM domain assignments and its 411-residue length were confirmed. The Ser136 agreement with the review's existing material is the one cross-check available here.
