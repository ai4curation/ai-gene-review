  summary: 'Create review: ECOLI queG'
  details: |
    Full review of every GOA annotation for the Escherichia coli K-12 queuosine-pathway enzyme queG, created for the bacterial preQ1 incorporation and queuosine maturation module, which needed reviewed exemplars outside Pseudomonas. These four proteins are the PAINT seeds of their PANTHER families, so they also serve as the reference proteins of the family reviews. Cached publications were read for every experimental row; generic terms were refined to the specific pathway terms, matching the verdicts already recorded for the Pseudomonas putida orthologs. Deep research generation was unavailable in this environment (no provider API keys), so the review was built from the UniProt record and the cached literature; no provider file was fabricated. Validated clean with just validate ECOLI queG.
