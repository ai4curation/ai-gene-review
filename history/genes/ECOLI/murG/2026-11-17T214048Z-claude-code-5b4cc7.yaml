  summary: Keep the GO:0050511 rows as non-core and drop the EcoliWiki/EcoCyc source
    defects
  details: |
    Second review round on PR #6492. The PR stated opposite conclusions about the same annotations: the PTHR22926 and PTHR21015 family reviews assess the PAINT nodes sound on the strength of the E. coli experimental rows, while these gene reviews MODIFYed those same rows to the meso-diaminopimelate sibling and filed WRONG_TERM REPOINT source defects against EcoCyc and EcoliWiki. The family-review position is the correct one: these are IDA, IMP and EXP rows, both cited papers are abstract-only in this repository's cache, and a correction request against an experimental annotation whose full text has not been read is exactly the overruling that CLAUDE.md forbids. The four source defects are dropped and the L-lysine-stem rows become KEEP_AS_NON_CORE, a demonstrated but non-physiological capability of the organism's own enzyme; the meso-diaminopimelate sibling remains the core molecular function, and the fix is left where it belongs, upstream and additive (a stem-agnostic parent in GO, and the sibling term paired at the PAINT node).
