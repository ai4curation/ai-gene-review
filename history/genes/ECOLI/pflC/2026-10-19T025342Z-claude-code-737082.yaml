  details: |
    Created the gene review for E. coli K-12 pflC as part of RADICAL_SAM project Phase 2 (uncharacterised glycyl-radical-enzyme activase paralogs). No deep research was available (falcon 403; asta returned nothing). Built from UniProt, cached primary papers (PMID:39283600, PMID:42361324, PMID:7773398, PMID:24561554), PubMed and a reproducible genome-context/sequence analysis in genes/ECOLI/pflC/pflC-bioinformatics. Reviewed every GOA row; generic radical SAM rows treated under the project rule's catalysis-not-established branch; the PFL-specific EC 1.97.1.4 / GO:0043365 over-annotation handled per the pflA/nrdG pattern (REMOVE where the substrate is not PflB), general activase activity GO:0043364 retained; protein-binding rows removed.
