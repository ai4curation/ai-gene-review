  summary: Review Antigen 43 and decline autotransporter activity
  details: |
    First review. All six GOA rows were cellular_component, with no molecular function or process for the textbook classical autotransporter of this organism. Reviews all six, marking extracellular region as over-annotated and periplasmic space as non-core since UniProt assigns it to the precursor by similarity. Proposes type V secretion and cell aggregation. Deliberately does NOT propose GO:0015474 autotransporter activity: its definition asserts the passenger-bearing protein does the transporting, and the references establishing the architecture propose instead that autotransporters are substrates of a secretion machine. Recorded as a knowledge gap rather than resolved by picking the older model.
