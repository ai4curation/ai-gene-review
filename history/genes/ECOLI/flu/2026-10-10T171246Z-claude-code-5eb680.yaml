  summary: Evidence the homotypic clause of the proposed self-associating adhesin
    term
  details: |
    PR re-review found that the proposed term 'self-associating adhesin activity' rested, for its one distinguishing feature, on citations that do not show it: both supported_by quotes came from PMID:16804184, an abstract-only record reporting a cell-level autoaggregation phenotype and its effect on motility, with nothing on Ag43-Ag43 self-recognition. The same unevidenced homotypic claim appeared in core_functions[0] and in the top-level description. Looked the citation up through Europe PMC rather than relying on the reviewer's recollection and cached PMID:14651628 (Klemm P, Hjerrild L, Gjermansen M, Schembri MA, Structure-function analysis of the self-recognizing Antigen 43 autotransporter protein from Escherichia coli, Mol Microbiol 2004;51(1):283-96) with just fetch-pmid. Its abstract supplies three usable statements: Ag43 is a self-recognizing surface adhesin; the region responsible for autoaggregation lies in the N-terminal one-third of the passenger domain, localised by linker insertion mutagenesis and by domain swapping between naturally occurring clumping and non-clumping variants; and the interaction is between interacting pairs of Ag43alpha domains. Added it as a reference with four findings and a VERIFIED reference_review, and used its quotes as support on the proposed term, on core_functions[0], and behind the description sentence. The chemistry proposed for the pairing (ionic contacts between charged residues) is hedged in the source and is reported as proposed rather than settled; the homotypic character is not hedged. core_functions[0] now names the activity through proposed_molecular_function, which is the documented route for a core activity GO has no term for, so the review no longer describes a self-associating adhesin while asserting no activity at all. Also recorded on PMID:16804184 that MEDLINE lists an erratum (Microbiology. 2006 Sep;152(Pt 9):2865); it is not separately indexed with a PMID, so no identifier is asserted for it, and the findings taken from that paper are limited to the abstract statements quoted.
