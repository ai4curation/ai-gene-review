  details: |
    IBA re-review 2026-11-21 (projects/IBA_REVIEW/rereview-2026-11-21, batch N02). The IBA row for GO:0006779 porphyrin-containing compound biosynthetic process stays REMOVE, but its summary, reason and propagation_review comment were rewritten. The earlier text said the IBD at PTN000358281 rested on HemN-type enzymes and that HemW lies outside the clade performing the step. The PANTHER tree shows that two of the four seeds (B. subtilis P54304 and Synechocystis P73245) are HemW-subfamily proteins in the same clade as E. coli HemW (PTN008552848). The REMOVE now rests on the direct evidence for E. coli HemW (no coproporphyrinogen III dehydrogenase activity, cannot replace HemN, PMID:29282292) and notes that the two HemW seeds do not show a biosynthetic step (PMID:20194361 abstract reports no activity and no mutant phenotype for the Synechocystis HemW-type protein). Proposed PAINT fix: move the IBD to the HemN node PTN000358335. No other row was changed; supporting_text quotes unchanged. just validate passes.
