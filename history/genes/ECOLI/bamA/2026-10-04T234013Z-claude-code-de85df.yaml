  summary: Full review of 50 GOA annotations for E. coli bamA; propose GO:0032977
    membrane insertase activity as the missing molecular function
  details: |
    Completed the review from the seeded all-PENDING state. Actions: 27 REMOVE (every GO:0005515 protein binding row), 21 ACCEPT, 2 MODIFY, 1 NEW.

    The 27 protein binding rows were removed rather than modified or marked over-annotated, per the repo policy that generic protein binding is uninformative rather than an over-claim. Twenty-five of them record BamA touching a Bam lipoprotein, which GO:1990063 Bam protein complex already states with meaning (three IDA rows). No more specific molecular function could be promoted from them, because scaffolding the lipoproteins is not BamA's activity. Two record RcsF, which is a substrate rather than a partner subunit; those are removed with a separate rationale and the ontology gap recorded in core_functions.

    The MODIFY rows are both over-general ancestors of terms the record already carries experimentally: GO:0016020 membrane (IDA) to GO:0009279, and GO:0071709 membrane assembly (IEA from the BamA-specific IPR023707) to GO:0043165. GO:0019867 outer membrane (IEA from IPR000184 + IPR010827) was deliberately NOT narrowed, because both domains occur in mitochondrial and plastid Omp85 proteins where cell outer membrane would be false.

    The one NEW annotation is GO:0032977 membrane insertase activity (IDA, PMID:20378773), asserted as enables. The comparator check settles that the absence from GOA is a gap, not a convention: yeast SAM50, the Omp85-family beta-barrel insertase of the mitochondrial outer membrane, carries the term by IMP (PMID:14570913), and E. coli YidC carries it by IMP and IDA. SAM50's annotation was never placed as an ancestral IBD, which explains why no IBA brought the term to the bacterial clade. This resolves the explicit curator synthesis flagged in modules/bacterial_type_v_secretion.yaml.

    No annotation proposed for the CdiA receptor role: BamA is the recognised epitope and performs no step of contact-dependent growth inhibition, and GO has no CDI term.

    On BAM versus TAM: none of the 22 seeded references mentions TamA or TamB. Recorded what is supportable (the two are framed as parallel modules of one machine; TamA is in BamA's family; BAM is competent on EspP by crosslinking per PMID:19850876, added by this review) and left the module's ONE_OR_MORE insertase axis unnarrowed.
