  summary: Remove the CdiA-receptor knowledge gap; it is not a biological unknown
  details: |
    PR re-review observed that the one knowledge_gaps entry retained on this review, on BamA's role as the CdiA receptor, contains no biological unknown: its content is that GO has no contact-dependent-growth-inhibition term, that the comparator receptor FhuA carries only plain binding terms, and that being recognised by a process is not participating in it. No wet-lab experiment would close any of that, so the BIOLOGY value alongside ONTOLOGY was not earned and CLAUDE.md's prohibition applies. Removed the entry. Nothing was lost with it: the full reasoning, including the PMID:23882017 quotes on the loop 6 and 7 epitope and the FhuA comparator, already stands in bamA-notes.md under 'The CDI receptor role, and why no annotation is proposed for it', and the ontology question already stands in suggested_questions. Added a short provenance paragraph to that notes section recording the removal and why, so the decision is traceable from the notes rather than only from the PR. The two knowledge gaps the re-review judged well founded (flu's autotransporter-activity gap and the type V module's contested self-transport gap) are untouched.
