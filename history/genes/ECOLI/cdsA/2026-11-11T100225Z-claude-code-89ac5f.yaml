  summary: Review ECOLI cdsA (P0ABG1) GO annotations
  details: |
    Reviewed all 14 GOA rows on P0ABG1 (CdsA, phosphatidate cytidylyltransferase) and added 2 NEW rows, closing the last open follow-up in projects/LIPID_DIVIDE.md: CdsA is the single reaction joining bacterial_phosphatidic_acid_synthesis to the CDP-DAG modules and had no bacterial gene review anywhere in the repository. Twelve ACCEPT, two MODIFY, no REMOVE. The four GO:0004605 rows (EXP, IDA, IBA, IEA) are accepted as core; GO:0016772 is modified to GO:0004605 as a grandparent class the gene already carries specifically, and GO:0016020 membrane is modified to GO:0005886, which is not shielded by the root-organelle exception. The four GO:0016024 rows are accepted, with a WRONG_QUALIFIER source defect reported to EcoCyc on the IDA row (acts_upstream_of_or_within should be involved_in, since the enzyme catalyses the reaction that constitutes the process). All four GO:0005886 rows are accepted: in a diderm the inner membrane is the plasma membrane, so no more specific bacterial term exists to refine to, and the IBA's is_active_in qualifier is right because surface-dilution kinetics put catalysis at the bilayer. NEW rows: GO:0005887 integral component of plasma membrane (IC) from the experimental C-terminal topology assignment plus eight predicted TM helices and detergent-dependent purification, added beside the plasma-membrane rows rather than substituting, with no side-of-membrane term asserted from a single topological datum; and GO:0009247 glycolipid biosynthetic process (IMP, non-core) for the MPIase branch, which passes the NEW bar because the entity performing the step is CdsA itself (depletion leaves MPIase undetectable, overproduction raises it about three-fold, and vesicles and partially purified CdsA8 form the first MPIase intermediate from phosphatidic acid, CTP and GlcNAc-1-phosphate). No protein-integration or translocation term was asserted, since MPIase rather than CdsA acts on the substrate protein. Two BIOLOGY knowledge gaps: whether wild-type CdsA itself transfers GlcNAc-1-phosphate or merely supplies CDP-diacylglycerol to a separate transferase, the clean in vitro demonstration having used the Y207H CdsA8 mutant; and the absence of any identified catalytic residues, catalytic face or established metal requirement, so no cofactor is asserted anywhere. Lineage checked: the cdsA IBAs run through PTN000349517 while the eukaryotic CDS node is PTN000349519, so no eukaryotic transfer is involved, and Tam41 appears in no WITH/FROM. No PAINT slice is cached for PTHR46382, so nothing is asserted about where in the tree the IBD sits. All four GOA-cited publications are abstract-only and PMC218635 returned 403, so every quote from them is abstract-level. Validates clean.
