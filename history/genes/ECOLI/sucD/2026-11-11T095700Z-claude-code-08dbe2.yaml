  details: |
    Written as part of the evolutionary review of the succinyl-CoA synthetase subunit families PTHR11117 and PTHR11815, using the family analysis in genes/yeast/LSC2/LSC2-bioinformatics. All 21 GOA rows reviewed. ADP-forming activity accepted as core; GDP-forming activity kept as non-core; protein autophosphorylation marked over-annotated because the phosphohistidine is a catalytic intermediate; cytoplasm modified to cytosol; protein binding rows removed under the policy. One superseded statement in PMID:1986797 flagged as an overturned finding. Fitness data could not be fetched. Validated with just validate ECOLI sucD.
