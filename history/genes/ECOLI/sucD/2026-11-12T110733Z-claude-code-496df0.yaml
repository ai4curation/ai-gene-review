  summary: 'Retrospective audit corrections: sucD'
  details: |
    Corrections after a retrospective audit (2026-11-12) of the succinyl-CoA synthetase reviews (eleven subunit reviews, the families PTHR11117 and PTHR11815, and the tca_cycle module), followed by a cross-file consistency pass. This record supersedes the reading in the 2026-11-11 records where they differ. No annotation action changed. GO:0003824 catalytic activity (IEA) stays TOO_GENERAL; the reason is now worded the same way in all eleven subunit reviews (true but uninformative, entailed by the accepted specific activity). Status INITIALIZED -> DRAFT. GO:0046777 protein autophosphorylation stays MARK_AS_OVER_ANNOTATED with a merged reason. The GO:0004776 reasons name S. cerevisiae LSC1 in place of fungal alpha subunits, and a dead RESULTS.md quote was deleted. PTN000122012 is called the LUCA node of the alpha-subunit family, not the root. Five references added. Reference verdicts: the high-throughput papers and the OpenScientist report VERIFIED -> UNVERIFIED; the PMID:1986797 finding was split, with succinate binding on the beta subunit CORROBORATED by PMID:27487822. Validated with just validate ECOLI sucD.
