  summary: Review E. coli efp (P0A6N4) for the EF-P stall-rescue module
  details: |
    New review of all 19 GOA rows for the E. coli EF-P exemplar. Core: GO:0003746 with GO:0006414 and GO:0072344, cytoplasm and cytosol. Ribosome binding (IDA) and negative regulation of translational frameshifting (IMP) retained as non-core, since both follow from the same P-site tRNA stabilization; regulation of translation and peptide biosynthetic process kept non-core to match the PSEPK sibling. GO:0043043 was left as KEEP_AS_NON_CORE rather than modified, because translation is no longer an is_a descendant of it in the current ontology, so a MODIFY would be lateral. Provider deep research was unavailable in this environment; efp-notes.md records that and the searches performed.
