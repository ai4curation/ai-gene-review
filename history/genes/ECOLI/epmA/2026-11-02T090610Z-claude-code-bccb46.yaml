  summary: Review E. coli epmA (P0A8N7) EF-P beta-lysine ligase
  details: |
    New review of all 19 GOA rows. Core: GO:0052868 protein-lysine lysyltransferase activity (the term's definition is the EpmA reaction RHEA:83435), involved in GO:0043687, in the cytosol. The LysRS-derived propagations (tRNA binding, lysine-tRNA ligase activity, aminoacyl-tRNA ligase activity, lysyl-tRNA aminoacylation, tRNA aminoacylation for protein translation) are removed on biological grounds with propagation_review metadata: PoxA/EpmA lost the anticodon-binding domain and charges no tRNA. Cytoplasm modified to cytosol, which the gene already has by IDA. GO:0043687 is ACCEPT here while the same row is over-annotated on EpmB, because EpmA performs the covalent step and EpmB only supplies the donor.
