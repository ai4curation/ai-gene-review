  summary: Address PR 5569 evidence and annotation review for metL
  details: 'Live QuickGO definitions checked on 2026-10-26: GO:0004022 explicitly uses NAD+; GO:0004412
    explicitly uses NADP+. Homoserine is a primary alcohol, so its NAD-dependent oxidation fits GO:0004022
    without implying ethanol metabolism or substrate promiscuity. Both can refine their common broad oxidoreductase
    ancestor. Retain the NAD-dependent catalytic capacity as core across all four enzymes, while distinguishing
    directly measured yeast kinetics from conserved inference in other targets. Missing native cofactor
    comparisons limit claims about physiological preference, not the biological centrality of the supported
    homoserine reaction. Earlier fungal MODIFY to GO:0004412 erased the cofactor distinction and is superseded.
    Sources: https://www.ebi.ac.uk/QuickGO/term/GO:0004022 and https://www.ebi.ac.uk/QuickGO/term/GO:0004412
    . Replaced genetic-map-only support for biosynthetic processes with the curated UniProt CC:PATHWAY
    statements identifying MetL steps 1 and 3. PMID:4148765 is not treated as biochemical pathway evidence.
    Payload comparison preserves all 20 original annotations. NAD-dependent alcohol dehydrogenase and
    NAD+ binding change from KEEP_AS_NON_CORE to ACCEPT as integral catalytic properties; evidence limitations
    remain explicit. Focused validation and rendering are recorded in .cache/module-audit-logs/pr5569-final-report.md;
    no module, tracker or fetched-source edit.

