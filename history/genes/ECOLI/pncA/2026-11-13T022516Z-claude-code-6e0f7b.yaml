  details: |
    Supplements the earlier pncA record, whose claim that the nicotinamidase-amidase parentage was confirmed rested on a local ontology build. Re-checked against live services: the QuickGO is_a ancestors of GO:0008936 are GO:0016810, GO:0016811, GO:0003824, GO:0004040, GO:0003674 and GO:0016787, and OLS lists GO:0004040 amidase activity as the direct parent. The parentage therefore stands, and the amidase row's reason now cites this evidence path. Also dropped the truncated-title supported_by from the cytosol row and replaced the deep-research quote with a complete sentence.
