  summary: 'Review: PSEAB cas3'
  details: |
    Completed review of Pseudomonas aeruginosa UCBPP-PA14 type I-F cas3, an exemplar cited by both CRISPR modules: fused Cas2-3 helicase-nuclease; GOA held two CACAO rows and zero molecular functions where E. coli Cas3 has nine, so three generic-parent functions were proposed (GO:0004536, GO:0004386, GO:0005524) deliberately rather than the E. coli children, because no assay on the PA14 protein resolves exo- versus endonucleolytic mode. All seven bare GO:0005515 IPI rows across cas6f, csy1, csy2 and csy3 were modified uniformly to part_of GO:0032991, since what the IPIs establish is Csy complex membership and GO has no cellular-component term for a CRISPR surveillance complex. GO:0099048 added as NEW on all six after a comparator check: every E. coli Cascade subunit plus Cas1 and Cas2 carries it by IDA while no PA14 cas or csy gene did, which is a per-strain curation lag rather than a convention. No term was invented for crRNA-guided target recognition; it is recorded as an open ontology knowledge gap cross-referencing the modules. Conflicting viral-immunity evidence for this locus is recorded as a finding_review with finding_status DISPUTED rather than resolved by picking a side. Host-side mechanism is consistent with the existing genes/BPZF4/AcrF8 phage-side review.
