  summary: New review of P. aeruginosa PA14_60630 (Band7), a vault-like ribotoxin
    defence protein
  details: |
    First functional characterisation (DOI:10.64898/2026.11.20.768214, Whiteley lab preprint). Gene had zero GOA annotations. Added one NEW row: GO:0071237 cellular response to bacteriocin (IMP), justified by deletion/complementation/premature-stop genetics plus a stressor-panel specificity control. Rejected GO:0030153 bacteriocin immunity (classified under toxin metabolic process) and GO:0042742 defense response to bacterium (purified pyocins, not a live competitor). No molecular function or cellular component asserted: the vault-like particle is an AlphaFold prediction and no protein-RNA interaction, structure or localisation exists. Deliberately NOT added to the PTHR14165 family review; UniProt A0A0H2ZHM6 carries PANTHER PTHR10264 and Band7/stomatin InterPro signatures, not IPR039059.
