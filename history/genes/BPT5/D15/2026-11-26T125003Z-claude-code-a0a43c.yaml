- type: EDIT
  outcome: changed
  summary: Wire OpenScientist refutation of the 1973 nick-licenses-late-transcription
    mechanism
  details: |
    Wired an OpenScientist run (kgap-d15-late-transcription) into the knowledge gap
    asking how loss of D15 activity abolishes T5 late gene expression. Status OPEN ->
    NARROWING. Four new references added, each verified against its PubMed record.

    The verdict splits. Separability is still formally untested: nobody has scored late
    transcripts in a D15-defective infection with replication independently controlled,
    and the 1973 observation (PMID:4357874) scored late proteins by gel, lysozyme and
    serum-blocking power in an infection that cannot replicate, with the nick-or-gap
    mechanism offered there as the authors' proposal rather than as a result.

    The specific mechanism, however, is refuted from five independent directions:
    - the enzyme that makes the single-strand interruptions is not D15 but a separate
      145-residue nicking endonuclease identified among the T5 morphogenesis proteins
      and placed in the late structural cluster, so on that placement a mark made by a
      late product would be licensing the programme that produces it;
    - the direct in vitro test is negative (PMID:1095368): nicked versus ligase-sealed
      T5 DNA, same host holoenzyme that reads T5 late promoters, no nick-specific
      effect;
    - the genetic test is negative (PMID:430606): >60 interruption-deficient mutants,
      including a class essentially free of interruptions, all viable;
    - a gyrase-imposed replication block with D15 intact abolishes late expression
      anyway (PMID:2419589);
    - the same replication-plus-late-expression phenotype arises from gene D5, a
      DNA-binding protein with no nuclease activity (PMID:219226).

    This corroborates, from directions the row's own reference does not contain, the
    MARK_AS_OVER_ANNOTATED call this review already makes on the GO:0019086 late viral
    transcription row (IMP, CACAO, PMID:4357874) on the grounds that necessity is not
    participation. No annotation action was changed. The run also reports that of 729
    UniProt entries carrying that term, this protein is the only nuclease.

    Escape routes recorded in the boundary: the 1975 reaction lacked gpC2 and
    gpT5.026, so it shows nicks are not sufficient on bare holoenzyme, not that a nick
    requirement cannot appear with the late factors present; the mutants were scored on
    mature virion DNA, not the replicating concatemer that is the in vivo late
    template; the nickase's late-phase expression is a database annotation corroborated
    only by genomic position; and since no experiment scores late transcripts in a
    D15-defective infection, it is equally unexcluded that late promoters fire normally
    and the proteins fail downstream. The resolution text was extended with the two
    design refinements that follow (include the late factors; use the concatemer).

    Verification done here: all eight load-bearing PMIDs were checked against PubMed.
    The two the run's own validator flagged as possibly confabulated, PMID:32722583 and
    PMID:6287031, are both real records whose abstracts carry the claims made of them,
    so those were lookup failures; neither is cached here, so neither is quoted. Every
    quote used is verbatim in its cached publication (130 quotes verified in this file).
    Not independently checked: the AY587007 coordinates, the permutation test against
    predicted promoters, the nickase's annotated expression phase, and the audit of the
    729 GO:0019086 entries.

    Retrieval limitation: full text was not machine-retrievable for any pre-1990 paper,
    PMC holding them as scanned page images, and the 1980 fractionation paper has
    neither a PMC record nor a DOI. Every pre-1990 claim is abstract-level, and the
    print articles should be obtained before acting on the 1973 and 1980 sources.
