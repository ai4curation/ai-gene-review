  details: |
    De-novo review of the Sindbis virus structural polyprotein (P03316, no UniProt gene name, folder and gene_symbol use the accession) for the CACAO project: all 46 GOA rows judged, two NEW molecular-function rows and two NEW assembly/budding process rows proposed, six per-chain core functions written, and the five mature chains recorded as CLEAVAGE_PRODUCT functional_isoforms mapped to their PRO_ ids. Of the four CACAO rows, GO:0019062 (IMP, PMID:7684466) was accepted as written; GO:0020002 (IDA, PMID:17483865) accepted with a heterologous-oocyte caveat; GO:0061025 (IDA, PMID:10482600) modified to GO:0039654 as a parent-level restatement; and GO:0098029 (IDA, PMID:10482600) modified to GO:0055036 because the term places the envelope spike part_of the capsid, a new failure shape for the CACAO taxonomy, with a replacement term filed under proposed_new_terms.
