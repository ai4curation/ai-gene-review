  details: |
    Audited genes/COTJA/A0A8C2TBA7/A0A8C2TBA7-protnlm-predictions-review.yaml against the source-independence and final-state prose guidelines in .claude/skills/review-function-prediction/SKILL.md.

    Replaced rationale prose with the current assessment, traced biological claims to sequence/domain records, primary publications, and where relevant experimentally grounded curated annotations or reproducible analysis. Removed AI/OpenScientist verdicts as supporting evidence and unsupported error-mechanism claims. Source prediction terms and method/version metadata were preserved. Existing annotation overlap is separated from biological correctness and is not evidence of training-data contamination.

    GO:0004598 (peptidylamidoglycolate lyase activity): CNN -> CNN. The target is assigned to the peptidylglycine alpha-amidating monooxygenase family and contains the PHM/PAL architecture. Structural and substrate-complex experiments on rat PAL establish cleavage of peptidyl-alpha-hydroxyglycine to an amidated peptide and glyoxylate (PMID:19604476), supporting transfer of this conserved reaction to avian PAM. The exact peptidylamidoglycolate lyase activity is already present in cached UniProt and GOA. Domain and reaction evidence support correctness independently of the existing electronic annotation.

    GO:0031418 (L-ascorbic acid binding): COR -> COR. The target contains the conserved PHM copper-monooxygenase module of bifunctional PAM. Pre-steady-state experiments on PHM support ascorbate interaction during reduction and conformational activation (PMID:35380039), providing a biochemical basis for transfer of ascorbate binding to this avian homolog. This concerns the PHM module rather than PAL catalysis and does not specify an unverified binding-site geometry. Ascorbate binding itself is absent from the cached annotations.

    Validation: all 50 PredictionReview documents passed LinkML schema validation; all 77 predictions preserve their original source/term metadata and have category-consistent scores. Checked local evidence paths, cached PMID titles, and all 31 supporting excerpts against their sources. Substantive fields contain current reasoning; revision details are recorded here.
