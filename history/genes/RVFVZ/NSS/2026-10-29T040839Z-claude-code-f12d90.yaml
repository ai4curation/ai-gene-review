  summary: 'Create review: NSS'
  details: |
    De-novo review of all 23 GOA rows for RVFV NSs (P21698) as part of the CACAO community-annotation audit: 14 ACCEPT, 6 MODIFY, 2 KEEP_AS_NON_CORE, 1 REMOVE and 1 NEW molecular function. The six CACAO rows were assessed individually against their cited papers; GO:0039689 negative stranded viral RNA replication (IMP, PMID:16501102) was removed as contradicted by its own source, which reports that NSs-deletion mutants replicate efficiently, and recorded as a source defect. The four rows annotating interferon antagonism to the interferon-signalling branch were modified towards a proposed new term for symbiont-mediated suppression of host type I interferon production, and the two molecular-function rows were refined to GO:1990756 ubiquitin-like ligase-substrate adaptor activity. Deep research was unavailable in this container and the GONUTS wiki was offline, as recorded in NSS-notes.md.
