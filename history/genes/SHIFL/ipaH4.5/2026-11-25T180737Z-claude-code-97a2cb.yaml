  summary: Record OpenScientist refutation of the TBC-domain RabGAP reading of IpaH4.5
  details: |
    Ran an OpenScientist deep-research job (kgap-ipah45-rabgap-plausibility) on the knowledge gap covering whether IpaH4.5 has a second catalytic activity as a Rab31 GTPase-activating protein. The specific TBC-based reading is refuted comprehensively, and the run is careful to separate that from the broader question, which is the distinction the hypothesis asked for.

    There is no TBC domain anywhere in the 574 residues. Two structural-search campaigns tiling the whole chain, including the LRR-NEL linker, produced thousands of alignments across three databases and returned zero hits to any TBC or RabGAP structure, checked by identifier, by superfamily and by name. Reciprocal searches from a TBC-domain structure and from the Shigella RabGAP VirA returned hundreds of hits and no IpaH-family member. A calibrated sequence test that recovers IpaH4.5's genuine NEL-family relatives at high z places it at the shuffled-sequence baseline against reviewed TBC proteins. The protein is fully accounted for by the LRR solenoid and the NEL domain with no unassigned stretch long enough to host a TBC module, and the local P18009 record agrees, carrying LRR and NEL signatures only, the NEL domain at 295-574 and Cys379 as the annotated active site.

    The dual-finger reading fails independently on geometry. The isolated motif matches exist, at Arg41, Arg429, Arg433, Gln146, Gln531 and Gln567, all confirmed in the local record, but they sit in different folds and never converge: the closest motif-derived arginine-glutamine pair is about 30 Angstrom apart against 3.75 and 4.25 Angstrom in the two transition-state reference structures. An unbiased scan found about one per cent of all arginine-glutamine pairs in the protein satisfy proximity and exposure by chance, none of them motif-flagged, so motif-plus-proximity arguments carry almost no specificity here.

    The decisive argument for curation is evolutionary: those four residues are identical in all twelve S. flexneri IpaH paralogs, at the same level as the NEL catalytic cysteine. If they formed a Rab31 GAP site the activity would be family-wide, which conflicts with the reported IpaH4.5-specific effect and with the absence of any reported GAP activity for the other paralogs. Their invariance is explained by NEL fold maintenance.

    Status moved from OPEN to NARROWING rather than closed, because the run states the honest boundary separately: sequence and structure cannot exclude a GAP site built on a novel non-TBC fold, since VirA, EspG and LepB are confirmed Rab GAPs using fold-independent arginine-finger catalysis and all three fail the same TBC tests IpaH4.5 fails. That is absence of positive support, not evidence for the activity, and it is recorded in those terms.

    The Foldseek campaigns and hit counts, the calibrated z-scores, inter-residue distances, chance-pair scan and twelve-paralog conservation were not independently recomputed. No annotation action was taken.
