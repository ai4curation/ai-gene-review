  details: |
    De-novo review of Shigella flexneri IpaH4.5 (P18009), a NEL-domain type III effector E3 ubiquitin ligase, for the CACAO audit: 12 GOA rows judged (3 ACCEPT, 5 MODIFY, 3 KEEP_AS_NON_CORE, 1 NEW added) plus two core functions and a notes file written from direct literature research, since no deep-research provider was available. The six CACAO rows were audited individually; GO:0039604 symbiont-mediated suppression of host translation (IDA, PMID:23083102) is the notable failure, a wrong-molecular-step term whose paper measures NF-kappaB-driven transcription and never assays translation, so it is MODIFYed to GO:0085034 with a source_defects entry rather than removed under the curator-deference rule.
