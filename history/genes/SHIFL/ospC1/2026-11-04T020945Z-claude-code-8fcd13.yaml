  summary: 'Full review of Shigella flexneri ospC1 (Q8VSJ7): 14 GOA rows reviewed,
    one NEW row added'
  details: |
    Reviewed all 14 GOA rows for ospC1 (Q8VSJ7). Actions: 8 ACCEPT (calmodulin binding IDA; host cell cytoplasm IDA; GO:0075135 calcium-signalling suppression IDA; GO:0052041 cell-death suppression IDA; four ADP-riboxanase rows EXP/IDA/IDA/IEA-ARBA), 5 KEEP_AS_NON_CORE (three extracellular-region rows, two host-cell-nucleus rows), 1 MODIFY (GO:0052029 refined to GO:0140886 symbiont-mediated suppression of host interferon-mediated signaling pathway, since the paper blocks all three interferon families), 1 NEW (GO:0140311 protein sequestering activity, the authors' own apo-calmodulin sequestration model, as recommended by the GO-CAM review of gomodel:62b4ffe300005467). Two core functions: arginine ADP-riboxanase blocking apoptotic caspases, and sequestration of Ca2+-free calmodulin blocking the CaMKII-STAT1 interferon branch. Recorded a WRONG_REFERENCE source defect on the host-cell-cytoplasm row: its IDA reference PMID:34409271 is an OspC3 paper whose full text never mentions OspC1, and PMID:16988276 localizes OspC1 directly; the same mis-keying appears in gomodel:62b4ffe300005467. Two BIOLOGY knowledge gaps (unidentified apoptotic substrate; unexplained nuclear pool and PMN-migration phenotype). Literature search recorded in ospC1-notes.md; no deep-research provider available in this environment.
