  summary: 'Full review of Shigella flexneri ospC3 (A0A0H2US87): 24 GOA rows reviewed,
    one NEW row added'
  details: |
    Reviewed all 24 GOA rows for ospC3 (A0A0H2US87). Actions: 14 ACCEPT (two calmodulin-binding IDA rows, which mean different things: cofactor activation of catalysis in PMID:36624349 and host sabotage in PMID:35568036; two host-cell-cytoplasm rows; four GO:0052041 rows; six ADP-riboxanase rows), 2 KEEP_AS_NON_CORE (extracellular region EXP and IEA), 4 MODIFY (three Reactome GO:0005829 cytosol rows re-pointed to GO:0044164 host cell cytosol, since Reactome's human-pathway compartment read on a secreted bacterial effector would assert the bacterial cytosol; GO:0052029 refined to GO:0140886 symbiont-mediated suppression of host interferon-mediated signaling pathway), 2 TOO_GENERAL (GO:0052040 perturbation of host programmed cell death, whose suppression child is accepted four times; GO:0051701 interaction with host, from the Reactome top-level pathway), 1 NEW (GO:0140311 protein sequestering activity). Three core functions: calmodulin-activated arginine ADP-riboxanase of caspase-4/11 Arg314/Arg310; apo-calmodulin binding as an obligatory catalytic cofactor; sequestration of apo-calmodulin blocking the CaMKII-STAT1 interferon branch. One source defect: WRONG_EVIDENCE_CODE (SUSPECTED, CHECK) on the GO:0140740 IDA row keyed to PMID:37014865, a genetic IpaH9.8/GBP1 study whose full text reports no enzyme assay and cites the activity from earlier work. Two BIOLOGY knowledge gaps (how one calmodulin complex serves both cofactor and sequestration roles; the caspase-11 species discrepancy). Also recorded the 2013 p19/p10-heterodimerization mechanism as an OVERTURNED finding on PMID:23684308, superseded by PMID:34671164. Literature search recorded in ospC3-notes.md.
