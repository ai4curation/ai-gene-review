  summary: 'Create review: Q03184'
  details: |
    New review of the Trichomonas vaginalis hydrogenosomal succinyl-CoA synthetase beta subunit (UniProtKB:Q03184, SUCB_TRIVA), written as a follow-up to the evolutionary reviews of the beta family PTHR11815 and the alpha family PTHR11117. The entry has no gene name, so the folder is named by the accession (genes/TRIVA/Q03184). It is an InterPro member of PTHR11815:SF10 and not a leaf of the PAINT tree, so it has no IBA rows; its four TreeGrafter rows are grafted to the leaf PTN000929413 (A2EBX0, TVAG_259190, the same gene in the genome strain), inside the Trichomonas clade PTN008982090.

    All 10 GOA rows reviewed; none is a no-data row. Accepted: GO:0004775 succinate-CoA ligase (ADP-forming) activity (IEA), GO:0006104 succinyl-CoA metabolic process (IEA), GO:0042709 succinate-CoA ligase complex (IEA; the organelle has ADP- and GDP-dependent activity not assigned to a gene, so the nucleotide-neutral complex is as precise as the evidence allows) and both GO:0042566 hydrogenosome rows (EXP from PMID:1400232, and IEA). Kept as non-core: GO:0005524 ATP binding and GO:0000287 magnesium ion binding. TOO_GENERAL: GO:0003824 catalytic activity. REMOVE: GO:0005739 mitochondrion (TreeGrafter IEA; the organism has no mitochondria and GO does not class the hydrogenosome under mitochondrion) and GO:0006099 tricarboxylic acid cycle (IEA from four electronic sources; hydrogenosomes have no such cycle). One NEW row: GO:0034492 hydrogenosome lumen, as a curator inference from four agreeing lines (soluble on carbonate extraction, cleaved nine-residue presequence, immunogold label of the matrix, import only into hydrogenosomes). No new process term and no adhesion term is proposed; the comparator check for acetate and ATP-synthesis process terms on SCS beta subunits was re-run by term id with positive controls.

    Source defects recorded: on the mitochondrion row, the TreeGrafter row itself (delete requested) and the rule-derived mitochondrial name and location of UniProtKB:A2EBX0, which is the same gene with one residue different (check requested); on the tricarboxylic acid cycle row, check requests to UniProt (HAMAP rule MF_03219 function, pathway, keyword and UniPathway statements), to PAINT (root placement of GO:0006099 reaching the Trichomonas clade) and to InterPro (IPR005809 mapping).

    Depth: PMID:22079833 was read in full in the cache and supplies the statement that hydrogenosomes lack the cycle (the authors print trichloroacetic for tricarboxylic). All other papers, including the gene paper PMID:1400232, were read as abstracts only; the full text of PMID:1400232 exists only as scanned images. No assay has been made of the product of this gene; the activity is established for the organelle enzyme. Twelve publications were fetched with just fetch-pmid. The perplexity deep-research provider was not available (no provider file written); the literature search is recorded in the notes file. No bioinformatics analysis was added; tree placement is cited from genes/yeast/LSC2/LSC2-bioinformatics/RESULTS.md and the PANTHER release 19 tree service, and sequence comparisons with A2EBX0 and Q6LC42 (ap51-1, identical to residues 5-407) were position-by-position checks of UniProt sequences that are not stored.

    Validation: just validate TRIVA Q03184 passes with 0 errors; the two warnings are the uv environment-variable deprecation message captured from the term and reference validators and carry no content finding. Quote check: 119 verified, 0 failures. Three BIOLOGY knowledge gaps (nucleotide use and its assignment among the three beta genes; the disputed surface adhesin role; absence of any genetic perturbation).

    Follow-up after independent checks (same day). The mitochondrion REMOVE and its PANTHER defect now cite the usage comment of GO:0005739, which directs hydrogenosomal proteins to GO:0042566, and the first suggested question was reworded accordingly. The GO:0006099 defect now describes the family review as it stands (NEEDS_PRUNING, ADD_IRD at PTN008982090). The GO:0042709 reason records that the term is classified under GO:0045239 tricarboxylic acid cycle heteromeric enzyme complex and that the alpha review accepts the ADP-forming child. The third knowledge gap moved from BP_DARK to RESIDUAL_SUBGAP.
