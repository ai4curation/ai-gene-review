  summary: Record OpenScientist finding that no sequence analysis can assign the T.
    vaginalis SCS subunit pairing, since the interface is the active site
  details: |
    Ran an OpenScientist deep-research job (kgap-triva-scs-pairing) on the gap asking which beta subunit this alpha pairs with, which nucleotide the resulting enzyme uses, and how many subunits the native enzyme has. It returns the negative the prompt named as the expected answer, and it closes the approach rather than deferring it, because the reason the method fails is structural.

    The alpha-beta interface of succinyl-CoA synthetase is the active site: the phosphoryl group of the phosphohistidine sits at the amino termini of two helices, one from the alpha C-terminal domain and one from the beta. Residues on that surface are selected for catalysis across the family, so none is free to encode a preference for one paralog over another. Defined from the deposited E. coli coordinates as heavy-atom contacts under 4.5 Angstrom, the interface is 52 alpha and 42 beta positions, with the two copies of the asymmetric unit agreeing on 51 of 52 and 42 of 42 and the catalytic histidine inside the computed alpha set.

    Mapped onto the three alphas and three betas, exactly 1 of 52 alpha interface positions varies among the alphas and 0 of 42 beta positions vary among the betas. The 14 alpha and 33 beta differences sit almost entirely outside the interface: 1 of 14 against 2.36 expected, and 0 of 33 against 3.39 expected, the latter significantly depleted at p = 0.024. The test was not underpowered, since 6 interfacial differences in alpha or 7 in beta would have reached p < 0.05, and a family-wide control over 28 reviewed alphas and 28 reviewed betas shows the interface is already the more conserved part of each chain, so the invariance is the family expectation.

    Coevolution and congruence are unavailable in principle at three genes per family. An unrooted three-leaf tree has one topology, so the alpha and beta trees are congruent by construction and carry no information, and the Mantel permutation floor is one in six, so p below 0.05 is unreachable whatever the data say. Scoring all six pairings gives a top correlation of 0.952 against a six-point null, with an exhaustive p of 0.500 for that pairing. Nucleotide use is unassignable twice over: the nucleotide site lies in the beta N-terminal domain so no alpha sequence can bear on it, and the Gln20beta determinant maps to Gly in all three betas, a residue with no calibration in any assayed enzyme, which the companion Dictyostelium analysis had already identified as the only position with a mechanistic assignment. Nothing in the sequences explains the larger-than-dimeric native enzyme.

    The gap therefore stays OPEN. What changed is the boundary: no sequence analysis can assign the pairing or the nucleotide, so only a defined-pair experiment can settle it, and a future reviewer should not spend another run on a better alignment.

    One incidental observation is recorded but deliberately not escalated. The run finds this entry's TrichDB cross-reference appears swapped with that of ALPHA-SCS2: P53399 differs from the TVAG_318670 product at 1 of 309 residues and from TVAG_047890 at 14, while P53400 matches TVAG_047890 exactly, yet the local record carries DR VEuPathDB TrichDB:TVAG_047890, which was confirmed here. The direction agrees with this review's own boundary, which already names TVAG_318670 as this gene's locus. It is not filed as a source defect because the decisive sequence comparison rests on the run and was not recomputed, and because the error is in the entry's cross-reference rather than in an annotation record, which is what that slot fixes. The run also reads the single difference, Ser at position 248 where the genome-derived alphas carry Phe, as most likely a sequencing artefact or strain polymorphism in a 1994 entry from cloned genomic DNA, at a position whose family conservation is only 0.214.

    Verified locally: 309 residues, His262, Ser248, and the TVAG_047890 cross-reference. Not recomputed: the interface definition from PDB 1CQI, the hypergeometric and conservation statistics, the 28-sequence controls, the Mantel and congruence analyses, and the TVAG sequence comparisons. No annotation action was changed.
