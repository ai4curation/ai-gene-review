  summary: 'Create review: ALPHA-SCS1'
  details: |
    New review of the Trichomonas vaginalis hydrogenosomal succinyl-CoA synthetase alpha subunit 1 (UniProtKB:P53399, SUCA1_TRIVA, gene name ALPHA-SCS1), written as a follow-up to the evolutionary reviews of the alpha family PTHR11117 and the beta family PTHR11815. The folder is named by the UniProt gene name (just fetch-gene TRIVA P53399 --alias ALPHA-SCS1). The entry is not a leaf of the PANTHER tree and has no IBA rows; five of its IEA rows name the duplication node PTN008961326 (three TreeGrafter rows, and the two combined GO_REF:0000120 rows for GO:0004775 and GO:0006099), the clade of the three T. vaginalis alpha subunits. The paralogs ALPHA-SCS2 (P53400) and ALPHA-SCS3 (P53401) are described in the review and notes and are not reviewed separately.

    All 8 GOA rows reviewed; none is a no-data row. Accepted: GO:0004775 succinate-CoA ligase (ADP-forming) activity (IEA), GO:0009361 succinate-CoA ligase complex (ADP-forming) (IEA) and both GO:0034492 hydrogenosome lumen rows (EXP from PMID:7808480, and IEA). Kept as non-core: GO:0004776 succinate-CoA ligase (GDP-forming) activity (the organelle has GDP-dependent activity by assay, not assigned to a subunit pair). TOO_GENERAL: GO:0003824 catalytic activity. REMOVE: GO:0005739 mitochondrion (TreeGrafter IEA; the organism has no mitochondria and GO does not class the hydrogenosome under mitochondrion) and GO:0006099 tricarboxylic acid cycle (IEA from three electronic sources; hydrogenosomes have no such cycle). One NEW row: GO:0006104 succinyl-CoA metabolic process, as a curator inference; the comparator check was run in QuickGO by term id (yeast LSC1 and rat Suclg1 carry the term by IDA) with a positive control in the same query. No adhesion term and no new location term is proposed.

    Source defects recorded: on the mitochondrion row, the TreeGrafter row itself (delete requested) and the rule-derived mitochondrial name of the UniProt entry (check requested); on the tricarboxylic acid cycle row, check requests to UniProt (HAMAP rule MF_03222 function, pathway, keyword and UniPathway statements) and to PAINT (root placement of GO:0006099 reaching the Trichomonas clade). A question about the TrichDB cross-reference shared by the three reviewed entries is recorded under suggested_questions, not as a defect.

    Depth: PMID:22079833, PMID:23741475 and PMID:17608941 were available as full text in the cache. All other papers, including the gene paper PMID:7808480, were read as abstracts only. No assay has been made of the product of this gene; the activity is established for hydrogenosomal fractions. Five publications were fetched with just fetch-pmid (23741475, 17608941, 9622355, 9846736, 18676956). The perplexity deep-research provider was not available (no provider file written); the literature search is recorded in the notes file. No bioinformatics analysis was added; tree placement is cited from genes/yeast/LSC2/LSC2-bioinformatics/RESULTS.md and the PANTHER release 19 tree service, and sequence comparisons among the nine T. vaginalis alpha entries were position-by-position checks of UniProt sequences that are not stored. By sequence, P53399 corresponds to ap33-1 (O15568) and to the genome-strain locus TVAG_318670 (A0A8U0WPT0), each with one residue different.

    Validation: just validate TRIVA ALPHA-SCS1 passes with 0 errors; the two warnings are the uv environment-variable deprecation message captured from the term and reference validators and carry no content finding. Quote check: 126 verified, 0 failures. Three BIOLOGY knowledge gaps (activity, partner, nucleotide and subunit number of the enzyme containing this subunit; functional difference between the three alpha genes; the disputed surface adhesin role).

    Follow-up after independent checks (same day). Presequence differences corrected from five to four (positions 3, 4, 5 and 7; position 12 is in the mature chain). The mitochondrion REMOVE and its PANTHER defect now cite the usage comment of GO:0005739. The GO:0006099 reason and defect now describe the family review as it stands (ADD_IRD at PTN008961326). The GO:0009361 reason and the third question record the is_a link to GO:0045239. The comparator check for GO:0006104 now records that yeast LSC1 and human SUCLG1 carry the child GO:1901289 as NAS rows. The second question names the leaf node PTN000874238 for P53400. The second knowledge gap moved from BP_DARK to RESIDUAL_SUBGAP.
