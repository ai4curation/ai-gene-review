  details: |
    De-novo review of SFVcpz Gag polyprotein Q87039 (CACAO audit batch 2): all 18 GOA rows judged (14 ACCEPT, 2 MODIFY, 1 MARK_AS_OVER_ANNOTATED, 1 TOO_GENERAL) plus 4 NEW rows, with four core functions (capsid/Env-licensed budding, GR-box genome binding, dynein-mediated retrograde transport, H2A/H2B chromatin tethering). All four CACAO rows are cross-isolate transfers of prototype foamy virus (P14349) experiments onto Q87039, recorded as WRONG_EVIDENCE_CODE source defects (IDA/IMP -> ISS); two also carry WRONG_REFERENCE defects, since PMID:17530924 contains no chromosome or chromatin assay (the supporting paper is PMID:18627573) and PMID:22393357 concludes that the nuclear Gag signal it reports is a fixation artefact.
