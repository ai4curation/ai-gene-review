- type: EDIT
  outcome: changed
  summary: 'Wire OpenScientist split verdict: NADP cofactor and family assignable,
    amine substrate not'
  details: |
    Wired an OpenScientist run (kgap-cj0172c-amine-substrate) into the knowledge gap
    asking which amine Cj0172c uses and whether the carboxyspermidine reaction is
    demonstrable in the NCTC 11168 protein. Status OPEN -> NARROWING. UNDECIDED action
    kept, as the run itself recommends.

    The cofactor and reaction class are assignable; the amine is not. The split is not a
    hedge but a consequence of how many positions are testable: 29 residues of this
    protein line the cofactor site of a liganded family structure and 27 are identical,
    while zero residues can be matched to an amine-contacting position, because no
    structure anywhere in this family holds an amine or a carboxypolyamine.

    Family placement. Global identity is 14.2-20.0% to genuine saccharopine
    dehydrogenases against 64.5-69.3% to the epsilonproteobacterial carboxyspermidine
    dehydrogenase group and 43.1-43.4% to the assayed Vibrio carboxynorspermidine
    dehydrogenases. This is the only PF03435 protein in the genome. The cofactor is
    NADP(H): 27 of 29 contacts identical against a 55.9% background for that pair, all
    three 2'-phosphate contacts present, no acidic residue where NAD specificity would
    require one. So the entry's saccharopine dehydrogenase name is a fold-level
    carry-over and its single GO row is wrong in both cofactor and chemistry.

    Why the amine resists assignment, from three directions. Putrescine is the only
    diamine this strain can make (no arginase-family ureohydrolase, no group II PLP
    decarboxylase, no ornithine decarboxylase, closing the 1,3-diaminopropane and
    aminopropylagmatine routes) - but that is an argument about the cell, not the
    enzyme. The partner decarboxylase turns over both carboxyspermidine and
    carboxynorspermidine in vitro, so the leg that settled the Clostridium leptum case,
    the partner's measured preference, transmits no constraint upstream. And the one in
    vivo test points away from the activity: deleting the 99.0% identical orthologue in
    strain 81116 gave a large increase in spermidine and normal growth, while four
    other deletions in the same pathway abolished spermidine and severely compromised
    growth. That cannot be dismissed as strain background or redundancy, since the two
    strains carry the same five pathway enzymes at 98.8-100% identity and 81116 encodes
    no paralogue of this gene.

    Caveats the run states and that are recorded: the deletion strain was never
    complemented, so a second-site change in that one strain is not excluded, and free
    spermidine by HPLC is the balance of synthesis, glutathione conjugation and export.
    The qualitative point survives both - spermidine was still made and growth was
    normal without this enzyme.

    A suggested_questions entry now asks where the saccharopine assertion comes from and
    whether it should be withdrawn. Raised as a question rather than filed as a source
    defect because the identity figures were not recomputed here and no activity has
    been measured for this protein - the same treatment given to the ARBA-sourced NADP
    keyword on BRADU bll6421 earlier in this campaign.

    Verified here against the entry's own UniProt record (401 residues): the
    glycine-rich motif reading GAGGV at 8-12, the 2'-phosphate contacts Arg35, Thr36,
    Lys39, the Pfam assignments PF03435 and PF16653, and the provenance chain - a
    submitter-supplied name and EC 1.5.1.7 with evidence ECO:0000313 from the EMBL
    entry, from which GO:0004754 descends as IEA:UniProtKB-EC. Not reproduced here: the
    identity percentages, the structural mapping and its background rate, the
    genome-wide family absences, and the cross-strain identity figures.

    One self-correction during wiring: the question was first appended under a second
    top-level suggested_questions key, producing a duplicate key that broke YAML
    parsing. Caught by validation and merged into the existing list.
