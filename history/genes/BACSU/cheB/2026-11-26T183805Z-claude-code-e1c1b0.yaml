  summary: Wire OpenScientist result demoting the McpB Q371 deamidation candidate;
    CheD is the demonstrated deamidase
  details: |
    Wired an OpenScientist run (kgap-cheb-deamidation-sites) into the knowledge gap on
    the native receptor deamidation sites and physiological contribution of B. subtilis
    CheB. Status OPEN -> NARROWING. The sites remain unnamed and the one candidate this
    gap carried is demoted.

    The decisive check, which the prompt identified in advance, came out negative. McpB
    Gln371 does not sit at a position equivalent to a demonstrated deamidation site:
    superposing the McpB cytoplasmic domain on the E. coli Tsr cytoplasmic domain places
    Gln371 at Tsr Ser255, inside the HAMP domain and 42 residues from the nearest
    demonstrated column, while the columns of Tsr Gln297 and Gln311 - the two residues
    shown to be CheB-deamidated in E. coli - fall on McpB Leu413 and Asp427.

    The family inference itself is sound in the reference organism: Tar Glu302/Glu491
    occupy the same columns as Tsr Glu304/Glu493, so a deamidated glutamine does sit
    where a methyl-accepting glutamate sits in paralogues. It is this candidate that
    fails, not the reasoning.

    The activity is not left without a conceivable substrate. Across eight mappable
    B. subtilis chemoreceptors, glutamine occupies the demonstrated Tar Q295/Tsr Q297
    column in three: McpA Gln412, TlpB Gln412, TlpC Gln318. But the run ran the base-rate
    control such a claim needs and reported against itself: 5 of 40 mapped columns carry
    glutamine (0.125) against a background glutamine frequency of 0.078 in the same
    methylation-helix regions, one-sided binomial p = 0.197, 1.61-fold. Those three are
    predictions, not sites, and none has ever been reported as modified.

    The heavier finding concerns enzyme assignment rather than alignment. The
    demonstrated receptor deamidase of this organism is CheD, not CheB, and the single
    mapped B. subtilis deamidation site, McpC Gln609, is a CheD site. Because this CheB
    uses one serine nucleophile for both the esterase and the deamidase reaction, the
    only available catalytic allele, cheB(S173C), removes both at once, so the
    contribution of deamidation cannot be ranked against demethylation for this gene
    product with existing genetic tools.

    Annotation decision: the two GO:0050568 protein-glutamine glutaminase rows (one IBA
    from PAINT with E. coli CheB as donor, one IEA from EC 3.5.1.44 via UniRule) are
    LEFT AS ACCEPT. The run leans toward calling them over-annotated. I did not follow
    it, for three reasons: the E. coli donor evidence is genuinely experimental, so the
    IBA is a sound phylogenetic judgement rather than a propagation without grounding;
    the family assignment is not in question; and the rows' own stated reason already
    confines them to an inherited biochemical capability "without asserting that McpB
    Q371 or any specific native site has been experimentally assigned", which is exactly
    what this run removes. What the run takes away is a candidate site and any claim
    about physiological contribution - neither of which those rows assert. Per the
    project's IBA guidance, challenging an IBA means arguing with node placement, not
    with the absence of a local site.

    The resolution text was extended with two refinements the run supplies: test the
    glutamines at the demonstrated column (McpA Q412, TlpB Q412, TlpC Q318) ahead of
    McpB Q371, and note that separating the two activities genetically needs more than
    the existing catalytic allele.

    Verified here against the entry's own record (357 residues): the catalytic serine at
    position 173, and that the deamidase assignment on this entry - EC 3.5.1.44 beside
    the methylesterase EC - carries HAMAP rule evidence rather than experimental evidence
    for this organism. Not reproduced here: the structural superposition and column
    assignments, the eight-receptor mapping, the base-rate statistics.
