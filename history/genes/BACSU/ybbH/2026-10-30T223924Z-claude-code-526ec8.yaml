  summary: New review of ybbH/MurR (Q45581) and KBase dashboard prediction review
  details: |
    Created the ybbH (MurR, BSU01690) review from fetch-gene, claude-code deep research,
    SubtiWiki v5 API and a literature search. Tested the MurR hypothesis: ybbH is the
    second gene of ybbI(murQ)-ybbH(murR)-ybbF(murP)-ybbE(amiE)-ybbD(nagZ)-ybbC(namZ)
    (PMID:20400549, PMID:27729505). Found direct B. subtilis evidence missed by deep
    research: murR deletion increases PmurQ-lacZ activity (PMID:30038046, Fig. 8B).
    DNA binding, operator and effector remain unshown for B. subtilis; pairwise identity
    to E. coli MurR (27%) is lower than to E. coli HexR (33%) (ybbH-bioinformatics).
    Actions: GO:0003700 IBA/IEA and GO:0003677 IEA MODIFY to GO:0001217; GO:0006355
    IBA/IEA MODIFY to GO:0045892; GO:0032993 IBA KEEP_AS_NON_CORE; GO:0097367 IEA ACCEPT;
    GO:1901135 IEA MARK_AS_OVER_ANNOTATED; NEW GO:0045892 IMP PMID:30038046. Proposed
    new term "negative regulation of N-acetylmuramic acid catabolic process".
    Also wrote ybbH-dashboard-predictions-review.yaml for KBase dashboard call
    NZ_CP017763.1_2226 (98.2% identical to Q45581): GO:0003700 CNN, GO:0006355 CNN,
    GO:0043610 COR; recommended verdict supported. Frozen dashboard evidence copied to
    ybbH-dashboard-prediction-evidence/. No FEBA fitness data for BACSU.
