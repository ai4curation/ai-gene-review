  summary: Complete BACSU pcrB (O34790) review
  details: |
    Completed the deferred review of O34790 (heptaprenylglyceryl phosphate synthase) for projects/LIPID_DIVIDE.md. All 11 GOA rows resolved plus 2 NEW rows: ACCEPT the three GO:0120536 rows (core) and the three GO:0046474 rows; MODIFY the generic GO:0004659 and GO:0016765 rows to GO:0120536 and GO:0006650 to GO:0046474; KEEP_AS_NON_CORE GO:0000287. Both reviewer critiques of the earlier draft plan were settled. First, the planned NEW GO:0042158 lipoprotein biosynthetic process row was DROPPED: LhaT performs the acetyl transfer, the acetyl group comes from acetyl-CoA via YvoF, and HepG is regenerated, so PcrB contributes no atom to the modified protein, and the deletion phenotype is necessity rather than participation evidence. A comparator sweep in the same role found FDPS, GGPS1, MAT2A, metK, ACLY, ACSS2, bioB and bioF all absent from the process terms their products feed; only UppS and DPM1 are annotated the other way, and both differ in that their carriers are themselves incorporated intermediates. Recorded as a suggested question for GO rather than an annotation, keeping the gene consistent with the module, which places GO:0042158 on LhaT. Second, GO:0008611 was retained but added as a NEW IDA row rather than used as a MODIFY target: the C-1 versus C-3 objection dissolves because C-3 of sn-glycerol 1-phosphate is the carbon distal to the phosphate, the same physical position as C-1 in mirror-image G3P numbering, which the definition's hedges accommodate; and GO:0008611 is not a descendant of GO:0046474, so modifying would have discarded a true claim instead of refining it. This is the term's first prokaryotic annotation, which the row states; the absence of archaeal GGGPS annotations is explained by their all deriving from HAMAP MF_00112, whose mapping has no ether term. A second NEW row adds GO:0005737 by IC, the gene having had no cellular-component row. Three BIOLOGY knowledge gaps. No PAINT slice is cached for PTN002219408, so the IBA assessment rests on the donor set and family literature, stated in propagation_review. Validates clean.
