  summary: Record pcrB (O34790) evidence and annotation plan; review deferred
  details: |
    Fetched genes/BACSU/pcrB inputs and wrote pcrB-notes.md as part of projects/LIPID_DIVIDE.md; the ai-review.yaml is still the machine stub and the review is deliberately deferred to a later pass at the user's direction. The notes record the searches run, that no deep-research provider was available, and the key finding that the PcrB product now has a known physiological role: Komazin 2025 (PMID:40626731) shows acetylated heptaprenylglycerol is the acetyl donor for N-terminal acetylation of lipoproteins by LhaT, with pcrB, yvoF and ypjA knockouts each abolishing the modification and the pathway reconstituted in vitro, so the lipid is an acetyl carrier rather than a structural archaeal-type membrane lipid. Per-row plan: ACCEPT GO:0120536 as core (EXP and IDA), MODIFY the generic GO:0004659 and GO:0016765 rows to GO:0120536, MODIFY GO:0046474 and GO:0006650 to GO:0008611 ether lipid biosynthetic process, KEEP_AS_NON_CORE GO:0000287 magnesium ion binding, and add a non-core NEW GO:0042158 lipoprotein biosynthetic process row (IMP, PMID:40626731) justified by a QuickGO comparator check against E. coli Lgt, Lnt and UppS. Open point flagged by PR review: GO:0008611's definition centres on an ether-linked alcohol at C-1 while HepGP's ether bond is at C-3 of G1P, so that choice must be settled when the rows are written.
