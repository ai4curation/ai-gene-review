  summary: Initial review of uncharacterised acyl-CoA ligase YtcI (PTHR43605:SF10)
  details: |
    First review of B. subtilis ytcI (C0SPB0), a PTHR43605:SF10 relative of P. putida PP_2213. Removed IBA GO:0004321 fatty-acyl-CoA synthase (synthase/synthetase confusion from PAINT IBD PTN001944787; GO_CENTRAL source defect). GO:0006633 fatty acid biosynthetic process IBA left UNDECIDED: the root IBD's mammalian seeds point to oxidation, but YtcI is 58% identical to S. aureus MbcS (PMID:36806679), which primes branched-chain fatty acid synthesis. Accepted GO:0006637 and GO:0015645 IBAs; marked ARBA medium-chain fatty acid-CoA ligase as over-annotated. Added a reproducible pairwise-identity analysis in ytcI-bioinformatics/. Deep research providers unavailable; no literature on YtcI itself.
