  summary: 'Create review: sipS'
  details: |
    De-novo review of B. subtilis type I signal peptidase SipS (P28628) from cached abstracts
    (PMID:1639057, PMID:7876097, PMID:8951809, PMID:9694797, PMID:10982814, PMID:9823656) and UniProt;
    deep research failed (perplexity/openai unavailable, falcon 403), so manual notes were written to
    sipS-notes.md. All 10 GOA rows reviewed: 2 ACCEPT (GO:0009003, GO:0005886), 2 KEEP_AS_NON_CORE
    (GO:0004252 IBA/IEA, as in E. coli LepB, since GO:0004252 is not an ancestor of GO:0009003),
    6 MODIFY (GO:0008236 -> GO:0004252; GO:0008233 -> GO:0009003; GO:0016020 -> GO:0005886;
    GO:0006508 and GO:0051604 x2 -> GO:0016485). GO:0006465 signal peptide processing is obsolete and
    was not used. Core function: GO:0009003 signal peptidase activity, directly_involved_in
    GO:0016485, location GO:0005886.
