    (GO:0006605 protein targeting), 1 REMOVE (GO:0015450 protein-transporting ATPase activity, wrong
    energy coupling), plus 1 NEW contributes_to GO:0009977 (ISS from T. thermophilus SecDF). Core
    function: contributes_to GO:0009977, directly_involved_in GO:0043952, location GO:0005886.
