  details: |
    De-novo review of B. subtilis SecDF (O32047), a SecD-SecF fusion, from cached literature
    (PMID:9694879, PMID:15995216, PMID:21562494, PMID:29718185) and UniProt; deep research failed
    (perplexity/openai providers unavailable, falcon 403), so manual notes were written to
