  summary: Review BACSU plsY (Q45064) GO annotations
  details: |
    Reviewed all 5 GOA rows on Q45064 as part of projects/LIPID_DIVIDE.md. Accepted the two plasma-membrane rows (5 TM helices; membrane-fraction acylation lost on plsY inactivation) and the GO:0043772 acyl-phosphate:G3P acyltransferase row; modified the two generic phospholipid process rows to GO:0006654 phosphatidic acid biosynthetic process. Core function: GO:0043772 in the plasma membrane, involved in GO:0006654. On the lipid-divide question, Rieche et al. 2026 (PMID:42286214) show purified B. subtilis and E. coli PlsY acylate G1P as well as G3P, but the near-equal result is in detergent and the enzyme prefers G3P when reconstituted in liposomes, no kinetics exist, the in vivo G1P source is unidentified, and the in vivo heterochirality report (PMID:35767906) is abstract-only and unreplicated. The G1P activity was therefore recorded as a proposed_new_terms entry (acyl-phosphate glycerol-1-phosphate acyltransferase activity) plus two BIOLOGY knowledge gaps and suggested experiments, and deliberately NOT asserted as a core function or NEW annotation. Validates clean with 2 warnings. No deep-research provider was available; the notes file records the searches run.
