  summary: Withdraw the gene-specific attribution for the plsY hangs; OpenScientist
    has returned nothing since 19:52 and intake is stopped
  details: |
    Withdrew an incorrect attribution recorded earlier today and stopped OpenScientist
    intake for this campaign.

    What happened. The last OpenScientist report to arrive was BRUMA/bma-ben-1 at
    2026-11-26 19:52:41. Every submission after that has returned nothing:

    - BACSU/plsY attempt 2, 20:20 -> killed 22:28, 2 h 07 m, no output directory
    - BACSU/plsY attempt 3, 22:28 -> killed 00:29, 2 h 00 m, no output directory
    - BACSU/plsC, CHLRE/MITH1, CANAL/CYB5, all submitted 00:32 -> killed 02:33,
      2 h 01 m each, no output directories

    Five runs, four genes, six hours, with a clean cutoff. 256 runs had succeeded before
    that point in this campaign, typically in 30-50 minutes.

    The correction. In history/genes/BACSU/plsY/2026-11-27T003031Z-claude-code-47e411.yaml
    and in genes/BACSU/plsY/plsY-notes.md I concluded that two hangs on the same prompt,
    against eight successes through the same wrapper, "points to something specific to
    this prompt or gene rather than infrastructure luck." That was wrong. The batch-63
    hangs are identical and involve three unrelated genes with unrelated prompts, so the
    cause is the submission path or the remote service. The plsY notes now carry an
    explicit withdrawal of the claim; this record is the matching correction. A fourth
    plsY attempt would not have helped, which is the one practical consequence of having
    had the attribution wrong.

    Why the error was easy to make and how to avoid repeating it: at the time of the plsY
    decision the only evidence was two failures on one gene inside a window where other
    genes had succeeded, and the successes were all submitted BEFORE 19:52 while both
    failures were after it. The confound was time, not gene. The right check, which I did
    not run then and did run now, is to sort every completed report by modification time
    and look for a cutoff. That takes one command over the committed reports and settles
    gene-specific against service-wide immediately.

    Intake is stopped. No further submissions until a run is observed to return, because
    each attempt costs about two hours of wall clock and produces nothing, and because
    submitting more would keep manufacturing the same false signal. The two operational
    heuristics recorded with the plsY note still hold and are independent of this
    correction: near-zero local CPU is not a stall signal, since the wrapper polls a
    remote job; and the output directory is the reliable test, since every successful run
    created it when writing its report.

    Nothing else in the corpus is affected. No review content was changed by this record.
    The three batch-63 gaps (plsC, MITH1, CYB5) keep status OPEN and are unwired, which is
    correct since nothing was learned about them. Their hypothesis texts are preserved in
    the session scratchpad as hyp_plsC.txt, hyp_MITH1.txt and hyp_CYB5.txt for a retry
    once the service returns.
