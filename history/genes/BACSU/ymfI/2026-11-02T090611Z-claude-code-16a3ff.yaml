  summary: Review B. subtilis ymfI (O31767) EF-P modification carbonyl reductase
  details: |
    New review of 2 GOA rows plus two NEW rows. Core: GO:0016616 (as precise as the ontology allows; neither GO nor Rhea covers the EF-P 5-aminopentanone/5-aminopentanol interconversion) involved in GO:0018205 peptidyl-lysine modification, in the cytoplasm. The GO:0016616 IBA from PTN002449287 is accepted, because that term names only the shared SDR CH-OH/carbonyl chemistry and does not depend on YmfI keeping FabG substrate specificity. The GO:0030497 fatty acid elongation IBA from PTN001211919 is removed as an over-propagation: both seeds are enterobacterial FabG, B. subtilis has its own essential FabG (P51831), and NCBIfam separates YmfI as NF047420. The matching PTHR42879 family review records the same verdict.
