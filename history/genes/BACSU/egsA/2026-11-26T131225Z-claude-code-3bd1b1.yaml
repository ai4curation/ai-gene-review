  summary: Wire OpenScientist finding that the ara-operon placement is conserved but
    metabolically uncoupled
  details: |
    Wired an OpenScientist run (kgap-egsa-ara-operon-coupling) into the knowledge gap
    asking why a glycerophosphate dehydrogenase is transcribed as the fifth cistron of
    an L-arabinose catabolic operon. Status OPEN -> NARROWING.

    The run refutes both readings the gap offered and replaces them with a third.

    Not a relic of one genome: across a genus-balanced panel of 60 Bacillota genomes
    carrying 67 G1P dehydrogenase loci, 28 sit inside an arabinose gene cluster,
    spanning 19 of 38 genera and reaching beyond Bacillus to Paenibacillus,
    Exiguobacterium and Virgibacillus. Against a within-genome random-locus null the
    association is 85-fold for araA/araB/araD and 56-fold for arabinan-degrading genes,
    and it is specific to close orthologs (median identity 44.0% in an arabinose
    context against 29.8% outside; none of 21 divergent family members in such a
    context). The contrasting arrangement, dehydrogenase beside pcrB, occurs in 0 of 67.

    But no shared chemistry: arabinose catabolism terminates at D-xylulose 5-phosphate
    and reaches DHAP only through the non-oxidative pentose phosphate pathway into the
    shared aldolase and triose-phosphate isomerase, which also serve glucose catabolism
    and gluconeogenesis. No arabinose-specific enzyme has a DHAP reaction. So the
    placement is selected but what is selected is co-expression timing, not a pathway
    junction.

    Two further narrowings. The gene has no regulatory input of its own: an AraR
    operator scan that recovered both known operators found nothing at or above 12/16
    near araL, araM or araN, and a terminator scan that recovered the operon terminator
    9 nt after the abfA stop and the upstream unit's terminator found the araL/araM and
    araM/araN junctions at background, with araL and araM overlapping by 4 bp. Its
    induction therefore cannot be uncoupled from the operon by any detectable cis
    element. And the direction in vivo is settled: Km(G1P) 1,370 uM against Km(DHAP)
    8.1 uM, with the cellular G1P pool about 6 uM, 228-fold below saturation, while
    DHAP and NAD+ are saturating, so only the reductive G1P-forming direction carries
    flux and a G1P-consuming role under arabinose growth is excluded.

    What remains is narrower but real: the arrangement is conserved and so probably
    selected, yet nothing published says why co-expression with arabinan and
    arabinoxylan foraging would be advantageous. Conservation of a gene neighbourhood
    shows that something is selected without showing what. Neither reading licenses an
    arabinose GO term, and no annotation action was changed.

    Verification done here. The 6 uM G1P figure was traced to its source and is a
    correct derivation, but the source reports a combined G3P-plus-G1P pool of about
    30 uM at a 4:1 ratio across a four-strain set, not a B. subtilis-specific
    measurement, so the run's framing of it as a B. subtilis measurement is looser than
    the data; the conclusion survives because the undersaturation is 228-fold. The
    kinetic constants are attributed to a paper whose cached record is abstract-only and
    could not be checked here. The DHAP, NAD+ and NADH pools are E. coli
    glucose-minimal surrogates, which the run states. The local UniProt record confirms
    the 394-residue length, the homodimer and the NAD(P)+ dependence. Not reproduced
    here: the comparative-genomics panel, the enrichment statistics, the operator scan
    and the terminator scan.

    The directionality result also bears on the other gap in this file, which asks
    whether EgsA supplies the G1P used by PcrB; that gap stays OPEN because
    enzyme-to-lipid flux is still unmeasured, but the reverse direction is now excluded
    as an alternative reading of the enzyme's role.
