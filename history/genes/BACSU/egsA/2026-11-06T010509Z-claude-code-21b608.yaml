  summary: Complete BACSU egsA (P94527) review
  details: |
    Completed the deferred review of P94527 (AraM/EgsA, Ni2+-dependent sn-glycerol-1-phosphate dehydrogenase) for projects/LIPID_DIVIDE.md. All 5 GOA rows resolved: ACCEPT GO:0050492 (core), GO:0106357 and GO:0005737; KEEP_AS_NON_CORE GO:0106358 (NADPH is a curated but secondary cofactor); MODIFY GO:0006650 to GO:0046474. The MODIFY answers a reviewer critique of the earlier draft plan, which had justified it by 'G1P feeds HepGP' while the same work states no egsA-deletion lipidomics ties EgsA's output to HepG/Ac-HepG or to G1P-backbone phosphatidylglycerol. Re-grounded on two things that do not use that link: the ~170-fold kinetic bias (KM 8.1 uM DHAP versus 1370 uM G1P) establishing the reductive direction, and a comparator check showing E. coli GpsA, the stereochemical mirror enzyme, carries GO:0046474 by IMP from three papers plus IBA. Keeping the parent term was considered and rejected, because GO:0046474 is an is_a descendant of GO:0006650, so both assert the same lipid involvement and parking on the parent would hide rather than avoid the issue. Proposes an sn-glycerol 1-phosphate biosynthetic process term (GO has GO:0046167 for the G3P enantiomer only). Two BIOLOGY knowledge gaps: the in vivo G1P source, and why a lipid-precursor enzyme sits in an arabinose operon it is not required for. The notes file records the retraction of the superseded justification. Validates clean.
