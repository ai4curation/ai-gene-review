  summary: Record egsA (P94527) evidence and annotation plan; review deferred
  details: |
    Fetched genes/BACSU/egsA inputs and wrote egsA-notes.md as part of projects/LIPID_DIVIDE.md; the ai-review.yaml is still the machine stub and the review is deliberately deferred to a later pass at the user's direction. The notes record: the literature searched and that no deep-research provider was available (just mod-description-deep-research skips BACSU); the enzymology from PMID:18558723 (Ni2+-dependent homodimeric G1P dehydrogenase, kinetics favouring the G1P-forming direction); that EgsA supplying G1P to PcrB in vivo is NOT demonstrated in any accessible source, and that no egsA-deletion lipidomics ties it to the G1P-backbone phosphatidylglycerol of PMID:35767906, so this is a knowledge gap rather than an annotation; that engineered E. coli makes correctly configured G1P lipids without AraM (PMID:42286214), implying another route; and that the ara operon link is regulatory only (PMID:9084180 shows araM is not needed for arabinose use). Per-row plan: ACCEPT GO:0050492, GO:0106357 and GO:0005737, KEEP_AS_NON_CORE GO:0106358, MODIFY GO:0006650 to GO:0046474, and propose an sn-glycerol 1-phosphate biosynthetic process term (GO has only the G3P counterpart GO:0046167).
