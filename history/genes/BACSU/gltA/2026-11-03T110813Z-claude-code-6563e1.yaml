  summary: 'Review round: native evidence for glutaminase row (BACSU gltA)'
  details: |
    PR #5932 review round: the glutaminase core function is merged into the existing GOGAT core-function entry (molecular_function GO:0004359 plus contributes_to GO:0004355, as for carA/hisH). The NEW GO:0004359 row's reason now notes that GOA carries no GOGAT large chain on this term and that GOGAT gates its glutaminase site. The row moves from ISS to IC on native PMID:34931064: the Ntn-amidotransferase domain of GltA, and the completely inactive GltAB C1A mutant. A residue_mappings entry records C1A as mature-chain Cys1, which is Cys22 of P39812 (UniProt ACT_SITE 22, the first cysteine in the sequence); the canonical side passes the residue-mapping validator.
