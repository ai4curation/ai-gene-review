  summary: 'Address PR #5622 review: add Mn2+ binding row, disjoint NTR definitions,
    sharpen IBA propagation reasoning'
  details: |
    Correction session answering the ai4c-reviewer findings on PR #5622 (the earlier CREATE records for these four reviews are left untouched).

    Changes: (1) NEW GO:0030145 manganese ion binding row, IDA on PMID:21255105, supported by the side-by-side Mg/Mn/Ca/Zn assay on the purified enzymatic domains plus the curated FT BINDING Mn(2+) features (ECO:0000250) in the gene's uniprot.txt; no GOA-file citation. (2) The proposed polyglycerophosphate LTA synthase and LTA primase terms were overlapping siblings - the synthase definition's priming parenthetical was removed, so the two are now disjoint by acceptor, and both justifications record the OLS check that GO has no such term and that GO:0008960 (the OpgB reaction) is the only relevant existing child of GO:0016780. (3) propagation_review comments now use the PTHR47371 subfamily data fetched by this PR: ltaS1/ltaS2 and both IBD donors are PTHR47371:SF3, while yqgS/yvgJ are PTHR47371:SF1, so the two pairs sit at materially different phylogenetic positions. (4) The GO:0016020 MODIFY rationale no longer blames Gram-type heterogeneity (GO:0005886 covers a diderm's cytoplasmic membrane too); it is recorded as a conservative PAINT choice. (5) yqgS/yvgJ GO:0070395 NEW rows moved off IC to IDA/IMP to match the assays actually behind them, and the yqgS row no longer cites the PMID:19229300 quote that does not name yqgS. (6) ltaS2 gained a UNIPROT source_defect for the duplicated Short=LTA synthase 1 name, and its notes now cite PMID:22684329 with inline provenance, flagging that the ~90%/~74% figures are not in the cached abstract.
