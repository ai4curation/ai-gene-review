  details: |
    Re-review of IBA rows marked REMOVE (projects/IBA_REVIEW/rereview-2026-11-21, batch N07). The GO:0000976 transcription cis-regulatory region binding IBA (IBD at PTN000779307, root of PTHR30603, 419 leaves, single seed Arabidopsis SIG3 AT3G53920 in the plant child clade PTN001255210; SigF in the bacterial child clade PTN000779331) changed from REMOVE to KEEP_AS_NON_CORE. The earlier reason was that sigma does not bind DNA without the core enzyme, which is not a tree ground and does not make the term false: GO:0016987 sigma factor activity is a child of GO:0003700, whose definition includes cis-regulatory sequence binding, and the GO:0016987 definition says sigma binds promoter elements within the holoenzyme. Summary and reason rewritten; supporting quotes untouched. The GO:0003899 DNA-directed RNA polymerase activity IBA stays REMOVE (the SIG3 seed is a TAIR IMP from a sig3 mutant transcript phenotype, PMID:17175536, assigned as a catalytic activity of a non-catalytic subunit) and was not edited. just validate passes with no new warnings.
