  summary: Review B. subtilis efp (P49778) for the EF-P stall-rescue module
  details: |
    New review of all 9 GOA rows. Core: GO:0003746 with GO:0006414 and GO:0072344, cytoplasm and cytosol, matching the E. coli and P. putida siblings. GO:0010468 regulation of gene expression refined to GO:0006417 regulation of translation, which converges the three EF-P reviews. No swarming or sporulation process term proposed: those phenotypes run through translation of individual polyproline proteins such as FliY, so EF-P performs none of the work of motility or sporulation. The Lys32 5-aminopentanol modification is recorded in the annotation reasons, including that B. subtilis is the one EF-P shown to retain function unmodified. just mod-description-deep-research is unsupported for BACSU; efp-notes.md records that.
