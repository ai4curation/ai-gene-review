  summary: Review BACSU plsC (O07584) GO annotations
  details: |
    Reviewed all 8 GOA rows on O07584 as part of projects/LIPID_DIVIDE.md, and added one NEW row. Accepted the GO:0003841 and GO:0006654 rows, including the IBA from PANTHER node PTN000046632: inspection of the committed PAINT slice shows the IBD seeds include E. coli PlsC (P26647) alongside the eukaryotic AGPATs, so the node spans bacteria and eukaryotes and B. subtilis PlsC sits inside it with the HXXXXD motif intact. Modified GO:0016020 membrane to GO:0005886, the two generic phospholipid process rows to GO:0006654, and GO:0016746 to GO:0003841. Added GO:0032153 cell division site (located_in, IDA, PMID:15743965) from the septal-membrane GFP localization, a location claim only. Recorded a donor mismatch: GO:0003841 and both its parents are defined with acyl-CoA, but B. subtilis PlsC uses acyl-ACP (Rhea:42296), so an acyl-ACP counterpart term was proposed, following the existing GO:0004366 / GO:0043772 donor split; existing rows were left in place rather than modified away from the term every bacterial PlsC uses. The (S)-LPA activity of Rieche et al. 2026 was recorded as a knowledge gap, not an annotation: (S)-LPA is not commercially available and was generated in situ by PlsY, confounding the apparent (R) preference. Validates clean with 2 warnings. No deep-research provider was available; the notes file records the searches run.
