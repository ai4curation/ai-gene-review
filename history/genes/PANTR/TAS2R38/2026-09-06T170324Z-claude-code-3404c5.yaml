    De-novo AI review of chimpanzee (Pan troglodytes) TAS2R38 (Q697L5), curated alongside the human TAS2R38 review as a cross-species comparison for the PTC/PROP bitter taste receptor. All 10 GOA rows are IBA (PAINT/PTHR11394 node) or IEA (InterPro2GO/ARBA); no chimp-specific PMIDs were seeded from GOA. Verified GO-DAG ancestor/descendant relationships via QuickGO before judging redundancy. 5 ACCEPT (core bitter-taste-detection, receptor-activity, and plasma-membrane terms) and 5 KEEP_AS_NON_CORE (generic GPCR-activity/signaling/membrane terms subsumed by the more specific accepted terms). No REMOVE/MODIFY/UNDECIDED needed. Validated with just validate PANTR TAS2R38 (clean).
