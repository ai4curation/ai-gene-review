  details: |
    Responded to the ai4c-reviewer bot's re-review of commit b1db1320b on PR #3050 (round 2, 1 blocker + 2 optional). Resolved the Hayakawa et al. 2012 (PMID:22916235) Table 1 row-to-gene-label alignment that round 1 had declined to use directly: the markdown extraction flattens each row's leading gene label onto the tail of the preceding row's data, so the substring 'LICNon-functional70/92 (76%)000cTAS2R40' is cTAS2R38's own row (verified against the paper's own Methods sample sizes and its prose describing cTAS2R38's variant as the loss-of-start SNV). Added this as a verbatim finding, rewrote review_notes, and demoted Suzuki-Hashido 2015 (PMID:26201026) from primary source of the 76% figure to corroboration only, noting its looser 'of individuals' phrasing versus Hayakawa's allele-frequency table. Also fixed two optional suggestions: stale 'MODIFY/NEW' wording in TAS1R1's notes (no MODIFY remains there), and PANTHER:PTN000149628's source_status standardized to UNRESOLVED across human/TAS2R38, human/TAS2R16, and this file (was inconsistently SUPPORTS_TRANSFER in two of the three). Validated clean.
