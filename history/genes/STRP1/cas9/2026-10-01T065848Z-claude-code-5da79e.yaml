  summary: 'Create review: STRP1 cas9 (SpCas9, Q99ZW2)'
  details: |
    Completed the seeded review of Streptococcus pyogenes M1 cas9 (Q99ZW2) as a type II-A exemplar for MODULE:crispr_cas_adaptive_immunity, and wrote cas9-notes.md as the research journal (no deep-research provider available in this environment).

    All 9 seeded PENDING rows resolved: 4 MODIFY (GO:0003676 -> GO:0003723; GO:0003677 -> GO:0003690; GO:0004519 -> GO:0004520; GO:0046872 -> GO:0000287), 4 ACCEPT (GO:0004520, both GO:0043571 rows, GO:0051607), 1 KEEP_AS_NON_CORE (GO:0008408). Three NEW rows added (GO:0099048, GO:0043565, GO:0005737). Two substantive adjudications: GO:0008408 3'-5' exonuclease activity is NOT a domain-based inference but a verbatim observation in the cited PMID:22745249 and is backed by a UniProt Exonuclease keyword, so it is kept rather than removed, but marked non-core as a secondary trimming reaction with no assigned active site; and GO:0043571 maintenance of CRISPR repeat elements is correct because the term definition (under maintenance of DNA repeat elements, not defence) covers both crRNA biogenesis and spacer capture, in both of which Cas9 performs an identifiable step (duplex anchoring per PMID:21455174/PMID:24270795; PAM selection per PMID:25707807).

    Four core functions: guide-directed recognition (proposed_molecular_function, no GO term), GO:0004520 cleavage, GO:0003723 guide stabilisation, GO:0043565 PAM selection during adaptation. One proposed new term, 'guide RNA-directed nucleic acid target recognition activity', filling the ontology gap recorded in the host module's knowledge_gaps. The HNH/RuvC division of labour is modelled as one function plus prose, on the evidence that the catalytic HNH conformation activates RuvC and that HNH occlusion by AcrIIC1 inactivates the whole enzyme. Biotechnology use (genome editing, dCas9, gene drives) deliberately excluded throughout.

    Validation: 'ai-gene-review validate --verbose --strict --terms' passes with no errors or warnings. Fetched PMID:25707807, PMID:23706818, PMID:24270795, PMID:24476820, PMID:31668930 into the publication cache. Not committed or pushed.
