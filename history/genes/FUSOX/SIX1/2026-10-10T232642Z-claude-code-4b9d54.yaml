    Curated Fusarium oxysporum f. sp. lycopersici SIX1/Avr3 (Q709D8), a xylem-secreted FOLD-family effector recognised by tomato I-3. All 6 GOA rows (all PHI-base) were reviewed: 3 ACCEPT, 2 REMOVE, 1 UNDECIDED, and 1 NEW was added. The effector-mediated perturbation of host innate immunity term was accepted for the three papers that manipulate SIX1 (15672814, 18464895, 25740416). The same term citing the I-7 paper (26177154) was removed because the full text has no SIX1 experiment. Host cell (23596453) was removed because that paper uses SIX1 only as a promoter-GFP reporter. Host cell plasma membrane (25740416, abstract-only) was left undecided. Host apoplast (xylem sap, PMID:15387816) was added. Four PubMed-verified references were added and cached. just validate and validate-changed pass with no warnings.
