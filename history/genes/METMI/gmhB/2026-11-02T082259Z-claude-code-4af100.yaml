  summary: Add ISS NEW row for archaeal heptose bisphosphate 7-phosphatase activity
  details: |
    GOA holds no rows for this retired TrEMBL accession. Added one NEW existing_annotation for GO:0034200 as ISS against GO_REF:0000024. The grounding is the curated PIRNR004682 rule, which places the protein in the gmhB family and names it a D,D-heptose 1,7-bisphosphate phosphatase, plus the HAD subfamily IIIA signatures and the consecutive four-gene locus. The reason records explicitly that the beta-anomer specificity carried by the GO term is the weakest part of the assignment, since the rule names the activity without resolving anomer preference. Ran backfill-record-sections (added 2 record_sections). just validate clean.
