  summary: Add ISS NEW row for archaeal heptose 7-phosphate kinase activity
  details: |
    GOA holds no rows for this retired TrEMBL accession. Added one NEW existing_annotation for GO:0033785 as ISS against GO_REF:0000024. This is the best-grounded of the four archaeal entries: its 306-residue sequence is identical over its whole length to the translation of GenBank PP708527.1, the deposited HldA_MM construct from DSM 2067 cited to PMID:39116220, the study in which four DSM2067 enzymes expressed in a heptose-negative recipient produced ADP-heptose. ISS rather than an experimental code, because that reconstitution was ensemble-level in an engineered host and no kinase assay on this protein alone was reported. The adenylyltransferase step is left to the adjacent hldE_3 protein. Ran backfill-record-sections (added 1). just validate clean.
