  summary: Correct the PMID:26236307 reference_review enum and apply PR review polish
  details: |
    Correction session answering the PR 5649 review. The blocking finding was a
    controlled-vocabulary error: reference_review.correctness for PMID:26236307 was
    MISCITED, which the schema defines as "Paper is correctly identified but does not
    actually support the claim it is cited for". That is not the case here - the paper
    is cited for the keyword-search provenance of the locus and for its qRT-PCR
    expression data, both of which it does support - and the review_notes said as much,
    so the machine-readable signal contradicted its own prose. Changed to DISPUTED
    ("Correctly cited, but the paper's central claim is contradicted or contested by
    other evidence"), which is what is actually at issue: the paper's own MCO/laccase
    interpretation of the gene. review_notes rewritten so it reads as a dispute with the
    paper's interpretation rather than a citation error.

    Also applied, from the review's suggestions. The GO:0005737 cytoplasm ACCEPT now
    cites the family's own PAINT evidence: PTHR30616 carries a bacterial-root (taxon:2)
    IBD for GO:0005829 cytosol at PTN000770199 seeded by UniProtKB:P33644, the E. coli
    PgeF; the line was verified in the committed
    interpro/panther/PTHR30616/PTHR30616-paint.tsv and P33644 confirmed as PGEF_ECOLI.
    The reason notes that GO:0005829 is part_of GO:0005737, so the IBD entails the
    cytoplasm claim while being one step more specific, and says why the row is left at
    cytoplasm rather than narrowed - cytosol and cytoplasm are not treated as the same
    term. The GO:0005507 MARK_AS_OVER_ANNOTATED reason now states the stronger and
    checked fact that GO:0005507 appears nowhere in the committed PAINT data for the
    family, not merely that it is absent from PTN000770205. The GO:0009252 ISS row gained
    supporting_entities (UniProtKB:P33644) and a reason that records the comparator's GO
    id and qualifier (GO:0000270 peptidoglycan metabolic process, IMP from PMID:28612943,
    EcoCyc, acts_upstream_of_or_within, confirmed against QuickGO) and states explicitly
    that proposing the descendant GO:0009252 is a deliberate one-level escalation over
    that source, with the reasons for taking it.
