  summary: 'Resolve the last UNDECIDED row: cytosol accepted'
  details: |
    Completed the review for the module bar by resolving the GO:0005829 cytosol row from UNDECIDED to ACCEPT. No target-specific fractionation of the SHF3 clone exists, but three independent lines agree on the compartment: the record is a single soluble aldehyde-dehydrogenase chain with no signal peptide or transmembrane segment, the substrate is generated intracellularly and the gab-cluster enzymes that supply it are cytoplasmic, and the characterized enterobacterial homologs GabD and Sad are cytoplasmic. The mitochondrial wording of PTHR43353 is a eukaryote-derived family name, not a localization claim for this member. No other row was changed.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  - core_functions
  details: |
    Second round, responding to the PR review. Two changes. (1) The GO:0005829 cytosol row moves from ACCEPT to KEEP_AS_NON_CORE: the three converging lines (no signal peptide or transmembrane segment in the record, an intracellular substrate supplied by cytoplasmic gab-cluster enzymes, cytoplasmic enterobacterial counterparts) support the compartment, but there is still no location measurement on the SHF3 clone, so the row is kept without being part of the demonstrated functional claim and core_functions asserts no location. The QuickGO definition of cytosol is quoted. (2) Dual-acceptor convention settled and applied here: both acceptors are measured on this clone (132.1 with NADP against 14.9 with NAD, micromol/min/mg at pH 11.0 and 30 C), which is one active site running one reaction, and the QuickGO definition of GO:0009013 is the reaction with NAD(P)+. The earlier refinement of the GO:0009013 row into GO:0036243 plus GO:0004777 is withdrawn: that row is now ACCEPT and is the single core function, the two broad oxidoreductase rows refine to it, and the NAD-specific child is kept as its own row marked non-core at its measured weight. Both notes entries were rewritten to lead with the evidence.
  summary: Cytosol row recalibrated to non-core; one cofactor-general core instead of two
