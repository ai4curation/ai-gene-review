    First SYNY3 gene. Reviewed 16 GOA annotations for the Calvin-cycle NAD(P)-dependent GAPDH Gap2 (sll1342, P80505): 8 ACCEPT, 4 KEEP_AS_NON_CORE (NAD/NADP binding), 3 MODIFY (glucose metabolic process to gluconeogenesis; generic oxidoreductase to the NADP+/NAD+ GAPDH activities), 1 MARK_AS_OVER_ANNOTATED (glycolysis; Gap1 is the glycolytic paralog), plus 1 NEW (reductive pentose-phosphate cycle, IMP PMID:9484473). Added a PGAP predictions review: EC 1.2.1.- from naming model NF005641 assessed LSP versus curated EC 1.2.1.59; PGAP assigns no GO because NF005641 carries none and TIGR01534's GO is discarded. Falcon deep research failed (Edison API 403 authentication), so the review is grounded in UniProt, GOA and cached literature.
