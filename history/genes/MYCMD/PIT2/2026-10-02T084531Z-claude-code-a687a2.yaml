  summary: 'Create review: PIT2'
  details: |
    Created the review for U. maydis secreted effector PIT2 (UMAG_01375). GOA had only three extracellular region rows (EXP x2, IEA), all accepted. Added three NEW annotations backed by the newly cached full-text papers PMID:23459172 and PMID:30952847: cysteine-type endopeptidase inhibitor activity (GO:0004869, IDA), effector-mediated suppression of host innate immune response (GO:0140403, IMP) and host apoplast (GO:0140593, IDA). Comparator: P. infestans EPIC2B, an apoplastic PLCP-inhibitor effector, carries GO:0004869 and the parent of GO:0140403. GO:0140502 (SA-signalling suppression) was not used and is raised as a suggested question. Core function: apoplastic PLCP inhibition through the PID14 motif, with the substrate-mimic mechanism. just validate passes with no warnings; status COMPLETE.
