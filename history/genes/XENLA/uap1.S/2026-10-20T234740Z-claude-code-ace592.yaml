  summary: Full re-review of uap1.S (Q6DCZ6), independent of ProtNLM2 predictions
  details: |
    Full re-review for the ProtNLM2 benchmark (MOD_EVOLUTION20), carried out without using any prediction output. Rewrote the bioinformatics script to read the sequence from the UniProt flat file instead of a ProtNLM source file, and added ligand labels, isoform-feature and mutagenesis mapping. Result: all 15 human UAP1 nucleotide-sugar binding residues are conserved; the only gap is human 454-470 (the AGX2 insert), so the frog product is AGX1-like; human R453, needed for IRF3 pyrophosphorylation, is L in frog. Phylogenetic grounding: PANTHER SF4 together with human UAP1; PAINT eukaryotic UAP node PTN000237224. Kept ACCEPT for GO:0003977 and GO:0006048 and MODIFY of GO:0070569 to GO:0003977. Added NEW GO:0005829 cytosol from the PTN000237224 IBD that TreeGrafter had not yet transferred. Did not add GalNAc activity or IRF3/antiviral terms (PAINT omissions; R453 not conserved). Rewrote the description, core functions (with location) and notes. Removed references to ProtNLM source and UGP donor files.
