  summary: 'Full re-review: uap1.S (Q6DCZ6), independent of ProtNLM2'
  details: |
    Full re-review independent of ProtNLM2 output. New reproducible sequence comparison (compare_sequences_rereview.py / RESULTS-rereview.md) from the UniProt flat file vs human UAP1: 75.6% identity, 15/15 UDP-HexNAc contact residues conserved, AGX1-type layout (lacks human 454-470 insert). Grounded on PANTHER PTHR11952:SF4 and PAINT node PTN000237224. Kept ACCEPT for GO:0003977 and GO:0006048 and MODIFY GO:0070569 -> GO:0003977. Added NEW GO:0005829 cytosol, supported by the PAINT IBD at the same node. Did not propose GO:0052630 because PAINT did not propagate it; raised it as a suggested question. Rewrote description and core_functions (added cytosol location). Added PMID:9765219, GO_REF:0000033 and the RESULTS-rereview reference. Marked ProtNLM and UGP-donor files as unused (relevance NONE) and kept them for provenance. Appended a dated notes section.
