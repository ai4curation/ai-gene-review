- type: EDIT
  outcome: changed
  summary: 'Make panther-members.tsv merge-friendly: union merge, no count line, incremental
    refresh'
  details: |
    Concurrent module PRs conflicted on interpro/panther/panther-members.tsv on every merge, for three reasons: one shared file, a footer count line that every PR changes, and a refresh that rewrote all rows. Changes:
    - .gitattributes: merge=union for the file.
    - render_member_index: the footer no longer has a count line.
    - load_member_index: tolerates unsorted or repeated identical rows, and raises MemberIndexConflict when one accession gets two families.
    - load_member_index_gaps: drops gap markers for accessions that have a row.
    - refresh-panther-members: additive by default (incremental_member_index); --rebuild restores full regeneration.
    - Tests include a real git union-merge round trip.
    - CLAUDE.md notes the new behaviour.
