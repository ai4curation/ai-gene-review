  summary: Add nine SourceResourceEnum values for resources that had none
  details: |
    Batch 3 of the source_defects resource migration (#5984 named the enum gaps; #6027 and #6287 drained what the enum could already express). Nine values added: AFFINAGE, AGBASE, HGNC_UCL, PARKINSONSUK_UCL, GDB, YUBIOLAB, MENGO, PROSITE, RCSB_PDB. Each was added only because defects against it exist now and had been parked on OTHER - several explanations say so outright ('TIGR has no resource value, hence OTHER'; 'not in the SourceResourceEnum list, hence OTHER'). Evidence per value: AgBase 569 GOA rows in this corpus, HGNC-UCL 941, ParkinsonsUK-UCL 2332, YuBioLab 66, GDB 23, MENGO 7, each as a literal assigned_by string; Affinage 371 cached provider files; PROSITE and RCSB PDB assign no GOA rows at all and are resource-level rather than row-level. DFLAT (98 rows) and NTNU_SB (346 rows) were NOT added: neither has a defect in the current pile, and a value with no defect is speculative. TIGR was NOT added: all 71 files carrying a TIGR-assigned row are ARATH, TIGR's Arabidopsis annotation passed to TAIR, and TAIR already exists, so the single TIGR defect is re-filed to TAIR. That is the one contestable call here, because the defect's own text asked for a TIGR value. The three UCL groups stay three values rather than folding into ARUK_UCL: a correction must reach the team that made the row. Datamodel regenerated with just pydantic. Two presence tests added to tests/test_export_source_defects.py, following the SYNGO precedent.
