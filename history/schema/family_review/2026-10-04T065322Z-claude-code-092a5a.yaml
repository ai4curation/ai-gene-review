  details: |
    Added MemberException (member, exception_reason, optional pruned_node_id / lost_in_clade_node_id, required supported_by) as TermAssessment.member_exceptions, for losses on branches a PANTHER subfamily does not separate. family_gene_crosscheck now honours exceptions both ways: excepted members are exempt from FAMILY_GENE_DISAGREEMENT, keeping the term is EXCEPTION_RETAINED, an exception outside scope or on a non-FAMILY_WIDE/SUBFAMILY_ONLY term is EXCEPTION_OUTSIDE_SCOPE, and a pruned_node_id without a matching negative node_assessment is EXCEPTION_UNANCHORED. Tests added; annotation-reviewer skill documents the pattern.
