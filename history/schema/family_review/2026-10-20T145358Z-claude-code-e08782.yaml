  summary: Add just fill-node-evidence and fill PAINT evidence across family reviews
  details: |
    New src/ai_gene_review/validation/family_node_evidence.py (just fill-node-evidence) copies PAINT facts into node_assessments: evidence (IBD/IRD/IKR), negated: true on losses, and a loss's blocked IBD node as seeds. It never sets a verdict or overwrites a curated field, edits by line insertion and re-parses to verify. First run: evidence added to 1,873 node assessments in 473 family reviews, seeds to 2 losses (PTHR13914, PTHR22573); insertions only, 0 assessments left needing a verdict. Schema description of evidence points to the command.
