  summary: Add record_section for UniProt quote provenance
  details: |
    Add the record_section slot to SupportingTextInReference and Finding: the section(s) of a cached UniProt flat file a supporting_text quote comes from (CC:CAUTION, CC:FUNCTION, FT:BINDING, DR:Pfam, DE, REF...). It is the database-record counterpart of reference_section_type, whose ManuscriptSection enum cannot say which part of a UniProt record a quote came from. Values are derived from the cited file by the new backfill-record-sections command, which inserts one line per quote and refuses to write unless the reloaded document differs only by the added keys; validation warns (record_section_mismatch) when a stated value disagrees with the cited file. Motivated by tracking which manually curated UniProt CAUTION notes are used in gene reviews. Pydantic model regenerated; only the two new record_section properties were synced into the committed JSON Schema.
