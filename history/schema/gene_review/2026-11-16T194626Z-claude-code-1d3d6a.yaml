  sections:
  - source_defects
  summary: Add SourceDefect.severity and rank the source-defect export
  details: |
    The source-defect export listed 2554 recorded instances alphabetically, with nothing to say which upstream defect to file first and the same defect listed many times over. It now groups instances on the fix -- resource, defect_type, record, slot, asserted_value, corrected_value, requested_change -- which collapses the 2554 instances to 1836 distinct defects, 271 of them recorded more than once, and writes reports/source-defects/WORKLIST.md: every open defect once, worst first across all resources, each item showing the reasons it ranks where it does, what it spans, the change requested, the explanation and the reviews it came from. Ordering is lexicographic over four named, independently checkable reasons (propagates, instances: N, misattributed, confirmed) rather than a weighted score; the propagating-cause limb requires every mechanism the instances identified to be a spreading one, without which the corpus's largest group (55 UniProt qualifier rows, 5 saying SCOPE_OVER_REACH against 27 naming other mechanisms) would claim that one fix corrects all 55. The schema change is one optional slot, SourceDefect.severity (MISLEADING / IMPRECISE / COSMETIC), for the consequence of leaving a defect unfixed, which no other field carries and which confidence is not: set, it overrides the derived position. No existing file needs backfilling. The pydantic model follows; assets/ was deliberately not regenerated, being stale and not maintained in lockstep with the schema.
