  summary: Bind taxon slot to NCBITaxonEnum dynamic enum
  details: |
    Added NCBITaxonEnum (reachable_from NCBITaxon:1, include_self, progressive/lazy membership) and a REQUIRED binding on the global taxon slot (GeneReview, PredictionReview, GoCamReview, ParticipantSelector), so linkml-term-validator now checks taxon ids (non-NCBITaxon or unknown ids are errors) and labels (NCBITaxon label mismatches block in the CLI, validate-all and validate-prediction-terms; GO label lag stays advisory). Previously taxon had no binding and was never checked, which let 'label: CHLRE' and 'id: NCBITaxon:DESVH' through. Regenerated the Pydantic model.
