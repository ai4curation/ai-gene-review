  summary: Structured records for UniProt-literature isoform mismatches
  details: |
    Added ResidueMapping and the Finding slot residue_mappings (a residue as the source numbers it, as_reported, and the same residue in the review's displayed sequence, canonical; both ResiduePosition). Added REFSEQ_PROTEIN and UNIPROTKB_UNREVIEWED to FunctionalIsoformMappingTypeEnum, a source_defects slot on FunctionalIsoform, MISSING_ISOFORM to SourceDefectTypeEnum and ADD to SourceDefectRequestedChangeEnum. Regenerated the pydantic model; synced the new definitions into the committed JSON Schema, which predates source defects entirely, so FunctionalIsoform.source_defects is not in that file. New validator finding_residue_mappings (run by just validate-families) resolves both sides against UniProt sequences; export-source-defects now reads functional_isoforms[].source_defects and renders ADD. Motivated by SYNGAP1 (alpha1 isoform absent from Q96PV0) and RASAL2 (phosphosites numbered on isoform 2).
