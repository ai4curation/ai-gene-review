- type: EDIT
  outcome: changed
  summary: 'Review round 1 on the source-defect enums: first DUPLICATE_ASSERTION filed,
    drift tests added'
  details: |
    Review round 1 on PR #5984, which carried the enum additions recorded in
    2026-11-05T022249Z-claude-code-08f35e. Three blocking items, all mine.

    SUPERSEDES that earlier record on one point. It says the A0A220GHA5 /
    GO:0098672 case "is currently prose inside a WRONG_QUALIFIER explanation".
    That was accurate for the two commits it covers; this round filed it as a
    structured DUPLICATE_ASSERTION defect on genes/9CAUD/DMS3-30, so the
    sentence is now false. Appended rather than edited, per docs/history.md:
    the statement was true when written and a reader of the chain should not
    lose the intermediate state. (The same record's "so they cannot drift"
    claim about the docs tables was never true and so was corrected in place
    instead; the tests that make it true arrived here.)

    1. genes/BPPH2/15 kept resource: OTHER on its two InterPro2GO rows while
    the commit that introduced the enum deleted the sentence justifying OTHER,
    leaving the only OTHER rows in the corpus with no stated reason and the
    only InterPro rows in the change set that would not route to an INTERPRO
    report. Both re-filed. Worth recording how it was missed: the authoring
    session's own verification output printed "15 resource:OTHER=2" and it was
    read past, which is the same incomplete-sweep failure that produced the
    stale sentences being fixed. A grep over all ten edited reviews now
    returns zero.

    2. projects/CACAO.md recorded these gaps as open, and its items 1 and 2
    became false when the schema changed. Both now record what was done, with
    the corpus figures that changed the shape of the fix; the historical
    counts are kept because two of them were themselves corrections made on
    review of #5956. Item 3 (KW-0081) is untouched and still open.

    3. DUPLICATE_ASSERTION had no instance. Filed on DMS3-30 with
    record: UniProtKB:A0A220GHA5, following this PR's own cross-record
    precedent (record: InterPro:IPR008771) rather than waiting for the
    acrIIA5 review to be revisited. Verifying it against acrIIA5-goa.tsv
    corrected the prose it replaced: the two 2025 rows are identical in every
    GAF column including the qualifier, dated 2025-04-07 and 2025-04-10, so
    they are one exact duplicate entered three days apart, not two different
    hedges. Retiring both and keeping the 2019 involved_in row fixes the
    duplication and the qualifier regression in a single deletion. The entry's
    fourth GO:0098672 row cites PMID:30046034 with ECO:0000314 and is a
    separate assertion, deliberately kept.

    Filing it also found an edge in the GOA-support rule. The first attempt
    cited acrIIA5-goa.tsv in supported_by and validation blocked it,
    correctly. For a duplication defect there is nothing legitimate to quote:
    the claim is the state of a resource's annotation set, not a biological
    one. supported_by is omitted and the explanation says why. Exported
    reports for this defect type will carry no quotes, which is a property of
    the class rather than a filing gap.

    Also added: three tests in tests/test_export_source_defects.py asserting
    that the docs defect_type and cause rows list exactly the schema's
    permissible values - none missing, none invented - and that
    SourceResourceEnum keeps the pipeline values the exporter routes on with
    GO_CENTRAL intact beside PANTHER. Checked by deleting a value from a docs
    row and seeing the test fail, not only that it passes as written.

    One review suggestion was declined and the reviewer withdrew it: a second
    DUPLICATE_ASSERTION instance proposed at GH15_072:406-409 is a different
    shape, two resources (CACAO and UniProt) independently annotating the same
    claim, where filing a duplication defect would mean reporting one of them
    for agreeing with the other. The enum's "in a source's annotation set"
    scoping is what separates the two cases.
