- type: EDIT
  outcome: changed
  summary: Add ResidueClaim.alignment_file and a validator check that the archived
    alignment supports the claimed correspondence
  details: |
    New optional slot ResidueClaim.alignment_file (repository-relative aligned FASTA). gene_residue_claims now checks, when it is present, that the file has rows for the anchor and the target, that their ungapped sequences equal the current UniProt sequences, and that the alignment places the anchor position opposite the claimed target position, or opposite a gap for a LOST claim without a target. Forward-only: existing MSA claims without the slot are not failed; the validator summary reports how many lack an archived alignment. The MSA enum description now covers pairwise alignments and asks for the archived file. CLAUDE.md gains a short rule under Bioinformatics analyses.
