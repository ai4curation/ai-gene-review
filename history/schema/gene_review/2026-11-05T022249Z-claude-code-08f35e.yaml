events:
- type: EDIT
  outcome: changed
  summary: Source-defect enums can name pipelines, duplicate assertions and pipeline
    mechanisms
  details: |
    Three gaps in the source-defect enums, each measured across the corpus before
    being filled rather than guessed at.

    SourceResourceEnum gains INTERPRO, PANTHER, COMPLEX_PORTAL, ENSEMBL, NCBI,
    ENZYME, DISPROT, HPA, CAFA and GOC. Of the 200 defects filed resource: OTHER,
    137 name a resource with no enum value - InterPro 84, Complex Portal 24,
    Ensembl 9, NCBI/RefSeq 5, DisProt 4, CAFA 4, ENZYME/EC 3, HPA 2, PANTHER 1,
    GOC 1 - so the per-resource reports that export-source-defects exists to
    produce could not be produced for them. PANTHER is deliberately separate from
    GO_CENTRAL: a term can sit on a PANTHER node that TreeGrafter propagates
    without PAINT ever asserting it, and the two are fixed in different places.
    GOC is for a defect in a term itself rather than in any annotation using it.

    SourceDefectTypeEnum gains DUPLICATE_ASSERTION, for one assertion present
    more than once in a source's annotation set. Named to not collide with
    ReferenceReplacementReasonEnum's DUPLICATE_RECORD, which is about two
    reference records for one paper. The motivating case is A0A220GHA5 on
    GO:0098672, whose 2019 involved_in row and two 2025 hedged rows share
    ECO:0007040, IDA and PMID:28785032 and differ only in qualifier and date;
    that is currently prose inside a WRONG_QUALIFIER explanation.

    SourceDefectCauseEnum gains OVER_PROPAGATION, SCOPE_OVER_REACH,
    LABEL_WITHOUT_DEFINITION, SPECULATION_AS_ASSERTION and PRACTICE_CHANGE. Its
    five existing values are all gene-identity confusions, so a pipeline defect
    had nowhere to go: 315 of 451 cause values were OTHER. Keyword clustering of
    those 315 puts OVER_PROPAGATION at 67 and PRACTICE_CHANGE at 19; the other
    three are smaller but were each verified by reading the defects. No attempt
    was made to name the ~200 that resist clustering - carving those needs the
    explanations read, not regex, and OTHER stays correct for them.

    Also in this change: the pydantic datamodel regenerated with gen-pydantic
    (64 added lines, all inside the three enums, no other churn); the
    defect_type and cause rows in docs/source_defects.md regenerated from the
    schema, which also repaired a pre-existing omission of WRONG_STATEMENT,
    OUTDATED_STATEMENT and MISSING_STATEMENT; and two new doc sections,
    "Choosing a resource" and "Choosing a cause". Corrected in place, per
    docs/history.md: this sentence said the rows were regenerated "so they
    cannot drift", which was never true of these commits - generating once does
    not prevent drift and nothing enforced the invariant. The enforcing tests
    arrived in a2768a828c and are recorded there. The wrong claim is noted
    rather than silently dropped because "generated from the schema" reads like
    "cannot drift" and invites the same overstatement back.

    Ten gene reviews were re-filed onto the new values, and four reviews had
    sentences that this change made false ("the schema has no enum value, so
    OTHER is used") removed. Two of those four were wrong before this change
    as well: gag and NSS justified resource: OTHER by saying CACAO was not in
    the enum, which it has always been. Those seven CACAO rows are re-filed.
    After the change the exporter emits INTERPRO and PANTHER reports for the
    first time; resource: OTHER is down to 187, which is the remaining
    migration and is left for a separate change.
