  summary: Pilot gene-review checklist (LCV, warn-only)
  details: |
    Added rubrics/gene_review.yaml, a linkml-checklist-validator (lcv) checklist schema for gene reviews adapted from the LCV ai-gene-review pilot, with a filled DDAH1 example in rubrics/examples/, the fill-gene-review-checklist skill and docs/gene_review_checklists.md. Checklists live at rubrics/checklists/genes/<org>/<GENE>/<session-id>.checklist.yaml, outside history/, because every YAML under history/ is validated as a history record. The per-annotation key includes WITH/FROM, qualifier, isoform, negation and extension fields, because 35% of human reviews have judged rows that share term, evidence and reference. Items cover validation, history provenance, empty GOA, curated lines, reference coverage, source-defect confidence, the NEW-annotation bar, and per-row evidence (including a quote from the row's own reference). Checked with lcv validate-schema and lcv check on DDAH1, and every excerpt was verified against its source by script. No CI changes.
