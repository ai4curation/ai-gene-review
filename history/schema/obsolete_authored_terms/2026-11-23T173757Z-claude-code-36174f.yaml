  summary: Warn on obsolete author-supplied GO term ids
  details: |
    Author-supplied GO ids were unchecked for obsoletion: existing_annotations[].term.id is deliberately not hard-validated, and the core_functions dynamic enums test branch reachability, which a retired term still satisfies. Adds the obsolete_authored_term warning over NEW row terms, core_functions, proposed_replacement_terms and proposed_parent, plus just obsolete-term-audit. Detection combines GO's sqlite snapshot with the obsolete label prefix in the corpus' own GENE-goa.tsv files; the corpus-wide GOA read is what makes it work (86 of 87 hits at introduction came from it, the snapshot found 1). Corpus audit at introduction: 87 hits across 44 of 12281 reviews, 20 distinct obsolete ids, 49 in proposed_replacement_terms and 29 in core_functions.directly_involved_in. A warning, not an error: the signals are incomplete (a merged id, which QuickGO resolves silently, is invisible to both) so a clean result proves nothing, and the backlog would redden CI on unrelated PRs.
