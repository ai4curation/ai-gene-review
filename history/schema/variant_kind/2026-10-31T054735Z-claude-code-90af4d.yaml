  summary: Add ModuleVariantSet.variant_kind (REALIZER / ROUTE) and layered gap reports
  details: 'Add VariantKindEnum and the optional variant_kind slot on ModuleVariantSet, recording whether
    a variant set''s alternatives are carriers of one required activity (REALIZER) or alternative ways
    of achieving the step (ROUTE). module_logic carries the kind into the circuit (inferring REALIZER
    when every variant carries the same single MF), adds gap_report (innermost gaps through module_ref,
    labelled by layer), filters abduce gap_candidates to atoms that do not hold, attaches layer-specific
    hypotheses, and carries family_ids and domain_ids on atoms. Module pages show a declared kind. After
    review: a single-carrier step''s gap is UNCLASSIFIED, and hypotheses narrow only for declared kinds
    (an inferred REALIZER set, or a declared ROUTE set with a partly present alternative, keeps both readings);
    abduce evaluates each atom once; an unknown declared variant_kind raises. The standalone demo and
    its static snapshot were regenerated.'
