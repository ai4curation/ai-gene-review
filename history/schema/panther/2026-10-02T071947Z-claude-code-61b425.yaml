  outcome: needs_followup
  summary: 'WIP: make the PANTHER member index a build artifact (blocked on source-precedence
    decision)'
  details: |
    Moves the member index out of git into .cache/panther/panther-members-<release>.tsv:
    - built incrementally by just ensure-panther-members, which validate-modules and validate-families run first;
    - CI caches .cache/panther;
    - PANTHER download URLs are pinned to the release;
    - the three module citations of the deleted file are re-pointed to PANTHER's classification files.
    Blocked: a fresh build resolves 8 accessions (Q9XTP7, Q9UTA9, F4JLB7, Q9W288, P36507, P50613, Q7K5M0, A0A8I6ALM9) from PANTHER 19.0 classification files, while the committed index held UniProt xref values. 8 family reviews then fail PANTHER_MEMBERSHIP. Needs a decision on source precedence before merging.
- type: EDIT
  outcome: changed
  summary: Accept either source where PANTHER's files and UniProt disagree, with a warning
  details: |
    Decision (user): store both families when the sources disagree, accept either in membership checks, and report the disagreement.
    - The index gains a third column, uniprot_panther_family_sf, written only when UniProt's value conflicts with the primary from PANTHER's files (a different family, or a different subfamily; a bare family consistent with the subfamily is not a conflict).
    - The refresh now asks UniProt about every newly needed accession. A fresh build records 98 disagreements.
    - The module validator warns instead of erroring when the declared family matches only the UniProt value.
    - The family residue validator reports such members as UNRESOLVED ("sources disagree").
    - The prose scan does not count them as contradictions.
    - The 8 family reviews that failed now show UNRESOLVED.
