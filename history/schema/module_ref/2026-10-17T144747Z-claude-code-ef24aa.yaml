- type: EDIT
  outcome: changed
  summary: Add ModuleNode.module_ref for composing umbrella modules by reference
  details: |
    Adds ModuleNode.module_ref (<stem> or <stem>#<node_id>, resolved like conformance templates) so umbrella modules such as organelle lifecycles can compose existing modules without copying annotons. module_logic compiles referenced modules in place (atoms namespaced <stem>#<annoton>, cycle and unresolved refs fail fast), so umbrella satisfiability equals that of the referenced modules; optional parts make a referenced module non-gating. module_qc.module_ref_violations and the module validator block unresolved refs, cycles, and reference nodes that also carry annotons/parts/variant_sets; ref nodes are not counted as ungrounded leaves; rendered pages link to the referenced module/node. Motivation: organelle lifecycle modules (membrane-bounded organelles, all eukaryotes) intended as satisfiability rules for annotation completion in novel genomes. module-to-bnet does not yet follow references.
