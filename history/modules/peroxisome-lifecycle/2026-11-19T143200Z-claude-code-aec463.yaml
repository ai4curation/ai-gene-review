  summary: Add budding-yeast Vps1 peroxisome division route; add yeast Dnm1 to FIS1
    route
  details: |
    Added variant vps1_fis1_independent_division_route (context S. cerevisiae, NCBITaxon:4932) to the peroxisome division route axis, with one annoton: PTHR11566:SF220 (representative VPS1, UniProtKB:P21576), GTPase activity, peroxisome fission, peroxisome. Grounded on PAINT nodes PTN008520527 (P:GO:0016559) and PTN000902186 (C:GO:0005777) and on PMID:18445678, PMID:16520372 and PMID:11733545; matches the VPS1 review's peroxisome core function. Vps1 divides peroxisomes independently of Fis1/Mdv1/Caf4, so it is not placed in the FIS1-supported route.
    Added S. cerevisiae DNM1 (UniProtKB:P54861) as a representative member of the FIS1-supported route's dynamin-related scission unit (PTHR11566); its peroxisome fission needs Fis1, Mdv1 and Caf4 (PMID:18445678).
    PANTHER 19.0 budding-yeast classification places P21576 in PTHR11566:SF220 and P54861 in PTHR11566:SF235; the member index itself could not be built in this session (HTTP 400 during refresh-panther-members), so the validator's membership check was skipped.
