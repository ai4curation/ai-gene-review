  details: |
    Create the core mitochondrial ISC machinery as a satisfiability rule: NFS1-ISD11 cysteine desulfurase, ISCU scaffold with frataxin, and HSCB-mtHsp70 release to GLRX5. Each role is a PANTHER family selector with a reviewed human representative and a PAINT IBD node placed at Eukaryota, each confirmed as an ancestor of its representative (ISCU through its own IBA). Molecular functions come from the gene reviews' core functions. Rule candidate: Entamoeba's NIF system is a named, unmodelled exception. Electron supply (FDX2/FDXR), the ISD11-bound acyl carrier protein, the late [4Fe-4S] machinery and ABCB7 export are recorded as not yet modelled; selector over-matches are recorded on the Nfs1, Hsp70 and Grx5 descriptors.
