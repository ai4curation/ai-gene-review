  details: |
    Concrete PROTEIN_COMPLEX module with three parts: Sas2 (histone H4K16 acetyltransferase activity), Sas4 (protein-macromolecule adaptor activity) and Sas5 (left untyped, contributes_to only). Concept GO:0033255. Notes record the chromatin question: SAS-I prefers free histones (no or very weak nucleosomal activity, PMID:12626510, PMID:15659401), acts at or just before deposition (PMID:34014972), and is not detectable on chromatin by ChIP (PMID:21908408). In go-plus 2026-07-26 GO:0033255 is is_a piccolo HAT complex only and does not inherit part_of chromatin; a NODE_MOVE from GO:0032777 to GO:0031248 is proposed. Three BIOLOGY knowledge gaps. linkml-validate, module_validator (0 warnings) and quote_check pass.
