  details: |
    V0 subunit e stays optional. The v0_e node (typed MODULE) gives the reason with its own evidence: human ATP6V0E1 is 81 residues with two transmembrane segments (UniProt record), short membrane proteins are hard to find by homology (stated as an unchecked general expectation), and where present the subunit is essential for proton pump function (PMID:17350184, yeast complementation, quoted). The missing Dictyostelium row in the reviewed-entries table is kept as a separate note. Subunit B carries GO:0046961, the contributes-to function in the ATP6V1B2 review, instead of GO:0015078. v1_sector is typed PROTEIN_COMPLEX. C. elegans vha-13, vha-1 and unc-32 are second representatives of the A, c-ring and a families (moved from synaptic_vesicle_neurotransmitter_loading). Notes record that synaptic_vesicle_neurotransmitter_loading references this module.
