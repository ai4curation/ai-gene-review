  summary: Record MurA-LapB envelope interaction hub as module boundary mechanism
  details: |
    Litscan handoff #2663 proposed MurA's LapB/LpxA/LpxC/LpxD/FabZ interaction hub (PMID:42604454) as a candidate module member. Adjudicated as a cross-pathway coordination mechanism, not a module part: LapB and its partners regulate or compete with, rather than catalyse, UDP-GlcNAc-to-lipid II conversion. Added two PMID:42604454 evidence items (direct interactions; MurA not a LapB/FtsH degradation substrate), a scope paragraph in module notes, and an OPEN BIOLOGY knowledge gap on the unmeasured functional consequence for MurA activity and UDP-GlcNAc partitioning. The issue's suggested target module (dolichol_phosphate_sugar_donor_supply) is eukaryotic and was not used.
