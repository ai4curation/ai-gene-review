  summary: Adjudicate MurA-LapB envelope interaction hub as module boundary mechanism
    (edits superseded by #2976)
  details: |
    Litscan handoff #2663 proposed MurA's LapB/LpxA/LpxC/LpxD/FabZ interaction hub (PMID:42604454) as a candidate module member. Adjudicated as a cross-pathway coordination mechanism, not a module part: LapB and its partners regulate or compete with, rather than catalyse, UDP-GlcNAc-to-lipid II conversion. The intended edits were a PMID:42604454 evidence item for the direct interactions, a scope paragraph in module notes, and an OPEN BIOLOGY knowledge gap on the unmeasured functional consequence for MurA activity and UDP-GlcNAc partitioning (the negative result that MurA is not destabilised by LapB overproduction, i.e. not a LapB/FtsH degradation substrate, is recorded inside that gap rather than as a separate evidence item). The issue's suggested target module (dolichol_phosphate_sugar_donor_supply) is eukaryotic and was not used.

    This session made no net change to modules/peptidoglycan_precursor_biosynthesis.yaml: PR #2976 landed the same adjudication first (merged 2026-09-09), and PR #2986 was merged with main taking #2976's side, so the surviving evidence item, notes paragraph, and knowledge gap in the module are #2976's text. This record is retained for the session provenance only; outcome is no_change and the sections listed above are the ones considered, not ones this session altered.
