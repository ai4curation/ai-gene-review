  summary: Generalize peptidoglycan precursor module taxonomically, ground families
    in PANTHER/PAINT, promote to COMPLETE
  details: |
    Species-neutral description and notes; the ten steps are stated as conserved across peptidoglycan-producing bacteria with Escherichia coli K-12, Pseudomonas putida KT2440 and (for the L-lysine MurE branch) Staphylococcus aureus NCTC 8325 as reviewed exemplars. Every family descriptor now carries its members' PANTHER family with the official name verbatim from interpro/panther/panther.obo, plus one PAINT IBD ancestral node per step read from the checked-in paint.tsv with its snapshot date. MraY and MurG deliberately cite broader nodes because their substrate-specific descendant nodes carry L-lysine-defined terms; the L-lysine MurE variant asserts no node because PTHR23135 and its subfamily SF4 do not distinguish third-residue specificity. The MraY step's function was changed from GO:0008963 to the meso-diaminopimelate sibling GO:0051992 to match the reviewed exemplars. The Ddl step drops the unreviewed Escherichia coli DdlB exemplar and cross-references d_amino_acid_cell_wall_precursor_supply. Status DRAFT to COMPLETE: 21/21 grounded accessions have complete gene reviews, module validator reports 0 warnings, recommended-field compliance 100%.
