  details: |
    Added an inline description to the PI4P 5-kinase selector PANTHER:PTHR23086:SF8, whose verbatim PANTHER 19.0 name (PHOSPHATIDYLINOSITOL 5-PHOSPHATE 4-KINASE, ISOFORM A) misdescribes it: PANTHER's budding and fission yeast classification files place S. cerevisiae MSS4 (P38994) and S. pombe its3 (O13853) in SF8. Id and label unchanged. Updated the module notes, which still said the PIP5K role used the whole family PTHR23086, to state that it lists the type I PIP5K subfamilies SF8/SF54/SF34/SF26 (the family also holds the PI5P 4-kinases PIP4K2A/B/C in SF21/SF22/SF35). Re-rendered pages/modules/phosphoinositide_biosynthesis.html with all gene reviews present.
