  summary: 'Create module: G2/M transition (mitotic entry)'
  details: |
    Created modules/g2_m_transition.yaml (MODULE:g2_m_transition), modeling
    mitotic entry as the switch-like activation of cyclin B-CDK1. Six parts:
    holoenzyme assembly with a taxon variant set for the CDK-activating kinase
    (CDK7-cyclin H / Mcs6-Mcs2 versus budding-yeast Cak1); Wee1/Mik1/Myt1
    inhibitory Tyr15/Thr14 phosphorylation; Cdc25/Mih1 activating
    dephosphorylation; Polo-kinase reinforcement; the optional
    Greatwall-endosulfine-PP2A-B55 axis; and optional checkpoint-kinase restraint.
    Connections encode the CDK1-Cdc25 positive feedback and the CDK1-Wee1 mutual
    antagonism. Grounded in GO:0000086 and linked to the fission-yeast G2/M GO-CAM
    gomodel:69729a3800001390 and human CDK1 GO-CAMs gomodel:653b0ce600000623 and
    gomodel:653b0ce600000673 at annoton level.

    Grounding as for the sibling G1/S module (UniProt REST for accessions, local
    PANTHER 19.0 classification and panther.obo for families/labels, local PAINT
    slices for PTN000113601, PTN008315181, PTN000867899, PTN002514139,
    PTN000623979, PTN000624096, PTN000850864, PTN000089071, PTN000679870,
    PTN000683254, PTN002268602). Cak1 is grounded on PTHR24056 because PANTHER
    19.0 classifies it there (subfamily SF508) although UniProt assigns
    PTHR44167; the descriptor documents the disagreement. Greatwall and the PP2A
    catalytic subunit are grounded at subfamily level (PTHR24356:SF1,
    PTHR45619:SF12) because every exemplar shares the subfamily. The Chk1
    descriptor asserts no family id (human and pombe Chk1 sit in different
    PANTHER families). PMIDs verified against PubMed E-utilities.

    Validation: linkml-validate passes; module_validator term labels OK with
    advisory warnings only; derived QC 100% recommended-field compliance, no
    leaf-grounding gaps, no conformance violations. Rendered to
    pages/modules/g2_m_transition.html. Left undone: no module deep-research
    report; lineage differences in the Greatwall axis (nutrient coupling in pombe,
    quiescence in budding yeast) are recorded in notes rather than modeled.
