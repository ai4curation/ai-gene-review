  details: |
    NEW from YEAST-RNT-SALV, YEAST-SALV-PYRMID-DNTP and PomBase 69a0c46f00003691. Parts: uracil PRTase (FUR1), uridine-cytidine kinase (URK1), cytidine deaminase (CDD1), nucleoside cleavage (Urh1 hydrolase vs uridine phosphorylase variants), optional cytosine deaminase (FCY1), CMP kinase (URA6) and optional thymidine kinase (absent from S. cerevisiae and S. pombe; human/E. coli exemplars). S. pombe exemplars SPAC1B3.01c, urk1, cdd1, urh1, urh2, fcy1, ura6.
