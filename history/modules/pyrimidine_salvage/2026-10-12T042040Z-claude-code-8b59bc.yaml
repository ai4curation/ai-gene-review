- type: EDIT
  outcome: changed
  summary: Uridine kinase and uridine phosphorylase selectors reverted to family-level
    PANTHER terms
  details: |
    Review follow-up on PR 4548. PANTHER 19.0 classification files place the E. coli representatives outside the subfamilies the consistency pass selected: udp (P12758) is in PTHR43691:SF11 (FI09636P-RELATED, which also holds B. subtilis deoD purine nucleoside phosphorylase), and udk (P0A8F4) is in PTHR10285:SF164 (ATP-DEPENDENT KINASE TDA10-RELATED, which also holds yeast TDA10 and Arabidopsis GLYK). Adding either subfamily would assert the activity for members that lack it, and no family review documents a subfamily scope for these families, so both selectors were reverted to PANTHER:PTHR43691 and PANTHER:PTHR10285 (the pre-pass state). Rendered page regenerated.
