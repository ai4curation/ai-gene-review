  summary: Promote ubiquinone_biosynthesis to COMPLETE
  details: |
    Completed the bacterial plus mitochondrial ubiquinone biosynthesis module. Adopted the verified PTN groundings of the module-grounding branch, except a P. putida ferredoxin wrongly placed in the mitochondrial step and PTHR11938 for Arh1 (UniProt and current PAINT seeds place Arh1 in PTHR48467). Added molecular functions to the UbiJ (isoprenoid binding), UbiB and Coq8 (ATP hydrolysis) and Coq9 (lipid binding) annotons from direct evidence; UbiK stays without a function because its activity is unknown. Removed P. putida IspB as a C40 representative (pseudomonads make UQ9) and human ALDH3A1 as an Hfd1-step representative (no direct 4-hydroxybenzaldehyde data). Every grounded gene (61) and every family reference protein has a COMPLETE gene review; seven new PANTHER family reviews were written. Both module validators pass; the three remaining FAMILY_FUNCTION_UNREVIEWED warnings reflect truthful UNRESOLVED family scopes and are explained in notes.
