  summary: 'Create C. elegans module: HSF-1 cytosolic heat shock response'
  details: |
    Concrete C. elegans module bounded to HSF-1 activation/HSE-dependent transcription and its cytosolic chaperone output; HSF-1 developmental, immune, autophagy and ER/mito UPR roles excluded. Five root parts: hsf1_activation (HSF-1 G5EFT5, GO:0003700), hsp70_folding_cycle (HSP-1 P09446 GO:0140662; HSP-110 Q05036 and BAG-1 O44739 GO:0000774), hsp90_chaperone (HSP-90 Q18688 GO:0140662), shsp_holdase (HSP-16.2 P06582, holdase by name, no GO id), atypical_shsp_output (HSP-12.3 Q20164 GO:0031072, HSP-12.6 G5EE36 GO:0042802; HSF-1/DAF-16 longevity branch, no heat-response process for HSP-12.6 per its review). DNJ co-chaperones and unreviewed hsp-70/hsp-16 paralogs excluded; HSP-90 feedback on HSF-1 recorded as a knowledge gap for lack of worm evidence. All MFs match gene-review core functions. 21 PMID quotes checked verbatim against cached publications. linkml-validate clean; module_validator passed with 2 warnings (taxon label not consulted; no GO id for holdase).
