  summary: Move an ontology and a curation gap to notes
  details: |
    PR review found knowledge_gaps entries whose only gap_kind was ONTOLOGY and/or CURATION, which CLAUDE.md prohibits. ModuleReview has no proposed_new_terms slot, so these move to the module notes, which CLAUDE.md names as a valid destination. Both the gap statement and the boundary prose are preserved, the latter as what is asserted instead. The ontology gap records that the cytoplasmic chaperones and the gatekeeper have no molecular function term that fits, which is why none is asserted for them. The curation gap records that most structural components of the locus-of-enterocyte-effacement system exist only as unreviewed UniProt entries, which is why conserved roles are grounded on Salmonella and Yersinia exemplars with the E. coli counterparts attached.
