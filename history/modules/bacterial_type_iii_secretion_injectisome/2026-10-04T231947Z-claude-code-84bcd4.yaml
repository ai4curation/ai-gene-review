  summary: Ground family descriptors in PANTHER
  details: |
    Added PANTHER ids to ten family descriptors after refreshing the member index. The groundings independently corroborate the flagellar homology the module discusses: the export apparatus and basal body resolve to the FliP, FlhB, FlhA and flagellar M-ring families, the sorting platform to the FliM family, and the secretin to the general secretion pathway protein D family shared with type II secretion. Eleven descriptors still assert no id because their members are short structural subunits PANTHER does not classify.
