  summary: Create bacterial type III secretion injectisome module
  details: |
    New species-neutral module using the unified Sct nomenclature. Six parts: cytoplasmic sorting platform and ATPase, inner-membrane export apparatus, envelope-spanning basal body, extracellular conduit, translocon, and optional substrate gating with chaperones. A variant set on the extracellular conduit distinguishes a bare needle from the filament-extended needle of the E. coli locus-of-enterocyte-effacement systems, where EspA polymerises into a long surface filament on a short EscF needle; that variant carries the E. coli-specific architecture while the bare-needle variant is grounded on Salmonella SPI-1 and Yersinia. Substrates, per-cargo chaperone pairing, and the homologous flagellar export system are outside the boundary, the last because it already has its own module and builds a different structure from the shared export core. Grounding is deliberately uneven and labelled as such on each annoton: every conserved role carries a reviewed Salmonella or Yersinia exemplar, while most EPEC Esc structural proteins exist only as unreviewed UniProt entries. One of those is named as a proton-transporting ATPase, which the module does not adopt; no proton-transport function is asserted anywhere. Chaperone and gatekeeper molecular functions are left unasserted because GOA offers only protein binding and the natural alternative, unfolded protein binding, is obsolete.
