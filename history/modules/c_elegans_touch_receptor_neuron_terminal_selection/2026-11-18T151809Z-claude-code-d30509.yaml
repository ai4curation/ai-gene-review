  summary: 'Create module: C. elegans touch receptor neuron terminal selection'
  details: |
    New concrete C. elegans module for the program that gives the six touch receptor neurons their identity. Parts: (1) UNC-86 starts mec-3 transcription, with an optional Hox guarantor part (CEH-13/CEH-20 in ALM, EGL-5 in PLM); (2) the UNC-86/MEC-3 POU-LIM heterodimer, split into mec-3 autoregulation and activation of the touch-receptor gene battery; (3) optional ALR-1 positive feedback on mec-3; (4) the bistable ZAG-1 versus EGL-44/EGL-46 switch that keeps the battery off in FLP. MEC-3, EGL-44 and EGL-46 annotons follow their gene reviews' core molecular functions; UNC-86, ALR-1, ZAG-1, CEH-13 and EGL-5 have no gene reviews and are grounded by UniProtKB accession with function terms taken from their UniProt/GOA annotations. Left out: MEC-3 in PVD dendrite arborization, AHR-1, MBL-1 and EEL-1 level control, the ALM/BDU PAG-3 competition (prose only), LDB-1, lin-4/lin-14/sem-4, and all other EGL-44/EGL-46 roles (HSN, Q lineage, HOB, PVD, BAG, Hippo). No gene review was edited: none of the three reviews has a MODIFY row that decomposes a precomposed term into this module.
