  summary: 'Create C. elegans module: Ciliary transition zone MKS and NPHP modules
    in Caenorhabditis elegans'
  details: |
    New concrete C. elegans transition-zone module. Three root parts: the MKS-5 assembly hub (molecular adaptor activity), the MKS module (mks-1, mksr-1, mksr-2, mks-2, mks-3, mks-6; GO:0036038 concept) and the NPHP module (nphp-1, nphp-4; GO:1990957 concept), with PRECEDES connections from MKS-5 to each module recording the localisation hierarchy. Genetic redundancy between the modules (synthetic defects between but not within modules) is recorded in descriptions and root-node evidence. CEP-290, TMEM-218, TMEM-231, JBTS-14, TMEM-107, TMEM-17, TCTN-1, TMEM-138 and CDKL-1 are named in notes only (no gene reviews); NPHP-2 is excluded as an inversin-compartment protein. Cross-references the IFT and BBSome modules. Grounded in PMID:21422230, 26982032, 18337471, 19208769 and 18316409 with verbatim quotes. linkml-validate clean; module_validator passed with 4 warnings (NCBITaxon label unchecked; no GO MF id for mks-1, mks-6, nphp-1, matching their gene reviews); rendered.
