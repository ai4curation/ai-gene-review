  summary: Fold FGFR-module gene review findings back into the module
  details: |
    - Cited 12 new gene reviews (FGF1, FGF2, FGF7, FGF19, FGF21, FGF23, KL, FGFR1, FGFR3, FGFR4, FRS2, SOS2, PLCG1) as annoton evidence.
    - FGFR4 variant: bile-acid process tightened from GO:0070857 to its child GO:0070858 (negative regulation), matching the FGFR4 and KLB reviews. The recycling wording is softened because the common G388 form is degraded after ligand binding (per the FGFR4 review).
    - Endocrine FGF variant: FGF21 is described as signalling mainly through beta-Klotho-FGFR1c, and also FGFR2c/3c but not FGFR4 (FGFR1 and FGF21 reviews). Hormone activity (GO:0005179) is noted in prose.
    - Paracrine variant: prose notes FGF7/FGF10 FGFR2 IIIb selectivity and heparin binding.
    - Klotho co-receptor annoton: added extracellular region for the shed ectodomain, which acts as a co-receptor in trans (KL review).
