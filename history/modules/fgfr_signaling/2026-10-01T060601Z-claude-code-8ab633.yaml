  summary: Add optional receptor-level attenuation part (IL17RD/SEF, CBL) to FGFR
    module
  details: |
    Added optional part 8, fgfr_receptor_attenuation, with two annotons:
    - IL17RD/SEF: PTHR15583:SF14, signaling receptor inhibitor activity GO:0030547, negative regulation of FGFR signalling GO:0040037. It associates with FGFR1/2 by co-IP; direct binding is not established (PMID:12958313, PMID:12604616).
    - CBL: PTHR23007:SF5, ubiquitin protein ligase activity GO:0061630, GO:0040037. It is recruited by FRS2-bound GRB2 and ubiquitinates FGFR and FRS2 (PMID:11997436).
    Connections: the FRS2/GRB2 scaffold PROVIDES_INPUT_FOR attenuation, and attenuation NEGATIVELY_REGULATES receptor activation. The notes now place Sprouty/SPRED and DUSP6 feedback in MODULE:erk_cascade. Both annotons cite the new IL17RD and CBL gene reviews.
