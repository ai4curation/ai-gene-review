  summary: Expand FGFR module with paralog-union variant sets (FGFR1-4 + protostome
    FGFR, FGF classes/Klotho, FRS2/3, SOS1/2), PLCG1 branch, and FGFRL1 decoy
  details: |
    Rebuilt modules/fgfr_signaling.yaml around paralog variant sets (axis: paralog, selection: ONE_OR_MORE), so each step that a paralog group carries is modelled as the union of its paralogs.
    - Receptor step: FGFR1 (PTHR24416:SF131), FGFR2 (SF130), FGFR3 (SF505), FGFR4 (SF343) and the protostome receptors btl/htl/egl-15 (SF550). Shared PAINT nodes on every variant: PTN004704281 (Eumetazoa, seeded by FGFR1-4, btl, htl, egl-15), PTN000699279 (F:GO:0005007 and GO:0017134) and PTN001230349. Lineage-specific nodes: PTN002814653 on FGFR1 and PTN004704289 on FGFR4 (bile-acid regulation, GO:0070857). Function tightened from GO:0004714 to GO:0005007.
    - Ligand step: a paracrine FGF + heparan sulfate variant (FGF1/2/7/8/10) and an endocrine FGF + Klotho variant (FGF19/21/23 plus KL/KLB, GO:0015026, PTN008498336). FGF-family node PTN000160075.
    - FRS step: FRS2/FRS3 paralog variants (GO:0005068) plus GRB2 (GO:0005091). SOS step: SOS1/SOS2 variants (GO:0005085, PTN000560991 on SOS1).
    - PI3K step: PIK3R1 regrounded to PTHR10155:SF3 with GO:0046935.
    - Added an optional PLCG1 branch (GO:0004435, PTN007434641, PMID:1379697 on Y766) and an optional FGFRL1 decoy part (GO:0017134, GO:0040037). FGFRL1 is kept out of the receptor union because it has no kinase domain and sits in PTHR19890.
    - Dropped nucleus from the module context: no step is nuclear.
    - Accessions and PANTHER subfamilies were verified against UniProt REST; 21 rows were added to interpro/panther/panther-members.tsv; 5 PMIDs were cached; all supporting_text quotes were checked verbatim.
    - Remaining validator warnings are advisory PTN-aspect notes (process-only nodes attached to MF/CC claims) and a seed-ID mismatch for the protostome variant, whose PAINT seeds are FlyBase/WormBase ids rather than UniProt.
