  summary: 'Create: S. cerevisiae Rtt109-Vps75 histone acetyltransferase complex module'
  details: |
    Second module of the CHROMATIN project. CONCRETE PROTEIN_COMPLEX with two parts: Rtt109 (annotons for histone H3K9, H3K27 and H3K56 acetyltransferase activity; K9/K27 Vps75-dependent, K56 on Asf1-presented H3-H4 and not requiring Vps75 in vivo) and Vps75 (acetyltransferase activator activity; H3-H4 histone complex chaperone activity). Concept GO:0070775 H3 histone acetyltransferase complex, noted as inferred part_of chromatin through GO:0000123; the GO:0000123 part_of chromatin edge deletion is recorded with the Rtt109-Vps75 evidence (no activity on nucleosomal H3, PMID:17369253). Asf1 kept out of the parts as a substrate-presenting partner. Two BIOLOGY gaps: site of action relative to nuclear import (PMID:21463458), and Rtt109-independent Vps75 roles. VPS75 scaffold fetched (52 GOA rows, PENDING); three papers cached (PMID:17320445, 27036862, plus 17344218 from fetch-gene). Validated with linkml-validate, module_validator (4 advisory function-conformance warnings: VPS75 unreviewed; RTT109 core functions list the tail sites under GO:0010484) and quote_check (20/20).
