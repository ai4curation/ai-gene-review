  summary: Assess MAVS mitochondrial-import maintenance as a RIG-I module candidate
  details: |
    litscan module-member handoff for PMID:42808786 (mBio, MAVS maintains mitochondrial import competence and also limits RNA virus replication independently of interferon signaling). Determination: do NOT add a part, annoton or connection for MAVS-mediated TOM-complex maintenance to modules/rig_i_signaling.yaml. Recorded instead as a CANDIDATE ASSESSED, NOT MODELLED note plus a references entry with reference_review (MEDIUM/VERIFIED), following the ATHENA/ATPPM precedent in mitochondrial_complex_v and the TRIM25/EspF precedent in nlr_signaling. Grounds: (i) the authors place the function in parallel to and independently of canonical interferon signaling, so it sits outside GO:0039529, the concept this module is grounded on, and has no sound connections edge; (ii) the mechanism it describes already has a module, MODULE:mitochondrial_protein_import, whose tom_translocation part (GO:0005742) is the complex in question with reviewed human TOMM40/TOMM22/TOMM20/TOMM70 representatives; (iii) direct versus indirect action on TOM is undistinguished by the cached text, which is abstract-only (mBio ahead-of-print, no PMC record on 2026-10-28; the bioRxiv version 10.1101/2025.04.28.651145 was also unreachable), so no module part and no knowledge_gaps entry were written; (iv) no genes/human/MAVS review exists, and MAVS's only protein-import annotation GO:0070585 (IDA, PMID:23582325) is the unrelated NLRP3-recruitment finding, so the participation question belongs in a MAVS gene review first. modules/mitochondrial_protein_import.yaml deliberately left unchanged. Follow-up: create genes/human/MAVS and revisit once the full text is available.
