  summary: Add ATG13-ASB1 MAVS K63-polyubiquitination amplification part
  details: |
    Curated issue #3922 from the full text of PMID:42704283 (cached in this change). Added an optional REGULATORY_STEP part on MAVS signalosome assembly with two annotons: ATG13 (UniProtKB:O75143) as signaling adaptor (GO:0035591) presenting MAVS to the ligase, and ASB1 (UniProtKB:Q9Y576) as CRL5 substrate receptor (GO:1990756) building the K63 chain on MAVS Lys348. Connected as POSITIVELY_REGULATES into mavs_signalosome_assembly rather than inserted as a cascade stage, because reporter epistasis places both proteins upstream of TBK1 and the step modulates an already-assembled signalosome. Recorded two BIOLOGY knowledge gaps (compartment of the step; generality beyond the stimuli tested) and noted that neither ATG13 nor ASB1 carries interferon/innate-immunity annotations in GOA. Validated with linkml-validate -C ModuleReview and ai_gene_review.validation.module_validator, and re-rendered pages/modules/rig_i_signaling.html.
