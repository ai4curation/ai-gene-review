  summary: Add optional ATG13-ASB1 MAVS K63-polyubiquitination part from PMID:42704283
  details: |
    Literature triage of issue #3922 (litscan module-member handoff for PMID:42704283).

    Decision: ATG13 and ASB1 are represented, but as an optional amplifying part (order 4,
    mavs_k63_polyubiquitination, optional: true) with a POSITIVELY_REGULATES connection into
    mavs_signalosome_assembly, not as core transduction steps. Rationale: every perturbation in the
    source changes the magnitude of MAVS signalling rather than its existence, and the module-curation
    convention keeps regulation outside the module core unless the pathway definition requires it. The
    shape follows the context-dependent LYN regulator precedent in
    modules/b_cell_receptor_signaling.yaml.

    Annotons added: asb1_mavs_crl5_substrate_receptor (UniProtKB:Q9Y576, GO:1990756
    ubiquitin-like ligase-substrate adaptor activity) and atg13_mavs_ubiquitination_adaptor
    (UniProtKB:O75143, GO:0097027 ubiquitin-protein transferase activator activity); both carry
    GO:1900246 positive regulation of RIG-I signaling pathway. No catalytic activity is asserted for
    either: the transfer belongs to the CRL5 core.

    ATG13's autophagy-initiation role and the rest of the ULK1 complex were deliberately NOT brought
    into the module. The source separates the MAVS-activating activity from autophagy by three
    independent lines (phospholipid-binding and ATG101-binding HORMA mutants retain activity, 3-MA
    insensitivity, no MAVS-LC3 colocalization), so only the adaptor role is modeled.

    Accessions resolved from the UniProt REST API (ASB1 Q9Y576) and the existing gene review
    (ATG13 O75143); GO ids resolved via OLS. No identifier was written from memory. All 16 inline
    citations in modules/rig_i_signaling-notes.md and every supporting_text in the YAML were checked
    as verbatim substrings of the cached publications/PMID_42704283.md.

    A knowledge_gaps entry records the scope limit that decides the part's future placement: one
    group, influenza A only (H9N2/H1N1), human cell lines, no in vivo data, and other reported MAVS
    K63 ligases (TRIM31, TRIM22) not yet reviewed. No alternative-ligase variant_set is asserted.

    Outcome needs_followup: genes/human/ATG13 carries no innate-immunity content and does not assert
    GO:0097027, which the module validator reports as a FUNCTION_UNREVIEWED coverage advisory; and the
    module members MAVS, RIGI and ASB1 have no gene reviews. Both are out of scope for this change.
