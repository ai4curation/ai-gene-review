  summary: Assess ATG13/ASB1 MAVS-ubiquitination candidates against RIG-I signaling
  details: |
    Resolved the litscan:module-member handoff #3922 (PMID:42704283, ATG13 promotes K63-linked polyubiquitination of MAVS via ASB1 to restrict influenza A virus replication). Fetched the full text with `just fetch-pmid` (PMC13587579, XML route) and read Results and Discussion rather than the abstract alone.

    Determination: ATG13 (UniProtKB:O75143) and ASB1 (UniProtKB:Q9Y576) are NOT added as parts or annotons of this module. Both accessions were confirmed via the UniProt REST API (517 aa and 335 aa, both "Evidence at protein level"). Reporter epistasis in the paper does place them at the MAVS node - each potentiates RIG-I N- and MAVS-driven IFN-beta/ISRE output but not that of TBK1, IKK-epsilon or IRF3-5D - so mavs_signalosome_assembly is where they would go if admitted.

    Three reasons not to admit them. (i) Granularity and evidence order: the module is a deliberately compact three-step backbone (sensing, MAVS signalosome assembly, TBK1-IRF activation) with five annotons, each an obligatory cascade component, and it carries no regulatory layer at all. Its own deep-research report inventories that layer - TRIM25 and RIPLET/RNF135 on RIG-I, TRIM31/TRIM22 on MAVS, ZDHHC7/ZDHHC12 palmitoylation, PRMT9 methylation, SIRT3 deacetylation, O-GlcNAcylation, USP10/USP35, WDR77 and PWWP3A - none of which is modelled. Admitting a single-paper accessory pair as the only represented MAVS ubiquitin regulators would invert the evidence order (the #3918 reasoning). (ii) Role: ATG13 and ASB1 tune the magnitude of an already-active step rather than switching it on; ATG13 knockout reduces but does not abolish RNA-virus-induced IFNB1/CXCL10, and the authors cite an earlier survey in which ATG13 had no effect on influenza replication in HeLa or U2OS cells. That is what the schema's `omitted_regulators` slot describes, but it is only meaningful alongside `activation_logic`, which this module does not carry, so the determination is recorded in notes/evidence instead. (iii) Determinacy and grounding: the ASB1-to-MAVS ligase relationship and the K348 acceptor site rest on this one paper and almost entirely on transfected HEK-293T reporter and ubiquitination assays, and are unreconciled with the K63 sites the same Discussion attributes to UBE2N-Riplet and UBE2N-TRIM31 (K7, K136, K297, K500) and with RNF34's reported K27/K29 chains on the same K348; the ATG13-TRAF3 interaction found in the same experiments is explicitly left unexplained. ASB1 has no genes/human/ASB1/ review and no GO annotation touching innate immunity (QuickGO), and ATG13's completed review has no immune-related process term, so the gene-level curation a module part would rest on does not exist yet.

    Encoding follows the #3918 precedent in mitochondrial_complex_v: a `CANDIDATE ASSESSED, NOT MODELLED` paragraph in `module.notes`, queryable `EvidenceItem` entries with verbatim quotes, and the reference carrying a `reference_review` (relevance MEDIUM, correctness VERIFIED). Unlike that case a `knowledge_gaps` entry was added here, because MAVS is a modelled part and the residual question is a genuine BIOLOGY unknown: which lysines of endogenous MAVS carry the activating K63 chains and which E3 writes each, with the literature's site assignments conflicting rather than accumulating. Its provenance quotes the paper's own admissions. No exclusion guard was added: every participant here is selected by an explicit UniProt accession or PANTHER family, so no selector can sweep ATG13 or ASB1 in and guard text would be redundant (the #3092 reasoning).

    Module composition is unchanged. Schema validation and the module validator pass; the 2 remaining warnings are pre-existing on main and concern the uncached PANTHER member index for the TRAF6 and TBK1 family annotons. Follow-up curation named in the notes, in order: the nonautophagic RLR role added to the existing genes/human/ATG13/ review, then genes/human/ASB1/ and genes/human/MAVS/ reviews, then a regulator-first MAVS-signalosome regulation arm.
