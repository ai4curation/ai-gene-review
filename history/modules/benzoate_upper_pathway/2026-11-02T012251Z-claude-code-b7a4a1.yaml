  summary: 'Address PR review: BenC is not a subunit of the BenAB oxygenase'
  details: |
    PR #5366 review round (ai4c-reviewer review 5636943045). Blocking finding 1: the annoton modelled benzoate 1,2-dioxygenase as a PROTEIN_COMPLEX of three active units, including BenC. BenC is a separable monomeric reductase that docks transiently and was purified and reconstituted independently of the oxygenase (PMID:12949084), so it is not a subunit. Restricted the PROTEIN_COMPLEX to BenA+BenB, which is the stable (alpha-beta)3 ISP and carries the complex-level GO:0018623, and restored benc_electron_transfer as a sibling annoton in the same REACTION node with its function, cofactors and evidence unchanged, following the VanA/VanB precedent in hydroxycinnamate_vanillate_catabolism.yaml. Also rewrote the MODELLING note to say why BenC is excluded, and replaced the unsourced 'UniProt query (2026-10-23)' taxon claim with the exact REST query string and the four organism_ids it was run for. Side effect: BenC's three representatives are now function-conformance checked in their own right (3 CORE_SUPPORTED rows) instead of as complex units. Re-validated: 0 warnings, 100% compliance, 12/12 gene reviews complete.
