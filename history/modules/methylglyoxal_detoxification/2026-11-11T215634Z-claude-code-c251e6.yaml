  summary: Complete methylglyoxal detoxification module (species-neutral, metal-class
    and lineage variants)
  details: |
    Made the glyoxalase module species-neutral with P. putida KT2440 kept as one exemplar. Glyoxalase I split into Zn2+-class (PTHR10374:SF30) and Ni2+-class (PTHR46036:SF5, E. coli GloA, PTN000043163) variants. Added E. coli GloB and PTN002463577 to the GloB variant. Eukaryotic glyoxalase II narrowed from PTHR11935 to SF94 (fungal GLO2), GLO4 gene product and SF80 (vertebrate HAGH, cytosol and matrix) because PTHR11935 restricts GO:0004416 to those subfamilies. Updated knowledge gaps, evidence and notes; status COMPLETE.
