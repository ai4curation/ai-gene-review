  summary: New module for spliceosomal snRNP biogenesis (PW:0001073).
  details: |
    Drafted from RGD PW:0001073 (spliceosome) as part of tranche 11. Methylosome symmetric dimethylation of Sm proteins (PRMT5-WDR77-CLNS1A; pICln-Sm 6S intermediate), SMN complex Sm-ring assembly, TGS1 cap hypermethylation, SNUPN/KPNB1 nuclear import and optional Cajal body maturation. Proposes Sm protein complex chaperone activity and a RHEA cross-reference on GO:0035243.
