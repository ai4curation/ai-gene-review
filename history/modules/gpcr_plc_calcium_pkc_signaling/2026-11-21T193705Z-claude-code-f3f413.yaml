  summary: Fix Gq exemplar and PKC family; add missing functions
  details: |
    Signaling-module review pass. The Gq-coupled receptor exemplar was ADRB2 (a Gs-coupled receptor); replaced with ADRA1A (UniProtKB:P35348, PTHR24248 per UniProt, GO:0004937 by IMP/IBA in GOA). The conventional PKC family id was PTHR24356, but UniProt places PRKCA in PTHR24351; re-pointed after checking the cross-reference, PTN000683254 is shared by both families. Added G protein activity to GNAQ, the IP3-gated calcium channel activity and ER membrane location to ITPR1, narrowed PLCB1 to GO:0004435 and PKC to GO:0004698, and added the calcium-to-PKC connection. Schema and module validator pass; remaining warnings are family-review coverage and PANTHER member-index notices.
