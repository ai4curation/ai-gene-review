  summary: Create P2/EMS contact signaling module (MES-1/SRC-1 and MOM-2/MOM-5 Wnt)
  details: |
    New concrete C. elegans module for the two partly redundant signals across the P2/EMS contact in the four-cell embryo, created to give the newly reviewed mes-1 (G5EBL2) a module home. Five root parts: the MOM-2/MOM-5 Wnt arm; the MES-1/SRC-1 Src arm; the EMS endoderm output (MOM-4, WRM-1, LIT-1, POP-1); the EMS spindle output (LET-99, LIN-5); and the reciprocal P2 division-orientation output (GPR-1/GPR-2). Both arms are connected as parallel positive regulators of both EMS outputs (PMID:12110172, PMID:27672093), and the Src arm also regulates the P2 output (PMID:21903670, PMID:20823070). MES-1 carries no molecular function, following its gene review (predicted pseudokinase, kinase rows removed); MOM-4 and GPR-1 MFs match their gene reviews' core functions. MOM-2, MOM-5, SRC-1, LIT-1, WRM-1, POP-1, LET-99 and LIN-5 have no gene reviews; accessions from UniProt REST, MFs from the cited papers (LET-99 has none). Two BIOLOGY knowledge gaps: the molecular activity of MES-1 and how it activates SRC-1, and where the Wnt and Src arms converge. Cached PMID:9288750 for this module. Members named in text only: MOM-1, MOM-3/MIG-14, DSH-2, MIG-5, CED-10, ARX-2, PIG-1, PAR-1, PAR-2; PIE-1/POS-1/MEX-1 control of mom-2 translation recorded as upstream ligand supply, out of scope. Schema validation, module validator (0 warnings) and quote check pass.
