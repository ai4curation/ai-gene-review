    Created modules/irf3_irf7_interferon_induction.yaml as the first module of projects/PRODUCTION_TERMS.md: the shared arm that 21 production GO-CAMs were naming with GO:0032481 positive regulation of type I interferon production. Three parts: IRF kinase activation (a ROUTE variant set over the adaptor-licensed TBK1/IKBKE route, with a REALIZER set over the STING/MAVS/TRIF pLxIS adaptors, TRAF3 self-ubiquitination, the TBK1 or IKBKE kinase and the TANK/NAP1/SINTBAD scaffolds, and the MyD88-IRAK4-TRAF6-IRAK1-IKK-alpha route to IRF7 in plasmacytoid dendritic cells); dimerization and nuclear import (karyopherin module by module_ref, with a knowledge gap on the importin that carries the IRF dimer); and interferon gene transcription, which names IFNB1 and IFNA2 as the transcription factor's targets. Proposes a new term, IRF3/IRF7 signal transduction, under GO:0141124 intracellular signaling cassette, with GO:0007249 and GO:0060395 as precedent. 18 annotons pinned to 7 production GO-CAMs. Cached five publications (PMID:12692549, 12702806, 15767370, 16612387, 15800576) whose PMIDs were confirmed against PubMed. Validated: linkml-validate ModuleReview clean; module_validator passes with one coverage warning (AZI2 core function has no GO id); 43/43 quotes verified; renders with 100 percent recommended-field compliance and no function conflicts.
