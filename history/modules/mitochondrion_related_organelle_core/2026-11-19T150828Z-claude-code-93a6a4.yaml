  details: |
    From the review of #6540. The description no longer says every eukaryote examined has a mitochondrion or MRO; it names the oxymonad Monocercomonoides as the one known exception (PMID:27185558). module_type is CELLULAR_COMPONENT, since the rule tests for the organelle. The Hsp70 step's description says why it uses GO:0044183 rather than its ATP-dependent child (the IBA rows of the representatives come from PTN000452648, and the PTHR19375 family review leaves GO:0140662 unresolved family-wide). Both family descriptions say the per-subfamily placements come from PANTHER's classification files, since the census reports only the union. The Hsp70 step gains a quote from PMID:22079833 naming Hsp70 among the Giardia mitosome's Fe-S assembly proteins. coverage.yaml says why the rule is not referenced by the umbrella. The two PMIDs the reviewer suggested for Giardia mitosomal Hsp70 (12968183, 16081413) resolve to unrelated papers and were not used.
