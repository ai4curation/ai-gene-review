- type: CREATE
  outcome: changed
  summary: 'New rule: chaperone core shared by mitochondria and MROs'
  details: |
    New Eukaryota-scoped rule module for the organelle kept by every census eukaryote, mitochondrion or mitochondrion-related organelle (hydrogenosome, mitosome). It requires a mitochondrial-type Hsp70 (PTHR19375 SF184, SF505, SF545; PAINT node PTN000452554, Eukaryota, mitochondrion IBD) and a mitochondrial Cpn60 (PTHR45633 SF3, SF17; PAINT node PTN000143509, mitochondrial matrix IBD). Representatives human HSPA9, yeast SSC1, Arabidopsis mtHsc70-2, human HSPD1, yeast HSP60; subfamily membership checked against PANTHER's classification files and IBA rows. Evidence: PMID:9419358, PMID:11880223, PMID:10022906, PMID:22079833, PMID:19995967, PMID:26323757, PMID:27185558. Met in all 24 census organisms. The notes record that it shows the organelle, not its functions; that plastid DnaK-type Hsp70 may share SF184; and that it has not been tested against a genome with no MRO (Monocercomonoides).
