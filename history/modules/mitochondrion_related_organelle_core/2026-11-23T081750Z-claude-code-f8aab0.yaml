- type: EDIT
  outcome: changed
  summary: Giardia mitosomal Hsp70 and Cpn60 quoted from the primary proteome paper
  details: |
    Follow-up from the review of #6540. The Hsp70 step's Giardia mitosome evidence now quotes Jedelsky et al. 2011 (PMID:21390322) directly, replacing the second-hand quote from PMID:22079833: 'A single mitosomal Hsp70, three J-protein co-chaperones and the nucleotide exchange factor GrpE were identified in the mitosomes.' The Hsp70 step also quotes the same paper for its Fe-S role ('components that have been proposed to transfer the transient FeS clusters to target apoproteins, including IscA (Fig. S2), the monothiol glutaredoxin 5, chaperone Hsp70 and its co-chaperones the J-protein HscB'), and the Cpn60 step quotes it for the chaperonins ('We also identified the chaperonins Cpn60 and Cpn10 (Fig. S6), that function in folding and assembly of newly-imported proteins'). PMID:22079833 remains as the Trichomonas hydrogenosome evidence. Correction: the #6540 review discussion said this paper's marker sentence failed the quote check because of its [2Fe2S] and [28] brackets. That was wrong: the checker keeps such brackets as literal text, and the failure came from running it in a second worktree whose shared environment read the main checkout's publications folder, where the paper was not cached. The full sentence verifies.
