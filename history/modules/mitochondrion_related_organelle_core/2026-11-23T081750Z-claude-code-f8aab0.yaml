  details: |
    Follow-up from the review of #6540. The Hsp70 step's Giardia mitosome evidence now quotes Jedelsky et al. 2011 (PMID:21390322) directly, replacing the second-hand quote from PMID:22079833: 'A single mitosomal Hsp70, three J-protein co-chaperones and the nucleotide exchange factor GrpE were identified in the mitosomes.' The Cpn60 step gains the same paper's marker list ('ferredoxin, Cpn60, Hsp70 and glutaredoxin 5'), a bracket-free stretch of the sentence whose [2Fe2S] and [28] the quote checker reads as editorial brackets. PMID:22079833 remains as the Trichomonas hydrogenosome evidence.
