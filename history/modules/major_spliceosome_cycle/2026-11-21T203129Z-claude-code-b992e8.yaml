  details: |
    Drafted from RGD PW:0001073 (spliceosome) as part of tranche 11. snRNPs modelled once (Sm and LSm rings, U1, 17S U2, U4/U6, U5, tri-snRNP), then assembly states E/A, B, Bact/B*, C, C*/P and ILS joined by PRECEDES, with the DEAD/DEAH-box ATPases placed at the transitions they drive, RNA-catalysed transesterification on the C and C* complexes, the NineTeen complex, and the EJC by module_ref. 90 of RGD's 153 human genes are participants.
