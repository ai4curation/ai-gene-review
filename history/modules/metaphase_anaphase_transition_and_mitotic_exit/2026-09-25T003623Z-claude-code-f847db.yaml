  summary: 'Create module: metaphase/anaphase transition and mitotic exit'
  details: |
    Created
    modules/metaphase_anaphase_transition_and_mitotic_exit.yaml, modeling the two
    APC/C-driven proteolytic switches that end mitosis. Five parts: APC/C-Cdc20
    activation (APC/C as a protein complex with APC2, APC11 and TPR active units;
    Cdc20/Slp1 coactivator); optional spindle-assembly-checkpoint restraint
    (Mps1/Mph1 kinase and the mitotic checkpoint complex with Mad2, BubR1/Mad3 and
    Bub3 active units); securin destruction, separase activation and cohesin
    kleisin cleavage; mitotic cyclin destruction with the Cdh1/Hct1/Ste9
    coactivator; and a taxon variant set for the CDK-counteracting phosphatase
    (Cdc14 released by the MEN in budding yeast; Clp1/Flp1 with the SIN in fission
    yeast; reactivated PP2A-B55 in metazoa). Grounded in GO:0007091 and
    GO:0010458, with annoton-level links to the fission-yeast SAC GO-CAM
    gomodel:67369e7600002505 and the human CDC20 model gomodel:6348a65d00002236.
    The coactivator function was set to GO:1990757 ubiquitin ligase activator
    activity to match the PAINT node PTN000460086 and the pombe slp1 review.

    Grounding as for the sibling modules. Securin asserts no family id (PTTG1 and
    Cut2 are in PTHR10418, Pds1 is unclassified). Cdh1, Cdc14/Clp1, Tem1/Spg1 and
    the metazoan PP2A subunits are grounded at PANTHER 19.0 subfamily level where
    all exemplars share one. PAINT nodes used: PTN000231994, PTN000285227,
    PTN000285286, PTN000460086, PTN001122082, PTN000217420, PTN000361607,
    PTN000300670, PTN000286904, PTN000019791. PMIDs verified against PubMed
    E-utilities (note the verbatim PubMed spelling in the Funabiki 1996 title).

    Validation: linkml-validate passes; module_validator term labels OK with
    advisory warnings only; derived QC 100% recommended-field compliance, no
    leaf-grounding gaps, no conformance violations; the one PRECEDES edge carries
    chaining_status NOT_APPLICABLE. Rendered to
    pages/modules/metaphase_anaphase_transition_and_mitotic_exit.html. Left
    undone: no module deep-research report; the FEAR network and Cdh1
    re-inhibition by G1 cyclin-CDK are prose only.
