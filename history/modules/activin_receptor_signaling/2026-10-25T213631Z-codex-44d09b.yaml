  summary: Ground the canonical activin relay across human and fly families
  details: |
    Rebuilt the module as four mechanistic steps with five family selectors, 11 verified PANTHER subfamilies and 11 reviewed human/fly representatives. Curated 29 references with step and causal-edge findings. Retained Metazoa as a nonuniversal toolkit envelope, explicitly separating ancient nonbilaterian machinery from demonstrated native ligand wiring. Removed the unsupported activin-specific PTN claim. Distinguished type II to type I phosphorylation from type I to R-SMAD phosphorylation, mature agonist from inhibin antagonist, shared BMP components, Babo isoforms and conditional SMAD2 DNA binding. Marked outdated C/E inactivity findings overturned using direct ALK7 studies. Linked the human activin GO-CAM. Independent biological QA found no blocking defects; direct SMAD4 DNA-binding evidence was added after QA. Module schema and semantic/family/reference validation pass; all 1658 original member annotations were adjudicated.
