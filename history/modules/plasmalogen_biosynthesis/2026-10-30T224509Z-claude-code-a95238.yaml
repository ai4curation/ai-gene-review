  details: |
    Root variant set with two whole-pathway alternatives that share no step or intermediate: the eukaryotic O2-dependent route via module_ref to ether_lipid_plasmalogen_biosynthesis, and the anaerobic bacterial route in which a BCR/HAD-family plasmalogen synthase reduces a diacyl phospholipid directly. The anaerobic route has single-chain PlsA (PTHR32329:SF4; Q8DVN8, Q835P9, G0VRE7, Q9CDI2) and two-subunit PlsA+PlsR (C. perfringens A0A0H2YUD5/A0A0H2YN56) variants. No GO MF, Rhea or EC exists for the anaerobic activity; function is described, not termed. Quotes checked against cached publications. Provider deep research was not run (no API keys in this environment).
