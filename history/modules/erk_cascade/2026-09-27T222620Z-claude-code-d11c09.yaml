  details: |
    Added three connections to modules/erk_cascade.yaml, each with cited evidence and verbatim supporting text: erk_mapk NEGATIVELY_REGULATES raf_map3k (Raf-1 feedback phosphorylation, PMID:15664191; B-Raf, PMID:19933846), erk_output NEGATIVELY_REGULATES ras_gef_step (MAPK phosphorylation sites on hSos1 regulating Grb2 binding, PMID:8816480), and erk_output CAUSES mapk_negative_regulation (MKP-1/MKP-2 induction by the p42/p44 MAPK cascade, PMID:8995446). The DUSP step description now says the loop is closed. The edges were surfaced by the BOOLEAN_MODELS calibration against BBM-070 (Grieco 2013) and SIGNOR-EGF, both of which are recorded as file: evidence. After the edit the module agrees with BBM-070 on all 8 mapped edges and the translated Boolean network oscillates under sustained adaptor recruitment instead of locking on, matching the published model. Validated with linkml-validate and module_validator (titles and supporting text verified against cached publications); rendered.
