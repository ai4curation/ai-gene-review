  summary: 'erk_cascade: qualify SPRY4 variant as Ras-independent RAF1 inhibition
    lacking the GRB2 SH3 motif'
  details: |
    Updated the SPRY4 variant description after the OpenScientist SPRY4 run and Sasaki 2003. SPRY4 blocks Ras-independent (VEGF) RAF1 activation but not EGF-induced Ras-dependent activation. It lacks the SPRY2-specific PxxPxR GRB2 SH3 motif, and its cysteine-rich domain directly inhibits TESK1.
