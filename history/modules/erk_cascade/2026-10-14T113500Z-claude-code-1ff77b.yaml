  summary: 'erk_cascade: qualify BBM-070 agreement as attractor kind only, not mechanism'
  details: |
    Responding to review of ai4curation/ai-gene-review#4966. Grieco et al. 2013 (PMID:24250280) attribute the transience of their cyclic ERK attractor to receptor-level feedback (receptor degradation and PKC) and report that disrupting the downstream feedbacks does not qualitatively change the outcome. The derived module model has no receptor step, so its cyclic attractor comes entirely from the downstream feedbacks. Reworded the sustained_stimulus and transcriptional_feedback_lost scenario descriptions and the BBM-070 external-model description to say the agreement is in attractor kind only, and added a second PMID:24250280 evidence item quoting the receptor-feedback passage. No connections or expectations changed.
