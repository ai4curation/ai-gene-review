  summary: Sharpen the TRPC subunit knowledge gap after the OpenScientist run
  details: |
    An OpenScientist free-text hypothesis run on TRPC4 (genes/human/TRPC4/TRPC4-hypotheses/kisspeptin-trpc-subunit-identity/) refuted the determinant rationale for singling out TRPC4: the Src-phosphorylated tyrosines lie in the hypervariable distal C-tail, were characterised as exocytotic membrane-insertion determinants rather than gating residues (PMID:16144838), and are carried by both TRPC4-alpha and TRPC4-beta, while activation by PIP2 depletion is a TRPC1/4/5 subfamily property. The native current's insensitivity to 100 micromolar lanthanum (PMID:18434521) is a further reason to expect a heteromer. The gap statement and boundary now say so; no annoton or term assignment changed, since the run is an independent interpretation of the same evidence rather than independent evidence.
