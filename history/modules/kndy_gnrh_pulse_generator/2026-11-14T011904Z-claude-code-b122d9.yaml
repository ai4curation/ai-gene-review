  summary: Create module kndy_gnrh_pulse_generator
  details: |
    Created MODULE:kndy_gnrh_pulse_generator, the arcuate KNDy (kisspeptin/neurokinin B/dynorphin) neuron GnRH pulse generator, as a five-part CONCRETE biological-process module in Mammalia.

    Boundary decisions. Core: the arcuate KNDy oscillator (part 2, autosynaptic NKB -> NK3R -> Gq excitation and burst synchronisation; part 3, co-released dynorphin -> KOR presynaptic inhibition terminating the burst), its kisspeptin output onto GnRH neurons (part 4, KISS1 -> KISS1R -> Gq -> TRPC-like cation conductance -> depolarisation), pulsatile GnRH release at the median eminence (part 5), and estradiol/ESR1 negative feedback onto the KNDy neurons as a regulatory input (part 1, which includes modules/estrogen_receptor_signaling by module_ref for the generic receptor relay and adds an ESR1 annoton for the KNDy-specific repression of Kiss1/Tac3/Pdyn and of Tacr3/Oprk1). Out of scope and recorded as such: pituitary GnRHR signalling and gonadotropin secretion (downstream, different cell type, covered by the CGA and FSHR gene reviews and the FSH GO-CAM reviews); the median preoptic NK3R thermoregulatory projection (the hot-flush mechanism, a separate output of the same neurons, carried in the tachykinin gene reviews under temperature homeostasis); prohormone processing; and the preovulatory surge circuit, which appears only as one arm of the part-4 route variant set. Estradiol is an exogenous input, so the feedback loop is deliberately open at the module boundary (the validator's one substantive warning).

    Species scope: Mammalia as an envelope. Complete-circuit evidence is mouse (optogenetics, slice electrophysiology, knockouts); the three-peptide phenotype and ERalpha co-expression are also sheep; estradiol suppression of infundibular NKB is cynomolgus monkey; human evidence is loss-of-function genetics for TAC3, TACR3, KISS1 and KISS1R plus the post-menopausal rise in infundibular NKB expression. Whether the human circuit generates pulses by the rodent mechanism is a module-level BIOLOGY knowledge gap.

    Grounding. MF terms on annotons, process/context terms on nodes and context. PANTHER subfamily ids read from interpro/panther/panther.obo (PTHR15536:SF1, PTHR16955:SF6, PTHR11438:SF4, PTHR46925:SF1, PTHR10218:SF329 and SF328); PAINT nodes only from local slices (PTN002704209 for the kisspeptin precursors, PTN009086039 for the kisspeptin receptor clade). Two descriptors deliberately assert no PANTHER id: the kisspeptin receptor, because the PTHR45695 family review established that KISS1R is a leaf of PTHR24230 rather than of the family UniProt cross-references it to, and the TRPC channel, because the subunit carrying the kisspeptin current is unsettled. GO-CAM pins: gomodel:68d5ebd600000736 on the three part-2 annotons and gomodel:68d5ebd600001111 on the direct-route ligand and the three receptor-step annotons; the Gs sister model 68d5ebd600000043 is named but not pinned because this module asserts no Gs branch. UniProt accessions were read from the REST API in the same step they were written. ESR1, OPRK1, GNRH1 and TRPC4 have no gene reviews here, which the module notes and the rendered QC panel both record; the module is left DRAFT for that reason.

    Four BIOLOGY knowledge gaps (which tachykinin receptor carries endogenous NKB; whether dynorphin-KOR terminates the pulse and what times the interval; which TRPC subunit carries the current; whether the human circuit works the rodent way). Three proposed new terms with verified parents: gonadotropin-releasing hormone secretion (GO:0030072), regulation of gonadotropin-releasing hormone secretion (GO:0046883), kisspeptin receptor activity (GO:0008188).

    Validation: linkml-validate -C ModuleReview clean; module_validator passed with 8 warnings (7 are the PANTHER member index not built in this checkout, 1 the open feedback loop); just validate-quotes 88/88 verified; render-module reports 100% recommended-field compliance.
