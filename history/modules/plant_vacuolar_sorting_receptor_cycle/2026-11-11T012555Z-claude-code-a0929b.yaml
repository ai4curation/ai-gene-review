  details: |
    New Viridiplantae BIOLOGICAL_PROCESS rule: VSR (PTHR22702 SF1 and SF4, the UniProt and PAINT placement, plus PANTHER-file PTHR24034 SF166, SF199, SF171, SF180 and SF181; PTHR24034:SF89 excluded as it groups VSR7 with animal CD93) and retromer Vps35 (PTHR11099 SF0, SF6, SF5), Vps26 (PTHR12233 SF20, SF15) and Vps29 (PTHR11124:SF12) required; RMR (PTHR47168:SF5) optional. Notes record that PTHR22702:SF1 holds animal PRADC1, that the Vps29 subfamily includes bacterial phosphoesterases, and the RMR placement disagreement with PANTHER's files (PTHR22765:SF334).
