  summary: Narrow Nrk1 selectors to PTHR10285:SF158 and document the subfamily
  details: |
    Both Nrk1 annotons (ribosylnicotinamide and nicotinate riboside kinase) listed PTHR10285 SF158/SF126/SF143. PANTHER 19.0 classification files place S. cerevisiae NRK1 (P53915) and S. pombe nrk1 (Q9C0W1) in SF158 (with Candida A0A1D8PSP6 and Drosophila CG12016); SF126 and SF143 hold only vertebrate NMRK1 and NMRK2. Replaced family_terms with term PANTHER:PTHR10285:SF158 (label SD05789P2 verbatim) and added a description explaining the uninformative subfamily name and why the vertebrate subfamilies are omitted from this fungal module. Re-rendered pages/modules/nad_de_novo_and_salvage_fungal.html.
