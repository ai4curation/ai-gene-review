  summary: Create phage_virion_release_and_lysis module covering canonical dsDNA lysis, single-gene lysis, and filamentous extrusion
  details: |
    Created modules/phage_virion_release_and_lysis.yaml as a concrete biological process module (GO:0019076 viral release from host cell) with a 3-way VariantSetDescriptor (virion_release_strategy) modeling (1) canonical dsDNA phage multi-gene cytolysis via inner-membrane holin/pinholin pore formation (GO:0044660), peptidoglycan cell-wall hydrolysis by endolysin (GO:0003796 / GO:0008745), and periplasmic spanin-mediated outer membrane disruption; (2) microvirus/levivirus single-gene lysis via inhibition of host peptidoglycan biosynthesis (GO:0039640, e.g., phiX174 E inhibiting MraY and Qbeta A2 inhibiting MurA) or single-protein membrane lysis (MS2 L); and (3) non-lytic filamentous phage extrusion across the host cell envelope via the pIV/pI/pXI trans-envelope secretion channel (GO:0099045, e.g., M13/fd/f1). Included optional lysis-inhibition regulation (GO:0039639, T4 rI/rIII) and validated against ModuleReview schema and PANTHER member index.
