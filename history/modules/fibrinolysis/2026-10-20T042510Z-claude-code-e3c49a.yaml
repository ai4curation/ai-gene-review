- type: EDIT
  outcome: changed
  summary: New module from RGD PW:0000481
  details: |
    Created modules/fibrinolysis.yaml from the RGD Pathway Ontology diagram
    PW:0000481, with six parts: fibrin-templated plasminogen activation by tPA,
    receptor-focused activation by uPA/uPAR, plasmin degradation of fibrin, serpin
    inhibition of the activators (SERPINE1, SERPINB2, SERPINE2, SERPINA5),
    alpha2-antiplasmin inhibition of plasmin, and TAFI removal of fibrin C-terminal
    lysines. Molecular functions were taken from each protein's experimental QuickGO
    rows; the fibrinogen annoton carries no molecular function because no GO term
    expresses its cofactor role, which is described in prose instead. The PLAU, PLAUR
    and PLG activities of the human GO-CAM gomodel:68fac5ed00001527 are linked where
    gene and molecular function match. Fibrin clot formation, kallikrein activation of
    pro-uPA and extracellular-matrix plasmin roles are out of scope and recorded in the
    module notes as neighbours.
