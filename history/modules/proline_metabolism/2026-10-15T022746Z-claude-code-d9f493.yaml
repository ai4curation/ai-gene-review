  summary: 'Supersede the symbol-first label edit: main''s rewrite adopted SYMBOL
    (Homo sapiens) and the conflict was resolved by taking its file whole'
  details: |
    Supersedes the 2026-10-09 record 2026-10-09T153559Z-claude-code-b6ad11, which rewrote six
    representative_members preferred_term values in this module from 'human SYMBOL' to 'SYMBOL (human)'
    to clear SYMBOL_LABEL warnings. That record is accurate for the commit it covers and is left alone;
    this record carries the signpost, which is where docs/history.md puts it, because a reader can land
    on either first and only the later one can point forward.

    The edit is no longer in the module. PR #4539 ("YeastPathways to modules (02/12)") rewrote
    modules/proline_metabolism.yaml on main from 565 to 1005 lines, adding Saccharomyces cerevisiae
    PRO1/PRO2/PRO3/PUT1/PUT2/CAR2 and Schizosaccharomyces pombe leaves, and in doing so adopted
    'SYMBOL (Homo sapiens)' for every representative member - the same symbol-first form the earlier
    session wrote, with the binomial in place of 'human', applied to the new leaves as well. All six
    symbols that session touched carry it there (ALDH18A1 twice, OAT, PYCR1, PYCR2, PRODH, ALDH4A1).

    Resolving the resulting conflict on branch claude/cool-edison-o9wvf0-one-carbon-aa therefore took
    main's file whole and re-applied nothing, so git diff origin/main on the module is empty. Re-applying
    '(human)' over '(Homo sapiens)' would have been a regression: the SYMBOL_LABEL warning comes from
    descriptor_symbol() in src/ai_gene_review/module_gene_symbols.py, whose trailing parenthetical is
    matched as '.*', so both forms resolve to the bare symbol and main's is the more precise of the two.
    The earlier session's substantive check also survives the rewrite - main's prodh_activity annoton
    still carries GO:0004657, GO:0006562 and GO:0005739. The first two are this branch's PRODH review's
    core molecular function and core process; GO:0005739 is ACCEPT there on three annotation rows, while
    the review's own core locations are the narrower GO:0005743 and GO:0005759.

    Mechanism note. This supersession was first written as a dated paragraph appended inside the earlier
    record, which is the remedy docs/history.md reserves for a statement that was never true. The test it
    states selects on whether the statement was ever accurate, and this one was, so the remedy is a new
    record - this one. The paragraph was reverted and that record is byte-identical to its original form.
