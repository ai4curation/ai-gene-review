  details: |
    Created and validated concrete bacteriophage pathway module phage_phi29_prolate_head_packaging_and_collar_tail (Bacillus phage phi29 prolate T=3 Q=5 head assembly, pRNA-coupled DNA packaging nanomotor, collar-appendage tail morphogenesis, and host cell lysis).

    A reusable module representing the prolate icosahedral procapsid morphogenesis, pRNA-coupled ATPase DNA packaging nanomotor, short non-contractile collar-appendage-knob tail assembly, cell-wall teichoic acid adsorption and peptidoglycan-degrading genome ejection, and holin-endolysin host cell lysis of Gram-positive protein-primed podoviruses (family Salasmaviridae, exemplified by Bacillus phage phi29, BPPH2). During late morphogenetic gene expression from the p4/p6-activated A3 promoter, dodecameric head-tail connector (portal) gp10 nucleates co-assembly of concentric internal shells of scaffolding protein gp7 with 235 copies of major HK97/BIG2-fold capsid protein gp8 (11 pentamers and 30 hexamers in a prolate T=3, Q=5 lattice) and 55 trimeric gp8.5 head fibers. A ring of phage-encoded packaging RNA (pRNA) docks onto the gp10 portal vertex and recruits the ring-shaped FtsK/HerA-superfamily ATPase gp16, forming a powerful rotary/burst nanomotor that recognizes the left-end gp3-DNA complex and pumps the 19.3 kb linear dsDNA chromosome into the prohead (~2 bp per ATP hydrolyzed) while expelling scaffolding protein gp7. Upon completion of packaging, pRNA and gp16 dissociate and are replaced by the lower collar tube protein gp11, the distal pore-forming tail knob gp9, the peptidoglycan-hydrolyzing tail plug/morphogenesis enzyme gp13, and 12 trimeric gp12 pre-neck appendages (whose C-terminal intramolecular chaperone domain autocatalytically cleaves and releases after folding the beta-helical poly-glycerol-phosphate teichoic-acid hydrolase shaft). Mature virions are released from Bacillus subtilis by the dual-start holin/antiholin gp14 and the GH25 muramidase + LysM cell-wall-binding endolysin gp15.
