  summary: 'Create: SAGA HAT module (Gcn5, Ada2, Ngg1/Ada3, Sgf29) in S. cerevisiae'
  details: |
    New concrete PROTEIN_COMPLEX module for the Gcn5 histone acetyltransferase module shared by SAGA, SLIK and ADA. Part 1 is the Gcn5-Ada2-Ada3 nucleosomal catalytic core, modelled as a protein-complex annoton with three active units (Gcn5 GO:0010484, Ada2 GO:0010698, Ada3 GO:0004402 as a contribution); part 2 is Sgf29 (GO:0140002 histone H3K4me3 reader activity), connected to the core as a positive regulator. GO has no term for the HAT module, so one is requested in proposed_new_terms (parent GO:0000123, parallel to GO:0071819 DUBm complex). A definition change for GO:0070461 SAGA-type complex is proposed because its children ADA and ATAC lack the TAFs its definition requires. The inherited part_of chromatin location is reasonable because the module acetylates nucleosomes. Two biology knowledge gaps. Validated with linkml-validate, module_validator (only the expected FUNCTION_UNREVIEWED warning for Ada2, whose review is in progress elsewhere) and quote_check.
