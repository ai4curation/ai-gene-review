  summary: Recast SYSM-1 as PMK-1/ATF-7 reporter output; align LYS-7 MF with gene
    review
  details: |
    Following the new sysm-1 gene review (Q22714), which found no evidence that SYSM-1 is antibacterial (antibacterial innate immune response marked over-annotated; innate immune response non-core) and whose only demonstrated function is as a secreted intestine-to-germline signal for DNA damage-induced germ cell apoptosis (PMID:35121747), the output part was recast from 'secreted immune effectors' to 'secreted transcriptional output and reporter'. The SYSM-1 annoton now carries GO:1902231 (its core process) instead of GO:0140367, with no MF (matching core_functions), and new evidence from PMID:17096597 (single-gene RNAi of PMK-1 targets did not alter susceptibility) and PMID:35121747; the 'no gene review' caveat was removed. LYS-7 kept as the antimicrobial representative and given carbohydrate binding (GO:0030246) to match its review core function. Description, notes, module description and connection text reworded from 'effectors' to 'outputs'; cross-reference to MODULE:c_elegans_core_apoptosis added. New BIOLOGY knowledge gap on whether SYSM-1 contributes to pathogen resistance. Upstream MFs (TIR-1, NSY-1, SEK-1, PMK-1, ATF-7) re-checked against core_functions; unchanged. linkml-validate and module_validator pass (1 NCBITaxon label warning); verbatim quote check 0 misses; rendered.
