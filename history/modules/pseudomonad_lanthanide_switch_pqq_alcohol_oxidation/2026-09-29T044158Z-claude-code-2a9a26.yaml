  summary: Assert absent Hpt tier for PedS2 from its UniProt domain architecture
  details: |
    Addresses review suggestion 3 on PR 3345. The conformance deviation hedged that the Hpt tier was 'not modelled as a separate step', which described the model rather than the biology. PP_2671 (PedS2, Q88JH8) carries HAMP, histidine-kinase and HATPase domains with no Hpt (PF01627) and no receiver domain in its UniProt record, so it is a simple sensor kinase and the Hpt tier is genuinely absent. The deviation now says so and cites the domain evidence, matching the wording used by the other four two-component modules.
