  summary: Ground the three remaining granzymes in the proteolysis part
  details: |
    Grounded the three remaining human granzymes in part four of the module, which previously carried granzyme B and granzyme A only.

    Added annotons gzmh_proteolysis, gzmk_proteolysis and gzmm_proteolysis, each with its PANTHER subfamily read from interpro/panther/panther.obo rather than written from memory: PTHR24271:SF70 GRANZYME H, PTHR24271:SF52 GRANZYME K, PTHR24271:SF51 GRANZYME M. Each carries the substrate programme that distinguishes it - granzyme H the narrowest specificity and the only documented viral substrates, granzyme M the Met-ase cleaving ezrin and alpha-tubulin directly and reaching the caspases indirectly through survivin, granzyme K the second tryptase converging with granzyme B on BID.

    One deliberate boundary. Granzyme K is grounded here for its intracellular arm only. Its principal documented function is extracellular - constitutive secretion, heparan-sulfate-mediated membrane binding, cleavage of complement C2 and C4 to build a C3 convertase, and cleavage of PAR1 and PAR2 - which is a different mechanism with a different trigger and no requirement for perforin. That belongs in a module of its own rather than as a part of this one, and the annoton's role_description says so. The same judgement is why the gene review marks its two death-signalling rows non-core.

    Also corrected the part description, which said two granzymes were grounded and that GO has no granzyme-specific function term "for either", and the four participant and family descriptions that said the other granzymes "are not grounded here" or "not covered by this grounding". They are now.

    Validation: just validate-modules clean with the PANTHER member index built first, so the family assignments were checked rather than skipped as unindexed.
