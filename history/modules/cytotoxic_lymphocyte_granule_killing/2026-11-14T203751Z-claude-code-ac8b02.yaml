  summary: 'Extend module: granzyme A in part four, granulysin as a new part seven'
  details: |
    Closes two of the three grounding gaps the module recorded when it was created, now that the GZMA and GNLY reviews exist.

    Part four broadened from granzyme B alone to delivered granzyme proteolysis, with a granzyme A annoton beside it. The part description now carries the distinction that matters: granzyme B cleaves after aspartate and substitutes for caspases, granzyme A is a tryptase and an obligate disulfide-linked dimer that kills without them, and the two share nothing but the pore.

    New optional part seven, granulysin killing of intracellular pathogens, with a PROVIDES_INPUT_FOR edge from the perforin pore. This is a second outcome of the same delivery aimed at the pathogen rather than the cell harbouring it, and it is marked optional because it applies only to an infected target. Its annoton deliberately carries no molecular-function identifier, because the GNLY review established that none of GO's molecular functions fits and filed a proposed term instead; the module validator reports that as NO_FUNCTION_ID, which is the correct and expected consequence of omitting an id rather than guessing one.

    Refreshed the PANTHER member index before validating so the two new family assignments were actually checked against PANTHER's classifications rather than skipped as unindexed - the same step taken when the module was created, and for the same reason.

    Derived QC after the extension: 100 percent recommended-field compliance, every leaf node grounded to a representative protein, 10 of 10 grounded genes reviewed with none missing, and 75 quotes verified verbatim. Module validator passes with three informational warnings, two of them the expected NO_FUNCTION_ID pair for granulysin.

    Remaining gaps, still recorded in the notes: the fusion machinery of part two (STX11, UNC13D, STXBP2), which are ClinGen Mendelian campaign genes deliberately not reviewed out of band, and granzymes H, K and M.
