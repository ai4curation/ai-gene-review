  summary: 'Create: cytotoxic lymphocyte granule-mediated killing module'
  details: |
    New module covering how a cytotoxic lymphocyte kills a recognised target using preformed granules, rather than via death receptors. No existing module covered it: the repository's death modules are death_receptor_apoptotic_signaling, intrinsic_apoptotic_signaling and apoptotic_execution_phase, all of which this one feeds into rather than duplicating.

    Six ordered parts, grounded on eight human exemplars whose gene reviews are all complete: target recognition by an activating receptor (FCGR3A), granule polarisation and exocytosis (ARL8B), calcium-dependent perforin pore formation and cargo translocation (PRF1), granzyme B activating proteolysis (GZMB), target death execution as a variant set, and an optional membrane-repair arm (CASP7, SMPD1).

    The variant set is the branch between apoptotic execution (CASP3, CASP7) and pyroptotic execution (GSDME), selection EXACTLY_ONE. Modelled that way because the branch is a property of the target, not the lymphocyte: caspase-3 is required for both routes, and gasdermin E expression decides which outcome follows. That is stated in the variant set's notes so the EXACTLY_ONE is not misread as mechanistic disjointness.

    Validation: linkml-validate clean, module validator passes with one informational warning (no family review adjudicates GO:0004767 for PTHR10340), 65 quotes verified verbatim with none unchecked. Built the PANTHER member index with just ensure-panther-members so that all eight family assignments were actually verified against PANTHER's own classifications rather than skipped as unindexed - that is the check that would catch a guessed family id, and skipping it would have left eight unverified identifiers in a machine-readable field. Derived QC: 100 percent recommended-field compliance, every leaf node grounded to a representative protein, 8 of 8 grounded genes reviewed, 0 function conflicts, and all nine annoton functions reflected in the corresponding gene review's core functions.

    Status DRAFT, not COMPLETE, for two stated reasons rather than as a formality. No module deep research exists because no provider was reachable in this environment. And two grounded genes carry UNDECIDED rows (CASP3 190/199, CASP7 98/101), so gene-review completeness is not wholly clean, though no row anywhere is left PENDING.

    Grounding gaps recorded in the notes rather than papered over: part two has no annoton for the fusion machinery that executes exocytosis (STX11, UNC13D, STXBP2, the FHL3-5 genes), because none has a review here; Arl8b grounds trafficking, not fusion. Granzyme B is the only granzyme grounded, and granulysin is absent for the same reason.

    Where the module and a curated GO-CAM disagree, the disagreement sits on the gocam_associations entry rather than being silently resolved - notably the perforin-to-granzyme edge, which the curated model asserts as direct positive regulation and which this module expresses as PROVIDES_INPUT_FOR.
