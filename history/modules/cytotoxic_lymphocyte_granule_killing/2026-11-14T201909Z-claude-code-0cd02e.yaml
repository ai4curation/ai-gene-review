  summary: 'Amend: correct module prose that rested on reverted review statuses'
  details: |
    Follows the revert of three gene-review status promotions (GSDME and CORO1A to DRAFT, SMPD1 to INITIALIZED), which this module's prose had relied on.

    Two corrections. The module node description said the exemplars were grounded on gene reviews that are complete; it now says they all have gene reviews at mixed curation status, which is what is true. And the status note, which explains why the module is DRAFT, now gives three reasons instead of two: no module deep research, the UNDECIDED rows on CASP3 and CASP7, and the fact that the reviews behind three parts are not at COMPLETE status. That third reason is recorded as deliberate rather than as a gap to close from here, because all three are ClinGen Mendelian campaign genes whose curation state belongs to that campaign - which records that a COMPLETE status does not certify assessment against its current rules, and which accepted GSDME as campaign gene 745 with its DRAFT status explicitly retained.

    One distinction worth keeping straight for anyone reading the rendered page. The derived QC panel's Gene-review completeness column still reports six complete reviews, unchanged by this revert, because that column measures annotation adjudication - no PENDING and no UNDECIDED rows - and not the status field. So the panel and the new status note are measuring two different things and do not contradict each other.

    Module validator still passes with the same single informational warning, and the page was re-rendered.
