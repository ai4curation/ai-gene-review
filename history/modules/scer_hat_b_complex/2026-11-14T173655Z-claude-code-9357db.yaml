  summary: 'Create: S. cerevisiae HAT-B (Hat1-Hat2-Hif1) complex module'
  details: |
    New CONCRETE PROTEIN_COMPLEX module for the yeast type B histone acetyltransferase, the first module of the CHROMATIN project. Parts: Hat1 (GO:0043997 histone H4K12 acetyltransferase activity; cytoplasm and nucleus), Hat2 (GO:0042393 histone binding; cytoplasm and nucleus) and Hif1 (GO:0000510 H3-H4 histone complex chaperone activity, nucleosome assembly; nucleus; optional part, nuclear form only). GO has no HAT-B complex term, so the module concept carries no id and a term is requested under proposed_new_terms (parent GO:0031248). The GO:0000123 part_of GO:0000785 edge is recorded as a proposed EDGE_DELETION: all three subunits carry part_of GO:0000123 annotations and so inherit part_of chromatin, contradicting the enzyme's action on free histone H4. Two BIOLOGY knowledge gaps: free H4 versus H3-H4 dimer as in vivo substrate (conflicting reports), and HAT-B function at double-strand-break chromatin. Gene scaffolds for HAT1, HAT2 and HIF1 were created with just fetch-gene; their annotations are still PENDING. Validated with linkml-validate (ModuleReview), the module validator (3 FUNCTION_UNREVIEWED warnings from the pending reviews) and quote_check (19 of 19 quotes verified).
