  summary: Add PDK1, mTORC2, TSC2 and RHEB; ground PI3K and mTORC1
  details: |
    Signaling-module review, second batch. The description named PDK1, mTORC2, TSC and Rheb but no annoton carried them, so AKT activation had no activating kinase and AKT to mTORC1 skipped two steps. Added PDPK1 (GO:0004676, IDA), an mTORC2 complex annoton with MTOR and RICTOR units, TSC2 (GTPase activator activity, IDA) and RHEB (GO:0043539, IDA). Gave the PI3K regulatory and catalytic families PIK3R1 and PIK3CA as representatives, replaced insulin receptor substrate binding with phosphotyrosine residue binding (core for PIK3R1) as the general docking function, gave mTORC1 its complex term with MTOR and RPTOR units, and added the GO id for PIP3 binding. Zero validator warnings. Schema and module validator pass; remaining warnings are family-review coverage, PANTHER member-index notices and PAINT nodes that attest a related but different term.
