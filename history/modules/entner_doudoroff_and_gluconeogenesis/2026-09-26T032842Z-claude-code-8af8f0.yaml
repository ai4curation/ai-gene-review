  summary: Ground the ED module in GO:0061678 rather than glycolytic process
  details: |
    Top-level concept repointed from GO:0006096 (glycolytic process, the replaced_by of obsoleted GO:0061688) to GO:0061678 (Entner-Doudoroff pathway). GO:0061678 is_a pyruvate metabolic process and carbohydrate catabolic process but not glycolytic process, so the module stays disjoint from the EMP modules grounded in GO:0061615 (a subclass of GO:0006096) under the subsumption-aware conformance check. The two stale evidence entries citing GO:0061688 and GO:0009255 were merged into one GO:0061678 entry that records both obsoletions and their replaced_by values.
