  summary: Generalize ED/gluconeogenesis module, ground every step, promote to COMPLETE
  details: |
    Scope set to ABSTRACT with a Bacteria evidence envelope. 6-phosphogluconate supply is now a ONE_OR_MORE variant set: the phosphorylative Glk-Zwf-Pgl route (Glk optional, since glucose 6-phosphate also comes from PTS uptake or gluconeogenic recycling) or the COMPLETE pseudomonad_2_ketogluconate_loop module by module_ref. The Edd and Eda steps carry E. coli K-12 and P. putida KT2440 exemplars (conservation per PMID:1624451); the lower trunk adds B. subtilis GpmI. The PEPCK route is included by module_ref to gluconeogenesis#oxaloacetate_to_phosphoenolpyruvate instead of ungrounded copies. Every leaf now has a FAMILY selector with verified PANTHER family or subfamily ids (official labels from panther.obo) and representatives with COMPLETE gene reviews; PANTHER ids are omitted for GAPDH (PTHR43148 also holds Epd) and class II FBA (PTHR30304 mixes FBP and TBP aldolases). PAINT ancestral nodes are kept only where a representative is a seed (PTN000470269 Edd, PTN000781248 GpmI). The KT2440 EDEMP cycle is a described connection, not a required part. GapB and the minor G6PDH paralogs are excluded as representatives because their contributions are unmeasured.
