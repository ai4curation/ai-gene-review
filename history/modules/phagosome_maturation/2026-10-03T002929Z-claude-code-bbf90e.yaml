  summary: Create phagosome maturation module
  details: |
    Created a phagosome maturation module (GO:0090382) with five ordered parts: early phagosome Rab5/VPS34 PI(3)P stage (plus C. elegans DYN-1, aligned with the dyn-1 gene review), Mon1-Ccz1-mediated Rab5-to-Rab7 conversion, Rab7/RILP/HOPS/LAMP-dependent phagosome-lysosome fusion, V-ATPase acidification, and an optional NOX2 superoxide part for professional phagocytes. PAINT nodes PTN000005955 (VPS34), PTN000635769 and PTN001939797 (RAB7; PTN000635769 carries GO:0090385), and PTN000239643 (NOX2) were resolved from local IBD seeds. Added panther-members.tsv rows for the representative accessions cited in both phagocytosis modules. Knowledge gaps cover the LAMP molecular function and early V-ATPase-independent acidification.
