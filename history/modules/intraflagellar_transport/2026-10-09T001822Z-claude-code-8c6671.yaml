  summary: Generalize C. elegans IFT module to eukaryotic intraflagellar transport
  details: |
    Renamed from c_elegans_intraflagellar_transport and set context to Eukaryota (NCBITaxon:2759), noting secondary losses with cilia and IFT-independent axoneme assembly in Plasmodium. Subunit and motor roles recast as ortholog FAMILY selectors with worm plus reviewed human representatives (IFT88, IFT140, KIF3A, DYNC2H1, CILK1); no PANTHER ids asserted. Added newly reviewed worm members: OSM-1/IFT172, IFT-20 (no Golgi role in worm), IFT-74/IFT-81 tubulin module (GO:0048487, GO:0015631), IFT-139, IFT-43, IFTA-1 (IFT121/WDR35), KAP-1 (G5EEE6, kinesin binding). Removed GO:0005198 structural molecule activity from all units. OSM-3 moved into an optional accessory homodimeric kinesin-2 part with a taxon/sequence-lineage variant set (nematode variant only; vertebrate KIF17 left to notes, unreviewed). DYF-5/CILK1 modelled as regulation (GO:1905796, GO:1902017) with a new connection to IFT-B for tubulin unloading. Added human/mouse/Chlamydomonas evidence with verbatim quotes (49 quotes checked). Cross-reference to MODULE:ciliary_transition_zone updated. linkml-validate clean; module_validator passed (2 warnings); rendered.
