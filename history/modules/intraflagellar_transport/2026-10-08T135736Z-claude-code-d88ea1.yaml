  summary: 'Create C. elegans module: Intraflagellar transport in Caenorhabditis elegans
    sensory cilia'
  details: |
    New concrete C. elegans IFT module bounded to the IFT machine in non-motile sensory cilia. Five root parts: IFT-B complex (osm-5, osm-6, che-13, che-2, dyf-1, dyf-3, dyf-6, dyf-11, dyf-13 as active units), IFT-A complex (che-11, daf-10, dyf-2), anterograde kinesin-2 transport with two ordered sub-parts (heterotrimeric kinesin-II klp-11/klp-20/KAP-1 import to the handover zone, then homodimeric OSM-3 to the distal tip), retrograde dynein-2 (che-3, xbx-1), and DYF-5 kinase regulation of motor docking and IFT-74 tubulin unloading. The BBSome is cross-referenced (MODULE:bbsome) as an interface, not duplicated. MFs follow the worm gene reviews; KAP-1 is named without an accession (two unreviewed UniProt entries, no review). Grounded in cached primary papers incl. newly cached PMID:15489852 and PMID:26523365; all supporting_text quotes verified verbatim. linkml-validate clean; module_validator passed with 1 warning (NCBITaxon label not checked); rendered.
