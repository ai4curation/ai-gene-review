  summary: Promote de novo pyrimidine synthesis module to COMPLETE
  details: |
    Declared the module ABSTRACT and COMPLETE. Split the carbamoyl-phosphate step into a two-chain CarA-CarB complex variant (active units CarA glutaminase GO:0004359 and CarB ammonia-dependent synthetase GO:0004087) and a fused CAD-type variant grounded on PANTHER:PTHR11405:SF5, which removes the contribution-only conformance warning for CarB. Adopted the four PAINT ancestral-node groundings from the PANTHER grounding PR (PTN000234184, PTN000599579, PTN000719921, PTN000167473) after checking each against the family paint.tsv. Added E. coli pyrG/pyrH and human NME1/CMPK1 reviews so all 33 grounded accessions have COMPLETE gene reviews, and completed family reviews for every representative's PANTHER family.
