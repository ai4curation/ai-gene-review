  details: |
    Created and validated concrete bacteriophage pathway module MODULE:phage_mu_replicative_transposition_and_transcriptional_cascade (Escherichia Phage Mu Lysis-Lysogeny Switch, Replicative Transposition, and Mor-C Transcriptional Cascade) with 0 parts and 0 references.

    A concrete pathway module for the transposable temperate bacteriophage Mu (Muvirus mu, NCBITaxon:2681603) covering: (1) the bimodal lysis-lysogeny decision governed by the competition between Repressor protein c (Repc, P06019) and Negative regulator of transcription Ner (P06020) at the O1/O2/O3 operator-enhancer region (IAS) between the PcM and Pe promoters; (2) post-ejection non-covalent circularization and host RecBCD exonuclease protection of the linear phage genome by injected virion protein N (P08557) and early Ku-homolog DNA-end protection protein Gam (P06023); (3) conservative integration and lytic replicative transposition catalyzed by the tetrameric DDE-recombinase MuA transpososome (P07636) and the ATP-dependent target-site selector/target-immunity protein MuB (P03763); and (4) the sequential middle-to-late transcriptional activation cascade driven by the Middle operon regulator Mor (P23848, activating Pm) and the Late transcription activator C (P06022, activating Plys, PI, PP, and Pmom).
