  summary: Reduce IL34 module to ligand and CSF1R receptor steps
  details: |
    Follow-up to PR 5455 review. Reduced the module to its defensible boundary: part 1 IL34 ligand (GO:0005125), part 2 CSF1R receptor activation (GO:0005011, now also in GO:0061514). Removed generic CSF1R effectors (GRB2, PIK3R1, PLCG2, PIK3CA, MAPK1/3, STAT3), which split the PI3K holoenzyme across steps and typed ERK with GO:0004674; recorded them in a boundary note for a future CSF1R module (none exists). PTPRZ1 and SDC1 recorded as notes, not modelled. Removed GO:0038145 from concepts (defined by CSF1 binding). Removed connection evidence that attributed effector recruitment and ERK induction to abstract-only PMID:30066957 and PMID:18467591 whose cached abstracts lack those claims; ERK1/2 now cited to Reactome:R-HSA-6787820. PAINT descriptions corrected (PTN001230349 has no taxon; PTN002814394 full term list).
