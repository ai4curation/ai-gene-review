  summary: Narrow THI4 selector to PTHR43422:SF3, which holds all representatives
  details: |
    The THI4/THI1 thiazole synthase selector listed PTHR43422 SF3/SF16/SF9/SF6. PANTHER 19.0 places all three representatives (yeast THI4 P32318, S. pombe thi2 P40998, Arabidopsis THI1 Q38814) in SF3; the chloroplastic SF16/SF9/SF6 hold no representative (SF16 and SF9 have no member in the reference genomes). Replaced family_terms with term PANTHER:PTHR43422:SF3 and a description. Re-rendered pages/modules/eukaryotic_thiamine_biosynthesis.html.
