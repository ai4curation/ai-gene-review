- type: CREATE
  outcome: changed
  summary: Create Viridiplantae plastid division rule module
  details: |
    New BIOLOGICAL_PROCESS rule module scoped to Viridiplantae with Arabidopsis representatives: FtsZ1 (PTHR30314:SF12), FtsZ2 (PTHR30314:SF16) and ARC5 (PTHR11566:SF78) required; MinD (PTHR43384:SF6) optional. FTSZ2-2's subfamily SF3, shared with bacterial FtsZ and Dictyostelium FszA, is not used. ARC6 and PDV1/PDV2 are listed as not modelled (no local PANTHER entry). Selector notes corrected after review: FtsZ1, FtsZ2 and ARC5 subfamilies are Arabidopsis-only, while the optional MinD subfamily also holds bacterial MinD and Rhodospirillum CooC, so that step must stay optional or gain a tighter selector. ARC5's location is noted as the cytosolic face of the outer membrane. The description no longer says the module is written for land plants (its context is Viridiplantae), and the MinD note lists the five green-algal and two secondary-plastid MinD proteins in SF6. Added ARC6 (PTHR33925:SF1) as a required ring-linkage step and PDV1/PDV2 (PTHR33600 SF4, SF3) as optional, since their PAINT node is at Streptophyta; both families were fetched into interpro/panther with their PAINT tables. After review: a z_ring to outer_ring connection is restored beside the PDV route, noting that ARC5 recruitment in chlorophytes (no PDV) is not accounted for; PARC6 is identified as CDP1 (PTHR33925:SF2); the PDV function note says its PI4P-binding F IBD is not the linkage role.
