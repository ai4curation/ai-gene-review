  summary: 'Create module: Kit signaling pathway'
  details: |
    Created modules/kit_signaling.yaml, a compact three-step signaling-pathway module for
    GO:0038109 Kit signaling pathway built to the same template as the sibling receptor
    tyrosine kinase modules (pdgfr_signaling, egfr_signaling, fgfr_signaling): (1) SCF ligand
    engages KIT (KITLG UniProtKB:P21583 as a gene-product exemplar, KIT UniProtKB:P10721 as the
    PTHR24416 representative with PAINT nodes PTN001230349, PTN002814378, PTN008404985);
    (2) phosphotyrosine effector recruitment (GRB2/PTHR46037, PIK3R1/PTHR10155, PTPN11/PTHR46559,
    LYN/PTHR24418); (3) Ras-MAPK, PI3K-AKT, and STAT5 output (SOS1/PTHR23113, PIK3CA/PTHR10048,
    STAT5A/PTHR11801). Molecular functions are placed on leaf annotons; the module concept is
    the GO process term. Identifiers were checked against UniProt REST, interpro/panther
    (panther.obo, PTHR*-paint.tsv seed rows), the local GO OAK database, and PubMed esummary;
    GOA experimental annotations on human KIT (QuickGO) supplied PMID:17662946, PMID:21135090,
    and PMID:21640708, and the Lennartsson and Ronnstrand reviews (PMID:23073628, PMID:15526160)
    set the boundary. Added the six newly cited accessions to interpro/panther/panther-members.tsv.
    One knowledge gap records that the kinase mediating STAT activation by wild-type KIT is
    unsettled. Falcon module deep research was run with the configured wrapper and linked as
    evidence. Validated with linkml-validate (ModuleReview), module_validator (warnings only:
    PAINT nodes attesting P/C aspects only, and the PTHR10155 subfamily suggestion, both shared
    with sibling modules), rendered with render-modules. No KIT, KITLG, or effector gene review
    exists yet in genes/, and gocams/index.tsv has no KIT activity, so no GO-CAM cross-check.
