  details: |
    Created and validated concrete bacteriophage pathway module MODULE:phage_p22_bipartite_immunity_and_antirepressor_switch (Phage P22 bipartite immC/immI immunity, Mnt/Arc/Ant antirepressor regulation, and prophage integration/excision) with 11 annotons and 11 genes.

    A coupled bipartite gene-regulatory and site-specific recombination module that governs the lysogenic-lytic decision, prophage maintenance, and antirepressor-mediated induction in Salmonella phage P22 (Lederbergvirus). Unlike phage lambda, which relies on a single immunity region (immC), phage P22 encodes two distinct, interacting immunity regions: immC (encoding the primary repressor C2, the lytic switch repressor Cro, and the lysogenic establishment activator C1) and immI (encoding the antirepressor Ant and the two ribbon-helix-helix transcriptional repressors Mnt and Arc). Early transcription from PL and PR is extended by the nut-site antitermination protein N (gp24), expressing C3 (which inhibits host FtsH protease to stabilize C1), C1 (which activates PRE to drive C2 synthesis), and the site-specific recombinase Int (which integrates the phage genome at the Salmonella thrW tRNA locus). During established lysogeny, C2 dimers cooperatively repress PL and PR in immC while Mnt tetramers bind the Omnt operator in immI to repress Pant and prevent synthesis of the antirepressor Ant. During lytic infection or upon loss of Mnt repression, transcription from Pant expresses Arc (which binds Oarc as a dimer-of-dimers to negatively autoregulate Pant and prevent toxic Ant overproduction while activating Pmnt) and Ant (which binds non-covalently to C2 and related lambdoid CI repressors to abolish operator DNA binding without proteolysis), while C2 also undergoes RecA*-stimulated intramolecular autoproteolysis during the host SOS response, derepressing xis and int for excisive recombination and gp23 (Q) for late transcription antitermination.
