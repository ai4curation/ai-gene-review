- type: CREATE
  outcome: changed
  summary: New ParABS DNA-segregation module covering chromosomal and type I plasmid
    partition
  details: |
    Two parts (ParB-type centromere-binding CTPase clamp; ParA-type partition ATPase), each with a replicon-type variant set (chromosomal vs type I plasmid), plus a ParB-stimulates-ParA connection. Chromosomal exemplars from the PSEPK/PSEAE parA/parB reviews, BACSU Soj/Spo0J and Caulobacter ParA/ParB; plasmid exemplars F SopA/SopB, P1 ParA/ParB, RK2 IncC/KorB. Notes record the GO gap (no common parent of chromosome segregation and plasmid partitioning) and that PANTHER, NCBIFAM TIGR00180 and the CDD ParB architecture all mix chromosomal and plasmid members, so replicon-specific process terms must not follow family membership. Plasmid ParB CTPase asserted only for SopB and KorB.
