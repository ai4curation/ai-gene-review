  summary: Drop AZIN2 (PTHR11482:SF4) from the ODC selector; correct narrowing provenance
  details: |
    Replaces history record 2026-10-10T140818Z-claude-code-e5553d (removed before merge), which wrongly said these selectors were narrowed to subfamilies scoped SUBFAMILY_ONLY by a family review. None of these families has a family review. In commit e9aed8d3a the whole-family selectors were replaced with subfamilies from the PANTHER 19.0 HMM classification: ODC PTHR11482, agmatinase PTHR11358 (SF26, SF30), AdoMetDC PTHR11570, spermidine/spermine synthase PTHR11558, SSAT PTHR10545 (SF36), polyamine oxidases PTHR10742 (SF416, SF405, SF410) and antizyme inhibitor PTHR11482 (SF7, SF4). That pass wrongly put PTHR11482:SF4 (ANTIZYME INHIBITOR 2) in the odc1_activity selector, whose required_function is GO:0004586 ornithine decarboxylase activity. AZIN2 is catalytically dead, PAINT negates GO:0004586 at the AZIN node (PTN000159772, IKR), and SF4 is already in the azin1_activity selector. This session removes SF4 from odc1_activity, leaving SF42, SF6 and SF63. SF63 has no member in the 22 PANTHER 19.0 reference-genome files; its one member in the PANTHER member index is the Nicotiana attenuata ODC A0A314KUM9 (UniProt EC 4.1.1.17), so it stays. The ODC and agmatinase family descriptions, which still said required_function did the restricting, now name the selected and excluded subfamilies. pages/modules/polyamine_metabolism.html, which still showed the whole-family selectors, is re-rendered.
