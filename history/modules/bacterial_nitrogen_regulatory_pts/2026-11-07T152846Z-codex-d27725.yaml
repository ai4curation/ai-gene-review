  summary: Ground nitrogen-regulatory PTS roles in native cross-species evidence
  details: |
    Audited the canonical PtsP–NPr/HPr–PtsN relay in E. coli K-12, P. putida KT2440-derived strains and C. vibrioides NA1000. Revised entry, carrier and terminal activities with per-step primary evidence and comparative review context; constrained target and phosphorylation-state claims to their source organisms. Preserved role-family descriptors where exact PANTHER subdivisions do not match native roles; reviewed three parent families and twelve genes including carbohydrate controls. Independent scientific review found no blocking biology; finite-panel evidence checks explicitly distinguish native partner support from limitations of the production Boolean compiler. Scoped validation and publication closure are recorded under analysis/module_audits/bacterial_nitrogen_regulatory_pts; repository-wide validation remains a separate pre-PR gate.
