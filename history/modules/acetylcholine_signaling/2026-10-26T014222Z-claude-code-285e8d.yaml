  summary: New module from RGD PW:0000841 (with PW:0000842, PW:0000843)
  details: |
    Created modules/acetylcholine_signaling.yaml from the RGD acetylcholine signaling diagram and its nicotinic and muscarinic sub-pathways. Parts: choline uptake (SLC5A7), ACh synthesis (CHAT), vesicular loading and release (module_refs to synaptic_vesicle_neurotransmitter_loading and synaptic_vesicle_exocytosis), reception as a choice of five nicotinic subtypes or the M1/M3/M5-Gq/11 and M2/M4-Gi/o muscarinic arms, ACHE hydrolysis, and optional GRK2/GRK5 and RGS2/4/6 termination. GNAO1 was added to the Gi/o family on structural and GO-CAM evidence. The agrin-LRP4-MuSK-DOK7-rapsyn genes on RGD's list were excluded as NMJ AChR clustering (GO:0071340) and recorded as a separate module candidate. GO-CAM associations for CHRNA7, CHRNA9, CHRM2, ACHE and GRK2.
