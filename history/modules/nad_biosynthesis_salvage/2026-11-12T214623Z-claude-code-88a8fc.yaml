  summary: Generalize NAD+ route module exemplars and promote to COMPLETE
  details: |
    Kept the species-neutral route set (L-aspartate de novo, nicotinate, nicotinamide-deamidating, NMN-deamidating and NAMPT/NMN routes) and set scope CONCRETE. Representative members now carry symbol-first labels; human NAPRT and yeast PNC1 were added as pan-domain exemplars of the PncB and PncA families. The NadC selector was narrowed to PTHR32179:SF3 to exclude ModD-related SF4. PAINT nodes PTN000778111, PTN008512301, PTN000247701 and PTN000120784 were checked against the local paint files and added (the first three as proposed in PR #5076). Findings were added to the module references. Nine new member gene reviews (eight E. coli K-12, B. subtilis NadD) and four new family reviews accompany the change. Module schema and semantic checks pass with zero warnings; recommended-field compliance is 100% and gene-review completeness is 21/21.
