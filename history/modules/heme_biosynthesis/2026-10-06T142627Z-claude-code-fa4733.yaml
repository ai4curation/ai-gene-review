  details: |
    Audited against PMID:42714178. Retitled and re-described the module as the protoporphyrin-dependent (PPD) route; recorded the coproporphyrin-dependent (CPD; PMID:25646457) and siroheme-dependent AHB (PMID:21969545) routes as excluded alternatives, noting GO lacks MF terms for CgoX (EC 1.3.3.15), CpfC (EC 4.99.1.9) and ChdC (EC 1.3.98.5). Added caveats that PTHR42923:SF3 contains B. subtilis CgoX (P32397) and PTHR11108 contains CpfC (P32396), which receives GO:0004325 IBA from PTN000121751. No structural changes to parts.
