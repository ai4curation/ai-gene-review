  summary: Rebuild Notch signaling module as cross-species union model
  details: |
    Rebuilt modules/notch_signaling.yaml from a three-step human-centred sketch into an eight-part cross-species module (receptor maturation with optional Fringe, ligand presentation, optional cis-inhibition, receptor engagement, ADAM S2 cleavage, gamma-secretase S3 cleavage, NICD-CSL-Mastermind switch with optional default repression, target output). Lineage alternatives are variant_sets: ONE_OR_MORE unions for ligand class (Delta, Serrate/Jagged, nematode DSL plus OSM-11 DOS co-ligand), ligand E3 (Mind bomb, Neuralized), CSL corepressor (Hairless, SPEN) and targets (HES/E(spl), HEY, nematode lst-1); EXACTLY_ONE for the Mastermind lineage (MAML family, dipteran mam, nematode LAG-3). Grounded on 39 new gene reviews across human, mouse, zebrafish, fly, worm and Nematostella plus 15 new PANTHER family reviews; PTN anchors restricted to nodes those reviews assessed SOUND. Fixed prior mis-grounding of DLL1 and PTN002371879 to PTHR45836. Validated with linkml-validate, module_validator (0 errors) and render-module.
