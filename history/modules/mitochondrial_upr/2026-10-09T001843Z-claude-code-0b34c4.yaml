  summary: Generalize C. elegans UPRmt module to metazoan mitochondrial_upr with nematode
    and mammalian relay variants
  details: |
    Renamed c_elegans_mitochondrial_upr to mitochondrial_upr (Metazoa, NCBITaxon:33208). Three root parts: (1) stress relay as variant set stress_relay_lineage (axis taxon / sensing mechanism, EXACTLY_ONE) with the nematode ATFS-1 import-competition route (CLPP-1, HAF-1, matrix ATFS-1, chromatin arm DVE-1/UBL-5/MET-2/LIN-65/JMJD-3.1) and the mammalian OMA1-DELE1-HRI-ATF4 ISR route (OMA1 Q96E52, DELE1 Q14154 GO:0043539, EIF2AK1 Q9BQI3 GO:0004694 plus heme binding, ATF4 P18848); (2) shared ATFS-1/ATF5 bZIP activator role (PTHR13044, Q23272 + Q9Y2D1, PTN000315883); (3) shared HSP60 (PTHR45633:SF17, P50140 + P10809, PTN000143510) and mtHSP70 (PTHR19375:SF184, P11141 + P38646, PTN000452554) output. Mammalian CLPP recorded as not required for UPRmt (PMID:27154400), so the CLPP-1 signaling role is not transferred. New ATF5 knowledge gap. All groundings have gene reviews; 41 quotes verified verbatim; module_validator passes with 0 errors.
