  summary: AP-3 and the nematode GEF modelled as complexes; BLOC-2 term; BLOC-3 and
    yeast BLOC-1 references
  details: |
    From the review of #6525. AP-3 is now a PROTEIN_COMPLEX (GO:0030123) evaluated on its delta unit, so the cargo adaptor function sits on the complex, as AP3D1's review records it (contributes_to). The nematode exchange factor is a GLO-3-CCZ-1 PROTEIN_COMPLEX with GLO-3 as the selectable unit; its GEF function is described as inferred for the heterodimer (PMID:30419011 has no exchange assay; PMID:23084991 found BLOC-3 activity in the complex, not the subunits). BLOC-2 gains GO:0031084. PMID:12847290 now supports BLOC-3 = HPS1 + HPS4, and PMID:21159114 records that budding yeast has distant BLOC-1 homologues PSI-BLAST misses. The HPS1/HPS4-MON1/CCZ1 pairing is stated as a disagreement between the two cited papers. The Snapin node description notes its BLOC-1 IBD is placed at Bilateria. Census verdicts unchanged; the GLO-3 step is now reported as unevaluable.
