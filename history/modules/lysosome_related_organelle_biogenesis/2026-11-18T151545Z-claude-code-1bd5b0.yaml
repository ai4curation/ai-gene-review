  summary: 'New rule module: AP-3, BLOC-1, Rab32/38 and its exchange factor for lysosome-related
    organelle biogenesis'
  details: |
    Created for the ORGANELLE_LIFECYCLES lysosome-related organelle row, context Metazoa. Required: AP-3 delta (PTHR22781:SF12, human AP3D1, node PTN000513025); BLOC-1 as a complex of BLOC1S1 (PTHR13073:SF0, node PTN000317312), BLOC1S2 (PTHR46479:SF1, node PTN000839566) and Snapin (PTHR31305:SF2, node PTN001262876), the three subunits PANTHER places in one subfamily in every census animal; a Rab32/38 GTPase (PTHR24073:SF839 or SF862; human RAB38, RAB32, worm GLO-1, fly Rab32); an exchange factor, ONE_OR_MORE of BLOC-3 (HPS1 PTHR12761:SF1, node PTN000979207; HPS4 PTHR14407:SF9, node PTN001024633) and the nematode GLO-3 (UniProtKB:Q21045, by accession). Optional: BLOC-2 (HPS3, HPS5). Literature: PMID:23084991, 23247405, 30419011, 22916203. Census: met in human, fly and Trichoplax; worm fails only the exchange-factor step because GLO-3 has no PANTHER classification.
