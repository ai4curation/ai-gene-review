  summary: Add the homoserine-independent aspartate-semialdehyde route; retract two
    phantom dark-matter gaps
  details: |
    Restructured the template so its top-level steps are homocysteine_formation then methylation, with the acylation and sulfur_incorporation steps nested inside a new acyl_homoserine_route variant and a second variant, aspartate_semialdehyde_route, alongside them. The new variant carries MJ0100 (UniProtKB:Q57564) and its obligate iron-sulfur partner MJ0099 (UniProtKB:Q57563), typed to GO:0016783 sulfurtransferase activity and GO:0051539, with PMID:25938369 as evidence. Title dropped the 'from homoserine' qualifier; 14 routes.

    Reason: the previous template modelled only the O-acyl-homoserine entry, so Synechocystis sp. PCC 6803 and Methanocaldococcus jannaschii could not be represented as satisfiable and were reported as 'metabolic dark matter' abduction targets. Both encode the two-gene direct route in KEGG itself (syn:slr0689/slr2059, mja:MJ_0100/MJ_0099, KOs K23975/K23976), so the gap was a model-scope artifact rather than a missing enzyme. The companion oracle fix added those KOs and metZ=K10764 to STEP_KO and made the predicate raise on an unmapped atom instead of returning False.

    All of the family and UniProt grounding the module had gained on main was preserved; the restructure re-nested the existing variants rather than replacing them. Verified by compile to 2 steps / 14 routes / 10 symbols, with syn and mja resolving CONSISTENT_ACTIVE and the Rickettsia auxotrophy prediction and four prototroph reconstructions unchanged.
