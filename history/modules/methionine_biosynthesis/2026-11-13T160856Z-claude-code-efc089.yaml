  summary: Promote methionine_biosynthesis module to COMPLETE
  details: |
    Made the module species-neutral (scope CONCRETE) with exemplars from E. coli, P. putida, C. glutamicum, M. tuberculosis, S. cerevisiae, S. pombe and Arabidopsis; added E. coli MetA to the succinyl route. Grounded every leaf to the PANTHER family or subfamily holding its exemplars (labels checked against panther.obo; members checked against the PANTHER member index), building on the groundings proposed in PR 5076 but dropping its PSEPK MetB MetZ representative and the four PAINT nodes not seeded by a module representative. Removed E. coli MetE/MetH representatives pending their reviews in PR 6196. Reviewed or completed 20 member gene reviews (8 new) plus the MTR family reference, and reviewed 9 PANTHER families (3 new, 3 upgraded). Five remaining function-conformance warnings are intrinsic (acyl-donor and MetZ chemistry not delimited by any PANTHER subfamily; no GO term for O-succinylhomoserine sulfhydrylase) and are explained in the module notes.
