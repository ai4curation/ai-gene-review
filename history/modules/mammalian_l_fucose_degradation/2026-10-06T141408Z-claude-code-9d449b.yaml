  summary: Create mammalian L-fucose degradation module with orphan lactonase and
    diketo-hydrolase steps
  details: |
    Triggered by PMID:42509779 (Biomolecules 2026 review of orphan enzymes in mammalian L-fucose catabolism). Built a five-step CONCRETE (human) METABOLIC_PATHWAY module grounded in GO:0042355: HSD17B14 L-fucose dehydrogenase (GO:0047834, RHEA:81515; PMID:38944119), orphan L-fuconolactonase (ANY_WITH_FUNCTION; RHEA:75223/75219, EC 3.1.1.120; no GO term), ENOSF1 L-fuconate dehydratase (GO:0050023, RHEA:22772; PMID:24697329), BDH2 as candidate 2-keto-3-deoxy-L-fuconate 4-dehydrogenase (RHEA:75191, EC 1.1.1.434; in vitro PMID:38918500; no GO term), orphan 2,4-diketo-3-deoxy-L-fuconate hydrolase (ANY_WITH_FUNCTION; RHEA:62376, EC 3.7.1.26; no GO term). Boundary excludes FUOM, FCSK/FPGT salvage, GMDS/GFUS de novo, FUCA1/FUCA2 lysosomal release, GLUT1 uptake and downstream pyruvate/lactate metabolism. FAHD1, RGN and PGLS recorded as untested/rejected candidates in notes, not participants. Step-level BIOLOGY knowledge gaps for the two orphan steps and the BDH2 assignment, plus a module-level BP_DARK gap on physiological role. Cached PMIDs 42509779, 38944119, 24697329, 17144652, 35150746, 38918500, 17602138, 1158860, 457669, 23214453.
