- type: CREATE
  outcome: changed
  summary: Create GPCR GRK-arrestin desensitization module
  details: |
    Created an abstract GPCR GRK-arrestin desensitization module grounded in the cached C5AR1 GO-CAM 67f85f2b00004426, the beta-adrenergic receptor kinase/beta-arrestin experiment from PMID:2163110, and the AT1A GRK2/3 desensitization evidence from PMID:15671181. The module keeps ligand sensing, G-protein coupling and beta-arrestin ERK scaffolding outside the boundary while capturing the reusable active-GPCR -> GRK -> ARRB1/2 termination motif for receptor-specific modules to conform to.
    The follow-up revision broadened the GRK selector to the metazoan GPCR kinase set represented by GRK2/GRK3/GRK5/GRK6, narrowed taxon scope to Metazoa, aligned the GRK-to-arrestin connection with the GO-CAM provides-input edge, added the cytoplasmic side of plasma membrane to the module context, and added explicit evidence for arrestin-mediated receptor internalization.
    A second review revision split the GRK phosphorylation tier into explicit GRK2/3 and GRK5/6 REALIZER variants, removed ERK-specific AT1A evidence from the generic GRK5/6 desensitization branch, corrected the top-level C5AR1 GO-CAM edge description, and documented the module's conformance contract for concrete receptor-specific modules.
