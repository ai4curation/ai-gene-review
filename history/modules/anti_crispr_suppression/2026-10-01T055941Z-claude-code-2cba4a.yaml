  summary: 'Create module: anti-CRISPR suppression of host CRISPR-Cas immunity'
  details: |
    New ModuleReview for phage-encoded suppression of host CRISPR-Cas immunity, decomposed by the host step each Acr class attacks rather than by family, since Acr families share no sequence homology: target-recognition blockade (AcrIF8, AcrIIA4, AcrIIA2), effector-nuclease neutralisation (AcrF3 Cas3 sequestration via GO:0140311, AcrIIC1 HNH occlusion), enzymatic subversion (AcrVA1 crRNA cleavage, AcrIII-1 cOA ring nuclease), and an optional Aca2 autoregulatory feedback part grounded in the same Pectobacterium phage ZF40 locus as the existing AcrF8 gene review. Families grounded in InterPro, which carries mechanism-bearing names where UniProt entries are unreviewed. Three knowledge gaps recorded: no MF terms for mimicry-based competitive inhibition, single-domain occlusion, or cOA ring nuclease activity; unreviewed UniProt entries for structurally characterised Acrs; and an unresolved accession mapping for the assayed AcrIII-1 construct. Host-encoded Crn ring nucleases deliberately excluded as self-regulation. Validated with linkml-validate -C ModuleReview and the module validator, and rendered.
