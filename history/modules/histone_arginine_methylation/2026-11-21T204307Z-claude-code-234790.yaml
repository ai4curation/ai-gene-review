  details: |
    Drafted from RGD PW:0001338 (histone modification) as part of tranche 12. Type I asymmetric dimethylation (PRMT1, CARM1, PRMT6, weak PRMT2), type II symmetric dimethylation by histone-context PRMT5-WDR77 (with COPR5 for H4R3), and type III monomethylation by PRMT7. SAM/SAH and methylarginine states grounded to ChEBI and general Rhea reactions. Non-COMPASS, non-PRC2 lysine methyltransferases recorded in notes as a coverage gap.
