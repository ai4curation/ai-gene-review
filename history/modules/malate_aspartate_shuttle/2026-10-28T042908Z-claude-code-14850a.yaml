  summary: Assess the Acanthamoeba ATP synthase-integrated MDH against the malate-aspartate
    shuttle module
  details: |
    Resolved the litscan:module-member handoff #3924 (PMID:42822427, Acanthamoeba ATP synthase structure reveals the TCA cycle is tethered to OXPHOS). Fetched the full text with `just fetch-pmid` (PMC13632647, XML route) and read Results, Discussion and STAR Methods rather than the abstract alone.

    Determination: the malate dehydrogenase integrated into Acanthamoeba castellanii ATP synthase (AcMito-MDH, with its MASA adaptor subunit, gene ACANB14707) is NOT added as a part, annoton or context element of this module. Module composition is unchanged.

    Three reasons. (i) Pathway: the handoff routed the paper here on the string "malate dehydrogenase", but the claim is a structural and allosteric tether between matrix malate oxidation and complex V, not a step of the malate-aspartate shuttle. The shuttle is defined by net inward transfer of cytosolic reducing equivalents and requires the cytosolic arm (MDH1, GOT1), the two inner-membrane carriers and the aspartate-glutamate limb; the cached full text has zero occurrences of "shuttle", "aspartate", "GOT", "SLC25", "aminotransferase", "transaminase" or "reducing equivalent". MDH2 is shared between this shuttle and the TCA cycle, and a regulator of the shared enzyme is not thereby a part of both pathways. (ii) Lineage: every part here is grounded on a reviewed human accession with a completed gene review, whereas the tether depends on two features the authors call Acanthamoeba-specific adaptations - a 76-residue N-terminal extension no other MDH carries, cytosolic or mitochondrial, and the MASA subunit, with no mammalian counterpart. In mammals the authors report the link has been seen only as a weak cross-linking-MS signal, and even inside Acanthamoeba they leave open whether the regulated flux is the TCA cycle or the mitochondrially localised glyoxylate shunt (whose isocitrate lyase and malate synthase are a single fused polypeptide there). (iii) Grounding: the paper names its proteins by its own ACANB gene identifiers. ACANB14707 returns no hit in UniProtKB, and the three Acanthamoeba castellanii EC 1.1.1.37 entries there (L8HIY2 343 aa, L8GQP0 306 aa, L8HFT9 416 aa, all unreviewed) cannot be reconciled with the paper's numbering, in which the mature construct spans residues 36-430 and the catalytic proton-transfer residue is His294 (L8HFT9 has Arg at 294). Per the repository rule, no accession is asserted rather than a plausible one guessed.

    Encoding follows the #3918 precedent in mitochondrial_complex_v: a `CANDIDATE ASSESSED, NOT MODELLED` paragraph in `module.notes`, four queryable EvidenceItem entries with verbatim quotes, and a top-level `references` entry carrying a `reference_review` (relevance LOW for this module - strong work, different pathway and lineage - correctness VERIFIED against the cached full text).

    A `knowledge_gaps` entry was added, because the matrix MDH2 step IS a modelled annoton and the residual question is a genuine BIOLOGY unknown: whether the human matrix malate-dehydrogenase step is physically coupled to the complex V it ultimately feeds, and whether such coupling sets MDH2's working substrate range as it does in Acanthamoeba (~85% lower KM, higher substrate-inhibition Ki, kcat raised by ADP and lowered by ATP in the integrated enzyme). Status OPEN, gap_kind BIOLOGY, dark_aspect RESIDUAL_SUBGAP; resolution is wet-lab (complexome/cross-linking of mammalian mitochondria, kinetics of MDH2 in an immunoprecipitated complex V preparation, ADP/ATP titration), and a negative result closes it as a lineage-specific adaptation. Provenance quotes the paper's own statements, including its admission that the mammalian link needs "a tractable system to investigate its potential regulatory roles and biological relevance".

    No exclusion guard was added: every participant here is selected by an explicit UniProt accession or PANTHER family, so no selector can sweep an amoebozoan MDH in (the #3092 reasoning).

    The better home if this is ever admitted anywhere is mitochondrial_complex_v.yaml, as a lineage-specific accessory subunit or a separate amoebozoan ATP synthase module - the same admission path that module already records for the myzozoan ATPPM1/ATPPM2 candidates. That is named in the notes but deliberately not written into that file here, because two draft PRs (#5457, #5349) are already open against it.

    Schema validation (linkml-validate, ModuleReview) is clean and the module validator passes; the 4 remaining warnings are pre-existing on main and concern PANTHER subfamily granularity for the GOT1/GOT2/SLC25A11 annotons and an unreviewed family function for SLC25A11.
