- type: CREATE
  outcome: changed
  summary: New eukaryote-wide SRP/Sec61 co-translational translocation rule module
  details: |
    SRP (SRP54, SRP19, SRP68, SRP72; SRP9/SRP14 Alu domain optional), SRP receptor (SRalpha by subfamily PTHR43134:SF1, SRbeta by PTHR45909:SF1) and Sec61 alpha (PTHR10906) and gamma (PTHR12309), one PANTHER family annoton each. Each PAINT node is shown to be an ancestor of the human protein by its IBA rows or by its being an IBD seed, and each node description lists its seeds' species (UniProtKB seeds resolved through the local entries tables) without inferring node depth. MFs from human reviews (SRP19, SRP68, SRP72, SRP9, SRPRB, SEC61G) or the node's F IBD (SRP54, SRPRA, SEC61A1); GO:0030942 carries its current name, endoplasmic reticulum signal peptide binding. Caveats on families: plastid paralogs can satisfy SRP54 and Sec61 alpha; SF1 for SRalpha also holds bacterial and archaeal FtsY and excludes only FlhF and chloroplast FtsY; no plant SRalpha subfamily locally; SRbeta's subfamily also holds ARFRP1/ARL3, PANTHER 19.0 places SRPRB in PTHR11485:SF34 (unresolved), and yeast passes a family-presence test only through the over-match; Sec61 gamma's family includes archaeal SecE. Not modelled: SRP RNA, Sec61 beta, Sec62/Sec63, TRAP/OST/EMC (Drosophila-only modules cover several).
