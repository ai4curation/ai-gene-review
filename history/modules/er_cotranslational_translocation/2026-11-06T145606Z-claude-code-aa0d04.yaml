  summary: New eukaryote-wide SRP/Sec61 co-translational translocation rule module
  details: |
    SRP (SRP54, SRP19, SRP68, SRP72; SRP9/SRP14 Alu domain optional), SRP receptor (SRalpha by subfamily PTHR43134:SF1, SRbeta by PTHR45909:SF1) and Sec61 alpha (PTHR10906) and gamma (PTHR12309), one PANTHER family annoton each. PAINT nodes shown to be ancestors of the human protein by its IBA rows or by its being an IBD seed; most are at Eukaryota. MFs from human reviews (SRP19, SRP68, SRP72, SRP9, SRPRB, SEC61G) or the node's F IBD (SRP54, SRPRA, SEC61A1). Caveats recorded on families: plastid paralogs (cpSRP54, plastid SecY) can satisfy SRP54 and Sec61 alpha; no plant SRalpha subfamily locally; SRbeta's subfamily also holds ARFRP1/ARL3, and PANTHER 19.0's own classification places SRPRB in PTHR11485:SF34, unresolved. Not modelled: SRP RNA, Sec61 beta, Sec62/Sec63, TRAP/OST/EMC.
