  details: |
    Concrete C. elegans macroautophagy module with five root parts: BEC-1/VPS-34 class III PI3K nucleation (PI3KC3-C1, EPG-8/Atg14 noted in text), ATG-18 PI3P effector, LGG-1 (GABARAP) membrane anchoring in biogenesis, optional SQST-1 cargo recruitment, and LGG-2 (LC3)/EPG-5 maturation and autophagosome-lysosome fusion. Members: BEC-1 Q22592, VPS-34 Q9TXI7 (no gene review), ATG-18 O16466, LGG-1 Q09490, LGG-2 Q23536, EPG-5 Q18892, SQST-1 Q22436. Annoton MFs match gene-review core functions. Cross-references the yeast phagophore_assembly_site module for conserved core machinery rather than duplicating it, and defers mitophagy receptors to c_elegans_mitophagy. 19 PMID quotes checked verbatim; added cached PMID:27588602 (EPG5 Rab7 effector). Two BIOLOGY knowledge gaps (LGG-1 lipidation-independent initiation; ATG-18 vs EPG-6 division of labour). linkml-validate clean; module_validator passes with one ontology-unavailable taxon warning; rendered.
