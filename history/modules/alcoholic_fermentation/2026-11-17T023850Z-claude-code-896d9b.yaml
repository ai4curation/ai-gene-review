  summary: Add derived CONSTRAINT_BASED model alcoholic_fermentation_fba (5 pFBA scenarios)
  details: |
    Added the derived constraint-based executable model alcoholic_fermentation_fba with five scenarios: yeast_ethanol_fermentation, adh_block_acetoin_butanediol_overflow, carassius_heteromeric_pdc_active, carassius_alpha3_subunit_loss and bacillus_acetolactate_butanediol_route. Model first drafted in an antigravity session with cjm. After exact pFBA replaced the greedy flux heuristic, yeast_ethanol_fermentation now expects the optional carboligation and Bdh1 side branch (pdc_carboligation_variant, bdh_step) to carry zero flux, because ADH has capacity for the whole budget and the side branch costs more per unit flux; the label and description were rewritten to match. This record replaces hand-written records that named scenarios absent from the module.
