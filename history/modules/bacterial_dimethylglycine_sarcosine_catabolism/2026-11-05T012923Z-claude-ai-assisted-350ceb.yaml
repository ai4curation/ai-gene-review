  summary: Generalize and promote dimethylglycine/sarcosine catabolism module to COMPLETE
  details: |
    Made the module species-neutral with experimentally characterized exemplars (Chromohalobacter DdhC/Csal_0991/EtfAB, Corynebacterium U-96 SoxABDG, Arthrobacter TE1826 MSOX) alongside KT2440. Split the first step into a DgcA dehydrogenase annoton (GO:0033694; EC 1.5.7.3) and a DgcB ferredoxin electron-transfer annoton feeding the ETF. Grounded ETF subunits on PTHR43153/PTHR21294, Sox subunits on NCBIfam TIGR01372-TIGR01375 and MSOX on PTHR10961:SF7; DgcA/DgcB carry no family id. Both module validators pass with 0 warnings; 17/17 member gene reviews complete; status COMPLETE.
