  details: |
    Created modules/bacterial_flavonoid_degradation.yaml from the eight KT2440 gene reviews curated in the same batch. Six ordered parts with substrate/product chaining across the naringenin A-ring degradation route; context declares taxa NCBITaxon:2 Bacteria, matching the sibling bacterial_gallate_catabolism module, because the module's central claim is species-neutral while every exemplar is from one strain. No PANTHER family ids are asserted anywhere in the module, following CLAUDE.md's rule to omit an id that cannot be established rather than fill the slot. Molecular functions are asserted only where the gene review asserts one (GO:0016709, GO:0051537, GO:0016702, GO:0052689, GO:0016831) and declined for the FdeH and FdeJ parts, which carry role_description text explaining the decline instead. The module's sources statement was corrected during review to stop asserting the FdeJ carbon-carbon hydrolase function after that term was withdrawn from the PP_3206 review. This record was scaffolded retrospectively by the PR shepherd. The history/ mechanism (scripts/new_history.py, docs/history.md, src/ai_gene_review/schema/history.yaml) was added to main in 38a025114e on 2026-09-03 and reached this branch with the 2026-09-13 merge of main, after the curation described here; the session is therefore reconstructed from the branch contents and the formal review rounds on PR #2832 rather than written during curation.
