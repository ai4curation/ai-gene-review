  summary: 'Create module: iRhom-ADAM17 ectodomain shedding'
  details: |
    Created modules/adam17_ectodomain_shedding.yaml, the mechanism behind the largest group of GO production terms after the interferons (7 production and 17 regulation terms: TNF, RANKL, amphiregulin, fractalkine, CXCL16 and the TNF superfamily parent), identified by the curated classification in projects/PRODUCTION_TERMS.md. Four parts: ADAM17 maturation and delivery (iRhom family descriptor over RHBDF2 and RHBDF1 as cargo receptor for ADAM17, furin prodomain removal, FRMD8/iTAP stabilisation); optional stimulus-dependent licensing by tail phosphorylation (ANY_WITH_FUNCTION selector, since the kinase varies with the stimulus); the catalytic step, with six substrates recorded on the activity rather than as variants; and optional TIMP3 inhibition as the module's brake. A knowledge gap records that it is unsettled whether iRhom1 and iRhom2 select different substrates. ADAM10 is deliberately excluded as a protease variant: it shares substrates but is regulated by tetraspanins, so it is a different machine. No cached GO-CAM has an ADAM17 activity, so there are no pins, unlike the interferon module. Evidence from publications already cited by the ADAM17 and RHBDF1 reviews plus five cached Reactome events; no new fetches. Validated: linkml-validate ModuleReview clean; module_validator passes with one coverage warning (the RHBDF1 review states the scaffold role in prose but gives its core function no GO id); 15/15 quotes verified; renders at 100 percent recommended-field compliance with no function conflicts.
