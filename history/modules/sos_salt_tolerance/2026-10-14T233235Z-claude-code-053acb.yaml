  summary: New SOS salt-tolerance pathway module
  details: |
    Three-part SOS signaling module from the ARATH unmoduled-gene project (PR #5014): CBL Ca2+ sensors (SOS3/CBL4, SCaBP8/CBL10; protein kinase activator activity), SOS2/CIPK24 protein serine/threonine kinase, and SOS1/NHX7 sodium:proton antiporter at the plasma membrane. Annoton MFs match the CIPK24 and SOS1 gene reviews' core functions. HKT1 (parallel xylem Na+ retrieval, not a CIPK24 target) deliberately excluded and recorded in notes. No PANTHER ids, no GO-CAMs. linkml-validate clean; module_validator passes with one taxon ontology-unavailable warning.
