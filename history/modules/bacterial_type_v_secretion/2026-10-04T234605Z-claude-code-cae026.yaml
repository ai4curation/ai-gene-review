  summary: Cite the bamA review for the insertase molecular function
  details: |
    Follow-up to the TAM-route edit. The focused bamA review proposes GO:0032977 membrane insertase activity as a NEW annotation and argues it with a comparator check rather than asserting it bare: yeast SAM50, the Omp85-family beta-barrel insertase of the mitochondrial outer membrane, carries the term by mutant phenotype, and Escherichia coli YidC carries it by mutant phenotype and direct assay. Both comparator claims were verified independently against QuickGO. The BamA annoton now links that review as evidence, its note records that the term is still absent from GOA but no longer a bare curatorial synthesis, and the knowledge gap is rewritten to distinguish BamA, where the absence is argued to be a propagation failure, from TamA, where no such argument exists and the function remains curator synthesis.
