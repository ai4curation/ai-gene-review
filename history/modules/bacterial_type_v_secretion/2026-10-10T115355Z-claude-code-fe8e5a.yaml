  summary: Move two gaps to notes; ground the holdase process term directly
  details: |
    PR review found knowledge_gaps entries whose only gap_kind was ONTOLOGY and/or CURATION, which CLAUDE.md prohibits. ModuleReview has no proposed_new_terms slot, so these move to the module notes, which CLAUDE.md names as a valid destination. Both the gap statement and the boundary prose are preserved, the latter as what is asserted instead. One ontology gap records that GO:0015474 hard-codes the classical domain order; the combined curation and ontology gap records that neither insertase carries a specific molecular function in GOA. The insertase question is now settled on the gene instead, the bamA review proposing GO:0032977 with a comparator check, and the notes point at it. Separately, the reviewer noted for the second time that the periplasmic holdase annoton asserted the type V secretion process on necessity-shaped evidence while its own note disclaimed the assertion, and that the needed support was already in the file. The annoton now cites PMID:19850876 directly, quoting the photocrosslinking result placing SurA and Skp on the EspP passenger domain during a stalled translocation, and the note is rewritten to say what that evidence supports instead of hedging.
