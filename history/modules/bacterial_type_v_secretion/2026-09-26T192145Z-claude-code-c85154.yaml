  summary: Create bacterial type V secretion module
  details: |
    New species-neutral module for the type V route. Three parts: periplasmic holdase maintenance of the Sec-delivered precursor, BAM-dependent installation of the translocator barrel, and passenger translocation, with a five-way variant set on the passenger-barrel architecture (classical Va, two-partner Vb, trimeric Vc, patatin-like Vd, inverted Ve). Two curation decisions are recorded on the annotons themselves. GO:0015474 autotransporter activity defines the passenger as N-terminal and the porin as C-terminal, so it is applied to the classical, trimeric and patatin-like variants and withheld from the inverted variant, which reverses exactly that order; the generic transporter term is used there and the mismatch is filed as an ontology gap. BamA carries no specific molecular function in GOA, only protein binding and chaperone binding, so membrane insertase activity is asserted as curator synthesis and flagged. Grounded in the existing surA and Skp gene reviews plus three InterPro translocator domains confirmed present on the exemplar proteins. Passenger chemistry is outside the boundary.
