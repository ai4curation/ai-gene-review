  summary: Add the TAM insertase route and record the autotransporter autonomy dispute
  details: |
    Two changes beyond PANTHER grounding, both driven by the focused review of Antigen 43. First, outer-membrane installation is no longer modelled as BAM-only: the part now carries a variant set on the insertase axis with ONE_OR_MORE selection, adding a TAM route grounded on TamA (P0ADE4) and TamB (P39321). A reconstituted-membrane study shows Antigen 43 does not associate with a membrane lacking the module and that TamA alone is necessary and sufficient to initiate its entry. Second, a knowledge gap records that GO:0015474 autotransporter activity asserts the passenger-bearing protein does the transporting, which the insertase literature disputes; the term is kept on the architecture variants it describes rather than silently endorsed or discarded. Also links the Antigen 43 review as evidence on the classical-autotransporter passenger annoton. PANTHER grounding added to six descriptors, with the patatin-like family deliberately left at family level against the precision advisory because its subfamily is named for a specific animal esterase.
