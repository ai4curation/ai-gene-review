  summary: 'Create module: CXCL13 / CXCR5 chemokine signaling'
  details: |
    New two-step ligand-first module for the lymph-node follicle case in SPATIAL_CELL_COMMUNICATION: CXCL13 (PTHR12015:SF204, GO:0008009 chemokine activity; reps O43927, O55038) causes CXCR5 activation (PTHR10489:SF618, GO:0016494 C-X-C chemokine receptor activity; reps P32302, Q04683). Concept GO:0070098 because GO has no CXCL13/CXCR5 pathway term; a child term is requested in proposed_new_terms. GO-CAM check: no production model in gocams/index.tsv contains CXCL13 or CXCR5 (positive controls CXCL8/CXCR2 found), so no gocam_associations. CXCR3 as an alternative CXCL13 receptor is out of scope. Evidence: PMID:9463416, PMID:9486651, PMID:8978608, PMID:10917533, PMID:1425907, PMID:11554781 (boundary).
