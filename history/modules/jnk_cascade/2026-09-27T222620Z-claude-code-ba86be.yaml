  summary: Reword the JNK negative-regulation step as an external input, not JNK feedback
  details: |
    Changed the role and description of jnk_negative_regulation in modules/jnk_cascade.yaml: DUSP/MKP termination of JNK is modelled as an external input because the inducible phosphatase in this territory (DUSP1/MKP-1) is induced via p38 and ERK output rather than by JNK itself (PMID:16978838; BBM-070 wiring), so its induction is cross-regulation that lives in the sibling cascade modules. No connections changed. This removes the advisory feedback-loop warning that the previous wording (role 'negative regulation and feedback' with no upstream edge) triggered. Validated and rendered.
