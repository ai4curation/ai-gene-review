  summary: Cite the p38-controlled MKP-1 evidence behind leaving JNK termination as
    an input; record the cross-cascade gap
  details: |
    PR review finding: the decision not to wire a JNK feedback rested on an uncited claim about DUSP1 while the step models DUSP10/DUSP16. The node description now states precisely that the JNK-directed phosphatases represented are not known to be JNK-induced and that DUSP1/MKP-1 is under p38/MK2 control, with PMID:16978838 as node evidence (verbatim supporting text). The p38-output -> DUSP1 -| JNK cross-cascade edge implied by that paper (MKP-1 loss prolongs p38 and JNK activation) is recorded as a CURATION knowledge gap on the node, with provenance, rather than left silently unmodelled.
