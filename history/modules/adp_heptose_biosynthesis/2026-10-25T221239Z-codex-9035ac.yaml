  summary: Complete cross-kingdom ADP-heptose module audit and sixteen member reviews
  details: |
    Completes the initial bacterial audit recorded earlier in this session. Curated twelve references and evidence for five reaction steps and four ordering edges, including the four-step ADP-D,D-manno-heptose core and optional HldD/SepC epimerization. Expanded the non-universal taxon envelope to Bacteria and Archaea using the 2024 cross-kingdom study, distinguishing engineered M. maripaludis S2 production from endogenous pathway evidence. Reviewed sixteen bacterial and archaeal representatives: 105 original annotation rows retained, two supported NEW SepC annotations, and four archaeal core functions with empty GOA sets. Pinned UniSave source records preserve the deleted DSM2067/JJ accessions; only HldA has an exact experimental construct match, while the other archaeal exemplars are explicitly qualified homology assignments. Family IDs and official labels were verified, including the misleading DiaA-named family; molecular-function requirements prevent blanket family transfer. Independent annotation-reviewer and module QA completed. Module schema and scoped validation passed with zero warnings; individual gene reviews passed targeted validation, with expected empty-GOA core-function advisories for the four archaeal genes. Full repository validation has been started and will be checked before marking the PR ready.
