  summary: Audit ADP-heptose biosynthesis module and ground its five PANTHER families
  details: |
    Audited the module against the COMPLETE bar; the module YAML itself needed no change and is left unmodified at status COMPLETE. Both validators are clean with zero warnings (linkml-validate ModuleReview: no issues; module_validator: passed). The five member-index warnings were a missing git-ignored build artifact, cleared by just ensure-panther-members, not a defect in the document. Recommended-field compliance is 100% global and weighted with no missing slots, and leaf_nodes_missing_representatives, conformance_violations and module_ref_violations are all empty. Re-rendered the page.

    Taxonomic generalization: no change needed. The module is already species-neutral and spans seven organisms across gamma- and beta-proteobacteria, actinobacteria and archaea (E. coli, P. aeruginosa, P. putida KT2440, B. cenocepacia, B. pseudomallei, S. fimbriatus, M. maripaludis), with KT2440 retained as one exemplar among several and E. coli HldE/GmhB already grounded. scope CONCRETE is consistent with that. No organisms were added to raise counts.

    Scoped the required family reviews from the DR PANTHER lines of all sixteen grounded accessions, which gave exactly five families: PTHR30390, PTHR42891, PTHR43103, PTHR43793, PTHR46969. All five previously lacked a FamilyReview; all five were created in this change and are recorded separately under history/other/<PTHR>-family-review/.

    Open items deliberately not forced. module_qc.module_gene_review_summary reports 7/16 complete, not 16/16, and this is not reachable honestly. Four Methanococcus maripaludis entries (A0A2L1CCQ9, A0A2L1CCN4, A0A2L1CCT7, A0A2L1CD41) have no GO annotations at all, and review_completeness defines complete as total > 0 and reviewed == total, so a zero-annotation gene can never be counted complete without fabricating GOA rows. The remaining shortfall is seven reasoned UNDECIDED rows across five genes (Q9HVZ0 x2, Q88RS0, B4EB35, Q88D93 x2, A0A2P1G6D3), none of which are default stubs: each records specific evidence limits, for example sepL cytoplasm resting only on an ARBA rule and the KT2440 L,D-heptose process terms depending on an unestablished local HldD step. Flipping them would not have reached 16/16 either, so they were left to their authors' verdicts.

    Overlap check: maintainer PR #5076 (cmungall/aigr-agy2-pr2-modules) does touch this module, but its version of the file is older than main's, carrying status DRAFT, KEGG/GO-only evidence and no PMID supporting_text, so it was not adopted as a starting point; merging it as-is would revert main's development of this module.
