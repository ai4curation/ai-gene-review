  summary: Raise module gene-review completeness from 7/16 to 15/16
  details: |
    Second pass over this module, superseding the completeness analysis in the earlier AUDIT record for this target, which reported 7/16 and judged a higher count unreachable. That judgement was too pessimistic in one respect and correct in another.

    Four Methanococcus maripaludis entries (A0A2L1CCQ9, A0A2L1CCN4, A0A2L1CCT7, A0A2L1CD41) had zero GO annotations, so review_completeness could never count them complete. Rather than fabricating GOA rows or dropping the accessions, each review gained one NEW existing_annotation for the molecular function its core_functions section already argued, as ISS against GO_REF:0000024, which is the repository's established convention for a curator sequence-similarity assertion. Each rests on curated or signature evidence that was already cited in the review: HAMAP MF_00067 for the isomerase, PIRNR004682 for the phosphatase, NCBIfam TIGR02199 and InterPro RfaE domain II for the adenylyltransferase, and InterPro RfaE domain I for the kinase, with the consecutive four-gene locus MMJJ_17670 to 17700 as corroboration. The kinase is the best grounded, being identical over all 306 residues to the deposited HldA_MM construct GenBank PP708527.1 from PMID:39116220. No ARBA-only statement is cited as support anywhere, and no experimental code is claimed, because the published reconstitution was ensemble-level in an engineered host.

    Five further UNDECIDED rows were resolved on evidence that did not exist when they were written. The KT2440 L,D-heptose question is now settled negatively: three UniProt queries over taxon 160488 return nothing for hldD or rfaD by gene name, for EC 5.1.3.20, or by protein-name text, while the identical queries against P. aeruginosa return Q9HYQ8; and KT2440's only member of the HldD family PTHR43103 is the uronate dehydrogenase Q88NN6 at subfamily SF5, with no KT2440 member in the 161-strong heptose 6-epimerase subfamily SF3. Both KT2440 GO:0097171 rows therefore became MODIFY to GO:0009226, generalizing an over-specific term to a stereochemistry-neutral is_a ancestor. The three localization rows were decided by the new family reviews: the two cytosol rows became ACCEPT because PTN000062036 is seeded by E. coli HldE's own experimental annotation and is assessed SOUND, and sepL's cytoplasm became KEEP_AS_NON_CORE, sound but peripheral, with its ARBA-only support still declined as evidence.

    The two Q9HVZ0 DiaA rows remain UNDECIDED by deliberate choice. The PTHR30390 family review records that node as UNRESOLVED and notes the propagation is uneven, Q88N89 not receiving it at all, so the family analysis corroborates the uncertainty rather than resolving it; only a DnaA-binding assay on a GmhA isomerase would settle it. That single gene holds the module at 15/16 rather than 16/16, which is recorded as the honest outcome rather than forced to a verdict the evidence does not support.

    An ontology gap was identified and is not filed as a knowledge gap, since a curator rather than an experiment would close it: no GO term exists for ADP-D-glycero-beta-D-manno-heptose biosynthesis, the module's own core endpoint, while the L,D form has GO:0097171.

    All validators remain clean: both module validators with zero warnings, 100 percent recommended-field compliance, no conformance or module-ref violations, zero family/gene cross-check conflicts, and just validate clean on all nine touched gene reviews. Re-rendered.
