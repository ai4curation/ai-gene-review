  summary: Create the human/mammalian integrated stress response module with the OMA1-DELE1
    branch by reference
  details: |
    Built modules/integrated_stress_response.yaml (DRAFT, scope CONCRETE, context Mammalia) to close the one piece of issue #3951 that was not already covered by an open PR: the ISR module itself, including the OMA1-DELE1 mitochondrial branch.

    Structure: five required parts plus one optional. (1) eIF2alpha kinase activation, a ROUTE variant set over HRI/PKR/PERK/GCN2 with ONE_OR_MORE selection; the HRI branch takes mitochondrial_upr#oma1_dele1_cleavage and mitochondrial_upr#dele1_hri_activation by module_ref (both optional, since heme limitation and cytosolic misfolding activate HRI without DELE1), and the GCN2 branch includes GCN1 as the ribosome-bound activator. (2) The eIF2 hub, as a complex participant with EIF2S1/EIF2S2/EIF2S3 active units. (3) eIF2B inhibition, as a complex participant with the catalytic epsilon subunit and the alpha/beta/delta regulatory subcomplex. (4) ATF4 output. (5, optional) CHOP and ATF3. (6) Feedback dephosphorylation, PPP1CA plus a REALIZER variant set over the GADD34 and CReP targeting subunits.

    Deliberate non-duplication: the PERK branch does not module_ref er_unfolded_protein_response#perk_arm, which carries its own eIF2alpha and ATF4 annotons and would duplicate parts 2 and 4; the relationship is recorded in prose instead.

    Recorded rather than hidden: GO has no molecular-function term for the activity of phosphorylated eIF2 toward eIF2B, the mechanistic core of the pathway, so the hub annoton carries GO:0003743 and the inhibition is stated on the eif2_complex -> eif2b_gef connection. Treated as an ontology gap for notes, not a knowledge_gaps entry.

    Six module participants have no gene review yet (EIF2S1, EIF2AK2, DDIT3, PPP1R15A, PPP1R15B, EIF2S2); they are grounded on verified UniProt accessions plus production GO-CAM activities, and each such annoton carries a notes field saying so. Five of the six have open PRs; that is curation work, not a knowledge gap.

    Two BIOLOGY/BP_DARK knowledge gaps: what sets the adaptive-versus-apoptotic threshold, and whether the four branches are interchangeable routes to one mark or distinct pathways sharing a hub.

    Also updated projects/INTEGRATED_STRESS_RESPONSE.md, whose bottom line still said 'There is no ISR module yet' and 'Thirteen have no gene folder', and added modules/integrated_stress_response-notes.md with the build record.

    Validation: linkml-validate -C ModuleReview clean; module_validator passed with 0 warnings; render-module and render-projects clean; module_logic compiles to 15 atom occurrences and 4 core atoms with both module_ref targets resolving.
