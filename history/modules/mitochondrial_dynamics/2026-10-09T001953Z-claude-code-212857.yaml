  details: |
    Renamed modules/c_elegans_mitochondrial_dynamics.yaml to modules/mitochondrial_dynamics.yaml (MODULE:mitochondrial_dynamics); context taxon Opisthokonta (NCBITaxon:33154), chosen because the DRP fission dynamin is pan-eukaryotic but the mitofusin and OPA1/Mgm1 fusion parts are asserted only for opisthokonts. Recast the four worm GENE_PRODUCT annotons as FAMILY roles: fission dynamin (no PANTHER term; DRP-1 Q8WQC9, DNM1L O00429, yeast DNM1 P54861; PAINT PTN002480309, PTN002480318, PTN008520527; peroxisome fission added), MFF-family receptor (PTHR16501; MFF Q9GZY8, MFF-1 Q19343, MFF-2 P91344; GO:0043495 from the human review, worm reviews keep GO:0060090 and worm MFF is not essential for DRP-1 recruitment per PMID:24196833), mitofusin (PTHR10465; FZO-1 Q23424, MFN2 O95140; PTN002573358), and OPA1-family inner-membrane fusion (PTHR11566:SF67; EAT-3 Q18965, OPA1 O60313; GO:0140523; PTN007514526). Yeast Fis1-Mdv1/Caf4 receptor, MFN1, Fzo1 and Mgm1 are recorded in notes because they are not reviewed; OPA1 cristae shaping with MICOS kept out of scope. Added human/yeast evidence (PMIDs 10559943, 11181170, 11514614, 11553714, 18445678, 21149567, 21170049, 23921378, 23977156, 28114303, 28628083); 33 quotes verified verbatim. Cross-references updated to MODULE:mitophagy and MODULE:mitochondrial_dynamics. linkml-validate clean; module_validator passed with warnings; rendered.
