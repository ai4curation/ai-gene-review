  summary: Promote Mla intermembrane phospholipid transport module to COMPLETE
  details: |
    Generalized the module beyond Pseudomonas putida: species-neutral description and notes, scope CONCRETE, Escherichia coli K-12 MlaA/MlaB/MlaC/MlaD/MlaE/MlaF added as representative members alongside the PSEPK exemplars (all memberships verified against the PANTHER member index). Adopted PTHR35849:SF1 as the MlaB family (from maintainer PR #5076). Remodeled the MlaA step as an outer-membrane complex with MlaA as active unit because MlaA contributes to rather than enables phospholipid transfer activity. Added E. coli evidence (PMID:19383799, 28388411, 27529189, 32602838, 39080293, 29848551), removed a curation-only knowledge gap (content moved to notes), and added status/provenance to the remaining biology gaps. Plant TGD and mycobacterial Mce systems recorded as out of scope. Module validator: 0 warnings; recommended-field compliance 100%; 12/12 grounded gene reviews complete.
