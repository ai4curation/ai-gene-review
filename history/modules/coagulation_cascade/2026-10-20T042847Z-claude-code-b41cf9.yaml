  summary: New module from RGD PW:0000474
  details: |
    Created modules/coagulation_cascade.yaml from the RGD Pathway Ontology diagram
    PW:0000474, with seven parts: extrinsic initiation (F3/F7), FXI-FIX-FVIIIa
    amplification with VWF as the factor VIII carrier, thrombin feedback on F5/F8/F11,
    prothrombinase (F10/F5), thrombin cleavage of fibrinogen with FGA/FGB/FGG as the
    polymerising structural chains, factor XIII cross-linking (F13A1 catalytic, F13B
    carrier), and the plasma anticoagulant brakes (SERPINC1, TFPI, THBD-PROC-PROS1,
    PROZ-SERPINA10). Molecular functions were taken from each protein's experimental
    GOA annotations where available; the four non-enzymatic cofactor roles without GOA
    support (F3, F5, F8 as endopeptidase activators, PROS1 as peptidase activator) and
    the two functionless members (F13B, PROZ) are flagged as curator judgment in the
    module notes. Contact activation, fibrinolysis, the vitamin K cycle, platelet
    activation, SERPING1 and APOH are explicitly excluded with reasons, and the
    protein C arm is cross-linked to a cached human GO-CAM.
