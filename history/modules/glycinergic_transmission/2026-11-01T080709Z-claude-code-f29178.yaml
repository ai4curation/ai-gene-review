  summary: 'New module: glycinergic transmission via glycine receptors'
  details: |
    Created modules/glycinergic_transmission.yaml for the glycine-receptor gap in PTHR18945. Four parts: VGAT loading (shared with the GABAergic module) and exocytosis by module_ref, glycine reception, and clearance by two transporters. Reception alternatives are the adult alpha1beta receptor and the neonatal alpha2 homomer. GlyT2 and GlyT1 are modelled as parts rather than alternatives because their knockouts give opposite phenotypes. PAINT node PTN001055255 is recorded on GLRB, which is its UniProtKB seed, rather than on GLRA1. Status DRAFT: no member has a gene review here.
