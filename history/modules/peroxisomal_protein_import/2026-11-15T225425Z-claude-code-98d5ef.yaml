  summary: Pex10 step selects PTHR23350:SF0; Pex2's PTHR48178 side at SF1
  details: |
    Addresses the #6418 review. The Pex10 step selected the whole PTHR23350 family, which contains the Pex2 subfamily SF4 now selected by the Pex2 step, so one protein could count for both. It now selects PTHR23350:SF0, to which the PTHR23350 family review scopes PEX10 assertions. In PANTHER's release-19 files fly (Q9W0D7), Chlamydomonas (A0A2K3DK94), Neurospora (Q7SDX8) and Dictyostelium (Q54S31) meet Pex10 with an SF0 protein separate from their SF4 Pex2, so the rule's pass set is unchanged; C. elegans PEX10 (C0HKD7, SF0 in UniProt) is missing from PANTHER's worm file. The Pex2 step's PTHR48178 side is now selected at its single subfamily SF1, its preferred_term reads as biology, and its description points to the census script for the file-based placements.
