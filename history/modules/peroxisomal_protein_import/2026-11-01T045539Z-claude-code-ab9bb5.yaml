- type: CREATE
  outcome: changed
  summary: New eukaryote-wide peroxisomal protein import rule module split out of
    peroxisome-lifecycle
  details: |
    Created from the curated import stages of peroxisome-lifecycle (membrane biogenesis, matrix cargo targeting, docking, receptor recycling), moved with their annotons and evidence. Rule semantics changed: the old one-of choices between membrane insertion routes and between PTS1/PTS2 receptors became a required core (Pex19/Pex3; Pex5) plus optional parts (Pex16, RRBP1; Pex7). The importomer, RING peroxin and PEX1/PEX6 complexes were broken into per-subunit PANTHER family annotons (PEX14, PEX13, PEX2, PEX10, PEX12, PEX1 SF12, PEX6 SF9), with MFs from the human gene reviews' core_functions; PEX6 keeps the curated ATP hydrolysis activity. Required core: PEX19, PEX3, PEX5, PEX14, PEX13, PEX2, PEX10, PEX12, PEX1, PEX6. Optional, as lineage-specific: PEX16, RRBP1 route, PTS2/PEX7, RNF146-TNKS input, and the PEX1/PEX6 membrane anchor (PEX26 variant). PAINT IBD nodes are at Eukaryota except PEX2 (Amniota; eukaryote-wide placement rests on PTHR48178:SF1 membership) and PEX26 (Eumetazoa). Lineage-loss statements are from the curated module and general literature, not yet checked against proteomes. After review on PR #5820: PEX3 typed GO:0030674 from its PAINT IBD, PEX16 GO:0060090 and PEX26 GO:0051117 added, the annoton-less Pex15 anchor variant removed (selection back to EXACTLY_ONE), the knowledge gap boundary re-pointed at the receptor annotons, the glycosome clause softened to a PEX3 check, and PAINT release stamps refreshed.
