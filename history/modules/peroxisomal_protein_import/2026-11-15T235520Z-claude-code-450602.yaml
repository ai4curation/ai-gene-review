  summary: Pex2 step keeps PTHR48178 whole; Pex10 gains yeast and Arabidopsis representatives
  details: |
    Supersedes the SF1 narrowing recorded in history/modules/peroxisomal_protein_import/2026-11-15T225425Z-claude-code-98d5ef.yaml, whose summary no longer matches the module. PTHR48178 has a second subfamily, SF2, in panther.obo, so the Pex2 step's PTHR48178 side is selected as the whole family again (commit bd69f0bc6b); the two statements that called SF1 its only subfamily were corrected, and the Pex10 description now records that the old whole-family Pex10 selector let the worm SF6 RING protein Q18355 pass as Pex10. Commit 5ac5aa5a40 rewrote the Pex2 description's stale sentence (the Pex10 step now selects PTHR23350:SF0, so the two steps share no selector) and added yeast PEX10 (Q05568) and Arabidopsis PEX10 (Q9SYU4), both PTHR23350:SF0 in the committed entries table, as Pex10 representatives.
