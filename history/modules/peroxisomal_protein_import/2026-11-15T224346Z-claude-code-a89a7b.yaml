- type: EDIT
  outcome: changed
  summary: 'Pex2 step: also select PANTHER''s file placement PTHR23350:SF4'
  details: |
    PANTHER's release-19 classification files put the Drosophila, C. elegans, Dictyostelium and Chlamydomonas Pex2 proteins in PTHR23350:SF4 (named Peroxisome biogenesis factor 2), while UniProt puts them in PTHR48178:SF1, the step's existing selector; Neurospora and Trypanosoma Pex2 are in SF4 in both sources. The Pex2 selector now lists both, recording the disagreement and the overlap with the Pex10 step's whole-family PTHR23350 selector. Dictyostelium pex2 (Q75JQ3) is added as a representative. In a census over PANTHER's files the rule's required parts are now met by fly, Chlamydomonas, Neurospora and Dictyostelium as well; both yeasts still fail on Pex2 only because yeast PEX2 is absent from PANTHER's yeast classification file.
