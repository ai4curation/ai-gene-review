  details: |
    Made the module species-neutral with E. coli K-12 MurI, Alr, DdlA and DdlB as experimental exemplars beside KT2440. Added PAINT ancestral nodes PTN000476349 (PTHR21198), PTN000775508 (PTHR30511, adopted from PR 5076) and PTN000566166 (PTHR23132). Regrounded the alanine racemase leaf from PTHR30511:SF4 to the PTHR30511 family because biosynthetic Alr enzymes are split between SF4 and SF0 and SF0 also holds catabolic DadX and periplasmic BSR racemases. Added E. coli and mycobacterial evidence; scope CONCRETE. Family reviews PTHR21198, PTHR30511 and PTHR23132 added; all 8 grounded gene reviews COMPLETE.
