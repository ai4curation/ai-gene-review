  summary: Generalize Sec post-translational export to Bacteria with SecB-dependent
    and SecB-independent routes
  details: |
    Retitled from Gram-negative to bacterial scope. Precursor delivery is now a ROUTE variant set: SecB-dependent carriage (Proteobacteria, PMID:25538690) or SecB-independent recognition by SecA (GO:0070678; PMID:18022369). SecYEG and SecDF are modelled as protein complexes with active units so SecE, SecG, SecD and SecF contribute rather than enable. SecDF has a REALIZER variant set for split SecD+SecF versus fused SecDF (B. subtilis, PMID:9694879). Added B. subtilis 168 representatives (SecA, SecY, SecDF, SipS) beside E. coli K-12 and P. putida KT2440, SecE/SecG PAINT nodes (verified from PR #5076 grounding), B. subtilis evidence (PMID:10559168, PMID:10816431, PMID:9694797). Replaced CURATION-only knowledge gaps with biological gaps; boundary notes moved to notes.
