  summary: 'MIF module: CD74-CD44 receptor complex step; Euteleostomi scope'
  details: |
    The receptor step had CD74 alone with GO:0004896, although the module's own evidence (PMID:17045821) shows CD74 binds MIF but signaling needs CD44. Remodelled it as a PROTEIN_COMPLEX participant grounded to GO:0035692 macrophage migration inhibitory factor receptor complex, enabling GO:0004896, with active units CD74 (PANTHER:PTHR14093:SF17, PTN002679661, GO:0035718 macrophage migration inhibitory factor binding) and CD44 (PANTHER:PTHR10225:SF6, PTN002566805, GO:0004896; GOA has CD44 contributes_to GO:0004896 by IDA and IBA). UniProt accessions (P04233, P04441, P16070, P15379) and DR PANTHER lines were checked against UniProt REST, and GO ids and labels against QuickGO. Fetched PTHR10225 PAINT data (just fetch-panther-paint PTHR10225) to ground PTN002566805, which is placed at taxon:117571. Changed the taxon scope from Bilateria to Euteleostomi (NCBITaxon:117571), where both receptor PAINT nodes sit, and noted that the MIF ligand family is older (Bilateria node PTN000237513, Eukaryota root PTN000237510). Validators: linkml ModuleReview clean; module_validator has no errors (PANTHER member-index not-checked warnings only).
