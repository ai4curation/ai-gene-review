  summary: 'Create module: G1/S transition (Start / restriction point)'
  details: |
    Created modules/g1_s_transition.yaml (MODULE:g1_s_transition), the
    first of four cell-cycle-progression modules requested with human, budding
    yeast and fission yeast as representative entries. Boundary: growth-coupled
    G1 cyclin-CDK activation -> release of the G1/S transcription program from
    its corepressor -> G1/S cyclin-CDK activation -> SCF-dependent destruction of
    the stoichiometric CDK inhibitor; ends with active S-phase CDK. Origin
    licensing, replication initiation and the G1 DNA-damage checkpoint are
    excluded. Grounded in GO:0000082. Four ordered parts with two positive
    feedback connections; the corepressor/transcription-factor step is a taxon
    variant set (Rb-E2F; Whi5-SBF/MBF; fission-yeast MBF, where no Rb/Whi5-type
    corepressor exists and the CDK trigger is recorded as an open question).

    Grounding: every UniProt accession was resolved through the UniProt REST API
    by gene name and organism (human 9606, S. cerevisiae 559292, S. pombe
    284812) and cross-checked against local *-uniprot.txt files where present;
    PANTHER family ids were taken from the local PANTHER 19.0 classification
    (interpro/panther/panther-members.tsv after refresh) and labels copied
    verbatim from interpro/panther/panther.obo; PAINT ancestral nodes
    (PTN000623980, PTN001172579, PTN000019791, PTN000348425) were selected from
    the local *-paint.tsv slices by matching the exemplars' UniProt/PomBase/SGD
    ids in the seeds column. The CKI descriptor (p27, Sic1, Rum1) asserts no
    family id because Sic1 and Rum1 are unclassified; the SCF F-box unit uses
    family_terms across four PANTHER 19.0 families (which differ from UniProt's
    PANTHER cross-references; documented in the descriptor) and cites the SKP2
    PAINT node as evidence rather than as an ancestral node. GO labels were
    checked against cache/go/terms.csv and QuickGO. All PMIDs were verified
    against PubMed E-utilities before use (several remembered PMIDs proved wrong
    and were replaced).

    Validation: linkml-validate -C ModuleReview passes; module_validator reports
    term labels OK with advisory warnings only (NCBITaxon labels unverifiable via
    OLS through the proxy; one seed-overlap note for the fungal PTN); derived QC
    reports 100% recommended-field compliance, no leaf-grounding gaps and no
    conformance violations. Rendered to pages/modules/g1_s_transition.html.
    Left undone: no module deep-research report (no provider credentials in this
    session); satisfiability against a specific genome not checked.
