  summary: Note the C. elegans realization of the CDK-inhibitor step (transcriptional
    control; CRL2 rather than SCF)
  details: |
    The module and its cki_destruction node described inhibitor destruction as SCF-dependent. With worm CKI-1 now a representative, the description and node say that C. elegans realizes the step differently. Developmental regulators (DAF-16, LIN-1/LIN-31, NHR-67) control cki-1 transcription for G1 quiescence, and in germ cells CKI-1 is degraded by CRL2(LRR-1) rather than an SCF; the orthologous human CRL2(LRR1) targets p21 (PMID:21074724, already cited on the annoton). The SCF annoton is now described as the yeast/mammalian p27 route. Validator warnings unchanged (8 non-index).
