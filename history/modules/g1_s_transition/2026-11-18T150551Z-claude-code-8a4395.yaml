  summary: Add C. elegans CKI-1 as a Cip/Kip representative of the stoichiometric
    CDK inhibitor
  details: |
    Linked the newly reviewed worm cki-1 (Q22197) to the cki annoton of the cki_destruction step as a representative member, next to CDKN1B, Sic1 and Rum1. CKI-1 is a PTHR10265 (Cip/Kip) member per its UniProt PANTHER cross-reference, and its IBA rows for GO:0004861 come from PTN004142838, the PAINT node the annoton already cites; the cki-1 review has GO:0004861 as its core function. Added evidence from PMID:21074724: CKI-1 is degraded by the cullin-2 ligase CRL2(LRR-1) in germ cells to allow G1/S progression, so the worm realizes the inhibitor-destruction step with a CRL2 rather than an SCF ligase; the scf_ligase annoton was left unchanged and the difference is stated in the evidence. Module validator warnings are unchanged by the edit (8 before and after, excluding member-index notices); schema validation and the quote check pass.
