  summary: Generalize EF-P stall rescue beyond KT2440 and model activation as variants
  details: |
    Rewrote the module as the bacteria-wide EF-P mechanism rather than the P. putida UPA00345 instance: species-neutral description and context, three reviewed exemplars (E. coli P0A6N4, P. putida Q88LS0, B. subtilis P49778) all in PANTHER subfamily PTHR30053:SF12, and the eIF5A/aIF5A orthologs explicitly out of scope.

    Brought EF-P activation inside the module as an optional first part carrying a ROUTE variant set over the three characterized chemistries: EpmB/EpmA/EpmC (R)-beta-lysylation of Lys34, EarP rhamnosylation of Arg32, and YmfI-dependent 5-aminopentanolylation of Lys32. EXACTLY_ONE selection (no organism runs two routes); the enclosing part is optional because B. subtilis EF-P works unmodified and many bacteria have no known modification system. The previous draft declared activation adjacent context, which hid the lineage variation the module is supposed to express.

    Activation enzymes are grounded as concrete UniProt gene products, not by family: PTHR42918 (EpmA) is dominated by lysyl-tRNA synthetases, PTHR30538 (EpmB) mixes (R)- and (3S)-forming aminomutases, PTHR42879 (YmfI) is FabG-dominated, and EpmC has no PANTHER family. Each family nevertheless received a full review recording that judgment. EpmB's annoton carries no GO molecular function because GO has no term for RHEA:44148.

    Knowledge gaps rewritten as three genuine biological unknowns with verbatim provenance; the EfpL scoping decision moved to notes. QC: schema and module validators clean (0 warnings), recommended-field compliance 100%, gene-review summary 8/8 complete.
