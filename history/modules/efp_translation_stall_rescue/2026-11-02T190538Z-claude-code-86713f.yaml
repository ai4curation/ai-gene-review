  summary: Drop the EpmB process assertion and record three modelling caveats (PR
    5912 review)
  details: |
    Review of PR #5912 found the module re-asserting GO:0043687 for EpmB, the term its own gene review marks over-annotated on participation grounds. Removed the processes block from the epmb_beta_lysine_supply annoton; the donor-supply role now sits in role_description, which says explicitly that EpmB acts on free lysine and never touches EF-P, so it performs none of the work of the modification.

    Also moved the KT2440 scope commentary out of description into notes, and added three notes: why compartment granularity is mixed (cytosol where the gene reviews have direct evidence, the cytoplasm parent for the EpmC and YmfI IC inferences), how well GO:0072344 fits (its definition speaks of freeing the ribosome whereas EF-P resumes elongation; kept as the established term, with the BACSU efp review's question inherited as the caveat), and why PSEPK efp is left at status DRAFT while the other seven members are COMPLETE.
