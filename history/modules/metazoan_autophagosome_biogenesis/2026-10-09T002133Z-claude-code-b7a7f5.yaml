  summary: Generalize C. elegans autophagosome module to Metazoa with worm+human family
    roles
  details: |
    Renamed MODULE:c_elegans_autophagosome_biogenesis to MODULE:metazoan_autophagosome_biogenesis (context NCBITaxon:33208 Metazoa). Recast all members as FAMILY roles with PANTHER families checked against panther.obo and the member index, representatives C. elegans + human (each with a gene review). Expanded from five to eight parts: ULK1 initiation complex (UNC-51/ULK1, ATG-13/ATG13, EPG-9/ATG101), PI3KC3-C1 (VPS-34/PIK3C3, VPS-15/PIK3R4 contributes_to, BEC-1/BECN1), PI3P effectors (ATG-18/WIPI2; EPG-6 WIPI4 subfamily), lipid supply (ATG-2/ATG2A lipid transfer; ATG-9/ATG9A scramblase), Atg8 conjugation (ATG-4.1 priming, ATG-7/ATG7 E1, ATG-3 E2, ATG-5/ATG5 E3 contributes_to, ATG-16.2/ATG16L1 membrane adaptor that specifies site rather than lipidation), Atg8 family with a taxon / sequence lineage variant set (nematode LGG-1 early then LGG-2 late vs mammalian LC3 elongation then GABARAP fusion, PMID:20418806, PMID:27864321), optional SQST-1/SQSTM1 cargo receptor, and EPG-5/EPG5 tethering (GO:7770062). Added a BIOLOGY knowledge gap on lineage-specific Atg8 staging and broadened the lipidation gap. Cross-references phagophore_assembly_site and phagophore_organelle_contact_site; updated cross-reference lines in mitophagy and c_elegans_lysosomal_lipid_signaling. All quotes checked verbatim against cached publications; linkml-validate clean; module_validator passes (10 warnings: taxon ontology unavailable, Atg8 family-vs-subfamily, expected contributes_to, two FUNCTION_UNREVIEWED).
