- type: REVIEW
  outcome: changed
  summary: Switch variant set to EXACTLY_ONE; document that the outcome node carries
    no logical weight
  details: |
    Review follow-up on PR 5333. The variant set declared selection: ONE_OR_MORE while its own note said a single-gene-lysis phage encodes exactly one of these lysis proteins. EXACTLY_ONE states the biology the note already asserted; compile_node compiles every variant set to the same Or, so satisfiability and the route enumeration are unchanged (still SAT for BPMS2, BPQBE, BPPHS only, and UNSAT for an empty genome). 81 other curated modules already use EXACTLY_ONE.

    Also recorded in the cytolytic_virion_release node's notes that it carries concepts but no annotons, so it compiles to an empty conjunction and contributes nothing to satisfiability: the module's whole requirement is the single_gene_lysis_mechanism variant set. Without that note the surrounding structure reads as though a required part constrains the module, which could lead a later editor to trim the variant set.
