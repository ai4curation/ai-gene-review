  summary: Model the three single-gene lysis mechanisms as a ONE_OR_MORE variant set
  details: |
    The module declared its three mechanism branches (phiX174 E inhibiting MraY, Qbeta A2 inhibiting MurA, MS2 L destabilizing the envelope) as three sibling parts each marked 'optional: true'. compile_module turns an optional part into OR(filled, empty), so a node whose every part is optional admits the empty route and the module asserted no requirement at all: it was satisfied by all seven curated phage genomes and by an empty genome. The branches are alternative mechanisms for one step (a single-gene lysis phage encodes exactly one lysis protein), so they are now one variant_sets entry with selection ONE_OR_MORE, and the shared downstream outcome node (cytolytic_virion_release) remains the module's single required part. The module is now satisfied by BPMS2, BPQBE and BPPHS and not by BPM13, BPPH6, LAMBD or BPT4. Found while testing module satisfiability across the newly curated phage genomes.
