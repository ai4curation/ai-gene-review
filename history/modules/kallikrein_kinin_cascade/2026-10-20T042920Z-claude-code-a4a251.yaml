  summary: New module from RGD PW:0000526
  details: |
    New ModuleReview derived from the RGD Pathway Ontology diagram PW:0000526
    (kallikrein-kinin cascade pathway), grounded on GO:0002254 kinin cascade with the
    specific children GO:0002353 and GO:0002255 used on the plasma and tissue routes.
    Seven parts cover contact activation of F12, prekallikrein activation by F12a and
    PRCP, kinin release from kininogen (a variant set for the plasma-kallikrein and
    tissue-kallikrein routes), B2/B1 receptor signaling, des-Arg kinin generation by
    CPN1 and CPM, kininase inactivation by ACE, MME, XPNPEP1 and XPNPEP2, and
    inhibition by SERPING1, A2M and SERPINA4; every molecular function was taken from
    the participant's experimental GOA rows and three annotons are linked to the human
    GO-CAM gomodel:6246724f00000632. Coagulation, fibrinolysis, classical complement,
    renin-angiotensin and receptor desensitization by GRK4/ARRB1/ARRB2 are deliberately
    out of scope and recorded as hand-offs in the module notes; KNG1 carries only the
    released kinin's hormone activity, not a proteolysis process, since it is the
    kallikreins' substrate.
