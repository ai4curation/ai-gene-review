  summary: Add B2 receptor desensitization (GRK2/3, beta-arrestins) and cite PW:0001480
  details: |
    RGD kinin signaling (PW:0001480) is covered by extending this module rather than a separate one. New regulatory step: GRK2 (core) and GRK3 (variant) phosphorylate BDKRB2, ARRB2 and ARRB1 bind it, negatively regulating B2 signalling; B1 escapes this. GRK4, which RGD draws, is left out: no source ties it to either bradykinin receptor. A bradykinin receptor signaling pathway term (parent GO:0007186) is requested in proposed_new_terms.
