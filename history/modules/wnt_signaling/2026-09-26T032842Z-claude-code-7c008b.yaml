  summary: Use palmitoleoyltransferase activity for the PORCN annoton
  details: |
    PORCN annoton function repointed from GO:0016747 (the replaced_by of obsoleted GO:0008374 O-acyltransferase activity; a near-root MF already used by unrelated acyltransferase modules) to its live descendant GO:1990698 palmitoleoyltransferase activity, which names the acyl species PORCN transfers to Wnt. preferred_term keeps the protein-serine O-linkage; GO has no more specific live term for Wnt O-palmitoleoylation.
