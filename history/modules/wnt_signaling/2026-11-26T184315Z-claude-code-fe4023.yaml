  summary: Reference the PCP module; correct beta-TrCP and LRP terms; add family ids
  details: |
    Signaling-module review, third batch. The planar cell polarity branch was a placeholder annoton with no function; it now includes modules/wnt_planar_cell_polarity.yaml by module_ref, and the annoton id pcp_rho_rac_effectors is removed (nothing referenced it). beta-TrCP carried GO:0004842 ubiquitin-protein transferase activity, but the F-box protein is the substrate receptor; it now carries GO:1990756 (IDA in GOA). The LRP5/6 annoton was labelled Wnt co-receptor activity on the term Wnt-protein binding; it now uses GO:0015026 coreceptor activity (core for LRP6). Axin and APC units gain molecular adaptor activity and beta-catenin binding (core in their reviews). PANTHER ids added for Wnt ligands (PTHR12027), Dishevelled (PTHR10878), Porcupine (PTHR13906) and Wntless (PTHR13449), each from the representative's UniProt cross-reference. No id was added for Frizzled, because PTHR11309 also contains Smoothened, which is not a Wnt receptor. The Wnt/calcium branch and the R-spondin and secreted-antagonist annotons remain placeholders. Schema and module validator pass; remaining warnings are coverage notices.
