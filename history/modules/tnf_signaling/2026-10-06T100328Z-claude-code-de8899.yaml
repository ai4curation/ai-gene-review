  details: |
    Added part tak1_tab_kinase_activation (order 3) with two annotons. (1) A GO:0097076 TAK1 complex participant with active units TAK1 (PANTHER:PTHR46716:SF1, rep UniProtKB:O43318, PTN000723805), TAB1 (Q15750) and TAB2/TAB3 (Q9NYJ8/Q8N5C8, GO:0070530); function GO:0004674 targeting IKBKB (O14920). (2) TAK1 MAP3K activity GO:0004709 on MKK3/6 and MKK4/7. Rewired connections: adaptor complex -> TAK1 -> output, replacing the direct adaptor -> output edge. Clarified TRAF2 as an adaptor/E3 scaffold without kinase activity in the output-step role description. Evidence: PMID:11460167, PMID:14633987, PMID:15327770, Reactome:R-HSA-5357860, MAP3K7 gene review. IKK complex left to MODULE:nfkb_canonical_signaling.
