  summary: 'Address ai4c-reviewer round 2 on PR #6490'
  details: |
    Review round 2 on PR #6490. Blocking item, both cases taken, and both the same error: SUBFAMILY_ONLY grants a term to the whole named subfamily minus its member_exceptions, so it cannot express "established for one member of a mixed subfamily". PTHR43639 GO:0141148 was SUBFAMILY_ONLY on SF1 with three exceptions, which granted NADPH enoyl-ACP reductase activity to some forty characterized CH-OH-donor dehydrogenases of that 47-member subfamily, and its scope_reason wrongly said the sugar 1-dehydrogenases were excepted by name; it is now UNRESOLVED, carrying the FabL enzymology in scope_reason. RESIDUE_DETERMINED was rejected for it because the SDR catalytic tetrad is shared with the CH-OH members, so no curated site separates FabL from them. PTHR32332 GO:0004318 was SUBFAMILY_ONLY on SF20 with no exceptions; the reviewer endorsed adding SF20's four SwissProt members as exceptions, but that fix does not hold up: UniProt annotates an enoylreductase domain at 1026-1470 of A0A1B3PEI9 (PUFA synthase subunit C), which is the region matching this family, with no cofactor specified, so that member can be neither granted an NADH-specific term nor honestly excepted from one, while FabK itself is absent from the family's SwissProt inventory and reaches SF20 only through its own UniProt cross-reference. That assessment is therefore UNRESOLVED too, by the same argument as the other case, with the three genuinely non-reductase members (two ipdC steroid dehydrogenases and the PA1024 quinone reductase) named in scope_reason. Both changes are family-review-only and neither alters a module claim: the FabK and FabL variants already rested on their exemplars' enzymology rather than on membership, which is now what the family reviews say. The module validator consequently reports three warnings instead of one, the two new ones being FAMILY_FUNCTION_UNREVIEWED on those variants; all three are intrinsic, record real states of the upstream evidence, and are explained in module.notes. Non-blocking items taken: the note repeated across PTHR42853, PTHR42995 and PTHR45266 said every ACC subunit "performs no step of the complete reaction", which is untrue of AccA and AccD, so it now says that no one subunit carries out the whole reaction and names what each does; the same note's off-by-one ("this review and the two other" while listing three families) is fixed; review_date is bumped on every family review this round touches, including PTHR43159, which gained its reference protein earlier in the PR without a date bump. The fabK GO:0016491 MODIFY was sanity-checked against the 2026-11-14 ruling and did not survive it: MODIFY needs the deeper term to be reached by this row's own evidence, and the row's own propagation_review records that its IBD sits on a clade mixing FabK with nitronate monooxygenases and so reaches only the shared oxidoreductase chemistry. The row is now TOO_GENERAL, the case being a term imprecise on its own, and GO:0004318 is asserted instead as a NEW IDA row on the direct enzymology (GOA carries no molecular-function term for the activity on this entry). The MECR GO:0006631 MODIFY retained in round 1 is consistent with that and is unchanged: its IBD sits on PTHR43981, whose members are all mitochondrial enoyl-ACP reductases, so descent from the node does reach the biosynthetic child. Validation: linkml-validate -C ModuleReview and -C FamilyReview clean on every touched file; module_validator 3 intrinsic warnings; just validate-families exit 0 with 0 crosscheck conflicts; fabK gene review valid; quote checks clean.
