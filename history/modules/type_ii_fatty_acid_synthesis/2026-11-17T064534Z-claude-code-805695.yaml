  details: |
    Review round on PR #6490. Blocking item taken: the E. coli fabH GO:0005737 cytoplasm row used ACCEPT while its own reason argued the two GO:0005829 cytosol IDA rows were more specific, so it is now MODIFY with GO:0005829 as the replacement, matching accA/accB/accC/accD, whose rows have the same IEA GO_REF:0000120 provenance (fabZ stays ACCEPT: it has no cytosol row to refine to). Non-blocking items taken: the counter-label GO:0009329 definition claim now cites the P. putida accD review that records the definition verbatim with a QuickGO API check and flags the label as an ontology defect, in both E. coli ACC reviews and in the two PTHR42995 blocks that make the claim; the two swapped rationales on the B. subtilis fabL GO:0141148 rows are exchanged; the accB core function now uses proposed_molecular_function for the proposed biotin-dependent carboxyl carrier activity instead of the very broad GO:0140104, which its own proposed-term justification argued against; the GO:0003989 scope divergence between the three new ACC families (NOT_APPLICABLE) and main's PTHR48095 (SUBFAMILY_ONLY) is now stated explicitly in each of the three rather than only in the module notes. Declined: rewriting main's PTHR48095 review to align the scope value, since it is another PR's considered judgement and the two formulations express the same subunit-versus-holoenzyme reading. The MECR GO:0006631 IBA refinement is retained, with the granularity argument now recorded on the row: the IBD sits on the mitochondrial enoyl-ACP reductase family whose reaction is biosynthetic, and action consistency requires the three rows on that term to be refined in step. Validation after merging origin/main: all six touched gene reviews valid; module validator 1 intrinsic warning; just validate-families exit 0 with 0 crosscheck conflicts; 303 quotes verified across the touched files.
