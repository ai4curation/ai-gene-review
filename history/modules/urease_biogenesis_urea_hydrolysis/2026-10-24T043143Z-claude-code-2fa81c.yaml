  summary: Generalize urease biogenesis module and promote to COMPLETE
  details: |
    Generalized the former three-subunit bacterial module to nickel-dependent urease across bacteria, archaea, plants and fungi: apoprotein assembly modelled as an EXACTLY_ONE variant set (three-chain K. aerogenes/P. putida; two-chain H. pylori; single-chain Arabidopsis/S. pombe), UreE made an optional part (absent in plants/fungi), UreD/UreF annotons given GO:0018237 urease activator activity, UreG nickel delivery split into its own step, and the catalytic unit grounded to PTHR43440:SF1 with representatives from five organisms. InterPro ids dropped from family terms (unvalidated prefix) and kept in descriptions; PTHR33569 judged too broad for the gamma/beta roles. Added a plant/fungal nickel-donor knowledge gap. Family reviews for all five PANTHER families and complete gene reviews for all 26 grounded accessions. Module validator 0 warnings, 100% recommended-field compliance, 26/26 gene reviews complete.
