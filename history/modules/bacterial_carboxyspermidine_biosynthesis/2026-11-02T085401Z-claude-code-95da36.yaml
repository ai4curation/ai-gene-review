  summary: Generalize bacterial carboxyspermidine module beyond KT2440
  details: |
    Generalized the module from Pseudomonas putida KT2440 exemplars alone to the bacterial route it describes. Both leaves now lead with the experimentally characterized Vibrio cholerae pair (Q9KRL3 CANSDH, Q9KRL4 NspC) and keep KT2440 as the inferred exemplar, labelled as such. Added evidence that the route is not Vibrio-specific (Campylobacter jejuni and Bacteroides thetaiotaomicron deletion/complementation; inactive Helicobacter pylori SpeE), recorded the norspermidine variant as the same module with a different diamine input and the Synechocystis carboxyaminopropylagmatine route as a separate module, and added a knowledge gap on what sets the spermidine/norspermidine split. Scope kept CONCRETE with FAMILY participants and Bacteria context; grounding choices and the reason for not declaring ancestral_nodes are recorded in notes. Validation: linkml-validate -C ModuleReview clean, module_validator 0 warnings, recommended-field compliance 100 percent, gene reviews 4/4 complete, function conformance 6/6 supported with 0 conflicts, render-module regenerated.
