  details: |
    Kept the module bacterial (eukaryotic CHO1/PSD route lives in cdp_dag_phospholipid_synthesis) and made prose species-neutral with P. putida KT2440 as one exemplar. Added E. coli PssA (P23830) and Psd (P0A8K1) and B. subtilis PssA (P39823) as representatives because each carries direct experimental evidence (PMID:39693441, PMID:179992, PMID:1093166, PMID:7011377, PMID:8002567). Adopted the subfamily groundings from PR #5076 after verifying membership and family-review scopes: PTHR12586:SF1 plus PAINT node PTN001758495 for type-I PssA, PTHR10067:SF6 and SF17 plus PTN000007430 for Psd; type-II PssA is grounded on PTHR14269:SF61 and SF59 (replacing InterPro IPR004533, now in prose). Replaced a GOA-file citation on the PTN001758495 node with the PAINT IBD table. Module schema and semantic validators pass with zero warnings; recommended-field compliance 100%; 6/6 grounded gene reviews complete; all family-function rows FAMILY_SUPPORTED. Deep research files were used as leads only.
