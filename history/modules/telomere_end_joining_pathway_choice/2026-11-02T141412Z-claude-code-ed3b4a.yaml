  summary: Create mammalian module for NBS1 S432 phosphorylation-controlled c-NHEJ
    vs alt-NHEJ choice at dysfunctional telomeres
  details: |
    New ABSTRACT module (Mammalia) from Rai et al. 2017 (PMID:28216226) subsuming GO-CAM 65a1f4f800002884. Parts: CDK2/PP1-alpha switch on NBS1 S432; TRF2 TRFH docking of dephospho-NBS1 (TRF2 as chromatin-protein adaptor, NBN as target, correcting the GO-CAM polarity); ROUTE variant set c_nhej_route (module_ref atm_dsb_signaling#atm_activation, LIG4) vs alt_nhej_route (NBS1-EXO1 recruitment, EXO1, PARP1, LIG3). Signed connections encode the choice. Fetched PMID:12361565 for LIG4.
