  details: |
    Created MODULE:synaptic_vesicle_exocytosis (GO:0016079) with four parts: Rab3/RIM/ELKS active-zone recruitment (RAB3A with PAINT node PTN009219507 on G protein activity, RIMS1, ERC1), Munc13/Munc18-1 priming (UNC13A with a gocam_association to the C. elegans unc-13 activity in gomodel:5b528b1100000489, STXBP1 on subfamily PTHR11679:SF35), Cav2 Ca2+ influx (CACNA1A/CACNA1B with GO:0099626, RIMBP2 tether), and a Ca2+-triggered SNARE fusion bundle that conforms WITH_DEVIATIONS to snare_fusion_cycle (syntaxin-1/SNAP-25/VAMP2 SNARE complex with PAINT node PTN000461349, SYT1 Ca2+ sensor, CPLX1 clamp, NSF/NAPA disassembly) plus a release-mode variant set (SYT1/SYT2 synchronous vs SYT7 asynchronous). Obsolete docking term avoided. Evidence: GO, PMID:24183019, 23060190, 26098518, 24274737. Validated with linkml-validate and module_validator (declared deviations surface as info); rendered.
