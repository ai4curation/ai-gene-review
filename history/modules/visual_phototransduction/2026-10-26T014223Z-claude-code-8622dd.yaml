  summary: New module from RGD PW:0000962
  details: |
    Created modules/visual_phototransduction.yaml from the RGD visual phototransduction diagram, grounded in GO:0141190. Each activation step (opsin, transducin, PDE6, CNG channel, NCKX) has rod and cone variants; recovery covers GRK1/GRK7, SAG/ARR3, recoverin, the RGS9/GNB5/RGS9BP GAP complex and retGC/GCAP cGMP resynthesis, and the retinoid cycle is a module_ref to retinoid_visual_cycle. CIMIP3 (a sperm-axoneme protein listed by RGD, likely via its alias GUCA1ANB) was excluded and GUCA1A added from RGD's own diagram. Notes record a likely GO-CAM slip: PDE6C part_of GO:0070966 in the OPN1SW and OPN1MW cone models.
