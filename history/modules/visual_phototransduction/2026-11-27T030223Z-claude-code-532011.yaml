  summary: Reconcile the phototransduction module with the new gene and GO-CAM reviews
  details: |
    Reconciled for projects/DISMECH_VISION_ALIGNMENT after first reviews were completed for sixteen module members and six GO-CAM models were reviewed. Every completed gene review agrees with the module on molecular function; review-file evidence was added to those annotons. Rhodopsin kinase and arrestin now sit at the photoreceptor disc membrane and carry GO:0016059; the exchanger uses GO:1990034; the RGS9 complex gains GO:1902773. Notes now list which members have a COMPLETE, DRAFT or no review, and the GO-CAM association descriptions report the citation and term errors found in the model reviews. RD3 is left out, with the reason: its cyclase inhibition is tied to delivery of the cyclase, not to calcium feedback. Status stays DRAFT because ten members have no gene review (GNGT1, GNGT2, SLC24A2, GRK7, ARR3, RCVRN, RGS9, RGS9BP, GUCY2F, GUCA1B) and four reviews are DRAFT. Validated with linkml-validate, module_validator (3 warnings) and quote_check (30 of 30).
