  summary: Add an optional C. elegans LIN-1/LIN-31 nuclear output part for the newly
    reviewed lin-31
  details: |
    Linked the newly reviewed worm lin-31 (P34683) to the module. The module stopped at the ERK tier; a worm-only optional part (order 6, worm_lin1_lin31_output, taxon NCBITaxon:6239) now models the MPK-1 readout in vulval precursor cells, following the pattern of the optional vertebrate ERBB2 and PI3K branches. Annotons: LIN-31 FoxB forkhead TF (GO:0000981, the core function of the lin-31 review) and LIN-1 Ets TF (UniProtKB:G5EDL0, unreviewed TrEMBL entry, no gene review; GO:0000981). Evidence quotes from PMID:9604932 (MPK-1 phosphorylates both; the LIN-1/LIN-31 complex inhibits vulval induction and LIN-31 phosphorylation disrupts it) and PMID:16782085 (both act on the Ras-dependent lin-39 P6.p enhancer). New connection egfr_ras_erk_output NEGATIVELY_REGULATES worm_lin1_lin31_output. The description keeps the lin-31 review's verdict that the activator model (phosphorylated LIN-31 promoting vulval fates) was proposed but not shown. Notes record that the fly Yan/Pointed and vertebrate ELK1/Ets readouts are not modelled. Module validator warnings unchanged (11 before and after, excluding member-index notices); schema and quote checks pass.
