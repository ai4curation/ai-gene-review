  summary: Broaden EGFR signaling module across Bilateria
  details: |
    Reworked the EGFR signaling module from a compact human-centered RTK draft into a Bilaterian, variant-aware module. Added human EGF/EGFR, Drosophila Spi/Egfr, and C. elegans LIN-3/LET-23 receptor-layer variants; kept GRB2/drk/Sem-5 and SOS as conserved adaptor/GEF tiers; expanded the shared output to a Ras-RAF-MEK-ERK relay with human, fly, and worm representative members; retained ERBB2/PI3K signaling as an optional vertebrate branch; and grounded the broader module with human and Drosophila production GO-CAM associations plus local PAINT nodes.
