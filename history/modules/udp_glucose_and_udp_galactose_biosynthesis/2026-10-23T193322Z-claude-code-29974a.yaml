events:
- type: EDIT
  outcome: changed
  summary: Generalize UDP-glucose/UDP-galactose module beyond Pseudomonas and promote
    to COMPLETE
  details: |
    Rewrote the module species-neutrally for Bacteria. Added experimentally
    characterized exemplars: E. coli K-12 Pgm (P36938), GalU (P0AEP3) and GalE
    (P09147), B. subtilis PgcA (P18159) and P. aeruginosa AlgC (P26276); kept the
    P. putida KT2440 members as homology-grounded exemplars. Split the
    phosphoglucomutase step into three family variants (PTHR22573:SF57,
    PTHR45745:SF1, PTHR43771:SF2) because E. coli Pgm and PgcA/P. putida Pgm sit in
    different PANTHER families. Grounded GalE on PTHR43725 subfamilies SF47 and
    SF53 (family_terms) instead of the SF53-only grounding proposed in PR #5076,
    which would exclude E. coli GalE. Added PAINT ancestral nodes PTN000501426,
    PTN000501189 and PTN000041817, PRECEDES connections, and replaced GOA-file
    evidence with literature and Rhea evidence. Added family reviews for
    PTHR43197, PTHR43771 and PTHR45745 and gene reviews for the new exemplars.
    Validated with linkml-validate (ModuleReview) and the module validator;
    status set to COMPLETE.
