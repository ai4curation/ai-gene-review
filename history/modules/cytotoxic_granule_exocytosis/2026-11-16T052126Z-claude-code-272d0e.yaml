  summary: 'Create module: cytotoxic granule exocytosis'
  details: |
    Created modules/cytotoxic_granule_exocytosis.yaml, the mechanism behind the perforin, granzyme A, granzyme B and granulysin production terms (4 production and 6 regulation terms) identified by the curated classification in projects/PRODUCTION_TERMS.md. Four parts, each mapped by a human deficiency: RAB27A-dependent transport of the loaded granule to the immunological synapse; Munc13-4 (UNC13D) docking and priming; fusion by syntaxin-11 with Munc18-2 (STXBP2), modelled as one step because losing either causes FHL; and perforin pore formation with the granzyme cargo and cathepsin C granule maturation. STX11 is given no molecular function because GO has no live generic SNARE term and syntaxin binding would describe its partner's side. LYST and MYO5A deliberately excluded: LYST changes granule size rather than release, and MYO5A is the control that bounds the pathway, causing the same pigmentary disease as RAB27A but not the immune one. Two knowledge gaps: whether granzymes enter through plasma-membrane or endosomal perforin pores, and whether granulysin uses this machinery at all, which the FHL genetics cannot address since granulysin is absent from mouse. Five publications newly cached after confirming each PMID against PubMed. Validated: linkml-validate clean; module_validator passes with zero warnings; 12/12 quotes verified; renders at 100 percent recommended-field compliance.
