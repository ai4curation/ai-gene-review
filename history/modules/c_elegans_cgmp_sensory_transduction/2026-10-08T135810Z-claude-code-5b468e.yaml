  summary: 'Create C. elegans module: cGMP-dependent sensory transduction'
  details: |
    New concrete C. elegans SIGNALING_PATHWAY module. Two root parts: neuron-specific guanylyl cyclase cGMP production (variant set ONE_OR_MORE: AWC rGCs ODR-1 B1Q257 and DAF-11 Q8I4N4; AFD rGCs GCY-8 Q9GYQ4, GCY-18 G5EFQ0, GCY-23 G5EEE9; URX/BAG O2-sensing sGCs GCY-35 O02298, GCY-36 Q6DNF4, GCY-31 Q86C56, GCY-33 P90895) and the TAX-4 Q03611 / TAX-2 G5EEE2 CNG channel, linked by PROVIDES_INPUT_FOR. The OSM-9/OCR-2 TRPV branch (AWA/ASH) is out of scope as cGMP-independent; GPA-12 excluded (epidermal antifungal pathway). Non-reviewed members use UniProt Swiss-Prot accessions. Contrasted with nitric_oxide_cgmp_signaling. 21 verbatim quotes from cached PMIDs. Schema validation and module validator pass (1 warning: NCBITaxon label not validated).
