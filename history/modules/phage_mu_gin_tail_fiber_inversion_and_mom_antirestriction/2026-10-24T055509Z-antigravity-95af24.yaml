  summary: Create and validate bacteriophage Mu pathway module MODULE:phage_mu_gin_tail_fiber_inversion_and_mom_antirestriction
    (Escherichia Phage Mu Gin-Catalyzed G-Segment Tail Fiber Phase Variation and Com-Mom DNA Methylcarbamoylation Antirestriction)
  details: |
    Created and validated concrete bacteriophage pathway module MODULE:phage_mu_gin_tail_fiber_inversion_and_mom_antirestriction (Escherichia Phage Mu Gin-Catalyzed G-Segment Tail Fiber Phase Variation and Com-Mom DNA Methylcarbamoylation Antirestriction) with 0 parts and 0 references.

    A concrete pathway module for Escherichia phage Mu (Muvirus mu, NCBITaxon:2681603) covering the two right-end host-range and host-defense evasion systems located downstream of the tail gene cluster: (1) site-specific DNA inversion of the 3 kb G-segment catalyzed by the serine recombinase Gin (P03015) at flanking 34 bp gix inverted repeats with the assistance of host factor Fis at the sis enhancer, switching expression between two alternative C-terminal receptor-binding tail fiber and assembly chaperone pairs—S + U in the G(+) orientation (Q9T1V0 + Q9T1U9, recognizing Escherichia coli K-12/C lipopolysaccharide) versus S' (Mup52) + U' (Mup51) in the G(-) orientation (P0DJY6 + P0DJY5, recognizing Citrobacter freundii, Shigella sonnei, Erwinia, and Enterobacter lipopolysaccharide); and (2) translational activation of the late com-mom mRNA by the zinc-finger RNA-binding protein Com (Q38621), which melts a translational repressor stem-loop to allow synthesis of the Fe2+/acetyl-CoA-dependent DNA adenine N6-methylcarbamoylase Mom (P06018), modifying ~15% of viral adenine residues to N6-methylcarbamoyladenine to protect packaged phage DNA against diverse host type I, II, and III restriction endonucleases.
