  summary: Align the outer-membrane duct molecular function with the tolC review
  details: |
    Merging main surfaced this through its new function-conformance check, which reported that the module asserted a molecular function no retained annotation or core function on P02930 supported. The module had transmembrane protein transporter activity for the TolC annoton; the focused tolC review retains efflux transmembrane transporter activity nine times and uses it in two of its three core functions, and explicitly declines the protein-specific term. The review's comparator was verified directly against QuickGO: PrtF, AprF and TolC all carry the efflux transporter term, and no outer-membrane factor carries the protein-transporter term. The module is therefore aligned to the family-wide term, the review is linked as evidence on the annoton, and the resulting loss of the protein-versus-small-molecule cargo distinction is recorded as a new ontology knowledge gap. The conformance warning is gone and the module and its gene review now agree.
