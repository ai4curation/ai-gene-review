  summary: Create bacterial type I secretion module
  details: |
    New species-neutral module for the tripartite type I secretion conduit, one of the secretion-system types E. coli uses that the module KB did not yet cover. Three conserved parts: the inner-membrane ABC translocase reading an uncleaved secretion signal, the periplasmic membrane-fusion adaptor, and the TolC-family outer-membrane exit duct. A variant set on the ABC transporter separates the non-processing subclass (HlyB, PrtD, AprD) from the peptidase-containing processing subclass (CvaB), since only the former satisfies the GO:0030253 requirement that the substrate is not proteolytically processed. Cargo is excluded from the boundary, matching the sibling type II and type VI apparatus modules. All UniProt accessions and GO labels verified against UniProt and QuickGO before assertion; three cited publications newly cached. Knowledge gaps record the absent molecular function term for the membrane-fusion protein role, the unresolved assembly stoichiometry, and the limited evidence for the processing subclass.
