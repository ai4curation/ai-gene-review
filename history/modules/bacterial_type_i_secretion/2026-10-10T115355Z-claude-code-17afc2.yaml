  summary: Move two ontology gaps to notes; correct the duct molecular function justification
  details: |
    PR review found knowledge_gaps entries whose only gap_kind was ONTOLOGY and/or CURATION, which CLAUDE.md prohibits. ModuleReview has no proposed_new_terms slot, so these move to the module notes, which CLAUDE.md names as a valid destination. Both the gap statement and the boundary prose are preserved, the latter as what is asserted instead. Two ontology gaps move: the duct molecular function's inability to distinguish protein from small-molecule cargo, and the absence of a term for the membrane-fusion protein role. The first is now a formal term request in the tolC review, which the notes point at. Separately, the reviewer questioned whether the annoton description overreached in justifying the substrate-general term on the definition's wording. Checked against the live ontology: GO:0015562 defines transfer of a specific substance or related group of substances, not a solute, so the sentence is within what the definition supports and is left as written.
