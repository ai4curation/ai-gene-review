  summary: 'Create module: necroptosis'
  details: |
    De-novo ModuleReview for the necroptotic process (GO:0070266), decomposed along GO's own parts: necroptotic signaling pathway (GO:0097527), ripoptosome/necrosome RHIM assembly (GO:1901026, complex GO:0097342), execution phase (GO:0097528), plus an optional caspase-8/FADD/cFLIP regulatory brake.

    Boundary: receptor-proximal biology is referenced, not duplicated - TNFR1 complex I / NF-kB to modules/tnf_signaling.yaml, LPS sensing and TRAM-TRIF to modules/tlr4_md2_lps_signaling.yaml, FAS DISC to modules/death_receptor_apoptotic_signaling.yaml, effector-caspase execution to modules/apoptotic_execution_phase.yaml. Upstream initiators (RIPK1 via death receptors, TICAM1/TRIF via TLR3/endosomal TLR4, ZBP1 via Z-nucleic acid) are one ONE_OR_MORE variant set over a shared RIPK3-MLKL core. Parthanatos is excluded explicitly (RIPK3/MLKL-independent) despite being a RELATED synonym of GO:0070266.

    Members are grounded by UniProt accession from the existing human gene reviews (RIPK1 Q13546, RIPK3 Q9Y572, MLKL Q8NB16, ZBP1 Q9H171, TICAM1 Q8IUC6, CASP8 Q14790, FADD Q13158, CFLAR O15519) and follow their curated core functions: RIPK3 kinase (GO:0004674) vs RHIM scaffold (GO:0120283 with GO:1990000); MLKL GO:0140912 membrane destabilizing activity (not GO:0140911), with GO:1901981 as targeting and GO:0000822 as activation, in the execution phase. No PANTHER family term is asserted: RIPK1/RIPK3/MLKL all fall in the broad PTHR44329 kinase family, which would not be informative. Two local PAINT nodes (PTN000585372 RIPK1, PTN008689042 MLKL, both P:GO:0097527 in PTHR44329) are cited as evidence provenance only. GO-CAM gomodel:62b4ffe300000504 anchors the ZBP1 adaptor, RIPK3 licensing and MLKL execution nodes.

    No module deep research provider was available, so no -deep-research-<provider>.md file was created; this is recorded in the module notes. Three knowledge gaps recorded: the ripoptosome/necrosome one-term ontology problem, whether human TICAM1 carries a necroptotic process role at endogenous expression, and the human/mouse ZBP1 RIPK1-vs-RIPK3 divergence.

    Validation: linkml-validate -C ModuleReview clean; module_validator passed with one warning (NCBITaxon label not checked, ontology unavailable); rendered to pages/modules/necroptosis.html; git diff --check clean.
