  details: |
    Created a bacterial ManXYZ mannose-family PTS module grounded in the completed ECOLI manX, manY, and manZ reviews. The module models ManX as the EIIAB phosphorelay subunit and ManY/ManZ as the EIIC/EIID inner-membrane translocation subcomplex for complex-level mannose PTS transporter activity, while keeping upstream EI/HPr, secondary sugar partitioning, lambda DNA penetration, and chemotaxis out of scope. Validated the ModuleReview with linkml-validate.
