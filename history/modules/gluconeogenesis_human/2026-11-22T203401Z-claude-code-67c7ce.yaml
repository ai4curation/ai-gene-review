  summary: Reframe the G6PC2/G6PC3 paralog note as a scope distinction rather than
    an annotation error
  details: |
    The paralog note on the g6pc_catalytic_node said the paralogs' expression must not be read as gluconeogenic free-glucose-release capacity, which is right, but it was headed 'Paralog trap' and left the impression that the paralogs' own GO:0006094 annotations are mistaken. Revisiting G6PC3 showed they are not.

    G6PC3 genuinely catalyses the terminal glucose-6-phosphate dephosphorylation: there is experimental support for astrocytic G6PC3/G6PT glucose production (PMID:15661744) and Reactome names G6PC3 the catalyst of a gluconeogenesis event (R-HSA-3262512). The curated genes/human/G6PC3 review accordingly retains GO:0006094 as KEEP_AS_NON_CORE on all three rows, with 1,5-anhydroglucitol 6-phosphate clearance as its core function, and that is correct.

    The note now states the exclusion as scope: participates in gluconeogenesis is true of G6PC3, can supply blood glucose is not, because it lacks the tissue-restricted expression that turns the reaction into systemic export. The GO process term is coarser than the question the gate models. The G6PC3 clause also gained its actual physiological role, which main had already supplied for the G6PC2 clause but not this one.

    No change to module logic or to any result: still 4 routes with gate PC/G6PC1/SLC37A4 and the same three satisfiable tissues. No change to genes/human/G6PC3.
