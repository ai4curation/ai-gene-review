  summary: Correct the G6PC2 description in the gluconeogenesis paralog-trap note
  details: |
    The paralog-trap note called G6PC2 a 'largely catalytically inactive autoantigen'. G6PC2 hydrolyses glucose 6-phosphate (PMID:14722102), human PAP2-motif mutagenesis confirms its catalytic residues (PMID:38095063), and its low-turnover activity sets the glucose thresholds for insulin and glucagon secretion (PMID:23274894, PMID:39742505), as recorded in the human G6PC2 and mouse G6pc2 reviews. Only the parenthetical changed; the conclusion that G6PC2 expression must not be read as gluconeogenic capacity stands. Module schema and module_validator checks pass; tests/test_module_logic.py passes.
