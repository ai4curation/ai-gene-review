  summary: Promote pyoverdine precursor-supply module to COMPLETE
  details: |
    Completed the two-reaction Pseudomonas pyoverdine precursor-supply module and set status COMPLETE.
    Scope decision: the module stays at the Pseudomonas level because pyoverdine is restricted to the
    fluorescent pseudomonads and the homologs of these two enzymes elsewhere (EctB in ectoine
    biosynthesis, IucD in aerobactin biosynthesis) serve other products; within Pseudomonas, P.
    aeruginosa PAO1 was added as the experimentally best-characterized exemplar for both roles
    alongside the existing P. putida KT2440 proteins, and the rationale is recorded in notes. Scope
    remains CONCRETE (taxon-scoped realization grounding to representative proteins).
    Grounding: adopted PANTHER:PTHR43552 for the diaminobutyrate step from the maintainer
    module-grounding branch (PR 5076), verified against interpro/panther/panther.obo and the PANTHER
    member index, and backed it with a new family review that scopes GO:0045303 FAMILY_WIDE. The
    ornithine step deliberately asserts no PANTHER id: Q51548 is in PTHR42802:SF1, but that single
    subfamily also holds lysine N6- and putrescine N-hydroxylases and the purified enzymes are
    mutually substrate-specific, so family membership cannot establish ornithine specificity; the role
    is grounded on representative members instead and the reasoning is in both notes and the family
    review.
    Also added three literature evidence entries plus the two family reviews as evidence, reframed the
    PP_2800 knowledge gap as a biological question (it previously had gap_kind CURATION only, which the
    guidelines disallow) and completed knowledge-gap status and provenance.
    Validation: linkml-validate -C ModuleReview clean; module_validator reports 0 warnings (one
    informational note for the deliberate missing PANTHER id); rendered page shows 100% recommended-field
    compliance, every leaf grounded, gene-review completeness 4/4 complete.
