  summary: 'Create C. elegans module: Mutator foci 22G-RNA amplification'
  details: |
    Concrete C. elegans BIOLOGICAL_PROCESS module for germline secondary 22G-RNA amplification, the machinery between primary-Argonaute target recognition and effector loading. Targeting and heritability are left to the sibling module c_elegans_pirna_transgenerational_silencing, which cross-references this one. Five root parts: MUT-16 condensate scaffold (O62011); RDE-2/MUT-8 adaptor (Q19672) plus MUT-7 3'-5' exoribonuclease (P34607); RDE-3/MUT-2 pUG tailing (O44768); RRF-1 RdRP (G5ECM1); and an effector-loading node with a ONE_OR_MORE variant set contrasting the Mutator-dependent WAGO-1 silencing branch (Q21770) with the Mutator-independent EGO-1 (G5EBQ3)/CSR-1 (H2KZD5) licensing branch. MFs follow mut-16, rde-2, wago-1 and csr-1 review core functions; RRF-1, RDE-3, MUT-7 and EGO-1 are unreviewed and use literature-grounded MFs. Quotes come from cached PMIDs (PMID:10535732 newly fetched) and were all checked verbatim. One BIOLOGY knowledge gap covers the unknown MUT-7 substrate. linkml-validate and module_validator pass with no errors (1 warning: NCBITaxon label not consulted).
