  summary: Feed one arm per glycerol_metabolism_fba scenario now that PRECEDES carries
    no flux
  details: |
    The constraint-based compiler now treats only PROVIDES_INPUT_FOR, HAS_INPUT and HAS_OUTPUT as metabolite handoff, so the PRECEDES link from g3p_phosphatase_step to glycerol_utilisation (chaining_status NOT_APPLICABLE, a conceptual link) no longer couples the synthesis and utilisation arms. The arms share one uptake budget, so each scenario now says which arm it feeds: the three catabolism scenarios switch off g3p_nad_dehydrogenase_step; osmotic_glycerol_synthesis switches off the utilisation entry steps instead of removing the PRECEDES connection; fission_yeast_gld1_null keeps the synthesis arm fed and now expects Gpd and the phosphatase step to stay active, so it no longer implies that gld1 deletion abolishes glycerol synthesis. Raised in the PR #6282 re-review.
