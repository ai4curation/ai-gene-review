  details: |
    Added the derived constraint-based executable model glycerol_metabolism_fba (model_type CONSTRAINT_BASED, derivation DERIVED_FROM_MODULE) with five scenarios: budding_yeast_g3p_dominant, gut2_knockout_rerouting, fission_yeast_dha_route, fission_yeast_gld1_null and osmotic_glycerol_synthesis. Model first drafted in an antigravity session with cjm. After the PR review replaced the greedy flux heuristic with exact pFBA, budding_yeast_g3p_dominant now expects the minor GCY1-DAK route (glycerol_dehydrogenase_step, dihydroxyacetone_kinase_step) to carry zero flux, since pFBA sends the whole budget through GUT1-GUT2 while it has spare capacity; the description says so. This record replaces hand-written records that named scenarios absent from the module.
