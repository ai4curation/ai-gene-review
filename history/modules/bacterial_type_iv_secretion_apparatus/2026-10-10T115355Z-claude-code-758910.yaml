  summary: Move two gaps to notes; two edges were not regulation
  details: |
    PR review found knowledge_gaps entries whose only gap_kind was ONTOLOGY and/or CURATION, which CLAUDE.md prohibits. ModuleReview has no proposed_new_terms slot, so these move to the module notes, which CLAUDE.md names as a valid destination. Both the gap statement and the boundary prose are preserved, the latter as what is asserted instead. The ontology gap records that the core-complex subunits carry only the generic structural molecule activity and the pilin maturation chaperone none at all. The curation gap records the Tra symbol instability that makes conserved-role assignment hazardous. The coupling-protein molecular function is now a formal term request in the traD review, which the notes point at. Separately, two connections carried POSITIVELY_REGULATES while describing energetic coupling rather than regulation, as the reviewer noted for the second time. The VirB4-family motor supplying energy to the coupling protein, and the VirB11-family ATPase contributing further hydrolysis alongside it, are both now PROVIDES_INPUT_FOR, each with the reason stated in its description. The mating-pair-stabilization edge keeps POSITIVELY_REGULATES, which was not flagged and does read as regulation.
