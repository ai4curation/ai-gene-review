  summary: Link the three F-plasmid gene reviews and ground families in PANTHER
  details: |
    Adds evidence links from the coupling-protein, VirB4-family and VirB10-family annotons to the new traD, traC and traB reviews, so the reasons behind this module's grounding choices are now traceable to adjudicated gene-level evidence. The traC link records why the ATPase function sits on VirB4 rather than on the F protein; the traB link records that the focused review removed the ATP hydrolysis annotation as attributed from the pKM101 protein of the same symbol. PANTHER grounding added to three descriptors, with the VirB4-family descriptor using family_terms because PANTHER places F TraC (PTHR38467) and VirB4 (PTHR30121) in different families, independently corroborating the naming hazard this module already recorded.
