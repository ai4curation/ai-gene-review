  summary: Create bacterial type IV secretion apparatus module
  details: |
    New species-neutral module covering the F-plasmid conjugative machinery and the VirB/VirD4 effector translocators as one cargo-agnostic apparatus. Six parts: the coupling protein that selects the substrate, the VirB4-family motor, an optional VirB11-family second ATPase, the three-protein envelope core complex, the pilus with its maturation chaperone, and optional mating-pair stabilization. Named after the sibling type VI apparatus module and, like it, excludes cargo, so the relaxosome, DNA nicking and recipient-cell events stay outside the boundary. Records a naming hazard that affects grounding: Tra symbols are not stable between transfer systems, with F TraC the VirB4-family ATPase and F TraB a VirB10-family core subunit, while pKM101 TraB is itself the VirB4 homologue. Roles are therefore assigned by VirB/VirD4 family with F proteins named as counterparts. The ATPase annotons are grounded on VirB4 and VirB11, which carry ATP hydrolysis annotations, not on F TraC, whose GOA record holds only a location. No ATPase activity is asserted for the core-complex subunit; that decision is flagged on the annoton and in a curation knowledge gap rather than presented as an adjudication of the existing annotation, which is left for gene-level review.
