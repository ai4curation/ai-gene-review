  summary: Create species-independent module for Ca2+/calmodulin-CaMKII potentiation
    of interferon-induced STAT1 signalling and its inhibition by Shigella OspC effectors
  details: |
    Unifies four GO-CAM models (62b4ffe300004525, 62b4ffe300004489, 62b4ffe300005467, 62b4ffe300005437) that split one mechanism along a 2x2 of interferon ligand and OspC effector. Seven root parts at Mammalia scope: interferon trigger (ROUTE variant set over type I / type II, by module_ref to type_i_interferon_signaling and type_ii_interferon_signaling), calmodulin Ca2+ sensing (one annoton, GO:0061891, replacing the same-gene GO:0005509 -> GO:0043539 CALM1 chain present in all four models and carrying all eight of their CALM1 activities), CaMKII kinase step (REALIZER variant set over CAMK2G/CAMK2D/CAMK2A/CAMK2B, GO:0004683, process GO:0042501), STAT1 tyrosine phosphorylation and STAT-dependent transcription by module_ref to jak_stat_signaling#stat_recruitment_phosphorylation and #stat_transcription, an optional PTK2B relay kept out of the core because its only evidence is one pharmacological inhibitor, and an optional Shigella OspC part (REALIZER over OspC1 and OspC3, retyped GO:0140311 protein sequestering activity, with OspC2 named in notes as the non-inhibiting family member). Corrects the GO-CAM defects recorded in the GoCamReviews: the CALM1 same-gene chain, the bare-binding typings, the missing occurs_in on cytosolic host activities, the CAMK2A paralog choice in the IFN-gamma model, the absent IFN -> receptor -> JAK -> STAT1 component, and the STAT1 -> EP300 edge whose evidence cites a paper that assays no coactivator. Four BIOLOGY knowledge gaps with verbatim provenance. 68 evidence quotes checked verbatim against the cached publications.
