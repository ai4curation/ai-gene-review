  summary: Create eukaryote-wide core autophagy machinery rule module
  details: |
    New ModuleReview grounding the Atg1/ULK kinase with Atg13, the class III PI3-kinase complex I (Vps34, Vps15, Atg6/Beclin; Atg14 optional), Atg9, Atg2 and Atg18/WIPI, and the Atg12 and Atg8 conjugation systems (Atg7 with one annoton per arm, Atg12, Atg5, Atg3, Atg4, Atg8; Atg16 optional) on PANTHER families or subfamilies with human representatives and PAINT nodes shown to be ancestors of each human protein. Molecular functions come from the human gene reviews (Atg4 from the ATG4C review); Vps15, which only contributes to the complex's kinase activity, is untyped. Locations follow each human review's core-function locations (phagophore assembly site, phagophore, cytosol, autophagosome membrane), not the obsolete GO:0034045. Selector over-matches and lineage gaps are stated on the families. Part of the organelle lifecycle project (projects/ORGANELLE_LIFECYCLES.md).
