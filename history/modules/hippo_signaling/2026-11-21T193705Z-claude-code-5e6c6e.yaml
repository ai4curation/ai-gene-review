  summary: Add SAV1 and MOB1 activators and output functions
  details: |
    Signaling-module review pass. Added the two kinase-cassette cofactors that were missing, SAV1 (UniProtKB:Q9H4B6) and MOB1A (UniProtKB:Q9H8S9), each with GO:0043539, which both carry by IDA in GOA. Added transcription coactivator activity to YAP1 and GO:0001228 to TEAD1 (both core in their gene reviews), and hippo signaling as the process on the MST and LATS annotons so the pathway-level PAINT nodes they cite support a stated claim. NF2 is left without a function. Schema and module validator pass; remaining warnings are family-review coverage and PANTHER member-index notices.
