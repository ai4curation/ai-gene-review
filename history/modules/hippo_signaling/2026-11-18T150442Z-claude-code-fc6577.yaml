  summary: Add C. elegans WTS-1, YAP-1 and EGL-44 as LATS, YAP/TAZ and TEAD representatives
  details: |
    Linked the newly reviewed worm genes yap-1 (Q19404) and egl-44 (Q19849), and the earlier wts-1 review (O45797), to the module. The YAP/TAZ and TEAD annotons were single human gene products (YAP1, TEAD1); they are now FAMILY selectors like the MST and LATS tiers: PTHR17616 (YES-ASSOCIATED PROTEIN YAP1 FAMILY MEMBER) with YAP1 and worm YAP-1, anchored on PAINT node PTN000427153, and PTHR11834 (TRANSCRIPTIONAL ENHANCER FACTOR  TEF  RELATED) with TEAD1 and worm EGL-44, anchored on PTN000216669 (DNA-binding TF activity) and PTN000931330 (hippo signaling). Family membership was checked against each protein's UniProt PANTHER cross-reference, and each PTN is the WITH/FROM node on both the human and the worm IBA rows. Added annoton functions GO:0003713 transcription coactivator activity (YAP/TAZ) and GO:0000981 DNA-binding transcription factor activity, RNA polymerase II-specific (TEAD); both are core functions in the human and worm reviews. Worm WTS-1 is added as a second LATS representative (it inherits from PTN000683254 and PTN002390470). New evidence: PMID:31358532, which delineates NFM-1-WTS-1-YAP-1-EGL-44 in the worm intestine. Fetched the PTHR17616 PAINT table (interpro/panther/PTHR17616/PTHR17616-paint.tsv) so the PTN resolves. Module validator: no errors; three warnings that a Hippo-process PTN attests no F/C claim (two pre-existing on the MST and LATS tiers, one on the new TEAD Hippo node, whose F claim is supported by PTN000216669), plus member-index-not-built notices.
