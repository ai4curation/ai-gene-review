  summary: Describe the output program as lineage-specific (growth in flies/mammals;
    polarity and immunity in C. elegans)
  details: |
    The description said active LATS suppresses TEAD-dependent growth programs, which the newly linked worm members do not follow. The description, the yap_tead_output node and the TEAD role now say that the LATS-YAP/TAZ-TEAD core is conserved but its target program is not: growth and proliferation in flies and mammals, intestinal apicobasal polarity and barrier-breach immune genes in C. elegans. Two evidence items were added with verbatim quotes: PMID:41746831 (worm YAP-1/EGL-44 outputs repurposed from growth control to nonproliferative functions) and PMID:32857822 (barrier-loss activation of YAP-1 is independent of the Hippo kinases). The TEAD role now points to the touch-receptor-neuron module for EGL-44's YAP-independent repressor role with EGL-46. Validator and quote check pass; warning count unchanged.
