- type: EDIT
  outcome: changed
  summary: Correct module grounding with live database access
  details: |
    Network access became available, and re-checking the module against the live services corrected two errors and closed three gaps. KIF7 and Costal-2 were grounded on PTHR47969 from the cached per-family entry tables; PANTHER's current release classifies both in PTHR24115, so the scaffold annotons now cite PTHR24115:SF445 and PTHR24115:SF949, which also names the two proteins explicitly rather than by their family's best-known member. GO:0140303 carried the label intramembrane lipid transporter activity, which is now a synonym; the primary label is intramembrane lipid carrier activity. Newly resolved accessions were added as representative members: Drosophila ptc (P18502), disp (Q9VNJ5), fu (P23647) and human DISP1 (Q96F81). Two descriptors that had no family id can now assert one: Dispatched is PTHR45951, whose SF3 and SF4 hold the fly and human proteins, and the Fused-family kinases carry family_terms for PTHR22983 and PTHR24348, since Drosophila fu and human STK36 share subfamily PTHR22983:SF6 while ULK3 sits elsewhere. The grounding knowledge gap now names only Su(fu), Slimb and Brother of Ihog, which have no reviewed UniProt entry. Module validator warnings fell from twelve to four.
