  summary: Document why hh_autoprocessing keeps GO:0004175 against the gene reviews
  details: |
    A review bot on PR #4404 flagged that this module types hh_autoprocessing
    GO:0004175 endopeptidase activity while the curated reviews of Drosophila
    hh and human SHH both MODIFY that term to GO:0140853, and asked for the
    contradiction to be reconciled in this PR rather than merged. It offered
    two routes: collapse hh_autoprocessing and hh_cholesterol_transfer into
    one GO:0140853 annoton, or state in the module why GO:0004175 is kept.

    The second route is taken, and the reason the first was rejected is the
    part worth recording. On mechanism the bot and the gene reviews are right:
    the Hint/Hog reaction is a transesterification in which the thioester is
    resolved by cholesterol's 3-beta-hydroxyl rather than by water, so
    GO:0004175, defined as hydrolysis of internal peptide bonds, does not
    describe it, and the two annotons are one reaction cycle. Collapsing them
    would be the tidier model. But the typing is not this project's invention.
    GO-CAM gomodel:696022cd00000016 types its autocleavage activity GO:0004175
    in the endoplasmic reticulum membrane, ORCID-attributed and dated January
    2026, and the two annotons here mirror two activities of that model, each
    carrying its own gocam_association. Retyping them would silently overrule
    a GO curator on a mechanistic question they may have decided knowingly,
    using the cleavage framing for the half-reaction that does break the bond.

    The annoton's role_description now carries that argument in full, so a
    reader meets the disagreement where the term is asserted rather than
    having to find it in the gene reviews. The family-level record is in
    PTHR11889, which scopes GO:0140853 FAMILY_WIDE and leaves GO:0004175
    UNRESOLVED with both sides stated. Both say the same thing to a
    propagator: prefer GO:0140853, and read a GO:0004175 row on a Hedgehog
    ligand as the same event described the other way rather than as a second
    activity.
