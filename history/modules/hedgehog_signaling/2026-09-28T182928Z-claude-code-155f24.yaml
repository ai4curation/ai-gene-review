- type: EDIT
  outcome: changed
  summary: Fold Drosophila gene findings back into the module
  details: |
    Two corrections driven by curating the fly genes. The Drosophila variant said the lineage runs the step without a cilium; that is true of its developmental epithelia but not of the lineage, since olfactory sensory neurons are ciliated and localize Smoothened to the cilium, which is also what grounds the ciliary assertion at the Smoothened ancestral node in protostomes. The Patched knowledge gap now records that GO:0140303 is a vertebrate-grounded claim which does not carry over: the fly record has no transport annotation, its lipid relationships are binding rather than flux, and two of them read as sequestering a Smoothened activator rather than exporting an inhibitor. UniProt's cholesterol transporter line for fly Patched is by similarity from the human protein.
