- type: EDIT
  outcome: changed
  summary: Record findings from the final four gene reviews
  details: |
    Two findings from curating KIF7, STK36, GPR161 and HHAT. First, an ONTOLOGY knowledge gap: GO:0019706, which this module and the curated GO-CAM give the Hedgehog acyltransferase, is defined as transfer of palmitate to a sulfur atom producing an S-palmitoyl thioester, while the enzyme forms an amide bond to the alpha-amino group of the ligand's N-terminal cysteine. The process side is covered by GO:0018009; no matching activity term exists, and the only chemically safe existing choice is the linkage-agnostic parent GO:0016409. The module keeps GO:0019706 because it is what GOA and the GO-CAM use, so the inaccuracy is inherited rather than introduced, and the gap records the proposed new term. Second, the variant-set note now records that KIF7 and Costal-2 have both lost the motor function their kinesin family is named for: purified KIF7 binds microtubules but is immotile, as is Costal-2, which is why the module types both as adaptors rather than motors.
