  summary: Move curation and ontology gaps out of knowledge_gaps per updated guidance
  details: |
    CLAUDE.md gained a rule since this module was written: a curation gap is
    not a knowledge gap. knowledge_gaps is reserved for things nobody knows,
    which only new wet-lab work could resolve, and an entry whose only
    gap_kind is CURATION and/or ONTOLOGY is not allowed. Three of this
    module's five entries failed that test. The two BIOLOGY entries, on the
    Patched-to-Smoothened mechanism and on which Smoothened-to-PKA route
    dominates in vivo, are untouched; both would need experiments.

    The ONTOLOGY entry moves into notes. It records that GO:0019706, which
    this module and the curated GO-CAM give the Hedgehog acyltransferase, is
    defined as transfer of palmitate to a cysteine sulfur while the enzyme
    forms an amide bond to the alpha-amino group of the ligand's N-terminal
    cysteine. A curator closes that, not an experiment: the needed term is
    protein-cysteine N-palmitoyltransferase activity under GO:0016409, and
    the HHAT gene review already carries the proposal as a proposed_new_terms
    entry. ModuleReview has no proposed_new_terms slot, so notes is the
    destination the rule leaves.

    The first CURATION entry also moves to notes, and is substantially out of
    date. It said almost no participant had a gene review, which was true
    when written; PTCH1, SUFU, GLI3, GLI2, KIF7, GPR161, HHAT, STK36 and the
    four Drosophila genes have since been curated, so the protostome half of
    the pathway now has gene-level adjudication rather than family and PAINT
    evidence alone. The note now says that instead of describing a queue that
    has been worked.

    The second CURATION entry moves to notes unchanged in substance: three
    Drosophila participants are still named in prose without an accession,
    because each has only unreviewed UniProt entries under more than one
    accession. It says of itself that it is a data-representation question
    rather than a biological one, which is precisely why it does not belong
    in knowledge_gaps.

    Separately, the PTHR45718 review's reference to the PANTHER member index
    is replaced. CLAUDE.md now states the index is a git-ignored build
    artifact that must not be cited as a file: source, and says to cite
    PANTHER's classification files or UniProt instead. An earlier fix in this
    session had repointed that reference at the committed overrides file,
    which is still the wrong kind of citation and is also misleading, since
    no override row concerns this family. It now cites
    interpro/panther/panther.obo, which is what recent upstream family
    reviews cite and is the actual source of the family and subfamily names
    used. The surrounding prose is corrected to name the build recipe
    accurately.
