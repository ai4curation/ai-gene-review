  details: |
    Replaced the vertebrate-only Hedgehog/Smoothened sketch with a pan-metazoan module: six ordered parts (ligand autoprocessing and dual lipidation, reception by Patched and Ihog/CDON/BOC co-receptors, sterol-dependent Smoothened activation, PKA/CK1/GSK3-primed Ci/GLI repressor processing, SUFU release plus Fused-family phosphorylation, Ci/GLI activator output), with taxon variants for the vertebrate ciliary implementation (GPR161, ADCY3, KIF7, IFT) and the Drosophila cytoplasmic Costal-2 complex, plus an optional extracellular ligand-distribution variant set. Grounded on four PAINT ancestral nodes (PTN001726121, PTN000885245, PTN000859153, PTN001836086), PANTHER families read verbatim from the local OBO, UniProt exemplars taken from committed PANTHER entry tables and gocams/index.tsv, and 20 GO-CAM activity associations. Validated with linkml-validate -C ModuleReview (no issues) and the module validator (no errors); rendered to pages/modules/.
