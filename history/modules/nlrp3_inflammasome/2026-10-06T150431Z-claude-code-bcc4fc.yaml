  summary: 'Create module: NLRP3 inflammasome activation and pyroptotic execution'
  details: |
    De-novo ModuleReview for the canonical NLRP3 inflammasome and pyroptosis (modules/nlrp3_inflammasome.yaml), curated from the six per-gene reviews under genes/human/ (NLRP3, PYCARD, CASP1, NEK7, GSDMD, NINJ1), cached publications under publications/, local PAINT rows in interpro/panther/PTHR47901, and two cached production GO-CAMs (gomodel:635b1e3e00001811, gomodel:663d668500001246).

    Boundary: seven ordered parts - NLRP3 sensor activation (PI4P/dTGN, NACHT ATP switch, MTOC condensate, PYD filament); NEK7 licensing (optional, POSITIVELY_REGULATES); ASC/PYCARD filament and speck; caspase-1 CARD filament and autoprocessing; caspase-1 cleavage of GSDMD and of the IL-1 beta / IL-18 precursors; GSDMD-NT wide pore; NINJ1 plasma membrane rupture. Signal 1 (priming) is context connected by reference to modules/nfkb_canonical_signaling.yaml, modules/tlr4_md2_lps_signaling.yaml and modules/tnf_signaling.yaml rather than modelled as a part. Non-canonical CASP4/CASP5, sibling sensors (NLRC4, NLRP1, AIM2, CARD8, NLRP6) and granzyme/GSDME routes are out of scope; modules/nlr_signaling.yaml remains the coarser sensor-layer sketch and is not superseded.

    Decisions respected from the gene reviews: NEK7 is modelled as compensable licensing rather than an obligate core part, because IKKbeta-driven PI4P recruitment makes it redundant in human myeloid cells (PMID:36384135) and raised NLRP3 abundance makes activation independent of both NEK7 and priming (PMID:42378282); its activity is GO:0140677, not a kinase activity, and the PTHR44329 PAINT row propagating GO:0004674 is deliberately not cited for it. IL1B and IL18 appear only as caspase-1 substrates (participation rule); cytokine release is asserted on the GSDMD pore annoton, not on the cytokines. NINJ1 carries GO:0140912 membrane destabilizing activity, the same term the necroptosis module uses for MLKL, with matching phrasing; GSDMD keeps GO:0022829 wide pore channel activity.

    Three knowledge gaps (all BIOLOGY): the absent proximal NLRP3 sensing event; which of the NEK7 and IKKbeta routes operates in a given human cell; whether NINJ1 excises membrane disks or opens very large pores.

    No module deep research exists: no provider run was available (Falcon endpoint unavailable), so no -deep-research-<provider>.md file was created.

    Validation: linkml-validate -C ModuleReview clean; module_validator passed with one warning (NCBITaxon ontology unavailable, Mammalia label unvalidated); derived QC 100% recommended-field compliance, 13/13 gene-function checks supported with 0 conflicts, no leaf-grounding gaps; rendered to pages/modules/nlrp3_inflammasome.html; no ontology cache files touched.
