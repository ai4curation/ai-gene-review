  summary: Create levamisole-sensitive nAChR module
  details: |
    Created the first draft of the nematode L-AChR anthelmintic-target module.
    The module centers on the C. elegans receptor reconstituted by Boulin et al.
    and represents the UNC-29, LEV-1, UNC-38, UNC-63 and LEV-8 pore subunits as
    active units of an acetylcholine-gated channel complex, with RIC-3, UNC-50
    and UNC-74 as ancillary expression factors. Exact C. elegans UniProt
    accessions were resolved from UniProt, UNC-29 was cross-checked against the
    existing complete worm review, and BRUMA, HAECO, ONCVO and ASCSU L-AChR
    candidates were left as notes until the broad PTHR18945 Cys-loop family can
    be split into reviewed ortholog sets.
