  summary: New two-step apoA-I ligand / ABCA1 receptor signaling module (GO:0038027)
  details: |
    New pan-mammalian two-step signaling module for GO:0038027 apolipoprotein
    A-I-mediated signaling pathway. Step 1, ligand: apoA-I (PANTHER:PTHR18976:SF11,
    UniProtKB:P02647), GO:0048018 receptor ligand activity. Step 2, receptor: ABCA1
    (PANTHER:PTHR19229:SF34, UniProtKB:O95477), GO:0034188 apolipoprotein A-I receptor
    activity. Evidence: PMID:14668333, PMID:16443932, PMID:19783654, PMID:26989082,
    PMID:21339300. Downstream effectors (JAK2, STAT3, Cdc42) and the parallel
    lipid-efflux output are outside the boundary. No PAINT node cited for ABCA1 (the
    PTHR19229 GO:0034188 node PTN002710138 is seeded by ABCA7). Taxon scope Mammalia.
