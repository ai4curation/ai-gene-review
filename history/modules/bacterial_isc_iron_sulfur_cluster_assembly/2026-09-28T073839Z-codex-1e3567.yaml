  summary: 'Create module: bacterial Isc iron-sulfur cluster assembly'
  details: |
    New six-part module covering bacterial Isc Fe-S cluster assembly in P. putida KT2440: IscS cysteine desulfurase, IscU scaffold, Fdx reduction, HscB co-chaperone, HscA chaperone, and IscA carrier. Grounded on PTHR23426 and per-gene UniProt exemplars. Shepherd follow-up in this session removed the leftover ATP/water -> ADP/phosphate substrates and products block from the HscA annoton: the function had been corrected to GO:0140662 ATP-dependent protein folding chaperone, but the chemistry left behind described GO:0016887 ATP hydrolysis, which asserted the wrong reactants for the step. Per review pass 5, dropping the optional block is preferable to leaving an incorrect one while the true client substrate is unsettled.
