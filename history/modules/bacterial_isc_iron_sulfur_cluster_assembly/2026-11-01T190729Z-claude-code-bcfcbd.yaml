  details: |
    Review follow-up on PR 5367. Verified against interpro/panther/panther.obo and the PANTHER 19.0 member index: PTHR19375:SF176 is CHAPERONE PROTEIN HSCA and PANTHER classifies E. coli HscA (P0A6Z1) there, so the HscA role is now grounded to SF176 instead of asserting no id (the PTHR19375 review assesses GO:0140662 family-wide). PTHR10093 has nine subfamilies including SF26 named for IscU, but the IscU exemplars are family-level in UniProt and PANTHER classifies E. coli IscU in SF8, so the IscU role stays at family level and the notes say why. Merged origin/main (one conflict in genes/PSEPK/fdx/fdx-ai-review.yaml resolved by keeping the NCBIfam quote with record_section DR:NCBIfam). module_validator 0 warnings, 100% recommended-field compliance, 0 coverage gaps.
