  summary: 'Review round 1: intestinal_sterol_absorption_and_efflux'
  details: |
    Review round 1 for PR 4812: corrected the NPC1L1 function description, which said GO has no current term for sterol uptake activity and cited only the obsoletion of sterol transporter activity. GO:0015248 is indeed obsolete, but GO:0120015 sterol transfer activity and GO:0120020 cholesterol transfer activity are current terms; the reason they do not fit is their mechanism, not their status. They describe soluble carriers that ferry a sterol through the aqueous phase between membranes, whereas NPC1L1 stays in the apical membrane and moves the sterol through an intramolecular channel. Pointed at the proposed term now recorded in the NPC1L1 review.
