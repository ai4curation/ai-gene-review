  details: |
    Round 3 fixed the top-level evidence statement but left the same false attribution in the inline evidence statement on the same part, where the parenthetical (GO:0015607) sat inside a sentence sourced to file:human/ABCD3/ABCD3-ai-review.yaml. The file then contradicted itself: the top-level statement said the term is the module's own choice while the inline one presented it as the review's. The parenthetical is dropped; the term still appears as the annoton's own term id, which asserts nothing about provenance. Separately, the top-level statement called the ABCD1 review completed; genes/human/ABCD1/ABCD1-ai-review.yaml carries status DRAFT, so the statement overstated exactly what this change was about. It now says DRAFT and marks the ABCD1 usage as a precedent rather than a reviewed endorsement, noting that ABCD1 is cited nowhere else in the module and so cannot be checked from its own sources. The statement also now argues against the right candidate: the ABCD3 review proposes GO:0015125 bile acid transmembrane transporter activity as NEW/IMP on PMID:25168382 for this exact step, which the previous wording did not mention. GO:0015607 is preferred on two grounds read from the GO definitions - the substrate is a CoA thioester (DHCA-CoA, THCA-CoA) where GO:0015125 is defined over bile acids as the glycine or taurine amides, which BAAT forms two steps later; and GO:0015607's definition states the ATP-hydrolysing reaction an ABC transporter performs, where GO:0015125 is mechanism-neutral.
