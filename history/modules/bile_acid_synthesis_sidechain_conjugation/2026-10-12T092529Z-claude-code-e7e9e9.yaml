  details: |
    The round-2 fix for item 10 replaced a wrong status claim with a wrong content claim: the evidence statement asserted that GO:0015607 is the term the ABCD3 review proposes as a MODIFY replacement. GO:0015607 appears nowhere in genes/human/ABCD3/ABCD3-ai-review.yaml and is not in ABCD3-goa.tsv; that review's bile-acid core function pairs GO:0042626 with GO:0015721 and GO:0006699, and its MODIFY replacement on the bile-acid row is GO:0006699. The statement is now split: the step and its IN_PROGRESS status are attributed to the ABCD3 review with the terms that review actually carries, and GO:0015607 is attributed to the module itself, taken from the completed ABCD1 review for the paralogous ABC-type acyl-CoA transporter activity. The module validator independently reports the same thing as FUNCTION_UNREVIEWED on the abcd3_transport_activity annoton. The other six statuses in the round-2 sweep were re-verified and are unchanged.
