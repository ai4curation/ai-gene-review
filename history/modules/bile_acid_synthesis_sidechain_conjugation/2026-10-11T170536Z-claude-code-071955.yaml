  details: |
    Review round 2 for PR 4812, two non-blocking items. Six evidence statements said the module's terms matched 'the completed human X review', which was true of only two of them. Corrected per gene rather than by a blanket rewrite, because ACOX2 and SCP2 genuinely are COMPLETE: ABCD3 is IN_PROGRESS and its GO:0015607 is the term that review proposes as a MODIFY replacement, so that part follows a reviewed but unfinalized judgment, while CYP27A1, AMACR, SLC27A5 and BAAT are INITIALIZED, so for those the terms come from GOA rows rather than from a reviewed core function. The notes now state the status of every cited review in one place. Also addressed the related item that the SCPx step is now modellable: SCP2 became COMPLETE in this change and its reviewed thiolase activity would support a part, but HSD17B4 is still INITIALIZED, so adding SCP2 alone would leave the round of beta-oxidation half-represented; the notes record that both should be added together once HSD17B4 is reviewed.
