  summary: Assess TRIM25 and mycobacterial EspF against the NLR signaling module
  details: |
    Resolved the litscan:module-member handoff #3919 (PMID:42711665, EspF-TRIM25-NLRP3 axis in mycobacterial infection). Fetched the full text with just fetch-pmid (PMC13556937, XML route) and read Methods, Results and Discussion rather than the abstract alone.

    Determination: neither candidate is added to modules/nlr_signaling.yaml. EspF (UniProtKB:P9WJD1, Rv3865) is a secreted mycobacterial effector and falls outside the module's declared NCBITaxon:33208 Metazoa scope. TRIM25 (UniProtKB:Q14258) is not added for three further reasons: the module already states in its own nlr_adaptor_assembly node that the E3 ligases acting on its components (XIAP, LUBAC on RIPK2) are not modelled as parts, on stronger host-intrinsic evidence; every TRIM25 loss-of-function experiment in the paper runs in an EspF-expressing background (dox-inducible EspF THP-1 cells for the siRNA arm, EspF co-transfection for both ubiquitination assays), so the claim established is effector-driven amplification rather than regulation of the uninfected pathway; and the comparator check shows TRIM31, TRIM50 and TRIM62 absent from this module and from canonical_nlrp3_inflammasome.yaml, with TRIM25 absent even from rig_i_signaling.yaml where its best-established function lies and where GO has curated it into at least five production GO-CAMs.

    Encoded following the ATHENA/ATPPM precedent in mitochondrial_complex_v.yaml: a CANDIDATE ASSESSED, NOT MODELLED paragraph in module.notes, four queryable EvidenceItem entries with verbatim quotes plus two UniProt grounding entries, and the reference carrying a reference_review (relevance LOW, correctness VERIFIED). No exclusion guard added: both NLRP3-branch annotons are GENE_PRODUCT selectors, so no selector can sweep TRIM25 in. Noted that a TRIM-family ubiquitin-regulation layer, if built, belongs on canonical_nlrp3_inflammasome.yaml and would need a genes/human/TRIM25 review first.

    Validation: linkml-validate against ModuleReview clean; module_validator passes with one pre-existing PTHR44329 subfamily warning on the untouched RIPK2 annoton.
