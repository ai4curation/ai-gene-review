  summary: Add TAK1-TAB kinase step on NOD1/NOD2-RIPK2 branch; remove misplaced RIPK2
    signal-relay annoton
  details: |
    Added part tak1_tab_kinase_activation (order 3): a GO:0097076 TAK1 complex participant (TAK1 PTHR46716:SF1/O43318; TAB1 Q15750; TAB2/TAB3 Q9NYJ8/Q8N5C8 with GO:0070530) with GO:0004674 targeting IKBKB, plus a TAK1 GO:0004709 MAP3K annoton. Both are linked to the NOD1/NOD2 GO-CAMs 641ce4dc00000050 and 641ce4dc00000214. Removed the RIPK2 inflammatory signal relay annoton from the caspase-1 protease output step; RIPK2 remains the step-2 adaptor, now with evidence that its kinase activity is dispensable for NOD2 signaling (PMID:29452636) and that its polyubiquitination recruits TAK1 (PMID:18079694). Connections now branch at the adaptor step: adaptor -> TAK1 (NOD/RIPK2) and adaptor -> caspase-1 (NLRP3/ASC). Evidence: PMID:11460167, PMID:14633987, PMID:15327770, PMID:15075345, PMID:18079694, PMID:29452636, Reactome:R-HSA-688985.
