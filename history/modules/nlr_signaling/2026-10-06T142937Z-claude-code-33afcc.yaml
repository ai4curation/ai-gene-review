  summary: Make nlr_signaling scope explicitly metazoan and cross-link the new inflammasome
    and plant modules
  details: |
    Minimal scope-clarification edit. The module's grounding was already metazoan throughout (GO:0035872, NCBITaxon:33208 Metazoa, NOD2/NLRP3/RIPK2/ASC/caspase-1 exemplars), but the title 'NLR signaling pathway module' read as pan-taxonomic and invited plant NB-LRR content that does not belong. Retitled to 'Metazoan NLR signaling pathway module', description now states the metazoan scope and why plant NB-LRRs are excluded, and notes record the clarification plus pointers to modules/plant_nlr_resistosome_signaling.yaml and modules/canonical_nlrp3_inflammasome.yaml.

    No parts, annotons, terms, PTNs or evidence were changed, so the three pre-existing validator warnings (offline NCBITaxon lookup and two PTHR44329 subfamily suggestions for RIPK2) are unchanged from baseline.

    One YAML gotcha worth recording: the first attempt put 'Scope is deliberately metazoan: plant NB-LRR receptors...' in a plain multi-line scalar, which is a YAML scanner error because of the colon-space; the description was converted to a block scalar and the colon reworded to a semicolon.
