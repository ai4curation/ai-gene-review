  summary: New module from RGD PW:0001243
  details: |
    Created modules/prostanoid_biosynthesis.yaml from the RGD prostanoid biosynthetic pathway as a Rhea- and ChEBI-grounded reaction chain: PTGS1/PTGS2 make PGH2, which branches to PGE2 (PTGES, PTGES2, PTGES3), PGD2 (HPGDS, PTGDS), PGI2 (PTGIS), TXA2 (TBXAS1) and PGF2alpha (AKR1C3, AKR1B1, PRXL2B, CBR1). AKR1A1 was excluded and recorded as a knowledge gap, since only RGD's record text supports a prostaglandin reaction for it. PRXL2B carries no GO molecular function because its reaction (RHEA:28214) has no GO term; notes question its GO:0047017 IBA/ISS row.
