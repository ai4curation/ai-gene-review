  details: |
    Signaling-module review, second batch. Seven annotons had no function. Added growth factor activity to the BMP4 ligand and BMP receptor activity to BMPR1A and BMPR2 (core in their gene reviews), and GO:0000981 to SMAD4 (core) and nuclear SMAD1 (IDA in GOA). SMAD1 and SMAD5 at the phosphorylation step stay functionless as receptor substrates. Replaced boilerplate role descriptions, shortened UniProt labels to the recommended names, and removed two PAINT nodes on the ligand that attest only cell proliferation and heart morphogenesis. Schema and module validator pass; remaining warnings are family-review coverage, PANTHER member-index notices and PAINT nodes that attest a related but different term.
