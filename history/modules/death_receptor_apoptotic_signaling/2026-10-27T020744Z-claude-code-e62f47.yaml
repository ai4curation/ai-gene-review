  summary: Record the extrinsic/intrinsic boundary that puts the caspase-9 CARD handoff
    out of scope
  details: |
    The litscan:module-member handoff #3921 routed PMID:42819741 (crystal structure and biophysics of the human caspase-9 CARD) to this module. It does not belong here, and the notes now say so explicitly.

    This module is grounded in GO:0008625 extrinsic apoptotic signaling pathway via death domain receptors and models the death-ligand arm only: FASLG -> FAS -> FADD -> CASP8, with TNFRSF1A as receptor context. Caspase-9 is the initiator caspase of the intrinsic (mitochondrial) pathway, activated at the APAF-1/cytochrome c apoptosome rather than at a DISC. Neither CASP9 (UniProtKB:P55211) nor APAF1 (UniProtKB:O14727) is a participant of this module, and the paper assays neither FAS, FADD nor CASP8 - CASP8 appears in it only as a filament-forming comparator in the introduction and discussion.

    One genuine aliasing hazard is worth recording, which is why this is a notes edit rather than a silent re-route: CASP8 and CASP9 share PANTHER:PTHR10454 (CASPASE), the family this module's two caspase annotons select on, and the PAINT node PTN000047947 does not separate them either - it is cited for CASP8 here and for CASP9 in modules/intrinsic_apoptotic_signaling.yaml, carrying the same generic C:GO:0005737 / F:GO:0004197 / P:GO:0006915 propagation. Only the representative member UniProtKB:Q14790 (CASP8) keeps the initiator-caspase role extrinsic, so a family-level selector or literature scan could plausibly sweep caspase-9 work in here again. The note states the routing rule: apoptosome, CYCS, APAF1 and CASP9 findings go to intrinsic_apoptotic_signaling, effector CASP3/6/7 findings to apoptotic_execution_phase.

    Module composition, parts, annotons and connections are unchanged; no reference or evidence entry was added here, because the paper supports nothing about this module's content. The substantive assessment of the candidate is recorded in modules/intrinsic_apoptotic_signaling.yaml in the same change. Schema validation and the module validator pass; the 3 remaining warnings are pre-existing on main (the git-ignored PANTHER member index is absent in this environment, so family membership was not checked for Q14790/P19438).
