  summary: Decline litscan caspase-9 CARD paper as out of scope for the death-receptor
    module
  details: |
    Litscan issue #3921 proposed PMID:42819741 (human caspase-9 CARD assembly modes, shared arginine surface for APAF-1 CARD binding) as a candidate for this module. Declined: caspase-9 and APAF-1 are intrinsic apoptosome components, not death-domain receptor or DISC components, and admitting them would dissolve the extrinsic/intrinsic boundary this module holds. Only a notes entry recording the decision was added; no parts, annotons or evidence changed.

    The paper was re-filed under modules/intrinsic_apoptotic_signaling.yaml, where CASP9 and APAF1 are already annotons. Caspase-8 DED filaments remain a separate open question for this module: the paper supplies no experimental data on caspase-8, and its AlphaFold3 self-association survey covers CARD domains rather than DEDs, so no caspase-8 claim was taken from it.
