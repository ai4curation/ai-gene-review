  summary: Rebuild IL-1 signaling module to subsume GO-CAM 59cc772c00000000
  details: |
    Rebuilt the auto-generated draft into a vertebrate-scope (NCBITaxon:7742) abstract module that covers every activity of GO-CAM 59cc772c00000000. Added molecular functions on every annoton (cytokine, IL-1 receptor, coreceptor, signaling adaptor, Ser/Thr kinase, ubiquitin ligase). Added paralog variant sets IL1A/IL1B (agonists) and IRAK1/IRAK2 (TRAF6-engaging scaffolds; kinase activity typed only on IRAK4). Inserted the missing TRAF6 step. Upstream IL-1beta maturation and GSDMD-pore release and downstream TAK1 activation are included by module_ref to canonical_nlrp3_inflammasome and nfkb_canonical_signaling. Added TOLLIP as an optional negative regulator, correcting the model's positive edge. Dropped the duplicated IRAK4 annoton and two PAINT nodes that attest only process terms. Each annoton links to its GO-CAM activity with notes on differences. 31 quotes checked verbatim.
