  details: |
    Created and validated concrete bacteriophage pathway module phage_tectivirus_internal_membrane_virion_and_entry (Tectivirus internal-membrane icosahedral virion assembly, unique vertex DNA packaging, membrane-tube genome delivery, and host lysis).

    A reusable module representing the intracellular assembly, unique-vertex ATP-driven genome packaging, conjugative-complex receptor recognition, tail-like internal-membrane tube genome delivery, and programmed host cell lysis of internal-membrane double-stranded DNA bacteriophages (family Tectiviridae, exemplified by Enterobacteria phage PRD1, BPPRD). Unlike tailed Caudoviricetes phages, PRD1 belongs to the Bamfordvirae double-jelly-roll lineage. Non-structural assembly factors P10, P17, and P33 coordinate the budding of a host-derived lipoprotein vesicle enriched in viral integral membrane proteins (P11, P16, P18, P20, P22, P32, P34, and membrane-anchored transglycosylase P7) together with the outer pseudo-T=25 icosahedral protein shell built from 240 trimers of major double-barrel capsid protein P3, cemented along the icosahedral edges by dimeric tape-measure protein P30, and capped at 11 five-fold vertices by the penton protein P31, trimeric spike P5, and monomeric receptor-binding protein P2 (stabilized at the membrane by P16). At the twelfth unique vertex, the membrane-spanning heterododecameric ring P20/P22 anchors the external P6/P9 portal-ATPase complex, which translocates the linear TP-P8-linked dsDNA genome into the internal membrane vesicle using ATP hydrolysis. Upon infection of a Gram-negative host carrying an IncP, IncN, or IncW conjugative plasmid, P2 binds the mating-pair formation receptor complex and triggers vertex uncapping, remodeling the internal lipid vesicle via membrane proteins P11, P18, and P32 and muralytic transglycosylase P7 into a tubular membrane conduit that penetrates the host cell envelope to eject the viral genome into the cytoplasm. Progeny virions are released at the end of the lytic cycle by holin P35 and muramidase endolysin P15.
