  details: |
    Created and validated concrete bacteriophage pathway module MODULE:phage_p22_tailspike_lps_hydrolysis_and_ejectosome_entry (Phage P22 tailspike O-antigen endorhamnosidase hydrolysis, gp26 needle ejection, gp7-gp16-gp20 trans-envelope ejectosome assembly, and prophage superinfection exclusion) with 10 annotons and 10 genes.

    A coupled host-adsorption, outer-membrane penetration, trans-envelope DNA-ejectosome assembly, and prophage exclusion module in Salmonella phage P22 (Lederbergvirus). Six homotrimeric gp9 tailspikes attached laterally around the gp4-gp10 tail hub recognize and enzymatically hydrolyze the alpha-1,3-rhamnosyl-galactose O-glycosidic linkage of Salmonella serogroup A, B, and D1 lipopolysaccharide (LPS) O-antigen repeats via their central right-handed parallel beta-helix endorhamnosidase domains, processively ratcheting the virion through the O-antigen layer down to the outer membrane surface. Contact of the 240-Angstrom gp26 coiled-coil tail needle tip with the outer membrane lipid bilayer triggers gp26 release into the host envelope, opening the gp1-gp4-gp10 portal-hub conduit for sequential ejection of all three internal virion E-proteins (gp7, gp16, and gp20) ahead of the viral DNA. In the host cell envelope, gp7 anchors at the outer membrane tail conduit, gp20 assembles into a periplasmic tubular shaft spanning the peptidoglycan layer, and gp16 partitions into the host inner membrane to form a continuous trans-envelope DNA translocation channel (ejectosome). In P22 lysogens, homotypic superinfection through this entry pathway is blocked at two distinct layers: at the cell surface by the prophage gtrABC (con) O-antigen glucosyltransferase/flippase cassette (which adds alpha-1,6-linked glucose to O-antigen repeats to prevent gp9 tailspike progression), and at the inner membrane by the prophage integral membrane protein SieA (which blocks DNA translocation through the gp7-gp16-gp20 ejectosome).
