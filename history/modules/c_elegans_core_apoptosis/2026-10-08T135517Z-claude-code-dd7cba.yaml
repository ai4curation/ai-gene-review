  details: |
    Concrete C. elegans SIGNALING_PATHWAY module for the linear EGL-1 -| CED-9 -| CED-4 -> CED-3 apoptosis pathway. Five root parts: optional CEP-1 (Q20646) germline DNA-damage transcriptional input to egl-1/ced-13 (GO:0001228); EGL-1 (O61667) BH3-only CED-9 inhibitor (free-text proposed MF from the egl-1 review); CED-9 (P41958) CED-4 sequestration (GO:0140311) and BH3 domain binding (GO:0051434) on the mitochondrial outer membrane; CED-4 (P30429) octameric apoptosome caspase activator (GO:0008656); CED-3 (P42573) cysteine-type endopeptidase (GO:0004197) with autoprocessing and execution-phase substrate cleavage (DCR-1, CED-8). MOMP/cytochrome c deliberately excluded and cross-referenced to bcl2_family_momp_control, intrinsic_apoptotic_signaling and apoptotic_execution_phase; corpse engulfment cross-referenced to phagocytic_engulfment. CED-13 described but not modeled (no review). Grounded in cached primary papers (PMID:16208361, 15383288, 9024666, 9604928, 10688797, 20434985, 24065769, 8654923, 20223951, 24225442, 11696333, 12445383, 15605074, 18627611); all 23 quotes verified verbatim. Two BIOLOGY knowledge gaps. linkml-validate clean; module_validator passed with 2 warnings (NCBITaxon label not checked; EGL-1 function has no GO id).
