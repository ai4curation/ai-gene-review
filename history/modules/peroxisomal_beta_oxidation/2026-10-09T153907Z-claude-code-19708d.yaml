  summary: Split bifunctional-protein annotons into hydratase and dehydrogenase activities
  details: |
    The HSD17B4 and EHHADH annotons each carried only the hydratase MF, with the dehydrogenase activity hidden in a substrate string. Each is now modelled as two annotons, one per catalytic domain: HSD17B4 GO:0080023 + GO:0106386 and EHHADH GO:0004300 + GO:0003857, with explicit substrates/products. Notes now record that PANTHER 19.0 (PTHR13078) and UniProt (PTHR45024) disagree on the HSD17B4 family, so no family id is asserted. Schema validation and module_validator pass (0 warnings).
