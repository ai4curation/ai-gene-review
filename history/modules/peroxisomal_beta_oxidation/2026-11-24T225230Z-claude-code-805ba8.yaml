  details: |
    Added a module-level gocam_associations entry for gomodel:YeastPathways_PWY-5177 (SGD glutaryl-CoA degradation), described as not a grounding of this module: yeast has no glutaryl-CoA route, and the model's three enabled steps are the C4 chemistry of the last turn of this spiral, drawn cytosolic and (3S), with PHS1 on the hydration node and ERG10 rather than POT1 on the thiolysis. Pinned the model's two FOX2 activities (gomodel:RXN-11667 hydratase, FOX2 enabler only; gomodel:RXN-11662 dehydrogenase) to the hsd17b4_activity annoton, following the existing YEAST-FAO-PWY pins, with their corrections (GO:0080023 / GO:0106386, (R)-enantiomer, peroxisome). ERG10's thiolase activity is not pinned to the POT1 annoton because the GO-CAM review's POT1 candidacy is only a SUSPECTED query. Schema and module validation unchanged (11 pre-existing warnings before and after).
