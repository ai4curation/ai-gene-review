  summary: Give the split ABCD annotons their own substrates
  details: |
    Review round 2 suggestion for PR 4813. When the single ABCD annoton was split into abcd1_acyl_coa_import (PTHR11384:SF21, P33897) and abcd3_acyl_coa_import (PTHR11384:SF62, P28288) to fix the round-1 blocking item, both halves kept the combined substrates string 'cytosolic fatty-acyl-CoA (VLCFA-CoA for ABCD1; branched-chain/C27 bile-acid/dicarboxylic acyl-CoA for ABCD3)'. That was correct while one annoton stood for both transporters and became inaccurate the moment they were separated: ABCD1's annoton asserted ABCD3's substrates and vice versa. Each now names only its own - very-long-chain fatty-acyl-CoA for ABCD1, branched-chain, C27 bile-acid and dicarboxylic acyl-CoA for ABCD3. A defect introduced by the round-1 fix rather than a pre-existing one, which is why it was taken rather than deferred. Module validation passes; the remaining warning is that the git-ignored PANTHER member index is not built in this environment, so P28288's family membership was not checked.
