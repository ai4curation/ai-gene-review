  summary: 'Resolve merge conflict with main: take the YeastPathways structure, re-apply
    ABCD3'
  details: |
    Conflict resolution against main after PR #4546 (YeastPathways 09/12) rewrote this module.

    Both sides had independently added a step-1 import node and renumbered the parts, so the
    file conflicted in eleven places. The resolution takes main's structure, which is the
    broader one (six parts, yeast representatives on the shared core steps, auxiliary
    unsaturated-FA enzymes, intraperoxisomal NAD+ regeneration, GO-CAM associations and the
    YeastCyc corrections), and re-applies from this branch only what main does not already
    state.

    What main already covers, and which this branch therefore drops rather than re-imposing:

    - The peroxisomal membrane location. Main folded it into the matrix cellular_component
      description instead of adding a second entry.
    - The HSD17B4 PANTHER caveat. Main's notes already record that PANTHER 19.0 places it in
      PTHR13078 while UniProt cross-references PTHR45024, and that the descriptor therefore
      carries no PANTHER id, which is the same conclusion this branch reached.
    - The import-to-oxidation connection, which main has as a PRECEDES edge with a VERIFIED
      chaining note.
    - The split of HSD17B4 and EHHADH into one annoton per catalytic domain. This branch had
      split both; main keeps one annoton per protein and records the consequence explicitly as
      a MAPPING_GAP chaining note on the hydration-to-thiolysis edge, saying that the
      multifunctional-protein annotons are typed only with their hydratase activity while the
      dehydrogenase domain of the same protein makes the thiolase substrate. That is a
      documented decision about this module rather than an oversight, and main's annotons also
      carry yeast FOX2 and two GO-CAM activity mappings keyed to the unsplit annoton ids.
      Re-splitting would re-key another contributor's curation to win a modelling argument that
      main has already stated its position on, so it is left for a separate change if anyone
      wants to make it.

    What is re-applied, because main has none of it - ABCD3 is absent from main's module
    entirely (zero occurrences of ABCD3, P28288 or PMP70):

    - The description gains the substrate division between the two human half-transporters,
      ABCD1 (ALDP) for straight-chain very-long-chain acyl-CoA and ABCD3 (PMP70) for the
      branched-chain, C27 bile-acid and dicarboxylic acyl-CoAs. Those are the substrates the
      module's own ACOX3 and SCPx steps handle, so the importer for them belongs in the module.
    - A module-level evidence row for the completed human ABCD3 review.
    - ABCD3 (UniProtKB:P28288) as a fourth representative member of main's family-level ABC-D
      annoton, beside PXA1, PXA2 and ABCD1, with a description naming its substrates and its
      disease (congenital bile-acid synthesis defect 5) and noting that ABCD4, the lysosomal
      cobalamin transporter, is in the same PANTHER family and is not an importer here.
    - Two evidence rows on that annoton - Reactome:R-HSA-382575, verified verbatim against
      reactome/R-HSA-382575.md, and the completed human ABCD3 review.
    - An addition to main's open-term-choice note. Main records that the yeast PXA1/PXA2
      reviews use GO:0005324 while the human ABCD1 review uses GO:0015607, pending a decision
      on whether the hydrolysis-coupled mechanism holds family-wide. Both human reviews that
      cover this step use GO:0015607 (ABCD3 complete, ABCD1 draft), so the divergence is
      between the yeast and human evidence rather than within either, which is worth stating
      where the decision is recorded.
    - A notes paragraph recording that the step carries both human half-transporters as
      representative members of one family-level annoton rather than as two subfamily annotons
      (PTHR11384:SF21 and :SF62), because the open term choice is a property of the step and
      not of either human paralogue.

    GRHPR-ai-review.yaml auto-merged with both sides' deltas intact - the merge result differs
    from main by exactly the 42-insertion/20-deletion diff this branch had against the merge
    base, with no loss.

    Verification: yaml parse of the merged module; the representative-member list is PXA1,
    PXA2, ABCD1, ABCD3 in that order and the module still has six parts; the Reactome quote
    greps verbatim out of the cached entry; 82 tests in test_module_gene_symbols,
    test_module_logic and test_module_boolean pass, and 249 in test_module_validator,
    test_module_qc, test_module_conformance, test_module_family_conformance,
    test_module_function_conformance and test_panther_families; no unmerged paths remain and
    the merge result differs from main only inside this slice (82 files, all under
    publications, reactome, modules, genes/human and history for the peroxisome and oxalate
    genes).
