  details: |
    Five-part ABA signaling module from the ARATH unmoduled-gene project (PR #5014): PYR/PYL receptor (PYR1, protein phosphatase inhibitor activity), clade A PP2C (ABI1), subclass III SnRK2 (OST1, SnRK2.2, SnRK2.3), ABF/AREB/ABI5 bZIP transcription output (ABI5, ABF2), and guard-cell SLAC1 activation (OST1 ion channel regulator activity, SLAC1 anion channel). Annoton MFs match the gene reviews' core functions. NCED3 (ABA biosynthesis) deliberately excluded and recorded in notes. No PANTHER ids, no GO-CAMs. linkml-validate clean; module_validator passes with one taxon ontology-unavailable warning.
