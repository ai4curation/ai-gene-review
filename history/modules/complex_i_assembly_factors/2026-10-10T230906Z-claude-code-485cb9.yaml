  summary: Checked AIFM1 and DNAJC30 for membership; not added
  details: |
    AIFM1 (COMPLETE review): core functions are NADH dehydrogenase activity (IMS), CHCHD4-anchoring protein-membrane adaptor activity in the mitochondrial disulfide relay, and nuclear DNA binding in apoptosis. Its effect on complex I is indirect, through CHCHD4/MIA40-dependent import of twin-CX9C subunits, so it is not a dedicated complex I assembly factor; it would belong in a MIA40 disulfide-relay module, which does not exist. DNAJC30 (COMPLETE review): core function is complex I repair (exchange of ROS-damaged N-module subunits) with no established molecular function; this is turnover of the mature enzyme, outside the assembly-factor boundary (GO:0032981), and no complex I repair module exists. Neither added.
