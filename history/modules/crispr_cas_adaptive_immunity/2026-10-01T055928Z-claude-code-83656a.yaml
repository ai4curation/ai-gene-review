  summary: 'Create module: CRISPR-Cas adaptive immunity'
  details: |
    New ModuleReview for the host CRISPR-Cas pathway, decomposed into adaptation (Cas1-Cas2 integration), crRNA biogenesis (Cas6-family endoribonuclease or tracrRNA/RNase III variants), and interference (Cascade-Cas3, Csm-Cas10 with cOA signalling, Cas9, Cas12a and Cas13a modelled as variants of one effector slot). Families grounded in InterPro with reviewed UniProt exemplars from E. coli K-12 type I-E, P. aeruginosa PA14 type I-F, and the reviewed class 2 and type III effectors; molecular functions taken from GOA where attested. Three knowledge gaps recorded: no MF term for guide-RNA-directed target recognition, none for cyclic oligoadenylate synthase activity, and none for Cas2's structural role. No GO id is asserted where none fits. Validated with linkml-validate -C ModuleReview and ai_gene_review.validation.module_validator, and rendered to pages/modules/.
