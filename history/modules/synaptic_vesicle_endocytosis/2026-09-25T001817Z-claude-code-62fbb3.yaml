  summary: 'Create module: synaptic vesicle endocytosis'
  details: |
    Created MODULE:synaptic_vesicle_endocytosis (GO:0048488) with four parts: AP-2/AP180/stonin-2/clathrin cargo recognition and coat assembly (AP-2 complex active units AP2M1 on PTHR10529:SF236 with PAINT node PTN000242371, AP2B1 with PTN002596494, AP2A1, AP2S1; SNAP91/PICALM; STON2 on PTHR10529:SF345 with PTN002575694; clathrin triskelion CLTC with PTN000033442 and CLTA), BAR-domain membrane curvature (SH3GL2, AMPH with PTN002509858, PACSIN1 with PTN000860688), dynamin fission (DNM1/DNM3 with PTN000170013), and synaptojanin/auxilin/HSC70 uncoating (SYNJ1, DNAJC6, HSPA8 on PTHR19375:SF379 with PTN000452648 and PTN008570389). A root variant set records the retrieval route (direct clathrin-mediated vs ultrafast/bulk with endosomal regeneration). The root conforms WITH_DEVIATIONS to vesicle_coat_budding with the template edge topology. Evidence: GO, PMID:22763746, 24305055, 22099461. Validated with linkml-validate and module_validator; rendered.
