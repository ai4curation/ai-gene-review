  details: |
    Renamed c_elegans_ciliary_transition_zone to ciliary_transition_zone (context Bilateria, NCBITaxon:33213; Chlamydomonas NPHP4/CEP290 TZ data noted but the full module boundary is not asserted outside animals). Recast every annoton as a FAMILY with the C. elegans protein plus the human ortholog where reviewed (RPGRIP1L, CEP290, MKS1, B9D1, B9D2, TMEM67, CC2D2A, TCTN1, NPHP1, NPHP4); PANTHER family/subfamily ids added only where worm and human share the family in PANTHER 19 and checked against panther.obo; CEP290, TMEM216, TMEM231 and TMEM17 left without family ids. Added a separate CEP290 central-scaffold part (microtubule binding per the human review; central cylinder location per worm data), with the disputed MKS-5 dependence (PMID:26982032 vs PMID:26124290) recorded on the connection and as a knowledge gap. Added newly reviewed worm MKS-module members tctn-1, tmem-107, tmem-231, jbts-14, tmem-17 and tmem-218, and an optional CEP-290-dependent TMEM-138 branch outside both modules. Removed GO:0005198 structural molecule activity from all roles. Added mammalian evidence (PMID:26540106, 21565611, 21725307, 32726168, 41165761, 24051377, 16885411, 25150219) with verbatim quotes. Updated the IFT module cross-reference. linkml-validate clean; module_validator passed (warnings only: NO_FUNCTION_ID for MF-less roles, FUNCTION_UNREVIEWED where only one of worm/human reviews asserts the MF, PANTHER member index not built).
