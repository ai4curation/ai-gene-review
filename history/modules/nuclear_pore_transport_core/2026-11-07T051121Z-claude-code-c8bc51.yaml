- type: CREATE
  outcome: changed
  summary: Create partial eukaryote-wide nuclear pore and Ran transport rule module
  details: |
    New ModuleReview grounding four nucleoporins (Nup98-Nup96, Nup88, Seh1, Sec13), Ran and NTF2, and the exportins Crm1 and Cse1 on PANTHER subfamilies or families with human representatives and PAINT nodes shown to be ancestors of each human protein. Molecular functions come from the human NUP98 review and the exportin nodes' F IBD (nuclear export signal receptor activity for Crm1 and Cse1; the Cse1 node's IRD loss of import-receptor activity is recorded); the rest are untyped. The notes state that the rule is partial because importins, RCC1, RanGAP and most nucleoporins have no local PANTHER entry. Part of the organelle lifecycle project (projects/ORGANELLE_LIFECYCLES.md).
