  summary: 'Create module: chitin_perception'
  details: |
    Expanded the chitin_perception skeleton into an abstract plant module. Part 1 is the LysM receptor complex with a receptor_configuration variant set: rice CEBiP (kinase-less LysM-RLP; chitin binding GO:0008061 + pattern recognition receptor activity GO:0038187) with OsCERK1 (transmembrane receptor protein kinase GO:0019199; no chitin binding, per the OsCERK1 gene review), versus Arabidopsis LYK5/LYK4 (pseudokinase; chitin binding + PRR activity, no kinase activity asserted) with CERK1 (GO:0019199 plus low-affinity chitin binding). Part 2 is the PBL27/OsRLCK185 RLCK (GO:0004674) feeding a MAPKKK5 -> MKK4/MKK5 -> MPK3/MPK6 bundle that conforms_to mapk_relay (EXACT). Part 3 is the BIK1/PBL1 RLCK (GO:0004674) -> RBOHD (GO:0016175) ROS branch, separable from the MAPK branch. LYM2 plasmodesmal closure is out of scope (CERK1-independent, different relay and output) and recorded as a knowledge gap; fungal LysM effectors Slp1/Ecp6 are documented in notes as ligand-sequestering antagonists, not parts. All supporting_text verified against cached publications; falcon module deep research used as retrieval support only. No PANTHER ids asserted (members absent from the local index).
