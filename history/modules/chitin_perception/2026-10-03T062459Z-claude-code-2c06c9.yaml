  summary: Reconcile with member gene reviews
  details: |
    Reconciled the chitin perception module with the completed LYK4, PBL27, PBL1, MAPKKK5, MKK5 (ARATH) and RLCK185 (ORYSJ) gene reviews; MKK4 is still under review and was not used. LYK4 was split from the LYK5 annotons and given coreceptor activity (GO:0015026) plus weak chitin binding, with pattern recognition receptor activity kept on LYK5 only. PBL1 was removed from the RBOHD-kinase annoton, leaving BIK1 as the grounded ROS-branch kinase, with PBL1 moved to notes and a knowledge gap (no PBL1-alone RBOHD phosphorylation; normal chitin Ca2+ response in cce5, PMID:25522736; RLCK VII-4 needed for chitin ROS, PMID:29907700). The PBL27-MAPKKK5 claim was softened and a new knowledge gap records that Rao 2018 and Bi 2018 found no MAPK defect in pbl27 and attribute MAPKKK5 phosphorylation mainly to RLCK VII-4 kinases. Rice wording now states that OsRLCK185 phosphorylates OsMAPKKKepsilon (PMID:28111288) and OsMAPKKK18 (PMID:28371870), in prose only because their UniProt ids were not verified. Gene review evidence and process terms were added to the RLCK, MAP3K and MAP2K annotons.
