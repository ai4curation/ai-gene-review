- type: AUDIT
  outcome: changed
  summary: 'Retrospective audit corrections: tca_cycle succinate-CoA ligase annoton'
  details: |
    Corrections after a retrospective audit (2026-11-12) of the succinyl-CoA synthetase reviews (eleven subunit reviews, the families PTHR11117 and PTHR11815, and the tca_cycle module), followed by a cross-file consistency pass. This record supersedes the reading in the 2026-11-11 records where they differ. Only the annoton succinate_coa_ligase_adp_activity changed. The role_description said that SUCLG1 and SUCLG2 have no gene reviews; both are reviewed, and it now says that SUCLG1 contributes to the ADP-forming and the GDP-forming enzyme and that SUCLG2 is GDP-forming and not a member of this annoton. Representative members added: human SUCLG1 (P53597) and E. coli SucD (P0AGE9) to the alpha unit, E. coli SucC (P0A836) to the beta unit, with labels taken from UniProt. The role_description also says that the bacterial enzymes listed are not ATP-specific (E. coli forms GTP with about a tenth of the efficiency it has with ATP; the P. putida reviews treat the two activities as unranked and name the generic complex GO:0042709) and that the annoton records only their ADP-forming activity. Validated with just validate-modules.
