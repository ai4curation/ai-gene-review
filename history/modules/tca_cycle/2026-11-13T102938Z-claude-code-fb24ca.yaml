- type: EDIT
  outcome: changed
  summary: 'tca_cycle: PANTHER groundings, family reviews, member gene audits (kept DRAFT)'
  details: |
    Adopted the PANTHER family_terms and PAINT ancestral nodes proposed in PR #5076 after checking each against panther.obo, the cached PAINT slices and the PANTHER member index. Added human SDHA, SDHB, SDHC, SDHD and DLD as representative members, beside the existing P. putida, E. coli, S. cerevisiae, S. pombe and human SUCLA2 exemplars. Split the NAD-malate dehydrogenase step into an MDH1/MDH2-type annoton (PTHR11540) and an LDH-like type 3 annoton (P. putida Mdh, no PANTHER id, because PTHR43128 mixes lactate and malate dehydrogenases). Grounded MQO at PTHR43104:SF2 and class I fumarase at PTHR43351:SF2. Every member family now has a complete family review. The status stays DRAFT because, after merging #6336 (succinyl-CoA synthetase audit), the SUCLA2 and SUCLG1 reviews keep an UNDECIDED GO:0110052 row (PMID:40108300 full text is paywalled; only the abstract is cached), and the ten succinyl-CoA synthetase subunit reviews from #6336 are DRAFT. Those six files (P. putida sucC/sucD, S. pombe SPAC16E8.17c/SPCC1620.08, yeast LSC1/LSC2) were taken from #6336 rather than from this audit.
