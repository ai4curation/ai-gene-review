  details: |
    New concrete C. elegans mitochondrial dynamics module (modules/c_elegans_mitochondrial_dynamics.yaml). Boundary: dynamin-GTPase fission and fusion reactions. Three root parts: DRP-1/MFF outer-membrane fission (DRP-1 Q8WQC9, MFF-1 Q19343, MFF-2 P91344 from UniProt, unreviewed), FZO-1 outer-membrane fusion (Q23424), and EAT-3 inner-membrane fusion (Q18965), with an OMM-before-IMM PRECEDES connection. FIS-1/FIS-2 are placed in MODULE:c_elegans_mitophagy because worm FIS1 homologs are not needed for fission. MIRO-1 (no worm transport evidence) and SPG-7 (AFG3L2-type m-AAA protease) are noted and excluded. CED-9/EGL-1 regulation is recorded as a disputed knowledge gap. Grounded in cached PMIDs 10619028, 18722182, 18454199, 19327994, 21248201, 21949250, 24196833, 33734301, plus newly fetched 27064409; 20 quotes verified verbatim. linkml-validate clean; module_validator passed with one warning (NCBITaxon label not checked, ontology unavailable); rendered.
