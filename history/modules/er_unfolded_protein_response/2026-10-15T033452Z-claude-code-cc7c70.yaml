  summary: Record tRNA ligase complex evidence for the UPR module boundary
  details: |
    Litscan handoff #3089 asked whether Ashwin (ASW/C2orf49) and the FAM98 paralogs should join a tRNA biogenesis module as tRNA ligase complex (tRNA-LC) components. No modules/trna_biogenesis.yaml exists and none of RTCB, DDX1, CGI-99/RTRAF, FAM98A/B/C or ASW has a gene review, so the members cannot be grounded yet. The one existing module the paper bears on is this one, whose boundary note already excluded the tRNA ligase that completes IRE1-initiated XBP1 mRNA splicing. Added two PMID:42754615 evidence entries (tRNA-LC seals the XBP1 exons; XBP1 splicing is resilient to loss of any single FAM98 paralog or ASW) and expanded the boundary paragraph to say why the ligase stays out of scope: it is the same machine that joins pre-tRNA exon halves, its localisation is set by subunit composition (ASW binds only the FAM98B complex and imports it), and no accessory subunit is a UPR part in its own right. Nothing was added to parts or annotons.
