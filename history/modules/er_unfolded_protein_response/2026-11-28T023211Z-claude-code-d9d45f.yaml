  summary: Correct the UPR boundary topology and tRNA-LC subunit composition after
    review
  details: |
    Addresses the 2026-10-15 review of PR 5032.

    The blocking item was a topology error in the boundary paragraph: it claimed exon sealing is 'downstream of the module's boundary, which ends at the IRE1 endonuclease cut and its bZIP output'. The module does not end at the cut. The ire1_endoribonuclease annoton's product is 'spliced XBP1s or HAC1i mRNA exons', the XBP1s bZIP transcription factor is a separate annoton, and a POSITIVELY_REGULATES connection links the two. tRNA-LC ligation is what converts those exons into XBP1s mRNA, so it is an unmodelled intermediate between two in-scope nodes, not a downstream step. The clause now says so, and gives the actual reason for the exclusion (shared housekeeping machinery, not a UPR-specific part).

    Three factual corrections in the same paragraph, all checked against the cached full text of PMID:42754615:

    - Subunit composition. The paper's tRNA-LC is a tetrameric core (RTCB, DDX1, CGI-99/RTRAF, FAM98B) plus ASW as a fifth subunit, and ASW binds FAM98B exclusively, so only FAM98B-containing complexes are five-subunit and reach the nucleus. The previous text called the complex 'five-subunit' with 'a FAM98 paralog, and Ashwin/ASW', which does not fit the FAM98A- and FAM98C-containing subpopulations that lack ASW.
    - Cytoplasmic retention. The paper attributes retention mainly to FAM98A ('Our data suggests that this is mainly enforced by FAM98A'), with 'a fraction of FAM98B- or FAM98C-containing tRNA-LCs also remains in the cytoplasm' on FAM98A removal. The previous text paired FAM98A with FAM98C and omitted FAM98B.
    - Catalytic candidate. RTCB is the only candidate for the catalytic role specifically; the paper names Archease and PYROXD1 as two further proteins essential to sustain tRNA-LC activity.

    The first PMID:42754615 evidence entry's statement asserts that RTCB is shared with pre-tRNA splicing, but its quote covered only the XBP1 half. Extended it with the introduction's sentence naming both roles, joined by an ellipsis, so the entry is self-supporting.

    No parts or annotons were touched; this remains evidence and scope commentary only.
