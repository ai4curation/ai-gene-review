  summary: 'Create module: generic Embden-Meyerhof-Parnas glycolysis template'
  details: |
    Created modules/emp_glycolysis.yaml (MODULE:generic_emp_glycolysis), the
    taxon-neutral Embden-Meyerhof-Parnas glycolysis template. The repository had
    concrete human glycolysis modules (glycolysis_investment_phase,
    glycolysis_payoff_phase) and a taxon-neutral gluconeogenesis template
    (gluconeogenesis.yaml), but no generic EMP counterpart; the only non-human
    hexose-catabolism module was entner_doudoroff_and_gluconeogenesis, which
    explicitly scopes itself against EMP without supplying it.

    Module core is GO:0061615 glycolytic process through fructose-6-phosphate
    rather than the broad parent GO:0006096, because passage through
    fructose-6-phosphate is what distinguishes the EMP route from the
    Entner-Doudoroff sibling term GO:0061688. Nine ordered parts run from hexose
    entry to pyruvate. Three variant sets capture real cross-taxon variation:
    hexose entry (ATP kinase / ADP-specific archaeal kinase / PTS transport
    coupling / glucose-1-phosphate from a glucan), mirroring GO's own children of
    GO:0061620; phosphoryl donor at the committed 6-phosphofructokinase step
    (ATP / diphosphate / ADP); and glyceraldehyde-3-phosphate oxidation
    (phosphorylating GAPDH+PGK versus non-phosphorylating GAPN or
    ferredoxin-dependent GAPOR, both of which skip phosphoglycerate kinase).

    scope: ABSTRACT, with ANY_WITH_FUNCTION selectors throughout, matching the
    sibling gluconeogenesis template; leaf nodes intentionally name no
    representative proteins and derived QC confirms no leaf-grounding gaps are
    reported for this file. Every GO id and label was resolved against the local
    GO SQLite build before use rather than written from memory; this caught
    GO:0046537 and GO:0046538 (the iPGM/dPGM molecular function terms) as
    obsolete with term_replaced_by GO:0004619, so the mutase step asserts only the
    generic GO:0004619 and records the non-homologous family split as prose. The
    same limitation for class I versus class II fructose-bisphosphate aldolase
    (both GO:0004332 / EC 4.1.2.13) is recorded alongside it in notes. The
    MetaCyc:PWY-5484 evidence id was taken from the has_dbxref of GO:0061615, not
    guessed. No PANTHER family ids are asserted anywhere in the file: candidate
    iPGM families exist in the local PANTHER OBO (PTHR31209, PTHR31637, PTHR36043)
    but could not be discriminated from the local member index, so per the
    'if you cannot be sure, assert no id' rule none was used.

    Knowledge_gaps was deliberately left unpopulated: the three candidate entries
    drafted initially were ontology and tooling limitations, not literature-grounded
    biological unknowns about pathway function, so they were moved into notes
    instead. Validation: linkml-validate -C ModuleReview passes; module_validator
    reports term labels OK with 0 warnings; collect_module_qc reports 100%
    recommended-field compliance, no leaf-grounding gaps, no conformance
    violations, and no reaction-chaining warnings (the CoA-continuity check does
    not apply, as the pathway has no CoA intermediates; each connection instead
    carries an explicit curator chaining_status of VERIFIED naming the shared
    intermediate). Rendered to pages/modules/emp_glycolysis.html.

    Left undone: no module deep-research report accompanies the file (none was
    generated, and writing one by hand under a -deep-research-<provider>.md name is
    prohibited), and the template has not been checked for satisfiability against a
    bacterial or archaeal genome. Both are recorded in the module's notes as
    prerequisites for leaving DRAFT.
- type: EDIT
  outcome: changed
