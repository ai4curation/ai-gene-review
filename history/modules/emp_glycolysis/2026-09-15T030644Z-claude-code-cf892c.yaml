  summary: Clear the part-2 role string still asserting the withdrawn commitment claim
  details: |
    Third review round on PR #3049 approved f880d3bf8 and raised one leftover
    wording item: the part-2 role string still read "aldose-ketose isomerisation
    committing carbon to the EMP route", contradicting the node description five
    lines below it, which since the previous round says GPI routes rather than
    commits carbon and names phosphofructokinase as the committed step. Changed
    to "routing carbon into the EMP route".

    Worth recording why the previous sweep missed it: that sweep grepped for
    "committed" and "commitment", and the surviving instance was the participle
    "committing", which matches neither. The role field is also the most visible
    place the stale phrasing could have survived, since it renders as both the
    pathway-chain edge label and the part header, ahead of the description that
    corrects it. Re-swept for the bare stem "commit" afterwards: the eight
    remaining hits all refer to the phosphofructokinase step, and the separate
    "Commits hexose carbon to intracellular metabolism" on the hexokinase annoton
    is the distinct hexose-trapping sense, disclaimed for EMP-exclusivity in its
    own next sentence.

    Re-validated: linkml-validate -C ModuleReview clean, module_validator term
    labels OK with 0 warnings, 113 module tests pass, git diff --check clean,
