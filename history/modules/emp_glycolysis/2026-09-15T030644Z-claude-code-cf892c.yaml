  summary: Clear the two residual wording nits from the approving re-review on PR #3049
  details: |
    The ai4c-reviewer re-review of c7a55027b approved the module and confirmed all
    three blocking fixes and all six suggestions had landed, explicitly endorsing
    the GO:0061625 resolution of finding 4 over the variant-addition it had
    originally proposed. Two residual wording nits were raised; both were valid
    and both are fixed here.

    Nit A: withdrawing the step-2 commitment claim left "defining commitment" in
    the document description and in the top-level concept description, using for
    the F6P criterion the same word the module now reserves for the
    phosphofructokinase step. Changed to "defining feature" and "defining
    criterion", and the concept description now states the reservation
    explicitly. Every remaining use of committed/commitment in the file refers to
    the PFK step.

    Nit B: a genuine modelling gap, not only wording. The entry-node description
    promised "direct entry at fructose 6-phosphate" that no variant models, and
    the phrase was self-contradictory ("via the isomerase step" versus "direct
    entry"). Unlike the fructose-1-phosphate route scoped out in the previous
    round, direct F6P entry — fructose phosphorylated at C6 by a
    broad-specificity hexokinase, and mannose entering via mannose 6-phosphate
    and mannose-6-phosphate isomerase — is INSIDE GO:0061615, because it passes
    through the defining intermediate. Reworded the node description to describe
    only what the four variants do, and added a scope paragraph recording direct
    F6P entry as a KNOWN GAP for a future revision rather than a scoping
    decision, explicitly distinguished from the F1P exclusion that follows it.
    Not modelled as a new variant in this PR to avoid widening it past the
    review.

    Also recorded, unprompted, how the GO:0061625 parentage claim can be audited:
    the reviewer could not check hierarchy in its sandbox and correctly noted
    that module_validator checks term labels rather than parentage, so the claim
    is not covered by CI. The evidence statement now names the asserted
    superclasses of GO:0061625 (GO:0006001 fructose catabolic process and
    GO:0006096 glycolytic process, with GO:0061615 absent) and says plainly that
    it rests on a curator check against the GO release in use.

