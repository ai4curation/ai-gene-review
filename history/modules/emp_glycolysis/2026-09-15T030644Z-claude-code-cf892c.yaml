  summary: Address ai4c-reviewer findings 1-9 on PR #3049
  details: |
    Responded to the automated review on PR #3049, which requested changes on
    three items and offered six suggestions. All nine were verified against
    primary sources before acting; all nine were accepted.

    Blocking. (1) pfk_phosphoryl_donor relaxed EXACTLY_ONE to ONE_OR_MORE:
    plants co-express cytosolic ATP-dependent PFK and diphosphate-dependent PFP,
    so the donors are not alternatives, and the original value contradicted the
    reasoning already applied to the other two axes. (2) The ATP-kinase entry
    variant listed hexokinase and glucokinase as two conjunctive annotons, which
    asserts that a selecting organism has both; checked the local GO build and
    confirmed GO:0004340 glucokinase activity is a DIRECT CHILD of GO:0004396
    hexokinase activity, so the two are related by subsumption rather than
    exclusion, and they are now a nested variant set on the specificity axis.
    (3) Removed the claim that fructose 6-phosphate is unshared and that the
    isomerase is the committed step — F6P is an output of the non-oxidative
    pentose phosphate branch, a phosphoketolase intermediate, and the hexosamine
    precursor, and the module's own step 3 correctly names PFK as committed. GPI
    is now described as routing carbon into EMP, not committing it.

    Non-blocking. (4) The reviewer proposed adding the bacterial
    fructose-1-phosphate route (fructose PTS + FruK, EC 2.7.1.56) as a fourth
    entry variant. Checked the GO hierarchy instead of accepting the framing:
    GO:0061625 glycolytic process through fructose-1-phosphate is a SIBLING of
    GO:0061615 under GO:0006096, not a child, so GO places that route outside the
    fructose-6-phosphate pathway this module models. Scoped it out explicitly in
    notes with GO:0061625 recorded as evidence, cross-referencing the two
    existing fructose PTS modules, rather than adding the variant. (5) Two
    arithmetic slips corrected: the payoff phase yields four ATP per hexose, not
    two, and the seven near-equilibrium steps are seven of ten reactions rather
    than of nine parts. (6) The PTS feedback edge now targets pts_entry_variant
    rather than the whole hexose_phosphate_entry node, making its conditionality
    structural and leaving the top-level graph acyclic when PTS entry is not
    selected. (7) EC:1.2.7.6 evidence added to gapor_activity, citing the
    NCBIFAM:NF040818 equivalog mapping already present in this repo at
    projects/NCBIFam/ncbifam2go.candidates.tsv. (8) plasma membrane (GO:0005886)
    added to pts_activity, the one genuinely membrane-associated step and the one
    the module-level cytosol context does not cover; cytosol added to the two
    ADP-dependent archaeal annotons. (9) GO:0061621 added as a concept on the
    ATP-kinase entry variant, making the three entry variants symmetric.

    The reviewer could not run validation in its sandbox (no uv on PATH) and
    flagged four GO labels it could not check locally (GO:0061622, GO:0061633,
    GO:0043844, GO:0043797); module_validator label-checks all four and reports
    0 warnings. Re-validated after the edits: linkml-validate -C ModuleReview
    passes, module_validator term labels OK with 0 warnings, collect_module_qc
    still 100% recommended-field compliance with no leaf-grounding, conformance
    or chaining findings, 163 module tests pass, page re-rendered.
