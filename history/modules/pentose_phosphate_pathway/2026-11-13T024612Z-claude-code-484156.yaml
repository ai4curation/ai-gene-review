  details: |
    Checked open PRs (only #5076, which does not touch this module). The module was already pan-domain (yeast, S. pombe, P. putida KT2440, human PRPS1); added E. coli K-12 zwf and gnd reviews so the two E. coli representative members are grounded, and cited their papers (PMID:4401601, 4869212, 19686854) in the evidence list and member descriptions. Yeast Prs1-Prs5 were moved from the PRPP-synthetase family exemplars into a new annoton, yeast_prpp_synthase_complex_activity, a PROTEIN_COMPLEX participant (GO:0002189) whose five active units contribute to GO:0004749, because no single yeast subunit is active (PMID:15280369, added to evidence); PRPS1 and SPAC4A8.14 remain family exemplars. Member gene reviews were harmonized across orthologs (GO:0006098 MODIFY to the branch terms, GO:0005975/GO:0006006 non-core, cytosol accepted, NADP binding non-core), PRPS1 aligned with the protein-binding policy, and every grounded review set COMPLETE. Missing PAINT node assessments were written for six of the eight member families. Module validation: 0 warnings, recommended-field compliance 100%, no conformance violations, 36/36 gene reviews complete. Status DRAFT to COMPLETE; page re-rendered.
