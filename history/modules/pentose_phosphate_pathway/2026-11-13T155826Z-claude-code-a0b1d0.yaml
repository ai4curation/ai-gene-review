  summary: 'Address PR #6343 review: explain PRPP family selector scope, cite human
    PRPS1 for its function'
  details: |
    The prpp_synthetase_activity family selector keeps PTHR10210 SF57, SF32, SF36 and SF48, and its descriptor now says why: each of those subfamilies also contains enzymes outside the budding-yeast complex (SF57 with S. pombe SPAC4A8.14; SF32 with human PRPS2 and S. pombe SPCC1620.06c; SF36 with S. pombe SPBC3D6.06c), so membership cannot separate self-sufficient enzymes from Prs subunits that are inactive alone. The yeast Prs proteins are not used as exemplars there and are modelled in yeast_prpp_synthase_complex_activity. The annoton's function evidence now cites the human PRS1 structure paper (PMID:16939420, added to the evidence list) instead of the yeast PMID:10212224 statement, which stays on the complex annoton.
