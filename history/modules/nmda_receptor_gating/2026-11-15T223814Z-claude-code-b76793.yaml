  summary: 'NMDA gating module: GluN3-specific evidence on the GluN1/GluN3 partner
    edge'
  details: |
    Review of PR 6366 found the GluN3 partner edge still cited PMID:12805203, an NR1/NR2 structure paper whose quote asserts the glutamate requirement GluN1/GluN3 receptors lack. Replaced with PMID:17047094 (agonist binding to NR3 alone activates NR1/NR3 currents) and PMID:38598639 (GluN1/GluN3 receptors activated exclusively by glycine). Added a note that the GluN1/GluN3 default rule, where GluN1 glycine only inhibits, is a steady-state abstraction, since agonist-bound NR1 may also add to peak current (PMID:17047094).
