  summary: 'NMDA gating module: GluN1 glycine binding inhibits GluN1/GluN3 receptors'
  details: |
    After the OpenScientist module deep research, the role of glycine at GluN1 in GluN1/GluN3 receptors was corrected: glycine at GluN3 opens the channel and glycine at GluN1 reduces the current (PMID:26777280, verified against PubMed; PMID:17047094). The single GluN1-to-conduction connection was split into a positive connection to the GluN1/GluN2 variant and a negative one to the GluN1/GluN3 variant. The deep-research report and its artifacts are added; it was generated with the module as its outline, so its agreement on the boundary is not independent.
