  summary: 'Create: NMDA receptor family channel gating module'
  details: |
    New concrete human module for gating of GluN1-containing receptors, written after the human GRIN1 gene review and the review of the seven GO-CAM models containing GRIN1. Three parts: co-agonist sensing by GluN1 (glycine binding), agonist sensing by the partner subunit (variant set of GluN2A-D glutamate binding and GluN3A/B glycine binding), and cation conduction by the tetramer (variant set: NMDA glutamate receptor activity or glycine-gated cation channel activity). All seven GO-CAM models are pinned to the elements they realise. Assembly, trafficking, scaffolding, allosteric modulation and downstream calcium signalling are outside the boundary. Only GRIN1 has a gene review, so status is DRAFT; PANTHER and PAINT descriptors were omitted as unverified. Passed linkml-validate (ModuleReview) and the module validator with no warnings; rendered.
