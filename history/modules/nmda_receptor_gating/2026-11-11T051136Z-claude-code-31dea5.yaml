  summary: 'NMDA gating module: AND-gate activation_logic for the GluN1/GluN2 channel'
  details: |
    Ran the Boolean translation (ai-gene-review module-to-bnet) of the NMDA receptor gating module. It exposed that the default CaSQ rule (OR of activators) turned the GluN1/GluN2 channel into an OR of its two co-agonist inputs, whereas the receptor is an AND-gate coincidence detector. Added activation_logic (all_of glun1_coagonist_sensing, partner_agonist_sensing) to the GluN1/GluN2 variant and wired the partner edge to both variant nodes explicitly. The GluN1/GluN3 rule was already correct by default (partner & !glun1), capturing the opposite-sign GluN1 glycine logic. The .bnet is a derived view and is not committed.
