  summary: 'Address PR #3334 review: GO-correctness and evidence-scope fixes'
  details: |
    Response to the CHANGES_REQUESTED review on PR #3334. All five IMPORTANT findings were independently verified against the local GO build and the cached publications before acting; all five were correct.

    R1 (chimallin exclusion, GO term mischaracterises mechanism). Verified against the GO database: GO:0098672 is_a GO:0052031 symbiont-mediated perturbation of host defense response, while GO:0099018 is_a GO:0141177 symbiont-mediated evasion of recognition by host innate immune effector. The shell does not perturb CRISPR-Cas; it evades it spatially. Added GO:0099018 to cover the restriction-enzyme half the annoton's label and quote already claimed, and kept GO:0098672 with a description recording that it misdescribes the mechanism. A GO label query confirms there is no evasion-flavoured CRISPR term, so this is a genuine ontology gap and is now recorded as the module's fourth knowledge gap, with a proposed term under GO:0141177 and the two controls (EcoRI relocalisation, Cas13a sensitivity) as provenance.

    R2 (proposed term conflates boundary with compartment, wrong parent). Correct, and the fix is better than either the original or the reviewer's suggested part_of split. GO already models proteinaceous bacterial compartments: GO:0031469 bacterial microcompartment and GO:0140737 encapsulin nanocompartment are both is_a GO:0043232 intracellular membraneless organelle, and GO does not give the carboxysome shell a component term at all -- shell subunits are annotated to the molecular function GO:0043886 structural constituent of carboxysome shell. The proposal is now a pair following that pattern: "phage nucleus" (CC, parent GO:0043232) and "structural constituent of phage nuclear shell" (MF, parent GO:0005198). Placing the compartment under the membraneless-organelle branch also sidesteps having to settle whether the eukaryote-facing viral-factory branch should be generalised first. The gap's boundary and resolution now record the precedent.

    R3 (vimentin cage cites a claim the reference does not support). Confirmed: PMID:11331297 contains no occurrence of "Ebola". The claim came from the source review, which cites its own ref 98 for the filovirus half -- Vallbracht et al. 2025 Cell, PMID:39742805. I fetched it: abstract-only in PMC, and it contains no occurrence of "vimentin" either, so it cannot support the claim. The Ebola clause is dropped and attributed to the source review as an unrepeated claim, and "required for structural integrity" is replaced with what the paper shows: shared vimentin rearrangement, MTOC proximity, microtubule dependence, established correlatively. The fetched publication was deleted rather than committed, since nothing cites it.

    R4 (PhuZ capsid attribution outruns its evidence). Confirmed by grepping both cached papers: PMID:22726436's capsid mentions are all about DNaseI-resistant encapsidated DNA, and PMID:28082593 describes capsids migrating to the compartment surface without attributing the movement to PhuZ. The capsid-delivery clause is removed and the role_description now states explicitly that no cited reference attributes the trafficking to PhuZ. GO:1903902 is retained because it is the curated UniProt annotation on these proteins, with a description recording that it is a broad regulatory wrapper for the positioning activity the evidence establishes.

    R5 (spherule exemplars ground the polymerase, not the boundary). Correct for both. For chikungunya the fix is a real grounding: PMID:38940586 establishes an nsP1 dodecameric ring forming amphipathic membrane-binding spikes that penetrate about 10 A into micelles and assembling a connecting pore separating the spherule lumen from the cytoplasm. That is precisely the amphipathic-insertion mechanism GO:0180020's definition names, so a second annoton now carries GO:0180020 with two verbatim quotes. For tombusvirus no cached reference establishes the p33 membrane mechanism, so instead of inventing a grounding the role_description now states that only the location and the polymerase are grounded in this variant, and why.

    Suggestions 6-13 all applied: the truncated reovirus pH quote completed; a five-word fragment replaced by a statement since the sentence is already quoted in full at module level; a quote added for PMID:37667030 (ChmB pores as capsid docking sites, which also strengthens the packaging annoton); the one unverifiable quote moved from supporting_text to supporting_text_fulltext, the schema's designated field for text not checkable against the cache; the duplicated GO:0039713 removed from context.cellular_components, keeping it on concepts; gap 2's resolution restored GO:0039717, which is the term with concrete candidates in this module and currently has no reviewed annotation at all; scope note (5) rewritten to say that only GO:0039713 is in the audit's scored set and that the branch-children claim is manual reading rather than a measured result; the SPKW page's high-reuse table restored the distinguishing suffixes on GO:0099000/1/2 and gained the same audit-scope caveat; and the one backwards connection now explains why recruitment feeds the boundary against part order.

    Verification after edits: linkml-validate -C ModuleReview clean, module_validator clean (same single environmental NCBITaxon warning), all 57 supporting_text quotes re-checked verbatim against the cache with zero mismatches, and every newly introduced GO label confirmed against the local GO build.
