  summary: Create viral factory (virus-induced replication microcompartment) module
  details: |
    New ABSTRACT ModuleReview for the virus-induced replication microcompartment, seeded from Brittain et al. 2026 (PMID:42734359), a J Virol minireview supplied as the source PDF.

    Module boundary. The module core is the compartment plus the co-localised replication/transcription/assembly programme. The three physically distinct ways the boundary is drawn are modelled as ONE_OR_MORE variants on a single axis rather than as separate modules, because the downstream programme is the same in all three: a host-membrane-derived boundary (spherule / tube / double-membrane vesicle, with a nested EXACTLY_ONE donor-organelle axis over ER-ERGIC, plasma membrane, and peroxisome), a liquid-liquid phase-separated condensate, and a self-assembled proteinaceous shell. ONE_OR_MORE rather than EXACTLY_ONE because SARS-CoV-2 runs a DMV replication organelle and a separate nucleoprotein condensate in the same cell, and Chimalliviridae pass through a membrane-bound EPI vesicle before building the chimallin shell. Eight parts in total: boundary formation, host-system recruitment, transcription, genome replication, assembly/packaging, shielding, and two optional parts (non-lytic egress, factory antagonists).

    Two scope calls worth flagging. (1) Phage nuclei are included as a boundary variant although the source review is explicit that they are "not considered true VFs"; they satisfy the module's functional definition exactly, and the caveat is recorded on the variant node itself. (2) Translation is deliberately excluded: in every system where it has been localised (mimivirus, phage nucleus) it happens outside the factory, so exclusion is stated as a property of the compartment rather than modelled as a part.

    Grounding. 26 UniProt accessions, all resolved against the UniProt REST API, none carried over from memory. GO terms resolved against the local sqlite:obo:go build; the viral-factory branch (GO:0039713 and descendants) turned out to be rich enough to ground the boundary variants directly. Family descriptors for viral proteins (Mononegavirales N, P and L; chimallin; PhuZ) assert no PANTHER id -- PANTHER does not classify these -- and are grounded by representative_members only, per the "if you cannot be sure, assert no id" rule. Six such descriptors; the validator's informational note confirms this is the intended shape.

    Three knowledge gaps, each checked rather than assumed. (a) ONTOLOGY+CURATION: no GO term denotes a proteinaceous viral replication compartment or the phage nuclear shell; chimallin proteins can currently carry only GO:0030430 host cell cytoplasm. A "phage nuclear shell" term is proposed under GO:0039713. (b) CURATION: queried UniProt for reviewed proteins annotated to each viral-factory term -- GO:0039716 viroplasm viral factory and GO:0039717 spherule viral factory have zero reviewed annotations, and none of the best-characterised condensate scaffolds (rabies N/P, measles N/P, Ebola NP, rotavirus NSP2/NSP5, vaccinia H5) carries any viral-factory term, although SARS-CoV-2 N does carry GO:0140693. (c) BIOLOGY: the viral factors that recruit host mitochondria to the factory periphery, and that recruit host nuclear transcription machinery in Marseilleviridae, are both unidentified -- these are the two host-recruitment annotons the module cannot ground to any participant.

    Provenance. 32 publications fetched into publications/. All 53 supporting_text quotes were checked as verbatim normalized substrings of the cached publications; the one exception is a quote from the source review's body (the "not considered true VFs" caveat), which is cached abstract-only and is therefore marked full_text_unavailable: true. Three quotes originally taken from the review body were replaced or dropped once they failed that check.

    Validation: linkml-validate -C ModuleReview clean; module_validator clean (the single NCBITaxon warning is environmental -- OLS is unreachable from the validator here and the same warning fires on peroxisome-lifecycle; NCBITaxon:10239 "Viruses" was verified separately with runoak). Rendered to pages/modules/viral_factory.html at 100% recommended-field compliance.
