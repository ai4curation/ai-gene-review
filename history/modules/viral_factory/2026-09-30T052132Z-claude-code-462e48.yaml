  summary: 'Address PR #3334 re-review: PhuZ node text, pushing/bipolar grounding,
    gap 4 trade-off'
  details: |
    Response to the second CHANGES_REQUESTED review, on commit 8c03ba405. All items verified independently before acting.

    Blocking item, and a genuine miss on my part. The previous round fixed vf_phuz_spindle's role_description but left the parent variant node vf_phage_spindle_positioning carrying the same uncited claim in both its label ("and delivering capsids") and its description ("later trafficks empty capsids to its surface for packaging"), stated more strongly than the annoton ever had. The node and the annoton therefore contradicted each other. Re-checked PMID:28082593: it describes the capsid migration twice and attributes it to PhuZ neither time. Node label shortened to "Phage tubulin spindle positioning the factory" and the description now says where the capsid trafficking is modelled and why it is not attributed here. Grepped the whole file afterwards for any residual spindle/capsid attribution; the only remaining hit is the annoton sentence that explicitly denies it.

    Suggestion (a), which was a real sourcing error. The role_description grounded "pushing" and "bipolar" in PMID:22726436, which contains zero occurrences of "bipolar" and offers the pushing model as speculation ("We therefore speculate that PhuZ forms dynamically unstable polymers capable of exerting pushing forces"). PMID:28082593, already a module reference, reports both as observations. Added two verbatim quotes from it: the pushing mechanism ("confirming that these dynamically unstable filaments center phage DNA by a pushing mechanism") and the bipolar architecture ("opposing filaments of the bipolar PhuZ spindle"), each with a statement naming what it grounds and why the other paper does not.

    Suggestion (b). Gap 4's significance called annotating GO:0098672 false while vf_chimallin_nuclease_exclusion asserts it. The trade is now stated: the schema has no annoton-level pointer to a proposed term, so dropping the only CRISPR-facing term would leave that half of the shell's demonstrated activity with no assertion at all; the annoton keeps the term alongside a description saying it misdescribes the mechanism, on the view that a flagged over-broad assertion beats silence, and should be replaced if the proposed term is created.

    Reviewer's closing note on GO:0099018, which improves the module. My description hedged that GO's definition "anticipates" a methyltransferase. The repository already reads the term more broadly: genes/9CAUD/darB proposes GO:0099018 for cis-acting physical protection of packaged DNA with no demonstrated methylation. The hedge is replaced with that precedent, which makes the steric case a sibling rather than a stretch.

    Suggestion (c) not actioned here, and the reviewer is right on the substance after a closer check than my first pass. A naive grep for "knowledge gap" in pages/modules/viral_factory.html returns hits, but they are prose inside annoton descriptions ("see the module-level knowledge gap"); the knowledge_gaps block itself does not render. The three proposed term names, and "intracellular membraneless organelle", occur zero times in the rendered page, and src/ai_gene_review/render_modules.py contains no reference to knowledge_gap at all. This affects every module page, not just this one, so it belongs in a tooling change rather than in this PR.

    Also confirmed from OLS, which the reviewer could not reach: GO:0141177 is "symbiont-mediated evasion of recognition by host innate immune effector" and GO:0141171 is "symbiont-mediated perturbation of host membrane", both non-obsolete, both matching the label strings used here.

    Verification after edits: linkml-validate -C ModuleReview clean, module_validator clean with the same single environmental NCBITaxon warning, and all 59 supporting_text quotes re-checked verbatim against the cache with zero mismatches.
