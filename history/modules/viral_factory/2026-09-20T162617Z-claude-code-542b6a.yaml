  summary: Record that the GO viral-factory branch derives from ViralZone VZ:1951;
    register VZ prefix
  details: |
    Follow-up to the module's creation, prompted by the question of whether ViralZone is used as a source in this repo.

    Finding. The GO viral-factory branch this module uses for grounding is not independent of ViralZone. GO:0039713 carries the dbxref VZ:1951, and a sentence-level comparison of the GO definition against that page's prose scores max 0.82 / mean 0.74 (difflib, autojunk disabled) -- a close paraphrase. The same page supplies the spherule, double-membrane-vesicle, tube, virogenic-stroma and peristromal-region definitions; GO's one substantive edit was to drop ViralZone's claim that filoviruses produce viroplasms. Citing VZ:1951 as module evidence would therefore count one source twice rather than corroborate it, so the relationship is recorded as scope note (5) and no evidence item was added. The primary literature already cited on each boundary variant remains the independent support.

    Repo-wide context measured while establishing this: 152 GO terms carry a VZ dbxref (129 biological_process, 23 cellular_component) against 144 distinct ViralZone pages. Text reuse is the exception rather than the rule -- of 148 scorable definitions, 10 are verbatim-ish (>=0.85), 12 close paraphrase, 24 reworded, and 102 largely independent -- so GO curators generally used ViralZone as a reference and wrote their own definitions. The viral-factory branch is one of the closely-derived cases, which is why it needs the note.

    conf/oak_config.yaml now registers VZ as an explicitly unvalidated prefix. GO's own dbxref spelling is VZ (as in VZ:1951), not the bioregistry 'viralzone' prefix; the repo's existing ViralZone references in projects/SPKW use the same numbering. Recording it as null documents the prefix as deliberately skipped rather than merely absent, matching the file's stated semantics that unlisted prefixes are skipped with a warning.

    No change to any term id, participant, evidence item or connection.
