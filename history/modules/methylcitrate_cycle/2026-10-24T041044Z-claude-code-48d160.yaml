  summary: Generalize 2-methylcitrate cycle module and promote to COMPLETE
  details: |
    Generalized the module beyond P. putida KT2440 with experimentally characterized exemplars: E. coli K-12 PrpE/PrpC/PrpD/AcnB/PrpB, Salmonella LT2 AcnA (AcnA hydration route; replaces KT2440 AcnA-I, which is supported only by orthology) and Shewanella oneidensis AcnD/PrpF, keeping KT2440 members on every other step. Adopted the PANTHER groundings proposed in PR #5076 after verifying them against UniProt DR lines and panther.obo, grounded at the pathway subfamily (PTHR11739:SF25, PTHR16943:SF8, PTHR43160:SF4, PTHR42905:SF5) where the family reviews restrict the activity, and used NCBIfam TIGR02333/TIGR01341 for AcnD/AcnA because PTHR11670 has no subfamilies. Added PAINT ancestral nodes, literature evidence, scope CONCRETE. Schema and module validators pass with 0 warnings; 15/15 grounded gene reviews complete; 100% recommended-field compliance.
