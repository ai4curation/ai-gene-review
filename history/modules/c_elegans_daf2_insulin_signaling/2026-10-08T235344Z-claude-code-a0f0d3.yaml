  summary: Align DAF-2 module annotons with new worm gene reviews
  details: |
    New gene reviews exist for age-1, daf-18, pdk-1, akt-1, akt-2, sgk-1, ftt-2, ins-6 and daf-28. Removed the no-gene-review caveats. PDK-1 MF changed from GO:0004676 to GO:0004674 to match the pdk-1 review. FTT-2 process aligned to GO:0042308; DAF-18 processes changed to negative regulation terms (GO:0046627, GO:0051898) with plasma membrane/cytosol; AGE-1 gained plasma membrane, GO:0043491 and PIP3-depletion evidence (PMID:23543623). Notes record AKT PIP3 binding, AKT-2 redundancy, SGK-1 TORC2/PQM-1 DAF-16-independent branch (PMID:27401555), DAF-18 VAB-1 phosphatase role (PMID:19853560) and daf-28(sa191) dominant-negative caveat (PMID:12654727). IST-1/AAP-1 adaptor note updated (PMID:12393910).
