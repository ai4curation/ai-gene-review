  summary: Generalize and complete homogentisate catabolism module
  details: |
    Made the module species-neutral (scope ABSTRACT, context cellular organisms) because the HGD/MAAI/FAH lower pathway is pan-domain. Adopted the PANTHER groundings from PR 5076 for the dioxygenase (PTHR11056, PAINT PTN000114776) and hydrolase (PTHR43069, PTN002453799) steps; for the isomerase step no family id is asserted, because the PTHR42673 family review found GO:0016034 unresolvable at PANTHER level (YfcF, YibF and NagL share subfamilies with real isomerases), and the narrower NCBIfam TIGR01262 / InterPro IPR005955 signature is cited as evidence instead; representative members are P. putida KT2440 hmgA/hmgC/hmgB, A. nidulans hmgA/maiA/fahA and human HGD/GSTZ1/FAH, all with COMPLETE gene reviews, plus family reviews for the three families. Added literature evidence (PMID:9417084, 8782815, 10876237, 1998338). Both module validators pass with zero warnings; status set to COMPLETE.
