  summary: Create cargo-neutral karyopherin nuclear import module
  details: |
    New reusable module for signal-dependent nuclear protein import: cargo recognition (importin-alpha/beta1 route or direct importin-beta-family route: KPNA1, KPNA4, KPNA2, KPNB1, IPO7, IPO8), pore translocation (FG-nucleoporins, NUP153 representative), RanGTP release (RAN, RCC1), carrier return (RANGAP1, NUTF2) and optional importin-alpha re-export (CSE1L). Grounded by UniProt accessions and PMIDs 17287812, 9323134, 9384585, 15919823, 11294908, 17785517, 1944575 (abstract quotes). Written to be included by module_ref where a cytosolic-activated transcription factor must reach the nucleus; motivated by GO-CAM receptor -> nuclear TF edges (projects/GOCAM_COMPARTMENTS.md).
