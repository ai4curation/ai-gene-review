  details: |
    Renamed modules/c_elegans_mitophagy.yaml to modules/mitophagy.yaml (MODULE:mitophagy); context taxon Eumetazoa (NCBITaxon:6072), matching PAINT IBD node placement for PINK1 (PTN001121970) and BNIP3/NIX (PTN001032684); Parkin node PTN000188399 is bilaterian. Roles recast as FAMILY selectors with worm + human representatives: PINK1 (PTHR22972:SF7; Q09298, Q9BXM7), Parkin (no PANTHER term because PRKN UniProt xref PTHR10677 differs from PAINT family PTHR11685; O60260, Q9XUS3), BNIP3/NIX (PTHR15186; Q12983, O60238, Q09969), FUNDC1 (no term, FUN14 family includes non-receptors; Q8IVP5, Q22252), Atg8 family (PTHR10969; O95166, Q9GZQ8, Q09490). Receptor variant set re-axed on receptor type and lineage, adding a vertebrate ubiquitin-binding receptor variant (OPTN Q96CV9, CALCOCO2 Q13137); ALLO-1 kept as nematode variant (isoform cargo preference, ULK recruitment, PMID:38368448); FIS-1/FIS-2 kept as a nematode-only part (human FIS1 unreviewed, notes only). FUNDC1 MAM DRP1-adaptor role and BNIP3 pro-death activity noted as out of scope. Cross-references updated to MODULE:metazoan_autophagosome_biogenesis, MODULE:mitochondrial_dynamics, MODULE:mitochondrial_upr. 48 PMID supporting_text quotes verified verbatim against cached publications. linkml-validate clean; module_validator passed (3 warnings: taxon label unchecked offline, PANTHER member index absent for two families); rendered.
