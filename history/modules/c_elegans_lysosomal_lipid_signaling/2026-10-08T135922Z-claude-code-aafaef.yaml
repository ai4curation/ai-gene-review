  details: |
    Concrete C. elegans signaling module scoped by projects/CAEEL_LYSOSOME_NUCLEUS_LIPID_SIGNALING.md, with four root parts: HLH-30/TFEB lysosome and autophagy transcription (upstream input inducing lipl-4), LIPL-4 lysosomal acid lipolysis, LBP-8 lysosome-to-nucleus lipid transfer, and NHR-80 (OEA-activated) / NHR-49 (co-factor) nuclear receptor output, with connections HLH-30 -> LIPL-4 -> LBP-8 -> NHRs and NHR -> lbp-8 positive feedback. Members: HLH-30 H2KZZ2, LIPL-4 Q94252, LBP-8 O02324, NHR-80 Q8ITW8, NHR-49 O45666; NHR-47 excluded (no link to the pathway in its review), NHR-66/NHR-13, DAF-16, PHA-4, MXL-3, NAPE-1/2 and the FAT-5/6/7 and ACS-2 targets left as text or targets. LIPL-4 asserts only lipase activity because OEA is made by NAPE-PLD. 23 PMID quotes checked verbatim against cached papers. Two BIOLOGY knowledge gaps (how LIPL-4 raises OEA; LBP-8 to NHR-80 ligand handoff). linkml-validate clean; module_validator passes with two ontology-unavailable warnings (NCBITaxon, UBERON); rendered.
