  summary: 'ThrH family id removed then restored (PR #5927 review)'
  details: |
    Commit 04f03daa removed the PANTHER:PTHR43344:SF2 term from the pseae_thrh_phosphotransfer family descriptor to clear the FAMILY_FUNCTION_UNREVIEWED conformance warning. The PR #5927 re-review correctly objected that the PANTHER id asserts membership, not function, and that dropping it severs the family-review cross-check, so the term is restored exactly as before. The descriptor notes now say the SF2 id records membership and that GO:0043899 is left UNRESOLVED at family level as a ThrH member-level property, so the single FAMILY_FUNCTION_UNREVIEWED warning is expected.
