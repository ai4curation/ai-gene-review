  details: |
    New ModuleReview cytoplasmic_ribosome: 40S (37 units incl. RACK1 and paralogue alternatives) and 60S (50 units incl. tissue paralogues) subunit complexes with structural-constituent function on units holding experimental rows, and rRNA-catalysed peptidyltransferase on the 60S complex. rRNAs are not gene products in this model. Ribosomal proteins are modelled once here for reference by the other translation modules; biogenesis is not assigned to them. RPL41 placed in the 40S following UniProt eS32, conflict with GOA/Complex Portal recorded.
