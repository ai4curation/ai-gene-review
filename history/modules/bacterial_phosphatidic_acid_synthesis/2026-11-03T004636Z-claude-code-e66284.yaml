  summary: Create bacterial de novo phosphatidic acid synthesis module
  details: |
    Created modules/bacterial_phosphatidic_acid_synthesis.yaml (DRAFT, CONCRETE) for projects/LIPID_DIVIDE.md. Boundary ends at phosphatidic acid, where cdp_dag_phospholipid_synthesis, bacterial_phosphatidylglycerol_cardiolipin_biosynthesis and bacterial_phosphatidylethanolamine_biosynthesis all begin (each checked); cross-referenced in notes rather than by module_ref. Two top-level parts: first acylation of glycerol 3-phosphate to lysophosphatidic acid, carrying a ROUTE variant set (ONE_OR_MORE) over the PlsX->PlsY acyl-phosphate route and the PlsB acyl-CoA route, and the PlsC step to phosphatidic acid. PlsX sits inside the PlsY route rather than as a top-level obligatory step, because Xanthomonadales carry PlsB and PlsC without PlsX. Grounded on reviewed UniProt entries from both B. subtilis and E. coli with Rhea ids taken from the flat files; PANTHER labels copied verbatim from interpro/panther/panther.obo; ancestral PTN nodes asserted only where the node IBD matches the annoton function (PTN000046632, PTN000285870) and omitted for PlsX and PlsY. The G1P stereochemistry finding of Rieche et al. 2026 is recorded as a module-level BIOLOGY knowledge gap and in notes, not as a modelled part, variant or function, mirroring the judgement in the plsY and plsC reviews; the module adds that the capability is confined to the PlsY branch since PlsB is strictly G3P-specific. Schema validation and module checks pass with 5 warnings: 4 are unbuilt PANTHER member-index cache notices, and 1 is FAMILY_FUNCTION_UNREVIEWED on PlsB, left deliberately because the PTHR12563 family review leaves GO:0004366 UNRESOLVED.
