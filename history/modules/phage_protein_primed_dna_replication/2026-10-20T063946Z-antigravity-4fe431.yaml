  details: 'Created and validated concrete bacteriophage pathway module MODULE:phage_protein_primed_dna_replication (Bacteriophage
    protein-primed linear dsDNA replication and early-to-late transcriptional switch) with 0 parts and 0 references.


    A reusable module representing protein-primed viral DNA replication and early-to-late transcriptional regulation in linear
    double-stranded DNA bacteriophages with 5''-covalently linked terminal proteins, exemplified by the Gram-positive Salasmaviridae
    podovirus Bacillus phage phi29 (BPPH2) and the Gram-negative internal-membrane Tectiviridae phage PRD1 (BPPRD). Because
    DNA polymerases cannot initiate synthesis de novo, these linear dsDNA phages solve the end-replication problem by using
    a genome-linked terminal protein (TP; phi29 gp3 or PRD1 P8) as a primer. A free TP molecule forms a heterodimer with the
    viral B-family DNA polymerase (phi29 gp2 or PRD1 P1) and is recruited to the inverted terminal repeat (ITR) replication
    origins at both genome ends—a step stimulated in phi29 by the histone-like nucleoprotein p6, early replication factor
    gp17, and membrane-anchoring replication proteins gp1 and gp16.7, and protected from host uracil excision by the uracil-DNA
    glycosylase inhibitor p56 (gene 0.8). The polymerase catalyzes the covalent linkage of the first deoxynucleotide (5''-dAMP
    in phi29 via Ser-232; 5''-dGMP in PRD1 via Tyr-190) to the terminal protein, recovers the terminal template nucleotide
    via a sliding-back (phi29) or jumping-back (PRD1) mechanism, and elongates full-length strands continuously via intrinsic
    strand-displacement synthesis without a replicative helicase while viral single-stranded DNA-binding proteins (phi29 gp5;
    PRD1 P12 and P19) coat and protect the displaced single strands. In phi29, cooperative binding of the transcriptional
    regulator p4 with p6 subsequently flips transcription from the early A2b/A2c promoters to the late morphogenetic A3 promoter.'
