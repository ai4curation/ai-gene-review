  summary: 'Revise SQ catabolism module per PR #4410 bot review'
  details: |
    Address bot review on PR #4410. (1) Set chaining_status: MAPPING_GAP with a chaining_note on the top-level sq_glycoside_hydrolysis -> sq_catabolic_routes connection, recording the alpha->beta anomeric break: sulfoquinovosidase releases 6-sulfo-alpha-D-quinovose (RHEA:70727/49452) while the YihS and SqvD/SftI isomerases consume 6-sulfo-beta-D-quinovose (RHEA:40439); the intervening mutarotase (YihR/SqvB, EC 5.1.3.43, RHEA:59228, per PMID:41676062) has no GO mapping and no UniProtKB entry carrying the activity (E. coli YihR P32139 is still Uncharacterized), so it is not modeled as a part. (2) Grounded 13 additional family descriptors with PANTHER ids verified against the local .cache/panther member index (all representative members confirmed present in the declared family) and panther.obo official labels copied verbatim: sulfoquinovosidase PTHR46959:SF2, YihS PTHR15108, YihT PTHR39340:SF1, YihV PTHR10584:SF157, YihU PTHR22981, ED SQ-DH PTHR43639:SF1, ED SGL-lactonase PTHR10907, ED SG-dehydratase PTHR43183:SF2, ED KDSG-aldolase PTHR30502, ED/SFT SLA-DH PTHR43353/PTHR42991:SF1, SqvD PTHR36120, SqvA PTHR10683, SmoC PTHR42847:SF4, SmoA PTHR30466:SF11, SmoB PTHR43364:SF1. (3) Added PMID:41676062 evidence sourcing the N. aromaticivorans SquD (Q2G5J4) and SquF (Q2G5J3) members, which previously had only PMID:35074914 (an A. tumefaciens paper). (4) Noted in the SmoA family description that the SquD partner reductase is SsuE-type, per PMID:41676062. (5) Quoted the GO:0061722 sulphoglycolysis definition verbatim from OLS (DHAP and pyruvate) to ground the GO:1902777 root choice. (6) Corrected notes: SqvD is modeled (sulfo-SFT), so only SqiK/SqiA are listed as EMP2-specific not-modeled enzymes; added an adjacency paragraph relating the SmoC/SmoA step to the ssued_desulfonation abstract motif without a formal conforms_to (structures differ).
