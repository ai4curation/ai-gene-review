  summary: Create bacterial sulfoquinovose catabolism module with four route variants
  details: |
    New ModuleReview for sulfoquinovose (SQ) catabolism, triggered by the review PMID:41676062. One module with an optional upstream sulfoquinovosidase step (YihQ/SmoI) and a route variant_set (selection ONE_OR_MORE) holding four alternative, biochemically characterized routes: sulfo-EMP (YihS/YihV/YihT/YihU, E. coli K-12, PMID:24463506 and PMID:33791429), sulfo-ED (SQ dehydrogenase, SGL lactonase, SG dehydratase, KDSG aldolase, SLA dehydrogenase; Pseudomonas putida SQ1, PMID:26195800), sulfo-SFT/TAL (SqvD/SftI isomerase, SqvA/SftT transaldolase, SlaB/SftD dehydrogenase; Bacillus megaterium and B. aryabhattai, PMID:33036753, PMID:32919372, PMID:36805128) and the oxidative sulfo-SMO route (SmoC monooxygenase with SmoA flavin reductase, SmoB 6-dehydroglucose reductase; Agrobacterium fabrum C58, PMID:35074914). Rationale for one module rather than four: common input and ecological role, but no route-defining enzyme shared across all routes, so routes are variants with their own ordered parts and connections. All reactions grounded in Rhea (RHEA:40439, 40443, 40515, 40511, 49452, 70727, 47896, 47908, 47912, 47924, 47932, 66716, 70775, 70779, 21620) and all representative members are reviewed or characterized UniProt entries. Where GO lacks a specific MF term (sulfo-ED, sulfo-SFT, SMO, 6-dehydroglucose reductase steps) the nearest existing parent is used with the Rhea reaction as evidence; recorded as an ontology gap in notes. Deliberately excluded: sulfo-ASDO, sulfo-TK, sulfo-EMP2 isozymes, mutarotases, transporters, CsqR regulation, and downstream DHPS/SL/isethionate desulfonation. One knowledge gap: unidentified sulfoquinovosidase in Arthrobacter-type sulfo-EMP organisms.
