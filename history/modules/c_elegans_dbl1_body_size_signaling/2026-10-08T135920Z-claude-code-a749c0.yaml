  summary: 'Create C. elegans module: DBL-1 BMP-like Sma/Mab body size signaling'
  details: |
    New CONCRETE/DRAFT C. elegans SIGNALING_PATHWAY module for the DBL-1 (Sma/Mab) body-size pathway. Seven root parts: DBL-1 G5EEL5 ligand (growth factor activity), LON-2 Q18530 glypican (negative regulator), SMA-10 Q965M2 LRIG receptor-binding enhancer, SMA-6 Q09488 / DAF-4 P50488 receptor kinases, SMA-2 Q02330 / SMA-3 P45896 / SMA-4 P45897 Smads, SMA-9 Q7JM44 Schnurri corepressor, and the repressed target LON-1 Q09566 (process only, MF unknown). LON-8 was checked and excluded because it acts independently of Sma/Mab (PMID:17374156, lon-8 review). Immune, lipid and molting outputs are recorded as out of boundary; GO-CAM gomodel:5b91dbd100002241 (antifungal DBL-1 pathway) linked at node and annoton level. Cross-references MODULE:bmp_signaling and MODULE:tgfb_smad_signaling. Grounded in the dbl-1 and lon-8 gene reviews and 14 cached PMIDs (5 newly fetched); two BIOLOGY knowledge gaps (LON-2 mechanism, direct Smad/SMA-9 targets and LON-1 activity). linkml-validate clean; module_validator passed with 1 warning (NCBITaxon label not checked); all 24 supporting_text quotes verified verbatim; rendered.
