  summary: Create species-independent D-Ala-D-Lac glycopeptide resistance module subsuming
    GO-CAM 671ae02600002832
  details: |
    New ABSTRACT module MODULE:glycopeptide_resistance_depsipeptide at Bacillota + Actinomycetota scope, with eight parts: VanS-VanR induction, VanH D-lactate supply, a ROUTE variant set over the D-Ala-D-Lac (REALIZER: VanA/VanB/VanD) and D-Ala-D-Ser (VanC-type) chemistries, VanX D-Ala-D-Ala depletion, optional VanY trimming, module_refs to peptidoglycan_precursor_biosynthesis#ddl_dipeptide_synthesis and #murF_pentapeptide_ligation, and a reduced-glycopeptide-affinity outcome node. Corrects six defects recorded in gocams/671ae02600002832/671ae02600002832-review.yaml: VanA cytosol not membrane, a single VanR annoton, VanR targets as operon genes, GO:0160237 for VanX, no vancomycin activator on VanS, and continuation past the depsipeptide metabolite. PANTHER ids asserted only for VanX (PTHR43126) and VanY (PTHR34385).
