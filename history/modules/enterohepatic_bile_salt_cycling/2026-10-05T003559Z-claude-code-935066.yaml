  summary: Move curation gaps to notes and complete the two biology gaps
  details: |
    Three edits in response to review on PR 4226.

    Moved the sodium-stoichiometry discrepancy out of knowledge_gaps into notes: Reactome:R-HSA-194187 gives 2:1 while the GO/UniProt description does not commit to a coefficient, which is a curation question rather than a biological unknown. Fixed a participant miscount in the same paragraph.

    Moved the remaining two CURATION-only knowledge_gaps into notes, per the CLAUDE.md rule that a knowledge gap must be closable only by new wet-lab work. The five-unreviewed-participants gap merged into the existing coverage sentence rather than being appended, since the notes already stated the fact; the ABCB11 PANTHER-assignment gap became a new paragraph preserving both the competing assignments and the adjudication, and saying why it sits in notes.

    Added boundary and provenance to the two surviving BIOLOGY gaps, which the gene-level gaps in the same PR already populate. The hepatic-uptake-split gap is anchored to PMID:24867799 (human NTCP deficiency: auxiliary transporters sustain the cycle in its absence); the FABP6 gap is anchored to Reactome:R-HSA-159418, the pathway annotation that is the sole basis for modelling the cytosolic step as required.
