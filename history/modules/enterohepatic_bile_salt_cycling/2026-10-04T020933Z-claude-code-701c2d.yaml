  summary: Add enterohepatic bile salt cycling transport relay module (BSEP/ASBT/FABP6/OSTalpha-beta/NTCP)
  details: |
    New ModuleReview modelling the closed-loop bile salt transport relay as five ordered steps: canalicular export (ABCB11/BSEP), ileal apical reclamation (SLC10A2/ASBT), enterocyte cytosolic shuttling (FABP6), basolateral efflux by the obligate OSTalpha/OSTbeta heteromer (SLC51A/SLC51B), and hepatic basolateral reuptake (SLC10A1/NTCP), with a variant set for the two hepatic uptake routes (sodium-dependent NTCP vs sodium-independent OATP1B1). Ancestral nodes are grounded in newly fetched PAINT data for PTHR10361 (interpro/panther/PTHR10361/PTHR10361-paint.tsv), which shows two distinct sub-branch nodes: PTN002570905 carries GO:0016323 basolateral plasma membrane seeded by rat Slc10a1, and PTN002570923 carries GO:0016324 apical plasma membrane seeded by mouse and rat Slc10a2, with GO:0008508 symport shared at PTN000040761. This independently corroborates the apical/basolateral sub-branch reasoning used in the human SLC10A1 review. Family groundings are at subfamily level where the family spans unrelated activities. ABCB11 had conflicting PANTHER assignments; PANTHER's own classification (PTHR24221:SF165 BILE SALT EXPORT PUMP) was preferred over the UniProt cross-reference (PTHR43394:SF23), and the adjudication is recorded as a knowledge gap.
