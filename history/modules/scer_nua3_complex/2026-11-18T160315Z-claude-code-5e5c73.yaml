  summary: 'Create: NuA3 histone acetyltransferase complex module (S. cerevisiae)'
  details: |
    New concrete PROTEIN_COMPLEX module for NuA3 (GO:0033100). Parts: Sas3 (histone H3K14 acetyltransferase activity, matching the SAS3 review core function), Nto1 (histone binding; scaffold that co-forms the H3 tail cleft), Yng1 (histone H3K4me3 reader activity), Eaf6 (no molecular function assigned; none known in NuA3), Taf14 (histone H3K9ac reader activity, with the caveat that no YEATS role in NuA3 recruitment is known). Variant set for the NuA3a (GO:1990467) and NuA3b (GO:1990468) forms along the targeting axis, with Pdp3 (UniProtKB:Q06188, no gene review) as the NuA3b H3K36me3 reader. Notes record that the inherited part_of chromatin is reasonable because NuA3 acetylates nucleosomal H3. Proposed ontology change: the GO:1990468 definition says Pdp3 binds H3K4me3 instead of H3K36me3 and omits Yng1. Three BIOLOGY knowledge gaps (are NuA3a/NuA3b separate complexes; what controls acetylation of bound nucleosomes; Eaf6 role and Taf14 contacts). Validated with linkml-validate, module_validator (0 warnings, all reviewed annotons CORE_SUPPORTED) and quote_check.
