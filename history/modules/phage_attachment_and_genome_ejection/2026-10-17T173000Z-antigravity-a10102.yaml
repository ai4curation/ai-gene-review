      Created modules/phage_attachment_and_genome_ejection.yaml modeling bacteriophage host receptor recognition (GO:0019062 virion attachment to host cell, including reversible adhesion GO:0098671 and irreversible entry receptor attachment GO:0098670) coupled to a VariantSetDescriptor (genome_ejection_mechanism) for genome delivery across the bacterial envelope: (1) myoviral contractile tail sheath contraction, baseplate hub/spike peptidoglycan puncture, and tail tube translocation (GO:0099000, GO:0098932; T4, Mu, P2); (2) siphoviral long flexible non-contractile tail and tape-measure/tip channel formation (GO:0099001; lambda, T5); (3) podoviral short tail and ejectosome internal core channel assembly (GO:0099002; T7, P22); and (4) pilus-retraction, DNA pilot tube, or membrane-fusion entry in non-tailed phages (GO:0039666, GO:0044694, GO:0019064; M13, phiX174, phi6). Validated against ModuleReview schema and PANTHER member index.
