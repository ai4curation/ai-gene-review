  summary: 'Create module: bacterial_pamp_lrr_receptor_signaling (FLS2/EFR-BAK1 PTI)'
  details: |
    New concrete Arabidopsis module for bacterial PAMP perception by LRR-RK PRRs, built for ARATH corpus genes with no module (PR #5014). Part 1: receptor complex with a prr_ligand variant set (FLS2 flg22: GO:0038187 + GO:0004675; EFR elf18: GO:0019199, matching each gene review) and the BAK1 co-receptor (GO:0004675, as in brassinosteroid_signaling). Part 2: BIK1 (GO:0004674) -> RBOHD (GO:0016175) ROS branch. Part 3: MAPKKK3/5 -> MKK4/MKK5 -> MPK3/MPK6 relay conforming to mapk_relay (MAP3K grounded on MAPKKK5 per PMID:29871986; Asai 2002 MEKK1 assignment superseded). Shared downstream steps duplicate chitin_perception deliberately, with identical MFs from the same gene reviews. FER kept as a regulator in notes and a knowledge gap (scaffold of FLS2/EFR-BAK1 assembly, PMID:28104890 fetched; FER review treats immunity as non-core). FRK1 excluded as a transcriptional readout with no characterized activity. PBL1 named in notes only, matching chitin_perception. All supporting_text verified by module_validator; no PANTHER ids asserted; no production GO-CAM contains these proteins.
