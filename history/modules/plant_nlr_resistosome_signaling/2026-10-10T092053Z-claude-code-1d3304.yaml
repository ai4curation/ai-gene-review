  summary: Address review findings on plant NLR resistosome module
  details: |
    Review-response revision (PR #4413). (1) eds1_rnl_modules variant selection EXACTLY_ONE -> ONE_OR_MORE: PMID:34099661 concludes 'two distinct modules (NRG1/EDS1/SAG101 and ADR1/EDS1/PAD4) mediate TNL receptor defence signalling'; its 'exclusive ... co-functions' is about partner pairing (NRG1 binds EDS1-SAG101 but not PAD4), not mutually exclusive relays, and one activated TIR makes both nucleotide classes (PMID:35857645, PMID:35857644). The earlier history record for this module cites that paper as 'exclusive ... modules'; that phrasing tracks the abstract but was over-read as branch exclusivity. Exclusivity is now stated in the part description and variant-set axis as partner/ligand pairing. (2) GO:0035872 taxon-constraint claim verified against QuickGO (2026-10-10): the term carries three never_in_taxon constraints only (Bacteria NCBITaxon:2, Archaea NCBITaxon:2157, Fungi NCBITaxon:4751) and no only_in_taxon Metazoa, so plant applicability holds but 'carries no taxon constraint' was inaccurate and is corrected; also recorded that QuickGO returns no exact or descendant annotations to GO:0035872 for plant taxa, so the plant usage is a module-level concept mapping. (3) Reviewer suggestions applied: TIR NADase term name reconciled with the modelled messengers in the RPP1 role_description; GO:0005262 vs GO:0005261 cation-channel-parent question recorded in notes with the PMID:33984278 / PMID:34140391 wording; GO:0140375 definition quoted to justify ZAR1 despite RKS1 being the recognition surface, contrasted with GO:0140299 which does require binding the sensed molecule; boundary note now states that pathogen effectors are not modelled as annotons.
