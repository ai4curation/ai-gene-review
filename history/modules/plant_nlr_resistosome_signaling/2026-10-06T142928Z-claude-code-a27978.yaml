  summary: Create plant NLR resistosome signalling module from the 2026 Plant J plant
    NLR review
  details: |
    Created modules/plant_nlr_resistosome_signaling.yaml with three root parts: effector recognition and resistosome assembly, resistosome output chemistry, and the optional EDS1/helper-RNL second-messenger relay.

    Trigger: PMID:41614442 (Maruta, Sorbello, Garzon-Flores, Kobe; Plant J 2026). Primary grounding: PMID:30948526 and PMID:30948527 (ZAR1 inactive/intermediate states, pentameric resistosome, alpha-1 funnel), PMID:33984278 (ZAR1 resistosome is a Glu11-dependent calcium-permeable cation channel), PMID:33273071 (RPP1 tetramer required for NADase activity, two asymmetric TIR active sites), PMID:33273074 (ROQ1 tetramer, direct XopQ recognition), PMID:35857645 (pRib-AMP/pRib-ADP activate EDS1-PAD4 and select ADR1), PMID:35857644 (ADPr-ATP/di-ADPR select EDS1-SAG101-NRG1A), PMID:34140391 (helper RNLs are Ca2+-permeable cation channels by voltage clamp), PMID:34099661 (exclusive EDS1-SAG101-NRG1 and EDS1-PAD4-ADR1 modules).

    Boundary decision: one module with variant sets rather than separate CNL and TNL modules, because both branches share LRR recognition, the NB-ARC nucleotide switch and oligomerisation, and converge on Ca2+ influx. The N-terminal domain class is the variation axis. Part 3 is optional since it is reached only from the TIR variant.

    Accession grounding was done by lookup, not from the review prose, and two traps are recorded: UniProt gene_exact ZAR1 in A. thaliana also returns Q9ZU46 (ZYGOTIC ARREST 1, unrelated kinase), and RKS1 also returns Q9ZT07 (a lectin receptor kinase); the correct accessions are Q38834 and Q9SVY5. NRG1.1 is Q9FKZ1 (At5g66900), established from the construct description in PMID:34099661 because a UniProt gene-name search for NRG1 does not retrieve it.

    Kept as prose in notes rather than asserted: NRC networks (hexameric resistosomes, AVRcap1b inhibition, inositol-phosphate cofactor) because the key reports are preprints cited by the review and N. benthamiana NRC2 has no reviewed accession; Sr35, MLA13 and CCG10-NLR architectures; 2'cADPR, which is a TNL activation biomarker but does not itself activate EDS1 complexes; NRG1C, which is negative regulation of part 3.

    Calcium-channel activities on ZAR1, ADR1 and NRG1.1 are asserted at module level from electrophysiology and are explicitly flagged as not currently in GOA; whether they should become gene annotations is left to the respective gene reviews rather than proposed here. All supporting_text strings were checked verbatim, and quotes from the abstract-only cached papers were taken from the abstract.
