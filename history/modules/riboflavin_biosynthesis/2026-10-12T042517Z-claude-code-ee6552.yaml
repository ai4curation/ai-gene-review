  summary: Document shared PTHR21327 subfamilies between RibA and RibB selectors
  details: |
    PR review noted the RibA (GTP cyclohydrolase II) and RibB (DHBP synthase) selectors overlap on PTHR21327 SF18/SF48/SF39. PANTHER 19.0 SF18 contains monofunctional GTP cyclohydrolase II (P. putida ribA Q88QH1, E. coli ribA P0A7I7), monofunctional DHBP synthase (yeast RIB3 Q99258, S. pombe O60181) and bifunctional B. subtilis ribBA (P17620); SF48 is plant bifunctional RIBA1. Added description caveats on both family descriptors (following the heme CgoX precedent) stating that subfamily membership does not discriminate the two activities. No ids changed. Re-rendered pages/modules/riboflavin_biosynthesis.html.
