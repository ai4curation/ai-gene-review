  summary: 'Create module: JAK-independent STAT signaling in C. elegans'
  details: |
    New concrete C. elegans ModuleReview with two STAT-paralog pathway variants. (1) STA-1 intestinal antiviral repression: SID-3 (Q10925) non-JAK tyrosine kinase input, then STA-1 (Q9NAD6) promoter-bound repressor. (2) STA-2 epidermal AMP induction: PMK-1 (Q17446) p38 and MUP-4 (Q21281) hemidesmosomal sequestration inputs, then STA-2 (Q20977) with SNF-12 (O45813), then NLP-29 (O44664) output. Notes contrast the module with MODULE:jak_stat_signaling (no JAK, no receptor-JAK docking, GO:0007259/GO:0046426 not applicable). GEI-17 is an open question only. OpenScientist module deep research was run and used for retrieval only; claims were checked against cached primary papers, and 8 new PMIDs were fetched and title-checked. sta-1 UniProt/GOA fetched via just fetch-gene (stub review only). Added a one-line taxon pointer to modules/jak_stat_signaling.yaml. Validated with linkml-validate, module_validator (2 expected warnings) and render-module.
