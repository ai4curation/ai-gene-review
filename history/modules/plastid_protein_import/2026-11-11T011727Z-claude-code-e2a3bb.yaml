- type: EDIT
  outcome: changed
  summary: Add stromal motor partners, Tic236 and the remaining TIC subunits
  details: |
    Added cpHsc70 (PTHR19375:SF512) to the required stromal motor step beside ClpC, typed with the ATP hydrolysis F IBD because the PTHR19375 family review leaves folding unresolved; Tic236 (PTHR34457:SF3) as a required TOC-TIC linker; and as optional parts Hsp90C (PTHR11528:SF54; stroma node only at Magnoliopsida), FtsHi1 (PTHR23076:SF111; protease node not cited), Tic56 (PTHR37755:SF1), Tic100 (PTHR43215:SF13), Tic21 (PTHR34548:SF2), Tic22 (PTHR33926:SF4), and Tic62, Tic32 and Tic55 (PTHR47285:SF1, PTHR48476:SF1, PTHR21266:SF29). cpHsc70, Hsp90C and FtsHi subfamily placements come from PANTHER's Arabidopsis classification file; Tic100 and Tic32 disagree between UniProt and PANTHER's files, recorded in their notes. Per-genome failures recomputed from the entries tables. Families PTHR37755, PTHR43215, PTHR34548, PTHR47285, PTHR48476, PTHR33926, PTHR34457 and PTHR23076 fetched with their PAINT tables. After review: Tic62, Tic32 and Tic55 are three separate optional parts rather than one conjunctive node; Tic62 also records the thylakoid membrane location its node supports, and the inferred inner-membrane locations are marked as such; the 1-MDa subunits and Hsp90C connect by PART_OF and the redox proteins by POSITIVELY_REGULATES; Tic22 connects forward to the TIC channel; the description names Tic236 and cpHsc70.
