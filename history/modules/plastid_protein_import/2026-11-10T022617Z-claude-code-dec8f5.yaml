- type: CREATE
  outcome: changed
  summary: Create Viridiplantae plastid protein import rule module
  details: |
    New BIOLOGICAL_PROCESS rule module scoped to Viridiplantae with Arabidopsis representatives: Toc34-type receptors (PTHR10903 SF149, SF172), Toc159-family receptors (SF120, SF135, SF68), the Toc75 channel (PTHR12815:SF42) and the ClpC stromal motor (PTHR11638:SF155) required; Tic214 (PTHR33163:SF40) optional. PAINT nodes cited where the protein's QuickGO IBA rows cite them; molecular functions only from positive F IBDs, and Toc75 left untyped. Tic20, Tic110, Tic40 and the stromal processing peptidase are listed as not modelled (no local PANTHER entry). Scope narrowed to Embryophyta after review: Chlamydomonas TOC34 (A8HYJ1) is in PTHR10903:SF135 with the Toc159-family receptors, and the process-level PAINT nodes are at Embryophyta. Selector notes now list the non-Arabidopsis members actually present locally (pea, rice, tomato, Physcomitrium, algal ClpC) and the AtMg00370 member of the Tic214 subfamily. The notes restore the false-negative caveat for the Toc34 step, which only Arabidopsis and pea satisfy locally; the Tic214 note counts 73 land plants plus the charophyte Zygnema. Added after the user's review: Tic20 (PTHR33510:SF9) and Tic110 (PTHR34935:SF3) as a required inner-envelope step, Tic40 (PTHR47296:SF1) as optional, and the stromal processing peptidase (PTHR43690:SF33, membership only) as required; the earlier note wrongly said SPP had no local entry. The three new families were fetched into interpro/panther with their PAINT tables. The ClpC note records that PANTHER's release-19 files place CLPC1 in PTHR43572:SF8. After review: the SPP evidence statement names the Arabidopsis protein (a generator bug had written human), the optional Tic214 and Tic40 nodes are connected, the notes say Arabidopsis is the only local genome meeting every required step, and the Tic20 and Tic110 notes describe the family-level node and the inferred Tic110 location.
