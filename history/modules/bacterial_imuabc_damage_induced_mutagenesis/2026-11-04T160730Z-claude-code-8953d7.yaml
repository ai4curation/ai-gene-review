  summary: Generalize the ImuAB-DnaE2 module across lineages and promote to COMPLETE
  details: |
    Made the module species-neutral (scope ABSTRACT) on the strength of experimental cassette genetics in three distant lineages: Caulobacter crescentus (PMID:15886391), Mycobacterium tuberculosis (PMID:20615954) and Pseudomonas (PMID:17331811, PMID:28118378, PMID:37625357); KT2440 is retained as one exemplar of three. Modelled the accessory step as a REALIZER variant set, because actinobacteria have no ImuA homolog and use the non-orthologous ImuA' (Rv3395c) instead; the proteobacterial variant is grounded on two InterPro families (IPR047610, IPR017026) with no PANTHER id, since PTHR35369:SF3 does not cover the Caulobacter protein. Added PANTHER subfamily family_terms for the ImuB (PTHR35369:SF2) and DnaE2 (PTHR32294:SF4) roles so the new family reviews are linked; adopted the symbol-first representative_member labels of open PR #5076 and added Caulobacter and M. tuberculosis exemplars. No molecular function is asserted for either accessory protein: none has been demonstrated, and both gene reviews carry MF_DARK gaps. Kept GO:0019985 rather than GO:0042276 module-wide because P. putida DnaE2 is an anti-mutator for stationary-phase base substitutions. Validation: linkml-validate -C ModuleReview clean; module_validator passed with 2 pre-existing prefix warnings; module QC recommended-field compliance 100/100, no conformance violations, no ungrounded leaves, gene-review completeness 11/11; render-module regenerated the page; git diff --check clean.
