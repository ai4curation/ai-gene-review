- type: EDIT
  outcome: changed
  summary: Fold module deep research into neural ectoderm AP specification
  details: |
    Ran module deep research (falcon) after the module was drafted, then folded its findings back in. The report independently reached the same boundary decisions - neural induction, neural plate border specification, neuromesodermal/spinal-cord specification, isthmic-organizer signalling and the later regional programs all treated as separate - which is corroboration rather than new content. Three substantive refinements were adopted. (1) The two selector repression arms are no longer described symmetrically: GBX2 restriction of OTX2 has loss- and gain-of-function support in vivo, whereas the reciprocal arm rests on complementary domains and reciprocal mutant phenotypes rather than demonstrated occupancy, and each connection now says which it is. (2) The selector boundary is described as positioning and refining organizer competence rather than as a sufficient linear switch, since FGF8 can be initiated in neuroectoderm lacking both selectors in some contexts; the chick timing (domains separate at HH4-HH8, overlapping at HH9, mutually exclusive by HH10) is recorded so the partition reads as contact-dependent sharpening of independently established domains rather than an instantaneous toggle. (3) The Deuterostomia scope is kept but qualified: the otx/gbx/hox topography extends further, into the annelid Platynereis dumerilii, while the lineage-restriction claim that distinguishes this module from progressive posteriorisation has been demonstrated only in mouse and human pluripotent-stem-cell models, and comparable expression domains are not by themselves evidence of homologous lineage restriction. Five knowledge_gaps added, each scoped to a named part or connection: the existence of a transient pan-brain progenitor, the directness and symmetry of OTX2-GBX2 repression, whether FGF and retinoic acid are instructive or permissive, what establishes the initial domains before contact, and whether the divergent chromatin landscapes cause commitment or correlate with it.
