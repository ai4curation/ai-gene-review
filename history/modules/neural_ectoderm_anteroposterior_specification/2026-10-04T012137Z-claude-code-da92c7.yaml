  summary: Drop an unsourced organizer-competence framing from the selector part
  details: |
    Review-response edit on PR #3130, closing the last suggestion on an approved PR.

    The preceding commit narrowed the FGF8 evidence statement to match its source - which says Otx2 and Gbx2 'may serve to refine rather than induce the expression of FGF8' - and added a note saying explicitly that the claim is about FGF8 expression and not about organizer competence. But the node description's opening clause still read 'It positions and refines organizer competence rather than being a sufficient linear switch', so the part asserted in prose the very framing that the note a few lines below ruled out. That is a self-contradiction introduced by fixing one end of the sentence and not the other.

    Now reads 'It positions the organizer rather than being a sufficient linear switch for it'. The positioning claim is well sourced - the border relocation experiment in PMID:10490024 is quoted on the connection evidence - and the competence framing, which had no source once the FGF8 result was correctly scoped, is gone rather than left standing unsourced.

    No curation judgment changes and no evidence entries are touched. Two items remain deliberately deferred to a separate PR as src/ changes, both recorded in the 2026-10-04T011422Z record: a duplicate-key-detecting loader for module documents, and an evidence_list call in the descriptor_chip macro so TaxonDescriptor evidence reaches the rendered page.
