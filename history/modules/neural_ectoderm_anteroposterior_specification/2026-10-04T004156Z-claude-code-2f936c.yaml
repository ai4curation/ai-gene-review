  summary: Reframe the GBX2 boundary knowledge gap as a knowledge claim
  details: |
    Review-response edit on PR #3130. The GBX2/GO:0030917 knowledge gap added in the preceding record stated its significance as a repository-consistency problem (the module asserts a term that GBX2's gene review does not). That is true but is bookkeeping, not the knowledge gap.

    Restated around what is actually unknown: which of the two selectors positions the isthmic organizer. The experiment usually cited settles it less cleanly than it looks - ectopic GBX2 inside the caudal OTX2 domain shifts the border and relocates the organizer, which shows GBX2 is sufficient to move the boundary, but the readout is the OTX2 border, so the result is equally consistent with GBX2 acting only to restrict OTX2 while the position remains a property of the OTX2 domain. Mouse Gbx2 carries GO:0030917 by IMP (PMID:16651541) on its own null phenotype, so GO treats both as boundary-positioning genes. The repository inconsistency is kept as the closing clause rather than the premise.

    The rendered page is unchanged by this edit, which is correct: knowledge_gaps are not rendered into the module page body, only into the QC panel's recommended-field counts, and rewording a significance field changes no count.
