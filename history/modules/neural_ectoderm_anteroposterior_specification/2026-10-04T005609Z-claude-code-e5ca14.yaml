  summary: Source the module's four comparative claims; correct the chick staging
  details: |
    Review-response edits on PR #3130, closing the blocking finding and the standing source_id suggestion.

    Blocking: an uncited PMID. The GBX2 knowledge gap added in the preceding round cited PMID:16651541 for mouse Gbx2's GO:0030917 IMP, taken from QuickGO output without fetching the paper. No validator sees a PMID in a free-text significance field, so nothing caught it. Now fetched and read: Waters and Lewandoski 2006, 'A threshold requirement for Gbx2 levels in hindbrain development', which is the right paper and does support the term. Reading it also corrected the gap's own wording - the paper's experiments use a hypomorphic allele reducing Gbx2 to 6-10% of normal, not the null, and the phenotype cited is conversion of anterior r1 to isthmus-like tissue. The gap now says that, with two verbatim provenance quotes.

    The four comparative claims now carry source_id. They were deferred twice on the grounds that they needed verbatim-checkable sources rather than a rushed pass; the deep-research file named real primaries, which were resolved by DOI to PMIDs, fetched, and read.

    - Comparative otx/gbx topography (context.taxa): PMID:42760324 for the hemichordate-to-mammal span, quoted verbatim, plus a second entry recording that the per-species list is from the article's figures and not its abstract. PMID:21210944 (Steinmetz et al. 2011) for the Platynereis pattern, two verbatim quotes. The scope wording is tightened: Platynereis is a protostome and the paper argues for an ancestral protostome ground pattern of segmental identities, which is a claim about topography, not lineage.
    - Chick selector staging (ap_selector_boundary): PMID:35401126 (Hidalgo-Sanchez et al. 2022), two verbatim quotes - and this one found a factual error. The module said the domains are 'separate at HH4-HH8'. The primary says they are not contiguous at HH8 with a small gap, overlap slightly at HH9, and are contiguous and exclusive at HH10; at HH4 Otx2 and Gbx2 are simply observed in the rostral and caudal portions of the embryo. The HH4 separation claim came from the deep-research summary's 'separated at HH4-8', which compressed the source wrongly. Corrected to follow the primary.
    - FGF8 without the selectors (ap_selector_boundary): PMID:23307071 (Dworkin and Jane 2013), verbatim - FGF8 is still observed within the neuroectoderm in the absence of both factors, which is why the part is not modelled as a sufficient linear switch.
    - WNT exclusion (posteriorising_signal_input): this one cannot be quoted. The in-vivo reporter observation is in PMID:42760324's figures and that record is abstract-only here, with no mention of WNT in the abstract. Cited with an explicit notes disclaimer and flagged in the part notes as the module's weakest-sourced statement, rather than left unattributed or dropped.

    All six new verbatim quotes pass the module validator's supporting-text check and all four titles match their cached records.
