- type: CREATE
  outcome: changed
  summary: 'Create module: neural ectoderm anteroposterior specification'
  details: |
    New DEVELOPMENTAL_PROCESS module grounded in GO:0021999, filling the gap between germ_layer_specification (which stops at SOX2-positive neural ectoderm and the BMP neural/epidermal switch) and cerebellum_development (which starts at the isthmic organizer with GBX2 and FGF8 already in place). Prompted by PMID:42760324. Three parts: (1) posteriorising_signal_input, the combinatorial FGF plus retinoic acid input (FGF8, ALDH1A2), deliberately excluding WNT because WNT at this stage specifies TBXT/CDX2 neuromesodermal and spinal cord progenitors rather than hindbrain, and posterior neural ectoderm is induced under WNT inhibition; (2) ap_selector_boundary, an EXACTLY_ONE variant set over anterior (OTX2) and posterior (GBX2, HOXA1) neural ectoderm with reciprocal NEGATIVELY_REGULATES connections, grounded in GO:0030917 - the same term proposed as a NEW annotation in the OTX2 review; (3) committed_regional_output, an EXACTLY_ONE variant set over FOXG1/SIX3/EN1 forebrain-midbrain progenitors and MAFB/HNF1B/HOXA3 rhombomere 5/6 progenitors, which exists to make the paper's commitment claim modelable. Scope set at Deuterostomia rather than Vertebrata because mutually exclusive otx/gbx ectoderm is present in the hemichordate Saccoglossus kowalevskii. All leaf annotons ground to verified human UniProt accessions; module_qc reports no leaf grounding gaps. Gene reviews exist for OTX2, GBX2, SOX2, FGF8 and EN1; ALDH1A2, HOXA1, FOXG1, SIX3, MAFB, HNF1B and HOXA3 are not yet reviewed.
