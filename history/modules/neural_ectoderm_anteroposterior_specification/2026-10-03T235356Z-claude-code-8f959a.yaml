  summary: Drop the SOX2 process assertion from the neural ectoderm AP module
  details: |
    Review-response edit on PR #3130.

    The ne_sox2 annoton carried GO:0021999 neural plate anterior/posterior regionalization as a process term. Removed. The module-level concept is grounded on GO:0021999 and the module's root node keeps it, because the module is that regionalization; but SOX2 marks the neural ectoderm population being subdivided rather than doing any of the subdividing, so asserting the process on that participant claims work it does not perform. The annoton keeps GO:0005634 nucleus and a role_description that states the omission and the reason, so a reader of the rendered page sees why the slot is empty rather than reading it as an oversight.

    The module page was re-rendered for this single module (ai-gene-review render-modules on the one file, not --all: render_all_modules calls a destructive clean_module_html first, which on a branch that is otherwise byte-identical to main on pages/** would delete every page main has generated since).

    Deferred, with reasons. The four comparative claims in the module description still carry no source_id; they need verbatim-checkable sources rather than a rushed pass. And the module asserts GO:0030917 midbrain-hindbrain boundary development for GBX2 while the GBX2 gene review has no occurrence of that term - a real asymmetry, but GBX2's curation is a separate gene's review and not this PR's to change; recorded as a knowledge gap instead.
