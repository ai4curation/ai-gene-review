  summary: Merge a duplicate evidence key that was discarding three sourced quotes
  details: |
    Review-response edit on PR #3130, fixing a defect introduced by the preceding record's own commit.

    The duplicate key. The ap_selector_boundary node mapping ended up with two evidence: keys at the same indent - the three new entries added for the source_id pass, and the pre-existing deep-research card further down. A YAML mapping cannot hold a repeated key, and yaml.safe_load keeps the last and discards the first with no warning and no error, which is how the repo loads modules. So the three quotes for the chick staging and the FGF8 result were absent from the loaded document, and absent from the rendered page, while every validator reported success. Confirmed before and after: safe_load returned one node evidence entry (the deep-research card) and the rendered page contained zero occurrences of 35401126 or 23307071. Now merged into a single list; safe_load returns five entries and both PMIDs appear on the page.

    The point worth keeping. The preceding commit's notes section 9 recorded that an error survived because no validator can check a claim in prose. This was the same failure one layer lower: no validator can check a key the parser threw away before validation started. The sourcing pass's own 'all six quotes pass the supporting-text check' was true but vacuous for three of them, since they never reached the checker.

    Scanned for the same hazard rather than assuming it was unique, with a duplicate-key-detecting SafeLoader subclass: 376 module files, 5546 gene reviews, and 3150 gocam/history/family review files all clean. This was a one-off introduced here, not a latent repo-wide condition. A duplicate-key check belongs in the shared module loader so the class of defect becomes a hard error, but that is a src/ change and is raised for a separate PR rather than widened into this one.

    Three review suggestions taken in the same pass.
    - The FGF8 gloss was wider than its source. The primary says Otx2 and Gbx2 'may serve to refine rather than induce the expression of FGF8'; the node description had claimed they refine organizer competence, dropping both the hedge and the scope. FGF8 expression is the organizer's signal, not its competence. Narrowed in the description and in the statement.
    - The independent-establishment claim now rests on a sentence that states it, rather than on an inference from the staging quotes: 'Otx2- and Gbx2- expressing domains are firstly established independently of each other, with antagonistic interactions between them as development proceeds to create the Otx2/Gbx2 MH interface'.
    - Both node sources are reviews citing a further primary, which is now said in notes: the staging is attributed by its source to Garda et al. 2001 and the independence claim to Li and Joyner 2001, so a reader can see the chain stops one hop short. The FGF8 result is attributed to the source's numbered reference 24, which the cached record does not resolve because the PMC HTML fallback dropped the reference list; the underlying experiment is left unnamed rather than guessed.

    Also recorded: the same paper is internally in tension on HH4, its Figure 3 legend calling the domains contiguous and complementary at all analysed stages while the body text gives the HH8 gap. The module's wording is deliberately safe against both readings and the notes now say so.

    Known and not fixed here: TaxonDescriptor evidence is loaded and validated but never rendered, because the descriptor_chip macro in module.html.j2 makes no evidence_list call (verified: zero such calls in that macro, against ten elsewhere in the template). The four taxa quotes are therefore real data and pass validation, but do not appear on the published page. That is a shared-template change affecting every module and is raised separately.
