  summary: Source the GBX2 annoton's hindbrain-competence clause
  details: |
    Review-response edit on PR #3130, closing an optional suggestion on a non-blocking pass.

    The pne_gbx2 annoton's role_description claimed GBX2 'confers hindbrain competence' and its processes block asserts hindbrain development, but its single evidence entry was PMID:10490024, which covers Otx2 repression and organizer positioning and does not reach the hindbrain claim. The parallel ane_otx2 annoton did have matching evidence for its forebrain/midbrain competence clause (PMID:7588062, the absence of forebrain and midbrain regions in the null), so the two selectors were asymmetrically supported. The clause was uncontroversial and true but unsourced, which is the same shape as the organizer-competence framing removed in the preceding record - except that here the fix is additive, because the supporting paper was already cached by this PR.

    Two evidence entries added on pne_gbx2, both from PMID:16651541:
    - the requirement itself, quoted verbatim: in the null, rhombomeres 1-3 fail to develop and isthmic Fgf8 is reduced and disorganized.
    - the dose-graded form from the paper's own experiments, quoted verbatim: reduced Gbx2 expression supports r3 but not r2.

    Described at the right strength, which is the same care the earlier citation of this paper needed: the r1-r3 result is the null phenotype, which the paper reports as background, while its own experiments are a hypomorph reducing Gbx2 to 6-10% of normal. The notes on the first entry say so, and the statements avoid presenting a single all-or-none null result.

    One schema correction made in passing: the entries were first written with reference_section_type and full_text_unavailable, which belong to SupportingTextInReference and not to EvidenceItem. linkml-validate rejected them and they were removed; the knowledge-gap provenance entries, which are SupportingTextInReference, legitimately carry both.

    The paper now has two homes in the module - this annoton and the GBX2 knowledge gap - and appears on the rendered page for the first time.

    The two src/ deferrals are carried forward unchanged: a duplicate-key-detecting loader for module documents, and an evidence_list call in the descriptor_chip macro so TaxonDescriptor evidence and knowledge-gap provenance reach the published page.
