  summary: Create eukaryote-wide COPI coat assembly rule module
  details: |
    New ModuleReview grounding Arf1 activation by GBF1/Gea and the seven coatomer subunits on PANTHER families or subfamilies with human representatives (beta' and alpha with their Arabidopsis subfamilies), PAINT ancestral nodes shown to be ancestors of each human protein (by IBD seeds or IBA rows, the latter from QuickGO for coatomer beta and epsilon), and molecular functions from the human coatomer gamma and delta reviews or the node's F IBD (GBF1; Arf1 typed GTP binding per the PTHR11711 family review). A fission-yeast IRD in the alpha/beta' family is bounded; selector caveats (Arf family over-match, no Dictyostelium GBF1 subfamily member, Dictyostelium TSET TstD in the zeta family) are recorded on the families. Part of the organelle lifecycle project (projects/ORGANELLE_LIFECYCLES.md).
