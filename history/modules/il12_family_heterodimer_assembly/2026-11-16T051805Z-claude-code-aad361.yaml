  details: |
    Created modules/il12_family_heterodimer_assembly.yaml, the mechanism behind the IL-12, IL-23, IL-27, IL-35 and IL-30 production terms (5 production and 12 regulation terms) identified by the curated classification in projects/PRODUCTION_TERMS.md. Three parts: ER retention of the unpaired subunit (calnexin holding EBI3, with no molecular function asserted because GO's generic chaperone and unfolded-protein-binding terms are obsolete and an unpaired subunit is unassembled rather than misfolded); competitive pairing as a ROUTE variant set over the four pairings, each variant carrying its partner subunit and its assembled complex; and an optional arm for the unpaired shared subunit, where the mouse p40 homodimer acts as an IL-12 antagonist, so failed assembly produces an inhibitor rather than nothing. Needs no new GO term: GO already has the four complex terms. Two knowledge gaps: whether anything beyond mass action selects which partner the shared chain takes, and whether free alpha subunits signal. Evidence from four cached Reactome events plus two newly cached publications whose PMIDs were confirmed against PubMed. Validated: linkml-validate clean; module_validator passes with zero warnings; 15/15 quotes verified; renders at 100 percent recommended-field compliance.
