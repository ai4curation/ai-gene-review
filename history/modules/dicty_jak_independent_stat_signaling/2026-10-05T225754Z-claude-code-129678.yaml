  details: |
    Added file: evidence for the six new gene reviews and verified PANTHER subfamily context to notes. Pyk2 annoton: added GO:1903013 and GO:0006972 processes. Pyk3: added GO:0006972, cytosol location, and PMID:25143406 evidence that the isolated KI domain phosphorylates STATc Y922. PTP3: added GO:0035335 and PMID:24587195 constitutive-activity evidence. Phg2: role_description notes the STATc role is non-core per the phg2 review. DrkA: added membrane location and PMID:31002205 overexpression evidence. GskA: added GO:0046827, nucleus and cytoplasm; notes explain gskA is not placed in other dicty modules because none model its cell-fate or chemotaxis roles. MFs already matched the gene reviews. Knowledge gaps unchanged (pyk3 strain discrepancy remains open in the pyk3 review).
