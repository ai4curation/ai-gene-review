  summary: Create Dictyostelium JAK-independent STAT signaling module (STATc and STATa
    variants)
  details: |
    New concrete ModuleReview modules/dicty_jak_independent_stat_signaling.yaml. Boundary: STAT transcription factors activated without JAK in D. discoideum, as two coexisting paralog variants (ONE_OR_MORE). STATc variant: Pyk2 (P18161) and Pyk3 (Q54I36) TKL tyrosine kinases (GO:0004713), PTP3 (P54637, GO:0004725) phosphatase gate inhibited by Phg2 (Q54QQ1, GO:0004674), STATc (Q54BD4, GO:0000981). STATa variant: cAR1 (P13773, GO:0001646), candidate kinase DrkA (Q54H46, GO:0004713), STATa (O00910, GO:0000981) with GskA (P51136) export, CudA (O00841) output. Module concept GO:0097696; GO:0007259 deliberately absent; GO:0007260 withheld because it is part_of GO:0007259 (TPV-003 prerequisite). STATb/STATd left as knowledge gaps. Cross-references dicty_dif1_response_prestalk_patterning (STATc as parallel DIF-1 effector, shared ecmA output) and dicty_extracellular_camp_relay (cAR1 reused, G-beta-independent). OpenScientist module deep research run (retrieval only); new PMIDs cached: 11245573, 11319871, 11356026, 18657170, 18840649, 21933174, 22365144. Validated with linkml-validate, module_validator and render-module.
