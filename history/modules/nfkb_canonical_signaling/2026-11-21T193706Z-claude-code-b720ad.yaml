  summary: Add NEMO and functions for IKK, IkappaB and NF-kappaB
  details: |
    Signaling-module review pass. The IKK step had no regulatory subunit; added IKBKG/NEMO (UniProtKB:Q9Y6K9) with GO:0031593 (IDA in GOA, parent of its K63 and linear chain binding terms). Narrowed the IKK family function to IkappaB kinase activity (core for IKBKB), added protein sequestering activity to NFKBIA (IDA in GOA), and transcription factor activities to the p50 and RELA units. The TRAF2 annoton is left without a function. Schema and module validator pass; remaining warnings are family-review coverage and PANTHER member-index notices.
