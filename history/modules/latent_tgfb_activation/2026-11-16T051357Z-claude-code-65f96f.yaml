- type: CREATE
  outcome: changed
  summary: 'Create module: latent TGF-beta activation'
  details: |
    Created modules/latent_tgfb_activation.yaml, the second-ranked mechanism from the curated classification in projects/PRODUCTION_TERMS.md (4 production and 12 regulation terms). Three parts: furin cleavage of the proprotein into LAP and mature growth factor, which do not physically separate; anchoring of the small latent complex, as a REALIZER variant set over the LTBP matrix anchors (LTBP1/3/4, excluding LTBP2 which does not bind latent TGF-beta) and the GARP cell-surface anchor; and integrin- and force-dependent release by an ITGAV heterodimer with ITGB6 or ITGB8. Ends with an explicit released-active-TGF-beta annoton so the module terminates in a product. Proposes a new term, latent transforming growth factor beta activation, under GO:0051604 protein maturation: GO has no process term for this step, only the three production terms and their regulation children, although it does model the structure as GO:0038045. Two knowledge gaps: which activation route dominates in a normal tissue (thrombospondin-1, plasmin and MMPs versus integrin force), and whether TGF-beta2 and TGF-beta3 are activated the same way given that TGF-beta2 lacks the RGD motif. Thrombospondin-1, plasmin, MMPs and low pH deliberately not modelled as route variants. Evidence from publications already cited by the TGFB1 and LRRC32 reviews plus three cached Reactome events; no new fetches. Validated: linkml-validate clean; module_validator passes with one warning (NCBITaxon label not checkable offline); 17/17 quotes verified; renders at 100 percent recommended-field compliance with no function conflicts.
