- type: EDIT
  outcome: changed
  summary: 'Drop connection_type: PRECEDES, which asserted an order the module denies'
  details: |
    Re-review on PR #6835 found a new instance of the same defect the first round was about, and I introduced it while fixing that one. The second connection carried connection_type: PRECEDES, whose enum definition in gene_review.yaml is the source occurs before the target - which is exactly the claim the connection's own description withdrew, since PvdN accepts ferribactin and so the tailoring step may precede the oxidations rather than follow them. chaining_status NOT_APPLICABLE correctly handled the substrate question; nothing was carrying the ordering question, so the enum value was left asserting it. The enum has no member meaning adjacent in the pathway with order not established, and connection_type is optional, so the fix is to assert neither relation and let the description say why. The connection itself is kept, because the two steps really are part of one pathway segment and that is worth recording. The notes file is updated to match and to record the pattern: when no enum member fits, the temptation is to pick the nearest one and qualify it in prose, and a reader of the data never sees the qualification.
