  details: |
    Round 4 on PR #6835 found that the top-level description said PvdO carries out the second oxidation, which is the single claim the rest of the module is organised around declining. The part label says PvdO-dependent, the annoton label says oxidation factor, function has no term, role_description says the catalyst question is unsettled, knowledge gap 1 records it as a biological unknown, and the notes file says asserting a catalytic term would assert what the assay failed to show. The source is careful in the same way: the sentence quoted twice in this file is that the final oxidation depends on PvdO, never that PvdO performs it. So the description was stronger than the evidence, stronger than the source, and stronger than five of the module's own fields, in the field CLAUDE.md defines as the project-independent summary a biologist reads without the surrounding apparatus. Reworded to say the oxidation depends on PvdO, with the catalyst question flagged in the same sentence. The notes file records this as the fifth instance of the pattern and the first with reversed polarity: the previous four were machine-readable fields overstating what the prose hedged, this is prose overstating what the fields hedge, and the quote-it-in-the-slot rule cannot catch it because a description has no evidence slot. The check that does catch it is reading the description against the parts it summarises and asking whether any verb claims more than the part does.
