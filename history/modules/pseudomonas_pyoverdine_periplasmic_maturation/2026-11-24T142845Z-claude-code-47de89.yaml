  summary: Correct the copper structure attribution; strip narration from six statements
  details: |
    Round 10 on PR #6835, two findings, both in material added in the previous two commits. The copper statement said UniProt records the six Cu(2+) binding residues from the 2.11 angstrom structure, and role_description said they were resolved in it. They are not: every one of the six FT BINDING lines carries evidence ECO:0007829 PDB:6RRP and PDB:6RRQ, the 2.40 and 2.70 angstrom entries, and 6RRR, the 2.11 angstrom one, appears in no FT evidence at all. The RP line reports the best resolution in a reference covering all three structures, so quoting it and saying the residues come from it reads one structure's resolution onto another's evidence. Nothing substantive turns on it since they are one paper and one deposition set, but the module stated a specific attribution the record contradicts, in the field grounding its best-evidenced claim. Corrected in both places, and the six-residue, three-per-copper and ECO:0007829 claims now have their own evidence item quoting an actual FT evidence line rather than riding on the RP quote, which is finding 32's rule applied where it had been missed again. The second finding is that the narration cleanup from commit e5fc71b771 had come undone: six evidence statements narrated the PR rather than saying what the source supports, including one whose first five of seven lines were about the editing history of this pull request. All six rewritten. The notes record why it recurred, which is that each instance arrives while explaining a fix, exactly when the editing history is uppermost and feels like relevant context, so the rule belongs in the pre-push check alongside the quote run rather than in the set of things considered settled.
