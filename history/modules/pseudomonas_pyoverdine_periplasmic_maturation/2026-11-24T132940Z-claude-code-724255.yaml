  details: |
    PR #6826 merged, so genes/PSEAE/pvdO/pvdO-uniprot.txt now exists on main and the deferred citation from round 3 of review on PR #6835 becomes possible. The module's claim that PvdO's FGE fold and calcium site are observed rather than predicted, and the Chromophore maturation protein deposition name it uses as corroboration, were prose-only because citing that file before the sibling PR merged would have made validate-quotes fail against an unresolvable source and stacked this PR's evidence on an unmerged content branch. Both are now evidence items with verbatim supporting_text. The statement on the first records why the deposition name is weak corroboration rather than an independent naming: its depositors share three authors with the group whose PDB 5HH9 deposition claims a cysteine desulfurase activity for PvdN, which the sibling gene review discounts as unpublished. Merged current main into the branch first, which is what makes the file resolvable here. Note that the module validator now reports five warnings rather than three: the two new ones are NO_FUNCTION_ID notices saying a gene review exists for Q9I185 and G3XCY5 but the function has no GO identifier. That is a consequence of the merge rather than of this edit, and it confirms consistency: those are the two annotons where the module deliberately asserts no molecular function, and the merged gene reviews assert none either.
