    Round 3 of review on PR #6835 found that the structural decisions made in round 2 were argued only in free-text notes, with no evidence item on either the part or the variant set, although ModulePart and ModuleVariantSet both carry an evidence slot and modules/ uses part-level evidence over 300 times. The sharper half of the finding: the sentence that licenses optional: true states the case outright - Removal of both tailoring enzymes leaves the original glutamate unaltered - and was quoted nowhere in the file, so what the YAML argued from instead was the single-enzyme deletion phenotype, an inference the review makes unnecessary. Both slots now carry their licensing sentence as an evidence item, each with a statement saying which encoding it warrants and, for the strain-distribution sentence, noting that its other appearance on knowledge gap 4 is as the premise of an unknown rather than as the warrant for ONE_OR_MORE. Also took the reviewer's item 12: the review has a section headed Reactions of periplasmic pyoverdine biogenesis may not occur in a strict order, closing with there is no evidence yet for such a channeling that could impose an order of events. Both are now quoted on the untyped connection, which turns the missing connection_type from a hedge against thin evidence into what the source positively asserts; the connection description says so. The notes file records the third pattern across three rounds: the structural decision was right every time and the machine-readable justification was thinner than the prose beside it every time, so the rule going forward is to quote the licensing sentence in the slot's own evidence rather than in a note nearby.
