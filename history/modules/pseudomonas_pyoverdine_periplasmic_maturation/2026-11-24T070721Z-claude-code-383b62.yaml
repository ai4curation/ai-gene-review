  details: |
    The previous commit fixed the PvdO clause of the description and left the next clause standing, which the same review had flagged in the same finding. The tailoring clause said a PLP-dependent tailoring enzyme converts the glutamate side chain into one of the alternative mature forms: unconditional, where the part is marked optional: true, and one of, where the set is ONE_OR_MORE and the source reports strains making the products of both branches. Rewritten to say the step happens in strains that carry such an enzyme, that it is optional, and that the routes are not exclusive. Also corrected part 1's role_description, which said the review assigns only the first of the three oxidation steps to PvdP; it assigns two of three, the initial hydroxylation and the first oxidation, with the final oxidation depending on PvdO. And softened the first connection's prose from the substrate PvdO acts on to what the PvdO-dependent step consumes, with a sentence saying the PROVIDES_INPUT_FOR and VERIFIED pair is about flow into the node rather than about who catalyses it, since the substrate is established and the catalyst is not. The notes record the lesson that generalises: a flagged instance is a sample, so when a pattern is named, re-read the whole field for it rather than patching the line quoted in the review.
