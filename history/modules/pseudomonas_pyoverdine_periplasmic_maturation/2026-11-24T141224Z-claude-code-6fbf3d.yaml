  details: |
    The rest of round 9 on PR #6835, after the di-copper restoration. The reviewer's sharpest observation was structural rather than about any single claim: part 2 grounded PvdO's single unpublished 2016 PDB deposition in three separate evidence items while part 1, the step the module calls solid and the only one with primary enzymology, named no structure, rested its cofactor on one adjective in a review, and reached NCBIfam through a P. putida ortholog's row in a regenerable results TSV when NF051454 sits on the P. aeruginosa record itself. Every individual citation was defensible; the distribution was wrong, and that is invisible from inside any one field. Fixed by grounding part 1 rather than thinning part 2: NF051454 cited from pvdP's own record, and PMID:31899238 added with two quotes, one confirming the tyrosinase activity from the inhibition side with a co-crystal structure of a non-competitive inhibitor, the other corroborating part 1's family description, which had rested on PMID:24816606 alone, by way of the allosteric site appearing confined to the fluorescent pseudomonads. Finding 38 is the mirror of the round-8 PANTHER fix: taking it for PvdO left PvdN asserting the identical claim shape in prose. PvdN's rationale now names PTHR43586 and cites DR PANTHER; PTHR43586; CYSTEINE DESULFURASE; 1. Also recorded a tension inside the solid step in the DRAFT justification: both primary papers frame the whole ferribactin to pyoverdine conversion as PvdP's, while the two-and-one split comes from the review, so the module follows one secondary source against two primary ones on that point. The split still wins, because the review has the pvdO deletion phenotype, a positive experimental result, where the papers have a summary framing of a pathway neither was testing, but the module should say so.
