- type: EDIT
  outcome: changed
  summary: 'Undo the cyclisation overcorrection: the review uses both verbs'
  details: |
    Round 6 on PR #6835 found that the previous commit's fix overcorrected, and the reviewer withdrew their own round-5 framing. The review uses both verbs for the cyclisation: its body text says PvdP catalyses the hydroxylation and oxidation and thereby also promotes the cyclization, while its pathway-figure legend says PvdP catalyzes the oxidative cyclization. Both verified verbatim in the cached text. So the original wording was supported by one of the two formulations, and my replacement asserted a promotes-versus-catalyses distinction the paper does not maintain while attributing it to the paper with the phrase the verbs are the review's, which was false. Part 1 now states that the review is inconsistent on the verb, uses the weaker reading because it sits in the discursive text rather than a summary legend and because the part's substrate, product and GO term are the same either way, and labels the mechanistic gloss as this review's inference rather than the paper's claim. The copper evidence statement is corrected the same way. Also added the figure legend's statement that PvdO, possibly in conjunction with other proteins, facilitates the final oxidation, which independently supports the PvdO hedging, to knowledge gap 1. The notes record two lessons. First, check the source yourself even when the reviewer quotes it: the quoted sentence was real and verbatim, but I never looked for the paper's other statements about the same step, and five rounds of accurate findings had made the reviewer's readings feel like facts rather than claims. Second, by that point I was pattern-matching rather than reading: unhedged verb where the source hedges fit the shape of five previous findings well enough that I applied the fix without asking whether the source was consistent.
