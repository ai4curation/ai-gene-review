  details: |
    Round 6's remaining items. The verb question was never answerable from the text, which the reviewer identified: the review presents the oxidative cyclisation cascade as a proposal of Dorrestein and colleagues and sets a postulated intramolecular Bucherer reaction beside it, inferred from a trihydroxylated pseudoverdin that the review itself notes came from an essentially artificial system with unidentified genetic elements whose product was not functional in iron acquisition. If it is not known which chemistry closes the ring then it is not known whether PvdP catalyses the closure, so picking the weaker verb was the same error as picking the stronger one, one notch quieter. Part 1 now asserts the hydroxylation and the oxidation, which the evidence supports, and asserts nothing about the closure in either direction; the question is recorded as a fifth BIOLOGY knowledge gap, the only one touching the step the module otherwise calls solid, with both the proposal and the postulated alternative quoted. Separately, the di-copper gloss is removed: the review says copper-containing and the primary paper's abstract does not mention copper, so the canonical di-copper active site was general enzymology presented in the same sentence as a sourced claim with no seam. Also stripped the review-process narration that had accumulated in published slots across six rounds - this is the second attempt at encoding this relation honestly, PRECEDES was used here first, the first version collapsed them, and an evidence statement explaining what had been missing from the module rather than what the source establishes. The notes file and the history records carry all of it already and in better form. Each instance had arrived looking like reasonable transparency, which is why it accumulated; an evidence statement should say what the source supports and a description should describe the biology.
