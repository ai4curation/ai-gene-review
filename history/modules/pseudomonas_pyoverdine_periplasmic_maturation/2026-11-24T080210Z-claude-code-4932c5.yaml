  summary: Quote the verb-discrepancy sentences as supporting_text; reword the description
  details: |
    Round 7 on PR #6835, two items, both consequences of the round-6 fix rather than defects it missed. First: the verb discrepancy had become load-bearing in three free-text slots - an evidence statement, a role_description and gap 5's gap_statement - and each stated it with the source's words in quotation marks inside the prose. validate-quotes reads supporting_text and nothing else, so none of it was checkable, which is worse than a paraphrase because quotation marks in a prose slot promise a verification the tooling cannot give. Both sentences are now provenance entries on gap 5, the body-text one as DISCUSSION and the Figure 1 legend one as OTHER, matching how gap 1 already cites a legend. Gap 5's provenance previously grounded only the which-chemistry unknown and nothing grounded the verb clause, which is the half licensing part 1's abstention. This is finding 11's shape and the one the notes rule was written for, so the rule was written and then not applied to the next thing it covered. Second: the position change from use the weaker verb to the closure is open had been carried into the node label and the part role but not the top-level description, which still said PvdP oxidatively cyclises the residues - the exact claim gap 5 records as unknown, in the field read without the apparatus. Reworded so PvdP carries out the hydroxylation and the first oxidation and the residues then cyclise, with the closure's chemistry and agent stated as unsettled. Worth recording that this was not a sourcing defect: the figure legend licenses the old wording and it was correct before the module changed position. The check is to re-read every field touching a claim after changing what the module says about it, not only the fields a reviewer quotes.
