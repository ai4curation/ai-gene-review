  summary: New DRAFT module for pyoverdine periplasmic maturation
  details: |
    Models the periplasmic segment of pyoverdine biogenesis that the existing precursor-supply module explicitly scopes out. Three parts: PvdP's oxidative cyclisation of ferribactin (GO:0004503, the one step with primary enzymology, PMID:24816606), PvdO's second oxidation, and a ROUTE variant set for the position-1 glutamate side chain with PvdN's succinamide branch and PtaA's alpha-ketoglutarate branch. Selection is ONE_OR_MORE rather than EXACTLY_ONE because strains genuinely carry both, one, or neither. DRAFT rather than COMPLETE because only the first step has primary enzymology: PvdO's assignment rests on a mutant phenotype reported in a review and no activity has ever been measured for it. Two of the three functions carry no GO term, deliberately, since GO has no term for the second chromophore oxidation or for the PLP-dependent decarboxylation that retains the alpha-amino group. No PANTHER family id is asserted for any role: PvdO's assignment is to the sulfatase-maturating FGE clade and PvdN's to a cysteine desulfurase clade, so membership would say something false about the activity. PtaA's variant carries no representative member either, because the UniProt entries bearing that gene name are unreviewed records with machine-generated protein names and the characterising paper is not available here; naming one would be a guess. PvdM is named in the operon context but is not a part, and the fact that the only essential gene of the operon is the one step that cannot be modelled is recorded as a knowledge gap. Four BIOLOGY gaps in total. All quotes are from primary publications or the published pathway review, never from the unmerged gene reviews on the sibling branch.
