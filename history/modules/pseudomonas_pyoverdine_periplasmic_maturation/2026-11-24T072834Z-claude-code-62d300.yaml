- type: EDIT
  outcome: changed
  summary: Correct ferribactin's acylation state and drop the inference it carried
  details: |
    Round 5 on PR #6835 found the first defect in this sequence that is not a hedging instance: two slots called ferribactin the undeacylated precursor, which is wrong. The review's usage is consistent - the acylated species is always named acylated ferribactin, exported by PvdE and deacylated by PvdQ, while bare ferribactin is the deacylated peptide that PvdP then acts on. The module agreed everywhere else: part 1's substrate is plain ferribactin and the scope line puts PvdQ-dependent deacylation outside as upstream, so by its own boundary the ferribactin PvdP consumes is already deacylated. Two prose passages gave the same molecule the opposite acylation state. The consequences differed. On the connection only the appositive was wrong, since PvdN accepting ferribactin does place the tailoring upstream of the oxidations because ferribactin is PvdP's substrate, and the review draws that conclusion itself. On PvdN's role_description the wrong appositive carried a wrong inference: so this tailoring step is not strictly ordered after deacylation. If ferribactin is already deacylated then accepting it says nothing about ordering relative to deacylation, so the claim did not follow rather than being imprecisely worded. Both corrected, and the role_description now states explicitly what the observation does not show. The notes record that this needs a different check from the five hedging instances: when one entity appears in several slots, verify the slots agree about what it is - here part 1's substrates, the scope line and two prose passages described one molecule and two of the four disagreed with the other two.
