- type: EDIT
  outcome: changed
  summary: 'Split the 5HHA evidence item: one claim per item'
  details: |
    Round 8 on PR #6835. The 5HHA citation landed as a single evidence item whose statement said it grounded PvdO's FGE fold and its calcium site as observed rather than predicted, attached to the quote DR PDB; 5HHA; X-ray; 1.24 A; A/B=22-284. That line establishes only that an X-ray structure exists at 1.24 angstroms over residues 22 to 284. Of the two substantive attributes the statement claimed to ground, the quote carried neither, and both sit on other lines of the same file the item already cites. Split into three items: the cross-reference grounding the modality alone, the record's X-RAY CRYSTALLOGRAPHY (1.24 ANGSTROMS) OF 22-284 IN COMPLEX WITH CA(2+) line grounding the calcium, and the Pfam PF03781 FGE-sulfatase line grounding the fold, which is a signature match rather than a structural determination and is the right kind of grounding for a fold assignment. The shared-authors reasoning moved from the first item onto the deposition-title item, where the naming claim it qualifies actually lives, and now names the three authors rather than counting them. The notes record the generalisation, the fourth variant of one idea in this file: an evidence statement should name one claim and the quote beside it should carry that claim, since a statement needing the word and is usually two items, and nothing checks the pairing - validate-quotes confirms a quote is verbatim, not that it supports what the statement says it supports.
