- type: EDIT
  outcome: changed
  summary: Restore the di-copper centre, now grounded on pvdP's merged UniProt record
  details: |
    Round 9 on PR #6835 found that round 6 deleted the di-copper claim as unsourced general enzymology and that the conclusion was wrong, though both its premises were right. The pathway review does say only copper-containing and PMID:24816606's cached abstract does not mention copper, but neither of us checked UniProt. genes/PSEAE/pvdP/pvdP-uniprot.txt, on main since the sibling gene PR merged, carries DR InterPro; IPR008922; Di-copper_centre_dom_sf., the SUPFAM equivalent, a 2.11 angstrom structure in complex with Cu(2+), and six Cu(2+) FT BINDING residues, three per copper, with structure-derived ECO:0007829 evidence that CLAUDE.md lists as good support. Restored with two evidence items, and the restored version is stronger than what was deleted: the deleted sentence asserted a general fact about tyrosinases where the record shows two copper sites resolved on this protein. The notes separate the two mistakes. The first was checking two sources and concluding unsourced, when the claim was about the whole available evidence and the check covered the review and one abstract. The second was not revisiting after the tree changed: at the time pvdP's record was not on main so the claim genuinely could not have been cited, which is the same constraint that deferred the PDB 5HHA citation, but 5HHA was recorded as deferred and came back when the sibling PR merged while the copper claim was deleted outright so nothing brought it back. A deletion justified by what the tree contains should be recorded as conditional, the way a deferral is.
