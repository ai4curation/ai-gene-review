  summary: Hedge the cyclisation, add PvdP's copper, caveat the PvdN compartment quote
  details: |
    Three of the four suggestion-level items from round 5, two of which are instances of patterns already named. The cyclisation: part 1's role_description said PvdP performs the first oxidation cyclising it with the adjacent diaminobutyrate, attributing the cyclisation to PvdP as an action. The source hedges it: the initial hydroxylation and oxidation steps are catalyzed by the copper-containing tyrosinase PvdP, which thereby also promotes the cyclization. So PvdP catalyses two steps and promotes the third, which follows from that chemistry rather than being separately catalysed. Reworded to promoting, with the distinction stated. That is a sixth overstatement instance. The copper: the review calls PvdP a copper-containing tyrosinase, and a di-copper centre is the canonical tyrosinase active site, so this is the fact that makes the GO:0004503 assignment mechanistic rather than nominal. It was absent from the module while PvdO's cofactor story was central to it, an asymmetry that understated the best-evidenced part. Added as an evidence item on the module and named in the role_description. The PvdN compartment quote embeds a still unknown but essential component in Pvd biogenesis, which is the interposon-era reading the later in-frame deletions corrected and which this module's own optional: true contradicts; the statement now says the quote is used for the compartment and not for that. Declined the fourth suggestion, adding GO:0098567 periplasmic side of plasma membrane for PvdN: a localisation assay placing a Tat-exported soluble protein at the inner membrane's periplasmic face does not establish a stable membrane association, and the more specific term would assert one. The reason is recorded in the same statement so the decision is visible rather than silent.
