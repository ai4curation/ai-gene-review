  summary: 'Create: hypothalamic leptin-melanocortin signaling module'
  details: |
    New ModuleReview covering the central adipostat: LEP hormone release, LEPR activation with its STAT output, POMC synthesis and convertase processing by PCSK1 then PCSK2, alpha-MSH agonism at MC4R, and the AGRP antagonist arm, with connections for leptin's positive regulation of POMC and repression of AGRP. PANTHER grounding read from the committed classifications only (PTHR11724 LEPTIN, PTHR23037 CYTOKINE RECEPTOR, PTHR11416 PRO-OPIOMELANOCORTIN, PTHR22750 G-PROTEIN COUPLED RECEPTOR, PTHR16551 AGOUTI RELATED), each family containing its own representative member. PTN anchors asserted only where a local PAINT row names the node with the accession (PTN002745476 for LEPR, PTN002733667 for MC4R); the nodes named in the PCSK1 GOA WITH/FROM field are absent from the local PAINT index, so the two convertases are grounded as UniProt gene products at the subfamily level instead of asserting a family id or an unverifiable PTN. The PTHR23037-versus-PTHR23036 disagreement between the two PANTHER sources for LEPR is recorded in the module notes rather than silently resolved. Schema validation and the module validator pass; rendered to pages/modules/.
