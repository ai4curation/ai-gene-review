  summary: Create bacterial heptaprenylglyceryl ether lipid module
  details: |
    Created modules/bacterial_heptaprenylglyceryl_ether_lipid.yaml (CONCRETE, METABOLIC_PATHWAY, Bacillales) for projects/LIPID_DIVIDE.md: the bacterial archaeal-type ether lipid route. Five parts, four required: sn-glycerol-1-phosphate supply (EgsA, P94527, GO:0050492), ether-bond formation (PcrB, O34790, GO:0120536), dephosphorylation, acetylation (YvoF, O34993, GO:0016413) and, optional, acetyl transfer to lipoproteins (LhaT/YpjA, P54392, GO:0008080). LhaT is inside the module because the pathway's product is a transferred acetyl group and HepG is regenerated, and Komazin 2025 (PMID:40626731) reconstituted all five steps and showed each knockout abolishes the modification; it is optional because PcrB is more widely distributed than LhaT and some species encoding both make no acetylated lipoprotein. bacterial_lipoprotein_maturation is cited as adjacent evidence rather than included by module_ref, which would have pulled the Lgt/LspA/Lnt route in as a required part. The unassigned phosphatase is modelled as a required step with no gene product and an MF_DARK knowledge gap; PhoB is not named as participant because Linde 2016 only supposed it and the reconstitution used calf alkaline phosphatase. The unproven in vivo G1P supply is hedged three ways: a REALIZER variant set with one modelled carrier, chaining_status KNOWLEDGE_GAP on the supply edge separating metabolite identity from demonstrated flux, and a BP_DARK knowledge gap naming the egsA-deletion lipidomics that would close it. No ancestral PTN nodes are asserted: the available nodes carry IBDs for other functions or do not exist locally, and each reason is recorded. HepG and Ac-HepG have no ChEBI entry, so two chaining edges are acknowledged as NOT_CHECKED. GO gaps recorded in notes: no process term for archaeal-type lipid biosynthesis, no MF term for HepGP phosphatase, and GO:0004596 does not fit LhaT because its definition fixes acetyl-CoA as donor. Schema validation and module checks pass with 3 warnings, all coverage notices arising from the deferred egsA and pcrB gene reviews.
