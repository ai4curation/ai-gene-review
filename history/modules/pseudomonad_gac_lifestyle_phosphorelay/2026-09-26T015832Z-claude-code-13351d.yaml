  summary: 'Create module: pseudomonad GacS/GacA lifestyle-control phosphorelay'
  details: |
    New CONCRETE signalling module for the pseudomonad Gac two-component system. Root parts: an inner gac_phosphorelay bundle (GacS sensor GO:0000155 -> GacA response regulator GO:0000156) that conforms_to two_component_relay WITH_DEVIATIONS because GacS is a hybrid kinase carrying its own Hpt domain rather than a discrete Hpt protein; RetS as an opposing sensor input; and GacA's DNA-binding transcriptional output to adhesin/biofilm genes. Grounded in the reviewed PSEPK gacS (Q88MC3), gacA (Q88FJ6) and retS (Q88DK1) exemplars, with PANTHER families PTHR45339:SF1 and PTHR43214:SF3 taken verbatim from the local panther.obo. The RsmA/RsmE post-transcriptional arm is left outside the boundary as a curation knowledge gap because those genes have no reviews here. Validated with linkml-validate -C ModuleReview and module_validator; rendered with just render-module.
