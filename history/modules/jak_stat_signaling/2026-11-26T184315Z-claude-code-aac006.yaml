  summary: Add JAK kinase functions, ground three participants, correct STAT docking
    term
  details: |
    Signaling-module review, third batch. The receptor-class variants named JAK1, JAK2, JAK3 and TYK2 with no function; each now carries GO:0004715, a core function in all four gene reviews. JAK3, STAT5A and STAT6 were GENE selectors with the accession only in prose; they are now GENE_PRODUCT with UniProtKB:P52333, P42229 and P42226. The STAT recruitment annoton used GO:0042169 SH2 domain binding, which means binding to an SH2 domain; the STAT's own SH2 domain binds receptor phosphotyrosine, so the term is now GO:0001784 phosphotyrosine residue binding (a core function in the STAT5A review). GOA carries neither term on STAT1, STAT3, STAT5A or STAT5B; the query was confirmed against PIK3R1, which returns GO:0001784. The dimerization annoton keeps GO:0042169, where a phospho-STAT does bind its partner's SH2 domain. The STAT variants stay functionless as substrates at that step. PIAS gains PIAS1 as representative and GO:0140416 (core in its review). Schema and module validator pass; remaining warnings are coverage notices.
