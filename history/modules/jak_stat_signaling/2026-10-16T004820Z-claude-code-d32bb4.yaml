  details: |
    The negative-regulation bundle's two edges (to JAK activation and to STAT transcription) expanded in translation to every child, so SOCS, PTPs and PIAS each inhibited both steps. Added activation_logic following the module's own text: jak_activation = ligand AND NOT (SOCS OR PTP); stat_transcription = nuclear STAT dimer AND NOT (PTP OR PIAS). PIAS on JAK, SOCS on transcription and ERK serine phosphorylation (a modulator of maximal transcription) are left out and reported as validation warnings. Added executable_models jak_stat_signaling_boolean with scenarios unstimulated, sustained_cytokine (cyclic; PMID:9202125 SOCS genes induced in a classic negative feedback loop), socs_lost (locks on; PMID:9202125 SOCS-1 inhibits receptor phosphorylation and STAT activation), jak_inhibited, pias_restraint (STATs imported but transcription blocked, JAK stays on) and jak_independent_input (recorded as a property of the wiring). All hold.
