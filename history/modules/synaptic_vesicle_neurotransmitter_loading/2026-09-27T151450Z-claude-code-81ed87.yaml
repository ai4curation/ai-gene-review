  summary: Add C. elegans exemplars to neurotransmitter loading
  details: |
    Added worm orthologs as second representative members: vha-13, vha-1, unc-32 for the V-ATPase units and eat-4, unc-47, cat-1, unc-17 for the transporter variants. unc-47 resolves to PANTHER:PTHR48017:SF206, the same subfamily as human SLC32A1, confirming the earlier re-grounding of VGAT. Notes record the one-to-one worm mapping of the transporter variant set.
