  summary: 'Create module: neurotransmitter loading into synaptic vesicles'
  details: |
    Created MODULE:synaptic_vesicle_neurotransmitter_loading (GO:0098700) with two parts: V-ATPase lumen acidification (PROTEIN_COMPLEX GO:0033176 with ATP6V1A, ATP6V0C, ATP6V0A1 active units; PAINT node PTN000389802) and transporter uptake as a ONE_OR_MORE variant set on the neurotransmitter axis (VGLUT SLC17A7/SLC17A6, VGAT SLC32A1, VMAT2 SLC18A2, VAChT SLC18A3) with transporter MF terms and loading process terms. VGAT is grounded on PANTHER:PTHR48017:SF206 after the member check showed PANTHER classifies Q9H598 there rather than in the UniProt-listed PTHR22950. Evidence: GO, PMID:17880890, PMID:17110340, PMID:24183019. Validated with linkml-validate and module_validator; rendered.
