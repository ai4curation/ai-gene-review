  summary: 'Create module: mitotic cell cycle progression umbrella'
  details: |
    Created modules/cell_cycle_progression.yaml (MODULE:cell_cycle_progression),
    an umbrella that composes the three transition modules (g1_s_transition,
    g2_m_transition, metaphase_anaphase_transition_and_mitotic_exit) into one
    cycle. Each part is a compact summary node carrying the phase-specific
    cyclin-CDK holoenzyme (or the APC/C switch) as a protein-complex annoton with
    family active units and PAINT ancestral nodes, plus a file: evidence pointer
    to the detailed module; connections encode the cyclic PRECEDES order, CDK1
    priming of APC/C, and G1 suppression of S-phase CDK by APC/C-Cdh1 and the
    CKI. Grounded in GO:0044772 and GO:0000278. conforms_to was deliberately not
    used because the conformance checker matches function-term tiers in order,
    which is not the relation between a summary node and a multi-part module;
    this is recorded in notes.

    Validation: linkml-validate passes; module_validator term labels OK with
    advisory warnings only; derived QC 100% recommended-field compliance, no
    leaf-grounding gaps, no conformance violations; the three PRECEDES edges carry
    chaining_status NOT_APPLICABLE. Rendered to
    pages/modules/cell_cycle_progression.html. The PANTHER member index
    (interpro/panther/panther-members.tsv) was refreshed for the accessions cited
    by the four new modules only; rows for other modules were kept unchanged
    except CDK7 (P50613), which PANTHER 19.0 now places in PTHR24056:SF375.
    Publications fetched by the validator while verifying reference titles are
    committed alongside. Left undone: no module deep-research report;
    pages/modules/index.html not regenerated (the daily generate-pages workflow
    does that).
