  summary: 'Assess myzozoan ATPPM1/ATPPM2 candidates against human Complex V module
    (litscan #3918)'
  details: |
    Litscan module-member handoff #3918 asked whether the new ATP synthase components reported for Perkinsus marinus (PMID:42809533) should be added to modules/mitochondrial_complex_v.yaml as members or variants.

    Fetched the paper with just fetch-pmid (full text available, PMC13623125) and read the F1Fo-ATP synthase section rather than working from the abstract. The two candidates are Pmar_PMAR021141 and Pmar_PMAR014495, which the authors putatively name ATPPM1-2; they co-migrate with the ~1.9 MDa Perkinsus ATP synthase in every complexome dataset and are recovered from the size-exclusion-purified complex, and are proposed as possible stand-ins for the expanded-luminal-domain subunits (Toxoplasma ATPTG5, 7, 10, 11, 16) that Perkinsus appears to lack.

    Resolved both gene ids against UniProt: Pmar_PMAR021141 = UniProtKB:C5KGI6 (unreviewed, 99 aa, matching the reported 10 kDa, PE 4 Predicted, no InterPro/PANTHER/GO) and Pmar_PMAR014495 = UniProtKB:C5KWE2 (unreviewed, 171 aa / ~19 kDa, PE 4, no PANTHER/GO; sole InterPro match IPR036249 Thioredoxin-like superfamily, a fold-level entry, and no CXXC or CGFS motif in the sequence, so the submitter-supplied 'Monothiol glutaredoxin-4, putative' name should not be read as a redox function).

    Decision: NOT modelled, and not as a taxon variant either. Recorded in the module following the ATHENA precedent (PR #2613/#2651) in both encodings — a CANDIDATE ASSESSED, NOT MODELLED paragraph in module.notes and a structured knowledge_gaps entry (BIOLOGY, WHOLLY_DARK, OPEN) for the subunit-versus-late-stage-assembly-factor question, with seven verbatim provenance quotes. Reasons: (i) scope, this module is the human holoenzyme and even the experimentally confirmed apicomplexan ATPTG subunits are not parts of it; (ii) vehicle, a myzozoan taxon variant would have to model the whole 27-subunit divergent complex rather than bolt two unplaced proteins onto a human node, and the right vehicle is a separate lineage module (cf. the dmel_* convention), which presupposes Perkinsus or Toxoplasma gene reviews that do not exist here (no genes/PERM5/); (iii) status, the authors themselves leave subunit vs assembly factor open and the substitution argument is from absence plus co-migration, with no structure, stoichiometry or loss-of-function phenotype.

    Also added PMID:42809533 to the module references with reference_review (relevance LOW — sound and correctly cited, but it informs no human subunit or assembly factor here; correctness VERIFIED against the cached record).

    Validation: linkml-validate --target-class ModuleReview clean; module_validator passes with only the 3 pre-existing atp5f1a/atp5f1b function-conformance warnings. The validator caught and I fixed a descriptive EvidenceItem title on a PMID source (titles must match the publication title verbatim).
