  summary: Assess Perkinsus marinus ATPPM1/ATPPM2 ATP synthase candidates against
    Complex V
  details: |
    Resolved the litscan:module-member handoff #3918 (PMID:42809533, complexome profiling of Perkinsus marinus mitochondria). Fetched the full text via just fetch-pmid (PMC13623125, XML route) and read Results/Discussion rather than the abstract alone.

    Determination: the two putative new ATP synthase components, ATPPM1 (Pmar_PMAR021141 = UniProtKB:C5KGI6, 99 aa) and ATPPM2 (Pmar_PMAR014495 = UniProtKB:C5KWE2, 171 aa), are NOT added as parts of this module. Accessions were resolved against the UniProt REST API and confirmed by length against the paper's stated 10 kDa and 19 kDa; both are TrEMBL entries at protein existence Predicted with no GO annotation, no PANTHER family and no transmembrane feature, so the module's FAMILY-based participant grounding cannot reach them. C5KWE2's only signature is InterPro:IPR036249 (thioredoxin-like fold) and UniProt assigns it to the monothiol glutaredoxins, which supplies an alternative account of the co-migration that the study does not exclude. The authors themselves leave subunit versus late-stage assembly factor undetermined, which is the distinction this module encodes structurally (F1/Fo subunit nodes versus the assembly node), so the evidence does not determine which node would receive them. Above all, the module is grounded entirely on the human enzyme and has no myzozoan or apicomplexan arm: the clade-specific subunit set is absent wholesale, including the better-characterised Toxoplasma ATPTG subunits (PDB 6TMK, essentiality data). Conserved Perkinsus subunits need no addition, being orthologs inside the PANTHER families already selected on.

    Recorded following the ATHENA precedent in this same module (#2661/#2387): a CANDIDATE ASSESSED, NOT MODELLED paragraph in module.notes plus queryable EvidenceItem entries with verbatim quotes, and the reference with a reference_review. No knowledge_gaps entry was added: the open question is about Perkinsus biology, outside this human-grounded module's scope. No exclusion guard either - with no PANTHER family, no selector here can sweep these proteins in, so guard text would be redundant (the #3092 reasoning).

    Module composition is unchanged. Schema validation and the module validator pass; the 3 remaining warnings are pre-existing on main and concern the F1 alpha/beta annotons.
