  summary: Assessed Perkinsus marinus ATPPM1/ATPPM2 ATP synthase candidates; recorded
    as knowledge gap, module composition unchanged
  details: |
    Litscan module-member handoff (#3918) on PMID:42809533 (complexome profiling of Perkinsus marinus mitochondria).

    Answer to the handoff question: the paper identifies two putative new ATP synthase components in P. marinus - Pmar_PMAR021141 (UniProtKB:C5KGI6, 10 kDa, uncharacterised) and Pmar_PMAR014495 (UniProtKB:C5KWE2, 19 kDa, thioredoxin-like), which the authors name ATPPM1-2. Evidence is co-migration with the enlarged (~1.9 MDa) myzozoan ATP synthase in every complexome dataset plus co-purification by SEC/MS alongside 22 expected subunits; both are DeepLoc-predicted mitochondrial. The authors state explicitly that these are 'either novel ATP synthase subunits, or late-stage assembly factors' and that further work is required.

    Disposition: neither is added as a module part or annoton. (i) Scope - every part of this module is grounded on a reviewed human accession with a completed gene review, and these are lineage-specific proteins with no human counterpart (undetectable by homology even from Toxoplasma). (ii) Category - subunit vs late assembly factor is the distinction this module encodes by separating ATPAF2/TMEM70 into an assembly node, and the data do not decide it, so there is no node to place them in. (iii) Grounding - both accessions are TrEMBL-only, protein existence 'Predicted', no GO annotations and no PANTHER family (FAMILY grounding unavailable); ATPPM1 has no InterPro signature, ATPPM2's only signature is IPR036249 Thioredoxin-like superfamily and UniProt names it 'Monothiol glutaredoxin-4, putative'. UniProt and InterPro facts checked via the REST APIs at review time (release not pinned).

    Recorded instead as a structured knowledge_gaps entry (BIOLOGY, MF_DARK, OPEN) with six verbatim provenance quotes, a reference entry with reference_review (MEDIUM/VERIFIED), and a 'CANDIDATES ASSESSED, NOT MODELLED' paragraph in notes - following the existing ATHENA precedent in this module. The same paper also resolves a distinct point needing no module change: a separately-encoded Perkinsus ATPTG1 homolog is in complex with ATP synthase, placing the ATPTG1 subunit role before the apicomplexan ATPTG1-CytC1 gene fusion.

    Validation: linkml-validate (ModuleReview) clean; module_validator passes with the same 12 pre-existing warnings as on main (no new warnings), which includes the verbatim-quote and reference-title checks on all new content.
