  summary: 'Create module: camalexin_biosynthesis'
  details: |
    Expanded the camalexin_biosynthesis skeleton into a concrete Arabidopsis ModuleReview: four biosynthetic parts (CYP79B2/B3 tryptophan N-monooxygenase GO:0090489; CYP71A13 with minor CYP71A12 indoleacetaldoxime dehydratase GO:0047720; glutathione conjugation by implicated GSTF6 GO:0004364 and gamma-glutamyl removal by GGP1 GO:0034722; PAD3/CYP71B15 with proposed dihydrocamalexate synthase activity and GO:0010298) and an explicit regulatory part (MPK3/MPK6 MAP kinase activity and WRKY33 cis-regulatory binding, both under GO:1901183) that keeps the enzyme-versus-regulator split from the gene reviews. GSTU4 is excluded as a pathway enzyme per PMID:31511315, GGT1/GGT2 are excluded per PMID:21712415/23449503, and the ER P450 metabolon is recorded in notes. Knowledge gaps cover the GST step, the activated IAN species, the unidentified Cys-Gly peptidase, the GGT phenotype, the missing PAD3 MF term and the MPK3/MPK6 review asymmetry.
