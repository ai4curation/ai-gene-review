  summary: Reconcile with member gene reviews
  details: |
    Reconciled the camalexin module with the completed CYP79B3, CYP71A13, CYP71A12 and GSTF6 gene reviews. Step 2 now follows Klein et al. 2013 (PMID:24151049): 18O2 labelling shows CYP71A13 and CYP71A12 monooxygenate IAOx to an alpha-hydroxy-IAN (indole-3-cyanohydrin) intermediate, proposed to be dehydrated to a thiol-trapped dehydro-IAN, with IAN possibly off-pathway. CYP71A13 and CYP71A12 were split into separate annotons: CYP71A13 keeps GO:0047720 (its review core), CYP71A12 carries GO:0004497 as in its review, and the knowledge gap now records that GO lacks a cyanohydrin-forming term, with the CYP71A12 review's proposed term. GSTF6 stays 'implicated', with the evidence the GSTF6 review uses added (Su 2011 modest effects; normal camalexin in higher-order phi-GST mutants and 41/54 GSTs active per Mucha 2019 via deep research; spontaneous conjugation). Gene review references were added for the newly reviewed members and stale 'no gene review' notes removed.
