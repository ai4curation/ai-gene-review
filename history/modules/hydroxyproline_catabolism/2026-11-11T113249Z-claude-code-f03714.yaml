  summary: Promote hydroxyproline catabolism module to COMPLETE
  details: |
    Made the module species-neutral: added a Bacteria taxonomic context grounded in growth tests outside the pseudomonads, kept KT2440 as one exemplar among three organisms, and added P. aeruginosa PA1268 and A. baylyi ACIAD0131 as representative members. Modelled the cis-4-hydroxy-D-proline oxidation step as an EXACTLY_ONE REALIZER variant set, separating the single-chain FAD enzyme of P. putida from the multi-subunit FAD/FMN/[2Fe-2S] enzyme of P. aeruginosa, which the literature reads as convergent. The multi-subunit variant is deliberately left ungrounded because the cached abstract does not map LhpBEF subunits to locus tags and no full text was reachable. Replaced the unsupported Pfam:PF01266 grounding with InterPro:IPR006076, which the PP_1255 record carries, and retained the PANTHER:PTHR12128:SF72 grounding added by maintainer PR #5076 after verifying it against panther.obo and the member index. Status set to COMPLETE: schema validation and the module validator pass, recommended-field compliance is 100%, and all 6 UniProt groundings have complete gene reviews. Two warnings are accepted and explained in the notes: FAMILY_FUNCTION_UNREVIEWED from the truthfully UNRESOLVED subfamily scope of GO:0047425, and the ungrounded oxidase variant leaf.
