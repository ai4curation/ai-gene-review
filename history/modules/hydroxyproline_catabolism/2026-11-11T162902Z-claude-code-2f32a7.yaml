  summary: Drop uncorroborated accessions from the LhpBEF note and align SF3 wording
  details: |
    Second #6274 review round. The LhpBEF note named three PAO1 accessions whose locus-to-accession mapping nothing cached in this repository records; it now gives locus tags only and says explicitly that the next pass should fetch the adjacent loci, keeping the parts that are cited (the lhpABFE operon, lhpA as PA1268) and the parts that are negative query results (no gene named lhpB, lhpE or lhpF in PAO1). The SF3 family-descriptor wording was aligned with the family review on aldarate and hydroxyproline as the routes its named members support. The accepted-warning paragraph was rewritten: the terminal annoton's warning is now REVIEW_DISAGREEMENT rather than ANNOTATION_SUPPORTED, because PP_1256's review moves every row off the NADP+ term; the module keeps that term since the two characterized exemplars carry it on their own measurements, and the note says the two should be revisited together once the proposed term exists.
