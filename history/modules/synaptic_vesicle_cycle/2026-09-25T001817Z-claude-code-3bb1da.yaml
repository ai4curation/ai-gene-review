  summary: 'Create umbrella module: synaptic vesicle cycle'
  details: |
    Created MODULE:synaptic_vesicle_cycle (ORGANELLE_LIFECYCLE, GO:0099504) with five stage parts: neurotransmitter loading, synapsin reserve-pool clustering, exocytosis, endocytosis, and optional vesicle maturation, wired as a cycle. Loading, exocytosis and endocytosis are elaborated in sibling modules; each stage here carries hallmark human exemplars (ATP6V1A, SLC17A7, SYN1/2, STX1A/SNAP25/VAMP2 SNARE complex, SYT1, CLTC, DNM1, SYP) as FAMILY descriptors with UniProt representative members and official PANTHER family labels. Evidence anchored to GO terms and PubMed-verified reviews (PMID:24183019, 17110340, 20438797, 28279363), which were cached under publications/. Validated with linkml-validate (ModuleReview) and module_validator; rendered to pages/modules.
