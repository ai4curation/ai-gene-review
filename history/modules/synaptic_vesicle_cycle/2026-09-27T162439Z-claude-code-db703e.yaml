  summary: Drop unsupported worm synaptophysin exemplar after gene review
  details: |
    The sph-1 gene review found the worm synaptophysin is expressed mainly in pharyngeal and sphincter muscle and that scm-1 sph-1 sng-1 triple mutants have normal synapses (PMID:16698939, cached), so the sph-1 representative member was removed from the synaptophysin maturation annoton and the notes and evidence record why. Also aligned worm accessions for snn-1 (G5EGI2) with the fetched gene review.
