  summary: Create canonical NLRP3 inflammasome module from the 2025 Cell Mol Immunol
    inflammasome review
  details: |
    Created modules/canonical_nlrp3_inflammasome.yaml as a four-part SIGNALING_PATHWAY module: NEK7-licensed NLRP3 sensor oligomer, ASC (PYCARD) filament assembly, caspase-1 activation and substrate cleavage, gasdermin D pore formation.

    Trigger: PMID:41062723 (Dubey et al., Cell Mol Immunol 2025). Reviews are secondary sources, so every mechanistic claim is grounded on the primary papers it cites: PMID:35114687 (ADP-bound human decamer), PMID:34861190 (mouse double-ring cage), PMID:36442502 (active NLRP3-NEK7-ASC disc, PYD filament), PMID:30487600 (PtdIns4P on dispersed TGN), PMID:32943500 (MTOC assembly via HDAC6), PMID:26814970 and PMID:26642356 and PMID:31189953 (kinase-independent NEK7 licensing), PMID:24630722 (unified ASC PYD/CARD polymerization), PMID:26375003 (GSDMD linker cleavage), PMID:27383986 (GSDMD-NT pore), PMID:33883744 (electrostatic cytokine filtering).

    Typing aligned with production GO-CAM gomodel:635b1e3e00001811 (The NLRP3 inflammasome, Human) and with the existing NLRP3, GSDMD and CASP4 gene reviews. Four annotons carry gocam_associations to specific model activities. NLRP3 keeps GO:0035591 signaling adaptor activity because the sensing activity has no GO term; the NLRP3 review's proposed 'inflammasome sensor activity' is noted as the blocker. GSDMD is grounded on the processed chain UniProtKB:P57764-PRO_0000437526, following the GO-CAM and gene review, since the pore is the cleavage product.

    Modelling decisions recorded in notes: NEK7 is an annoton inside part 1 rather than a sequential part, because it switches sensor conformational states rather than acting in sequence; priming and the proximal activation triggers are excluded as upstream context; other inflammasomes are left out, with NLRP1/CARD8 functional degradation and NAIP-NLRC4 flagged as needing different module shapes and the non-canonical caspase-4/5/11 route represented only as the K+ efflux feedback connection.

    No new GO annotations are proposed. All supporting_text strings were checked to be verbatim substrings of the cached publications.
