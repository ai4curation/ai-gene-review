  summary: 'Assess VPS4B ASC-speck candidate (litscan #3920): not modelled'
  details: |
    Adjudicated litscan:module-member handoff #3920, which proposed VPS4B (ESCRT AAA-ATPase, UniProtKB:O75351) as a member of modules/nlr_signaling.yaml on the strength of PMID:42714851 (J Exp Med 2026; Vps4B controls caspase-1 dynamics at the ASC speck). Routing was corrected first: nlr_signaling is the coarse sensor-layer sketch and its own notes delegate the NLRP3 branch to this module, so the question was answered here. Outcome: candidate assessed, NOT modelled. Reasons recorded in notes paragraph (9) and as a structured knowledge_gaps entry (BIOLOGY, BP_DARK, OPEN): (i) a single primary report, cached abstract-only, no independent replication, no inflammasome GOA row for VPS4B and no cached GO-CAM placing it at the speck; (ii) the functional unit is unsettled, since UniProt records heteromeric assembly with VPS4A and ComplexPortal CPX-338 is the VPS4A/B complex, so the GENE_PRODUCT vs PROTEIN_COMPLEX selector is not determinable; (iii) no ATPase-dead separation of function, and substrate selectivity is unexplained, with the ring seated on the ASC filament while the substrate is the caspase-1 CARD polymer. Reopening conditions and the admission path (a regulatory annoton on casp1_autoactivation with optional: true and a POSITIVELY_REGULATES edge, following the NEK7 precedent in note (3)) are recorded. PMID:42714851 was cached with ai-gene-review fetch-pmid. genes/human/VPS4B/VPS4B-ai-review.yaml is unchanged; the lead and the decision are journalled in VPS4B-notes.md. Validation: linkml-validate ModuleReview clean; module_validator passes with 2 pre-existing GSDMD CONTEXT_REQUIRED warnings unrelated to this change.
