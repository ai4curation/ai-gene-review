- type: EDIT
  outcome: changed
  summary: Add evidence to the GSDMD->NLRP3 feedback connection and justify GO:0050729
  details: |
    Review-response revision (PR #4413). (1) The gsdmd_pore_executioner -> nlrp3_licensed_sensor POSITIVELY_REGULATES connection now carries ModuleConnection.evidence with two primary citations, newly cached: PMID:26173909 (Schmid-Burgk et al., Eur J Immunol 2015) 'Furthermore, we show that active caspase-11 leads to a drop of intracellular potassium levels, which is necessary to activate NLRP3.' and PMID:26375259 (Kayagaki et al., Nature 2015) 'Mechanistically, caspase-11 cleaves gasdermin D, and the resulting amino-terminal fragment promotes both pyroptosis and NLRP3-dependent activation of caspase-1 in a cell-intrinsic manner.' The PMID:41062723 JNK1/NEK7 feedback sentence was deliberately NOT reused: it describes phosphorylation of NEK7 at Thr190/191 downstream of K+ efflux, a different loop that lands on the licensing factor rather than the sensor. The connection description now states explicitly that the evidence comes from the caspase-11 (non-canonical) entry point and that the same K+-efflux dependence is assumed, not separately demonstrated, for caspase-1-made GSDMD pores. (2) Reviewer suggestion on GO:0050729 positive regulation of inflammatory response for caspase-1: retained, with the reason recorded in role_description - GOA annotates UniProtKB:P29466 with GO:0050729 directly by IDA (PMID:12191486, PMID:15326478, PMID:32109412, PMID:32553275; checked via QuickGO 2026-10-10), so it is an experimentally grounded GOA term rather than an inference of this module. (3) The suggestion to retain a cytokine-release/protein-secretion term alongside the pyroptosis terms for the GSDMD part was not acted on: the gocam_associations note already records that GO-CAM 635b1e3e00001811 types that activity with GO:0009306 and that this module follows the GSDMD gene review's pyroptosis terms with the cytokines as cargo.
