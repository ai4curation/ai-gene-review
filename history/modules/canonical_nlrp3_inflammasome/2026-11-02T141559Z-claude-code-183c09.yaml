  summary: Made the canonical NLRP3 inflammasome module species-independent (ABSTRACT,
    PANTHER-subfamily participants) and linked it to GO-CAM 635b1e3e00001811
  details: |
    Switched scope CONCRETE -> ABSTRACT. Converted all 12 annoton participants from human GENE_PRODUCT selectors to FAMILY selectors on verified PANTHER subfamilies (PTHR45690:SF19 NLRP3, PTHR43289:SF2 NEK7, PTHR46985:SF2 ASC, PTHR47901:SF3 caspase-1, PTHR16399:SF15 gasdermin-D, PTHR12316:SF19 ninjurin-1), each with human and mouse representative members verified against UniProt. Kept taxon Mammalia and rewrote its justification: the architecture is vertebrate-wide but parts 5-6 are filled by non-orthologous proteins outside mammals (zebrafish caspase-a/b and gasdermin Eb, gomodel:60418ffa00001019). Recorded why no variant_sets were added (other gasdermins are cleaved by other proteases; CASP4/5/11 belong to the out-of-scope non-canonical route; IL1B/IL18 alternate as substrates, not role carriers). Added gocam_associations for gomodel:635b1e3e00001811 at the module root and on the annotons, mapping each model activity and recording the four defects from the GO-CAM review that the module corrects (mistyped molecular sensor entry point; self-input adaptor node that is the inactive ADP-bound cage, placed out of order; caspase-1 activation attributed to NLRP3 instead of ASC, with PYCARD having no activity; two dead-end CASP1 nodes). Added notes on which gocam-lint findings the module resolves. No node, annoton or part id was renamed or removed, so modules/il1_signaling.yaml module_refs still resolve.
