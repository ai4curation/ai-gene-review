  summary: Generalize unsaturated fatty acid biosynthesis module across bacterial
    routes and mark COMPLETE
  details: |
    Reworked the module as species-neutral and abstract. The cis double-bond step is a ROUTE variant set: FabA/FabB (E. coli and P. putida exemplars), FabN (E. faecalis FabZ1), FabM (S. pneumoniae, grounded on NCBIfam NF050134) and oxygen-dependent desaturation (B. subtilis Des, PTHR19353:SF73). FabF extension of palmitoleoyl-ACP is an optional part. Added PAINT ancestral nodes for FabB/FabF (PTN000918584, as in PR 5076), literature evidence, a knowledge gap on the committing condensing enzyme in FabM/FabN organisms, and cytosol/plasma membrane locations. Module validator reports 0 warnings; 9/9 grounded gene reviews complete.
