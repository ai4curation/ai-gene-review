  summary: Create eukaryote-wide triacylglycerol synthesis rule module for lipid droplets
  details: |
    New ModuleReview requiring diacylglycerol acylation by DGAT1 (PTHR10408 subfamilies SF7, SF12, SF22) or DGAT2 (PTHR12317 subfamilies SF14, SF0, SF63) as a ONE_OR_MORE realizer set, following the subfamily scopes in the two family reviews, with FIT proteins optional. Human (and, for DGAT2, yeast) representatives, PAINT nodes at Eukaryota shown to be ancestors of each human protein, and molecular functions from the human DGAT1 and DGAT2 reviews and, for FIT, the node's F IBD. Seipin, PDAT, sterol acyltransferases and perilipins are listed as not modelled. Part of the organelle lifecycle project (projects/ORGANELLE_LIFECYCLES.md).
