  summary: Create eukaryote-wide triacylglycerol synthesis rule module for lipid droplets
  details: |
    New ModuleReview requiring diacylglycerol acylation by DGAT1 (PTHR10408:SF7) or DGAT2 (PTHR12317 subfamilies SF14, SF0, SF63) as a ONE_OR_MORE realizer set, with FIT proteins optional. Human representatives, PAINT nodes at Eukaryota shown to be ancestors of each human protein, and molecular functions from the human DGAT1, DGAT2 and FITM2 reviews. Seipin, PDAT, sterol acyltransferases and perilipins are listed as not modelled. Part of the organelle lifecycle project (projects/ORGANELLE_LIFECYCLES.md).
