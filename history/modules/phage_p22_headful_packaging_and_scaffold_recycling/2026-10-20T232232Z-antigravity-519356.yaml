  details: |
    Created and validated concrete bacteriophage pathway module MODULE:phage_p22_headful_packaging_and_scaffold_recycling (Phage P22 non-proteolytic scaffolding recycling, pac-site headful DNA packaging, and portal-hub vertex closure) with 10 annotons and 10 genes.

    A coordinated viral capsid morphogenesis and genome packaging module exemplified by Salmonella phage P22 (Lederbergvirus) that couples non-proteolytic scaffolding-assisted T=7 procapsid assembly to pac-site-initiated headful DNA translocation and portal vertex closure. During procapsid assembly, ~250-300 copies of the 303-amino-acid scaffolding protein gp8 co-assemble with 415 subunits of the HK97/I-domain major capsid protein gp5, a single dodecameric portal ring (gp1) at one fivefold vertex, and the three internal ejection proteins (gp7, gp16, gp20). Unlike phage lambda or T4, P22 encodes no prohead maturation protease: when the nonameric small terminase (gp3) recognizes the pac site embedded within gene 3 and loads the large terminase motor/nuclease (gp2) onto the gp1 portal vertex, ATP-driven DNA translocation triggers intact release of all ~300 gp8 scaffolding molecules through pores in the procapsid lattice so that gp8 is recycled catalytically across multiple rounds of procapsid assembly. Once ~43.4 kb (~104% genome length) of terminally redundant, circularly permuted dsDNA fills the expanded T=7 head, conformational signaling through the 150-Angstrom alpha-helical barrel of the gp1 portal triggers sequence-nonspecific headful cleavage by gp2, followed by sequential binding of the dodecameric head-to-tail adapter gp4, hexameric tail hub gp10, and triple-helical coiled-coil needle plug gp26 to seal the packaged genome inside the virion.
