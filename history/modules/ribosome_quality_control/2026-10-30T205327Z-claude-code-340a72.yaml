  summary: 'Create module: human ribosome-associated quality control'
  details: |
    Built modules/ribosome_quality_control.yaml for issue #3952: a CONCRETE human module in six ordered parts (ZNF598/EDF1 collision sensing; optional GIGYF2-4EHP initiation repression; subunit dissociation as a ONE_OR_MORE variant set over the RQT/ASCC and PELO-HBS1L-ABCE1 routes; NEMF-LTN1-TCF25 nascent-chain ubiquitination with NEMF CAT tailing; ANKZF1 peptidyl-tRNA cleavage; VCP/p97 extraction). All 13 project candidate genes plus EIF4E2 already had complete reviews, so no fetching was needed. Every annoton function was read from the participant's own core_functions, giving CORE_SUPPORTED on all 19 grounded functions and no ungrounded leaf nodes. All six production GO-CAMs were attached as gocam_associations and cross-checked against the reviews: nine functions agree; ABCE1 GO:0017111 vs the reviewed child GO:0016887, ANKZF1 GO:0004521 vs the review's MODIFY to GO:0004549, and ZNF598 GO:0140517 (non-core in the review) diverge; EDF1, TCF25 and VCP appear in none of the human models. Three knowledge gaps were added, each anchored to a verbatim admission of ignorance in a cached publication. Validated with linkml-validate -C ModuleReview (no issues), the module validator (passed, one NCBITaxon ontology-unavailable warning), render-modules, render-projects and git diff --check.
