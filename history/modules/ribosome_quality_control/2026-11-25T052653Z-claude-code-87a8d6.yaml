  summary: Address PR review on the RQC module
  details: |
    Follow-up on the CHANGES_REQUESTED review of PR #5752, which built this
    module. Three findings fixed and five suggestions resolved.

    1. The module asserted, in four places, that ASCC1 and TRIP4 have no gene
       review here. Both are complete. TRIP4 is now a role-bearing active unit
       of the GO:0180022 RQC-trigger complex descriptor: its RQC core function
       asserts in_complex GO:0180022 and directly_involved_in GO:0072344 with no
       molecular function of its own, the same shape as TCF25, and
       TRIP4-goa.tsv carries part_of GO:0180022 by IDA (PMID:12077347). ASCC1
       stays unmodelled, but on its real grounds: both of its reviewed core
       functions are nuclear (molecular adaptor activity in DNA alkylation
       repair, transcription coactivation).
    2. Two annotons asserted a molecular function on a paper title that does not
       support it. eif4e2_cap_sequestration (GO:0000340 RNA 7-methylguanosine cap
       binding) rested on the title of PMID:32726578, which is about repression;
       it now cites PMID:17368478 (crystal structures with m7GTP) and
       PMID:35878012 (the IDA reference), with PMID:32726578 retained and
       relabelled as support for the process. pelo_hbs1l_sensor (GO:0170011
       stalled ribosome sensor activity) rested on the title of PMID:21448132,
       which is about dissociation; it now cites PMID:27863242, the IDA
       reference, whose comparison of the elongation, termination and rescue
       decoding-factor pairs is the sensing evidence.
    3. znf598_rna_adaptor had no evidence block, only a GO-CAM association, on
       the one activity the module deliberately keeps against the ZNF598
       review's KEEP_AS_NON_CORE ranking. It now cites PMID:32726578, the IDA
       reference for GO:0140517, and the curated UniProt function statement.

    Suggestions: znf598_40s_ubiquitination gains GO:0006513 protein
    monoubiquitination beside GO:0070534 (both terms are in ZNF598-goa.tsv and
    both rows are ACCEPT in the review) and uS3/RPS3 among its targets; the
    deliberate ASCC3/HBS1L modelling asymmetry is recorded as boundary decision
    (6); the uncited mechanistic rationale on the peptidyl_trna_release ->
    nascent_chain_extraction edge is softened to the ordering claim and cited to
    PMID:30244831; PTRH1 gets the boundary note it lacked, and the project-page
    TODO now asks for a PTRH1 review instead of the already-done ASCC1/TRIP4
    reviews.

    One suggestion declined as mistaken: the EDF1 annoton's pairing of GO:0006515
    with GO:0043024 does mirror EDF1-ai-review.yaml, which lists that process
    under both the GO:0003723 and GO:0043024 core functions.

    Checks: linkml-validate -C ModuleReview (no issues), module_validator
    (passed, 0 warnings), quote_check (39 quotes verified, 0 missing),
    render-modules and render-projects both clean. Branch refreshed from main
    through the GitHub update-branch API before validating.
