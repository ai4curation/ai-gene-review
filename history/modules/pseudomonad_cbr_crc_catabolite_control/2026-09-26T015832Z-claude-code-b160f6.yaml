  summary: 'Create module: pseudomonad CbrA/CbrB carbon catabolite control via Crc/Hfq'
  details: |
    New CONCRETE signalling module covering an inner cbr_phosphorelay bundle (CbrA sensor -> CbrB response regulator) that conforms_to two_component_relay WITH_DEVIATIONS for the absent Hpt tier, CbrB/sigma-54 induction of the crcZ and crcY decoy small RNAs, and the Hfq/Crc translational repression step those small RNAs antagonise. Grounded in the reviewed PSEPK cbrB (Q88DX2), rpoN (P0A171) and hfq (Q88DD3) exemplars. CbrA and Crc are described but not asserted as grounded members because neither has a gene review; the non-coding crcZ/crcY RNAs are represented as the regulatory connection rather than as participants, recorded as an ontology knowledge gap. Note PTHR32071:SF117 carries a surprising official PANTHER name that was kept verbatim per repository rules. Validated with linkml-validate -C ModuleReview and module_validator; rendered with just render-module.
