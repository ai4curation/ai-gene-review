  summary: 'Create C. elegans module: ZIP-2/CEBP-2 translation-surveillance immunity'
  details: |
    Concrete C. elegans module for the ZIP-2 branch of surveillance immunity triggered by host translation inhibition (P. aeruginosa ToxA, cycloheximide). Three root parts: uORF-mediated derepression of ZIP-2 protein (Q21148, no MF asserted), ZIP-2/CEBP-2 bZIP transcriptional activation (Q21148, Q8IG69; GO:0000981), and PMK-1-independent irg-1/irg-2 output (O16327, O16224; no MF asserted, functional contribution unestablished). 18 verbatim-checked quotes from cached papers and UniProt entries. GCN-2 excluded (no cached evidence it is needed for ZIP-2 induction) and ATFS-1/UPRmt, ESRE and PMK-1/ATF-7 recorded as cross-references only. Two BIOLOGY knowledge gaps (uORF sensing mechanism vs eIF2-alpha kinases; IRG-1/IRG-2 function). linkml-validate and module_validator pass (1 warning: NCBITaxon label not checked); rendered.
