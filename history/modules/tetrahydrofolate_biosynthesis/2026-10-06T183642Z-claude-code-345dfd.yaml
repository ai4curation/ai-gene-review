  details: |
    New module from YeastPathways FOLSYN-PWY-1, PWY-6147, PWY3O-45, PWY-6614, PWY-6543, PWY3O-1874 and PWY3O-20. Seven ordered parts (GTP cyclohydrolase I; dihydroneopterin triphosphate dephosphorylation; DHNA/HPPK/DHPS with separate FolB/FolK/FolP vs fungal trifunctional FOL1 variants; pABA branch with fused vs two-subunit ADC synthase and fungal ABZ2 vs bacterial PabC lyase variants; DHFS with monofunctional FOL3 vs bifunctional FolC; DHFR; FPGS with MET7 vs FolC). S. cerevisiae, S. pombe and E. coli exemplars; verified PANTHER subfamilies; GO-CAM links to seven SGD and two PomBase models. FOL1 asserted mitochondrial and MET7 cytosolic plus mitochondrial; knowledge gaps for the unknown yeast dihydroneopterin triphosphate dephosphorylation enzymes and intermediate transport.
