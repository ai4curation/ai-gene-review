- type: EDIT
  outcome: changed
  summary: Select MPP beta and alpha by every lineage's subfamily, not the human-only
    ones
  details: |
    In PANTHER's release-19 classification files the MPP selectors PTHR11851:SF103 (beta) and SF192 (alpha) hold the mammalian and primate proteins and none of the other 23 organisms' proteins in the census, so the rule failed in every non-mammalian genome on MPP. Beta now also selects SF149 (yeast MAS1, Arabidopsis MPPbeta and the other lineages' beta subunits; their IBA rows cite the same Eukaryota node PTN000220240); alpha also selects SF49 (yeast MAS2 and other lineages) and the Arabidopsis SF203 and SF194. UniProt's PANTHER cross-references agree. With the change the rule's required parts are met by fly, worm, both yeasts, Neurospora, Arabidopsis, rice, Chlamydomonas, moss, chytrid, Phytophthora and Plasmodium, as well as human (selector census, projects/ORGANELLE_LIFECYCLES/selector_census.py); the fission-yeast MPP beta match is to a protein on a branch where PAINT records loss of MPP activity.
