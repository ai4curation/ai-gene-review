  summary: Reconcile contradictory regulation passages in notes and move MVK regulation
    evidence to the rendered annoton slot
  details: |
    Addressed the two IMPORTANT items in the 2026-09-27T22:48 review of PR #3122.

    1. module.notes self-contradiction. The paragraph merged from main stated 'HMGCR is the sterol-feedback, SREBP/Insig-regulated rate-limiting step. MVK is a second, metabolite-level control point', which distinguished the two regulatory tiers by product class and so directly denied the sentence 19 lines above it ('the two tiers differ by position and by mechanism rather than by which class of product they sense'). Both passages rendered into pages/modules/mevalonate_pathway.html one paragraph apart. Dropped the product-class framing from the merged paragraph's first two sentences only ('HMGCR is the SREBP/Insig-regulated rate-limiting step. MVK is a second, distal control point'), keeping all of its evidence-limits caveats (ScMK-only kinetics/structures, no per-inhibitor Ki values, human site not established, rationale for modelling as a connection). The 'sterol-feedback-regulated' wording in the module description is untouched; it claims no exclusivity.

    2. mvk_activity evidence placement. The annoton carried regulation evidence in two slots: three items under function.evidence (PMID:9392419, PMID:18302342, PMID:42754161) and two under the annoton's own evidence. Only the latter renders: module.html.j2 calls evidence_list(annoton.evidence) directly, while the function block goes through descriptor_block, which never calls evidence_list and has no evidence slot in descriptor_slots. Confirmed in the rendered output before the change (PMID:9392419 and PMID:18302342 appeared only in the module-level cards; the pre-existing EC:2.7.1.36 function.evidence item did not appear at all). Moved the three PMID items into the annoton evidence list ahead of main's two, so the whole regulation case now renders beside the role_description it supports. Statements, titles and supporting_text are byte-identical to before the move; only indentation changed. The EC:2.7.1.36 and Reactome:R-HSA-191380 items stay in function.evidence as catalytic-identity evidence; that they are also dropped by the renderer is a template issue, not a module-content one.

    Verified after the edit: PMID:42754161 pubmed hrefs 5 -> 6, PMID:9392419 1 -> 2, PMID:18302342 1 -> 2 in pages/modules/mevalonate_pathway.html.

    Validation: linkml-validate -C ModuleReview -> No issues found; module_validator -> term labels OK (0 warnings); HTML regenerated with just render-module rather than hand-edited.

    Left the four SUGGESTION items from the same review (collapsing the doubled module-level PMID:42754161 entries, hedging the PMVK/MVD negative in description, the Fu 2008 human/rat attribution, the premise-vs-result quote choice) for a curator - each is a content judgment rather than a mechanical fix.
