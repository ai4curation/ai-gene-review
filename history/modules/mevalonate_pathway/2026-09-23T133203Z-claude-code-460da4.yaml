  summary: Document MVK feedback inhibition by downstream isoprenoid diphosphates
    in the mevalonate pathway module
  details: |
    Triage of litscan:module-member issue #3090 (PMID:42754161, structural basis of mevalonate kinase feedback
    inhibition). The module already modelled the MVK step catalytically but recorded no regulation for it, even
    though the pathway's second control point sits there and the linked human MVK gene review already carries
    verified references for it.

    Added, all with verbatim supporting_text checked by module_validator:
    - PMID:9392419 (Hinson 1997) — human MVK, PMVK and MVD assayed side by side; only MVK is inhibited, competitively
      at the ATP-binding site, potency GGPP > FPP > GPP > IPP >= DMAPP. This is what makes the regulation
      step-specific, so it is modelled on the mvk_step annoton rather than as a module-wide property.
    - PMID:18302342 (Fu 2008) — human/rat MVK structures; the farnesyl thiodiphosphate site overlaps the ATP site,
      accounting for the competitive kinetics.
    - PMID:42754161 (D'Emilia 2026, the issue's paper) — yeast ScMK apo plus five inhibitor-bound structures and
      kinetics across the whole C5-C20 series; all five bind one shared site, potencies spanning ~2 orders of
      magnitude. Attributed to S. cerevisiae rather than generalised, since the abstract characterises ScMK only.

    Edits: module description gained a clause on the distal MVK control point; three module-level evidence items;
    three annoton-level evidence items plus an expanded role_description on mvk_activity; a notes paragraph framing
    regulation as two-tiered (HMGCR sterol/SREBP-Insig proximal vs MVK isoprenoid-diphosphate distal).

    No new members or nodes were added — the issue's candidate was a mechanism, not a member. Kinetic constants were
    not transcribed because only abstracts are cached for all three papers (full_text_available: false).

    linkml-validate (ModuleReview) and module_validator both clean; HTML re-rendered.
