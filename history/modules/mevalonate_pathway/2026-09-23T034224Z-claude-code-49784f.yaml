  summary: Record MVK feedback inhibition by downstream isoprenoid pyrophosphates
    (PMID:42754161)
  details: |
    litscan module-member handoff issue #3090 asked whether PMID:42754161 (Structural basis of mevalonate pathway regulation by feedback inhibition of mevalonate kinase) adds a new member or mechanism to the mevalonate pathway module.

    Adjudication: no new module member. Mevalonate kinase is already part 3 of the module. The paper reports a regulatory mechanism, so it is recorded as (a) a module-level EvidenceItem, (b) annoton evidence and an enriched role_description on mvk_activity, (c) a NEGATIVELY_REGULATES connection mvd_step -> mvk_step with chaining_status NOT_APPLICABLE, and (d) a Regulation paragraph in module notes naming MVK as the second regulatory node alongside sterol-regulated HMGCR.

    On the second half of the handoff question (should kinetic parameters or structural features be captured): no. Only the abstract is cached (full_text_available: false). It gives no per-inhibitor Ki values and no residue-level account of how one site accommodates C5-C20 ligands, and the kinetics and six structures are for the S. cerevisiae enzyme (ScMK), not human MVK. The scope and species limits are stated explicitly in the notes rather than extrapolated.
