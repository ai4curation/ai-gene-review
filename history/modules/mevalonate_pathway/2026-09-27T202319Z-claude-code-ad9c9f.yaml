  summary: Correct the HMGCR regulation contrast in the MVK feedback framing (review
    follow-up)
  details: |
    Addresses the sole blocking item in the ai4c-reviewer CHANGES_REQUESTED review on PR #3122. The mvk_activity role_description and the module notes framed regulation as a sterol-versus-nonsterol dichotomy ('This makes the step responsive to nonsterol isoprenoid demand, whereas HMGCR responds to sterol status'; 'HMGCR carries the proximal, sterol/SREBP-Insig-controlled rate-limiting step'). The exclusivity is wrong: HMGCR feedback is multivalent, so nonsterol isoprenoid signals act on both nodes and the dichotomy misdescribes HMGCR. Reworded per the reviewer's suggestion so the contrast is positional and mechanistic instead -- proximal control of enzyme abundance at HMGCR (SREBP/Insig-mediated transcription and accelerated ER-associated degradation) versus distal direct inhibition of catalysis at MVK. The abundance-level characterisation of HMGCR is consistent with the sibling human HMGCR review, already cited as module evidence; no new mechanistic claim about nonsterol regulation of HMGCR is asserted, since that is not sourced in this module. The module description (line 9) was left alone: per the review it says 'sterol-feedback-regulated' without claiming exclusivity. Re-rendered pages/modules/mevalonate_pathway.html. Schema validation (linkml-validate --target-class ModuleReview) and the module validator both pass.
