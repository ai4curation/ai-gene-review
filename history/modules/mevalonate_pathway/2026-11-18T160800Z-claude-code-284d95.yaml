- type: EDIT
  outcome: changed
  summary: Cross-species representatives for the lower mevalonate pathway
  details: |
    Added 22 representative members from mouse, Arabidopsis, C. albicans, A. fumigatus, Dictyostelium, Drosophila, S. solfataricus, M. jannaschii and Streptomyces CL190 to the mevalonate kinase, both phosphomevalonate kinase variants and the decarboxylase step, each backed by a new gene review. The mevalonate kinase selector moved from PTHR43290 to subfamily PTHR43290:SF2 because the family holds a plant glucuronokinase subfamily; the decarboxylase family gained a note that PTHR10977 also holds archaeal enzymes of other reactions. Added references to the four revised family reviews and a notes paragraph on lineage-specific localization (plant peroxisomal PMK and MVD) and sterol auxotrophs. Validated with linkml schema validation and module_validator.
