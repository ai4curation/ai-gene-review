  summary: Assess caspase-9 CARD assembly-mode candidate against intrinsic apoptotic
    signaling
  details: |
    Resolved the litscan:module-member handoff #3921 (PMID:42819741, crystal structure and biophysics of the human caspase-9 CARD). Fetched the full text with just fetch-pmid (PMC13626777, XML route) and read Results, Discussion, Limitations and Methods rather than the abstract alone.

    The handoff named modules/death_receptor_apoptotic_signaling.yaml, which is the wrong module: caspase-9 and APAF-1 are the intrinsic/apoptosome pathway, and that module is scoped to GO:0008625 extrinsic apoptotic signaling via death domain receptors. The boundary is recorded in that module's notes in the same change; the substantive assessment belongs here, where CASP9 (UniProtKB:P55211) and APAF1 (UniProtKB:O14727) are already annotons.

    Determination: condition-dependent CASP9 CARD higher-order assembly is NOT modelled in this module. Four reasons. (i) No new participant - CASP9 and APAF1 are already parts, so this is finer structural detail on proteins the module carries, not a membership change. (ii) No revision to the modelled step - the new 2.4 A structure (PDB 9R44) is the isolated CARD with no binding partner, and the APAF-1 CARD interface it is compared against comes from previously published complexes (3YGS, 3JUY, 4RHW, 5WVC, 5WVE), which are what the existing apoptosome_assembly -> caspase_9_activation connection already rests on; only the R13/R52 subset of the arginine hotspot is shared with that interface, which is a reuse observation about a known interface rather than a new causal link. (iii) Conditions - the dimer-of-dimers came from 1.5 M lithium sulfate, which the authors call a non-physiological crystallization condition; DLS shifts are explicitly stoichiometry-blind, SEC showed no new peak, CEST resolved no substantially populated second state, and the reversible filament/droplet transition needed ~600 uM protein at 4 degrees C, which the authors note is not physiologically relevant. (iv) Claim strength - the limitations section states the assembly states "are characterized under in vitro conditions, and their physiological relevance remains to be established", and the AF3 predictions "require direct experimental validation"; AF3-guided EM in fact found APAF-1 CARD forming amorphous aggregates rather than filaments.

    Recorded following the ATHENA/ATPPM precedent in mitochondrial_complex_v.yaml (#2661, #3918): a CANDIDATE ASSESSED, NOT MODELLED paragraph in notes, queryable EvidenceItem entries with verbatim quotes, and the reference with a reference_review (relevance LOW, correctness VERIFIED). No knowledge_gaps entry: "is CARD phase behaviour physiologically relevant" is a question about CARD biophysics generally, not about this module's apoptosome wiring, and it is the authors' own stated next step rather than a gap this curation identified. No gene-review change is implied either - the CARD-CARD recruitment biology is already curated in genes/human/CASP9 and genes/human/APAF1, where uninformative GO:0005515 rows were MODIFYed to GO:0050700 CARD domain binding.

    Module composition is unchanged. Schema validation and the module validator pass, including the reference-title check and all five verbatim supporting_text quotes; the 3 remaining warnings are pre-existing on main (the git-ignored PANTHER member index is absent in this environment, so family membership was not checked for P99999/P55211).
