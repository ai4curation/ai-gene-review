  summary: Re-file litscan caspase-9 CARD structure paper from the death-receptor
    module into intrinsic apoptotic signaling
  details: |
    Litscan issue #3921 routed PMID:42819741 (Rawal et al., human caspase-9 CARD assembly modes) to modules/death_receptor_apoptotic_signaling.yaml. The paper is about the CASP9/APAF-1 apoptosome, i.e. the intrinsic pathway, so it was declined there (note added recording why) and re-filed in modules/intrinsic_apoptotic_signaling.yaml.

    No new module member results: CASP9 and APAF1 are already annotons at apoptosome_assembly and caspase_9_activation. Added the paper to the module references with four verbatim-quoted findings, annoton-level evidence on the APAF1 scaffold and CASP9 initiator-protease annotons, and one BIOLOGY knowledge gap on whether homotypic caspase-9 CARD assembly is populated in cells on the same arginine surface the apoptosome uses.

    The in vitro higher-order states (sulfate-mediated dimer-of-dimers, filaments, droplets) were deliberately not modeled as module states: the authors state their physiological relevance is untested, and the gap provenance quotes those admissions.
