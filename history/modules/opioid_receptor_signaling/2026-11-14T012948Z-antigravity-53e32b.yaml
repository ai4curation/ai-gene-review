- type: EDIT
  outcome: changed
  summary: Scope Reactome evidence statements across opioid ligand and receptor annotons,
    add PMID:41461581 to PNOC and R-HSA-374298 to OPRK1, and drop redundant R-HSA-418594
    on order-1 ligands
  details: |
    Resolved suggestion #37 from PR #5680 and Round-1 feedback on PR #6360: added Reactome:R-HSA-111885 (Opioid Signalling) to PENK, PDYN, and PNOC ligand annotons with statements strictly scoped to the verbatim quote; added PMID:41461581 (The Concise Guide to PHARMACOLOGY 2025/26: G protein-coupled receptors) to pnoc_prepronociceptin_ligand to provide ligand-specific evidence for PNOC (UniProtKB:Q13519)-derived nociceptin/orphanin FQ; added Reactome:R-HSA-374298 (Opioid receptors bind opioid peptides) to oprk1_kappa_opioid_receptor; removed redundant Reactome:R-HSA-418594 entries from order-1 ligand annotons (retained at module level and on order-2 Gi/adenylate cyclase annotons); and narrowed Reactome:R-HSA-374298 and Reactome:R-HSA-111885 statements on OPRM1, OPRD1, and OPRL1.
