    PMID:7481766, PMID:12950177) beside the generic Reactome Gi quote, whose statement was
    softened. Schema and module_validator pass; module_validator now reports
    FAMILY_FUNCTION_UNREVIEWED for GO:0005184 on PTHR11438:SF2 because the PTHR11438 family review
    still scopes GO:0001515 family-wide; re-scoping that family review is follow-up work.
