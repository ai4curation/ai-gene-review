- type: EDIT
  outcome: changed
  summary: Add Drosophila representatives and lineage variant sets to cGAS-STING module
  details: |
    Gave every step a human and a Drosophila representative. STING cGAMP receptor converted to a PTHR34339 family participant with human STING1 and Drosophila Sting; the 2',3'-cGAMP binding term is kept because GO:0140704 3',2'-cGAMP binding is not under GO:0140702, and the description records that fly Sting prefers 3',2'-cGAMP (PMID:34261127). Added fly IKKepsilon/dTBK1 (Q9V3Y8, PTHR22969:SF15, IBD seed of PTN000540338; dSTING- and dTBK1-dependent immunity per PMID:34965418) to the TBK1 family and removed positive regulation of type I interferon production from that shared annoton, leaving activation of innate immune response. Ligand sensing modelled as a variant set (vertebrate cGAS dsDNA binding; Drosophila cGLR1 dsRNA binding, no fly cGLR has a DNA-binding annotation) and the effector as a variant set (vertebrate IRF3 type I interferon; Drosophila Relish NF-kappaB, since no fly protein has the IRF DNA-binding domain IPR001346). Fly variants grounded in GO-CAM gomodel:613aae0000000040. Step ids renamed to nucleic_acid_sensing and transcriptional_output. Validated with linkml-validate and module_validator; rendered.
