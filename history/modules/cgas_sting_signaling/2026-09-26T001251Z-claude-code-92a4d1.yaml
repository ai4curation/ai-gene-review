  summary: 'Create module: cGAS-STING DNA-sensing signaling pathway'
  details: |
    Curated a new SIGNALING_PATHWAY ModuleReview for the cytosolic DNA-sensing cGAS-STING axis (GO:0140896) with four ordered REGULATORY_STEP parts: cGAS dsDNA sensing and 2'3'-cGAMP synthesis (Q8N884), STING1 cGAMP binding/adaptor activation and ER-to-Golgi trafficking (Q86WV6), TBK1 recruitment and kinase activation (PANTHER PTHR22969 family with PTN000540338/PTN001491808 IBD anchors; TBK1 Q9UHD2), and IRF3 transcriptional induction of type I interferon (Q14653), joined by CAUSES connections. Molecular-function, process, location, substrate/product terms and GO-CAM activity associations grounded against cached production GO-CAMs gomodel:64c3044100001129 and gomodel:5f46c3b700001570 and local PANTHER PAINT rows. Validated with linkml-validate (ModuleReview) and the module_validator (term labels OK) and rendered to pages/modules/cgas_sting_signaling.html. Added animal-spanning representative-member exemplars to the two deeply conserved roles: STING adaptor (PANTHER PTHR34339: human Q86WV6, zebrafish E7F4N7, Drosophila A0A0B4LFY9, Pacific oyster P0DUE1, Nematostella A7SLZ2, Stylophora coral A0A2B4SJD2) and the cGAS/cGLR cyclic-dinucleotide sensor (PANTHER PTHR10656, family id left unasserted because vertebrate cGAS SF35 and invertebrate cGLR SF42 are paralogous subfunctions; human cGAS Q8N884, Drosophila cGlr1 A1ZA55 and cGlr2 A8DYP7, Nematostella A7SFB5, Hydra A0A8B6XWW9). TBK1 and IRF3 nodes were deliberately kept vertebrate because the STING->TBK1->IRF3->type I IFN branch is a vertebrate elaboration (invertebrate cGAS-STING converges on NF-kappaB). Exemplar accessions added to interpro/panther/panther-members.tsv.
