  summary: 'Create C. elegans module: piRNA-initiated transgenerational silencing'
  details: |
    Concrete C. elegans BIOLOGICAL_PROCESS module covering how germline silencing is targeted and inherited. The amplification machinery is delegated to, and cross-referenced with, the sibling module c_elegans_mutator_22g_rna_amplification. Four root parts: PRG-1/21U-RNA recognition (P90786, 21U-RNA binding) with the PRG-1-binding P granule scaffold DEPS-1 (Q9N303); secondary 22G-RNA hand-off with the cytoplasmic WAGO-1 effector (Q21770); nuclear HRDE-1/WAGO-9 (Q09249, from UniProt REST, unreviewed here) heritable H3K9me3 silencing; and Z granule ZNFX-1 (E9P860, RNA helicase) / WAGO-4 (O62275, siRNA binding) inheritance. MFs follow the prg-1, deps-1, wago-1, znfx-1 and wago-4 review core functions. Quotes come from cached PMIDs (PMID:22810588 and PMID:22738725 newly fetched) and were all checked verbatim. piRNA biogenesis, PRG-2, the NRDE/SET-25/SET-32/HPL-2 chromatin factors and SIMR-1 are named but not modeled. One BIOLOGY knowledge gap covers coordination of the nuclear and Z granule loops. linkml-validate and module_validator pass with no errors (1 warning: NCBITaxon label not consulted).
