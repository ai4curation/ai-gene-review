  summary: Generalize piRNA silencing module from C. elegans to Metazoa
  details: |
    Renamed c_elegans_pirna_transgenerational_silencing to pirna_mediated_germline_silencing (Metazoa, NCBITaxon:33208; slug says germline rather than transposon silencing because nematode piRNAs scan all germline transcripts and the silenced state is heritable). Part 1 is now a FAMILY role (PIWI-clade Argonautes, piRNA binding GO:0034584; no PANTHER id because PTHR22891 is the whole Argonaute superfamily; PAINT node PTN007716312) with PRG-1, PIWIL1, PIWIL2, Aub and Ago3 as representatives. Part 2 is a variant set (taxon / amplification mechanism): ping-pong slicing (Aub, Ago3, PIWIL2; RNA endonuclease activity, secondary piRNA processing) versus nematode RdRP 22G-RNA amplification (DEPS-1, WAGO-1; machinery cross-referenced to MODULE:c_elegans_mutator_22g_rna_amplification). Part 3 is a variant set (taxon / sequence lineage) of non-slicing nuclear effectors: fly Piwi (GO:0141006), PIWIL4/MIWI2 (GO:0141196), and HRDE-1 (siRNA binding) with NRDE-2 (no MF). PIWIL2 reaches DNA methylation only via a connection to PIWIL4. Part 4 (ZNFX-1/WAGO-4 Z granules) is optional and C. elegans-specific. All MFs follow the gene review core functions; all 39 quotes checked verbatim against cached sources. Old page removed, new page rendered; cross-reference lines in the mutator module updated. linkml-validate clean; module_validator passes (4 warnings: NCBITaxon labels not consulted, verified separately with runoak).
