  summary: Create phagocytic engulfment module
  details: |
    Created a reusable metazoan phagocytic engulfment module (GO:0006911) with four parts: particle recognition (receptor-class variants: Fc-gamma receptor/SYK, CR3 iC3b receptor, Dectin-1, apoptotic-cell receptors TIMD4, GAS6-MERTK, CED-1/MEGF10 and the CED-6/GULP adaptor), Rho-GTPase activation (Rac/Cdc42 via CRK-DOCK180-ELMO versus RhoA for CR3), Arp2/3 actin polymerization, and class I PI3K/dynamin cup closure. Grounded with verified UniProt exemplars (human and C. elegans), PANTHER families checked against panther.obo and the member index, and PAINT nodes PTN000132688 (CED-6/GULP, phagocytosis engulfment), PTN000632671 and PTN000170013. Literature quotes come from cached PubMed records. Knowledge gaps cover the CED-1 ligand, the CED-6-to-actin link, and the CED-7 activity.
