  summary: Fix MTFMT note, lead MRPS22 with COXPD5, drop MTO1 unit function
  details: |
    Review round on PR 5739. Notes: MTFMT is no longer listed as unmodelled; added a cross-reference to mitochondrial_trna_charging_and_initiator_formylation, which models AARS2/DARS2/TARS2 charging and MTFMT formylation. Description: MRPS22 now leads with COXPD5 (MIM:611719, from UniProt; no dismech entry exists, so no MONDO id is given) and gives ovarian dysgenesis 7 (MONDO:0020857), curated in dismech as a subtype of 46,XX gonadal dysgenesis (MONDO:0009299). The MTO1 active unit no longer asserts GO:0050660 FAD binding as its function; the role text describes the FAD cofactor. Module validator warnings went from 2 to 1.
