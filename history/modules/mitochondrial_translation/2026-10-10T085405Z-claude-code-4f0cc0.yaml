  summary: 'Create module: mitochondrial translation'
  details: |
    New ModuleReview for human mitochondrial translation, filling the gap between the existing OXPHOS complex modules and the dismech combined oxidative phosphorylation deficiency (COXPD) entries. Six parts: mt-tRNA anticodon-loop modification (GTPBP3-MTO1 complex, NSUN3 then ALKBH1, TRIT1), mt-tRNA aminoacylation (DARS2 as representative *ARS2, EARS2), GatCAB transamidation of Glu-tRNAGln (QRSL1, GATB, GATC as complex active units), the 28S mitoribosomal small subunit (MRPS7, MRPS22, PTCD3), initiation (MTIF2, MTIF3) and elongation (TUFM, TSFM, GFM1). UniProtKB accessions came from the UniProt REST API (reviewed human entries), GO terms from UniProt GO annotations or the ALKBH1/DARS2 gene-review core functions and were checked in go.db, and Reactome pathway titles were checked against the Reactome ContentService. Disease consequences cite the MONDO ids of the corresponding dismech entries; ALKBH1 is described as the NSUN3 pathway partner, not a COXPD48 disease gene, as in dismech. Five FUNCTION_UNREVIEWED validator warnings (GTPBP3, NSUN3, TRIT1, MRPS7, PTCD3) remain because those gene reviews were scaffolded but still PENDING when the module was written.
