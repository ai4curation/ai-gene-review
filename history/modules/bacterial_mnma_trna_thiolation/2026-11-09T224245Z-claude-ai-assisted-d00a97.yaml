  summary: Ground Tus relay roles at PANTHER subfamilies, add E. coli K-12 exemplars,
    model TusBCD as a complex with active units, promote to COMPLETE
  details: |
    Kept the module within Gammaproteobacteria: the TusB/TusC/TusD/TusE subunit families are lineage-restricted (tree check of the PAINT node leaves), while MnmA itself is near-universal; other lineages and mitochondria use other sulfur donors and are out of scope. Rewrote description and notes species-neutrally; E. coli K-12 is the experimental exemplar for every role and P. putida KT2440 a homology/locus-based exemplar. Grounded IscS at PTHR11601:SF34 (consistent with the Isc module), TusA PTHR33279:SF2, TusD PTHR34874:SF3, TusC PTHR38780:SF1, TusB PTHR37526:SF1, TusE PTHR37010:SF1, MnmA PTHR11933:SF5, with PAINT nodes for TusD, TusE and MnmA. TusBCD is now one PROTEIN_COMPLEX annoton (sulfur carrier activity) with TusD/TusC/TusB active units so the structural subunits no longer lack a function. Added the committed tree check (modules/bacterial_mnma_trna_thiolation-analysis). Validators clean with 0 warnings, recommended-field compliance 100%, gene-review completeness 14/14; status COMPLETE, scope CONCRETE.
