- type: EDIT
  outcome: changed
  summary: Domain requirement scoped to excluding Vtc1-like proteins; selected accessions
    named
  details: |
    From the review of #6481. The earlier record (030223Z) and the module said the VTC-domain requirement restricts the step to the catalytic Vtc4; the entries table places Toxoplasma vtc2 (A0A125YS36) in PTHR46140:SF1, so the requirement excludes the Vtc1-like DUF202-only proteins but not every non-catalytic VTC-domain subunit. The family description now says so and names the protein the step is met on in each passing census organism (P47075, P78810, Q7SCX0, F4NUF7, Q382V9, Q4QI04, B8CGM0, C6KT60, and Chlamydomonas A0A2K3E503, A0A2K3DF66, A0A2K3DBW4), with caveats that the Plasmodium pass (C6KT60) does not establish a catalytic Vtc4 and that A0A2K3DBW4 (Cre10.g461500) is described as Vtc1-like in PMID:42126255. Preferred term changed to VTC-domain subunit of PTHR46140:SF1. Added GO:0000329 fungal-type vacuole membrane as a location. Notes: Dictyostelium moved to the caveat that a failing genome may still have acidocalcisomes (PMID:11748243), and the reason for keeping the Eukaryota context and for not adding a PPK1 variant recorded.
