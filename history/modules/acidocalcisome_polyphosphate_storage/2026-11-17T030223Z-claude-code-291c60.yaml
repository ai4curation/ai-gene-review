- type: CREATE
  outcome: changed
  summary: 'New rule module: VTC polyphosphate synthesis into an acidified acidocalcisome
    lumen'
  details: |
    Created as the core rule of the acidocalcisome. Required: a Vtc4-type catalytic subunit, PANTHER:PTHR46140:SF1 with required_domain InterPro:IPR018966 (VTC domain), because the PTHR46140 family review records that SF1 mixes Vtc4 with Vtc1-like and Vtc5 proteins (Dictyostelium Q54JW8 and Q54ZD5 are DUF202-only); grounded on yeast VTC4 P47075 and T. brucei Vtc4 Q382V9, both citing the Eukaryota PAINT node PTN001646574 (F:GO:0008976). Required: an acidifying pump, ONE_OR_MORE of the H+-PPase (PTHR31998, AVP1 P31414, node PTN009132393, F:GO:0009678) and the V-ATPase rule (module_ref vacuolar_atpase_acidification). Optional: AP-3 delta (PTHR22781:SF12, human AP3D1 O14617, node PTN000513025), because AP-3 is not acidocalcisome-specific and Chlamydomonas has no SF12 protein. Literature: PMID:42126255, 24114837, 12121996, 11579086, 21880705, 18252798, 15738951, 17940044. Census: met in the chytrid, Chlamydomonas, Trypanosoma, Leishmania, Plasmodium, Thalassiosira and the three fungi; every other census organism fails on the Vtc4 step only.
