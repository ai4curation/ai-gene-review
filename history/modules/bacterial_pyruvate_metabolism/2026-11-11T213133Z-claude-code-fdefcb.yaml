  summary: Generalize and promote bacterial pyruvate metabolism module to COMPLETE
  details: |
    Curated by Claude (AI-assisted). Made the module species-neutral with experimental exemplars (E. coli AceE, AceF, LpdA, Ppc, PykF, PpsA; B. subtilis PycA; human PC) beside the P. putida KT2440 members. Added a single-chain pyruvate carboxylase variant (PTHR43778:SF2). Regrounded the E3 annoton to PTHR22912:SF160 with E. coli LpdA and dropped KT2440 Lpd (PP_5366, an LPD-3 paralog); KT2440 LpdG (SF224) is the PDH E3. Added the PTN000530299 and PTN001821692 nodes from PR #5076 (PTN001821692 on the single-chain variant). All 16 grounded genes and 7 PANTHER families reviewed to COMPLETE.
