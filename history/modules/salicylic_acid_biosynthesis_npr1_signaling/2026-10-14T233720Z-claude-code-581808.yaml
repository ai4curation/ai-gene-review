  summary: 'Create module: salicylic_acid_biosynthesis_npr1_signaling (ICS1 route
    + NPR1/WRKY70)'
  details: |
    New concrete Arabidopsis module for ARATH corpus genes with no module (PR #5014). Part 1: ICS1 isochorismate synthase (GO:0008909, GO:0009697, chloroplast; RHEA:18985), with EDS5 export, PBS3 glutamate conjugation and EPS1 described in prose only (no gene reviews; PMID:31371615 fetched). Part 2: NPR1 transcription coregulator (GO:0003712, GO:0009862, nucleus) as in its review; NPR3/NPR4 SA receptors and TGA partners in prose (no reviews), NPR1 weak SA binding per PMID:32788727. Part 3: WRKY70 DNA-binding TF (GO:0003700, GO:0080151) downstream of NPR1 (PMID:14742872). EDS1/PAD4 deliberately not parts: they are upstream SA-amplifying adaptors already modelled as eds1_pad4_receptor in plant_nlr_resistosome_signaling (same MF GO:0035591), referenced in notes. RPM1/RPS2 left to NLR biology. Knowledge gaps: WRKY70 activator vs repressor role; ICS-independent SA route. All supporting_text verified by module_validator; no PANTHER ids; no GO-CAMs contain these proteins.
