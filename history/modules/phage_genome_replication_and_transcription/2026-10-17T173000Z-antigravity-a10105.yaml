  details: |
    Created modules/phage_genome_replication_and_transcription.yaml modeling bacteriophage genome replication (GO:0039693 viral DNA genome replication and GO:0039694 viral RNA genome replication), viral transcription regulation (GO:0019083), and host takeover / counter-defense (GO:0039653, GO:0099015, GO:0099018, GO:0098672). Structured around two VariantSetDescriptors: (1) genome_replication_strategy covering phage-encoded replisome / recombination-dependent dsDNA replication (T4, T7), host-replisome-hijacking theta/sigma dsDNA replication (lambda O/P, P22, P2), rolling-circle ssDNA replication via endonuclease initiator protein (GO:0039683; phiX174 A, M13 pII, P4 alpha), protein-primed linear dsDNA replication (phi29, PRD1), and RNA-directed RNA polymerase replication (GO:0039694, GO:0003968; MS2, Qbeta, phi6); and (2) transcription_takeover_strategy covering host RNAP sigma/antitermination remodeling (lambda N/Q, T4 AsiA/gp55/gp33), phage-encoded single-subunit RNAP cascade with host RNAP shutoff (T7 gp1/gp2), and direct translation of positive-sense ssRNA genomes (MS2, Qbeta). Validated against ModuleReview schema and PANTHER member index.
