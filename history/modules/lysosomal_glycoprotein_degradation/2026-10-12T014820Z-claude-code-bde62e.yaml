  summary: Narrow three FAMILY selectors to the subfamilies that identify the enzyme
  details: |
    Review round 3 suggestion 1 for PR 4816. Three steps grounded their participant on a PANTHER family that spans more than the enzyme performing the step. The NAGA step is the one where it bites: PTHR11452 ALPHA-GALACTOSIDASE/ALPHA-N-ACETYLGALACTOSAMINIDASE spans both GLA and NAGA, which are different enzymes in different pathways with different disorders (Fabry versus Schindler/Kanzaki), so a FAMILY selector there also selects the enzyme that performs a step in another module. Narrowed to PTHR11452:SF25 ALPHA-N-ACETYLGALACTOSAMINIDASE, with FUCA1 PTHR10030 to PTHR10030:SF2 TISSUE ALPHA-L-FUCOSIDASE and AGA PTHR10188 to PTHR10188:SF6 N(4)-(BETA-N-ACETYLGLUCOSAMINYL)-L-ASPARAGINASE for the same reason, less sharply. No id was guessed: each subfamily id and its verbatim label were read from interpro/panther/panther.obo, and each is the representative member's own UniProt DR PANTHER cross-reference (P17050 to PTHR11452:SF25, P04066 to PTHR10030:SF2, P20933 to PTHR10188:SF6). The GLB1 step was deliberately left at family level: UniProt records only PTHR23421 for P16278 with no subfamily, so narrowing it to SF172 would assert more than the authoritative source does, even though the module validator suggests it from its member index. Module validation passes; the member-index checks warn rather than confirm because the git-ignored index is not built in this environment.
