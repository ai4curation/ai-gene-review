  summary: Create lysosomal glycoprotein (N-glycan) degradation module
  details: |
    New METABOLIC_PATHWAY module covering lysosomal exoglycosidase degradation of glycoprotein N-glycans: NEU1, GLB1, HEXA/HEXB, MAN2B1, MANBA (non-reducing end), FUCA1 then AGA (reducing end; core fucose blocks AGA), and NAGA. Four parts (FUCA1, AGA, GLB1, NAGA) are grounded in completed gene reviews; the others on UniProt/EC only. PANTHER family ids and labels were taken from UniProt cross-references and checked against interpro/panther/panther.obo. Validated with linkml-validate (ModuleReview) and the module validator (pass, 6 warnings: member-index coverage and a subfamily suggestion); rendered.
