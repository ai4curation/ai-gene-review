  summary: 'Create the contractile vacuole complex module (descriptive): V-ATPase
    and Rab11'
  details: |
    New DESCRIPTIVE module for the contractile vacuole complex (GO:0000331), Eukaryota context. Part 1 references vacuolar_atpase_acidification, the proton pump whose gradient drives water and ion uptake (PMID:24016530). Part 2 is a Rab11-family GTPase selected by PTHR47979 SF33 (DRAB11; Dictyostelium Rab11A P36412 and the Rab11 of every census organism but human, Arabidopsis and rice), SF110 and SF41 (human RAB11A and RAB11B), with GTPase activity (GO:0003924) at the contractile vacuolar membrane (GO:0031164); Dictyostelium Rab11 is exclusively on the V-ATPase-rich contractile vacuole membranes and a dominant negative form disrupts the system (PMID:11686306). PANTHER labels are taken from interpro/panther/panther.obo, and both representatives were checked against PANTHER's classification files. PAINT nodes PTN000633981 (Rab11 clade; localisation IBDs only) and PTN004663565 (GTPase activity) are recorded; the PTHR47979 PAINT table is added. The module is not a rule: both parts run membrane traffic in every eukaryote, so it is met in organisms without the organelle.
