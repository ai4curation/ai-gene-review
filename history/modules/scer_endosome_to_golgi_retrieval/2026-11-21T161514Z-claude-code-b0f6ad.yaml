  summary: 'New S. cerevisiae endosome-to-Golgi retrieval module: SNX-BAR coat routes
    plus Vps1 scission'
  details: |
    Built from the seven retromer-pathway gene reviews in this PR plus VPS1.
    Root: GO:0042147 retrograde transport, endosome to Golgi, S. cerevisiae (NCBITaxon:4932), at the endosome.
    Part 1, the cargo-sorting tubule coat, is a ROUTE variant set with two routes. The retromer route has three annotons: the cargo-selective subcomplex Vps35/Pep8/Vps29 (GO:0030906) with cargo adaptor activity GO:0140312 and Vps10 (P32319) as cargo; the Vps5-Vps17 tubulation complex (GO:0030905) with membrane bending activity GO:0180020; and Vps5 protein-membrane adaptor activity GO:0043495. The Mvp1 route is the Mvp1 coat with membrane bending activity and Vps55 as cargo (named only, no accession).
    Part 2, carrier scission, is Vps1 with membrane scission GTPase motor activity GO:1990606.
    Connections: the subcomplex PRECEDES the tubulation complex; the coat PRECEDES scission; Mvp1 POSITIVELY_REGULATES Vps1 (PMID:34524084).
    The S. pombe GO-CAM 693b3c0900002174 is cited as evidence, not pinned. Snx3, the Snx4 route, Ypt7, CROP and GARP/SNARE steps are named in notes as outside the module pending reviews.
