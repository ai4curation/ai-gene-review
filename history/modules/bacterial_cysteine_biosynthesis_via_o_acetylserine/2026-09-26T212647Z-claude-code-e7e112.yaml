  summary: Correct the GO:0006535 obsoletion attribution
  details: |
    The evidence statement attributed the GO:0006535 obsoletion to GO release 2026-07-26. It is older: the local oaklib go.db built from release 2026-03-25 already carries owl:deprecated true and IAO:0100001 (replaced_by) GO:0019344, and the 2026-07-26 obo agrees. CI never reported it because PR #2548 added a term_label_aliases entry in conf/oak_config.yaml accepting the pre-obsoletion label, which the validator consulted before the obsolete-prefixed ontology label could mismatch. The statement now says the term is obsolete in every release held here and that the alias masked it; the alias is removed from conf/oak_config.yaml and module_validator now refuses to let a reviewed alias bridge an obsoleted term.
