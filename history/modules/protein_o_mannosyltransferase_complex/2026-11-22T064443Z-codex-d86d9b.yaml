    Created a concrete Homo sapiens POMT1:POMT2 protein O-mannosyltransferase complex module as the biological module for PTHR10050. Scoped the module to the two active ER membrane subunits that enable GO:0004169 in the GO:0031502 complex and participate in GO:0035269, excluded Dol-P-Man synthesis and downstream Golgi alpha-dystroglycan elaboration from this two-subunit complex boundary, and linked the equivalent mouse Pomt1/Pomt2 GO-CAM activity in production model 6690711d00001433. Validated the module with LinkML ModuleReview validation and python -m ai_gene_review.validation.module_validator modules/protein_o_mannosyltransferase_complex.yaml.
