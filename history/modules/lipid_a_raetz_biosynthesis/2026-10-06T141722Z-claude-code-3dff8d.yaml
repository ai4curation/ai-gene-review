  summary: Create Kdo2-lipid A (Raetz pathway) module with LpxC committed step and
    FtsH/LapB/YejM control
  details: |
    New module modules/lipid_a_raetz_biosynthesis.yaml covering the constitutive nine-enzyme Raetz pathway in E. coli K-12 (LpxA, LpxC, LpxD, LpxH, LpxB, LpxK, WaaA/KdtA, LpxL, LpxM) as ten ordered parts. LpxC is marked as the committed step, justified by the unfavourable LpxA equilibrium (PMID:8366124). FtsH/LapB(YciM)/YejM(PbgA) are modelled as one optional REGULATORY_STEP part connected NEGATIVELY_REGULATES to the LpxC step, not as pathway chemistry, with internal YejM->LapB->FtsH regulation edges. Each step grounded in UniProt K-12 accessions, Rhea reactions, GO MF terms looked up via QuickGO/OLS, and a primary gene-identification paper. Cross-linked to MODULE:kdo_biosynthesis (CMP-Kdo supply, consumed by WaaA) and MODULE:bacterial_lps_transport (downstream).
