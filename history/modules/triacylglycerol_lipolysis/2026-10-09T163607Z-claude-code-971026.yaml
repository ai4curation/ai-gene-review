  summary: 'Create: intracellular triacylglycerol lipolysis module'
  details: |
    New METABOLIC_PATHWAY module for neutral lipolysis: ABHD5 co-activation (GO:0060229) positively regulates ATGL/PNPLA2 triacylglycerol lipase (GO:0004806) on lipid droplets, which provides diacylglycerol to HSL/LIPE (GO:0120516), which provides monoacylglycerol to MGLL (GO:0047372). Grounded to the completed PNPLA2, ABHD5 and LIPE reviews; PANTHER subfamily ids and labels copied from panther.obo; MGLL family id left unasserted (no review). Created because no module covered the lipolysis step used in the dismech Dorfman_Chanarin_Disease and Neutral_Lipid_Storage_Myopathy pathographs. Schema and module_validator checks pass (warnings only: members not in the local PANTHER member index).
