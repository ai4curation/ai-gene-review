  summary: Ground the GspJ subfamily claim on PANTHER's own classification
  details: |
    Third review round on PR 6489. The GspJ annoton's PANTHER:PTHR39583:SF2 term looked unsupported for the P. putida exemplar Q88P01, whose cached UniProt record carried no PANTHER line. The cache was stale: UniProt entry version 95 of 28 January 2026 had no cross-reference, version 97 of 4 November 2026 has PTHR39583 and PTHR39583:SF2, and PANTHER's own classification places Q88P01 in PTHR39583:SF2 independently of UniProt. The record was refreshed with just fetch-gene, which changed no GOA row and left every quote matching, and the descriptor now states that both exemplars are in SF2 by PANTHER's classification, when UniProt added the cross-reference, and why no signature is used instead: the GspJ-specific entry IPR010055 (Pfam PF11612, NCBIfam TIGR01711) covers only the P. aeruginosa protein, while IPR051621 integrates PTHR39583 as a whole and so is no narrower than the family. Also aligned the grounding summary with the GspE and GspD descriptors: it now says that the GspD signature does cover the Xanthomonas XpsD and that the GspE signature recovers HxcR but not XpsE, so no grounding in this module reaches XpsE.
