  summary: Address the review round on the T2SS module grounding
  details: |
    Review round on PR 6489. Reconciled the family groundings in one direction, away from the PANTHER subfamilies and back to the T2SS-specific signatures the family reviews already described, wherever the subfamily crosses systems or excludes an in-scope one: GspF to IPR011850 (SF0 also holds the competence protein ComGB), GspE to IPR054757 (SF27 excludes the Xanthomonas XpsE and Pseudomonas HxcR ATPases of SF2, which the notes name as in scope), GspD to IPR013356 (SF24 also holds filamentous-phage pIV and excludes the Xanthomonas XpsD of SF25). GspI moved the other way, from the family root to PTHR38779:SF2, which is what its family review scopes the T2SS terms to. GspM now declares both InterPro family entries, IPR007690 and IPR030927: they are siblings with no hierarchy between them and each covers only one of the two exemplars, so a single term would have left an exemplar outside its own family term. Restated the exemplar policy in the precise sense the derived QC uses (every annotation actioned, no PENDING or UNDECIDED row) and recorded which review files are formally COMPLETE and which are DRAFT but fully actioned. Corrected the PilD ancestral-node description, which attributed the endopeptidase IBD to three seeds when PAINT lists only P22610 for it. Added the missing per-exemplar evidence for pulC, xcpS and the P. aeruginosa xcpY and xcpZ, and unified the file: prefixes on gene-review sources.
