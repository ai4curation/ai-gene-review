  summary: Move GspG off the PANTHER subfamily and align the grounding summary
  details: |
    Second review round on PR 6489. PTHR30093:SF44, the GspG subfamily, turns out not to be confined to type II secretion: three of its eleven reviewed members are type IV major pilins (Myxococcus xanthus PilA Q59589, Thermus thermophilus PilA4 Q72JC0 and PilA5 Q72GL2), so the GspG annoton had the same defect the GspF, GspD and GspE moves were made to avoid. GspG now uses the GspG-specific InterPro entry IPR010054 (NCBIfam TIGR01710), which both exemplars carry. Rewrote the family-grounding summary in the notes, which contradicted its own descriptors in four places: SF44 and PTHR39583:SF2 were called confined to type II secretion although the first holds those pilins and the second holds Bacillus ComGD and a Thermus pilin; the GspH exemplars were said to be in no PANTHER family although UniProt puts the P. aeruginosa one in SF44; and GspC was said to carry no InterPro family assignment although the Klebsiella connector carries IPR001639 with NCBIfam TIGR01713. Gave every InterPro term its official InterPro name instead of the short form, and stated for GspE and GspD what the replacement entry does and does not admit: IPR013356 covers the Xanthomonas XpsD, while IPR054757 covers the Pseudomonas HxcR but not the Xanthomonas XpsE, which matches only the broader type II/IV secretion domain IPR001482.
