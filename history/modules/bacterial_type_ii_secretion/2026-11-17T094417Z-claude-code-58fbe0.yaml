  summary: Attribute the GspJ SF2 placement per exemplar and per source
  details: |
    Seventh review round on PR 6489. The GspJ descriptor said that both exemplars are in PTHR39583:SF2 by PANTHER's own classification. That holds for the P. aeruginosa exemplar Q00517, which appears in the release classification file for Pseudomonas and in PTHR39583-entries.csv, but not for the P. putida KT2440 exemplar Q88P01: KT2440 is not a PANTHER reference genome, no per-organism classification file holds a row for it, and its SF2 assignment comes from UniProt's cross-reference, added in the November 2026 release that the cached record now carries. The descriptor now states which source places which exemplar, matching the per-protein form adopted for the GspH claim in the previous round. The grounding does not move: PANTHER:PTHR39583:SF2 stays the GspJ annoton's term, and the reason for preferring it to a signature is unchanged. The PTHR39583 family review and the xcpW gene review assert no source for the placement and needed no edit; the only other statement of the claim was in the third round's history record, amended in place with a note of the correction. No action, term, scope or quote changed.
