  summary: Correct the GspH PANTHER claim and record the withdrawn GspL match
  details: |
    Fourth review round follow-up on PR 6489, from a check of the three KT2440 records the negative PANTHER claim rests on. PANTHER's own classification places both GspH exemplars in PTHR30093:SF44, not only the P. aeruginosa one, so the grounding summary no longer says that PANTHER places the GspH exemplars in no family of their own; it now says what the classification says and why SF44 is still not used as the term. For GspL and GspM the claim is confirmed: P25060, P25061, Q88P00 and Q88NZ9 are all in the member index's unresolved list, so neither PANTHER nor UniProt holds a family for them. Separately, the current InterPro release has withdrawn the IPR025691 match for the P. putida GspL exemplar, which now matches only the ATPase nucleotide-binding superfamily IPR043129; the entry is kept as the family concept, with the withdrawal recorded in the descriptor so that the next refresh of that record is read as a signature change rather than a grounding error. The three KT2440 records were deliberately not refreshed: refetching xcpU would add the PANTHER lines, which is captured here from PANTHER's own data instead, and refetching xcpY would remove the GspL domain match and break a quote in its review, which is a separate change.
