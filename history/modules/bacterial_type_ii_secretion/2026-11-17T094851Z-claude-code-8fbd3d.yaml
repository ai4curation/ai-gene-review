  summary: Name the GspH members of PTHR39583:SF2 in the grounding summary
  details: |
    Seventh review round on PR 6489, non-blocking consistency clause folded in with the item-29 fix. The family grounding summary enumerated PTHR39583:SF2 as the GspJ clade plus Bacillus ComGD and a Thermus pilin-like protein, omitting the GspH-named members that the same notes field asserts further down and that the GspJ descriptor records. The summary now names them (Klebsiella PulH A0A0H3H546, E. coli GspH P41443, Vibrio EpsH P45774, all three in PTHR39583-entries.csv), separates them from the two members of other systems, and says that they are minor pseudopilins of the same machine and so do not take the subfamily outside type II secretion, while the two non-T2SS members are the reason the family review scopes the T2SS terms to the proteobacterial clade. No grounding, action, term or quote changed.
