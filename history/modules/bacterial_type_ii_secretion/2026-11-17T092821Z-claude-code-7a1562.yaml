  summary: State per source where PANTHER puts the GspH proteins
  details: |
    Sixth review round on PR 6489. The previous round's wording, that PANTHER's own classification places both GspH exemplars in PTHR30093:SF44, overreached for the KT2440 protein and omitted a fact that matters more. Checked against the repo's own files: PANTHER's release classification for P. aeruginosa (.cache/panther/PTHR19.0_pseudomonas) does place Q00515 in PTHR30093:SF44, so that half was not merely a UniProt cross-reference; Q88P03 is not in a PANTHER reference genome, so its SF44 assignment comes from UniProt's cross-reference, added in the November 2026 release; and PTHR39583-entries.csv places the reviewed GspH proteins of the enterobacterial and Vibrio systems in PTHR39583:SF2 (PulH A0A0H3H546, E. coli GspH P41443, Vibrio EpsH P45774), while PTHR30093-entries.csv contains no GspH protein at all. So PANTHER splits the GspH role between two families and neither is GspH-specific, which strengthens rather than weakens the use of IPR049875 with NCBIfam TIGR01708. All five places that state the claim now say what each source says for which protein, the subfamily description says explicitly that no GspH protein is among the eleven reviewed members so that no twelfth member is implied, and the grounding is unchanged.
