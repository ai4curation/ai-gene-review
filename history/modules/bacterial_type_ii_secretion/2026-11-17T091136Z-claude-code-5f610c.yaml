  summary: Reconcile the GspH SF44 attribution in every place it is stated
  details: |
    Fifth review round on PR 6489. The previous round corrected the GspH claim in the grounding summary but left the same assertion stale in the GspH descriptor 490 lines below, which was the load-bearing one because it states the reason for using IPR049875, and in the GspG descriptor's parenthetical. Swept the module, its eight family reviews and the cited gene reviews for every statement of the claim and reconciled all of them: both GspH exemplars are in PTHR30093:SF44 by PANTHER's own classification, UniProt's cross-reference carries the same assignment and added it for the KT2440 protein in the November 2026 release, and the reason for using the GspH-specific signature is that SF44 separates neither the minor pseudopilin from the major one nor type II secretion from type IV pili. The grounding is unchanged: IPR049875 is right under either reading. The notes of genes/PSEAE/xcpU, which say PANTHER places that protein in SF44, needed no change, and no other file in the set states the claim.
