  summary: Add GLC-2/GLC-4 GluCl variant
  details: |
    Extended the nematode glutamate-gated chloride channel module with a GLC-2/GLC-4 enteric-muscle receptor variant grounded in the completed glc-4 review, the existing glc-2 review and PMID:37811674. Kept the GluCl boundary focused on C. elegans channel variants with direct electrophysiology or native genetics, recorded that parasite orthologs still require species-specific resolution, and updated the notes to reflect that GLC-4 is now represented as a likely GLC-2 partner rather than remaining excluded or inheriting an untested ivermectin-sensitivity claim. Validated the ModuleReview with LinkML and the module validator, and checked quotes for both the edited module and the new glc-4 review.
