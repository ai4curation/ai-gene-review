  summary: Create nematode GluCl module
  details: |
    Created a concrete C. elegans first draft of the nematode ivermectin-sensitive glutamate-gated chloride channel module. Grounded the module in the five completed GluCl gene reviews for avr-14, avr-15, glc-1, glc-2 and glc-3, the PTHR18945 Cys-loop receptor family review, and the cached Cully, Dent, Horoszok, Shinkai and Li primary publications. Modeled AVR-15, AVR-14, GLC-1/GLC-2 and GLC-3 as parallel GluCl receptor variants in a REALIZER variant set because ivermectin sensitivity is synthetic across alpha-subunit pathways rather than one conjunctive receptor pathway. Added the primary AIA and DVB evidence for native GLC-3 signaling and carried forward the avr-14 review caveat that UniProtKB:Q8IFY7 is a truncated 239-aa model curated against the full-length AVR-14B channel assays. Recorded the boundary exclusions for GLC-4, monepantel targets, other invertebrate anion Cys-loop channels, innexin modifiers and parasite orthologs that still need species-specific resolution. Validated the new module with LinkML and the module validator, and rendered the module locally as a smoke test without keeping the generated pages artifact in the content PR.
