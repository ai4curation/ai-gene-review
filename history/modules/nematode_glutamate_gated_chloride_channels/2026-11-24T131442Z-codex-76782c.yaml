  summary: Cross-check parasite GluCl subunit reviews
  details: |
    Cross-checked the GluCl module against the landed HAECO P91730/HG4, ONCVO Q25634/GluClX, ONCVO A0A8R1XRX4, ONCVO A0A8R1TV31, BRUMA A0A894KHH9/Bma-GLC-3 and BRUMA A0A894KBQ5/Bma-GLC-4 reviews. Added those reviews as module evidence and updated the boundary notes to document why the subunits remain evidence-only rather than native receptor variants: H. contortus HG4 lacks a resolved native alpha partner, O. volvulus GluClX is partial, O. volvulus A0A8R1XRX4 lacks resolved partners or pharmacology, O. volvulus A0A8R1TV31 lacks exact ligand and selectivity support, Bma-GLC-3 has functional support from a Pun-GLC-2/Bma-GLC-3 cross-species receptor rather than an all-B. malayi heteromer, and Bma-GLC-4 lacks a reconstituted exact glutamate-gated receptor in the tested B. malayi pairs.
