  summary: Add B. malayi AVR-14B/GLC-2 GluCl variant
  details: |
    Extended the nematode glutamate-gated chloride channel module with a B. malayi Bma-AVR-14B/Bma-GLC-2 receptor variant grounded in PMID:34623639 and the completed BRUMA A0A0K0J2Q9 and A0A894KDR7 gene reviews. Kept H. contortus, O. volvulus and other B. malayi GluCl orthologs outside the module until their reviewed records support a concrete parasite receptor composition, and updated the module description and notes to state that the current parasite realization is the functionally reconstituted Bma-AVR-14B/Bma-GLC-2 heteromer.
