  summary: Create chylomicron assembly and ER export module (MTTP, APOB, SAR1B)
  details: |
    New three-part BIOLOGICAL_PROCESS module grounded in GO:0034378 chylomicron assembly. Part 1 is MTTP triglyceride transfer activity (GO:0140344) in the ER lumen. Part 2 is the APOB (apoB-48) lipid carrier scaffold (GO:0005319), consistent with the APOB review's first core function. Part 3 is SAR1B GTPase activity (GO:0003924) at ER exit sites in COPII coat assembly and ER-to-Golgi transport, consistent with the new SAR1B review's core functions. The three parts are linked by PROVIDES_INPUT_FOR and PRECEDES connections. Participants are human gene products, and PANTHER ids are deliberately omitted. MTTP has no gene review yet. The module aligns with the dismech Chylomicron_Retention_Disease and Hypobetalipoproteinemia pathographs. Validated with linkml-validate (ModuleReview) and module_validator; the only warning is that the CL label could not be checked.
