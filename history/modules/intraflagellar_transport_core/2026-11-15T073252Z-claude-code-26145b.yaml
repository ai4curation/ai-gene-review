  summary: Create eukaryote-wide intraflagellar transport core rule module
  details: |
    New rule module for the ORGANELLE_LIFECYCLES cilium umbrella. Required: IFT-B subunits IFT52, IFT46, IFT81, IFT74, IFT70, IFT172, IFT80, IFT57 and IFT38; IFT-A subunits IFT140, IFT144, IFT122 and IFT139; dynein-2 intermediate chain DYNC2I2. Optional: IFT88, IFT56, IFT54, IFT20, the dynein-2 heavy and light intermediate chains and kinesin-2. Each step is selected by a PANTHER subfamily (or the whole family where the subfamily holds only the human protein) whose members, in PANTHER's release-19 classification files, span eleven ciliated lineages and none of seven non-ciliated ones. PAINT nodes are cited where the human representative's QuickGO IBA rows cite them; all but one are placed at Eukaryota. IFT81 and IFT74 are typed from their F IBDs (tubulin binding, beta-tubulin binding); other steps are untyped. The kinesin-2 and dynein-2 heavy chain selectors use PANTHER's file placements, which differ from UniProt's.
