  details: |
    New two-step ligand-first module for CCL19 signaling through CCR7 (GO:0038119): CCL19 (PTHR12015:SF80, Q99731) with chemokine activity, and CCR7 (PTHR10489:SF635, P32248) with C-C motif chemokine 19 receptor activity, grounded on PAINT nodes PTN000245709, PTN002573880 and PTN001628461. It is kept separate from chemokine_signaling because GO has a pair-specific pathway term and the pair shows biased beta-arrestin signaling; shared Gi and effector steps are not duplicated. CCL21 and the atypical receptors are excluded, with reasons in notes. Validated with linkml-validate, module_validator (0 errors, 3 warnings) and quote_check.
