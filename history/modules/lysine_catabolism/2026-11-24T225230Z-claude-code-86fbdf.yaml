  summary: Extend lysine catabolism from crotonyl-CoA to acetyl-CoA (ECHS1, HADH,
    ACAT1 by module_ref)
  details: |
    Added parts 4-6 downstream of GCDH: crotonyl-CoA hydration, (S)-3-hydroxybutanoyl-CoA oxidation and acetoacetyl-CoA thiolysis. Each is a module_ref to the short-chain variant in fatty_acid_beta_oxidation (sc_hydratase_variant ECHS1 P30084, sc_hadh_variant HADH Q16836, sc_thiolase_variant ACAT1 P24752), so the annotons are not duplicated. Evidence: Reactome R-HSA-77314, R-HSA-77312, R-HSA-74181 and the R-HSA-71064 pathway summary (verbatim quotes, all verified), PMID:37198486 for ECHS1 consuming lysine-derived crotonyl-CoA, and the ECHS1/HADH/ACAT1 gene reviews, whose core functions match. Thiolysis is optional because Reactome's pathway ends at acetoacetyl-CoA and acetoacetyl-CoA can enter ketogenesis instead. Added PROVIDES_INPUT_FOR connections gcdh_step -> hydration -> oxidation -> thiolysis; updated the title (to acetyl-CoA), description and notes. Notes record the overlap with lysine_catabolism_saccharopine as an open merge decision, and that the yeast PWY-5177 GO-CAM is not an instance of this module. linkml-validate clean; module_validator passes with the same 11 pre-existing warnings on parts 1-3; 6 quotes verified; renders with all module_refs resolved.
