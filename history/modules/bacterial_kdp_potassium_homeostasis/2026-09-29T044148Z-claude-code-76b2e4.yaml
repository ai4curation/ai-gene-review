  summary: Split KdpE into phosphorelay and transcription annotons per review
  details: |
    Addresses the blocking review finding on PR 3345. The kdpe annoton fused function GO:0000156 (phosphorelay response regulator activity) with process GO:0045893 (positive regulation of DNA-templated transcription), asserting that the phosphorelay activity is what performs the transcriptional regulation. The grounding gene review genes/PSEPK/kdpE/kdpE-ai-review.yaml keeps these as two separate core functions: GO:0000156 with GO:0000160, and GO:0000987 cis-regulatory region sequence-specific DNA binding with GO:0045893. KdpE now carries two annotons matching that split: the phosphorelay one inside the kdp_phosphorelay conforming bundle, and a kdpe_transcriptional_activation sibling part outside it, following the ntr_phosphorelay to sigma54_transcriptional_activation shape used by the new modules in the same PR. Root connections rewired to run phosphorelay to transcription to pump. Cytosol locations added from the gene review. Validated and re-rendered.
