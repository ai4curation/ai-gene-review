  summary: Create CCL19/CCL21-CCR7 chemokine signaling module
  details: |
    New two-step ligand-first module for projects/SPATIAL_CELL_COMMUNICATION.md (decision 1, lymph-node T-cell zone) under the LIGANDS_IN_SIGNALING section 2 decisions. Concept GO:0038118 C-C chemokine receptor CCR7 signaling pathway. Part 1 is a ONE_OR_MORE variant set of CCR7 agonists: CCL19 (PTHR12015:SF80; UniProtKB:Q99731, O70460; GO:0008009 chemokine activity, GO:0038119) and CCL21 (PTHR12015:SF72; UniProtKB:O00585, mouse paralogs P84444/P86792/P86793; GO:0008009, GO:0038120), both anchored at PAINT node PTN000245709. Part 2 is CCR7 (PTHR10489:SF635; UniProtKB:P32248, P47774; GO:0016493 C-C chemokine receptor activity; PTN002573880 and PTN001628461). Ligands use chemokine activity, not GO:0031732 CCR7 chemokine receptor binding. Evidence: PMID:9153236, 9507024, 14592837, 15778365, 10520991, 9927507 (fetched into publications/). GO-CAM check: no production GO-CAM contains CCL19, CCL21 or CCR7 (UniProt, MGI, symbol and GO-id queries of gocams/index.tsv and src yaml files all empty; CXCL8/CXCR2 positive control found in 6246724f00001114), so no gocam_associations. ACKR4 and CCL21 glycosaminoglycan binding are recorded as out of scope in notes.
