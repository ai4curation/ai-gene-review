  summary: Reground the indirect Asn-tRNA route in the tRNA-charging branch
  details: |
    Repointed the indirect_aspartyl_gatabc_route concept from GO:0070981 (L-asparagine biosynthetic process) to GO:0043039 (tRNA aminoacylation). GO release 2026-07-26 obsoleted GO:0070680 (asparaginyl-tRNAAsn biosynthesis via transamidation) with replaced_by GO:0070981, but that redirect leaves the tRNA-charging branch: the route ends at Asn-tRNA(Asn), not free asparagine. In the last pre-obsoletion release carried locally (2026-03-25) GO:0070680 was is_a GO:0043039, the same parent as its untouched twin GO:0070681, so GO:0043039 is the ontology's own generalization within the branch; preferred_term keeps 'via transamidation'. Notes now record this and a heads-up: the GO snapshot served by QuickGO (2026-09-22) already obsoletes GO:0006421 and GO:0006425 (replaced_by GO:0006418) and GO:0070681 (consider GO:0043039, GO:0050567), so the node concepts at the asparaginyl and glutaminyl route choices will need a further refresh when that release reaches the validation cache.
