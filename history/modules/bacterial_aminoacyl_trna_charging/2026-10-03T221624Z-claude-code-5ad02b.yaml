- type: EDIT
  outcome: changed
  summary: Assert precise transamidation terms on both indirect tRNA-charging routes
  details: |
    Records the curation decision made during the merge in 4a38a2a6e, which was not a mechanical conflict resolution and so needs its own record. main (#3105) had restructured this module and deliberately left indirect_aspartyl_gatabc_route with no term id, reasoning that GO:0043039 (tRNA aminoacylation) is already the module root concept and the enclosing node carries the narrower GO:0006421; its note stated the node would need a further refresh when a better term was available. That refresh is applied here. Both indirect routes now assert the precise live terms for their chemistry: GO:0043688 (conversion of aspartyl-tRNA to asparaginyl-tRNA) on the asparaginyl route, replacing the empty slot, and GO:0043685 (conversion of glutamyl-tRNA to glutaminyl-tRNA) on the glutaminyl route, replacing GO:0070681 which the live 2026-09-22 GO snapshot obsoletes. Both were verified non-deprecated in the 2026-07-26 validation cache. They are siblings under GO:0019988 (charged-tRNA amino acid modification), the branch GO maintains for converting an already-charged tRNA into a different aminoacyl-tRNA, alongside the selenocysteine, pyrrolysine and Sep-tRNA:Cys-tRNA routes, so they state the transamidation directly rather than through a generic parent or an empty slot, and they keep the asparaginyl and glutaminyl nodes symmetric. GO's own replaced_by for the obsoleted GO:0070680 (GO:0070981, L-asparagine biosynthetic process) is still rejected for the reason main gave: the indirect route ends at Asn-tRNA(Asn), not free asparagine. The direct-route concepts remain on GO:0006421 and GO:0006425, which that same live snapshot obsoletes (replaced_by GO:0006418) but which are current in the validation cache, so they are left as released pending that snapshot reaching the cache. Prompted by ai4c-reviewer on PR #3130, which correctly noted the edit had no history record.
