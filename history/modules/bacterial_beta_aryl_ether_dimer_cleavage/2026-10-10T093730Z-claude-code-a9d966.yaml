  summary: 'Revise beta-aryl ether module per PR #4410 bot review'
  details: |
    Address bot review on PR #4410. (1) Re-checked the 'no UniProtKB entry' claim for LigN, LigP and the SYK-6 Nu-class glutathione lyase by direct gene/locus-tag and EMBL-protein-id searches of UniProtKB and UniParc (2026-10-10): LigN (SLG_35900, EMBL BAK68265), LigP (SLG_32600, EMBL BAK67935) and SLG_04120/SYK6GSTNu (EMBL BAK65087) each had a UniProtKB accession (C0SUK1, E1CJ68, G2IKM4) that has since been deleted (redundant sequence, or not part of a reference proteome), leaving only a UniParc archive record and no citable UniProtKB entry. Rewrote the grounding-limits note to state this precisely instead of attributing it to a reference-proteome fetch failure; confirmed LigL (C0SUJ9) and LigO (C0SUK3) retain active unreviewed entries. No new members asserted (the deleted accessions are not citable). (2) Added an in-vivo caveat to the LigD (alphaR) role_description: although in vitro LigD and LigO act on different (alphaR) stereoisomers, the ligD mutant is deficient in both (alphaR) isomers (ligD cell extract transformed only 50% of GGE, PMID:19542348), so LigO does not fully substitute, consistent with modeling them together as one variant. (3) Left GO:0004364 caveat unchanged (its stated halide-leaving-group definition is correct per OLS) and the six GST/SDR family descriptors ungrounded (PANTHER family identity for these specific characterized enzymes not established; CLAUDE.md: assert no id when unsure).
