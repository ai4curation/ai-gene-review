  summary: Create bacterial beta-aryl ether (beta-O-4) lignin dimer cleavage module
  details: |
    New ModuleReview for glutathione-dependent cleavage of the beta-O-4 interunit linkage of lignin-derived aromatic dimers, triggered by the review PMID:41705825. Three ordered parts: NAD+-dependent Calpha-dehydrogenase oxidation of GGE to MPHPV, glutathione S-transferase beta-etherase displacement of the aryloxy group giving guaiacol plus GS-HPV, and glutathione lyase release of the achiral monomer HPV plus glutathione disulfide. Each part carries a variant_set (selection ONE_OR_MORE) along the stereochemical axis, because the lignin polymer is racemic at Calpha and Cbeta: LigD/LigO ((alphaR)-selective) versus LigL/LigN ((alphaS)-selective) (PMID:19542348, PMID:26940872); LigE/LigP (beta(R)) versus LigF (beta(S)) (PMID:12618439, PMID:22146726, PMID:24509858); omega-class stereospecific LigG versus Nu-class non-stereospecific NaGSTNu (PMID:23058289, PMID:24509858, PMID:29449375). Scope decision: of the dimer pathways surveyed in the trigger review, only the beta-O-4 route (and secondarily the 5-5/DDVA route) is well grounded in UniProtKB, so a single linkage-defined module was created rather than a multi-pathway one; DDVA, DGPD, DCA and pinoresinol routes are named as out of scope in notes, with DDVA flagged as the natural follow-up. Grounding limits recorded in notes: LigN (SLG_35900), LigP (SLG_32600) and SYK-6 SLG_04120 (SYK6GSTNu) have no UniProtKB entries and are named without being asserted as members, and F199 homologs identified only by homology plus GGE-induced expression are not asserted as members. No Rhea reactions exist for these three steps, and the RHEA:15741 cross-reference on the LigL/LigO UniProt entries is an unrelated automatic-rule reaction, so it is explicitly not cited; chaining was verified against the literature instead. Overlap check against existing modules (hydroxycinnamate_vanillate_catabolism, catechol_ortho_cleavage, beta_ketoadipate_lower_pathway, bacterial_gallate_catabolism, benzoate_upper_pathway): none contains a beta-aryl ether step, and the connection is documented in notes. Ontology gaps noted for GO: no MF terms for Calpha-dehydrogenase, beta-etherase or glutathione lyase activity and no BP term for lignin-dimer catabolism distinct from lignin polymer breakdown; nearest parents used (GO:0016616, GO:0004364, GO:0016846) with GO:0046274 as the process term, following the existing IEA annotation of LigD. Two knowledge gaps: substrate range beyond guaiacyl-guaiacyl model dimers, and why the single-enzyme versus multi-enzyme lyase architectures coexist.
