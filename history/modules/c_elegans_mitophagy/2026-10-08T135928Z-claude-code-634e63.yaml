  summary: 'Create C. elegans module: Mitophagy in Caenorhabditis elegans'
  details: |
    New concrete C. elegans mitophagy module (modules/c_elegans_mitophagy.yaml). Boundary: marking of mitochondria through LGG-1 receptor capture and FIS-1/FIS-2-dependent disposal; autophagosome biogenesis is cross-referenced to MODULE:c_elegans_autophagosome_biogenesis and fission to MODULE:c_elegans_mitochondrial_dynamics. Four root parts: PINK-1/PDR-1 ubiquitin marking (PINK-1 Q09298, PDR-1 Q9XUS3), receptor recognition variant set (DCT-1 Q09969, FNDC-1 Q22252, ALLO-1 Q9U389), LGG-1 capture (Q09490), and FIS-1/FIS-2 late disposal (Q20291, Q6AHP8). MFs follow gene-review core functions. SQST-1 excluded because its review keeps mitophagy as non-core without worm evidence. Grounded in cached PMIDs (24196833, 25896323, 31153831, 31233739, 33416042, 29255173, 16204351, 24625979, 26469957, 24058863, 33734301, plus newly fetched 35916724); 27 supporting_text quotes verified verbatim. Three BIOLOGY knowledge gaps. linkml-validate clean; module_validator passed with one warning (NCBITaxon label not checked, ontology unavailable); rendered.
