  summary: 'Create: NuA4 histone acetyltransferase complex module (S. cerevisiae)'
  details: |
    New CONCRETE PROTEIN_COMPLEX module for yeast NuA4 (GO:0035267) in three parts: piccolo NuA4 HAT module (Esa1, Epl1, Yng2, Eaf6; complex annoton with active units plus Esa1 H4 acetyltransferase, Epl1 acetyltransferase activator and nucleosome binding, Yng2 H3K4me3 reader annotons), the Tra1-Eaf1 hub (Tra1 DNA-binding transcription factor binding, Eaf1 protein complex scaffold, Arp4 H2AS139pho reader, Yaf9 H3K27ac reader; Swc4 and Act1 as units) and the TINTIN trimer (Eaf3 H3K36me3 reader; Eaf5, Eaf7 as units). Annoton functions match the ESA1, EPL1, YNG2, EAF6 and EAF3 core functions (CORE_SUPPORTED or CONTRIBUTES_IN_COMPLEX). Notes record that the inherited part_of chromatin is reasonable for NuA4. One proposed ontology change: GO:0032777 piccolo complex lacks capable_of histone H4 acetyltransferase activity and so is not classified as a HAT complex. Three BIOLOGY knowledge gaps (free versus bound piccolo share of global acetylation; how holo-NuA4 engages nucleosomes; Eaf6 in native piccolo). Validated with linkml-validate, module_validator (0 warnings) and quote_check.
