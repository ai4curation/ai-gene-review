  summary: 'New module: serotonergic signalling via 5-HT3 receptors'
  details: |
    Created modules/serotonergic_5ht3_signaling.yaml for the 5-HT3 gap in PTHR18945, the only ionotropic serotonin receptor class. Five parts: TPH2/DDC synthesis, VMAT2 loading and exocytosis by module_ref, 5-HT3 reception, SERT reuptake. Reception alternatives are the 5-HT3A homopentamer and the 5-HT3A/5-HT3B heteromer, grounded on PTHR18945:SF52 and SF53 and PAINT nodes PTN002707854 and PTN002707863. Per the family review, the receptor claims rest on the structural and electrophysiological literature rather than the over-deep serotonin-gated PAINT gain at PTN004502671. HTR3C/D/E are left out as a knowledge gap. Status DRAFT.
