  summary: New eukaryote-wide ESCRT-III and Vps4 rule module
  details: |
    ESCRT-III selected by subfamily from interpro/panther/PTHR22761 entries: Vps20/CHMP6 (SF5, SF50) and Snf7/CHMP4 (SF10, SF4, SF14, SF77, SF75); Vps2/Vps24 by family PTHR10476, which also holds CHMP1/Did2 and has no local subfamilies; Vps4 by subfamilies SF83, SF72, SF159 of the AAA family PTHR23074 (which also contains katanin, fidgetin, spastin). MFs from human reviews (CHMP4B, CHMP3, CHMP2A membrane bending; CHMP6 protein-containing complex binding; VPS4A/B ATP hydrolysis). ESCRT-0/I/II, Bro1/ALIX and Vta1 not yet modelled.
