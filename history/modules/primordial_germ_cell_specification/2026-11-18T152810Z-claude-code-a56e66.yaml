  summary: Add germ plasm transcriptional silencer and nanos translation activator
    roles (PIE-1, POS-1)
  details: |
    Linked the newly reviewed C. elegans pie-1 (Q94131) and pos-1 (G5EF15) to the preformation variant. Added two species-neutral annotons with family descriptors that name a role, not a homology group, and assert no PANTHER id: (1) germ_plasm_nanos_translation_activator, mRNA 3'-UTR binding (GO:0003730) in positive regulation of translation, representatives POS-1 and PIE-1, connected POSITIVELY_REGULATES to germ_plasm_nanos (PMID:16499902, PMID:18417623, PMID:11316796); (2) germ_plasm_transcriptional_silencer, no MF, in negative regulation of transcription by RNA polymerase II and cell fate determination in the nucleus, representative PIE-1, with Drosophila Pgc named as an unrelated realizer of the same P-TEFb-inhibiting role (PMID:8751441, PMID:18202370, PMID:18200011; PMID:18200011 newly cached). Both annotons follow the pie-1 and pos-1 core functions; the module validator reports core support for both representatives. Extended the preformation variant description and added a notes paragraph on scope (POS-1 repressive targets, P granule cargo, OMA-1/2, MES-1/SRC-1 orientation of P2/P3 divisions in c_elegans_p2_ems_contact_signaling). Schema validation passes; module validator warnings unchanged (2 pre-existing, on BMP4).
