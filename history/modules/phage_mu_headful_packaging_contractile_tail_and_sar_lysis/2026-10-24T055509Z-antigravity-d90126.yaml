  details: |
    Created and validated concrete bacteriophage pathway module MODULE:phage_mu_headful_packaging_contractile_tail_and_sar_lysis (Escherichia Phage Mu Procapsid Maturation, Headful Cointegrate Packaging, Contractile Tail Assembly, and Releasin-SAR-Endolysin-Spanin Lysis) with 0 parts and 0 references.

    A concrete pathway module for Escherichia phage Mu (Muvirus mu, NCBITaxon:2681603) covering the late virion morphogenesis and host-cell lysis program: (1) assembly and maturation of the T=7 icosahedral procapsid from the dodecameric portal protein H (Q9T1W5), dual protease/internal scaffolding protein I/Z (Q01267), minor/assembly capsid proteins F (Q01259) and G (Q01261), and major capsid protein T (Q9T1W1); (2) pac-site-initiated headful DNA packaging directly from host chromosomal cointegrates by the small terminase subunit gp27 (Mup27, Q9T1W7) and large terminase subunit gp28 (Mup28, Q9T1W6), encapsulating ~50-150 bp of left-end and ~0.5-3 kb of right-end host flanking DNA; (3) assembly of the simple myoviral contractile tail from the baseplate hub gp44 (P, P08558), Ca2+-binding puncturing spike gp45 (Mup45, Q9T1V4), baseplate wedge subunits gp46-gp48 (Mup46-Mup48, Q9T1V3/Q9T1V2/Q9T1V1), tape measure protein gp42 (Mup42, Q9T1V6), ribosomal-frameshift tail assembly chaperones gp41/FS-gp41 (Mup41/FS-gp41, P79680/P0DJY4), tail tube protein M (P79679), contractile sheath protein L (P79678), and tail/sheath terminators gp37/gp38 (Mup37/Mup38, Q9T1V8/P79677); and (4) three-step programmed host lysis by the inner-membrane releasin gp25 (Mup25, Q9T1W9), signal-arrest-release (SAR) endolysin Lys (Q9T1X2), and two-component spanin complex gp23/gp23.1 (Mup23/Mup23.1, Q9T1X1/P0DTL7).
