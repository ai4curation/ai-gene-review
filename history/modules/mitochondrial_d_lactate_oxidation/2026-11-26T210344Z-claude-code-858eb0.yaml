  summary: 'Create module: mitochondrial D-lactate oxidation coupled to cytochrome
    c'
  details: |
    New abstract module created with the human LDHD review: D-lactate dehydrogenase (PTHR11748:SF111, GO:0004458) reduces cytochrome c (PTHR11961, GO:0009055), which feeds the existing mitochondrial_complex_iv module by module_ref. This is the downstream D-lactate oxidation module that methylglyoxal_detoxification names as separate. Grounded on PMID:38413804 (direct cytochrome c reduction by human LDHD), the human LDHD, CYCS and yeast CYC1 gene reviews and the PTHR11748 family review. No GO-CAM contains the dehydrogenase, so there are no gocam_associations. Status DRAFT: yeast DLD1 has no gene review yet. Schema and module_validator pass with no warnings.
