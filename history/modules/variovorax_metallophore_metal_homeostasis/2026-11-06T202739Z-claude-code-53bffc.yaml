  details: |
    Expanded MODULE:variovorax_metallophore_metal_homeostasis to incorporate cytosolic exopolyphosphatase Ppx (A0A0H2MBK5, VPARA_10490) alongside Ppk in Part 3 (polyphosphate turnover) and the periplasmic adaptor CzcB (A0A0H2LX82, VPARA_44900), outer-membrane channel CzcC (A0A0H2M0U4, VPARA_44910), and inner-membrane CDF antiporter CzcD (A0A0H2M558, VPARA_15480) alongside CzcA3 in Part 4 (heavy-metal cation efflux), supported by PMID:10559151, PMID:12829273, and PMID:23687963.
