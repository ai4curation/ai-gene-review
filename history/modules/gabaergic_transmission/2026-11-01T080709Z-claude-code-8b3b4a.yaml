  summary: 'New module: GABAergic transmission via GABA-A receptors'
  details: |
    Created modules/gabaergic_transmission.yaml to fill one of the PTHR18945 coverage gaps found while reviewing that family: the anion-selective half of the Cys-loop family had no module. Five parts: GAD synthesis and VGAT loading and exocytosis by module_ref, then GABA-A reception, then GAT-1 reuptake. Reception has three alternatives: the synaptic (alpha1)2(beta2)2gamma2 receptor, extrasynaptic alpha4/alpha6-beta-delta receptors for tonic inhibition, and the retinal rho1 homopentamer. Subunits are grounded on their own PANTHER subfamilies (SF514, SF221, SF498) and on PAINT nodes PTN008360627 and PTN008566841, per the family review. Status DRAFT because no GABA-A subunit, VGAT or GAT-1 has a gene review here.
