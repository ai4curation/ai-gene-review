  summary: Create phage_capsid_packaging_and_tail_assembly module covering procapsid morphogenesis, terminase packaging variants, and tail assembly
  details: |
    Created modules/phage_capsid_packaging_and_tail_assembly.yaml modeling bacteriophage virion morphogenesis (GO:0019068 virion assembly), including icosahedral procapsid assembly from portal vertex, internal scaffold, prohead protease, major capsid coat, and outer decoration proteins (GO:0019069, GO:0046797, GO:0019082), a 4-way VariantSetDescriptor (genome_packaging_strategy) covering headful pac/concatemer packaging (GO:0098006; T4, P22, P1), cohesive-end cos packaging (GO:0098037 / GO:0098036; lambda, P2/P4), unit-length/terminal-protein-guided packaging (GO:0098035; T7, phi29), and replication-coupled or RNA stem-loop encapsidation in tailless phages (phiX174, MS2, Qbeta), plus a 4-way VariantSetDescriptor (tail_morphogenesis_pathway) for contractile myoviral tail assembly (GO:0098003, GO:0098004), flexible siphoviral tail assembly, short podoviral tail assembly, and tailless/filamentous coat assembly. Validated against ModuleReview schema and PANTHER member index.
