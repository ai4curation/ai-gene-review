  summary: 'Create module: SCIMP TLR tyrosine-kinase scaffold'
  details: |
    New five-part signalling module for the SCIMP non-TIR adaptor branch of TLR4 signalling in macrophages: LPS-activated TLR4, SCIMP scaffold (signaling adaptor activity), LYN and SYK tyrosine kinases phosphorylating TLR4, ERK1/2 recruitment and c-FOS activation, and optional CSK negative feedback. Every evidence statement quotes a cached paper (PMID:21930792, 28098138, 28290451, 34496234, 35337798, 37058370). Built after the human/mouse/rat SCIMP gene reviews; links to tlr4_md2_lps_signaling for receptor activation. No GO-CAM includes SCIMP.
