- type: CREATE
  outcome: changed
  summary: Create Viridiplantae plant vacuole fusion rule module
  details: |
    New BIOLOGICAL_PROCESS rule module scoped to Viridiplantae with Arabidopsis representatives, all steps required: Mon1 (PTHR13027:SF7) and Ccz1 (PTHR13056 SF3, SF0) Rab7 GEF; RabG3 GTPases (PTHR47981 SF4, SF2, SF44, SF26; SF36 excluded as it groups RABG3A with RABG1); HOPS subunits Vps41 (PTHR12616:SF1) and Vps39 (PTHR12894:SF27); SNAREs SYP22 (PTHR19957:SF339) and VTI11 (PTHR21230:SF67). Functions only from positive F IBDs; RabG3, Vps41 and Vps39 left untyped. The HOPS core, SYP51, VAMP713 and the AP-3 route are listed as not modelled. The Vps41 step selects PTHR12616:SF1 and SF13 (tomato VPS41 is in SF13); the Vps39 step's note records that SF27 is PANTHER's TGFBRAP1/Vps3 subfamily, whose non-plant members are CORVET subunits that let human and fission yeast pass the step, and that a fungal or animal extension must use SF49.
