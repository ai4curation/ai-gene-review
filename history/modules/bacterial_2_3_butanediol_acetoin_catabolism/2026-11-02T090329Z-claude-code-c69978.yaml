  summary: Adopt family_terms for the split AcoC PANTHER classification
  details: |
    Adopted the family_terms approach from maintainer PR #5076 (branch cmungall/aigr-agy2-pr2-modules) on the two AcoC descriptors. NCBIfam NF011457 remains the single precise grounding in term, and the PANTHER subfamilies the member proteins are actually classified in are now named in family_terms (KT2440/PpG2: PTHR43194:SF2 and PTHR43798:SF33; H16: PTHR43689:SF8), each verified in the PANTHER member index, so the split classification stays machine-readable instead of being dropped. To keep the function-conformance check satisfied, each of those three family reviews now adjudicates GO:0004742 as SUBFAMILY_ONLY, scoped in its reason to the acetoin E2 member of the heterogeneous subfamily rather than the subfamily at large. module_validator still reports 0 warnings and just validate-families still exits 0.
