    Created modules/protein_kinase_c_signaling.yaml from the RGD PKC signaling diagram as the PKC life cycle: HSP90/CDC37 chaperoning, PDPK1 and mTORC2 priming, isoform-class activation (conventional, novel, atypical with the PAR3/PAR6 scaffold) as a variant set, RACK1/PICK1 anchoring and PHLPP1/2 termination. The DAG/Ca2+ step references gpcr_plc_calcium_pkc_signaling. PKC substrates and cross-talk kinases on RGD's list (FSCN1, BTK, LCK, FYN, RASA1) are excluded. Notes record a likely RGD text error (PDPK1 phosphorylating PLC rather than PKC) and the GOA GO:0004698 rows on PRKCZ and PRKCD.
