[pytest]
pythonpath = src .
# Bare `pytest` also runs the aigr-benchmark workspace package tests.
testpaths = tests packages/aigr-benchmark/tests
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS
addopts = -m "not llm and not integration"
# SSSOM's generated model imports this old patch even with modern LinkML.
# Suppress only that upstream deprecation; retain other dependency warnings.
filterwarnings =
    ignore:The LinkML dataclass extension patch is deprecated and will be removed in a future release\.:DeprecationWarning:sssom_schema\.datamodel\.sssom_schema
    # Same upstream patch, reached via kgcl_schema (an oaklib dependency) when
    # ProposedOntologyChange validation parses a KGCL statement.
    ignore:The LinkML dataclass extension patch is deprecated and will be removed in a future release\.:DeprecationWarning:kgcl_schema\.datamodel\.kgcl
markers =
    llm: marks tests as LLM tests
    integration: marks tests as integration tests
    vcr_skip: skip VCR cassette recording (for tests that download large non-API data)
