[pytest]
pythonpath = src .
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS
addopts = -m "not llm and not integration"
# SSSOM's generated model imports this old patch even with modern LinkML.
# Suppress only that upstream deprecation; retain other dependency warnings.
filterwarnings =
    ignore:The LinkML dataclass extension patch is deprecated and will be removed in a future release\.:DeprecationWarning:sssom_schema\.datamodel\.sssom_schema
markers =
    llm: marks tests as LLM tests
    integration: marks tests as integration tests
    vcr_skip: skip VCR cassette recording (for tests that download large non-API data)
