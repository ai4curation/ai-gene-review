[project]
name = "aigr-benchmark"
dynamic = ["version"]
description = "Build, check, export and score time-split, leakage-checked benchmarks of protein function annotations"
readme = "README.md"
authors = [
    { name = "Chris Mungall", email = "cjm@berkeleybop.org" },
]
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["protein", "annotation", "benchmark", "gene ontology", "bioinformatics", "cafa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Keep this list short: consumers install the package to build and score
# benchmarks without ai-gene-review's ~40 dependencies. LinkML is needed only
# to regenerate the bundled JSON Schema and Pydantic model (dev group).
dependencies = [
    "jsonschema>=4.18",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "typer>=0.9",
]

[project.scripts]
aigr-benchmark = "aigr_benchmark.cli:benchmark_app"

[project.urls]
Homepage = "https://github.com/ai4curation/ai-gene-review/tree/main/packages/aigr-benchmark"
Repository = "https://github.com/ai4curation/ai-gene-review"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigr_benchmark"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
# Releases of this package are tagged aigr-benchmark-vX.Y.Z, so they never
# collide with the repository's own vX.Y.Z tags.
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern-prefix = "aigr-benchmark-"
fallback-version = "0.0.0"

[dependency-groups]
dev = [
    "linkml>=1.9.3",
    "mypy>=1.17.1",
    "pytest>=8.4",
    "ruff>=0.4.8",
    "types-jsonschema>=4.18",
    "types-pyyaml>=6.0",
    "types-requests>=2.32",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
