id: https://w3id.org/ai4curation/ai-gene-review/guideline
name: guideline
title: GO annotation guideline records
description: >-
  Metadata for decision-record style GO annotation guidelines
  (projects/GO_GUIDELINES/guidelines/<TOPIC>/<ID>.md). Each guideline is one
  Markdown file whose YAML frontmatter is a Guideline; each topic folder has a
  README.md whose frontmatter is a Chapter. Prose stays in the Markdown body;
  everything a browser should filter or cross-reference lives here.
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  guideline: https://w3id.org/ai4curation/ai-gene-review/guideline/
default_prefix: guideline
default_range: string
imports:
  - linkml:types

classes:
  Guideline:
    description: One normative annotation guideline, in the manner of an architecture decision record.
    slots:
      - id
      - title
      - status
      - topic
      - provenance
      - provenance_note
      - aspects
      - evidence_codes
      - go_terms
      - related
      - supersedes
      - superseded_by
      - enforced_by
      - differences
      - open_questions
      - sources
      - date
      - reviews
    slot_usage:
      id:
        pattern: "^[A-Z]+-[0-9]+$"
      provenance:
        required: true
      status:
        required: true

  Chapter:
    description: A topic folder (one README.md) grouping guidelines that share an id prefix.
    slots:
      - id
      - title
      - status
      - aspects
      - differences
      - open_questions
      - date
    slot_usage:
      id:
        pattern: "^[A-Z]+$"
      differences:
        description: Differences that no single guideline owns (chapter-wide departures).
      open_questions:
        description: Open questions that no single guideline owns.

  TermRef:
    description: A GO term. A live term carries its current label; an obsolete one is flagged instead.
    slots:
      - term_id
      - label
      - obsolete

  SourceRef:
    description: A cited source. Exactly one of url (external) or path (repository file) is given.
    slots:
      - kind
      - title
      - url
      - path

  Difference:
    description: One departure from, sharpening of, or resolved contradiction in prior guidance.
    slots:
      - prior_source
      - prior_said
      - we_recommend
      - why
      - issue

  Review:
    description: A curator's sign-off, with the same shape as project-page manual_reviews.
    slots:
      - reviewed_by
      - review_date
      - review_status
      - notes

slots:
  id:
    identifier: true
    required: true
  title:
    required: true
  status:
    range: GuidelineStatusEnum
  topic:
    description: The chapter id (the id prefix, e.g. MF).
    required: true
    pattern: "^[A-Z]+$"
  provenance:
    range: ProvenanceEnum
    description: How far the guideline departs from GOC guidance; for a mixed guideline, the most departing part.
  provenance_note:
    description: Free-text provenance statement (which parts are GOC, which are new), Markdown.
  aspects:
    range: AspectEnum
    multivalued: true
  evidence_codes:
    description: GO evidence codes the guideline discusses.
    multivalued: true
    pattern: "^[A-Z]{2,4}$"
  go_terms:
    description: GO terms the guideline names, with labels checked against the ontology.
    range: TermRef
    multivalued: true
    inlined_as_list: true
  related:
    description: Other guideline ids this one refers to.
    multivalued: true
    pattern: "^[A-Z]+-[0-9]+$"
  supersedes:
    multivalued: true
    pattern: "^[A-Z]+-[0-9]+$"
  superseded_by:
    pattern: "^[A-Z]+-[0-9]+$"
  enforced_by:
    description: Repository paths of validators or rules that implement the guideline.
    multivalued: true
  differences:
    range: Difference
    multivalued: true
    inlined_as_list: true
  open_questions:
    description: Questions the guideline could not settle, for the GOC to decide (Markdown).
    multivalued: true
  sources:
    range: SourceRef
    multivalued: true
    inlined_as_list: true
  date:
    description: Date of the current text (YYYY-MM-DD).
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  reviews:
    range: Review
    multivalued: true
    inlined_as_list: true
  term_id:
    required: true
    pattern: "^GO:\\d{7}$"
  label:
    description: Current ontology label; omitted for an obsolete term that has none.
  obsolete:
    range: boolean
    description: True when the guideline names the term although it is obsolete (usually to say what not to use).
  kind:
    range: SourceKindEnum
    required: true
  url:
    pattern: "^https?://"
  path:
    description: Repository-relative path.
  prior_source:
    description: The prior source, as Markdown (may hold links).
    required: true
  prior_said:
    required: true
  we_recommend:
    required: true
  why:
    required: true
  issue:
    description: Number of an ai-gene-review issue tracking the difference.
    range: integer
  reviewed_by:
    required: true
  review_date:
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  review_status:
    range: ReviewStatusEnum
  notes: {}

enums:
  GuidelineStatusEnum:
    permissible_values:
      proposed:
        description: Drafted, not yet accepted by curators.
      accepted:
        description: Accepted; reviews should follow it.
      superseded:
        description: Replaced by another guideline (see superseded_by).
      deprecated:
        description: Withdrawn without a replacement.
      rejected:
        description: Considered and not adopted; kept for the record.
  ProvenanceEnum:
    permissible_values:
      GOC:
        description: Restates documented, current GO Consortium guidance ([GOC]).
      GOC_PLUS:
        description: Clarifies, sharpens or extends GOC guidance ([GOC+]).
      NEW:
        description: Our synthesis, absent from or departing from GOC guidance ([NEW]).
  AspectEnum:
    permissible_values:
      F: {description: molecular function}
      P: {description: biological process}
      C: {description: cellular component}
  SourceKindEnum:
    permissible_values:
      wiki: {description: GO wiki page}
      drive: {description: GO Consortium Google Drive document}
      issue: {description: GitHub issue}
      paper: {description: Publication}
      repo: {description: File in this repository}
      web: {description: Other web page}
  ReviewStatusEnum:
    permissible_values:
      READY: {}
      CHANGES_REQUESTED: {}
