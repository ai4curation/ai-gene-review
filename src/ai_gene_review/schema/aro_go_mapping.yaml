id: https://ai4curation.io/ai-gene-review/schema/aro_go_mapping
name: aro_go_mapping
title: ARO to GO Mapping Schema (term-validatable)
description: >-
  Sidecar LinkML schema for the curated ARO->GO mapping set whose canonical SSSOM source is
  projects/ANTIMICROBIAL_RESISTANCE/aro2go.sssom.yaml. Subject (ARO) and object (GO) are modeled as id/label
  tuples with bindings so that linkml-term-validator can check, for every mapping, that the CURIE
  resolves in the ontology AND that the supplied label matches the ontology label (the "curie+label
  tuple" guarantee). The nested data file (projects/ANTIMICROBIAL_RESISTANCE/aro2go.terms.yaml) is generated from the
  SSSOM file by projects/ANTIMICROBIAL_RESISTANCE/sssom_to_terms.py.

prefixes:
  linkml: https://w3id.org/linkml/
  arogo: https://ai4curation.io/ai-gene-review/aro_go_mapping/
  ARO: http://purl.obolibrary.org/obo/ARO_
  GO: http://purl.obolibrary.org/obo/GO_
  RO: http://purl.obolibrary.org/obo/RO_
  skos: http://www.w3.org/2004/02/skos/core#
  semapv: https://w3id.org/semapv/vocab/
  rdfs: http://www.w3.org/2000/01/rdf-schema#

imports:
  - linkml:types

default_prefix: arogo
default_range: string

slots:
  id:
    identifier: true
    description: CURIE of the term.
  label:
    slot_uri: rdfs:label
    description: Human-readable label for the term (validated against the ontology where bound).
  subject:
    range: AROTerm
    inlined: true
    required: true
    description: ARO source term as an id/label tuple.
    bindings:
      - binds_value_of: id
        range: AROTermEnum
        obligation_level: REQUIRED
  predicate:
    range: PredicateTerm
    inlined: true
    required: true
    description: Mapping predicate (id/label tuple; RO/SKOS, not ontology-label-validated).
  object:
    range: GOTerm
    inlined: true
    required: true
    description: GO target term as an id/label tuple.
    bindings:
      - binds_value_of: id
        range: GOTermEnum
        obligation_level: REQUIRED
  mapping_justification:
    range: string
    required: true
    description: SSSOM mapping justification (e.g. semapv:ManualMappingCuration).
  comment:
    range: string
    description: Free-text note on the mapping.
  mappings:
    range: AROGOMapping
    multivalued: true
    inlined_as_list: true
    description: The curated ARO->GO mappings.

classes:
  AROTerm:
    description: An ARO term represented as an id/label pair.
    slots:
      - id
      - label
    slot_usage:
      label:
        required: true

  GOTerm:
    description: A GO term represented as an id/label pair.
    slots:
      - id
      - label
    slot_usage:
      label:
        required: true

  PredicateTerm:
    description: A mapping predicate represented as an id/label pair (SKOS or RO).
    slots:
      - id
      - label

  AROGOMapping:
    description: One curated mapping from an ARO term to a GO term.
    slots:
      - subject
      - predicate
      - object
      - mapping_justification
      - comment

  AROFamilyTriageEntry:
    description: >-
      One CARD AMR gene family that is deliberately not mapped to GO, with the reason
      (projects/ANTIMICROBIAL_RESISTANCE/aro_family_triage.yaml).
    attributes:
      id:
        identifier: true
        required: true
        pattern: "^ARO:\\d+$"
        description: ARO accession of the family.
      label:
        required: true
        description: ARO label in the pinned release (or CARD's category name when the id is absent from aro.obo).
      reason:
        range: FamilyTriageReasonEnum
        required: true
      basis:
        range: TriageBasisEnum
        required: true
      explanation:
        required: true
        description: Why the family is not mapped.

  AROFamilyTriage:
    tree_root: true
    description: The triage of CARD AMR gene families that aro2go.sssom.yaml does not map.
    attributes:
      id:
        identifier: true
        required: true
      description:
        required: true
      aro_release:
        required: true
        description: CARD/ARO release the triage was made against.
      triage_date:
        required: true
      families:
        range: AROFamilyTriageEntry
        multivalued: true
        inlined_as_list: true
        required: true

  AROGOMappingSet:
    description: The set of curated ARO->GO mappings (nested term-tuple form).
    slots:
      - mappings

enums:
  FamilyTriageReasonEnum:
    description: Why a CARD AMR gene family is not mapped to GO.
    permissible_values:
      CHROMOSOMAL_VARIANT:
        description: >-
          Defined by resistance mutations or altered expression of a chromosomal gene; the GO
          function is the wild-type gene's own and belongs on that gene's annotation.
      RRNA_VARIANT:
        description: rRNA gene with resistance mutations; no molecular function to map.
      REGULATOR:
        description: Regulator whose link to resistance is regulatory; regulatory activities differ between members.
      HETEROGENEOUS:
        description: Members have different activities, or the node mixes complexes, operons and single proteins.
      NO_INFORMATIVE_MF:
        description: Protection or sequestration by binding; GO offers only binding terms.
      UNKNOWN_FUNCTION:
        description: The biochemical activity is not established.
      GENE_CLUSTER:
        description: The term denotes a gene cluster or operon, not a gene product.
      NOT_IN_ONTOLOGY_RELEASE:
        description: Listed in CARD's AMR Gene Family category but absent from the aro.obo of the same release.
      DEFERRED:
        description: A mapping may exist but has not been checked yet.
  TriageBasisEnum:
    permissible_values:
      RULE:
        description: Assigned by the name/mechanism rule of the triage pass, then spot-checked.
      MANUAL:
        description: Assigned individually.

  AROTermEnum:
    description: >-
      A term in the Antibiotic Resistance Ontology (CARD), reachable from the ARO root
      'process or component of antibiotic biology or chemistry' (ARO:1000001).
    reachable_from:
      source_nodes:
        - ARO:1000001
      is_direct: false
      include_self: true
      relationship_types:
        - rdfs:subClassOf

  GOTermEnum:
    description: A term in the Gene Ontology (any of the three top-level branches).
    reachable_from:
      source_nodes:
        - GO:0003674
        - GO:0008150
        - GO:0005575
      is_direct: false
      include_self: true
      relationship_types:
        - rdfs:subClassOf
