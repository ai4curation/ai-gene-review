# Shared linkml-data-qc/dismech weight and threshold conventions.
# Thresholds are advisory unless the CLI is run with --fail-on-threshold.
default_weight: 1.0
default_min_compliance: null

# Replace unconditional annotation-support population with contextual metrics.
# Other uses of supported_by (e.g. core functions) keep their schema checks.
excluded_paths:
  - existing_annotations[].review.supported_by
  - existing_annotations[].review.supported_by[].**

paths:
  existing_annotations[].review.literature_support:
    weight: 2.0
    min_compliance: null
  existing_annotations[].review.inference_support:
    weight: 2.0
    min_compliance: null

annotation_rules:
  literature_support:
    evidence_types: [EXP, IDA, IPI, IMP, IGI, IEP, HTP, HDA, HMP, HGI, HEP, TAS]
    actions: [ACCEPT, MODIFY, REMOVE, KEEP_AS_NON_CORE, MARK_AS_OVER_ANNOTATED, NEW]
    support: literature_quote
  inference_support:
    evidence_types: [IEA, IBA, IBD, IKR, IRD, ISS, ISO, ISA, ISM, IGC, RCA]
    actions: [MODIFY, REMOVE, MARK_AS_OVER_ANNOTATED, NEW]
    support: sourced_rationale
