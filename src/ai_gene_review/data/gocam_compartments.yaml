# Spatial compartment model for GO-CAM location QC.
#
# Used by ai_gene_review.gocam_compartments to check that the `occurs_in`
# locations of GO-CAM activities can be placed in a cell, and that causally
# connected activities sit in the same or adjacent compartments.
#
# compartments: a pairwise-disjoint set of spatial regions. Together they are
#   intended to cover a cell (eukaryote, Gram-negative bacterium, plant) and its
#   surroundings. Each compartment has one or more GO `anchors`. A cellular
#   component term resolves to a compartment when the anchor is the term itself
#   or one of its is_a / part_of ancestors. Where several anchors match, the most
#   specific wins (an anchor that is an ancestor of another matching anchor is
#   dropped), so lysosomal lumen resolves to LYSOSOME_LUMEN, not VACUOLE_LUMEN.
#   `kind` is membrane (a bilayer or envelope) or space (an aqueous or bulk
#   region). Two membranes that border the same space are BRIDGED rather than
#   NONADJACENT: their proteins can meet across it at a contact site or when a
#   vesicle docks, so such edges are reported separately and at lower priority.
#
# unions: GO terms that span several compartments (cytoplasm = cytosol plus the
#   organelles in it). A term that reaches one of these, but no compartment
#   anchor, is COARSE: it narrows the location to the listed compartments without
#   choosing one.
#
# adjacency: undirected pairs of compartments that share a boundary, so that an
#   activity in one can act directly on a molecule in the other (a membrane and
#   the aqueous space on either side of it). Two lumens are never adjacent to
#   each other, and the cytosol is not adjacent to the nucleoplasm: material
#   crosses the nuclear envelope only by transport through the pore.
#
# context_hints: terms that GO does not place in any compartment (chromatin,
#   cytoskeleton) but whose usual location is obvious to a biologist. These are
#   reported as hints next to an UNRESOLVED finding. They are never used to
#   resolve the term, because the point of the check is that the model does not
#   say where the activity is. A hint applies to the term and its descendants;
#   the most specific matching hint wins. Cell-type terms (CL:) used as
#   occurs_in get a fixed hint in code.

