  - [MITOCHONDRIAL_INNER_MEMBRANE, MITOCHONDRIAL_MATRIX]
  - [CYTOSOL, ER_MEMBRANE]
  - [ER_MEMBRANE, ER_LUMEN]
  # the outer nuclear membrane is continuous with the ER membrane, and the
  # perinuclear space with the ER lumen
  - [NUCLEAR_ENVELOPE, ER_MEMBRANE]
  - [NUCLEAR_ENVELOPE, ER_LUMEN]
  - [CYTOSOL, GOLGI_MEMBRANE]
  - [GOLGI_MEMBRANE, GOLGI_LUMEN]
  - [CYTOSOL, ENDOSOME_MEMBRANE]
  - [ENDOSOME_MEMBRANE, ENDOSOME_LUMEN]
  - [CYTOSOL, LYSOSOME_MEMBRANE]
  - [LYSOSOME_MEMBRANE, LYSOSOME_LUMEN]
  - [CYTOSOL, VACUOLE_MEMBRANE]
  - [VACUOLE_MEMBRANE, VACUOLE_LUMEN]
  - [CYTOSOL, PEROXISOME_MEMBRANE]
  - [PEROXISOME_MEMBRANE, PEROXISOME_MATRIX]
  - [CYTOSOL, VESICLE_MEMBRANE]
  - [VESICLE_MEMBRANE, VESICLE_LUMEN]
  - [CYTOSOL, CHLOROPLAST_ENVELOPE]
  - [CHLOROPLAST_ENVELOPE, CHLOROPLAST_STROMA]
  - [CHLOROPLAST_STROMA, THYLAKOID_MEMBRANE]
  - [THYLAKOID_MEMBRANE, THYLAKOID_LUMEN]
  # Gram-negative envelope
  - [PLASMA_MEMBRANE, PERIPLASM]
  - [PERIPLASM, CELL_OUTER_MEMBRANE]
  - [CELL_OUTER_MEMBRANE, EXTRACELLULAR]
  # lipid droplets bud from the ER membrane and face the cytosol
  - [CYTOSOL, LIPID_DROPLET]
  - [ER_MEMBRANE, LIPID_DROPLET]

context_hints:
  GO:0000785:
    label: chromatin
    usual: NUCLEAR_LUMEN
    better_term: {id: GO:0000228, label: nuclear chromosome}
    note: GO places chromatin under chromosome, which is not part of the nucleus because prokaryotic chromosomes exist.
  GO:0005694:
    label: chromosome
    usual: NUCLEAR_LUMEN
    better_term: {id: GO:0000228, label: nuclear chromosome}
  GO:0005856:
    label: cytoskeleton
    usual: CYTOSOL
  GO:0005874:
    label: microtubule
    usual: CYTOSOL
  GO:0015629:
    label: actin cytoskeleton
    usual: CYTOSOL
  GO:0005813:
    label: centrosome
    usual: CYTOSOL
  GO:0032991:
    label: protein-containing complex
    note: a complex term says nothing about where the complex is.
  GO:0005816:
    label: spindle pole body
    usual: NUCLEAR_ENVELOPE
    note: the fungal spindle pole body is embedded in the nuclear envelope.
  GO:0098857:
    label: membrane microdomain
    usual: PLASMA_MEMBRANE
  GO:0044232:
    label: organelle membrane contact site
    note: a contact site joins two membranes across the cytosol; name the membrane the activity is in.
  GO:0030054:
    label: cell junction
    note: a junction spans plasma membrane, cytosol and extracellular region; name the side the activity is on.
  GO:0032153:
    label: cell division site
    note: a region of the cell periphery, not a compartment.
  GO:0044217:
    label: other organism part
    note: a location in another organism (host or symbiont); the compartment model covers one cell, so edges into it cross organisms.
  GO:0005575:
    label: cellular_component
    note: the root term carries no location.
