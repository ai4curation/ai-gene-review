adjacency:
  - [EXTRACELLULAR, PLASMA_MEMBRANE]
  - [PLASMA_MEMBRANE, CYTOSOL]
  - [CYTOSOL, NUCLEAR_ENVELOPE]
  - [NUCLEAR_ENVELOPE, NUCLEAR_LUMEN]
  - [CYTOSOL, MITOCHONDRIAL_OUTER_MEMBRANE]
  - [MITOCHONDRIAL_OUTER_MEMBRANE, MITOCHONDRIAL_INTERMEMBRANE_SPACE]
